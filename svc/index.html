<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#000000" />
<meta name="description" content="Structure. Volume. Consistency. Backtest volume, every day." />
<title>SVC</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
/* SVC is its own app. It loads nothing from the rest of this repo — no
   shell, no shared fonts, no tokens — so it can be lifted out whole.
   Black, white and greys, and nothing drawn that does not say something. */
:root {
  --bg: #000;
  --card: #0a0a0a;
  --edge: #1c1c1c;
  --track: #1a1a1a;
  --ink: #fff;
  --dim: #a3a3a3;
  --quiet: #8a8a8a;
  --mute: #555;
  --gap: 20px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  font-size: 14px; line-height: 1.35; -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 40px 48px 64px; }

/* ── head ── */
.hd { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 36px; }
.mark { font-size: 46px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
.mark span { white-space: nowrap; }
/* The head builds itself: every letter comes up out of a blur in turn,
   flashes as it lands, and then a soft light keeps travelling through
   the three words so the page is never quite still. */
.mark i { display: inline-block; font-style: normal; opacity: 0;
  animation: sv-build .7s cubic-bezier(.2, .7, .2, 1) calc(var(--n) * 45ms) forwards,
             sv-glow 7s ease-in-out calc(1.9s + var(--n) * 60ms) infinite; }
@keyframes sv-build {
  0% { opacity: 0; transform: translateY(.35em) scale(.9); filter: blur(10px); }
  60% { opacity: 1; text-shadow: 0 0 22px rgba(255,255,255,.9), 0 0 48px rgba(255,255,255,.45); filter: blur(0); }
  100% { opacity: 1; transform: none; filter: none; text-shadow: 0 0 0 rgba(255,255,255,0); }
}
@keyframes sv-glow {
  0%, 18%, 100% { text-shadow: 0 0 0 rgba(255,255,255,0); }
  9% { text-shadow: 0 0 14px rgba(255,255,255,.75), 0 0 36px rgba(255,255,255,.3); }
}
.hd-r { display: flex; align-items: center; gap: 14px; color: var(--dim); }
.hd-date { font-size: 13px; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--dim); }
.icon-btn:hover { background: var(--card); color: var(--ink); }
.icon-btn svg { width: 20px; height: 20px; }

/* ── cards come up one after another: opacity only, so nothing moves ── */
.card { animation: sv-in .7s ease both; }
.timer-card { animation-delay: .05s; } .today { animation-delay: .13s; }
.stats .card:nth-child(1) { animation-delay: .21s; } .stats .card:nth-child(2) { animation-delay: .26s; }
.stats .card:nth-child(3) { animation-delay: .31s; } .stats .card:nth-child(4) { animation-delay: .36s; }
.pace-c { animation-delay: .43s; } .yr-c { animation-delay: .5s; } .log { animation-delay: .57s; }
@keyframes sv-in { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .card, .mark i { animation: none; opacity: 1; } }

/* ── grid ── */
.grid { display: grid; grid-template-columns: 420px 1fr; gap: var(--gap); align-items: stretch; }
.card { background: var(--card); border: 1px solid var(--edge); border-radius: 22px; padding: 26px 28px; }
.lbl { font-size: 11px; color: var(--quiet); text-transform: uppercase; letter-spacing: .12em; }

/* ── the ring ── */
.timer-card { display: flex; flex-direction: column; align-items: center; gap: 20px; }
.ring { position: relative; width: 280px; height: 280px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
/* the halo reaches past the drawing: an svg clips what it holds to its
   own box, which drew the glow as a square. Let it out. */
.ring svg { overflow: visible; }
.ring circle { fill: none; stroke-width: 14; }
.ring .tr { stroke: var(--track); }
.ring .fl { stroke: var(--ink); stroke-linecap: round; transition: stroke-dashoffset .5s ease, filter .6s ease, opacity .3s; }
.ring.is-run .fl { animation: sv-breathe 3.2s ease-in-out infinite; }
.ring.is-hit .fl { filter: drop-shadow(0 0 7px rgba(255,255,255,.7)) drop-shadow(0 0 22px rgba(255,255,255,.35)); }
.ring.is-paused .fl { opacity: .45; }
.ring.is-paused .ring-big { color: var(--dim); }
@keyframes sv-breathe { 0%, 100% { filter: drop-shadow(0 0 0 rgba(255,255,255,0)); } 50% { filter: drop-shadow(0 0 9px rgba(255,255,255,.55)); } }
@media (prefers-reduced-motion: reduce) { .ring.is-run .fl { animation: none; } }
.ring-mid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.ring-big { font-size: 64px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
.ring-big.is-clock { font-size: 48px; }
.ring-sub { margin-top: 8px; color: var(--dim); font-size: 13px; }

/* ── the day's counter: where it started, where it sits now ── */
.cnt { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
.cnt span { display: block; font-size: 12px; color: var(--quiet); margin-bottom: 6px; }
.cnt .in { height: 52px; font-size: 22px; font-weight: 700; text-align: center; }
input[type=number] { -moz-appearance: textfield; appearance: textfield; }
input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

/* start, and once running pause and end beside each other */
.gobar { display: grid; grid-template-columns: 1fr; gap: 10px; width: 100%; }
.gobar.is-two { grid-template-columns: 1fr 1fr; }
.go { height: 58px; border-radius: 16px; background: var(--ink); color: #000; font-size: 16px; font-weight: 800; letter-spacing: .02em; }
.go:hover { background: #e6e6e6; }
.go.is-on { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
.go.is-on:hover { background: #111; }
.go.soft { background: #1a1a1a; color: var(--ink); }
.go.soft:hover { background: #262626; }
.hint-k { font-size: 12px; color: var(--quiet); }

/* ── today ── */
.today { display: flex; flex-direction: column; }
.today-h { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
.row { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 6px 16px; padding: 16px 0; border-top: 1px solid var(--edge); }
.row:first-of-type { border-top: 0; }
.row-n { font-size: 15px; font-weight: 600; }
.row-n small { font-weight: 400; color: var(--quiet); font-size: 12px; margin-left: 8px; }
.row-v { font-size: 15px; font-weight: 600; }
.row-v small { font-weight: 400; color: var(--quiet); }
.bar { grid-column: 1 / -1; height: 4px; border-radius: 4px; background: var(--track); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ink); border-radius: 4px; }
.row-x { grid-column: 1 / -1; color: var(--dim); font-size: 12px; }
.pace { margin-top: auto; padding-top: 18px; border-top: 1px solid var(--edge); display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.fig b { display: block; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; margin-top: 6px; }
.fig span { color: var(--quiet); font-size: 12px; }

/* ── week, target, month, streak ── */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); margin-top: var(--gap); align-items: stretch; }
.stat { display: flex; flex-direction: column; gap: 10px; }
.stat-h { display: flex; justify-content: space-between; align-items: center; margin: -8px -10px -6px 0; }
.stat-v { font-size: 32px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
.stat-v small { font-size: 14px; font-weight: 400; color: var(--quiet); letter-spacing: 0; }
.stat .bar { margin-top: auto; }
.stat-x { color: var(--dim); font-size: 12px; }
/* a card that opens something is a button wearing the card's clothes */
.stat-b { position: relative; text-align: left; width: 100%; font: inherit; color: inherit; cursor: pointer; transition: background .2s, border-color .2s; }
.stat-b:hover { background: #0e0e0e; border-color: #2a2a2a; }
.stat-b:focus-visible { outline: 2px solid var(--dim); outline-offset: 2px; }
.chev { position: absolute; top: 22px; right: 26px; color: var(--quiet); font-size: 18px; line-height: 1; }
.stat-b:hover .chev { color: var(--ink); }
.ex { margin-top: 18px; }
.ex-r { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 14px 0; border-top: 1px solid var(--edge); }
.ex-r span { color: var(--dim); }
.ex-r b { font-size: 18px; font-weight: 700; }
.ex-r small { font-weight: 400; color: var(--quiet); font-size: 12px; margin-left: 8px; }
.dots { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: auto; }
.dots .dw { font-size: 10px; color: var(--quiet); text-align: center; }
.dot { height: 16px; border-radius: 5px; background: var(--track); }
.dot.is-part { background: #4a4a4a; }
.dot.is-hit { background: var(--ink); }
.dot.is-ahead { background: transparent; box-shadow: inset 0 0 0 1px var(--track); }
.dot.is-now { outline: 1px solid var(--dim); outline-offset: 2px; }

/* ── pace ── */
.pace-c { margin-top: var(--gap); }
.pace-h { display: flex; justify-content: space-between; align-items: baseline; gap: 20px; margin-bottom: 18px; }
.pace-f { display: flex; gap: 32px; }
.pace-f div span { display: block; font-size: 12px; color: var(--quiet); }
.pace-f div b { font-size: 20px; font-weight: 700; }
.pc { display: grid; grid-template-columns: repeat(30, 1fr); gap: 6px; height: 120px; align-items: end; position: relative; }
.pc i { display: block; border-radius: 4px 4px 1px 1px; background: #3a3a3a; min-height: 3px; }
.pc i.is-best { background: var(--ink); }
.pc i.is-none { background: transparent; box-shadow: inset 0 -2px 0 var(--track); }
.pc i.is-now { outline: 1px solid var(--dim); outline-offset: 2px; }
.pc-avg { position: absolute; left: 0; right: 0; border-top: 1px dashed #555; pointer-events: none; }
.pc-x { display: flex; justify-content: space-between; color: var(--quiet); font-size: 11px; margin-top: 8px; }

/* ── the year ── */
.yr-c { margin-top: var(--gap); }
.yr-h { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; gap: 20px; }
.yr-m { display: grid; grid-template-columns: repeat(53, 1fr); gap: 3px; font-size: 11px; color: var(--quiet); height: 16px; }
.yr-m span { white-space: nowrap; overflow: visible; }
.yr { display: grid; grid-template-columns: repeat(53, 1fr); grid-template-rows: repeat(7, auto); grid-auto-flow: column; gap: 3px; }
.yr i { aspect-ratio: 1; border-radius: 3px; background: #141414; }
.yr i.l1 { background: #3a3a3a; }
.yr i.l2 { background: #7d7d7d; }
.yr i.l3 { background: var(--ink); }
.yr i.l4 { background: var(--ink); box-shadow: 0 0 8px rgba(255,255,255,.85); }
.yr i.is-ahead { background: transparent; box-shadow: inset 0 0 0 1px #1a1a1a; }
.yr i.is-now { outline: 1px solid var(--dim); outline-offset: 1px; }

/* ── log ── */
.log { margin-top: var(--gap); }
.log-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.link { color: var(--dim); font-size: 13px; padding: 8px 10px; border-radius: 10px; }
.link:hover { color: var(--ink); background: #111; }
.day-h { display: flex; justify-content: space-between; align-items: center; color: var(--quiet); font-size: 12px; padding: 14px 0 6px; border-bottom: 1px solid var(--edge); }
.day-h .link { font-size: 12px; padding: 4px 8px; margin: -4px -8px; color: var(--quiet); }
table { width: 100%; border-collapse: collapse; }
td { padding: 12px 0; border-bottom: 1px solid #141414; font-size: 14px; }
td.t { width: 140px; color: var(--dim); }
td.k { font-weight: 600; }
td.k small { font-weight: 400; color: var(--quiet); font-size: 12px; margin-left: 8px; }
td.d { width: 120px; text-align: right; }
td.x { width: 56px; text-align: right; }
.del { width: 32px; height: 32px; border-radius: 8px; color: var(--mute); }
.del:hover { color: var(--ink); background: #161616; }
.empty { color: var(--quiet); padding: 28px 0 8px; }

/* ── dialog ── */
.veil { position: fixed; inset: 0; background: rgba(0,0,0,.72); display: grid; place-items: center; z-index: 50; }
.dlg { width: 420px; background: #0d0d0d; border: 1px solid #222; border-radius: 22px; padding: 28px; }
.dlg h2 { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
.dlg p { color: var(--dim); margin-top: 6px; }
.fld { display: block; margin-top: 18px; }
.fld span { display: block; font-size: 12px; color: var(--quiet); margin-bottom: 6px; }
.in { width: 100%; height: 46px; padding: 0 14px; border-radius: 12px; background: #161616; border: 1px solid #262626; outline: none; font-size: 16px; }
.in:focus { border-color: #555; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.acts { display: flex; gap: 10px; margin-top: 24px; }
.btn { flex: 1; height: 46px; border-radius: 12px; font-weight: 700; background: #1a1a1a; }
.btn:hover { background: #242424; }
.btn.pri { background: var(--ink); color: #000; }
.btn.pri:hover { background: #e6e6e6; }
/* ── the week in review ── */
.dlg.wide { width: 760px; padding: 36px 40px; position: relative; overflow: hidden; }
.rv-top { display: flex; align-items: center; justify-content: space-between; }
.rv-nav { width: 40px; height: 40px; border-radius: 12px; color: var(--dim); font-size: 22px; }
.rv-nav:hover { background: #161616; color: var(--ink); }
.rv-nav:disabled { opacity: .25; cursor: default; background: none; }
.dlg h2.rv-h { font-size: 52px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; margin-top: 22px; }
.rv-h.is-win { animation: sv-win 2.4s ease-in-out .3s infinite; }
@keyframes sv-win { 0%, 100% { text-shadow: 0 0 0 rgba(255,255,255,0); } 50% { text-shadow: 0 0 22px rgba(255,255,255,.75), 0 0 60px rgba(255,255,255,.3); } }
.rv-big { margin-top: 18px; display: flex; align-items: baseline; gap: 12px; }
.rv-big b { font-size: 72px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
.rv-big span { color: var(--dim); font-size: 16px; }
.rv-bar { height: 6px; border-radius: 6px; background: var(--track); margin-top: 16px; overflow: hidden; }
.rv-bar i { display: block; height: 100%; background: var(--ink); border-radius: 6px; }
.rv-figs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 28px; }
.rv-figs span { display: block; font-size: 12px; color: var(--quiet); }
.rv-figs b { display: block; font-size: 22px; font-weight: 700; margin-top: 6px; }
.rv-figs small { display: block; color: var(--dim); font-size: 12px; margin-top: 4px; }
.rv-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; height: 110px; align-items: end; margin-top: 28px; }
.rv-days div { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; gap: 6px; }
.rv-days i { display: block; width: 100%; border-radius: 6px 6px 2px 2px; background: #3a3a3a; min-height: 3px; }
.rv-days i.is-hit { background: var(--ink); }
.rv-days span { font-size: 11px; color: var(--quiet); }
.rv-days em { font-style: normal; font-size: 12px; font-weight: 600; }
.rv-best { color: var(--dim); margin-top: 18px; }
.cf { position: absolute; left: 50%; top: 30%; width: 6px; height: 6px; border-radius: 2px; background: var(--ink); opacity: 0; pointer-events: none;
  animation: sv-cf 1.6s cubic-bezier(.15, .7, .3, 1) var(--d) forwards; }
@keyframes sv-cf { 0% { opacity: 1; transform: translate(0, 0) rotate(0); } 100% { opacity: 0; transform: translate(var(--x), var(--y)) rotate(var(--r)); } }
@media (prefers-reduced-motion: reduce) { .cf, .rv-h.is-win { animation: none; } }

/* ── a tooltip that is the app's own ── */
.tip { position: fixed; z-index: 80; pointer-events: none; display: none; background: #000; color: var(--ink); border: 1px solid #2c2c2c; border-radius: 10px; padding: 7px 11px; font-size: 12px; white-space: nowrap; box-shadow: 0 8px 24px rgba(0,0,0,.6); }
.tip.on { display: block; }

/* ── toast ── */
.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: #161616; border: 1px solid #262626; border-radius: 14px; padding: 6px 6px 6px 18px; display: flex; align-items: center; gap: 14px; z-index: 60; width: max-content; }
.toast button { height: 36px; padding: 0 14px; border-radius: 10px; background: var(--ink); color: #000; font-weight: 700; }

/* A narrow window still works, stacked, but this is built for a desk. */
@media (max-width: 1080px) {
  .grid { grid-template-columns: 1fr; }
  .stats { grid-template-columns: 1fr 1fr; }
  .mark { font-size: 34px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="hd">
    <h1 class="mark" id="svMark" aria-label="Structure. Volume. Consistency."><span>STRUCTURE.</span> <span>VOLUME.</span> <span>CONSISTENCY.</span></h1>
    <div class="hd-r">
      <span class="hd-date" id="svDate"></span>
      <button class="icon-btn" id="svSet" aria-label="Target and backup" title="Target and backup">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
    </div>
  </header>

  <section class="grid">
    <div class="card timer-card">
      <div class="ring">
        <svg viewBox="0 0 300 300" aria-hidden="true">
          <circle class="tr" cx="150" cy="150" r="136" />
          <circle class="fl" id="svArc" cx="150" cy="150" r="136" />
        </svg>
        <div class="ring-mid">
          <div class="ring-big num" id="svBig">0</div>
          <div class="ring-sub" id="svSub"></div>
        </div>
      </div>
      <div class="cnt">
        <label><span>Started the day at</span><input class="in num" id="svA" type="number" min="0" inputmode="numeric" placeholder="0" /></label>
        <label><span>Sitting at</span><input class="in num" id="svB" type="number" min="0" inputmode="numeric" placeholder="0" /></label>
      </div>
      <div class="gobar" id="svBar">
        <button class="go soft" id="svPause" hidden>Pause</button>
        <button class="go" id="svGo">Start backtesting</button>
      </div>
      <div class="hint-k" id="svKeys">Space starts</div>
    </div>

    <div class="card today">
      <div class="today-h"><span class="lbl">Today</span><span class="hint-k" id="svPlan"></span></div>
      <div id="svRows"></div>
      <div class="pace">
        <div class="fig"><span id="svT1L"></span><b class="num" id="svT1">–</b></div>
        <div class="fig"><span id="svT2L"></span><b class="num" id="svT2">–</b></div>
      </div>
    </div>
  </section>

  <section class="stats">
    <div class="card stat"><span class="lbl">Target</span><div class="stat-v num" id="svTg"></div><div class="stat-x" id="svTgX"></div><div class="bar"><i id="svTgB"></i></div></div>
    <div class="card stat"><span class="lbl">Streak</span><div class="stat-v num" id="svSt"></div><div class="stat-x" id="svStX"></div><div class="dots" id="svDots"></div></div>
    <button class="card stat stat-b" id="svEx" aria-label="Expectancy: what to expect at your pace. Open the detail"><span class="lbl">Expectancy</span><span class="chev" aria-hidden="true">›</span><div class="stat-v num" id="svExV"></div><div class="stat-x" id="svExX"></div><div class="bar"><i id="svExB"></i></div></button>
  </section>

  <section class="card pace-c">
    <div class="pace-h">
      <span class="lbl">Pace · time per trade, last 30 days</span>
      <div class="pace-f num" id="svPaceF"></div>
    </div>
    <div class="pc" id="svPc"></div>
    <div class="pc-x"><span id="svPcA"></span><span>Today</span></div>
  </section>

  <section class="card yr-c">
    <div class="yr-h"><span class="lbl">The year · a square a day</span><span class="hint-k num" id="svYrX"></span></div>
    <div class="yr-m" id="svYrM"></div>
    <div class="yr" id="svYr" role="img" aria-label="Every day this year, brighter the closer you got to that day's trade target"></div>
  </section>

  <section class="card log">
    <div class="log-h"><span class="lbl">Backtesting sessions</span><button class="link" id="svAdd">+ Add a past session</button></div>
    <div id="svLog"></div>
  </section>
</div>

<script>
(function () {
'use strict';

var KEY = 'svc.v1';
/* Only backtesting is tracked now. The other two are what earlier
   versions saved: they are still read, so nothing already logged is
   lost, and they are never shown or counted. */
var KINDS = { bt: 'Backtest', live: 'Live charts', cnt: 'Content + journal' };
var DAY = 864e5;
var FIRST = 50, STEP = 15, EVERY = 14;
var $ = function (id) { return document.getElementById(id); };

/* ── store ──
   One key. A session is a start and an end in epoch ms, and the time
   paused (`p`): it is time and nothing else. Trades are not counted per
   session. They come from the day's counter, `d`, keyed by date: the
   number the counter started the day at (`a`) and the number it sits at
   now (`b`), and the day's trades are the difference. `a` may be left
   out, and then the day starts where the last recorded day ended, so on
   an ordinary day the only thing typed is where it ended. `run` is the
   session on the clock, so a reload or a closed laptop picks it back
   up. A damaged entry costs itself and never the rest.

   The target is a history, `t`: the target in force from each date. A
   day is judged against the one it was lived under, so raising the
   target never turns last week's hit into a miss. */

    return x && KINDS[x.k] && isFinite(x.a) && isFinite(x.b) && x.b >= x.a;
  }).map(function (x) {
    var o2 = { i: String(x.i || id()), k: x.k, a: +x.a, b: +x.b, n: x.k === 'bt' ? Math.max(0, Math.round(+x.n || 0)) : 0 };
    if (typeof x.t === 'string' && x.t.trim()) o2.t = x.t.slice(0, 20000);
    /* time spent paused, written only when there was some */
    if (isFinite(x.p) && +x.p > 0 && +x.p < o2.b - o2.a) o2.p = Math.round(+x.p);
    return o2;
  }) : [];

    if (!/^\d{4}-\d\d-\d\d$/.test(k) || !o.d[k] || typeof o.d[k] !== 'object') return;
    var a = numOrNull(o.d[k].a), b = numOrNull(o.d[k].b), r = {};
    if (a !== null) r.a = a;

  g = { step: isFinite(g.step) && +g.step >= 0 ? Math.round(+g.step) : STEP, every: isFinite(g.every) && +g.every >= 1 ? Math.round(+g.every) : EVERY };
  var t = Array.isArray(o.t) ? o.t.filter(function (x) { return x && /^\d{4}-\d\d-\d\d$/.test(x.f) && isFinite(x.n) && +x.n > 0; })
    .map(function (x) { return { f: x.f, n: Math.round(+x.n) }; }).sort(function (p, q) { return p.f < q.f ? -1 : p.f > q.f ? 1 : 0; }) : [];

       judged against the old daily target, and fifty starts today */
    var old = o.g && +o.g.bt > 0 ? Math.round(+o.g.bt) : 40, td = isoDay(Date.now());
    t = s.length || Object.keys(d).length ? [{ f: '2000-01-01', n: old }, { f: td, n: FIRST }] : [{ f: td, n: FIRST }];
  }
  var run = o.run && isFinite(o.run.a) ? { a: +o.run.a, p: isFinite(o.run.p) && +o.run.p > 0 ? Math.round(+o.run.p) : 0, pa: isFinite(o.run.pa) && +o.run.pa >= +o.run.a ? +o.run.pa : null } : null;

function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function id() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
var S = load();

/* ── time ── */
function dayStart(t) { var d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); }

function addDays(t, n) { var d = new Date(t); d.setDate(d.getDate() + n); return d.getTime(); }

function hm(t) { var d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function dur(ms) {
  var s = Math.round(ms / 1000);
  if (!s) return '0m';
  if (s < 60) return s + 's';
  var m = Math.round(s / 60), h = Math.floor(m / 60);
  return h ? h + 'h' + (m % 60 ? ' ' + (m % 60) + 'm' : '') : m + 'm';
}

  var s = Math.round(ms / 1000), m = Math.floor(s / 60);
  return m ? m + 'm ' + pad(s % 60) + 's' : s + 's';
}

  var s = Math.max(0, Math.floor(ms / 1000));
  var h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60;
  return (h ? h + ':' + pad(m) : m) + ':' + pad(s % 60);
}
function dayName(t) {
  var now = dayStart(Date.now());
  if (t === now) return 'Today';
  if (t === addDays(now, -1)) return 'Yesterday';
  return new Date(t).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'short' });
}
function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function fmt(n) { return n.toLocaleString('en-GB'); }
function isoDay(t) { var d = new Date(t); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function isoMs(k) { var p = k.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]).getTime(); }
function short(t) { return new Date(t).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }); }

/* ── the target ──
   Fifty a day, and fifteen more every fortnight. `goal(t)` is the target
   in force on day t. Past the last entry it carries on up the same
   ladder, so a month that has a raise inside it already knows what its
   later days ask. The raises that have come due are written into the
   history, which is what stops a later change to the step or the
   fortnight from rewriting the days already lived. */
function goal(t) {
  var k = isoDay(t), e = S.t[0];
  S.t.forEach(function (x) { if (x.f <= k) e = x; });
  if (e !== S.t[S.t.length - 1] || k < e.f) return e.n;
  return e.n + Math.floor(Math.round((dayStart(t) - isoMs(e.f)) / DAY) / S.g.every) * S.g.step;
}
function goalIn(a, b) { var n = 0; for (var t = dayStart(a); t < b; t = addDays(t, 1)) n += goal(t); return n; }
function applyRaises() {
  var last = S.t[S.t.length - 1], today = isoDay(Date.now()), changed = false;
  for (var n = 0; n < 200 && S.g.step > 0; n++) {
    var f = isoDay(addDays(isoMs(last.f), S.g.every));
    if (f > today) break;
    last = { f: f, n: last.n + S.g.step }; S.t.push(last); changed = true;
  }
  if (changed) save();
}
function nextRaise() {
  var last = S.t[S.t.length - 1];
  if (!S.g.step) return null;
  var f = isoDay(addDays(isoMs(last.f), S.g.every));
  return { f: f, n: last.n + S.g.step, days: Math.round((isoMs(f) - dayStart(Date.now())) / DAY), since: Math.round((dayStart(Date.now()) - isoMs(last.f)) / DAY) };
}

/* ── sums ──
   Backtesting sessions only. A session is on the clock for its range
   less the time paused. */
function within(a, b) { return S.s.filter(function (x) { return x.k === 'bt' && x.a >= a && x.a < b; }); }
function len(x) { return x.b - x.a - (x.p || 0); }
function btMs(a, b) { return within(a, b).reduce(function (t, x) { return t + len(x); }, 0); }

/* The counter at the end of the last recorded day before this one. */
function prevEnd(t) {
  var k0 = isoDay(t), bk = '', best = null;
  Object.keys(S.d).forEach(function (k) { if (k < k0 && S.d[k].b !== undefined && k > bk) { bk = k; best = S.d[k].b; } });
  return best;
}
function startOf(t) { var r = S.d[isoDay(t)]; return r && r.a !== undefined ? r.a : prevEnd(t); }
/* A day's trades: where the counter sits less where it started. A day
   with no counter falls back to the trade counts older sessions carry,
   so nothing logged before this is lost. */
function dayTrades(t) {
  var r = S.d[isoDay(t)];
  if (r && r.b !== undefined) { var a = startOf(t); return a === null ? 0 : Math.max(0, r.b - a); }
  return within(t, t + DAY).reduce(function (n, x) { return n + x.n; }, 0);
}
function tradesIn(a, b) { var n = 0; for (var t = dayStart(a); t < b; t = addDays(t, 1)) n += dayTrades(t); return n; }
/* Pace is backtesting time over trades, for the days that have both. */
function rangePace(a, b) {
  var n = 0, ms = 0;
  for (var t = dayStart(a); t < b; t = addDays(t, 1)) { var tr = dayTrades(t), m = btMs(t, t + DAY); if (tr > 0 && m > 0) { n += tr; ms += m; } }

function pace() { var d0 = dayStart(Date.now()); return rangePace(addDays(d0, -29), d0 + DAY); }

/* ── the ring ── */
var R = 136, C = 2 * Math.PI * R;

function paintRing() {
  var arc = $('svArc'), big = $('svBig'), sub = $('svSub');
  arc.style.strokeDasharray = C;
  var now = Date.now(), d0 = dayStart(now), done = dayTrades(d0), g = goal(d0);
  if (S.run) {
    /* on the clock: since the start, less every pause, and frozen at the
       moment of the pause while one is on */
    big.textContent = clock(el0()); big.classList.add('is-clock');
    sub.textContent = S.run.pa ? 'Paused' : 'Backtesting since ' + hm(S.run.a);
  } else {
    big.textContent = fmt(done); big.classList.remove('is-clock');
    sub.textContent = 'of ' + g + ' trades today';
  }
  /* the ring is the day's trades even while the clock runs: trades are the target */
  arc.style.strokeDashoffset = C * (1 - Math.min(1, done / g));
  var rg = document.querySelector('.ring');
  rg.classList.toggle('is-run', !!S.run && !S.run.pa);
  rg.classList.toggle('is-paused', !!(S.run && S.run.pa));
  rg.classList.toggle('is-hit', done >= g);
  document.title = S.run ? (S.run.pa ? 'Paused · ' : '') + clock(el0()) : 'SVC';
}

/* ── the counter ──
   Written from the store only while you are not typing in it, so a
   repaint never takes the digit out from under your finger. */
function paintCounter() {
  var t = dayStart(Date.now()), r = S.d[isoDay(t)] || {}, A = $('svA'), B = $('svB'), pe = prevEnd(t), st = startOf(t);
  A.placeholder = pe !== null ? String(pe) : '0';
  B.placeholder = st !== null ? String(st) : '0';
  if (document.activeElement !== A) A.value = r.a !== undefined ? r.a : '';
  if (document.activeElement !== B) B.value = r.b !== undefined ? r.b : '';
}
function setCounter(k, which, val) {
  var r = S.d[k] || (S.d[k] = {}), v = numOrNull(val);

/* A past day, both numbers at once. */

  ['a', 'b'].forEach(function (w) { var v = numOrNull(f[w]); if (v !== null) r[w] = v; });

/* ── today ── */
function row(name, note, val, valNote, frac, extra) {
  return '<div class="row"><div class="row-n">' + name + (note ? '<small>' + note + '</small>' : '') + '</div>'
    + '<div class="row-v num">' + val + (valNote ? ' <small>' + valNote + '</small>' : '') + '</div>'
    + '<div class="bar"><i style="width:' + Math.round(Math.min(1, frac) * 100) + '%"></i></div>'
    + (extra ? '<div class="row-x num">' + extra + '</div>' : '') + '</div>';
}
function paintToday() {
  var now = Date.now(), d0 = dayStart(now);
  var bt = dayTrades(d0), ms = btMs(d0, d0 + DAY), g = goal(d0);
  var clockNote = ms ? ' · ' + dur(ms) + ' on the clock' : '';
  $('svRows').innerHTML = row('Backtesting', '', fmt(bt), '/ ' + g, bt / g, (bt >= g ? 'Target hit' : fmt(g - bt) + ' to go') + clockNote);
  var p = pace(), nx = nextRaise();
  $('svT1L').textContent = g + ' trades take';
  $('svT1').textContent = p ? dur(p * g) : '–';
  $('svT2L').textContent = nx ? nx.n + ' trades would take' : g + 100 + ' trades would take';
  $('svT2').textContent = p ? dur(p * (nx ? nx.n : g + 100)) : '–';
  $('svPlan').textContent = nx ? 'Target ' + g + ' · ' + nx.n + ' from ' + short(isoMs(nx.f)) : 'Target ' + g;
}

/* ── week, target, month, streak ── */
function bar(id, f) { $(id).style.width = Math.round(Math.min(1, f) * 100) + '%'; }
/* ── what to expect ──
   Not a goal and not a grade: your own rate carried forward. The rate is
   the trades a day over the days you have actually been at it, the last
   fortnight at most, so a week that began on a Thursday is read as a
   Thursday and not as a week short of three hundred. Today is expected
   to finish at your rate, or where it already is if that is higher, and
   every day still to come at the rate. It is a projection of the
   volume you are doing. It says nothing about how the trades went: the
   app counts them and does not record their results. */

  var now = Date.now(), d0 = dayStart(now), done = dayTrades(d0), first = firstDay();
  var start = Math.max(first, addDays(d0, -14)), days = Math.round((d0 - start) / DAY);
  var rate = days >= 1 ? tradesIn(start, d0) / days : done, rr = Math.round(rate);
  var today = Math.max(done, rr), w0 = weekStart(now), m0 = monthStart(now);

  return { has: tradesIn(first, d0 + DAY) > 0, rate: rate, rr: rr, days: days, done: done, today: today, wkSo: wkSo, moSo: moSo,
    week: wkSo - done + today + rr * wkLeft, month: moSo - done + today + rr * moLeft };
}
function paintStats() {
  var now = Date.now(), d0 = dayStart(now);
  var nx = nextRaise();
  $('svTg').innerHTML = goal(d0) + ' <small>a day</small>';
  $('svTgX').textContent = nx ? nx.n + ' from ' + short(isoMs(nx.f)) + ' · ' + nx.days + (nx.days === 1 ? ' day' : ' days') : 'No raise set';
  bar('svTgB', nx ? nx.since / S.g.every : 0);

  /* A day counts when that day's target was reached. The streak may end
     yesterday: today is not over, so not having hit it yet is not a
     break. Four weeks, Monday first, so a weekday sits in one column. */
  function hit(t) { return dayTrades(t) >= goal(t); }
  var run = 0, t = hit(d0) ? d0 : addDays(d0, -1);
  while (hit(t) && run < 3650) { run++; t = addDays(t, -1); }
  var best = 0, cur = 0;
  for (t = firstDay(); t <= d0; t = addDays(t, 1)) { cur = hit(t) ? cur + 1 : 0; if (cur > best) best = cur; }
  $('svSt').innerHTML = run + ' <small>' + (run === 1 ? 'day' : 'days') + ' in a row</small>';
  var start = addDays(weekStart(now), -21), html = '';
  ['M', 'T', 'W', 'T', 'F', 'S', 'S'].forEach(function (l) { html += '<span class="dw">' + l + '</span>'; });
  for (var i = 0; i < 28; i++) {
    var day = addDays(start, i), n = dayTrades(day);
    var cls = day > d0 ? 'is-ahead' : n >= goal(day) ? 'is-hit' : n > 0 ? 'is-part' : '';
    html += '<span class="dot ' + cls + (day === d0 ? ' is-now' : '') + '" data-tip="' + esc(dayName(day)) + ' · ' + n + ' trades"></span>';
  }
  $('svDots').innerHTML = html;
  $('svStX').textContent = 'Best run ' + best;

  var x = expect();
  if (!x.has) { $('svExV').textContent = '–'; $('svExX').textContent = 'Log a day to see it'; bar('svExB', 0); }
  else {
    $('svExV').innerHTML = x.rr + ' <small>a day</small>';
    $('svExX').textContent = fmt(x.week) + ' this week · ' + fmt(x.month) + ' this month';
    bar('svExB', x.rate / goal(d0));

}
/* The first day anything was recorded, by session or by counter. */
function firstDay() {
  var t = dayStart(Date.now());
  within(0, Infinity).forEach(function (x) { t = Math.min(t, dayStart(x.a)); });
  Object.keys(S.d).forEach(function (k) { t = Math.min(t, isoMs(k)); });
  return t;
}

/* ── log ── */
/* A week of sessions, newest first; the rest one press away. Not
   stored: a long log is something you open on purpose. */
var logAll = false;
function paintLog() {
  var all = within(0, Infinity).sort(function (a, b) { return b.a - a.a; });
  var cut = addDays(dayStart(Date.now()), -6);
  var list = logAll ? all : all.filter(function (x) { return x.a >= cut; });
  var more = all.length - list.length;
  if (!all.length) { $('svLog').innerHTML = '<div class="empty">Nothing yet. Press Start backtesting.</div>'; return; }
  var html = '', last = null, rows = '';
  function flush() {
    if (last === null) return;
    var items = list.filter(function (x) { return dayStart(x.a) === last; });
    var n = dayTrades(last), ms = items.reduce(function (t, x) { return t + len(x); }, 0);
    html += '<div class="day-h"><span>' + dayName(last) + '</span><button class="link num" data-day="' + isoDay(last) + '" data-tip="Set this day\'s counter">' + (n ? n + ' trades · ' : '') + dur(ms) + '</button></div><table>' + rows + '</table>';
    rows = '';
  }
  list.slice(0, 200).forEach(function (x) {
    var d = dayStart(x.a);
    if (d !== last) { flush(); last = d; }
    rows += '<tr data-i="' + x.i + '"><td class="t num">' + hm(x.a) + '–' + hm(x.b) + '</td><td class="k">Backtest' + (x.p ? '<small>' + dur(x.p) + ' paused</small>' : '') + '</td>'
      + '<td class="d num">' + dur(len(x)) + '</td>'
      + '<td class="x"><button class="del" aria-label="Delete this session" title="Delete">×</button></td></tr>';
  });
  flush();
  if (more) html += '<div class="empty"><button class="link" data-more="1">Show ' + more + ' older ' + (more === 1 ? 'session' : 'sessions') + '</button></div>';
  else if (logAll && all.some(function (x) { return x.a < cut; })) html += '<div class="empty"><button class="link" data-more="1">Show this week only</button></div>';
  $('svLog').innerHTML = html;
}

function paintControls() {
  var on = !!S.run, paused = on && !!S.run.pa, go = $('svGo'), ps = $('svPause');
  go.textContent = on ? 'End session' : 'Start backtesting';
  go.classList.toggle('is-on', on);
  ps.hidden = !on;
  ps.textContent = paused ? 'Resume' : 'Pause';
  /* the action on offer is the white one: resume while paused */
  ps.classList.toggle('soft', !paused);
  $('svBar').classList.toggle('is-two', on);
  $('svKeys').textContent = on ? (paused ? 'Space resumes' : 'Space pauses') : 'Space starts';
}

function paint() {
  applyRaises();
  $('svDate').textContent = new Date().toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'long', year: 'numeric' });
  paintRing(); paintCounter(); paintToday(); paintStats(); paintPace(); paintYear(); paintLog(); paintControls();
}

/* ── pace ──
   Time per trade, day by day, for thirty days. A shorter bar is a faster
   day; the fastest are white. The dashed line is the thirty-day figure,
   so a run of bars under it is you getting quicker. */
function paintPace() {
  var d0 = dayStart(Date.now()), start = addDays(d0, -29), days = [], max = 0, best = 0;
  for (var i = 0; i < 30; i++) { var t = addDays(start, i), p = rangePace(t, t + DAY); days.push({ t: t, p: p }); if (p > max) max = p; if (p && (!best || p < best)) best = p; }
  var avg = rangePace(start, d0 + DAY), wk = rangePace(addDays(d0, -6), d0 + DAY), html = '';
  days.forEach(function (d) {
    var cls = !d.p ? 'is-none' : d.p === best ? 'is-best' : '';
    html += '<i class="' + cls + (d.t === d0 ? ' is-now' : '') + '" style="height:' + (d.p ? Math.max(3, Math.round(d.p / max * 100)) : 100) + '%" data-tip="'
      + esc(dayName(d.t)) + (d.p ? ' · ' + per(d.p) + ' a trade' : ' · no backtests') + '"></i>';
  });
  if (avg && max) html += '<span class="pc-avg" style="bottom:' + (avg / max * 100) + '%"></span>';
  $('svPc').innerHTML = html;
  $('svPcA').textContent = short(start);
  $('svPaceF').innerHTML = avg
    ? '<div><span>30 days</span><b>' + per(avg) + '</b></div><div><span>Last 7 days</span><b>' + (wk ? per(wk) : '–') + '</b></div>'
    : '<div><span>No backtests with a trade count yet</span></div>';
}

/* ── the year ──
   Fifty-three weeks, Monday at the top. A day is one square: dark for
   nothing, brighter up to that day's target, white at it and haloed at
   half as much again. Days still to come are an outline, not a miss. */
function paintYear() {
  var now = Date.now(), d0 = dayStart(now), start = addDays(weekStart(now), -52 * 7);
  var html = '', mo = '', last = -1, hits = 0, run = 0, best = 0;
  for (var i = 0; i < 53 * 7; i++) {
    var t = addDays(start, i), cls, n = 0;
    if (t > d0) cls = 'is-ahead';
    else {
      n = dayTrades(t);
      var f = n / goal(t);
      cls = !n ? '' : f >= 1.5 ? 'l4' : f >= 1 ? 'l3' : f >= .5 ? 'l2' : 'l1';
      if (f >= 1) { hits++; run++; if (run > best) best = run; } else run = 0;
    }
    html += '<i class="' + cls + (t === d0 ? ' is-now' : '') + '" data-tip="' + esc(new Date(t).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' })) + (t <= d0 ? ' · ' + n + ' trades' : '') + '"></i>';
    if (i % 7 === 0) {
      var m = new Date(t).getMonth();
      mo += '<span>' + (m !== last && new Date(t).getDate() <= 7 ? new Date(t).toLocaleDateString('en-GB', { month: 'short' }) : '') + '</span>';
      last = m;
    }
  }
  $('svYr').innerHTML = html; $('svYrM').innerHTML = mo;
  $('svYrX').textContent = hits + ' days on target · best run ' + best;
}

/* ── the clock ── */
var tick = null;
function clockOn() {
  if (tick) clearInterval(tick);
  tick = S.run ? setInterval(paintRing, 1000) : null;
}

/* ── toast ── */
var toastT = null;
function toast(msg, undo) {
  var old = document.querySelector('.toast'); if (old) old.remove();
  clearTimeout(toastT);
  var t = document.createElement('div');
  t.className = 'toast';
  t.setAttribute('role', 'status');
  var s = document.createElement('span'); s.textContent = msg; t.appendChild(s);
  if (undo) {
    var b = document.createElement('button'); b.textContent = 'Undo';
    b.addEventListener('click', function () { undo(); t.remove(); });
    t.appendChild(b);
  } else t.style.padding = '14px 18px';
  document.body.appendChild(t);
  toastT = setTimeout(function () { t.remove(); }, 6000);
}

/* ── dialogs ──
   Built and removed, never hidden, so a put-away dialog cannot go on
   taking presses. Escape and a press on the veil both cancel. */
function dialog(html, onOpen, cls) {
  var v = document.createElement('div');
  v.className = 'veil';
  v.innerHTML = '<div class="dlg' + (cls ? ' ' + cls : '') + '" role="dialog" aria-modal="true">' + html + '</div>';
  function close() { v.remove(); document.removeEventListener('keydown', esc, true); }
  function esc(e) { if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(); } }
  v.addEventListener('mousedown', function (e) { if (e.target === v) close(); });
  document.addEventListener('keydown', esc, true);
  document.body.appendChild(v);
  onOpen(v.firstChild, close);
}
function dialogOpen() { return !!document.querySelector('.veil'); }

/* ── start, pause and end ── */
function start() {
  S.run = { a: Date.now(), p: 0, pa: null };
  save(); clockOn(); paint();
}
function file(sess) {
  S.s.push(sess); save(); paint();
  toast('Backtest · ' + dur(len(sess)), function () {
    S.s = S.s.filter(function (x) { return x.i !== sess.i; }); save(); paint();
  });
}
function end() {
  var run = S.run, b = run ? (run.pa || Date.now()) : 0;
  if (!run) return;
  S.run = null; clockOn();
  /* ended while paused, it ends where the pause began: the time away is
     not part of the session, however long it was */
  var sess = { i: id(), k: 'bt', a: run.a, b: b, n: 0 };
  if (run.p > 0) sess.p = run.p;
  file(sess);
}
function toggle() { if (S.run) end(); else start(); }
/* Pause stops the clock without ending anything: the bathroom, a call.
   What was away is added to `p` on the way back, and the session keeps
   counting from where it stopped. */
function pause() {
  if (!S.run || S.run.pa) return;
  S.run.pa = Date.now(); save(); paint();
}
function resume() {
  if (!S.run || !S.run.pa) return;
  S.run.p += Date.now() - S.run.pa; S.run.pa = null; save(); paint();
}
function togglePause() { if (S.run && S.run.pa) resume(); else pause(); }

/* ── the week in review ──
   Opens by itself on the first visit of a new week, for the week just
   gone, and the moment the week's trade target is crossed. Any week
   back through the record is one arrow away. Nothing here is red: a
   week short of target is a week, not a verdict. */
function weekData(w0) {
  var w1 = addDays(w0, 7), d0 = dayStart(Date.now());
  var days = [], hit = 0, best = null, total = 0;
  for (var i = 0; i < 7; i++) {
    var t = addDays(w0, i), n = dayTrades(t);
    days.push({ t: t, n: n, g: goal(t) }); total += n;
    if (t <= d0 && n >= goal(t)) hit++;
    if (n && (!best || n > best.n)) best = { t: t, n: n };
  }
  return { trades: total, goal: goalIn(w0, w1), btMs: btMs(w0, w1), pace: rangePace(w0, w1), prevPace: rangePace(addDays(w0, -7), w0),
    days: days, hit: hit, best: best, daily: goal(w0) };
}
function review(w0, celebrate) {
  var first = weekStart(firstDay()), cur = weekStart(Date.now());
  dialog('', function (d) {
    function draw() {
      var W = weekData(w0), win = W.trades >= W.goal, live = w0 === cur;
      var max = Math.max.apply(null, W.days.map(function (x) { return x.n; }).concat(W.days.map(function (x) { return x.g; })));
      var pc = '';
      if (W.pace && W.prevPace) {
        var dd = Math.round((W.prevPace - W.pace) / 1000);
        pc = dd > 0 ? dd + 's faster than the week before' : dd < 0 ? -dd + 's slower than the week before' : 'same as the week before';
      }
      var head = win ? 'WEEK DONE.' : live ? 'THIS WEEK.' : 'THE WEEK.';
      d.innerHTML = '<div class="rv-top"><button class="rv-nav" data-a="prev" aria-label="Week before"' + (w0 <= first ? ' disabled' : '') + '>‹</button>'
        + '<span class="lbl">' + short(w0) + ' – ' + short(addDays(w0, 6)) + (live ? ' · so far' : '') + '</span>'
        + '<button class="rv-nav" data-a="next" aria-label="Week after"' + (w0 >= cur ? ' disabled' : '') + '>›</button></div>'
        + '<h2 class="rv-h' + (win ? ' is-win' : '') + '">' + head + '</h2>'
        + '<div class="rv-big num"><b>' + fmt(W.trades) + '</b><span>trades of ' + fmt(W.goal) + (win ? ' · target hit' : ' · ' + fmt(W.goal - W.trades) + (live ? ' to go' : ' short')) + '</span></div>'
        + '<div class="rv-bar"><i style="width:' + Math.round(Math.min(1, W.trades / W.goal) * 100) + '%"></i></div>'
        + '<div class="rv-figs num">'
        + '<div><span>Days on target</span><b>' + W.hit + ' / 7</b><small>' + W.daily + ' a day</small></div>'
        + '<div><span>Backtesting time</span><b>' + dur(W.btMs) + '</b><small>on the clock</small></div>'
        + '<div><span>Pace</span><b>' + (W.pace ? per(W.pace) : '–') + '</b><small>' + (pc || 'a trade') + '</small></div>'
        + '</div><div class="rv-days num">'
        + W.days.map(function (x) {
          return '<div><em>' + (x.n || '') + '</em><i class="' + (x.n >= x.g ? 'is-hit' : '') + '" style="height:' + Math.max(3, Math.round(x.n / max * 70)) + 'px"></i><span>'
            + new Date(x.t).toLocaleDateString('en-GB', { weekday: 'short' }) + '</span></div>';
        }).join('')
        + '</div><p class="rv-best">' + (W.best ? 'Best day: ' + new Date(W.best.t).toLocaleDateString('en-GB', { weekday: 'long' }) + ' · ' + W.best.n + ' trades' : 'No trades logged this week') + '</p>'
        + '<div class="acts"><button class="btn pri" data-a="x">' + (win ? 'Keep going' : 'Close') + '</button></div>';
      if (win && celebrate) burst(d);
      celebrate = false;
    }
    d.addEventListener('click', function (e) {
      var b = e.target.closest('[data-a]'); if (!b) return;
      if (b.dataset.a === 'x') { d.parentNode.remove(); return; }
      if (b.dataset.a === 'prev') { w0 = weekStart(addDays(w0, -7)); draw(); }
      if (b.dataset.a === 'next') { w0 = weekStart(addDays(w0, 7)); draw(); }
    });
    draw();
  }, 'wide');
}
function burst(host) {
  for (var i = 0; i < 44; i++) {
    var a = Math.random() * Math.PI * 2, r0 = 160 + Math.random() * 260, c = document.createElement('i');
    c.className = 'cf';
    c.style.cssText = '--x:' + Math.round(Math.cos(a) * r0) + 'px;--y:' + Math.round(Math.sin(a) * r0 * .8 + 80) + 'px;--r:' + Math.round(Math.random() * 540) + 'deg;--d:' + Math.round(Math.random() * 160) + 'ms;'
      + (i % 3 ? '' : 'width:3px;height:12px;');
    host.appendChild(c);
  }
}

/* ── a session you forgot to time ── */
function addPast() {
  var now = new Date(), iso = isoDay(now.getTime());
  dialog('<h2>Add a past session</h2>'
    + '<div class="two"><label class="fld"><span>Day</span><input class="in num" id="svPD" type="date" value="' + iso + '" max="' + iso + '" /></label>'
    + '<label class="fld"><span>Started</span><input class="in num" id="svPS" type="time" value="' + pad(now.getHours()) + ':00" /></label></div>'
    + '<label class="fld"><span>Minutes</span><input class="in num" id="svPM" type="number" min="1" max="720" value="60" /></label>'
    + '<div class="acts"><button class="btn" data-a="x">Cancel</button><button class="btn pri" data-a="save">Add</button></div>', function (d, close) {
    d.querySelector('[data-a="x"]').addEventListener('click', close);
    d.querySelector('[data-a="save"]').addEventListener('click', function () {
      var dv = d.querySelector('#svPD').value, sv = d.querySelector('#svPS').value;
      var m = Math.round(+d.querySelector('#svPM').value || 0);
      if (!dv || !sv || !(m > 0)) return;
      var p = dv.split('-'), q = sv.split(':');
      var a = new Date(+p[0], +p[1] - 1, +p[2], +q[0], +q[1]).getTime();
      close();
      file({ i: id(), k: 'bt', a: a, b: a + m * 6e4, n: 0 });
    });
  });
}

/* ── a day's counter, for a day you forgot ── */
function dayEdit(k) {
  var r = S.d[k] || {}, pe = prevEnd(isoMs(k)), v = function (w) { return r[w] !== undefined ? r[w] : ''; };
  var inp = function (w, label, ph) { return '<label class="fld"><span>' + label + '</span><input class="in num" data-f="' + w + '" type="number" min="0" inputmode="numeric"' + (ph !== undefined ? ' placeholder="' + ph + '"' : '') + ' value="' + v(w) + '" /></label>'; };
  dialog('<h2>' + esc(dayName(isoMs(k))) + '</h2><p>Where the counter was at the start and the end of the day.</p>'
    + '<div class="two">' + inp('a', 'Started the day at', pe !== null ? pe : 0) + inp('b', 'Ended at') + '</div>'
    + '<div class="acts"><button class="btn" data-a="x">Cancel</button><button class="btn pri" data-a="save">Save</button></div>', function (d, close) {
    d.querySelector('[data-f="b"]').focus();
    d.querySelector('[data-a="x"]').addEventListener('click', close);
    function done() {
      var wk = weekStart(isoMs(k)), before = tradesIn(wk, addDays(wk, 7)), f = {};
      ['a', 'b'].forEach(function (w) { f[w] = d.querySelector('[data-f="' + w + '"]').value; });
      setDay(k, f);
      close(); paint(); crossed(wk, before);
    }
    d.querySelector('[data-a="save"]').addEventListener('click', done);
    d.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); done(); } });
  });
}
/* Crossing the week's target is the one moment the app makes a fuss. */
function crossed(w0, before) {
  var g = goalIn(w0, addDays(w0, 7)), after = tradesIn(w0, addDays(w0, 7));
  if (before < g && after >= g && S.cel !== isoDay(w0)) { S.cel = isoDay(w0); save(); setTimeout(function () { review(w0, true); }, 300); }
}

/* ── expectancy, opened ── */
function expectancy() {
  var x = expect(), g = goal(dayStart(Date.now()));
  var row = function (name, big, small) { return '<div class="ex-r"><span>' + name + '</span><b class="num">' + big + (small ? '<small>' + small + '</small>' : '') + '</b></div>'; };
  var over = x.days >= 1 ? (x.days === 1 ? 'the last day' : 'the last ' + x.days + ' days') : 'today so far';
  dialog('<h2>Expectancy</h2><p>' + (x.has ? 'What to expect at your own pace: ' + x.rr + ' a day over ' + over + '.' : 'Log a day and it works out what to expect.') + '</p>'
    + (x.has ? '<div class="ex">'
      + row('Today finishes at', fmt(x.today), 'you have ' + x.done)
      + row('This week', fmt(x.week), x.wkSo + ' so far')
      + row('This month', fmt(x.month), x.moSo + ' so far')
      + row('Against ' + g + ' a day', x.rr >= g ? '✓' : fmt(g - x.rr), x.rr >= g ? 'at or above it' : 'a day short')
      + '</div>' : '')
    + '<div class="acts"><button class="btn" data-a="rv">Weekly review</button><button class="btn pri" data-a="x">Close</button></div>', function (d, close) {
    d.querySelector('[data-a="x"]').addEventListener('click', close);
    d.querySelector('[data-a="rv"]').addEventListener('click', function () { close(); review(weekStart(Date.now()), false); });
  });
}

/* ── the target and backup ──
   Changing the target here starts a new fortnight from today: it is
   written into the history from this day on, and every day before it
   stays judged against what it was. */
function settings() {
  var g0 = goal(dayStart(Date.now()));
  dialog('<h2>Target</h2>'
    + '<div class="two"><label class="fld"><span>Trades a day</span><input class="in num" data-g="n" type="number" min="1" value="' + g0 + '" /></label>'
    + '<label class="fld"><span>Raise it by</span><input class="in num" data-g="step" type="number" min="0" value="' + S.g.step + '" /></label></div>'
    + '<label class="fld"><span>Every how many days</span><input class="in num" data-g="every" type="number" min="1" value="' + S.g.every + '" /></label>'
    + '<div class="acts"><button class="btn" data-a="exp">Download backup</button><button class="btn" data-a="imp">Restore</button></div>'
    + '<div class="acts"><button class="btn" data-a="x">Cancel</button><button class="btn pri" data-a="save">Save</button></div>', function (d, close) {
    d.querySelector('[data-a="x"]').addEventListener('click', close);
    d.querySelector('[data-a="save"]').addEventListener('click', function () {
      var q = function (w) { return +d.querySelector('[data-g="' + w + '"]').value; };
      var step = q('step'), every = q('every'), n = Math.round(q('n')), today = isoDay(Date.now());
      var changed = false;
      if (isFinite(step) && step >= 0 && Math.round(step) !== S.g.step) { S.g.step = Math.round(step); changed = true; }
      if (isFinite(every) && every >= 1 && Math.round(every) !== S.g.every) { S.g.every = Math.round(every); changed = true; }
      if (n > 0 && (n !== g0 || changed)) {
        var last = S.t[S.t.length - 1];
        if (last.f === today) last.n = n; else S.t.push({ f: today, n: n });
      }
      save(); close(); paint();
    });
    d.querySelector('[data-a="exp"]').addEventListener('click', function () {
      var blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'svc-backup-' + new Date().toISOString().slice(0, 10) + '.json';
      a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    });
    d.querySelector('[data-a="imp"]').addEventListener('click', function () {
      var f = document.createElement('input'); f.type = 'file'; f.accept = 'application/json,.json';
      f.addEventListener('change', function () {
        var file0 = f.files && f.files[0]; if (!file0) return;
        file0.text().then(function (txt) {
          var prev = JSON.stringify(S);
          try { JSON.parse(txt); } catch (e) { toast('That file is not a backup'); return; }
          localStorage.setItem(KEY, txt); S = load(); save(); close(); clockOn(); paint();
          toast('Restored ' + S.s.length + ' sessions', function () { localStorage.setItem(KEY, prev); S = load(); clockOn(); paint(); });
        });
      });
      f.click();
    });
  });
}

/* ── wiring ── */
$('svGo').addEventListener('click', toggle);
$('svPause').addEventListener('click', togglePause);
$('svAdd').addEventListener('click', addPast);
$('svSet').addEventListener('click', settings);
$('svEx').addEventListener('click', expectancy);

/* The counter is saved as it is typed, so a closed window loses nothing,
   and the week is only judged when you leave the field: a number half
   typed is not a number. */
var wkAtFocus = 0;
[['svA', 'a'], ['svB', 'b']].forEach(function (p) {
  var el = $(p[0]);
  el.addEventListener('focus', function () { var w = weekStart(Date.now()); wkAtFocus = tradesIn(w, addDays(w, 7)); });
  el.addEventListener('input', function () { setCounter(isoDay(Date.now()), p[1], el.value); paint(); });
  el.addEventListener('change', function () { var w = weekStart(Date.now()); crossed(w, wkAtFocus); wkAtFocus = tradesIn(w, addDays(w, 7)); });
  el.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); el.blur(); } });
});

/* ── tooltips ── one for the whole page, moved to wherever you point ── */
var tip = document.createElement('div');
tip.className = 'tip'; tip.setAttribute('role', 'tooltip');
document.body.appendChild(tip);
document.addEventListener('mouseover', function (e) {
  var t = e.target.closest && e.target.closest('[data-tip]');
  if (!t) { tip.classList.remove('on'); return; }
  tip.textContent = t.getAttribute('data-tip'); tip.classList.add('on');
});
document.addEventListener('mousemove', function (e) {
  if (!tip.classList.contains('on')) return;
  var w = tip.offsetWidth, x = Math.max(8, Math.min(innerWidth - w - 8, e.clientX - w / 2));
  tip.style.left = x + 'px'; tip.style.top = Math.max(8, e.clientY - 44) + 'px';
});
document.addEventListener('mouseleave', function () { tip.classList.remove('on'); });

$('svLog').addEventListener('click', function (e) {
  if (e.target.closest('[data-more]')) { logAll = !logAll; paintLog(); return; }
  var dd = e.target.closest('[data-day]'); if (dd) { dayEdit(dd.dataset.day); return; }
  var b = e.target.closest('.del'); if (!b) return;
  var i = b.closest('tr').dataset.i, gone = S.s.filter(function (x) { return x.i === i; })[0];
  if (!gone) return;
  S.s = S.s.filter(function (x) { return x.i !== i; }); save(); paint();
  toast('Session deleted', function () { S.s.push(gone); save(); paint(); });
});
document.addEventListener('keydown', function (e) {
  if (dialogOpen() || e.code !== 'Space' || e.repeat) return;
  var t = e.target, tag = t && t.tagName;
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA' || tag === 'BUTTON') return;
  /* running, Space pauses and resumes; ending a session is the button
     alone, so a stray press can never end one */
  e.preventDefault();
  if (S.run) togglePause(); else start();
});
/* Another window, or the same app open twice, writes the key: follow it. */
window.addEventListener('storage', function (e) { if (e.key === KEY) { S = load(); clockOn(); paint(); } });
/* The date can roll over while the app sits open; repaint once a minute. */
setInterval(paint, 60000);
document.addEventListener('visibilitychange', function () { if (!document.hidden) paint(); });

/* Split the head into letters, each carrying its place for the stagger.
   The words stay one span each so a word never breaks across lines. */
(function () {
  var n = 0;
  Array.prototype.forEach.call($('svMark').children, function (w) {
    w.setAttribute('aria-hidden', 'true');
    w.innerHTML = w.textContent.split('').map(function (ch) { return '<i style="--n:' + (n++) + '">' + ch + '</i>'; }).join('');
  });
})();

paint(); clockOn();

/* The first open of a new week reviews the week just gone, once. */
(function () {
  var prev = addDays(weekStart(Date.now()), -7), key = isoDay(prev);
  if (S.rev === key) return;
  S.rev = key; save();
  if (tradesIn(prev, addDays(prev, 7)) > 0 || within(prev, addDays(prev, 7)).length) review(prev, true);
})();

if ('serviceWorker' in navigator && /^(https:|http:\/\/(localhost|127\.0\.0\.1))/.test(location.href)) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
})();
</script>
</body>
