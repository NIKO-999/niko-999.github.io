<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Higher Self</title>
<meta name="description" content="My non-negotiables, my vision, and the evidence that I am living as my higher self.">
<!-- Installable app (PWA) -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#160805">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Higher Self">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
<!-- /PWA -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Inter:wght@300;400;500;600&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* ---------- Night room — warm walls, amber LED, split-flap clock ---------- */
  :root {
    color-scheme: dark;
    --bg: #140e0a;
    --cream: #ece4d8;                  /* warm off-white */
    --text: #d8cfc2;
    --dim: #9a8c7c;
    --faint: #66594c;
    --hair: rgba(var(--tint-rgb),.12);
    --amber: #f2b36b;                  /* LED strip */
    --amber-glow: rgba(255,170,90,.45);
    --tint-rgb: 255,214,170;           /* warm light on surfaces */
    --glow-rgb: 255,165,85;            /* LED glow */
    --accent-rgb: 242,179,107;         /* accent fills */
    --floor-rgb: 150,95,55;            /* wood floor glow */
    --led-hot: #ffd6a0;                /* hottest point of the strip */
    --glow-a: #fbf6ee; --glow-b: #f6dcb4;   /* glow text: white into accent */
    --wall-1: #2a2017; --wall-2: #1e1610; --wall-3: #1a120c;
    --toast-bg: rgba(30,22,16,.94);
    --flap: #c9c5bf;                   /* clock digits */
    --red: #e5484d;
    --display: "Inter Tight", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --clock: "Oswald", "DIN Condensed", "Bebas Neue", "Helvetica Neue", sans-serif;
    --font: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  html { background: var(--bg); }
  body {
    background:
      radial-gradient(70% 22% at 50% 37%, rgba(var(--glow-rgb),.16), transparent 70%),
      radial-gradient(60% 40% at 50% -5%, rgba(var(--tint-rgb),.07), transparent 70%),
      radial-gradient(120% 60% at 50% 120%, rgba(var(--floor-rgb),.22), transparent 60%),
      linear-gradient(180deg, var(--wall-1) 0%, var(--wall-2) 38%, var(--bg) 70%, var(--wall-3) 100%);
    background-attachment: fixed;
    color: var(--text); font-family: var(--font); font-size: 12.5px; line-height: 1.55; font-weight: 400;
    -webkit-font-smoothing: antialiased; min-height: 100vh;
  }
  button, textarea { font: inherit; color: inherit; }
  textarea { background: transparent; border: 0; outline: none; resize: none; width: 100%; }
  ::placeholder { color: var(--faint); }
  [hidden] { display: none !important; }

  .app { max-width: 1120px; margin: 0 auto; padding: 72px 40px 120px; }
  .app > header, .app > main, .app > .hero { max-width: 820px; }

  /* Header: title in the content column, like "Film Series" */
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 44px; }
  .head-left { display: flex; align-items: flex-end; gap: 28px; }
  .meta-left { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--dim); line-height: 1.9; }
  .meta-left b { color: var(--cream); font-weight: 600; }
  .title { font-family: var(--display); font-weight: 600; font-size: 26px; letter-spacing: -.03em; color: var(--cream); line-height: 1; }
  nav.links { display: flex; gap: 22px; }
  nav.links button { border: 0; background: none; padding: 0 0 3px; cursor: pointer; color: var(--dim);
    font-size: 9.5px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; border-bottom: 1px solid transparent; }
  nav.links button:hover { color: var(--cream); }
  nav.links button.on { color: var(--cream); border-bottom-color: var(--amber); box-shadow: 0 6px 12px -8px var(--amber-glow); }

  /* Split-flap clock + LED strip */
  .hero { position: relative; padding: 34px 0 0; margin-bottom: 40px; text-align: center; }
  .clock { display: inline-flex; align-items: flex-end; gap: 22px; font-family: var(--clock); font-weight: 600; color: var(--flap); line-height: .82;
    filter: drop-shadow(0 16px 22px rgba(0,0,0,.45)); }
  .clock .ampm { font-family: var(--font); font-size: 11px; font-weight: 600; letter-spacing: .14em; color: var(--flap); opacity: .85; margin-right: -6px; padding-bottom: 6px; }
  .clock .d { position: relative; font-size: 132px; letter-spacing: -.01em; line-height: 1.2; --seam: 53%; }
  /* split-flap seam: a real gap cut through the digits, so the wall shows through */
  .clock .d { -webkit-mask-image: linear-gradient(180deg, #000 calc(var(--seam) - 1.5px), transparent calc(var(--seam) - 1.5px), transparent calc(var(--seam) + 1.5px), #000 calc(var(--seam) + 1.5px));
              mask-image: linear-gradient(180deg, #000 calc(var(--seam) - 1.5px), transparent calc(var(--seam) - 1.5px), transparent calc(var(--seam) + 1.5px), #000 calc(var(--seam) + 1.5px)); }
  .clock .m { margin-left: 26px; }
  .led { height: 2px; margin: 46px 0 0; background: linear-gradient(90deg, transparent, var(--amber) 12%, var(--led-hot) 50%, var(--amber) 88%, transparent);
    box-shadow: 0 0 18px 2px var(--amber-glow), 0 -10px 60px 10px rgba(var(--glow-rgb),.18); border-radius: 2px; }

  /* Rows */
  .row { border-top: 1px solid var(--hair); }
  .row:last-child { border-bottom: 1px solid var(--hair); }
  .body { padding: 16px 0 20px; min-width: 0; }
  .cap { font-size: 9.5px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--amber); margin-bottom: 7px; display: flex; justify-content: space-between; gap: 6px 16px; flex-wrap: wrap; }
  .cap em { font-style: normal; color: var(--dim); font-weight: 500; }
  .lines { margin: 0; padding: 0; list-style: none; }
  /* Each line is its own statement: an LED tick mark on the left, a hairline between */
  .lines li, ol.rules li { position: relative; color: var(--text); padding: 9px 0 9px 22px; line-height: 1.5; }
  .lines li + li, ol.rules li + li { border-top: 1px solid rgba(var(--tint-rgb),.07); }
  .lines li::before, ol.rules li::before { content: ""; position: absolute; left: 0; top: 1.05em; width: 10px; height: 2px; border-radius: 2px;
    background: var(--amber); box-shadow: 0 0 6px var(--amber-glow); opacity: .85; }
  .lead { font-family: var(--display); color: var(--cream); font-size: 17px; letter-spacing: -.015em; line-height: 1.35; margin: 2px 0 10px; max-width: 560px; }
  .muted { color: var(--dim); }
  /* Alignment: starts white and fades into the LED amber, with the same glow */
  .lead.glow { color: var(--amber); background: linear-gradient(100deg, var(--glow-a) 0%, var(--glow-b) 35%, var(--amber) 75%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 10px rgba(var(--glow-rgb),.35)) drop-shadow(0 0 26px rgba(var(--glow-rgb),.18)); }

  /* Tasks */
  .task { display: grid; grid-template-columns: 72px 1fr auto 30px; gap: 14px; align-items: center; padding: 3px 0; }
  .task .t { white-space: nowrap; color: var(--faint); font-variant-numeric: tabular-nums; font-size: 11.5px; }
  .task .n { color: var(--text); }
  .task .s { font-size: 9px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--faint); }
  .task.done .n { color: var(--dim); }
  /* Tick = a short LED bar: unlit when open, glowing amber when done, red when missed */
  .tick { width: 30px; height: 22px; border: 0; background: none; padding: 0; cursor: pointer; position: relative; display: grid; place-items: center; }
  .tick::before { content: ""; width: 26px; height: 4px; border-radius: 4px; background: rgba(var(--tint-rgb),.14); box-shadow: inset 0 0 0 1px rgba(var(--tint-rgb),.12); transition: background .25s, box-shadow .25s; }
  .tick:hover:not(:disabled)::before, .tick:focus-visible::before { background: rgba(var(--accent-rgb),.35); }
  .tick:focus-visible { outline: none; }
  .tick:disabled { cursor: default; }
  .task.done .tick::before { background: linear-gradient(90deg, var(--amber), var(--led-hot) 50%, var(--amber)); box-shadow: 0 0 10px 1px var(--amber-glow), 0 0 22px 2px rgba(var(--glow-rgb),.25); }
  .task.missed .tick::before { background: rgba(229,72,77,.75); box-shadow: 0 0 8px rgba(229,72,77,.4); }
  .task.missed .n { color: var(--dim); text-decoration: line-through; text-decoration-color: rgba(255,255,255,.3); }
  .task.missed .s { color: var(--red); }

  /* Underline fields + text-link buttons */
  .account { display: grid; grid-template-columns: 1fr 1fr auto; gap: 18px; align-items: end; margin: 4px 0 10px 86px; }
  .account.ro { grid-template-columns: 1fr 1fr; }
  .field { border-bottom: 1px solid var(--hair); padding: 4px 0; }
  .field:focus-within { border-color: var(--amber); }
  .field .k { font-size: 9px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); margin-bottom: 2px; }
  .field textarea { min-height: 19px; line-height: 1.5; font-size: 12.5px; }
  .field.ro { border-bottom-color: transparent; }
  .link { border: 0; background: none; padding: 0 0 3px; cursor: pointer; color: var(--cream); border-bottom: 1px solid var(--amber);
    font-size: 9.5px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; white-space: nowrap; }
  .link:disabled { opacity: .3; cursor: default; }
  .link.red { color: var(--red); border-bottom-color: var(--red); }
  .seal-row { display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; }
  .hint { font-size: 12px; color: var(--faint); }
  .close-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; margin: 6px 0 22px; max-width: 620px; }
  .close-grid textarea { min-height: 40px; }

  /* Evidence */
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  /* Reminder cards */
  .toasts { position: fixed; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; z-index: 30; width: min(340px, calc(100vw - 32px)); }
  .toast { background: var(--toast-bg); border: 1px solid rgba(var(--accent-rgb),.35); border-radius: 12px; padding: 14px 16px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 0 24px -6px var(--amber-glow), 0 18px 40px rgba(0,0,0,.5); animation: rise .3s ease; }
  .toast-k { font-size: 9.5px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--amber); }
  .toast-m { color: var(--cream); font-size: 14px; margin: 4px 0 12px; }
  .toast-a { display: flex; gap: 18px; }
  .muted-link { color: var(--dim); border-bottom-color: var(--hair); }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  @media (max-width: 720px) { .toasts { left: 16px; right: 16px; width: auto; } }

  /* Onboarding */
  .onboard { max-width: 640px; }
  .ob-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  .ob-step { font-size: 10px; font-weight: 600; letter-spacing: .22em; color: var(--dim); }
  .ob-bar { height: 2px; background: rgba(var(--tint-rgb),.12); border-radius: 2px; margin-bottom: 28px; overflow: hidden; }
  .ob-bar i { display: block; height: 100%; background: var(--amber); box-shadow: 0 0 10px var(--amber-glow); transition: width .3s; }
  .ob-q { font-size: clamp(24px, 6vw, 32px); line-height: 1.2; margin: 6px 0 14px; font-weight: 400; }
  .ob-p { margin: 0 0 20px; max-width: 520px; }
  .ob-field { display: block; margin-bottom: 18px; }
  .ob-field textarea, .ob-field input, .ob-task input { width: 100%; background: transparent; border: 0; outline: none; color: var(--cream); font: inherit; font-size: 15px; line-height: 1.55; padding: 4px 0; resize: vertical; }
  .ob-looks .dp { padding: 12px 20px; font-size: 12px; }
  .ob-restore { margin-top: 28px; display: inline-block; }
  .ob-nav { display: flex; justify-content: space-between; align-items: center; gap: 18px; margin-top: 28px; }
  .ob-hint { margin-top: 12px; min-height: 1.4em; }
  .ob-tasks { display: grid; gap: 6px; margin-bottom: 14px; }
  .ob-task { display: grid; grid-template-columns: 110px minmax(0, 1fr) 24px; gap: 14px; align-items: end; }
  .ob-task input::-webkit-calendar-picker-indicator, .ob-field input::-webkit-calendar-picker-indicator { filter: invert(.75) sepia(.6); opacity: .7; }
  .ob-del { font-size: 18px; padding-bottom: 6px; }
  .ob-review .cap { margin-top: 18px; }
  .ob-ideas .dp { font-size: 10px; padding: 6px 11px; letter-spacing: .08em; }
  .lines.low li { color: var(--dim); }
  .lines.low li::before { background: var(--faint); box-shadow: none; }
  .ob-code { white-space: pre-wrap; word-break: break-all; font: 12px/1.6 ui-monospace, Menlo, monospace; color: var(--cream); background: rgba(var(--tint-rgb),.06);
    border: 1px solid var(--hair); border-radius: 10px; padding: 14px; margin: 0 0 14px; max-height: 220px; overflow: auto; user-select: all; -webkit-user-select: all; }

  /* Settings */
  .shift-list { display: grid; gap: 4px; margin: 4px 0 20px; }
  .shift-row { display: grid; grid-template-columns: 96px minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: end; padding: 4px 0; }
  .shift-row .dp { justify-self: start; }
  .shift-row:not(.on) .field { opacity: .3; }
  .shift-row.past { opacity: .45; }
  .shift-row input { background: transparent; border: 0; outline: none; color: var(--cream); font: inherit; font-size: 14px; padding: 2px 0; width: 100%; }
  .shift-row input::-webkit-calendar-picker-indicator { filter: invert(.75) sepia(.6); opacity: .7; }
  .set-label { font-size: 9px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); margin-bottom: 8px; }
  .day-pick { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .dp { border: 1px solid var(--hair); background: none; color: var(--dim); border-radius: 999px; padding: 6px 12px; font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; }
  .dp:hover, .dp:focus-visible { border-color: var(--amber); color: var(--cream); outline: none; }
  .dp.on { background: rgba(var(--accent-rgb),.16); border-color: var(--amber); color: var(--amber); }
  .set-times { display: grid; grid-template-columns: repeat(2, minmax(0, 160px)); gap: 22px; margin-bottom: 22px; }
  .set-times input { background: transparent; border: 0; outline: none; color: var(--cream); font: inherit; font-size: 15px; padding: 2px 0; width: 100%; }
  .set-times input::-webkit-calendar-picker-indicator { filter: invert(.75) sepia(.6); opacity: .7; }

  /* Evidence calendar */
  .cal { text-align: center; padding: 0 0 36px; }
  .cal-top { margin-bottom: -14px; }
  .cal-year { font-size: 15px; font-weight: 500; letter-spacing: .3em; color: var(--dim); }
  .cal-head { display: grid; grid-template-columns: 64px minmax(0, 1fr) 64px; align-items: center; margin: 2px 0 6px; }
  /* Month set like the clock: split-flap letters with the wall showing through the seam */
  .cal-month { margin: 0; font-family: var(--clock); font-weight: 600; font-size: clamp(52px, 11vw, 112px); letter-spacing: .01em; line-height: 1.2;
    text-transform: uppercase; color: var(--flap); --seam: 64%; filter: drop-shadow(0 16px 22px rgba(0,0,0,.45));
    -webkit-mask-image: linear-gradient(180deg, #000 calc(var(--seam) - 1.5px), transparent calc(var(--seam) - 1.5px), transparent calc(var(--seam) + 1.5px), #000 calc(var(--seam) + 1.5px));
            mask-image: linear-gradient(180deg, #000 calc(var(--seam) - 1.5px), transparent calc(var(--seam) - 1.5px), transparent calc(var(--seam) + 1.5px), #000 calc(var(--seam) + 1.5px)); }
  .cal-nav { justify-self: center; width: 56px; height: 56px; border-radius: 50%; border: 1px solid transparent; background: none; color: var(--text); font-size: 30px; line-height: 1; cursor: pointer; padding: 0 0 4px; }
  .cal-nav.ring-btn { border-color: var(--hair); }
  .cal-nav:hover:not(:disabled), .cal-nav:focus-visible { color: var(--cream); border-color: var(--amber); box-shadow: 0 0 18px -6px var(--amber-glow); outline: none; }
  .cal-nav:disabled { opacity: .35; cursor: default; }
  .cal-sub { font-size: 12px; font-weight: 600; letter-spacing: .3em; text-transform: uppercase; color: var(--amber); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 12px; }
  .cal-w { font-size: 13px; font-weight: 500; letter-spacing: .1em; color: var(--dim); padding-bottom: 12px; }
  .cal-cell { min-height: 96px; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 6px 2px; border: 0; background: none; border-radius: 10px; font: inherit; color: inherit; }
  .cal-cell.live { cursor: pointer; }
  .cal-cell.live:hover, .cal-cell.live:focus-visible { background: rgba(var(--tint-rgb),.05); outline: none; }
  .cal-cell.sel { background: rgba(var(--tint-rgb),.07); box-shadow: inset 0 0 0 1px var(--hair); }
  .dn { font-family: var(--display); font-size: 30px; font-weight: 400; color: var(--dim); font-variant-numeric: tabular-nums; line-height: 1.1; }
  .cal-cell.live .dn { color: var(--cream); }
  .cal-cell.mute .dn { color: var(--faint); }
  .cal-cell.today .dn { color: var(--amber); text-shadow: 0 0 18px var(--amber-glow); }
  .ring { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--dim); margin: 4px 0; }
  .chip { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--amber); background: rgba(var(--accent-rgb),.14); border-radius: 6px; padding: 3px 8px; }
  .chip.drift { color: #ec8f84; background: rgba(229,72,77,.15); }
  .dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; max-width: 100%; }
  .dots i { width: 4px; height: 4px; border-radius: 50%; background: rgba(var(--tint-rgb),.16); }
  .dots i.on { background: var(--amber); box-shadow: 0 0 6px var(--amber-glow); }
  ol.rules { margin: 0; padding: 0; list-style: none; counter-reset: r; }

  /* ---------- Salt lamp — glowing pink-orange crystal, ember room, dusk at the window ---------- */
  :root[data-look="salt"] {
    --bg: #160805;
    --cream: #ffe4d3;
    --text: #f3d2c1;
    --dim: #c58f78;
    --faint: #8a5848;
    --hair: rgba(255,160,120,.15);
    --amber: #ff8a4a;
    --amber-glow: rgba(255,110,50,.55);
    --flap: #ffd8c2;
    --tint-rgb: 255,175,140;
    --glow-rgb: 255,115,55;
    --accent-rgb: 255,138,74;
    --floor-rgb: 190,80,40;
    --led-hot: #ffd0a8;
    --glow-a: #fff4ec; --glow-b: #ffbf9a;
    --wall-1: #3a150a; --wall-2: #26100a; --wall-3: #1d0b07;
    --toast-bg: rgba(42,16,10,.94);
  }
  :root[data-look="salt"] body {
    background:
      radial-gradient(55% 30% at 50% 34%, rgba(255,120,55,.30), transparent 72%),
      radial-gradient(40% 22% at 50% 36%, rgba(255,180,120,.14), transparent 70%),
      radial-gradient(45% 50% at 100% 0%, rgba(40,48,92,.35), transparent 70%),
      radial-gradient(120% 60% at 50% 120%, rgba(190,80,40,.26), transparent 60%),
      linear-gradient(180deg, var(--wall-1) 0%, var(--wall-2) 38%, var(--bg) 70%, var(--wall-3) 100%);
    background-attachment: fixed;
  }
  :root[data-look="salt"] .clock, :root[data-look="salt"] .cal-month { filter: drop-shadow(0 0 22px rgba(255,120,60,.35)) drop-shadow(0 14px 20px rgba(0,0,0,.45)); }

  /* Phone — must stay last so it overrides the desktop rules above */
  @media (max-width: 720px) {
    body { font-size: 12px; }
    .app { padding-block: 28px 64px; padding-inline: 16px; }
    header { flex-wrap: wrap; gap: 14px; margin-bottom: 18px; }
    .title { font-size: 21px; }
    nav.links { gap: 18px; }
    .hero { padding-top: 10px; margin-bottom: 22px; }
    .clock .d { font-size: 64px; }
    .clock .m { margin-left: 10px; }
    .clock { gap: 12px; }
    .led { margin-top: 26px; }
    .lead { font-size: 15px; }
    .body { padding: 12px 0 16px; }
    .account, .close-grid { grid-template-columns: 1fr; margin-left: 0; }
    .task { grid-template-columns: 64px 1fr auto 30px; gap: 10px; }
    .cal-top { margin-bottom: -6px; }
    .cal-year { font-size: 12px; }
    .cal-month { font-size: 52px; }
    .cal-sub { font-size: 10px; letter-spacing: .26em; }
    .cal-head { grid-template-columns: 40px minmax(0, 1fr) 40px; }
    .cal-nav { width: 38px; height: 38px; font-size: 22px; }
    .cal-grid { row-gap: 4px; }
    .cal-w { font-size: 11px; padding-bottom: 6px; }
    .cal-cell { min-height: 50px; gap: 5px; padding: 4px 0; border-radius: 8px; }
    .dn { font-size: 16px; }
    .chip { display: none; }
    .ring { width: 6px; height: 6px; margin: 0; }
    .dots { gap: 1.5px; max-width: 40px; }
    .dots i { width: 3px; height: 3px; }
    .set-times { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="head-left">
      <div class="title">Higher Self</div>
      <div class="meta-left"><div id="clockDate"></div><b id="dayN"></b></div>
    </div>
      <nav class="links" id="tabs">
        <button data-tab="today" class="on">Today</button>
        <button data-tab="vision">The Vision</button>
        <button data-tab="evidence">Evidence</button>
        <button data-tab="settings">Settings</button>
      </nav>
  </header>
  <div class="hero" aria-label="Current time">
    <div class="clock" id="clock"><span class="ampm" id="ampm"></span><span class="d" id="hh"></span><span class="d m" id="mm"></span></div>
    <div class="cal-top" id="heroMonth" hidden></div>
    <div class="led"></div>
  </div>
  <main>
    <section data-view="today" id="vToday"></section>
    <section data-view="vision" id="vVision" hidden></section>
    <section data-view="evidence" id="vEvidence" hidden></section>
    <section data-view="settings" id="vSettings" hidden></section>
  </main>
  <div class="toasts" id="toasts" aria-live="polite"></div>
</div>

<script>
/* =====================================================================
   HIGHER SELF — START. Same engine as the original, but the blueprint is
   built from her answers on first open, then locked. A recovery code
   (the blueprint itself, compressed) brings it back after a delete.
   ===================================================================== */
const BP_KEY = 'hs-start.blueprint', LOG_KEY = 'hs-start.log', SET_KEY = 'hs-start.settings';
const BLUEPRINT = (() => { try { const b = JSON.parse(localStorage.getItem(BP_KEY)); return b && b.nonNegotiables ? b : null; } catch { return null; } })();

// ---------- Recovery code: blueprint → deflate → base64url, prefixed HS1. ----------
const HSCode = {
  async encode(obj) {
    const bytes = new TextEncoder().encode(JSON.stringify(obj));
    let out = bytes, tag = 'HS0.';
    try {
      const cs = new CompressionStream('deflate-raw');
      out = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(cs)).arrayBuffer()); tag = 'HS1.';
    } catch {}
    let bin = ''; out.forEach(b => bin += String.fromCharCode(b));
    const b64 = btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    return tag + b64.replace(/(.{48})/g, '$1 ').trim();
  },
  async decode(code) {
    const s = String(code || '').replace(/\s+/g, '');
    const m = s.match(/^HS([01])\.([A-Za-z0-9_-]+)$/);
    if (!m) throw new Error('shape');
    const b64 = m[2].replace(/-/g, '+').replace(/_/g, '/');
    const bin = atob(b64 + '==='.slice((b64.length + 3) % 4));
    let bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
    if (m[1] === '1') bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
    const bp = JSON.parse(new TextDecoder().decode(bytes));
    if (!bp || !Array.isArray(bp.nonNegotiables) || !bp.identity) throw new Error('content');
    return bp;
  },
};

// ---------- First open: theme, then the questions ----------
if (!BLUEPRINT) (() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const lines = s => String(s || '').split('\n').map(x => x.replace(/^[-•\s]+/, '').trim()).filter(Boolean);
  const dkey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const tomorrow = () => { const d = new Date(); d.setDate(d.getDate() + 1); return dkey(d); };
  const to12 = hm => { let [a, b] = hm.split(':').map(Number); const ap = a < 12 ? 'am' : 'pm'; a = a % 12 || 12; return `${a}:${String(b).padStart(2, '0')}${ap}`; };
  const partOf = hm => { const [a, b] = hm.split(':').map(Number), m = a * 60 + b; return m < 720 ? 'Morning' : m < 1080 ? 'Midday' : 'Evening'; };

  let settings; try { settings = JSON.parse(localStorage.getItem(SET_KEY)) || {}; } catch { settings = {}; }
  const look = l => { document.documentElement.dataset.look = l; settings.look = l; try { localStorage.setItem(SET_KEY, JSON.stringify(settings)); } catch {} };
  look(settings.look === 'night' ? 'night' : 'salt');

  const AREAS = ['Body', 'Mind & Spirit', 'Wealth', 'Career', 'Relationships', 'Home & Environment', 'Creativity', 'Contribution'];
  const A = { look: settings.look, statement: '', areas: [], area: {}, tasks: [], raises: '', lowers: '', rules: '', dayOne: tomorrow() };
  try { Object.assign(A, JSON.parse(sessionStorage.getItem('hs-start.draft')) || {}); } catch {}
  const keep = () => { try { sessionStorage.setItem('hs-start.draft', JSON.stringify(A)); } catch {} };

  // The order works backwards: who she is → each area of her life → what she does daily → the rules.
  let only = null;                   // show one step outside the numbered flow (restore, code)
  const steps = () => only ? [only] : ['theme', 'alignment', 'areas', ...A.areas.map((_, i) => 'area:' + i), 'frequency', 'day', 'rules', 'start', 'review'];
  let at = 0;

  document.querySelector('.app').hidden = true;
  const root = document.createElement('div'); root.className = 'app onboard'; document.body.prepend(root);

  const frame = (cap, title, body, { back = true, next = 'Continue', hint = '' } = {}) => `
    <div class="ob-top"><div class="title">Higher Self</div><div class="ob-step">${at + 1} / ${steps().length}</div></div>
    <div class="ob-bar"><i style="width:${Math.round((at + 1) / steps().length * 100)}%"></i></div>
    <div class="row"><div class="body">
      <div class="cap"><span>${cap}</span></div>
      <h1 class="lead glow ob-q">${title}</h1>
      ${body}
      <div class="ob-nav">${back && at ? `<button class="link muted-link" id="obBack">Back</button>` : '<span></span>'}
        <button class="link" id="obNext">${next}</button></div>
      <div class="hint ob-hint" id="obHint">${hint}</div>
    </div></div>`;

  const area = (i) => A.area[A.areas[i]] ||= { vision: '', truths: '' };

  function render() {
    const st = steps()[at];
    let html = '';
    if (st === 'theme') html = frame('Welcome', 'Pick the light you want to live in.', `
      <p class="muted ob-p">You'll answer a few questions about your higher self. From them, this builds your daily process. Once it's locked in, it can't be changed, only lived.</p>
      <div class="day-pick ob-looks">
        <button type="button" class="dp ob-look ${A.look === 'salt' ? 'on' : ''}" data-l="salt">Salt lamp</button>
        <button type="button" class="dp ob-look ${A.look === 'night' ? 'on' : ''}" data-l="night">Night room</button>
      </div>
      <button class="link muted-link ob-restore" id="obRestore">I already have a recovery code</button>`, { next: 'Begin' });
    if (st === 'restore') html = frame('Recovery', 'Paste your recovery code.', `
      <label class="field ob-field"><span class="k">Code</span><textarea id="obCode" rows="6" placeholder="HS1.…" spellcheck="false" autocapitalize="off"></textarea></label>`,
      { next: 'Restore my process' });
    if (st === 'alignment') html = frame('Alignment', 'Who is she? Write it as if it is already true.', `
      <p class="muted ob-p">This is what you'll read at the top of every day. Present tense. Not who you're trying to become, who you already are.</p>
      <label class="field ob-field"><span class="k">My alignment statement</span>
        <textarea id="obStatement" rows="5" placeholder="I am calm, radiant and abundant. I move with intention. Everything I need is already on its way to me.">${esc(A.statement)}</textarea></label>`);
    if (st === 'areas') html = frame('Her life', 'Which areas of her life matter most?', `
      <p class="muted ob-p">Pick two to five. Each one becomes part of your vision, and you'll work backwards from it to what you do daily.</p>
      <div class="day-pick">${[...new Set([...AREAS, ...A.areas])].map(a => `<button type="button" class="dp ob-area ${A.areas.includes(a) ? 'on' : ''}" data-a="${esc(a)}">${esc(a)}</button>`).join('')}</div>
      <label class="field ob-field"><span class="k">Add your own</span><input id="obAreaNew" placeholder="e.g. Motherhood, Travel, Faith"></label>
      <button class="link muted-link" id="obAreaAdd">Add area</button>`);
    if (st.startsWith('area:')) { const i = +st.split(':')[1], a = area(i);
      html = frame(A.areas[i], `In ${esc(A.areas[i].toLowerCase())}, how does she live?`, `
      <label class="field ob-field"><span class="k">The vision, in one sentence</span>
        <textarea id="obVision" rows="2" placeholder="I am strong, glowing and at home in my body.">${esc(a.vision)}</textarea></label>
      <label class="field ob-field"><span class="k">What must be true about her here? One per line</span>
        <textarea id="obTruths" rows="6" placeholder="I move my body every morning.&#10;I eat food that loves me back.&#10;I'm in bed by 10.">${esc(a.truths)}</textarea></label>`); }
    if (st === 'frequency') {
      const RAISE = ['A morning routine', 'Training every day', 'Going for walks', 'Reading books', 'Educational videos', 'Time with high-frequency people', 'Sunlight and fresh air', 'Journaling', 'Meditation or prayer', 'Cooking a nourishing meal'];
      const LOWER = ['Netflix binges', 'Binge eating', 'Scrolling social media', 'Talking to low-frequency people', 'Gossip and complaining', 'Staying up late', 'Skipping my routine', 'Comparing myself to others'];
      const chips = (list, f) => `<div class="day-pick ob-ideas">${list.map(x => `<button type="button" class="dp ob-idea" data-f="${f}" data-x="${esc(x)}">+ ${esc(x)}</button>`).join('')}</div>`;
      html = frame('Frequency', 'What raises her frequency, and what lowers it?', `
      <p class="muted ob-p">The goal is simple: do more of what raises you, and none of what pulls you down. Write your own, one per line. Tap an idea to add it if it's true for you.</p>
      <label class="field ob-field"><span class="k">Raises my frequency</span>
        <textarea id="obRaises" rows="5" placeholder="What leaves you lit up, clear and high?">${esc(A.raises)}</textarea></label>
      <div class="set-label">Ideas</div>${chips(RAISE, 'obRaises')}
      <label class="field ob-field" style="margin-top:22px"><span class="k">Lowers my frequency</span>
        <textarea id="obLowers" rows="5" placeholder="What leaves you heavy, foggy or low?">${esc(A.lowers)}</textarea></label>
      <div class="set-label">Ideas</div>${chips(LOWER, 'obLowers')}`, { hint: 'Next, you\'ll build your daily process. Fill it with what raises you.' });
    }
    if (st === 'day') {
      if (!A.tasks.length) A.tasks = [{ time: '06:00', title: '' }, { time: '07:00', title: '' }, { time: '12:00', title: '' }, { time: '21:00', title: '' }];
      html = frame('Daily process', 'Now walk through her day. What does she do, and when?', `
      <p class="muted ob-p">These become your non-negotiables: the boxes you tick every day. Work backwards from everything you just wrote. Leave a row empty to skip it.</p>
      <div class="ob-tasks">${A.tasks.map((t, n) => `
        <div class="ob-task" data-n="${n}">
          <label class="field"><span class="k">Time</span><input type="time" data-f="time" value="${esc(t.time)}"></label>
          <label class="field"><span class="k">She…</span><input data-f="title" value="${esc(t.title)}" placeholder="${['Wakes up and journals','Moves her body','Eats a nourishing first meal','Phone away, lights out'][n] || 'Does…'}"></label>
          <button class="link muted-link ob-del" data-del="${n}" aria-label="Remove">×</button>
        </div>`).join('')}</div>
      <button class="link muted-link" id="obAddTask">Add another</button>`, { hint: 'Work shifts are added separately in Settings, week by week.' });
    }
    if (st === 'rules') html = frame('The rules', 'What rules hold it all together?', `
      <p class="muted ob-p">The lines she doesn't cross. One per line.</p>
      <label class="field ob-field"><span class="k">My rules</span>
        <textarea id="obRules" rows="7" placeholder="I don't negotiate with myself.&#10;No phone for the first hour.&#10;A day counts if I did the work.">${esc(A.rules)}</textarea></label>`);
    if (st === 'start') html = frame('Day 1', 'When does she start?', `
      <label class="field ob-field" style="max-width:220px"><span class="k">Day 1</span><input type="date" id="obDay1" value="${esc(A.dayOne)}" min="${dkey()}"></label>
      <p class="muted ob-p">Until then it's practice: you can tick things, but nothing counts or locks.</p>`);
    if (st === 'review') {
      const tasks = A.tasks.filter(t => t.title.trim()).sort((a, b) => a.time.localeCompare(b.time));
      html = frame('Review', 'This is her. Read it once more.', `
      <div class="ob-review">
        <div class="cap"><span>Alignment</span></div><div class="lead glow">${esc(A.statement)}</div>
        ${A.areas.map(a => `<div class="cap"><span>${esc(a)}</span></div><div class="lead glow">${esc(A.area[a]?.vision)}</div>
          <ul class="lines">${lines(A.area[a]?.truths).map(t => `<li>${esc(t)}</li>`).join('')}</ul>`).join('')}
        <div class="cap"><span>Daily process</span></div>
        ${tasks.map(t => `<div class="task"><div class="t">${to12(t.time)}</div><div class="n">${esc(t.title)}</div><div class="s"></div><span></span></div>`).join('')}
        ${lines(A.raises).length ? `<div class="cap"><span>Raises my frequency</span></div><ul class="lines">${lines(A.raises).map(t => `<li>${esc(t)}</li>`).join('')}</ul>` : ''}
        ${lines(A.lowers).length ? `<div class="cap"><span>Lowers my frequency</span></div><ul class="lines low">${lines(A.lowers).map(t => `<li>${esc(t)}</li>`).join('')}</ul>` : ''}
        ${lines(A.rules).length ? `<div class="cap"><span>The rules</span></div><ul class="lines">${lines(A.rules).map(t => `<li>${esc(t)}</li>`).join('')}</ul>` : ''}
      </div>
      <p class="muted ob-p">Once you lock it in, it can't be edited. The only way to change it is Reset in Settings.</p>`, { next: 'Lock it in' });
    }
    if (st === 'code') html = `
      <div class="ob-top"><div class="title">Higher Self</div></div>
      <div class="row"><div class="body">
        <div class="cap"><span>Your recovery code</span></div>
        <h1 class="lead glow ob-q">Locked in. Save this code somewhere safe.</h1>
        <p class="muted ob-p">If you ever delete the app, change phone or reset, paste this code on the first screen and your whole process comes straight back. Screenshot it or save it in your notes.</p>
        <pre class="ob-code" id="obCodeOut">Making your code…</pre>
        <div class="ob-nav"><button class="link muted-link" id="obCopy">Copy code</button><button class="link" id="obDone">I've saved it. Start.</button></div>
        <div class="hint ob-hint" id="obHint">You can find this code again any time in Settings.</div>
      </div></div>`;
    root.innerHTML = html;
    bind(st);
    window.scrollTo(0, 0);
  }

  const hint = t => { const h = $('#obHint'); if (h) h.textContent = t; };
  function collect(st) {
    if (st === 'alignment') A.statement = $('#obStatement').value.trim();
    if (st.startsWith('area:')) { const a = area(+st.split(':')[1]); a.vision = $('#obVision').value.trim(); a.truths = $('#obTruths').value; }
    if (st === 'day') A.tasks = [...root.querySelectorAll('.ob-task')].map(r => ({ time: r.querySelector('[data-f=time]').value || '12:00', title: r.querySelector('[data-f=title]').value }));
    if (st === 'rules') A.rules = $('#obRules').value;
    if (st === 'frequency') { A.raises = $('#obRaises').value; A.lowers = $('#obLowers').value; }
    if (st === 'start') A.dayOne = $('#obDay1').value || tomorrow();
    keep();
  }
  function valid(st) {
    if (st === 'alignment' && A.statement.length < 10) return 'Write a sentence or two. This is the heart of it.';
    if (st === 'areas' && !A.areas.length) return 'Pick at least one area.';
    if (st.startsWith('area:') && !area(+st.split(':')[1]).vision) return 'Give this area a one-sentence vision.';
    if (st === 'day' && !A.tasks.some(t => t.title.trim())) return 'Add at least one thing she does every day.';
    return '';
  }

  function build() {
    const tasks = A.tasks.filter(t => t.title.trim()).sort((a, b) => a.time.localeCompare(b.time));
    return {
      v: 1,
      identity: { name: '', statement: A.statement, dayOne: A.dayOne },
      rules: lines(A.rules),
      frequency: { raises: lines(A.raises), lowers: lines(A.lowers) },
      nonNegotiables: [
        ...tasks.map((t, n) => ({ id: 't' + n, time: to12(t.time), part: partOf(t.time), title: t.title.trim() })),
        { id: 'leave', shift: 'leave', part: 'Morning', title: 'Leave for work' },
        { id: 'work', shift: true, part: 'Midday', title: 'Work' },
      ],
      pillars: A.areas.map(a => ({ name: a, vision: A.area[a]?.vision || '', truths: lines(A.area[a]?.truths) })),
      look: A.look,
    };
  }

  function bind(st) {
    $('#obBack') && ($('#obBack').onclick = () => { if (st !== 'restore') collect(st); at = Math.max(0, at - 1); render(); });
    root.querySelectorAll('.ob-look').forEach(b => b.onclick = () => { A.look = b.dataset.l; look(A.look); keep(); render(); });
    $('#obRestore') && ($('#obRestore').onclick = renderRestore);
    root.querySelectorAll('.ob-idea').forEach(b => b.onclick = () => {
      const ta = $('#' + b.dataset.f), cur = lines(ta.value);
      if (!cur.includes(b.dataset.x)) ta.value = [...cur, b.dataset.x].join('\n');
      b.classList.add('on'); b.disabled = true; collect(st);
    });
    root.querySelectorAll('.ob-area').forEach(b => b.onclick = () => {
      const a = b.dataset.a; A.areas = A.areas.includes(a) ? A.areas.filter(x => x !== a) : [...A.areas, a]; keep(); render(); });
    $('#obAreaAdd') && ($('#obAreaAdd').onclick = () => { const v = $('#obAreaNew').value.trim(); if (v && !A.areas.includes(v)) { A.areas.push(v); keep(); } render(); });
    $('#obAddTask') && ($('#obAddTask').onclick = () => { collect(st); A.tasks.push({ time: '12:00', title: '' }); render(); });
    root.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { collect(st); A.tasks.splice(+b.dataset.del, 1); render(); });
    if (st === 'code') {
      const bp = build();
      HSCode.encode(bp).then(code => {
        $('#obCodeOut').textContent = code;
        $('#obCopy').onclick = () => navigator.clipboard?.writeText(code).then(() => hint('Copied.'), () => { getSelection().selectAllChildren($('#obCodeOut')); hint('Selected. Copy it from here.'); });
      });
      $('#obDone').onclick = () => { try { sessionStorage.removeItem('hs-start.draft'); } catch {} location.reload(); };
      return;
    }
    $('#obNext').onclick = () => {
      collect(st);
      const err = valid(st); if (err) return hint(err);
      if (st === 'review') {
        try { localStorage.setItem(BP_KEY, JSON.stringify(build())); } catch { return hint("Couldn't save on this device. Is private browsing on?"); }
        only = 'code'; at = 0; render(); return;
      }
      at++; render();
    };
  }
  function renderRestore() {
    only = 'restore'; at = 0; render();
    root.querySelector('.ob-nav').insertAdjacentHTML('afterbegin', '<button class="link muted-link" id="obBack2">Back</button>');
    $('#obBack2').onclick = () => { only = null; at = 0; render(); };
    $('#obNext').onclick = async () => {
      try {
        const bp = await HSCode.decode($('#obCode').value);
        localStorage.setItem(BP_KEY, JSON.stringify(bp));
        if (bp.look) look(bp.look);
        location.reload();
      } catch { hint("That code didn't work. Check it was copied in full, from HS to the end."); }
    };
  }

  render();
})();

(() => {
  if (!BLUEPRINT) return;            // still answering the questions
  const KEY = LOG_KEY;
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const dkey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const fromKey = k => new Date(k + 'T00:00:00');
  const addDays = (k, n) => { const d = fromKey(k); d.setDate(d.getDate() + n); return dkey(d); };
  const nice = k => fromKey(k).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });

  const NN = BLUEPRINT.nonNegotiables;

  // ---------- Settings: the work shift (the only part of the blueprint that can change) ----------
  // Each change is kept with the date it took effect, so past days keep the shift they had.
  const SKEY = SET_KEY;
  let settings;
  try { settings = JSON.parse(localStorage.getItem(SKEY)) || {}; } catch { settings = {}; }
  settings.shifts ||= {};            // { 'YYYY-MM-DD': { start, end } }: only the dates you actually work
  settings.remind ??= 10;            // minutes before each task; 0 = off
  const LOOKS = { night: { name: 'Night room', meta: '#150f0b' }, salt: { name: 'Salt lamp', meta: '#160805' } };
  const applyLook = () => {
    const look = LOOKS[settings.look] ? settings.look : (BLUEPRINT.look || 'salt');
    document.documentElement.dataset.look = look;
    document.querySelector('meta[name="theme-color"]')?.setAttribute('content', LOOKS[look].meta);
  };
  applyLook();
  const saveSettings = () => { try { localStorage.setItem(SKEY, JSON.stringify(settings)); } catch {} };
  // Day 1 is the blueprint's start date, or a later reset date, whichever comes last.
  const DAY1 = [BLUEPRINT.identity.dayOne, settings.dayOne].filter(Boolean).sort().pop() || dkey();
  const shiftOn = k => settings.shifts[k] || null;
  const mins = hm => { const [a, b] = hm.split(':').map(Number); return a * 60 + b; };
  const clock12 = (hm, short) => {
    let [a, b] = hm.split(':').map(Number); const ap = a < 12 ? 'am' : 'pm'; a = a % 12 || 12;
    return short && b === 0 ? `${a}${ap}` : `${a}:${String(b).padStart(2, '0')}${ap}`;
  };
  const WD = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  // Work and Leave for work exist only on dates with a shift entered for that week.
  const shiftItem = (i, k) => {
    const w = shiftOn(k);
    if (!w) return null;
    if (i.shift === 'leave') {
      const m = Math.max(0, mins(w.start) - 30), hm = `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`;
      return { ...i, time: clock12(hm), part: m < 600 ? 'Morning' : m < 1020 ? 'Midday' : 'Evening', sortMin: m - 0.5 };
    }
    const m = mins(w.start);
    return { ...i, time: clock12(w.start), title: `Work, ${clock12(w.start, true)}–${clock12(w.end, true)}`,
             part: m < 600 ? 'Morning' : m < 1020 ? 'Midday' : 'Evening', sortMin: m };
  };
  // A task's place in the day: its own time, or (for "All day") the task before it.
  const withOrder = list => { let last = -1; return list.map((i, n) => {
    const t = i.sortMin ?? (/\d/.test(i.time || '') ? (() => { const [, a, b, ap] = i.time.match(/(\d+):(\d+)(am|pm)/); return (+a % 12 + (ap === 'pm' ? 12 : 0)) * 60 + +b; })() : null);
    last = t ?? last + 0.01; return { ...i, sortMin: last, n };
  }).sort((a, b) => a.sortMin - b.sortMin || a.n - b.n); };
  const NNfor = k => withOrder(NN.map(i => i.shift ? shiftItem(i, k) : i).filter(Boolean)).filter(i => !i.days || i.days.includes(fromKey(k).getDay()));

  // ---------- Log (the only thing that's written at runtime) ----------
  let log;
  try { log = JSON.parse(localStorage.getItem(KEY)) || {}; } catch { log = {}; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(log)); } catch {} };
  const day = k => (log[k] ||= { done: {}, missed: {}, close: null });

  // Open all day. It only locks once the day is closed, or the day has passed.
  function status(item, k) {
    const d = log[k];
    if (d && d.done[item.id]) return 'done';
    if (k < DAY1) return 'open';
    if (k < dkey() || d?.close) return 'missed';
    return 'open';
  }
  const dayScore = k => {
    const L = NNfor(k);
    if (!L.length || k < DAY1) return null;
    const done = L.filter(i => log[k]?.done[i.id]).length;
    return done / L.length;
  };

  // ---------- Building blocks ----------
  const pad = n => String(n).padStart(2, '0');
  const row = (cap, body, capRight = '') => `
    <div class="row">
      <div class="body"><div class="cap"><span>${cap}</span>${capRight ? `<em>${capRight}</em>` : ''}</div>${body}</div>
    </div>`;
  const prologue = (right = '') => row('Alignment', `<div class="lead glow">${esc(BLUEPRINT.identity.statement)}</div>`, right);

  // ---------- Today ----------
  function missedFields(ids, k, whole) {
    const m = log[k]?.missed[ids.split(',')[0]];
    if (m) return `<div class="account ro">
        <div class="field ro"><div class="k">Why I missed it</div>${esc(m.why)}</div>
        <div class="field ro"><div class="k">What I do better tomorrow</div>${esc(m.better)}</div></div>`;
    return `<div class="account" data-account="${ids}" data-day="${k}">
      <div class="field"><div class="k">Why did I miss ${whole ? 'the day' : 'this'}?</div><textarea rows="1" data-f="why" placeholder="What happened?"></textarea></div>
      <div class="field"><div class="k">What do I do better tomorrow?</div><textarea rows="1" data-f="better" placeholder="The one change"></textarea></div>
      <button class="link red" data-seal disabled>Own it</button>
    </div>`;
  }
  function task(item, k) {
    const s = status(item, k);
    return `<div class="task ${s}">
        <div class="t">${esc(item.time || '')}</div>
        <div class="n">${esc(item.title)}</div>
        <div class="s">${s === 'done' ? 'Done' : s === 'missed' ? 'Missed' : ''}</div>
        ${(() => { const live = k === dkey() && !log[k]?.close && s !== 'missed';   // today, not yet sealed: tick and untick freely
          return `<button class="tick" data-tick="${item.id}" ${live ? '' : 'disabled'} aria-pressed="${s === 'done'}" title="${!live ? 'Locked' : s === 'done' ? 'Untick' : 'Done'}"></button>`; })()}
      </div>${s === 'missed' ? missedFields(item.id, k) : ''}`;
  }
  const PARTS = ['Morning', 'Midday', 'Evening'];

  function renderToday() {
    const v = $('#vToday');
    const k = dkey(), d = day(k), T = NNfor(k);
    const doneN = T.filter(i => d.done[i.id]).length;

    // Yesterday's unaccounted misses must be owned first. Older ones are simply logged as missed.
    let owed = '';
    const pk = addDays(k, -1);
    if (pk >= DAY1) {
      const items = NNfor(pk).filter(i => status(i, pk) === 'missed' && !log[pk]?.missed[i.id]);
      if (items.length) owed = row(`Unfinished — ${nice(pk)}`,
        items.length === NNfor(pk).length
          ? `<div class="task missed"><div class="t">All day</div><div class="n">Nothing was ticked</div><div class="s">Missed</div><button class="tick" disabled></button></div>${missedFields(items.map(i => i.id).join(','), pk, true)}`
          : items.map(i => task(i, pk)).join(''), 'Own what was missed');
    }

    const parts = PARTS.map((name, n) => {
      const items = T.filter(i => i.part === name);
      return items.length ? row(name, items.map(i => task(i, k)).join('')) : '';
    }).join('');

    const c = d.close, left = T.length - doneN;
    const epilogue = c
      ? row('Day closed', `<div class="close-grid">
          <div class="field ro"><div class="k">What kept me aligned</div>${esc(c.aligned)}</div>
          <div class="field ro"><div class="k">What took me out of alignment</div>${esc(c.misaligned)}</div></div>`)
      : row('Close the day', `<div class="close-grid" id="closeCard">
          <div class="field"><div class="k">What kept me aligned today?</div><textarea data-c="aligned" rows="2"></textarea></div>
          <div class="field"><div class="k">What took me out of alignment today?</div><textarea data-c="misaligned" rows="2"></textarea></div></div>
          <div class="seal-row"><button class="link" id="sealDay" disabled>Seal the day</button><span class="hint">${left ? 'Anything unticked locks as missed.' : 'Every one lived.'}</span></div>`);

    v.innerHTML = prologue(k < DAY1 ? `Practice day · Day 1 is ${nice(DAY1)}` : '') + parts + epilogue + owed;
    bindToday();
  }

  function bindToday() {
    const v = $('#vToday');
    v.querySelectorAll('[data-tick]:not([disabled])').forEach(b => b.onclick = () => {
      const k = dkey(), d = day(k), id = b.dataset.tick;
      if (d.close) return renderToday();               // a sealed day stays as it was
      if (d.done[id]) delete d.done[id]; else d.done[id] = new Date().toISOString();
      save(); renderToday();
    });
    v.querySelectorAll('[data-account]').forEach(box => {
      const tas = box.querySelectorAll('textarea'), btn = box.querySelector('[data-seal]');
      const check = () => btn.disabled = [...tas].some(t => t.value.trim().length < 3);
      tas.forEach(t => t.oninput = () => { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; check(); });
      btn.onclick = () => {
        const f = Object.fromEntries([...tas].map(t => [t.dataset.f, t.value.trim()]));
        const at = new Date().toISOString();
        box.dataset.account.split(',').forEach(id => day(box.dataset.day).missed[id] = { ...f, at });
        save(); renderToday();
      };
    });
    const card = $('#closeCard');
    if (card) {
      const tas = card.querySelectorAll('textarea'), btn = $('#sealDay');
      tas.forEach(t => t.oninput = () => btn.disabled = [...tas].some(x => x.value.trim().length < 3));
      btn.onclick = () => {
        day(dkey()).close = { ...Object.fromEntries([...tas].map(t => [t.dataset.c, t.value.trim()])), at: new Date().toISOString() };
        save(); renderToday();
      };
    }
  }

  // ---------- Vision ----------
  function renderVision() {
    const P = BLUEPRINT.pillars, rules = BLUEPRINT.rules || [];
    const metric = m => {
      if (!m?.range) return '';
      const { current: c, range: [lo, hi], unit: u = '', label } = m;
      return `${esc(label)} ${c}${esc(u)} · holds ${lo}–${hi}${esc(u)}`;
    };
    $('#vVision').innerHTML = prologue()
      + P.map(p => { const truths = p.truths || [];
          return row(p.name,
          `<div class="lead glow">${esc(p.vision)}</div><ul class="lines">${truths.map(t => `<li>${esc(t)}</li>`).join('')}</ul>`, metric(p.metric)); }).join('')
      + (BLUEPRINT.frequency?.raises?.length ? row('Raises my frequency', `<div class="lead glow">Do more of this.</div><ul class="lines">${BLUEPRINT.frequency.raises.map(t => `<li>${esc(t)}</li>`).join('')}</ul>`) : '')
      + (BLUEPRINT.frequency?.lowers?.length ? row('Lowers my frequency', `<div class="lead glow">None of this.</div><ul class="lines low">${BLUEPRINT.frequency.lowers.map(t => `<li>${esc(t)}</li>`).join('')}</ul>`) : '')
      + row('The rules', `<ol class="rules">${rules.map(t => `<li>${esc(t)}</li>`).join('')}</ol>`)
      + row('Epilogue', `<div class="lead glow">A day counts if I did the work. Where I am yet doesn't come into it.</div>`);
  }

  // ---------- Evidence: a month of days ----------
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  let evY, evM, evSel;
  function renderEvidence() {
    const today = dkey();
    if (evY == null) { const t = fromKey(today); evY = t.getFullYear(); evM = t.getMonth(); evSel = today; }
    const first = new Date(evY, evM, 1), daysIn = new Date(evY, evM + 1, 0).getDate();
    const lead = (first.getDay() + 6) % 7;                       // Monday-first
    let completed = 0, cells = '';
    for (let i = 0; i < lead; i++) cells += `<div class="cal-cell"></div>`;
    for (let dd = 1; dd <= daysIn; dd++) {
      const k = dkey(new Date(evY, evM, dd)), L = NNfor(k), s = dayScore(k);
      const live = k >= DAY1 && k <= today;
      const settled = k < today || !!log[k]?.close;
      if (live && settled && s === 1) completed++;
      let mark = '';
      if (live) {
        const chip = !settled ? `<span class="ring"></span>`
          : s === 1 ? `<span class="chip">Aligned</span>` : `<span class="chip drift">Drifted</span>`;
        const dots = L.map(i => `<i class="${log[k]?.done[i.id] ? 'on' : ''}"></i>`).join('');
        mark = `${chip}<span class="dots">${dots}</span>`;
      }
      cells += `<button class="cal-cell day ${live ? 'live' : 'mute'} ${k === today ? 'today' : ''} ${k === evSel ? 'sel' : ''}" data-k="${k}" ${live ? '' : 'disabled'}>
        <span class="dn">${dd}</span>${mark}</button>`;
    }
    const d1 = fromKey(DAY1);
    const canPrev = new Date(evY, evM, 1) > new Date(d1.getFullYear(), d1.getMonth(), 1);
    const canNext = new Date(evY, evM + 1, 1) <= fromKey(today);

    // The month takes the clock's place above the LED strip.
    $('#heroMonth').innerHTML = `
        <div class="cal-year">${evY}</div>
        <div class="cal-head">
          <button class="cal-nav" id="evPrev" ${canPrev ? '' : 'disabled'} aria-label="Previous month">‹</button>
          <h2 class="cal-month">${MONTHS[evM]}</h2>
          <button class="cal-nav ring-btn" id="evNext" ${canNext ? '' : 'disabled'} aria-label="Next month">›</button>
        </div>
        <div class="cal-sub">${completed} day${completed === 1 ? '' : 's'} completed</div>`;
    $('#vEvidence').innerHTML = `
      <div class="cal">
        <div class="cal-grid">${['M','T','W','T','F','S','S'].map(w => `<div class="cal-w">${w}</div>`).join('')}${cells}</div>
      </div>
      ${evSel && evSel >= DAY1 ? dayDetail(evSel) : ''}`;
    const v = $('#vEvidence');
    v.querySelectorAll('.cal-cell.day.live').forEach(b => b.onclick = () => { evSel = b.dataset.k; renderEvidence(); });
    $('#evPrev').onclick = () => { if (--evM < 0) { evM = 11; evY--; } renderEvidence(); };
    $('#evNext').onclick = () => { if (++evM > 11) { evM = 0; evY++; } renderEvidence(); };
  }

  // One day, read back: what was lived, what was missed and why, and how it closed.
  function dayDetail(k) {
    const L = NNfor(k), d = log[k] || { done: {}, missed: {} };
    const full = fromKey(k).toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
    const items = L.map(i => {
      const s = status(i, k), m = d.missed?.[i.id];
      return `<div class="task ${s}"><div class="t">${esc(i.time || '')}</div><div class="n">${esc(i.title)}</div>
        <div class="s">${s === 'done' ? 'Done' : s === 'missed' ? 'Missed' : ''}</div><span class="tick"></span></div>
        ${m ? `<div class="account ro"><div class="field ro"><div class="k">Why I missed it</div>${esc(m.why)}</div><div class="field ro"><div class="k">What I do better tomorrow</div>${esc(m.better)}</div></div>` : ''}`;
    }).join('');
    const c = d.close;
    return row(full, items) + (c ? row('Day closed', `<div class="close-grid">
        <div class="field ro"><div class="k">What kept me aligned</div>${esc(c.aligned)}</div>
        <div class="field ro"><div class="k">What took me out of alignment</div>${esc(c.misaligned)}</div></div>`) : '');
  }

  // ---------- Settings ----------
  let shiftWeek = 0;                 // 0 = this week, 1 = next week, …
  const mondayOf = k => { const d = fromKey(k); return addDays(k, -((d.getDay() + 6) % 7)); };
  function renderSettings() {
    const today = dkey(), mon = addDays(mondayOf(today), shiftWeek * 7);
    const days = [0,1,2,3,4,5,6].map(n => addDays(mon, n));
    const short = k => fromKey(k).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
    const weekBtns = [0,1,2,3].map(n => { const m = addDays(mondayOf(today), n * 7);
      return `<button type="button" class="dp wk ${shiftWeek === n ? 'on' : ''}" data-w="${n}" aria-pressed="${shiftWeek === n}">Week ${n + 1} · ${short(m)}</button>`; }).join('');
    const dayRows = days.map(k => {
      const s = shiftOn(k), past = k < today;
      return `<div class="shift-row ${s ? 'on' : ''} ${past ? 'past' : ''}" data-k="${k}">
        <button type="button" class="dp sd ${s ? 'on' : ''}" ${past ? 'disabled' : ''} aria-pressed="${!!s}">${WD[fromKey(k).getDay()].slice(0, 3)} ${fromKey(k).getDate()}</button>
        <label class="field"><span class="k">Start</span><input type="time" data-f="start" value="${s?.start || '10:00'}" ${s && !past ? '' : 'disabled'}></label>
        <label class="field"><span class="k">Finish</span><input type="time" data-f="end" value="${s?.end || '18:00'}" ${s && !past ? '' : 'disabled'}></label>
      </div>`;
    }).join('');
    $('#vSettings').innerHTML = row('Work shifts', `
        <div class="muted" style="margin-bottom:16px">Enter each week's shifts. A shift only goes on the days you pick in that week, and Leave for work is added 30 minutes before it.</div>
        <div class="day-pick" role="group" aria-label="Week">${weekBtns}</div>
        <div class="shift-list">${dayRows}</div>
        <div class="seal-row"><button class="link" id="wSave">Save week</button><span class="hint" id="wNote">Tap a day to mark it as a work day.</span></div>`)
      + row('Theme', `
        <div class="muted" style="margin-bottom:14px">Same layout, different light.</div>
        <div class="day-pick" role="group" aria-label="Theme">${Object.entries(LOOKS).map(([id, l]) => `
          <button type="button" class="dp lk ${(settings.look || 'night') === id ? 'on' : ''}" data-look="${id}" aria-pressed="${(settings.look || 'night') === id}">${l.name}</button>`).join('')}</div>`)
      + row('Reminders', `
        <div class="muted" style="margin-bottom:14px">A chime and a card before each task with a time. Keep this page open for them to arrive.</div>
        <div class="day-pick" role="group" aria-label="Remind me">${[0, 5, 10, 15, 30].map(m => `
          <button type="button" class="dp rm ${settings.remind === m ? 'on' : ''}" data-m="${m}" aria-pressed="${settings.remind === m}">${m ? m + ' min before' : 'Off'}</button>`).join('')}</div>
        <div class="hint" id="rmNote">${notifyNote()}</div>`)
      + row('Recovery code', `
        <div class="muted" style="margin-bottom:12px">Paste this on the first screen to bring your process back after a delete or a new phone.</div>
        <pre class="ob-code" id="setCode">…</pre>
        <div class="seal-row"><button class="link" id="setCopy">Copy code</button><span class="hint" id="setCodeNote"></span></div>`)
      + row('Reset', `
        <div class="muted" style="margin-bottom:14px">Start again from the questions. Your blueprint, every tick, miss, reason, closing thought and shift is erased. Keep your recovery code if you want this process back.</div>
        <div class="seal-row" id="resetAsk"><button class="link red" id="resetBtn">Reset everything</button></div>
        <div class="seal-row" id="resetConfirm" hidden><span class="hint" style="color:var(--text)">This can't be undone.</span>
          <button class="link red" id="resetYes">Yes, reset</button><button class="link" id="resetNo">Cancel</button></div>`);
    const v = $('#vSettings');
    v.querySelectorAll('.dp.lk').forEach(b => b.onclick = () => { settings.look = b.dataset.look; saveSettings(); applyLook(); renderSettings(); });
    v.querySelectorAll('.dp.rm').forEach(b => b.onclick = () => {
      settings.remind = +b.dataset.m; saveSettings();
      if (settings.remind && 'Notification' in window && Notification.permission === 'default') {
        try { Notification.requestPermission().then(() => { const n = $('#rmNote'); if (n) n.textContent = notifyNote(); }); } catch {}
      }
      unlockSound(); renderSettings();
    });
    HSCode.encode(BLUEPRINT).then(code => {
      const out = $('#setCode'); if (!out) return; out.textContent = code;
      $('#setCopy').onclick = () => navigator.clipboard?.writeText(code).then(() => $('#setCodeNote').textContent = 'Copied.',
        () => { getSelection().selectAllChildren(out); $('#setCodeNote').textContent = 'Selected. Copy it from here.'; });
    });
    $('#resetBtn').onclick = () => { $('#resetAsk').hidden = true; $('#resetConfirm').hidden = false; };
    $('#resetNo').onclick = () => { $('#resetAsk').hidden = false; $('#resetConfirm').hidden = true; };
    $('#resetYes').onclick = () => {
      try {
        localStorage.removeItem(KEY);
        localStorage.removeItem(BP_KEY);
        localStorage.setItem(SKEY, JSON.stringify({ look: settings.look }));
      } catch {}
      location.reload();
    };
    v.querySelectorAll('.dp.wk').forEach(b => b.onclick = () => { shiftWeek = +b.dataset.w; renderSettings(); });
    v.querySelectorAll('.shift-row').forEach(r => {
      const b = r.querySelector('.dp.sd');
      b.onclick = () => {
        const on = !r.classList.contains('on');
        r.classList.toggle('on', on); b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
        r.querySelectorAll('input').forEach(i => i.disabled = !on);
        $('#wNote').textContent = 'Not saved yet.';
      };
      r.querySelectorAll('input').forEach(i => i.oninput = () => { $('#wNote').textContent = 'Not saved yet.'; });
    });
    $('#wSave').onclick = () => {
      const rows = [...v.querySelectorAll('.shift-row:not(.past)')];
      for (const r of rows) {
        if (!r.classList.contains('on')) continue;
        const st = r.querySelector('[data-f=start]').value, en = r.querySelector('[data-f=end]').value;
        if (!st || !en || mins(en) <= mins(st)) { $('#wNote').textContent = `${fromKey(r.dataset.k).toLocaleDateString(undefined, { weekday: 'long' })}: finish needs to be after start.`; return; }
      }
      rows.forEach(r => {
        const k = r.dataset.k;
        if (r.classList.contains('on')) settings.shifts[k] = { start: r.querySelector('[data-f=start]').value, end: r.querySelector('[data-f=end]').value };
        else delete settings.shifts[k];
      });
      saveSettings(); renderSettings();
      $('#wNote').textContent = 'Saved. Only this week has changed.';
    };
  }

  // ---------- Tabs ----------
  const views = { today: renderToday, vision: renderVision, evidence: renderEvidence, settings: renderSettings };
  let tab = 'today';
  function show(t) {
    tab = t;
    document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
    document.querySelectorAll('[data-view]').forEach(s => s.hidden = s.dataset.view !== t);
    $('#clock').hidden = t === 'evidence';
    $('.hero').hidden = t === 'settings';
    $('#heroMonth').hidden = t !== 'evidence';
    views[t]();
  }
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => show(b.dataset.tab));

  // ---------- Clock (display only — nothing runs on it) ----------
  function clock() {
    const n = new Date(), h12 = n.getHours() % 12 || 12;
    $('#hh').textContent = h12;
    $('#mm').textContent = String(n.getMinutes()).padStart(2, '0');
    $('#ampm').textContent = n.getHours() < 12 ? 'AM' : 'PM';
  }

  // ---------- Reminders: a heads-up before each timed task ----------
  const canNotify = () => { try { return 'Notification' in window && Notification.permission === 'granted'; } catch { return false; } };
  function notifyNote() {
    if (!settings.remind) return 'Reminders are off.';
    return canNotify() ? 'On. You\'ll also get a desktop notification.' : 'On. Reminders show here on the page with a chime.';
  }
  let audio;
  const unlockSound = () => { try { audio ||= new (window.AudioContext || window.webkitAudioContext)(); audio.resume?.(); } catch {} };
  document.addEventListener('pointerdown', unlockSound, { once: true });
  function chime() {
    try {
      unlockSound(); if (!audio) return;
      [660, 990].forEach((f, i) => {
        const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + i * .16;
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.12, t + .02); g.gain.exponentialRampToValueAtTime(.001, t + .7);
        o.connect(g).connect(audio.destination); o.start(t); o.stop(t + .8);
      });
    } catch {}
  }
  function toast(item, lead) {
    const el = document.createElement('div');
    el.className = 'toast'; el.setAttribute('role', 'status');
    el.innerHTML = `<div class="toast-k">In ${lead} min · ${esc(item.time)}</div><div class="toast-m">${esc(item.title)}</div>
      <div class="toast-a"><button class="link" data-done>Done</button><button class="link muted-link" data-x>Dismiss</button></div>`;
    el.querySelector('[data-x]').onclick = () => el.remove();
    el.querySelector('[data-done]').onclick = () => {
      const d = day(dkey()); if (!d.close) { d.done[item.id] = new Date().toISOString(); save(); if (tab === 'today') renderToday(); }
      el.remove();
    };
    $('#toasts').appendChild(el);
    setTimeout(() => el.remove(), 15 * 60e3);
  }
  function checkReminders() {
    const lead = settings.remind; if (!lead) return;
    const k = dkey(); if (k < DAY1) return;
    const d = day(k); if (d.close) return;
    const now = new Date(), m = now.getHours() * 60 + now.getMinutes();
    d.reminded ||= [];
    NNfor(k).forEach(i => {
      if (!/\d:\d\d/.test(i.time || '') || d.done[i.id] || d.reminded.includes(i.id)) return;
      const at = Math.round(i.sortMin);
      if (m >= at - lead && m < at) {
        d.reminded.push(i.id); save();
        chime(); toast(i, Math.max(1, at - m));
        if (canNotify()) {
          const title = `In ${at - m} min · ${i.time}`, opts = { body: i.title, icon: '../icon-192.png', tag: i.id, silent: true };
          (navigator.serviceWorker?.ready || Promise.reject()).then(r => r.showNotification(title, opts))
            .catch(() => { try { new Notification(title, opts); } catch {} });
        }
      }
    });
  }

  // ---------- Day turn ----------
  let lastDay = '';
  function tick() {
    clock();
    checkReminders();
    const k = dkey();
    if (k === lastDay) return;
    lastDay = k;
    $('#clockDate').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
    const n = Math.floor((fromKey(k) - fromKey(DAY1)) / 864e5) + 1;
    $('#dayN').textContent = n >= 1 ? `Day ${pad(n)}` : `Day 1 is ${nice(DAY1)}`;
    if (!document.activeElement?.matches('textarea')) views[tab]();
  }

  // Installed app: offline support + notifications (only when served from a real web address)
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && document.querySelector('link[rel="manifest"]')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  show('today'); tick();
  setInterval(tick, 10000);
})();
