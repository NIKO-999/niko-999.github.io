<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Probe</title>
<!-- ── a measurement taken on the phone that has the problem ──
     The edit sheet's two time fields overflowed their row on iOS and on
     nothing else. Chromium is the only browser on the machine this app
     is developed on and it sizes input[type=time] to fit, so four
     attempted fixes went out on a model of the bug rather than a
     measurement of it.

     The first probe found it. The tracks were correct at 175px, the
     field's `width` computed to 175px as told, and its border box was
     205px — `box-sizing` came back CONTENT-BOX in spite of the `*`
     reset, because Safari's natively-appearing control keeps its own
     metrics. 175 + 28 padding + 2 border = 205, and two of those
     overflow by 30, which is what was measured.

     This version shows the shipped fix beside the control, so one
     screenshot says whether it worked rather than another round of
     reasoning. Delete this file once it has. -->
<link rel="stylesheet" href="app.css" />
<style>
  body { padding: 16px 0; font: 400 13px/1.5 system-ui, sans-serif; }
  h1 { font-size: 15px; margin: 0 16px 4px; }
  h2 { font-size: 12px; margin: 20px 16px 2px; letter-spacing: .08em;
       text-transform: uppercase; color: #737373; }
  p { margin: 0 16px 8px; }
  .pen { padding: 0 18px; }
  .frame { outline: 1px dashed red; outline-offset: 2px; }
  pre { margin: 4px 16px 0; white-space: pre-wrap;
        font: 400 12px/1.45 ui-monospace, monospace; }
  /* The control: the native box, as it was before the fix. */
  .raw .field { -webkit-appearance: auto; appearance: auto; box-sizing: content-box; }
</style>
</head>
<body>

<h1>Time row probe</h1>
<p>Screenshot everything below.</p>

<h2>As shipped now</h2>
<div class="pen"><div class="grid2 frame" id="fix">
  <input class="field" type="time" step="300" value="10:00" />
  <input class="field" type="time" step="300" value="18:00" />
</div></div>

<h2>The old behaviour, for comparison</h2>
<div class="pen raw"><div class="grid2 frame" id="raw">
  <input class="field" type="time" step="300" value="10:00" />
  <input class="field" type="time" step="300" value="18:00" />
</div></div>

<pre id="out">measuring…</pre>

<script>
(function () {
  var R = function (n) { return Math.round(n * 10) / 10; };

  var css = '(could not read)';
  try {
    var sheets = [].slice.call(document.styleSheets);
    for (var i = 0; i < sheets.length; i++) {
      if (!/app\.css/.test(sheets[i].href || '')) continue;
      var rules = [].slice.call(sheets[i].cssRules);
      for (var j = 0; j < rules.length; j++) {
        if (rules[j].selectorText === '.grid2') css = rules[j].cssText;
      }
    }
  } catch (e) { css = 'blocked: ' + e.message; }

  var lines = [
    'viewport      ' + window.innerWidth + ' x ' + window.innerHeight,
    'ua            ' + navigator.userAgent.slice(0, 60),
    '',
    css,
    ''
  ];

  ['fix', 'raw'].forEach(function (id) {
    var row = document.getElementById(id);
    var b = row.getBoundingClientRect();
    var kids = [].slice.call(row.children);
    var last = kids[kids.length - 1].getBoundingClientRect();
    lines.push((id === 'fix' ? 'AS SHIPPED' : 'OLD BEHAVIOUR')
      + '   cols ' + getComputedStyle(row).gridTemplateColumns);
    lines.push('  row     right ' + R(b.right) + '  width ' + R(b.width));
    kids.forEach(function (k, n) {
      var r = k.getBoundingClientRect(), s = getComputedStyle(k);
      lines.push('  field ' + (n + 1) + ' right ' + R(r.right) + '  border box ' + R(r.width)
        + '  width ' + s.width);
      lines.push('          box ' + s.boxSizing + '  min-w ' + s.minWidth
        + '  appearance ' + (s.webkitAppearance || s.appearance));
    });
    lines.push('  >>> ' + (last.right > b.right + 0.5
      ? 'OVERFLOWS by ' + R(last.right - b.right) + 'px' : 'fits'));
    lines.push('');
  });

  document.getElementById('out').textContent = lines.join('\n');
})();
</script>

</body>
</html>
