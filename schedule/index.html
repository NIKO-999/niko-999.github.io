<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- viewport-fit=cover so the paper runs under the notch and the home
     bar; every edge that holds a control pays it back with env(safe-area-*).
     No maximum-scale: pinch-zoom stays available, and the input font
     floor of 16px is what stops iOS zooming on focus instead. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<meta name="theme-color" content="#ffffff" />
<meta name="description" content="The shape of your week, one block at a time, spoken in." />
<title>Schedule</title>

<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Schedule" />

<link rel="preload" as="font" type="font/woff2" href="fonts/Inter.woff2" crossorigin />
<!-- ?v= is the CONTENT'S OWN FINGERPRINT, not a number somebody
     remembers to bump. A phone reported a fixed layout still broken
     twice: app.js had updated and app.css had not, because they are two
     files with two caches and iOS gives no reliable way to bypass one.
     A changed filename is the only thing a cache cannot ignore.

     tests/schedule.js hashes both files and fails if either query is
     stale, printing the value to paste in — so this cannot rot into a
     version that stopped tracking what it names. -->
<link rel="stylesheet" href="app.css?v=f5f5d514" />
</head>
<body>

<main class="poster" id="scPoster">

  <header class="head">
    <h1 class="title" id="scTitle" tabindex="0" role="button"
        aria-label="Title, tap to rename">Daily Process</h1>
    <p class="sub" id="scSub" tabindex="0" role="button"
       aria-label="Subtitle, tap to edit"></p>

    <!-- Settings, top right, because the bar lost the stop it lived on.
         It is your own face: the one control in this app that is about
         you rather than about the week, and it already has a drawing. -->
    <button class="head-you" id="scTabYou" aria-label="You and settings">
      <span class="tab-face" id="scTabFace"></span>
    </button>

    <!-- The one thing that makes a week into a scheduler: what is
         running and when it ends. The state sits left and the figure
         right, on the rule — and the caption drops BELOW the rule,
         outside this row, because a third thing on a baseline with a
         44px figure has nowhere to sit that does not fight it. -->
    <div class="live" id="scLive" aria-live="polite">
      <span class="eyebrow" id="scLiveState"></span>
      <span class="figure"><b id="scLiveNum"></b><i id="scLiveUnit"></i></span>
    </div>
    <p class="caption" id="scLiveOf"></p>
  </header>

  <!-- ── the ring ──
       The same day, drawn instead of listed. It replaces the hero above
       rather than sitting under it: the ring's own middle says the state
       and the figure, and saying both twice on one screen is how the
       week-list's running row came to be painted the same as everything
       round it. Empty until scPaintRing fills it. -->
  <section class="ring" id="scRing" hidden>
    <div class="sr-wrap">
      <svg class="sr-face" id="scRingSvg" viewBox="0 0 286 286" aria-hidden="true"></svg>
      <div class="sr-mid" id="scRingMid" aria-live="polite">
        <span class="sr-kick" id="scRingKick"></span>
        <b class="sr-num" id="scRingNum"></b>
        <span class="sr-unit" id="scRingUnit"></span>
        <span class="sr-name" id="scRingName"></span>
      </div>
    </div>
    <p class="sr-key" id="scRingKey"></p>
    <div class="sr-rest">
      <p class="sr-lbl">Rest of today</p>
      <ol class="sr-list" id="scRingList"></ol>
    </div>
  </section>

  <!-- ── the tally ──
       Five things a day, the same five for everyone. It replaces the
       week for the same reason the ring does: it is a different answer
       to "how is today going", and two answers to one question on one
       screen is how the running row came to be painted like everything
       round it. Empty until scPaintTally fills it. -->
  <section class="tally" id="scTally" hidden>
    <div class="ty-hero">
      <span class="ty-lbl">Showing up</span>
      <b class="ty-fig" id="scStreakNum">0<i>days</i></b>
    </div>
    <p class="ty-cap" id="scTallyCap"></p>
    <div class="ty-grid" id="scTallyGrid"></div>
    <p class="ty-foot" id="scTallyFoot"></p>
  </section>

  <!-- ── the history a row opens ──
       Half a year of one item, over the page rather than instead of it:
       the veil is thin enough to read the rows through and thick enough
       that they are plainly not the point. Empty until scOpenHist fills
       it, and it lives OUTSIDE the tally section so closing the view
       cannot leave it stranded on screen. -->
  <div class="ty-veil" id="scTyVeil" hidden>
    <div class="ty-panel" id="scTyPanel" role="dialog" aria-modal="true"
         aria-labelledby="scTyTitle" tabindex="-1"></div>
  </div>

  <!-- ── friends ──
       The leaderboard and the feed, which are the same subject seen
       twice. YOU are on it from the first day: your thirty-day count
       and your run are both computed out of the ticks already on this
       phone, so this is a real screen with one real row rather than an
       empty state waiting for a server. -->
  <!-- TWO STOPS, and only one of them is ever on screen. The board and
       the feed are different things — one is where you stand, the other
       is what people did — and stacked they made a screen with two
       headings, two filled buttons and a note line on it. Nothing is
       removed here; it is put away, which is the rule the folding
       panels elsewhere in this project already follow.

       The stops are the section headings now. Two labels naming the two
       halves, one of which is also the control that reaches them, is
       the same word twice. -->
  <section class="friends" id="scFriends" hidden>
    <nav class="fr-seg" id="scFrSeg" aria-label="Friends">
      <button class="fr-stop on" id="scFrBoard" data-stop="board" aria-current="page">Leaderboard</button>
      <button class="fr-stop" id="scFrFeed" data-stop="feed" aria-current="false">Feed</button>
    </nav>
    <div id="scFrPane">
      <ol class="fr-list" id="scFriendList"></ol>
      <div class="fr-add" id="scFriendAdd"></div>
    </div>
    <div class="fr-feed" id="scFeed" hidden></div>
  </section>

  <ol class="rail" id="scRail"></ol>

  <p class="empty" id="scEmpty" hidden>
    Nothing here yet. Press the microphone and say something like
    <em>“Train every day 6:30 to 7:30”</em>.
  </p>

</main>

<!-- ── the bar ──
     Thumb-height, over the poster. Add by hand on the left, speak on the
     right, because the right is where a thumb already is. -->
<!-- ── the bar ──
     Four labelled stops in a glass pill, and the one thing that ADDS
     sitting outside it as its own circle. The split is the point: the
     pill is where you are, the circle is what you do, and they are not
     the same kind of control. Four cycled through one unlabelled button
     before this, which meant the only way to find the third view was to
     press twice and see. -->
<div class="bar">
  <nav class="tabs" id="scTabs" aria-label="Views">
    <button class="tab" id="scTabWeek" data-view="list" aria-label="The week">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      <span>Week</span>
    </button>
    <button class="tab" id="scTabRing" data-view="ring" aria-label="The ring">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4v5"/></svg>
      <span>Ring</span>
    </button>
    <button class="tab" id="scTabTally" data-view="tally" aria-label="Today’s five">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7"/><rect x="13" y="4" width="7" height="7"/><rect x="4" y="13" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/></svg>
      <span>Today</span>
    </button>
    <!-- One stop for the whole social half rather than two. The
         leaderboard and the feed are the same subject seen twice — who
         is doing what — and a bar with both on it spends two of four
         stops on a part of the app you may never turn on. -->
    <button class="tab" id="scTabFriends" data-view="friends" aria-label="Friends">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.4"/><path d="M3 19c0-3.2 2.7-5 6-5s6 1.8 6 5"/><path d="M16.5 6.4a3.4 3.4 0 0 1 0 6.5M17 14.4c2.6.4 4 2.1 4 4.6"/></svg>
      <span>Friends</span>
    </button>
  </nav>

  <button class="prime" id="scAdd" aria-label="Add a block, spoken or typed">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</div>

<!-- ── the sheet ──
     One element, three jobs — listening, confirming what was heard, and
     editing a row by hand. They are the same shape and never on screen
     together, so three sheets would only be three ways to drift apart. -->
<div class="scrim" id="scScrim" hidden></div>
<section class="sheet" id="scSheet" role="dialog" aria-modal="true" aria-labelledby="scSheetTitle" tabindex="-1" hidden>
  <div class="grab" aria-hidden="true"></div>
  <h2 class="sheet-title" id="scSheetTitle">Listening</h2>
  <div class="sheet-body" id="scSheetBody"></div>
</section>

<div class="toast" id="scToast" role="status" aria-live="polite" hidden></div>

<script src="app.js?v=d0f520c1"></script>
</body>
</html>
