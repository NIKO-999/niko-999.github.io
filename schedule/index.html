<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- viewport-fit=cover so the paper runs under the notch and the home
     bar; every edge that holds a control pays it back with env(safe-area-*).

     maximum-scale=1 BECAUSE iOS ZOOMS THE PAGE ON FOCUS when the field
     you tapped computes under 16px — and then you are panning a screen
     that was the right size a moment before. Reported from the phone as
     a note in edit mode "moving around", and measured off those
     screenshots at about 1.1x, which is 16/15 rather than anything a
     finger did.

     This comment used to say the opposite: no maximum-scale, because a
     16px input floor stopped the zoom instead. `.field` does keep that
     floor and says so in its own rule — and Notes was built with fields
     of its own that never joined it, so the floor was a rule kept as a
     LIST OF MEMBERS rather than as a property of the app. The lines are
     at 16 now. The two heading fields cannot be: rendered at 16 the
     section name and its clause dominate the sentences they head, which
     is the decision that took them from 9.5px to 12.5px in the first
     place. A cap is the only thing left that covers a field the type
     scale will not let up to the floor — and the next one added.

     What it costs, said rather than hidden: Android Chrome honours
     maximum-scale and drops pinch-zoom with it unless Force enable zoom
     is set. iOS has IGNORED it for user-initiated zoom since iOS 10,
     deliberately, so on the phone this was reported from the pinch
     survives and only the automatic zoom goes. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<meta name="theme-color" content="#ffffff" />
<meta name="description" content="The shape of your week, one block at a time, spoken in." />
<title>Schedule</title>

<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Schedule" />

<link rel="preload" as="font" type="font/woff2" href="fonts/Inter.woff2" crossorigin />
<!-- ?v= is the CONTENT'S OWN FINGERPRINT, not a number somebody
     remembers to bump. A phone reported a fixed layout still broken
     twice: app.js had updated and app.css had not, because they are two
     files with two caches and iOS gives no reliable way to bypass one.
     A changed filename is the only thing a cache cannot ignore.

     tests/schedule.js hashes both files and fails if either query is
     stale, printing the value to paste in — so this cannot rot into a
     version that stopped tracking what it names. -->
<!-- The face before the first paint. app.css carries the dark set on
     :root and the light set under [data-mode="light"], so the attribute
     has to be on the root before the sheet applies or a phone set to
     light opens dark for a frame and then switches. Read from the same
     key app.js keeps; no names escape. -->
<script>
(function () {
  try {
    var m = localStorage.getItem('sched.mode.v1');
    if (m !== 'light' && m !== 'dark') {
      m = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
        ? 'light' : 'dark';
    }
    document.documentElement.dataset.mode = m;
  } catch (e) {}
}());
</script>
<link rel="stylesheet" href="app.css?v=11f3492a" />
</head>
<body>

<main class="poster" id="scPoster">

  <!-- ── THE HEAD IS THE DAY, NOT THE APP ──
       It was an uppercase app name, a date line and a span of the
       day with a dot on it. What replaced all three is the thing the
       prototype opens with: a glyph tile, the day at 30px, and one
       plain line under it saying the date, how much is on it and the
       time. The app's own name is a heading for a screen reader and
       is renamed from Settings, which is where the other names are. -->
  <header class="head">
    <div class="hd-top">
      <span class="h-ic" id="scHdIc" aria-hidden="true"></span>
      <div class="h-tx">
        <h2 class="h-day" id="scHdDay"></h2>
        <!-- ── AND IT IS A DATE AGAIN, NOT A DOOR ──
             It was a button for one release, on the argument that the
             head already prints which day you are on so pressing it
             for more days is the control naming itself. That argument
             is sound and it was answering the wrong question: nothing
             up here SAYS it is a control, so what it named was a
             feature nobody could find. The month is a stop on the bar
             now, and two doors to one screen is a control answering
             the same question twice — the one that goes is always the
             one nothing on screen can describe. -->
        <p class="h-sub" id="scHdDate"></p>
      </div>
      <!-- ── EDIT, AND IT ARMS ONE PRESS ──
           The editor was behind a double tap for three rounds and was
           reported three times. A visible control cannot be mistimed,
           and this one cannot leave you in a mode either: it arms, the
           next block you press opens, and it disarms itself on the way
           — so there is no state to be in without knowing. The week's
           own tile, so the head reads as tiles and a title. -->
      <button class="hd-ed" id="scHdEd" aria-pressed="false" aria-label="Edit a block">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L18 10l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>
      </button>
      <!-- ── AND NOTES HAS ONE TOO ──
           The same tile in the same corner, because it is the same
           question — but this one STAYS pressed: the week's spends
           itself on one press because a row's ordinary press ticks,
           and a note's ordinary press does nothing at all. -->
      <button class="hd-ed" id="scNtEd" aria-pressed="false" aria-label="Edit this note" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L18 10l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>
      </button>
      <button class="head-you" id="scTabYou" aria-label="You and settings">
        <span class="tab-face" id="scTabFace"></span>
      </button>
    </div>
    <h1 class="title" id="scTitle">Daily Process</h1>
  </header>
  <section class="tally" id="scTally" hidden>
    <nav class="fr-seg" id="scTyStops" aria-label="Today">
      <button class="fr-stop on" id="scTyUp" data-tystop="up"
              aria-current="true">Showing up</button>
      <button class="fr-stop" id="scTyWork" data-tystop="work"
              aria-current="false">Workouts</button>
    </nav>
    <div id="scTyPane">
      <div class="ty-hero">
        <b class="ty-fig" id="scStreakNum">0<i>days</i></b>
      </div>
      <!-- A BUTTON, because it is the door to the week: the line that
           already says how today went is what asks for the seven days
           around it. One node rather than a paragraph swapped for a
           control, so the two cannot drift. -->
      <button class="ty-cap" id="scTallyCap" type="button"></button>
      <div class="ty-grid" id="scTallyGrid"></div>
      <p class="ty-foot" id="scTallyFoot"></p>
    </div>
    <div class="work" id="scWorkPane" hidden></div>
  </section>

  <!-- ── the history a row opens ──
       Half a year of one item, over the page rather than instead of it:
       the veil is thin enough to read the rows through and thick enough
       that they are plainly not the point. Empty until scOpenHist fills
       it, and it lives OUTSIDE the tally section so closing the view
       cannot leave it stranded on screen. -->
  <div class="ty-veil" id="scTyVeil" hidden>
    <div class="ty-panel" id="scTyPanel" role="dialog" aria-modal="true"
         aria-labelledby="scTyTitle" tabindex="-1"></div>
  </div>

  <!-- ── friends ──
       The leaderboard and the feed, which are the same subject seen
       twice. YOU are on it from the first day: your thirty-day count
       and your run are both computed out of the ticks already on this
       phone, so this is a real screen with one real row rather than an
       empty state waiting for a server. -->
  <!-- TWO STOPS, and only one of them is ever on screen. The board and
       the feed are different things — one is where you stand, the other
       is what people did — and stacked they made a screen with two
       headings, two filled buttons and a note line on it. Nothing is
       removed here; it is put away, which is the rule the folding
       panels elsewhere in this project already follow.

       The stops are the section headings now. Two labels naming the two
       halves, one of which is also the control that reaches them, is
       the same word twice. -->
  <section class="friends" id="scFriends" hidden>
    <nav class="fr-seg" id="scFrSeg" aria-label="Friends">
      <button class="fr-stop on" id="scFrBoard" data-stop="board" aria-current="page">Leaderboard</button>
      <button class="fr-stop" id="scFrFeed" data-stop="feed" aria-current="false">Feed</button>
    </nav>
    <div id="scFrPane">
      <ol class="fr-list" id="scFriendList"></ol>
      <div class="fr-add" id="scFriendAdd"></div>
    </div>
    <div class="fr-feed" id="scFeed" hidden></div>
  </section>

  <!-- ── the week ──
       A WINDOW with a track inside it, not a scroller. The deck was a
       horizontal scroller and every attempt to centre a card in it
       fought `scrollLeft`: it stops at 0, so the first card could not
       reach the middle; padding fixed that here and not on Safari,
       which leaves a scroll container's trailing padding out of its
       scrollable width; spacers fixed that and left the gap to account
       for. A transform has none of those — it is a number, the same
       number in every engine, and any card can be put dead centre. -->
  <!-- ── ONE DAY, AND THE WEEK IS A STRIP ──
       Seven cards side by side was the app's own answer for a year,
       and it is what still made this read as the old app with a new
       coat on. A day is picked from the strip and drawn in full: one
       list, the sessions as its headings, nothing peeking at the
       edges and nothing to swipe. The back of the day is still a
       back — the flip is on the panel now rather than on a card. -->
  <!-- ── NOTES ──
       Its own tab, where Goals was. Showing up and Workouts are two
       ways of reading the day you are in; a note is not one of
       those — it is the thinking the day is in service of, and it
       is the one screen here you write rather than tick.

       One pane, two states: the list, and one note. -->
  <section class="notes" id="scNotes" hidden>
    <div id="scNotePane"></div>
  </section>

  <!-- ── THE MONTH READ BACK ──
       A pane rather than a sheet, because it is a stop now. The day it
       opens is still a sheet: one screen at a time is this app's own
       shape, and a month with a day drawn under it would be two
       records of one thing on one screen. -->
  <section class="cal" id="scCal" hidden>
    <!-- ── TWO STOPS, WHICH IS THE CONTROL TODAY AND FRIENDS ALREADY
             USE ──
         Tasks and Workouts are two records of the same month and only
         one of them can be on a 50px cell at a time, so the choice is
         a stop rather than a second screen. The other question on this
         tab — month or list — rides the month row beside the arrows,
         because it changes how that grid is drawn and this changes
         WHAT is on it. -->
    <nav class="fr-seg" id="scCalStops" aria-label="Calendar">
      <button class="fr-stop on" id="scCalTask" data-calstop="task"
              aria-current="true">Tasks</button>
      <button class="fr-stop" id="scCalWork" data-calstop="work"
              aria-current="false">Workouts</button>
    </nav>
    <div id="scCalPane"></div>
  </section>

  <section class="week" id="scWeek">
    <div class="strip" id="scDayStrip" role="group" aria-label="The week"></div>
    <!-- ── THE DAY'S OBJECTIVES, ON THE DAY ──
         A row of cards under the week strip, in place of the glyph
         that used to sit in the head's top-right corner. It is
         OUTSIDE the day card rather than the first thing in it: the
         card is a scroller, so an objectives row inside it scrolls
         away on a long day and takes the only add control with it.
         The objectives are the day's frame, not one of its items. -->
    <div class="obs" id="scObjStrip" role="group"
         aria-label="Objectives" hidden></div>
    <div class="day-card" id="scDayCard"></div>
    <p class="empty" id="scEmpty" hidden>
      Nothing here yet. Press the microphone and say something like
      <em>&#8220;Train every day 6:30 to 7:30&#8221;</em>.
    </p>
  </section>
</main>

<!-- ── the bar ──
     Thumb-height, over the poster. Add by hand on the left, speak on the
     right, because the right is where a thumb already is. -->
<!-- ── the bar ──
     Four labelled stops in a glass pill, and the one thing that ADDS
     sitting outside it as its own circle. The split is the point: the
     pill is where you are, the circle is what you do, and they are not
     the same kind of control. Four cycled through one unlabelled button
     before this, which meant the only way to find the third view was to
     press twice and see. -->
<div class="bar">
  <nav class="tabs" id="scTabs" aria-label="Views">
    <button class="tab" id="scTabWeek" data-view="list" aria-label="The week">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      <span>Week</span>
    </button>
    <button class="tab" id="scTabTally" data-view="tally" aria-label="Today’s five">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7"/><rect x="13" y="4" width="7" height="7"/><rect x="4" y="13" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/></svg>
      <span>Today</span>
    </button>
    <!-- ── THE MONTH IS A STOP, NOT A DOOR BEHIND A LINE OF TYPE ──
         It lived behind the date in the head, which is 12.5px of
         --dim with no ground, no edge and no mark — a control wearing
         the same type as every caption in the app. It was reported as
         simply not being there, twice, which is what an invisible
         control is.

         FIVE FIT AND THAT IS MEASURED. At 390 each stop is 56.4px
         wide and 49 tall, both over the 44px floor, with "Calendar"
         at 45px of label in 54 of room; at 375 it is 53.4 and still
         clear. At 360 the label needed 2px and the tabs' own side
         padding paid it. At 320 five stops are 42.4px and under the
         floor — that is an iPhone 5 and this app is measured at 390,
         so it is a cost written down rather than one designed for. -->
    <button class="tab" id="scTabCal" data-view="cal" aria-label="Calendar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3.5v3M16 3.5v3"/><circle cx="8.5" cy="14.5" r="1.2"/><circle cx="12" cy="14.5" r="1.2"/><circle cx="15.5" cy="14.5" r="1.2"/></svg>
      <span>Calendar</span>
    </button>
    <!-- One stop for the whole social half rather than two. The
         leaderboard and the feed are the same subject seen twice — who
         is doing what — and a bar with both on it spends two of four
         stops on a part of the app you may never turn on. -->
    <!-- A ring with its centre: what you are aiming at. Filled at the
         middle so it does not read as the view control's own ring,
         which is the collision `#scMenu svg circle` was written for. -->
    <button class="tab" id="scTabNotes" data-view="notes" aria-label="Notes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 3.5h9l4 4v13h-13z"/><path d="M14.5 3.5v4h4M8.5 12h7M8.5 16h4.5"/></svg>
      <span>Notes</span>
    </button>
    <button class="tab" id="scTabFriends" data-view="friends" aria-label="Friends">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.4"/><path d="M3 19c0-3.2 2.7-5 6-5s6 1.8 6 5"/><path d="M16.5 6.4a3.4 3.4 0 0 1 0 6.5M17 14.4c2.6.4 4 2.1 4 4.6"/></svg>
      <span>Friends</span>
    </button>
  </nav>

  <button class="prime" id="scAdd" aria-label="Add a block, spoken or typed">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</div>

<!-- ── the sheet ──
     One element, three jobs — listening, confirming what was heard, and
     editing a row by hand. They are the same shape and never on screen
     together, so three sheets would only be three ways to drift apart. -->
<div class="scrim" id="scScrim" hidden></div>
<section class="sheet" id="scSheet" role="dialog" aria-modal="true" aria-labelledby="scSheetTitle" tabindex="-1" hidden>
  <div class="grab" aria-hidden="true"></div>
  <h2 class="sheet-title" id="scSheetTitle">Listening</h2>
  <div class="sheet-body" id="scSheetBody"></div>
</section>

<!-- ── the intro ──
     The first open, and the only screen in this app that explains
     rather than records. It exists because four of the things this app
     can do are INVISIBLE until somebody tells you: the add button
     takes a sentence, a line of type is the door to the month and to
     the week, and a friend's board is behind a code. None of those is
     findable by pressing around, which is the only test a card here
     has to pass — a slide about the tab bar would be
     a picture of something you are already looking at.

     It is built by scTourOpen and empty until then: six slides of
     markup sitting in the document on every open, for a screen most
     people see once, is furniture that costs a parse. -->
<div class="tour" id="scTour" role="dialog" aria-modal="true"
     aria-labelledby="scTourTitle" tabindex="-1" hidden></div>

<!-- ── the card that teaches the gesture ──
     A double tap is invisible: nothing on a tile can say "press me
     twice". This comes UP rather than sitting in the page, the way the
     intro does, because a note lying in the body under six tiles is
     one more thing on a screen rather than something that interrupts
     you once and goes. Empty until scHintCard fills it, and outside
     the tally section so leaving the view cannot strand it. -->
<div class="gh" id="scHint" role="dialog" aria-modal="true"
     aria-labelledby="scHintTitle" tabindex="-1" hidden></div>

<div class="toast" id="scToast" role="status" aria-live="polite" hidden></div>

<script src="app.js?v=c6a006d5"></script>
</body>
</html>
