<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- The rail: the one mark that is only this app. Nothing else on a
       home screen is a line with days hanging off it. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#4a5772"/>
      <stop offset=".55" stop-color="#66748e"/>
      <stop offset="1" stop-color="#9aa8bb"/>
    </linearGradient>
    <linearGradient id="silk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".22"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#g)"/>
  <path d="M512 300 C 400 320 300 400 250 512 L512 512 Z" fill="url(#silk)"/>

  <g fill="#fff">
    <rect x="150" y="128" width="10" height="256" rx="5" opacity=".92"/>
    <circle cx="155" cy="150" r="19"/>
    <circle cx="155" cy="256" r="19"/>
    <circle cx="155" cy="362" r="19"/>
    <rect x="206" y="128" width="164" height="44" rx="16" opacity=".88"/>
    <rect x="206" y="234" width="212" height="44" rx="16" opacity=".88"/>
    <rect x="206" y="340" width="128" height="44" rx="16" opacity=".88"/>
  </g>
</svg>
