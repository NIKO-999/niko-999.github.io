<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<!-- Dark only, and that is a decision rather than an omission. The whole
     palette is one warm accent against a near-black frame; a light mode
     would need a second set of eight habit colours that still clear the
     contrast floor, and half of them would not. -->
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#15171E" />
<!-- Without this the browser asks for /favicon.ico on every load and takes
     a 404 for it. -->
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<title>Jade — Habits</title>
<style>
/* ══ TOKENS AND CHROME ══════════════════════════════════════════
   The frame every screen sits in: the reset, the type, the top bar,
   the two panes and the rail. Nothing here knows what a habit is.

   STANDALONE. No @font-face, no image, no import — this file names no
   asset outside jade/, so the app opens off the disk with the network
   unplugged and looks the same. The type is whatever the machine
   already has.

   Class prefixes are load-bearing: jt- is the today screen's, jc- is
   the calendar's, and everything below is unprefixed because it
   belongs to no screen. Nothing here styles either prefix.
   ══════════════════════════════════════════════════════════════ */

:root {
  color-scheme: dark;

  --bg:        #15171E;   /* page */
  --surface:   #1C1F28;   /* top bar, rail — a step up off the page */
  --card:      #232733;   /* panels and cards */
  --card-2:    #2A2F3C;   /* hover, and the pressed half of a segment */
  --line:      #313746;   /* the 1px border, one step above the card */
  --line-2:    #3C4354;   /* brighter border: a kept card, a scrollbar */
  --ink:       #F1F3F8;
  --ink-2:     #8E95A6;
  --ink-3:     #626A7B;   /* captions and times only — see the note below */

  /* One warm accent, and it is spent only on what is live, what is
     yours, and what you press. A second accent would make both of them
     mean nothing. */
  --accent:    #FF7A2E;
  --accent-in: #FFFFFF;
  --track:     #2C3140;   /* the unfilled part of a ring or a bar */
  --focus:     #FF7A2E;

  /* BUBBLE GEOMETRY. Everything that holds text is round: a panel is a
     22px bubble, anything that holds one line — a chip, a rail row, a
     log entry, a control — is a full pill. Tokens rather than numbers
     because a card and the box beside it drifting apart by 2px is the
     kind of thing nobody sees and everybody feels. */
  --r-card: 22px;
  --r-in:   16px;
  --r-pill: 999px;

  --font: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;

  /* Eight identities. The colour says WHICH habit, never whether the
     day went well — a kept mark takes its habit's colour and an unkept
     one is hollow, so no week can ever come out red. A wash of red
     across a bad week is a judgement, and a judgement is what makes
     you stop opening the screen. */
  --h-steps:    #3DE8A6;
  --h-walk:     #A8ED5B;
  --h-strength: #FF6EC7;
  --h-abs:      #C08BFF;
  --h-water:    #45DDF2;
  --h-sleep:    #7FA6FF;
  --h-read:     #F2E45C;
  --h-audible:  #FF6B6B;
}

/* ── reset ── */

*, *::before, *::after { box-sizing: border-box; }

html {
  height: 100%;
  -webkit-text-size-adjust: 100%;
}

body {
  height: 100%;
  height: 100dvh;          /* a phone's toolbar slides away; 100vh does not follow it */
  margin: 0;
  display: flex;
  flex-direction: column;
  /* The page itself never scrolls. The header is always on screen and
     the two scrollers inside it — the pane and the rail's list — do all
     the moving. */
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.45;
  /* Every figure on this screen is a count that ticks: 5/7 becoming
     6/7 must not shift the glyph beside it. */
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, p, figure { margin: 0; }
b, strong { font-weight: 600; }

button, input, select, textarea {
  font: inherit;
  color: inherit;
  letter-spacing: inherit;
}
button { -webkit-appearance: none; appearance: none; }

/* An inline SVG sits on the text baseline and leaves 4px of descender
   under it, which is enough to knock a 34px button off centre. */
svg { display: block; }

/* !important because the chrome and both screens set display on the
   things they hide — .main is a flex column, and a plain
   [hidden]{display:none} loses to it. The inactive screen would stay
   on top of the active one, and nothing about the markup would say
   why. */
[hidden] { display: none !important; }

::selection { background: var(--accent); color: var(--accent-in); }

/* Every control, one rule, so a new control cannot ship without it.
   :focus-visible rather than :focus — a mouse press on a card should
   not leave a ring behind it. */
:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

/* The default scrollbar is a light-mode object and it lands on the one
   dark panel it crosses. */
.pane, .rail-list, .rail-log, .body {
  scrollbar-width: thin;
  scrollbar-color: var(--line-2) transparent;
}
.pane::-webkit-scrollbar,
.rail-list::-webkit-scrollbar,
.rail-log::-webkit-scrollbar,
.body::-webkit-scrollbar { width: 9px; height: 9px; }
.pane::-webkit-scrollbar-thumb,
.rail-list::-webkit-scrollbar-thumb,
.rail-log::-webkit-scrollbar-thumb,
.body::-webkit-scrollbar-thumb {
  background: var(--line-2);
  border: 2px solid transparent;
  background-clip: content-box;
  border-radius: var(--r-pill);
}
.pane::-webkit-scrollbar-track,
.rail-list::-webkit-scrollbar-track,
.rail-log::-webkit-scrollbar-track,
.body::-webkit-scrollbar-track { background: transparent; }

/* Visually gone, still read aloud. 2px rather than the usual 1px:
   a 1px box is indistinguishable from a hairline rule that has
   collapsed, and the geometry audit has to be able to tell a label it
   should ignore from a layout fault it should not. */
.sr {
  position: absolute;
  width: 2px;
  height: 2px;
  margin: -2px;
  padding: 0;
  border: 0;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

/* ── top bar ──
   56px, one hairline under it, and three things on it: the wordmark
   left, the screens centred, you on the right. */

.top {
  flex: 0 0 auto;
  position: relative;
  z-index: 2;
  height: 56px;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 18px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}

/* The wordmark and the identity block take an equal share of whatever
   is left over, which is what puts the nav on the true centre of the
   bar rather than the centre of the space after the wordmark. */
.brand {
  flex: 1 1 0;
  min-width: 0;
  display: flex;
  align-items: baseline;
  gap: 7px;
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: -.01em;
  color: var(--ink);
  white-space: nowrap;
}
.brand span {
  font-size: .62rem;
  font-weight: 500;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-3);
}

.nav {
  flex: 0 0 auto;
  align-self: stretch;          /* so the underline can reach the bar's border */
  display: flex;
  align-items: stretch;
  gap: 4px;
}

.nav-i {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  /* Stretched, less 2px top and bottom. Full height would put the
     focus ring's top edge off the top of the window and its bottom
     edge over the pane; 2px of slack lands the whole ring inside the
     header at any bar height, which is why this is a margin and not a
     calc against a height that changes on a phone. */
  margin: 2px 0;
  min-height: 32px;
  padding: 0 12px;
  border: 0;
  background: none;
  font-size: .82rem;
  font-weight: 500;
  color: var(--ink-2);
  white-space: nowrap;
  cursor: pointer;
  transition: color .12s ease;
}
/* The bar is drawn on every item and coloured on one, so the active
   item is not 2px taller than its neighbour. -3px is the item's own
   2px of bottom slack plus the header's 1px border: the bar covers
   that border for the width of the item rather than sitting above it. */
.nav-i::after {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  bottom: -3px;
  height: 2px;
  background: transparent;
}
.nav-i[aria-current="page"] { color: var(--ink); }
.nav-i[aria-current="page"]::after { background: var(--accent); }
@media (hover: hover) {
  .nav-i:hover { color: var(--ink); }
}

/* Icons carry no attributes of their own — one class decides the size
   and the weight of every glyph in the app, so a new icon cannot
   arrive at a different stroke. */
.ic {
  width: 16px;
  height: 16px;
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.top-r {
  flex: 1 1 0;
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 10px;
}

.who {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 0;
}
.who-av {
  width: 30px;
  height: 30px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: var(--r-pill);
  background: color-mix(in srgb, var(--accent) 18%, transparent);
  color: var(--accent);
  font-size: .78rem;
  font-weight: 600;
}
.who-t {
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-width: 0;
  line-height: 1.25;
}
.who-t b {
  font-size: .78rem;
  color: var(--ink);
}
.who-t span {
  font-size: .66rem;
  color: var(--ink-2);
}
.who-t b, .who-t span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.add {
  width: 34px;
  height: 34px;
  flex: none;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: var(--r-pill);
  background: var(--accent);
  color: var(--accent-in);
  cursor: pointer;
  transition: filter .12s ease;
}
@media (hover: hover) {
  .add:hover { filter: brightness(1.08); }
}
.add:active { filter: brightness(.94); }

/* ── the frame under the header ── */

.body {
  flex: 1 1 auto;
  display: flex;
  min-height: 0;              /* without this the pane grows instead of scrolling */
}

.main {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
}

.pane {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  padding: 16px 18px 26px;
}

/* The reference is a 1512px window and says nothing about a 2560px
   one. Left alone, eight cards at auto-fill would spread to eight
   across and the strip's ring would end up a metre from its caption,
   so the content keeps a reading width and takes the middle. */
.pane > * {
  max-width: 1180px;
  margin-inline: auto;
}

/* ── rail ── */

.rail {
  flex: 0 0 320px;
  width: 320px;
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--surface);
  /* On the LEFT. What is due today is the thing you came to do, so it
     sits where reading starts rather than in the margin. */
  border-right: 1px solid var(--line);
}

.rail-head {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 10px;
  height: 48px;
  padding: 0 14px;
  border-bottom: 1px solid var(--line);
}
.rail-t {
  font-family: var(--mono);
  font-size: .62rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-2);
}
.rail-n {
  margin-left: auto;
  font-family: var(--mono);
  font-size: .72rem;
  color: var(--ink);
}

.rail-list {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 10px 12px;
}

.rail-sub {
  flex: 0 0 auto;
  padding: 12px 14px 6px;
  border-top: 1px solid var(--line);
  font-family: var(--mono);
  font-size: .62rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-2);
}

/* The log gives way to the list rather than the other way round: what
   is still due is the reason the rail is there, and what is done is
   the receipt. */
.rail-log {
  flex: 0 1 auto;
  min-height: 0;
  max-height: 38%;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 0 14px 12px;
}

.rail-foot {
  flex: 0 0 auto;
  margin-top: auto;            /* holds the bottom even when the list is empty */
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 14px;
  border-top: 1px solid var(--line);
}
.rail-in {
  flex: 1 1 auto;
  min-width: 0;
  height: 34px;
  padding: 0 14px;
  border: 1px solid var(--line);
  border-radius: var(--r-pill);
  /* Darker than the rail it sits in. An input lifted off its panel
     reads as a button, and this one is a field you type a line into. */
  background: var(--bg);
  color: var(--ink);
  font-size: .78rem;
}
.rail-in::placeholder { color: var(--ink-3); }
.rail-in:focus { border-color: var(--line-2); }

.send {
  width: 34px;
  height: 34px;
  flex: none;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: var(--r-pill);
  background: var(--accent);
  color: var(--accent-in);
  cursor: pointer;
  transition: filter .12s ease;
}
@media (hover: hover) {
  .send:hover { filter: brightness(1.08); }
}
.send:active { filter: brightness(.94); }

/* ── controls ──
   One height, 34px, for everything you can press outside a card, so a
   header row of them cannot come out ragged. */

.step {
  width: 34px;
  height: 34px;
  flex: none;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: var(--r-pill);
  background: var(--card);
  color: var(--ink-2);
  cursor: pointer;
  transition: background .12s ease, color .12s ease;
}
.step.wide {
  width: auto;
  min-width: 34px;
  padding: 0 12px;
  font-family: var(--mono);
  font-size: .62rem;
  letter-spacing: .1em;
  text-transform: uppercase;
}
@media (hover: hover) {
  .step:hover { background: var(--card-2); color: var(--ink); }
}

/* Month / Week / Day. One group, one border around the three, and the
   pressed one lifts a step and takes the accent under it — the same
   grammar as the nav, because it is the same idea. */
.seg {
  position: relative;
  display: flex;
  align-items: stretch;
  border-radius: var(--r-pill);
  background: var(--card);
}
/* The group's hairline is drawn OVER the members rather than as a
   border around them. A real border insets the buttons by 1px, and an
   inset child that carries the same 10px corner as its parent is a
   corner drawn twice — the geometry audit calls that out and it is
   right to. Clipping the group with overflow:hidden fixes the corner
   and then eats the focus ring of whichever member is focused, which
   is worse. */
.seg::after {
  content: '';
  position: absolute;
  inset: 0;
  border: 1px solid var(--line);
  border-radius: var(--r-pill);
  pointer-events: none;
}
.seg button {
  height: 34px;
  min-width: 54px;
  padding: 0 12px;
  border: 0;
  border-radius: 0;
  background: none;
  font-size: .72rem;
  font-weight: 500;
  color: var(--ink-2);
  cursor: pointer;
  transition: background .12s ease, color .12s ease;
}
.seg button:first-child { border-radius: var(--r-pill) 0 0 var(--r-pill); }
.seg button:last-child  { border-radius: 0 var(--r-pill) var(--r-pill) 0; }
.seg button[aria-pressed="true"] {
  background: var(--card-2);
  color: var(--ink);
  box-shadow: inset 0 -2px 0 var(--accent);
}
@media (hover: hover) {
  .seg button:hover { color: var(--ink); }
}

.grow { flex: 1 1 auto; min-width: 0; }

/* ── narrow ──
   The rail leaves the row rather than shrinking. At 320px it is a
   column of rows; at 200px it is neither, and what it holds — what is
   still due today — is the last thing that should get squeezed. */

@media (max-width: 1080px) {
  .body {
    flex-direction: column;
    overflow-y: auto;
  }
  /* One scroller for the stack, not three nested ones. A pane that
     scrolls inside a page that scrolls means a flick either moves the
     grid or moves the rail, and you cannot tell which until it has
     already happened. */
  .main { flex: 0 0 auto; }
  .pane { overflow: visible; }
  .rail {
    /* Stacked, it goes back UNDER the cards. First in the DOM is right
       on a wide screen and wrong on a narrow one: a phone would make
       you scroll past the whole list to reach the grid it summarises. */
    order: 1;
    flex: 0 0 auto;
    width: auto;
    border-right: 0;
    border-top: 1px solid var(--line);
  }
  .rail-list, .rail-log {
    overflow: visible;
    max-height: none;
  }
  .rail-foot { margin-top: 0; }
}

@media (max-width: 700px) {
  .top {
    height: 52px;
    gap: 8px;
    padding: 0 12px;
  }
  /* The sub-label goes and the wordmark stays: the mark is the app,
     the label under it is decoration. The nav labels stay whatever
     happens — two icons alone would be a guess. */
  .brand {
    flex: 0 1 auto;
    font-size: .94rem;
  }
  .brand span { display: none; }
  .nav {
    flex: 1 1 auto;
    justify-content: center;
    min-width: 0;
  }
  .nav-i {
    padding: 0 10px;
    font-size: .78rem;
    gap: 6px;
  }
  .top-r { flex: 0 0 auto; }

  /* A finger is not a cursor. */
  .add, .send, .step { width: 44px; height: 44px; }
  .step.wide { width: auto; min-width: 44px; padding: 0 14px; }
  .seg button { height: 44px; min-width: 60px; }
  .rail-in { height: 44px; }

  .pane { padding: 12px 12px 22px; }
  .rail-head { padding: 0 12px; }
  .rail-list { padding: 10px 10px; }
  .rail-sub, .rail-foot { padding-left: 12px; padding-right: 12px; }
  .rail-log { padding: 0 12px 12px; }
}

/* Under about 430px the bar cannot hold the name as well as the nav,
   and the nav is the only way off this screen. The avatar stays: it is
   the same 30px block and it still says whose day this is. */
@media (max-width: 430px) {
  .who-t { display: none; }
  .nav-i { padding: 0 8px; }
  .top { gap: 6px; }
}

/* Motion here is decoration on every element that has it — a colour
   fade, a ring filling. None of it carries meaning, so none of it is
   worth a headache. Animations are held to a tick rather than removed
   outright: an animation that ends visible must still be allowed to
   reach its end state. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition: none !important;
    animation-duration: .01ms !important;
    animation-delay: 0ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
  }
}

/* ══ TODAY ═══════════════════════════════════════════════════════
   The strip says how the day is going, the grid says what it is made
   of, and the rail says what is next. Every class here carries the
   jt- prefix; the rail's own frame (.rail, .rail-list, .rail-log) is
   chrome and is styled where it is defined, not here.
   ═══════════════════════════════════════════════════════════════ */

/* ── the strip ──
   Four boxes, one row, one height. Side by side means the same box:
   the container stretches its children rather than letting each take
   its own height, so a caption that wraps on the third pill cannot
   leave the first three short. */

.jt-strip {
  display: flex;
  align-items: stretch;
  gap: 12px;
  margin-bottom: 12px;
}

.jt-day,
.jt-stat {
  min-width: 0;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: var(--r-card);
  background: var(--card);
}

.jt-day {
  flex: 2 1 0;
  display: flex;
  align-items: center;
  /* 18px, not 16. Below 860 the strip wraps and the three stat pills
     land under this one: at 16 the date started 6px off the middle
     pill's label, which reads as a miss rather than a decision — and
     the geometry audit calls anything 1–7px apart exactly that. */
  gap: 18px;
}

/* Both lines are block children of a flex column, so both are the full
   width of the block: one left edge and one right edge for the pair,
   whatever the date is that day. */
.jt-dayt {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.jt-dayt b {
  font-size: .94rem;
  font-weight: 600;
  color: var(--ink);
}
.jt-dayt span {
  font-size: .78rem;
  color: var(--ink-2);
}

.jt-stat {
  flex: 1 1 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 2px;
}
.jt-k {
  font-family: var(--mono);
  font-size: .62rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-2);
}
.jt-stat b {
  font-size: 1.6rem;
  font-weight: 600;
  line-height: 1.15;
  color: var(--ink);
}
.jt-u {
  font-size: .66rem;
  color: var(--ink-2);
}

/* ── rings ──
   One geometry, two sizes, and the dash pattern is the whole trick:
   the dasharray is the circumference, so the offset IS the unfilled
   remainder and a transition on it fills the arc.

   The circle is turned -90deg so zero is twelve o'clock rather than
   three. The pre-paint values leave it empty on purpose — set from the
   script it winds UP to its reading, where an unset offset would draw
   a full ring at parse time and unwind it, which reads as the day
   emptying out. */

.jt-ring {
  position: relative;
  flex: none;
  width: 72px;
  height: 72px;
}
/* Direct child only. Descendant would also catch the check glyph in
   the centre and blow a 16px icon up to the width of the ring. */
.jt-ring > svg { width: 100%; height: 100%; }

.jt-track,
.jt-prog { fill: none; stroke-width: 6; }
.jt-track { stroke: var(--track); }

.jt-prog {
  /* No --jt-c outside a card, so the day ring takes the accent: the
     one figure on the screen that is about the day and not a habit. */
  stroke: var(--jt-c, var(--accent));
  stroke-linecap: round;
  stroke-dasharray: 400;
  stroke-dashoffset: 400;
  transform: rotate(-90deg);
  transform-origin: 50% 50%;
  transition: stroke-dashoffset .5s cubic-bezier(.22, .75, .3, 1);
}

/* Both centres sit in the same box so swapping the number for the
   check cannot move anything. text-align keeps the audit off a left
   edge nobody chose — a centred line starts wherever its text ends. */
.jt-ringn,
.jt-tk {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  text-align: center;
  font-family: var(--mono);
  font-size: .82rem;
  color: var(--ink);
}
.jt-tk { color: var(--jt-c, var(--accent)); }

.jt-ring-lg { width: 116px; height: 116px; }
/* 9 device px. The viewBox is 120 units drawn at 116, so a user unit
   is 116/120 of a pixel and a stroke has to be written in the units
   the path it belongs to is drawn in. */
.jt-ring-lg .jt-track,
.jt-ring-lg .jt-prog { stroke-width: 9.31; }
.jt-ring-lg .jt-ringn { font-size: 1.25rem; }

/* ── the grid ──
   auto-fill rather than auto-fit: eight cards on a wide screen keep a
   card's width instead of stretching to fill the row. 1fr rows and
   stretched children mean every card on a row is the same box. */

.jt-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  grid-auto-rows: 1fr;
  align-items: stretch;
  gap: 12px;
}

.jt-card {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: var(--r-card);
  background: var(--card);
  color: var(--ink);
  text-align: left;
  cursor: pointer;
  transition: border-color .16s ease, box-shadow .22s ease;
}

/* Kept today, and that is the only thing that lights a card up. The
   reference has exactly one hot card in its grid; here what makes one
   hot is that you did it. Nothing on this screen is ever coloured for
   a miss — a wash of red across a bad week is a judgement about her,
   and a judgement is what makes a person stop opening the app. */
.jt-card[aria-pressed="true"] {
  border-color: color-mix(in srgb, var(--jt-c) 45%, transparent);
  background:
    radial-gradient(96% 74% at 24% 0%,
      color-mix(in srgb, var(--jt-c) 13%, transparent), transparent 68%),
    var(--card);
  /* The glow is a shadow and not a bled-out pseudo element: a box that
     paints past its own edges counts toward the scroll width of the
     pane it sits in, and the pane would grow a horizontal bar the
     first time anything was ticked. A shadow is ink only. */
  box-shadow:
    0 6px 30px -6px color-mix(in srgb, var(--jt-c) 40%, transparent),
    0 0 0 1px color-mix(in srgb, var(--jt-c) 12%, transparent);
}

@media (hover: hover) {
  .jt-card:hover { border-color: var(--line-2); }
  .jt-card[aria-pressed="true"]:hover {
    border-color: color-mix(in srgb, var(--jt-c) 64%, transparent);
  }
}

.jt-t {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}
.jt-nm {
  font-size: .92rem;
  font-weight: 600;
  color: var(--ink);
}
.jt-goal {
  font-size: .72rem;
  color: var(--ink-3);
}

.jt-chip {
  align-self: flex-start;
  justify-self: start;        /* the grid layout below; ignored in flex */
  /* Pinned to the bottom of the card, so a name that wraps to two
     lines on one card cannot push its chip off the line every other
     chip on the row sits on. */
  margin-top: auto;
  height: 18px;
  display: inline-flex;
  align-items: center;
  padding: 0 9px;
  /* 10px, not 999. A radius clamps to half the height, so 10 on an
     18px chip draws the same pill — and a child rounder than the 12px
     card it sits inside is a fault the geometry audit reports. */
  border: 1px solid var(--jt-c);
  border-radius: var(--r-pill);
  background: none;
  font-family: var(--mono);
  font-size: .58rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--jt-c);
  white-space: nowrap;
}

/* ── rail rows ──
   The rail is chrome. What goes in it belongs to this screen, so the
   rows are jt-. Each row is one button: a tick control nested inside
   a row that is itself a button would be a button inside a button,
   which is invalid and unreachable by keyboard either way. */

.jt-r {
  display: grid;
  grid-template-columns: 22px minmax(0, 1fr) auto 22px;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 40px;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: var(--r-pill);
  background: var(--card);
  color: var(--ink);
  text-align: left;
  cursor: pointer;
  transition: background-color .14s ease, border-color .14s ease;
}

/* Solid, not tinted: every habit colour clears 4.5:1 against --bg, so
   the initial is legible on all eight, and a solid disc says WHICH
   habit from across the room. */
.jt-r-av {
  width: 22px;
  height: 22px;
  display: grid;
  place-items: center;
  border-radius: var(--r-pill);
  background: var(--jt-c);
  color: var(--bg);
  font-size: .62rem;
  font-weight: 700;
}

.jt-r-nm {
  min-width: 0;
  font-size: .78rem;
  color: var(--ink);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* --ink-2, not the --ink-3 a time usually takes: the rail is sorted by
   this figure and it is half of what a row says. Quiet is not the same
   as unreadable. */
.jt-r-at {
  font-family: var(--mono);
  font-size: .62rem;
  letter-spacing: .06em;
  color: var(--ink-2);
  white-space: nowrap;
}

.jt-r-tk {
  width: 22px;
  height: 22px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line-2);
  border-radius: var(--r-pill);
  color: var(--bg);
}
.jt-r[aria-pressed="true"] .jt-r-tk {
  border-color: var(--jt-c);
  background: var(--jt-c);
}
/* The glyph is always in the box and only ever fades: hiding it would
   let the row's four columns settle at two different widths depending
   on whether it was kept. */
.jt-r[aria-pressed="false"] .jt-r-tk svg { opacity: 0; }

@media (hover: hover) {
  .jt-r:hover { border-color: var(--line-2); background: var(--card-2); }
}

/* One row is yours and it is the next thing the day is waiting on —
   the reference's single orange row. Nothing else in the rail takes
   the accent, or it would stop meaning "this one". The avatar keeps
   its habit colour even here: orange says WHEN, colour says WHICH. */
.jt-r[data-next] {
  border-color: var(--accent);
  background: var(--accent);
  color: var(--accent-in);
}
.jt-r[data-next] .jt-r-nm,
.jt-r[data-next] .jt-r-at { color: var(--accent-in); }
.jt-r[data-next] .jt-r-tk {
  border-color: color-mix(in srgb, var(--accent-in) 62%, transparent);
}
@media (hover: hover) {
  .jt-r[data-next]:hover {
    border-color: var(--accent);
    background: var(--accent);
    filter: brightness(1.06);
  }
}

/* ── the log ──
   A receipt, so it is quieter than the list above it: a dot, a name,
   the time it belongs to. Still a button — undoing a tick you did not
   mean is the one thing you come back here to do. */

.jt-l {
  display: grid;
  grid-template-columns: 8px minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 32px;
  padding: 4px 6px;
  border: 0;
  border-radius: var(--r-pill);
  background: none;
  text-align: left;
  cursor: pointer;
  transition: background-color .14s ease;
}
.jt-l-dot {
  width: 8px;
  height: 8px;
  border-radius: var(--r-pill);
  background: var(--jt-c);
}
.jt-l-nm {
  min-width: 0;
  font-size: .72rem;
  color: var(--ink-2);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.jt-l-at {
  font-family: var(--mono);
  font-size: .62rem;
  color: var(--ink-3);
  white-space: nowrap;
}
@media (hover: hover) {
  .jt-l:hover { background: var(--card); }
  .jt-l:hover .jt-l-nm { color: var(--ink); }
}

.jt-none {
  padding: 6px 2px;
  font-size: .72rem;
  color: var(--ink-3);
}

/* ── narrow ── */

/* The day pill takes the whole row before the three stat pills get
   squeezed: 116px of ring plus a long date does not fit in two fifths
   of a phone, and the three figures beside it are single numbers that
   do. */
@media (max-width: 860px) {
  .jt-strip { flex-wrap: wrap; }
  .jt-day { flex: 1 1 100%; }
}

/* A finger is not a cursor. */
@media (max-width: 700px) {
  .jt-r { min-height: 44px; }
  .jt-l { min-height: 44px; }
}

/* One column wide, a ring with the name stacked under it leaves half
   of every card empty and puts eight of them two screens apart. The
   same three parts, laid across instead of down: the ring keeps its
   size, and the name and the chip share the column beside it. */
@media (max-width: 520px) {
  .jt-card {
    display: grid;
    grid-template-columns: 72px minmax(0, 1fr);
    align-items: center;
    column-gap: 12px;
    row-gap: 6px;
  }
  .jt-ring { grid-row: 1 / span 2; }
  .jt-chip { margin-top: 0; }
}

/* The ring filling is decoration, and it is the one animation here
   that runs on load rather than on a press — so it is named locally
   as well as caught by the blanket rule, where a later edit to either
   can be read against the other. */
@media (prefers-reduced-motion: reduce) {
  .jt-prog,
  .jt-card,
  .jt-r,
  .jt-l { transition: none; }
}

/* placeholder — the calendar region is still being written */
.jc-soon { padding: 40px; color: var(--ink-2); font-family: var(--mono); }
</style>
</head>
<body>
<!-- ══ THE SKELETON ══════════════════════════════════════════════
     Every id the script fetches lives here, statically. Render
     functions fill the containers and address what they created with
     querySelector on that container — never getElementById, which
     tests/names.js checks against this markup and would fail. -->
<header class="top">
  <div class="brand">Jade<span>habits</span></div>

  <nav class="nav" aria-label="Screens">
    <button class="nav-i" type="button" data-view="today" aria-current="page">
      <svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 4.6V8l2.3 1.4"/></svg>

    </button>
    <button class="nav-i" type="button" data-view="calendar">
      <svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.2" y="3.4" width="11.6" height="10.4" rx="2"/><path d="M2.2 6.6h11.6M5.4 2.2v2.4M10.6 2.2v2.4"/></svg>
      Calendar
    </button>
  </nav>

  <div class="top-r">
    <div class="who">
      <div class="who-av" aria-hidden="true">J</div>

    </div>
    <button class="add" type="button" id="addBtn" aria-label="Mark everything due today">

</header>

<div class="body">
  <aside class="rail" aria-label="Today at a glance">
    <div class="rail-head">

    <div class="rail-log" id="railLog"></div>
    <form class="rail-foot" id="noteForm" autocomplete="off">
      <input class="rail-in" id="noteIn" type="text" maxlength="140" placeholder="A line about today" aria-label="A line about today" />
      <button class="send" type="submit" id="noteSend" aria-label="Save the line">
        <svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 12.6V3.8M4.2 7.4 8 3.6l3.8 3.8"/></svg>
      </button>

  </aside>

  <main class="main" data-screen="today">
    <div class="pane">
      <section class="jt-strip">
        <div class="jt-day">
          <div class="jt-ring jt-ring-lg">
            <svg viewBox="0 0 120 120" aria-hidden="true">
              <circle class="jt-track" cx="60" cy="60" r="51"/>
              <circle class="jt-prog" id="dayRing" cx="60" cy="60" r="51"/>
            </svg>

          <span class="jt-k">This week</span>

        </div>
        <div class="jt-stat">
          <span class="jt-k">Best</span>
          <b id="statBest">0</b>
          <span class="jt-u">days in a row</span>

      <section class="jt-grid" id="jtGrid"></section>

  <main class="main" data-screen="calendar" hidden>
    <div class="pane">
      <div class="jc-head">
        <button class="step" type="button" id="calPrev" aria-label="Back">
          <svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M9.8 3.6 5.4 8l4.4 4.4"/></svg>
        </button>
        <button class="step" type="button" id="calNext" aria-label="Forward">
          <svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.2 3.6 10.6 8l-4.4 4.4"/></svg>
        </button>
        <button class="step wide" type="button" id="calToday">Today</button>
        <h2 class="jc-title" id="calTitle">—</h2>
        <div class="grow"></div>
        <div class="seg" id="calSeg" role="group" aria-label="Calendar scale">
          <button type="button" data-cal="month" aria-pressed="true">Month</button>
          <button type="button" data-cal="week" aria-pressed="false">Week</button>
          <button type="button" data-cal="day" aria-pressed="false">Day</button>
        </div>
      </div>
      <div class="jc-body" id="calBody"></div>
    </div>
  </main>

</div>

<script>
(function () {
'use strict';

/* ══ THE MODEL ══════════════════════════════════════════════════
   One key, one shape, this browser only, never uploaded. Every
   screen below reads through the functions here and nothing else
   writes the store.

   Names declared in this block are global to the whole file — the
   app is one IIFE — so anything that is not on the contract list
   stays inside a function. A collision here does not throw, it
   replaces, and the symptom turns up screens away.
   ═══════════════════════════════════════════════════════════════ */

const KEY = 'jade.v1';

/* THE LIST IS CODE, NOT DATA. Only the days are saved. A list written
   alongside the days and read back in preference to this one freezes
   on the first browser that ever ticked a box: reordering does
   nothing and a new habit never arrives. Nothing in the app edits it,
   so there is nothing to preserve.

   This one array decides the cards, the rail rows, the calendar
   events and the legend, in that order — so screen order is written
   down exactly once, here.

   at   minutes from local midnight, null for all-day.
   mins block length, null for all-day.
   col  the colour token, and the colour says WHICH habit, never
        whether the day went well. */
const HABITS = [
  { id: 'steps',    name: 'Daily steps',       goal: '10,000 minimum',              cad: { k: 'daily' },        at: null, mins: null, col: '--h-steps' },
  { id: 'walk',     name: 'Morning walk',      goal: 'Before the day starts',       cad: { k: 'daily' },        at: 420,  mins: 45,   col: '--h-walk' },
  { id: 'strength', name: 'Strength training', goal: '4× a week minimum',           cad: { k: 'week', n: 4 },   at: 1020, mins: 60,   col: '--h-strength' },
  { id: 'abs',      name: 'Abs and core',      goal: 'Every second day',            cad: { k: 'gap', n: 2 },    at: 1080, mins: 20,   col: '--h-abs' },
  { id: 'water',    name: 'Water',             goal: '2L minimum',                  cad: { k: 'daily' },        at: null, mins: null, col: '--h-water' },
  { id: 'audible',  name: 'Audible',           goal: '15 minutes, healing or learning', cad: { k: 'daily' },    at: 1200, mins: 15,   col: '--h-audible' },
  { id: 'read',     name: 'Read',              goal: '15 minutes minimum',          cad: { k: 'daily' },        at: 1260, mins: 15,   col: '--h-read' },
  { id: 'sleep',    name: 'Sleep',             goal: '7 hours minimum',             cad: { k: 'daily' },        at: 1350, mins: 30,   col: '--h-sleep' }
];

const HAB = {};
HABITS.forEach(function (h) { HAB[h.id] = h; });

const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June',
  'July', 'August', 'September', 'October', 'November', 'December'];

/* Monday first, because every week in this app is Monday–Sunday: the
   month grid's header row, the week grid's columns and weekStart all
   want the same index. getDay() is Sunday-first, so anything indexing
   this from a Date uses (getDay() + 6) % 7. */
const WDAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

/* ── Dates. Local, always. ─────────────────────────────────────── */

/* Built by hand from the local parts. toISOString() is UTC: west of
   Greenwich after 5pm it hands back tomorrow's date, and a habit
   ticked tonight lands on tomorrow's square and reads as a miss
   today. */
function dayKey(d) {
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}

/* Local midnight. new Date('2026-08-20') is parsed as UTC by spec and
   is the previous evening in half the world. */
function fromKey(k) {
  const p = String(k).split('-');
  return new Date(+p[0], +p[1] - 1, +p[2]);
}

/* From the y/m/d parts, not getTime() + n * 86400000. The day the
   clocks change is 23 or 25 hours long, and the millisecond version
   lands on 23:00 the day before and ticks the wrong box — once a
   year, silently. Normalises to local midnight on the way through. */
function shift(d, n) {
  return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
}

function weekStart(d) {
  return shift(d, -((d.getDay() + 6) % 7));
}

function todayKey() { return dayKey(new Date()); }

/* String compare is enough: YYYY-MM-DD sorts as it reads. */
function isFuture(k) { return String(k) > todayKey(); }

/* ── Storage ───────────────────────────────────────────────────── */

/* REPAIR, NEVER DISCARD. The days are the only thing here that cannot
   be got back — a note can be retyped, the habit list is code. So
   every part of the shape fails on its own: a broken notes object
   costs the notes and not a year of days, an unknown id inside a day
   costs that id and not the day, a key that is not a date costs that
   key and nothing else.

   Takes either the raw string out of storage or an already-parsed
   object, so a test can hand it a shape without stringifying it. */
function repair(raw) {
  const out = { v: 1, days: {}, notes: {} };
  let v = raw;
  if (typeof v === 'string') {
    try { v = JSON.parse(v); } catch (e) { return out; }
  }
  if (!v || typeof v !== 'object' || Array.isArray(v)) return out;

  /* A key has to be a real day, not just the right shape: '2026-02-31'
     matches the pattern and is not a date, and round-tripping it
     through the local constructor is what catches that. */
  const realKey = function (k) {
    return /^\d{4}-\d{2}-\d{2}$/.test(k) && dayKey(fromKey(k)) === k;
  };

  const days = v.days;
  if (days && typeof days === 'object' && !Array.isArray(days)) {
    Object.keys(days).forEach(function (k) {
      if (!realKey(k)) return;
      const list = days[k];
      if (!Array.isArray(list)) return;
      const clean = [];
      /* Stored order is kept, and it is the order things were ticked —
         the log reads back newest first off the end of this array. */
      list.forEach(function (id) {
        if (HAB[id] && clean.indexOf(id) < 0) clean.push(id);
      });
      if (clean.length) out.days[k] = clean;
    });
  }

  const notes = v.notes;
  if (notes && typeof notes === 'object' && !Array.isArray(notes)) {
    Object.keys(notes).forEach(function (k) {
      if (!realKey(k)) return;
      const s = notes[k];
      if (typeof s === 'string' && s.trim()) out.notes[k] = s.trim();
    });
  }
  return out;
}

/* One stable object for the life of the page: load() refills it
   rather than rebinding it, so anything holding a reference — the
   test handle below included — never goes stale. */
const state = repair(null);

function load() {
  let raw = null;
  /* Private mode throws on READ as well as on write. An app that dies
     because it cannot see storage is worse than one that cannot
     save. */
  try { raw = localStorage.getItem(KEY); } catch (e) { raw = null; }
  const v = repair(raw);
  state.days = v.days;
  state.notes = v.notes;
  return state;
}

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); return true; }
  catch (e) { return false; }
}

function subscribe(fn) {
  if (typeof fn === 'function') subscribe.fns.push(fn);
}
/* Hung off the function rather than declared beside it: every
   top-level name in this file is shared with three other regions, and
   'listeners' is exactly the kind of name two of them would both
   want. */
subscribe.fns = [];

/* The only write path. Save first — a listener that throws must not
   cost the tick that caused it. */
function changed() {
  save();
  subscribe.fns.forEach(function (fn) { fn(); });
}

load();

/* ── Ticks ─────────────────────────────────────────────────────── */

function keptOn(k, id) {
  const list = state.days[k];
  return !!list && list.indexOf(id) >= 0;
}

function setKept(k, id, on) {
  if (!HAB[id] || dayKey(fromKey(k)) !== k) return;
  /* A tick on a day that has not happened is not a record of
     anything. The guard is here and not only in the calendar so that
     no screen can write one by accident. */
  if (isFuture(k)) return;
  const list = state.days[k] || [];
  const i = list.indexOf(id);
  if (on && i < 0) list.push(id);        // push: ticked order is the log's order
  else if (!on && i >= 0) list.splice(i, 1);
  else return;                           // no change, no write, no re-render
  if (list.length) state.days[k] = list; else delete state.days[k];
  changed();
}

/* Returns what is true after the write, not what was asked for: a
   future day refuses, and the caller needs to know that. */
function toggle(k, id) {
  setKept(k, id, !keptOn(k, id));
  return keptOn(k, id);
}

/* ── Cadence ───────────────────────────────────────────────────── */

function dueOn(id, k) {
  const h = HAB[id];
  if (!h) return false;
  const c = h.cad;
  if (c.k === 'daily') return true;

  if (c.k === 'gap') {
    /* "Never go two days without", measured from the last time you
       actually did it. Not an even/odd offset from an anchor date:
       one late day and an anchored schedule is wrong about every day
       after it, forever, and nothing ever puts it back. This
       self-heals the next morning. */
    for (let i = 1; i < c.n; i++) {
      if (keptOn(dayKey(shift(fromKey(k), -i)), id)) return false;
    }
    return true;
  }

  /* week: optional while you can still afford to skip, due the moment
     you cannot — that is what "4× a week minimum" means.

     The count deliberately excludes the day being asked about. If the
     day's own tick counted, ticking the last one of the four would
     flip the answer to "not due" and the row would vanish out from
     under the finger that ticked it, and the day ring would fall. */
  const mon = weekStart(fromKey(k));
  let kept = 0, left = 0, seen = false;
  for (let i = 0; i < 7; i++) {
    const d = dayKey(shift(mon, i));
    if (d === k) seen = true;
    else if (keptOn(d, id)) kept++;
    if (seen) left++;                    // days left counts the day itself
  }
  const need = c.n - kept;
  if (need <= 0) return false;
  return left <= need;
}

function dueIdsOn(k) {
  return HABITS.filter(function (h) { return dueOn(h.id, k); })
    .map(function (h) { return h.id; });
}

/* ── Counts ────────────────────────────────────────────────────── */

/* Every ring in the app is kept ÷ due for one Monday–Sunday week. */
function weekStat(id, ref) {
  const h = HAB[id];
  if (!h) return { kept: 0, due: 0 };
  const mon = weekStart(ref || new Date());

  if (h.cad.k === 'week') {
    /* The quota is the denominator, whole and from Monday: a week
       target does not accrue by the day. Overshooting reads 5/4 and
       the ring clamps — an honest number beats a flattering one. */
    let kept = 0;
    for (let i = 0; i < 7; i++) if (keptOn(dayKey(shift(mon, i)), id)) kept++;
    return { kept: kept, due: h.cad.n };
  }

  /* The denominator stops at today and grows as the week does. A
     Wednesday ring that reads 3/7 is telling you that you have failed
     at Thursday, and Thursday has not happened; a week that is over
     is the whole seven. */
  const t = todayKey();
  let kept = 0, due = 0;
  for (let i = 0; i < 7; i++) {
    const k = dayKey(shift(mon, i));
    if (k > t) break;
    const on = keptOn(k, id);
    /* Kept counts as due even on a rest day — doing more than you
       promised must not push the ratio down. */
    if (on || dueOn(id, k)) due++;
    if (on) kept++;
  }
  return { kept: kept, due: due };
}

function dayStat(k) {
  const ids = dueIdsOn(k);
  const on = state.days[k] || [];
  let kept = 0;
  ids.forEach(function (id) { if (keptOn(k, id)) kept++; });
  /* A habit kept on a day it did not owe you lands on both sides of
     the ratio, so the ring moves the moment anything is ticked and
     can never fall. */
  let extra = 0;
  on.forEach(function (id) { if (HAB[id] && ids.indexOf(id) < 0) extra++; });
  return { kept: kept + extra, due: ids.length + extra };
}

/* Consecutive DUE days kept, walking back from today. A day it was
   not due neither breaks the chain nor counts toward it. */
function chain(id) {
  if (!HAB[id]) return 0;
  const ks = Object.keys(state.days).sort();
  if (!ks.length) return 0;
  const floor = ks[0];
  let d = new Date();
  /* An unfinished today is not a broken chain, it is a day still
     going. Otherwise every card reads 0 at breakfast. */
  if (!keptOn(dayKey(d), id)) d = shift(d, -1);
  let n = 0;
  for (let i = 0; i < 4000; i++) {
    const k = dayKey(d);
    if (k < floor) break;
    if (keptOn(k, id)) n++;
    else if (dueOn(id, k)) break;
    d = shift(d, -1);
  }
  return n;
}

/* Consecutive days back from today where everything due was kept. */
function streak() {
  const ks = Object.keys(state.days).sort();
  if (!ks.length) return 0;
  const floor = ks[0];
  let d = new Date();
  const now = dayStat(dayKey(d));
  /* Today joins the run only once it is complete — an unfinished
     today must never read as a broken streak. */
  if (!(now.due > 0 && now.kept >= now.due)) d = shift(d, -1);
  let n = 0;
  for (let i = 0; i < 4000; i++) {
    const k = dayKey(d);
    if (k < floor) break;
    const s = dayStat(k);
    if (!(s.due > 0 && s.kept >= s.due)) break;
    n++;
    d = shift(d, -1);
  }
  return n;
}

/* The longest such run over everything stored. An unfinished today
   ends the current run for this purpose, which is right: the run up
   to yesterday is already counted. */
function best() {
  const ks = Object.keys(state.days).sort();
  if (!ks.length) return 0;
  const end = todayKey();
  let d = fromKey(ks[0]), run = 0, top = 0;
  for (let i = 0; i < 4000; i++) {
    const k = dayKey(d);
    if (k > end) break;
    const s = dayStat(k);
    if (s.due > 0 && s.kept >= s.due) { run++; if (run > top) top = run; }
    else run = 0;
    d = shift(d, 1);
  }
  return top;
}

function weekPct(ref) {
  const when = ref || new Date();
  let kept = 0, due = 0;
  HABITS.forEach(function (h) {
    const s = weekStat(h.id, when);
    kept += s.kept; due += s.due;
  });
  if (!due) return 0;
  return Math.round(clamp(kept / due, 0, 1) * 100);
}

/* ── The line about the day ─────────────────────────────────────── */

function noteOn(k) {
  const n = state.notes[k];
  return typeof n === 'string' ? n : '';
}

function setNote(k, txt) {
  if (dayKey(fromKey(k)) !== k) return;
  const s = String(txt == null ? '' : txt).trim().slice(0, 140);
  /* An empty line is not a line: clearing the box removes the note
     rather than storing '' for every day it was ever opened. */
  if (s) state.notes[k] = s; else delete state.notes[k];
  changed();
}

/* ── Formatting ────────────────────────────────────────────────── */

function fmtTime(min) {
  if (min == null) return 'ALL DAY';
  return String(Math.floor(min / 60)).padStart(2, '0') + ':' +
    String(min % 60).padStart(2, '0');
}

function fmtDay(d) { return WDAYS[(d.getDay() + 6) % 7] + ' ' + d.getDate(); }

function fmtLong(d) {
  /* Full weekday names sit here rather than beside WDAYS: WDAYS is the
     calendar's Monday-first column header and is used as one, and a
     single array cannot be both without a lookup at every call. */
  const full = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday',
    'Saturday', 'Sunday'];
  return full[(d.getDay() + 6) % 7] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()];
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function clamp(v, lo, hi) {
  const a = lo == null ? 0 : lo, b = hi == null ? 1 : hi;
  return v < a ? a : v > b ? b : v;
}

/* One handle on the model, so tests/jade.js can drive it directly.
   Asserting a cadence rule through eight clicks and a re-render tests
   the renderer, not the rule — and when it fails it does not say
   which. Nothing in the app reads this. */
window.JADE = {
  KEY: KEY, HABITS: HABITS, HAB: HAB, MONTHS: MONTHS, WDAYS: WDAYS,
  state: state, load: load, save: save, repair: repair,
  changed: changed, subscribe: subscribe,
  dayKey: dayKey, fromKey: fromKey, shift: shift, weekStart: weekStart,
  todayKey: todayKey, isFuture: isFuture,
  keptOn: keptOn, setKept: setKept, toggle: toggle,
  dueOn: dueOn, dueIdsOn: dueIdsOn,
  weekStat: weekStat, dayStat: dayStat, chain: chain, streak: streak,
  best: best, weekPct: weekPct,
  noteOn: noteOn, setNote: setNote,
  fmtTime: fmtTime, fmtDay: fmtDay, fmtLong: fmtLong,
  esc: esc, clamp: clamp
};

/* ══ TODAY ═══════════════════════════════════════════════════════
   Three readings of one day: the strip is how it is going, the grid
   is what it is made of, and the rail is what is next. All three go
   through dayStat, weekStat and chain, so no two of them can end up
   disagreeing about a number.

   Nothing below reads storage. The model is the only thing that
   touches the key, and subscribe() calls jtRender when it changes.
   ═══════════════════════════════════════════════════════════════ */

function jtRender() {
  jtStrip();
  jtCards();
  jtRail();
}

/* ── the strip ─────────────────────────────────────────────────── */

function jtStrip() {
  const k = todayKey();
  const s = dayStat(k);

  /* The day ring is kept ÷ due for TODAY, and it moves the moment
     anything is ticked — that is the whole reason it is the biggest
     thing on the screen. */
  jtRing.set(document.getElementById('dayRing').closest('.jt-ring'), s.kept, s.due);

  document.getElementById('dayDate').textContent = fmtLong(new Date());
  document.getElementById('dayCap').textContent = jtSay(s.kept, s.due);
  document.getElementById('statStreak').textContent = streak();
  document.getElementById('statWeek').textContent = weekPct() + '%';
  document.getElementById('statBest').textContent = best();

  /* The line under the name in the top bar is this same reading. Left
     to the markup's placeholder it would go on saying "nothing kept
     yet" over a screen of ticked cards, and the one line on the page
     that is about her would be the one line that was wrong. */
  document.getElementById('whoSub').textContent =
    !s.kept ? 'nothing kept yet'
      : s.kept >= s.due ? 'all done today'
        : s.kept + ' of ' + s.due + ' kept today';
}

/* "three still to go", not "3/7 (43%)". The ring already carries the
   fraction; this is the sentence you read instead of doing the sum. */
function jtSay(kept, due) {
  if (!due) return 'nothing due';
  const left = due - kept;
  if (left <= 0) return 'all done';
  const w = ['zero', 'one', 'two', 'three', 'four', 'five', 'six',
    'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve'];
  return (w[left] || left) + ' still to go';
}

/* ── rings ─────────────────────────────────────────────────────── */

/* The skeleton only. State goes on through jtRing.set, so a ring that
   is already on the screen is UPDATED rather than replaced — a fresh
   element has no previous offset to transition from and would snap.

   r + half the stroke is 36, so the drawn ring is exactly 72px across
   and the viewBox is 1:1 with CSS pixels: no scale factor between the
   width the stroke asks for and the width that lands. */
function jtRing() {
  return '<span class="jt-ring">' +
      '<svg viewBox="0 0 72 72" aria-hidden="true">' +
        '<circle class="jt-track" cx="36" cy="36" r="33"/>' +
        '<circle class="jt-prog" cx="36" cy="36" r="33"/>' +
      '</svg>' +
      '<span class="jt-ringn" aria-hidden="true"></span>' +
      '<span class="jt-tk" hidden>' +
        '<svg class="ic" viewBox="0 0 16 16" aria-hidden="true">' +
          '<path d="M3.6 8.4 6.6 11.4 12.4 4.9"/></svg>' +
      '</span>' +
      /* The picture is never the only copy of the number: at 100% the
         centre is a check glyph, and a check is not a reading. */
      '<span class="sr"></span>' +
    '</span>';
}

/* Drives any ring, whatever its radius — the day ring's geometry is
   in the markup and a card's is above, so the circumference is read
   off the circle rather than written down twice. */
jtRing.set = function (ring, kept, due) {
  const c = ring.querySelector('.jt-prog');
  const C = 2 * Math.PI * parseFloat(c.getAttribute('r'));
  const p = due > 0 ? Math.min(1, Math.max(0, kept / due)) : 0;
  /* Inline, because the pre-paint values in the stylesheet leave the
     ring empty and these have to win over them. */
  c.style.strokeDasharray = C.toFixed(2);
  c.style.strokeDashoffset = (C * (1 - p)).toFixed(2);

  const num = ring.querySelector('.jt-ringn');
  const tk = ring.querySelector('.jt-tk');
  const sr = ring.querySelector('.sr');
  num.textContent = kept + '/' + due;
  /* The day ring has no check: its denominator is what today happens
     to owe, and 7/7 there is a fuller sentence than a tick. */
  if (tk) {
    const full = due > 0 && p >= 1;
    num.hidden = full;
    tk.hidden = !full;
  }
  if (sr) sr.textContent = kept + ' of ' + due + ' this week';
};

/* ── the grid ──────────────────────────────────────────────────── */

function jtCards() {
  const grid = document.getElementById('jtGrid');
  /* Built once. Rewriting innerHTML on every tick would throw away the
     button the finger is still on — focus lands back on <body> and a
     keyboard user loses their place halfway down the grid — and every
     ring would be reborn at its final offset, so nothing would ever
     animate. The list is code, so the count is the only thing that can
     ever change. */
  if (grid.children.length !== HABITS.length) {
    grid.innerHTML = HABITS.map(function (h) { return jtCard(h); }).join('');
  }
  HABITS.forEach(function (h) {
    jtCard.fill(grid.querySelector('.jt-card[data-id="' + h.id + '"]'), h);
  });
}

/* Everything that cannot change: the id, the colour, the name, the
   target. jtCard.fill does the rest. */
function jtCard(h) {
  return '<button type="button" class="jt-card" data-id="' + h.id + '"' +
      ' style="--jt-c:var(' + h.col + ')" aria-pressed="false">' +
      jtRing() +
      '<span class="jt-t">' +
        '<span class="jt-nm">' + esc(h.name) + '</span>' +
        '<span class="jt-goal">' + esc(h.goal) + '</span>' +
      '</span>' +
      '<span class="jt-chip"></span>' +
    '</button>';
}

jtCard.fill = function (el, h) {
  const k = todayKey();
  const on = keptOn(k, h.id);
  el.setAttribute('aria-pressed', on ? 'true' : 'false');

  const s = weekStat(h.id, new Date());
  jtRing.set(el.querySelector('.jt-ring'), s.kept, s.due);

  /* Written lowercase and uppercased by the stylesheet: a screen
     reader spells "DUE" out letter by letter and reads "due". */
  const n = chain(h.id);
  el.querySelector('.jt-chip').textContent =
    (!on && !dueOn(h.id, k)) ? 'rest day'
      : n > 0 ? n + ' day chain'
        : 'due';
};

/* ── the rail ──────────────────────────────────────────────────── */

function jtRail() {
  const k = todayKey();
  const list = document.getElementById('railList');
  const s = dayStat(k);

  const due = dueIdsOn(k)
    .map(function (id) { return HAB[id]; })
    .sort(function (a, b) {
      /* All-day ahead of the clock, and -1 rather than 0 so a habit at
         00:00 would still fall after it. The sort is stable, so the two
         all-day habits keep the order the list gives them. */
      return (a.at == null ? -1 : a.at) - (b.at == null ? -1 : b.at);
    });

  /* Rebuilt only when the set of rows changes — which today's own
     ticks cannot do, since neither cadence asks about the day it is
     being asked about. Same reason as the grid: the row you just
     pressed has to survive being pressed. */
  const sig = due.map(function (h) { return h.id; }).join(',');
  if (jtRail.sig !== sig) {
    jtRail.sig = sig;
    list.innerHTML = due.length
      ? due.map(function (h) { return jtRailRow(h); }).join('')
      : '<p class="jt-none">nothing due today</p>';
  }

  /* The next thing due is the first row not yet ticked. Once they are
     all ticked nothing is orange — an accent with nothing left to
     point at is just a colour. */
  let next = '';
  for (let i = 0; i < due.length; i++) {
    if (!keptOn(k, due[i].id)) { next = due[i].id; break; }
  }
  const rows = list.querySelectorAll('.jt-r');
  for (let i = 0; i < rows.length; i++) {
    const row = rows[i];
    row.setAttribute('aria-pressed', keptOn(k, row.dataset.id) ? 'true' : 'false');
    if (row.dataset.id === next) row.setAttribute('data-next', '');
    else row.removeAttribute('data-next');
  }

  document.getElementById('railCount').textContent =
    !s.due ? 'nothing due'
      : s.kept >= s.due ? 'all done'
        : s.kept + '/' + s.due;

  /* A tick anywhere on the screen re-renders this, so a line being
     typed must not be overwritten by the line that is saved. */
  const inp = document.getElementById('noteIn');
  if (inp !== document.activeElement) inp.value = noteOn(k);

  jtLog();
}

function jtRailRow(h) {
  return '<button type="button" class="jt-r" data-id="' + h.id + '"' +
      ' style="--jt-c:var(' + h.col + ')" aria-pressed="false">' +
      '<span class="jt-r-av" aria-hidden="true">' +
        esc(h.name.charAt(0).toUpperCase()) + '</span>' +
      '<span class="jt-r-nm">' + esc(h.name) + '</span>' +
      '<span class="jt-r-at">' + fmtTime(h.at) + '</span>' +
      '<span class="jt-r-tk" aria-hidden="true">' +
        '<svg class="ic" viewBox="0 0 16 16" aria-hidden="true">' +
          '<path d="M3.6 8.4 6.6 11.4 12.4 4.9"/></svg>' +
      '</span>' +
    '</button>';
}

function jtLog() {
  const k = todayKey();
  /* state.days keeps the order things were ticked in, so the log reads
     off the end of it. Nothing here stamps a clock time — the time on
     a row is the time the habit belongs to, which is the one the rail
     above it is sorted by. */
  const on = (state.days[k] || []).slice().reverse();
  document.getElementById('railLog').innerHTML = on.length
    ? on.map(function (id) {
      const h = HAB[id];
      return '<button type="button" class="jt-l" data-id="' + h.id + '"' +
          ' style="--jt-c:var(' + h.col + ')" aria-pressed="true">' +
          '<span class="jt-l-dot" aria-hidden="true"></span>' +
          '<span class="jt-l-nm">' + esc(h.name) + '</span>' +
          '<span class="jt-l-at">' + fmtTime(h.at) + '</span>' +
        '</button>';
    }).join('')
    : '<p class="jt-none">nothing logged yet</p>';
}

/* ── wiring ────────────────────────────────────────────────────── */

/* Once, from the containers, never per render. Four handlers on one
   click is what re-binding on every render buys you, and the fourth
   one toggles the tick back off. */
function jtBind() {
  if (jtBind.done) return;
  jtBind.done = true;

  /* todayKey() is read inside the handler and not out here: this page
     is left open overnight, and a tick has to land on the day the
     finger is on. */
  const tick = function (sel) {
    return function (e) {
      const b = e.target.closest(sel);
      if (b) toggle(todayKey(), b.dataset.id);
    };
  };

  document.getElementById('jtGrid')
    .addEventListener('click', tick('.jt-card'));
  document.getElementById('railList')
    .addEventListener('click', tick('.jt-r'));
  document.getElementById('railLog')
    .addEventListener('click', tick('.jt-l'));

  document.getElementById('addBtn').addEventListener('click', function () {
    const k = todayKey();
    /* Marks what is left and stops there. Nothing left to mark is not
       an invitation to unmark the day: an "undo everything" hidden on
       the button you press to finish is a trap you find by accident,
       once, having lost the day. */
    dueIdsOn(k).forEach(function (id) {
      if (!keptOn(k, id)) toggle(k, id);
    });
  });

  document.getElementById('noteForm').addEventListener('submit', function (e) {
    e.preventDefault();
    const inp = document.getElementById('noteIn');
    setNote(todayKey(), inp.value);
    /* Read back rather than left as typed: setNote trims and caps, and
       the box should show what is stored, not what was offered. The
       re-render leaves a focused field alone, so this is the only
       place that line can land. */
    inp.value = noteOn(todayKey());
  });
}

/* placeholder — the calendar region is still being written */
let jcRef = new Date();
let jcScale = 'month';
function jcRender() {
  document.getElementById('calBody').innerHTML = '<div class="jc-soon">calendar</div>';
}
function jcBind() {}

/* ══ THE APP ══════════════════════════════════════════════════════
   Two screens, one rail. The rail stays up on both: what is due today
   does not stop being true because you went to look at March. */

let view = 'today';

function showView(v) {
  if (v !== 'today' && v !== 'calendar') return;
  view = v;
  for (const m of document.querySelectorAll('.main')) m.hidden = m.dataset.screen !== v;
  for (const b of document.querySelectorAll('.nav-i')) {
    if (b.dataset.view === v) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  }
  /* The calendar is not rendered while it is hidden — a month grid that
     nothing can see is 42 cells of layout for no reason — so it is drawn
     on the way in. */
  if (v === 'calendar') jcRender();
}

function boot() {
  document.querySelector('.nav').addEventListener('click', (e) => {
    const b = e.target.closest('.nav-i');
    if (b) showView(b.dataset.view);
  });

  jtBind();
  jcBind();
  subscribe(() => { jtRender(); if (view === 'calendar') jcRender(); });
  jtRender();
  showView('today');

  /* Left open overnight, every reading on the screen is about the wrong
     day. Cheap to check, and the alternative is a tick landing on
     yesterday. */
  let stamp = todayKey();
  setInterval(() => {
    const now = todayKey();
    if (now === stamp) return;
    stamp = now;
    jtRender();
    if (view === 'calendar') jcRender();
  }, 30000);
}

boot();
})();
</script>
</body>
