<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<!-- Both, and the second set of eight habit colours was drawn rather
     than derived: see the light block in the stylesheet. -->
<meta name="color-scheme" content="dark light" />
<meta name="theme-color" content="#15171E" />
<!-- Without this the browser asks for /favicon.ico on every load and takes
     a 404 for it. -->
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<title>Jade — Habits</title>
<style>
/* ══ TOKENS AND CHROME ══════════════════════════════════════════
   The frame every screen sits in: the reset, the type, the top bar,
   the two panes and the rail. Nothing here knows what a habit is.

   STANDALONE. No @font-face, no image, no import — this file names no
   asset outside jade/, so the app opens off the disk with the network
   unplugged and looks the same. The type is whatever the machine
   already has.

   Class prefixes are load-bearing: jt- is the today screen's, jc- is
   the calendar's, and everything below is unprefixed because it
   belongs to no screen. Nothing here styles either prefix.
   ══════════════════════════════════════════════════════════════ */

:root {
  color-scheme: dark;

  --bg:        #15171E;   /* page */
  --surface:   #1C1F28;   /* top bar, rail — a step up off the page */
  --card:      #232733;   /* panels and cards */
  --card-2:    #2A2F3C;   /* hover, and the pressed half of a segment */
  --line:      #313746;   /* the 1px border, one step above the card */
  --line-2:    #3C4354;   /* brighter border: a kept card, a scrollbar */
  --ink:       #F1F3F8;
  --ink-2:     #8E95A6;
  --ink-3:     #626A7B;   /* captions and times only — see the note below */

  /* One warm accent, and it is spent only on what is live, what is
     yours, and what you press. A second accent would make both of them
     mean nothing. */
  --accent:    #FF6FA5;   /* soft hot pink */
  /* NOT white. White on this pink measures 2.60:1, and it measured the
     same on the orange this replaced — the solid rail row, the + and the
     send arrow were all under the floor and looked deliberate. A near
     black warmed toward the accent reads as belonging to it and comes
     out at 7.01:1. */
  --accent-in: #1A1220;
  --track:     #2C3140;   /* the unfilled part of a ring or a bar */
  --focus:     #FF6FA5;
  color-scheme: dark;

  /* BUBBLE GEOMETRY. Everything that holds text is round: a panel is a
     22px bubble, anything that holds one line — a chip, a rail row, a
     log entry, a control — is a full pill. Tokens rather than numbers
     because a card and the box beside it drifting apart by 2px is the
     kind of thing nobody sees and everybody feels. */
  --r-card: 22px;
  --r-in:   16px;
  --r-pill: 999px;

  --font: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;

  /* Eight identities. The colour says WHICH habit, never whether the
     day went well — a kept mark takes its habit's colour and an unkept
     one is hollow, so no week can ever come out red. A wash of red
     across a bad week is a judgement, and a judgement is what makes
     you stop opening the screen. */
  --h-steps:    #3DE8A6;
  --h-walk:     #A8ED5B;
  /* Strength takes the orange the accent vacated. Two pinks on one
     screen — an accent that means "this is you, press this" and a habit
     identity that means "strength training" — is a collision the ΔE
     floor would pass and the eye would not. */
  --h-strength: #FFA33D;
  --h-abs:      #C08BFF;
  --h-water:    #45DDF2;
  --h-sleep:    #7FA6FF;
  --h-read:     #F2E45C;
  --h-audible:  #FF6B6B;
}

/* ══ LIGHT ════════════════════════════════════════════════════════
   Not the dark palette lightened. The eight habit hues are chosen
   again from scratch, because a neon that reads on near-black is 1.6:1
   on white — and a yellow dark enough to pass as TEXT on white has
   turned brown and collided with the orange. So on light the colour is
   a MARK and never a label: the chips take ink for their text and the
   hue for their border. Everything here was measured, not eyeballed —
   every hue clears 3:1 as a mark on the card and carries white at 3:1,
   pairwise deltaE floors at 23.7, and the nearest hue to the accent is
   36.2 away. */
:root[data-theme="light"] {
  color-scheme: light;

  --bg:        #EEF0F6;
  --surface:   #FFFFFF;
  --card:      #FFFFFF;
  --card-2:    #F1F3F9;
  --line:      #DFE3EC;
  --line-2:    #C6CDDB;
  --ink:       #161A23;
  --ink-2:     #5A6376;
  --ink-3:     #7B8496;
  --accent:    #D6336C;
  --accent-in: #FFFFFF;
  --track:     #E4E8F0;
  --focus:     #D6336C;

  --h-steps:    #0CA678;
  --h-walk:     #5C940D;
  --h-strength: #E8590C;
  --h-abs:      #7048E8;
  --h-water:    #0B7285;
  --h-sleep:    #3B5BDB;
  --h-read:     #9C7A00;
  --h-audible:  #E03131;
}


/* ── reset ── */

*, *::before, *::after { box-sizing: border-box; }

html {
  height: 100%;
  -webkit-text-size-adjust: 100%;
}

body {
  height: 100%;
  height: 100dvh;          /* a phone's toolbar slides away; 100vh does not follow it */
  margin: 0;
  display: flex;
  flex-direction: column;
  /* The page itself never scrolls. The header is always on screen and
     the two scrollers inside it — the pane and the rail's list — do all
     the moving. */
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.45;
  /* Every figure on this screen is a count that ticks: 5/7 becoming
     6/7 must not shift the glyph beside it. */
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, p, figure { margin: 0; }
b, strong { font-weight: 600; }

button, input, select, textarea {
  font: inherit;
  color: inherit;
  letter-spacing: inherit;
}
button { -webkit-appearance: none; appearance: none; }

/* An inline SVG sits on the text baseline and leaves 4px of descender
   under it, which is enough to knock a 34px button off centre. */
svg { display: block; }

/* !important because the chrome and both screens set display on the
   things they hide — .main is a flex column, and a plain
   [hidden]{display:none} loses to it. The inactive screen would stay
   on top of the active one, and nothing about the markup would say
   why. */
[hidden] { display: none !important; }

::selection { background: var(--accent); color: var(--accent-in); }

/* Every control, one rule, so a new control cannot ship without it.
   :focus-visible rather than :focus — a mouse press on a card should
   not leave a ring behind it. */
:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

/* The default scrollbar is a light-mode object and it lands on the one
   dark panel it crosses. */
.pane, .rail-list, .body {
  scrollbar-width: thin;
  scrollbar-color: var(--line-2) transparent;
}
.pane::-webkit-scrollbar,
.rail-list::-webkit-scrollbar,
.body::-webkit-scrollbar { width: 9px; height: 9px; }
.pane::-webkit-scrollbar-thumb,
.rail-list::-webkit-scrollbar-thumb,
.body::-webkit-scrollbar-thumb {
  background: var(--line-2);
  border: 2px solid transparent;
  background-clip: content-box;
  border-radius: var(--r-pill);
}
.pane::-webkit-scrollbar-track,
.rail-list::-webkit-scrollbar-track,
.body::-webkit-scrollbar-track { background: transparent; }

/* Visually gone, still read aloud. 2px rather than the usual 1px:
   a 1px box is indistinguishable from a hairline rule that has
   collapsed, and the geometry audit has to be able to tell a label it
   should ignore from a layout fault it should not. */
.sr {
  position: absolute;
  width: 2px;
  height: 2px;
  margin: -2px;
  padding: 0;
  border: 0;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

/* ── top bar ──
   56px, one hairline under it, and three things on it: the wordmark
   left, the screens centred, you on the right. */

.top {
  flex: 0 0 auto;
  position: relative;
  z-index: 2;
  height: 56px;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 18px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}

/* The wordmark and the identity block take an equal share of whatever
   is left over, which is what puts the nav on the true centre of the
   bar rather than the centre of the space after the wordmark. */
.brand {
  flex: 1 1 0;
  min-width: 0;
  display: flex;
  /* Centred rather than baseline now that a control shares the row.
     A 32px button on a text baseline sits a third of its height too
     low, and the 1px the sub-label gives up is the cheaper of the two. */
  align-items: center;
  gap: 7px;
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: -.01em;
  color: var(--ink);
  white-space: nowrap;
}
.brand span {
  font-size: .62rem;
  font-weight: 500;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-3);
}

.nav {
  flex: 0 0 auto;
  align-self: stretch;          /* so the underline can reach the bar's border */
  display: flex;
  align-items: stretch;
  gap: 4px;
}

.nav-i {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  /* Stretched, less 2px top and bottom. Full height would put the
     focus ring's top edge off the top of the window and its bottom
     edge over the pane; 2px of slack lands the whole ring inside the
     header at any bar height, which is why this is a margin and not a
     calc against a height that changes on a phone. */
  margin: 2px 0;
  min-height: 32px;
  padding: 0 12px;
  border: 0;
  background: none;
  font-size: .82rem;
  font-weight: 500;
  color: var(--ink-2);
  white-space: nowrap;
  cursor: pointer;
  transition: color .12s ease;
}
/* The bar is drawn on every item and coloured on one, so the active
   item is not 2px taller than its neighbour. -3px is the item's own
   2px of bottom slack plus the header's 1px border: the bar covers
   that border for the width of the item rather than sitting above it. */
.nav-i::after {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  bottom: -3px;
  height: 2px;
  background: transparent;
}
.nav-i[aria-current="page"] { color: var(--ink); }
.nav-i[aria-current="page"]::after { background: var(--accent); }
@media (hover: hover) {
  .nav-i:hover { color: var(--ink); }
}

/* Icons carry no attributes of their own — one class decides the size
   and the weight of every glyph in the app, so a new icon cannot
   arrive at a different stroke. */
.ic {
  width: 16px;
  height: 16px;
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.top-r {
  flex: 1 1 0;
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 10px;
}

.who {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 0;
}
.who-av {
  width: 30px;
  height: 30px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: var(--r-pill);
  background: color-mix(in srgb, var(--accent) 18%, transparent);
  color: var(--accent);
  font-size: .78rem;
  font-weight: 600;
}
.who-t {
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-width: 0;
  line-height: 1.25;
}
.who-t b {
  font-size: .78rem;
  color: var(--ink);
}
.who-t span {
  font-size: .66rem;
  color: var(--ink-2);
}
.who-t b, .who-t span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.add {
  width: 34px;
  height: 34px;
  flex: none;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: var(--r-pill);
  background: var(--accent);
  color: var(--accent-in);
  cursor: pointer;
  transition: filter .12s ease;
}
@media (hover: hover) {
  .add:hover { filter: brightness(1.08); }
}
.add:active { filter: brightness(.94); }

/* ── the frame under the header ── */

.body {
  flex: 1 1 auto;
  display: flex;
  min-height: 0;              /* without this the pane grows instead of scrolling */
}

.main {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
}

.pane {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  padding: 16px 18px 26px;
}

/* The reference is a 1512px window and says nothing about a 2560px
   one. Left alone, eight cards at auto-fill would spread to eight
   across and the strip's ring would end up a metre from its caption,
   so the content keeps a reading width and takes the middle. */
.pane > * {
  max-width: 1180px;
  margin-inline: auto;
}

/* The panel toggle. Far left, where a sidebar control belongs, and
   INSIDE .brand so the bar's two flex:1 halves stay equal and the nav
   keeps the true centre of the header rather than the centre of what is
   left after a button. */
.panel {
  flex: none;
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: var(--r-pill);
  background: var(--card);
  color: var(--ink-2);
  cursor: pointer;
  transition: color .12s ease, background .12s ease;
}
.panel[aria-expanded="false"] { background: none; color: var(--ink-3); }
@media (hover: hover) {
  .panel:hover { background: var(--card-2); color: var(--ink); }
}
.panel:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* The theme switch. Same box as the panel toggle at the other end of
   the bar, because they are the same kind of thing: a control that
   changes the frame rather than the day. */
.glyph {
  flex: none;
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: var(--r-pill);
  background: var(--card);
  color: var(--ink-2);
  cursor: pointer;
  transition: color .12s ease, background .12s ease;
}
@media (hover: hover) { .glyph:hover { background: var(--card-2); color: var(--ink); } }
.glyph:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
/* One button, two marks: the one showing is the one you are going TO. */
.glyph .sun { display: none; }
:root[data-theme="light"] .glyph .sun { display: block; }
:root[data-theme="light"] .glyph .moon { display: none; }

/* Shut is display:none, not a width transition. Collapsing a flex child
   to zero animates on the wide layout and does nothing on the stacked
   one, so half the app would slide and half would blink — and the pane
   beside it reflows either way. */
[data-rail="shut"] .rail { display: none; }

/* ── rail ── */

.rail {
  flex: 0 0 320px;
  width: 320px;
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--surface);
  /* On the LEFT. What is due today is the thing you came to do, so it
     sits where reading starts rather than in the margin. */
  border-right: 1px solid var(--line);
}

.rail-head {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 10px;
  height: 48px;
  padding: 0 14px;
  border-bottom: 1px solid var(--line);
}
.rail-t {
  font-family: var(--mono);
  font-size: .62rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-2);
}
.rail-n {
  margin-left: auto;
  font-family: var(--mono);
  font-size: .72rem;
  color: var(--ink);
}

/* A row sliced in half by the panel below it reads as broken rather
   than as "there is more". The fade sits over the container's own
   bottom padding when the list fits, so it costs nothing until the list
   is actually longer than the space — which is the only time it is
   saying anything. */
.rail-list {
  /* Takes what it needs and no more. It used to grow, which was right
     when a third section sat under it — with only the month there now,
     growing left a hole between the two and pinned the month to the
     floor. Shrinking is still allowed, so a long list still scrolls. */
  flex: 0 1 auto;
  min-height: 0;
  overflow-y: auto;
  mask-image: linear-gradient(to bottom, #000 calc(100% - 20px), transparent);
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 10px 12px;
}

/* ── controls ──
   One height, 34px, for everything you can press outside a card, so a
   header row of them cannot come out ragged. */

.step {
  width: 34px;
  height: 34px;
  flex: none;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: var(--r-pill);
  background: var(--card);
  color: var(--ink-2);
  cursor: pointer;
  transition: background .12s ease, color .12s ease;
}
.step.wide {
  width: auto;
  min-width: 34px;
  padding: 0 12px;
  font-family: var(--mono);
  font-size: .62rem;
  letter-spacing: .1em;
  text-transform: uppercase;
}
@media (hover: hover) {
  .step:hover { background: var(--card-2); color: var(--ink); }
}

/* Month / Week / Day. One group, one border around the three, and the
   pressed one lifts a step and takes the accent under it — the same
   grammar as the nav, because it is the same idea. */
.seg {
  position: relative;
  display: flex;
  align-items: stretch;
  border-radius: var(--r-pill);
  background: var(--card);
}
/* The group's hairline is drawn OVER the members rather than as a
   border around them. A real border insets the buttons by 1px, and an
   inset child that carries the same 10px corner as its parent is a
   corner drawn twice — the geometry audit calls that out and it is
   right to. Clipping the group with overflow:hidden fixes the corner
   and then eats the focus ring of whichever member is focused, which
   is worse. */
.seg::after {
  content: '';
  position: absolute;
  inset: 0;
  border: 1px solid var(--line);
  border-radius: var(--r-pill);
  pointer-events: none;
}
.seg button {
  height: 34px;
  min-width: 54px;
  padding: 0 12px;
  border: 0;
  border-radius: 0;
  background: none;
  font-size: .72rem;
  font-weight: 500;
  color: var(--ink-2);
  cursor: pointer;
  transition: background .12s ease, color .12s ease;
}
.seg button:first-child { border-radius: var(--r-pill) 0 0 var(--r-pill); }
.seg button:last-child  { border-radius: 0 var(--r-pill) var(--r-pill) 0; }
.seg button[aria-pressed="true"] {
  background: var(--card-2);
  color: var(--ink);
  box-shadow: inset 0 -2px 0 var(--accent);
}
@media (hover: hover) {
  .seg button:hover { color: var(--ink); }
}

.grow { flex: 1 1 auto; min-width: 0; }

/* ── narrow ──
   The rail leaves the row rather than shrinking. At 320px it is a
   column of rows; at 200px it is neither, and what it holds — what is
   still due today — is the last thing that should get squeezed. */

@media (max-width: 1080px) {
  .body {
    flex-direction: column;
    overflow-y: auto;
  }
  /* One scroller for the stack, not three nested ones. A pane that
     scrolls inside a page that scrolls means a flick either moves the
     grid or moves the rail, and you cannot tell which until it has
     already happened. */
  .main { flex: 0 0 auto; }
  .pane { overflow: visible; }
  .rail {
    /* Stacked, it goes back UNDER the cards. First in the DOM is right
       on a wide screen and wrong on a narrow one: a phone would make
       you scroll past the whole list to reach the grid it summarises. */
    order: 1;
    flex: 0 0 auto;
    width: auto;
    border-right: 0;
    border-top: 1px solid var(--line);
  }
  .rail-list {
    overflow: visible;
    max-height: none;
  }
}

@media (max-width: 700px) {
  .top {
    height: 52px;
    gap: 8px;
    padding: 0 12px;
  }
  /* The sub-label goes and the wordmark stays: the mark is the app,
     the label under it is decoration. The nav labels stay whatever
     happens — two icons alone would be a guess. */
  .brand {
    flex: 0 1 auto;
    font-size: .94rem;
  }
  .brand span { display: none; }
  .nav {
    flex: 1 1 auto;
    justify-content: center;
    min-width: 0;
  }
  .nav-i {
    padding: 0 10px;
    font-size: .78rem;
    gap: 6px;
  }
  .top-r { flex: 0 0 auto; }

  /* A finger is not a cursor. */
  .add, .step { width: 44px; height: 44px; }
  .step.wide { width: auto; min-width: 44px; padding: 0 14px; }
  .seg button { height: 44px; min-width: 60px; }

  .pane { padding: 12px 12px 22px; }
  .rail-head { padding: 0 12px; }
  .rail-list { padding: 10px 10px; }
}

/* Under about 430px the bar cannot hold the name as well as the nav,
   and the nav is the only way off this screen. The avatar stays: it is
   the same 30px block and it still says whose day this is. */
@media (max-width: 430px) {
  .who-t { display: none; }
  .nav-i { padding: 0 8px; }
  .top { gap: 6px; }
}

/* Motion here is decoration on every element that has it — a colour
   fade, a ring filling. None of it carries meaning, so none of it is
   worth a headache. Animations are held to a tick rather than removed
   outright: an animation that ends visible must still be allowed to
   reach its end state. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition: none !important;
    animation-duration: .01ms !important;
    animation-delay: 0ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
  }
}

/* ══ THE MINI MONTH ═══════════════════════════════════════════════
   A month at a glance at the top of the rail, and a way into the real
   calendar. It pages on its own arrows without leaving this screen —
   glancing at next month is not the same as going there. */

/* The month takes whatever the list leaves above the reminders. It used
   to be a fixed block with the column empty under it, and a panel that
   stops two thirds of the way down reads as something missing rather
   than as space. */
.jm {
  /* Grows into spare height, and when there is not enough to go round it
     is the FIRST thing to give way — hence the shrink factor of 8
     against the list's 1. The list is what the panel is for; a month
     with tighter rows still reads. But it does not shrink past its own
     six weeks: squeezed further it was CLIPPED, and a month missing its
     last week is worse than a list that scrolls by one row — the list
     has a fade and a scrollbar's worth of affordance, the month has
     none. overflow is hidden as a guard, not as the plan. */
  flex: 1 0 auto;
  min-height: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  padding: 12px;
  /* Under what is due, not over it. The month is for looking back; the
     list above it is the thing you opened the app to do. */
  border-top: 1px solid var(--line);
}

/* The head is one rounded bar with the arrows inside it rather than
   three separate controls: at this size three pills in a row read as a
   toolbar, and this is a label you can nudge. */
.jm-head {
  display: flex;
  align-items: center;
  gap: 2px;
  height: 38px;
  padding: 0 3px;
  margin-bottom: 6px;
  background: var(--card);
  border-radius: var(--r-pill);
}
.jm-t {
  flex: 1 1 auto;
  min-width: 0;
  /* 32, not 28: it is a button, and the floor for a button is the floor
     for a button even when it is only a label you can nudge. */
  height: 32px;
  border: 0;
  border-radius: var(--r-pill);
  background: none;
  color: var(--ink);
  font: inherit;
  font-size: .78rem;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.jm-arw {
  flex: none;
  /* The floor for a button, same as everything else you can press. */
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: var(--r-pill);
  background: none;
  color: var(--ink-2);
  cursor: pointer;
}

.jm-grid {
  flex: 1 1 auto;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  /* The weekday strip keeps its 20px; the six week rows share what is
     left. The cap lives on the CELL, not the row: capping the row made
     the track a fixed 64px, so a squeezed month was clipped — the last
     week of it disappeared — instead of compacting. */
  grid-template-rows: 20px repeat(6, minmax(32px, 1fr));
  gap: 2px;
}
.jm-w {
  height: 20px;
  display: grid;
  place-items: center;
  font-family: var(--mono);
  font-size: .54rem;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: var(--ink-3);
}

/* 32px, which is the floor for anything you press. The reference draws
   these smaller; a calendar you miss by 3px is not a calendar. It was
   briefly 30 to buy the month room to compact, and 30 is still under
   the floor — the two pixels come out of the list instead, which
   scrolls and can spare them. */
.jm-d {
  position: relative;
  min-height: 30px;
  /* height:100% is what makes it fill its row; align-self:center alone
     stopped it stretching and left every cell at its 30px floor even in
     a row that had grown to 66. */
  height: 100%;
  max-height: 64px;
  align-self: center;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: var(--r-pill);
  background: none;
  color: var(--ink-2);
  font: inherit;
  font-size: .72rem;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
  transition: background .12s ease, color .12s ease;
}
/* Dimmed, not hidden. A month that starts mid-row with four blanks in
   front of it is harder to read than one that shows the days either
   side. */
.jm-d.out { opacity: .38; }
.jm-d.now {
  background: var(--accent);
  color: var(--accent-in);
  font-weight: 600;
}

/* The only mark on this grid says A RECORD EXISTS HERE — dim for a day
   with something on it, accent for a day where everything due was kept.
   Nothing marks a day you missed: a month grid stippled with failures
   is the thing that makes a person stop opening the app. */
/* Hung off the middle rather than the floor: in a row that has grown to
   64px, a dot pinned to the bottom drifts away from the number it
   belongs to. */
.jm-dot {
  position: absolute;
  top: 50%;
  margin-top: 8px;
  width: 4px;
  height: 4px;
  border-radius: var(--r-pill);
  background: var(--ink-3);
}
.jm-dot.full { background: var(--accent); }
.jm-d.now .jm-dot { background: var(--accent-in); }

@media (hover: hover) {
  .jm-arw:hover { color: var(--ink); background: var(--card-2); }
  .jm-t:hover { background: var(--card-2); }
  .jm-d:hover { background: var(--card-2); color: var(--ink); }
  .jm-d.now:hover { background: var(--accent); color: var(--accent-in); }
}
.jm-d:focus-visible,
.jm-t:focus-visible,
.jm-arw:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* Stacked, the panel has no height to give away, so the month goes back
   to its own size and the rows to theirs. */
@media (max-width: 1080px) {
  .jm {
    flex: 0 0 auto;
    max-width: 380px;
    margin: 0 auto;
    width: 100%;
  }
  .jm-grid { grid-template-rows: 20px repeat(6, 32px); }
}

/* ══ REMINDERS ════════════════════════════════════════════════════
   The foot of the panel. Three at a time, snapping, no scrollbar — the
   same box the thoughts list in the hero uses, because it is the same
   idea and a second idea would be a second thing to learn. */

.jr {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  border-top: 1px solid var(--line);
}

.jr-h {
  flex: 0 0 auto;
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 11px 12px 7px;
}
.jr-h span {
  flex: 1 1 auto;
  font-family: var(--mono);
  font-size: .58rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-2);
}
.jr-h b {
  font-family: var(--mono);
  font-size: .62rem;
  font-weight: 400;
  color: var(--ink);
}

/* ── writing one ── */
.jr-add {
  flex: 0 0 auto;
  position: relative;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 12px 10px;
}
.jr-plus {
  position: absolute;
  left: 23px;
  top: 11px;
  width: 13px;
  height: 13px;
  pointer-events: none;
  color: var(--ink-3);
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  transition: color .12s ease;
}
.jr-in {
  flex: 1 1 auto;
  min-width: 0;
  height: 34px;
  padding: 0 12px 0 32px;
  border: 1px solid var(--line);
  border-radius: var(--r-pill);
  /* Darker than the panel it sits in. A field lifted off its surface
     reads as a button, and this one is somewhere to type. */
  background: var(--bg);
  color: var(--ink);
  font: inherit;
  font-size: .76rem;
}
.jr-in::placeholder { color: var(--ink-3); }
.jr-in:focus { outline: 2px solid var(--focus); outline-offset: 1px; }
.jr-add:focus-within .jr-plus { color: var(--accent); }

/* :placeholder-shown IS the empty test — no script has to keep a class
   in step with what has been typed. The field wears the accent and the
   send appears the moment there is something to send, and there is
   nothing to press before then. */
/* Not while it is focused: the focus ring is already an accent ring, and
   the two together drew two concentric pink outlines around one field,
   which reads as a mistake. Unfocused with text still in it, the border
   is the only thing left saying "this has not been sent". */
.jr-in:not(:placeholder-shown):not(:focus) {
  border-color: var(--accent);
}
.jr-in:not(:placeholder-shown) ~ .jr-plus { color: var(--accent); }
.jr-in:placeholder-shown ~ .jr-send { display: none; }

.jr-send {
  width: 30px;
  height: 30px;
  flex: none;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: var(--r-pill);
  background: var(--accent);
  color: var(--accent-in);
  cursor: pointer;
  transition: filter .12s ease;
}
.jr-send svg {
  width: 13px;
  height: 13px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.jr-send:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
@media (hover: hover) { .jr-send:hover { filter: brightness(1.08); } }
.jr-send:active { filter: brightness(.94); }

/* ── the five seconds after a tick ──
   It stands where the field stands, so ticking one does not change the
   height of the section under it. */
.jr-undo {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 8px;
  height: 34px;
  margin: 0 12px 10px;
  padding: 0 6px 0 12px;
  border-radius: var(--r-pill);
  background: color-mix(in srgb, var(--accent) 14%, transparent);
}
.jr-undo p {
  flex: 1 1 auto;
  min-width: 0;
  margin: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: .72rem;
  color: var(--ink-2);
}
.jr-undo p b { font-weight: 500; color: var(--ink); }
.jr-undo button {
  flex: none;
  height: 24px;
  padding: 0 12px;
  border: 0;
  border-radius: var(--r-pill);
  background: var(--accent);
  color: var(--accent-in);
  font: inherit;
  font-size: .66rem;
  font-weight: 500;
  cursor: pointer;
}
.jr-undo button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* ── the list ── */
.jr-scr {
  flex: 0 0 auto;
  height: calc(3 * 46px);
  overflow-y: auto;
  overscroll-behavior: contain;
  scroll-snap-type: y mandatory;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.jr-scr::-webkit-scrollbar { width: 0; height: 0; }

.jr-row {
  height: 46px;
  scroll-snap-align: start;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 12px;
  border-top: 1px solid var(--line);
}
.jr-av {
  width: 22px;
  height: 22px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: var(--r-pill);
  /* One accent for all of them. A reminder has no identity of its own
     the way a habit does, and eight colours here would say there were
     eight kinds. */
  background: var(--accent);
  color: var(--accent-in);
}
.jr-av svg {
  width: 12px;
  height: 12px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.jr-t {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: .78rem;
  color: var(--ink-2);
}
.jr-at {
  flex: none;
  font-family: var(--mono);
  font-size: .58rem;
  color: var(--ink-3);
}
.jr-tk {
  /* 32px of button around a 22px ring. The ring is the right size to
     look at and the wrong size to hit, and the thing you are hitting is
     the one that deletes a reminder. */
  width: 32px;
  height: 32px;
  flex: none;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: var(--r-pill);
  background: none;
  cursor: pointer;
}
.jr-tk::before {
  content: '';
  width: 22px;
  height: 22px;
  border: 1px solid var(--line-2);
  border-radius: var(--r-pill);
  transition: background-color .12s ease, border-color .12s ease;
}
.jr-tk:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
@media (hover: hover) {
  .jr-tk:hover::before { background: var(--accent); border-color: var(--accent); }
}

.jr-none {
  margin: 0;
  padding: 14px 12px;
  font-size: .74rem;
  color: var(--ink-3);
}

@media (max-width: 700px) {
  .jr-in, .jr-undo { height: 44px; }
  .jr-plus { top: 16px; }
  .jr-send { width: 44px; height: 44px; }
  .jr-undo button { height: 32px; }
}
@media (prefers-reduced-motion: reduce) {
  .jr-tk::before, .jr-send { transition: none; }
}

/* ══ TODAY ═══════════════════════════════════════════════════════
   The strip says how the day is going, the grid says what it is made
   of, and the rail says what is next. Every class here carries the
   jt- prefix; the rail's own frame (.rail, .rail-list, .rail-log) is
   chrome and is styled where it is defined, not here.
   ═══════════════════════════════════════════════════════════════ */

/* ── the strip ──
   HERO. The ring is the biggest thing on the screen and carries no
   card at all — a border around it would make it a tile like the rest,
   and the whole point is that this one is not.

   The row deliberately breaks the same-box rule the grid keeps: a
   ring, a headline and a list are three different kinds of thing and
   stacking them into three equal panels is exactly what made the old
   strip unreadable. See SPEC section 7 — this is the one carve-out,
   the way a folded panel is the carve-out in the house rules. */

.jt-strip {
  display: flex;
  align-items: center;
  gap: 30px;
  padding: 4px 2px 22px;
  margin-bottom: 16px;
  border-bottom: 1px solid var(--line);
}

/* Both lines are block children of a flex column, so both are the full
   width of the block: one left edge for the pair, whatever the date is
   that day. */
.jt-dayt {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.jt-dayt b {
  font-size: 1.5rem;
  font-weight: 600;
  letter-spacing: -.015em;
  line-height: 1.15;
  color: var(--ink);
}
.jt-dayt span {
  font-size: .88rem;
  color: var(--ink-3);
}
/* The number is the fact and the word is the label, so only one of the
   two is lit. */
.jt-dayt span em {
  font-style: normal;
  font-weight: 600;
  color: var(--ink);
}

/* The column the three figures used to hold. 380px rather than the 290
   they had: with the figures gone the date was left alone against 500px
   of nothing, and the writing wants the width more than the numbers
   ever did. */
.jt-th-col {
  flex: none;
  width: 380px;
}
.jt-th-h {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding-bottom: 7px;
  border-bottom: 1px solid var(--line);
}
.jt-th-h span {
  flex: 1 1 auto;
  font-family: var(--mono);
  font-size: .58rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-2);
}
.jt-th-h b {
  font-family: var(--mono);
  font-size: .62rem;
  font-weight: 400;
  color: var(--ink);
}

/* Exactly three rows tall, every row exactly the same height, and it
   snaps — so it can never come to rest showing half of one. No
   scrollbar: at this width the track is wider than the thing it would
   be describing. The height is stated as 3 x the row so the two cannot
   drift apart in a later edit. */
.jt-th-scr {
  height: calc(3 * 62px);
  overflow-y: auto;
  overscroll-behavior: contain;
  scroll-snap-type: y mandatory;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.jt-th-scr::-webkit-scrollbar { width: 0; height: 0; }

/* ── rings ──
   One geometry, two sizes, and the dash pattern is the whole trick:
   the dasharray is the circumference, so the offset IS the unfilled
   remainder and a transition on it fills the arc.

   The circle is turned -90deg so zero is twelve o'clock rather than
   three. The pre-paint values leave it empty on purpose — set from the
   script it winds UP to its reading, where an unset offset would draw
   a full ring at parse time and unwind it, which reads as the day
   emptying out. */

.jt-ring {
  position: relative;
  flex: none;
  width: 72px;
  height: 72px;
}
/* Direct child only. Descendant would also catch the check glyph in
   the centre and blow a 16px icon up to the width of the ring. */
.jt-ring > svg { width: 100%; height: 100%; }

.jt-track,
.jt-prog { fill: none; stroke-width: 6; }
.jt-track { stroke: var(--track); }

.jt-prog {
  /* No --jt-c outside a card, so the day ring takes the accent: the
     one figure on the screen that is about the day and not a habit. */
  stroke: var(--jt-c, var(--accent));
  stroke-linecap: round;
  stroke-dasharray: 400;
  stroke-dashoffset: 400;
  transform: rotate(-90deg);
  transform-origin: 50% 50%;
  transition: stroke-dashoffset .5s cubic-bezier(.22, .75, .3, 1);
}

/* Both centres sit in the same box so swapping the number for the
   check cannot move anything. text-align keeps the audit off a left
   edge nobody chose — a centred line starts wherever its text ends. */
.jt-ringn,
.jt-tk {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  text-align: center;
  font-family: var(--mono);
  font-size: .82rem;
  color: var(--ink);
}
.jt-tk { color: var(--jt-c, var(--accent)); }

.jt-ring-lg { width: 132px; height: 132px; }
/* 10 device px. The viewBox is 120 units drawn at 132, so a user unit
   is 132/120 of a pixel and a stroke has to be written in the units
   the path it belongs to is drawn in. */
.jt-ring-lg .jt-track,
.jt-ring-lg .jt-prog { stroke-width: 9.09; }
.jt-ring-lg .jt-ringn { font-size: 1.32rem; }

/* ── the grid ──
   auto-fill rather than auto-fit: eight cards on a wide screen keep a
   card's width instead of stretching to fill the row. 1fr rows and
   stretched children mean every card on a row is the same box. */

.jt-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  grid-auto-rows: 1fr;
  align-items: stretch;
  gap: 12px;
}

/* Eight habits divide into four and four. Left to auto-fill, a wide
   window took five across and left a ragged 5 + 3 with a hole beside
   it; fixed at four, the block is square at every size that can hold it
   and the cards take the extra width instead of a fifth column. */
@media (min-width: 1100px) {
  .jt-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}

.jt-card {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: var(--r-card);
  background: var(--card);
  color: var(--ink);
  text-align: left;
  cursor: pointer;
  transition: border-color .16s ease, box-shadow .22s ease;
}

/* Kept today, and that is the only thing that lights a card up. The
   reference has exactly one hot card in its grid; here what makes one
   hot is that you did it. Nothing on this screen is ever coloured for
   a miss — a wash of red across a bad week is a judgement about her,
   and a judgement is what makes a person stop opening the app. */
.jt-card[aria-pressed="true"] {
  border-color: color-mix(in srgb, var(--jt-c) 45%, transparent);
  background:
    radial-gradient(96% 74% at 24% 0%,
      color-mix(in srgb, var(--jt-c) 13%, transparent), transparent 68%),
    var(--card);
  /* The glow is a shadow and not a bled-out pseudo element: a box that
     paints past its own edges counts toward the scroll width of the
     pane it sits in, and the pane would grow a horizontal bar the
     first time anything was ticked. A shadow is ink only. */
  box-shadow:
    0 6px 30px -6px color-mix(in srgb, var(--jt-c) 40%, transparent),
    0 0 0 1px color-mix(in srgb, var(--jt-c) 12%, transparent);
}

@media (hover: hover) {
  .jt-card:hover { border-color: var(--line-2); }
  .jt-card[aria-pressed="true"]:hover {
    border-color: color-mix(in srgb, var(--jt-c) 64%, transparent);
  }
}

.jt-t {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}
.jt-mk {
  width: 15px;
  height: 15px;
  flex: none;
  fill: none;
  stroke: var(--jt-c);
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.jt-nm {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: .92rem;
  font-weight: 600;
  color: var(--ink);
}
.jt-goal {
  font-size: .72rem;
  color: var(--ink-3);
}

.jt-chip {
  align-self: flex-start;
  justify-self: start;        /* the grid layout below; ignored in flex */
  /* Pinned to the bottom of the card, so a name that wraps to two
     lines on one card cannot push its chip off the line every other
     chip on the row sits on. */
  margin-top: auto;
  height: 18px;
  display: inline-flex;
  align-items: center;
  padding: 0 9px;
  /* 10px, not 999. A radius clamps to half the height, so 10 on an
     18px chip draws the same pill — and a child rounder than the 12px
     card it sits inside is a fault the geometry audit reports. */
  border: 1px solid var(--jt-c);
  border-radius: var(--r-pill);
  background: none;
  font-family: var(--mono);
  font-size: .58rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--jt-c);
  white-space: nowrap;
}

/* ── rail rows ──
   The rail is chrome. What goes in it belongs to this screen, so the
   rows are jt-. Each row is one button: a tick control nested inside
   a row that is itself a button would be a button inside a button,
   which is invalid and unreachable by keyboard either way. */

.jt-r {
  display: grid;
  grid-template-columns: 22px minmax(0, 1fr) auto 22px;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 40px;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: var(--r-pill);
  background: var(--card);
  color: var(--ink);
  text-align: left;
  cursor: pointer;
  transition: background-color .14s ease, border-color .14s ease;
}

/* Solid, not tinted: every habit colour clears 4.5:1 against --bg, so
   the initial is legible on all eight, and a solid disc says WHICH
   habit from across the room. */
.jt-r-av {
  width: 22px;
  height: 22px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: var(--r-pill);
  background: var(--jt-c);
  color: var(--bg);
}
/* The mark is drawn in the disc's own ink, so it reads on any of the
   eight colours without a second decision per habit. */
.jt-r-av svg {
  width: 13px;
  height: 13px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.jt-r-nm {
  min-width: 0;
  font-size: .78rem;
  color: var(--ink);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* --ink-2, not the --ink-3 a time usually takes: the rail is sorted by
   this figure and it is half of what a row says. Quiet is not the same
   as unreadable. */
.jt-r-at {
  font-family: var(--mono);
  font-size: .62rem;
  letter-spacing: .06em;
  color: var(--ink-2);
  white-space: nowrap;
}

.jt-r-tk {
  width: 22px;
  height: 22px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line-2);
  border-radius: var(--r-pill);
  color: var(--bg);
}
.jt-r[aria-pressed="true"] .jt-r-tk {
  border-color: var(--jt-c);
  background: var(--jt-c);
}
/* The glyph is always in the box and only ever fades: hiding it would
   let the row's four columns settle at two different widths depending
   on whether it was kept. */
.jt-r[aria-pressed="false"] .jt-r-tk svg { opacity: 0; }

@media (hover: hover) {
  .jt-r:hover { border-color: var(--line-2); background: var(--card-2); }
}

/* One row is yours and it is the next thing the day is waiting on —
   the reference's single orange row. Nothing else in the rail takes
   the accent, or it would stop meaning "this one". The avatar keeps
   its habit colour even here: orange says WHEN, colour says WHICH. */
.jt-r[data-next] {
  border-color: var(--accent);
  background: var(--accent);
  color: var(--accent-in);
}
.jt-r[data-next] .jt-r-nm,
.jt-r[data-next] .jt-r-at { color: var(--accent-in); }
.jt-r[data-next] .jt-r-tk {
  border-color: color-mix(in srgb, var(--accent-in) 62%, transparent);
}
@media (hover: hover) {
  .jt-r[data-next]:hover {
    border-color: var(--accent);
    background: var(--accent);
    filter: brightness(1.06);
  }
}

/* ── lines ──
   Today's line is a labelled field on an accent rule, not a pill with a
   send button: a pill and a round button is a chat composer, which is
   exactly what it was being read as. Under it, every line before it. */

.jt-thw,
.jt-th {
  height: 62px;
  scroll-snap-align: start;
  padding-left: 12px;
  border-bottom: 1px solid var(--line);
}

/* ── today's row ── */
.jt-thw {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-content: center;
  gap: 3px 8px;
  box-shadow: inset 2px 0 0 var(--accent);
}
.jt-thw:focus-within { background: var(--card); }
/* The input carries no ring of its own, so the row wears it — an outline
   on a borderless field inside a panel reads as a box that appeared
   from nowhere. */
.jt-thw:focus-within { outline: 2px solid var(--focus); outline-offset: -2px; }
.jt-thw-k {
  font-family: var(--mono);
  font-size: .52rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--accent);
}
.jt-saved {
  grid-column: 2;
  grid-row: 1;
  font-family: var(--mono);
  font-size: .52rem;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--accent);
  opacity: 0;
  transition: opacity .18s ease;
}
.jt-saved.on { opacity: 1; }
.jt-thi {
  grid-column: 1 / -1;
  width: 100%;
  min-width: 0;
  padding: 0;
  border: 0;
  background: none;
  color: var(--ink);
  font: inherit;
  font-size: .82rem;
}
.jt-thi::placeholder { color: var(--ink-3); }
.jt-thi:focus { outline: none; }

/* ── a day before it ── */
.jt-th {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 3px;
}
.jt-th b {
  font-family: var(--mono);
  font-size: .52rem;
  font-weight: 400;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-3);
}
/* Two lines and then an ellipsis. A row that grew with its thought would
   break the one thing the box promises — three, always whole. The full
   text is on the title, so nothing is unreachable. */
.jt-th p {
  margin: 0;
  font-size: .78rem;
  line-height: 1.3;
  color: var(--ink-2);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* ── narrow ── */

/* The day pill takes the whole row before the three stat pills get
   squeezed: 116px of ring plus a long date does not fit in two fifths
   of a phone, and the three figures beside it are single numbers that
   do. */
@media (max-width: 860px) {
  /* The list goes full width and falls under the ring and the date,
     which stay on one line together — the day is still the headline at
     any width. */
  .jt-strip { flex-wrap: wrap; gap: 20px; }
  .jt-th-col { width: 100%; }
}

/* A finger is not a cursor. */
@media (max-width: 700px) {
  .jt-r { min-height: 44px; }
}

/* One column wide, a ring with the name stacked under it leaves half
   of every card empty and puts eight of them two screens apart. The
   same three parts, laid across instead of down: the ring keeps its
   size, and the name and the chip share the column beside it. */
@media (max-width: 520px) {
  .jt-card {
    display: grid;
    grid-template-columns: 72px minmax(0, 1fr);
    align-items: center;
    column-gap: 12px;
    row-gap: 6px;
  }
  .jt-ring { grid-row: 1 / span 2; }
  .jt-chip { margin-top: 0; }
}

/* The ring filling is decoration, and it is the one animation here
   that runs on load rather than on a press — so it is named locally
   as well as caught by the blanket rule, where a later edit to either
   can be read against the other. */
@media (prefers-reduced-motion: reduce) {
  .jt-prog,
  .jt-card,
  .jt-r,
  .jt-saved { transition: none; }
}


/* ══ LIGHT ════════════════════════════════════════════════════════
   Three things on this screen were built for a dark ground. */
:root[data-theme="light"] {
  /* 1. The chip's TEXT cannot be its habit's colour here: four of the
        eight land between 3.1 and 4.0:1 on white, and a chip is 0.58rem
        of type. Ink for the word, the hue for the ring around it. */
  --jt-chip-ink: var(--ink-2);
}
:root[data-theme="light"] .jt-chip { color: var(--jt-chip-ink); }

/* 2. A coloured glow behind a card is a dark-room effect; on white it
      is a smudge. The kept card takes a tint of its own colour
      instead, which says the same thing in the same hue. */
:root[data-theme="light"] .jt-card[aria-pressed="true"] {
  box-shadow: none;
  background: color-mix(in srgb, var(--jt-c) 7%, var(--card));
}

/* 3. The avatar's glyph sits on a mid-tone hue now rather than a neon,
      so it goes white rather than taking the page colour. */
:root[data-theme="light"] .jt-r-av { color: #FFFFFF; }

/* ══ THE CALENDAR ═════════════════════════════════════════════════
   Month, week and day. The week is the real thing — an hour grid with
   the habits sitting on it at the time they happen — because "read at
   nine" is a different commitment from "read at some point", and a
   tracker that only knows the day cannot tell you which one you keep. */

/* The calendar's pane is a column and does not scroll itself: the grid
   fills it and the scrolling happens inside .jc-body, so paging a month
   cannot move the page under you. Scoped with :has rather than by
   restyling .pane, which the today screen also uses as a plain
   scroller. */
.pane:has(> .jc-head) {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
/* .pane > * carries margin-inline:auto for the 1180px reading width.
   In a flex column an auto cross-axis margin shrinks the item to its
   content, which collapsed the header onto its own buttons — so the
   width is stated and the auto margins resolve to nothing. */
.pane:has(> .jc-head) > * { width: 100%; }

.jc-head {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 0 12px;
}
.jc-title {
  margin: 0 0 0 6px;
  font-size: .96rem;
  font-weight: 600;
  color: var(--ink);
  white-space: nowrap;
}
.jc-body {
  flex: 1 1 auto;
  min-height: 0;
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: var(--r-card);
  background: var(--card);
}

/* ── month ───────────────────────────────────────────────────────
   Six rows always, even in a month that fits in five. A grid that
   changes height as you page through the year makes every click feel
   like it moved something. */
.jc-month {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  grid-template-rows: auto repeat(6, minmax(84px, 1fr));
  min-height: 100%;
}
.jc-wd {
  height: 30px;
  display: grid;
  place-items: center;
  border-bottom: 1px solid var(--line);
  font-family: var(--mono);
  font-size: .58rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.jc-cell {
  display: flex;
  flex-direction: column;
  gap: 7px;
  min-width: 0;
  padding: 6px 7px 8px;
  border: 0;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  background: none;
  text-align: left;
  cursor: pointer;
  font: inherit;
}
.jc-cell:nth-child(7n + 7) { border-right: 0; }
.jc-cell.out { opacity: .4; }
.jc-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  width: 100%;
}
.jc-num {
  min-width: 22px;
  height: 22px;
  padding: 0 6px;
  display: grid;
  place-items: center;
  border-radius: var(--r-pill);
  font-size: .72rem;
  font-variant-numeric: tabular-nums;
  color: var(--ink-2);
}
.jc-cell.now .jc-num {
  background: var(--accent);
  color: var(--accent-in);
  font-weight: 600;
}
.jc-sc {
  font-family: var(--mono);
  font-size: .56rem;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}

/* One pip per habit that was kept or was due. Filled took it, hollow
   did not — and hollow keeps the habit's own colour rather than turning
   into a warning, because the colour says WHICH, never whether. */
/* Anchored to the floor of the cell, not the ceiling. On a maximised
   window the rows are 180px tall and one line of pips clinging under
   the date left every cell looking unfinished; with the number at the
   top and the marks at the bottom, the cell is framed rather than
   half-empty. */
.jc-dots {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  align-content: flex-end;
  margin-top: auto;
}
.jc-pip {
  width: 11px;
  height: 11px;
  border: 1px solid var(--jc-c);
  border-radius: var(--r-pill);
  opacity: .5;
}
.jc-pip.on { background: var(--jc-c); opacity: 1; }

/* A chip is one habit in the all-day band. Filled means kept, a border
   means due and not kept, and there is no third state that means missed
   — hollow already says it without saying it about you. */
.jc-chip {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  height: 20px;
  padding: 0 8px;
  border: 1px solid transparent;
  border-radius: var(--r-pill);
  background: none;
  color: var(--ink-2);
  font: inherit;
  font-size: .62rem;
  text-align: left;
  cursor: pointer;
}
.jc-chip .jc-dot {
  flex: none;
  width: 6px;
  height: 6px;
  border-radius: var(--r-pill);
  background: var(--jc-c);
}
.jc-chip span {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.jc-chip.on {
  background: color-mix(in srgb, var(--jc-c) 18%, transparent);
  color: var(--jc-c);
}
.jc-chip.due { border-color: var(--line-2); }

/* ── week and day ────────────────────────────────────────────────
   One grid: a gutter, then n day columns. Three rows — the day heads,
   the all-day band, and the hours. */
.jc-grid {
  display: grid;
  grid-template-rows: auto auto 1fr;
  min-width: 100%;
}
.jc-dh {
  position: sticky;
  top: 0;
  z-index: 3;
  height: 46px;
  display: grid;
  place-items: center;
  gap: 1px;
  border-bottom: 1px solid var(--line);
  border-right: 1px solid var(--line);
  background: var(--card);
}
.jc-dh:last-child { border-right: 0; }
.jc-dh b { font-size: .82rem; font-weight: 600; color: var(--ink); }
.jc-dh span {
  font-family: var(--mono);
  font-size: .54rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.jc-dh.now b, .jc-dh.now span { color: var(--accent); }

/* The gutter is sticky sideways so the hours stay readable when a week
   is wider than the pane and you scroll it. */
.jc-gut {
  position: sticky;
  left: 0;
  z-index: 4;
  border-right: 1px solid var(--line);
  background: var(--card);
}
.jc-corner {
  position: sticky;
  left: 0;
  top: 0;
  z-index: 5;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  background: var(--card);
}
.jc-adl {
  position: sticky;
  left: 0;
  z-index: 4;
  display: grid;
  place-items: center end;
  padding-right: 8px;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  background: var(--card);
  font-family: var(--mono);
  font-size: .52rem;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.jc-ad {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
  /* No horizontal padding. The gutter puts the day column's left edge
     at 58; a chip inset 4px inside it started at 62, and the day head
     above it at 58 — a 4px disagreement between two things in one
     column, which is the definition of a rag. The chips carry their own
     padding instead, so every left edge in the grid is the column's. */
  padding: 4px 0;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.jc-ad:last-child { border-right: 0; }

.jc-hr {
  height: 44px;
  padding-right: 8px;
  text-align: right;
  font-family: var(--mono);
  font-size: .56rem;
  color: var(--ink-3);
  /* Lifted half a line so the label sits ON its rule rather than in the
     box under it, which is where an hour label means the hour. */
  transform: translateY(-6px);
}
.jc-col {
  position: relative;
  min-width: 0;
  border-right: 1px solid var(--line);
  background: repeating-linear-gradient(
    to bottom,
    var(--line) 0 1px,
    transparent 1px 44px);
}
.jc-col:last-child { border-right: 0; }

.jc-ev {
  position: absolute;
  /* Flush, for the same reason the all-day chips are. */
  left: 0;
  right: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 1px;
  overflow: hidden;
  padding: 2px 8px 2px 10px;
  border: 1px solid transparent;
  border-radius: 10px;
  background: none;
  color: var(--ink-2);
  font: inherit;
  font-size: .64rem;
  text-align: left;
  cursor: pointer;
}
.jc-ev b { font-weight: 600; font-size: .66rem; }
.jc-ev span { font-family: var(--mono); font-size: .54rem; color: var(--ink-3); }
.jc-ev.on {
  background: color-mix(in srgb, var(--jc-c) 22%, transparent);
  color: var(--jc-c);
  /* The full-strength colour lives in a 3px bar rather than the whole
     fill: eight saturated blocks on one screen is a paint chart. */
  box-shadow: inset 3px 0 0 var(--jc-c);
}
.jc-ev.on b { color: var(--jc-c); }
.jc-ev.on span { color: color-mix(in srgb, var(--jc-c) 70%, var(--ink-3)); }
.jc-ev.due { border-color: var(--line-2); }
.jc-ev.off { border: 1px dashed var(--line); opacity: .7; }
/* A day that has not happened cannot be a record of anything, so it is
   shown and not touchable. */
.jc-ev.ahead, .jc-chip.ahead { opacity: .45; cursor: default; }

.jc-now {
  position: absolute;
  left: 0;
  right: 0;
  height: 1px;
  z-index: 2;
  background: var(--accent);
  pointer-events: none;
}
.jc-now::before {
  content: '';
  position: absolute;
  left: -4px;
  top: -3px;
  width: 7px;
  height: 7px;
  border-radius: var(--r-pill);
  background: var(--accent);
}

.jc-note {
  grid-column: 1 / -1;
  padding: 12px 14px;
  border-top: 1px solid var(--line);
  color: var(--ink-2);
  font-size: .78rem;
}
.jc-note b {
  display: block;
  margin-bottom: 4px;
  font-family: var(--mono);
  font-size: .56rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-3);
  font-weight: 400;
}

@media (hover: hover) {
  .jc-cell:hover { background: var(--card-2); }
  .jc-chip:not(.ahead):hover, .jc-ev:not(.ahead):hover { filter: brightness(1.25); }
}
.jc-cell:focus-visible,
.jc-chip:focus-visible,
.jc-ev:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }

/* Narrow: the chips lose their labels before the cells lose their
   shape. A dot still says which habit — that is what the colour is for. */
@media (max-width: 560px) {
  .jc-ad .jc-chip span { display: none; }
  .jc-ad { flex-direction: row; }
  .jc-chip { width: 22px; padding: 0; justify-content: center; }
}


/* ══ LIGHT ════════════════════════════════════════════════════════
   Same rule as the habit chips: the hue is the mark, never the label.
   A kept event keeps its 3px bar and its tint and gives its text back
   to the ink. */
:root[data-theme="light"] .jc-chip.on,
:root[data-theme="light"] .jc-ev.on,
:root[data-theme="light"] .jc-ev.on b { color: var(--ink); }
:root[data-theme="light"] .jc-ev.on span { color: var(--ink-2); }
:root[data-theme="light"] .jc-chip.on {
  background: color-mix(in srgb, var(--jc-c) 18%, var(--card));
}
:root[data-theme="light"] .jc-ev.on {
  background: color-mix(in srgb, var(--jc-c) 16%, var(--card));
}
</style>
</head>
<body>
<!-- ══ THE SKELETON ══════════════════════════════════════════════
     Every id the script fetches lives here, statically. Render
     functions fill the containers and address what they created with
     querySelector on that container — never getElementById, which
     tests/names.js checks against this markup and would fail. -->
<header class="top">
  <div class="brand">
    <button class="panel" type="button" id="railBtn" aria-controls="rail"
            aria-expanded="true" aria-label="Hide the panel">
      <svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.2" y="3.2" width="11.6" height="9.6" rx="2"/><path d="M6.6 3.2v9.6"/></svg>
    </button>
    Jade<span>habits</span>
  </div>

  <nav class="nav" aria-label="Screens">
    <button class="nav-i" type="button" data-view="today" aria-current="page">
      <svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 4.6V8l2.3 1.4"/></svg>
      Today
    </button>
    <button class="nav-i" type="button" data-view="calendar">
      <svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.2" y="3.4" width="11.6" height="10.4" rx="2"/><path d="M2.2 6.6h11.6M5.4 2.2v2.4M10.6 2.2v2.4"/></svg>
      Calendar
    </button>
  </nav>

  <div class="top-r">
    <button class="glyph" type="button" id="themeBtn" aria-label="Switch to light">
      <svg class="ic moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M12.9 9.7A5.3 5.3 0 0 1 6.1 2.9a5.5 5.5 0 1 0 6.8 6.8Z"/></svg>
      <svg class="ic sun" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3.1"/><path d="M8 1.6v1.7M8 12.7v1.7M1.6 8h1.7M12.7 8h1.7M3.5 3.5l1.2 1.2M11.3 11.3l1.2 1.2M12.5 3.5l-1.2 1.2M4.7 11.3l-1.2 1.2"/></svg>
    </button>

    <div class="who">
      <div class="who-av" aria-hidden="true">J</div>
      <div class="who-t"><b id="whoName">Jade</b><span id="whoSub">nothing kept yet</span></div>
    </div>
    <button class="add" type="button" id="addBtn" aria-label="Mark everything due today">
      <svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.6v8.8M3.6 8h8.8"/></svg>
    </button>
  </div>
</header>

<div class="body">
  <aside class="rail" id="rail" aria-label="Today at a glance">
    <div class="rail-head">
      <span class="rail-t">Due today</span>
      <span class="rail-n" id="railCount">0/0</span>
    </div>
    <div class="rail-list" id="railList"></div>

    <div class="jm">
      <div class="jm-head">
        <button class="jm-arw" type="button" id="jmPrev" aria-label="Previous month">
          <svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M9.8 3.6 5.4 8l4.4 4.4"/></svg>
        </button>
        <button class="jm-t" type="button" id="jmTitle">—</button>
        <button class="jm-arw" type="button" id="jmNext" aria-label="Next month">
          <svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.2 3.6 10.6 8l-4.4 4.4"/></svg>
        </button>
      </div>
      <div class="jm-grid" id="jmGrid"></div>
    </div>

    <!-- Reminders. Their own key and their own rules: ticking one takes
         it away, and the five seconds after that are the undo. -->
    <section class="jr" aria-label="Reminders">
      <div class="jr-h"><span>Reminders</span><b id="remCount">0</b></div>
      <form class="jr-add" id="remForm" autocomplete="off">
        <input class="jr-in" id="remIn" type="text" maxlength="120"
               placeholder="Something to remember" aria-label="Something to remember" />
        <svg class="jr-plus" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.6v8.8M3.6 8h8.8"/></svg>
        <button class="jr-send" type="submit" id="remSend" aria-label="Add the reminder">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 12.6V3.8M4.2 7.4 8 3.6l3.8 3.8"/></svg>
        </button>
      </form>
      <div class="jr-undo" id="remUndo" hidden>
        <p>Removed <b id="remGone"></b></p>
        <button type="button" id="remUndoBtn">Undo</button>
      </div>
      <div class="jr-scr" id="remList"></div>
    </section>
  </aside>

  <main class="main" data-screen="today">
    <div class="pane">
      <!-- The day is the headline and it sits ON the page. Four
           identical boxes was the first version and that was the
           problem: nothing led, so the eye had nowhere to enter. -->
      <section class="jt-strip">
        <div class="jt-ring jt-ring-lg">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <circle class="jt-track" cx="60" cy="60" r="51"/>
            <circle class="jt-prog" id="dayRing" cx="60" cy="60" r="51"/>
          </svg>
          <span class="jt-ringn" id="dayRingTxt">0/0</span>
        </div>
        <div class="jt-dayt">
          <b id="dayDate">Today</b>
          <span id="dayCap">nothing due</span>
        </div>
          <!-- Three figures used to sit here. The week percentage was the
             ring saying 4/7 a second time, and the other two are one
             clause of the caption rather than two panels. What the
             column is for now is the writing. -->
        <div class="jt-th-col">
          <div class="jt-th-h">
            <span>Daily thoughts</span>
            <b id="thoughtCount">0</b>
          </div>
          <!-- Three rows tall, every row the same height, snapping: it
               can never come to rest showing half of one. -->
          <div class="jt-th-scr" id="thoughtScroll">
            <form class="jt-thw" id="thoughtForm" autocomplete="off">
              <label class="jt-thw-k" for="thoughtIn">Today</label>
              <span class="jt-saved" id="thoughtSaved" role="status"></span>
              <input class="jt-thi" id="thoughtIn" type="text" maxlength="140"
                     placeholder="A thought about today" aria-label="A thought about today" />
            </form>
            <div id="thoughtList"></div>
          </div>
        </div>
      </section>

      <section class="jt-grid" id="jtGrid"></section>
    </div>
  </main>

  <main class="main" data-screen="calendar" hidden>
    <div class="pane">
      <div class="jc-head">
        <button class="step" type="button" id="calPrev" aria-label="Back">
          <svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M9.8 3.6 5.4 8l4.4 4.4"/></svg>
        </button>
        <button class="step" type="button" id="calNext" aria-label="Forward">
          <svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.2 3.6 10.6 8l-4.4 4.4"/></svg>
        </button>
        <button class="step wide" type="button" id="calToday">Today</button>
        <h2 class="jc-title" id="calTitle">—</h2>
        <div class="grow"></div>
        <div class="seg" id="calSeg" role="group" aria-label="Calendar scale">
          <button type="button" data-cal="month" aria-pressed="true">Month</button>
          <button type="button" data-cal="week" aria-pressed="false">Week</button>
          <button type="button" data-cal="day" aria-pressed="false">Day</button>
        </div>
      </div>
      <div class="jc-body" id="calBody"></div>
    </div>
  </main>

</div>

<script>
(function () {
'use strict';

/* ══ THE MODEL ══════════════════════════════════════════════════
   One key, one shape, this browser only, never uploaded. Every
   screen below reads through the functions here and nothing else
   writes the store.

   Names declared in this block are global to the whole file — the
   app is one IIFE — so anything that is not on the contract list
   stays inside a function. A collision here does not throw, it
   replaces, and the symptom turns up screens away.
   ═══════════════════════════════════════════════════════════════ */

const KEY = 'jade.v1';

/* THE LIST IS CODE, NOT DATA. Only the days are saved. A list written
   alongside the days and read back in preference to this one freezes
   on the first browser that ever ticked a box: reordering does
   nothing and a new habit never arrives. Nothing in the app edits it,
   so there is nothing to preserve.

   This one array decides the cards, the rail rows, the calendar
   events and the legend, in that order — so screen order is written
   down exactly once, here.

   at   minutes from local midnight, null for all-day.
   mins block length, null for all-day.
   col  the colour token, and the colour says WHICH habit, never
        whether the day went well. */
const HABITS = [
  { id: 'steps',    name: 'Daily steps',       goal: '10,000 minimum',              cad: { k: 'daily' },        at: null, mins: null, col: '--h-steps' },
  { id: 'walk',     name: 'Morning walk',      goal: 'Before the day starts',       cad: { k: 'daily' },        at: 420,  mins: 45,   col: '--h-walk' },
  { id: 'strength', name: 'Strength training', goal: '4× a week minimum',           cad: { k: 'week', n: 4 },   at: 1020, mins: 60,   col: '--h-strength' },
  { id: 'abs',      name: 'Abs and core',      goal: 'Every second day',            cad: { k: 'gap', n: 2 },    at: 1080, mins: 20,   col: '--h-abs' },
  { id: 'water',    name: 'Water',             goal: '2L minimum',                  cad: { k: 'daily' },        at: null, mins: null, col: '--h-water' },
  { id: 'audible',  name: 'Audible',           goal: '15 minutes, healing or learning', cad: { k: 'daily' },    at: 1200, mins: 15,   col: '--h-audible' },
  { id: 'read',     name: 'Read',              goal: '15 minutes minimum',          cad: { k: 'daily' },        at: 1260, mins: 15,   col: '--h-read' },
  { id: 'sleep',    name: 'Sleep',             goal: '7 hours minimum',             cad: { k: 'daily' },        at: 1350, mins: 30,   col: '--h-sleep' }
];

/* Each habit's own mark. An initial was the first version and it does
   not work here: Audible and Abs both start A, Sleep and Strength both
   S, so the rail was labelling four rows with two letters. Paths only —
   the call site supplies the <svg>, because the rail draws its mark at
   13px inside a filled disc and a card draws the same one at 15px in
   the habit's own colour. */
const MARKS = {
  /* A footprint was drawn first and it does not survive 13px: the sole
     becomes a blob and the toe becomes a speck beside it. A rising
     stair is four straight lines and it still reads at that size. */
  steps:    '<path d="M2.4 12.7h2.9V9.8h2.9V6.9h2.9V4h2.5"/>',
  /* Sunrise, and cut to three strokes: horizon, sun, one ray. Five
     elements at this size is a smudge, not a picture. */
  walk:     '<path d="M2.6 12.3h10.8"/><path d="M4.5 12.3a3.5 3.5 0 0 1 7 0"/>'
            + '<path d="M8 3.2v1.9"/>',
  strength: '<path d="M3.1 6.3v3.4M5.2 4.9v6.2M10.8 4.9v6.2M12.9 6.3v3.4M5.2 8h5.6"/>',
  abs:      '<circle cx="8" cy="8" r="5.4"/><circle cx="8" cy="8" r="1.7"/>',
  water:    '<path d="M8 2.5c0 0-4.3 4.4-4.3 7a4.3 4.3 0 0 0 8.6 0c0-2.6-4.3-7-4.3-7Z"/>',
  audible:  '<path d="M3.3 10.2V8a4.7 4.7 0 0 1 9.4 0v2.2"/>'
            + '<rect x="2.1" y="9.5" width="2.7" height="3.8" rx="1.35"/>'
            + '<rect x="11.2" y="9.5" width="2.7" height="3.8" rx="1.35"/>',
  read:     '<path d="M8 4.5S6.5 3.2 2.9 3.2v8.3c3.6 0 5.1 1.3 5.1 1.3s1.5-1.3 5.1-1.3V3.2C9.5 3.2 8 4.5 8 4.5Z"/>'
            + '<path d="M8 4.5v8.3"/>',
  sleep:    '<path d="M12.9 9.7A5.3 5.3 0 0 1 6.1 2.9a5.5 5.5 0 1 0 6.8 6.8Z"/>'
};

/* The mark, not a whole icon: see MARKS. An id with no mark returns
   nothing rather than an empty <svg> nobody can see but the audit can. */
function markOf(id) { return MARKS[id] || ''; }

const HAB = {};
HABITS.forEach(function (h) { HAB[h.id] = h; });

const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June',
  'July', 'August', 'September', 'October', 'November', 'December'];

/* Monday first, because every week in this app is Monday–Sunday: the
   month grid's header row, the week grid's columns and weekStart all
   want the same index. getDay() is Sunday-first, so anything indexing
   this from a Date uses (getDay() + 6) % 7. */
const WDAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

/* ── Dates. Local, always. ─────────────────────────────────────── */

/* Built by hand from the local parts. toISOString() is UTC: west of
   Greenwich after 5pm it hands back tomorrow's date, and a habit
   ticked tonight lands on tomorrow's square and reads as a miss
   today. */
function dayKey(d) {
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}

/* Local midnight. new Date('2026-08-20') is parsed as UTC by spec and
   is the previous evening in half the world. */
function fromKey(k) {
  const p = String(k).split('-');
  return new Date(+p[0], +p[1] - 1, +p[2]);
}

/* From the y/m/d parts, not getTime() + n * 86400000. The day the
   clocks change is 23 or 25 hours long, and the millisecond version
   lands on 23:00 the day before and ticks the wrong box — once a
   year, silently. Normalises to local midnight on the way through. */
function shift(d, n) {
  return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
}

function weekStart(d) {
  return shift(d, -((d.getDay() + 6) % 7));
}

function todayKey() { return dayKey(new Date()); }

/* String compare is enough: YYYY-MM-DD sorts as it reads. */
function isFuture(k) { return String(k) > todayKey(); }

/* ── Storage ───────────────────────────────────────────────────── */

/* REPAIR, NEVER DISCARD. The days are the only thing here that cannot
   be got back — a note can be retyped, the habit list is code. So
   every part of the shape fails on its own: a broken notes object
   costs the notes and not a year of days, an unknown id inside a day
   costs that id and not the day, a key that is not a date costs that
   key and nothing else.

   Takes either the raw string out of storage or an already-parsed
   object, so a test can hand it a shape without stringifying it. */
function repair(raw) {
  const out = { v: 1, days: {}, notes: {} };
  let v = raw;
  if (typeof v === 'string') {
    try { v = JSON.parse(v); } catch (e) { return out; }
  }
  if (!v || typeof v !== 'object' || Array.isArray(v)) return out;

  /* A key has to be a real day, not just the right shape: '2026-02-31'
     matches the pattern and is not a date, and round-tripping it
     through the local constructor is what catches that. */
  const realKey = function (k) {
    return /^\d{4}-\d{2}-\d{2}$/.test(k) && dayKey(fromKey(k)) === k;
  };

  const days = v.days;
  if (days && typeof days === 'object' && !Array.isArray(days)) {
    Object.keys(days).forEach(function (k) {
      if (!realKey(k)) return;
      const list = days[k];
      if (!Array.isArray(list)) return;
      const clean = [];
      /* Stored order is kept, and it is the order things were ticked —
         the log reads back newest first off the end of this array. */
      list.forEach(function (id) {
        if (HAB[id] && clean.indexOf(id) < 0) clean.push(id);
      });
      if (clean.length) out.days[k] = clean;
    });
  }

  const notes = v.notes;
  if (notes && typeof notes === 'object' && !Array.isArray(notes)) {
    Object.keys(notes).forEach(function (k) {
      if (!realKey(k)) return;
      const s = notes[k];
      if (typeof s === 'string' && s.trim()) out.notes[k] = s.trim();
    });
  }
  return out;
}

/* One stable object for the life of the page: load() refills it
   rather than rebinding it, so anything holding a reference — the
   test handle below included — never goes stale. */
const state = repair(null);

function load() {
  let raw = null;
  /* Private mode throws on READ as well as on write. An app that dies
     because it cannot see storage is worse than one that cannot
     save. */
  try { raw = localStorage.getItem(KEY); } catch (e) { raw = null; }
  const v = repair(raw);
  state.days = v.days;
  state.notes = v.notes;
  return state;
}

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); return true; }
  catch (e) { return false; }
}

function subscribe(fn) {
  if (typeof fn === 'function') subscribe.fns.push(fn);
}
/* Hung off the function rather than declared beside it: every
   top-level name in this file is shared with three other regions, and
   'listeners' is exactly the kind of name two of them would both
   want. */
subscribe.fns = [];

/* The only write path. Save first — a listener that throws must not
   cost the tick that caused it. */
function changed() {
  save();
  subscribe.fns.forEach(function (fn) { fn(); });
}

load();

/* ── Ticks ─────────────────────────────────────────────────────── */

function keptOn(k, id) {
  const list = state.days[k];
  return !!list && list.indexOf(id) >= 0;
}

function setKept(k, id, on) {
  if (!HAB[id] || dayKey(fromKey(k)) !== k) return;
  /* A tick on a day that has not happened is not a record of
     anything. The guard is here and not only in the calendar so that
     no screen can write one by accident. */
  if (isFuture(k)) return;
  const list = state.days[k] || [];
  const i = list.indexOf(id);
  if (on && i < 0) list.push(id);        // push: ticked order is the log's order
  else if (!on && i >= 0) list.splice(i, 1);
  else return;                           // no change, no write, no re-render
  if (list.length) state.days[k] = list; else delete state.days[k];
  changed();
}

/* Returns what is true after the write, not what was asked for: a
   future day refuses, and the caller needs to know that. */
function toggle(k, id) {
  setKept(k, id, !keptOn(k, id));
  return keptOn(k, id);
}

/* ── Cadence ───────────────────────────────────────────────────── */

function dueOn(id, k) {
  const h = HAB[id];
  if (!h) return false;
  const c = h.cad;
  if (c.k === 'daily') return true;

  if (c.k === 'gap') {
    /* "Never go two days without", measured from the last time you
       actually did it. Not an even/odd offset from an anchor date:
       one late day and an anchored schedule is wrong about every day
       after it, forever, and nothing ever puts it back. This
       self-heals the next morning. */
    for (let i = 1; i < c.n; i++) {
      if (keptOn(dayKey(shift(fromKey(k), -i)), id)) return false;
    }
    return true;
  }

  /* week: optional while you can still afford to skip, due the moment
     you cannot — that is what "4× a week minimum" means.

     The count deliberately excludes the day being asked about. If the
     day's own tick counted, ticking the last one of the four would
     flip the answer to "not due" and the row would vanish out from
     under the finger that ticked it, and the day ring would fall. */
  const mon = weekStart(fromKey(k));
  let kept = 0, left = 0, seen = false;
  for (let i = 0; i < 7; i++) {
    const d = dayKey(shift(mon, i));
    if (d === k) seen = true;
    else if (keptOn(d, id)) kept++;
    if (seen) left++;                    // days left counts the day itself
  }
  const need = c.n - kept;
  if (need <= 0) return false;
  return left <= need;
}

function dueIdsOn(k) {
  return HABITS.filter(function (h) { return dueOn(h.id, k); })
    .map(function (h) { return h.id; });
}

/* ── Counts ────────────────────────────────────────────────────── */

/* Every ring in the app is kept ÷ due for one Monday–Sunday week. */
function weekStat(id, ref) {
  const h = HAB[id];
  if (!h) return { kept: 0, due: 0 };
  const mon = weekStart(ref || new Date());

  if (h.cad.k === 'week') {
    /* The quota is the denominator, whole and from Monday: a week
       target does not accrue by the day. Overshooting reads 5/4 and
       the ring clamps — an honest number beats a flattering one. */
    let kept = 0;
    for (let i = 0; i < 7; i++) if (keptOn(dayKey(shift(mon, i)), id)) kept++;
    return { kept: kept, due: h.cad.n };
  }

  /* The denominator stops at today and grows as the week does. A
     Wednesday ring that reads 3/7 is telling you that you have failed
     at Thursday, and Thursday has not happened; a week that is over
     is the whole seven. */
  const t = todayKey();
  let kept = 0, due = 0;
  for (let i = 0; i < 7; i++) {
    const k = dayKey(shift(mon, i));
    if (k > t) break;
    const on = keptOn(k, id);
    /* Kept counts as due even on a rest day — doing more than you
       promised must not push the ratio down. */
    if (on || dueOn(id, k)) due++;
