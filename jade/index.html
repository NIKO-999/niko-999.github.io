<script>
(function () {
'use strict';

/* ══ THE MODEL ══════════════════════════════════════════════════
   One key, one shape, this browser only, never uploaded. Every
   screen below reads through the functions here and nothing else
   writes the store.

   Names declared in this block are global to the whole file — the
   app is one IIFE — so anything that is not on the contract list
   stays inside a function. A collision here does not throw, it
   replaces, and the symptom turns up screens away.
   ═══════════════════════════════════════════════════════════════ */

const KEY = 'jade.v1';

/* THE LIST IS CODE, NOT DATA. Only the days are saved. A list written
   alongside the days and read back in preference to this one freezes
   on the first browser that ever ticked a box: reordering does
   nothing and a new habit never arrives. Nothing in the app edits it,
   so there is nothing to preserve.

   This one array decides the cards, the rail rows, the calendar
   events and the legend, in that order — so screen order is written
   down exactly once, here.

   at   minutes from local midnight, null for all-day.
   mins block length, null for all-day.
   col  the colour token, and the colour says WHICH habit, never
        whether the day went well. */
const HABITS = [
  { id: 'steps',    name: 'Daily steps',       goal: '10,000 minimum',              cad: { k: 'daily' },        at: null, mins: null, col: '--h-steps' },
  { id: 'walk',     name: 'Morning walk',      goal: 'Before the day starts',       cad: { k: 'daily' },        at: 420,  mins: 45,   col: '--h-walk' },
  { id: 'strength', name: 'Strength training', goal: '4× a week minimum',           cad: { k: 'week', n: 4 },   at: 1020, mins: 60,   col: '--h-strength' },
  { id: 'abs',      name: 'Abs and core',      goal: 'Every second day',            cad: { k: 'gap', n: 2 },    at: 1080, mins: 20,   col: '--h-abs' },
  { id: 'water',    name: 'Water',             goal: '2L minimum',                  cad: { k: 'daily' },        at: null, mins: null, col: '--h-water' },
  { id: 'audible',  name: 'Audible',           goal: '15 minutes, healing or learning', cad: { k: 'daily' },    at: 1200, mins: 15,   col: '--h-audible' },
  { id: 'read',     name: 'Read',              goal: '15 minutes minimum',          cad: { k: 'daily' },        at: 1260, mins: 15,   col: '--h-read' },
  { id: 'sleep',    name: 'Sleep',             goal: '7 hours minimum',             cad: { k: 'daily' },        at: 1350, mins: 30,   col: '--h-sleep' }
];

const HAB = {};
HABITS.forEach(function (h) { HAB[h.id] = h; });

const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June',
  'July', 'August', 'September', 'October', 'November', 'December'];

/* Monday first, because every week in this app is Monday–Sunday: the
   month grid's header row, the week grid's columns and weekStart all
   want the same index. getDay() is Sunday-first, so anything indexing
   this from a Date uses (getDay() + 6) % 7. */
const WDAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

/* ── Dates. Local, always. ─────────────────────────────────────── */

/* Built by hand from the local parts. toISOString() is UTC: west of
   Greenwich after 5pm it hands back tomorrow's date, and a habit
   ticked tonight lands on tomorrow's square and reads as a miss
   today. */
function dayKey(d) {
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}

/* Local midnight. new Date('2026-08-20') is parsed as UTC by spec and
   is the previous evening in half the world. */
function fromKey(k) {
  const p = String(k).split('-');
  return new Date(+p[0], +p[1] - 1, +p[2]);
}

/* From the y/m/d parts, not getTime() + n * 86400000. The day the
   clocks change is 23 or 25 hours long, and the millisecond version
   lands on 23:00 the day before and ticks the wrong box — once a
   year, silently. Normalises to local midnight on the way through. */
function shift(d, n) {
  return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
}

function weekStart(d) {
  return shift(d, -((d.getDay() + 6) % 7));
}

function todayKey() { return dayKey(new Date()); }

/* String compare is enough: YYYY-MM-DD sorts as it reads. */
function isFuture(k) { return String(k) > todayKey(); }

/* ── Storage ───────────────────────────────────────────────────── */

/* REPAIR, NEVER DISCARD. The days are the only thing here that cannot
   be got back — a note can be retyped, the habit list is code. So
   every part of the shape fails on its own: a broken notes object
   costs the notes and not a year of days, an unknown id inside a day
   costs that id and not the day, a key that is not a date costs that
   key and nothing else.

   Takes either the raw string out of storage or an already-parsed
   object, so a test can hand it a shape without stringifying it. */
function repair(raw) {
  const out = { v: 1, days: {}, notes: {} };
  let v = raw;
  if (typeof v === 'string') {
    try { v = JSON.parse(v); } catch (e) { return out; }
  }
  if (!v || typeof v !== 'object' || Array.isArray(v)) return out;

  /* A key has to be a real day, not just the right shape: '2026-02-31'
     matches the pattern and is not a date, and round-tripping it
     through the local constructor is what catches that. */
  const realKey = function (k) {
    return /^\d{4}-\d{2}-\d{2}$/.test(k) && dayKey(fromKey(k)) === k;
  };

  const days = v.days;
  if (days && typeof days === 'object' && !Array.isArray(days)) {
    Object.keys(days).forEach(function (k) {
      if (!realKey(k)) return;
      const list = days[k];
      if (!Array.isArray(list)) return;
      const clean = [];
      /* Stored order is kept, and it is the order things were ticked —
         the log reads back newest first off the end of this array. */
      list.forEach(function (id) {
        if (HAB[id] && clean.indexOf(id) < 0) clean.push(id);
      });
      if (clean.length) out.days[k] = clean;
    });
  }

  const notes = v.notes;
  if (notes && typeof notes === 'object' && !Array.isArray(notes)) {
    Object.keys(notes).forEach(function (k) {
      if (!realKey(k)) return;
      const s = notes[k];
      if (typeof s === 'string' && s.trim()) out.notes[k] = s.trim();
    });
  }
  return out;
}

/* One stable object for the life of the page: load() refills it
   rather than rebinding it, so anything holding a reference — the
   test handle below included — never goes stale. */
const state = repair(null);

function load() {
  let raw = null;
  /* Private mode throws on READ as well as on write. An app that dies
     because it cannot see storage is worse than one that cannot
     save. */
  try { raw = localStorage.getItem(KEY); } catch (e) { raw = null; }
  const v = repair(raw);
  state.days = v.days;
  state.notes = v.notes;
  return state;
}

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); return true; }
  catch (e) { return false; }
}

function subscribe(fn) {
  if (typeof fn === 'function') subscribe.fns.push(fn);
}
/* Hung off the function rather than declared beside it: every
   top-level name in this file is shared with three other regions, and
   'listeners' is exactly the kind of name two of them would both
   want. */
subscribe.fns = [];

/* The only write path. Save first — a listener that throws must not
   cost the tick that caused it. */
function changed() {
  save();
  subscribe.fns.forEach(function (fn) { fn(); });
}

load();

/* ── Ticks ─────────────────────────────────────────────────────── */

function keptOn(k, id) {
  const list = state.days[k];
  return !!list && list.indexOf(id) >= 0;
}

function setKept(k, id, on) {
  if (!HAB[id] || dayKey(fromKey(k)) !== k) return;
  /* A tick on a day that has not happened is not a record of
     anything. The guard is here and not only in the calendar so that
     no screen can write one by accident. */
  if (isFuture(k)) return;
  const list = state.days[k] || [];
  const i = list.indexOf(id);
  if (on && i < 0) list.push(id);        // push: ticked order is the log's order
  else if (!on && i >= 0) list.splice(i, 1);
  else return;                           // no change, no write, no re-render
  if (list.length) state.days[k] = list; else delete state.days[k];
  changed();
}

/* Returns what is true after the write, not what was asked for: a
   future day refuses, and the caller needs to know that. */
function toggle(k, id) {
  setKept(k, id, !keptOn(k, id));
  return keptOn(k, id);
}

/* ── Cadence ───────────────────────────────────────────────────── */

function dueOn(id, k) {
  const h = HAB[id];
  if (!h) return false;
  const c = h.cad;
  if (c.k === 'daily') return true;

  if (c.k === 'gap') {
    /* "Never go two days without", measured from the last time you
       actually did it. Not an even/odd offset from an anchor date:
       one late day and an anchored schedule is wrong about every day
       after it, forever, and nothing ever puts it back. This
       self-heals the next morning. */
    for (let i = 1; i < c.n; i++) {
      if (keptOn(dayKey(shift(fromKey(k), -i)), id)) return false;
    }
    return true;
  }

  /* week: optional while you can still afford to skip, due the moment
     you cannot — that is what "4× a week minimum" means.

     The count deliberately excludes the day being asked about. If the
     day's own tick counted, ticking the last one of the four would
     flip the answer to "not due" and the row would vanish out from
     under the finger that ticked it, and the day ring would fall. */
  const mon = weekStart(fromKey(k));
  let kept = 0, left = 0, seen = false;
  for (let i = 0; i < 7; i++) {
    const d = dayKey(shift(mon, i));
    if (d === k) seen = true;
    else if (keptOn(d, id)) kept++;
    if (seen) left++;                    // days left counts the day itself
  }
  const need = c.n - kept;
  if (need <= 0) return false;
  return left <= need;
}

function dueIdsOn(k) {
  return HABITS.filter(function (h) { return dueOn(h.id, k); })
    .map(function (h) { return h.id; });
}

/* ── Counts ────────────────────────────────────────────────────── */

/* Every ring in the app is kept ÷ due for one Monday–Sunday week. */
function weekStat(id, ref) {
  const h = HAB[id];
  if (!h) return { kept: 0, due: 0 };
  const mon = weekStart(ref || new Date());

  if (h.cad.k === 'week') {
    /* The quota is the denominator, whole and from Monday: a week
       target does not accrue by the day. Overshooting reads 5/4 and
       the ring clamps — an honest number beats a flattering one. */
    let kept = 0;
    for (let i = 0; i < 7; i++) if (keptOn(dayKey(shift(mon, i)), id)) kept++;
    return { kept: kept, due: h.cad.n };
  }

  /* The denominator stops at today and grows as the week does. A
     Wednesday ring that reads 3/7 is telling you that you have failed
     at Thursday, and Thursday has not happened; a week that is over
     is the whole seven. */
  const t = todayKey();
  let kept = 0, due = 0;
  for (let i = 0; i < 7; i++) {
    const k = dayKey(shift(mon, i));
    if (k > t) break;
    const on = keptOn(k, id);
    /* Kept counts as due even on a rest day — doing more than you
       promised must not push the ratio down. */
    if (on || dueOn(id, k)) due++;
    if (on) kept++;
  }
  return { kept: kept, due: due };
}

function dayStat(k) {
  const ids = dueIdsOn(k);
  const on = state.days[k] || [];
  let kept = 0;
  ids.forEach(function (id) { if (keptOn(k, id)) kept++; });
  /* A habit kept on a day it did not owe you lands on both sides of
     the ratio, so the ring moves the moment anything is ticked and
     can never fall. */
  let extra = 0;
  on.forEach(function (id) { if (HAB[id] && ids.indexOf(id) < 0) extra++; });
  return { kept: kept + extra, due: ids.length + extra };
}

/* Consecutive DUE days kept, walking back from today. A day it was
   not due neither breaks the chain nor counts toward it. */
function chain(id) {
  if (!HAB[id]) return 0;
  const ks = Object.keys(state.days).sort();
  if (!ks.length) return 0;
  const floor = ks[0];
  let d = new Date();
  /* An unfinished today is not a broken chain, it is a day still
     going. Otherwise every card reads 0 at breakfast. */
  if (!keptOn(dayKey(d), id)) d = shift(d, -1);
  let n = 0;
  for (let i = 0; i < 4000; i++) {
    const k = dayKey(d);
    if (k < floor) break;
    if (keptOn(k, id)) n++;
    else if (dueOn(id, k)) break;
    d = shift(d, -1);
  }
  return n;
}

/* Consecutive days back from today where everything due was kept. */
function streak() {
  const ks = Object.keys(state.days).sort();
  if (!ks.length) return 0;
  const floor = ks[0];
  let d = new Date();
  const now = dayStat(dayKey(d));
  /* Today joins the run only once it is complete — an unfinished
     today must never read as a broken streak. */
  if (!(now.due > 0 && now.kept >= now.due)) d = shift(d, -1);
  let n = 0;
  for (let i = 0; i < 4000; i++) {
    const k = dayKey(d);
    if (k < floor) break;
    const s = dayStat(k);
    if (!(s.due > 0 && s.kept >= s.due)) break;
    n++;
    d = shift(d, -1);
  }
  return n;
}

/* The longest such run over everything stored. An unfinished today
   ends the current run for this purpose, which is right: the run up
   to yesterday is already counted. */
function best() {
  const ks = Object.keys(state.days).sort();
  if (!ks.length) return 0;
  const end = todayKey();
  let d = fromKey(ks[0]), run = 0, top = 0;
  for (let i = 0; i < 4000; i++) {
    const k = dayKey(d);
    if (k > end) break;
    const s = dayStat(k);
    if (s.due > 0 && s.kept >= s.due) { run++; if (run > top) top = run; }
    else run = 0;
    d = shift(d, 1);
  }
  return top;
}

function weekPct(ref) {
  const when = ref || new Date();
  let kept = 0, due = 0;
  HABITS.forEach(function (h) {
    const s = weekStat(h.id, when);
    kept += s.kept; due += s.due;
  });
  if (!due) return 0;
  return Math.round(clamp(kept / due, 0, 1) * 100);
}

/* ── The line about the day ─────────────────────────────────────── */

function noteOn(k) {
  const n = state.notes[k];
  return typeof n === 'string' ? n : '';
}

function setNote(k, txt) {
  if (dayKey(fromKey(k)) !== k) return;
  const s = String(txt == null ? '' : txt).trim().slice(0, 140);
  /* An empty line is not a line: clearing the box removes the note
     rather than storing '' for every day it was ever opened. */
  if (s) state.notes[k] = s; else delete state.notes[k];
  changed();
}

/* ── Formatting ────────────────────────────────────────────────── */

function fmtTime(min) {
  if (min == null) return 'ALL DAY';
  return String(Math.floor(min / 60)).padStart(2, '0') + ':' +
    String(min % 60).padStart(2, '0');
}

function fmtDay(d) { return WDAYS[(d.getDay() + 6) % 7] + ' ' + d.getDate(); }

function fmtLong(d) {
  /* Full weekday names sit here rather than beside WDAYS: WDAYS is the
     calendar's Monday-first column header and is used as one, and a
     single array cannot be both without a lookup at every call. */
  const full = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday',
    'Saturday', 'Sunday'];
  return full[(d.getDay() + 6) % 7] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()];
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function clamp(v, lo, hi) {
  const a = lo == null ? 0 : lo, b = hi == null ? 1 : hi;
  return v < a ? a : v > b ? b : v;
}

/* One handle on the model, so tests/jade.js can drive it directly.
   Asserting a cadence rule through eight clicks and a re-render tests
   the renderer, not the rule — and when it fails it does not say
   which. Nothing in the app reads this. */
window.JADE = {
  KEY: KEY, HABITS: HABITS, HAB: HAB, MONTHS: MONTHS, WDAYS: WDAYS,
  state: state, load: load, save: save, repair: repair,
  changed: changed, subscribe: subscribe,
  dayKey: dayKey, fromKey: fromKey, shift: shift, weekStart: weekStart,
  todayKey: todayKey, isFuture: isFuture,
  keptOn: keptOn, setKept: setKept, toggle: toggle,
  dueOn: dueOn, dueIdsOn: dueIdsOn,
  weekStat: weekStat, dayStat: dayStat, chain: chain, streak: streak,
  best: best, weekPct: weekPct,
  noteOn: noteOn, setNote: setNote,
  fmtTime: fmtTime, fmtDay: fmtDay, fmtLong: fmtLong,
  esc: esc, clamp: clamp
};

/* ══ THE MINI MONTH ═══════════════════════════════════════════════
   Its own reference date, deliberately. Paging it does not move the
   real calendar and the real calendar does not move it: one is for
   looking, the other is where you are. */

let jmRef = new Date();

function jmRender() {
  const grid = document.getElementById('jmGrid');
  const now = todayKey();
  const y = jmRef.getFullYear(), m = jmRef.getMonth();
  document.getElementById('jmTitle').textContent = MONTHS[m] + ' ' + y;

  /* Monday first, matching the week the whole app counts in. The
     reference starts on Sunday; a mini month that disagreed with the
     week view two clicks away would be worse than unfamiliar. */
  const out = WDAYS.map(d => `<span class="jm-w">${d[0]}</span>`);

  const lead = (new Date(y, m, 1).getDay() + 6) % 7;   /* Sun=0 -> Mon=0 */

  for (let i = 0; i < 42; i++) {
    const d = new Date(y, m, 1 - lead + i);
    const k = dayKey(d);
    const cls = ['jm-d'];
    if (d.getMonth() !== m) cls.push('out');
    if (k === now) cls.push('now');

    /* A dot means there is a record, not a verdict. Future days have
       none by construction, so they simply carry no mark. */
    const st = dayStat(k);
    const dot = st.kept > 0
      ? `<i class="jm-dot${st.due > 0 && st.kept >= st.due ? ' full' : ''}"></i>`
      : '';
    const said = st.kept > 0 ? `, ${st.kept} of ${st.due} kept` : '';

    out.push(`<button type="button" class="${cls.join(' ')}" data-k="${k}"`
      + ` aria-label="${esc(fmtLong(d))}${said}"><span>${d.getDate()}</span>${dot}</button>`);
  }
  grid.innerHTML = out.join('');
}

function jmBind() {
  const step = (n) => {
    jmRef = new Date(jmRef.getFullYear(), jmRef.getMonth() + n, 1);
    jmRender();
  };
  document.getElementById('jmPrev').addEventListener('click', () => step(-1));
  document.getElementById('jmNext').addEventListener('click', () => step(1));

  /* The title is the way to the month; a day is the way to that day.
     Both land on the real calendar, which is the point of having this
     one at all. */
  document.getElementById('jmTitle').addEventListener('click', () => {
    jcGoto(new Date(jmRef.getFullYear(), jmRef.getMonth(), 1), 'month');
    showView('calendar');
  });
  document.getElementById('jmGrid').addEventListener('click', (e) => {
    const b = e.target.closest('.jm-d');
    if (!b) return;
    jmRef = fromKey(b.dataset.k);
    jmRender();
    jcGoto(fromKey(b.dataset.k), 'day');
    showView('calendar');
  });
}

/* ══ TODAY ═══════════════════════════════════════════════════════
   Three readings of one day: the strip is how it is going, the grid
   is what it is made of, and the rail is what is next. All three go
   through dayStat, weekStat and chain, so no two of them can end up
   disagreeing about a number.

   Nothing below reads storage. The model is the only thing that
   touches the key, and subscribe() calls jtRender when it changes.
   ═══════════════════════════════════════════════════════════════ */

function jtRender() {
  jtStrip();
  jtCards();
  jtRail();
}

/* ── the strip ─────────────────────────────────────────────────── */

function jtStrip() {
  const k = todayKey();
  const s = dayStat(k);

  /* The day ring is kept ÷ due for TODAY, and it moves the moment
     anything is ticked — that is the whole reason it is the biggest
     thing on the screen. */
  jtRing.set(document.getElementById('dayRing').closest('.jt-ring'), s.kept, s.due);

  document.getElementById('dayDate').textContent = fmtLong(new Date());
  document.getElementById('dayCap').textContent = jtSay(s.kept, s.due);
  document.getElementById('statStreak').textContent = streak();
  document.getElementById('statWeek').textContent = weekPct() + '%';
  document.getElementById('statBest').textContent = best();

  /* The line under the name in the top bar is this same reading. Left
     to the markup's placeholder it would go on saying "nothing kept
     yet" over a screen of ticked cards, and the one line on the page
     that is about her would be the one line that was wrong. */
  document.getElementById('whoSub').textContent =
    !s.kept ? 'nothing kept yet'
      : s.kept >= s.due ? 'all done today'
        : s.kept + ' of ' + s.due + ' kept today';
}

/* "three still to go", not "3/7 (43%)". The ring already carries the
   fraction; this is the sentence you read instead of doing the sum. */
function jtSay(kept, due) {
  if (!due) return 'nothing due';
  const left = due - kept;
  if (left <= 0) return 'all done';
  const w = ['zero', 'one', 'two', 'three', 'four', 'five', 'six',
    'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve'];
  return (w[left] || left) + ' still to go';
}

/* ── rings ─────────────────────────────────────────────────────── */

/* The skeleton only. State goes on through jtRing.set, so a ring that
   is already on the screen is UPDATED rather than replaced — a fresh
   element has no previous offset to transition from and would snap.

   r + half the stroke is 36, so the drawn ring is exactly 72px across
   and the viewBox is 1:1 with CSS pixels: no scale factor between the
   width the stroke asks for and the width that lands. */
function jtRing() {
  return '<span class="jt-ring">' +
      '<svg viewBox="0 0 72 72" aria-hidden="true">' +
        '<circle class="jt-track" cx="36" cy="36" r="33"/>' +
        '<circle class="jt-prog" cx="36" cy="36" r="33"/>' +
      '</svg>' +
      '<span class="jt-ringn" aria-hidden="true"></span>' +
      '<span class="jt-tk" hidden>' +
        '<svg class="ic" viewBox="0 0 16 16" aria-hidden="true">' +
          '<path d="M3.6 8.4 6.6 11.4 12.4 4.9"/></svg>' +
      '</span>' +
      /* The picture is never the only copy of the number: at 100% the
         centre is a check glyph, and a check is not a reading. */
      '<span class="sr"></span>' +
    '</span>';
}

/* Drives any ring, whatever its radius — the day ring's geometry is
   in the markup and a card's is above, so the circumference is read
   off the circle rather than written down twice. */
jtRing.set = function (ring, kept, due) {
  const c = ring.querySelector('.jt-prog');
  const C = 2 * Math.PI * parseFloat(c.getAttribute('r'));
  const p = due > 0 ? Math.min(1, Math.max(0, kept / due)) : 0;
  /* Inline, because the pre-paint values in the stylesheet leave the
     ring empty and these have to win over them. */
  c.style.strokeDasharray = C.toFixed(2);
  c.style.strokeDashoffset = (C * (1 - p)).toFixed(2);

  const num = ring.querySelector('.jt-ringn');
  const tk = ring.querySelector('.jt-tk');
  const sr = ring.querySelector('.sr');
  num.textContent = kept + '/' + due;
  /* The day ring has no check: its denominator is what today happens
     to owe, and 7/7 there is a fuller sentence than a tick. */
  if (tk) {
    const full = due > 0 && p >= 1;
    num.hidden = full;
    tk.hidden = !full;
  }
  if (sr) sr.textContent = kept + ' of ' + due + ' this week';
};

/* ── the grid ──────────────────────────────────────────────────── */

function jtCards() {
  const grid = document.getElementById('jtGrid');
  /* Built once. Rewriting innerHTML on every tick would throw away the
     button the finger is still on — focus lands back on <body> and a
     keyboard user loses their place halfway down the grid — and every
     ring would be reborn at its final offset, so nothing would ever
     animate. The list is code, so the count is the only thing that can
     ever change. */
  if (grid.children.length !== HABITS.length) {
    grid.innerHTML = HABITS.map(function (h) { return jtCard(h); }).join('');
  }
  HABITS.forEach(function (h) {
    jtCard.fill(grid.querySelector('.jt-card[data-id="' + h.id + '"]'), h);
  });
}

/* Everything that cannot change: the id, the colour, the name, the
   target. jtCard.fill does the rest. */
function jtCard(h) {
  return '<button type="button" class="jt-card" data-id="' + h.id + '"' +
      ' style="--jt-c:var(' + h.col + ')" aria-pressed="false">' +
      jtRing() +
      '<span class="jt-t">' +
        '<span class="jt-nm">' + esc(h.name) + '</span>' +
        '<span class="jt-goal">' + esc(h.goal) + '</span>' +
      '</span>' +
      '<span class="jt-chip"></span>' +
    '</button>';
}

jtCard.fill = function (el, h) {
  const k = todayKey();
  const on = keptOn(k, h.id);
  el.setAttribute('aria-pressed', on ? 'true' : 'false');

  const s = weekStat(h.id, new Date());
  jtRing.set(el.querySelector('.jt-ring'), s.kept, s.due);

  /* Written lowercase and uppercased by the stylesheet: a screen
     reader spells "DUE" out letter by letter and reads "due". */
  const n = chain(h.id);
  el.querySelector('.jt-chip').textContent =
    (!on && !dueOn(h.id, k)) ? 'rest day'
      : n > 0 ? n + ' day chain'
        : 'due';
};

/* ── the rail ──────────────────────────────────────────────────── */

function jtRail() {
  const k = todayKey();
  const list = document.getElementById('railList');
  const s = dayStat(k);

  const due = dueIdsOn(k)
    .map(function (id) { return HAB[id]; })
    .sort(function (a, b) {
      /* All-day ahead of the clock, and -1 rather than 0 so a habit at
         00:00 would still fall after it. The sort is stable, so the two
         all-day habits keep the order the list gives them. */
      return (a.at == null ? -1 : a.at) - (b.at == null ? -1 : b.at);
    });

  /* Rebuilt only when the set of rows changes — which today's own
     ticks cannot do, since neither cadence asks about the day it is
     being asked about. Same reason as the grid: the row you just
     pressed has to survive being pressed. */
  const sig = due.map(function (h) { return h.id; }).join(',');
  if (jtRail.sig !== sig) {
    jtRail.sig = sig;
    list.innerHTML = due.length
      ? due.map(function (h) { return jtRailRow(h); }).join('')
      : '<p class="jt-none">nothing due today</p>';
  }

  /* The next thing due is the first row not yet ticked. Once they are
     all ticked nothing is orange — an accent with nothing left to
     point at is just a colour. */
  let next = '';
  for (let i = 0; i < due.length; i++) {
    if (!keptOn(k, due[i].id)) { next = due[i].id; break; }
  }
  const rows = list.querySelectorAll('.jt-r');
  for (let i = 0; i < rows.length; i++) {
    const row = rows[i];
    row.setAttribute('aria-pressed', keptOn(k, row.dataset.id) ? 'true' : 'false');
    if (row.dataset.id === next) row.setAttribute('data-next', '');
    else row.removeAttribute('data-next');
  }

  document.getElementById('railCount').textContent =
    !s.due ? 'nothing due'
      : s.kept >= s.due ? 'all done'
        : s.kept + '/' + s.due;

  /* A tick anywhere on the screen re-renders this, so a line being
     typed must not be overwritten by the line that is saved. */
  const inp = document.getElementById('noteIn');
  if (inp !== document.activeElement) inp.value = noteOn(k);

  jtLines();
}

function jtRailRow(h) {
  return '<button type="button" class="jt-r" data-id="' + h.id + '"' +
      ' style="--jt-c:var(' + h.col + ')" aria-pressed="false">' +
      '<span class="jt-r-av" aria-hidden="true">' +
        esc(h.name.charAt(0).toUpperCase()) + '</span>' +
      '<span class="jt-r-nm">' + esc(h.name) + '</span>' +
      '<span class="jt-r-at">' + fmtTime(h.at) + '</span>' +
      '<span class="jt-r-tk" aria-hidden="true">' +
        '<svg class="ic" viewBox="0 0 16 16" aria-hidden="true">' +
          '<path d="M3.6 8.4 6.6 11.4 12.4 4.9"/></svg>' +
      '</span>' +
    '</button>';
}

function jtLines() {
  const k = todayKey();
  const all = Object.keys(state.notes);
  /* Today is the field above this list, not a row in it — one line can
     be in one place. Everything else, newest first. */
  const past = all.filter(function (x) { return x !== k; }).sort().reverse();

  document.getElementById('lineCount').textContent = all.length;
  document.getElementById('lineList').innerHTML = past.length
    ? past.map(function (x) {
      const d = fromKey(x);
      /* Weekday, date AND month on every row. "Wed 19" alone is a
         different day depending on which month you have scrolled to,
         and this list goes back years. */
      const when = WDAYS[(d.getDay() + 6) % 7] + ' ' + d.getDate()
        + ' ' + MONTHS[d.getMonth()].slice(0, 3);
      return '<div class="jt-ln"><b>' + esc(when) + '</b><p>'
        + esc(state.notes[x]) + '</p></div>';
    }).join('')
    : '<p class="jt-none">nothing written yet</p>';
}

let jtSaidFor = null;

function jtBind() {
  if (jtBind.done) return;
  jtBind.done = true;

  /* todayKey() is read inside the handler and not out here: this page
     is left open overnight, and a tick has to land on the day the
     finger is on. */
  const tick = function (sel) {
    return function (e) {
      const b = e.target.closest(sel);
      if (b) toggle(todayKey(), b.dataset.id);
    };
  };

  document.getElementById('jtGrid')
    .addEventListener('click', tick('.jt-card'));
  document.getElementById('railList')
    .addEventListener('click', tick('.jt-r'));
  document.getElementById('addBtn').addEventListener('click', function () {
    const k = todayKey();
    /* Marks what is left and stops there. Nothing left to mark is not
       an invitation to unmark the day: an "undo everything" hidden on
       the button you press to finish is a trap you find by accident,
       once, having lost the day. */
    dueIdsOn(k).forEach(function (id) {
      if (!keptOn(k, id)) toggle(k, id);
    });
  });

  document.getElementById('noteForm').addEventListener('submit', function (e) {
    e.preventDefault();
    const inp = document.getElementById('noteIn');
    setNote(todayKey(), inp.value);
    /* Read back rather than left as typed: setNote trims and caps, and
       the box should show what is stored, not what was offered. The
       re-render leaves a focused field alone, so this is the only
       place that line can land. */
    inp.value = noteOn(todayKey());
    /* Sent and unsent used to look identical, so the only way to know a
       line had been kept was to reload the page. */
    const said = document.getElementById('noteSaved');
    said.textContent = inp.value ? 'saved' : 'cleared';
    said.classList.add('on');
    clearTimeout(jtSaidFor);
    jtSaidFor = setTimeout(function () { said.classList.remove('on'); }, 1600);
  });
}

/* ══ THE CALENDAR ═════════════════════════════════════════════════
   Month, week, day. Its own reference date, moved by the header, the
   keys, or the mini month in the rail. */

let jcRef = new Date();
let jcScale = 'month';
let jcTick = null;                    /* the now-line timer, cleared on the way out */

const JC_H0 = 5;                      /* the grid starts at 05:00 and ends at 24:00 */
const JC_HR = 44;                     /* one hour, in px — the row height in cal.css */

function jcGoto(d, scale) {
  jcRef = d;
  if (scale) jcScale = scale;
  jcRender();
}

function jcTitle() {
  if (jcScale === 'month') return MONTHS[jcRef.getMonth()] + ' ' + jcRef.getFullYear();
  if (jcScale === 'day') return fmtLong(jcRef);
  const a = weekStart(jcRef), b = shift(a, 6);
  /* "17 – 23 August" when one month holds the week, both names when it
     does not. A week that straddles a month is the case that reads
     wrong if you only ever test the middle of one. */
  return a.getMonth() === b.getMonth()
    ? `${a.getDate()} – ${b.getDate()} ${MONTHS[b.getMonth()]} ${b.getFullYear()}`
    : `${a.getDate()} ${MONTHS[a.getMonth()]} – ${b.getDate()} ${MONTHS[b.getMonth()]} ${b.getFullYear()}`;
}

/* What shows on a day, and why each one is there.

   In month view, space is the constraint: only what was kept or is due
   earns a chip. In week and day view every habit gets its slot, kept or
   not — otherwise there is no way to log a session on a Tuesday it was
   not asked of you, and doing more than you promised is not an error. */
function jcEvents(k, all) {
  const out = [];
  for (const h of HABITS) {
    const on = keptOn(k, h.id);
    const due = dueOn(h.id, k);
    if (!all && !on && !due) continue;
    out.push({ h, on, due });
  }
  return out.sort((a, b) => (a.h.at === null ? -1 : b.h.at === null ? 1 : a.h.at - b.h.at));
}

function jcChip(k, e, ahead) {
  const cls = ['jc-chip', e.on ? 'on' : e.due ? 'due' : '', ahead ? 'ahead' : ''];
  return `<button type="button" class="${cls.join(' ').trim()}" style="--jc-c: var(${e.h.col})"`
    + ` data-k="${k}" data-id="${e.h.id}"${ahead ? ' aria-disabled="true"' : ''}`
    + ` aria-pressed="${e.on}"><i class="jc-dot"></i><span>${esc(e.h.name)}</span></button>`;
}

function jcMonth() {
  const y = jcRef.getFullYear(), m = jcRef.getMonth(), now = todayKey();
  const lead = (new Date(y, m, 1).getDay() + 6) % 7;
  const out = WDAYS.map(d => `<div class="jc-wd">${d}</div>`);

  for (let i = 0; i < 42; i++) {
    const d = new Date(y, m, 1 - lead + i);
    const k = dayKey(d);
    const ev = jcEvents(k, false);

    /* Named chips were the first thing tried here and they were wrong.
       The same eight habits recur every day, so three names and a
       "+5 more" appeared identically in all 42 cells and said nothing
       about any of them. A pip per habit — filled for kept, hollow for
       due and not kept — fits the whole day in one line and is read at
       a glance, which is the only thing a month grid is for. */
    /* Nothing ahead of today. A future week rendered as eight hollow
       rings a day is a wall of things you have not done yet, which is
       indistinguishable from a wall of things you failed. */
    const pips = isFuture(k) ? '' : ev.map(e => `<i class="jc-pip${e.on ? ' on' : ''}"`
      + ` style="--jc-c: var(${e.h.col})"></i>`).join('');

    const st = dayStat(k);
    /* No score on a day that has not happened: 0/7 against tomorrow is
       not a fact about anything. */
    const score = !isFuture(k) && st.due > 0
      ? `<span class="jc-sc">${st.kept}/${st.due}</span>` : '';
    const cls = ['jc-cell', d.getMonth() !== m ? 'out' : '', k === now ? 'now' : ''];
    const said = st.due > 0 && !isFuture(k) ? `, ${st.kept} of ${st.due} kept` : '';

    /* The whole cell opens the day, and the pips inside it are not
       controls. Eight 11px targets in a 140px box is a tap you miss;
       the day and week grids are where a mark is made. */
    out.push(`<button type="button" class="${cls.join(' ').trim()}" data-open="${k}"`
      + ` aria-label="${esc(fmtLong(d))}${said}">`
      + `<span class="jc-top"><span class="jc-num">${d.getDate()}</span>${score}</span>`
      + `<span class="jc-dots">${pips}</span></button>`);
  }
  return `<div class="jc-month">${out.join('')}</div>`;
}

function jcGrid(days) {
  const now = todayKey();
  const start = days === 7 ? weekStart(jcRef) : jcRef;
  const cols = [];
  for (let i = 0; i < days; i++) cols.push(shift(start, i));

  const head = cols.map(d => `<div class="jc-dh${dayKey(d) === now ? ' now' : ''}">`
    + `<b>${d.getDate()}</b><span>${WDAYS[(d.getDay() + 6) % 7]}</span></div>`).join('');

  const allday = cols.map((d) => {
    const k = dayKey(d), ahead = isFuture(k);
    const ev = jcEvents(k, true).filter(e => e.h.at === null);
    return `<div class="jc-ad">${ev.map(e => jcChip(k, e, ahead)).join('')}</div>`;
  }).join('');

  const hours = [];
  for (let h = JC_H0; h < 24; h++) hours.push(`<div class="jc-hr">${String(h).padStart(2, '0')}:00</div>`);

  const body = cols.map((d) => {
    const k = dayKey(d), ahead = isFuture(k);
    const ev = jcEvents(k, true).filter(e => e.h.at !== null).map((e) => {
      const top = (e.h.at - JC_H0 * 60) * (JC_HR / 60);
      /* Twenty minutes is 14px, which is a line of text with nowhere to
         sit. Short blocks get a floor and overlap nothing, because none
         of these habits share a slot. */
      const hgt = Math.max(e.h.mins * (JC_HR / 60), 26);
      const cls = ['jc-ev', e.on ? 'on' : e.due ? 'due' : 'off', ahead ? 'ahead' : ''];
      return `<button type="button" class="${cls.join(' ').trim()}"`
        + ` style="--jc-c: var(${e.h.col}); top:${top}px; height:${hgt}px"`
        + ` data-k="${k}" data-id="${e.h.id}"${ahead ? ' aria-disabled="true"' : ''}`
        + ` aria-pressed="${e.on}"><b>${esc(e.h.name)}</b>`
        + `<span>${fmtTime(e.h.at)}</span></button>`;
    }).join('');
    return `<div class="jc-col" data-k="${k}">${ev}</div>`;
  }).join('');

  const note = days === 1 && noteOn(dayKey(jcRef))
    ? `<div class="jc-note"><b>The line about that day</b>${esc(noteOn(dayKey(jcRef)))}</div>` : '';

  return `<div class="jc-grid" style="grid-template-columns: 58px repeat(${days}, minmax(104px, 1fr))">`
    + `<div class="jc-corner"></div>${head}`
    + `<div class="jc-adl">All day</div>${allday}`
    + `<div class="jc-gut">${hours.join('')}</div>${body}${note}</div>`;
}

function jcWeek() { return jcGrid(7); }
function jcDay() { return jcGrid(1); }

/* The now line is drawn after the grid rather than rendered into it: it
   moves once a minute and the grid does not. */
function jcNow() {
  if (jcTick) { clearInterval(jcTick); jcTick = null; }
  if (jcScale === 'month') return;
  const draw = () => {
    for (const el of document.querySelectorAll('.jc-now')) el.remove();
    const col = document.querySelector(`.jc-col[data-k="${todayKey()}"]`);
    if (!col) return;
    const d = new Date();
    const mins = d.getHours() * 60 + d.getMinutes() - JC_H0 * 60;
    if (mins < 0 || mins > (24 - JC_H0) * 60) return;
    const line = document.createElement('div');
    line.className = 'jc-now';
    line.style.top = (mins * (JC_HR / 60)) + 'px';
    col.appendChild(line);
  };
  draw();
  jcTick = setInterval(draw, 60000);
}

function jcRender() {
  document.getElementById('calTitle').textContent = jcTitle();
  for (const b of document.querySelectorAll('#calSeg button'))
    b.setAttribute('aria-pressed', String(b.dataset.cal === jcScale));
  document.getElementById('calBody').innerHTML =
    jcScale === 'month' ? jcMonth() : jcScale === 'day' ? jcDay() : jcWeek();
  jcNow();
}

function jcBind() {
  const step = (n) => {
    if (jcScale === 'month') jcRef = new Date(jcRef.getFullYear(), jcRef.getMonth() + n, 1);
    else jcRef = shift(jcRef, n * (jcScale === 'week' ? 7 : 1));
    jcRender();
  };
  document.getElementById('calPrev').addEventListener('click', () => step(-1));
  document.getElementById('calNext').addEventListener('click', () => step(1));
  document.getElementById('calToday').addEventListener('click', () => { jcRef = new Date(); jcRender(); });
  document.getElementById('calSeg').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (b) { jcScale = b.dataset.cal; jcRender(); }
  });

  document.getElementById('calBody').addEventListener('click', (e) => {
    const open = e.target.closest('[data-open]');
    if (open) { jcRef = fromKey(open.dataset.open); jcScale = 'day'; jcRender(); return; }
    const hit = e.target.closest('[data-id]');
    if (!hit || hit.getAttribute('aria-disabled') === 'true') return;
    toggle(hit.dataset.k, hit.dataset.id);
  });

  document.addEventListener('keydown', (e) => {
    if (view !== 'calendar') return;
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'ArrowLeft') { step(-1); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { step(1); e.preventDefault(); }
    else if (e.key === 't') { jcRef = new Date(); jcRender(); }
    else if (e.key === 'm' || e.key === 'w' || e.key === 'd') {
      jcScale = { m: 'month', w: 'week', d: 'day' }[e.key];
      jcRender();
    }
  });
}

/* ══ THE APP ══════════════════════════════════════════════════════
   Two screens, one rail. The rail stays up on both: what is due today
   does not stop being true because you went to look at March. */

let view = 'today';

/* The panel's state is not a record, so it lives in its own key. Nothing
   about the days should share an object with a preference: losing this
   costs nothing and losing those costs a year, and a repair that has to
   consider both is a repair that can get it wrong. */
const UIKEY = 'jade.ui.v1';

function setRail(shut, remember) {
  document.documentElement.dataset.rail = shut ? 'shut' : 'open';
  const b = document.getElementById('railBtn');
  b.setAttribute('aria-expanded', String(!shut));
  b.setAttribute('aria-label', shut ? 'Show the panel' : 'Hide the panel');
  if (remember) { try { localStorage.setItem(UIKEY, shut ? 'shut' : 'open'); } catch (e) {} }
}

function showView(v) {
  if (v !== 'today' && v !== 'calendar') return;
  view = v;
  for (const m of document.querySelectorAll('.main')) m.hidden = m.dataset.screen !== v;
  for (const b of document.querySelectorAll('.nav-i')) {
    if (b.dataset.view === v) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  }
  /* The calendar is not rendered while it is hidden — a month grid that
     nothing can see is 42 cells of layout for no reason — so it is drawn
     on the way in. */
  if (v === 'calendar') jcRender();
}

function boot() {
  /* Read before the first render so a shut panel is never painted open
     and then taken away. */
  let shut = false;
  try { shut = localStorage.getItem(UIKEY) === 'shut'; } catch (e) {}
  setRail(shut, false);
  document.getElementById('railBtn').addEventListener('click',
    () => setRail(document.documentElement.dataset.rail !== 'shut', true));

  document.querySelector('.nav').addEventListener('click', (e) => {
    const b = e.target.closest('.nav-i');
    if (b) showView(b.dataset.view);
  });

  jtBind();
  jcBind();
  jmBind();
  subscribe(() => { jtRender(); jmRender(); if (view === 'calendar') jcRender(); });
  jtRender();
  jmRender();
  showView('today');

  /* Left open overnight, every reading on the screen is about the wrong
     day. Cheap to check, and the alternative is a tick landing on
     yesterday. */
  let stamp = todayKey();
  setInterval(() => {
    const now = todayKey();
    if (now === stamp) return;
    stamp = now;
    jtRender();
    jmRender();
    if (view === 'calendar') jcRender();
  }, 30000);
}

boot();
})();
</script>
</body>
</html>
