<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<!-- Dark only, and that is a decision rather than an omission. The whole
     palette is one warm accent against a near-black frame; a light mode
     would need a second set of eight habit colours that still clear the
     contrast floor, and half of them would not. -->
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#15171E" />
<!-- Without this the browser asks for /favicon.ico on every load and takes
     a 404 for it. -->
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<title>Jade — Habits</title>
<style>
/* ══ TOKENS AND CHROME ══════════════════════════════════════════
   The frame every screen sits in: the reset, the type, the top bar,
   the two panes and the rail. Nothing here knows what a habit is.

   STANDALONE. No @font-face, no image, no import — this file names no
   asset outside jade/, so the app opens off the disk with the network
   unplugged and looks the same. The type is whatever the machine
   already has.

   Class prefixes are load-bearing: jt- is the today screen's, jc- is
   the calendar's, and everything below is unprefixed because it
   belongs to no screen. Nothing here styles either prefix.
   ══════════════════════════════════════════════════════════════ */

:root {
  color-scheme: dark;

  --bg:        #15171E;   /* page */
  --surface:   #1C1F28;   /* top bar, rail — a step up off the page */
  --card:      #232733;   /* panels and cards */
  --card-2:    #2A2F3C;   /* hover, and the pressed half of a segment */
  --line:      #313746;   /* the 1px border, one step above the card */
  --line-2:    #3C4354;   /* brighter border: a kept card, a scrollbar */
  --ink:       #F1F3F8;
  --ink-2:     #8E95A6;
  --ink-3:     #626A7B;   /* captions and times only — see the note below */

  /* One warm accent, and it is spent only on what is live, what is
     yours, and what you press. A second accent would make both of them
     mean nothing. */
  --accent:    #FF6FA5;   /* soft hot pink */
  /* NOT white. White on this pink measures 2.60:1, and it measured the
     same on the orange this replaced — the solid rail row, the + and the
     send arrow were all under the floor and looked deliberate. A near
     black warmed toward the accent reads as belonging to it and comes
     out at 7.01:1. */
  --accent-in: #1A1220;
  --track:     #2C3140;   /* the unfilled part of a ring or a bar */
  --focus:     #FF6FA5;

  /* BUBBLE GEOMETRY. Everything that holds text is round: a panel is a
     22px bubble, anything that holds one line — a chip, a rail row, a
     log entry, a control — is a full pill. Tokens rather than numbers
     because a card and the box beside it drifting apart by 2px is the
     kind of thing nobody sees and everybody feels. */
  --r-card: 22px;
  --r-in:   16px;
  --r-pill: 999px;

  --font: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;

  /* Eight identities. The colour says WHICH habit, never whether the
     day went well — a kept mark takes its habit's colour and an unkept
     one is hollow, so no week can ever come out red. A wash of red
     across a bad week is a judgement, and a judgement is what makes
     you stop opening the screen. */
  --h-steps:    #3DE8A6;
  --h-walk:     #A8ED5B;
  /* Strength takes the orange the accent vacated. Two pinks on one
     screen — an accent that means "this is you, press this" and a habit
     identity that means "strength training" — is a collision the ΔE
     floor would pass and the eye would not. */
  --h-strength: #FFA33D;
  --h-abs:      #C08BFF;
  --h-water:    #45DDF2;
  --h-sleep:    #7FA6FF;
  --h-read:     #F2E45C;
  --h-audible:  #FF6B6B;
}

/* ── reset ── */

*, *::before, *::after { box-sizing: border-box; }

html {
  height: 100%;
  -webkit-text-size-adjust: 100%;
}

body {
  height: 100%;
  height: 100dvh;          /* a phone's toolbar slides away; 100vh does not follow it */
  margin: 0;
  display: flex;
  flex-direction: column;
  /* The page itself never scrolls. The header is always on screen and
     the two scrollers inside it — the pane and the rail's list — do all
     the moving. */
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.45;
  /* Every figure on this screen is a count that ticks: 5/7 becoming
     6/7 must not shift the glyph beside it. */
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, p, figure { margin: 0; }
b, strong { font-weight: 600; }

button, input, select, textarea {
  font: inherit;
  color: inherit;
  letter-spacing: inherit;
}
button { -webkit-appearance: none; appearance: none; }

/* An inline SVG sits on the text baseline and leaves 4px of descender
   under it, which is enough to knock a 34px button off centre. */
svg { display: block; }

/* !important because the chrome and both screens set display on the
   things they hide — .main is a flex column, and a plain
   [hidden]{display:none} loses to it. The inactive screen would stay
   on top of the active one, and nothing about the markup would say
   why. */
[hidden] { display: none !important; }

::selection { background: var(--accent); color: var(--accent-in); }

/* Every control, one rule, so a new control cannot ship without it.
   :focus-visible rather than :focus — a mouse press on a card should
   not leave a ring behind it. */
:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

/* The default scrollbar is a light-mode object and it lands on the one
   dark panel it crosses. */
.pane, .rail-list, .rail-log, .body {
  scrollbar-width: thin;
  scrollbar-color: var(--line-2) transparent;
}
.pane::-webkit-scrollbar,
.rail-list::-webkit-scrollbar,
.rail-log::-webkit-scrollbar,
.body::-webkit-scrollbar { width: 9px; height: 9px; }
.pane::-webkit-scrollbar-thumb,
.rail-list::-webkit-scrollbar-thumb,
.rail-log::-webkit-scrollbar-thumb,
.body::-webkit-scrollbar-thumb {
  background: var(--line-2);
  border: 2px solid transparent;
  background-clip: content-box;
  border-radius: var(--r-pill);
}
.pane::-webkit-scrollbar-track,
.rail-list::-webkit-scrollbar-track,
.rail-log::-webkit-scrollbar-track,
.body::-webkit-scrollbar-track { background: transparent; }

/* Visually gone, still read aloud. 2px rather than the usual 1px:
   a 1px box is indistinguishable from a hairline rule that has
   collapsed, and the geometry audit has to be able to tell a label it
   should ignore from a layout fault it should not. */
.sr {
  position: absolute;
  width: 2px;
  height: 2px;
  margin: -2px;
  padding: 0;
  border: 0;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

/* ── top bar ──
   56px, one hairline under it, and three things on it: the wordmark
   left, the screens centred, you on the right. */

.top {
  flex: 0 0 auto;
  position: relative;
  z-index: 2;
  height: 56px;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 18px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}

/* The wordmark and the identity block take an equal share of whatever
   is left over, which is what puts the nav on the true centre of the
   bar rather than the centre of the space after the wordmark. */
.brand {
  flex: 1 1 0;
  min-width: 0;
  display: flex;
  /* Centred rather than baseline now that a control shares the row.
     A 32px button on a text baseline sits a third of its height too
     low, and the 1px the sub-label gives up is the cheaper of the two. */
  align-items: center;
  gap: 7px;
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: -.01em;
  color: var(--ink);
  white-space: nowrap;
}
.brand span {
  font-size: .62rem;
  font-weight: 500;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-3);
}

.nav {
  flex: 0 0 auto;
  align-self: stretch;          /* so the underline can reach the bar's border */
  display: flex;
  align-items: stretch;
  gap: 4px;
}

.nav-i {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  /* Stretched, less 2px top and bottom. Full height would put the
     focus ring's top edge off the top of the window and its bottom
     edge over the pane; 2px of slack lands the whole ring inside the
     header at any bar height, which is why this is a margin and not a
     calc against a height that changes on a phone. */
  margin: 2px 0;
  min-height: 32px;
  padding: 0 12px;
  border: 0;
  background: none;
  font-size: .82rem;
  font-weight: 500;
  color: var(--ink-2);
  white-space: nowrap;
  cursor: pointer;
  transition: color .12s ease;
}
/* The bar is drawn on every item and coloured on one, so the active
   item is not 2px taller than its neighbour. -3px is the item's own
   2px of bottom slack plus the header's 1px border: the bar covers
   that border for the width of the item rather than sitting above it. */
.nav-i::after {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  bottom: -3px;
  height: 2px;
  background: transparent;
}
.nav-i[aria-current="page"] { color: var(--ink); }
.nav-i[aria-current="page"]::after { background: var(--accent); }
@media (hover: hover) {
  .nav-i:hover { color: var(--ink); }
}

/* Icons carry no attributes of their own — one class decides the size
   and the weight of every glyph in the app, so a new icon cannot
   arrive at a different stroke. */
.ic {
  width: 16px;
  height: 16px;
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.top-r {
  flex: 1 1 0;
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 10px;
}

.who {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 0;
}
.who-av {
  width: 30px;
  height: 30px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: var(--r-pill);
  background: color-mix(in srgb, var(--accent) 18%, transparent);
  color: var(--accent);
  font-size: .78rem;
  font-weight: 600;
}
.who-t {
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-width: 0;
  line-height: 1.25;
}
.who-t b {
  font-size: .78rem;
  color: var(--ink);
}
.who-t span {
  font-size: .66rem;
  color: var(--ink-2);
}
.who-t b, .who-t span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.add {
  width: 34px;
  height: 34px;
  flex: none;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: var(--r-pill);
  background: var(--accent);
  color: var(--accent-in);
  cursor: pointer;
  transition: filter .12s ease;
}
@media (hover: hover) {
  .add:hover { filter: brightness(1.08); }
}
.add:active { filter: brightness(.94); }

/* ── the frame under the header ── */

.body {
  flex: 1 1 auto;
  display: flex;
  min-height: 0;              /* without this the pane grows instead of scrolling */
}

.main {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
}

.pane {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  padding: 16px 18px 26px;
}

/* The reference is a 1512px window and says nothing about a 2560px
   one. Left alone, eight cards at auto-fill would spread to eight
   across and the strip's ring would end up a metre from its caption,
   so the content keeps a reading width and takes the middle. */
.pane > * {
  max-width: 1180px;
  margin-inline: auto;
}

/* The panel toggle. Far left, where a sidebar control belongs, and
   INSIDE .brand so the bar's two flex:1 halves stay equal and the nav
   keeps the true centre of the header rather than the centre of what is
   left after a button. */
.panel {
  flex: none;
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: var(--r-pill);
  background: var(--card);
  color: var(--ink-2);
  cursor: pointer;
  transition: color .12s ease, background .12s ease;
}
.panel[aria-expanded="false"] { background: none; color: var(--ink-3); }
@media (hover: hover) {
  .panel:hover { background: var(--card-2); color: var(--ink); }
}
.panel:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* Shut is display:none, not a width transition. Collapsing a flex child
   to zero animates on the wide layout and does nothing on the stacked
   one, so half the app would slide and half would blink — and the pane
   beside it reflows either way. */
[data-rail="shut"] .rail { display: none; }

/* ── rail ── */

.rail {
  flex: 0 0 320px;
  width: 320px;
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--surface);
  /* On the LEFT. What is due today is the thing you came to do, so it
     sits where reading starts rather than in the margin. */
  border-right: 1px solid var(--line);
}

.rail-head {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 10px;
  height: 48px;
  padding: 0 14px;
  border-bottom: 1px solid var(--line);
}
.rail-t {
  font-family: var(--mono);
  font-size: .62rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-2);
}
.rail-n {
  margin-left: auto;
  font-family: var(--mono);
  font-size: .72rem;
  color: var(--ink);
}

/* A row sliced in half by the panel below it reads as broken rather
   than as "there is more". The fade sits over the container's own
   bottom padding when the list fits, so it costs nothing until the list
   is actually longer than the space — which is the only time it is
   saying anything. */
.rail-list {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  mask-image: linear-gradient(to bottom, #000 calc(100% - 20px), transparent);
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 10px 12px;
}

.rail-sub {
  flex: 0 0 auto;
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 12px 14px 6px;
  border-top: 1px solid var(--line);
  font-family: var(--mono);
  font-size: .62rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-2);
}

/* The log gives way to the list rather than the other way round: what
   is still due is the reason the rail is there, and what is done is
   the receipt. */
.rail-log {
  flex: 0 1 auto;
  min-height: 0;
  max-height: 38%;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 0 14px 12px;
}

/* ── controls ──
   One height, 34px, for everything you can press outside a card, so a
   header row of them cannot come out ragged. */

.step {
  width: 34px;
  height: 34px;
  flex: none;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: var(--r-pill);
  background: var(--card);
  color: var(--ink-2);
  cursor: pointer;
  transition: background .12s ease, color .12s ease;
}
.step.wide {
  width: auto;
  min-width: 34px;
  padding: 0 12px;
  font-family: var(--mono);
  font-size: .62rem;
  letter-spacing: .1em;
  text-transform: uppercase;
}
@media (hover: hover) {
  .step:hover { background: var(--card-2); color: var(--ink); }
}

/* Month / Week / Day. One group, one border around the three, and the
   pressed one lifts a step and takes the accent under it — the same
   grammar as the nav, because it is the same idea. */
.seg {
  position: relative;
  display: flex;
  align-items: stretch;
  border-radius: var(--r-pill);
  background: var(--card);
}
/* The group's hairline is drawn OVER the members rather than as a
   border around them. A real border insets the buttons by 1px, and an
   inset child that carries the same 10px corner as its parent is a
   corner drawn twice — the geometry audit calls that out and it is
   right to. Clipping the group with overflow:hidden fixes the corner
   and then eats the focus ring of whichever member is focused, which
   is worse. */
.seg::after {
  content: '';
  position: absolute;
  inset: 0;
  border: 1px solid var(--line);
  border-radius: var(--r-pill);
  pointer-events: none;
}
.seg button {
  height: 34px;
  min-width: 54px;
  padding: 0 12px;
  border: 0;
  border-radius: 0;
  background: none;
  font-size: .72rem;
  font-weight: 500;
  color: var(--ink-2);
  cursor: pointer;
  transition: background .12s ease, color .12s ease;
}
.seg button:first-child { border-radius: var(--r-pill) 0 0 var(--r-pill); }
.seg button:last-child  { border-radius: 0 var(--r-pill) var(--r-pill) 0; }
.seg button[aria-pressed="true"] {
  background: var(--card-2);
  color: var(--ink);
  box-shadow: inset 0 -2px 0 var(--accent);
}
@media (hover: hover) {
  .seg button:hover { color: var(--ink); }
}

.grow { flex: 1 1 auto; min-width: 0; }

/* ── narrow ──
   The rail leaves the row rather than shrinking. At 320px it is a
   column of rows; at 200px it is neither, and what it holds — what is
   still due today — is the last thing that should get squeezed. */

@media (max-width: 1080px) {
  .body {
    flex-direction: column;
    overflow-y: auto;
  }
  /* One scroller for the stack, not three nested ones. A pane that
     scrolls inside a page that scrolls means a flick either moves the
     grid or moves the rail, and you cannot tell which until it has
     already happened. */
  .main { flex: 0 0 auto; }
  .pane { overflow: visible; }
  .rail {
    /* Stacked, it goes back UNDER the cards. First in the DOM is right
       on a wide screen and wrong on a narrow one: a phone would make
       you scroll past the whole list to reach the grid it summarises. */
    order: 1;
    flex: 0 0 auto;
    width: auto;
    border-right: 0;
    border-top: 1px solid var(--line);
  }
  .rail-list, .rail-log {
    overflow: visible;
    max-height: none;
  }
}

@media (max-width: 700px) {
  .top {
    height: 52px;
    gap: 8px;
    padding: 0 12px;
  }
  /* The sub-label goes and the wordmark stays: the mark is the app,
     the label under it is decoration. The nav labels stay whatever
     happens — two icons alone would be a guess. */
  .brand {
    flex: 0 1 auto;
    font-size: .94rem;
  }
  .brand span { display: none; }
  .nav {
    flex: 1 1 auto;
    justify-content: center;
    min-width: 0;
  }
  .nav-i {
    padding: 0 10px;
    font-size: .78rem;
    gap: 6px;
  }
  .top-r { flex: 0 0 auto; }

  /* A finger is not a cursor. */
  .add, .step { width: 44px; height: 44px; }
  .step.wide { width: auto; min-width: 44px; padding: 0 14px; }
  .seg button { height: 44px; min-width: 60px; }

  .pane { padding: 12px 12px 22px; }
  .rail-head { padding: 0 12px; }
  .rail-list { padding: 10px 10px; }
  .rail-sub { padding-left: 12px; padding-right: 12px; }
  .rail-log { padding: 0 12px 12px; }
}

/* Under about 430px the bar cannot hold the name as well as the nav,
   and the nav is the only way off this screen. The avatar stays: it is
   the same 30px block and it still says whose day this is. */
@media (max-width: 430px) {
  .who-t { display: none; }
  .nav-i { padding: 0 8px; }
  .top { gap: 6px; }
}

/* Motion here is decoration on every element that has it — a colour
   fade, a ring filling. None of it carries meaning, so none of it is
   worth a headache. Animations are held to a tick rather than removed
   outright: an animation that ends visible must still be allowed to
   reach its end state. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition: none !important;
    animation-duration: .01ms !important;
    animation-delay: 0ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
  }
}

/* ══ THE MINI MONTH ═══════════════════════════════════════════════
   A month at a glance at the top of the rail, and a way into the real
   calendar. It pages on its own arrows without leaving this screen —
   glancing at next month is not the same as going there. */

.jm {
  flex: 0 0 auto;
  padding: 12px;
  /* Under what is due, not over it. The month is for looking back; the
     list above it is the thing you opened the app to do. */
  border-top: 1px solid var(--line);
}

/* The head is one rounded bar with the arrows inside it rather than
   three separate controls: at this size three pills in a row read as a
   toolbar, and this is a label you can nudge. */
.jm-head {
  display: flex;
  align-items: center;
  gap: 2px;
  height: 34px;
  padding: 0 3px;
  margin-bottom: 6px;
  background: var(--card);
  border-radius: var(--r-pill);
}
.jm-t {
  flex: 1 1 auto;
  min-width: 0;
  height: 28px;
  border: 0;
  border-radius: var(--r-pill);
  background: none;
  color: var(--ink);
  font: inherit;
  font-size: .78rem;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.jm-arw {
  flex: none;
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: var(--r-pill);
  background: none;
  color: var(--ink-2);
  cursor: pointer;
}

.jm-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
}
.jm-w {
  height: 20px;
  display: grid;
  place-items: center;
  font-family: var(--mono);
  font-size: .54rem;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: var(--ink-3);
}

/* 32px, which is the floor for anything you press. The reference draws
   these smaller; a calendar you miss by 3px is not a calendar. */
.jm-d {
  position: relative;
  height: 32px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: var(--r-pill);
  background: none;
  color: var(--ink-2);
  font: inherit;
  font-size: .72rem;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
  transition: background .12s ease, color .12s ease;
}
/* Dimmed, not hidden. A month that starts mid-row with four blanks in
   front of it is harder to read than one that shows the days either
   side. */
.jm-d.out { opacity: .38; }
.jm-d.now {
  background: var(--accent);
  color: var(--accent-in);
  font-weight: 600;
}

/* The only mark on this grid says A RECORD EXISTS HERE — dim for a day
   with something on it, accent for a day where everything due was kept.
   Nothing marks a day you missed: a month grid stippled with failures
   is the thing that makes a person stop opening the app. */
.jm-dot {
  position: absolute;
  bottom: 3px;
  width: 4px;
  height: 4px;
  border-radius: var(--r-pill);
  background: var(--ink-3);
}
.jm-dot.full { background: var(--accent); }
.jm-d.now .jm-dot { background: var(--accent-in); }

@media (hover: hover) {
  .jm-arw:hover { color: var(--ink); background: var(--card-2); }
  .jm-t:hover { background: var(--card-2); }
  .jm-d:hover { background: var(--card-2); color: var(--ink); }
  .jm-d.now:hover { background: var(--accent); color: var(--accent-in); }
}
.jm-d:focus-visible,
.jm-t:focus-visible,
.jm-arw:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* Full width on a phone the grid would be seven 50px cells and a lot of
   air. It keeps the rail's reading width and centres. */
@media (max-width: 1080px) {
  .jm { max-width: 380px; margin: 0 auto; width: 100%; }
}

/* ══ TODAY ═══════════════════════════════════════════════════════
   The strip says how the day is going, the grid says what it is made
   of, and the rail says what is next. Every class here carries the
   jt- prefix; the rail's own frame (.rail, .rail-list, .rail-log) is
   chrome and is styled where it is defined, not here.
   ═══════════════════════════════════════════════════════════════ */

/* ── the strip ──
   HERO. The ring is the biggest thing on the screen and carries no
   card at all — a border around it would make it a tile like the rest,
   and the whole point is that this one is not.

   The row deliberately breaks the same-box rule the grid keeps: a
   ring, a headline and a list are three different kinds of thing and
   stacking them into three equal panels is exactly what made the old
   strip unreadable. See SPEC section 7 — this is the one carve-out,
   the way a folded panel is the carve-out in the house rules. */

.jt-strip {
  display: flex;
  align-items: center;
  gap: 30px;
  padding: 4px 2px 22px;
  margin-bottom: 16px;
  border-bottom: 1px solid var(--line);
}

/* Both lines are block children of a flex column, so both are the full
   width of the block: one left edge for the pair, whatever the date is
   that day. */
.jt-dayt {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.jt-dayt b {
  font-size: 1.5rem;
  font-weight: 600;
  letter-spacing: -.015em;
  line-height: 1.15;
  color: var(--ink);
}
.jt-dayt span {
  font-size: .88rem;
  color: var(--ink-3);
}

/* The three figures are a LIST, not a row of tiles. A tile the same
   shape as the day's would put us straight back to four of the same
   thing. The value column is a fixed width so the three labels share
   one left edge — at their own widths they would land 3 and 5px apart,
   which reads as a miss rather than a decision. */
.jt-figs {
  flex: none;
  width: 290px;
  margin: 0;
  padding: 0;
  list-style: none;
  border-top: 1px solid var(--line);
}
.jt-figs li {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 11px 2px;
  border-bottom: 1px solid var(--line);
}
.jt-figs b {
  width: 62px;
  flex: none;
  font-size: 1.12rem;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}
.jt-figs span {
  font-size: .76rem;
  color: var(--ink-3);
}

/* ── rings ──
   One geometry, two sizes, and the dash pattern is the whole trick:
   the dasharray is the circumference, so the offset IS the unfilled
   remainder and a transition on it fills the arc.

   The circle is turned -90deg so zero is twelve o'clock rather than
   three. The pre-paint values leave it empty on purpose — set from the
   script it winds UP to its reading, where an unset offset would draw
   a full ring at parse time and unwind it, which reads as the day
   emptying out. */

.jt-ring {
  position: relative;
  flex: none;
  width: 72px;
  height: 72px;
}
/* Direct child only. Descendant would also catch the check glyph in
   the centre and blow a 16px icon up to the width of the ring. */
.jt-ring > svg { width: 100%; height: 100%; }

.jt-track,
.jt-prog { fill: none; stroke-width: 6; }
.jt-track { stroke: var(--track); }

.jt-prog {
  /* No --jt-c outside a card, so the day ring takes the accent: the
     one figure on the screen that is about the day and not a habit. */
  stroke: var(--jt-c, var(--accent));
  stroke-linecap: round;
  stroke-dasharray: 400;
  stroke-dashoffset: 400;
  transform: rotate(-90deg);
  transform-origin: 50% 50%;
  transition: stroke-dashoffset .5s cubic-bezier(.22, .75, .3, 1);
}

/* Both centres sit in the same box so swapping the number for the
   check cannot move anything. text-align keeps the audit off a left
   edge nobody chose — a centred line starts wherever its text ends. */
.jt-ringn,
.jt-tk {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  text-align: center;
  font-family: var(--mono);
  font-size: .82rem;
  color: var(--ink);
}
.jt-tk { color: var(--jt-c, var(--accent)); }

.jt-ring-lg { width: 132px; height: 132px; }
/* 10 device px. The viewBox is 120 units drawn at 132, so a user unit
   is 132/120 of a pixel and a stroke has to be written in the units
   the path it belongs to is drawn in. */
.jt-ring-lg .jt-track,
.jt-ring-lg .jt-prog { stroke-width: 9.09; }
.jt-ring-lg .jt-ringn { font-size: 1.32rem; }

/* ── the grid ──
   auto-fill rather than auto-fit: eight cards on a wide screen keep a
   card's width instead of stretching to fill the row. 1fr rows and
   stretched children mean every card on a row is the same box. */

.jt-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  grid-auto-rows: 1fr;
  align-items: stretch;
  gap: 12px;
}

.jt-card {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: var(--r-card);
  background: var(--card);
  color: var(--ink);
  text-align: left;
  cursor: pointer;
  transition: border-color .16s ease, box-shadow .22s ease;
}

/* Kept today, and that is the only thing that lights a card up. The
   reference has exactly one hot card in its grid; here what makes one
   hot is that you did it. Nothing on this screen is ever coloured for
   a miss — a wash of red across a bad week is a judgement about her,
   and a judgement is what makes a person stop opening the app. */
.jt-card[aria-pressed="true"] {
  border-color: color-mix(in srgb, var(--jt-c) 45%, transparent);
  background:
    radial-gradient(96% 74% at 24% 0%,
      color-mix(in srgb, var(--jt-c) 13%, transparent), transparent 68%),
    var(--card);
  /* The glow is a shadow and not a bled-out pseudo element: a box that
     paints past its own edges counts toward the scroll width of the
     pane it sits in, and the pane would grow a horizontal bar the
     first time anything was ticked. A shadow is ink only. */
  box-shadow:
    0 6px 30px -6px color-mix(in srgb, var(--jt-c) 40%, transparent),
    0 0 0 1px color-mix(in srgb, var(--jt-c) 12%, transparent);
}

@media (hover: hover) {
  .jt-card:hover { border-color: var(--line-2); }
  .jt-card[aria-pressed="true"]:hover {
    border-color: color-mix(in srgb, var(--jt-c) 64%, transparent);
  }
}

.jt-t {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}
.jt-nm {
  font-size: .92rem;
  font-weight: 600;
  color: var(--ink);
}
.jt-goal {
  font-size: .72rem;
  color: var(--ink-3);
}

.jt-chip {
  align-self: flex-start;
  justify-self: start;        /* the grid layout below; ignored in flex */
  /* Pinned to the bottom of the card, so a name that wraps to two
     lines on one card cannot push its chip off the line every other
     chip on the row sits on. */
  margin-top: auto;
  height: 18px;
  display: inline-flex;
  align-items: center;
  padding: 0 9px;
  /* 10px, not 999. A radius clamps to half the height, so 10 on an
     18px chip draws the same pill — and a child rounder than the 12px
     card it sits inside is a fault the geometry audit reports. */
  border: 1px solid var(--jt-c);
  border-radius: var(--r-pill);
  background: none;
  font-family: var(--mono);
  font-size: .58rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--jt-c);
  white-space: nowrap;
}

/* ── rail rows ──
   The rail is chrome. What goes in it belongs to this screen, so the
   rows are jt-. Each row is one button: a tick control nested inside
   a row that is itself a button would be a button inside a button,
   which is invalid and unreachable by keyboard either way. */

.jt-r {
  display: grid;
  grid-template-columns: 22px minmax(0, 1fr) auto 22px;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 40px;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: var(--r-pill);
  background: var(--card);
  color: var(--ink);
  text-align: left;
  cursor: pointer;
  transition: background-color .14s ease, border-color .14s ease;
}

/* Solid, not tinted: every habit colour clears 4.5:1 against --bg, so
   the initial is legible on all eight, and a solid disc says WHICH
   habit from across the room. */
.jt-r-av {
  width: 22px;
  height: 22px;
  display: grid;
  place-items: center;
  border-radius: var(--r-pill);
  background: var(--jt-c);
  color: var(--bg);
  font-size: .62rem;
  font-weight: 700;
}

.jt-r-nm {
  min-width: 0;
  font-size: .78rem;
  color: var(--ink);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* --ink-2, not the --ink-3 a time usually takes: the rail is sorted by
   this figure and it is half of what a row says. Quiet is not the same
   as unreadable. */
.jt-r-at {
  font-family: var(--mono);
  font-size: .62rem;
  letter-spacing: .06em;
  color: var(--ink-2);
  white-space: nowrap;
}

.jt-r-tk {
  width: 22px;
  height: 22px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line-2);
  border-radius: var(--r-pill);
  color: var(--bg);
}
.jt-r[aria-pressed="true"] .jt-r-tk {
  border-color: var(--jt-c);
  background: var(--jt-c);
}
/* The glyph is always in the box and only ever fades: hiding it would
   let the row's four columns settle at two different widths depending
   on whether it was kept. */
.jt-r[aria-pressed="false"] .jt-r-tk svg { opacity: 0; }

@media (hover: hover) {
  .jt-r:hover { border-color: var(--line-2); background: var(--card-2); }
}

/* One row is yours and it is the next thing the day is waiting on —
   the reference's single orange row. Nothing else in the rail takes
   the accent, or it would stop meaning "this one". The avatar keeps
   its habit colour even here: orange says WHEN, colour says WHICH. */
.jt-r[data-next] {
  border-color: var(--accent);
  background: var(--accent);
  color: var(--accent-in);
}
.jt-r[data-next] .jt-r-nm,
.jt-r[data-next] .jt-r-at { color: var(--accent-in); }
.jt-r[data-next] .jt-r-tk {
  border-color: color-mix(in srgb, var(--accent-in) 62%, transparent);
}
@media (hover: hover) {
  .jt-r[data-next]:hover {
    border-color: var(--accent);
    background: var(--accent);
    filter: brightness(1.06);
  }
}

/* ── lines ──
   Today's line is a labelled field on an accent rule, not a pill with a
   send button: a pill and a round button is a chat composer, which is
   exactly what it was being read as. Under it, every line before it. */

.jt-linew {
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 3px 8px;
  padding: 9px 14px 11px 12px;
  box-shadow: inset 2px 0 0 var(--accent);
}
.jt-linew:focus-within { background: var(--card); }
/* The input carries no ring of its own, so the row wears it — an
   outline on a borderless field inside a panel reads as a box that
   appeared from nowhere. */
.jt-linew:focus-within { outline: 2px solid var(--focus); outline-offset: -2px; }
.jt-linew-k {
  font-family: var(--mono);
  font-size: .52rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--accent);
}
.jt-saved {
  font-family: var(--mono);
  font-size: .52rem;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--accent);
  opacity: 0;
  transition: opacity .18s ease;
}
.jt-saved.on { opacity: 1; }
.jt-linei {
  grid-column: 1 / -1;
  width: 100%;
  min-width: 0;
  padding: 0;
  border: 0;
  background: none;
  color: var(--ink);
  font: inherit;
  font-size: .82rem;
}
.jt-linei::placeholder { color: var(--ink-3); }
.jt-linei:focus { outline: none; }

.jt-lines { gap: 0; }
.jt-ln { padding: 9px 0 10px; border-top: 1px solid var(--line); }
.jt-ln b {
  display: block;
  margin-bottom: 3px;
  font-family: var(--mono);
  font-size: .52rem;
  font-weight: 400;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.jt-ln p {
  margin: 0;
  font-size: .8rem;
  line-height: 1.35;
  color: var(--ink-2);
}

.jt-none {
  padding: 6px 2px;
  font-size: .72rem;
  color: var(--ink-3);
}

/* ── narrow ── */

/* The day pill takes the whole row before the three stat pills get
   squeezed: 116px of ring plus a long date does not fit in two fifths
   of a phone, and the three figures beside it are single numbers that
   do. */
@media (max-width: 860px) {
  /* The list goes full width and falls under the ring and the date,
     which stay on one line together — the day is still the headline at
     any width. */
  .jt-strip { flex-wrap: wrap; gap: 20px; }
  .jt-figs { width: 100%; }
}

/* A finger is not a cursor. */
@media (max-width: 700px) {
  .jt-r { min-height: 44px; }
}

/* One column wide, a ring with the name stacked under it leaves half
   of every card empty and puts eight of them two screens apart. The
   same three parts, laid across instead of down: the ring keeps its
   size, and the name and the chip share the column beside it. */
@media (max-width: 520px) {
  .jt-card {
    display: grid;
    grid-template-columns: 72px minmax(0, 1fr);
    align-items: center;
    column-gap: 12px;
    row-gap: 6px;
  }
  .jt-ring { grid-row: 1 / span 2; }
  .jt-chip { margin-top: 0; }
}

/* The ring filling is decoration, and it is the one animation here
   that runs on load rather than on a press — so it is named locally
   as well as caught by the blanket rule, where a later edit to either
   can be read against the other. */
@media (prefers-reduced-motion: reduce) {
  .jt-prog,
  .jt-card,
  .jt-r,
  .jt-saved { transition: none; }
}

/* ══ THE CALENDAR ═════════════════════════════════════════════════
   Month, week and day. The week is the real thing — an hour grid with
   the habits sitting on it at the time they happen — because "read at
   nine" is a different commitment from "read at some point", and a
   tracker that only knows the day cannot tell you which one you keep. */

/* The calendar's pane is a column and does not scroll itself: the grid
   fills it and the scrolling happens inside .jc-body, so paging a month
   cannot move the page under you. Scoped with :has rather than by
   restyling .pane, which the today screen also uses as a plain
   scroller. */
.pane:has(> .jc-head) {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
/* .pane > * carries margin-inline:auto for the 1180px reading width.
   In a flex column an auto cross-axis margin shrinks the item to its
   content, which collapsed the header onto its own buttons — so the
   width is stated and the auto margins resolve to nothing. */
.pane:has(> .jc-head) > * { width: 100%; }

.jc-head {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 0 12px;
}
.jc-title {
  margin: 0 0 0 6px;
  font-size: .96rem;
  font-weight: 600;
  color: var(--ink);
  white-space: nowrap;
}
.jc-body {
  flex: 1 1 auto;
  min-height: 0;
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: var(--r-card);
  background: var(--card);
}

/* ── month ───────────────────────────────────────────────────────
   Six rows always, even in a month that fits in five. A grid that
   changes height as you page through the year makes every click feel
   like it moved something. */
.jc-month {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  grid-template-rows: auto repeat(6, minmax(84px, 1fr));
  min-height: 100%;
}
.jc-wd {
  height: 30px;
  display: grid;
  place-items: center;
  border-bottom: 1px solid var(--line);
  font-family: var(--mono);
  font-size: .58rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.jc-cell {
  display: flex;
  flex-direction: column;
  gap: 7px;
  min-width: 0;
  padding: 6px 7px 8px;
  border: 0;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  background: none;
  text-align: left;
  cursor: pointer;
  font: inherit;
}
.jc-cell:nth-child(7n + 7) { border-right: 0; }
.jc-cell.out { opacity: .4; }
.jc-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  width: 100%;
}
.jc-num {
  min-width: 22px;
  height: 22px;
  padding: 0 6px;
  display: grid;
  place-items: center;
  border-radius: var(--r-pill);
  font-size: .72rem;
  font-variant-numeric: tabular-nums;
  color: var(--ink-2);
}
.jc-cell.now .jc-num {
  background: var(--accent);
  color: var(--accent-in);
  font-weight: 600;
}
.jc-sc {
  font-family: var(--mono);
  font-size: .56rem;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}

/* One pip per habit that was kept or was due. Filled took it, hollow
   did not — and hollow keeps the habit's own colour rather than turning
   into a warning, because the colour says WHICH, never whether. */
.jc-dots { display: flex; flex-wrap: wrap; gap: 4px; align-content: flex-start; }
.jc-pip {
  width: 11px;
  height: 11px;
  border: 1px solid var(--jc-c);
  border-radius: var(--r-pill);
  opacity: .5;
}
.jc-pip.on { background: var(--jc-c); opacity: 1; }

/* A chip is one habit in the all-day band. Filled means kept, a border
   means due and not kept, and there is no third state that means missed
   — hollow already says it without saying it about you. */
.jc-chip {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  height: 20px;
  padding: 0 8px;
  border: 1px solid transparent;
  border-radius: var(--r-pill);
  background: none;
  color: var(--ink-2);
  font: inherit;
  font-size: .62rem;
  text-align: left;
  cursor: pointer;
}
.jc-chip .jc-dot {
  flex: none;
  width: 6px;
  height: 6px;
  border-radius: var(--r-pill);
  background: var(--jc-c);
}
.jc-chip span {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.jc-chip.on {
  background: color-mix(in srgb, var(--jc-c) 18%, transparent);
  color: var(--jc-c);
}
.jc-chip.due { border-color: var(--line-2); }

/* ── week and day ────────────────────────────────────────────────
   One grid: a gutter, then n day columns. Three rows — the day heads,
   the all-day band, and the hours. */
.jc-grid {
  display: grid;
  grid-template-rows: auto auto 1fr;
  min-width: 100%;
}
.jc-dh {
  position: sticky;
  top: 0;
  z-index: 3;
  height: 46px;
  display: grid;
  place-items: center;
  gap: 1px;
  border-bottom: 1px solid var(--line);
  border-right: 1px solid var(--line);
  background: var(--card);
}
.jc-dh:last-child { border-right: 0; }
.jc-dh b { font-size: .82rem; font-weight: 600; color: var(--ink); }
.jc-dh span {
  font-family: var(--mono);
  font-size: .54rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.jc-dh.now b, .jc-dh.now span { color: var(--accent); }

/* The gutter is sticky sideways so the hours stay readable when a week
   is wider than the pane and you scroll it. */
.jc-gut {
  position: sticky;
  left: 0;
  z-index: 4;
  border-right: 1px solid var(--line);
  background: var(--card);
}
.jc-corner {
  position: sticky;
  left: 0;
  top: 0;
  z-index: 5;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  background: var(--card);
}
.jc-adl {
  position: sticky;
  left: 0;
  z-index: 4;
  display: grid;
  place-items: center end;
  padding-right: 8px;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  background: var(--card);
  font-family: var(--mono);
  font-size: .52rem;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.jc-ad {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
  padding: 4px;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.jc-ad:last-child { border-right: 0; }

.jc-hr {
  height: 44px;
  padding-right: 8px;
  text-align: right;
  font-family: var(--mono);
  font-size: .56rem;
  color: var(--ink-3);
  /* Lifted half a line so the label sits ON its rule rather than in the
     box under it, which is where an hour label means the hour. */
  transform: translateY(-6px);
}
