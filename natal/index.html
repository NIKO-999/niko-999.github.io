<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1e2c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Natal" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="description" content="Natal birth chart: planets, houses, aspects, nodes and karmic astrology." />
  <title>Natal · Birth Chart</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Symbols:wght@400;500&family=Noto+Sans+Symbols+2&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- cosmic backdrop -->
  <div class="sky" aria-hidden="true">
    <canvas id="stars"></canvas>
    <div class="nebula"></div>
    <svg width="0" height="0" style="position:absolute">
      <defs>
        <!-- horizon planet and atmosphere -->
        <radialGradient id="hz-glow" cx="520" cy="520" r="520" gradientUnits="userSpaceOnUse">
          <stop offset=".846" stop-color="#9e2c12"/><stop offset=".851" stop-color="#d84a1c"/><stop offset=".858" stop-color="#f06a27"/>
          <stop offset=".868" stop-color="#f58d3c"/><stop offset=".882" stop-color="#f4a95e" stop-opacity=".9"/>
          <stop offset=".902" stop-color="#e9b98e" stop-opacity=".55"/><stop offset=".93" stop-color="#9fb4c2" stop-opacity=".22"/>
          <stop offset=".97" stop-color="#6f93ab" stop-opacity=".06"/><stop offset="1" stop-color="#6f93ab" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="hz-body" cx="520" cy="520" r="440" gradientUnits="userSpaceOnUse">
          <stop offset=".78" stop-color="#2a3039"/><stop offset=".9" stop-color="#30313a"/><stop offset=".955" stop-color="#3f3632"/><stop offset=".985" stop-color="#6a4028"/><stop offset="1" stop-color="#9a4a22"/>
        </radialGradient>
        <filter id="hz-tex" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="4" seed="3" result="n"/>
          <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.16  0 0 0 0 0.13  0 0 0 0 0.12  0 0 0 0.9 -0.4"/>
          <feComposite in2="SourceGraphic" operator="in"/>
        </filter>
      </defs>
    </svg>

    <div class="horizon-haze"></div>
    <div class="horizon">
      <svg viewBox="0 0 1040 1040">
        <circle cx="520" cy="520" r="520" fill="url(#hz-glow)"/>
        <circle cx="520" cy="520" r="440" fill="url(#hz-body)"/>
        <circle cx="520" cy="520" r="440" fill="#000" filter="url(#hz-tex)" opacity=".3"/>
        <circle cx="520" cy="520" r="440" fill="none" stroke="#ff8a3d" stroke-opacity=".55" stroke-width=".6"/>
      </svg>
    </div>

    <div class="horizon-mist"></div>

    <div class="planet planet-giant"></div>
    <div class="planet planet-moon"></div>
    <div class="planet planet-far"></div>
  </div>

  <div class="app">
    <header class="topbar">
      <button class="icon-btn" id="btn-settings" aria-label="Chart settings">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 8h16M4 16h16"/><circle cx="15" cy="8" r="2.2" fill="var(--bg-deep)"/><circle cx="9" cy="16" r="2.2" fill="var(--bg-deep)"/></svg>
      </button>
      <nav class="tabs" id="tabs" role="tablist">
        <button role="tab" data-tab="chart">Chart</button>
        <button role="tab" data-tab="today">Today</button>
        <button role="tab" data-tab="planets">Planets</button>
        <button role="tab" data-tab="houses">Houses</button>
        <button role="tab" data-tab="aspects">Aspects</button>
        <button role="tab" data-tab="karmic">Karmic</button>
      </nav>
      <button class="icon-btn" id="btn-new" aria-label="New chart">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg>
      </button>
    </header>

    <main id="view" class="view"></main>
  </div>

  <!-- bottom sheet for details -->
  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <section class="sheet" id="sheet" aria-modal="true" role="dialog" hidden>
    <div class="sheet-sky" aria-hidden="true"><div class="planet planet-sheet"><div class="body"></div></div></div>
    <div class="sheet-grip"></div>
    <div class="sheet-body" id="sheet-body"></div>
  </section>

  <script src="vendor/astronomy.browser.min.js"></script>
  <script src="js/chiron-data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/content.js"></script>
  <script src="js/deep-big-three.js"></script>
  <script src="js/deep-planet-signs-1.js"></script>
  <script src="js/deep-planet-signs-2.js"></script>
  <script src="js/deep-houses-1.js"></script>
  <script src="js/deep-houses-2.js"></script>
  <script src="js/deep-aspects-1.js"></script>
  <script src="js/deep-aspects-2.js"></script>
  <script src="js/deep-signs.js"></script>
  <script src="js/deep-houses-axes.js"></script>
  <script src="js/deep-extra.js"></script>
  <script src="js/deep-transits.js"></script>
  <script src="js/deep-transit-houses.js"></script>
  <script src="js/cities.js"></script>
  <script src="js/wheel.js"></script>
  <script src="js/sky.js"></script>
  <script src="js/planets.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
