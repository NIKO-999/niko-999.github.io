<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Arc lab — vision</title>
<style>
@font-face{font-family:'Inter';font-weight:400;font-display:swap;src:url('fonts/Inter-400.woff2') format('woff2')}
@font-face{font-family:'Inter';font-weight:500;font-display:swap;src:url('fonts/Inter-500.woff2') format('woff2')}
@font-face{font-family:'Inter';font-weight:600;font-display:swap;src:url('fonts/Inter-600.woff2') format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:400;font-display:swap;src:url('fonts/JetBrainsMono-400.woff2') format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:500;font-display:swap;src:url('fonts/JetBrainsMono-500.woff2') format('woff2')}
@font-face{font-family:'Archivo';font-weight:300;font-display:swap;src:url('fonts/Archivo-300.woff2') format('woff2')}
:root{
  --ink:#f2f1ef;--ink-2:#b0aca6;--ink-3:#9c9893;
  --panel:#1b1d1f;--line:rgba(255,255,255,.06);--rule:rgba(255,255,255,.035);
  --in:rgba(0,0,0,.34);--in2:rgba(0,0,0,.44);
  --accent:#9fb4be;
  --sans:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;--display:'Archivo',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;padding:26px 40px 80px;background:#0b0c0d;color:var(--ink);font:400 16px/1.45 var(--sans)}
h2{font-size:14px;font-weight:600;margin:38px 0 4px}
h2 b{color:var(--accent)}
p.note{margin:0 0 12px;font-size:12.5px;color:var(--ink-3);max-width:900px}
.panel{width:1080px;border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}
.head{display:flex;align-items:center;gap:20px;padding:16px 20px 12px}
.head h1{margin:0;font-family:var(--display);font-weight:300;font-size:1.5rem;letter-spacing:-.005em}
.grow{flex:1}
.meta{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)}
.body{padding:6px 20px 22px}
.art{background:radial-gradient(80% 60% at var(--l,30%) 20%,rgba(255,255,255,.10),transparent 70%),
 linear-gradient(var(--a,150deg),#6d675f,#0e1113)}
.chip{font-family:var(--mono);font-size:.6rem;letter-spacing:.02em;text-transform:uppercase;
 padding:3px 7px;border-radius:5px;background:var(--in2);color:var(--ink-2)}
.chip.live{background:#2d5160;color:#dbe7ec}

/* ── A. HORIZON — bands by how far away it is ── */
.hz-band{margin-bottom:18px}
.hz-h{display:flex;align-items:baseline;gap:10px;margin:0 0 8px}
.hz-h span:first-child{font-family:var(--mono);font-size:.66rem;text-transform:uppercase;
 letter-spacing:.1em;color:var(--ink-2)}
.hz-h i{flex:1;height:1px;background:var(--rule);font-style:normal}
.hz-h em{font-family:var(--mono);font-size:.62rem;color:var(--ink-3);font-style:normal}
.hz-row{display:flex;gap:10px}
.hz-t{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--in);overflow:hidden}
.hz-t .art{height:58px}
.hz-t .tx{padding:8px 10px 10px}
.hz-t b{display:block;font-size:.82rem;font-weight:600;letter-spacing:-.015em;white-space:nowrap;
 overflow:hidden;text-overflow:ellipsis}
.hz-t span{display:block;margin-top:3px;font-family:var(--mono);font-size:.6rem;color:var(--ink-3)}
.hz-far .hz-t{background:none;border-style:dashed;opacity:.72}
.hz-far .art{height:32px;filter:grayscale(.5)}

/* ── B. WALL — photographs edge to edge, text on the image ── */
.wall{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:104px;gap:6px}
.w-t{position:relative;overflow:hidden;border-radius:8px}
.w-t .art{position:absolute;inset:0}
.w-t::after{content:'';position:absolute;inset:0;
 background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.72))}
.w-t .tx{position:absolute;left:10px;right:10px;bottom:8px;z-index:1}
.w-t b{display:block;font-size:.84rem;font-weight:600;letter-spacing:-.015em}
.w-t span{font-family:var(--mono);font-size:.6rem;color:#c9c6c1}
.w-big{grid-column:span 2;grid-row:span 2}
.w-wide{grid-column:span 2}
.w-t.dim .art{filter:grayscale(.72) brightness(.6)}

/* ── C. ORBIT — distance from the centre is distance in time ── */
.orbit{position:relative;height:380px}
.ring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
 border:1px dashed var(--rule);border-radius:50%}
.ring b{position:absolute;left:50%;top:0;transform:translate(-50%,-50%);
 background:var(--panel);padding:0 8px;font-family:var(--mono);font-size:.58rem;
 text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);font-weight:400}
.core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
 width:74px;height:74px;border-radius:50%;display:grid;place-items:center;text-align:center;
 background:var(--in2);border:1px solid var(--line)}
.core span{font-family:var(--mono);font-size:.58rem;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-2)}
.o-t{position:absolute;transform:translate(-50%,-50%);width:118px;text-align:center}
.o-t .art{width:52px;height:52px;border-radius:50%;margin:0 auto 6px;
 box-shadow:0 0 0 1px var(--line)}
.o-t b{display:block;font-size:.74rem;font-weight:500;letter-spacing:-.01em}
.o-t.live .art{box-shadow:0 0 0 1px var(--accent),0 0 14px color-mix(in srgb,var(--accent) 45%,transparent)}
.o-t.far .art{filter:grayscale(.6);opacity:.6}
.o-t.far b{color:var(--ink-3)}

/* ── D. ALLOCATION — four columns; the empty one is the finding ── */
.alloc{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.col-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px;
 padding-bottom:6px;border-bottom:1px solid var(--rule)}
.col-h b{font-family:var(--mono);font-size:.64rem;text-transform:uppercase;letter-spacing:.1em;
 font-weight:400;color:var(--ink-2)}
.col-h em{font-family:var(--mono);font-size:.64rem;font-style:normal;color:var(--ink-3)}
.a-t{border:1px solid var(--line);border-radius:9px;background:var(--in);overflow:hidden;margin-bottom:8px}
.a-t .art{height:44px}
.a-t .tx{padding:7px 9px 9px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.a-t b{font-size:.78rem;font-weight:600;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;
 text-overflow:ellipsis}
.empty{border:1px dashed var(--line);border-radius:9px;padding:20px 10px;text-align:center;
 font-family:var(--mono);font-size:.6rem;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em}
</style>
</head>
<body><div id="mk"></div>
<script>
const T=[
 {n:'Trading game', s:'live',    d:'Day 12 of 45', h:0, area:'Money'},
 {n:'Gene Keys',    s:'live',    d:'Day 30 of 90', h:0, area:'Meaning'},
 {n:'Arc',          s:'live',    d:'Day 3 of 21',  h:0, area:'Money'},
 {n:'Rebuild site', s:'someday', d:'This year',    h:1, area:'Money'},
 {n:'Learn piano',  s:'someday', d:'This year',    h:1, area:'Mind'},
 {n:'Long walk',    s:'someday', d:'Someday',      h:2, area:'Meaning'},
 {n:'Sabbatical',   s:'someday', d:'Someday',      h:2, area:'Meaning'},
 {n:'Sub-3 marathon',s:'someday',d:'Someday',      h:2, area:'Body'},
];
const art=i=>`--a:${118+i*17}deg;--l:${18+i*9}%`;
const bright=i=>`filter:brightness(${(.72+i*.055).toFixed(2)})`;

/* A — horizon */
const BANDS=[['Now','live, dated',0],['This year','chosen, not started',1],['Someday','no date, and that is fine',2]];
const horizon=()=>BANDS.map(([t,sub,h])=>{
  const items=T.filter(x=>x.h===h);
  return `<div class="hz-band ${h===2?'hz-far':''}">
    <div class="hz-h"><span>${t}</span><i></i><em>${items.length}</em></div>
    <div class="hz-row">${items.map((x,i)=>`<div class="hz-t">
      <div class="art" style="${art(i+h*3)};${bright(i+h)}"></div>
      <div class="tx"><b>${x.n}</b><span>${x.d}</span></div></div>`).join('')}</div></div>`;}).join('');

/* B — wall */
const SPAN=['w-big','','','w-wide','','','',''];
const wall=()=>`<div class="wall">${T.map((x,i)=>`<div class="w-t ${SPAN[i]} ${x.s==='someday'?'dim':''}">
  <div class="art" style="${art(i)};${bright(i)}"></div>
  <div class="tx"><b>${x.n}</b><span>${x.d}</span></div></div>`).join('')}</div>`;

/* C — orbit */
const orbit=()=>{
  const rings=[[118,'3 months'],[210,'this year'],[318,'someday']];
  let h=`<div class="orbit">`;
  rings.forEach(([r,l])=>h+=`<div class="ring" style="width:${r*2}px;height:${r*2}px"><b>${l}</b></div>`);
  h+=`<div class="core"><span>Now</span></div>`;
  const byH=[T.filter(x=>x.h===0),T.filter(x=>x.h===1),T.filter(x=>x.h===2)];
  byH.forEach((items,ri)=>{const r=rings[ri][0];
    items.forEach((x,i)=>{const a=(-Math.PI/2)+((i+.5)/items.length)*Math.PI*2*(ri===0?.55:1)+(ri*0.5);
      const cx=50+Math.cos(a)*r/10.8, cy=50+Math.sin(a)*r/3.8;
      h+=`<div class="o-t ${x.s==='live'?'live':''} ${ri===2?'far':''}" style="left:${cx}%;top:${cy}%">
        <div class="art" style="${art(i+ri*3)};${bright(i+ri)}"></div><b>${x.n}</b></div>`;});});
  return h+`</div>`;};

/* D — allocation */
const AREAS=['Mind','Money','Body','Meaning'];
const alloc=()=>`<div class="alloc">${AREAS.map(a=>{
  const items=T.filter(x=>x.area===a);
  return `<div><div class="col-h"><b>${a}</b><em>${items.length}</em></div>
   ${items.length?items.map((x,i)=>`<div class="a-t"><div class="art" style="${art(i)};${bright(i)}"></div>
     <div class="tx"><b>${x.n}</b><span class="chip ${x.s==='live'?'live':''}">${x.s==='live'?'live':'someday'}</span></div></div>`).join('')
   :'<div class="empty">nothing here</div>'}</div>`;}).join('')}</div>`;

const V=[
 ['A','Horizon','Bands by how far away a thing is: Now, This year, Someday. The further down, the fainter and smaller the tiles — someday items are visibly someday rather than sitting at the same weight as live work. Directly encodes the mid-term / long-term split you described.'],
 ['B','Wall','Photographs edge to edge, names on the image, sizes varied. This is the only one that looks like an actual vision board rather than a project tool — and dead ones desaturate, so live work is the colour in the room.'],
 ['C','Orbit','Distance from the centre is distance in time. Live work sits close and lit; someday drifts out to the faint ring. Spatial rather than listed — you feel the horizon instead of reading it.'],
 ['D','Allocation','Four columns for the life areas routine/ already uses. The finding is the empty column: three projects in Money, one in Mind, nothing in Body. Answers "am I on the right things" structurally rather than by feel.'],
];
document.getElementById('mk').innerHTML=V.map(([v,name,note],i)=>`
 <h2>${v} — <b>${name}</b></h2><p class="note">${note}</p>
 <div class="panel"><div class="head"><h1>Vision</h1><span class="grow"></span>
   <span class="meta">${v==='D'?'4 areas':'3 live · 5 someday'}</span></div>
   <div class="body">${[horizon,wall,orbit,alloc][i]()}</div></div>`).join('');
</script>
</body></html>
