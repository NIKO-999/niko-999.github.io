<!doctype html>
<html lang="en" data-view="open">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0A08">
<title>Alignment</title>
<link rel="preload" href="../arc/fonts/Inter.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: 'Inter'; font-weight: 100 900; font-display: swap;
  src: url('../arc/fonts/Inter.woff2') format('woff2'); }

/*
  ALIGNMENT. Its own ground, its own type, its own everything — it reads
  none of the other keys and takes none of the shared shell.

  THE FOURTEEN PHOTOGRAPHS WENT WITH THE STORIES. Every screen was a
  picture in a frame with the interface living in the material around
  it, under a per-image brightness beneath one shared grade — measured,
  the set spanned 235 degrees of hue, and no single transfer function
  pulls a mixed library into one family. There is no image in this app
  now, so the grade token, the brightness token and both rules that
  read them are gone rather than left to cascade at nothing.
*/

:root {
  --paper: #0B0A08;
  --ink: #FFFFFF;
  --dim: rgba(255,255,255,.72);
  --spent: rgba(255,255,255,.46);
  --hair: rgba(255,255,255,.14);
  --glass: rgba(255,255,255,.10);

  /* Chrome sits on a PLATE, not on glass. A 10% white wash over a lit
     photograph put the info glyph at 2.50:1 against the 3 a graphic
     needs. The photographs have gone and the plate stays, because a
     control is still told from the page by its own ground. */
  --plate: rgba(11,10,8,.56);

  --card: #1A1611;
  --card-edge: rgba(255,255,255,.08);

  --r-card: 26px;
  --r-in: 18px;
  --r-sq: 14px;
  --r-pill: 999px;

  /* Six vertical steps. The first build shipped eleven — 8 10 12 14 18
     20 22 24 26 34 38 — which is this repo's own runaway-scale fault in
     a third dimension after thirty type sizes and thirteen leadings. */
  --v1: 6px;  --v2: 10px; --v3: 16px;
  --v4: 22px; --v5: 34px; --v6: 52px;

  --gut: 22px;
  --round: 40px;   /* drawn; the 44 it OWNS is the ::before square */
  --gut-list: 18px;
  --tap: 44px;

}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body { height: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: 'Inter', -apple-system, system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  overflow: hidden;
  overscroll-behavior: none;
}

button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
[hidden] { display: none !important; }

.al-disp   { font-size: 38px; font-weight: 450; line-height: 1.00; letter-spacing: -.03em; }
.al-disp-s { font-size: 28px; font-weight: 450; line-height: 1.02; letter-spacing: -.024em; }
.al-caps   { font-size: 10px; font-weight: 600; letter-spacing: .5em; text-transform: uppercase; color: var(--dim); }
.al-note   { font-size: 13px; font-weight: 450; line-height: 1.45; color: var(--dim); }

.al-view { position: relative; z-index: 1; height: 100%; display: none; flex-direction: column; }
.al-view.is-on { display: flex; }

#alOpen { justify-content: flex-end; padding: 0 var(--gut-list) var(--v5); }
#alOpen .al-mark { margin-bottom: var(--v3); }
.al-mark { display: flex; align-items: center; gap: 9px; }
.al-mark svg { width: 20px; height: 20px; display: block; }
.al-mark b { font-size: 13px; font-weight: 500; letter-spacing: 1.2em; text-transform: uppercase; }
#alOpen .al-disp { margin-bottom: var(--v2); max-width: 7.2em; }
#alOpen .al-note { margin-bottom: var(--v4); max-width: 20em; }

/* A PILL IS SIZED TO ITS CONTENT. Not one of the four reference pills
   spans the screen — they measure 217, 148, 187 and 134 CSS px, all
   43 to 50 tall. A full-bleed primary was the widest object on the
   open screen and read as a form submit. */
.al-pill {
  display: inline-flex; align-items: center; justify-content: center;
  align-self: flex-start;
  min-height: 48px; padding: 0 30px; border-radius: var(--r-pill);
  background: var(--ink); color: #14120E;
  font-size: 16px; font-weight: 500; letter-spacing: -.01em;
}

.al-head { padding: calc(var(--v4) + env(safe-area-inset-top, 0px)) var(--gut-list) var(--v3); display: flex; align-items: center; gap: 12px; flex: none; }
.al-head .al-disp-s { flex: 1; }
.al-head .al-count { flex: none; }

/* A COUNT IS A FIGURE, NOT A LABEL. It wore .al-caps, which is 10px at
   half an em of tracking — right for a word and wrong for a number:
   24 drew as "2 4", two digits with a space between them. It carries
   its own rule rather than overriding .al-caps, because the two are
   equal specificity and this repo has lost that race five times. */
.al-count { font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--dim); }

/* 44 OWNED, 40 DRAWN — and an inset cannot say that here. An
   absolutely positioned box resolves against its host's PADDING box,
   and .al-round carries a 1px border under a border-box reset, so its
   padding box is 38 and inset:-2px reached 42 rather than the 44 the
   declaration reads as. Two real controls sat under the floor and the
   arithmetic was invisible in the source. Centring an explicit --tap
   square is immune to the host's border, padding and drawn size alike,
   and it is what makes the token load-bearing rather than decorative. */
.al-round {
  width: var(--round); height: var(--round); flex: none; border-radius: var(--r-pill);
  background: var(--plate); border: 1px solid var(--hair);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  display: grid; place-items: center; position: relative;
}
.al-round::before {
  content: ''; position: absolute; top: 50%; left: 50%;
  width: var(--tap); height: var(--tap); transform: translate(-50%, -50%);
}
.al-round svg { width: 17px; height: 17px; display: block; }

.al-pane { flex: 1; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  padding: 0 var(--gut-list) calc(118px + env(safe-area-inset-bottom, 0px)); }
.al-pane::-webkit-scrollbar { display: none; }

/* A MASK, NEVER A GRADIENT LAID OVER THE CONTENT. It was written when
   the ground was a photograph and a --paper overlay was a near-match
   that read as a smudge somewhere on the set; over one flat ground a
   gradient would do, and a mask is still the version with no colour
   to get wrong. Off again at the end of the travel: a
   soft edge over nothing is the same lie in the other direction. */
.al-pane { -webkit-mask-image: linear-gradient(180deg, #000 calc(100% - 86px), transparent 100%);
                   mask-image: linear-gradient(180deg, #000 calc(100% - 86px), transparent 100%); }
.al-pane.is-end { -webkit-mask-image: none; mask-image: none; }

.al-grp { padding: var(--v5) 2px var(--v2); }

.al-lead { padding: var(--v4) 0; }
/* The title runs at line-height 1.00, so its last line box ends level
   with the ink and a descender prints into whatever is next. Six
   pixels, which is also what makes the pair read as two registers
   rather than one wrapped line. */
.al-lead .al-caps { margin: var(--v1) 0 var(--v2); }
/* THE TITLE HAS TO CLEAR THE CLOSE BUTTON, AND 9em DID NOT. The X is
   fixed at the viewport's own right edge, so the room the title has is
   a number of PIXELS and an em measure cannot see it: at 38px, 9em is
   342 and the button's left edge is 330. Twenty of fifty-seven titles
   ran into it and twelve overlapped it outright — and the one this was
   first looked at on was among the thirty-seven that clear, which is
   what a single screenshot is worth as a check. Derived from the two
   gutters and the button rather than written as 304px, so the day a
   token moves the title moves with it. */
.al-lead .al-disp { max-width: calc(100% - (var(--round) + var(--gut) - var(--gut-list) + 8px)); }

/* Nothing to travel with any more: the ground under the words is the
   page. The whole class of contrast failure that MOVES with the scroll
   went out with the photograph. */
.al-sheet { padding-bottom: var(--v6); }


/* A THEME IS A CARD AND THE LESSON IS THE PAYLOAD. The theme is the
   evidence, so it reads at the quieter weight; the lesson is what you
   came for and takes the ink. The axis hue sits on the lesson's own
   label and nowhere else — the group heading already names it, and a
   colour repeating a word directly above it is saying which of
   something that was never in question. */
.al-th {
  position: relative; display: block; width: 100%; text-align: left;
  border-radius: var(--r-card); padding: var(--v4); margin-bottom: var(--v3);
  background: var(--card); box-shadow: inset 0 1px 0 var(--card-edge);
}
.al-tn { font-size: 19px; font-weight: 600; line-height: 1.26; letter-spacing: -.016em; }
.al-tsub { margin-top: 3px; font-size: 13px; font-weight: 450; color: var(--dim); }
.al-tl { margin: var(--v4) 0 var(--v1); }
.al-tb { font-size: 15px; line-height: 1.5; color: var(--dim); }
.al-tb.is-les { color: var(--ink); }
.al-tl.is-les { color: color-mix(in srgb, var(--tg) 66%, var(--ink)); }
.al-th[data-x="internal"] { --tg: #C9A227; }
.al-th[data-x="external"] { --tg: #7E9AA6; }
.al-th[data-x="karmic"]   { --tg: #D2603A; }

/* A STORY IN THE INDEX IS A PRESS TARGET AND THE REST ARE NOT. The same
   card, with no second drawing — only the row that opens something
   takes the reach. */
.al-f::before {
  content: ''; position: absolute; left: 0; right: 0; top: 50%;
  height: 100%; min-height: var(--tap); transform: translateY(-50%);
}


/* ---- THE FOOT ---- */
.al-foot {
  /* FOUR TABS, SO THE BAR WIDENS RATHER THAN THE TABS NARROWING. At
     93px either side the row is 204 wide, which is 49 a tab once the
     padding is out — under the 44 a press target owns only because the
     glyph is 20. Measured: at 60 the row is 270 and a tab owns 64. */
  position: fixed; left: 60px; right: 60px; z-index: 30;
  bottom: calc(var(--v4) + env(safe-area-inset-bottom, 0px));
  height: 58px; border-radius: var(--r-pill);
  background: rgba(24,21,17,.62);
  backdrop-filter: blur(26px) saturate(1.5); -webkit-backdrop-filter: blur(26px) saturate(1.5);
  border: 1px solid var(--hair);
  display: grid; grid-auto-flow: column; align-items: center;
  padding: 0 var(--v1);
}
.al-tab { height: 46px; border-radius: var(--r-pill); display: grid; place-items: center; color: var(--dim); }
.al-tab svg { width: 20px; height: 20px; display: block; }
.al-tab[aria-current="true"] { background: rgba(255,255,255,.12); color: var(--ink); }

/* GLASS OVER A PHOTOGRAPH WAS A MATERIAL. GLASS OVER A SENTENCE IS A
   SMEAR. This is the one round control that sits over running body
   text, fixed, while the pane scrolls under it — and .al-round's own
   --plate is 56%, which dims a word without removing it. Measured on
   composited pixels, a letter behind the disc survived as a 44-point
   luminance ghost and the screenshot read "you will b✕". At 94% the
   ghost is 6 and the backdrop pass is drawing nothing anybody can
   see, so it stops being glass either way: --card is the app's own
   object material, the ghost is 0, and the disc reads as a thing ON
   the page rather than a hole punched in it. The glyph costs nothing
   — 19.3:1 on the old plate, 19.8 on this one. Both X's take it;
   both sit over a pane of text. It is LATER in the file than
   .al-round and the two are equal specificity, so source order is
   what makes it win — the computed value is read back rather than
   trusted. */
.al-x { position: fixed; top: calc(18px + env(safe-area-inset-top, 0px)); right: var(--gut); z-index: 30;
  background: var(--card); backdrop-filter: none; -webkit-backdrop-filter: none; }
</style>
</head>
<body>

<section class="al-view is-on" id="alOpen">
  <div class="al-mark" role="img" aria-label="Alignment">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 2v20M5 8l7-6 7 6M5 16l7 6 7-6"/></svg>
  </div>
  <h1 class="al-disp" id="alOpenT">Eleven stories, read for what is in them.</h1>
  <p class="al-note" id="alOpenN">Ninety-nine themes taken from the films, the shows and one real career, split into what happens inside you and what happens out there. What the story does, and what it leaves you with.</p>
  <button class="al-pill" id="alOpenB">Begin</button>
</section>

<section class="al-view" id="alFilms">
  <div class="al-head"><h1 class="al-disp-s">The Stories</h1><span class="al-count"></span></div>
  <div class="al-pane" id="alFilmsPane"></div>
</section>

<section class="al-view" id="alInternal">
  <div class="al-head"><h1 class="al-disp-s">Internal</h1><span class="al-count"></span></div>
  <div class="al-pane" id="alInternalPane"></div>
</section>

<section class="al-view" id="alExternal">
  <div class="al-head"><h1 class="al-disp-s">External</h1><span class="al-count"></span></div>
  <div class="al-pane" id="alExternalPane"></div>
</section>

<section class="al-view" id="alKarmic">
  <div class="al-head"><h1 class="al-disp-s">Karmic</h1><span class="al-count"></span></div>
  <div class="al-pane" id="alKarmicPane"></div>
</section>

<section class="al-view" id="alFilm">
  <button class="al-round al-x" id="alFilmX" aria-label="Close">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
  <div class="al-pane" id="alFilmPane"></div>
</section>

<nav class="al-foot" id="alFoot">
  <button class="al-tab" data-v="films" aria-current="true" aria-label="The Stories">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3" y="7" width="13" height="13" rx="2.4"/><path d="M8 4h11a2 2 0 0 1 2 2v11"/></svg>
  </button>
  <button class="al-tab" data-v="internal" aria-label="Internal">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="8.4"/><circle cx="12" cy="12" r="3.1" fill="currentColor" stroke="none"/></svg>
  </button>
  <button class="al-tab" data-v="external" aria-label="External">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M13.5 4.5H19.5V10.5M19.5 4.5 12.5 11.5M18 14v4.5a2 2 0 0 1-2 2H5.5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2H10"/></svg>
  </button>
  <button class="al-tab" data-v="karmic" aria-label="Karmic">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19.6 9.4A8.2 8.2 0 0 0 5.2 7.6M4.4 14.6a8.2 8.2 0 0 0 14.4 1.8"/><path d="M19.9 4.6v4.9h-4.9M4.1 19.4v-4.9h4.9"/></svg>
  </button>
</nav>

<script>
(function () {
'use strict';

/*
  ONE WRAPPER. Nothing escapes it. The other apps in this repo learned
  that the hard way — a top-level name here does not throw when it
  collides, it replaces, and the symptom turns up screens away.
*/

var KEY = 'align.v1';

/* THE STORY IS THE EVIDENCE AND THE LESSON IS WHAT IT LEAVES YOU. The
   theme is what actually happens in the film or the show — a named
   scene, a line somebody says, a thing a character does — rather than
   something invented and attributed afterwards. That constraint is the
   whole of why this is worth reading: a lesson with a real scene under
   it can be checked, and one without is somebody's opinion wearing a
   film's name.

   ONE OF THE ELEVEN IS NOT A SCRIPT. 50 Cent is a real career rather
   than a story somebody wrote, so the constraint tightens rather than
   relaxes: every theme under it is a documented fact — the Chapter 11
   filing and the exit, the Glacéau stake, the three free mixtapes, the
   872,000 first week — and the one causal claim in it, that Ghetto
   Qu'ran is why he was shot, is written the way it is actually known:
   reported, and spoken about by him, rather than established.

   AND THE LESSON IS WRITTEN TO LAND, NOT TO SUMMARISE. A paraphrase of
   the plot with a moral on the end is the version everybody has already
   read. What is here names the uncomfortable half — the thing you are
   currently doing that the scene is about — because a lesson you can
   agree with and walk away from has not been written yet.

   Three of each axis for each story, which is a shape rather than a
   quota: a story that only yielded two of one kind would be one to cut
   rather than one to pad. Asserted at boot in both directions. */

/* THREE AXES, AND KARMIC IS NOT A TIDIER NAME FOR EXTERNAL. Internal
   is the mechanism running inside you. External is the world not
   caring what you think about it. Karmic is the account BETWEEN the
   two over time — what you put out arriving back, on a delay long
   enough that it does not feel connected to what opened it. Five
   entries that were filed external turned out to be that: the
   retaliation cycle, Rico, the product coming home, the suit falling
   on Brock, the North remembering. They moved rather than being
   copied, and external was written back up to three. */
var AXIS = { internal: 'Internal', external: 'External', karmic: 'Karmic' };

var SRC = [
  { i: "fifty", n: "50 Cent", y: 2003 },
  { i: "grich", n: "Get Rich or Die Tryin'", y: 2005 },
  { i: "power", n: "Power", y: 2014 },
  { i: "paid", n: "Paid in Full", y: 2002 },
  { i: "snow", n: "Snowfall", y: 2017 },
  { i: "spid", n: "Spider-Man 3", y: 2007 },
  { i: "lotr", n: "The Lord of the Rings", y: 2001 },
  { i: "got", n: "Game of Thrones", y: 2011 },
  { i: "hotd", n: "House of the Dragon", y: 2022 },
  { i: "hp", n: "Harry Potter", y: 2001 },
  { i: "vik", n: "Vikings", y: 2013 },
];

var TH = [
  { s: "grich", x: "internal", n: "Survival as Purpose", b: "Transmutation of Suffering",
    t: "Nine shots outside his grandmother's house, and the one through the jaw is the one that matters: it changes how he sounds, and the sound is what people end up buying. Many Men is written with the whole of it still in him. The record is not about surviving. It is the surviving, put somewhere it can be used.",
    l: "While you are in it there is nothing to show for it, and that is what this part looks like from the inside. It only becomes material later, and only if you were putting it somewhere at the time. The difference between a bad year and the thing you build on is whether anything got written down." },
  { s: "grich", x: "internal", n: "The Saint and the Sinner", b: "Radical Self-Honesty",
    t: "He wears the cross through all of it, and on Gotta Make It to Heaven he does not pretend the two fit. He names what he is doing and asks anyway. The film never resolves it, which is the honest version.",
    l: "You already know which parts of your week do not match what you say you are doing. Saying them out loud costs you the story you have been telling, and that story was costing more. Nobody is one thing. The people who claim to be are spending everything on the claim." },
  { s: "grich", x: "internal", n: "Numb Is Not Healed", b: "Feeling as Freedom",
    t: "Going cold is what keeps him alive on the block, and it works so well that it follows him home. Charlene cannot reach him. His son cannot reach him. The armour has no off, because nobody ever gave it one.",
    l: "Isolation is the right call and numbness is what it turns into if you leave it running. One is a decision about your time. The other is a decision about your capacity to feel anything, and you will not notice the handover. Keep one person you tell the truth to." },
  { s: "grich", x: "karmic", n: "Violence Begets Violence", b: "The Law of Return",
    t: "Levar says it flat: violence begets more violence, and violence does not beget more money. Every retaliation in the film buys exactly one more retaliation, and not one of them buys anything anybody wanted.",
    l: "Look at what your effort actually produces rather than what it was aimed at. If the honest answer is more of the same problem, you are not behind on the plan. You are on the wrong wheel, and more effort makes it worse. Step off and put the same force somewhere it compounds." },
  { s: "grich", x: "external", n: "Die Tryin'", b: "Memento Mori",
    t: "The title is a condition, not a boast. Mortality is on screen the whole film: the shooting, the yard, the sense that today is allowed to be the last one. It is also what makes his focus look like obsession to everybody around him.",
    l: "You have a number of years in which this is even possible and you do not know the number. That is arithmetic rather than motivation. Most of what you are currently deciding between does not survive being asked whether it is worth a week of a finite life." },
  { s: "grich", x: "external", n: "Money Was Never the Cure", b: "False Idols",
    t: "The money arrives and the wound is exactly where it was. The film refuses him the scene where the cars fix it, because the cars never fix it, and everybody who made that film knew somebody it had not fixed.",
    l: "You are going to get some of what you are chasing and it is going to do less than you think. Better to know that now than at the other end. What is actually worth having is authorship, being the one who decides what happens next, and money is a tool for it rather than the thing." },
  { s: "power", x: "internal", n: "Two Names, One Man", b: "The Divided Self",
    t: "James runs the club and Ghost runs the distribution, and the series is the tax on holding both. Every time he commits to being only one of them, the other is what saves him, which is exactly why he never commits.",
    l: "Running two versions of yourself costs energy before either of them does anything. If you are a different person at the gym, at the desk and in your family's house, that gap is not depth, it is overhead. Pick the one you are prepared to be seen as and let the others go." },
  { s: "power", x: "internal", n: "The Legitimate Front", b: "Wanting to Be Clean",
    t: "Truth is a real club and he is genuinely good at running it. It is also the reason he can keep telling himself the other half is temporary. The legitimate part is what makes the rest survivable.",
    l: "Check what your good habit is excusing. Training hard is not a cover for anything, until the day it is the only thing you can point at. Ask whether you would still do it if the thing it lets you avoid disappeared tomorrow." },
  { s: "power", x: "internal", n: "Angela", b: "Wanting the Old Version of Yourself",
    t: "He goes after Angela partly because she knew him before, and she is the only available picture of the man he might have been. He builds the entire exit around a person, and a person cannot hold that.",
    l: "When you want somebody back, work out whether you want them or the version of yourself they remember. Nobody can carry your redemption. Handing it to them is how you lose the person and the redemption in one move." },
  { s: "power", x: "external", n: "Loyalty Is Not Symmetrical", b: "Tommy",
    t: "Tommy is loyal to Ghost. Ghost is loyal to the plan. Neither of them says this out loud for six seasons, and the whole thing detonates on the difference.",
    l: "Most betrayals are two people who never once agreed on what they owed each other. Find out what the other person thinks the arrangement is, in words, before you need it to hold. Awkward once, or a catastrophe later." },
  { s: "power", x: "external", n: "You Cannot Retire From It", b: "The Business Keeps You",
    t: "Every time Ghost announces he is out, it pulls him back. Not out of malice. He is load-bearing, and nothing load-bearing is permitted to walk away.",
    l: "Anything that only works because you are inside it will not let you go. If you want out of something eventually, build it now so it runs without you. Otherwise the exit is somebody else's decision, and they will take it later than you would have." },
  { s: "power", x: "external", n: "Kanan and Milan", b: "The Level Above",
    t: "Every time Ghost reaches what looks like the top, somebody appears who was above him the whole time and completely invisible from where he was standing.",
    l: "From where you are, the next level looks like the last one. It is not. Anybody who moves because of what they can see from their current position will be moving again shortly, and the only cure is to go and look before you commit." },
  { s: "paid", x: "internal", n: "The Quiet One", b: "Temperament as Advantage",
    t: "Ace works the dry cleaners, says almost nothing, and moves carefully. He is the least interesting person in the film to watch, and he is the only one with an ending.",
    l: "The thing people call boring about you is usually what is keeping you alive. Not needing to be seen doing it is a strategy and it is cheaper than every alternative. It also means nobody will ever congratulate you for it." },
  { s: "paid", x: "internal", n: "Mitch's Appetite", b: "Enough Was Never Named",
    t: "Mitch has the money, the name and the life, and keeps going, because at no point did he write down a figure at which he would stop. An unwritten figure is not a figure.",
    l: "Name the number now, while it is abstract and you lose nothing by being honest. If you cannot say what enough is, you will not recognise it while standing in it, and every level you reach will quietly become the new floor." },
  { s: "paid", x: "internal", n: "After the Shot", b: "The Thing That Wakes You",
    t: "Ace is shot, and it is the recovery that changes him. What was normal a month earlier reads completely differently from a bed with nothing to do in it.",
    l: "A stop is the only time you can see the shape of what you were doing. If life has handed you one, an injury, an ending, a break you did not choose, use it before you are well enough to forget what it showed you." },
  { s: "paid", x: "karmic", n: "Rico", b: "Karmic Debt",
    t: "Rico takes from the people closest to him, and the film follows that account all the way down without ever commenting on it. Nothing he takes stays taken.",
    l: "The account is not moral and it is not fast, which is exactly why people believe they have got away with it. What you put out comes back in a currency you did not choose, at a time you are not ready for. The only variable you control is what goes in." },
  { s: "paid", x: "external", n: "The Ones Who Came Up With You", b: "Proximity Is Not Alignment",
    t: "Three friends, one come-up, three completely different endings. Sharing a start turns out to say nothing at all about wanting the same thing.",
    l: "Look at what the people around you are actually optimising for rather than at what you have in common. History explains why they are here. It predicts nothing about where they are going, and drifting from people headed somewhere else is not disloyalty." },
  { s: "paid", x: "external", n: "Getting Out", b: "Leaving Before It Leaves You",
    t: "Ace walks away with something left. It is the rarest event in the film, and it is a decision he takes early, while leaving still looks unnecessary.",
    l: "Exits are taken early or not at all. By the time leaving is obviously right, the choice has usually been made for you and on worse terms. If you are already asking the question, you are later than you think." },
  { s: "snow", x: "internal", n: "The Smart Kid", b: "Talent Without a Governor",
    t: "Franklin is the brightest person in every room and the show makes that the problem. Intelligence is what lets him build an argument for a thing nobody should be able to argue themselves into.",
    l: "Being able to pull something off is not a reason to. The smarter you are the better the case you will construct, which means your own reasoning is the last thing that will stop you. Decide what you will not do while the question is still theoretical." },
  { s: "snow", x: "internal", n: "Just This Once", b: "Incrementalism",
    t: "Nothing in the first season is a decision to become a kingpin. It is a bag, then a supplier, then a corner. Each one small, each one reasonable, none of them the moment.",
    l: "Nobody crosses a line. They cross a hundred small ones, each defensible on its own, and the sum is a life nobody chose. The place to be strict is at the size where it does not feel like it matters, because that is the only size you are ever offered." },
  { s: "snow", x: "internal", n: "Cissy's Son", b: "What the Family Sees",
    t: "His mother watches it happen, names it clearly, and is ignored. She has nothing to gain by lying to him, which is precisely why her read is the one he cannot take.",
    l: "The people closest to you have no angle, and that is what makes their opinion unbearable rather than useless. When you catch yourself explaining to somebody who knows you, notice that you are explaining. Discounting the clearest view available is a decision." },
  { s: "snow", x: "karmic", n: "The Product Comes Home", b: "Consequence Has an Address",
    t: "The neighbourhood he sells into is his own. The show never once lets the damage land somewhere abstract or on somebody you do not have to look at.",
    l: "There is no downstream. Every cost lands on a specific person, and if you cannot name who, that means you have not looked rather than that there is nobody. Being one step removed from a consequence is not the same as not causing it." },
  { s: "snow", x: "external", n: "Teddy", b: "You Are Somebody's Instrument",
    t: "Franklin builds an empire while being supplied by an operation using him for something else entirely. He is the top of his world and a component of somebody else's.",
    l: "Ask who benefits from your ambition besides you. Being the biggest thing inside your own frame tells you nothing about the frame, and the frame is where the decisions get taken. Go and find out who is above the person you are dealing with." },
  { s: "snow", x: "external", n: "The Money Had Nowhere to Go", b: "Wealth Without Legitimacy",
    t: "He ends up with more cash than he can move, clean or hold, and losing it, when it goes, is almost administrative.",
    l: "Money you cannot hold is not wealth, it is exposure with a good feeling attached. Anything built outside the rules is held outside them, which means it can be taken with no recourse at all. Build the boring structure before you need it." },
  { s: "spid", x: "internal", n: "The Suit Works", b: "Power That Amplifies",
    t: "The symbiote is not a trick. Peter is faster, stronger and more decisive, and Connors says exactly what it does: it bonds, and it amplifies what is already there, especially aggression. Every fight goes his way while he is wearing it.",
    l: "A thing that makes you worse gets dropped in a week. The dangerous one is the thing that genuinely works, because the bill is not paid in results. It is paid in who you turn into while collecting them, and that does not arrive itemised." },
  { s: "spid", x: "internal", n: "Brock in the Newsroom", b: "Revenge as a Feeling",
    t: "Peter is right that Eddie faked it. He waits for the room to be full anyway, does it in front of Jameson, and stands there while a man loses everything. There is a version of that scene that takes thirty seconds. This is not that version.",
    l: "Being right and what you do with being right are two separate questions. Watch how long you wait, who you do it in front of, and whether you enjoy it. That is where the actual motive is, and it is visible to everybody except you." },
  { s: "spid", x: "internal", n: "The Bell Tower", b: "You Cannot Argue With It",
    t: "He does not out-will the suit. He climbs into a sound loud enough to break the bond, because there was never an argument available to a man the thing was amplifying.",
    l: "You do not think your way out of a state, because the part doing the thinking is the part that is compromised. Change the room, the hour, the phone, the people. That is not weakness. It is the only mechanism that has ever worked." },
  { s: "spid", x: "karmic", n: "It Falls on Brock", b: "It Goes to Whoever Wants It Most",
    t: "The suit comes off in the tower and drops straight onto Eddie, who is directly underneath praying for Peter to die. It goes exactly where it was always going to go.",
    l: "Whatever you put down does not stop existing. It finds whoever is most available to it, and that is usually somebody who will use it considerably worse. Quitting a thing and ending it are not the same act." },
  { s: "spid", x: "external", n: "Harry Comes", b: "You Have to Be Worth Turning Up For",
    t: "The last fight is not winnable alone. Harry, written off and lied to and with every reason to stay away, turns up because somebody went and asked him.",
    l: "The version of you that needs nobody has a ceiling, and you will find it on the worst day. Whoever turns up for you then was built years earlier, in ordinary weeks, by you. Isolation is a tool. Having nobody is a position." },
  { s: "spid", x: "external", n: "Mary Jane's Year", b: "What You Stopped Noticing",
    t: "While Peter is being adored in the street, Mary Jane is losing the thing she has wanted her whole life, and he does not notice for weeks. None of his attention is malicious. It simply went where it was being rewarded.",
    l: "Attention flows to whatever pays it back fastest, and a screen pays back fastest of all. Check what has gone quiet around you. The thing that stopped asking for your attention is usually the thing that needed it." },
  { s: "lotr", x: "internal", n: "Frodo at the Crack of Doom", b: "Willpower Has a Limit",
    t: "After the whole journey, standing at the exact place where it ends, Frodo does not throw the Ring in. He claims it. The quest is lost in that second, by the person who carried it the entire way.",
    l: "Do not build anything that requires you to be strong at the worst possible moment, because you will not be. Assume the failure and design so it does not decide the outcome: rules set in advance, an account you cannot reach, somebody who knows the plan." },
  { s: "lotr", x: "internal", n: "Boromir", b: "The Good Reason",
    t: "Boromir wants the Ring for Gondor, for his people, for a city that is genuinely falling. The reason is true, and the film is careful that it never stops being true. It is also the door.",
    l: "The explanation that is true and also happens to be the one you wanted is the hardest thing there is to examine, because the examining is being done by the person it benefits. A good reason is not evidence. Ask what you would do if it were false." },
  { s: "lotr", x: "internal", n: "Sam's Ordinary Loyalty", b: "The Unremarkable Virtue",
    t: "Sam carries the water, the rope, the pans and eventually Frodo. Nothing he does is impressive taken on its own, and it is the entire reason any of it works.",
    l: "The decisive quality is almost never the exciting one. It is turning up on the days that do not count, and it does not photograph, which is why nobody trains for it and why it is still available to you." },
  { s: "lotr", x: "external", n: "Gollum at the Fire", b: "The Verdict Delivered Early",
    t: "Bilbo should have killed him in the tunnel. Sam is right about him at every single turn. And he is the reason the Ring goes into the fire, because Frodo failed and Gollum bit it off his hand.",
    l: "You close accounts on people, and on yourself, long before the story has finished. Even the very wise cannot see all ends. That is not comfort. It is a warning about how much certainty you are spending on half a sentence." },
  { s: "lotr", x: "external", n: "The Ring Corrupts Its Bearer", b: "The Tool Uses You",
    t: "Nobody uses the Ring. Isildur, Gollum, Bilbo, Boromir, Frodo. It works on whoever is holding it, in exact proportion to how much that person wants.",
    l: "Some instruments are not neutral. Leverage, an audience, a run of wins: ask what the thing does to the person holding it rather than only what it does for them. The ones that give you the most are the ones to check hardest." },
  { s: "lotr", x: "external", n: "The Shire Is Not the Same", b: "You Cannot Go Back",
    t: "They come home and the Shire has been occupied and scoured, and Frodo cannot live in it. The journey changed the one place that was supposed to stay still.",
    l: "A threshold charges you the thing that was only ever valuable on the side you are leaving. That is not cruelty. If it made sense on both banks it would not be a threshold. Expect to lose the room you were planning to come back to." },
  { s: "got", x: "internal", n: "Ned Stark", b: "Honour Without Leverage",
    t: "Ned is the most honourable man in the story and it kills him inside one season. He tells the truth to people who have no incentive to reward it, and gives them warning first.",
    l: "A principle you cannot enforce is a preference. Decide what you stand for and then build the position that lets you stand for it, in that order. The other way round is not integrity, it is a donation." },
  { s: "got", x: "internal", n: "Jaime's Hand", b: "Identity Built on One Thing",
    t: "Jaime is his sword hand. When it goes, the entire idea of who he is goes with it, and only then does anything else about him begin to exist.",
    l: "Whatever you are entirely is something that can be taken from you in an afternoon. If your identity is one number, one body or one relationship, you are one bad quarter from having nothing to be. Breadth is not dilution, it is insurance." },
  { s: "got", x: "internal", n: "Theon", b: "Belonging to Two Places",
    t: "Raised a Stark and born a Greyjoy, he betrays the family that raised him in order to be accepted by the one that never wanted him, and is accepted by neither.",
    l: "Trying to be claimed by people who have not claimed you will cost you the ones who have. Notice who is already there. Chasing a room that has no seat for you is a way of not sitting down anywhere." },
  { s: "got", x: "external", n: "The Iron Throne", b: "Power Is a Position, Not a Person",
    t: "Robert, Joffrey, Tommen, Cersei, Daenerys. The chair does roughly the same thing to all of them. It is a study of one seat rather than of one character.",
    l: "Structures shape behaviour far more reliably than character does. When everybody who takes a role behaves the same way, stop reading the people and read the role, including the one you are about to step into." },
  { s: "got", x: "external", n: "Littlefinger", b: "Chaos Is a Ladder",
    t: "He has no army and no claim and outlasts most of the people who have both, because he is the only one whose position improves when things go wrong.",
    l: "Fragile plans need conditions to stay still and conditions never do. Ask what a shock does to your position rather than hoping none arrives. The good version is not the one that wins if everything goes right." },
  { s: "got", x: "karmic", n: "The North Remembers", b: "Nothing Is Settled",
    t: "The Red Wedding wins the war and does not end it. Every act creates a debt somebody else is carrying and will present later, at a time of their choosing.",
    l: "A win that leaves people alive who are owed is not a conclusion. Accounts persist a great deal longer than the events that opened them, and whoever is holding one is patient in a way you are not." },
  { s: "hotd", x: "internal", n: "Daemon Wants to Be Chosen", b: "Waiting for Recognition",
    t: "He is the best fighter in the realm and spends years circling the one thing he will never be handed: his brother's approval and the succession with it. Every time he gets close he does something that makes it impossible.",
    l: "Waiting to be chosen is a way of not choosing, and the years go either way. If you are waiting for somebody to confirm you are ready, notice that the confirmation has no mechanism and never did." },
  { s: "hotd", x: "internal", n: "The Stepstones", b: "Doing It Yourself",
    t: "Refused everything at court, he takes the Stepstones with Corlys and wins it with a dragon and his own blood, then comes home and throws the crown at his brother's feet, because it was never about the crown.",
    l: "What you take by going and doing it cannot be withdrawn by the person who refused you, and that is the whole value of it. Going is the only available answer to a no you cannot appeal, and it requires nobody to change their mind." },
  { s: "hotd", x: "internal", n: "Rhaenyra and Daemon", b: "Appetite as Identity",
    t: "Everything Daemon wants is wanted at full strength and pursued past every line there is. A throne, a niece, a war. The appetite is not a flaw in the man, it is the man.",
    l: "A trait that size does not get removed, and the twenty years you spend trying is the waste. It gets aimed. The destructive shape and the useful one run on the same engine, and the only variable is direction." },
  { s: "hotd", x: "external", n: "Viserys's Dream", b: "A Story Held Too Loosely",
    t: "Viserys knows the reason his family must hold the throne and tells almost nobody clearly. His last words are misheard by the one person best placed to act on them, and the war starts in that room.",
    l: "A reason that lives only in your head is not a reason anybody else can act on. Say it plainly, more than once, to the people who will have to carry it. Being understood is a job, and it is yours rather than theirs." },
  { s: "hotd", x: "external", n: "The Greens and the Blacks", b: "A Succession Nobody Wrote Down",
    t: "The entire war runs on an ambiguity that could have been settled in one afternoon at any point across twenty years, by a man who kept deciding not to have the conversation.",
    l: "Unsettled questions do not stay small. Whatever you are avoiding naming is compounding the whole time you avoid it, and the cost of naming it only goes up. The awkward hour now is the cheapest it will ever be." },
  { s: "hotd", x: "external", n: "Dragons Are Not Controllable", b: "Leverage Cuts Both Ways",
    t: "The dragons make the family untouchable and then take the family apart. Nobody wins a dragon fight in that show. They survive one, mostly they do not, and the thing that made them safe is what kills them.",
    l: "Every source of power is also an exposure. The thing that makes you hard to attack is usually the thing you can least afford to lose, and the size of the upside tells you the size of the other side." },
  { s: "hp", x: "internal", n: "Occlumency", b: "The Work With No Reward",
    t: "The one piece of work that year with nothing in it for him. No flying, no audience, he is bad at it, and Snape is teaching it. He does the hour and never practises, while running Dumbledore's Army brilliantly, which decides nothing.",
    l: "The work that decides it usually has no screen, no progress you can see and somebody you dislike attached. You will skip it, and you will skip it while working hard on something else, which is what makes it invisible. Find the boring one. That is the year." },
  { s: "hp", x: "internal", n: "The Mirror of Erised", b: "Wanting as a Trap",
    t: "Dumbledore finds Harry sitting in front of a mirror showing him his dead parents, and tells him men have wasted away in front of it, not knowing whether what they saw was real or even possible.",
    l: "A vivid enough picture of what you want can quietly replace doing anything about it. The image costs nothing and pays out a little of the feeling, which is why it is so easy to sit there. Check how much of your week went into the picture." },
  { s: "hp", x: "internal", n: "Neville", b: "The Late Arrival",
    t: "Neville is the joke of the first few books and he is standing at the end of the last one holding a sword. Nothing about the early version of him predicted any of it.",
    l: "You deliver verdicts on people, yourself included, on about a tenth of the evidence. A slow start is not information about a finish. What it is, is the part nobody watches, which is why almost nobody is still there for it." },
  { s: "hp", x: "external", n: "Riddle's Diary", b: "Never Trust What You Cannot Source",
    t: "Ginny writes to a book and the book writes back. It is sympathetic, patient and endlessly interested in her, and it is Voldemort. Nothing about the experience feels like being used.",
    l: "Anything that flatters you and asks for more of your attention is worth checking for who is on the other end and what they are getting. Comfort is the cheapest delivery mechanism there is, and what arrives through it never announces itself." },
  { s: "hp", x: "external", n: "Dumbledore's Silence", b: "Withholding Is a Decision",
    t: "He keeps the prophecy from Harry for five years to protect him, and admits afterwards that it was an old man's weakness. The withholding causes the exact thing it was meant to prevent.",
    l: "Protecting somebody from information usually protects you from the conversation. Say it early, while there is still time for anybody to act on it. Late honesty is not honesty, it is a confession." },
  { s: "hp", x: "external", n: "The Room of Requirement", b: "Circumstance Is Buildable",
    t: "The room appears as whatever is needed, and only to somebody who needs it. Almost every useful thing that year happens inside a space they made on purpose.",
    l: "You do not negotiate with a room, you choose one. Most of what looks like discipline from outside is somebody having arranged their surroundings so the decision was already taken. Set the room and stop spending willpower on it." },
  { s: "vik", x: "internal", n: "Ragnar's Curiosity", b: "Wanting to Know",
    t: "Ragnar is not after plunder first. He wants to know what is west across open water, and the wanting to know is what makes him dangerous to everybody around him, including to himself.",
    l: "Curiosity outlasts motivation, which is why it is worth knowing which one you are running on. A question you actually want the answer to will carry you through years that a goal will not, because a goal has a finish and a question does not." },
  { s: "vik", x: "internal", n: "What the Win Cost", b: "Arrival Is Not the End",
    t: "He gets all of it. England, fame, sons, a kingdom. And he is hollowed out by it, on opium, no longer able to be the man who wanted any of it.",
    l: "What you want arrives with something attached that nobody warned you about, usually the fear of it leaving. Decide now what you will do on the day you get it, because you will not be thinking clearly then and the person who arrives is not this one." },
  { s: "vik", x: "internal", n: "Floki's Faith", b: "Belief as Engine and Blindness",
    t: "Floki builds the ship that makes the whole thing possible, out of absolute conviction that nobody else shares. The same conviction later makes him murderous, and then lost.",
    l: "The belief that lets you build something nobody asked for is not a different thing from the belief that stops you hearing anybody. It is one machine with two outputs, and you do not get to keep only the first." },
  { s: "vik", x: "external", n: "Asking the Earl", b: "Nobody Authorises What Proves Them Wrong",
    t: "Ragnar asks Haraldson to sail west, properly, in front of everybody, more than once, and is refused every time. Not because Haraldson is stupid. No man in charge of a thing approves the expedition that would prove him wrong about it.",
    l: "You are waiting on a yes that has no reason to exist. That is arithmetic rather than malice and it does not improve with better asking. Build it quietly and go. The permission stops mattering the moment the thing works." },
  { s: "vik", x: "external", n: "The Boat, Not the Nerve", b: "Preparation Is the Courage",
    t: "He does not sail west on hope. Floki's ship is built for open sea, he has the sun-board for latitude, and he recruits a crew quietly, one man at a time, over a season, while farming during the day.",
    l: "Going without permission and going without preparation are completely different acts, and only one of them works. The part that reads as nerve from outside is almost entirely a season of unglamorous preparation nobody watched." },
  { s: "vik", x: "external", n: "After Lindisfarne", b: "Permission Stops Being the Question",
    t: "Haraldson takes the spoils, because he is still the Earl and that is what an Earl does. It does not matter. Everybody in that hall has now seen what is west, and no amount of authority puts that back in the box.",
    l: "You do not become a person they consider ready. You become a person the question no longer applies to, and that only happens on the other side of having gone. Nobody hands it over." },
  { s: "grich", x: "external", n: "The Block Has an Economy", b: "You Are in a System",
    t: "Nothing Marcus does is invented by him. The corners, the prices, the hierarchy and the reprisals were all running before he arrived and go on running after he is gone.",
    l: "Most of what feels like your decision is a slot in a system that was already there. Understanding the shape of the system is worth more than any amount of effort inside it, because it tells you which moves exist at all." },
  { s: "paid", x: "external", n: "Harlem Watches", b: "Visibility Has a Price",
    t: "The money is visible: cars, coats, jewellery, a name people say. Being known is what makes the come-up work, and it is also what puts everybody who takes it on a list.",
    l: "Being seen is a cost that arrives late. It reads as free for years and then gets paid all at once, to people who were watching for reasons entirely of their own." },
  { s: "snow", x: "external", n: "The Neighbourhood Decides", b: "You Are Standing on Somebody",
    t: "The whole operation depends on the people who live there letting it run. The moment the block turns, nothing about his supply or his money matters at all.",
    l: "Whatever you are building sits on somebody's goodwill and you will not notice whose until it goes. Count who has to keep saying yes for this to keep working." },
  { s: "spid", x: "external", n: "Jameson's Front Page", b: "Somebody Else Writes the Story",
    t: "Peter does the work and Jameson decides what it means in print. The public Spider-Man is authored by a man with his own reasons, and Peter has no say in any of it.",
    l: "Whoever controls the description controls most of the outcome. You can do the thing perfectly and still lose to somebody better placed to narrate it. Own the channel or accept their version." },
  { s: "got", x: "external", n: "The Wall", b: "The Thing Nobody Was Watching",
    t: "Everybody spends five seasons on the throne while the actual threat walks south. The politics are real, and they are also almost entirely beside the point.",
    l: "What ends up mattering is usually not the thing everybody is competing over. Ask once a quarter what you would be worried about if you were not busy with this." },
  { s: "grich", x: "karmic", n: "The Ones Who Put Him There", b: "Nothing Is Anonymous",
    t: "The shooting is not random. It is arranged by people he knows, over things he did, and the film lets you follow the line all the way back. Every name in that sequence was already in his life.",
    l: "The bill is almost always presented by somebody you already know. Harm done at a distance still has an address, and it gets collected by whoever was standing closest to it rather than by a stranger." },
  { s: "grich", x: "karmic", n: "What He Owes and What He Is Owed", b: "The Debt Runs Both Ways",
    t: "The same network that shoots him is the one that fed him, raised him and taught him the only trade he had. The film refuses to make that simple, and both accounts are collected.",
    l: "You are inside a set of accounts you did not open. Some of what is coming to you is somebody else's doing and some of it is yours, and the only part you get to decide is what you add from here." },
  { s: "power", x: "karmic", n: "Every Body Comes Back", b: "Nothing Stays Buried",
    t: "Every person Ghost removes to protect the plan returns as a problem: a widow, a brother, a detective, a son. The show is an accounting exercise dressed as a crime drama.",
    l: "The thing you removed to make a problem go away is what the next problem is made of. What you do to get out of a hole is almost always the material for the following one." },
  { s: "power", x: "karmic", n: "Tariq", b: "What You Taught Without Meaning To",
    t: "Ghost spends the entire show keeping his son out of it, and his son becomes him anyway, because the boy was watching rather than listening.",
    l: "What you pass on is what you did in front of people, never what you told them. Anybody who watched you for years took the behaviour, and the speech about it did not land at all." },
  { s: "power", x: "karmic", n: "Kanan's Return", b: "An Old Debt Is Still a Debt",
    t: "Kanan comes back after years inside for a thing Ghost did, and the time has changed nothing about what is owed. The interest is the years themselves.",
    l: "An account you have stopped thinking about is still open on the other side. Silence is not settlement, and the longer it sits the larger it is when it arrives." },
  { s: "paid", x: "karmic", n: "The Title Is the Point", b: "Everything Gets Settled",
    t: "The film is called Paid in Full and it means the account rather than the money. Every character is paid out exactly what they put in, in the currency they used to put it there.",
    l: "You are already being paid for what you are doing now, on a delay long enough that it does not feel connected to anything. That delay is the only reason it stays possible to keep doing it." },
  { s: "paid", x: "karmic", n: "Mitch's Brother", b: "What It Costs Other People",
    t: "What is done to Mitch's younger brother is the act that ends the entire world of the film. It is aimed at one man and it lands on a family.",
    l: "Almost nothing you do lands only on the person you aimed it at. Before you act, count who else is standing there. That count is the real size of the decision." },
  { s: "snow", x: "karmic", n: "Everyone Around Him Pays", b: "The Bill Is Distributed",
    t: "Franklin survives longer than almost anybody near him. His cousin, his friends, his mother, his uncle: the cost of his rise is paid out across the people he loves rather than by him.",
    l: "When consequences are not landing on you, find out who they are landing on. A long run of luck is often somebody nearby absorbing what should have been yours." },
  { s: "snow", x: "karmic", n: "The Ending He Built", b: "You Arrive at What You Made",
    t: "He finishes with nothing, alone, in the wreckage of a neighbourhood he helped wreck. Nothing in the last season is punishment arriving from outside. It is arrival.",
    l: "You do not get punished. You get delivered to the place your decisions were pointing at the whole time, and it will look obvious from there and looks like nothing from here." },
  { s: "spid", x: "karmic", n: "Sandman and Uncle Ben", b: "The Story You Were Owed Was Wrong",
    t: "Peter has carried one version of his uncle's death for two films and it turns out to be incomplete. The man he has been owed by is not the man he thought he was owed by.",
    l: "A debt you have carried for years is worth reopening before you collect on it. Being owed is the most comfortable position there is, and comfort is a poor reason to leave a story unchecked." },
  { s: "spid", x: "karmic", n: "Forgiveness Ends It", b: "Somebody Has to Absorb the Last of It",

  { s: "lotr", x: "karmic", n: "Bilbo's Mercy", b: "Sixty Years Later",

  { s: "lotr", x: "karmic", n: "Isildur", b: "Inheriting Somebody Else's Refusal",

    l: "Some of what you are dealing with was settled before you arrived, by somebody who had one clean chance at it. That is not unfair, it is how accounts work, and you are currently making one for whoever comes next." },
  { s: "lotr", x: "karmic", n: "Saruman", b: "What You Become By Studying It",

    l: "Whatever you give your attention to works on you while you are working on it. You cannot study something daily for years and stay untouched, and nobody ever notices the direction of travel from inside it." },
  { s: "got", x: "karmic", n: "Cersei's Children", b: "The Prophecy Was a Description",
    t: "Maggy tells her she will have three children and outlive all of them. Everything Cersei does to protect them is part of why she loses them, and the show never once says whether the prophecy caused it.",
    l: "Fear of losing a thing is the most reliable method of losing it. Check whether your protection of something has become a way of damaging it, because from the inside those two feel identical." },
  { s: "got", x: "karmic", n: "Robb's Broken Word", b: "The Lender Sets the Price",
    t: "Robb wins every battle and loses the war over one broken promise, to a man nobody respected. The Freys decided what it was worth, not him.",
    l: "You do not get to decide what a debt is worth. The person owed does. Something you consider minor is entirely capable of being the whole of what somebody else has been waiting to collect." },
  { s: "hotd", x: "karmic", n: "Blood and Cheese", b: "The Escalation Nobody Can Stop",
    t: "A son for a son. What is done in that room is answered, and the answer is answered, and by the end there is nobody left who can stop it without being the one who lost.",
    l: "Once an account is open between two people, neither can close it without appearing to lose. That is the whole mechanism, and the only cheap moment to stop was before the first entry." },
  { s: "hotd", x: "karmic", n: "Aemond and Luke", b: "One Boy's Eye",
    t: "A children's fight over a dragon costs a boy an eye, and years later that boy kills the other one in the air and starts the war. Neither of them forgot a second of it.",
    l: "Humiliation has the longest memory of anything you can hand a person. What you do to somebody in front of others is filed and kept, at full strength, for as long as it takes." },
  { s: "hotd", x: "karmic", n: "The Usurpation", b: "Founding on a Broken Thing",
    t: "Every claim in the war traces back to an oath sworn by lords who then did not keep it. The realm is built on a promise and spends a generation paying for having broken it.",
    l: "Anything you build on a thing you know is not right has to be held up for as long as it stands. It does not become true with time. It becomes expensive." },
  { s: "hp", x: "karmic", n: "The Life Debt", b: "Pettigrew's Hand",
    t: "Harry stops Sirius and Lupin killing Pettigrew, and Dumbledore tells him a debt now exists between them. Years later Pettigrew hesitates for one second, and that second is why Harry lives.",
    l: "Mercy is not the soft option, it is an investment with an unknown maturity. You will almost never see the return, and the people who do it for the return do not get one." },
  { s: "hp", x: "karmic", n: "Snape", b: "A Debt Paid Over a Lifetime",
    t: "Everything Snape does for seventeen years is payment on one thing he did before the books begin. Nobody knows it until he is dying, including the person it was being paid for.",
    l: "Some accounts are settled quietly, at length, by people who get no credit while they are alive. If you are owed by somebody, consider that they may already be paying and you have not been told." },
  { s: "hp", x: "karmic", n: "Voldemort's Own Curse", b: "You Make the Thing That Ends You",
    t: "He chooses Harry, marks him, hands him the means of surviving, and then dies to a spell he cast himself rebounding. Every step of his defeat is built by him.",
    l: "What takes you down is usually something you made and then stopped looking at. Go and check what you have built that you no longer examine, because that is the only place it can be." },
  { s: "vik", x: "karmic", n: "The Sons", b: "What You Leave Open Gets Collected",
    t: "Ragnar's death is not the end of anything. It is the beginning of the Great Heathen Army, and everything his sons do afterwards is his account being settled by other people.",
    l: "What you start does not stop with you. Whatever you leave open is inherited by people who did not choose it, and they will act on it with your name attached." },
  { s: "vik", x: "karmic", n: "Athelstan", b: "What You Take Comes With You",
    t: "Ragnar takes a monk from Lindisfarne as plunder, and that man changes how he thinks, what he believes and eventually what he is. The most valuable thing he ever took is the one that undid him.",
    l: "What you take into your life arrives with everything attached to it. You do not get to select which parts, and the ones that change you are never the ones you were after." },
  { s: "vik", x: "karmic", n: "Ragnar's Last Move", b: "Paying It On Your Own Terms",
    t: "He walks into Ecbert's hands knowing exactly what happens next, and engineers his own execution so that his sons will come. He spends his own life as the final move.",
    l: "There is a version of settling an account where you choose the terms, and it is the only version that ends anything. Everything else is waiting for somebody else to set the price." },
  { s: "fifty", x: "internal", n: "\"I'm Not a Rapper\"", b: "Identity Decides the Moves",
    t: "He has said it for twenty years and it is neither modesty nor a boast, it is the strategy. Music is one product line. The water, the books, the films, the television, the boxing promotion: none of that is a rapper diversifying. It is a man who never accepted the job title in the first place.",
    l: "What you call yourself decides which moves are even available to you. Take the narrow title people hand you and you inherit its ceiling with it, and nobody is going to offer you a wider one later. Name the thing you are before you have earned the name." },
  { s: "fifty", x: "internal", n: "He Was Never Insulted", b: "Attack as Material",
    t: "Every feud he has been in, he escalated deliberately. Ja Rule, the 2007 sales bet against Kanye, twenty years of it. He is not being provoked in any of them. He picks the fight, sets the terms and sells the tickets.",
    l: "What you treat as an insult decides whether it costs you or pays you. Most of what happens to you is neutral material until you decide to be wounded by it, and being wounded is the expensive option every single time." },
  { s: "fifty", x: "internal", n: "The Bankruptcy Was a Filing", b: "Not Feeling What You Are Told to Feel",
    t: "He filed Chapter 11 in 2015 after a court judgment, kept working straight through it, and came out in 2017. He treated it as a legal instrument with a defined process rather than as the end of a story about him.",
    l: "Most events arrive with an emotion already attached that somebody else decided on. Separating what a thing IS from what you are supposed to feel about it is most of what composure actually is, and it is a skill rather than a temperament." },
  { s: "fifty", x: "external", n: "The Mixtapes", b: "Build the Audience Before the Deal",
    t: "Dropped by Columbia and untouchable after the shooting, he put out 50 Cent Is the Future, Guess Who's Back and No Mercy No Fear for nothing. By the time Eminem and Dre came, the demand already existed and he was not asking anybody for anything.",
    l: "Leverage is built before you need it, and it is usually built by giving things away. Anybody negotiating from a position where they need the deal has already lost it. Make the thing so well that the room has to come to you." },
  { s: "fifty", x: "external", n: "Vitamin Water", b: "Take the Equity, Not the Fee",
    t: "He took a stake in Glacéau instead of an endorsement cheque. Coca-Cola bought the company in 2007, and that one decision paid more than any fee he could have negotiated for the same work.",
    l: "A fee ends when the work ends. A share keeps paying while you sleep, and it is far more often available than people think, simply by asking for it instead of the money. The only cost is being paid nothing for a while, which is the whole test." },
  { s: "fifty", x: "external", n: "From Talent to Owner", b: "Own the Thing You Appear In",
    t: "Power, then Power Book II, III and IV, then BMF. He moved from being cast in things to producing them, and the production company rather than the performance is where the durable money sits.",
    l: "Being the talent means somebody else decides whether there is any more of it. Get your name ON the thing rather than in it. That move is almost always available a level earlier than the people who eventually make it take it." },
  { s: "fifty", x: "karmic", n: "Ghetto Qu'ran", b: "What You Put Out Has an Address",
    t: "In 2000 he recorded a track naming real figures from the Queens drug trade. Months later he was shot nine times outside his grandmother's house and the industry stopped returning calls. He has spoken since about the connection between the two.",
    l: "Everything you put out is addressed to somebody, whether or not you were thinking about them while you made it. The account opens the moment it leaves your hands, and it is settled on a timetable you do not get to set." },
  { s: "fifty", x: "karmic", n: "The Ja Rule War", b: "Winning Defines You Too",
    t: "He ended Murder Inc commercially and it worked completely. Twenty years later it is still one of the first things anybody says about him, and the years he spent on it are years of his own output that went into somebody else.",
    l: "You become the thing you fight, in the eyes of everybody watching, whether or not you win. The cost of a war is not the risk of losing it. It is the years, and the description of you that outlives the result." },
  { s: "fifty", x: "karmic", n: "Everything He Gave Away", b: "The Return Arrives Late and in Another Shape",
    t: "The free mixtapes sold the album: 872,000 copies in its first week. And the persona built on that block is, twenty years later, the business — a television operation selling that exact world back to an audience the street had already built for him.",
    l: "What you give away is not gone, it is placed. The return comes late and rarely in the shape you expected, which is why the people who calculate it never receive it and the people who simply keep putting things out do." },
];

var $ = function (s) { return document.querySelector(s); };
var el = function (t, c, x) { var n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; };

/* st.last is a view, and the build before this one stored 'dark' or
   'lessons' — names VIEWS no longer has. It falls through to the first
   list, the way any stored key in this repo has to. */
var st = { last: null };
try { var raw = localStorage.getItem(KEY); if (raw) { var o = JSON.parse(raw); if (o && typeof o === 'object') {
  st.last = typeof o.last === 'string' ? o.last : null;
} } } catch (e) {}
var save = function () { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };






/* A STORY WITH NO THEMES, OR A THEME POINTING AT A STORY THAT IS NOT
   THERE, IS SILENT RATHER THAN BROKEN: the list simply comes out short
   and nothing says so. Both directions, at boot. */
(function () {
  var seen = {};
  TH.forEach(function (t) {
    if (!SRC.filter(function (x) { return x.i === t.s; })[0]) throw new Error('no story for ' + t.n);
    if (!AXIS[t.x]) throw new Error('bad axis for ' + t.n);
    seen[t.s] = true;
  });
  SRC.forEach(function (x) {
    for (var a in AXIS) if (themesOf(x.i, a).length !== 3)
      throw new Error(x.n + ' has ' + themesOf(x.i, a).length + ' ' + a);
  });
}());

function mask(p) {
  var f = function () {
    p.classList.toggle('is-end', p.scrollTop + p.clientHeight >= p.scrollHeight - 2);
  };
  if (!p.alMask) { p.alMask = f; p.addEventListener('scroll', f, { passive: true }); }
  p.alMask();
}


function srcOf(id) { return SRC.filter(function (x) { return x.i === id; })[0]; }
function themesOf(id, ax) { return TH.filter(function (t) { return t.s === id && t.x === ax; }); }

/* ONE CARD, DRAWN ONCE. It is built the same on a story's own page and
   in the two axis lists, because two constructions of one object is how
   the two come to disagree — this repo has written that down already
   about a question asked in two places and a tag built twice. */
function card(t) {
  var d = el('div', 'al-th');
  d.setAttribute('data-x', t.x);
  d.appendChild(el('h3', 'al-tn', t.n));
  d.appendChild(el('div', 'al-tsub', t.b));
  d.appendChild(el('div', 'al-caps al-tl', 'Key theme'));
  d.appendChild(el('p', 'al-tb', t.t));
  d.appendChild(el('div', 'al-caps al-tl is-les', 'The spiritual lesson'));
  d.appendChild(el('p', 'al-tb is-les', t.l));
  return d;
}

function paintFilms() {
  var p = $('#alFilmsPane'); p.textContent = '';
  SRC.forEach(function (x) {
    var b = el('button', 'al-th al-f');
    b.setAttribute('data-src', x.i);
    b.appendChild(el('h3', 'al-tn', x.n));
    b.appendChild(el('div', 'al-tsub', String(x.y)));
    p.appendChild(b);
  });
  mask(p);
}

/* ONE PAINTER, TWO AXES — the same screen reading the same list through
   one field, grouped by the story it came from, so a lesson is never
   stranded from the thing that is evidence for it. */
function paintAxis(ax) {
  var p = $('#al' + ax.charAt(0).toUpperCase() + ax.slice(1) + 'Pane');
  p.textContent = '';
  SRC.forEach(function (x) {
    var rows = themesOf(x.i, ax);
    if (!rows.length) return;
    p.appendChild(el('div', 'al-grp al-caps', x.n));
    rows.forEach(function (t) { p.appendChild(card(t)); });
  });
  mask(p);
}

function paintFilm(id) {
  var x = srcOf(id); if (!x) return;
  var p = $('#alFilmPane'); p.textContent = '';
  var lead = el('div', 'al-lead');
  lead.appendChild(el('h1', 'al-disp', x.n));
  lead.appendChild(el('div', 'al-caps', String(x.y)));
  p.appendChild(lead);
  var sh = el('div', 'al-sheet');
  for (var a in AXIS) {
    var rows = themesOf(id, a);
    if (!rows.length) continue;
    sh.appendChild(el('div', 'al-grp al-caps', AXIS[a]));
    rows.forEach(function (t) { sh.appendChild(card(t)); });
  }
  p.appendChild(sh);
  p.scrollTop = 0; mask(p);
}

var VIEWS = ['open', 'films', 'internal', 'external', 'karmic', 'film'];
function view(v) {
  if (VIEWS.indexOf(v) < 0) v = 'films';
  document.documentElement.setAttribute('data-view', v);
  VIEWS.forEach(function (x) {
    var n = $('#al' + x.charAt(0).toUpperCase() + x.slice(1));
    if (n) n.classList.toggle('is-on', x === v);
  });
  $('#alFoot').hidden = (v === 'open' || v === 'film');
  $('#alFilmX').hidden = (v !== 'film');
  document.querySelectorAll('.al-tab').forEach(function (b) {
    b.setAttribute('aria-current', b.getAttribute('data-v') === v ? 'true' : 'false');
  });
  $('#alFilms').querySelector('.al-count').textContent = SRC.length;
  for (var a in AXIS) {
    var sec = $('#al' + a.charAt(0).toUpperCase() + a.slice(1));
    sec.querySelector('.al-count').textContent =
      TH.filter(function (t) { return t.x === sec.id.slice(2).toLowerCase(); }).length;
  }
  if (v === 'films') paintFilms();
  if (AXIS[v]) paintAxis(v);
  if (v !== 'film') { st.last = v; save(); }
}

var filmBack = 'films';
function openFilm(id) {
  if (!srcOf(id)) return;
  var now = document.documentElement.getAttribute('data-view');
  if (now !== 'film' && now !== 'open') filmBack = now;
  paintFilm(id);
  view('film');
}

document.addEventListener('click', function (e) {
  var t = e.target.closest ? e.target.closest('.al-tab, .al-pill, .al-f, #alOpenB, #alFilmX') : null;
  if (!t) return;
  if (t.id === 'alOpenB') return view(VIEWS.indexOf(st.last) > 0 && st.last !== 'film' ? st.last : 'films');
  if (t.id === 'alFilmX') return view(filmBack);
  var id = t.getAttribute && t.getAttribute('data-src');
  if (id) return openFilm(id);
  if (t.classList.contains('al-tab')) return view(t.getAttribute('data-v'));
});

view('open');
window.alDrive = { view: view, openFilm: openFilm };

}());
</script>
