  { s: "surf", x: "mindset", n: "Coordination of Intention", b: "Treat Everything as Favourable",
    t: "Zeland's practice of deliberately assuming every event is working in your favour, especially the ones that look like setbacks, because the interpretation decides which line you move onto next.",
    l: "You have no way of knowing what a setback is for, and you are going to assign it a meaning either way. Assigning the favourable one costs nothing and changes what you do next, which is the only part you control." },
  { s: "surf", x: "internal", n: "The Soul and the Mind Must Agree", b: "Wanting What You Say You Want",
    t: "Zeland's condition for anything working at all: the mind's stated goal and the soul's actual feeling have to be the same thing. Most goals are the mind's, borrowed and respectable, and the soul is silent about them.",
    l: "Check whether the thing you are pursuing produces any feeling at all when you imagine already having it. If it does not, you took it from somebody else, and no amount of discipline makes a borrowed goal work." },
  { s: "surf", x: "internal", n: "Frailing", b: "Stop Asking, Start Giving",
    t: "The technique of moving attention entirely off what you want from a person and onto what they want. Zeland's claim is that this releases the potential which was blocking it in the first place.",
    l: "Whatever you want badly from another person is what your presence is currently demanding, and they can feel it. Turn the whole of your attention onto what they need and the thing you wanted becomes available." },
  { s: "surf", x: "internal", n: "The Watcher", b: "Never Fully Absorbed",
    t: "Zeland's instruction to keep part of your attention as an observer, so that you are never completely inside the role you are playing. Absorption is how pendulums take hold.",
    l: "You can act with full commitment and still keep a piece of yourself watching. That piece is the whole of what lets you stop mid-argument, mid-spiral, mid-trade. Without it you find out what you did afterwards." },
  { s: "surf", x: "external", n: "Pendulums", b: "Structures That Feed on Attention",
    t: "Zeland's name for any structure — a movement, a company, an argument, a fandom — that exists by absorbing the energy of its adherents and grows by provoking reactions. It is not conscious and it does not care about you. It needs attention.",
    l: "Anything designed to provoke a reaction from you is a structure feeding. The tell is that responding feels urgent and important. You do not win by arguing better, you win by failing to show up." },
  { s: "surf", x: "external", n: "The Balancing Forces", b: "Nature Removes Every Distortion",
    t: "Any excess potential — idolising, despising, desperate wanting, contempt — creates an imbalance, and the balancing forces act to remove it, generally by handing you the opposite of what you were holding.",
    l: "Whenever something is going too well in your own telling of it, check what you have inflated. Reality has no opinion about you and it does level, and it does it at the least convenient moment by design." },
  { s: "surf", x: "external", n: "The Wave of Fortune", b: "Momentum Is Real and It Is Fragile",
    t: "Zeland describes a line where things begin going well, and the ordinary human reaction — pointing it out, growing suspicious, waiting for the catch — is exactly what knocks you off it.",
    l: "When a run starts, the most dangerous thing you can do is comment on it. Notice, accept, continue. Most good runs are ended by the person having them deciding it cannot last." },
  { s: "surf", x: "karmic", n: "You Cannot Take a Line You Do Not Match", b: "Become It First",
    t: "Zeland's rule that you only move onto a line whose parameters match what you are radiating, so the sequence is always inner change first and outer arrival second, never the reverse.",
    l: "The thing you want will not arrive to the person you currently are, not because you are unworthy but because the two do not fit together. Find out what that person does on an ordinary Tuesday and do that." },
  { s: "surf", x: "karmic", n: "Pendulums Punish Their Own", b: "What You Join Owns You",
    t: "Zeland's warning that a pendulum rewards adherence and turns on anybody who stops feeding it, and that the people who serve it hardest are consumed first.",
    l: "Anything that offers you an identity in exchange for loyalty is charging you, and the bill is your attention for the rest of your life. Find out what happens to the people who try to leave." },
  { s: "surf", x: "karmic", n: "The Borrowed Goal", b: "It Cost the Decade",
    t: "Zeland's claim that most people spend their lives on a goal imposed by a pendulum, and that arriving at it produces nothing at all, which is the return on an aim that was never theirs.",
    l: "Getting somebody else's goal is worse than missing your own, because you spent the years and cannot say what went wrong. Work out whose idea it was, honestly, before you spend another one." },
  { s: "para", x: "mindset", n: "Results Are the Paradigm Speaking", b: "Not Your Desire, Not Your Will",
    t: "Proctor's central claim: your results are an exact expression of your conditioning rather than of what you want. It is why people return to the same income, the same weight and the same kind of relationship repeatedly.",
    l: "Read your results as a readout rather than as a verdict. They are telling you what is installed. Fighting them with effort while the programme is unchanged is why the same year keeps happening." },
  { s: "para", x: "mindset", n: "The Stick Person", b: "Conscious, Subconscious, Body",
    t: "Proctor's diagram: the conscious mind chooses, the subconscious accepts without judgement whatever is impressed on it, and the body acts it out. Nothing reaches the body except through the middle layer.",
    l: "You cannot install anything by deciding it once. That middle layer accepts by repetition and emotion only, which is why every plan that relied on a single moment of clarity was gone by the Wednesday." },
  { s: "para", x: "mindset", n: "A Worthy Ideal", b: "Pick the One You Cannot See the Path To",
    t: "Proctor separates three kinds of goal: the one you know how to reach, the one you think you can reach, and the one you have no idea how to reach. He insists only the third changes anything about you.",
    l: "A goal you know how to hit is a schedule, and it will leave you exactly as you are. Pick the one where you genuinely cannot see the route, because the not knowing is the entire mechanism." },
  { s: "para", x: "internal", n: "The Terror Barrier", b: "The Wall Just Before the Change",
    t: "Proctor's name for the point where you move toward the new result and the paradigm produces fear, doubt and the urge to return to what is familiar. He says almost everybody bounces off it and calls it common sense.",
    l: "The fear arriving is the signal that you are at the edge, not the signal that you were wrong. It feels identical to good judgement, it comes with reasons, and everybody who got through describes it the same way." },
  { s: "para", x: "internal", n: "It Was Installed Before You Could Object", b: "Most of It Is Not Yours",
    t: "Proctor's position is that the paradigm is largely formed in early childhood out of the surrounding environment, and therefore contains the beliefs of people who never consulted you about any of it.",
    l: "Most of what you assume about money, work and what is possible for somebody like you was put there by people doing their best in a different decade. None of it was chosen and all of it is still running." },
  { s: "para", x: "internal", n: "Repetition, or an Emotional Event", b: "The Only Two Doors",
    t: "Proctor says a paradigm changes in exactly two ways: a significant emotional event, or constant spaced repetition. You cannot schedule the first one.",
    l: "The only available lever is repetition, done daily, for long enough to be boring. Everybody wants the emotional event because it is fast, and waiting for one is how a decade passes unchanged." },
  { s: "para", x: "external", n: "You Will Recreate the Circumstances", b: "The Environment Reflects the Programme",
    t: "Proctor's claim that people who change their circumstances without changing the paradigm return to equivalent ones: the lottery winner, the weight regained, the same argument with a different person.",
    l: "If a problem has followed you through three jobs or three relationships it is not the jobs. That is unwelcome and it is also the best news available, because the part you can reach is the part causing it." },
  { s: "para", x: "external", n: "Money Is an Effect", b: "Go at the Cause",
    t: "Proctor, following Wattles, treats money as an effect of service rendered and of the mind that produced it, which makes going directly at the money going at the wrong end of the chain.",
    l: "The income is downstream of the value and the value is downstream of what you are. Going at the number directly is why so much effort produces so little, and the order of the chain is not negotiable." },
  { s: "para", x: "external", n: "Proximity Reinstalls It", b: "Everybody Near You Holds the Old Programme",
    t: "Proctor's insistence that the people around you carry the conditioning you are trying to leave, and will restate it daily without any malice at all.",
    l: "The reinstallation is continuous and nobody is doing it on purpose. You do not need to leave anybody, but you do need deliberate hours somewhere else, or every gain is overwritten by an ordinary week." },
  { s: "para", x: "karmic", n: "You Get What You Are", b: "Not What You Want",
    t: "Proctor's version of attraction has no mysticism he will not explain: what you consistently are in thought and feeling produces the actions and the perception that produce the results. Wanting has no mechanism at all.",
    l: "Wanting is not an input to anything. Being is, because being decides what you notice, what you attempt and what you agree to, and those three make the whole outcome." },
  { s: "para", x: "karmic", n: "The Same Year, Repeated", b: "Effort Inside an Unchanged Programme",
    t: "Proctor's most confronting point: a person can work extremely hard for thirty years inside an unchanged paradigm and arrive precisely where the paradigm always said they would.",
    l: "Effort inside an unchanged programme produces a more exhausting version of the same result. Before you add hours, find out whether hours were ever the constraint, because they usually are not." },
  { s: "para", x: "karmic", n: "Impressed, Then Expressed", b: "The Return Arrives as Circumstance",
    t: "The lineage claim running from Haanel through Hill to Proctor: whatever is impressed on the subconscious is expressed as events, and the return arrives looking like luck and circumstance.",
    l: "You are impressing something every day whether or not you chose the content. It returns later, dressed as circumstance, and by then the connection is invisible. Choose the content now, while it is cheap." },
  { s: "feel", x: "mindset", n: "Think From the End", b: "Not Of It",
    t: "Neville's distinction, and the one everything else rests on. Thinking OF a thing keeps you outside it and confirms you do not have it. Thinking FROM it means assuming the state of already having it and looking at the world from there.",
    l: "Almost all visualising is done from outside, watching yourself get it, which is a rehearsal of absence. The shift is to ask what you would be noticing, saying and doing if it were already done, and then do that." },
  { s: "feel", x: "mindset", n: "Assumption Precedes Evidence", b: "The Order Is Not Negotiable",
    t: "The claim is that the state is assumed first and the facts rearrange to match, never the reverse, and that waiting for evidence before assuming is the whole of why nothing moves.",
    l: "You are waiting to feel like the person before you behave like them, and the order runs the other way. Your current evidence is not a reason, it is a record of the previous assumption." },
  { s: "feel", x: "mindset", n: "A Controlled Imagination", b: "And a Well-Sustained Attention",
    t: "Neville calls this the great secret in plain words. Not effort, not affirmation: the capacity to hold one scene and one feeling without drifting, deliberately and repeatedly.",
    l: "The scarce thing is attention held on one object for more than about forty seconds. It is trainable and almost nobody trains it, which is why this technique is simultaneously public and rare." },
  { s: "feel", x: "internal", n: "Feeling Is the Secret", b: "The Subconscious Does Not Read Words",
    t: "The title and the mechanism. The subconscious accepts what is felt as true rather than what is stated, so an affirmation repeated without the corresponding feeling impresses nothing at all.",
    l: "Saying it is not doing it. The test is whether the statement produces any physical change in you when you make it. If it does not, you have been talking, and talking has no route in." },
  { s: "feel", x: "internal", n: "Your Habitual Mood", b: "The State You Drift Back To",
    t: "Neville's instruction to catch the mood you habitually return to, because he treats habitual mood rather than occasional effort as the actual creative agent, and it is usually one nobody chose.",
    l: "Whatever state you spend the most hours in is what is being impressed, and it is almost always the one you drift back to rather than the one you visit on purpose. That is the number worth changing." },
  { s: "feel", x: "internal", n: "The Chief Delusion", b: "Nothing Outside Is the Cause",
    t: "Neville's hardest line: that man's chief delusion is his conviction that there are causes other than his own state of consciousness. Every external explanation is, in his frame, an evasion.",
    l: "This is uncomfortable and it is useful even taken only as a discipline. Every time you locate the cause outside yourself you have also located the solution outside yourself, and you cannot reach it there." },
  { s: "feel", x: "external", n: "Sleep Is the Doorway", b: "The Drowsy State",
    t: "Neville's practical instruction: the state on the edge of sleep, where the conscious mind is quiet, is when the assumption should be held. The last thing in mind before sleep is the impression that takes.",
    l: "You are already doing this every night with whatever was last on your mind, which for most people is a screen or an argument. That slot is a mechanism whether or not you use it deliberately." },
  { s: "feel", x: "external", n: "Prayer Is a State", b: "Asking Confirms Absence",
    t: "Neville redefines prayer as the assumption of the wish already fulfilled, held in a state akin to sleep, and points out that petitioning confirms the thing is not had, which is the state actually being impressed.",
    l: "Whatever form your asking takes, it restates the absence every time. Notice how much of your inner life is spent confirming, in detail, that you do not yet have it." },
  { s: "feel", x: "external", n: "The World Is the Report", b: "Circumstance Is Not an Authority",
    t: "In Neville's frame the outer world is the printed record of states already held: a report rather than a verdict, and therefore never a reason to change the assumption.",
    l: "Whether or not you accept the metaphysics, treating your circumstances as data about what you have been rather than as a ruling on what you can be is a strictly better position to act from." },
  { s: "feel", x: "karmic", n: "What Is Impressed Is Expressed", b: "There Is No Filter",
    t: "Neville's mechanism runs both ways. The subconscious does not evaluate, it forms, and whatever is felt as true is brought into being, including the things nobody would choose.",
    l: "There is no filter on the input. The fear you rehearse in detail is receiving exactly the same treatment as the goal you visualise for five minutes, and one of those is getting far more hours." },
  { s: "feel", x: "karmic", n: "The Interval", b: "Remaining Faithful With No Evidence",
    t: "Neville's repeated point that between the assumption and its appearance there is a period in which nothing confirms it, and that abandoning the state during that period is the only real failure available.",
    l: "That gap exists in every version of this, secular or not. What you do in the stretch where there is no evidence is the entire difference, and it is the part no technique can do for you." },
  { s: "feel", x: "karmic", n: "Today Is Last Year Arriving", b: "Read It as a Return",
    t: "Neville's claim that the present is the harvest of states previously held, which makes today a report on last year rather than an accident that happened to you.",
    l: "Read your current life as the return on what you were consistently being twelve months ago. Whether or not the mechanism is what he says it is, the correlation is strong enough to act on." },
  { s: "sogr", x: "mindset", n: "The Creative Mind", b: "Not the Competitive One",
    t: "Wattles' core distinction. The competitive mind sees a fixed supply to be fought over; the creative mind brings something into being that was not there. He argues nothing held on the competitive plane is secure, because it can be taken the same way it was got.",
    l: "Ask honestly whether you are trying to take a share or to make something new. The first is a fight with everybody and the second has no competitors at all, and most people never notice which one they are doing." },
  { s: "sogr", x: "mindset", n: "A Certain Way", b: "The Method Is the Asset",
    t: "Wattles insists that getting rich has nothing to do with the business you are in, the place you live or your talent, and everything to do with doing things in a certain way, which is learnable and repeatable.",
    l: "You are probably in a good enough field. The variable is how you operate inside it, and that is the part you can improve this week. Changing the field is usually a way of avoiding changing the method." },
  { s: "sogr", x: "mindset", n: "Gratitude Is a Mechanism", b: "Not a Sentiment",
    t: "Wattles gives it a chapter and treats it functionally: gratitude holds the mind on what is working, and a mind fixed on lack produces the actions of lack.",
    l: "It is not about being pleasant. The direction of your attention decides what you look for, and a person cataloguing what is missing behaves completely differently from one cataloguing what is there." },
  { s: "sogr", x: "internal", n: "Hold the Picture, Not the Method", b: "Do Not Supply the How",
    t: "Wattles says to form a clear mental image, hold it with purpose and faith, and specifically not to concern yourself with the route by which it arrives. The how is not yours to provide.",
    l: "Most planning is anxiety wearing a spreadsheet. Be precise about the outcome and loose about the route, because insisting on a route you can already see limits you to what you can currently imagine." },
  { s: "sogr", x: "internal", n: "Act in Your Present Business", b: "Start From Where You Are",
    t: "Wattles is blunt that you act now, in the job and the place you are already in, doing everything you can do each day, and that waiting for better circumstances is the commonest failure of all.",
    l: "There is no better starting position coming. The actions available today, done completely, are the whole mechanism, and the search for a better starting point is the thing consuming the years." },
  { s: "sogr", x: "internal", n: "Efficient Action", b: "Do Not Hurry and Do Not Skip",
    t: "His instruction is to do each day's work efficiently and completely rather than rushing at tomorrow's, because hurried action is inefficient action and incomplete days accumulate.",
    l: "Doing today's work completely is unglamorous and it is the whole of it. Rushing is a way of feeling productive while leaving a trail of half-finished things that each cost double later." },
  { s: "sogr", x: "external", n: "Give More in Use Value Than You Take", b: "The Increase",
    t: "Wattles' central mechanism: everybody you deal with should be better off for having dealt with you, and the business is built out of that rather than out of extraction.",
    l: "Make sure the person on the other side of every transaction genuinely gained. It is slower, it produces a reputation that works while you sleep, and it removes the need to keep finding new people." },
  { s: "sogr", x: "external", n: "There Is No Shortage", b: "Supply Is Not the Constraint",
    t: "Wattles argues the supply of everything worth having is effectively unlimited, and that acting from scarcity produces exactly the results scarcity predicts.",
    l: "Whether or not the metaphysics holds, check what you are assuming about the size of the opportunity. Almost everybody is operating on an estimate they inherited and have never once tested." },
  { s: "sogr", x: "external", n: "You Are Not Competing", b: "Nobody Else Winning Costs You",
    t: "His claim that there is no need to take from anyone, drive a hard bargain or cheat, because the creative plane has room and the competitive plane is where the fear lives.",
    l: "The feeling that somebody else winning costs you something is almost always false and always expensive. It changes who you are willing to help, and that is the most valuable thing you have to trade." },
  { s: "sogr", x: "karmic", n: "The Increase Comes Back", b: "From Somewhere Else",
    t: "Wattles ties the system together here: the person who consistently gives more than they take becomes the one everybody wants to deal with, and the return is structural rather than moral.",
    l: "The return does not come from the transaction it was given in. It comes from the ones that happen because of it, later, which is exactly why the practice looks unrewarded for so long." },
  { s: "sogr", x: "karmic", n: "Thought Held Long Enough", b: "Wavering Undoes It",
    t: "Wattles' mechanism requires sustained impression over time and he is explicit that wavering cancels it. Alternating between the picture and the doubt is what produces nothing at all.",
    l: "Alternating between the plan and the doubt is worse than either, because nothing ever accumulates. Pick one and give it long enough to report back, and let the report be the only thing that changes it." },
  { s: "sogr", x: "karmic", n: "The Plane You Left", b: "What the Shortcut Actually Costs",
    t: "Wattles' warning that the moment you move to taking, you have left the plane on which making was possible, and that everything gained on the other one is insecure by construction.",
    l: "Every shortcut that takes from somebody also removes you from the position where you were building. The loss is not the ethics of it, it is that you can no longer see the other set of moves." },
  { s: "cyb", x: "mindset", n: "You Cannot Outperform the Self-Image", b: "The Ceiling Is Internal",
    t: "Maltz's founding observation from plastic surgery: patients whose faces were corrected often did not change at all, because the picture they held of themselves had not. The self-image governs everything downstream.",
    l: "You have a number in your head for what somebody like you gets, and your performance keeps arriving near it. Raising that ceiling is a different job from working harder underneath it, and only one of the two works." },
  { s: "cyb", x: "mindset", n: "A Goal-Striving Mechanism", b: "Give It a Target",
    t: "Maltz's cybernetic model: the brain works like a guidance system that self-corrects toward a target, but only once a target has actually been set. With none, it has nothing to correct toward.",
    l: "Most people are steering constantly with no destination and calling it being busy. Set one target clearly enough to be wrong about, and the correcting starts happening without you having to manage it." },
  { s: "cyb", x: "mindset", n: "Imagination Is the Same Input", b: "Rehearsal Counts",
    t: "Maltz's claim, later borne out in sports psychology, that the nervous system does not fully distinguish a vividly imagined experience from a real one, which is why mental rehearsal produces measurable improvement.",
    l: "You are rehearsing something every day already, usually the conversation going badly. Spend the same minutes rehearsing it going well, in detail, and the system updates on that exactly the same way." },
  { s: "cyb", x: "internal", n: "The Theatre of the Mind", b: "Thirty Minutes, Vividly",
    t: "Maltz's prescribed exercise: half an hour a day alone, seeing yourself acting as the person you intend to be, in detail, with the feelings included rather than described.",
    l: "It is the same instruction the whole genre gives and Maltz supplies the reason: the input is what the mechanism steers by. Half an hour is the price, and almost nobody pays it because nothing visible happens for weeks." },
  { s: "cyb", x: "internal", n: "Emotional Scars", b: "A Defence That Outlived the Danger",
    t: "Maltz treats emotional scarring the way he treated the physical kind: something that once protected you and now prevents ordinary contact. The guard stays up long after the threat has gone.",
    l: "Whatever you built to protect yourself at nineteen is still running and it is now the thing stopping you. It was correct then. Check whether the situation it was built for still exists." },
  { s: "cyb", x: "internal", n: "Try Softer", b: "Effort Jams the Mechanism",
    t: "Maltz gives a great deal of the book to relaxation, on the model that excessive effort and anxiety interfere with the servo-mechanism's own corrections.",
    l: "Past a point, effort degrades performance rather than improving it, and the feeling of straining is the signal. The correction happens on its own if you stop interfering, which is the hardest instruction here to follow." },
  { s: "cyb", x: "external", n: "Twenty-One Days", b: "Nothing Is Reporting Yet",
    t: "Maltz observed that patients took roughly three weeks to stop seeing the old face in the mirror, and generalised it: a new mental image takes about that long to settle.",
    l: "Whatever you are installing, nothing is decided in the first three weeks and almost everybody quits inside them. Treat that stretch as a cost rather than as a test, because it is not reporting anything yet." },
  { s: "cyb", x: "external", n: "The Failure Mechanism", b: "A Warning Light, Not a Verdict",
    t: "Maltz lists the signature: frustration, aggressiveness, insecurity, loneliness, uncertainty, resentment, emptiness. He treats the set as a system fault rather than as a statement about character.",
    l: "Those feelings are diagnostic rather than descriptive. When several arrive together you are not a worse person that month, you are a system with a bad input, and the input is findable." },
  { s: "cyb", x: "external", n: "It Was the Sentence, Not the Event", b: "How the Image Got Built",
    t: "Maltz is clear that the self-image is built out of interpreted experience, including what people said, and that what got stored was the interpretation rather than the event.",
    l: "The thing shaping you was never what happened, it was the sentence you wrote about it afterwards. That sentence is editable in a way the event is not, and almost nobody goes back to read it." },
  { s: "cyb", x: "karmic", n: "The Loop Makes Its Own Evidence", b: "Self-Confirming by Design",
    t: "Maltz's mechanism is circular on purpose: the image produces the behaviour, the behaviour produces the results, and the results confirm the image. It reinforces in both directions equally well.",
    l: "Your evidence about yourself was generated by the belief it is now supporting. That is why arguing with the evidence never works, and why changing the input at the top is the only place the loop can break." },
  { s: "cyb", x: "karmic", n: "You Are Practising Something Daily", b: "Count the Hours Honestly",
    t: "Because the nervous system does not distinguish the source, the worry you run in full detail trains the same mechanism as the rehearsal you do deliberately, and there is far more of the first.",
    l: "You are practising something every single day. Count the hours honestly and the overwhelming majority went into rehearsing the thing you are afraid of, in high definition, with the feelings included." },
  { s: "cyb", x: "karmic", n: "The Scar Charges Rent", b: "Only You Are Paying It",
    t: "Maltz treats a held injury as an ongoing cost carried by the holder: the emotional scar keeps the wound live and keeps the behaviour it produced in place for decades.",
    l: "Whatever you are still carrying is charging you daily and the other person is not being billed at all. Putting it down is not a favour to them and it is not a moral act. It is a repossession." },
  { s: "subc", x: "mindset", n: "It Does Not Argue", b: "The Subconscious Accepts",
    t: "Murphy argues that the subconscious accepts whatever the conscious mind believes to be true, without judging whether it is good or bad for you.",
    l: "What you repeatedly believe gets built into your behaviour. Watch what you accept as true about yourself, because some part of you is taking notes." },
  { s: "subc", x: "mindset", n: "The Law of Belief", b: "What You Expect Arrives",
    t: "The book presents belief as the central law of the mind, claiming that what you truly expect tends to shape what happens to you.",
    l: "Expectation shapes your effort, your attention and the chances you take. Expect good outcomes and you act in ways that make them more likely." },
  { s: "subc", x: "mindset", n: "It Takes the Negative Too", b: "The Mind Is Impartial",
    t: "Murphy stresses that the subconscious works as readily on fearful thoughts as on hopeful ones, so a worry repeated is also an instruction.",
    l: "Fear repeated is a plan you never meant to make. Replace worry with a clear picture of what you want, because the mind follows whichever one you feed it." },
  { s: "subc", x: "internal", n: "Before Sleep", b: "The Drowsy State",
    t: "He recommends impressing an idea on the mind in the relaxed, drowsy state just before sleep, when he says resistance is at its lowest.",
    l: "The last thoughts before sleep sink the deepest. End the day on the picture you want to grow, not on the problems you want to escape." },
  { s: "subc", x: "internal", n: "Forgiveness as Release", b: "Resentment Is Self-Poisoning",
    t: "The book argues that resentment and hatred harm the person holding them, and treats forgiveness as a way of freeing your own mind.",
    l: "Holding a grudge keeps you tied to the person you resent. Let it go for your own sake, because you are the one still carrying it." },
  { s: "subc", x: "internal", n: "Sleep On It", b: "Answers Come Overnight",
    t: "Murphy describes handing a problem over to the subconscious before sleep and waking with an answer, which many people also report.",
    l: "Stop forcing a solution and give your mind room to work. Some of your best answers arrive only after you stop chasing them." },
  { s: "subc", x: "external", n: "Do Not Envy Wealth", b: "Criticism Pushes It Away",
    t: "He warns that resenting or criticising people who have money trains your own mind to reject wealth.",
    l: "Admire success rather than resenting it. You cannot build what you secretly despise, so check honestly how you feel about the thing you say you want." },
  { s: "subc", x: "external", n: "Picture the Happy Ending", b: "Imagine It Done",
    t: "The book repeatedly advises imagining the result you want as already complete, rather than dwelling on the steps or the obstacles in the way.",

  { s: "subc", x: "external", n: "How You Speak of Others", b: "Words Shape Relationships",

        themesOfSrc(x.i).forEach(function (t) {
          if ((t.t + ' ' + t.l).toLowerCase().indexOf(back) >= 0)
            throw new Error(x.n + ' is written backwards as "' + back + '" in ' + t.n);
        });
      }
    });
  }());
  /* Four axes over one life will collapse into each other unless
     something refuses it, and the cheapest refusal is the name. */
  /* The index draws a heading per run of one group, so a kind holding
     more than one needs a label for each, and the runs have to be
     contiguous or the same heading is drawn twice. A missing label is a
     blank heading, which reads as a rendering fault rather than a group. */
  ['book'].forEach(function (k) {
    var gs = [], last = null;
    SRC.filter(function (x) { return x.k === k; }).forEach(function (x) {
      if (!x.g) throw new Error('no group for ' + x.n);
      if (x.g === last) return;
      if (gs.indexOf(x.g) >= 0) throw new Error('group ' + x.g + ' is split');
      gs.push(x.g); last = x.g;
    });
    if (gs.length > 1) gs.forEach(function (g) {
      if (!GROUP[g]) throw new Error('no label for group ' + g);
    });
  });
  var names = {};
  TH.forEach(function (t) {
    if (names[t.n]) throw new Error('two themes called ' + t.n);
    names[t.n] = true;
  });
}());

function mask(p) {
  /* AT THE END MEANS NOTHING BUT PADDING IS LEFT BELOW. Kept with one card
     overflows by its own foot padding alone, so the fade stayed on and
     the only card on the screen was drawn half dissolved, as if there
     were more to scroll to. */
  var f = function () {
    var pad = parseFloat(getComputedStyle(p).paddingBottom) || 0;
    p.classList.toggle('is-end', p.scrollTop + p.clientHeight >= p.scrollHeight - pad - 2);
  };
  if (!p.alMask) { p.alMask = f; p.addEventListener('scroll', f, { passive: true }); }
  p.alMask();
}


function srcOf(id) { return SRC.filter(function (x) { return x.i === id; })[0]; }
function themesOf(id, ax) { return TH.filter(function (t) { return t.s === id && t.x === ax; }); }

var CHEV = {
  down:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
  right: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>'
};
function chev(d) { var n = el('span', 'al-chev'); n.setAttribute('aria-hidden', 'true'); n.innerHTML = CHEV[d]; return n; }

/* The two lines of a row, bright over dim. One builder for the index
   and the themes, so a row is one object wherever it is drawn. */
function rowText(a, b) {
  var t = el('span', 'al-rt');
  t.appendChild(el('span', 'al-tn', a));
  t.appendChild(el('span', 'al-tsub', b));
  return t;
}

/* ONE THEME, DRAWN ONCE, on a source page and on Kept alike — two
   constructions of one object is how the two come to disagree.

   THE BODY IS BUILT WHETHER OR NOT IT IS OPEN, and put away with
   `hidden`. Built only when opened, the prose would not be in the
   document for anything that reads it — and the chips on it are the
   same chips mark() finds by key to keep every copy in step. The id is
   prefixed by the pane it is in, because both panes stay painted and one
   theme can be on both at once. */
function card(t, ctx, open) {
  var d = el('div', 'al-th');
  d.setAttribute('data-x', t.x);
  var id = 'al-' + ctx + '-' + t.k.replace(/:/g, '-');
  var h = el('h3', 'al-th-h');
  var b = el('button', 'al-row');
  b.setAttribute('aria-expanded', open ? 'true' : 'false');
  b.setAttribute('aria-controls', id);
  b.appendChild(rowText(t.n, t.b));
  b.appendChild(chev('down'));
  h.appendChild(b);
  d.appendChild(h);
  var body = el('div', 'al-body');
  body.id = id;
  body.hidden = !open;
  body.appendChild(el('div', 'al-caps al-tl', 'Key theme'));
  body.appendChild(el('p', 'al-tb', t.t));
  body.appendChild(el('div', 'al-caps al-tl is-les', 'The lesson'));
  body.appendChild(el('p', 'al-tb is-les', t.l));
  /* AT THE FOOT, which is where you are when you have read it. */
  var a = el('div', 'al-acts');
  a.appendChild(mkBtn('pin', 'Pin', t.k));
  a.appendChild(mkBtn('hi', 'Highlight', t.k));
  body.appendChild(a);
  d.appendChild(body);
  return d;
}

/* Opening a row changes how tall the pane's content is, so whether the
   foot's fade is owed changes with it. */
function toggle(b) {
  var open = b.getAttribute('aria-expanded') !== 'true';
  b.setAttribute('aria-expanded', open ? 'true' : 'false');
  var body = b.closest('.al-th, .al-ch').querySelector('.al-body, .al-chb');
  if (body) body.hidden = !open;
  var p = b.closest('.al-pane');
  if (p) mask(p);
}

/* A CHAPTER IS A ROW THAT OPENS, drawn like a theme and built apart from
   one: it has no key, so there is nothing to pin or highlight, and no
   axis, so it takes no hue. Its body class differs from a theme's so
   the count of themes drawn stays a count of themes. */
function foldRow(id, name, sub, parts) {
  var d = el('div', 'al-ch');
  var h = el('h3', 'al-th-h');
  var b = el('button', 'al-row');
  b.setAttribute('aria-expanded', 'false');
  b.setAttribute('aria-controls', id);
  b.appendChild(rowText(name, sub));
  b.appendChild(chev('down'));
  h.appendChild(b);
  d.appendChild(h);
  var body = el('div', 'al-chb');
  body.id = id;
  body.hidden = true;
  parts.forEach(function (q) {
    body.appendChild(el('div', 'al-caps al-tl' + (q[2] ? ' is-les' : ''), q[0]));
    body.appendChild(el('p', 'al-tb' + (q[2] ? ' is-les' : ''), q[1]));
  });
  d.appendChild(body);
  return d;
}

function chapterRow(source, q) {
  return foldRow('al-ch-' + source + '-' + q.c, q.n, 'Chapter ' + q.c + ' \u00B7 ' + q.b,
    [['What it says', q.t], ['What to do with it', q.l, 1]]);
}

/* A LAW IS A READING. The definition opens it, set larger and in the
   ink the way a lesson is, and the sections under it are the quiet step
   a reader goes through. No section is an instruction. */
function lawRow(q, i) {
  return foldRow('al-law-' + i, q.n, q.b,
    q.r.map(function (x, j) { return [x[0], x[1], j === 0 ? 1 : 0]; }));
}

function mkBtn(m, label, k) {
  var b = el('button', 'al-mk', label);
  b.setAttribute('data-mk', m);
  b.setAttribute('data-k', k);
  b.setAttribute('aria-pressed', marked(m, k) ? 'true' : 'false');
  return b;
}

/* A list's head says what the list is in the label register: the figure,
   then what it counts. Written from the data every time, because the
   same count written by hand went stale three times in one afternoon. */
function kick(sel, n, rest) {
  var h = $(sel + ' .al-head');
  h.querySelector('.al-count').textContent = n;
  h.querySelector('.al-kick-r').textContent = rest;
}

/* ONE INDEX PAINTER, TWO LISTS. A row that opens a page carries a
   chevron pointing where it goes; a row that opens in place points down.
   Spans inside the button rather than a heading, because a heading
   inside a button is invalid and a row in an index is not a heading. */
function paintIndex(kind) {
  var p = $('#al' + kind.charAt(0).toUpperCase() + kind.slice(1) + 'Pane'); p.textContent = '';
  var rows = SRC.filter(function (x) { return x.k + 's' === kind; });
  var gs = [], last = null;
  rows.forEach(function (x) { if (gs.indexOf(x.g) < 0) gs.push(x.g); });
  rows.forEach(function (x) {
    /* No data-x on it: a coloured heading means an axis everywhere else
       in this app, and this one names a kind of person. */
    if (gs.length > 1 && x.g !== last) {
      var g = el('div', 'al-grp al-caps');
      g.appendChild(el('span', null, GROUP[x.g]));
      g.appendChild(el('span', 'al-n', rows.filter(function (r) { return r.g === x.g; }).length));
      p.appendChild(g);
      last = x.g;
    }
    var b = el('button', 'al-f');
    b.setAttribute('data-src', x.i);
    b.appendChild(rowText(x.n, x.p));
    b.appendChild(chev('right'));
    p.appendChild(b);
  });
  mask(p);
}

function paintSource(id) {
  var x = srcOf(id); if (!x) return;
  var p = $('#alSourcePane'); p.textContent = '';
  var lead = el('div', 'al-lead');
  lead.appendChild(el('div', 'al-caps al-kick', x.p));
  lead.appendChild(el('h1', 'al-disp', x.n));
  lead.appendChild(el('p', 'al-sum', SUM[x.i]));
  p.appendChild(lead);
  var sh = el('div', 'al-sheet');
  var qs = QT[id] || {};
  if (CH[id]) {
    sh.appendChild(el('div', 'al-chh al-caps', 'By chapter'));
    CH[id].forEach(function (q) { sh.appendChild(chapterRow(id, q)); });
  }
  for (var a in AXIS) {
    var rows = themesOf(id, a);
    if (!rows.length) continue;
    var h = el('div', 'al-grp al-caps', AXIS[a]);
    h.setAttribute('data-x', a);
    sh.appendChild(h);
    if (qs[a]) {
      var q = el('blockquote', 'al-q');
      q.setAttribute('data-x', a);
      q.appendChild(el('p', 'al-qt', '\u201C' + qs[a] + '\u201D'));
      sh.appendChild(q);
    }
    rows.forEach(function (t) { sh.appendChild(card(t, 'src', false)); });
  }
  p.appendChild(sh);
  p.scrollTop = 0; mask(p);
}

/* THE LAWS ARE ONE LIST, NO GROUPS. Eleven rows that open, in the order
   the video gave them — which is not an order of importance, so none is
   implied by sorting. The one sentence above them is the claim this
   whole pane makes and the only caution it needs: these are rules from a
   tradition and not laws of physics. */
function paintLaws() {
  var p = $('#alLawsPane'); p.textContent = '';
  p.appendChild(el('p', 'al-note', 'Rules from the self-help tradition, not laws of physics.'));
  LAWS.forEach(function (q, i) { p.appendChild(lawRow(q, i)); });
  p.scrollTop = 0; mask(p);
}

/* ONE PAINTER FOR BOTH STOPS, grouped by source in the app's own order.
   The heading takes no hue: a pane that mixes four axes has no axis for
   a colour to be about. */
function paintKept() {
  var p = $('#alKeptPane'); p.textContent = '';
  var list = st[st.stop].map(thOf).filter(Boolean);
  kick('#alKept', list.length, st.stop === 'pin' ? 'pinned' : 'highlighted');
  [].forEach.call(document.querySelectorAll('#alKeptStops .al-stop'), function (b) {
    b.setAttribute('aria-current', b.getAttribute('data-st') === st.stop ? 'true' : 'false');
  });
  if (!list.length) {
    p.appendChild(el('p', 'al-empty', st.stop === 'pin'
      ? 'Nothing pinned. A pin is the short list you are working from now, so keep it short.'
      : 'Nothing highlighted. A highlight is a line that landed, and there is no limit on those.'));
    mask(p); return;
  }
  SRC.forEach(function (x) {
    var rows = list.filter(function (t) { return t.s === x.i; });
    if (!rows.length) return;
    p.appendChild(el('div', 'al-grp al-caps', x.n));
    rows.forEach(function (t) { p.appendChild(card(t, 'kept', true)); });
  });
  mask(p);
}

/* A STORED VIEW OUTLIVES THE CODE THAT WROTE IT. Four names left this
   list in one pass, and 'figures' was one of them, so a phone that was
   last on it has to open on the books rather than on a bar with nothing
   above it — which is
   what view()'s own fall-through already does, and why the list is
   written out rather than derived. */
var VIEWS = ['open', 'books', 'laws', 'kept', 'source'];
var COUNT = { book: 0, bookTh: 0 };
SRC.forEach(function (x) { COUNT[x.k]++; COUNT[x.k + 'Th'] += themesOfSrc(x.i).length; });
function view(v) {
  if (VIEWS.indexOf(v) < 0) v = 'books';
  document.documentElement.setAttribute('data-view', v);
  VIEWS.forEach(function (x) {
    var n = $('#al' + x.charAt(0).toUpperCase() + x.slice(1));
    if (n) n.classList.toggle('is-on', x === v);
  });
  $('#alNav').hidden = (v === 'open' || v === 'source');
  $('#alSourceX').hidden = (v !== 'source');
  document.querySelectorAll('.al-tab').forEach(function (b) {
    b.setAttribute('aria-current', b.getAttribute('data-v') === v ? 'true' : 'false');
  });
  kick('#alBooks', COUNT.book, 'books · ' + COUNT.bookTh + ' themes');
  kick('#alLaws', LAWS.length, 'laws');
  if (v === 'books') paintIndex(v);
  if (v === 'laws') paintLaws();
  if (v === 'kept') paintKept();
  if (v !== 'source') { st.last = v; save(); }
}

var sourceBack = 'books';
function openSource(id) {
  if (!srcOf(id)) return;
  var now = document.documentElement.getAttribute('data-view');
  if (now !== 'source' && now !== 'open') sourceBack = now;
  paintSource(id);
  view('source');
}

document.addEventListener('click', function (e) {
  var t = e.target.closest
    ? e.target.closest('.al-tab, .al-f, .al-stop, .al-mk, .al-row, #alOpenB, #alSourceX') : null;
  if (!t) return;
  var m = t.getAttribute && t.getAttribute('data-mk');
  if (m) return mark(m, t.getAttribute('data-k'));
  var stop = t.getAttribute && t.getAttribute('data-st');
  if (stop) { st.stop = stop; save(); return paintKept(); }
  if (t.classList.contains('al-row')) return toggle(t);
  if (t.id === 'alOpenB') return view(VIEWS.indexOf(st.last) > 0 && st.last !== 'source' ? st.last : 'books');
  if (t.id === 'alSourceX') return view(sourceBack);
  var id = t.getAttribute && t.getAttribute('data-src');
  if (id) return openSource(id);
  if (t.classList.contains('al-tab')) return view(t.getAttribute('data-v'));
});

/* THE FIGURES ON THE FIRST SCREEN ARE WRITTEN FROM THE DATA. The title
   and the paragraph under it said "seventeen" and "three hundred and
   five" by hand, and were wrong for a day after a source came out —
   nothing read them. A line of figures in the label register is what the
   reference does with a number anyway, and digits a check can read. */
$('#alOpenK').textContent = COUNT.book + ' books · ' + LAWS.length + ' laws · ' + TH.length + ' themes';

view('open');
/* views() rather than a list the probes keep their own copy of: two of
   them drove view('light') and view('lessons') for months — names
   renamed out from under them, which view() falls through to 'books'
   on — so one screen was measured three times and reported a pass. */
window.alDrive = { view: view, openSource: openSource, mark: mark, st: st, thOf: thOf,
                   views: function () { return VIEWS.slice(); } };

}());
</script>
</body>
</html>
