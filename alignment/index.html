<!doctype html>
<html lang="en" data-view="open">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0A08">
<title>Alignment</title>
<link rel="preload" href="../arc/fonts/Inter.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: 'Inter'; font-weight: 100 900; font-display: swap;
  src: url('../arc/fonts/Inter.woff2') format('woff2'); }

/*
  ALIGNMENT. Its own ground, its own type, its own everything — it reads
  none of the other keys and takes none of the shared shell.

  A PHOTOGRAPH IS A GUEST INSIDE A FRAME, NEVER THE PAGE. That is the
  whole construction and the first build got it backwards: the image
  filled the card, the card's own ground was never visible anywhere on
  screen, and every word was printed on a picture under a gradient laid
  there to keep it readable. A photograph that bleeds is a page. A
  photograph in a frame is an object. Interface lives in the MATERIAL
  around the picture, which is also where the room for chrome comes
  from.

  THE GRADE IS PER IMAGE, MEASURED, AND THE COMMENT THAT USED TO SIT
  HERE WAS FALSE. It claimed one filter pulled fourteen photographs
  into one warm family; measured, the set spanned 235 degrees of hue
  with five of twelve inside the band. Six reference screens holding a
  snow mountain, a face, a desert, a cyan swimming pool and a volcano
  all land inside hue 16-69, which no single transfer function does to
  a mixed library. So --ib rides each image and the shared grade only
  has to carry the hue.
*/

:root {
  --paper: #0B0A08;
  --ink: #FFFFFF;
  --dim: rgba(255,255,255,.72);
  --spent: rgba(255,255,255,.46);
  --hair: rgba(255,255,255,.14);
  --glass: rgba(255,255,255,.10);

  /* Chrome sits on a PLATE, not on glass. A 10% white wash over a lit
     photograph put the info glyph at 2.50:1 against the 3 a graphic
     needs, and no alpha of white fixes a ground that bright. */
  --plate: rgba(11,10,8,.56);

  --card: #1A1611;
  --card-edge: rgba(255,255,255,.08);

  --r-card: 26px;
  --r-in: 18px;
  --r-sq: 14px;
  --r-pill: 999px;

  /* Six vertical steps. The first build shipped eleven — 8 10 12 14 18
     20 22 24 26 34 38 — which is this repo's own runaway-scale fault in
     a third dimension after thirty type sizes and thirteen leadings. */
  --v1: 6px;  --v2: 10px; --v3: 16px;
  --v4: 22px; --v5: 34px; --v6: 52px;

  --gut: 22px;
  --gut-list: 18px;
  --tap: 44px;

  --grade: saturate(.30) sepia(.55) contrast(1.02) brightness(1.20);

  /* THE VEIL WAS INVERTED. Both references are brightest at the very
     top of the screen — row medians of 222, 223, 223 — and never fall
     below L24 at the foot. The first build read 57 at the top and
     peaked in the middle, because a 30% black wash sat exactly where
     the references put their light. */
  --veil: linear-gradient(180deg,
      rgba(11,10,8,.00)   0%,
      rgba(11,10,8,.00)  44%,
      rgba(11,10,8,.34)  68%,
      rgba(11,10,8,.74)  90%,
      rgba(11,10,8,.82) 100%);

  /* The list ground is a different room, and it has a FLOOR. The
     reference's olive falls for its top 45% and is then flat at L46-49
     to the bottom edge; the first build ramped monotonically to L16.
     It is also deeper than the reference's, which is a cost rather
     than a preference: on that lightness pure white maxes at 3.05:1,
     so no alpha of white carries 10px type there — the references put
     DARK large type on their olive and nothing small at all. */
  --sage-g: linear-gradient(180deg,
      rgba(80,82,56,.97)   0%,
      rgba(72,74,51,.97)  22%,
      rgba(52,53,41,.97)  48%,
      rgba(44,44,40,.97)  66%,
      rgba(44,44,40,.97) 100%);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body { height: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: 'Inter', -apple-system, system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  overflow: hidden;
  overscroll-behavior: none;
}

button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
[hidden] { display: none !important; }

.al-disp   { font-size: 38px; font-weight: 450; line-height: 1.00; letter-spacing: -.03em; }
.al-disp-s { font-size: 28px; font-weight: 450; line-height: 1.02; letter-spacing: -.024em; }
.al-caps   { font-size: 10px; font-weight: 600; letter-spacing: .5em; text-transform: uppercase; color: var(--dim); }
.al-body   { font-size: 16px; font-weight: 400; line-height: 1.50; color: var(--dim); }
.al-note   { font-size: 13px; font-weight: 450; line-height: 1.45; color: var(--dim); }

.al-bg { position: fixed; inset: 0; z-index: 0; }
.al-bg i {
  position: absolute; inset: 0; display: block;
  background-size: cover; background-position: center;
  filter: var(--grade) brightness(var(--ib, 1));
  transform: scale(1.04);
}
.al-bg u { position: absolute; inset: 0; display: block; background: var(--veil); }
.al-bg.is-sage i { filter: var(--grade) brightness(var(--ib, 1)) blur(46px); transform: scale(1.3); }
.al-bg.is-sage u { background: var(--sage-g); }

.al-view { position: relative; z-index: 1; height: 100%; display: none; flex-direction: column; }
.al-view.is-on { display: flex; }

#alOpen { justify-content: flex-end; padding: 0 var(--gut) var(--v5); }
#alOpen .al-mark { position: absolute; top: calc(var(--v4) + env(safe-area-inset-top, 0px)); left: var(--gut); }
.al-mark { display: flex; align-items: center; gap: 9px; }
.al-mark svg { width: 20px; height: 20px; display: block; }
.al-mark b { font-size: 13px; font-weight: 500; letter-spacing: 1.2em; text-transform: uppercase; }
#alOpen .al-disp { margin-bottom: var(--v2); max-width: 7.2em; }
#alOpen .al-note { margin-bottom: var(--v4); max-width: 20em; }

/* A PILL IS SIZED TO ITS CONTENT. Not one of the four reference pills
   spans the screen — they measure 217, 148, 187 and 134 CSS px, all
   43 to 50 tall. A full-bleed primary was the widest object on the
   open screen and read as a form submit. */
.al-pill {
  display: inline-flex; align-items: center; justify-content: center;
  align-self: flex-start;
  min-height: 48px; padding: 0 30px; border-radius: var(--r-pill);
  background: var(--ink); color: #14120E;
  font-size: 16px; font-weight: 500; letter-spacing: -.01em;
}
.al-pill.is-glass {
  background: var(--plate); color: var(--ink);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  border: 1px solid var(--hair);
}
.al-pill.is-grow { flex: 1; }

.al-head { padding: calc(var(--v4) + env(safe-area-inset-top, 0px)) var(--gut-list) var(--v3); display: flex; align-items: center; gap: 12px; flex: none; }
.al-head .al-disp-s { flex: 1; }
.al-head .al-caps { flex: none; }

/* 44 OWNED, 40 DRAWN — and an inset cannot say that here. An
   absolutely positioned box resolves against its host's PADDING box,
   and .al-round carries a 1px border under a border-box reset, so its
   padding box is 38 and inset:-2px reached 42 rather than the 44 the
   declaration reads as. Two real controls sat under the floor and the
   arithmetic was invisible in the source. Centring an explicit --tap
   square is immune to the host's border, padding and drawn size alike,
   and it is what makes the token load-bearing rather than decorative. */
.al-round {
  width: 40px; height: 40px; flex: none; border-radius: var(--r-pill);
  background: var(--plate); border: 1px solid var(--hair);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  display: grid; place-items: center; position: relative;
}
.al-round::before {
  content: ''; position: absolute; top: 50%; left: 50%;
  width: var(--tap); height: var(--tap); transform: translate(-50%, -50%);
}
.al-round svg { width: 17px; height: 17px; display: block; }

.al-pane { flex: 1; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  padding: 0 var(--gut-list) calc(118px + env(safe-area-inset-bottom, 0px)); }
.al-pane::-webkit-scrollbar { display: none; }

/* A MASK, NEVER A GRADIENT LAID OVER THE CONTENT. The ground here is a
   photograph, so a --paper overlay is a near-match that reads as a
   smudge somewhere on the set. Off again at the end of the travel: a
   soft edge over nothing is the same lie in the other direction. */
.al-pane { -webkit-mask-image: linear-gradient(180deg, #000 calc(100% - 86px), transparent 100%);
                   mask-image: linear-gradient(180deg, #000 calc(100% - 86px), transparent 100%); }
.al-pane.is-end { -webkit-mask-image: none; mask-image: none; }

/* ---- THE ARC ---- */
.al-card {
  position: relative; display: block; width: 100%; text-align: left;
  border-radius: var(--r-card); overflow: hidden;
  background: var(--card); padding: var(--v3);
  margin-bottom: var(--v3);
  box-shadow: inset 0 1px 0 var(--card-edge), 0 18px 34px -18px rgba(0,0,0,.92);
}
.al-ch { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--v3); }
.al-ct { margin-bottom: var(--v3); }
.al-ct .al-caps { margin-top: var(--v1); color: var(--spent); }

.al-sq {
  width: 38px; height: 38px; flex: none; border-radius: var(--r-sq);
  background: var(--glass); border: 1px solid var(--hair);
  display: grid; place-items: center;
}
.al-sq { font-size: 13px; font-weight: 500; letter-spacing: .06em; color: var(--dim); }

.al-go {
  width: 38px; height: 38px; flex: none; border-radius: var(--r-pill);
  background: rgba(255,255,255,.92); color: #14120E;
  display: grid; place-items: center;
}
.al-go svg { width: 15px; height: 15px; }
.al-card.is-read .al-go { background: var(--plate); color: var(--ink); border: 1px solid var(--hair); }

/* The picture, inset inside the card's own material at its own smaller
   radius. Two rounded rectangles at one radius read as a mistake. */
.al-ph { position: relative; height: 300px; border-radius: var(--r-in); overflow: hidden; background: #0E0C0A; }
.al-ph i {
  position: absolute; inset: 0; display: block;
  background-size: cover; background-position: center;
  filter: var(--grade) brightness(var(--ib, 1));
}

.al-grp { padding: var(--v5) 2px var(--v2); }

/* ---- THE STORY ---- */
#alStoryPane { padding-bottom: var(--v6); }
.al-lead.is-short { height: 34vh; }
#alLawPane .al-sheet {
  background: linear-gradient(180deg,
      rgba(11,10,8,.62) 0, rgba(11,10,8,.94) 64px, rgba(11,10,8,.96) 100%);
}
.al-lead { position: relative; height: 50vh; display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: var(--v4); }
.al-lead::before {
  content: ''; position: absolute; z-index: 0;
  left: calc(var(--gut-list) * -1); right: calc(var(--gut-list) * -1); bottom: 0; height: 66%;
  background: linear-gradient(180deg, rgba(11,10,8,.00), rgba(11,10,8,.52) 48%, rgba(11,10,8,.88));
}
.al-lead > * { position: relative; z-index: 1; }
.al-lead .al-mark { margin-bottom: var(--v3); color: var(--dim); }
.al-lead .al-caps { margin-bottom: var(--v2); }
.al-lead .al-disp { max-width: 9em; }

/* THE SCRIM TRAVELS WITH THE TEXT, NOT WITH THE VIEWPORT. .al-bg is
   fixed, so a veil written there is a screen gradient the words scroll
   THROUGH — measured, one paragraph of this story passed over grounds
   from L17 to L127 and the same declared colour read 3.23:1 at one
   scroll position and 9.97 at another. A contrast failure that moves
   is the hardest kind to see and the easiest kind to ship. */
.al-sheet {
  margin: 0 calc(var(--gut-list) * -1); padding: 0 var(--gut-list) var(--v6);
  background: linear-gradient(180deg,
      rgba(11,10,8,.86) 0,
      rgba(11,10,8,.94) 120px,
      rgba(11,10,8,.96) 100%);
}
.al-txt p { margin-bottom: 1.05em; }
.al-txt p:first-child::first-letter { font-size: 2.2em; font-weight: 450; line-height: .88; float: left; margin: .06em .11em 0 0; color: var(--ink); }

.al-rule-hd { margin: var(--v5) 0 var(--v3); display: flex; align-items: center; gap: 12px; }
.al-rule-hd:after { content: ''; flex: 1; height: 1px; background: var(--hair); }

/* A TAG'S FILL AND ITS LABEL PULLED THE SAME WAY. Both were mixed from
   one hue, so they closed on each other from both sides and the worst
   pair measured 1.71:1 — the worst text in the app. The hue lives in
   the label and the rim now; the ground is a plate. */
.al-tags { display: flex; flex-wrap: wrap; gap: 16px 8px; margin-bottom: var(--v4); }
.al-tag {
  position: relative;
  display: inline-flex; align-items: center; height: 30px; padding: 0 12px;
  border-radius: var(--r-sq);
  font-size: 13px; font-weight: 500; letter-spacing: .01em;
  background: rgba(11,10,8,.78);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid color-mix(in srgb, var(--tg) 30%, transparent);
  color: color-mix(in srgb, var(--tg) 66%, var(--ink));
}
.al-tag::before {
  content: ''; position: absolute; left: 0; right: 0; top: 50%;
  height: var(--tap); transform: translateY(-50%);
}
.al-lrow {
  position: relative; display: flex; align-items: center; gap: var(--v3);
  width: 100%; text-align: left; padding: var(--v3) 0;
  border-bottom: 1px solid var(--hair);
}
.al-lrow:last-child { border-bottom: 0; }
.al-lrow .al-sq { background: var(--glass); }
.al-lrow .al-lt { flex: 1; min-width: 0; }
.al-lrow .al-lt i { display: block; font-style: normal; font-size: 19px; font-weight: 450; letter-spacing: -.02em; line-height: 1.2; }

.al-tag[data-f="inner"]  { --tg: #C9A227; }
.al-tag[data-f="motion"] { --tg: #D2603A; }
.al-tag[data-f="others"] { --tg: #7E9AA6; }
.al-tag[data-f="time"]   { --tg: #8E9370; }

.al-rule {
  border-radius: var(--r-card); padding: var(--v4); margin-bottom: var(--v2);
  background: var(--card); box-shadow: inset 0 1px 0 var(--card-edge);
}
.al-rule .al-caps { margin-bottom: var(--v2); }
.al-rule b { display: block; font-size: 19px; font-weight: 600; line-height: 1.26; letter-spacing: -.016em; }
.al-q { border-radius: var(--r-card); padding: var(--v4); border: 1px solid var(--hair); }
.al-q .al-caps { margin-bottom: var(--v2); }
.al-q b { display: block; font-size: 19px; font-weight: 500; line-height: 1.34; letter-spacing: -.012em; color: var(--dim); }

/* THE STORY ENDED IN 150px OF RESERVED NOTHING. Both references close
   their detail screen on a pair — a primary and a secondary — and the
   only way out of this one was scrolling four thousand pixels back to
   the close button. */
.al-acts { display: flex; gap: var(--v2); margin-top: var(--v4); }

/* ---- THE FOOT ---- */
.al-foot {
  position: fixed; left: 93px; right: 93px; z-index: 30;
  bottom: calc(var(--v4) + env(safe-area-inset-bottom, 0px));
  height: 58px; border-radius: var(--r-pill);
  background: rgba(24,21,17,.62);
  backdrop-filter: blur(26px) saturate(1.5); -webkit-backdrop-filter: blur(26px) saturate(1.5);
  border: 1px solid var(--hair);
  display: grid; grid-auto-flow: column; align-items: center;
  padding: 0 var(--v1);
}
.al-tab { height: 46px; border-radius: var(--r-pill); display: grid; place-items: center; color: var(--dim); }
.al-tab svg { width: 20px; height: 20px; display: block; }
.al-tab[aria-current="true"] { background: rgba(255,255,255,.12); color: var(--ink); }

.al-x { position: fixed; top: calc(18px + env(safe-area-inset-top, 0px)); right: var(--gut); z-index: 30; }
</style>
</head>
<body>

<div class="al-bg" id="alBg" aria-hidden="true"><i id="alBgI"></i><u></u></div>

<section class="al-view is-on" id="alOpen">
  <div class="al-mark" role="img" aria-label="Alignment">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 2v20M5 8l7-6 7 6M5 16l7 6 7-6"/></svg>
  </div>
  <h1 class="al-disp" id="alOpenT">Twelve stories and one shape.</h1>
  <p class="al-note" id="alOpenN">The oldest stories we have are all the same story. Read one, and find out which part of it you are standing in.</p>
  <button class="al-pill" id="alOpenB">Begin</button>
</section>

<section class="al-view" id="alArc">
  <div class="al-head">
    <h1 class="al-disp-s">The Arc</h1>
    <span class="al-caps al-count"></span>
  </div>
  <div class="al-pane" id="alArcPane"></div>
</section>

<section class="al-view" id="alLaws">
  <div class="al-head"><h1 class="al-disp-s">The Laws</h1><span class="al-caps al-count"></span></div>
  <div class="al-pane" id="alLawsPane"></div>
</section>

<section class="al-view" id="alRules">
  <div class="al-head"><h1 class="al-disp-s">The Rules</h1><span class="al-caps al-count"></span></div>
  <div class="al-pane" id="alRulesPane"></div>
</section>

<section class="al-view" id="alLaw">
  <button class="al-round al-x" id="alLawX" aria-label="Close">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
  <div class="al-pane" id="alLawPane"></div>
</section>

<section class="al-view" id="alStory">
  <button class="al-round al-x" id="alStoryX" aria-label="Close the story">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
  <div class="al-pane" id="alStoryPane"></div>
</section>

<nav class="al-foot" id="alFoot">
  <button class="al-tab" data-v="arc" aria-current="true" aria-label="The Arc">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 18c4-10 14-10 18 0"/><circle cx="3" cy="18" r="1.6" fill="currentColor" stroke="none"/><circle cx="21" cy="18" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="10.6" r="2.1"/></svg>
  </button>
  <button class="al-tab" data-v="laws" aria-label="The Laws">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 4v16M5 8h14M7.5 8 5 15h5zM16.5 8 14 15h5z"/></svg>
  </button>
  <button class="al-tab" data-v="rules" aria-label="The Rules">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5 5h14v14H5zM9 10h6M9 14h4"/></svg>
  </button>
</nav>

<script>
(function () {
'use strict';

/*
  ONE WRAPPER. Nothing escapes it. The other apps in this repo learned
  that the hard way — a top-level name here does not throw when it
  collides, it replaces, and the symptom turns up screens away.
*/

var KEY = 'align.v1';

/* The stages are the path. Stories are filed at the one they belong to,
   so a stage with nothing at it simply has nothing at it. */
var STAGES = ['The Call', 'The Refusal', 'The Mentor', 'The Threshold',
              'The Trials', 'The Ordeal', 'The Reward', 'The Road Back', 'The Return'];

var S = [
{
  id: 'stove', stage: 'The Call', bg: 'desert', mins: 11,
  n: 'The Treasure Under the Stove',
  src: 'Sufi · Rumi, thirteenth century',
  laws: [
    { n: 'Correspondence', f: 'inner' },
    { n: 'Inspired Action', f: 'motion' },
    { n: 'Relativity', f: 'time' },
    { n: 'The Stranger’s Mouth', f: 'others' }
  ],
  teach: 'Coelho built The Alchemist out of this. Santiago, the sheep, the pyramids, the treasure back under the tree he started from — all of it is here, seven hundred years earlier, in about a page. Knowing that is useful, because it tells you the shape is older and more reliable than any one telling of it.',
  rule: 'You cannot be told. You can only be sent.',
  q: 'What are you standing on, refusing to dig, because it is too close to be treasure?',
  body: [
    "Yusuf's father left him a house in the eastern quarter of Baghdad, and in the house there were four things worth naming: a garden with a wall round it, a fig tree older than anyone could remember, a stone fountain, and a stove.",
    "He was thirty-one when he inherited it and he was not poor then.",
    "The losing took eleven years and there was never a day he could have pointed at. He bought and he sold, cloth mostly, and he was neither careless nor unlucky in any way he could name. It was simply that every year there was a little less than the year before, and a man can live inside that for a very long time without once saying the word out loud.",
    "He sold the second house in the fourth year. He sold the horses in the sixth. After that he began on the carpets, one at a time, always the one nearest the door, so that the room emptied slowly enough that he could come in each evening and tell himself it looked much as it had.",
    "The fountain stopped in the ninth year. Something had silted up beneath it. He meant to have it seen to, and then there was the winter, and then there was something else, and after a while he stopped hearing that it had stopped.",
    "By the twelfth year what was left was the house, the wall, the tree, the dry fountain and the stove, and Yusuf, who lit the stove every evening and sat beside it.",
    "The dream came in the spring.",
    "He was standing somewhere with no features to it, aware in the way you are aware in dreams that he had been there a while. A voice spoke from a little behind his left shoulder and did not raise itself at all.",
    "Your fortune is in Cairo, it said. Go there and find it.",
    "He woke before dawn and lay listening to the birds starting up in the fig tree and laughed at himself, quietly, so as not to seem mad even to an empty house. A man who has lost money dreams about money. There is nothing in that.",
    "It came again the next night. Word for word, the same flat voice from the same place behind him. He laughed again in the morning and the laugh was shorter.",
    "On the third night he did not sleep afterwards. He lay with his eyes open until the window went grey, and somewhere in those hours the thing stopped being a dream he had had and became a thing he was going to do, and he could never afterwards say when it turned over.",
    "He sold the fig crop standing. He sold the brass fittings off the doors and the good knife and the last carpet, which he had been keeping without admitting that he was keeping it. It came to enough for a place with a caravan, food for the road, and a little over.",
    "His neighbour Abu Qasim stood in the lane and watched him strap the bundle.",
    "Cairo, said Abu Qasim.",
    "Yes.",
    "For what?",
    "And Yusuf found that he could not answer. He stood there with the strap in his hand and understood that there was no sentence available to him that would not sound exactly like what it was.",
    "A man told me, he said at last.",
    "Abu Qasim looked at him for a while. Then he did a kind thing, which was to say nothing more about it and help him with the strap.",
    "The road to Cairo took ten weeks.",
    "Nothing happened on it. That is the part nobody warns you about. He had expected the journey to prove something, to be the place where it began, and instead it was heat and dust and the same four conversations with different men, and the enormous slowness of a world crossed at the speed of a camel.",
    "In the second month a driver called Ishaq asked him what he was going for. Yusuf, who had by then been asked eleven times and had eleven times said business, heard himself tell the truth.",
    "Ishaq did not laugh. He chewed for a while and looked out at the country.",
    "I had a brother who went to Isfahan on a dream, he said.",
    "What happened to him?",
    "Nothing. He came back. He was all right afterwards.",
    "Yusuf waited for the rest of it.",
    "That is all there is, said Ishaq. Some people go and some people do not, and the ones who do not talk about it for the rest of their lives. That is the whole of the difference I have ever been able to see.",
    "They came into Cairo on a morning in the hot season, and within an hour Yusuf understood that he had been a fool about the size of it.",
    "He had imagined arriving somewhere. Cairo was not somewhere. It was a country folded up and packed into streets, and it went on past every corner he turned, and by the afternoon of the first day he had given up holding a map of it in his head. Nobody looked at him. There is a particular loneliness in a place so large that a stranger is not even strange.",
    "His money lasted nine days.",
    "For three days after that he did not eat. He walked the city in the mornings looking for work, and there was work, but it went to men who had somebody to speak for them, and he had nobody in that city and no way to acquire anybody in an afternoon.",
    "On the third evening he sat down against a wall and made himself say the thing plainly, which was that he was going to have to ask.",
    "He had never in his life asked anyone for anything. He found, sitting there, that he still could not do it while people could see his face.",
    "So he waited until dark.",
    "What he did not know was that the watch had been out for eleven nights after a run of housebreakings in that quarter, and that they were tired, and that a stranger moving along a wall after the last call to prayer was the precise shape of the thing they had been sent to find.",
    "They came out of a side street behind him and he never turned round properly.",
    "He remembered afterwards that there were four of them, and that it was quick, and that the strangest part was how little malice there was in it. They were not angry with him. They did their work the way men do a job they have done before, and when he stopped being able to stand they stopped, and one of them went to fetch the captain.",
    "The captain came with a lamp and crouched down and turned Yusuf's face toward the light with two fingers, not ungently.",
    "Who are you, he said.",
    "And Yusuf, lying on the stones of a city eleven weeks from his own door, with his mouth full of blood and nothing at all left to protect, told him.",
    "He told him the whole of it. The house in the eastern quarter and the wall round the garden. The eleven years. The carpets by the door. The fountain that had stopped in the ninth year and that he had meant to see to. The voice behind his left shoulder, three nights running, and what it had said.",
    "The captain listened to all of it and did not interrupt once.",
    "Then he sat back on his heels and laughed.",
    "He laughed for a long time, and his men laughed with him, and one of them had to set the lamp down. It was not cruel laughter. That was somehow worse. It was the laughter of a man who has been standing in a dark street half the night and has just been handed something to take home and tell people.",
    "You walked here from Baghdad, he said. On a dream.",
    "Yes.",
    "Listen to me. Three times in my life I have had a dream myself. Three times, the same one. A voice tells me there is a treasure in Baghdad, and it tells me the quarter, and it tells me the house.",
    "He wiped his eyes with the back of his wrist.",
    "A house with a wall round the garden, he said, and a fig tree in it older than the house. And a stone fountain that does not run. And the treasure is under the stove.",
    "He put his hands on his knees.",
    "Three times, he said. And I have never gone one step. I have never so much as asked a man which road it is. Because I am not a lunatic, and only a lunatic crosses a desert on the strength of something he heard while he was asleep.",
    "Yusuf did not say anything at all.",
    "He lay on the stones and looked up at a tired man with a lamp who had just described his own garden, and the silence went on long enough that one of the watchmen shifted his feet.",
    "Then he said thank you.",
    "The captain, who had been ready for almost anything but that, was quiet a moment. Then he took some coins out of his belt and set them on the ground by Yusuf's hand, and told him to eat something, and go home, and stop dreaming.",
    "The walk back took ten weeks, the same as the walk out.",
    "It was not the same journey. He went by the same road and ate the same food and the country was exactly where he had left it, and every day of it was different, and he could not have explained that to anybody either.",
    "He came into Baghdad in the early autumn. He went up his own lane, and Abu Qasim was not out, and he let himself in at his own door and stood in the empty room and smelled the particular smell of a house that has been shut eleven months.",
    "The fig tree had fruited and dropped and nobody had gathered it.",
    "He went to the stove. He had lit it ten thousand times. He had cleaned it and cursed it and sat beside it on every cold evening of his adult life, and in all those years he had never once looked underneath it.",
    "He found a bar in the yard, and he dug.",
    "It was not deep. It was about the depth a man buries a thing when he means to come back for it within a year or two, and has no shovel, and is in a hurry.",
    "There was gold, and a quantity of old coin that had not been minted in his lifetime or his father's, and a small heavy thing wrapped in cloth gone to powder. He sat down on the kitchen floor and stayed there a long while as the light moved across the wall.",
    "In the morning he went out and found a man who knew about water.",
    "He had the fountain seen to first."
  ]
},
{ id:'lamp', stage:'The Call', bg:'umber', mins:4,
  n:'The Lamp and the Keys', src:'Sufi · Nasrudin',
  laws:[{n:'Cause and Effect',f:'motion'},{n:'Attention',f:'inner'}],
  rule:'Comfort decides where you search long before honesty decides what you find.',
  q:'Which problem are you working on because it is the one you know how to work on?',
  teach:'Nasrudin is the Sufi tradition’s holy fool, and the fool is how that tradition says the things nobody will hear straight. The joke is forty words. What is under it is the most expensive habit a person has: searching where searching is comfortable, and calling it searching.',
  body:[
    "A neighbour came out of his house one evening and found Nasrudin on his hands and knees under the street lamp, sweeping his palms across the dust in slow circles.",
    "What have you lost, the neighbour asked.",
    "My key, said Nasrudin, without looking up.",
    "So the neighbour got down beside him, because that is what you do, and the two of them went over the same patch of lit ground together. They did it thoroughly. They worked outward from the post and they went over the places they had already been, twice, the way you do when a thing must be somewhere and is not.",
    "After a while other people stopped. A man carrying bread put it down and joined in. Two boys came. Somebody fetched a lantern to see under the edge of the step, and by full dark there were six or seven people on their knees in a ring of light in the middle of the street, all of them looking for Nasrudin’s key.",
    "It was the neighbour who finally sat back on his heels.",
    "Nasrudin, he said. Where exactly were you when you dropped it?",
    "In my house, said Nasrudin.",
    "The neighbour stared at him.",
    "In your house.",
    "Yes.",
    "Then why in God’s name are we looking out here?",
    "And Nasrudin said: because there is light here.",
    "That is the whole of it, and everybody laughs, and that laugh is the trapdoor the story goes down through.",
    "Because look at what he is actually doing. He is not lazy. He is on his hands and knees in the dirt, in the dark, at the end of a working day. He is not stupid either, and he has not forgotten where he left the key — he answers the question immediately and without embarrassment, because he knew the whole time. He is not even alone. He has organised six people and a lantern. By every measure anybody applies to effort, Nasrudin is doing extremely well.",
    "He is simply searching in the wrong place, and the wrong place has one enormous thing going for it. You can see there.",
    "Now think about the house.",
    "The house is dark. The key is in a room he would have to go back into, and feel his way around, and probably knock something over before he found anything. There is no lantern in there and there is no neighbour in there and nobody is going to praise him for going in. Everything about the search that would actually work is worse, in every particular, than the search that cannot.",
    "So he stays out in the light. And because he stays out in the light, he gets company, and progress, and the feeling of a thing being worked on.",
    "People do this with their whole lives and they do not think of it as a joke.",
    "The man who knows his marriage is the problem and takes another qualification. The one whose business needs him to make twenty calls he is frightened of, and who spends the week on the website instead — genuinely working, genuinely tired at the end of it, genuinely no closer. The one who reads a hundred books about the thing rather than doing the thing once, badly, in the dark.",
    "None of them is lying. That is what makes this hard. Every one of them could tell you exactly where the key is if you asked them straight out, the way Nasrudin did, with no embarrassment at all — because knowing where it is was never the difficulty.",
    "The difficulty is that the place where it is has no light on it.",
    "There is one more thing in the story and it is the part people forget.",
    "Six people helped him. Not one of them asked the question for an hour. They saw a man searching, and searching is a thing that looks the same from the outside no matter where it is pointed, so they knelt down and searched with him. Your friends will do this. Your family will do this. Anybody watching you work hard will assume you are working on the right thing, because from where they are standing there is no way to tell.",
    "The question has to come from you, and it is only ever one question, and it is not difficult.",
    "Where did you actually drop it."
  ] },
{ id:'cup', stage:'The Refusal', bg:'curve', mins:4,
  n:'The Cup That Was Already Full', src:'Zen · Nan-in, nineteenth century',
  laws:[{n:'Mentalism',f:'inner'},{n:'Receptivity',f:'inner'}],
  rule:'You are not being refused the answer. You are full.',
  q:'What would you have to stop being right about?',
  teach:'Nan-in was a Japanese master of the Meiji era and the professor was a real visitor. The tradition keeps this one because it is the only answer to a particular kind of person — and the trap is that everybody hearing it assumes they are the teacher in it.',
  body:[
    "A university professor came to see Nan-in, to ask about Zen.",
    "He had prepared. That is worth saying at the start, because the story is usually told as though he were a fool and he was not. He had read what there was to read in his language and a good deal of what there was in others. He had taken notes. He had arrived at a position, and the position was defensible, and he had come up the mountain in part to have it tested by somebody worth the trouble.",
    "Nan-in received him, and served tea.",
    "He poured his visitor’s cup full.",
    "And then kept pouring.",
    "The professor watched the tea rise to the lip of the cup and stop being a thing inside a cup. It came over the edge and went across the lacquer and off the side of the table and onto the floor and Nan-in went on pouring, steadily, with an entirely ordinary expression, the way a man pours when he has not noticed.",
    "It is overfull, the professor said. No more will go in.",
    "And Nan-in put the pot down.",
    "Like this cup, he said, you are full of your own opinions and speculations. How can I show you Zen unless you first empty your cup?",
    "Everybody who hears this story understands it immediately, and almost everybody understands it about somebody else.",
    "That is the mechanism. Go back to the professor for a moment, because the story is only useful if you are willing to be him. He was not full of nonsense. He was full of good material, accurately learned, correctly remembered. His cup had excellent tea in it already. That is exactly the problem and it is why the image is a cup rather than a bucket of mud — it would be no trouble at all to empty a cup of something you already despised.",
    "The hard thing to put down is the thing you are right about.",
    "And watch what he does when the tea starts to spill, because this is the part of the story that is about you rather than about him. He does not move the cup. He does not put his hand over it. He watches a man pour tea onto a floor for several seconds and then explains the situation to him — politely, accurately, and as though the other man had made an error.",
    "It is overfull. No more will go in.",
    "He is still teaching. He came all that way to learn and at the decisive moment he cannot stop instructing, and he does it in the exact voice he would use on a slow student. The whole visit is in that one sentence.",
    "Now, the refusal.",
    "This is a story about the second stage of any journey worth going on, and the second stage is not the one anybody warns you about. The first is being called — something opens, something says go. The second is the part where you go, and you arrive, and you stand in front of the thing you asked for, and you find you cannot take it.",
    "Not will not. Cannot. There is no room.",
    "The professor got everything he came for. He was in the room with the man. The man was willing. And nothing could pass between them, because the space where the answer would have gone was already occupied by the answer he had brought with him.",
    "There is no technique for this. Emptying a cup is not a skill, it is a decision, and it costs exactly what it looks like it costs: you have to be willing to be wrong about something you have already built on.",
    "Most people would rather be right and stay where they are. That is not a character flaw. That is the ordinary price of the ordinary life, and almost everybody pays it, and it buys something real — it buys not having to start again.",
    "But nothing new goes into a full cup, and there is no arrangement of words, no teacher, no book and no mountain that changes that.",
    "The tea just goes on the floor."
  ] },
{ id:'river', stage:'The Refusal', bg:'silk', mins:5,
  n:'The Man Who Asked the River to Wait', src:'Ours',
  laws:[{n:'Rhythm',f:'time'},{n:'Inspired Action',f:'motion'}],
  rule:'Readiness is something you claim, never something you are granted.',
  q:'What are you calling preparation?',
  teach:'Ours, and the only wholly invented one in the first half of this arc. It is here because the tradition is thin on this particular refusal — the one that never says no and simply never says now.',
  body:[
    "There was a man who had to cross a river.",
    "He did not doubt it. That is the first thing to understand about him, because he was not a coward and he never once said he would not go. Everything he owned was on this side and everything he wanted was on the other, and he knew it, and he said so out loud to anyone who asked.",
    "He went down to the bank to look at the crossing.",
    "The water was high that week. It had rained in the hills and the river was running brown and fast, carrying branches, and any sensible man could see that this was not the week. So he went home, and he was right, and nothing in this story ever calls him wrong about that.",
    "He came back in the dry season and the river was low. It was also wide and slow and full of hidden stones, and he could not see the bottom for the silt. A man could break an ankle in there and nobody would find him. So he decided to learn something about rivers.",
    "He was thorough. He talked to men who had crossed and men who had not. He learned where the current runs strongest on a bend and why the far bank of a curve is deeper than it looks. He learned to read the surface — the flat patches that mean a rock under, the seam where two flows meet. He made a rope. He made a better rope. He stood on that bank at every hour of the day and in every season for a number of years, and by the end of it there was nobody within fifty miles who knew that crossing better than he did.",
    "He was, by then, genuinely expert. Ask him anything.",
    "One evening the ferryman was sitting on his boat at the landing, doing nothing, and the man went over to him, because he had one question left.",
    "When is the best time to cross?",
    "The ferryman thought about it.",
    "When you get in the boat, he said.",
    "The man waited for the rest of the answer and there was not any more of it.",
    "He explained that this was not really a serious reply. He explained about the flood season, and the silt, and the stones, and the seam where the two flows meet. He explained that a crossing attempted at the wrong moment is not courage, it is stupidity, and that any fool can drown.",
    "All of which was true, and the ferryman did not argue with a word of it, because none of it was the thing.",
    "The thing is that a river does not have a best time. It has times that are better and times that are worse and it is never, at any hour of any season, actually ready for you, because being ready is not a state rivers can be in. The water simply keeps going past. It went past while he was learning about it, all those years, at the rate of a whole river, every day.",
    "And here is what his study was actually doing, which is the part worth taking home.",
    "Every fact he learned made the crossing feel closer and made it further away. Closer, because he knew more. Further, because each thing he learned revealed two things he did not know yet, and a man who has decided to go when he is ready has handed the decision to a list that grows faster than he can shorten it.",
    "He had not refused the call. He had never once refused it. He had converted it into a project, and a project can be worked on indefinitely by an honest person who genuinely intends to finish.",
    "That is what makes this refusal so much more dangerous than the loud kind. The man who says no has at least said something you can argue with. This man said yes for thirty years.",
    "There is no trick in the ferryman’s answer and he was not being clever. He was a man who crossed a river several times a day and he had noticed the only thing about it that is actually true. The boat goes when someone gets in it. Everything else is weather.",
    "The river is the same river it was when you first stood on the bank.",
    "You are not."
  ] },
{ id:'horse', stage:'The Mentor', bg:'canyon', mins:4,
  n:'The Farmer Who Said We Shall See', src:'Taoist · Huainanzi',
  laws:[{n:'Polarity',f:'time'},{n:'Relativity',f:'time'},{n:'Judgement',f:'inner'}],
  rule:'Every event is half a sentence. You keep reading it out as the whole one.',
  q:'What are you certain was a disaster?',
  teach:'From the Huainanzi, a Chinese text of the second century BC. It has survived two thousand years in a dozen languages because it is the shortest complete description of how judgement actually works — and because the farmer is not an optimist, which is what most retellings get wrong.',
  body:[
    "An old farmer on the northern frontier kept one horse, and one day the horse ran off across the border and was gone.",
    "The neighbours came to say how sorry they were. A horse was most of what a man like that had. Terrible luck, they said.",
    "Maybe, said the farmer. We shall see.",
    "Some months later the horse came back, and it brought with it a string of fine wild horses from beyond the frontier, so that the old man who had owned one horse now owned a dozen.",
    "The neighbours came to congratulate him. Wonderful luck, they said.",
    "Maybe, said the farmer. We shall see.",
    "His son took to the new horses, as a young man would, and broke his leg badly falling from one of them, and it set wrong, and he was lame after that.",
    "The neighbours came again. Such a shame, they said. Such bad luck.",
    "Maybe, said the farmer. We shall see.",
    "A year later the army came through, conscripting every young man in the district for a war on the border, and nine in ten of them did not come back. They did not take the son, because of the leg.",
    "And that is the story, and most people stop there and take from it that things work out.",
    "They do not. Read it again. Nothing in it says the son was glad of his leg, or that the war was worth a limp, or that the universe was arranging matters kindly on the old man’s behalf. The story does not end well. It simply ends where the telling stops, and it is the telling that stops, not the sequence. The boy is still lame the next morning. There is another year after the one the story closes on, and the farmer would have said maybe about that too.",
    "So the farmer is not saying it will all be fine.",
    "He is saying something harder and far more useful. He is saying that every single event arrives as half a sentence, and that the neighbours keep reading half a sentence out loud as though it were the whole one.",
    "Look at what the neighbours actually do. They are not fools and they are not unkind — they come round every time, which is more than most people manage. But each time, they take a thing that has just happened, decide what it means, and close the book. Horse gone: disaster, final. Horses arrived: triumph, final. Leg broken: disaster, final. They are certain, every time, and every time the next chapter makes them wrong, and being wrong four times in a row does not slow them down for a moment.",
    "That is not a story about horses. That is a description of an ordinary mind, including yours, on an ordinary Tuesday.",
    "The farmer’s answer is not optimism. Optimism would be saying it will turn out well, which is just the neighbours’ mistake wearing a nicer coat — another verdict delivered early on evidence that has not finished arriving.",
    "What he says is maybe. And then he goes back to work, which is the part of his behaviour nobody ever mentions and which is the whole practical content of the story. He does not sit down to wait and see what it meant. He feeds the horses he has. He sets the boy’s leg. He gets on, in the actual weather of the actual day, without first requiring the day to tell him whether it was a good one.",
    "Because here is the cost of the neighbours’ habit, and it is not that they are sometimes wrong about the past.",
    "It is that a verdict delivered early changes what you do next. Call the lost horse a disaster and you will spend the season grieving instead of mending the fence. Call the wild horses a triumph and your son will get on one. The judgement is not a comment on the event. It is the first move of the next one.",
    "You will not get to the end of the sentence. That is not available. There is no vantage point late enough to stand at where the meaning of a thing finally settles, because there is always another year.",
    "What is available is noticing how fast you closed the book, and how certain you were, and how many times that has gone."
  ] },
{ id:'ferry', stage:'The Threshold', bg:'nightfall', mins:5,
  n:'The Ferryman’s Price', src:'Ours',
  laws:[{n:'Compensation',f:'motion'},{n:'Sacrifice',f:'motion'}],
  rule:'The toll is always the thing you were going to keep.',
  q:'What are you trying to take across with you?',
  teach:'Ours. Every tradition has a crossing and a price and most of them hide the price until you are standing there, which is a way of saying something true about how a threshold actually works.',
  body:[
    "The river had one ferryman and no bridge.",
    "He was not mysterious about it. He sat by his boat, and when you came down to the landing he looked at what you had with you — not at your face first, at your hands and your back and whatever you had roped to the cart — and then he named the price, and the price was never money.",
    "It was one of the things you were carrying.",
    "He chose. That was the whole difficulty. A man who could pick what to pay would simply pay with the least of it, and everybody understood this, so nobody bothered to ask. The ferryman looked at what you had and said the name of one thing, and then you either put it down on the bank or you did not cross.",
    "A merchant came down to the landing in the late afternoon with a good horse and a loaded cart.",
    "He was a reasonable man and he began reasonably. He offered the horse — a genuinely valuable animal, and he did not pretend otherwise. The ferryman said no. He offered the horse and the cart together, which was most of what he owned in the world. No. He offered, with some difficulty, a sealed box that he had not opened in front of anyone for eleven years.",
    "No, said the ferryman, and named the thing.",
    "It was a small thing. It had almost no value to anyone but him. He had carried it so long that he had stopped noticing the weight, the way you stop hearing a mill.",
    "Take the cart, the merchant said.",
    "I do not want the cart.",
    "Then take the cart and the horse and the box.",
    "I do not want those either.",
    "Why that? It is worth nothing. It is worth nothing to you and it is worth nothing to anybody. You could not sell it.",
    "And the ferryman said: that is not the price because it is worth something. It is the price because you cannot get in the boat holding it.",
    "The merchant stood on that bank until the light went.",
    "He tried, in the last of it, the thing everybody tries. He put it in the bottom of the cart, under the sacking, and led the horse down to the water, and the ferryman watched him do it with no expression at all and did not move to untie the boat. He did not accuse him. He did not say anything. He just sat there, and after a while the merchant walked the horse back up the bank, because there is no point arguing with a man who is simply not going to cast off.",
    "Now, what is going on here, because the story is not about a toll.",
    "The far bank is a different life. That is what a crossing is. Not a journey — a journey you make carrying everything, that is what a journey is for. A threshold is the other thing: the point at which who you were on this side stops being available, and the fare is always, in every telling of this in every language, the thing that only makes sense on the bank you are leaving.",
    "It has to be. That is not cruelty, it is arithmetic. If it made sense on both sides it would not be a threshold, it would be a road.",
    "And notice what the ferryman is not. He is not a test and he is not a judge. He does not say the merchant is unworthy or that he needs to learn something first. He is closer to a doorway than a person: he states a fact about the width of the gap, and then he waits, and he will wait as long as you like. Nobody is ever refused at that river. People simply decline to pay.",
    "Which is why the merchant is the honest version of this story rather than the tragic one. He did not fail. He priced it. He stood on a riverbank with the whole of his life on the other side and worked out, in the dark, that he would rather keep the small thing.",
    "People do that. It is allowed. The bank on this side is not a prison and there are whole good lives lived on it.",
    "But you should know what you paid for it, and you should know that you chose, and you should know the ferryman is still down there, and that he is not going anywhere, and that the price does not go up or down."
  ] },
{ id:'cutter', stage:'The Trials', bg:'abyss', mins:5,
  n:'The Stonecutter', src:'Japanese folk tale',
  laws:[{n:'Envy',f:'others'},{n:'Vibration',f:'inner'},{n:'Power',f:'others'}],
  rule:'Every position you envy is a position with something above it.',
  q:'Who are you measuring yourself against, and what are they measuring themselves against?',
  teach:'A Japanese folk tale, and one of the very few stories in any tradition that is a closed loop rather than a line. The shape is the argument: you cannot tell it without ending where it started, which is the only honest way to say what wanting to be somebody else actually does.',
  body:[
    "There was a stonecutter who went out every morning to the rock face and cut stone, and he was neither happy nor unhappy about it until the day he delivered a load to a rich man’s house.",
    "He saw the courtyard. He saw the cool rooms and the servants and a man lying on cushions in the middle of the afternoon, and something in him turned over.",
    "How I wish I were a rich man, he said.",
    "And a voice said: you are a rich man.",
    "He was. He lay on the cushions and he had the cool rooms, and it was as good as it had looked from outside, for a while. Then one day the prince came through the town, and the whole street went down on its faces in the dust, including the rich man, and he lay there with his forehead on the ground and thought: how I wish I were the prince.",
    "You are the prince.",
    "He rode in the carriage. People knelt. And it was good until an afternoon in high summer when he noticed that the sun was burning his face through the canopy, and that the sun did not care at all that he was a prince, and that the fields either side of the road were cracking open under it.",
    "How I wish I were the sun.",
    "You are the sun.",
    "He burned. He scorched the fields and split the earth and made the princes miserable in their carriages, and this was better than anything so far, until a cloud came between him and the world and there was nothing whatever he could do about it.",
    "How I wish I were a cloud.",
    "You are a cloud.",
    "He rained. He flooded the fields and swelled the rivers and washed away the houses, and he could put out the sun itself, and it was very good indeed — until he found that everything he poured down moved, and moved, and washed away, except one thing, standing exactly where it had stood, not caring.",
    "A great rock.",
    "How I wish I were the rock.",
    "You are the rock.",
    "And now he was immovable. Nothing shifted him, nothing wore him, the sun could not crack him and the rain ran off. This was the end of wanting, and he stood in it the way a mountain stands.",
    "Then he felt something at his base. A small, hard, regular blow, and another, and another. He looked down.",
    "There was a man at the foot of him with a chisel, taking him apart.",
    "How I wish I were a man, said the rock.",
    "And he was a stonecutter, at the rock face, in the morning, with a chisel in his hand.",
    "The thing to notice is that nothing in this story was a lie. He really was richer. He really was more powerful. Every single step up was a genuine step up and the voice never once cheated him — he got exactly what he asked for, immediately, at no cost, which is a bargain nobody in any other story ever gets.",
    "And it went nowhere. Not because the positions were worthless but because of what he was doing in each of them, which was looking sideways.",
    "He never once, in any of those lives, was defeated by the life. He was defeated by the view from it. From the courtyard he could see a prince. From the carriage he could see the sun. Every position in the world has something above it that is visible only once you get there, and a man who moves because of what he can see from where he stands will move for ever, because the seeing comes with the standing.",
    "And here is the part that stings.",
    "The stonecutter at the end of the story is chipping away at a rock that the sun cannot crack and the flood cannot move. He is, at that moment, doing something the most powerful thing in the story could not do. He was always doing it. He did it every morning of his life before any of this started, and he never once looked at his own hands, because he was looking at the courtyard.",
    "The loop is not a punishment. He is not sent back in disgrace. He is put down exactly where he was, holding exactly what he was holding, and the only thing that has changed in the entire story is that now he has seen the whole ladder and knows there is no top to it.",
    "That is the only thing that was ever going to change."
  ] },
{ id:'monks', stage:'The Trials', bg:'delta', mins:3,
  n:'Two Monks and the Woman at the Ford', src:'Zen · Tanzan and Ekido',
  laws:[{n:'Attachment',f:'inner'},{n:'Rhythm',f:'time'}],
  rule:'You put it down hours ago. Somebody is still carrying it, and it is you.',
  q:'What did you set down that you are still holding?',
  teach:'Tanzan and Ekido were real, and this exchange is told as something that happened on a road. Zen keeps it because it is the shortest available demonstration that an event and the carrying of an event are two different things, and only one of them takes any time.',
  body:[
    "Two monks were walking to the next town along a road that the rain had ruined.",
    "Tanzan was the older. Ekido was younger and stricter, in the way that younger and stricter usually go together, and they had been on the road since before light.",
    "At a crossing where the track went down to a ford they came on a girl in a silk kimono, standing at the edge of the mud, looking at it. She was dressed for somewhere else entirely. The water was over the stones and the whole crossing was churned up, and she had been standing there long enough that it was obvious she had run out of ideas.",
    "Tanzan said, come on, girl, and picked her up, and carried her over, and set her down on the dry side.",
    "Then he walked on.",
    "Ekido came over the ford behind him and did not say anything.",
    "He did not say anything for the rest of the morning. He did not say anything through the middle of the day, or in the afternoon, or when they stopped to drink, and Tanzan — who was talking about ordinary things, the road, the weather, what they would find at the temple — did not appear to notice that only one of them was doing it.",
    "It went on like that until nightfall.",
    "When they reached the temple, and had washed, and were about to go in, Ekido could not hold it any more.",
    "We monks do not go near females, he said. Especially not young and lovely ones. It is dangerous. Why did you do that?",
    "And Tanzan said: I left the girl there. Are you still carrying her?",
    "Everything in this story is in the timing, so hold onto the shape of the day.",
    "Tanzan carried her for about four seconds. Ekido carried her for eleven hours, in silence, uphill, while also carrying his own pack.",
    "And Ekido is not a villain here. This is the thing people get wrong when they tell it as a joke at his expense. He was keeping a rule he had genuinely taken on, he was right that it was the rule, and he did not even complain about it — he held it in all day, which he probably thought was the disciplined thing to do. Every part of his behaviour was what a serious person does.",
    "It just was not about the girl any more, and it had not been since the ford.",
    "The ford took four seconds. Everything after that was his.",
    "That is the mechanism, and it is worth being precise about it rather than sentimental. An event has a duration. It starts and it stops. What comes after is a second thing that you are doing, and it can run for as long as you keep doing it, and it will run at full strength for eleven hours or eleven years without weakening, because it is not being fed by the event — the event is over. It is being fed by you, continuously, which is why it never runs out.",
    "And the giveaway is always the same: the sentence arrives fully formed, hours or years late, as though it were the next thing said in a conversation. We monks do not go near females. He had been having that conversation all day. Tanzan had not been in it.",
    "Notice also that Tanzan does not defend himself. He is asked why he did it and he does not explain about compassion, or about the rule and its purpose, or about the spirit against the letter — all of which were available and all of which would have been an argument, and an argument is a thing Ekido could have carried for another eleven hours.",
    "He asks one question instead, and the question does not have an answer, because the honest answer is yes.",
    "The girl got across the mud. Whatever it is you are still carrying got wherever it was going a long time ago, and the weight in your arms tonight has nothing in it but your own grip."
  ] },
{ id:'knot', stage:'The Ordeal', bg:'iceberg', mins:5,
  n:'The Knot Nobody Could Untie', src:'Greek · Alexander at Gordium',
  laws:[{n:'Cause and Effect',f:'motion'},{n:'Strategy',f:'others'},{n:'Decision',f:'motion'}],
  rule:'Most impossible problems are ordinary problems with a rule attached that nobody checked.',
  q:'Who told you it had to be untied?',
  teach:'Told about Alexander at Gordium in 333 BC and kept for two and a half thousand years, which is worth noticing on its own: what survives is not the campaign, it is thirty seconds with a sword. Some versions have him pull out the pin instead. Both endings are the same story.',
  body:[
    "In the citadel at Gordium there was an old wagon with its yoke lashed to the pole by a knot of cornel bark.",
    "Nobody could say how old it was. It had been there long enough that the bark had dried and set into something nearer to wood than to rope, and the ends had been worked back inside so that there was no loose piece anywhere on it — you could turn it over in your hands and find nothing to begin with.",
    "The oracle attached to it was well known. Whoever untied the knot would rule all of Asia.",
    "So men had been coming for a long time. Not fools — the rich, the patient, the clever, men with good hands and time to spend. They would work at it for an afternoon or for a month. They pressed and eased and looked for the end that had to be in there somewhere, because a knot is a rope that has been folded, and a folded rope has two ends, and everyone knew that.",
    "And nobody untied it. That was the situation when Alexander came through, twenty-two years old, at the start of everything.",
    "He was shown up to the citadel and he looked at it for a while. He turned it over the way everybody turned it over.",
    "Then he drew his sword and cut it in half.",
    "Now, what happened in that moment, because it was not strength and it was not cheating.",
    "The oracle said: whoever unties the knot rules Asia. Read it again slowly. It says nothing about fingers. It does not say the knot must be loosened, or preserved, or that the wagon must be usable afterwards. Everybody who had knelt in front of that thing for three hundred years had been working on a problem with an extra rule in it — that the rope must survive — and that rule was not in the oracle. It came from what a knot is, and what you do with knots, and what everybody else on the hill was doing.",
    "Nobody put it there on purpose. It arrived with the object.",
    "That is the whole of it and it is not a story about boldness. A bold man would have pulled harder. It is a story about a young man who read the actual sentence rather than the sentence everybody had agreed on, and then noticed that the constraint doing all the work was one nobody had ever said out loud.",
    "This is the commonest shape an impossible problem has.",
    "Not a hard problem — hard problems are hard, and no amount of reframing makes them easy. This is the other kind: an ordinary problem with a rule attached to it that nobody remembers adding and nobody has checked. It has to be done this way. We have always. It would not be a proper one otherwise. And because the rule is unspoken, it is not up for discussion, and because it is not up for discussion, three hundred years of intelligent people can work on the wrong problem in a row without one of them noticing.",
    "The test for it is simple and it is not comfortable, because it requires you to write out what you were actually asked to do, in the plainest words you can manage, and then go through your own approach line by line asking of each part: where did that come from? Was it in the sentence? Or did it come in with the object?",
    "Most of the time you will find at least one thing in there that nobody ever required of you.",
    "Two more things about the sword.",
    "He did it in front of everybody. There is no version where he takes the wagon away to work on it in private and comes back with it neatly undone. The whole point of the gesture is that it is public and that it admits exactly what it is — he is not pretending to have solved it their way.",
    "And it worked. The oracle held. He took Asia, which is the detail that makes this a story rather than an anecdote about a vandal: the prophecy did not quibble, because the prophecy had never said what everyone assumed it said.",
    "The knot had been waiting three hundred years for somebody to read it."
  ] },
{ id:'pocket', stage:'The Reward', bg:'iris', mins:4,
  n:'The Diamond He Was Carrying', src:'Hindu · Ramakrishna',
  laws:[{n:'Correspondence',f:'inner'},{n:'Sufficiency',f:'time'}],
  rule:'Having it and knowing you have it are two different acquisitions.',
  q:'What do you already have that you are still trying to get?',
  teach:'From the Ramakrishna tradition, and it is the one story in this set where the person gets everything they wanted, keeps it for three days, and then comes back to hand it over. That is the whole of the teaching and it is why the Reward is a stage rather than an ending.',
  body:[
    "A poor man, walking, came on a sadhu asleep under a tree at the edge of the road, and stopped, because there was something lying beside him in the dust.",
    "It was a stone about the size of a plum, and it was a diamond, and even a man who had never seen one knew what it was, because there is nothing else that does that with the light.",
    "The sadhu woke up.",
    "The poor man did not try to hide what he had been looking at. He asked for it outright — he had nothing, he said, and he would have everything if he had that.",
    "Take it, said the sadhu. I found it in the riverbed last week. Take it, it is yours.",
    "And he rolled over and went back to sleep.",
    "The poor man walked away with the stone in both hands, and by the time he reached the town he had the whole of the rest of his life laid out. He did not sleep that night. He did not sleep well the next one either.",
    "Three days later he walked back out along the road and found the sadhu still under the tree, and put the diamond down beside him in the dust where it had been.",
    "Then he said: give me the thing that lets you give this away.",
    "That is the story. It is very short and almost nobody tells it right, because the temptation is to make it a story about a man who learns that wealth does not make you happy, and it is not that, and three days is far too soon for it to be that.",
    "He did not get disillusioned in three days. He was not sick of it. He had barely started.",
    "What happened to him in those three days is that he found out what having it was actually like — and the answer was that he could not put it down. He could not sleep because of where it was in the room. He could not walk into the town square without thinking about who had seen him. He had been rich for seventy-two hours and he had already learned that the stone had him quite as much as he had the stone.",
    "And then he remembered the man under the tree, who had found the most valuable object either of them had ever seen, put it in the dust, and gone to sleep next to it.",
    "That is not indifference. Read that part carefully. The sadhu did not despise the diamond, he did not lecture anybody about it, he did not refuse to pick it up. He knew exactly what it was. He simply was not gripping it, and because he was not gripping it, he could hand it to a stranger without the smallest effort and go back to sleep.",
    "So the poor man came back and asked for the real thing, and the real thing was never in the riverbed.",
    "Now, this is the stage of a journey where you get what you came for, and there is a reason every tradition puts a turn here rather than an ending. The reward arrives. It is real — nobody is pretending the diamond is glass. And the moment it is in your hands you discover that it came with a second thing you did not ask for, which is the fear of it leaving, and that the second thing is heavier than the first.",
    "Every version of this you will live is the same shape. The job you wanted, and the three days of lying awake working out how not to lose it. The person, and the grip. The thing you built, the week after it finally worked.",
    "What the poor man asks for at the end is not a technique and it cannot be given. But he is the only person in the story who knows what to ask for, and he knows it because he had the diamond — not in spite of having had it.",
    "You cannot be told this one either. Three days of holding it is the shortest course there is."
  ] },
{ id:'bridge', stage:'The Road Back', bg:'cobalt', mins:5,
  n:'The Bridge You Burn Behind You', src:'Ours',
  laws:[{n:'Commitment',f:'motion'},{n:'Polarity',f:'time'}],
  rule:'A door left open behind you is a decision you have not finished making.',
  q:'What are you keeping open in case this does not work?',
  teach:'Ours, though the move is older than any of us — commanders have been burning their own boats on landing for as long as there have been boats, and always for the same unsentimental reason. It is put here as a bridge because most people’s version of this is not a fleet, it is a door.',
  body:[
    "A man crossed a gorge on a rope bridge and arrived on the other side with everything he owned.",
    "This was the crossing he had been working toward for eleven years, and he had done it, and there is nothing in this story that takes that away from him. He put his pack down on the far rock in the sunshine and looked back across.",
    "The bridge was still there.",
    "It was not in his way. That is the first thing. It did not cost him anything to leave standing and it took up no room, and there was no sensible argument for going back and cutting the ropes — you do not destroy a working bridge out of a gesture. Anyone would have left it.",
    "So he left it, and got on with the new life, and it was a good one.",
    "But here is what he did, and he did it perhaps twice a week for the rest of his life, and it never once looked like a decision.",
    "When the work went badly, he thought about the bridge. Not in words. He did not make a plan and he never seriously considered going back — if you had asked him outright he would have laughed and meant it. He simply knew, in the ordinary background way that you know where the door is in a dark room, that the bridge was there.",
    "And every time he knew it, a small amount of the weight came off whatever he was standing in.",
    "That is what a way back does. It is not that you use it. Almost nobody uses it. It is that it drains a few degrees of pressure out of every hard thing, continuously, for years — and the pressure was the thing that was going to make you finish.",
    "Think about what he did not do, because of it.",
    "He never learned the far country the way a man learns a place he cannot leave. He never made the friend you make when there is nobody else. He did not take the risk in the fourth year that would have cost him everything, because everything was not actually at stake — there was a bridge. He was a resident of the far side for forty years and he was never quite an inhabitant of it, and if you had pointed this out to him he would not have known what you were talking about, because nothing had ever visibly gone wrong.",
    "That is the difficulty with this one. There is no scene where it costs him. There is no morning where he wakes up and finds the bridge has ruined him. It is a slow leak with no floor to drip onto.",
    "Now, the argument for keeping it, which is not stupid and deserves a straight answer.",
    "Cutting the bridge is irreversible and irreversible things go wrong. A man who burns his boats and then finds the far country is a swamp has done something extremely foolish and there is no shortage of those. Optionality is worth real money.",
    "All true. And notice that all of it is an argument for keeping the bridge before you cross.",
    "He had eleven years to decide whether the far side was the right side. He used them. He was thorough. The decision was made, by him, with all the information, and the crossing was the last act of it — and the bridge he kept afterwards was not optionality, because there was nothing left to be optional about. It was a hedge against a decision he had already taken, which is not a hedge at all. It is an unfinished decision, standing there in the weather, quietly costing him a little every week.",
    "There is a version of him who walked back to the middle of the bridge on the second morning, and cut it, and stood on a rock with no way home, and was frightened in a way he had not been frightened before.",
    "That man learned the country."
  ] },
{ id:'mountain', stage:'The Return', bg:'turtle', mins:5,
  n:'The Old Man Who Moved the Mountains', src:'Chinese · Liezi',
  laws:[{n:'Perpetual Transmutation',f:'motion'},{n:'Rhythm',f:'time'},{n:'Legacy',f:'time'}],
  rule:'The work outlives the worker, which is the only reason it is worth starting.',
  q:'What are you refusing to begin because you will not see it finished?',
  teach:'From the Liezi, third or fourth century BC. It is the last story in this arc because it is the only one whose whole argument is about what happens after the person telling it is dead — which is the only honest place a journey about showing up can end.',
  body:[
    "Two mountains stood in front of the Old Man of the North, and they were the reason his life was what it was.",
    "Taihang and Wangwu, seven hundred li around and immensely high, sitting directly between his village and everywhere else. Every journey anybody made went the long way round them. It had always been so.",
    "He was ninety years old when he called his family together and said they should remove them.",
    "They discussed it, as families do, and then they went out with baskets and hoes and began digging at the foot of the nearer mountain and carrying the earth to the sea. It was a long way to the sea. A man could make the round trip roughly once in a season.",
    "A neighbour called the Wise Old Man of the River Bend came to watch, and laughed at him.",
    "You are extremely old, he said. What strength have you got left? You will not shift a hair of that hill before you die. Look at yourself. Look at the size of it.",
    "And the Old Man of the North said this, which is the reason anybody remembers the story.",
    "When I die, my sons will go on. When they die, there will be their sons, and their sons’ sons, and so on without end. The mountain does not get any bigger.",
    "The Wise Old Man had nothing to say to that.",
    "It is a good argument and it is worth stopping on, because the Wise Old Man was not being stupid. Everything he said was factually correct. The old man would in fact die long before any visible difference appeared, and he did not have the strength, and the mountains were exactly as big as they looked. He had run the numbers properly.",
    "He had simply put the wrong quantity in one of them. He had measured the work against a life, and the old man was not measuring it against a life.",
    "That is the whole disagreement, and it is not a disagreement about mountains. Every argument you will ever have with yourself about whether a thing is worth starting is this argument, and you are usually taking the Wise Old Man’s side without noticing, because his side sounds like realism.",
    "It is only realism if the unit is you.",
    "There is a second half to the story, and people are often disappointed by it, so it is worth defending. The spirits who held the mountains heard him, and were alarmed, and reported it to the Emperor of Heaven, and the Emperor was moved by his sincerity and ordered the two mountains carried away. And they were, and after that there was no obstruction between the village and the south.",
    "That reads as a cheat — he does not really do it, the gods do it.",
    "But look at what actually moved the mountains. Not the digging. The digging was two seasons of an old man and his sons carrying dirt, and it had achieved nothing measurable. What moved them was that he had made a commitment which did not depend on his own lifetime, and had said so out loud, to a man who was mocking him, without flinching.",
    "The spirits were not alarmed because the hole was getting big. They were alarmed because they had worked out that he was not going to stop, ever, and that there was no version of the future in which this ended with the mountains still there.",
    "That is not a story about divine reward. That is a fairly exact description of how large things actually get done, and it is why the Return is the last stage and not the victory.",
    "A man comes back from wherever he has been carrying something. The thing he carries is almost never finished in his hands. What he has instead is a certainty about direction that survives being laughed at by somebody whose arithmetic is better than his — and it turns out that the world moves for that, sooner or later, and often in ways nobody predicted and nobody is willing to write down as cause and effect.",
    "The mountain does not get any bigger.",
    "That is the only fact in the story, and it was available to both of them."
  ] }
];
