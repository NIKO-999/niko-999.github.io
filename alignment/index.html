        ["The law", "The book's central law is that a wish is realised by feeling its fulfilment as already so. Desire alone is not enough, and neither is a statement of the wish. What produces the result, in the book's account, is the feeling that would be yours if the wish were already granted, taken on and kept until it is natural. The feeling, and not the thought or the words, is the secret the title refers to."],
        ["How it works", "The book separates the wish from the state. A wish, spoken or thought, is a statement that something is lacking, and it keeps the thing at a distance. The state is the felt reality of having it. According to the book, the subconscious responds to the state a person is in and not to what they say, so it is the feeling that is impressed on it. The person is asked to form a brief scene that would imply the wish is fulfilled and to enter it until it feels real. Once the feeling is established, the person lets go of the wish and goes on with their life, trusting the state to do its work. The law places all of the effort in the inner act and none in the attempt to manipulate outside events."],
        ["Where it operates", "In any area where a result is wanted, since the book holds the principle to be general. In health, where it speaks of the feeling of being well. In relationships, where it speaks of the feeling of being loved. In work and money, where it speaks of the feeling of having arrived. In self-image, where the habitual feeling about yourself becomes the pattern of a life. And in the way a person describes their wishes to themselves."],
        ["How you can tell", "A change in feeling about yourself is followed by a change in what you do and attract. The same wish held in a state of lack does not move. Settled calm about an outcome coincides with its arrival. You can tell the difference between wanting something and feeling it as yours. Excitement and urgency mark that it is still held as a want."],
        ["What it is not", "It is not wishing hard, and it is not positive thinking. It is not an affirmation repeated in words without the feeling. It is not a method with a demonstrated mechanism, and the book offers it as a teaching and not as a measured result. And it does not replace action when action presents itself: the book assumes the person will do what the new state suggests."]
      ] },
    { n: "The State Akin to Sleep", b: "Impressing the Subconscious When Resistance Is Low",
      r: [
        ["The law", "The book's method for taking on a feeling is to do it in a state akin to sleep, the drowsy condition between waking and sleeping. In that state the person is relaxed and the critical mind is at rest, so the subconscious is receptive and a feeling can be impressed on it with the least resistance. The law is a claim about when the mind accepts what it is given."],
        ["How it works", "The book describes the waking mind as a filter that argues with, rejects and qualifies what it is told. When a person is awake and alert, a statement that conflicts with their view of themselves meets resistance and does not settle. As the person relaxes toward sleep, the filter loosens and the mind becomes more open, and a feeling or scene held at that point is taken in without argument. The method therefore times the practice for the moments before sleep, when the person is able to rest in the feeling of the wish fulfilled and carry it into sleep. The law explains why the same sentence repeated during the day can have little effect and why the feeling held at the edge of sleep is held to be more potent. It gives a specific moment for the practice and a reason for choosing it."],
        ["Where it operates", "In evening routine, where the last thoughts before sleep are treated as significant. In the practice of imagination, which needs a relaxed body. In the handling of worry, since the state at the edge of sleep is shaped by what the person has last been thinking. And in any attempt to change an established belief, which meets less resistance in a receptive state."],
        ["How you can tell", "The person can feel the shift from alert to drowsy and notice that thoughts become more suggestible. Worries held at night seem larger and more convincing. The mood on waking follows the last thoughts of the night. A statement that is resisted by day feels more acceptable when drowsy."],
        ["What it is not", "It is not hypnosis, though it borrows the idea of reduced resistance. It is not a claim that sleep itself brings results. It is not a requirement for the method, since the book allows that the feeling can be held at other times. And it has no established mechanism: the claim is the book's, and it is held as a practice and not a finding."]
      ] },
    { n: "Everything Comes From Within", b: "The World Is the Report of the Inner State",
      r: [
        ["The law", "The book holds that nothing comes from without: what appears in a person's life is the expression of what is in their mind. Circumstances, events and the behaviour of other people are held to be the outer form of inner states, and the way to change them is to change the state. The law is the book's account of where causes are located."],
        ["How it works", "The book treats the inner world as the cause and the outer as the report. A person's habitual feeling about themselves and their life is the real condition of their life, and the events that arrive correspond to it. This is why the book regards effort directed at outside circumstances as secondary: the outside is an effect, and working on it alone leaves its source in place. Taking the law seriously changes where a person looks. Instead of asking what is happening to them, they ask what state they are in, and they treat the outside as information about it. The book adds that the inner states are not fixed: the habitual mood can be changed, and the circumstances then change in time with it."],
        ["Where it operates", "In how a person interprets events, which reveal as much about the viewer as the event. In patterns across a life, which are read as inner patterns. In mood, which is treated as the quiet cause of many outcomes. In self-image, which the book holds to shape what a person expects and so receives. In relationships, where the way a person feels about themselves is said to set the way others treat them. And in reaction to setbacks."],
        ["How you can tell", "Your circumstances match your habitual feeling about yourself. A lasting change of mood is followed by a change of events. The same type of event recurs while the inner state is unchanged. Others treat you much as you feel you should be treated."],
        ["What it is not", "It is not a claim that people cause everything that happens to them, since accidents, illness and the actions of others are not adequately explained by inner states. It is not a reason to blame anyone for misfortune. It is not a demonstrated mechanism, and the book's version is a teaching. And it does not dismiss action: the book assumes that a person in a changed state will act differently."]
      ] }
  ],
  sogr: [
    { n: "The Law of Creative Thought", b: "Thought Produces the Thing Imagined",
      r: [
        ["The law", "The book's first principle is that a thought held in the formless substance from which all things are made produces the thing the thought represents. A person can therefore form a thing in thought and, by holding the thought, cause the thing to be created. The principle is the foundation of the book's method and the reason the book puts so much weight on what a person thinks."],
        ["How it works", "The book begins with a claim about the nature of things: there is one thinking substance from which everything comes, and it takes the shape of the thoughts impressed upon it. A person is a thinking centre that can impress that substance, so their thought of a thing, held with faith, results in the thing. The book states three fundamental propositions in this form. It then draws a practical conclusion. Because a thought produces its object, the person has to think about what they want and not about what they lack, and they have to hold the thought of the thing as already coming to them. The law gives thinking the role of first cause, with action following as the means by which the thing is brought into form."],
        ["Where it operates", "In goals and ambition, where the thought of the aim is the starting point. In the use of imagination, which forms the picture to be held. In faith, which the book treats as the quality that makes the thought effective. In worry, which holds the thought of what is feared. In work and business, where the thought of the result comes before the work. And in the habit of thinking about riches and not about poverty."],
        ["How you can tell", "Results follow the quality and persistence of a person's thought about them. Dwelling on lack produces more of it. A person who holds a clear picture of an outcome behaves in ways that fit it. A change in dominant thought is followed by a change in conduct. A vague thought produces a vague result."],
        ["What it is not", "It is not a statement of established science, and the formless substance is a doctrine of the book. It is not a claim that thought alone produces results, since the book insists that action must go with it. It is not a guarantee. And it does not mean that a thought produces any outcome at will: the book places conditions on the process."]
      ] },
    { n: "The Certain Way", b: "Getting Rich as an Exact Science",
      r: [
        ["The law", "The book holds that getting rich is the result of doing things in a certain way, and that anyone who does them in that way will get rich, whatever their circumstances. It treats wealth as the product of a method and not of opportunity, talent or luck. The law is the claim that results follow a way of acting, so that the same actions produce the same results for whoever carries them out."],
        ["How it works", "The book argues from regularity. If getting rich were a matter of chance or circumstance, it would not follow from any method. Since some people get rich from any starting point and in any place, and since others fail in the same place with the same opportunity, the book concludes that the difference lies in how people think and act. It then states that a person who does things in the certain way must succeed, as a person who follows a mathematical rule must reach the right answer. It describes the way as a combination of the thinking set out in the book and efficient action in the present. The law rejects the idea that the environment or lack of capital is the decisive factor, and moves the responsibility to the method."],
        ["Where it operates", "In explanations of success and failure, where the book sets aside circumstance. In goals, where the focus is on the method and not on the conditions. In the sense of what is possible, which is widened by the claim that anyone can succeed. In the way a person regards their present situation, as a place to start. In work, where the way of doing things is treated as decisive. And in responsibility, which the law places on the person."],
        ["How you can tell", "People starting from nothing succeed by a consistent set of practices. Those in favourable circumstances fail when they lack them. A change in method is followed by a change in results. A person who has found a way that works can repeat it. Complaints about conditions are replaced by questions about method."],
        ["What it is not", "It is not a promise that anyone who reads the book will get rich, since the method has to be carried out. It is not a denial that circumstances matter. It is not a measured scientific claim, and the book's language of exactness is rhetorical. And it should not be read as saying that people who are poor have failed to follow a method."]
      ] },
    { n: "Use Value Over Cash Value", b: "Give More Than You Take",
      r: [
        ["The law", "The book's ethical law is that a person should give every individual more in use value than they receive in cash value. Each exchange should leave the other party better off, so that their life is advanced by dealing with you. The book treats this as both an ethical rule and a condition of getting rich in the way it describes, since the wealth it has in mind is built on creation and not on taking."],
        ["How it works", "The book separates two ways of getting rich. One is by competition, in which a person takes from others and gains at their expense. The other is by creation, in which a person produces something new and benefits all who deal with them. The book holds that only the second is consistent with its method. It therefore requires that what a person gives in each exchange be worth more to the receiver than what they pay. The law also contains an attitude: the person is to think of every transaction as an opportunity to add to the life of the other. It treats the giver as the main beneficiary, since the more value a person adds, the more they are sought out and the more they receive."],
        ["Where it operates", "In business, where the product or service has to be worth more to the customer than its price. In employment, where the value of the work should exceed the pay. In relationships, where the exchange of benefit should favour the other. In the sense of one's own role, which is to advance life and not simply to collect. In reputation, which grows from giving good value. And in ethics, where the law sets a standard for gain."],
        ["How you can tell", "Customers return to those who give them more than they paid for. A person known for adding value is sought out and is rewarded for it. A deal that benefits only one side is not repeated. Success built on providing value is steady, and success built on taking tends to need constant replacement of the people taken from."],
        ["What it is not", "It is not a rule that a person must give things away, since the book requires a fair cash return. It is not a guarantee that value given is always recognised. It is not a demonstration that creation always pays better than competition. And it is partly a moral claim and not a purely economic one."]
      ] },
    { n: "The Law of Increase", b: "Life Is Always Moving Toward More",
      r: [
        ["The law", "The book holds that life seeks fuller expression in everything. Every living thing is driven to increase, and the desire for more, whether more money, knowledge or ability, is the universe's own movement acting through the person. The law is the claim that wanting to be richer is natural, since it is life's drive toward greater fullness and not a fault of character."],
        ["How it works", "The book describes a universe that is intelligent and moving toward greater life, and a person as a part of it. The desire to increase is therefore the same impulse as the one that drives growth in plants and minds. This gives the person's wish for more a standing: it is aligned with the way things move and is not opposed to it. The book draws a practical consequence. Since the movement is toward increase, the person who holds a clear intention to increase, acts in keeping with it and does not oppose it with doubt is working with the current. The book also ties the law to giving and thankfulness: the person who gives value and is grateful keeps themselves in the flow."],
        ["Where it operates", "In the sense of ambition, which the law treats as natural. In growth of skill, where a drive to improve is a form of increase. In money, where wanting more is described as part of life's urge to expand. In relationships and learning, where more connection and understanding are forms of increase. In dissatisfaction, which the law reads as a signal of capacity to grow. And in thankfulness, which the book links to receiving more."],
        ["How you can tell", "A person feels a persistent wish to grow, learn or earn more that does not go away. Satisfaction with a fixed state tends not to last. Work that adds value feels more energising than work that merely maintains. A person who is open to increase notices more ways to achieve it. Stagnation feels like a departure from a natural direction."],
        ["What it is not", "It is not a physical law, and the claim that the universe is moving toward more life is a belief of the book. It is not a justification for greed. It is not a statement that increase is always good or that more of anything is better. And it does not mean that increase comes without action."]
      ] }
  ],
  cyb: [
    { n: "The Self-Image", b: "You Act Like the Person You Believe Yourself to Be",
      r: [
        ["The law", "The book's central law is that a person's self-image sets the boundaries of what they can achieve. A person behaves in line with the picture they hold of themselves, whether or not they are aware of holding it, and results follow behaviour. Changing the picture, the book holds, changes what a person does and so what happens to them."],
        ["How it works", "The self-image is described as a mental blueprint made of beliefs about who one is, built from past experience, the way one has been treated and the conclusions drawn from success and failure. It operates as a standard. A person feels uncomfortable acting outside it and, without noticing, behaves in ways that bring them back. A person who sees themselves as unlucky, shy or unsuited to success will find that their conduct, perception and results confirm the picture. The book states that the self-image is not fixed, since it is built from experience and can be rebuilt. The law is therefore both an explanation and a method: the explanation of why effort so often returns to the same result, and the method of altering the picture on which behaviour depends."],
        ["Where it operates", "In confidence and performance, where a person tends to act within the range their self-image allows. In relationships, where self-worth shapes what a person accepts. In money and career, where a person's sense of what they deserve limits what they pursue. In appearance, which the book treats as bound up with the sense of self. In health and recovery, where expectations affect experience. And in response to failure, which reinforces or revises the image."],
        ["How you can tell", "A person's results stay within a band despite varied effort. A person is uncomfortable when things go better than they expected. They describe themselves in fixed terms and behave accordingly. A change in the way they see themselves is followed by a change in conduct. Compliments or achievements that conflict with the image are dismissed."],
        ["What it is not", "It is not a claim that thinking well of yourself produces results by itself, since the book ties the self-image to action and experience. It is not an assertion that the self-image is easily changed. It is not a measured physical mechanism. And it does not deny the role of talent, opportunity and circumstance."]
      ] },
    { n: "The Servo-Mechanism", b: "The Goal-Striving Machine",
      r: [
        ["The law", "The book describes the brain and nervous system as a goal-striving servo-mechanism, a mechanism that steers toward a goal by correcting its course as it goes. Given a clear target, it works automatically to reach it, adjusting from the feedback it receives. The law is the claim that a person has a built-in success mechanism that operates on the goals it is given and on nothing else."],
        ["How it works", "The book takes the idea from engineering. A servo-mechanism, such as a self-guided torpedo, does not know the route in advance. It has a goal and a means of detecting error, and it reaches the goal by moving, finding it is off course, and adjusting repeatedly. The book proposes that the human mind works in this way. It is given a target, which it pursues through trial and error, using feedback to correct itself. The mechanism is impersonal: it works toward whatever target is set, so a clear and positive goal is pursued and a negative or confused one is as well. The consequences are practical. The person is to supply a definite goal and trust the mechanism to find the means, and is to treat errors as information for correction and not as failures."],
        ["Where it operates", "In goals, where a clear target gives the mechanism something to work toward. In skill, which develops by trial, error and correction. In creative work, where ideas come once the problem is posed. In problem solving, where the mind continues to work on a question after attention has moved. In habits, where the mechanism carries out the pattern it has been given. And in anxiety, where it works on a fear in the same way as on a hope."],
        ["How you can tell", "Ideas relevant to a problem arrive after the problem has been clearly stated. A skill improves with practice even when the person does not consciously understand why. A goal held clearly attracts relevant observations and opportunities. A confused aim produces confused behaviour. Mistakes lead to adjustment and not to abandonment in people who use it well."],
        ["What it is not", "It is not a literal machine, and the book's engineering comparison is an analogy. It is not a claim that the mechanism chooses worthwhile goals. It is not a substitute for effort. And it does not guarantee that a goal can be reached: it describes how the mind pursues the goals it is given."]
      ] },
    { n: "Imagination Is Practice", b: "The Nervous System Cannot Tell the Difference",
      r: [
        ["The law", "The book holds that the nervous system reacts to an imagined experience in much the same way as to a real one. A situation vividly imagined and a situation actually lived leave similar traces, so mental rehearsal builds skill and confidence and a mentally rehearsed failure builds the habit of failing. The law makes imagination a form of practice."],
        ["How it works", "The book treats the brain as unable to separate a vivid imagined experience from a real one, at least in the way it records and responds to them. A person who rehearses a task in thought is therefore exercising the same pathways that the task will use. Where the rehearsal is of success, the person builds a pattern and a sense of ease. Where it is of failure or dread, the pattern is of failure or dread. The book accordingly prescribes deliberate imagery of the desired performance, held in detail, as a way to build the self-image and the skill. It also describes how the same mechanism produces anxiety: a person who keeps imagining a feared outcome is practising it. The law therefore ties together imagination, memory and habit."],
        ["Where it operates", "In performance, whether in sport, speaking or any skill, where rehearsal in thought prepares the response. In confidence, where repeated mental pictures build a sense of capability. In fear, where imagined catastrophes are rehearsed as if they were real. In memory, where imagined events can become part of how a person sees their past. In learning, which is helped by picturing the skill. And in the self-image, which is formed partly from imagined experience."],
        ["How you can tell", "A skill improves after mental rehearsal. Imagining a difficult situation produces some of the physical response of being in it. A person who has pictured an event many times finds it more familiar when it arrives. Repeated worry produces a sense of having lived the feared event."],
        ["What it is not", "It is not a statement that imagining an action replaces doing it, and the book pairs imagery with actual practice. It is not a claim that the two are identical at every level. It is not a promise that positive imagery produces success. And the finding it rests on is the book's account of the nervous system and is not a complete description of it."]
      ] }
  ],
  subc: [
    { n: "The Law of Belief", b: "It Is Done Unto You as You Believe",
      r: [
        ["The law", "The law of belief is the book's central principle: what a person truly believes, they experience. The subconscious mind carries out the convictions it has accepted, so the beliefs a person holds, and not the ones they state, shape their health, relationships and circumstances. The law places belief at the controlling point of a life and makes the quality of belief the thing to attend to."],
        ["How it works", "The book describes a conscious mind that chooses and a subconscious mind that accepts. What the conscious mind firmly believes is passed to the subconscious, which then acts on it by directing feeling, behaviour and the body. The point is that belief is not a stated opinion but a conviction held at a deep level, and the subconscious works with what it holds and not what the person says. For this reason a person who wants one result and believes in another gets the one they believe in. The book also notes that belief is a thought a person has accepted: a belief can be changed by changing the thoughts the person accepts, repeatedly and with conviction. The law therefore treats the content of belief as the lever."],
        ["Where it operates", "In health, where belief about the body and recovery is held to influence experience. In success and money, where convictions about what is possible set the range of effort. In relationships, where expectations shape behaviour. In fear and anxiety, which operate through what a person believes will happen. In prayer and intention, which the book treats as acts of belief. And in the way a person reads their own situation."],
        ["How you can tell", "A person's results match their real convictions and not their stated aims. A change of deep belief is followed by a change of behaviour and result. A person who says they want something and expects not to get it does not get it. People describe themselves with beliefs they cannot trace to evidence. Doubt in the background undoes stated intentions."],
        ["What it is not", "It is not a claim that wishing makes things so. It is not a statement that any belief is true because it is held. It is not a substitute for medical or practical action, and the book's treatment of health is a claim and not a demonstrated cure. And it is not instant: a belief that has been held for years is not replaced by a single decision."]
      ] },
    { n: "The Law of Suggestion", b: "The Subconscious Accepts What It Is Given",
      r: [
        ["The law", "The subconscious mind, the book says, does not argue or judge. It accepts the suggestions impressed on it by the conscious mind, by other people and by circumstances, and acts on them. It takes the negative along with the positive, so a thought of failure impressed on it works as surely as a thought of success. The law is the claim that the mind responds to what it is told, and that what it is told is largely a matter of what it is repeatedly given."],
        ["How it works", "The book separates the two levels of mind. The conscious mind reasons, compares and chooses. The subconscious has no such faculty and takes up whatever is impressed upon it by repetition and feeling. It is in this sense impersonal: it works on the material it receives without judging it. A suggestion can come from within, as a thought or an inner statement, or from outside, as something said by a person or repeated by the surroundings. Whatever is repeated and felt becomes impressed. For that reason the book stresses what a person says to themselves, particularly in states of fear and in the moments before sleep, and it treats the control of suggestions as central to the control of life. The law places responsibility on the choice of thought and on the choice of company."],
        ["Where it operates", "In self-talk, where inner statements act as suggestions. In upbringing, where what a person was told in childhood sits in the subconscious. In media and surroundings, which supply a steady stream of suggestion. In health, where statements about illness are treated as suggestions. In fear, where a repeated dread is impressed. In the moments before sleep, which the book regards as the time when suggestions are most readily taken in."],
        ["How you can tell", "A person repeats phrases about themselves that they never examined. A fear that has been rehearsed behaves as if it were a fact. A person who is repeatedly told they will fail begins to behave that way. A positive statement repeated with feeling becomes natural over time. The influence of the people around a person shows in what they believe."],
        ["What it is not", "It is not a claim that anything said to a person is automatically believed, since the book allows that conscious reasoning can reject a suggestion. It is not a way to control other people. It is not an established description of the mind in this form. And it does not remove the person's responsibility for their own choices."]
      ] },
    { n: "Thoughts as Seeds", b: "You Reap What You Sow in the Mind",
      r: [
        ["The law", "The book compares thoughts to seeds planted in the soil of the subconscious. Each thought, held and repeated, grows into its matching condition, so a person's life is the harvest of the thoughts they have cultivated. The law is the book's application of sowing and reaping to the inner life: what is planted in mind, over time, comes up in experience."],
        ["How it works", "The book puts the same law into three terms: a thought is a cause, the subconscious is the soil and the outcome is the crop. A single thought has little effect, as a single seed makes no field. Repeated, emotionalised and accepted, it takes root, and what grows corresponds to the kind of seed. Good thoughts grow good conditions and harmful ones grow harmful conditions. The book adds that the process continues whether or not the person is attending to it, since the subconscious is always working on what it holds. A person who fills their mind with resentment, worry or lack grows their equivalents, and the remedy is to change what is planted and to remove what has been planted wrongly. The law also supplies a time element: a crop is not immediate."],
        ["Where it operates", "In mood and temperament, which grow from what a person dwells on. In health, where long-held attitudes are said to appear in the body. In relationships, where settled attitudes toward others produce matching responses. In work and money, where habitual expectations bear fruit. In character, which the book treats as the sum of what is sown. And in the long-term direction of a life."],
        ["How you can tell", "The condition of a life matches the dominant thoughts of past years. Changes in outlook take time to appear in circumstances. A grievance held for years has produced its own effects. A person who has been steadily hopeful finds that opportunities follow. A habit of worry is followed by events that seem to justify it."],
        ["What it is not", "It is not a promise of any specific outcome, since the metaphor is general. It is not a claim that every misfortune was planted. It is not an established mechanism for how thoughts affect events. And it is not a quick process: the image of growth is of slow change."]
      ] }
  ],
  atmt: [
    { n: "Thought Makes Character", b: "A Man Is What He Thinks",
      r: [
        ["The law", "The book's first law is that a person's character is the sum of their thoughts. Thought is the cause and character the effect, so what a person thinks, repeatedly and by habit, builds the kind of person they are. The mind is treated as the maker of the self, working constantly whether it is directed or not."],
        ["How it works", "The book describes a chain from thought to character. A thought, once entertained, is repeated. Repetition turns it into a habit of mind, and the habit turns into a trait. As traits accumulate they make up character, and character shapes conduct. The book compares the mind to a garden that will produce something whether or not it is tended: if good seed is not planted, weeds will grow, so a person is either cultivating their mind on purpose or leaving it to grow wild. The consequence is that a person is responsible for what they have become, in the sense that it grew from what they allowed to occupy their mind. The law is also hopeful, since a pattern of thought that has made one character can be replaced by another, and the character will change with it."],
        ["Where it operates", "In temperament and mood, which grow from habitual thoughts. In conduct, which follows character. In health, which the book links to the state of the mind. In relationships, where the quality of a person's thinking shapes how they treat others. In purpose, where steady thought toward an aim builds the person who can reach it. And in self-mastery, which begins with control of thought."],
        ["How you can tell", "A person's habitual thoughts are visible in their manner and conduct. A change in the way someone thinks over a long period is followed by a change in who they are. Bitterness, patience and generosity all show up as long-held patterns. The same circumstances are met differently by people who think differently."],
        ["What it is not", "It is not a claim that a single thought changes a person, since the book is about habit. It is not a statement that thinking is the only influence on character, though it treats it as the principal one. It is not a verdict that a person is fixed by past thoughts. And it has no claim to be a measured mechanism: it is the book's account of how character is built."]
      ] },
    { n: "Circumstances Reveal", b: "Outer Conditions Show the Inner Man",
      r: [
        ["The law", "The book holds that circumstances do not make a person but reveal them. A person's outer conditions are the fruit of their inner thoughts, and a change of circumstances cannot be sustained without a change of thought. The law locates the source of a person's situation in what they think and want, with the situation acting as a mirror."],
        ["How it works", "The book argues from consistency. A person who wishes to improve their circumstances but does not alter their thinking meets the same difficulties again, because the circumstances grow out of the habits of mind that remain. The reverse also holds: a person who changes their thoughts finds that circumstances adjust in time, since new thoughts produce new conduct and new conduct produces new results. The book adds a caution. It does not say that every person's circumstances can be read as a measure of their character, and it does not say that a person is simply rewarded or punished in proportion to their thoughts. Its claim is narrower, that the inner state and the outer condition are connected and that the inner is the one that can be worked on directly."],
        ["Where it operates", "In wealth and poverty, which the book connects to habits of mind. In health, where thoughts of worry and calm show in the body. In work, where the nature of a person's thinking shows in their results. In relationships, where character determines the company a person keeps. In recurring problems, which indicate unchanged thinking. And in the effect of changed circumstances, which do not alter a person who does not change."],
        ["How you can tell", "A person who is given better circumstances without changing slips back to the old level. Repeated difficulties of one kind match a recurring habit of thought. A person who changes inwardly finds the outer life moving. The way a person speaks of their circumstances reveals their outlook."],
        ["What it is not", "It is not a claim that circumstances are simply earned, and it does not say that the poor are to blame for their situation or the rich are virtuous. It is not a denial of outside forces. It is not a measured mechanism. And it does not suggest that outer improvements are worthless, only that they last when they come with inner change."]
      ] },
    { n: "Purpose", b: "The Anchor of a Life",
      r: [
        ["The law", "The book teaches that a person without a definite purpose is carried by every worry, fear and passing interest, while a person with one has a point of attention that steadies them. Purpose is the thing that gathers the powers of the mind and directs them. The law is that achievement follows the person who sets a purpose and holds to it, and drifts away from the person who does not."],
        ["How it works", "The book treats an unattached mind as one that is pulled in several directions by whatever presents itself. It becomes the prey of worry, doubt and self-pity. A purpose changes this by supplying a centre. Thoughts are then selected against it, and what does not bear on it is gradually set aside. Because the mind's powers are gathered, the person accomplishes more with the same ability. The book adds that the purpose has to be held through failure and that its value is in its steadiness, since each failure is treated as instruction and not as a verdict. It also ties purpose to self-control: the person who has a purpose learns to discipline thought in service of it."],
        ["Where it operates", "In the direction of a life, where a purpose gives it shape. In work, where a defined aim concentrates effort. In emotional steadiness, where a central purpose limits the weight of passing worries. In persistence, where a purpose carries a person through failure. In self-discipline, where purpose supplies a reason to master impulses. And in the avoidance of drifting."],
        ["How you can tell", "A person with a purpose is steadier under pressure. Their effort accumulates and does not scatter. They can say what they are working toward. A person without one is easily swayed by moods and events and finds little accumulates. Setbacks are met with adjustment and not abandonment."],
        ["What it is not", "It is not a rigid plan, and the book allows that a purpose may change. It is not the same as ambition for status. It is not a guarantee of success. And it is not a one-time act: the law is about holding the purpose over time."]
      ] }
  ],
  big: [
    { n: "The Size of Your Thinking", b: "Results Are Set by the Scale of Thought",
      r: [
        ["The law", "The book's governing principle is that the size of your success is determined by the size of your thinking. A person's accomplishments rise to the level they believe themselves capable of and no higher. The law says that the way to a larger result runs through a larger conception of what is possible, held by the person themselves."],
        ["How it works", "The book treats thinking big as a matter of how a person sees themselves, their work and their prospects. A small view of what is possible leads to small goals, small effort and small results, and the person's performance confirms the view. A large view leads to larger goals, which the person then approaches differently. The book holds that this is not a matter of ability, since people of similar ability achieve very different results according to what they think they can do. It also separates thinking big from boasting: the aim is a realistic confidence that does not shrink a person's sights. The principle has a practical side. Describing a goal at a larger scale changes the steps considered, the people approached and the standard applied to the work."],
        ["Where it operates", "In career and ambition, where the level aimed at sets the level reached. In business, where the scale of a venture follows the size of the vision. In selling and persuasion, where confidence in the value of what is offered affects the result. In self-image, where a person sees themselves as ordinary or capable. In language, where small words and small descriptions of oneself reinforce small thinking. And in the people a person associates with."],
        ["How you can tell", "A person's goals are modest compared with their ability. They describe their prospects in limited terms. A change of view about what is possible is followed by larger action. People with similar skills reach different levels according to their expectations. Small ambition leads to small results."],
        ["What it is not", "It is not a claim that any goal can be reached by thinking it large, since the book pairs thought with action. It is not a justification for arrogance. It is not a demonstrated causal law. And it does not say that all small goals are wrong, only that thinking small limits what a person tries."]
      ] },
    { n: "Belief Makes It Possible", b: "Believe It Can Be Done",
      r: [
        ["The law", "The book teaches that belief is the power that sets action in motion. A person who believes something can be done finds ways to do it, and a person who does not believe tends not to try or to give up early. The law is that the strength of belief governs the effort made and so the result, and that belief is therefore the first thing to build."],
        ["How it works", "The book argues that belief works through behaviour. A person who believes an outcome is possible acts on it, persists and looks for solutions. A person who doubts looks for reasons it cannot be done and finds them. Belief also affects how others respond, since a person who believes conveys confidence, which draws support. The book is careful to distinguish belief from wishing: belief is a conviction that something can be done and not merely a hope that it might be. It adds that belief can be developed, through acting as though the thing were possible, through collecting evidence of what others have done and through refusing to entertain the opposite thought. The law places belief at the start of the chain and makes its strength decisive."],
        ["Where it operates", "In attempts at anything difficult, where belief decides whether the attempt is made. In persistence, where it sustains effort. In selling and leadership, where conviction is communicated. In recovery from failure, where belief decides whether a person tries again. In learning, where confidence affects practice. And in the picture of what is possible for oneself and for others."],
        ["How you can tell", "A person who believes an outcome is possible keeps going where another stops. Doubt shows in the first excuses. A change in conviction is followed by a change in effort. People who succeed describe having believed it could be done before they had evidence."],
        ["What it is not", "It is not a claim that belief by itself accomplishes things, since the book requires action. It is not a promise that belief makes any outcome possible. It is not the same as optimism or hope. And it is not a measured mechanism: it is the book's account of how conviction affects behaviour."]
      ] },
    { n: "Excusitis", b: "The Disease That Limits Everyone Who Has It",
      r: [
        ["The law", "Excusitis is the book's name for the habit of making excuses for not doing, not trying and not achieving. It names health, intelligence, age and luck as the common excuses and holds that a person who relies on them limits themselves. The law is that the excuses a person accepts as true set the limit of what they will attempt."],
        ["How it works", "The book describes excusitis as a mental habit that becomes stronger the more it is fed. A person gives a reason for not trying and, in giving it, believes it. The belief then closes the option. The excuses fall into a few families: those that blame health, those that blame intelligence, those that blame age and those that blame luck or circumstances. The book argues that for each there are people in the same condition who have succeeded, so the excuse does not settle the matter. It treats the habit as one that is acquired and can therefore be unlearned, by noticing the excuse, by testing it against evidence and by acting in spite of it. The law identifies a particular obstacle that comes from the person's own thinking and not from the outer situation."],
        ["Where it operates", "In career, where age, education or background are given as reasons not to move. In health, where a condition is used to rule out effort. In ambition, where lack of luck explains inaction. In learning, where a belief about intelligence closes off attempts. In starting anything, where timing is cited as a reason to wait. And in the conversation a person has with themselves."],
        ["How you can tell", "A person has a ready reason for each thing they have not tried. The reasons repeat across different goals. Others in similar situations have done the thing. The excuse changes when it is answered but the inaction does not. A person feels relief at having a reason."],
        ["What it is not", "It is not a claim that all limits are imaginary, since real constraints exist. It is not a judgement of people with genuine difficulties. It is not a clinical term. And it does not say that the excuses are always false, only that they are less decisive than they are treated."]
      ] },
    { n: "Action Cures Fear", b: "Doing the Thing Reduces the Dread of It",
      r: [
        ["The law", "The book teaches that action is the cure for fear. Fear grows when a person waits and thinks about what they dread, and it shrinks when the person does something about it. The law is that moving toward the feared thing, even in a small way, reduces its power, and that avoidance and delay increase it."],
        ["How it works", "The book treats fear as a product of imagination operating without action. While a person is not doing anything, the mind has room to enlarge the danger, and the longer the delay the larger the thing becomes. Action changes this by supplying real information. The person finds that the situation is less severe than imagined, that it can be handled or that a step can be taken. It also changes the person's state: movement and engagement replace rumination. The book recommends beginning with a small step toward the feared thing and not waiting until the fear is gone, since the fear is reduced by the movement and not before it. The law frames fear as something to act through and not something to be cleared first."],
        ["Where it operates", "In public speaking and performance, where dread eases with practice. In difficult conversations, where avoidance increases the tension. In starting projects and ventures, where the first step costs less than the waiting. In decisions, where delay prolongs anxiety. In meeting people, where fear of rejection eases after the first contact. And in recovery from setbacks, where action restores confidence."],
        ["How you can tell", "Dread grows between the decision and the doing and falls once the doing has begun. The feared event is less severe than expected once met. Avoided tasks weigh more with each day. A first step makes the second easier. Confidence builds through exposure and not through preparation alone."],
        ["What it is not", "It is not a claim that action removes all fear or that recklessness is wise. It is not a prescription for ignoring real danger. It is not a clinical treatment for anxiety disorders. And it does not say that preparation is unnecessary: it says that preparation should not become a way of avoiding the step."]
      ] }
  ],
  bab: [
    { n: "The First Law of Gold", b: "Gold Comes to Those Who Keep a Part",
      r: [
        ["The law", "The first law of gold says that gold comes gladly and in increasing quantity to the person who keeps back not less than one tenth of what they earn, to build an estate for their future and their family's. The part kept is the beginning of wealth. The law makes saving a fixed share of income the first condition of becoming rich and treats the saving as the thing that starts the process."],
        ["How it works", "The law is about the order of payment. The person sets aside a tenth of what they earn before spending the rest, and treats it as untouchable for ordinary expenses. The book presents this as a matter of habit and not of amount: the share is the same whether the income is large or small, and the discipline of keeping it is what builds the pattern. The kept money becomes a base that can be put to work, and it grows as a person's earnings grow. The law also changes the relationship between income and spending: a person who saves first lives on what remains and finds that they can. The book treats this as the foundation on which the other four laws rest, since without an accumulated sum there is nothing to invest, protect or multiply."],
        ["Where it operates", "In personal finance, where a share of income is set aside. In habits, where the practice of paying yourself first is built. In security, since a reserve gives a person freedom of choice. In investment, which depends on a sum to invest. In planning for the future and for a family. And in the person's sense of themselves, as someone who keeps part of what they earn."],
        ["How you can tell", "A person who saves a fixed share accumulates a sum over the years. A person who saves only what is left over finds that nothing is left. Income may rise with no matching rise in savings in people who do not follow the law. A reserve gives a sense of ease that income alone does not."],
        ["What it is not", "It is not a rule that exactly one tenth is right for everyone, since the book gives the figure as a standard to start from. It is not a guarantee of wealth on its own, since the other laws are needed. It is not a statement that saving is possible when income does not cover needs. And it is not about hoarding: the kept money is meant to be used for building an estate."]
      ] },
    { n: "The Second Law of Gold", b: "Gold Labours for the Wise Owner",
      r: [
        ["The law", "The second law of gold says that gold works diligently and wisely for the owner who finds profitable employment for it, multiplying as the flocks of the field do. Money kept idle does nothing, and money put to productive use earns more. The law is about turning savings into a source of further earnings by investing them in something that yields a return."],
        ["How it works", "The book describes savings as a seed and investment as the planting. A sum that is kept and not used produces nothing beyond itself, while the same sum placed in something that yields a return begins to multiply, and the earnings themselves are then put to work. Over time the process compounds, with the growth coming from the money's own earnings and not from the owner's labour. The law requires that the employment be profitable and wise: the money is to be put where it earns, and not simply where it is kept. It also presents wealth as a matter of time and patience, since multiplication takes years. The point is that a person's income from work is limited by their hours, and income from their money is not."],
        ["Where it operates", "In investment, where savings are placed in productive assets. In business, where capital funds enterprise. In property, where a holding yields rent. In compounding, where returns are reinvested. In the shift from earning only by labour to earning also by capital. And in patience, which the process needs."],
        ["How you can tell", "Savings that are invested grow while those left idle stay the same. A person's income begins to include earnings that do not need their time. Early invested sums become large over a long period. Those who never invest remain dependent on their wages."],
        ["What it is not", "It is not a promise of any particular rate of return. It is not a statement that every investment is wise, since the third and fourth laws qualify it. It is not an instruction to take large risks. And it does not remove the need for work: it adds to it."]
      ] },
    { n: "The Third Law of Gold", b: "Gold Stays With the Cautious",
      r: [
        ["The law", "The third law of gold says that gold clings to the protection of the cautious owner who invests it under the advice of those wise in its handling. A person who places money where the risk of loss is smallest and who consults people who know the field keeps it. The law ties safety of capital to caution and to good counsel."],
        ["How it works", "The law makes the preservation of savings a matter of two practices. The first is caution: the person weighs the safety of the principal before the size of the return. The second is advice: before committing money, the person consults those with experience of investing. The book's position is that those who know the field have seen where money is lost and where it is kept. A person who relies on their own judgement without experience is more likely to be misled by hope. The law therefore sets a priority: protect the amount first and look for a return second. It adds that the best counsel comes from those who handle money for a living with a record of keeping it, and not from those who stand to gain from the decision."],
        ["Where it operates", "In choosing investments, where safety is weighed against return. In consulting advisers, where experience is sought. In protecting savings, where loss of principal is treated as more costly than a smaller gain. In business decisions, where caution is applied to risk. In the face of attractive offers, where scrutiny is required. And in the discipline of waiting for advice before acting."],
        ["How you can tell", "A person who consults and who prefers safety loses less. Losses follow decisions made without advice. A high promised return is treated with caution. Savings last longer in those who protect the principal first."],
        ["What it is not", "It is not a rule against all risk, since the book allows that some risk is part of any return. It is not an instruction to follow any adviser, and it names those wise in handling money as the right source. It is not a guarantee against loss. And it does not mean that advice replaces a person's own thought."]
      ] },
    { n: "The Fourth Law of Gold", b: "Gold Slips From Those Who Invest in the Unfamiliar",
      r: [
        ["The law", "The fourth law of gold says that gold slips away from the person who invests it in businesses or purposes with which they are not familiar, or which are not approved by those skilled in the keeping of it. The law holds that a person should invest only in what they understand and that unfamiliar ground is where savings are lost."],
        ["How it works", "The book's argument is from ignorance. A person who does not know a field cannot judge a proposal in it, cannot tell a sound venture from an unsound one and cannot see the points at which it is likely to fail. The money is then put to the test of the person's inexperience. The law adds an external check: even in a field a person knows, the investment is to be approved by those with skill in keeping money. It therefore sets two conditions, familiarity and approval, and it treats the absence of either as a warning. The practical result is a narrowing of what the person invests in, to things they understand, and a willingness to decline opportunities that they cannot assess however attractive they appear."],
        ["Where it operates", "In investment choices, where the person's own knowledge is the limit. In business ventures, where a lack of experience is a risk. In offers from friends or acquaintances, which are often outside a person's competence. In new markets and products, where information is incomplete. In the temptation of large promised returns. And in the discipline of saying no."],
        ["How you can tell", "Losses come from ventures the person did not understand. A person can explain their investments clearly when they follow the law. Enthusiasm for something unfamiliar is treated as a reason to look harder. Those who stay within their knowledge lose less."],
        ["What it is not", "It is not a rule against learning new fields, since familiarity can be built before money is committed. It is not a ban on all unfamiliar opportunities. It is not a guarantee that familiar investments succeed. And it does not make advisers infallible."]
      ] },
    { n: "The Fifth Law of Gold", b: "Gold Flees the Chaser of Impossible Gains",
      r: [
        ["The law", "The fifth law of gold says that gold flees the person who forces it to impossible earnings, who follows the alluring advice of tricksters and schemers, or who trusts it to their own inexperience and romantic desires in investment. The law is a warning against promised returns that are too large to be real and against decisions driven by hope."],
        ["How it works", "The book treats extravagant promises as the main way savings are lost. A return far above what ordinary investment yields is the mark of a scheme, and the person who is drawn to it has given up the caution on which the earlier laws depend. The law adds an inward cause alongside the outer one: a person's own wishes and inexperience. Romantic desires, meaning the hope of quick wealth and the pleasure of imagining it, cloud judgement and make a person receptive to the persuasive. The result is that the person who chases large gains is the one most likely to lose what they have. The law therefore asks for a measured expectation of return and for suspicion of anything that promises more."],
        ["Where it operates", "In schemes that offer very high returns with little risk. In speculation, where hope of a quick gain overrides judgement. In persuasion by confident sellers, which plays on desire. In investments entered for excitement. In the pressure to catch up after earlier losses. And in the person's own wish for a shortcut."],
        ["How you can tell", "A promised return that is far above normal comes with a story. The person feels an urgency to act and a fear of missing out. Those who lose money to schemes describe having wanted it to be true. A steady return is less exciting and lasts."],
        ["What it is not", "It is not a statement that all high returns are false, since some risk-taking is reasonable. It is not a rule that investment must be dull. It is not a promise of protection from loss. And it does not blame those who are deceived: it names the pattern that makes people open to deception."]
      ] },
    { n: "The Seven Cures for a Lean Purse", b: "Seven Practices for Building a Fortune",
      r: [
        ["The law", "The seven cures are the book's list of practices for a person whose purse is empty. They are to start the purse fattening, to control expenditures, to make gold multiply, to guard treasures from loss, to make a dwelling a profitable investment, to ensure a future income and to increase the ability to earn. Together they are presented as the way from a lean purse to a full one."],
        ["How it works", "The cures run in an order. The first and second concern the flow of money: a part of every earning is kept, and spending is held below income so that what is kept can build. The third puts the kept money to work. The fourth protects it from loss. The fifth applies the same ideas to a home, turning a cost into an asset. The sixth provides for the years when earning stops, through reserves and provision for family. The seventh addresses the source of the whole system, a person's own capacity to earn, which is raised by skill, study and the habit of doing better. The cures are therefore a cycle: increased ability raises earnings, which raises what can be kept, which builds the base for the rest. The book frames them as practices to be carried out and not understood only."],
        ["Where it operates", "In saving, where the first cure sets the habit. In budgeting, where the second controls spending. In investment, where the third and fourth operate. In home ownership, which the fifth treats as an investment. In retirement and family security, which the sixth covers. In careers and skill, where the seventh raises earning power. And in the overall sequence from earning to keeping to growing."],
        ["How you can tell", "A person who follows them accumulates over years. Spending that matches income leaves nothing to build on. A lean purse is typical of a person who does not keep, does not invest or does not protect. Rising skill is followed by rising earnings. Provision for later years removes the pressure of future need."],
        ["What it is not", "It is not a promise of fast wealth, since the cures work over long periods. It is not a financial plan for any individual. It is not a complete account of how money works. And the seventh cure shows that it is not only about saving: the earning of money is part of it."]
      ] }
  ],
  life: [
    { n: "The Law of Prosperity", b: "Supply Follows Expectation, Faith and Giving",
      r: [
        ["The law", "The law of prosperity, as the book gives it, says that supply is unfailing and that it comes through faith, expectation and giving. A person who expects supply and acts as though it will come, and who gives freely, opens the way for it. A person who fears lack, hoards or doubts closes the way. The law makes prosperity a matter of attitude and action together."],
        ["How it works", "The book describes the person as a channel for supply, and the quality of the channel as the thing that matters. Fear of lack contracts it, while confident expectation opens it. The book sets out three working parts. The first is faith, held as a settled expectation that supply will arrive. The second is giving, treated as the way the channel is kept open: the person gives, and the giving makes room for the return. The third is action: the person is to act on guidance when it comes, in a way that shows faith, and the book describes this as making a move before the means are visible. It also treats fear as the thing that stops supply, since it directs attention to the lack. The law ties abundance to a way of regarding and handling money and not to the amount held."],
        ["Where it operates", "In earning and spending, where fear or confidence colours decisions. In giving, which the book sets as an expression of faith in supply. In the handling of debts and bills, where expectation of supply is said to matter. In business, where a person's attitude shapes how they act. In attitude toward money itself, which the law treats as a good thing to be welcomed. And in the readiness to act on an idea when it comes."],
        ["How you can tell", "A person's money habits follow their feeling about supply. Fear of lack shows in hoarding and anxiety. A person who gives freely often reports a sense of room. Opportunities seem to come to those who expect them. A person who expects loss notices it."],
        ["What it is not", "It is not a method for getting money without work, since the book requires action. It is not a measured effect. It is not a claim that those without money lack faith. And it is not financial advice: it is a teaching about attitude."]
      ] },
    { n: "The Power of the Word", b: "What You Say Shapes What Follows",
      r: [
        ["The law", "The book teaches that the spoken word has creative power. What a person says, particularly with conviction and often, impresses on the subconscious and shapes what happens. The law is that words are not idle, since they set the direction of thought and action, and that a person can use them on purpose through statements of what they want."],
        ["How it works", "The book treats speech as the means by which ideas are impressed on the subconscious. A person who says, with conviction, what they want to be true, and repeats it, gives the subconscious a pattern to follow. It also holds that careless speech does the same: words of complaint, lack and fear are also impressed and produce their equivalents. The practical form is the affirmation, a positive statement of the wanted condition, and the denial, a statement that cancels a negative one. The book asks the person to choose words carefully and to see their power in the way they shape expectations and conduct. The law makes speech a form of action with consequences for the speaker."],
        ["Where it operates", "In self-talk, where words repeated become convictions. In everyday speech about money, health and the future, which carries the speaker's expectations. In requests and declarations, which set intention. In complaining, which the book treats as a form of negative affirmation. In affirmation as a deliberate practice. And in what a person says about others."],
        ["How you can tell", "People who speak constantly of lack tend to live with it. The phrases a person repeats about themselves become their self-description. A change in habitual speech is followed by a change in mood. Statements made with conviction are acted on."],
        ["What it is not", "It is not a claim that saying something makes it true by itself. It is not magic, and the book's mechanism is the effect of words on belief and behaviour. It is not a reason to deny real difficulties. And it does not say that all speech is equally powerful: the law concerns conviction and repetition."]
      ] },
    { n: "The Law of Nonresistance", b: "Do Not Fight What Is Present",
      r: [
        ["The law", "The law of nonresistance says that resisting a situation holds it in place and that yielding to it, without fear, lets it pass. A person who fights or fears a difficulty gives it power, and one who meets it calmly and goes on with what is in front of them finds it dissolves."],
        ["How it works", "The book describes resistance as a form of attention and energy invested in the thing resisted. The harder a person pushes against a circumstance, the more it occupies them, and the more it takes root. Nonresistance withdraws that investment. The person sees the situation, accepts that it is present and does not struggle against it or fear it, and puts their effort into what can be done. The book is careful to say that this does not mean passivity: the person acts, but from calm and not from alarm. It also ties the law to faith, since nonresistance depends on trust that the outcome will be taken care of. The law is a description of an attitude toward difficulty and a claim about its effects."],
        ["Where it operates", "In conflict, where meeting hostility with calm is said to defuse it. In worry about the future, where the attempt to push away a fear gives it weight. In illness and difficulty, where acceptance changes how a person responds. In work problems, where agitation hampers solutions. In relationships, where fighting an attitude hardens it. And in any situation of pressure."],
        ["How you can tell", "A difficulty fought with anger or fear grows larger in the mind. Calm in a hard moment brings clearer thinking. Struggling against a feeling makes it persist. A situation accepted without panic is dealt with more easily."],
        ["What it is not", "It is not passivity or surrender to real harm. It is not a requirement to stay in danger. It is not an established mechanism, and the book's claims are offered as a teaching. And it does not say that every problem disappears when it is not resisted."]
      ] },
    { n: "The Law of Karma", b: "What You Send Out Returns",
      r: [
        ["The law", "The book teaches that what a person sends out returns to them. Thoughts, words and deeds go out and come back in kind, so a person receives what they have given, whether good or ill. The law is the book's statement of the idea of karma: the person's own conduct is the origin of what befalls them, and the return is as sure as the sending."],
        ["How it works", "The book describes the law as a boomerang. A thought, word or act is sent out and, after a time, returns to the sender with its own character. Kind acts come back as kindness and harmful ones as harm. The book adds that the return comes through a route the person does not control and often from a source other than the one they gave to. It also describes the forms of the sending: the book treats thoughts and words as seriously as deeds, since all three are sent out. The law therefore asks a person to consider what they are putting out, because what they put out is what will come back. It is paired with the law of forgiveness, which describes how a person can free themselves from the returns of past wrongs."],
        ["Where it operates", "In relationships, where how a person treats others returns. In speech, where words of criticism or praise come back. In thought, where resentment and goodwill act on the thinker. In work, where how a person deals with others affects their own standing. In handling of money and other people's property. And in the giving and receiving of help."],
        ["How you can tell", "A person who is generous tends to be helped. Harsh judgement of others returns as harsh judgement of oneself. Repeated patterns of treatment mirror the patterns a person has given. A hurt done to another is followed by loss of ease in the doer."],
        ["What it is not", "It is not an established mechanism, and the law is a belief. It is not a claim that every harm a person suffers was earned, since the book does not say that. It is not a guarantee of timely justice. And it does not mean that suffering is a punishment."]
      ] },
    { n: "The Law of Divine Design", b: "Each Person Has a Perfect Plan",
      r: [
        ["The law", "The book teaches that every person has a perfect plan, a divine design, for their life: a pattern of what they are meant to do and be. The design exists whether or not a person knows it, and nothing can take from a person what belongs to their design. The law says that finding and following this design is the aim of a life and the source of its fulfilment."],
        ["How it works", "The book describes the design as an idea held in the divine mind for each person, which includes their gifts, their work and their relationships. It says that the person's role is to align with it and not to invent a path out of fear or imitation. The design is described as complete and not to be changed by outside events, so what is truly meant for a person cannot be lost to others, and what is not meant for them cannot be obtained by force. The book connects the design to intuition: the person is led toward it by inner guidance. It also connects it to the other laws, since fear, resistance and a hold on the wrong things stand between a person and what is theirs. The law supplies a purpose and a reassurance about outcomes."],
        ["Where it operates", "In choice of work and calling, where a person looks for what suits them. In relationships, where what belongs to a person is said to come without strain. In envy and comparison, which the law answers by saying that another's design cannot take yours. In loss, which is read as making room for the intended. In decisions guided by intuition. And in the sense of purpose."],
        ["How you can tell", "A person feels drawn toward certain work and finds it natural. Forcing a path that does not fit meets resistance. Envy lessens when a person trusts their own direction. A loss is followed by something that suits better. A person describes feeling that things worked out as they should."],
        ["What it is not", "It is not a proof that a plan exists, and it is a belief of the book. It is not a reason to avoid effort or planning. It is not a promise that everything a person wants is part of their design. And it does not explain suffering that has no apparent place in a plan."]
      ] }
  ],
  cmyth: [
    { n: "Presence", b: "Being Fully Where You Are",
      r: [
        ["The law", "Presence, in the book, is being fully in the moment with the people you are with: your attention on what is actually happening and on them, and not on your own commentary, your phone or your next line. The book treats it as the foundation of charisma and the ingredient the other two depend on, since power and warmth reach people only when you are there to deliver them."],
        ["How it works", "The law rests on how quickly people detect attention. They read it from your eyes, the timing of your replies and the stillness or restlessness of your body, and they register the difference between someone listening and someone waiting to speak. Full attention is rare, so receiving it is strongly felt: the person is made to feel that for the moment nothing else matters, and they remember that feeling. The main obstacle is mental chatter, the commentary of self-judgement, worry and planning that pulls attention inward. The book's approach is to return attention to something immediate, such as a physical sensation or the other person's words, so that the commentary loses the contest. The effect is not produced by looking attentive. It is produced by being attentive, which is why the book treats it as a state to be reached and not an act to be put on."],
        ["Where it operates", "In conversations of every kind, where being listened to is the thing most people are short of. In first meetings, where the impression is formed fast. In meetings and negotiations, where a distracted participant misses what is happening. In presentations, where attention to the audience changes how it lands. In listening to someone in difficulty. And in anything where a phone, a plan or a worry competes with the person in front of you."],
        ["How you can tell", "A person who has presence responds to what was actually said and not to what they expected. They are still. Silence does not hurry them. Their replies show they heard the detail. People talking to them tend to say more and to say it more carefully. Its absence shows in glances elsewhere, replies that miss the point and the sense of being one item among several."],
        ["What it is not", "It is not staring or constant eye contact, which can feel like pressure. It is not silence or passivity, since a present person speaks and acts. It is not a permanent state that anyone holds all day, and the book treats it as something that comes and goes and can be returned to. And it is not a technique of appearing interested: the law is about where attention actually is."]
      ] },
    { n: "Power", b: "Being Seen as Able to Affect Things",
      r: [
        ["The law", "Power, in the book, is not what you have but what others perceive you able to do. It is their sense of your capacity to affect the world around you, through status, expertise, authority, resources or the confidence with which you carry yourself. It is one of the three ingredients, and the one that makes people expect something of you and defer to what you say."],
        ["How it works", "The law is about perception, and so about cues. People form a quick judgement of how much someone can change what happens, and they take the cues from how the person is introduced, what they have done, how they speak and how they carry themselves. A person who is composed, who does not hurry or apologise for taking up space, and who speaks as someone whose words will be acted on, is read as powerful. The book treats the confidence that shows as largely the product of inner state, so it works on feeling secure and not on posing. It also separates power from warmth, since a person can be seen as very capable and still be felt as cold. Power alone gets respect. The law's value is in knowing which cues people read as capability and in letting them show."],
        ["Where it operates", "In how a person is introduced and how they introduce themselves. In meetings, where authority is read within moments. In negotiation, where perceived ability to walk away or to deliver sets the terms. In leadership, where people follow those they expect to get things done. In performance, where how someone carries themselves changes how their work is received. And in any setting where being heard depends on being taken seriously."],
        ["How you can tell", "People turn to a powerful person when a decision has to be made. Their statements are treated as settled. They are listened to without having to raise their voice. A person lacking it is interrupted, asked to justify and passed over, whatever their actual ability. The same words said by two people land differently according to who is seen as able to act on them."],
        ["What it is not", "It is not dominance, aggression or volume, and a loud person can be read as weak. It is not a title alone, though status is one of the cues. It is not the same as actual capability, since the law concerns perception. And it is not meant to be used without warmth, which the book treats as the thing that keeps power from becoming intimidating."]
      ] },
    { n: "Warmth", b: "Goodwill That Shows",
      r: [
        ["The law", "Warmth, in the book, is goodwill toward other people: a real wish for them to do well, felt by you and noticed by them. It is the third ingredient, and the one that makes people feel safe with you, cared about and willing to follow you. It is not niceness as a manner but a feeling that shows in how you look, listen and respond."],
        ["How it works", "The law starts from the claim that people can usually tell whether goodwill is genuine. Body language gives away what a person is actually feeling, so a warm manner over indifference or resentment looks false and can be worse than none. The book therefore treats warmth as something to be produced at the level of feeling, and it describes ways of doing so that work on the inner state, such as bringing to mind real goodwill for the person before meeting them. Once it is felt, the outward signs follow without effort: the softer expression, the open posture, the attentive reply. The effect on the other person is a sense that they are accepted and that you are on their side. Warmth is also what keeps power from reading as coldness."],
        ["Where it operates", "In relationships of every kind, where goodwill is the basis of trust. In leadership, where people give more to someone who plainly wishes them well. In sales, service and negotiation, where the other side judges whether you are with them. In difficult conversations, where goodwill allows hard things to be heard. In first meetings. And in groups, where one warm person changes the temperature."],
        ["How you can tell", "People relax with a warm person and say more. They feel safe disagreeing. They are inclined to help. A person lacking it, however capable, is respected from a distance. A false version is noticed as a mismatch between the smile and the rest of the face, and it produces suspicion and not trust."],
        ["What it is not", "It is not constant agreement, flattery or niceness. It can sit alongside firmness and disagreement. It is not an act, and the book's emphasis is on feeling and not on performance. It is not a substitute for power, since warmth without power is liked and not heeded. And it is not owed equally to everyone at every moment: the law is about where goodwill is real."]
      ] },
    { n: "Inner State Drives Outer Behaviour", b: "Change the Feeling and the Body Follows",
      r: [
        ["The law", "The book's method rests on a law about cause: how you come across is produced by what you are feeling, so lasting change in behaviour comes from changing the inner state and not from adjusting the gestures. Charismatic behaviour is the visible form of presence, power and warmth that are actually felt, and it is difficult to sustain when they are not."],
