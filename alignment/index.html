        ["How it works", "The law has two parts. The first is that body language is a readout of inner state. Posture, expression, tone and timing are driven largely by feeling, and most of it is not under conscious control. The second is that observers are sensitive to mismatch. When the gestures say one thing and the state another, people notice the incongruence, even if they cannot say what they noticed, and they trust the state over the gesture. The consequence is that copying the outward signs of charisma without the inner condition gives an imitation that is spotted. The book therefore directs effort at the state. It describes techniques for quieting the mental chatter that blocks presence, for raising the sense of security that supports power and for evoking real goodwill. The outward behaviour is then left to follow, and what follows is usually more natural than anything rehearsed."],
        ["Where it operates", "In nerves before a speech, an interview or a meeting, where anxiety shows in the body whatever the words are. In first impressions, where state is read before content. In difficult people and conversations, where the inner response decides the outer one. In confidence, where a secure state produces composure. In warmth, where real goodwill shows. And in any attempt to change how you are seen, where the question is what you are feeling and not what you are doing."],
        ["How you can tell", "A person who feels calm moves and speaks differently from one who has only decided to look calm. Nervousness leaks through rehearsed confidence. A change of mood changes posture and voice without any decision. Observers describe a person as seeming off without being able to say why, and this tends to track a gap between state and display."],
        ["What it is not", "It is not positive thinking or the suppression of unwelcome feelings, since the book works with the state and not against it. It is not a promise that feelings can be changed instantly. It is not a reason to ignore physical habits, which can support the state. And it does not say that gestures are meaningless: it says they follow state, and so are an unreliable place to start."]
      ] }
  ]
,
  mkey: [
    { n: "Concentration", b: "Attention Held on One Thing",
      r: [
        ["The law", "The first of the book's working laws is that attention held steadily on a single object or idea gives power over it. Haanel treats concentration as the faculty beneath the others: the capacity to gather the mind and keep it on one point without strain, so that whatever is attended to is understood, developed and brought into form. Scattered attention is treated as the ordinary state and as the reason results are ordinary."],
        ["How it works", "The law operates through the mind's habit of acting on what it is given. Attention held on one idea gives the subconscious a single clear instruction, where attention that moves between ideas gives conflicting ones. Concentration in the book is calm and sustained and not forced, and it is built in stages by regular exercises, each asking attention to stay a little longer than before. As the capacity grows, the same idea can be held long enough to be examined from every side and then impressed. The strength of the effect depends on duration and steadiness more than on intensity."],
        ["Where it operates", "In learning anything that takes time to master, where depth depends on staying with a subject. In the formation of a goal, which has to be held to be pursued. In work that requires thought, where interruptions are costly. In the control of worry, which is attention held on the wrong thing. And in every part of the course itself, since each later practice assumes the capacity trained in the earlier ones."],
        ["How you can tell", "A concentrated mind stays on a subject without effort being felt as strain, returns quickly after interruption and finishes what it begins. Time passes without notice during real attention. A scattered mind jumps between things, begins more than it finishes and finds a few minutes on one subject hard to sustain. The difference shows over weeks of practice as a lengthening of the interval before the mind wanders."],
        ["What it is not", "It is not tension, gritted teeth or willpower applied as force, which the book treats as a different thing and a worse one. It is not the same as thinking hard about a problem, and it is not a trance. It is not natural talent, since the book treats it as trainable by anyone. And it is not a guarantee of success on its own: the law gives focus, and what the focus is pointed at still decides what comes of it."]
      ] },
    { n: "Attraction", b: "Like Draws Like",
      r: [
        ["The law", "The law of attraction, in the book, says that thought draws to itself the conditions that correspond to it. What a person habitually thinks about, expects and believes about themselves acts as a pattern, and people, events and circumstances that match the pattern are drawn into their life. The law is stated as a principle that works at all times, and not only for those who have studied it."],
        ["How it works", "The mechanism the book gives is correspondence: like responds to like, so a mind occupied with abundance meets abundance and a mind occupied with lack meets lack. The attraction is to the dominant mental state and not to the passing wish, which is why the law is read as feedback on what has actually been held. The book couples it to concentration and the mental picture, since a clear and steady image is a more definite pattern for the law to answer. Attraction is therefore not a separate act but the outer side of how thought is held."],
        ["Where it operates", "In what comes to a person by way of opportunities, relationships and recurring circumstances. In the pattern of events that seems to repeat across different settings. In the kind of people a person finds around them. In health and prosperity, which the book presents as responding to the state of mind that precedes them. And in any case where a person's stated aims and actual mental habits disagree and the outcome follows the habits."],
        ["How you can tell", "People who hold a steady expectation of a certain kind meet a stream of matching events and notice them, while those who hold the opposite meet their own stream. A change in dominant thinking is followed, over time, by a change in what appears. When results do not match the stated wishes, the book points to the underlying mental state as the thing to examine. The signal is a recurring pattern in circumstances that matches a recurring pattern in thought."],
        ["What it is not", "It is not wishing, and it answers to what is held more than to what is said aloud. It is not instant, and the book treats the return as delayed. It is not a claim that effort and action are unnecessary. It is not a physical law that can be demonstrated in a laboratory, and it is the book's own principle and should be read that way. And it is not selective: it works on unwanted thoughts as it does on wanted ones."]
      ] },
    { n: "Harmonious Thinking and Action", b: "Thought and Deed Pointing the Same Way",
      r: [
        ["The law", "Harmonious thinking and action is the third of the working laws named in the book. It says that thought, feeling and conduct should agree with one another and with the larger order the book describes, and that conflict among them works against the results sought. The law makes harmony a condition under which the other laws operate and not a refinement added afterwards."],
        ["How it works", "A person who holds an aim in thought while acting against it, or who wants a result and resents what it takes, divides the energy available. On the book's account the creative process needs a single, undivided direction to take effect, so internal conflict acts as friction. Harmony removes the friction. It is reached by bringing thinking and acting into line, by removing contradictions in what is wanted, and by setting the individual's aims in accord with the whole instead of against it. The law therefore asks for coherence before force."],
        ["Where it operates", "In the match between stated goals and daily conduct. In the relationship between what a person says they value and how they spend time and money. In work done grudgingly toward an end that is wanted. In relations with other people, where antagonism is treated as discord that comes back. And in the inner life, where doubt held beside ambition produces stalemate."],
        ["How you can tell", "A harmonised person acts without a sense of being pulled two ways. Plans and conduct match, effort is steady and the aims are not repeatedly undermined by the person's own habits. Disharmony shows as repeated self-sabotage, stop-start progress and a sense of effort that does not accumulate. The question that sorts them is whether thought and action are aimed at the same thing."],
        ["What it is not", "It is not agreement with everyone or the avoidance of conflict. It is not comfort, and a harmonised life can be demanding. It is not the same as being cheerful. It is not conformity to other people's wishes, since the harmony the book means is internal coherence together with accord with the whole. And it is not a substitute for concentration or attraction, which are separate laws that depend on it."]
      ] },
    { n: "Inner Cause, Outer Effect", b: "The World Within Governs the World Without",
      r: [
        ["The law", "The foundation of the book is that the world within governs the world without: the state of the inner life is the cause, and conditions are the effect. Thought, attention and belief are the source of power, and external circumstances are the form that power takes. The law is the premise the course builds on, and every later teaching is an application of it."],
        ["How it works", "The book describes the mind as creative and as connected to a Universal Mind that is the source of all things, so the individual's thinking draws on a larger power. Thought acts as cause, and its results appear as circumstance after an interval. Changing circumstances then requires changing the thought that produced them. The law reverses the usual order of effort: the work is done first within, and the outer changes follow. It is applied through the practices of stillness, concentration and visualization, which are all ways of working on the inner cause."],
        ["Where it operates", "In how a person explains their results, whether by pointing to conditions or to the state of mind they came from. In choosing where effort goes, outward or inward. In the idea of power itself, which the book places inside the person. In health, money and relationships, each of which it reads as an outer reflection of an inner state. And in personal change, which it treats as slow and internal before it is visible."],
        ["How you can tell", "A person who works from this law examines their own thinking when results disappoint, and expects change to follow change in themselves. A person who does not looks to blame or adjust conditions and finds the same pattern recurring. The sign that it is being applied is that effort goes to attention, belief and habit as well as to action."],
        ["What it is not", "It is not a denial that circumstances are real or that outside forces act on people. It is not a claim that every misfortune is a person's own doing. It is not a reason to stop acting. It is a premise of the book and not a proved fact, and its test is whether working from it produces change in the one who tries. And it is not complete without practice: the book treats belief in the law as worth little unless the exercises are done."]
      ] }
  ],
  born: [
    { n: "Plan, Prepare, Expect", b: "Winning Follows a Fixed Order",
      r: [
        ["The law", "The book's central law is that winning follows a sequence: plan to win, prepare to win, then expect to win. Each step has its own work, and the order matters. Planning establishes what is wanted and why, preparation builds the knowledge, practice and counsel needed to reach it, and expectation is the positive outlook that is justified once both are done. The law claims that results follow the sequence and not the wish."],
        ["How it works", "Planning gives preparation a target, so that learning and practice are aimed and not general. Preparation gives expectation grounds, so that confidence is a conclusion and not a mood. Skipping a step breaks the chain: preparation without a plan is busy and directionless, and expectation without preparation is hope with nothing under it. The sequence also explains where effort goes first, which is to clarity about the aim, and where it is paid back last, in a confidence that has been earned. The law holds the three steps together as one process."],
        ["Where it operates", "In any goal that takes time to reach: careers, skills, health, relationships and money. In the choice between starting by acting and starting by thinking, since the law puts thinking first and doing second. In the handling of confidence, which the law says has to be built. In teams and organisations, where unplanned and unprepared effort shows up as repeated rework. And in a person's own record, where the stage at which efforts failed is usually the stage that was skipped."],
        ["How you can tell", "A person following the law can state the aim, describe what they have done to be ready and speak about the outcome with confidence that rests on both. A person who is not following it is often enthusiastic and unready, or ready and aimless, or confident and unprepared. A failure to reach a result points, under this law, to the first step in the sequence that was incomplete."],
        ["What it is not", "It is not a guarantee that every plan succeeds or that preparation removes risk. It is not a reason to plan indefinitely: the sequence ends in expectation and in action. It is not positive thinking alone, since expectation comes last and only after the work. It is not rigid about the form of a plan or the amount of preparation. And it does not say that people who never planned cannot win, only that planning improves the order in which things are done."]
      ] },
    { n: "Desire, Commitment and Perseverance", b: "Wanting Starts It, Persisting Finishes It",
      r: [
        ["The law", "Winning begins with a vision and the desire to reach it, and desire then sparks two qualities that sustain the work: commitment and perseverance. The law says that vision without these two does not complete, and that they are what carry a person from a good start to a finished result. Desire is the beginning of effort, and commitment and perseverance are its continuation."],
        ["How it works", "Desire gives the effort direction and energy at the start. Commitment turns the wish into a decision that is not reopened every time it becomes inconvenient. Perseverance is that decision acted on over time, through setbacks and the unrewarded middle of a task. The three work in sequence, each depending on the one before. Where commitment is absent, desire fades with the first obstacle, and where perseverance is absent, commitment remains a statement. The law locates the point of failure in most efforts at the middle, after enthusiasm and before results."],
        ["Where it operates", "In long projects, where the work is mostly ordinary effort. In learning, where progress is slow and uneven. In careers and businesses, where results depend on staying in the field. In health and habits, where the benefit of each day is small and the total is large. And in any goal that meets resistance, which the book treats as certain."],
        ["How you can tell", "A committed person continues when the novelty has gone and returns after interruption. Their stated aim is still their aim months later. A person without commitment restarts often, changes direction when it gets hard and describes the goal in terms of intentions. The marker is what happens at the first real obstacle."],
        ["What it is not", "It is not stubbornness about a plan that is clearly failing, since the law concerns the goal and not any single method. It is not constant intensity, and perseverance can be steady and quiet. It is not a personality trait that some have and others lack, since the book presents both as choices. It is not a substitute for planning and preparation. And it is not a promise that persistence alone is enough."]
      ] },
    { n: "Balance Across Seven Areas", b: "Seven Areas, One Life",
      r: [
        ["The law", "The book holds that success is balanced across seven key areas of life, and that a person wins by becoming a more complete person and not by excelling in one area alone. The law says the areas are connected, so that attention to one at the cost of the rest does not produce the kind of success the book means. Balance is the standard against which a result is judged."],
        ["How it works", "The areas affect one another. Strength in one supports the others, and neglect in one drains them. A person who pours everything into a single area draws down the rest, and the cost appears later, often when it is hard to repair. The law therefore asks for a measure of attention to every area, enough that none is left to decay. It works as a check on single-minded effort, setting the gain in one place against what is being spent in others. The book treats the whole life as the thing being built."],
        ["Where it operates", "In the allocation of time between work, family, health, learning and inner life. In the way a career ambition is weighed against everything outside it. In money, where financial results are one area and not the whole. In relationships, which suffer when they are the area neglected. And in the sense of a life being well lived, which the book treats as dependent on all seven."],
        ["How you can tell", "A balanced person shows steady progress in several areas and no sharp collapse in any. An unbalanced one has an area that is thriving and one or more that are visibly deteriorating, often with explanations that put the problem off. Dissatisfaction that persists despite success in one area is a common sign that another has been neglected."],
        ["What it is not", "It is not equal time in every area, and the law asks for adequate attention and not identical amounts. It is not a reason to avoid ambition in any area. It is not a quick fix, since balance is built over time. It is not perfectionism, and it allows some areas to be stronger than others. And it is not a rule about which areas matter most, because the book treats them as a set."]
      ] },
    { n: "Encouragement and Hope", b: "Belief Changes Performance",
      r: [
        ["The law", "The book gives a law of encouragement and hope: that belief offered to a person, and held by them, raises what they attempt and what they achieve. Encouragement is treated as an active force and not a courtesy. The law applies to the way others speak to us and to the way we speak to ourselves, and it makes hope part of the foundation of expecting to win."],
        ["How it works", "Belief changes what a person is willing to attempt. Someone told they can reach a high standard tries for it, and what they try for shapes what they do. The effect is cumulative, since each attempt builds capability and confidence for the next. Hope sustains effort through discouragement by giving the effort a reason to continue. The law operates on both sides of an exchange, lifting the person encouraged and, in the book's account, the person who encourages. It is a mechanism for the positive outlook the book asks for in its last step."],
        ["Where it operates", "In teaching, parenting and leadership, where what is said about a person's ability affects their performance. In the first stages of any difficult goal, where confidence is thin. In recovery from failure. In a person's inner dialogue, which supplies or withholds encouragement all day. And in the choice of the people around you, who either supply it or remove it."],
        ["How you can tell", "Encouraged people take on more, stay longer and recover faster from setbacks. Their language about what they can do is specific and forward-looking. Discouraged people withdraw their effort and talk about limits. In a group, the sign is how people respond to difficulty: with a sense that it can be handled or with a sense that it is the end."],
        ["What it is not", "It is not flattery or praise unrelated to what a person actually does. It is not a substitute for competence, because encouragement lifts performance only when there is something to lift. It is not the denial of difficulty or of failure. It is not instant, and the effects build. And it is not limited to what others give you, since hope can be held and built by the person themselves."]
      ] }
  ],
  ratm: [
    { n: "Hypergamy", b: "The Book's Organising Claim",
      r: [
        ["The law", "Hypergamy, in Tomassi's usage, is the claim that women tend to look for the highest-value partner they can attract, and to keep assessing whether a better one is available. The book treats it as a basic and lasting tendency, rooted in biology, that shapes how partners are chosen, kept and left. It is the principle from which most of the book's other ideas about relations between the sexes are drawn."],
        ["How it works", "The book's reasoning is evolutionary. Because the sexes are said to face different reproductive costs, they developed different mating strategies, and the female strategy favours securing the best available partner and resources. On that account the tendency does not switch off in a committed relationship: the partner's value is judged continuously against alternatives. Tomassi concludes that a man's standing is never settled once and for all, and that relationships involve an ongoing assessment that the man's behaviour and condition influence. The argument is deductive from a premise, and its force depends on accepting that premise."],
        ["Where it operates", "In the account of how partners are chosen at the start. In the account of how long-term relationships change, including the way attraction is said to rise and fall with a man's perceived value. In the book's reading of why relationships end. In its advice to men about complacency. And in the book's wider claims about social conventions, which it presents as shaped by the same tendency."],
        ["How you can tell", "Within the book's frame, the law is operating where a partner's interest tracks changes in the other's standing, status or confidence, and where preferences are stated one way and shown another. The evidence offered is observational and anecdotal, drawn from the author's experience and from evolutionary reasoning. A reader looking for confirmation will find the pattern readily, which is also why the claim needs independent checking."],
        ["What it is not", "It is not an established scientific finding, and researchers and critics dispute it, including how far the tendency extends and how large it is. It is not presented in the book as a moral failing in women. It is not a description of every person or every relationship. It is not a rule that commitment is impossible. And it is not the only way to explain partner choice: the book offers it as a single organising idea, and other accounts exist."]
      ] },
    { n: "Frame", b: "The Premise That Sets the Terms",
      r: [
        ["The law", "Frame, in the book, is the unspoken premise that governs an interaction, the reality both parties are tacitly operating inside. The law holds that whoever's frame prevails sets the terms, and that a man who cannot maintain his own is absorbed into someone else's. Maintaining frame means holding his own view of himself and the situation steady, without needing to assert it loudly."],
        ["How it works", "Every interaction carries assumptions about who defines what is normal, what is acceptable and what matters. Those assumptions are rarely stated, and they are tested through small pressures: requests, challenges, silence and humour. The book holds that each time a man yields on a point to avoid friction, he moves toward the other party's frame, and that the pattern sets. Holding frame means responding to those tests from a settled internal position. Tomassi grounds that position in the man's own assessment of his worth and purpose, so frame is built from the inside and is shown through composure."],
        ["Where it operates", "In romantic relationships, where the book applies it most. In negotiation and work, where the premise of a conversation determines its direction. In arguments, where reacting to provocation hands over the lead. In friendships and family, where patterns of yielding accumulate. And in a man's relationship with himself, where his own assumptions about his worth are the first frame."],
        ["How you can tell", "A man with frame is calm under testing, does not need the other person's agreement to feel settled and does not change his position to relieve tension. His statements and actions are consistent. A man without it reacts, qualifies, explains himself repeatedly and shifts when pushed. The sign is who is adjusting to whom."],
        ["What it is not", "It is not domination, control or the overriding of another person's wishes. It is not stubbornness about every point. It is not performed confidence, since the book places it in what a man actually believes about himself, and it is not a technique that works without the self-regard it depends on. It is not a claim that the other party is an adversary. And it is a concept of the author's, used with a specific and disputed meaning in this book."]
      ] },
    { n: "Sexual Market Value", b: "Value Is Relative and Moves",
      r: [
        ["The law", "The book treats the field of dating and mating as a market in which every person has a sexual market value, a rough measure of how desirable they are to potential partners, set relative to others in the same market. The law says the value is real in its effects, changes over time and is made up of attributes that differ in weight between men and women."],
        ["How it works", "Value is judged by comparison. A person's standing in the market depends on who else is available and what they offer, so it is relative and not absolute. The book lists components, including physical condition, status, resources and confidence, and holds that men's and women's values are built and weighted differently and move at different rates across a life. The market metaphor is used to explain pairing patterns: people tend to match with others of similar value, and mismatches are unstable. The model is intended to be predictive of who attracts whom and why partnerships shift."],
        ["Where it operates", "In the opening of relationships, where the first judgements are made. In the stability of relationships, which the book reads as depending on perceived value staying matched. In decisions about where to invest effort. In the book's claims about age, status and attractiveness. And in the stories people tell about why relationships begin or end."],
        ["How you can tell", "In the book's frame, the law operates where a change in someone's condition, status or confidence is followed by a change in how they are treated. People of widely different standing rarely pair stably. Its application shows up in the common talk of people being out of someone's reach, and in the observation that improving a visible attribute changes how a person is received."],
        ["What it is not", "It is not a precise measure, and the book gives no formula. It is not a judgement of a person's worth as a human being, though critics say the language invites that reading. It is not fixed: the book stresses that it can be changed. It is not an established finding of social science. And it is not the whole of what holds people together, which the model does not set out to explain."]
      ] },
    { n: "Build Value First", b: "Self-Improvement as the Base",
      r: [
        ["The law", "The practical law of the book is that a man's position in all his dealings rests on what he has built in himself, and that improving himself comes before any technique for dealing with others. Physical condition, income, skill, composure and a sense of purpose are named as the foundation. The law makes self-improvement the base on which frame, standing in the market and independence rest."],
        ["How it works", "The reasoning links the book's other ideas back to the man himself. If frame depends on settled self-regard, and settled self-regard depends on real attributes, then working on the attributes strengthens everything above them. If standing in the market is relative and changeable, the controllable part is what he builds. The law also turns attention from other people's reactions to his own direction, so that his actions are driven by his goals and not by the approval he expects. Results are slow, and the book presents the accumulation as the point."],
        ["Where it operates", "In health and physical condition. In earning and financial independence. In skills and work. In emotional regulation and composure. In the choice of purpose, which the book treats as organising the rest. And in the way a man deals with rejection and disappointment, treating them as information about where to improve instead of verdicts."],
        ["How you can tell", "A man working from this law spends time and money on his own development and speaks about his goals in terms of his own direction. His mood is less dependent on a particular person's approval. The unmet version shows as a life organised around someone else's responses, with little visible growth of his own."],
        ["What it is not", "It is not a guarantee of any outcome with other people, and the book itself says value is judged by others. It is not vanity or display, since its emphasis is on durable attributes. It is not a quick fix, because the effects accumulate slowly. It is not a claim that worth equals achievement. And it is not exclusive to this book: the advice to build oneself first is common to many traditions, and what is specific here is how it is tied to the author's theory of relationships."]
      ] }
  ],
  hmw: [
    { n: "Financial Education Comes First", b: "Understanding Before Handling",
      r: [
        ["The law", "The book's first law is that understanding comes before outcome: how a person does with money follows what they know about it, and most people were never taught. The authors place education at the front of every other piece of advice, as the thing that makes budgeting, investing and saving effective. The law is that a person who does not understand how money works is exposed to those who do."],
        ["How it works", "Money decisions are made continuously, and each is made well or badly depending on what the decider understands. Without understanding, a person follows defaults and other people's suggestions, and cannot tell good advice from poor. With it, they can compare options, question terms and plan. The book keeps the content basic on purpose, covering budgeting, investing and building wealth in plain terms, because the first obstacle is the sense that the subject is closed to ordinary people. The law works by turning an area of confusion into one of choice."],
        ["Where it operates", "In everyday spending and saving, where basic budgeting decides whether money has a plan. In borrowing, where terms and cost need to be understood. In investing, where not understanding leaves a person reliant on whoever sells. In dealing with advisers and salespeople. And in the sense of control a person has over their own financial life."],
        ["How you can tell", "A person with financial understanding can say what they earn, owe and spend, and can explain why they hold the products they hold. Their questions are specific. Without it, a person describes money as confusing, follows advice because it was offered and finds out about costs afterwards. The marker is whether decisions are made or merely happen."],
        ["What it is not", "It is not a claim that knowledge alone produces wealth, since the book pairs it with outlook, action and company. It is not a call for advanced study, because the book is short and plain on purpose. It is not a finished state, and the book treats learning as continuing. It is not a reason to distrust all advice, only to be able to judge it. And it is not a substitute for earning or saving, which education makes more effective."]
      ] },
    { n: "Expectations Set the Ceiling", b: "What You Expect Is What You Pursue",
      r: [
        ["The law", "The law is that what a person expects from their finances sets a limit on what they pursue, and so on what they get. Low expectations lead to modest effort and a modest result, which then seems to confirm the expectation. The authors advise raising financial expectations, and the law explains why: the aim decides which options are considered, which advice is heeded and how much effort seems worth making."],
        ["How it works", "Expectation works as a filter before any decision is made. A person who does not expect to be wealthy does not search for the means, does not take seriously those who explain them and does not make the sacrifices they require. The result is then read as evidence that the expectation was right. The law runs the other way as well: a raised expectation widens what is considered and changes the questions asked. It does not produce results by itself. It makes the search for them begin, and the book couples it with education and company."],
        ["Where it operates", "In what a person aims to earn, save and own. In which career and business options are even looked at. In how a person judges what is normal for someone like them. In the willingness to ask for more, to learn about investing or to leave a poor arrangement. And in the circle of people whose standards a person takes as the measure."],
        ["How you can tell", "People with high expectations investigate and plan, and talk about financial goals in specific terms. People with low expectations describe their position as simply how things are and describe wealth as something for other people. The difference shows in what they have looked into and what they have never considered."],
        ["What it is not", "It is not wishing, and the book does not say that expecting more produces more without work. It is not unrealistic ambition detached from a plan. It is not a judgement on those with modest means, who may face real limits. It is not complete without education and action. And it is not permanent: the law implies that expectations can be raised by deliberate choice and by changing the references a person uses."]
      ] },
    { n: "Company Teaches", b: "The People You Spend Time With",
      r: [
        ["The law", "The law is that outlook, knowledge and standards are learned from the people a person spends time with, and that someone who wants to understand wealth should spend time with those who have built it. The authors advise meeting financially successful people for this reason. Company teaches in two ways: it shows how success is thought about and done, and it challenges assumptions that a person's usual circle leaves untouched."],
        ["How it works", "People absorb what is normal from those around them, including what is normal to say and believe about money. When the circle shares a limited view, that view is never tested. Contact with people who have different results exposes the difference in thinking, and gives access to what no book can fully convey: how they talk, what they take for granted and what they do not worry about. The law works through comparison and example. It is gradual, and its effect is on outlook and expectation first and on action afterwards."],
        ["Where it operates", "In friendships and work circles, where attitudes to money are set. In mentorship and learning from those further along. In families, where early views about money are formed. In the choice of communities and environments. And in the sources a person reads and listens to, which function as company too."],
        ["How you can tell", "A person whose circle includes people of higher financial achievement uses their vocabulary and asks their questions. One whose circle is uniform repeats its assumptions and sees little reason to change them. A change in company is commonly followed by a change in what a person thinks is possible."],
        ["What it is not", "It is not a recommendation to drop people who are not wealthy. It is not a method of asking for money or favours. It is not a replacement for study or action. It is not instant, and the book treats it as part of the work of changing outlook. And it is not a claim that wealth is the measure of a person: the law concerns where financial understanding is learned."]
      ] },
    { n: "Break the Cycle", b: "Patterns, Not Balances",
      r: [
        ["The law", "The book names a cycle of endless debt, foolish spending and financial cluelessness, and the law is that these patterns repeat until the habits and understanding that produce them change. Treating the balance without the pattern leaves the cycle intact. The authors aim to help readers break it, and the law makes the pattern, and not the single event, the thing to address."],
        ["How it works", "The three patterns feed one another. Spending without a plan creates a shortfall, not looking at the numbers hides it, and borrowing covers it, which reduces what is available next time. Each turn repeats the one before. Because the habits stay, clearing a balance restores the starting point and the cycle begins again. Breaking it means intervening in the habits and in the understanding behind them, and the book's tools are education, a budget, a changed outlook and better company. The law explains why effort that is aimed only at the balance so often comes to nothing."],
        ["Where it operates", "In credit and borrowing. In day-to-day spending. In the avoidance of looking at accounts. In the repeated experience of being just short at the end of a period. And in the story a person tells about their finances, which tends to describe the loop as bad luck."],
        ["How you can tell", "A person caught in the cycle clears a debt and finds it returns, cannot say where money went and treats shortfalls as surprises. A person who has broken it can describe what changed in their habits and sees fewer surprises. The marker is whether the same situation keeps returning."],
        ["What it is not", "It is not a moral judgement on people who have debt, and the book frames it as a gap in understanding. It is not a claim that all debt is the result of habit, since circumstances can cause it. It is not solved by a single large payment. It is not instant, since patterns take time to change. And it is not the whole of the book's advice: it is the problem to which the other laws are the response."]
      ] }
  ],
  mtough: [
    { n: "Emotional Management", b: "Feel It, Understand It, Direct It",
      r: [
        ["The law", "The law is that mentally tough people manage their emotions and do not suppress them. Emotion is treated as information and as a force that can be directed. The book holds that the ability to act effectively while feeling fear, frustration or discouragement is central to high performance, and that it comes from handling emotion and not from having less of it."],
        ["How it works", "Suppression pushes feeling out of awareness without removing it, so it continues to act on behaviour unseen. Management brings it into awareness first: the person notices what they feel, understands what is producing it and chooses a response. This keeps decisions in the hands of the person and not of the emotion. It also removes the added strain of fighting the feeling. The book treats the skill as trainable by practice on small occasions so that it is available under large pressure. The law works by separating feeling from action, so that the one does not automatically produce the other."],
        ["Where it operates", "In moments of pressure such as competition, negotiation, public speaking and deadlines. In handling criticism and rejection. In setbacks, where discouragement tempts withdrawal. In conflict with other people. And in ordinary irritation and anxiety, which determine how most days go."],
        ["How you can tell", "A person who manages emotion can describe what they feel and still act as they intended. They recover quickly after a setback. A person who suppresses is calm until they are not, and a person who is ruled by emotion reacts to each feeling in turn. The marker is the gap between feeling and response."],
        ["What it is not", "It is not feeling nothing, and the book separates management from numbness. It is not suppression, which it treats as the opposite. It is not constant positivity or the denial of difficulty. It is not a talent some people are born with, since the book treats it as trainable. And it is not a promise that the feelings will stop: the law concerns what a person does with them."]
      ] },
    { n: "Fear of Failure", b: "The Obstacle Behind the Obstacles",
      r: [
        ["The law", "One summary of the book reports that Siebold treats fear of failure as the single greatest obstacle to success. The law is that most people are held back, not by lack of ability or opportunity, but by fear of failing, and that overcoming it by acting is a condition of high achievement. The book treats willingness to fail as part of mental toughness."],
        ["How it works", "Fear of failure makes inaction feel prudent. The person does not attempt what they could do, and the avoided attempt is never counted as a loss, so the fear is never tested. The book's remedy is to change what failure means: not a verdict on the person, but a cost paid for information and improvement. With that meaning, failing can be survived, and trying becomes affordable. The law works through action: fear shrinks when the feared thing is done and found survivable, and grows when it is avoided."],
        ["Where it operates", "In career moves, business ventures and creative work, where the risk of public failure is highest. In learning, where attempts are necessary for progress. In relationships and in asking for what one wants. In sport and performance. And in the decisions a person postpones because they cannot be sure of the result."],
        ["How you can tell", "A person who has dealt with fear of failure attempts things before they feel ready and treats results as information. A person governed by it waits, over-prepares, seeks certainty and explains why now is not the time. The marker is how many attempts have been made."],
        ["What it is not", "It is not recklessness, and it does not recommend risk without thought. It is not the absence of fear, since the law is about acting despite it. It is not a claim that failure is pleasant. It is not a claim that every failure is useful, only that avoiding failing costs more. And it rests on the book's own account, as reported in summaries, and should be read as a teaching and not as a measured finding."]
      ] },
    { n: "Personal Responsibility", b: "Emotions, Reactions and Results",
      r: [
        ["The law", "The law is that mental toughness involves taking personal responsibility for your emotions, your reactions and your results. Blame is treated as a way of giving away the ability to change things. The book holds that people who own the outcome, including the part that was not wholly their doing, keep the capacity to improve it."],
        ["How it works", "Responsibility and control move together. To say a result is someone else's fault is to place the lever with them and leave oneself with nothing to do. To own it is to ask what can be changed and to act on that. The three named areas are separate. Emotions are one's own to manage, reactions are one's own to choose, and results are one's own to answer for. The law does not assign causation for everything that happens. It assigns the question of what to do next, and it holds that this question always has an answer within reach."],
        ["Where it operates", "In work and performance, where outcomes are reviewed. In relationships, where conflict invites blame. In recovery from setback. In how a person explains their own history. And in the handling of emotion, where the stance is that feelings are not caused by other people alone."],
        ["How you can tell", "A person who takes responsibility describes what they will do differently, and speaks in the first person in accounts of problems. A person who does not describes causes outside themselves and waits for them to change. The marker is whether an account of a failure contains an action."],
        ["What it is not", "It is not self-blame or guilt, and it does not say everything is a person's fault. It is not a denial that outside forces and other people act on us. It is not taking on responsibility for other people's choices. It is not a moral judgement but a working stance. And it is not complete without action, since ownership that is only felt changes nothing."]
      ] },
    { n: "Focus on What Matters Most", b: "Attention Is Limited",
      r: [
        ["The law", "The law, as summaries report it, is that world-class performers direct their mental energy toward their most important goals. Attention and energy are limited, and the book holds that the highest achievement comes from concentrating them on a few aims and not spreading them across everything that asks for attention."],
        ["How it works", "Energy spent on many concerns is divided, and the result is a moderate outcome in each. Concentrating it on a few top priorities produces depth and progress that spreading cannot. The law therefore requires a decision about what matters most, and a matching decision about what will not receive attention. The book treats this as a thought process, a way of directing the mind, as much as a time management technique. Priorities shape what a person notices, worries about and does, so settled priorities simplify daily decisions."],
        ["Where it operates", "In career and business, where a small number of activities drive most results. In the use of time each day. In what a person reads, watches and talks about. In relationships and obligations competing for attention. And in goal-setting, where a long list tends to dilute every item."],
        ["How you can tell", "A focused person can state their top few goals and shows how their time and attention serve them. They decline other demands without distress. A scattered person is busy with many things, can name none as the main one and feels behind on all of them. The marker is whether the diary matches the stated priorities."],
        ["What it is not", "It is not ignoring everything else, since responsibilities still exist. It is not narrowness as a permanent condition, because goals can change. It is not constant work or the removal of rest. It is not a trick that works without clarity about what matters. And it is not a claim that a single focus suits everyone, only that dividing attention evenly across everything is the usual way of achieving little."]
      ] }
  ]};

/* CHAPTERS ARE A SECOND READING OF ONE BOOK, NOT FOUR MORE THEMES. The
   themes are what the book teaches, three to an axis, and the boot rule
   that holds every source to exactly that is the reason this is its own
   table: a chapter is where the idea sits in the book, and a book has
   no business being three chapters long. Only a book that has a
   chapter-by-chapter reading carries one, and only for chapters whose
   content is documented well enough to state; the others are left out
   rather than written to fit. Numbering follows the Steps I-V omnibus
   in English; other editions split and number the same material
   differently, so a chapter is named for what it is about as well. */
var CH = {
  surf: [
    { c: "I", n: "The Space of Variations", b: "The Field Holds Every Version",
      t: "Zeland opens with the model the rest rests on: reality is not one track but an information field containing every variant of every event, each a line of life you could move onto. What shows up as your circumstances is the sector of that field you are currently tuned to, and what tunes you is the thoughts and attitudes you hold steadily, not the ones you voice. The distinction is between what you say and what you consistently carry, since only the second sets the frequency. On this view circumstances are an effect and not a cause. The chapter lays out the picture of many available lines and asks the reader to see their current life as one selection among them, which means the present arrangement is not fixed and other versions of events remain available to the person who changes what they hold.",
      l: "Stop treating the situation as the cause and your signal as the weather. If you keep thinking the same way you stay on the same line, and the move is to change what you broadcast rather than to argue with what arrives. Your steady attitudes matter more than your stated intentions, so look at what you actually think when nothing is prompting you. That background thinking is what holds your position. Arguing with circumstances leaves it untouched. Treat your present situation as information about where you are tuned, and direct your effort at the tuning, since that is the part that moves you to another line." },
    { c: "II", n: "Pendulums", b: "Structures That Feed on Attention",
      t: "People who think and feel alike about something generate an energy structure Zeland calls a pendulum. It is not conscious, it feeds on attention and strong emotion of any sign, love and hatred equally, and it competes with other pendulums for followers. Destructive pendulums feed on fear, anger and outrage, and pull you onto the line that serves them. The chapter's key point is that a pendulum does not care which side of an emotion you take: support and opposition both give it energy. Its interest is in your engagement, and it will provoke whatever reaction keeps your attention. Being caught by one is therefore less about belief than about being made to react, which is why pendulums are described as hard to notice from inside, and the chapter treats recognising the structure as the first step in dealing with it.",
      l: "Fighting a pendulum feeds it, so the exit is neither loyalty nor opposition. Notice the pull, withhold the reaction it was designed to get, and choose the response you would have chosen without it. Pay attention to the topics and groups that reliably make you angry or afraid, because those are where your energy is being collected. The aim is not to feel nothing but to stop being steered by the feeling. Decline to supply the outrage and the structure loses its hold on you. What remains is your own judgement, which is the only thing that was ever yours to use." },
    { c: "III", n: "The Wave of Fortune", b: "Good Variations Cluster",
      t: "Favourable variations lie close together in the field, so one good event makes the next more likely. Zeland calls the resulting run the wave of fortune. It takes no extra effort from you to ride, and the same clustering works in the other direction, which is why bad days arrive in sequences. The chapter explains runs of luck as a feature of how the lines are arranged, not as chance or reward. Because related outcomes sit near one another, an event moves you toward its neighbours. The wave is not a reward for effort or virtue; it is a matter of where the variations lie and which cluster you have entered. Whether a run continues depends on how you respond to the first events in it, since the response keeps you on the cluster or shifts you off it.",
      l: "A run is kept going by calm acceptance and ended by suspicion, commentary or dread of the catch. Treat the first small setback as noise rather than as the start of a pattern, because how you read it decides which cluster you join. When things go well, resist the urge to examine and doubt them. Accept the good and carry on. When things go badly, refuse to build a story of decline from one bad event. You cannot control which variations appear first, but you do control how you receive them, and that reception is what either extends the run or breaks it." },
    { c: "IV", n: "Balancing Forces", b: "Excess Potential Gets Removed",
      t: "When you load a thing, a person or an outcome with more importance than it can carry, you create what Zeland calls excess potential, a charge of overvaluation or contempt. Balancing forces act to remove it, often by delivering the opposite of what was wanted. He applies the idea to guilt, to money and to the demand for perfection. The principle is that the field tends to even out imbalances in significance. Overvaluing a thing creates tension, and the removal of that tension often takes the form of losing or spoiling what was prized. Contempt works the same way in reverse. The chapter treats inflated importance, not desire itself, as the source of the trouble, and so asks the reader to watch the weight they attach to things and not the fact that they want them.",
      l: "Wherever you need something desperately, you are producing the conditions for losing it. Lower the importance, not the effort, and the thing you were gripping stops slipping. Look for the areas where your sense of stakes is highest, such as a person, an income or a standard you cannot meet, because those are where the imbalance is largest. Keep wanting and keep working, but take away the charge of must-have. Guilt and perfectionism are forms of the same overload. Reduce what you have loaded onto the outcome, and you stop supplying the force that works against you. The effort stays; the desperation goes. That is the adjustment the chapter asks you to make." },
    { c: "V", n: "The Induced Transition", b: "Being Pulled Onto a Line You Did Not Choose",
      t: "A pendulum can move you onto a line you never picked by provoking a strong reaction at the right moment. Zeland describes it as a vortex: the more you react, the more of your attention it holds, and the further you drift from the line you were on. The transition is induced, meaning that it is done to you through your own emotional response and not chosen by you. The chapter focuses on the mechanism of capture. A provocation arrives, your reaction supplies energy, and the energy deepens the pull. Each step makes the next more likely, so a small hook can become a large drift away from where you meant to be. Awareness of the process is the main defence the chapter offers, because the drift depends on the reaction going unnoticed.",
      l: "The warning sign is feeling swept along by something you did not decide. Catch the moment you are hooked and return to the question of what you actually want, because that question is outside the vortex. Your reaction is the lever the structure pulls, so the earlier you notice it, the less pull there is to resist. Learn the signals that mark a provocation in your own experience, such as sudden heat, urgency or the sense that you must respond right now. When they appear, pause and ask whether this serves your line or someone else's. Asking is enough to loosen the grip." },
    { c: "VII", n: "Intention", b: "Inner and Outer",
      t: "Zeland splits intention in two. Inner intention is the effort of doing, pushing against the world to make a result happen. Outer intention is the selection of an outcome from the field, where you decide the destination clearly and allow the route to arrive on its own. The mind's job is to choose, not to engineer every step. The distinction separates force from selection. Inner intention treats the world as resistance to be overcome, while outer intention treats the destination as already available and focuses on picking it. The chapter argues that the second is the more powerful, since it does not depend on controlling each detail of how the result comes about. Choosing is the mind's proper work, and the route is left to arrive, so the question to ask is what you want and not how it will be done.",
      l: "Be firm about where you are going and loose about how you get there. Most strain goes into controlling the route, which is the part you were never going to be able to control from where you stand. Spend your attention on getting the destination specific and settled, then let the steps appear. This does not mean idle waiting; it means acting on what is in front of you without insisting that the whole path be mapped. When you catch yourself pushing against every obstacle, ask whether you have clearly chosen the outcome or only decided to work harder. Clarity of choice is the cheaper and stronger lever." },
    { c: "VIII", n: "Slides", b: "The Goal Held as Already Yours",
      t: "A slide is a vivid mental picture of the goal as a settled fact, seen from inside as a participant rather than as a spectator, rehearsed regularly and paired with the feeling that it is ordinary. Zeland presents slides as the way to tune yourself to the matching sector of the field, as opposed to wishing at it from outside. The key distinctions are between participant and spectator, and between the extraordinary and the ordinary. A picture seen from outside keeps the goal at a distance, while one seen from within treats it as the place you already live. The feeling of normality is part of the tuning, since it signals that nothing about the result is strange to you. Regular rehearsal is what keeps the picture working, and a slide held only once does little.",
      l: "Picture the ordinary day inside the thing you want, not the moment of winning it. A goal you can only see as a triumph is still a goal you are looking at from outside. Build the image from within, with the routine details of being there, and hold it with the calm of someone for whom it is plain fact. Repeat it regularly so that it stops being a special event in your mind. If the picture feels exciting and distant, it is still a wish. When it feels familiar and unremarkable, you have moved from wanting the result to expecting it." },
    { c: "IX", n: "Heart and Mind", b: "Both Have to Agree",
      t: "Zeland separates two sources of knowing. The mind calculates and weighs, and most of its goals are inherited from what the people around it value. The heart, which he also calls the soul, answers in comfort or discomfort and does not argue. Intention is only whole when the two agree, and a goal the mind chose and the soul is silent about does not move. The chapter's concern is the origin of goals. Many objectives look like personal choices but are absorbed from surroundings, and the heart signals the difference by its response. Mind alone can plan, but without the heart's agreement the plan lacks force. Real intention needs both parts aligned on the same aim, and the chapter treats the heart's silence as a verdict on the goal, however sensible the mind's reasons for it appear.",
      l: "Before you commit to a goal, ask which half chose it. If thinking of the result produces no feeling, you probably took it from somewhere else, and discipline will not make it yours. Notice your inner response when you picture getting what you claim to want. Comfort and lightness indicate agreement, while flatness or unease indicate that the aim belongs to someone else. Do not try to override the signal with effort. Use it to sort your goals into those you hold and those you inherited, and put your energy only into the first group. A goal your whole self supports takes less pushing." },
    { c: "XII", n: "Frailing", b: "Giving in Place of Demanding",
      t: "Frailing, in Zeland's account, is the practice of moving your attention off what you want to receive and onto what you can give, particularly with another person. The wanting is itself a source of excess potential, and putting it down lets the blocked exchange move. This chapter applies the earlier idea of excess potential to relationships and requests. A strong desire for something from another person creates tension that works against getting it. Turning attention to what you can offer removes the tension and restores the flow. The distinction is between demanding and giving as stances: one clings to a result, the other releases it and focuses on the other person. The practice is simple in form and aimed at ordinary interactions, where the pull to ask for something is strongest and least noticed.",
      l: "Notice what your presence is asking for in a conversation, then ask what the other person needs instead. The change is small to do and often large in effect. When you want approval, agreement or help, your wanting shows and creates resistance. Shift your attention to what would be of use to them, and the pressure drops on both sides. You are not abandoning your aim. You are removing the grip that was holding it away. Watch for the moments when you are quietly collecting something from a person, such as reassurance or credit, and replace the collecting with giving." },
    { c: "XIII", n: "Coordination of Intention", b: "Reading Events as Favourable",
      t: "The closing practice is to decide, in advance and on purpose, that events are working out in your favour, including the ones that look like setbacks. Zeland's claim is that the interpretation you assign decides the next move, so assigning the favourable reading aligns your intention with the outcome rather than against it. The chapter treats interpretation as an active choice and not a passive observation. A setback can be read as damage or as part of the route, and the reading shapes what you do next. By settling the reading beforehand, you prevent the default reaction of alarm from setting your direction. This coordinates your intention with events instead of leaving the two in opposition, and it is presented as the closing practice because it applies to everything that comes before it.",
      l: "You will assign some meaning to a setback either way. Pick the one that leaves you able to act, then act, which is the only part of the sequence that was ever yours. Decide beforehand how you will read difficulty, so the first impression is not left to alarm. A reading that says this is working out in your favour keeps your attention on the next step. A reading that says this is ruin leaves you reacting. Neither is guaranteed true at the moment you choose it, so choose the one that supports movement. Then do the next thing, and let the outcome show what the choice made possible." }
  ]
};

/* A BOOK'S OWN WORDS, ONE UNDER EACH SECTION HEADING. The themes are
   this app's reading of a book; a quote is the book's, and it is the
   only part of the page that is. So the rule is stricter than it is for
   a theme and it is the one this file already keeps for everything

var TH = [
  { s: "devil", x: "mindset", n: "Definiteness of Purpose", b: "The Only Antidote",
    t: "The Devil's confession in the book is that he cannot enter a mind occupied by a definite major purpose. Hill makes this the single defence, and he rules out the usual candidates: not effort, not intelligence, not luck. The claim is structural. A mind that holds one settled aim has no vacancy for the drift and fear the Devil works through, so the protection comes from what already occupies the space and not from resistance applied afterwards. Hill is specific about what counts as the aim. It is one purpose, written down, with a plan and a deadline attached. A general wish for success does not qualify, because it names nothing a plan could be built around. The idea separates having ambitions from having a definite purpose, and it holds that only the second does any protecting.",
    l: "Almost nobody can state in one sentence what they are for. Without that sentence every hour is available to whatever is loudest, which is why the days feel full and the years feel empty. Vagueness is the vulnerability. A person with no stated aim is not neutral. They are open, and what fills the opening is usually the nearest demand, the most urgent message or the habit already in place. Being busy is no evidence against this, since busyness is exactly what an unclaimed life produces. Writing the sentence is the first test. If it will not come, that is the information. If it does come, it gives you a standard against which any hour, offer or distraction can be measured, and the standard is what the Devil cannot get past." },
  { s: "devil", x: "mindset", n: "The Two Per Cent", b: "Most People Are Not Deciding",
    t: "The Devil claims ninety-eight per cent of people as drifters and says he owns them because they never made a decision. The other two per cent are not smarter. Hill is careful about where he puts the divide. It is not intelligence, education or opportunity that separates the groups, but whether a person decided something and held it. The Devil's ownership is therefore not a conquest. It is a default that applies to anyone who leaves the question of direction open, and it requires nothing from him except patience. The two per cent have closed the question by deciding, and that is the only thing the Devil says they have in common. The figure carries the argument that a held decision is rare.",
    l: "The line is not between talented and untalented. It is between people who have decided and people who are still gathering information, and you are on one side of it right now and you know which. Gathering information feels like diligence, and it is often the most respectable form of not deciding. Another round of research, another opinion, another week of waiting all leave the question open while looking like progress. The two per cent are not distinguished by having more certainty. They are distinguished by having ended the search for it. Honesty here costs little and shows a lot. Either something has been chosen and is being held, or it has not, and the difference is visible in how you spend an ordinary day." },
  { s: "devil", x: "mindset", n: "Adversity Carries the Seed", b: "Every Setback Is a Delivery",
    t: "The book insists every adversity carries the seed of an equivalent benefit, and that the seed is only available to somebody actively looking for it. Hill's own ruin is the frame the whole thing is written from. The claim has two parts that should be kept apart. The first is that a benefit of matching size exists inside every setback. The second is that it does not announce itself. It stays latent unless a person goes looking, and a person absorbed by the loss does not look. Hill presents this as a law of the way setbacks work rather than as consolation, and he positions the whole interview as the product of a man who had been ruined and still extracted something from it.",
    l: "A setback is neutral until you go looking. The seed is not automatic and it is not consolation. It has to be extracted deliberately, while you are still angry, which is exactly when nobody does it. The practical difficulty is timing. Anger and disappointment narrow attention to the loss, and a search for the benefit feels like denial when it is made too early. The book's position is that the search is still the work, and that the benefit goes to whoever does it. Two people can take the same blow and leave with different amounts, and the difference is not luck. Read in this light, a bad period is a period with something in it that nobody has yet claimed, and claiming it is your job." },
  { s: "devil", x: "internal", n: "Drifting", b: "Going Along With Whatever Comes",
    t: "The Devil's chief instrument. A drifter lets circumstances and other people set the direction, does not know what they want, and moves with the weather. Hill says drifters cannot be reached by argument. The reasoning follows from the definition. A person with no aim has no position to argue from, so reasons and evidence have nothing to attach to. The drifter agrees with whoever spoke last and changes nothing. This is why the Devil does not need to win debates. He needs only to keep the question of direction unsettled, because an unsettled question lets the strongest current decide. Drifting is described as a condition of the whole life and not a lapse in a single choice, and it is the state the other ideas in the book exist to counter.",
    l: "Drifting does not feel like drifting. It feels like being reasonable, staying open, keeping your options. Check whether you have genuinely decided anything this year, or reacted fast enough that it looked like deciding. A real decision has a cost you can name, something refused or given up, and it holds when it becomes inconvenient. A fast reaction has neither. The test is where your time and money went, and which of those directions were chosen and which were handed to you by circumstance or by other people. If most were handed over, the sense of reasonableness is the symptom. Arguing yourself out of it will not work, for the same reason the book says arguing never reaches a drifter. Only a decision does." },
  { s: "devil", x: "internal", n: "The Six Basic Fears", b: "What Is Actually Running the Decision",
    t: "Poverty, criticism, ill health, loss of love, old age and death. Hill's claim is that nearly every irrational decision traces to one of the six, usually criticism, and that they operate below the level you can argue with. The list matters because it turns a vague sense of being held back into a short set of named causes. The fears are not presented as opinions a person holds and can revise. They work beneath conscious reasoning, which is why a person can build a sensible-sounding case for a decision while the actual driver sits elsewhere. Of the six, criticism is the one Hill says appears most often. The book treats fear as the main supply line of drift, and the list is how Hill makes it specific.",
    l: "Name which of the six is running the decision you are avoiding. It will be one of them and it will almost certainly be criticism. You are not weighing options, you are managing a fear, and those are different problems. Weighing options responds to information. Managing a fear responds to nothing you can look up, so more analysis will not move it. The sign is a decision that stays stuck while the arguments on both sides are already clear. When that happens the useful question is what you are afraid will happen to you if you act, and who will think what. Once the fear has a name it can be looked at as a fear instead of being treated as a reason. That does not remove it, but it stops it voting under the cover of reasoning." },
  { s: "devil", x: "internal", n: "Mastery Over Self", b: "The Only Thing You Hold",
    t: "The second of Hill's seven principles of freedom is mastery over self: discipline over thought, emotion and habit. The argument is one of leverage. You control almost nothing else, so the only place effort produces a reliable return is on the self. Hill sets the principle in a list of seven, which positions it as one part of a larger account of freedom rather than a stand-alone virtue. The three objects named matter. Thought, emotion and habit are the inner things a person can govern at all, and discipline over them is what keeps them from being run by someone else. The principle is a claim about where to spend attention, grounded in what can and cannot be controlled, and it treats the self as the single dependable lever.",
    l: "Your circumstances are mostly other people's decisions. What goes into your head, what you do with your hands and what you do with your hours is the whole of what is yours. Spending any of it on the rest is the waste. This is a narrow and demanding reading of ownership. It leaves out the economy, another person's temper and the outcome of any single effort, and it keeps the three things that answer to you directly. Frustration with the rest is a tax paid on things you cannot change. The discipline the book asks for is mainly one of subtraction. It means noticing where attention and effort are going into matters you do not control and returning them to the ones you do. That is not resignation. It is where the leverage sits." },
  { s: "devil", x: "external", n: "Environmental Influence", b: "The Room Is Doing the Work",
    t: "The fourth principle of freedom is control of environmental influence: who you are around, what you read, what you listen to. Hill treats it as a mechanism rather than as advice. The difference matters. Advice says that good company helps. A mechanism says that surroundings act on a person continuously and without permission, shaping thought whether or not the person notices. On that reading, environment is not a backdrop to character but one of its inputs, and the inputs are not neutral. Hill lists three channels, the people nearby, the material taken in through reading and the material taken in through listening, and holds that control over them is a principle of freedom in its own right. Choosing them is a form of self-defence.",
    l: "You are being written on continuously by whatever you are near, and it does not require your consent. Choosing the room is most of the work that looks like discipline from outside. A person who seems to resist temptation easily is often a person who arranged for it to be absent. The corollary is uncomfortable. Willpower spent against a bad environment is expensive and unreliable, while a better environment costs once. It also means that the people, sources and sounds you accept by default are decisions, only unmade ones. Look at who and what is nearest to you and ask what each is steadily teaching you. The answer is usually more accurate than your account of your own character." },
  { s: "devil", x: "external", n: "It Works Through Other People", b: "Most Discouragement Is Second Hand",
    t: "In the book the Devil's access to a person is mostly through the people around them, family, friends and teachers, who pass on fear and drift without knowing they are doing it. The point is about channel and not intent. The Devil does not appear as an enemy. He arrives as the opinions of people who are close and trusted, so the discouragement carries the weight of that trust. Those people are not agents of anything. They hold their own fear and drift and hand it on in the form of caution, advice or concern. Hill's account makes the Devil's reach depend on going unnoticed, and on the ordinary habit of absorbing the views of those nearest to us without examining them.",
    l: "Almost nobody discouraging you is doing it deliberately. They are transmitting their own fear accurately and it arrives sounding like concern, which is what makes it effective and why arguing never works. There is nothing to win against, since the person is sincere and what they say is true to their own experience. It is simply not information about your situation. Treating it as hostility wastes energy, and treating it as data misleads you. The useful reading is that it tells you what they are afraid of. That lets you stay warm toward the person while declining the conclusion. It also explains why discouragement is hardest to resist from those you love, since sincerity is exactly what carries it past your guard." },
  { s: "devil", x: "external", n: "Time", b: "It Is Compounding Something Already",
    t: "Hill's fifth principle is time: using it to convert experience into wisdom rather than letting it merely pass. The accompanying claim is that drifting compounds at exactly the rate purpose does. Both halves treat time as an active factor and not a container. Experience on its own is only what has happened. Wisdom is what has been drawn out of it, and the conversion is a use of time that has to be made on purpose. The second claim removes the idea that standing still is safe. Time keeps working on the drifter, building up the effects of unexamined days at the same rate it builds up the effects of directed ones. In the book the passage of time is never neutral, and the two paths differ only in what is accumulating.",
    l: "Time is not neutral. It is making you more of whatever you already are, at a rate you did not set. The question is never whether it compounds but what it has been compounding. A year spent without direction does not return you to where you began. It adds to a habit of not choosing. The same is true in the other direction, which is the encouraging half. Experience becomes wisdom only if you stop and extract it, and the extraction is a separate act from living through the events. Looking back over the past few years and asking what has accumulated is a harsh measure and an accurate one. It tells you which direction time has been working in, and so what it will keep doing." },
  { s: "devil", x: "karmic", n: "Hypnotic Rhythm", b: "Nature Makes Permanent What You Repeat",
    t: "The book's central mechanism. Hypnotic rhythm is nature's method of fixing any habit by repetition, and the claim is that it locks the drifter and the purposeful in with equal force and no preference. Everything else in the interview depends on this. Repetition is what makes a thought or action permanent, and nature applies it without regard to whether the habit helps or harms. That impartiality is the point. The Devil's work and the purposeful person's work use the same law, which is why neither side is ever held in reserve and why a drifter is not simply unlucky but is being fixed in place by the same process that fixes success. Hill uses the idea to explain how patterns harden into permanence.",
    l: "The same law is running on you right now whichever direction you are facing, and nothing is being held in reserve. Whatever you did this week is being made harder to stop, at exactly the same rate either way. There is no grace period in which a habit is still only a trial. Each repetition is both an act and an instruction about what to do next time. That makes small, repeated choices more consequential than large, rare ones, and it makes the temptation to postpone a change until conditions improve a poor bargain, because the postponement is itself being repeated. The practical reading is to look at what you did on most days recently and treat that list as what is being installed, whatever you intended it to be." },
  { s: "devil", x: "karmic", n: "Nothing for Nothing", b: "The Price Is Fixed",
    t: "Hill returns constantly to the claim that nature charges for everything, and that trying to get around the price is itself the trap. The price is not a punishment attached to wrongdoing. It is a feature of the way things are arranged, and it applies to every benefit worth having. The warning in the book is aimed at the search for a way round it: the shortcut, the free arrangement, the reward without the cost. Hill treats that search as part of the Devil's method, because it keeps a person looking in the wrong place while the real payment goes unmade. The pattern recurs throughout the interview, which is why the idea is stated so often and not once.",
