<!doctype html>
<html lang="en" data-view="open">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080B">
<title>Alignment</title>
<!-- A PAGE ON THE WEB ANSWERS THE REQUEST THE BROWSER MAKES ANYWAY.
     Without these Chromium asks for /favicon.ico on every load and the
     server answers 404 — a console error on every open, which is noise
     the one check that counts console errors then has to be taught to
     ignore. The apple-touch-icon and the standalone meta are what make
     Add to Home Screen open this full-screen rather than in a browser
     with a URL bar over the head. -->
<link rel="icon" href="../icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Alignment">
<meta name="description" content="372 themes and lessons from 18 figures and 13 books.">
<link rel="preload" href="../arc/fonts/Inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/GeistMono.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: 'Inter'; font-weight: 100 900; font-display: swap;
  src: url('../arc/fonts/Inter.woff2') format('woff2'); }
@font-face { font-family: 'Geist Mono'; font-weight: 100 900; font-display: swap;
  src: url('fonts/GeistMono.woff2') format('woff2'); }

/*
  ALIGNMENT. Its own ground, its own type, its own everything — it reads
  none of the other keys and takes none of the shared shell.

  THE LOOK IS A SKY, A THIN FACE AND A MONOSPACE, taken from a reference
  that was three phones of a finance app, and what it does is the
  opposite of what this did on every count. The ground was one flat warm
  black; it is a cool black with the colour living in gradients — a dawn
  behind the first screen, a dusk behind every title. Display type was
  Inter at 450 to 600; it is 300, because a large thin face reads as
  confident where a large heavy one reads as loud. Every label was
  tracked-out caps at half an em; it is a monospace, which is what makes
  a label read as a LABEL rather than as a heading someone shrank.

  AND THE MONOSPACE IS SHIPPED, NOT ASKED FOR. The system mono on this
  machine is DejaVu and on the phone it is SF Mono, so a screenshot judged
  here would have been a picture of a different app. Geist Mono, 23KB,
  OFL, beside the file that uses it — the same arrangement Inter already
  has, and not a CDN: nothing is fetched from anywhere but this origin.
*/

:root {
  --paper: #07080B;
  --ink: #F3F5F7;
  --dim: rgba(243,245,247,.72);
  /* The quietest thing that is still WORDS. The reference's sub-lines are
     dimmer than this and on a white-on-black face that is where 4.5:1
     goes — .46 measured 4.4 on this ground, which is the rounding error
     this repo keeps shipping as a margin. At .56 it is 5.9. */
  --quiet: rgba(243,245,247,.56);
  --hair: rgba(243,245,247,.10);
  --lift: rgba(243,245,247,.07);

  --sans: 'Inter', -apple-system, system-ui, sans-serif;
  --mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  /* TWO SKIES, AND WHERE THE WORDS SIT ON THEM IS PART OF THE DRAWING.
     Dawn runs from night to silver, and the sentence sits in the teal
     middle where white clears 9:1; the silver is under the button, which
     carries its own ground. Dusk runs night to a peach GLOW that rises
     through the lower third, and nothing is written in it — white on
     that peach is about 2:1, so the padding under the title is the room
     the light takes rather than slack. It went in as a radial glow and
     drew a hard HORIZON along the foot; the reference's is a plain
     vertical blend, which is what makes it read as sky rather than as a
     planet. */
  --dawn: radial-gradient(90% 55% at 50% 38%, rgba(64,110,132,.28), transparent 70%),
          linear-gradient(180deg, #03060A 0%, #07131D 18%, #122736 40%, #28404F 58%,
                                  #62737E 78%, #A9B2B8 94%, #C3C9CD 100%);
  --dusk: linear-gradient(180deg, #0B1220 0%, #15233A 36%, #3A4459 64%, #87717A 86%, #D29A84 100%);

  --r-card: 22px;
  --r-pill: 999px;

  /* Six vertical steps. The first build shipped eleven. */
  --v1: 6px;  --v2: 10px; --v3: 16px;
  --v4: 22px; --v5: 34px; --v6: 52px;

  --gut: 22px;
  --round: 40px;   /* drawn; the 44 it OWNS is the ::before square */
  --gut-list: 18px;
  --tap: 44px;

  /* FOUR HUES, AND THEY ARE THE SKY'S. The axis colours were a violet,
     a gold, a cyan and an orange at full saturation — the only saturated
     things in a reference that has none. They are the same four ideas
     taken toward the light: lavender, sand, sea-glass, peach, and the
     peach is the one in the dusk. Held to dE 12 apart by the suite, on
     composited labels rather than on these hexes. */
  --ax-mindset:  #B7A5FF;
  --ax-internal: #E8C67C;
  --ax-external: #7DCFD8;
  --ax-karmic:   #F2A184;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

/* THE PAGE IS A COLUMN AND THE NAV IS ITS FIRST CHILD. A fixed bar needs
   every view to know how tall it is; a flex child simply takes its room
   and hands the rest down, and a view that hides it gets the whole
   height without being told. */
html, body { height: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.5;
  overflow: hidden;
  overscroll-behavior: none;
  display: flex; flex-direction: column;
}

button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: left; }
[hidden] { display: none !important; }

/* THE LABEL REGISTER. One size, one tracking, one face — a label that
   comes in three sizes is three labels. */
.al-caps { font: 500 10.5px/1.35 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--quiet); }

.al-disp   { font-size: 34px; font-weight: 300; line-height: 1.04; letter-spacing: -.03em; text-wrap: balance; }
.al-disp-s { font-size: 30px; font-weight: 300; line-height: 1.04; letter-spacing: -.028em; }

.al-view { position: relative; z-index: 1; flex: 1; min-height: 0; display: none; flex-direction: column; }
.al-view.is-on { display: flex; }

/* ---- THE NAV ---- */
/* AT THE TOP, AND IT IS THREE MARKS AND A LINE. It was a glass pill at
   the foot, 58px tall with a lit lozenge in it — the heaviest object on
   every list, holding three glyphs. The reference's nav is the quietest
   thing on its screen: the marks at the ink's quietest step, the one you
   are on at full strength with a hairline under it. The line is what
   says which, so no ground is needed, and nothing sits over the list at
   the foot any more.

   Each mark owns 52x44 and draws 18; the three are adjacent, so nothing
   reaches into a neighbour. */
.al-nav { flex: none; position: relative; z-index: 2; display: flex; justify-content: center; gap: 2px;
  padding: calc(4px + env(safe-area-inset-top, 0px)) 0 0; }
.al-tab { position: relative; width: 52px; height: 44px; display: grid; place-items: center; color: var(--quiet); }
.al-tab svg { width: 18px; height: 18px; display: block; }
.al-tab::after { content: ''; position: absolute; left: 50%; bottom: 7px; width: 16px; height: 1px;
  margin-left: -8px; background: var(--ink); opacity: 0; }
.al-tab[aria-current="true"] { color: var(--ink); }
.al-tab[aria-current="true"]::after { opacity: 1; }

/* ---- THE OPEN SCREEN ---- */
/* THE REFERENCE'S MIDDLE PHONE: a sentence on a sky, and one round
   control at the foot. It was a left-aligned title over a paragraph on
   flat black with a pill under it, which is a form. What changed is
   what is FIRST — the figures are a line of type now, and what you read
   first is what the app is for. */
#alOpen { background: var(--dawn); align-items: center; justify-content: center; text-align: center;
  padding: calc(var(--v5) + env(safe-area-inset-top, 0px)) 30px calc(120px + env(safe-area-inset-bottom, 0px)); }
.al-mark { position: absolute; top: calc(var(--v4) + env(safe-area-inset-top, 0px)); left: 0; right: 0;
  display: flex; align-items: center; justify-content: center; gap: 9px; color: var(--ink); }
.al-mark svg { width: 16px; height: 16px; display: block; }
.al-mark b { font: 500 10.5px/1 var(--mono); letter-spacing: .32em; text-transform: uppercase; }
.al-open-k { margin-bottom: var(--v3); color: var(--dim); }
/* BALANCED, or the sentence ends on one word alone — it did, on "back." */
.al-open-t { font-size: 23px; font-weight: 300; line-height: 1.34; letter-spacing: -.012em; max-width: 15.5em; text-wrap: balance; }

/* THE BUTTON CARRIES ITS OWN GROUND, which is what lets it sit on the
   silver. White on the lightest part of the sky, with a shadow to lift
   it off — the reference's own control, and the one press on a screen
   whose only job is to be pressed through. */
.al-go { position: absolute; left: 50%; bottom: calc(var(--v5) + env(safe-area-inset-bottom, 0px));
  width: 62px; height: 62px; margin-left: -31px; border-radius: var(--r-pill);
  background: #FFFFFF; color: #0B0E13; display: grid; place-items: center;
  box-shadow: 0 10px 28px rgba(8,14,22,.22), 0 1px 0 rgba(255,255,255,.9) inset; }
.al-go svg { width: 20px; height: 20px; display: block; }

/* ---- A LIST'S HEAD ---- */
/* A TITLE ON A DUSK. The reference puts one gradient card at the top of
   a list and nothing else coloured on the screen, and this is that card:
   what the list is, and the figures for it in the label register above
   the name. Outside the pane, so the list scrolls under nothing. */
.al-head { flex: none; margin: var(--v1) 12px var(--v2); padding: 18px 20px 34px;
  border-radius: var(--r-card); background: var(--dusk); }
.al-kick { color: rgba(243,245,247,.74); }
.al-head .al-disp-s { margin-top: 9px; }
.al-count { font-variant-numeric: tabular-nums; }

/* THE STOPS ARE THE NAV'S OWN IDIOM ONE LEVEL DOWN: words, and a line
   under the one you are on. They were two filled pills. 40 drawn, and
   the reach takes each to 44 tall and past 44 wide. */
.al-stops { flex: none; display: flex; gap: 24px; margin: 0 var(--gut-list); border-bottom: 1px solid var(--hair); }
.al-stop { position: relative; height: 40px; }
.al-stop::before { content: ''; position: absolute; inset: -2px -10px; }
.al-stop[aria-current="true"] { color: var(--ink); }
.al-stop[aria-current="true"]::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px;
  height: 1px; background: var(--ink); }

.al-pane { flex: 1; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  padding: 0 var(--gut-list) calc(56px + env(safe-area-inset-bottom, 0px)); }
.al-pane::-webkit-scrollbar { display: none; }

/* A MASK, NEVER A GRADIENT LAID OVER THE CONTENT: a mask has no colour
   to get wrong. Off again at the end of the travel — a soft edge over
   nothing is the same lie in the other direction. */
.al-pane { -webkit-mask-image: linear-gradient(180deg, #000 calc(100% - 72px), transparent 100%);
                   mask-image: linear-gradient(180deg, #000 calc(100% - 72px), transparent 100%); }
.al-pane.is-end { -webkit-mask-image: none; mask-image: none; }

/* ---- ROWS ---- */
/* HAIRLINES, NOT CARDS. Every row was a filled 26px-radius slab, so a
   list of sixteen names was sixteen objects of equal weight on a page
   that had nothing else on it. The reference's list is rows on the
   ground with a line between them, and a line costs no height and says
   exactly one thing. The heading draws the line above the first row. */
.al-grp { display: flex; justify-content: space-between; align-items: baseline;
  padding: var(--v5) 2px var(--v2); border-bottom: 1px solid var(--hair); }
.al-grp[data-x] { color: var(--tg); }
.al-n { font-variant-numeric: tabular-nums; }

/* A ROW SAYS ITS NAME IN THE MONOSPACE, and that is the reference's
   boldest move rather than its oddest: the content of its list is set in
   the label face, bright over dim, so a row reads as an ENTRY rather
   than as a heading. Two registers of one face, which is quieter than a
   sans name over a mono place and still tells the two lines apart. */
.al-rt { display: block; min-width: 0; }
.al-tn { display: block; font: 500 12.5px/1.4 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink); }
.al-tsub { display: block; margin-top: 4px; font: 400 10.5px/1.35 var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--quiet); }
.al-chev { flex: none; width: 15px; height: 15px; color: var(--quiet); transition: transform .22s ease; }
.al-chev svg { width: 100%; height: 100%; display: block; }

.al-f { display: flex; align-items: center; gap: 14px; width: 100%;
  padding: 16px 2px; border-bottom: 1px solid var(--hair); }
.al-f .al-rt { flex: 1; }
.al-pane > .al-f:first-child { border-top: 1px solid var(--hair); }

/* ---- A THEME ---- */
/* A THEME IS A ROW THAT OPENS. It was a card with both paragraphs always
   drawn, so a source page was twelve full cards and about six thousand
   pixels — a document you scrolled rather than a list you read from.
   Shut, the twelve are one screen of titles; open, the one you chose is
   the only prose on it. The chevrons are the reference's own.

   A BUTTON INSIDE THE HEADING, never a heading inside a button: the
   second is invalid and loses the heading for a screen reader. Which rows
   are open is NOT stored — it is a position on a screen you are looking
   at, and one restored from last week opens on a theme you have moved
   past. Kept opens them all, because everything on it you chose to
   read again. */
.al-th { border-bottom: 1px solid var(--hair); }
.al-th-h { font: inherit; }
.al-row { display: flex; align-items: center; gap: 14px; width: 100%; padding: 16px 2px; }
.al-row .al-rt { flex: 1; }
.al-row[aria-expanded="true"] .al-chev { transform: rotate(180deg); color: var(--ink); }

.al-body { padding: 2px 2px 24px; }
.al-tl { margin: var(--v3) 0 var(--v1); color: var(--tg); }
.al-body .al-tl:first-child { margin-top: 4px; }
.al-tb { font-size: 14.5px; line-height: 1.55; color: var(--dim); }
/* THE LESSON IS THE MIDDLE PHONE'S SENTENCE: larger, thinner, the ink.
   The evidence above it stays at the reading size in the quieter step,
   so what separates the two halves is register rather than a box. */
.al-tb.is-les { font-size: 18px; font-weight: 300; line-height: 1.46; letter-spacing: -.006em; color: var(--ink); }

/* TWO MARKS, BECAUSE THEY ARE TWO CLAIMS. A highlight is liberal; a pin
   is the handful you are working from. The state is the GROUND — the ink
   with the paper on it — never a second word, which would reflow the row
   under the press that moved it. 32 drawn; the reach is vertical only,
   or Pin's band lands in Highlight's. */
.al-acts { display: flex; gap: 8px; margin-top: var(--v4); }
.al-mk { position: relative; height: 32px; padding: 0 15px; border-radius: var(--r-pill);
  font: 500 10.5px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase;
  color: var(--dim); background: var(--lift); }
.al-mk::before { content: ''; position: absolute; inset: -6px 0; }
.al-mk[aria-pressed="true"] { background: var(--ink); color: #0B0E13; }

.al-empty { padding: var(--v4) 2px; font-size: 15px; line-height: 1.5; color: var(--dim); }

.al-th[data-x="mindset"],  .al-grp[data-x="mindset"]  { --tg: var(--ax-mindset); }
.al-th[data-x="internal"], .al-grp[data-x="internal"] { --tg: var(--ax-internal); }
.al-th[data-x="external"], .al-grp[data-x="external"] { --tg: var(--ax-external); }
.al-th[data-x="karmic"],   .al-grp[data-x="karmic"]   { --tg: var(--ax-karmic); }

/* ---- A SOURCE ---- */
/* The right phone: a dusk card with the name on it, then the list. The
   card is IN the pane, so it scrolls away and the twelve rows get the
   screen — a list's head stays because you move between lists, and a
   source is one thing you are reading down. */
#alSource .al-pane { padding-top: calc(var(--v2) + env(safe-area-inset-top, 0px)); }
.al-lead { margin: 0 -6px var(--v1); padding: 20px 22px 56px; border-radius: var(--r-card); background: var(--dusk); }
.al-lead .al-kick { margin-bottom: 10px; }
/* THE TITLE HAS TO CLEAR THE CLOSE BUTTON, which is fixed at the
   viewport's own right edge — so the room is a number of PIXELS and an
   em measure cannot see it. Derived from the button and the gutters. */
.al-lead .al-disp { max-width: calc(100% - (var(--round) + var(--gut) - var(--gut-list) + 8px)); }
.al-sheet { padding-bottom: var(--v6); }

/* THE CLOSE IS AN OBJECT, NOT GLASS. It sits over running text while the
   pane scrolls under it, and a translucent disc over a sentence is a
   smear — a letter behind it survived as a ghost at 56%. Solid, with the
   hairline every surface here draws, so it reads as a thing on the page
   rather than a hole in it. */
.al-round {
  width: var(--round); height: var(--round); flex: none; border-radius: var(--r-pill);
  background: #12151B; border: 1px solid var(--hair);
  display: grid; place-items: center; position: relative;
}
.al-round::before {
  content: ''; position: absolute; top: 50%; left: 50%;
  width: var(--tap); height: var(--tap); transform: translate(-50%, -50%);
}
.al-round svg { width: 16px; height: 16px; display: block; }
.al-x { position: fixed; top: calc(18px + env(safe-area-inset-top, 0px)); right: var(--gut); z-index: 30; }
</style>

</head>
<body>

<nav class="al-nav" id="alNav" hidden>
  <button class="al-tab" data-v="figures" aria-current="true" aria-label="The Figures">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="3" y="7" width="13" height="13" rx="2.4"/><path d="M8 4h11a2 2 0 0 1 2 2v11"/></svg>
  </button>
  <button class="al-tab" data-v="books" aria-label="The Books">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7.2v13M12 7.2C10.6 5.6 8.4 4.8 5.2 4.8a1 1 0 0 0-1 1v11.6a1 1 0 0 0 1 1c3.2 0 5.4.8 6.8 2.4M12 7.2c1.4-1.6 3.6-2.4 6.8-2.4a1 1 0 0 1 1 1v11.6a1 1 0 0 1-1 1c-3.2 0-5.4.8-6.8 2.4"/></svg>
  </button>
  <button class="al-tab" data-v="kept" aria-label="Kept">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6.8 3.4h10.4a1.4 1.4 0 0 1 1.4 1.4v15.8L12 16.1l-6.6 4.5V4.8a1.4 1.4 0 0 1 1.4-1.4Z"/></svg>
  </button>
</nav>

<section class="al-view is-on" id="alOpen">
  <div class="al-mark">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M12 2v20M5 8l7-6 7 6M5 16l7 6 7-6"/></svg>
    <b>Alignment</b>
  </div>
  <p class="al-caps al-open-k" id="alOpenK"></p>
  <h1 class="al-open-t" id="alOpenT">The model they ran on, what they were really like, what the world did, and what came back.</h1>
  <button class="al-go" id="alOpenB" aria-label="Begin">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </button>
</section>

<section class="al-view" id="alFigures">
  <div class="al-head"><p class="al-caps al-kick"><span class="al-count"></span> <span class="al-kick-r"></span></p><h1 class="al-disp-s">The Figures</h1></div>
  <div class="al-pane" id="alFiguresPane"></div>
</section>

<section class="al-view" id="alBooks">
  <div class="al-head"><p class="al-caps al-kick"><span class="al-count"></span> <span class="al-kick-r"></span></p><h1 class="al-disp-s">The Books</h1></div>
  <div class="al-pane" id="alBooksPane"></div>
</section>

<section class="al-view" id="alKept">
  <div class="al-head"><p class="al-caps al-kick"><span class="al-count"></span> <span class="al-kick-r"></span></p><h1 class="al-disp-s">Kept</h1></div>
  <div class="al-stops" id="alKeptStops">
    <button class="al-stop al-caps" data-st="pin" aria-current="true">Pinned</button>
    <button class="al-stop al-caps" data-st="hi">Highlighted</button>
  </div>
  <div class="al-pane" id="alKeptPane"></div>
</section>

<section class="al-view" id="alSource">
  <button class="al-round al-x" id="alSourceX" aria-label="Close">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
  <div class="al-pane" id="alSourcePane"></div>
</section>

<script>
(function () {
'use strict';

/*
  ONE WRAPPER. Nothing escapes it. The other apps in this repo learned
  that the hard way — a top-level name here does not throw when it
  collides, it replaces, and the symptom turns up screens away.
*/

var KEY = 'align.v1';

/* THE SOURCE IS THE EVIDENCE AND THE LESSON IS WHAT IT LEAVES YOU.
   There are two kinds of source and they take the same four axes. A
   FIGURE is a real person and the theme is something they actually did.
   A BOOK is a system somebody wrote down and the theme is what the book
   actually claims — not a paraphrase of the blurb, and not a lesson
   invented and hung on a famous title. Where an idea belongs to the
   author's wider work rather than to that one volume, it says so.

   The books came in without anything coming out. Nothing about the
   figures changed.

   THE ORIGINAL NOTE FOLLOWS, and it is about the figures.

   THE FIGURE IS THE EVIDENCE AND THE LESSON IS WHAT IT LEAVES YOU.
   These were films and shows first — Get Rich or Die Tryin', Power,
   Paid in Full, Snowfall, and six that had nothing to do with any of
   it. Every one of those was a dramatisation of people who are
   actually here, so the films came out and the people went in.

   WHICH TIGHTENS THE CONSTRAINT RATHER THAN RELAXING IT. A script can
   be quoted; a life has to be sourced. Every theme is a documented
   fact — the Chapter 11 filing and the exit, the Glacéau stake, the
   hundred copies of Crenshaw at a hundred dollars each, the 85/15
   distribution deal, the chinchilla coat at Ali and Frazier, thirty
   years on a conspiracy count — and anything reported rather than
   established says so inside the theme: Blandón and the Contra
   network, the coffins, Ghetto Qu'ran.

   AND THE LESSON IS WRITTEN TO LAND, NOT TO SUMMARISE. A paraphrase
   with a moral on the end is the version everybody has already read.
   Each one names the uncomfortable half — the thing you are currently
   doing that the fact is about — because a lesson you can agree with
   and walk away from has not been written yet.

   Three internal, three external and three karmic for each, which is
   a shape rather than a quota: a figure that only yielded two of one
   kind would be one to cut rather than one to pad. Asserted at boot
   in both directions. */

/* FOUR AXES, AND EACH ONE IS A DIFFERENT QUESTION. MINDSET is the

  { s: "surf", x: "mindset", n: "Importance Is the Enemy", b: "Excess Potential",
    t: "Caring too much about anything creates what Zeland calls excess potential, a distortion the balancing forces move to eliminate, usually by producing the opposite of what was wanted. The more it matters, the more reliably it is taken.",
    l: "Whatever you have made enormous is the thing you will handle worst. Reduce its importance rather than your effort: the interview, the trade, the conversation goes well in exact proportion to how survivable you have decided the failure is." },
  { s: "surf", x: "mindset", n: "Coordination of Intention", b: "Treat Everything as Favourable",
    t: "Zeland's practice of deliberately assuming every event is working in your favour, especially the ones that look like setbacks, because the interpretation decides which line you move onto next.",
    l: "You have no way of knowing what a setback is for, and you are going to assign it a meaning either way. Assigning the favourable one costs nothing and changes what you do next, which is the only part you control." },
  { s: "surf", x: "internal", n: "The Soul and the Mind Must Agree", b: "Wanting What You Say You Want",
    t: "Zeland's condition for anything working at all: the mind's stated goal and the soul's actual feeling have to be the same thing. Most goals are the mind's, borrowed and respectable, and the soul is silent about them.",
    l: "Check whether the thing you are pursuing produces any feeling at all when you imagine already having it. If it does not, you took it from somebody else, and no amount of discipline makes a borrowed goal work." },
  { s: "surf", x: "internal", n: "Frailing", b: "Stop Asking, Start Giving",
    t: "The technique of moving attention entirely off what you want from a person and onto what they want. Zeland's claim is that this releases the potential which was blocking it in the first place.",
    l: "Whatever you want badly from another person is what your presence is currently demanding, and they can feel it. Turn the whole of your attention onto what they need and the thing you wanted becomes available." },
  { s: "surf", x: "internal", n: "The Watcher", b: "Never Fully Absorbed",
    t: "Zeland's instruction to keep part of your attention as an observer, so that you are never completely inside the role you are playing. Absorption is how pendulums take hold.",
    l: "You can act with full commitment and still keep a piece of yourself watching. That piece is the whole of what lets you stop mid-argument, mid-spiral, mid-trade. Without it you find out what you did afterwards." },
  { s: "surf", x: "external", n: "Pendulums", b: "Structures That Feed on Attention",
    t: "Zeland's name for any structure — a movement, a company, an argument, a fandom — that exists by absorbing the energy of its adherents and grows by provoking reactions. It is not conscious and it does not care about you. It needs attention.",
    l: "Anything designed to provoke a reaction from you is a structure feeding. The tell is that responding feels urgent and important. You do not win by arguing better, you win by failing to show up." },
  { s: "surf", x: "external", n: "The Balancing Forces", b: "Nature Removes Every Distortion",
    t: "Any excess potential — idolising, despising, desperate wanting, contempt — creates an imbalance, and the balancing forces act to remove it, generally by handing you the opposite of what you were holding.",
    l: "Whenever something is going too well in your own telling of it, check what you have inflated. Reality has no opinion about you and it does level, and it does it at the least convenient moment by design." },
  { s: "surf", x: "external", n: "The Wave of Fortune", b: "Momentum Is Real and It Is Fragile",
    t: "Zeland describes a line where things begin going well, and the ordinary human reaction — pointing it out, growing suspicious, waiting for the catch — is exactly what knocks you off it.",
    l: "When a run starts, the most dangerous thing you can do is comment on it. Notice, accept, continue. Most good runs are ended by the person having them deciding it cannot last." },
  { s: "surf", x: "karmic", n: "You Cannot Take a Line You Do Not Match", b: "Become It First",
    t: "Zeland's rule that you only move onto a line whose parameters match what you are radiating, so the sequence is always inner change first and outer arrival second, never the reverse.",
    l: "The thing you want will not arrive to the person you currently are, not because you are unworthy but because the two do not fit together. Find out what that person does on an ordinary Tuesday and do that." },
  { s: "surf", x: "karmic", n: "Pendulums Punish Their Own", b: "What You Join Owns You",
    t: "Zeland's warning that a pendulum rewards adherence and turns on anybody who stops feeding it, and that the people who serve it hardest are consumed first.",
    l: "Anything that offers you an identity in exchange for loyalty is charging you, and the bill is your attention for the rest of your life. Find out what happens to the people who try to leave." },
  { s: "surf", x: "karmic", n: "The Borrowed Goal", b: "It Cost the Decade",
    t: "Zeland's claim that most people spend their lives on a goal imposed by a pendulum, and that arriving at it produces nothing at all, which is the return on an aim that was never theirs.",
    l: "Getting somebody else's goal is worse than missing your own, because you spent the years and cannot say what went wrong. Work out whose idea it was, honestly, before you spend another one." },
  { s: "para", x: "mindset", n: "Results Are the Paradigm Speaking", b: "Not Your Desire, Not Your Will",
    t: "Proctor's central claim: your results are an exact expression of your conditioning rather than of what you want. It is why people return to the same income, the same weight and the same kind of relationship repeatedly.",
    l: "Read your results as a readout rather than as a verdict. They are telling you what is installed. Fighting them with effort while the programme is unchanged is why the same year keeps happening." },
  { s: "para", x: "mindset", n: "The Stick Person", b: "Conscious, Subconscious, Body",
    t: "Proctor's diagram: the conscious mind chooses, the subconscious accepts without judgement whatever is impressed on it, and the body acts it out. Nothing reaches the body except through the middle layer.",
    l: "You cannot install anything by deciding it once. That middle layer accepts by repetition and emotion only, which is why every plan that relied on a single moment of clarity was gone by the Wednesday." },
  { s: "para", x: "mindset", n: "A Worthy Ideal", b: "Pick the One You Cannot See the Path To",
    t: "Proctor separates three kinds of goal: the one you know how to reach, the one you think you can reach, and the one you have no idea how to reach. He insists only the third changes anything about you.",
    l: "A goal you know how to hit is a schedule, and it will leave you exactly as you are. Pick the one where you genuinely cannot see the route, because the not knowing is the entire mechanism." },
  { s: "para", x: "internal", n: "The Terror Barrier", b: "The Wall Just Before the Change",
    t: "Proctor's name for the point where you move toward the new result and the paradigm produces fear, doubt and the urge to return to what is familiar. He says almost everybody bounces off it and calls it common sense.",
    l: "The fear arriving is the signal that you are at the edge, not the signal that you were wrong. It feels identical to good judgement, it comes with reasons, and everybody who got through describes it the same way." },
  { s: "para", x: "internal", n: "It Was Installed Before You Could Object", b: "Most of It Is Not Yours",
    t: "Proctor's position is that the paradigm is largely formed in early childhood out of the surrounding environment, and therefore contains the beliefs of people who never consulted you about any of it.",
    l: "Most of what you assume about money, work and what is possible for somebody like you was put there by people doing their best in a different decade. None of it was chosen and all of it is still running." },
  { s: "para", x: "internal", n: "Repetition, or an Emotional Event", b: "The Only Two Doors",
    t: "Proctor says a paradigm changes in exactly two ways: a significant emotional event, or constant spaced repetition. You cannot schedule the first one.",
    l: "The only available lever is repetition, done daily, for long enough to be boring. Everybody wants the emotional event because it is fast, and waiting for one is how a decade passes unchanged." },
  { s: "para", x: "external", n: "You Will Recreate the Circumstances", b: "The Environment Reflects the Programme",
    t: "Proctor's claim that people who change their circumstances without changing the paradigm return to equivalent ones: the lottery winner, the weight regained, the same argument with a different person.",
    l: "If a problem has followed you through three jobs or three relationships it is not the jobs. That is unwelcome and it is also the best news available, because the part you can reach is the part causing it." },
  { s: "para", x: "external", n: "Money Is an Effect", b: "Go at the Cause",
    t: "Proctor, following Wattles, treats money as an effect of service rendered and of the mind that produced it, which makes going directly at the money going at the wrong end of the chain.",
    l: "The income is downstream of the value and the value is downstream of what you are. Going at the number directly is why so much effort produces so little, and the order of the chain is not negotiable." },
  { s: "para", x: "external", n: "Proximity Reinstalls It", b: "Everybody Near You Holds the Old Programme",
    t: "Proctor's insistence that the people around you carry the conditioning you are trying to leave, and will restate it daily without any malice at all.",
    l: "The reinstallation is continuous and nobody is doing it on purpose. You do not need to leave anybody, but you do need deliberate hours somewhere else, or every gain is overwritten by an ordinary week." },
  { s: "para", x: "karmic", n: "You Get What You Are", b: "Not What You Want",
    t: "Proctor's version of attraction has no mysticism he will not explain: what you consistently are in thought and feeling produces the actions and the perception that produce the results. Wanting has no mechanism at all.",
    l: "Wanting is not an input to anything. Being is, because being decides what you notice, what you attempt and what you agree to, and those three make the whole outcome." },
  { s: "para", x: "karmic", n: "The Same Year, Repeated", b: "Effort Inside an Unchanged Programme",
    t: "Proctor's most confronting point: a person can work extremely hard for thirty years inside an unchanged paradigm and arrive precisely where the paradigm always said they would.",
    l: "Effort inside an unchanged programme produces a more exhausting version of the same result. Before you add hours, find out whether hours were ever the constraint, because they usually are not." },
  { s: "para", x: "karmic", n: "Impressed, Then Expressed", b: "The Return Arrives as Circumstance",
    t: "The lineage claim running from Haanel through Hill to Proctor: whatever is impressed on the subconscious is expressed as events, and the return arrives looking like luck and circumstance.",
    l: "You are impressing something every day whether or not you chose the content. It returns later, dressed as circumstance, and by then the connection is invisible. Choose the content now, while it is cheap." },
  { s: "feel", x: "mindset", n: "Think From the End", b: "Not Of It",
    t: "Neville's distinction, and the one everything else rests on. Thinking OF a thing keeps you outside it and confirms you do not have it. Thinking FROM it means assuming the state of already having it and looking at the world from there.",
    l: "Almost all visualising is done from outside, watching yourself get it, which is a rehearsal of absence. The shift is to ask what you would be noticing, saying and doing if it were already done, and then do that." },
  { s: "feel", x: "mindset", n: "Assumption Precedes Evidence", b: "The Order Is Not Negotiable",
    t: "The claim is that the state is assumed first and the facts rearrange to match, never the reverse, and that waiting for evidence before assuming is the whole of why nothing moves.",
    l: "You are waiting to feel like the person before you behave like them, and the order runs the other way. Your current evidence is not a reason, it is a record of the previous assumption." },
  { s: "feel", x: "mindset", n: "A Controlled Imagination", b: "And a Well-Sustained Attention",
    t: "Neville calls this the great secret in plain words. Not effort, not affirmation: the capacity to hold one scene and one feeling without drifting, deliberately and repeatedly.",
    l: "The scarce thing is attention held on one object for more than about forty seconds. It is trainable and almost nobody trains it, which is why this technique is simultaneously public and rare." },
  { s: "feel", x: "internal", n: "Feeling Is the Secret", b: "The Subconscious Does Not Read Words",
    t: "The title and the mechanism. The subconscious accepts what is felt as true rather than what is stated, so an affirmation repeated without the corresponding feeling impresses nothing at all.",
    l: "Saying it is not doing it. The test is whether the statement produces any physical change in you when you make it. If it does not, you have been talking, and talking has no route in." },
  { s: "feel", x: "internal", n: "Your Habitual Mood", b: "The State You Drift Back To",
    t: "Neville's instruction to catch the mood you habitually return to, because he treats habitual mood rather than occasional effort as the actual creative agent, and it is usually one nobody chose.",
    l: "Whatever state you spend the most hours in is what is being impressed, and it is almost always the one you drift back to rather than the one you visit on purpose. That is the number worth changing." },
  { s: "feel", x: "internal", n: "The Chief Delusion", b: "Nothing Outside Is the Cause",
    t: "Neville's hardest line: that man's chief delusion is his conviction that there are causes other than his own state of consciousness. Every external explanation is, in his frame, an evasion.",
    l: "This is uncomfortable and it is useful even taken only as a discipline. Every time you locate the cause outside yourself you have also located the solution outside yourself, and you cannot reach it there." },
  { s: "feel", x: "external", n: "Sleep Is the Doorway", b: "The Drowsy State",
    t: "Neville's practical instruction: the state on the edge of sleep, where the conscious mind is quiet, is when the assumption should be held. The last thing in mind before sleep is the impression that takes.",
    l: "You are already doing this every night with whatever was last on your mind, which for most people is a screen or an argument. That slot is a mechanism whether or not you use it deliberately." },
  { s: "feel", x: "external", n: "Prayer Is a State", b: "Asking Confirms Absence",
    t: "Neville redefines prayer as the assumption of the wish already fulfilled, held in a state akin to sleep, and points out that petitioning confirms the thing is not had, which is the state actually being impressed.",
    l: "Whatever form your asking takes, it restates the absence every time. Notice how much of your inner life is spent confirming, in detail, that you do not yet have it." },
  { s: "feel", x: "external", n: "The World Is the Report", b: "Circumstance Is Not an Authority",
    t: "In Neville's frame the outer world is the printed record of states already held: a report rather than a verdict, and therefore never a reason to change the assumption.",
    l: "Whether or not you accept the metaphysics, treating your circumstances as data about what you have been rather than as a ruling on what you can be is a strictly better position to act from." },
  { s: "feel", x: "karmic", n: "What Is Impressed Is Expressed", b: "There Is No Filter",
    t: "Neville's mechanism runs both ways. The subconscious does not evaluate, it forms, and whatever is felt as true is brought into being, including the things nobody would choose.",
    l: "There is no filter on the input. The fear you rehearse in detail is receiving exactly the same treatment as the goal you visualise for five minutes, and one of those is getting far more hours." },
  { s: "feel", x: "karmic", n: "The Interval", b: "Remaining Faithful With No Evidence",
    t: "Neville's repeated point that between the assumption and its appearance there is a period in which nothing confirms it, and that abandoning the state during that period is the only real failure available.",
    l: "That gap exists in every version of this, secular or not. What you do in the stretch where there is no evidence is the entire difference, and it is the part no technique can do for you." },
  { s: "feel", x: "karmic", n: "Today Is Last Year Arriving", b: "Read It as a Return",
    t: "Neville's claim that the present is the harvest of states previously held, which makes today a report on last year rather than an accident that happened to you.",
    l: "Read your current life as the return on what you were consistently being twelve months ago. Whether or not the mechanism is what he says it is, the correlation is strong enough to act on." },
  { s: "sogr", x: "mindset", n: "The Creative Mind", b: "Not the Competitive One",
    t: "Wattles' core distinction. The competitive mind sees a fixed supply to be fought over; the creative mind brings something into being that was not there. He argues nothing held on the competitive plane is secure, because it can be taken the same way it was got.",
    l: "Ask honestly whether you are trying to take a share or to make something new. The first is a fight with everybody and the second has no competitors at all, and most people never notice which one they are doing." },
  { s: "sogr", x: "mindset", n: "A Certain Way", b: "The Method Is the Asset",
    t: "Wattles insists that getting rich has nothing to do with the business you are in, the place you live or your talent, and everything to do with doing things in a certain way, which is learnable and repeatable.",
    l: "You are probably in a good enough field. The variable is how you operate inside it, and that is the part you can improve this week. Changing the field is usually a way of avoiding changing the method." },
  { s: "sogr", x: "mindset", n: "Gratitude Is a Mechanism", b: "Not a Sentiment",
    t: "Wattles gives it a chapter and treats it functionally: gratitude holds the mind on what is working, and a mind fixed on lack produces the actions of lack.",
    l: "It is not about being pleasant. The direction of your attention decides what you look for, and a person cataloguing what is missing behaves completely differently from one cataloguing what is there." },
  { s: "sogr", x: "internal", n: "Hold the Picture, Not the Method", b: "Do Not Supply the How",
    t: "Wattles says to form a clear mental image, hold it with purpose and faith, and specifically not to concern yourself with the route by which it arrives. The how is not yours to provide.",
    l: "Most planning is anxiety wearing a spreadsheet. Be precise about the outcome and loose about the route, because insisting on a route you can already see limits you to what you can currently imagine." },
  { s: "sogr", x: "internal", n: "Act in Your Present Business", b: "Start From Where You Are",
    t: "Wattles is blunt that you act now, in the job and the place you are already in, doing everything you can do each day, and that waiting for better circumstances is the commonest failure of all.",
    l: "There is no better starting position coming. The actions available today, done completely, are the whole mechanism, and the search for a better starting point is the thing consuming the years." },
  { s: "sogr", x: "internal", n: "Efficient Action", b: "Do Not Hurry and Do Not Skip",
    t: "His instruction is to do each day's work efficiently and completely rather than rushing at tomorrow's, because hurried action is inefficient action and incomplete days accumulate.",
    l: "Doing today's work completely is unglamorous and it is the whole of it. Rushing is a way of feeling productive while leaving a trail of half-finished things that each cost double later." },
  { s: "sogr", x: "external", n: "Give More in Use Value Than You Take", b: "The Increase",
    t: "Wattles' central mechanism: everybody you deal with should be better off for having dealt with you, and the business is built out of that rather than out of extraction.",
    l: "Make sure the person on the other side of every transaction genuinely gained. It is slower, it produces a reputation that works while you sleep, and it removes the need to keep finding new people." },
  { s: "sogr", x: "external", n: "There Is No Shortage", b: "Supply Is Not the Constraint",
    t: "Wattles argues the supply of everything worth having is effectively unlimited, and that acting from scarcity produces exactly the results scarcity predicts.",
    l: "Whether or not the metaphysics holds, check what you are assuming about the size of the opportunity. Almost everybody is operating on an estimate they inherited and have never once tested." },
  { s: "sogr", x: "external", n: "You Are Not Competing", b: "Nobody Else Winning Costs You",
    t: "His claim that there is no need to take from anyone, drive a hard bargain or cheat, because the creative plane has room and the competitive plane is where the fear lives.",
    l: "The feeling that somebody else winning costs you something is almost always false and always expensive. It changes who you are willing to help, and that is the most valuable thing you have to trade." },
  { s: "sogr", x: "karmic", n: "The Increase Comes Back", b: "From Somewhere Else",
    t: "Wattles ties the system together here: the person who consistently gives more than they take becomes the one everybody wants to deal with, and the return is structural rather than moral.",
    l: "The return does not come from the transaction it was given in. It comes from the ones that happen because of it, later, which is exactly why the practice looks unrewarded for so long." },
  { s: "sogr", x: "karmic", n: "Thought Held Long Enough", b: "Wavering Undoes It",
    t: "Wattles' mechanism requires sustained impression over time and he is explicit that wavering cancels it. Alternating between the picture and the doubt is what produces nothing at all.",
    l: "Alternating between the plan and the doubt is worse than either, because nothing ever accumulates. Pick one and give it long enough to report back, and let the report be the only thing that changes it." },
  { s: "sogr", x: "karmic", n: "The Plane You Left", b: "What the Shortcut Actually Costs",
    t: "Wattles' warning that the moment you move to taking, you have left the plane on which making was possible, and that everything gained on the other one is insecure by construction.",
    l: "Every shortcut that takes from somebody also removes you from the position where you were building. The loss is not the ethics of it, it is that you can no longer see the other set of moves." },
  { s: "cyb", x: "mindset", n: "You Cannot Outperform the Self-Image", b: "The Ceiling Is Internal",
    t: "Maltz's founding observation from plastic surgery: patients whose faces were corrected often did not change at all, because the picture they held of themselves had not. The self-image governs everything downstream.",
    l: "You have a number in your head for what somebody like you gets, and your performance keeps arriving near it. Raising that ceiling is a different job from working harder underneath it, and only one of the two works." },
  { s: "cyb", x: "mindset", n: "A Goal-Striving Mechanism", b: "Give It a Target",
    t: "Maltz's cybernetic model: the brain works like a guidance system that self-corrects toward a target, but only once a target has actually been set. With none, it has nothing to correct toward.",
    l: "Most people are steering constantly with no destination and calling it being busy. Set one target clearly enough to be wrong about, and the correcting starts happening without you having to manage it." },
  { s: "cyb", x: "mindset", n: "Imagination Is the Same Input", b: "Rehearsal Counts",
    t: "Maltz's claim, later borne out in sports psychology, that the nervous system does not fully distinguish a vividly imagined experience from a real one, which is why mental rehearsal produces measurable improvement.",
    l: "You are rehearsing something every day already, usually the conversation going badly. Spend the same minutes rehearsing it going well, in detail, and the system updates on that exactly the same way." },
  { s: "cyb", x: "internal", n: "The Theatre of the Mind", b: "Thirty Minutes, Vividly",
    t: "Maltz's prescribed exercise: half an hour a day alone, seeing yourself acting as the person you intend to be, in detail, with the feelings included rather than described.",
    l: "It is the same instruction the whole genre gives and Maltz supplies the reason: the input is what the mechanism steers by. Half an hour is the price, and almost nobody pays it because nothing visible happens for weeks." },
  { s: "cyb", x: "internal", n: "Emotional Scars", b: "A Defence That Outlived the Danger",
    t: "Maltz treats emotional scarring the way he treated the physical kind: something that once protected you and now prevents ordinary contact. The guard stays up long after the threat has gone.",
    l: "Whatever you built to protect yourself at nineteen is still running and it is now the thing stopping you. It was correct then. Check whether the situation it was built for still exists." },
  { s: "cyb", x: "internal", n: "Try Softer", b: "Effort Jams the Mechanism",
    t: "Maltz gives a great deal of the book to relaxation, on the model that excessive effort and anxiety interfere with the servo-mechanism's own corrections.",
    l: "Past a point, effort degrades performance rather than improving it, and the feeling of straining is the signal. The correction happens on its own if you stop interfering, which is the hardest instruction here to follow." },
  { s: "cyb", x: "external", n: "Twenty-One Days", b: "Nothing Is Reporting Yet",
    t: "Maltz observed that patients took roughly three weeks to stop seeing the old face in the mirror, and generalised it: a new mental image takes about that long to settle.",
    l: "Whatever you are installing, nothing is decided in the first three weeks and almost everybody quits inside them. Treat that stretch as a cost rather than as a test, because it is not reporting anything yet." },
  { s: "cyb", x: "external", n: "The Failure Mechanism", b: "A Warning Light, Not a Verdict",
    t: "Maltz lists the signature: frustration, aggressiveness, insecurity, loneliness, uncertainty, resentment, emptiness. He treats the set as a system fault rather than as a statement about character.",
    l: "Those feelings are diagnostic rather than descriptive. When several arrive together you are not a worse person that month, you are a system with a bad input, and the input is findable." },
  { s: "cyb", x: "external", n: "It Was the Sentence, Not the Event", b: "How the Image Got Built",
    t: "Maltz is clear that the self-image is built out of interpreted experience, including what people said, and that what got stored was the interpretation rather than the event.",
    l: "The thing shaping you was never what happened, it was the sentence you wrote about it afterwards. That sentence is editable in a way the event is not, and almost nobody goes back to read it." },
  { s: "cyb", x: "karmic", n: "The Loop Makes Its Own Evidence", b: "Self-Confirming by Design",
    t: "Maltz's mechanism is circular on purpose: the image produces the behaviour, the behaviour produces the results, and the results confirm the image. It reinforces in both directions equally well.",
    l: "Your evidence about yourself was generated by the belief it is now supporting. That is why arguing with the evidence never works, and why changing the input at the top is the only place the loop can break." },
  { s: "cyb", x: "karmic", n: "You Are Practising Something Daily", b: "Count the Hours Honestly",
    t: "Because the nervous system does not distinguish the source, the worry you run in full detail trains the same mechanism as the rehearsal you do deliberately, and there is far more of the first.",
    l: "You are practising something every single day. Count the hours honestly and the overwhelming majority went into rehearsing the thing you are afraid of, in high definition, with the feelings included." },
  { s: "cyb", x: "karmic", n: "The Scar Charges Rent", b: "Only You Are Paying It",
    t: "Maltz treats a held injury as an ongoing cost carried by the holder: the emotional scar keeps the wound live and keeps the behaviour it produced in place for decades.",
    l: "Whatever you are still carrying is charging you daily and the other person is not being billed at all. Putting it down is not a favour to them and it is not a moral act. It is a repossession." },
  { s: "bloom", x: "mindset", n: "The Audience Came First", b: "Build the Room Before the Product",
    t: "Mari Llewellyn documented a transformation publicly for years before there was anything to sell, and Greg ran the business side from the start. By the time Bloom launched, the people who would buy it already existed and already trusted her.",
    l: "Most people build the thing and then go looking for who wants it, which is the expensive order. An audience built first is a launch with demand already in it, and it costs nothing but years of showing up before there is any reason to." },
  { s: "bloom", x: "mindset", n: "A Boring Category, Executed Better", b: "You Do Not Need a New Idea",
    t: "Greens powder was not a new product and the shelf was not empty. What was different was how it tasted, how it looked and who was holding it.",
    l: "You do not need an idea nobody has had. You need an existing thing somebody is doing badly and a reason people would switch. The search for originality is usually a way of not starting." },
  { s: "bloom", x: "mindset", n: "Keep It Yours", b: "No Outside Money Until the Terms Are",
    t: "Reported as launched on their own money in the low tens of thousands and run without institutional investment through the growth, which is why the eventual sale happened on their terms.",
    l: "Money taken early is bought at the worst price you will ever get, and it buys somebody else a vote on everything afterwards. If the thing can be started small, start it small." },
  { s: "bloom", x: "internal", n: "She Posted Before It Was Working", b: "The Unflattering Part",
    t: "The following came from documenting the beginning of a transformation rather than the end of one. The early material is the part most people delete.",
    l: "The audience is built during the stretch you are embarrassed by. Nobody follows a finished result, they follow a process they can see themselves inside, and a finished result has no room for anybody." },
  { s: "bloom", x: "internal", n: "Two People, Two Jobs", b: "Knowing Which One Is Yours",
    t: "One built the audience and the brand, the other ran operations and the business. Neither attempted both.",
    l: "Most partnerships fail on the overlap rather than on the gap. Work out precisely which half is yours, say it out loud, and then stop having an opinion about the other one." },
  { s: "bloom", x: "internal", n: "The Flat Stretch", b: "Years Before Anything Moved",
    t: "The audience took years and the business took more. Nothing about the timeline was fast from the inside, and every retelling compresses all of it into a sentence.",
    l: "Every overnight thing you have seen had a flat stretch in front of it that nobody filmed. You are currently in yours and it looks exactly like nothing working." },
  { s: "bloom", x: "external", n: "Seeding Beats Advertising", b: "Get It Into Hands",
    t: "The growth came from putting product in front of creators and letting them use it rather than from buying attention outright, and the platforms did the rest.",
    l: "A recommendation from somebody people already listen to is worth far more than the same money spent shouting. Work out who your buyers already trust and make their life easier." },
  { s: "bloom", x: "external", n: "Retail Is a Different Business", b: "Shelf Space Has Its Own Rules",
    t: "National retail is not a bigger version of selling online. It is different terms, different margins, forecasting and real downside if you are wrong about volume.",
    l: "Every channel you add is a new business with its own physics. Growth usually means learning a second trade rather than doing more of the first one." },
  { s: "bloom", x: "external", n: "A Clean Company Can Be Bought", b: "Structure Decides the Exit",
    t: "A profitable, owner-controlled brand with an uncomplicated ownership structure is a straightforward thing for somebody to acquire. That is structural rather than lucky.",
    l: "How you build decides whether anybody can ever buy it. Every shortcut in the structure \u2014 the unclear ownership, the handshake, the missing paperwork \u2014 becomes a discount or a dealbreaker years later." },
  { s: "bloom", x: "karmic", n: "The Transformation Was Real First", b: "You Cannot Fake the Origin",
    t: "The brand sits on top of something she actually did, with a public record of it, made before there was any commercial reason to make it.",
    l: "What you build on has to be true, because the thing you built will eventually be examined. A story constructed for the launch has nothing underneath it and everybody finds out at once." },
  { s: "bloom", x: "karmic", n: "Everything Posted Is Kept", b: "The Invoice for Building in Public",
    t: "A business built on a public personal history means every early post, opinion and version of yourself is still there and still attached to it.",
    l: "Building in public is the cheapest distribution there is and the invoice is permanence. Say things you will still stand behind, because you are the only person who can decide that now." },
  { s: "bloom", x: "karmic", n: "The People Who Bought First", b: "They Made It and They Remember",
    t: "The early customers came from the free content and are the reason any of it worked. Brands that forget that are found out at exactly the moment they need them again.",
    l: "Whoever showed up before it was obvious is owed something real, and that account stays open for as long as the thing exists. Nothing repays it except continuing to be worth it." },
  { s: "gymsh", x: "mindset", n: "A Sewing Machine and a Screen Printer", b: "Start With What You Can Reach",
    t: "Gymshark began with a screen printer and a sewing machine, bought with money from fitness apps he had built, making clothing at his parents' house in Birmingham while delivering pizzas at night.",
    l: "The first version is made with whatever you can already reach. Nobody is coming to fund the good version, and the good version is not what proves anything anyway." },
  { s: "gymsh", x: "mindset", n: "He Was the Customer", b: "Build for Who You Already Are",
    t: "He was nineteen, he lifted, and he could not find clothing that fit the way he wanted it to. Every early product decision was solving his own problem.",
    l: "The cheapest research available is being the customer. You know what is wrong with the current options without asking anybody, and you can tell immediately whether your fix is real." },
  { s: "gymsh", x: "mindset", n: "He Stepped Back From CEO", b: "When You Are the Constraint",
    t: "He moved out of the top job while the company scaled, worked in other roles inside it, and returned as chief executive in 2021 once that version of the job was one he wanted.",
    l: "Your ego and the company's needs are two different things and they come apart at some size. Being honest about which jobs you are currently bad at is the rarest thing a founder ever does." },
  { s: "gymsh", x: "internal", n: "Delivering Pizzas Until Two", b: "The Overlap Period",
    t: "For a long stretch it was a night job, a degree and a business at the same time. None of that was optional and none of it was glamorous.",
    l: "Almost every version of this starts in an overlap where you are doing two things badly and sleeping less. That period is the price and it does not get a montage." },
  { s: "gymsh", x: "internal", n: "The Black Friday Crash", b: "What You Build in the Six Months After",
    t: "The site went down on the biggest trading day of the year and the business was publicly broken for hours. He has described it as the lowest point and as the thing that forced everything afterwards to be built properly.",
    l: "You will have one public failure that everybody sees. What it costs is decided entirely by what you rebuild in the six months after it, and almost nobody uses those six months." },
  { s: "gymsh", x: "internal", n: "He Never Left the Gym", b: "Distance From the Product",
    t: "The product decisions stayed close to the person using them because he never stopped being one, which is unusual at that size and is deliberate.",
    l: "The day you stop using the thing you make, you start guessing. Distance from the product looks like seniority and it is the beginning of the decline." },
  { s: "gymsh", x: "external", n: "He Sent It to the YouTubers", b: "Before Anybody Called It That",
    t: "In 2012 and 2013 he posted product to fitness creators with audiences, with no commercial arrangements in place. It was not a strategy anybody had a name for yet.",
    l: "The channel that works is the one nobody is competing in, and it is usually the one that looks unserious. By the time it has a name and an agency attached, it has a price." },
  { s: "gymsh", x: "external", n: "BodyPower", b: "One Room, One Weekend",
    t: "The stand at BodyPower in 2013 is the point it became real: the product in front of the exact audience, in person, all at once.",
    l: "One room containing the people you are for is worth months of broadcasting at everybody. Find where they already gather and physically go." },
  { s: "gymsh", x: "external", n: "The Stake Taken at a Billion", b: "Raise From Strength or Not at All",
    t: "General Atlantic took a minority position in 2020 at a billion-pound valuation, after eight years with no outside investment at all. The terms were what they were because the company did not need it.",
    l: "The only good time to take money is when you do not have to. Everything about the price and the control is decided by whether you could walk away, and that is set years earlier." },
  { s: "gymsh", x: "karmic", n: "The Creators Who Took the Free Product", b: "Built With, Not Bought",
    t: "The early athletes came up alongside the brand and several are still associated with it a decade on. The relationship was not transactional at the start because there was nothing to transact with.",
    l: "What you build with people who backed you before it was obvious is a different thing from what you buy later. The first kind lasts and the second kind is renegotiated annually." },
  { s: "gymsh", x: "karmic", n: "Learned in Public", b: "A Very Long Record",
    t: "The mistakes, the crash, the stepping back and the returning all happened where people could see, and he has spoken about most of it since.",
    l: "Building in public means the failures are public too, and that is the cost of the distribution. What it buys is that nobody can ever surprise you with your own history." },
  { s: "gymsh", x: "karmic", n: "He Stayed in Birmingham", b: "Where You Build Compounds",
    t: "The company is still headquartered there rather than in London, which was a decision rather than an accident of inertia.",
    l: "Where you build is a choice with compounding consequences: the cost base, the people you can hire, what the culture becomes. Defaulting to where everybody goes is a decision you did not make." },
  { s: "hormo", x: "mindset", n: "Give It All Away", b: "The Book Costs Less Than the Printing",
    t: "$100M Offers and $100M Leads are priced at effectively nothing and the content is published free at enormous volume. The stated model is that attention is the asset and everything else is downstream of it.",
    l: "What you charge at the entry decides how many people ever get in. If the real money is further down the line, the front of it should cost as close to nothing as you can stand." },
  { s: "hormo", x: "mindset", n: "Volume Negates Luck", b: "You Are Under-Sampled",
    t: "His repeated point is that most people never do enough of the thing for the odds to work: not enough calls, not enough posts, not enough offers made.",
    l: "You are not unlucky, you are under-sampled. Almost every plateau is somebody doing ten of something that needs a thousand, and concluding from the ten that it does not work." },
  { s: "hormo", x: "mindset", n: "Fix the Offer Before the Traffic", b: "The Grand Slam Offer",
    t: "His central commercial argument: the problem is almost never the price or the volume of attention, it is that the offer is ordinary. Stack the value, remove the risk, make it specific.",
    l: "Before you spend anything on getting more attention, check whether what you are offering could convert the attention you already have. It usually cannot, and that is far cheaper to fix." },
  { s: "hormo", x: "internal", n: "He Lost It Twice", b: "Down to Almost Nothing",
    t: "He has been open about periods of being effectively broke and in debt, after the gyms and again later, and about what those stretches did to him.",
    l: "You will be wrong in a way that costs everything at least once. Knowing that in advance changes what you put at risk and how quickly you get back up, and almost nobody plans for it." },
  { s: "hormo", x: "internal", n: "He Married the Operator", b: "Give Away the Half You Avoid",
    t: "He and Leila run it as two distinct functions: he is public-facing and offer-focused, she runs operations. He has said the company would not work with two of him in it.",
    l: "Most founders try to be both halves and are quietly terrible at one of them. Find the person who is good at the part you avoid, and then actually hand it over." },
  { s: "hormo", x: "internal", n: "He Publishes Every Day", b: "Repetition Is the Mechanism",
    t: "The output is constant and mostly unglamorous: the same ideas, restated, across every format, for years without a gap.",
    l: "Almost nobody is beaten on ideas. They are beaten on the number of times they said it. Repetition feels like a failure of imagination and it is the whole of what works." },
  { s: "hormo", x: "external", n: "Sell to People Who Already Have a Business", b: "Pick a Buyer Who Can Pay",
    t: "Gym Launch sold to gym owners: people with revenue, a problem they could name, and an immediate reason to pay for a fix. Not to consumers.",
    l: "Who you sell to matters more than what you sell. A customer with money and an urgent expensive problem makes an ordinary product viable, and the reverse kills a good one." },
  { s: "hormo", x: "external", n: "Own the Thing That Owns the Things", b: "There Is a Level Above Operating",
    t: "The structure moved from running businesses to holding them: a portfolio, with the operating work done by the companies rather than by him.",
    l: "There is a level above running the thing and it is available earlier than people take it. Ask what you would have to build so that your own time stops being the input." },
  { s: "hormo", x: "external", n: "He Sold the Majority and Kept Working", b: "An Exit Is Not an Ending",
    t: "Reported as selling around two thirds of Gym Launch and Prestige Labs in 2021, and then immediately building the next structure rather than stopping.",
    l: "An exit is a liquidity event, not a finish line, and people who treat it as one spend the following year discovering there is nothing on the other side of it." },
  { s: "hormo", x: "karmic", n: "The Free Content Is Why Anybody Calls", b: "Placed, Not Lost",
    t: "Years of free material produced the audience that makes every subsequent business easier to start, and none of it paid anything at the time.",
    l: "What you give away is placed rather than lost, and the return arrives as people already knowing who you are at the moment you need them to. That cannot be bought later at any price." },
  { s: "hormo", x: "karmic", n: "He Says What He Said When He Was Broke", b: "Consistency Is Checkable",
    t: "The material from the early years and the material now make the same arguments, which is unusual and is most of why anybody takes it seriously.",
    l: "Everything you say is kept and will be compared against everything else you said. The only sustainable position is one you would still hold if it stopped being profitable." },
  { s: "hormo", x: "karmic", n: "What the Gyms Cost Him", b: "The Tuition Was Paid in Advance",
    t: "The failed and nearly-failed years are where the offer knowledge came from. None of it was theoretical and every part of it was paid for.",
    l: "The expensive years are the only ones that produce something you can sell later. That does not make them pleasant and it does mean they were not wasted." },
  { s: "spanx", x: "mindset", n: "What Did You Fail At This Week", b: "Failure as the Metric",
    t: "Her father asked it at dinner every week and was disappointed when the answer was nothing. She has said it removed the fear of trying things that turn out not to work.",
    l: "If nothing you tried this week failed, you attempted nothing with a real chance of not working. Track the attempts rather than the outcomes, because only one of those is under your control." },
  { s: "spanx", x: "mindset", n: "She Told Nobody for a Year", b: "Protect It While It Is Fragile",
    t: "She kept Spanx secret for about a year, including from friends and family, because she did not want the idea talked out of her before it existed.",
    l: "Early ideas are fragile and other people's opinions arrive long before the thing can defend itself. Tell nobody until it is real enough to survive the conversation." },
  { s: "spanx", x: "mindset", n: "She Wrote the Patent Herself", b: "Find Out What It Actually Involves",
    t: "Quoted around three thousand dollars by attorneys against savings of five thousand, she bought a textbook and wrote it herself, paying a lawyer only for the claims.",
    l: "A great deal of what gets outsourced at the start could be learned in a fortnight. Find out what the expensive thing actually involves before you pay somebody to do it badly." },
  { s: "spanx", x: "internal", n: "Seven Years of Fax Machines", b: "Which Skill Is It Teaching",
    t: "She sold office equipment door to door for seven years and was regularly thrown out of buildings. Everything about how Spanx was eventually sold came out of that stretch.",
    l: "An unglamorous run of work that teaches one transferable skill is not a wasted run. The question is which skill, and if the honest answer is none, that is the problem." },
  { s: "spanx", x: "internal", n: "She Cut the Feet Off", b: "Be the Prototype",
    t: "The first product was a pair of her own hosiery with the feet cut off, worn under white trousers to a party. The problem was hers and she solved it for herself first.",
    l: "The best starting point is a problem you personally have, because you can test the fix on yourself tonight and you will know immediately whether it worked." },
  { s: "spanx", x: "internal", n: "Every Mill Said No", b: "Until One Man Asked His Daughters",
    t: "She cold-called hosiery mills in North Carolina and was turned down repeatedly. One owner called back after his daughters tried the idea and liked it.",
    l: "Almost nothing changes about the pitch between the twentieth refusal and the yes. What changed is that you were still asking, and the person had a reason you could never have predicted." },
  { s: "spanx", x: "external", n: "She Walked It Into Neiman Marcus", b: "Go to the One Buyer",
    t: "She got a meeting with a buyer, changed in the bathroom to demonstrate the difference in person, and came out with seven stores.",
    l: "The meeting that matters is almost always with one specific person and is almost always gettable. A demonstration they can see beats a document they will skim." },
  { s: "spanx", x: "external", n: "Oprah", b: "You Cannot Make the Break, Only Deserve It",
    t: "Being named a favourite thing in 2000 changed the scale of the business overnight. It happened because the product was genuinely good and somebody found it.",
    l: "You cannot manufacture the break, but you can make certain the thing is worth breaking. Almost everybody optimises for being found rather than for being worth finding." },
  { s: "spanx", x: "external", n: "No Advertising, No Investors", b: "She Owned All of It",
    t: "Spanx grew for years with no advertising spend and no outside investment, which is why she still owned one hundred per cent when the Blackstone deal happened.",
    l: "What you own at the end was decided by what you gave up at the start. Every round and every bought customer is a claim on the thing, and the alternative is slower and entirely yours." },
  { s: "spanx", x: "karmic", n: "Ten Thousand Each", b: "What the Exit Was For",
    t: "On the sale she gave every employee ten thousand dollars and two first-class tickets to anywhere in the world.",
    l: "What you do at the moment you finally have it is the truest statement you will ever make about the whole thing. Everybody who was there remembers, and so do you." },
  { s: "spanx", x: "karmic", n: "She Gave Before It Was Comfortable", b: "The Timing Is the Test",
    t: "She started the Sara Blakely Foundation in 2006 and signed the Giving Pledge in 2013, committing at least half of her wealth away. All of it began years before there was an exit to give out of.",
    l: "Generosity that begins when it is easy is a different thing from generosity that begins when it costs. Only one of them changes you and it is the earlier one." },
  { s: "spanx", x: "karmic", n: "Seven Years of Deposits", b: "Nothing Came Back at the Time",
    t: "The fax years, the rejected mills, the year of silence: none of it produced anything while it was happening and all of it is why the rest worked.",
    l: "You are depositing during the period when nothing is coming back. That is not a metaphor about patience, it is a description of the mechanism and of why almost nobody reaches the payout." },
  { s: "mchmp", x: "mindset", n: "Twenty Years of Saying No", b: "To Every Investor Who Asked",
    t: "They were approached repeatedly across two decades and refused every time, then sold to Intuit in 2021 in what was reported as the largest acquisition of a bootstrapped company ever.",
    l: "The compounding on ownership is invisible until the end and then it is the entire thing. Every point you keep is worth more the longer it runs, which is exactly backwards to how it feels early." },
  { s: "mchmp", x: "mindset", n: "It Was a Side Project", b: "Nobody Started a Company",
    t: "Mailchimp ran alongside a web design agency and was not the main business. It became the main business because it kept growing while the other thing paid for the years.",
    l: "You do not have to quit in order to start. The thing that works is often the side project that will not go away, and the job is what buys it the time it needs." },
  { s: "mchmp", x: "mindset", n: "Serve the Customer Nobody Wants", b: "The Market Everyone Skipped",
    t: "They aimed at very small businesses, the customers the enterprise companies had no interest in, and built something that did not require anybody to be technical.",
    l: "The market everybody ignores for being too small is where you get to learn in peace. It also grows, and the people you helped when they were nobody do not forget it." },
  { s: "mchmp", x: "internal", n: "They Were Not Trying to Be Big", b: "Growth Was Not the Aim",
    t: "The stated posture for years was to build something good and sustainable rather than to chase scale. The scale arrived as a consequence of that rather than as the target.",
    l: "Chasing growth directly changes every decision underneath it and most of those changes are bad. Making the thing genuinely good is slower and is the only version you never have to defend." },
  { s: "mchmp", x: "internal", n: "A Salon and a Small Business", b: "Where the Model Came From",
    t: "He has talked about his mother's hair salon as the origin of how he thinks about small business: the customer is a person you actually see.",
    l: "What you watched work before you knew anything is a model you are still running. Go and find out which one it is, because it explains more of your decisions than any framework does." },
  { s: "mchmp", x: "internal", n: "Freemium Was a Real Risk", b: "It Looked Like a Mistake for a Year",
    t: "Introducing a free tier in 2009 meant giving up immediate revenue on a bet that volume would follow. Users went from around eighty-five thousand to roughly four hundred and fifty thousand in a year.",
    l: "The decision that changes the trajectory usually looks like giving something away and feels wrong for about a year. It is only obvious afterwards, which is exactly why it was still available." },
  { s: "mchmp", x: "external", n: "Free at the Front", b: "Volume Over Margin",
    t: "Free at the bottom, paid as you grow, and a business built on the fact that a great many small customers eventually become medium ones.",
    l: "Where you set the entry price decides the entire shape of the business. Free at the front is not generosity, it is a decision to be paid later by a far larger number of people." },
  { s: "mchmp", x: "external", n: "Serial", b: "One Sponsorship, Years of Brand",
    t: "The podcast sponsorship in 2014, and the mispronounced name that came with it, put Mailchimp in front of an enormous audience with no prior reason to know it existed.",
    l: "One correctly chosen place, early, before the price has risen, beats a large budget spread thinly everywhere. A channel is cheap precisely while nobody has proved it works." },
  { s: "mchmp", x: "external", n: "Atlanta, Not San Francisco", b: "Outside the Machine",
    t: "They built it away from the venture ecosystem, which is a large part of why refusing money stayed easy for twenty years.",
    l: "Your environment sets the default assumptions about how a thing is supposed to be done. Being outside it costs you the network and buys you the ability to ignore the consensus." },
  { s: "mchmp", x: "karmic", n: "Twenty Years Is the Whole Story", b: "There Is No Shortcut Inside It",
    t: "There is no single moment in the Mailchimp story that explains it. It is two decades of compounding with no outside money accelerating anything at any point.",
    l: "The thing that looks like a twelve billion dollar event was a twenty year process with almost nothing dramatic in it. Stories compress time and you are living in the uncompressed version." },
  { s: "mchmp", x: "karmic", n: "Nobody Had Equity", b: "What Bootstrapping Cost the Staff",
    t: "Because there had never been funding rounds there were never option pools, so employees held no stake when the sale happened. Reporting described bonuses, and also described staff who felt they had not shared in it.",
    l: "Owning all of it means nobody else is owed anything, and that is structural rather than moral until the day somebody decides. Choose early and deliberately what the people building it with you get." },
  { s: "mchmp", x: "karmic", n: "The Small Businesses Built It", b: "Slowly, Then Uncatchably",
    t: "The base was assembled out of people running tiny operations over twenty years, and that base is what the valuation was measured against.",
    l: "Serving people nobody else wants to serve is slow and it accumulates into something that cannot be taken. The advantage is that your competitors will not want it until far too late." },
  { s: "sigs", x: "mindset", n: "Profitable From the First Customer", b: "Charge Money for the Thing",
