    { n: 'The Answer You Are Carrying', f: 'inner', d: 'The man on the stairwell was not further ahead. He could set it down, and that does not arrive in the account.' }
  ],
  rule: 'Stop and count what you already have. Some of it is what you are still chasing.',
  q:'What do you already have that you are still trying to get?',
  teach:'A poor man is given a diamond by a sadhu asleep under a tree, keeps it three days, and comes back to ask for something else.',
  body:[
    "The number he had wanted for four years came through on a Wednesday.",
    "It was not a fortune and he had never pretended it would be. It was the number he had written on a piece of paper when he started, the one that meant the thing was real, and it landed at about two in the afternoon while he was doing something else entirely.",
    "He looked at it for a while.",
    "Then he went and made a cup of tea and came back and looked at it again.",
    "He had imagined this a great many times over four years, and in none of the versions had he sat in a quiet room by himself feeling mildly sick.",
    "He did not sleep well that night, or the next one.",
    "The problem was that he could not stop checking it. Not the account, the position. He had it on his phone and he looked at it in bed and in the morning and at traffic lights, and by the Friday he had worked out that he was checking to see whether it was still there, which is not a thing that had ever occurred to him to worry about when he did not have it.",
    "On the Saturday somebody asked how it was going and he said fine, and changed the subject, and thought about that afterwards for a long time.",
    "He had spent four years wanting to be asked that question.",
    "What happened over that week is very simple and almost nobody warns you about it. He had got the thing. And the thing had arrived with a second thing attached that he had not asked for and had not been told about, which was the fear of it going, and the second one weighed more.",
    "He had been rich for six days and he had not spent one hour of it doing anything. He had not built. He had not taken the next position. He had sat in a room checking a number and being unable to talk about it.",
    "And somewhere in there he thought about a man he had met years before at the start of all this, who had many times more than that number and had said something about it in passing on a stairwell and then gone and got a coffee.",
    "In passing. On a stairwell. And then gone for a coffee.",
    "He had thought at the time that this was modesty, or a flex, or that the man was so far ahead the number was nothing to him.",
    "It was not that. He understood it that Saturday and it took him the rest of the year to do anything about it.",
    "The man could set it down. That was all. He was not gripping it, and because he was not gripping it, he could mention it on a stairwell and walk away and think about something else for the rest of the afternoon.",
    "That is the thing worth having and it does not arrive in the account.",
    "He is past that number now by some way. He still checks more than he should. But he noticed something in the spring: he had gone a whole Tuesday without looking, and had not decided to, and had not noticed until he was in bed.",
    "That was a better day than the Wednesday was."
  ] },
{ id:'five', stage:'The Reward', bg:'violet', mins:2,
  n: 'The Photo',
  ab: 'The mirror was never what needed to change', src:'Ours',
  laws: [
    { n: 'The Measuring Does Not Stop', f: 'inner', d: 'A different body, three years later, and the same arithmetic on the same train with the same face on.' },
    { n: 'The Price Was the Purchase', f: 'motion', d: 'He had it booked as what the body cost. It was the only thing that came with him into a room.' },
    { n: 'The Quiet Middle', f: 'time', d: 'Forty minutes at twenty to six, for a year, without enjoying one of them, and nobody watching.' }
  ],
  rule: 'You keep the habit of turning up long after the reason you started stops mattering.',
  q:'If you got the thing tomorrow, what would still be there?',
  teach:'Every study that sets one training programme against another finds the same thing, and nobody quotes it: the variable that predicts the outcome is not which programme, it is whether you did it. The programme is the half people argue about and it is the half that does not decide anything.',
  body:[
    'Somebody tagged him in a photo.',
    'He was at the back of it, not doing anything in particular, and he looked at it far longer than anybody looks at a photo of a night out, and then he put the phone face down on the bed.',
    'He started training that week. The only hour nobody needed him, the same forty minutes, and he will tell you before you ask that he did not enjoy one of them for the best part of a year.',
    'He got what he came for, and he does not do the modest thing about it. The body changed. People who had not seen him in a while said so, and they were not being kind, they were surprised.',
    'Then somebody tagged him in another one.',
    'He opened it on the bus and there he was at the edge of it, and he looked at it exactly the way he had looked at the first one.',
    'He is careful about this part, because it is the part people want to soften for him. It was not that he looked bad. He did not look bad. It was that he sat on a bus running the same arithmetic he had run years earlier, about a completely different body, with the same face on.',
    'The arithmetic had never been about the body.',
    'What he wanted, if you made him say it, was to open his phone and not be counting. He had gone and bought the wrong thing for that. You cannot buy it at all, as far as he can tell, and if you could it would not be sold in a gym.',
    'So that is the failure, it is real, and he does not pretend otherwise.',
    'Here is the rest of it.',
    'Somewhere in the second year he stopped negotiating with the alarm. There was no decision and no morning it happened. It went and he got up, on the mornings he wanted to and the mornings he did not, and whether he wanted to quietly stopped being one of the inputs.',
    'He found out what that was worth doing something else entirely.',
    'There was a conversation he had been avoiding for the best part of two years. The kind you rehearse walking and then do not have. He had a free afternoon and he had it. Not bravely, and not well. He had it the way he gets up, which is without asking himself first.',
    'That is the part that came with him. None of the rest did. The body stays in the gym and does not walk into rooms, whatever anybody tells you.',
    'He thought the training was what the body cost.',
    'It was the other way round.'
  ] },
{ id:'bridge', stage:'The Road Back', bg:'cobalt', mins:1,
  n: 'One Foot In',
  ab: 'What keeping the other option quietly costs', src: 'Power',
  laws: [
    { n: 'The Open Door', f: 'motion', d: 'He never used the two days once. They took a little off the top of every Tuesday for six years.' },
    { n: 'Two Ends of One Thing', f: 'time', d: 'The one with nothing behind him was frightened for a year and got the thing the careful one never did.' },
    { n: 'The Handle', f: 'motion', d: 'It costs nothing visible on any particular Tuesday, which is exactly why it is never the week to deal with it.' }
  ],
  rule: 'The way out is not free. It quietly removes the pressure that was going to make the thing work.',
  q: 'What are you keeping open in case this does not work?',
  teach: 'Power. The whole run is a man with a legitimate business he is good at and an exit he never takes, and the show is patient about the fact that every single reason for not closing it is a reasonable one.',
  body:[
    'He wants out and he never fully goes.',
    'James has the club. It is real, it is legitimate, it is the thing he says he wants, and he is genuinely good at it — the rooms, the money, the way he is in them. He tells everybody, including himself, that the street is the past and the club is the future.',
    'And he never closes the door.',
    'There is always a reason not to and every reason is a good one. He owes people. Tommy needs him. There is one more thing to sort out, then it is done. The distribution keeps running because ending it properly is harder than letting it run, and letting it run costs nothing this week.',
    'What it actually costs is the thing he says he is building.',
    'Every time the club needs him fully, he is not fully there, because the other life has a claim on the same hours and the same head. He is never all the way in on the legitimate thing, and the legitimate thing is the one that needed all of him to work.',
    'And it is worse than a split of time.',
    'The other life is also his insurance. Whenever the club is struggling, there is a version of him that has never stopped being able to make money the old way — so the club never has to work. A business that does not have to work does not get the last ten per cent out of anybody, including the man who owns it.',
    'By the time he is forced to choose, the choice has been made for him several times over.',
    'Everybody around him pays for it. Tommy, Angela, Tasha, all of them are in a situation that only exists because one man would not close one door.',
    'He is not weak and he is not stupid.',
    'He simply believed that keeping the option open was free.'
  ] },
{ id:'free', stage:'The Road Back', bg:'nightfall', mins:1,
  n: 'The Rogue Prince', ab: 'Unbound, and with authority over nothing', src: 'House of the Dragon',
  laws: [
    { n: 'The Word You Reached For', f: 'inner', d: 'He wanted autonomy and went and bought the maximum possible amount of freedom, which is the opposite of it.' },
    { n: 'Freedom Is Not Autonomy', f: 'motion', d: 'No boss, no hours, no obligations — and he could not refuse a single thing that came in.' },
    { n: 'Leverage Is What Buys the No', f: 'others', d: 'He had no position and no scarce skill, so his whole day belonged to whoever was paying that week.' }
  ],
  rule: 'Answering to nobody is not the same as deciding anything. The second one has to be bought, usually with the first.',
  q: 'What are you refusing to be under, that is costing you the room?',
  teach: 'House of the Dragon. Daemon is handed a position roughly once a season and loses it the same way every time, and the Harrenhal sequence is the show finally naming what the something is.',
  body:[
    'He is the most dangerous man in the realm and he keeps losing.',
    'Daemon can fight better than anybody in the story. He takes the Stepstones when the Crown will not. He commands a dragon, he commands the City Watch, he commands men who would follow him anywhere — and he spends years with no actual power at all, because every time he is given a position he does something that costs him it.',
    'Named heir, then unnamed. Made Commander, then removed. Sent away, brought back, sent away again.',
    'It is never ability. It is that he cannot be under anybody.',
    'Viserys offers him things repeatedly, and every offer comes with the one condition Daemon cannot meet, which is that his brother is the King and he is not. So he takes the freedom instead: he goes where he likes, he says what he likes, and he answers to no one, and the cost is that he is never in the room where anything is decided.',
    'He has as much freedom as a man in that world can have.',
    'He has no authority whatsoever.',
    'The turn, when it finally comes, is not a battle. It is Harrenhal, alone, weeks of it, being shown versions of himself he has spent his life refusing to look at — and coming out of it and doing the one thing he has never done, which is kneel to Rhaenyra and mean it.',
    'He does not become weaker. That is the part worth sitting with.',
    'The moment he takes a position under somebody is the moment his ability starts converting into anything. Before that he was a man with a dragon and a grievance. After it he is a commander with an army and a war to run, and the armies come because there is finally something to join.',
    'Freedom was what he had for twenty years.',
    'It bought him nothing, and he had to give it up to get anything at all.'
  ] },
{ id:'mountain', stage:'The Return', bg:'turtle', mins:2,
  n: 'No Day It Clicks',
  ab: 'You only notice months after it happened', src:'Ours',
  laws: [
    { n: 'The Quiet Middle', f: 'time', d: 'Day six hundred and seventeen was indistinguishable from the four hundred before it.' },
    { n: 'The Spent Feeling', f: 'inner', d: 'Every time he announced it he drew down the feeling he was supposed to get from finishing.' },
    { n: 'The Day Nobody Announced', f: 'time', d: 'There was no morning where he woke up and noticed he had won the fight.' }
  ],
  rule: 'There is no day it clicks. You look up one morning and it has been working for months.',
  q:'What have you been doing long enough that you cannot remember starting?',
  teach:'An old man sets out to move two mountains with baskets, and tells the neighbour who laughs at him that the mountain does not get any bigger.',
  body:[
    "The alarm went at twenty to five and it was raining, which in November means it will be raining at seven as well.",
    "Day six hundred and seventeen.",
    "He knew the number because it was in a spreadsheet, and the spreadsheet was the only part of it anybody could have pointed at. Getting up before work and doing ninety minutes on the thing, then eight hours of something else, then some evenings another hour and some evenings not.",
    "In all that time it had made no money at all.",
    "That is the honest statement and he had stopped softening it. Not a small amount. None. There had been a month where it looked like it was about to and then it did not, and he had told two people about that month and had to tell them afterwards as well, which is its own particular flavour of Tuesday.",
    "He had stopped telling people some time in the first year.",
    "He put that down to modesty at the time and it was not modesty. He worked it out much later. Every time he announced it, he got a small amount of the feeling he was supposed to get from finishing it, and it came out of the same account, and he was spending the thing before he had earned it.",
    "So he stopped saying anything, and it got harder, and it got better.",
    "He got up on day six hundred and seventeen.",
    "There is nothing to tell about that morning and that is exactly why it is the one worth telling. He made coffee. He worked on a section he had already done twice, because the second attempt was wrong. It went slowly. At quarter past six he was no further on than he had been at five, and he had a real conversation with himself about whether the whole thing was a way of avoiding his actual life, which was a conversation he had about once a fortnight and which always ended in the same unsatisfying draw.",
    "At ten past seven he got in the car.",
    "Nothing happened. That is the entire content of day six hundred and seventeen and of about four hundred of the others.",
    "Months later somebody new asked him about it, because it had come up.",
    "How long have you been doing that, then.",
    "And he opened his mouth to answer, and found he could not do the arithmetic instantly and had to count back, and in the two seconds that took he noticed something.",
    "He could not remember what it had been like before.",
    "Not the effort. He remembered that. He could not get back inside the version of himself who had to decide, every morning, whether to get up. That man had existed for about four months and had been in a fight every single day, and at some point the fight had simply stopped happening and nobody had told him.",
    "There had been no morning where he woke up and noticed he had won it.",
    "It still was not making any money. That took another nine months, and when it came it was not dramatic either.",
    "But he had become a person who got up at twenty to five, and it had happened without an announcement, on an ordinary day somewhere in the middle, and he had not been invited."
  ] },
{ id:'slow', stage:'The Return', bg:'canyon', mins:1,
  n: 'The Gardener', ab: 'The attribute nobody thought was one', src: 'The Lord of the Rings',
  laws: [
    { n: 'The Talent Nobody Sells', f: 'inner', d: 'No course covers it, he did not develop it, and he was issued with it in a place he would not have chosen.' },

  rule: 'The attribute that decides it is usually one nobody would have listed, including you.',
  q: 'What are you good at that has never looked like a skill?',
  teach: 'The Lord of the Rings, across all three. Every character with a gift is consumed in proportion to it, and the one with nothing is the one still standing on the mountain.',
  body:[
    'There is nothing exceptional about him and that is the point of him.',
    'Sam is not clever. He is not a warrior. He is not of any line and he has no destiny attached, and he is in the Fellowship because he was caught listening at a window. Everybody else there has something: a sword, a bow, an axe, a wizard, a king. He has an opinion about potatoes.',

    'Boromir breaks, which is the strongest man there. Frodo is unmade slowly and completely by the thing he is carrying. Gollum, who carried it for centuries, is a ruin. Gandalf falls. Everybody with a gift is used up by the road in a way proportionate to what they had.',

/* Each law in one line. A tag that opens nothing is a tag that reads
   as a category somebody forgot to wire up, and the whole point of
   naming the laws is that a story carries several and you can follow
   any of them sideways into the others that carry it. */
var LAWS = {
  'The Answer You Are Carrying': 'The thing you are looking for is very often already in your possession — written down, said to you, sitting under your feet. Finding it was never the difficulty. Being able to hear it is, and that is usually bought rather than given.',
  'The Lit Ground': 'You search where searching is comfortable rather than where the thing actually is. The lit ground is not where you dropped it. It is simply the only place you can see, and effort spent there looks identical from outside to effort that would work.',
  'The Full Cup': 'Nothing new enters a container that is already occupied. You are not being refused the answer; there is nowhere in you for it to go, and the thing filling the space is usually something you are right about.',
  'The Cost of Being Right': 'Every answer you argue with is protecting a decision you have already made. The price of hearing it is admitting what it makes of the last two years, which is why people go looking for help and come home having defended themselves.',
  'The Early Verdict': 'Every event arrives as half a sentence and you read it out as the whole one. A verdict delivered early is not a description of what happened — it is the first move of what happens next.',
  'The Long Carry': 'The event has a duration and it ends. The carrying is a second thing, which you are doing, and it runs at full strength for as long as you keep feeding it. Nothing external is required after the first four seconds.',
  'The Sentence That Arrives Ready': 'The tell that you are still carrying something is that it comes out fully formed, hours or years late, with no introduction, as though the conversation were still running. It is not still running. Nobody else is in it.',
  'The Spent Feeling': 'Announcing a thing pays you a small amount of the feeling you were supposed to get from finishing it, out of the same account. Tell enough people and you can draw the whole balance without ever doing the work.',
  'The Walk': 'Understanding a thing and acting on it are two separate acquisitions. Almost everybody completes the first, calls it done, and is genuinely surprised years later to find nothing moved.',
  'The Wheel': 'Either your outcomes come out of your own hands or they come out of the weather. Both are beliefs and only one of them leaves you anything to do tomorrow, which is why the honest account of a bad year arrives as relief rather than shame.',
  'The Toll': 'Everything is paid for, and rarely in the currency you offered. The bill comes from an account you did not know was open, and the fare is never the thing you were holding out.',
  'What Only Made Sense Back There': 'A threshold charges you the thing that was only ever valuable on the side you are leaving. That is not cruelty. If it made sense on both banks it would not be a threshold, it would be a road.',
  'The Handle': 'A problem you caused is a problem with a handle on it. Fault is not a moral verdict here; it is the difference between a situation you can reach and one you can only wait out.',
  'The Open Door': 'A way back is almost never used. It takes a little pressure out of every hard thing instead, continuously and invisibly, and the pressure was what was going to finish the work.',
  'The Stranger’s Mouth': 'The answer very often arrives from somebody who is not trying to help you, does not know they have given it, and will not remember saying it. People close to you have usually said the same thing and been unable to make it land.',
  'The Sideways Look': 'Every position has something above it that was invisible from the one below. Whoever moves because of what they can see from where they stand will move for ever, and will never find out what they had.',
  'The Borrowed Engine': 'Running on somebody else’s doubt works, and it means somebody else is steering. The only question that engine can ask is what would prove them wrong, and that is a different question from what you actually want.',
  'The River Does Not Wait': 'Conditions are never right, because right is not a state conditions are in. The thing goes past at its own rate whether or not you are ready, and it has been going past the whole time you were preparing.',
  'Two Ends of One Thing': 'A disaster and a making are frequently the same event measured from different distances. You never get to stand far enough back to be certain, and there is always another year after this one.',
  'Nothing Has a Size of Its Own': 'A number is only ever large or small against whatever you have put beside it, and you choose what you put beside it far more often than you notice.',
  'The Number That Moves': 'Readiness recedes as you approach it, because the thing you are waiting for was never a number. Every threshold you set will be more sensible than the last one, and you will never arrive.',
  'The Second Thing': 'What you wanted arrives with something attached that you did not ask for and were not warned about. It is usually the fear of it leaving, and it usually weighs more than the thing.',
  'The Quiet Middle': 'The work that decides it has no screen, no course, nobody to tell and no way to get better except by being in it. It pays nothing for a long time and there is no way to make it interesting.',
  'The Judge You Installed': 'Show the work to enough people and one of them takes up residence. It arrives with standards you never agreed to, it has no interest in the boring majority of what you do, and you will be working to please it for months before you notice it moved in.',
  'The Unwritten Half': 'Every record is a record of what you did. The things you did not do leave no line, pass every audit, and are frequently the whole of what went wrong — which is why a clean book above a falling result is not a contradiction.',
  'The Prize Goes to the Exception': 'What people respond to is almost never the thing that produced your year. It is the one week that did not look like the rest, and going after the applause means going after your own outlier, which is the single result you have no method for.',
  'The Price Was the Purchase': 'You name the thing you want and book everything it costs as the price. Very often the costs are the acquisition and the named thing is a souvenir — the patience, the tolerance for a boring morning, the not negotiating, all filed as expense for years while they were the only part that transferred.',
  'The Measuring Does Not Stop': 'You think a number will end the counting. It will not, because the counting is a habit and not a verdict: arrive at the figure and you find yourself standing in the same place doing the same arithmetic about a different figure, with the same face on.',
  'The Narrow Gift': 'The capacity to stay on one thing long past the point where it is interesting to anybody else. It gets called one-dimensional and it is trained out of most people by about fourteen, and it is the single attribute that separates the ones who get good.',
  'What Got Rewarded': 'You did not choose most of what you are like. You repeated whatever got a reaction and stopped whatever got a look, and by the time you were old enough to examine it, it had been your personality for twenty years.',
  'A Picture Is Not a Rehearsal': 'You can hold a completely accurate image of the person you intend to become and never once do a thing that person does. The picture costs nothing, which is exactly what makes it so easy to keep having instead.',
  'Mostly It Is Not Doing Things': 'The version of you one level up is not doing a great deal more than you are. They are doing considerably less, and the hours that frees up is most of the difference between you.',
  'The State Wrote It': 'You believe the conclusion came out of the thinking. Put the same facts to yourself on two different days and you get two answers, both fully argued and both certain, and the only thing that moved was what sort of day you were having.',
  'Nothing Records the Weather': 'Every record you keep holds what you decided and not what state you were in when you decided it. The missing half is the half that chose, which is why reading your own notes back teaches you so much less than it should.',
  'Freedom Is Not Autonomy': 'Freedom is measured in what you do not have to do. Autonomy is measured in what you get to decide. They sound like one thing and they run in opposite directions — somebody with nothing has a great deal of the first and none of the second.',
  'Leverage Is What Buys the No': 'Refusing work, setting a price and naming the day are not personality traits. They are bought, and the currency is something scarce that other people need. Until you hold that, every hour you own belongs to whoever is paying.',
  'The Word You Reached For': 'You will chase the wrong thing for years because you took the nearest word for it. Freedom, success, respect — each of those is a word standing in front of something more specific, and the specific one is the only version with a method attached.',
  'The Talent Nobody Sells': 'The attribute that decides it is usually one no course covers, because a field advertises what it can teach you and this is not that. You did not develop it. You were issued with it somewhere you would not have chosen, and the only move available is to notice.',
  'The Sunday Version Has the Vote': 'The you who writes the rule is calm and has nothing at stake. The you who breaks it is neither. Settling in advance which of them is in charge is most of what discipline actually is, and it is a decision rather than a strength.',
  'The Version You Can Always Do': 'Every plan is written for a good week. The one that decides your year is the one you can still run on the worst day of the month, and it is almost never the one you designed.',
  'Starting Again Is the Cost': 'The session you miss costs very little. What costs is the fortnight after it, when you are no longer somebody who does this and have to become one again from nothing.',
  'Too Small To Bother With': 'The reason you did nothing is that the only version available was beneath the standard you hold yourself to. That standard is not discipline. It is the most reliable method there is for doing nothing at all.',
  'Aimed, Not Removed': 'The trait you have been trying to get rid of since you were twenty is not going anywhere. Its destructive shape and its useful one run on the same machinery, so the work was never removal. It is deciding what it points at.',
  'What They Called It': 'The word other people put on a trait of yours was a report on how it affected them, never a description of the thing. Difficult, intense, obsessive, blunt — each of those tells you what it cost somebody, and none of them tells you what it is for.',
  'The Convenient Reason': 'The explanation that is true and also happens to be the one you wanted is the hardest thing there is to examine from the inside, because the examining is being done by the person it benefits. Thinking about it more carefully will not settle it. Nothing you can do at your desk will.',
  'What The Months Say': 'A decision you cannot verify at the time gets verified by what you do with the room it made. The reason was real if the work happens and it was a cover story if it does not, and you find out inside about six weeks whichever way it goes.',
  'Nothing To Point At': 'A thing that hurts you announces itself and gets dealt with. A thing that softens you never does. It arrives as rest, some of it genuinely is rest, and that is exactly what lets it take the same forty minutes off the end of every day for a year without once being named.',
  'You Cannot Negotiate With A Room': 'A rule is something you have to hold up. The room holds itself up, all day, at no cost to itself, and it will outlast any arrangement you make with yourself about it. Change the room or expect the fortnight.',
  'What Is Left Standing': 'Take away nine things and the tenth gets the verdict whether or not it earned it. Elimination is a real method with one failure it cannot see from inside: it never finds the cause, it finds the survivor, and somebody who has removed most of their life has arranged the answer in advance.',
  'The Test Runs Both Ways': 'Remove it and the problem goes, and you were right. Remove it and the problem stays, and you are standing in a very quiet room with nothing left to take out and only yourself to look at. The decision is only honest if you have genuinely thought about the second one.',
  'A Leap Is Seen From Outside': 'The jump is real and it is a description of the outside. From inside it there is no jump at all — two or three hundred days, most of them identical, and the only thing that made it a leap is that nothing interrupted them.',
  'The Picture Makes Tuesday Feel Like Failure': 'Hold a big enough image of where you are going and an ordinary day starts reading as evidence that it is not happening. That gap is uncomfortable, and what people do about it is change the plan — which is the thing that actually costs the year.',
  'Sacrifice Now Or Sacrifice It': 'What you want has a price and the bill does not go away when you decline it. Refuse the cost and the thing itself becomes the thing you gave up. You paid either way, and only one of the two came with it attached.',
  'The Day Nobody Announced': 'The morning it changed was indistinguishable from the four hundred before it. You will not feel it arrive. You will notice, much later and by accident, that it is already behind you.'
};

/* THE NOTE THAT USED TO SIT HERE WAS RIGHT ABOUT VIOLET AND WRONG
   ABOUT WHY, and the reason is the crop. It measured "40% of the frame
   under L8" in a 390x844 phone crop — which no story photograph is ever
   drawn in. The welcome hero is the only full-screen one and it is
   hardcoded to desert; a story's image is a 322x300 card inset and a
   354x188 open hero, both read off the live page. At the card crop
   violet is 37.6% under L8 against abyss's 36.0, so it was never the
   darkest thing here.
   What is actually wrong with it is HUE. The mean lit hue of this set
   is 29-33 — one warm tone — and violet comes through the shared grade
   at 279, because saturate(.30) sepia(.55) is not enough to take a
   purple that strong. That is the "lilac flare" the old note saw and
   attributed to brightness. So the grade gets a per-image override the
   way brightness already had one: at saturate(.12) sepia(.80) violet
   measures hue 26, sat 22, inside the band. Rendered beside desert and
   canyon at the real card size before it was believed. */
var GR = { violet: 'saturate(.12) sepia(.80) contrast(1.02) brightness(1.20)' };

function photo(node, name) {
  node.style.backgroundImage = 'url("../arc/bg/' + name + '.jpg")';
  node.style.setProperty('--ib', IB[name] || 1);
  if (GR[name]) node.style.setProperty('--grade', GR[name]);
  else node.style.removeProperty('--grade');
}

     its own leaves you opening a card to find out whether you want it.
     The minutes ride the same line rather than taking a third register. */
  var nt = el('div', 'al-note al-ab');
  if (s.src && s.src !== 'Ours') nt.appendChild(el('span', 'al-src', s.src));
  nt.appendChild(document.createTextNode(s.ab));
  w.appendChild(nt);
  b.appendChild(w);

  var ph = el('div', 'al-ph');
  var i = el('i'); photo(i, s.bg);
  ph.appendChild(i); b.appendChild(ph);
  return b;
}

function mask(p) {
  var f = function () {
    p.classList.toggle('is-end', p.scrollTop + p.clientHeight >= p.scrollHeight - 2);
  };
  if (!p.alMask) { p.alMask = f; p.addEventListener('scroll', f, { passive: true }); }
  p.alMask();
}

function paintArc() {
  var p = $('#alArcPane'); p.textContent = '';
  for (var i = 0; i < STAGES.length; i++) {
    var here = S.filter(function (s) { return s.stage === STAGES[i]; });
    if (!here.length) continue;
    p.appendChild(el('div', 'al-grp al-caps', STAGES[i]));
    for (var j = 0; j < here.length; j++) p.appendChild(cardOf(here[j]));
  }
  mask(p);
}

function lawRow(x) {
  var b = el('button', 'al-lrow');
  b.setAttribute('data-id', x.id);
  b.appendChild(el('span', 'al-sq', x.no));
  var t = el('span', 'al-lt');
  t.appendChild(el('i', null, x.n));
  t.appendChild(el('span', 'al-caps', x.stage));
  b.appendChild(t);
  var g = el('span', 'al-go'); g.innerHTML = ARROW; b.appendChild(g);
  return b;
}

function paintLaw(name) {
  var p = $('#alLawPane'); p.textContent = '';
  var fam = null;
  S.forEach(function (x) { x.laws.forEach(function (l) { if (l.n === name) fam = l.f; }); });
  var FAM = { inner: 'The inner world', motion: 'Motion', others: 'Other people', time: 'Time' };

  var lead = el('div', 'al-lead is-short');
  lead.appendChild(el('h1', 'al-disp', name));
  lead.appendChild(el('div', 'al-caps', FAM[fam] || ''));
  p.appendChild(lead);

  var sh = el('div', 'al-sheet');
  var d = el('p', 'al-body'); d.textContent = LAWS[name] || '';
  d.style.marginBottom = '26px';
  sh.appendChild(d);

  var carry = S.filter(function (x) {
    return x.laws.some(function (l) { return l.n === name; });
  });
  var h = el('div', 'al-rule-hd');
  h.appendChild(el('span', 'al-caps', carry.length === 1 ? 'One story carries it' : carry.length + ' stories carry it'));
  sh.appendChild(h);
  carry.forEach(function (x) { sh.appendChild(lawRow(x)); });

  p.appendChild(sh);
  p.scrollTop = 0; mask(p);
}

function paintLaws() {
  var p = $('#alLawsPane'); p.textContent = '';
  var seen = {}, fams = { inner: 'The inner world', motion: 'Motion', others: 'Other people', time: 'Time' };
  for (var f in fams) {
    var rows = [];
    S.forEach(function (s) { s.laws.forEach(function (l) {
      if (l.f === f && !seen[l.n]) { seen[l.n] = 1; rows.push(l); } }); });
    if (!rows.length) continue;
    p.appendChild(el('div', 'al-grp al-caps', fams[f]));
    var w = el('div', 'al-tags');
    rows.forEach(function (l) {
      var t = el('button', 'al-tag', l.n);
      t.setAttribute('data-f', l.f); t.setAttribute('data-law', l.n);
      w.appendChild(t);
    });
    p.appendChild(w);
  }
  mask(p);
}

function paintRules() {
  var p = $('#alRulesPane'); p.textContent = '';
  S.forEach(function (s) {
    // A RULE IN A LIST HAS NOTHING BEHIND IT. At the foot of its own
    // story it has the whole story; here it was a stage label that
    // repeats — two cards reading THE CALL and no way to tell them
    // apart — over a sentence with no referent. It names the story and
    // opens it, so the line always has somewhere to be explained.
    var d = el('button', 'al-rule al-rgo');
    d.setAttribute('data-id', s.id);
    d.appendChild(el('div', 'al-caps', s.stage));
    d.appendChild(el('b', null, s.rule));
    d.appendChild(el('div', 'al-rfrom', s.n));
    p.appendChild(d);
  });
  mask(p);
}

function paintStory(s) {
  var p = $('#alStoryPane'); p.textContent = '';

  var lead = el('div', 'al-lead');
  var hero = el('div', 'al-hero'); var hi = el('i'); photo(hi, s.bg);
  hero.appendChild(hi); lead.appendChild(hero);
  var mk = el('div', 'al-mark'); mk.innerHTML = MARK; lead.appendChild(mk);
  lead.appendChild(el('h1', 'al-disp', s.n));
  lead.appendChild(el('div', 'al-caps', s.stage));
  lead.appendChild(el('div', 'al-note', s.src + '  ·  ' + s.mins + ' min'));
  p.appendChild(lead);

  /* Everything past the lead sits on its own ground, and the ground is
     a CHILD of the scroll rather than the fixed photograph behind it. */
  var sh = el('div', 'al-sheet');

  var t = el('div', 'al-txt al-body');
  (s.body || []).forEach(function (x) { t.appendChild(el('p', null, x)); });
  sh.appendChild(t);

  var h = el('div', 'al-rule-hd'); h.appendChild(el('span', 'al-caps', 'Key themes'));
  sh.appendChild(h);

  var ls = el('div', 'al-les');
  s.laws.forEach(function (l) {
    var r = el('button', 'al-le');
    r.setAttribute('data-f', l.f);
    r.setAttribute('data-law', l.n);
    r.appendChild(el('span', 'al-le-n', l.n));
    if (LAWS[l.n]) r.appendChild(el('span', 'al-le-d', LAWS[l.n]));
    if (l.d) r.appendChild(el('span', 'al-le-x', l.d));
    ls.appendChild(r);
  });
  sh.appendChild(ls);

  if (s.teach) { var tb = el('p', 'al-body'); tb.textContent = s.teach; tb.style.marginBottom = '22px'; sh.appendChild(tb); }

  var r = el('div', 'al-rule');
  r.appendChild(el('div', 'al-caps', 'The rule'));
  r.appendChild(el('b', null, s.rule));
  sh.appendChild(r);

  var q = el('div', 'al-q');
  q.appendChild(el('div', 'al-caps', 'The question'));
  q.appendChild(el('b', null, s.q));
  sh.appendChild(q);

  var nx = null, at = S.indexOf(s);
  for (var k = at + 1; k < S.length; k++) { if (S[k].body) { nx = S[k]; break; } }
  var acts = el('div', 'al-acts');
  var a1 = el('button', 'al-pill is-grow', nx ? 'The next story' : 'Back to the Arc');
  a1.setAttribute('data-go', nx ? nx.id : 'arc');
  acts.appendChild(a1);
  if (nx) { var a2 = el('button', 'al-pill is-glass', 'The Arc'); a2.setAttribute('data-go', 'arc'); acts.appendChild(a2); }
  sh.appendChild(acts);

  p.appendChild(sh);
  p.scrollTop = 0; mask(p);
}

var VIEWS = ['open', 'arc', 'laws', 'rules', 'story', 'law'];
function view(v) {
  if (VIEWS.indexOf(v) < 0) v = 'arc';
  document.documentElement.setAttribute('data-view', v);
  VIEWS.forEach(function (x) {
    var n = $('#al' + x.charAt(0).toUpperCase() + x.slice(1));
    if (n) n.classList.toggle('is-on', x === v);
  });
  $('#alFoot').hidden = (v === 'open' || v === 'story' || v === 'law');
  $('#alStoryX').hidden = (v !== 'story');
  $('#alLawX').hidden = (v !== 'law');
  document.querySelectorAll('.al-tab').forEach(function (b) {
    b.setAttribute('aria-current', b.getAttribute('data-v') === v ? 'true' : 'false');
  });
  document.querySelectorAll('.al-count').forEach(function (n) {
    n.textContent = st.read.length + ' of ' + S.length;
  });
  if (v === 'arc') paintArc();
  if (v === 'laws') paintLaws();
  if (v === 'rules') paintRules();
}

var lawBack = 'laws';
function openLaw(name) {
  if (!LAWS[name]) return;
  var now = document.documentElement.getAttribute('data-view');
  if (now === 'story' || now === 'laws' || now === 'arc') lawBack = now === 'story' ? 'story' : now;
  paintLaw(name);
  view('law');
}

function open(id) {
  var s = byId(id);
  if (!s || !s.body) return;
  st.last = id;
  if (st.read.indexOf(id) < 0) st.read.push(id);
  save();
  paintStory(s);
  view('story');
}

document.addEventListener('click', function (e) {
  var t = e.target.closest ? e.target.closest('.al-tab, .al-card, .al-pill, .al-tag, .al-le, .al-lrow, .al-rgo, #alOpenB, #alStoryX, #alLawX') : null;
  if (!t) return;
  if (t.id === 'alOpenB') { var r = st.last && byId(st.last); return r && r.body ? open(r.id) : view('arc'); }
  var go = t.getAttribute && t.getAttribute('data-go');
  if (go) return go === 'arc' ? view('arc') : open(go);
  if (t.id === 'alStoryX') return view('arc');
  if (t.id === 'alLawX') return lawBack === 'story' ? view('story') : view(lawBack);
  var law = t.getAttribute && t.getAttribute('data-law');
  if (law) return openLaw(law);
  if (t.classList.contains('al-lrow') || t.classList.contains('al-rgo')) return open(t.getAttribute('data-id'));
  if (t.classList.contains('al-tab')) return view(t.getAttribute('data-v'));
  if (t.classList.contains('al-card')) return open(t.getAttribute('data-id'));
});

var resume = st.last && byId(st.last);
if (resume) { $('#alOpenB').textContent = 'Continue'; $('#alOpenN').textContent = 'You stopped at ' + resume.n + '.'; }
photo($('#alOpenHero'), 'desert');
view('open');
window.alDrive = { view: view, open: open };

}());
</script>
</body>
</html>
