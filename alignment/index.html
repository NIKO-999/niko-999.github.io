<!doctype html>
<html lang="en" data-view="open">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Alignment</title>
<!-- A PAGE ON THE WEB ANSWERS THE REQUEST THE BROWSER MAKES ANYWAY.
     Without these Chromium asks for /favicon.ico on every load and the
     server answers 404 — a console error on every open, which is noise
     the one check that counts console errors then has to be taught to
     ignore. The apple-touch-icon and the standalone meta are what make
     Add to Home Screen open this full-screen rather than in a browser
     with a URL bar over the head. -->
<link rel="icon" href="../icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Alignment">
<meta name="description" content="13 books, 22 laws and 156 themes.">
<link rel="preload" href="../arc/fonts/Inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/GeistMono.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: 'Inter'; font-weight: 100 900; font-display: swap;
  src: url('../arc/fonts/Inter.woff2') format('woff2'); }
@font-face { font-family: 'Geist Mono'; font-weight: 100 900; font-display: swap;
  src: url('fonts/GeistMono.woff2') format('woff2'); }

/*
  ALIGNMENT. Its own ground, its own type, its own everything — it reads
  none of the other keys and takes none of the shared shell.

  THE LOOK IS A SKY, A THIN FACE AND A MONOSPACE, taken from a reference
  that was three phones of a finance app, and what it does is the
  opposite of what this did on every count. The ground was one flat warm
  black; it is a cool black with the colour living in gradients — a dawn
  behind the first screen, a dusk behind every title. Display type was
  Inter at 450 to 600; it is 300, because a large thin face reads as
  confident where a large heavy one reads as loud. Every label was
  tracked-out caps at half an em; it is a monospace, which is what makes
  a label read as a LABEL rather than as a heading someone shrank.

  AND THE MONOSPACE IS SHIPPED, NOT ASKED FOR. The system mono on this
  machine is DejaVu and on the phone it is SF Mono, so a screenshot judged
  here would have been a picture of a different app. Geist Mono, 23KB,
  OFL, beside the file that uses it — the same arrangement Inter already
  has, and not a CDN: nothing is fetched from anywhere but this origin.
*/

:root {
  --paper: #000000;
  --ink: #F3F5F7;
  --dim: rgba(243,245,247,.72);
  /* The quietest thing that is still WORDS. The reference's sub-lines are
     dimmer than this and on a white-on-black face that is where 4.5:1
     goes — .46 measured 4.4 on this ground, which is the rounding error
     this repo keeps shipping as a margin. At .56 it is 5.9. */
  --quiet: rgba(243,245,247,.56);
  --hair: rgba(243,245,247,.10);
  --lift: rgba(243,245,247,.07);

  --sans: 'Inter', -apple-system, system-ui, sans-serif;
  --mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  /* THERE IS NO SKY. The ground is black and nothing is drawn on it
     except type, which is what the reference this was taken from is: one
     heavy sentence on a flat black page and a line of small print at the
     foot. The gradients, the dawn, the dusk and the light held to the
     foot all existed to give a colourless page something to look at, and
     the look is that it has nothing.

     THE TOKENS STAY, FLAT. `--dawn` and `--sky` are read by name by the
     canvas check, which parses the last stop out of each and compares it
     with the root's own colour, so the seam under the home indicator is
     still asserted rather than assumed — it just has one colour to be
     asserted against. A gradient of one stop is the cheapest way to keep
     a token that other things read. */
  --dawn: linear-gradient(180deg, #000000, #000000);
  --sky:  linear-gradient(180deg, #000000, #000000);
  --dusk: linear-gradient(180deg, #000000, #000000);
  --glow: 0px;

  --r-card: 22px;
  --r-pill: 999px;

  /* Six vertical steps. The first build shipped eleven. */
  --v1: 6px;  --v2: 10px; --v3: 16px;
  --v4: 22px; --v5: 34px; --v6: 52px;

  --gut: 22px;
  --round: 40px;   /* drawn; the 44 it OWNS is the ::before square */
  --gut-list: 18px;
  --tap: 44px;

  /* FOUR HUES, AND THEY ARE THE SKY'S. The axis colours were a violet,
     a gold, a cyan and an orange at full saturation — the only saturated
     things in a reference that has none. They are the same four ideas
     taken toward the light: lavender, sand, sea-glass, peach, and the
     peach is the one in the dusk. Held to dE 12 apart by the suite, on
     composited labels rather than on these hexes. */
  --ax-mindset:  #B7A5FF;
  --ax-internal: #E8C67C;
  --ax-external: #7DCFD8;
  --ax-karmic:   #F2A184;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

/* THE PAGE IS A COLUMN AND THE NAV IS ITS FIRST CHILD. A fixed bar needs
   every view to know how tall it is; a flex child simply takes its room
   and hands the rest down, and a view that hides it gets the whole
   height without being told. */
html, body { height: 100%; background: #000000; }
/* THE STRIP BEHIND THE HOME INDICATOR IS THE CANVAS, AND IT IS PAINTED
   TO MATCH. iOS samples body's own background-color for it and the root's
   for the rest, and no sizing rule reaches the physical floor, so the
   colour is what closes the seam. Both are the ground now, which is the
   same black on every view: the seam has nothing on either side of it to
   show, and the open screen no longer needs a silver of its own. */
html[data-view="open"], html[data-view="open"] body { background-color: #000000; }
body {
  position: fixed; inset: 0;
  background-color: #000000;
  background-image: var(--sky);
  background-repeat: no-repeat;
  background-size: 100% 100%;
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.5;
  overflow: hidden;
  overscroll-behavior: none;
  display: flex; flex-direction: column;
}

button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: left; }
[hidden] { display: none !important; }

/* THE LABEL REGISTER. One size, one tracking, one face — a label that
   comes in three sizes is three labels. */
.al-caps { font: 500 10.5px/1.35 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--quiet); }

/* THE DISPLAY FACE IS HEAVY, CAPITALS AND SET TIGHT. The reference's
   sentence is a condensed grotesque at the boldest it comes; the only
   face shipped here is Inter, which has no width axis, so the condensed
   look is made the way a printer would on a face that has none: the
   heaviest weight, capitals, tracking pulled in until the letters touch
   and a line-height under one. It was 300, on the argument that a large
   thin face reads as confident where a large heavy one reads as loud —
   and loud is what this asks for. */
.al-disp, .al-disp-s, .al-open-t { font-weight: 800; text-transform: uppercase; line-height: .96; }
.al-disp   { font-size: 38px; letter-spacing: -.045em; text-wrap: balance; }
.al-disp-s { font-size: 34px; letter-spacing: -.045em; }

.al-view { position: relative; z-index: 1; flex: 1; min-height: 0; display: none; flex-direction: column; }
.al-view.is-on { display: flex; }

/* ---- THE NAV ---- */
/* AT THE TOP, AND IT IS THREE MARKS AND A LINE. It was a glass pill at
   the foot, 58px tall with a lit lozenge in it — the heaviest object on
   every list, holding three glyphs. The reference's nav is the quietest
   thing on its screen: the marks at the ink's quietest step, the one you
   are on at full strength with a hairline under it. The line is what
   says which, so no ground is needed, and nothing sits over the list at
   the foot any more.

   Each mark owns 52x44 and draws 18; the three are adjacent, so nothing
   reaches into a neighbour. */
.al-nav { flex: none; position: relative; z-index: 2; display: flex; justify-content: center; gap: 2px;
  padding: calc(4px + env(safe-area-inset-top, 0px)) 0 0; }
.al-tab { position: relative; width: 52px; height: 44px; display: grid; place-items: center; color: var(--quiet); }
.al-tab svg { width: 18px; height: 18px; display: block; }
.al-tab::after { content: ''; position: absolute; left: 50%; bottom: 7px; width: 16px; height: 1px;
  margin-left: -8px; background: var(--ink); opacity: 0; }
.al-tab[aria-current="true"] { color: var(--ink); }
.al-tab[aria-current="true"]::after { opacity: 1; }

/* ---- THE OPEN SCREEN ---- */
/* THE REFERENCE'S MIDDLE PHONE: a sentence on a sky, and one round
   control at the foot. It was a left-aligned title over a paragraph on
   flat black with a pill under it, which is a form. What changed is
   what is FIRST — the figures are a line of type now, and what you read
   first is what the app is for. */
#alOpen { background: var(--dawn); align-items: flex-start; justify-content: center; text-align: left;
  padding: calc(var(--v5) + env(safe-area-inset-top, 0px)) var(--gut) calc(120px + env(safe-area-inset-bottom, 0px)); }
/* THE NAME AND THE FIGURES ARE THE FOOT'S SMALL PRINT, two lines at the
   left under everything, which is where the reference keeps its own. The
   figures are still the element the description is read from — only
   where it is drawn moved. */
.al-mark { position: absolute; left: var(--gut); right: var(--gut);
  bottom: calc(var(--v5) + 24px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 8px; color: var(--quiet); }
.al-mark svg { width: 11px; height: 11px; display: block; }
.al-mark b { font: 500 10.5px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.al-open-k { position: absolute; left: var(--gut); right: 96px;
  bottom: calc(var(--v5) + env(safe-area-inset-bottom, 0px)); color: var(--quiet); }
.al-open-t { font-size: 34px; letter-spacing: -.045em; max-width: 11em; text-wrap: balance; }

/* THE BUTTON IS THE ONE WHITE OBJECT, at the foot on the right where the
   small print is not. Flat: a shadow under a white disc on a black page
   is a smudge, and there is nothing for it to be lifted off. */
.al-go { position: absolute; right: var(--gut); bottom: calc(var(--v5) + env(safe-area-inset-bottom, 0px));
  width: 62px; height: 62px; border-radius: var(--r-pill);
  background: #FFFFFF; color: #000000; display: grid; place-items: center; }
.al-go svg { width: 20px; height: 20px; display: block; }

/* ---- A LIST'S HEAD ---- */
/* A TITLE ON A DUSK. The reference puts one gradient card at the top of
   a list and nothing else coloured on the screen, and this is that card:
   what the list is, and the figures for it in the label register above
   the name. Outside the pane, so the list scrolls under nothing. */
.al-head { flex: none; margin: var(--v3) var(--gut-list) var(--v2); padding: 0; background: var(--dusk); }
.al-kick { color: var(--quiet); }
.al-head .al-disp-s { margin-top: 9px; }
.al-count { font-variant-numeric: tabular-nums; }

/* THE STOPS ARE THE NAV'S OWN IDIOM ONE LEVEL DOWN: words, and a line
   under the one you are on. They were two filled pills. 40 drawn, and
   the reach takes each to 44 tall and past 44 wide. */
.al-stops { flex: none; display: flex; gap: 24px; margin: 0 var(--gut-list); border-bottom: 1px solid var(--hair); }
.al-stop { position: relative; height: 40px; }
.al-stop::before { content: ''; position: absolute; inset: -2px -10px; }
.al-stop[aria-current="true"] { color: var(--ink); }
.al-stop[aria-current="true"]::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px;
  height: 1px; background: var(--ink); }

/* A PANE ENDS WHERE THE LIGHT BEGINS. The glow under it is sky with
   nothing written on it, so the home indicator sits in the light rather
   than on the last row, and the mask below dissolves the list into it. */
.al-pane { flex: 1; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  margin-bottom: var(--glow); padding: 0 var(--gut-list) 28px; }
.al-pane::-webkit-scrollbar { display: none; }

/* A MASK, NEVER A GRADIENT LAID OVER THE CONTENT: a mask has no colour
   to get wrong. Off again at the end of the travel — a soft edge over
   nothing is the same lie in the other direction. */
.al-pane { -webkit-mask-image: linear-gradient(180deg, #000 calc(100% - 72px), transparent 100%);
                   mask-image: linear-gradient(180deg, #000 calc(100% - 72px), transparent 100%); }
.al-pane.is-end { -webkit-mask-image: none; mask-image: none; }

/* ---- ROWS ---- */
/* HAIRLINES, NOT CARDS. Every row was a filled 26px-radius slab, so a
   list of sixteen names was sixteen objects of equal weight on a page
   that had nothing else on it. The reference's list is rows on the
   ground with a line between them, and a line costs no height and says
   exactly one thing. The heading draws the line above the first row. */
.al-grp, .al-chh { display: flex; justify-content: space-between; align-items: baseline;
  padding: var(--v5) 2px var(--v2); border-bottom: 1px solid var(--hair); }
.al-chh { color: var(--dim); }
.al-grp[data-x] { color: var(--tg); }
.al-n { font-variant-numeric: tabular-nums; }

/* A ROW SAYS ITS NAME IN THE MONOSPACE, and that is the reference's
   boldest move rather than its oddest: the content of its list is set in
   the label face, bright over dim, so a row reads as an ENTRY rather
   than as a heading. Two registers of one face, which is quieter than a
   sans name over a mono place and still tells the two lines apart. */
.al-rt { display: block; min-width: 0; }
.al-tn { display: block; font: 500 12.5px/1.4 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink); }
.al-tsub { display: block; margin-top: 4px; font: 400 10.5px/1.35 var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--quiet); }
.al-chev { flex: none; width: 15px; height: 15px; color: var(--quiet); transition: transform .22s ease; }
.al-chev svg { width: 100%; height: 100%; display: block; }

.al-f { display: flex; align-items: center; gap: 14px; width: 100%;
  padding: 16px 2px; border-bottom: 1px solid var(--hair); }
.al-f .al-rt { flex: 1; }
.al-pane > .al-f:first-child { border-top: 1px solid var(--hair); }

/* ---- A THEME ---- */
/* A THEME IS A ROW THAT OPENS. It was a card with both paragraphs always
   drawn, so a source page was twelve full cards and about six thousand
   pixels — a document you scrolled rather than a list you read from.
   Shut, the twelve are one screen of titles; open, the one you chose is
   the only prose on it. The chevrons are the reference's own.

   A BUTTON INSIDE THE HEADING, never a heading inside a button: the
   second is invalid and loses the heading for a screen reader. Which rows
   are open is NOT stored — it is a position on a screen you are looking
   at, and one restored from last week opens on a theme you have moved
   past. Kept opens them all, because everything on it you chose to
   read again. */
.al-th, .al-ch { border-bottom: 1px solid var(--hair); }
.al-th-h { font: inherit; }
.al-row { display: flex; align-items: center; gap: 14px; width: 100%; padding: 16px 2px; }
.al-row .al-rt { flex: 1; }
.al-row[aria-expanded="true"] .al-chev { transform: rotate(180deg); color: var(--ink); }

.al-body, .al-chb { padding: 2px 2px 24px; }
.al-ch { --tg: var(--dim); }
.al-tl { margin: var(--v3) 0 var(--v1); color: var(--tg); }
.al-body .al-tl:first-child, .al-chb .al-tl:first-child { margin-top: 4px; }
.al-tb { font-size: 14.5px; line-height: 1.55; color: var(--dim); }
/* THE LESSON IS THE MIDDLE PHONE'S SENTENCE: larger, thinner, the ink.
   The evidence above it stays at the reading size in the quieter step,
   so what separates the two halves is register rather than a box. */
.al-tb.is-les { font-size: 18px; font-weight: 500; line-height: 1.46; letter-spacing: -.006em; color: var(--ink); }

/* TWO MARKS, BECAUSE THEY ARE TWO CLAIMS. A highlight is liberal; a pin
   is the handful you are working from. The state is the GROUND — the ink
   with the paper on it — never a second word, which would reflow the row
   under the press that moved it. 32 drawn; the reach is vertical only,
   or Pin's band lands in Highlight's. */
.al-acts { display: flex; gap: 8px; margin-top: var(--v4); }
.al-mk { position: relative; height: 32px; padding: 0 15px; border-radius: var(--r-pill);
  font: 500 10.5px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase;
  color: var(--dim); background: var(--lift); }
.al-mk::before { content: ''; position: absolute; inset: -6px 0; }
.al-mk[aria-pressed="true"] { background: var(--ink); color: #0B0E13; }

/* THE QUOTE IS THE BOOK, SO IT IS SET AS THE ONE THING ON THE PAGE THAT
   IS NOT OURS: the ink rather than the dim, a step up from the reading
   size, and a rule down its left edge in the section's hue. A rule and
   not a box — a frame round a sentence is the card inside the page this
   look has taken out everywhere else. */
.al-q { margin: var(--v3) 2px var(--v2); padding: 2px 0 2px 14px; border-left: 2px solid var(--tg, var(--ink)); }
.al-qt { font-size: 17px; line-height: 1.42; font-weight: 500; letter-spacing: -.008em; color: var(--ink); text-wrap: pretty; }

.al-note { margin: var(--v3) 2px var(--v2); font-size: 13px; line-height: 1.45; color: var(--quiet); text-wrap: pretty; }

.al-empty { padding: var(--v4) 2px; font-size: 15px; line-height: 1.5; color: var(--dim); }

.al-th[data-x="mindset"],  .al-grp[data-x="mindset"],  .al-q[data-x="mindset"]  { --tg: var(--ax-mindset); }
.al-th[data-x="internal"], .al-grp[data-x="internal"], .al-q[data-x="internal"] { --tg: var(--ax-internal); }
.al-th[data-x="external"], .al-grp[data-x="external"], .al-q[data-x="external"] { --tg: var(--ax-external); }
.al-th[data-x="karmic"],   .al-grp[data-x="karmic"],   .al-q[data-x="karmic"]   { --tg: var(--ax-karmic); }

/* ---- A SOURCE ---- */
/* The right phone: a dusk card with the name on it, then the list. The
   card is IN the pane, so it scrolls away and the twelve rows get the
   screen — a list's head stays because you move between lists, and a
   source is one thing you are reading down. */
#alSource .al-pane { padding-top: calc(var(--v2) + env(safe-area-inset-top, 0px)); }
/* THE CARD ENDS SHORTLY AFTER THE LAST SENTENCE, and the glow is its lit
   edge. 80px of padding held a peach band under the words and was
   reported as empty space, which it was: room kept for a colour. The
   stops are measured from the foot, so whatever height the summary gives
   the card, the ground under the last line is at most #4E5268, where the
   summary clears 5.4:1, and the peach lives in the last 28px. White on
   that peach is about 2:1, so nothing is written there. */
.al-lead { margin: 0 0 var(--v1); padding: 14px 2px 22px; }
.al-sum { margin-top: 14px; font-size: 15px; line-height: 1.45; color: var(--dim); text-wrap: pretty; }
.al-lead .al-kick { margin-bottom: 10px; }
/* THE TITLE HAS TO CLEAR THE CLOSE BUTTON, which is fixed at the
   viewport's own right edge — so the room is a number of PIXELS and an
   em measure cannot see it. Derived from the button and the gutters. */
.al-lead .al-disp { max-width: calc(100% - (var(--round) + var(--gut) - var(--gut-list) + 8px)); }
.al-sheet { padding-bottom: var(--v6); }

/* THE CLOSE IS AN OBJECT, NOT GLASS. It sits over running text while the
   pane scrolls under it, and a translucent disc over a sentence is a
   smear — a letter behind it survived as a ghost at 56%. Solid, and it is
   the open screen's own white control rather than a black disc: with the
   sky behind every page, a dark round was the one black thing left on
   it. */
.al-round {
  width: var(--round); height: var(--round); flex: none; border-radius: var(--r-pill);
  background: #FFFFFF; color: #000000;
  display: grid; place-items: center; position: relative;
}
.al-round::before {
  content: ''; position: absolute; top: 50%; left: 50%;
  width: var(--tap); height: var(--tap); transform: translate(-50%, -50%);
}
.al-round svg { width: 16px; height: 16px; display: block; }
.al-x { position: fixed; top: calc(18px + env(safe-area-inset-top, 0px)); right: var(--gut); z-index: 30; }
</style>

</head>
<body>

<nav class="al-nav" id="alNav" hidden>
  <button class="al-tab" data-v="books" aria-current="true" aria-label="The Books">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7.2v13M12 7.2C10.6 5.6 8.4 4.8 5.2 4.8a1 1 0 0 0-1 1v11.6a1 1 0 0 0 1 1c3.2 0 5.4.8 6.8 2.4M12 7.2c1.4-1.6 3.6-2.4 6.8-2.4a1 1 0 0 1 1 1v11.6a1 1 0 0 1-1 1c-3.2 0-5.4.8-6.8 2.4"/></svg>
  </button>
  <button class="al-tab" data-v="laws" aria-label="The Laws">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16M8 20h8M5 7h14M7 7l-3 7a3 3 0 0 0 6 0L7 7zM17 7l-3 7a3 3 0 0 0 6 0l-3-7z"/></svg>
  </button>
  <button class="al-tab" data-v="kept" aria-label="Kept">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6.8 3.4h10.4a1.4 1.4 0 0 1 1.4 1.4v15.8L12 16.1l-6.6 4.5V4.8a1.4 1.4 0 0 1 1.4-1.4Z"/></svg>
  </button>
</nav>

<section class="al-view is-on" id="alOpen">
  <div class="al-mark">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M12 2v20M5 8l7-6 7 6M5 16l7 6 7-6"/></svg>
    <b>Alignment</b>
  </div>
  <p class="al-caps al-open-k" id="alOpenK"></p>
  <h1 class="al-open-t" id="alOpenT">What the books say, and the laws underneath them.</h1>
  <button class="al-go" id="alOpenB" aria-label="Begin">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </button>
</section>

<section class="al-view" id="alBooks">
  <div class="al-head"><p class="al-caps al-kick"><span class="al-count"></span> <span class="al-kick-r"></span></p><h1 class="al-disp-s">The Books</h1></div>
  <div class="al-pane" id="alBooksPane"></div>
</section>

<section class="al-view" id="alLaws">
  <div class="al-head"><p class="al-caps al-kick"><span class="al-count"></span> <span class="al-kick-r"></span></p><h1 class="al-disp-s">The Laws</h1></div>
  <div class="al-pane" id="alLawsPane"></div>
</section>

<section class="al-view" id="alKept">
  <div class="al-head"><p class="al-caps al-kick"><span class="al-count"></span> <span class="al-kick-r"></span></p><h1 class="al-disp-s">Kept</h1></div>
  <div class="al-stops" id="alKeptStops">

<script>
(function () {
'use strict';

/*
  ONE WRAPPER. Nothing escapes it. The other apps in this repo learned
  that the hard way — a top-level name here does not throw when it
  collides, it replaces, and the symptom turns up screens away.
*/

var KEY = 'align.v1';

/* A BOOK IS A SYSTEM SOMEBODY WROTE DOWN, AND THE THEME IS WHAT THE BOOK
   ACTUALLY CLAIMS: not a paraphrase of the blurb and not a lesson
   invented and hung on a famous title. Where an idea belongs to the
   author's wider work rather than to that one volume, it says so.

   THE APP WAS ABOUT PEOPLE FIRST. Twenty-six figures, three hundred and
   twelve themes, each a documented thing somebody did. It is about books
   and the laws they name now, and the figures are gone: the whole set,
   their data, their summaries and the tests that held them. They are in
   the history of this file if they are ever wanted back, and nothing in
   what remains refers to them.

/* FOUR AXES, AND EACH ONE IS A DIFFERENT QUESTION. MINDSET is the model
   the book runs on: what it believes about how the world works, which is
   portable and is the only one of the four you can adopt outright.
   INTERNAL is what it says you are actually like: the state, the
   appetite, the need, the thing you do to yourself. EXTERNAL is how the
   world works, whatever anybody believes about it. KARMIC is the account
   between the two over time, arriving back on a delay long enough that it
   does not feel connected to what opened it.

   Mindset comes first because it is the frame the other three are read
   through. Nothing in a book's list duplicates anything in another axis,
   and that is asserted by name at boot rather than trusted. */
var AXIS = { mindset: 'Mindset', internal: 'Internal', external: 'External', karmic: 'Karmic' };

/* A GROUP HEADING ONLY WHERE THE LIST IS MADE OF MORE THAN ONE KIND OF
   THING. The books are one group, so a heading over them would be the
   pane's own title said again a register down, which is the duplication
   this project keeps having to take back out. The table stays, empty,
   because the index and the boot check both ask it for a label the day a
   second kind of source comes back. */
var GROUP = {};

var SRC = [
  { i: "devil", n: "Outwitting the Devil", p: "Napoleon Hill", k: "book", g: "book" },
  { i: "tagr", n: "Think and Grow Rich", p: "Napoleon Hill", k: "book", g: "book" },
  { i: "mdh", n: "Million Dollar Habits", p: "Brian Tracy", k: "book", g: "book" },
  { i: "surf", n: "Reality Transurfing", p: "Vadim Zeland", k: "book", g: "book" },
  { i: "para", n: "Change Your Paradigm", p: "Bob Proctor", k: "book", g: "book" },
  { i: "feel", n: "Feeling Is the Secret", p: "Neville Goddard", k: "book", g: "book" },
  { i: "sogr", n: "The Science of Getting Rich", p: "Wallace Wattles", k: "book", g: "book" },
  { i: "cyb", n: "Psycho-Cybernetics", p: "Maxwell Maltz", k: "book", g: "book" },
  { i: "subc", n: "The Power of Your Subconscious Mind", p: "Joseph Murphy", k: "book", g: "book" },
  { i: "atmt", n: "As a Man Thinketh", p: "James Allen", k: "book", g: "book" },
  { i: "big", n: "The Magic of Thinking Big", p: "David J. Schwartz", k: "book", g: "book" },
  { i: "bab", n: "The Richest Man in Babylon", p: "George S. Clason", k: "book", g: "book" },
  { i: "life", n: "The Game of Life and How to Play It", p: "Florence Scovel Shinn", k: "book", g: "book" },
];

/* WHO THEY ARE, FOR SOMEBODY WHO DOES NOT KNOW. A sentence or two on the
   card under the name, and nothing the themes below say better. Kept
   beside SRC rather than on each row so the rows stay one line each; a
   source with no summary, or a summary with no source, throws at boot. */
var SUM = {
  devil: "Napoleon Hill's imagined interview with the Devil, written in 1938 and held back for decades, about fear, drifting and the habits that keep people from what they want. Published in 2011.",
  tagr: "Napoleon Hill's 1937 study of how successful people thought, built on desire, faith, persistence and a definite purpose. One of the best-selling self-help books ever written.",
  mdh: "Brian Tracy on the daily habits behind high earners: clear goals, managing time, learning for life and doing the most important task first.",
  surf: "Vadim Zeland's Russian series from the early 2000s. Reality is a field of possibilities, and you move between them through intention, calm and letting go of excess importance.",
  para: "Bob Proctor's teaching that your results come from your paradigm, the habits of thought held in the subconscious, and that changing results means changing that first.",
  feel: "Neville Goddard's short 1944 book: assume the feeling of the wish already fulfilled, and that feeling is how it becomes real.",
  sogr: "Wallace Wattles' 1910 book treating wealth as the result of thinking and acting in a certain way. It inspired The Secret.",
  cyb: "Plastic surgeon Maxwell Maltz's 1960 book on self-image: you act in line with how you see yourself, and changing that picture changes the results.",
  subc: "Joseph Murphy's 1963 book: the subconscious accepts what you believe and acts on it, with simple techniques such as affirmations before sleep.",
  atmt: "James Allen's short 1903 essay on how your thoughts shape your character, your circumstances and your health.",
  big: "David J. Schwartz's 1959 book on confidence, action and aiming higher, full of practical habits for thinking larger than your circumstances.",
  bab: "George S. Clason's 1926 parables set in ancient Babylon, teaching the basics of money: keep a part of all you earn, control your spending and make your savings work.",
  life: "Florence Scovel Shinn's 1925 book treating life as a game of giving and receiving, where your words, expectations and forgiveness shape what comes back.",
};

/* THE LAWS ARE A READING OF THE LAW ITSELF AND NOTHING ELSE. Ten of
   eleven were given, from a short video; the eleventh was cut off at the
   edge of the screenshot ("Law of Terminal") and its full name is not
   known, so it is not here rather than guessed at.

   THE FIRST VERSION ENDED IN WHAT TO DO ABOUT IT, and was sent back; the
   second added where each law comes from and how its authors argue it,
   and was sent back again: "I don't really care about where it comes
   from." What is wanted is enough on the law that a reader can see
   where it attaches to their own life without being handed a scenario
   or an exercise. So there is no origin, no research, no author and no
   instruction in any entry, and no "imagine that you". Each law says
   what it is, how it works, where it operates in a life (described by
   area, never by example), how you can tell it is operating, and what
   it is not, which is where its limits are stated. The pane says once
   that these are rules from a tradition and not laws of physics. */
var LAWS = [
  { n: "Law of Assumption", b: "Live From the End",
    r: [
      ["The law", "Whatever you hold to be true about yourself, about other people and about how things go, and hold as settled fact rather than as hope, becomes the working premise of your life. The law of assumption says outcomes follow the premise. You do not move toward what you want by wanting it harder. You move toward whatever is consistent with what you already take for granted."],
      ["How it works", "An assumption is a belief held without effort. It does not feel like a belief. It feels like the way things are. That is what gives it its power, because it operates before any decision is made. It decides what you perceive: evidence that fits is noticed and counted, and evidence that does not fit is explained away or never registered. It decides what you attempt, and the manner of the attempt: what you ask for, how directly, how much you expect to be refused. It decides how other people respond, because people react to tone, posture and hesitation more than to the words. The results then come back as confirmation, which hardens the assumption and closes the loop. This is why a change of assumption looks, from outside, like a change of luck. The circumstances did not change first. The premise they were being read and acted on from did."],
      ["Assuming and wishing", "A wish is stated in the future and keeps the thing at a distance: I want it, I hope for it, I will have it. An assumption is stated in the present and has no distance in it: it is so. The law treats that difference as the whole matter. It is carried by a feeling of naturalness, the quiet of something already true. Excitement and urgency mean the thing is still felt as out of reach, and that feeling, not the stated wish, is the assumption actually in force."],
      ["Where it operates", "Everywhere an outcome depends partly on you. How you regard your own worth, ability and appearance. What you expect from relationships and from particular people. What you expect from money and from your work. What you expect of your health and your body. What you expect of the future in general, whether you take it to be generous or hostile. It operates most where results are ambiguous or slow, because ambiguity is where an assumption gets to decide what the facts mean. It operates least where the result is fixed entirely by something outside you."],
      ["How you can tell", "The assumption is whatever you would bet on, not whatever you would say. You can see it in the gap between what you say you want and what you are quietly sure will happen. You can see it when the same outcome repeats across different people and settings, when you can predict how an event will end before it starts and are usually right, and when you are surprised by anything that falls outside your expectation, in either direction. The surprise marks the edge of the premise."],
      ["What it is not", "It is not positive thinking. A sentence you do not believe is not an assumption, and repeating it produces friction rather than the state. It is not a method for controlling events, only for changing the premise you act from. It does not claim that what you assume overrides chance, other people's decisions or physical limits. And it is not a single moment of feeling. It is a state that persists when nobody is watching, which is why it is hard to fake and slow to change."]
    ] },
  { n: "Law of Detachment", b: "Intend It, Then Let Go of How",
    r: [
      ["The law", "The law of detachment says you can hold a clear intention and loosen your grip on the outcome and on the route to it, and that the loosening is part of how things move. Detachment is not indifference to the result. It is the difference between wanting something and needing it, between having a direction and having a demand."],
      ["How it works", "A result you need changes the way you act, in four ways. Needing raises the stakes of every step, so each sign reads as a verdict. It narrows attention onto the one acceptable route, so everything else is filtered out. It produces urgency, which shows up as pressing, checking, bargaining and comparing. And fear of the alternative leaks into manner, so that what you do carries a pulling quality other people can feel. Releasing the need removes all four. Attention widens, so more routes are visible. Decisions are made on their merits instead of out of fear. Manner relaxes. The law's claim is that an intention does its work through direction, which does not need clenching, and that the clenching only adds noise. It also describes a freedom: the outcome stops being the thing your wellbeing is held hostage to."],
      ["What is released", "Two things are released, and they are different. The first is the outcome: what arrives may be what you wanted, something near it, or something else. The second is the how: the particular path, the timing, the person or channel it comes through. Most people release neither. Some release the outcome and keep the route fixed. The law asks for both. The intention itself is kept: the direction stays clear and effort stays on the step in front of you."],
      ["Where it operates", "Wherever a result matters enough to create pressure. The waiting after you have applied, asked, offered or launched something. Relationships, where wanting a particular response from a person shapes how you behave toward them. Situations in which you are being judged on performance. Money and income, once a figure has become a measure of safety. Health and recovery, where watching for progress becomes a strain of its own. It operates most strongly where there is nothing more you can do and you keep checking anyway."],
      ["How you can tell", "The law is being broken when you check repeatedly for a result that cannot yet have changed, when a delay feels like a threat, when one outcome is described as the only acceptable one, when your mood rises and falls with signs rather than with facts, or when you cannot picture being fine if the thing does not come. It is being kept when you can state what you want plainly, take the next step and move your attention elsewhere, and when the possibility of not getting it can be looked at without alarm."],
      ["What it is not", "It is not apathy, and it is not pretending not to want things. Telling yourself you do not care is a form of attachment, since it is effort spent managing the want. It is not passivity: the step in front of you is still taken. It is not a technique for getting the outcome by seeming not to want it, which turns it back into a demand wearing a disguise. And it does not promise that the thing arrives. It promises that your state does not depend on whether it does."]
    ] },
  { n: "Law of Reflection", b: "The Outside Mirrors the Inside",
    r: [
      ["The law", "The law of reflection says the world you meet mirrors what is within you. The people who keep appearing, the situations that repeat and the traits that provoke strong feeling in you all carry information about the inside. Read carefully it is a law about interpretation and participation: your inner state shapes how you read what happens and what you do about it, and so shapes a large share of what comes back."],
      ["How it works", "Three channels carry the reflection. The first is perception. You notice and remember what matches your existing view, so the world you see is already a filtered one. The second is projection. Qualities you have not owned in yourself, admired or disliked, are perceived in other people, often with unusual intensity, and a strong reaction to a trait in someone else is the most reliable marker of it. The third is participation. Your expectations and habits produce cues in manner and in choice that draw particular responses and select particular people and settings, so the same dynamic assembles itself again around you. In all three the inner thing is the constant and the outer things vary, which is why the pattern follows you across jobs, places and relationships. The reflection is not a punishment or a message. It is the consequence of one source feeding many situations."],
      ["Where it operates", "Most clearly in relationships, in any case where the same dynamic repeats with different people. In reactions, where strong feeling about someone's trait points to something unowned or unresolved in you. In how you are treated, to the extent that your own manner, boundaries and expectations set the terms. In work and money, where recurring obstacles can come from recurring ways of choosing. And in how you see the world as a whole, whether as friendly, competitive or hostile, which tends to be confirmed because that is what you are looking for."],
      ["How you can tell", "The law is in play when the same type of person or problem appears more than twice, when your reaction to someone is far stronger than the facts warrant, when you tell the same story about different people, or when what you most admire and what you cannot stand in other people are both qualities you are curious about in yourself. A reaction proportionate to the event belongs to the world. A reaction out of proportion to it usually belongs to the mirror."],
      ["What it is not", "It is not a claim that everything that happens was caused by you. Illness, accidents, other people's cruelty and plain chance happen to people regardless of their inner state, and the law does not say otherwise. It is not blame: a harm done to someone is not evidence of a fault in them. It is not a mystical exchange between you and the universe, since the mechanism it describes is ordinary: attention, projection and behaviour. And it is not a way to change other people. The only side of the mirror that can be moved is yours."]
    ] },
  { n: "Law of Becoming", b: "You Turn Into What You Repeat",
    r: [
      ["The law", "The law of becoming says you are made by what you repeat. Thoughts returned to often become attitudes, attitudes become behaviour, behaviour becomes character, and character is what your life is the sum of. Identity is not a fixed fact you discover. It is an accumulation, always being added to, in either direction, by the smallest ordinary things."],
      ["How it works", "The law is a chain of four links. Thought: what you dwell on is what your mind rehearses. Attitude: repeated thought settles into a stance, a default way of reading situations. Behaviour: the stance chooses actions before you consciously decide, and those actions are repeated. Character: repeated actions form a recognisable pattern, which you and others then call who you are. Each link feeds back on the one before. Behaviour changes how you see yourself, and a changed self-image changes what feels natural to do next. This is why the process is gradual, and also why it cannot be avoided: there is no neutral setting. Doing nothing in particular is also a rehearsal, of whatever you do by default."],
      ["Direction and scale", "Two features matter. The first is direction: the same mechanism builds in either direction and has no preference between the person you intend to be and the person your defaults describe. The second is scale: it works on small, frequent things more than on large, rare ones, because repetition is the active ingredient, so a minor daily act carries more weight than an occasional major one. Change is therefore usually invisible until it is not. The accumulated difference only shows after a long run."],
      ["Where it operates", "In traits such as patience, honesty, courage and discipline, which are built by use. In skill and competence, which come from repeated practice. In self-image, which follows what you see yourself doing. In how you speak to yourself, which hardens into the voice you live with. In health and the body, which are the sum of repeated choices. In reputation, which other people build from what you repeat. And in direction over years, since the course of a life is mostly the product of small defaults and rarely of single decisions."],
      ["How you can tell", "The law is visible when you look back across a long span and find you are different in ways you never decided, when an act that once took effort now takes none, when you describe yourself with a trait you did not have years ago, or when you react in a way you can trace to something you did constantly. It is visible in reverse when you cannot easily do something you stopped doing long ago."],
      ["What it is not", "It is not instant transformation, and it is not a performance of the person you want to be: the manner without the repeated acts is only costume. It is not a denial of limits, since temperament, circumstances and health set a range within which becoming happens. It does not mean one lapse undoes a pattern, because the pattern is the weight of many acts. And it is not a judgement on who you are now. It describes how you got here and how change happens."]
    ] },
  { n: "Law of Habit", b: "Most of Your Day Is Automatic",
    r: [
      ["The law", "The law of habit says most of what you do is automatic, so your results are the sum of your habits and not of your intentions. A goal states where you want to go. A habit is what actually happens when no decision is being made. Because most of life is lived in that mode, the results of a life are largely the output of its habits."],
      ["How it works", "A habit has a cycle: a cue, a routine and a reward. A cue in a particular setting, such as a time, a place, a mood or a preceding action, triggers the routine without deliberation, and the reward the routine delivers strengthens the link. Repeated enough, the whole sequence moves from effortful to automatic and stops drawing on willpower. That is what makes habits both powerful and quiet: they cost nothing to run and are rarely examined. Habits also compound. A small difference repeated daily becomes a large difference over years, in either direction, because each repetition is the same size and there are so many of them. And habits attach to context. They are held in place by the setting around them and loosen when the setting changes."],
      ["Two kinds of habit", "The law treats habits of action and habits of thought alike. Action habits include sleep, food, movement, spending, work rhythm and how you begin and end the day. Thought habits include how you interpret events, what you tell yourself under stress, what you expect and where your attention goes by default. The second kind is less visible and often more consequential, since it sets the conditions in which the first kind is run."],
      ["Where it operates", "Across health and the body, money and spending, work and output, learning and skill, relationships and the way you treat people when you are tired, and mood and emotional regulation. It operates most where the same thing is done often: the daily and weekly rhythms. It has less to say about rare, large decisions, which are made deliberately and which the law treats as downstream of the habits around them."],
      ["How you can tell", "Results change little despite repeated resolutions. You do something and only afterwards notice you did it. Effort is needed to start things but not to continue things that have become routine. A tired or stressed state sends you back to old behaviour. A familiar setting brings an old pattern back at once. Behaviour that happens regardless of mood is habit. Behaviour that needs a mood is not yet."],
      ["What it is not", "It is not a number. Any figure given for how much of life is habit is an estimate, and any fixed count of days for forming a habit is a rule of thumb, since the time varies widely with the person and the behaviour. It is not a claim that habits cannot be changed, only that change works through the cue and the routine and not through resolve alone. And it is not a statement about which habits are good: the law is neutral, and a bad habit runs as smoothly as a good one."]
    ] },
  { n: "Law of Gratitude", b: "Thanks Is a Mechanism",
    r: [
      ["The law", "The law of gratitude says appreciation, truly felt and specific, changes your position. You see more of what you have, you stand differently toward other people, and, on the fuller version of the law, more good arrives for a person who is thankful than for one who is not. In its short form it is the law of increase: what is appreciated grows."],
      ["How it works", "It works on two levels. At the first, ordinary and observable, gratitude redirects attention. The mind scans by default for what is missing or wrong, and thanks reverses the scan: what is already present comes into view, and the sense of lack that drives comparison, grasping and complaint is eased. People who notice what they have tend to feel more settled, relate more warmly and cope better, and that changes how they behave. At the second level, on the fuller version of the law, thankfulness is described as a condition for receiving more. It keeps you in the frame of abundance and out of the frame of lack, and a person in that frame acts, sees and draws differently. The first level can be observed. The second is a claim of the tradition this law belongs to."],
      ["What counts as gratitude", "The law distinguishes thanks from politeness. Gratitude in its sense is specific, a particular thing named. It is felt, not recited. And it is directed, toward a source, whether a person, a circumstance or the world at large. A general feeling of being fortunate is weaker than the precise recognition of one thing and how it came to be there."],
      ["Where it operates", "In how you relate to what you already have, including health, home, work, skills and the people around you. In relationships, where thanking and being thanked both change how people treat each other. In how you meet difficulty, since gratitude coexists with hardship and changes its weight. In money and abundance, where it addresses the sense of never having enough. And in mood, where it works against the habit of scanning for what is wrong."],
      ["How you can tell", "The law is working when you notice good things in an ordinary day without being prompted, when comparison with other people has less hold on you, when a setback is held alongside what remains, and when you can name what you have received from people and circumstances you did not choose. It is absent when everything good is explained as deserved and everything bad as taken."],
      ["What it is not", "It is not contentment with a situation that ought to change. Thanks for what is present is compatible with wanting more and working for it. It is not forced positivity or the denial of pain. It is not a transaction in which thanks buys results, since gratitude performed in order to obtain something is not gratitude. And it is not a duty to feel thankful for harm done to you."]
    ] },
  { n: "Law of Autosuggestion", b: "Repeat It Until It Is Believed",
    r: [
      ["The law", "The law of autosuggestion says that what you repeat to yourself, with attention and feeling, is taken in by the part of the mind that runs belief and habit, and then shapes what you expect and do. It is already operating all day: the running commentary in your head is suggestion, and most of it was never chosen. The law is the claim that it can be directed."],
      ["How it works", "The mind is treated as having two layers: a conscious one that reasons and evaluates, and a deeper one that accepts what is impressed on it by repetition and emotion, without cross-examining it. A statement that enters through reasoning gets argued with. A statement that arrives repeatedly, calmly and with feeling passes under the argument and settles. Once settled it acts as a premise: it colours what you notice, supplies a default response and sets your sense of what is possible. Three conditions are named for it to take. Repetition, since a single occurrence does not register. Emotion, since feeling marks something as important. And a receptive state, usually calm or relaxed, when the mind is least inclined to resist."],
      ["Where suggestions come from", "There are two sources, and the law treats them alike. The first is what you give yourself on purpose, in words or in images. The second is what you absorb without choosing: what you were told as a child, what the people around you say, what you hear repeatedly in the media and, most of all, what you tell yourself in moments of stress. The unchosen kind outnumbers the chosen kind by a wide margin, which is why a deliberate suggestion has to work against an existing body of material."],
      ["Where it operates", "In self-belief, meaning what you assume about your ability, worth and prospects. In performance, where inner statements before and during an effort shape the result. In confidence and anxiety, which follow the inner script. In health and recovery, where expectation affects experience. In habits, since the story attached to a behaviour holds it in place. And in goals, where the way you describe the aim to yourself influences how real it feels."],
      ["How you can tell", "A phrase you say about yourself without thinking, repeated across years. An automatic reaction of I can't or I always that arrives before any reasoning. A feeling about a situation that comes before the facts. A belief that cannot be traced to evidence but is held firmly. A suggestion that has taken hold feels like a fact about you and not like something you were told."],
      ["What it is not", "It is not the repetition of any sentence regardless of belief. A statement sharply at odds with what you believe provokes an argument and can leave you feeling worse, so for a suggestion to settle it has to be one you can at least partly accept. It is not a replacement for action or evidence. It is not hypnosis or a way of controlling other people. And it is not a guarantee, since it changes expectation and state rather than external facts directly."]
    ] },
  { n: "Law of Momentum", b: "Motion Begets Motion",
    r: [
      ["The law", "The law of momentum says effort compounds. A thing in motion tends to stay in motion and a thing at rest tends to stay at rest, so beginning is the costly part, continuing is cheaper, and a run is easier to keep than to rebuild once it breaks. Progress made becomes a force that carries the next piece of progress."],
      ["How it works", "Momentum is made of several effects that stack. Inertia: starting uses the most energy because the initial resistance is the greatest, and each repetition lowers it. Evidence: motion produces proof that the thing is possible, which reduces doubt and fear. Proximity: the closer you are to a finish, the faster effort tends to come, and a visible gain makes the remainder look achievable. Identity: sustained activity changes how you see yourself, as a person who does this. Continuity: a streak creates a reluctance to break it. Combined, they make a started thing self-reinforcing. The same effects run in reverse. A stop makes a restart costlier, doubt accumulates through inaction, and a broken run can feel like proof of failure."],
      ["Two directions", "Momentum has no preference. Positive momentum builds on progress and negative momentum builds on avoidance, and both are self-reinforcing. A drift in either direction tends to continue until something interrupts it, and the force needed to reverse a long run in the wrong direction is considerably greater than the force needed to prevent it early."],
      ["Where it operates", "In work and projects, where the first steps cost most. In physical training and health, where the early sessions are the hardest. In learning, where fluency makes further learning easier. In money and savings, where early accumulation compounds. In relationships and communication, where regular contact keeps a connection easy and silence makes it harder. In confidence and mood, which build on small wins. And in recovery from setbacks, where the first move after a stall decides whether the stall becomes a stop."],
      ["How you can tell", "A task that was dreaded becomes easy once begun. A gap of a few days makes returning disproportionately hard. Success makes the next success feel more likely. A run of avoidance makes the next avoidance feel normal. The size of the step needed to restart grows with the length of the gap. The sense of getting into it is the law."],
      ["What it is not", "It is not physics applied to people. The name is an analogy, and the effect is psychological and behavioural. It is not a guarantee that a good run continues, since the perception of streaks can be exaggerated and stopping can be the right decision. It is not an argument against rest. And it does not require the first step to be large. The law's point is that the beginning is small and its effects are not."]
    ] },
  { n: "Law of Clarity", b: "Know the Target Before You Move",
    r: [
      ["The law", "The law of clarity says a vague want gets a vague result. Knowing exactly what you want, in what form, by when and why, is where everything else begins, because it is what allows choices, effort and attention to be pointed at one thing. Clarity does not make the outcome arrive. It makes the rest of your activity relevant to it."],
      ["How it works", "A clear aim does four things. It filters: with a defined target, options can be accepted or refused against a standard, so decisions come faster and fewer are regretted. It directs attention: you notice what bears on the aim and discount what does not. It enables measurement: you can tell whether you are closer, which makes adjustment possible and progress visible. And it makes commitment possible, since you cannot commit to something you cannot describe. A vague aim does the opposite on all four. Everything seems relevant, nothing can be refused, progress cannot be judged and effort scatters."],
      ["What clarity contains", "Clarity is made of several components. What: the specific outcome, described concretely enough that two people would agree on whether it had been reached. When: a date or a period. Why: the reason it matters, which supplies endurance when it gets hard. What it costs: what you will give up, since every aim displaces others. And what done looks like: the point at which it is finished. An aim missing any of these is partly vague, and the missing part is where effort usually leaks."],
      ["Where it operates", "In goals of every size, from a day's work to a decade. In career and direction, where clarity about what you want from work decides which opportunities are visible. In money, where a specific figure and purpose behave differently from a general wish to have more. In relationships, where knowing what you want and what you will not accept shapes who and what you choose. In health, where a defined standard replaces a general intention to improve. And in decisions of any kind, which are easier against a clear criterion."],
      ["How you can tell", "Its absence shows as constant busyness without a sense of progress, difficulty choosing between options that are all fine, goals described in general terms such as more, better or someday, a feeling of being pulled in several directions, and difficulty saying when you would be satisfied. Its presence shows as decisions that come quickly against a standard, a want you can state in a sentence, and progress and failure that are both recognisable."],
      ["What it is not", "It is not a rigid plan. The aim can be exact while the route stays open, and the aim can be revised as you learn. It is not certainty about everything: early on, a direction is clearer than a target, and the law applies at whatever level of detail is currently knowable. It is not a promise that the specified outcome occurs. And it is not the same as having many goals, since many specific goals can scatter attention as readily as one vague one."]
    ] },
  { n: "Law of Attention", b: "What You Watch Grows",
    r: [
      ["The law", "The law of attention says what you give your attention to grows in your life. It grows first in your mind, since attention decides what you notice, what you remember and what you act on. A life is in large part the record of where attention went. The stronger form of the law, that attention itself causes more of the attended thing to arrive, goes beyond what attention is known to do and is the part to hold lightly."],
      ["How it works", "Attention is selective. At every moment far more reaches the senses than can be processed, and attention chooses what gets through. What is attended is encoded, remembered and available to act on. What is not attended is largely missed, even when it is in plain view. This gives attention three effects. Perception: you see more of whatever you have been attending to, which makes it seem to multiply. Memory: attended things are retained, so the record of your life is weighted towards them. Action: you act on what you have noticed, so attention steers behaviour, and behaviour steers results. Because it repeats, attention also sets habit: where it goes by default becomes where it goes automatically."],
      ["Attention as a resource", "Attention is limited and spent continuously. Giving it to one thing takes it from another, so what you choose not to look at is as formative as what you look at. It is also contested. Much of the environment, including media, devices and other people's demands, is built to capture it, so a large share of what receives your attention does so without your choosing. The law is therefore partly about who is directing it."],
      ["Where it operates", "In mood, which follows what you dwell on, whether threats, losses, possibilities or what is present. In work, where the quality of what you produce follows the depth of attention you bring. In relationships, where being attended to is among the strongest signals of regard. In opportunity, since you can only act on what you notice. In money and spending, which follow what you look at and what you are shown. In learning and memory. And in worry, where attention fixed on a feared outcome rehearses it."],
      ["How you can tell", "A new word, product or idea seems to be everywhere once you have noticed it. Two people in the same place describe different events. Your mood changes with what you scroll or discuss. Hours pass with nothing retained. You find evidence for whatever you are looking for. The mark of the law is that the world appears to change when only the focus has."],
      ["What it is not", "It is not a claim that focusing on something creates it. Attention changes experience and choices, not what exists. Looking away from a danger does not remove it, and focusing on a debt does not shrink it. The popular explanation through a particular brain structure is a loose gloss and not an established mechanism for attracting outcomes. And it is not a demand to think only positive thoughts: attention given honestly to a difficulty is the beginning of dealing with it."]
    ] },
  { n: "Law of Mentalism", b: "Everything Starts in Mind",
    r: [
      ["The law", "The law of mentalism says that mind comes first. Everything you experience arrives through mind, is shaped by mind and is, in the strongest form of the law, made of mind. In its practical form it says that the inner world precedes and frames the outer one: what you think, expect and believe decides how reality is received and, over time, what you do with it."],
      ["How it works", "The law can be held at three strengths, and it helps to keep them apart. The first is perception. You never meet the world directly. You meet it through attention, interpretation and memory, so what reaches you is already a mental construction, and two people in the same place live in different worlds. The second is action. Thoughts and expectations come before behaviour, behaviour comes before results, so mind sits at the head of every chain of cause in a life. The third is the metaphysical claim, that the universe itself is mental and that individual minds are inside a larger one. The first two can be observed in ordinary life. The third is a doctrine, and the law's practical force does not depend on it."],
      ["Three strengths of the claim", "Perception is the weakest claim and the hardest to dispute: experience is mind-made. Causation is the middle claim: mind drives behaviour and so outcomes. The metaphysical claim is the strongest and the least testable. A reader can accept the first two completely and leave the third alone, and the law still describes how a life is formed. The law is often argued as though the three were one, which is where it begins to promise more than it can show."],
      ["Where it operates", "In how you interpret events, which colours their effect on you more than the events themselves. In self-image, which is a mental model that behaviour follows. In expectation, which shapes effort and persistence. In relationships, where each person is dealing with their own picture of the other. In decisions, which are made from the options your mind presents as possible. And in belief about what is real and possible, which sets the edge of what you attempt."],
      ["How you can tell", "The law is at work when two people describe the same event in different terms and both are sincere, when a change in mood changes how the same circumstances look, when a settled belief about yourself proves hard to dislodge with evidence, and when what you think is possible turns out to have been a limit of imagination and not of the situation. A reaction that arrives before the facts have been checked is the mind at work."],
      ["What it is not", "It is not the claim that thinking alone changes the physical world. Mind shapes perception, behaviour and choice, and those change outcomes. It does not dispose of illness, accident or other people's actions by an act of thought. It is not an argument that nothing outside the mind exists, and a reader does not have to take the metaphysical form to use the practical one. And it is not a reason to dismiss circumstances, since a mind and its situation act on each other."]
    ] },
  { n: "Law of Vibration", b: "Everything Moves",
    r: [
      ["The law", "The law of vibration says that nothing is at rest and that everything is energy moving at some frequency. Objects, thoughts, emotions and people are all held to vibrate, each at its own rate, and what is similar in frequency resonates and what is different does not. The law is used to say that your inner state has a frequency, and that your state and the things around you influence each other through it."],
      ["How it works", "The law runs on resonance. Where two things vibrate at the same or compatible frequencies, they reinforce each other. A dominant emotional state, such as calm, fear, resentment or enthusiasm, is described as a frequency, and the claim is that you tend to be drawn toward, and to draw, what matches it: certain people, certain moods, certain kinds of event. Raising or lowering your state therefore changes what you are in tune with. In ordinary terms the effect is real as a matter of mood and behaviour: people pick up each other's states, a calm person calms a room, and a person in a fixed state notices and creates matching situations. The wider claim, that thoughts are measurable frequencies acting at a distance, is the part the law asserts and does not demonstrate."],
      ["Frequency as a figure of speech", "Physics does say matter is in constant motion at the atomic scale, and that sound, light and electromagnetic waves have frequencies. The law borrows that vocabulary for feelings and thoughts, where it works as metaphor. When it says a state is high or low it means expansive or contracted, open or closed, and these terms mark real differences in how a person feels and behaves. Taken as metaphor the law is a way of describing states. Taken as literal physics it becomes a claim that has not been measured."],
      ["Where it operates", "In mood and emotional states, which are the law's most direct subject. In relationships and groups, where the state of one person spreads. In environments, which carry a tone that people tend to take on. In performance, where nervous or settled states change what a person can do. In health, where stress and calm are linked to how the body feels. And in what you are drawn to, such as people, places, media and activity, which tend to match your state at the time."],
      ["How you can tell", "The law is visible when a change of state changes what you notice and what you want, when entering a room changes your mood without a word being said, when you feel pulled toward certain people when you are in one state and away from them when you are in another, and when being in a fixed state makes every event seem to confirm it. The sense of being in tune, or out of tune, with a person or a setting is what the law points at."],
      ["What it is not", "It is not a measured physical force acting between thoughts and events. The vocabulary is borrowed from physics and does not carry physics' authority with it. It is not a guarantee that a high state draws good outcomes, and it does not dissolve circumstances you did not create. It is not a demand to feel good constantly, since a state that is forced is a strained state, not a settled one. And it does not say that low states are failures: they are part of how states move."]
    ] },
  { n: "Law of Polarity", b: "Everything Has Two Poles",
    r: [
      ["The law", "The law of polarity says that everything exists on a scale with two ends. Hot and cold, love and hate, courage and fear, light and dark are not separate things but opposite ends of the same thing, differing in degree. Since they are one scale, a thing can be moved along it, and what looks like a fixed opposite is a position that can change."],
      ["How it works", "If opposites are ends of one scale, three consequences follow. First, a quality can be shifted without being fought. Cold is not destroyed but warmed, and the way to move toward courage runs along the same line as fear, not against a wall. Second, an extreme tends to carry its opposite within it: strong attachment sits close to strong aversion, and the intensity of one is a measure of how close the other lies. Third, both poles are needed to define each other. A person can only know joy against some knowledge of sorrow, and a quality with no counterpart has no edge. The law asks you to see the pair as one thing and to work on the degree, not on the opposition."],
      ["Moving along the scale", "The practical form of the law is a change in position. Where an unwanted state is at one end of a scale, the wanted state is at the other, and the movement between them is a series of small steps along the same line, not a leap into a different category. This is why an extreme view can reverse into its opposite more easily than it can settle into the middle, since both belong to the same intensity."],
      ["Where it operates", "In emotion, where states such as fear and confidence, anger and calm, sadness and joy sit on shared scales. In belief, where strongly held views are tied to their opposites. In relationships, where love and resentment are often close neighbours and a strong feeling of one can turn into the other. In character, where a strength has a shadow at its far end, such as confidence and arrogance. In judgement, where good and bad are often positions on a scale of degree. And in outcomes such as success and failure, which are points on one path."],
      ["How you can tell", "Signs of the law: an opposite feeling shows up at the height of a strong one, a trait taken to an extreme turns into its reverse, you find yourself unable to define one thing without the other, a quality you dislike in someone turns out to be an excess of one you admire, and the difference between two states turns out to be a matter of degree when you look closely."],
      ["What it is not", "It is not the claim that every difference is only a matter of degree. Some distinctions are real and not a scale, and the law does not make cruelty and kindness equivalent because they can be placed on a line. It is not a reason to treat a harm as the other end of a good. It does not say that a change of degree is easy or that a trait can be moved on will alone. And it is not a licence to dissolve judgement: seeing two ends of a scale is compatible with preferring one of them."]
    ] },
  { n: "Law of Rhythm", b: "Everything Flows Out and In",
    r: [
      ["The law", "The law of rhythm says that everything moves in cycles. Tides rise and fall, seasons turn, energy, mood, markets, attention and fortune all swing from one side to the other and back, and the extent of a swing in one direction is matched by its extent in the other. Nothing rises without a return, and nothing falls without a recovery."],
      ["How it works", "A rhythm has a pattern with three features. It has a period: the time a full swing takes, which can be hours, years or generations. It has an amplitude: how far it swings each way. And it has a pendulum quality, in which the farther a thing is pushed in one direction, the harder it comes back. The law claims that these are properties of nearly everything, so a state you are in at any time is a point on a swing and not a permanent condition. A high tends to be followed by a low, a low by a rise, and the best preparation for either is knowing the swing is under way. The law also holds that a person can rise above the swing by not being carried to the far end of it, so that the return does not land with full force."],
      ["Riding and resisting", "A person can relate to a rhythm in two ways. They can be carried by it, feeling each swing as a change in the world, or they can watch it and take it into account, as a sailor takes the tide. The second does not stop the swing. It changes how much of it you take on and what you do at each stage. The law treats most unhappiness and overreach as the result of mistaking a point on a swing for a permanent state."],
      ["Where it operates", "In energy and mood, which rise and ebb through a day and over longer spans. In work and effort, where bursts of drive alternate with periods of recovery. In fortune, where good and hard periods follow one another. In relationships, which move between closeness and distance. In markets and economies, which expand and contract. In attention and motivation, which come and go. And in life stages, which have their own long arcs."],
      ["How you can tell", "The law is visible when you look back and see that a low period was followed by a rise you did not expect, when a period of ease invites a lapse, when the same time of day, week or year is reliably high or low for you, and when overreaching in one direction is followed by a matching swing in the other. If you notice you are at an extreme, the law says to expect the return."],
      ["What it is not", "It is not a prediction of when things will change, since the period of a rhythm is often unknown. It is not a promise that a bad period ends soon or that a good one lasts. It does not say every pattern is a cycle, because some changes are one-way, and it does not excuse inaction on the grounds that things will turn. And it is not a reason for detachment from outcomes: it describes the shape of change and leaves the choices to you."]
    ] },
  { n: "Law of Cause and Effect", b: "Nothing Happens by Chance",
    r: [
      ["The law", "The law of cause and effect says that every effect has a cause and every cause has an effect, and that nothing in a life is outside the chain. What looks like chance is a cause that has not been recognised. What you do, say and think enters the chain and returns in some form, often later and from a direction you did not expect. In its moral form, as karma, it says that actions return in kind."],
      ["How it works", "The law operates through four kinds of link. The first is mechanical: an action produces a direct, visible result. The second is behavioural: what you do changes how others treat you, which changes what happens next. The third is habitual: repeated actions harden into character, and character produces outcomes. The fourth is the moral claim of the law, that the quality of an action, whether kind or harmful, returns to the person who did it. The first three can be observed. The fourth is held on trust. What the law insists on, across all four, is that effects are not random and that a result worth having or avoiding can be traced to what led to it."],
      ["The lag", "Cause and effect are not always close in time. A result can come years after its cause, which breaks the connection in the mind: the effect arrives and is read as luck, good or bad. Much of what is attributed to chance is a long chain that was not followed back. The longer the lag, the more a person is tempted to deny that a link exists, and the more important it is to look for causes upstream."],
      ["Where it operates", "In habits and health, where small repeated actions add up. In money, where decisions made long ago shape the present. In relationships, where how you have treated people comes back. In work and reputation, where the quality of what you have done is remembered. In learning, where practice produces skill. In the choices you make under pressure, which reflect earlier ones. And in what you call luck, which is often a chain you cannot see from where you stand."],
      ["How you can tell", "The law is visible when an outcome you did not expect turns out to follow from a decision you made much earlier, when a pattern of treatment toward you matches a pattern of treatment from you, when an effect you want is clearly the result of something done repeatedly, and when a problem that seemed to come from nowhere has a traceable source. A reliable sign is the sentence, I should have seen that coming."],
      ["What it is not", "It is not a claim that everything that happens to a person was earned. Many causes are outside your control, and the law does not say you caused them. It is not an argument that good actions are always rewarded promptly or that suffering is always deserved. It is not a guarantee of fairness. And the moral form of the law, that actions return in kind, is a belief and not a demonstrated mechanism, though the first three kinds of link are ordinary and observable."]
    ] },
  { n: "Law of Gender", b: "Two Principles in Everything",
    r: [
      ["The law", "The law of gender says that two principles are present in everything, an active one that projects, initiates and directs, and a receptive one that gathers, holds and gives form. Every act of creation needs both. This is a law about the two principles, not about men and women, and it places both of them within each mind and each person."],
      ["How it works", "Creation, on this law, is a partnership between two movements. The active principle supplies the impulse: the idea, the decision, the push. The receptive principle supplies the conditions for it to develop: the incubation, the patience, the taking in, the shaping. An impulse with no receptive phase is quick and shallow, and a receptive phase with no impulse is full of material and goes nowhere. The two are not opposed but sequential, and a creative person alternates between them. The law is used to explain why effort alone does not complete work and why waiting alone does not either, and why a balance of direction and receptivity is the working condition of anything made."],
      ["The two principles", "The active principle is associated with will, direction, expression and the outward movement of attention. The receptive principle is associated with imagination, intuition, listening and the inward movement of attention. In each person both are present in some proportion, and a life tends to go wrong where one has been cultivated and the other neglected: relentless drive with no receptivity, or endless reflection with no action. The words masculine and feminine are used as names for the two, and they describe functions and not people."],
      ["Where it operates", "In creative work, where an idea has to be taken in and developed before it is carried out. In decision-making, where information gathering and decisive action alternate. In learning, where intake and application both matter. In relationships, where directing and receiving are both needed. In leadership, where setting a course and listening are both required. In rest and effort, which alternate. And in any project that moves from conception to completion."],
      ["How you can tell", "The law is visible when a project stalls because only one phase is being done, when the best work follows a period of stillness, when a person who acts constantly has no depth and one who reflects constantly has no output, and when a good result comes from an idea that was allowed to stay unfinished for a while. Needing both a push and a pause is the law at work."],
      ["What it is not", "It is not a statement about sex or gender roles, and it does not assign activity to some people and receptivity to others. It is not a description of any person's identity. It is not an argument for passivity or for relentless activity. It does not claim that the two principles are equal at every moment, since a task may need one far more than the other. And the language of masculine and feminine is figurative: a reader can use the law without taking on the vocabulary."]
    ] },
  { n: "Law of Divine Oneness", b: "Everything Is Connected",
    r: [
