      ["The law", "The law of divine oneness says that everything is connected. People, living things, events and thoughts are not separate units but parts of one whole, so that what you do to any part acts on the whole, and on you. Separation is how things appear from within one point of view. Underneath it, on this law, there is a single field of which you are a part."],
      ["How it works", "The law can be held at three levels. The first is the connection between people: what you do affects others, and what they do affects you, in chains too long to see. The second is the connection with the living world and the environment, in which human activity and natural systems act on each other. The third is the claim that consciousness is shared, so that individual minds are expressions of one. The first two are visible in ordinary life. The third is a doctrine, held on trust. On any of the three, the law moves the centre of ethics away from the isolated self: harm to another is harm within the whole, help to another is help within the whole."],
      ["What changes when it is taken seriously", "The law changes the question you ask about an action. Instead of asking what a choice does for you, it asks what it does across everything it touches, including you later. It changes how you see rivals and strangers, who stop being outside you and become other parts of what you belong to. And it changes how separate your problems look: the sense of being alone in a difficulty is, on this law, a feature of the point of view and not of the facts."],
      ["Where it operates", "In relationships, where each person's actions are part of a shared system. In family and community, where behaviour spreads from one person to the next. In work and organisations, where teams succeed and fail together. In ethics, where the interests of others are treated as bound up with yours. In the environment, where what is taken or given back circulates. In belief about what you are, and in how you see strangers and enemies."],
      ["How you can tell", "The law is visible when an act of kindness or harm comes back through a route you did not expect, when you feel another person's state as though it were partly yours, when a decision turns out to have effects far beyond the one you had in mind, and when the line between your good and another person's good proves hard to hold. The sense of belonging to something larger is the experience the law is named for."],
      ["What it is not", "It is not a claim that everyone is the same or that differences do not matter. People remain distinct, with their own responsibilities and boundaries. It is not a duty to absorb other people's suffering as your own, and it is not a reason to tolerate harm because everything is connected. The metaphysical form, that all is one consciousness, is a belief and not an established fact. The ethical form, that actions spread beyond the self, is ordinary and observable."]
    ] },
  { n: "Law of Attraction", b: "Like Draws Like",
    r: [
      ["The law", "The law of attraction says that like is drawn to like. The quality of your dominant thoughts and feelings, held over time, is said to draw matching people, opportunities and circumstances toward you. What you give sustained attention and emotion to tends to arrive. The law is the most widely known of the group and the most often overstated."],
      ["How it works", "The law is held at two levels. The first is ordinary and describable. What you think and feel decides what you notice and where you place your attention. It decides what you do, which opportunities you take up, how you present yourself and the kind of people you spend time with. A person who dwells on possibility acts and sees differently from one who dwells on threat, and the results diverge. The second level is the stronger claim, that the universe responds directly to your inner state and that matching events are drawn to you from outside your own actions. The first level is observable. The second is the doctrine of the law, and it is the one that has not been shown. The law's usual formula has four parts: focus on what you want, feel it as present, believe it is possible, and take action that fits."],
      ["What attracts", "The law distinguishes what you want from what you are. Wanting a thing intensely while being, in your daily state, in the opposite of it is said to attract the state and not the object. What draws is the dominant, repeated state and not the stated wish. This is why the law is usually joined to ideas about belief and feeling: a thought you hold without feeling is weak, and a thought you hold against a stronger belief is cancelled by it."],
      ["Where it operates", "In relationships, where the way you carry yourself shapes who approaches you and how they respond. In work and opportunity, where focus and expectation decide what you notice and pursue. In money, where attitudes to having and spending are acted on daily. In health and mood, where expectations feed into how you feel. In circumstances that seem to repeat, since the law reads repetition as a sign of a persisting state. And in goals, where sustained attention shapes the steps taken."],
      ["How you can tell", "The law is at work when a topic you have been attending to suddenly appears everywhere, when people matching your own mood tend to turn up, when a dominant outlook seems to be confirmed by events, and when a change in outlook is followed by a change in what comes your way. The law reads these as attraction. A plainer reading puts them down to attention and behaviour, and the two are not easy to separate."],
      ["What it is not", "It is not wishing. A wish held without belief, action or a matching state is not what the law describes. It is not a substitute for effort, and it does not claim that thought alone moves events. It does not apply equally to circumstances people did not choose, and it cannot be used to explain illness, loss or injustice as something drawn by the person who suffered them. And its stronger form, that the universe directly responds to your inner state, is a belief and not a demonstrated effect."]
    ] },
  { n: "Law of Inspired Action", b: "Move When the Impulse Comes",
    r: [
      ["The law", "The law of inspired action says that intention is completed by action, and that the right action tends to arrive as an impulse, an idea or a sense of direction, not as the product of forcing. Thought alone does not finish anything. Effort alone, driven by pressure, misses the mark. Inspired action is the movement that follows a clear intention when the next step presents itself and is taken."],
      ["How it works", "The law is a sequence with four stages. First an intention is held clearly. Second, over time, impulses arise that relate to it: an idea, a hunch, a name that comes to mind, an invitation, a pull toward one choice. Third, the person acts on them, usually in small, immediate steps. Fourth, the result of the action feeds back and produces the next impulse. The law distinguishes this from forced action, which is effort applied by strain and from fear, and from inaction, which waits for something to happen without moving. What it treats as inspired is movement that feels like a natural next step, carries energy and is often easier than expected. On the ordinary reading, it describes how attention to a goal produces ideas about it and how acting on them produces momentum."],
      ["Telling inspired from driven", "The law needs a way to tell inspired action from the other kinds. Inspired action tends to feel clear and light, comes with energy, and is specific, a particular step to take now. Driven action tends to feel heavy, anxious and general, a sense that more must be done. Avoidance often disguises itself as waiting for inspiration, and the law's answer is that inspiration usually arrives while you are already moving, not in advance of it."],
      ["Where it operates", "In creative and professional work, where the next step often becomes clear only after the previous one. In opportunity, where an idea or a conversation turns out to open a path. In relationships, where an impulse to reach out is acted on or ignored. In learning, where curiosity points to what to study. In decisions under uncertainty, where a sense of direction guides where reasoning has run out. And in carrying out a plan, where the plan needs adjusting as the path appears."],
      ["How you can tell", "The law is visible when an idea about a goal comes unprompted and proves useful, when taking a first step makes the second obvious, when a pull toward a particular action turns out to have been right, and when the same plan pursued by force goes badly while a lighter approach works. It is also visible in reverse, when an impulse was ignored and the opportunity passed."],
      ["What it is not", "It is not a reason to wait for inspiration before acting, and it does not say that action should only be taken when it feels good. Much necessary work is not inspired and still has to be done. It is not a claim that every impulse is wise. And it does not replace planning, judgement or evidence. It describes the interplay of intention and movement, and leaves open how much of the impulse comes from outside and how much from your own mind."]
    ] },
  { n: "Law of Perpetual Transmutation of Energy", b: "Energy Never Stays One Thing",
    r: [
      ["The law", "The law of perpetual transmutation of energy says that energy is never fixed in one form. It is always passing from one state to another, and a person, being made of energy and directing it, can change the form it takes. Thoughts become feelings, feelings become actions, actions become circumstances, and each can be altered at the point where it turns into the next."],
      ["How it works", "The law treats a life as a flow of energy in many forms: attention, emotion, effort, money, time. At each moment this energy is being converted. Thought into feeling, feeling into behaviour, behaviour into result, result into the next thought. Because the flow never stops, no condition is permanent: a state that seems fixed is a form that is being maintained by the energy still being fed to it. Withdraw the feeding and it changes, redirect it and a new form appears. The law holds that the person has the most leverage at the conversion points, where a thought is turned into a feeling or a feeling into an act. Changing the form there changes everything downstream."],
      ["Blocked and flowing energy", "The law distinguishes energy that moves from energy that is stuck. Unprocessed emotion, avoided decisions, unfinished tasks and suppressed feeling are described as energy held in a form that cannot convert: it remains charged and shows as tension, irritability or stagnation. Energy that has somewhere to go, such as action, expression or rest, converts and clears. The law ties well-being to free movement and not to any particular state."],
      ["Where it operates", "In emotion, where a feeling that is allowed to move passes and one that is held persists. In effort and creativity, where energy is converted into work. In money, which is described as stored effort that can be turned back into time or opportunity. In habits, where a pattern is maintained by the energy continually given to it. In health and fatigue, where energy is spent and restored. In change of any kind, since the law reads change as a conversion and not a creation from nothing."],
      ["How you can tell", "The law is visible when a strong feeling turns into action and the feeling eases, when a state of stagnation lifts after something is finally done, when the energy you were spending on worry becomes available once the worry is acted on, and when a persistent pattern disappears once you stop maintaining it. The sense of something shifting form, not vanishing, is the mark of the law."],
      ["What it is not", "It is not the physical law of conservation of energy, though it borrows the vocabulary: that law is about measured quantities and says nothing about thoughts or fortunes. It is not a claim that you can convert any state into any other at will. It is not a technique for turning bad situations into good ones by thought. And it does not say that energy is unlimited: effort and attention are finite, and the law's point is that they move, not that they are free."]
    ] },
  { n: "Law of Compensation", b: "What You Give Returns in Kind",
    r: [
      ["The law", "The law of compensation says that what you put out comes back in matching form and measure. Value given returns as value received, effort returns as reward and care returns as care. It is the law of cause and effect as it applies to what you give and receive: the return is in proportion to the giving, though not always from the person you gave to or at the time you expect."],
      ["How it works", "The law operates on the idea of an exchange that runs through the whole of life and not only through each transaction. Contribution builds standing: those who consistently add value become known for it, and the return arrives through reputation, trust, opportunity and income. Care taken is returned in loyalty. The law adds three refinements. The return is proportionate: a small giving brings a small return and a large one a large return. It is indirect: it often arrives from a different source than where it was sent. And it is delayed: the interval between giving and return can be long and is not predictable. The law's claim is that over a long enough span the account balances, and that anyone who tries to take more than they give is drawing against it."],
      ["The accounts", "The law can be read as a set of accounts that are running at once. There is a material account, in which work and value return as pay and resources. There is a social account, in which treatment of people returns as how they treat you. There is a personal account, in which effort and discipline return as skill and character. A person can be in credit in one and in debit in another, which is why the law often seems to fail: a return arrives in a different account from the one being watched."],
      ["Where it operates", "In work and income, where output and value tend to be rewarded over time. In business, where the value delivered to customers decides what comes back. In relationships, where generosity and neglect are both returned. In reputation, which is built from many small contributions. In learning, where investment in skill returns as ability. In health, where care of the body returns as energy. And in how you treat others when nothing is owed."],
      ["How you can tell", "The law is visible when a person known for giving is helped without asking, when work done well years ago produces an unexpected opening, when someone who takes more than they give finds the goodwill running out, and when a reward arrives that matches an effort you had forgotten. The sense that things have evened out is what the law names."],
      ["What it is not", "It is not a guarantee of fairness. People are sometimes rewarded beyond their giving and sometimes not rewarded at all, and the law does not claim every account balances in this life. It is not a transaction in which giving buys a return, since giving done in order to receive is a different act. It does not mean that suffering is owed, or that those in hardship gave too little. And it does not tell you when or from where a return will come."]
    ] },
  { n: "Law of Relativity", b: "Everything Is Measured Against Something",
    r: [
      ["The law", "The law of relativity says that nothing is good or bad, large or small, easy or hard in itself. Things take their meaning from what they are compared to. An event is difficult against an expectation of ease and mild against an expectation of disaster. The same facts can feel like loss or gain depending on the reference point you hold, and the reference point can be changed."],
      ["How it works", "Every judgement involves a comparison, though the comparison is often hidden. A salary is high or low relative to a previous one, to a peer's, to a need. A setback is large or small relative to what you have faced and what you expected. The law identifies three sources of reference: the past, in which you compare against what used to be; other people, against whom you compare in the present; and the imagined alternative, the version that did not happen. Because the comparison decides the feeling, and not the fact alone, changing the comparison changes the feeling. Moving the frame from what is missing to what could have been lost, or from others' standards to your own earlier position, alters how the same circumstance is experienced without altering the circumstance."],
      ["Adaptation", "The law has a time component. A new condition, good or bad, becomes the new reference point, so that what once felt remarkable becomes ordinary and what once felt unbearable becomes a baseline. This is why changes in circumstances often produce less lasting change in feeling than expected: the comparison moves with you. The law treats this as built into how experience works, and as a reason to look at what the reference points are as well as at what happens."],
      ["Where it operates", "In satisfaction and contentment, which depend on what you compare yourself with. In setbacks and loss, whose weight depends on what you expected. In success, whose feeling fades as the new level becomes normal. In money and status, where others' positions set your own sense of enough. In relationships, where expectations decide what counts as a failing. In difficulty, where a harder experience in the past changes how a present one is felt. And in decisions, where options are judged against each other."],
      ["How you can tell", "The law is visible when something feels very different after a change in what you were comparing it to, when a gain stops feeling like one, when a loss feels lighter after a worse one, when a person with less is content and a person with more is not, and when the same situation is described very differently by two people with different histories."],
      ["What it is not", "It is not the claim that everything is equal or that all judgements are arbitrary. Some conditions are objectively harmful whatever the reference point, and a change of frame does not remove hunger, pain or injustice. It is not a way of talking yourself out of a real problem. It does not say that comparison can be turned off. And it is not a reason to stop wanting more: a reference point can be useful for judging progress, not only for managing feeling."]
    ] }
];

/* A BOOK'S LAWS ARE THE LAWS IT NAMES, READ THE SAME WAY AS THE LAWS TAB.
   Five passages and no more: what the law is, how it works, where in a
   life it operates, how you can tell it is operating and what it is not.
   No origin, no research, no exercise and no scenario, for the reason
   written above LAWS; the page already says which book it is, so each
   entry speaks for the book and says what the book holds. Only laws and
   principles the book actually states are here, under the book's own
   name for them where it has one. Where a book gives its teaching as
   principles and not as laws, they are written the same way and are not
   renamed to look like laws. */
var BL = {
  devil: [
    { n: "Cosmic Habitforce", b: "The Force That Holds Every Habit",
      r: [
        ["The law", "Cosmic habitforce is the book's name for the force that fixes everything in the pattern it has settled into. The planets keep their orbits, the seasons keep their order and, on the book's account, a person keeps the habits and thoughts they have repeated. Once a pattern is set, the force holds it in place, and it holds good patterns and bad ones with equal strength."],
        ["How it works", "The book describes habit as something larger than personal discipline. Each repeated thought or act is taken up by the force and given permanence, so the longer a pattern runs, the more firmly it is held and the more of the person's life it governs without their noticing. The same mechanism that locks in a drift locks in a purpose: a deliberate habit, repeated until it is settled, is also held. The book therefore treats the force as neutral and treats the question of what it is holding as the one that matters. The pattern that gets fixed is the one that was repeated, not the one that was intended."],
        ["Where it operates", "In thought, where the way you habitually interpret things sets into a fixed outlook. In conduct, where daily routines settle into a character. In health and the body, which keep to the patterns they have been given. In speech and manner, which become automatic. In money and work, where early patterns persist for decades. And in drifting, which the book regards as the default result of leaving the force to hold whatever has accumulated by accident."],
        ["How you can tell", "A pattern runs without any decision to run it. Changing it takes effort out of proportion to the size of the change. The same behaviour returns after every resolution. Good habits, once fixed, cost nothing to keep. You find that a way of thinking you picked up long ago is still operating and that you never chose it."],
        ["What it is not", "It is not a personal weakness or a judgement on willpower, since the book presents the force as universal and indifferent to what it holds. It is not a physical law that has been measured, and the name is the book's own. It is not an argument that habits cannot be changed, only that they have to be replaced by other repeated acts and not wished away. And it does not say which habits to hold: that is the open question the law leaves to you."]
      ] },
    { n: "Hypnotic Rhythm", b: "How a Life Gets Set on Autopilot",
      r: [
        ["The law", "Hypnotic rhythm is the book's term for the state in which a person is carried along by repeated routines and by the thinking of others, without deciding anything for themselves. It is a kind of trance: a life lived on a repeating track, in which each day resembles the last and no choice is made because none is felt to be needed. The book treats it as the usual condition of people who drift."],
        ["How it works", "The book describes a process in three parts. First, the person falls into a routine of thought and action, often copied from the people around them. Second, the cosmic habitforce takes hold of the routine and makes it permanent, so that it repeats with less and less attention. Third, the repetition produces a kind of dulling, in which the person stops noticing that their life is following a groove. In this state a person acts out the patterns of their surroundings and calls the result their life. The law's central claim is that the rhythm is not noticed from inside it, which is why it is described in terms of hypnosis: the person under it believes they are awake."],
        ["Where it operates", "In daily routine, where the same sequence repeats without examination. In work, where a job continues because it is already the one being done. In belief, where opinions are taken from the surrounding group. In relationships, where established roles are replayed. In money, where income and spending settle into a fixed range. And in a person's picture of what is possible, which tends to be the outline of the life already being led."],
        ["How you can tell", "Time passes quickly and leaves little to remember. You can predict your own week in detail. Decisions are made by default and not by choice. Opinions are held without a memory of forming them. Any suggestion of a change in direction produces unease out of proportion to the change."],
        ["What it is not", "It is not a claim that routine is bad. A routine chosen on purpose is a different thing from one that arrived by drift. It is not a literal hypnotic state, since the term is used as a figure of speech. It is not a reason to distrust all habits or all groups. And it is not specific to any kind of person: the book treats it as the ordinary condition that a life falls into when nothing interrupts it."]
      ] },
    { n: "Definiteness of Purpose", b: "The Opposite of Drifting",
      r: [
        ["The law", "Definiteness of purpose is the book's answer to drifting. It is the condition of knowing precisely what you want to do with your life and directing your effort toward it. The book treats a definite purpose as the thing that turns the force of habit from an obstacle into a support, since a settled aim gives the habit-forming force a direction to hold."],
        ["How it works", "Without a purpose, the book says, thought and action are shaped by whatever happens to be present, and what is repeated is whatever is at hand. A definite purpose changes what is repeated. It decides which thoughts are returned to, which acts are done daily and which options are refused, so that habit forms around the aim and not around circumstance. A purpose must be definite to do this: a general wish to do well gives the force nothing to hold, while a specific aim gives it a fixed point. The law links purpose to the other conditions the book names, such as self-discipline and the refusal of fear, which are needed to keep a purpose in place against the pull of the old patterns."],
        ["Where it operates", "In choice of work and direction, where a defined aim decides what is accepted and refused. In use of time, where purpose sorts what matters from what does not. In habits, which form around the aim. In decision-making under pressure, where a fixed purpose gives a standard. In resistance to outside influence, since a person with an aim is less easily steered. And in persistence, which needs something to persist toward."],
        ["How you can tell", "A person with it can say in one sentence what they are working toward. Choices are made quickly against that sentence. Distractions are recognised as such. Effort accumulates in one direction and does not scatter. Its absence shows as busyness without progress and an inability to say what you want."],
        ["What it is not", "It is not a single goal set once and never revised, since an aim can be changed on purpose and still be definite at each point. It is not rigidity or a refusal to learn. It is not a guarantee of success, only a condition for directing effort. And it is not the same as ambition for its own sake: the law is about having a defined aim, whatever that aim is."]
      ] }
  ],
  tagr: [
    { n: "Thoughts Are Things", b: "The Mind Turns Thought Into Fact",
      r: [
        ["The law", "Thoughts are things is the book's founding claim. A thought is a force with the power to shape what a person does and becomes, and a thought held with definite purpose and belief tends to translate itself into its physical equivalent. The book sets out to show that wealth and achievement begin as thought, and that the thought has to be held clearly before anything is built."],
        ["How it works", "The book describes the translation in stages. A desire is held in the mind until it becomes definite. Repeated and emotionalised, it passes into the part of the mind that governs belief and behaviour. From there it directs choices, attention and action toward its own fulfilment, and the person finds ways and means to carry it out. The book places the weight on the quality of the thought: wavering or doubtful thoughts translate into wavering results, while a clear, believed thought has the force of a plan. It also holds that what a person dwells on, whether wanted or feared, takes this same route, so a mind occupied with fear is equally productive of its object. The law is therefore about the direction and quality of thinking more than about positivity."],
        ["Where it operates", "In goals and ambition, where everything starts as a defined wish. In work and enterprise, which begin as ideas. In self-belief, which sets the size of what is attempted. In fear and doubt, which work through the same route in reverse. In health and mood, where dominant thoughts colour experience. And in the choice of company and information, which supply the material of thought."],
        ["How you can tell", "A result can be traced back to a clear idea that was held for a long time. People who describe their aim in specific terms tend to make more progress toward it. A dominant fear shapes behaviour long before the feared event. A change in the way a person thinks about a problem changes what they do about it."],
        ["What it is not", "It is not a claim that wishing produces results without action: the book's own method turns thought into plans and plans into work. It is not literal magic or a physical force that has been measured. It does not say that every thought has equal weight, since it is the dominant, repeated, emotional thought that counts. And it is not a guarantee: it describes the first stage, and the other stages still have to be carried out."]
      ] },
    { n: "Burning Desire", b: "The Starting Point of All Achievement",
      r: [
        ["The law", "Burning desire is the book's name for a want that has become definite, intense and exclusive enough to organise a person's effort. The book holds that all achievement begins with such a desire, and that a wish, a hope or a preference does not do the same work. A desire of this kind is not something a person has so much as something that has them."],
        ["How it works", "The book treats the strength of desire as the variable that decides how much a person will endure and how long. A mild want yields to the first obstacle. A burning one treats obstacles as problems to solve. The book describes how the desire is made definite: the amount or result is named, the price to be paid is stated, a date is set and the plan is written down and repeated. These steps convert a general wish into a fixed target and give the mind something specific to organise around. The law's central claim is that definiteness and intensity together produce persistence, and that persistence is the quality that most reliably separates results from intentions."],
        ["Where it operates", "In goals and careers, where a clear and intense aim carries a person past setbacks. In business, where founders stay with an idea through difficulty. In learning and skill, where intensity sustains practice. In recovery from failure, where the strength of the want decides whether a person returns to the attempt. In money, which the book treats as the object of a definite desire and not of a vague wish. And in sacrifice, which a strong desire makes tolerable."],
        ["How you can tell", "The person can state exactly what they want, by when and at what cost. They think about it without being asked to. Obstacles prompt problem-solving and not retreat. The aim shows up in what they read, who they spend time with and what they refuse. A weak desire shows as readiness to quit at the first serious difficulty."],
        ["What it is not", "It is not simply wanting something a great deal, and it is not impatience or greed. It is not a substitute for a plan, since the book pairs it with one. It is not a guarantee that the desire is achieved. And it is not necessarily a desire for money: the law is about the intensity and definiteness of the want, whatever its object is."]
      ] },
    { n: "The Master Mind", b: "Two Minds Make a Third",
      r: [
        ["The law", "The master mind is the book's principle that the coordinated effort of two or more people working in harmony toward a definite aim produces a power greater than any of them has alone. The book describes the combination as creating a third mind, an additional force beyond the sum of the individuals, and holds that the great fortunes it studies were made through such alliances."],
        ["How it works", "The book names the conditions for it to work. The alliance has to be in harmony, meaning the members are in sympathy and not merely in agreement. It has to be directed at a definite purpose and not at general cooperation. And it has to be a regular working partnership and not an occasional contact. Under these conditions each member contributes knowledge, experience and energy the others lack, and the group's thinking covers more ground than any one head. The book also holds that the harmony itself raises the individuals' own performance. The law's practical consequence is that a person's results depend on the quality of the people they work with and on how they work with them, as much as on their own ability."],
        ["Where it operates", "In business, where partners and teams carry out what one person cannot. In professional life, where mentors and advisers contribute knowledge. In learning, where discussion with able people sharpens thinking. In relationships, where shared aims strengthen both people. In leadership, where a leader's results depend on the group assembled. And in the choice of company, which the law treats as a decision with consequences for everything else."],
        ["How you can tell", "A group's output is clearly more than the sum of what each member could produce alone. Ideas arrive in conversation that none of the members had before it. The members' energy and confidence rise when they work together. Disharmony in the group shows in a drop in results. A person's progress changes when their circle changes."],
        ["What it is not", "It is not just networking or having a lot of contacts, since the principle requires harmony and a shared aim. It is not a claim of a literal third mind that can be measured, and the book's wording is partly figurative. It is not a replacement for individual effort. And it does not say that any group will do: a group in discord produces the opposite effect."]
      ] }
  ],
  mdh: [
    { n: "The Law of Correspondence", b: "The Outer Mirrors the Inner",
      r: [
        ["The law", "The law of correspondence, as the book gives it, says that your outer world is a mirror of your inner world. The condition of your life, in its work, relationships, health and finances, corresponds to the quality of your thinking and the habits that follow from it. A change in the inner picture, held and acted on, is followed by a change in the outer one."],
        ["How it works", "The book treats the law as a statement about direction of cause. The inner world, meaning beliefs, expectations and the pictures a person holds of themselves and their circumstances, is formed first and produces behaviour. Behaviour produces results, so the results correspond to the inner state even when the person does not recognise the link. The practical consequence is that working on circumstances directly, without altering the beliefs that produce them, tends to bring a person back to the same place. Equally, a person's circumstances can be read as information about what is going on inside: persistent features of a life are treated as pointers to persistent features of thought."],
        ["Where it operates", "In income and finances, which follow the person's beliefs about earning and deserving. In relationships, which reflect how a person sees themselves and others. In health, which corresponds to habits of living. In work, where the position a person holds tends to match the level of their expectations. In habits generally, which are the visible form of inner convictions. And in repetition, where the same type of situation recurs until the inner pattern is changed."],
        ["How you can tell", "Your circumstances are consistent with what you believe about yourself, including the beliefs you would not state. A change in income, relationship or health has historically followed a change in thinking. The same patterns recur across jobs, places and people. Describing someone's outer life gives a fair guess at how they think."],
        ["What it is not", "It is not a claim that every circumstance is a result of the person's thinking, since outside events, other people and chance all act on a life. It is not a basis for blaming people for what has happened to them. It is not a literal mirror in which a thought is instantly reflected. And it is not a quick method: the book treats the correspondence as working over time, through the habits the thinking produces."]
      ] },
    { n: "The Law of Compensation", b: "You Are Paid in Proportion to What You Give",
      r: [
        ["The law", "The law of compensation, in the book, says that you will be paid in direct proportion to the value of the service you render to others. What you receive in income and standing matches the quality, quantity and importance of what you contribute. It is a law about the relationship between the value you provide and the reward you can expect, with the reward set by what other people judge your contribution to be worth."],
        ["How it works", "The book describes the law as a matter of exchange in the market for work. Others pay for results that matter to them, so earning more requires producing more of what is valued, producing it better or producing it for those who value it most. The reward is therefore determined less by the effort you feel you put in than by the value that is received. Three consequences follow. Income is raised by raising the value of the contribution, usually through skill and results. Value is judged by the buyer, so the rarity and importance of what you do matter. And the return runs over time: a record of reliably valuable work compounds into higher pay and better opportunities."],
        ["Where it operates", "In pay and income, which follow the value of the work. In career progress, where more valuable roles are given to those who have shown they can produce results. In business, where customers pay for what they value. In skill, where raising ability raises the price of your work. In reputation, which grows from consistent contribution. And in relationships, where what is given tends to be what is returned."],
        ["How you can tell", "Those who earn more can usually point to the value they produce for others. A rise in skill is followed by a rise in what the market pays. A person who delivers consistently is sought out. Complaints about being underpaid often coincide with a contribution that others do not rate highly. Resentment about reward is a sign of a gap between the value you believe you give and what is perceived."],
        ["What it is not", "It is not a promise of fairness, since markets can underpay valuable work and overpay the visible. It is not a measure of a person's worth, since it addresses only the economic exchange. It is not a claim that effort alone produces reward. And it does not cover the many things that are given freely and not for pay."]
      ] },
    { n: "Eighty Twenty", b: "A Few Things Produce Most of the Result",
      r: [
        ["The law", "The eighty twenty rule says that a small share of your activities produces a large share of your results. About twenty per cent of what you do accounts for about eighty per cent of what you achieve, and the remaining eighty per cent of activity accounts for the other twenty. The figures are approximate. The law is the unevenness: results are concentrated and not spread evenly across effort."],
        ["How it works", "The rule is about the distribution of value across tasks, customers, goals and hours. Not everything counts equally, though everything feels equally urgent when it is on the list. A few tasks have very high value and many have very low value, and the person who spends time on the many in preference to the few gets a small return on a large effort. The book applies the rule as a ranking: sorting what you do by its contribution, doing the highest-value items first and giving the lowest-value items less or none of your time. It also applies it to people, noting that a minority of customers, products or activities typically produce most of the income. The law's weight is in prioritisation: more value is gained by choosing correctly than by working harder at everything."],
        ["Where it operates", "In use of time, where a small portion of hours produces most of the output. In work, where a few tasks carry most of the value. In business, where a small share of customers produces most of the revenue. In goals, where a few items on a list matter much more than the rest. In learning, where a few concepts underlie most of a skill. And in decisions, where a few factors decide most of the outcome."],
        ["How you can tell", "A short list of tasks accounts for most of what gets noticed and rewarded. A day can be busy and produce little because it went to low-value activity. When one customer or project is lost, results fall by much more than their share of effort. Looking back at a good year, most of the gain traces to a handful of decisions."],
        ["What it is not", "It is not an exact ratio, since the proportions vary and the numbers are an illustration of concentration. It is not a licence to neglect the low-value items entirely when they are necessary. It is not a statement about people's worth. And it does not say which twenty per cent matter: working that out is the work."]
      ] }
  ],
  surf: [
    { n: "The Space of Variations", b: "The Field Holds Every Version",
      r: [
        ["The law", "The space of variations is the basic claim of the book. Reality is described as an information field that contains every possible variant of every event, laid out as lines of life. What a person experiences as their circumstances is the sector of the field they are currently on, and moving to a different outcome means moving to a different sector and not changing the one you are in."],
        ["How it works", "The book treats the field as a store of potential and the present as one path through it. Each variant already exists as a possibility, and a person is drawn along the line that matches their state and the intentions they hold. The state that selects the sector is the steady one: what you think and feel consistently, as opposed to what you say or briefly wish. Because the sector is selected by matching, the way to reach a different one is to alter the state and the intention, and the circumstances follow as a result of the move. The law shifts the question from how to change the situation to which line to be on. It also explains continuity: a person who keeps the same state stays on the same line and meets the same kinds of event."],
        ["Where it operates", "In life direction, where a person's path is treated as one of many available. In circumstances that repeat, which indicate staying on one line. In decisions, which are read as choices between lines. In change, which is treated as a transition and not as an effort against the present. In luck, which the book describes in terms of the sector you are in. And in the sense of possibility itself, which the law widens by describing the future as already containing alternatives."],
        ["How you can tell", "The same type of event recurs while your steady state does not change. A change in outlook is followed by a change in what comes up. You feel that a different version of your life is available and nearby. Events seem to line up in a sequence that matches your dominant mood."],
        ["What it is not", "It is not an established physical theory, and the field is the book's model and not a measured entity. It is not a claim that thinking alone moves a person to a new outcome without action. It does not say that every variant is equally reachable from where you are. And it is not a guarantee: it is a way of describing change that the book offers as a working model."]
      ] },
    { n: "Excess Potential", b: "The Cost of Making Something Too Important",
      r: [
        ["The law", "Excess potential is the book's term for the imbalance created when you give a thing, a person or an outcome more importance than it can carry. Overvaluing it or condemning it, adoring it or fearing it, produces a charge, and the balancing forces act to remove that charge. They usually do so in ways that work against what the person wanted: the more something matters, the more likely it is to be taken or to go wrong."],
        ["How it works", "The book gives importance as the one cause of the trouble. Importance is the weight a person assigns, as distinct from the value a thing has. When the weight is excessive, it creates tension: the person becomes anxious, clumsy and forceful, and their behaviour reduces their chances. Beyond that, the book describes balancing forces that operate in the field to level any excess, whether it is excessive value or excessive contempt. A high charge is therefore discharged by an event that brings the situation back toward neutral, often by delivering the opposite of the wish. The law's remedy is to lower the importance and not the effort: the aim is to keep wanting the result while reducing the sense that everything depends on it."],
        ["Where it operates", "In interviews, tests and performances, where the stakes felt change the result. In relationships, where excessive need or idealisation destabilises the connection. In money, where desperate wanting makes it elusive. In status and comparison, where inflated or deflated views of self and others create friction. In goals, where fixation increases the chance of failure. And in fear, where an outcome dreaded becomes more likely through the behaviour it provokes."],
        ["How you can tell", "A result that matters enormously goes worse than a similar one that does not. A person who needs a thing too much finds it harder to obtain. Great success is often followed by a reversal. Strong admiration or contempt for someone is followed by an event that deflates it. Calm about an outcome coincides with its arriving."],
        ["What it is not", "It is not an argument for indifference, since the aim is to hold a want without the weight of necessity. It is not a physical law, and the balancing forces are the book's model. It is not a claim that every setback is caused by importance. And it does not say that effort is unnecessary: the book separates effort, which stays, from importance, which is reduced."]
      ] },
    { n: "Pendulums", b: "Structures That Live on Attention",
      r: [
        ["The law", "Pendulums are the book's name for the energy structures created when groups of people think and feel alike about something. They are not conscious. They feed on the attention and emotion of their followers, grow by drawing in more of it, and compete with other pendulums for people. A pendulum pulls those under its influence along the line that sustains it, whether or not the line serves them."],
        ["How it works", "The book describes a pendulum as a thing that swings: it needs energy to keep moving, and it takes that from the attention and emotion of the people involved. Strong feeling of any sign sustains it, so love and hatred feed it equally. Destructive pendulums live on fear, anger and outrage and are the ones the book warns about, because they gain by provoking reaction. A person who reacts becomes a source of energy and is drawn onto the pendulum's line, a process the book calls an induced transition. The only exit the book gives is to withhold the reaction that sustains it. Opposing a pendulum feeds it and joining it feeds it, so the law prescribes neither. It asks for the person to stay out of the swing and to choose their own line."],
        ["Where it operates", "In politics and media, where outrage and loyalty sustain movements. In organisations and workplaces, where a culture draws in those inside it. In family patterns, where roles repeat across people. In fashion, trends and brands, which depend on collective attention. In arguments, where reaction maintains the conflict. In online life, where attention is the currency. And in belief systems of any kind that need adherents."],
        ["How you can tell", "You feel pulled to react to something designed to provoke you. A cause or group seems to demand loyalty and to punish doubt. The same argument continues because both sides keep feeding it. Strong feeling about an issue goes with a sense of being used. Distance from a topic brings calm and also a sense that it matters less."],
        ["What it is not", "It is not a theory of conspiracy: the book describes pendulums as arising from the thinking of groups, not from design. It is not a claim that all organisations are harmful. It is not an established scientific concept, and it works as a model. And it does not tell you to withdraw from people, only from the particular pull of a structure that lives on your reaction."]
      ] },
    { n: "Outer Intention", b: "Selecting a Line Instead of Pushing",
      r: [
        ["The law", "Outer intention is the book's name for choosing an outcome from the field instead of forcing it into being. It differs from inner intention, which is the effort of acting and pushing against circumstances. In outer intention a person decides the destination clearly and allows it to arrive by whatever route the field offers, taking the action that presents itself and not driving every step."],
        ["How it works", "The book separates two attitudes to a goal. Inner intention concentrates on the means: the plan, the steps, the exertion needed to make something happen. Outer intention concentrates on the end and leaves the means open. The decision is made once and clearly, and attention then stays on the destination as already available. The book holds that the means appear as the person moves, and that insisting on a particular route narrows the options and raises importance, which provokes the balancing forces. Heart and mind play a part: the mind picks the aim, the heart confirms it, and when the two agree the intention is whole. The law places the work in a clear decision and a relaxed relationship to how it is carried out."],
        ["Where it operates", "In goals of every kind, where the destination can be stated and the route cannot. In career and opportunity, where openings often arrive from unexpected directions. In relationships, where forcing a result tends to push it away. In creative work, where the form emerges from a clear aim. In decisions about direction. And in times of uncertainty, where the route is unknown and the destination is not."],
        ["How you can tell", "You can state exactly what you want and not know how you will get it. Opportunities appear that you had not planned for. Insisting on a single method meets resistance. A relaxed focus on the aim coincides with progress. Strain and constant checking coincide with stalling."],
        ["What it is not", "It is not passivity, since the book expects action when it presents itself. It is not wishing, which lacks the clear decision and the matching state. It is not a guarantee that the destination is reached. And it is not a technique with an established mechanism: it is the book's description of how a decision should be held."]
      ] }
  ],
  para: [
    { n: "The Paradigm", b: "Results Are the Programme Speaking",
      r: [
        ["The law", "A paradigm is a multitude of habits, a programme of thought and behaviour that has been installed in the mind and that controls what a person does without their awareness. The book's central claim is that results are a faithful expression of the paradigm and not of desire or effort. The income, health and relationships a person has are what the programme produces, and they will stay the same until the programme changes."],
        ["How it works", "The book describes a paradigm as built from repetition and from strong emotional events, most of it in early life and most of it taken in from the surrounding people without consideration. Once installed, it runs automatically in the subconscious and directs action. A person can want something different and make a large effort toward it, but if the paradigm holds a different picture, behaviour is brought back to it, so the old result returns. The paradigm decides what feels normal, and a person is uncomfortable when they move away from it. For that reason the book places change at the level of the paradigm and not the level of result: the way to produce different results is to install a different programme. It also treats the conscious mind as the means of change, since it can choose what is impressed on the subconscious."],
        ["Where it operates", "In income and money, where a person tends to return to a familiar level. In health and weight, where a body returns to an established pattern. In relationships, where a person finds similar dynamics repeatedly. In career, where a ceiling often matches the person's picture of themselves. In habits generally, which are the visible part of the programme. And in resistance to change, which the book reads as the paradigm defending itself."],
        ["How you can tell", "A person returns to the same result after every change attempt. Gains are followed by a slide back to the old level. What feels normal is stable across years. Effort rises without results rising with it. A person's results are consistent with their earliest and most frequently repeated beliefs."],
        ["What it is not", "It is not a claim that the person is to blame for their results, since the paradigm was largely installed without their choice. It is not a description of a physical thing: the term is the book's way of naming a set of habits. It is not an argument that effort is useless, only that effort at the level of results is not enough. And it does not say that change is quick: the book describes the programme as built by repetition and changed by repetition."]
      ] },
    { n: "The Terror Barrier", b: "The Edge of the Comfortable",
      r: [
        ["The law", "The terror barrier is the book's name for the point where a person's growth runs into the limit of their paradigm. As a person moves beyond what the programme holds as normal, discomfort rises, and at some distance from the familiar it becomes strong enough to be experienced as fear. The barrier is the felt edge of the comfort zone, and most people turn back at it."],
        ["How it works", "The book describes a pattern of approach and retreat. A person sets a goal that lies outside their paradigm and begins to move toward it. Past a certain distance, the mind produces anxiety, doubt, distraction or a sudden loss of motivation, and the person retreats to what they know. This is experienced as a realistic assessment of risk, though it is the programme returning the person to its range. The book states that the barrier is a signal and not a verdict: it marks where the paradigm ends and is therefore a sign of growth under way. The way through it, in the book's account, is to keep going while the discomfort is present, so that the new level becomes familiar and the paradigm is extended."],
        ["Where it operates", "In goals that involve a step beyond the usual level of income, status or responsibility. In careers, where promotion or independence triggers anxiety. In relationships, where closeness beyond a person's norm produces withdrawal. In health, where a new standard feels unnatural. In creative projects, where finishing or publishing brings dread. And in success itself, which many people sabotage on reaching the limit of what feels like theirs."],
        ["How you can tell", "A person approaches a goal and then finds reasons to stop. Nerves and doubt rise as the aim comes within reach. Progress stalls at a particular level and does so repeatedly. Success produces unease. A sudden urge to retreat arrives at the point of most promise."],
        ["What it is not", "It is not a physical barrier or an external force, and it is the book's term for a psychological pattern. It is not a sign that the goal is wrong, since discomfort at the edge of the familiar is expected. It is not a reason to ignore real danger. And it does not claim that crossing is easy: it says only that the discomfort is a feature of the edge and not a judgement of the goal."]
      ] },
    { n: "The Worthy Ideal", b: "A Direction Worth Becoming",
      r: [
        ["The law", "A worthy ideal is a goal that a person finds so attractive that it draws them forward on its own. The book distinguishes it from a target set by calculation: a worthy ideal is an end that arouses real feeling and that the person would pursue without being driven. It is the book's proposed way of building a new paradigm, since an ideal that is felt strongly enough carries the repetition needed to install it."],
        ["How it works", "The book gives the worthy ideal a role in change. A paradigm is rebuilt by repeated thought and feeling around a new picture, and repeating something you are indifferent to is difficult and brief. An ideal that carries emotion supplies the energy for repetition. It also gives direction: the person holds a vivid picture of the aim, in which they see themselves as already living it, and the subconscious works to bring behaviour into line with the picture. The book also holds that the ideal has to be one the person truly wants and not one inherited from others, since a goal that is borrowed produces no feeling. The law's claim is that attraction, and not pressure, sustains change."],
        ["Where it operates", "In life direction, where an ideal gives a person something to move toward. In work, where a calling carries a person through the dull parts. In goals of every size, where emotional pull sustains effort. In the work of changing a habit or a belief, which needs repeated attention. In motivation, where a strong aim replaces force. And in identity, where the ideal is a picture of who the person is becoming."],
        ["How you can tell", "The goal produces feeling when it is pictured. The person returns to it without being told to. Effort toward it feels less like a burden than effort toward obligations. Obstacles feel like problems to solve. A goal that produces no feeling is dropped when the first difficulty arrives."],
        ["What it is not", "It is not a target imposed by someone else, and it is not a goal chosen purely for its payoff. It is not a guarantee that the aim is reached. It is not the same as a fantasy, since the book pairs it with sustained thought and action. And it does not mean the ideal can be taken casually: the book treats it as the centre of the method."]
      ] }
  ],
  feel: [
    { n: "The Feeling of the Wish Fulfilled", b: "The Secret Is the State",
      r: [
        ["The law", "The book's central law is that a wish is realised by feeling its fulfilment as already so. Desire alone is not enough, and neither is a statement of the wish. What produces the result, in the book's account, is the feeling that would be yours if the wish were already granted, taken on and kept until it is natural. The feeling, and not the thought or the words, is the secret the title refers to."],
        ["How it works", "The book separates the wish from the state. A wish, spoken or thought, is a statement that something is lacking, and it keeps the thing at a distance. The state is the felt reality of having it. According to the book, the subconscious responds to the state a person is in and not to what they say, so it is the feeling that is impressed on it. The person is asked to form a brief scene that would imply the wish is fulfilled and to enter it until it feels real. Once the feeling is established, the person lets go of the wish and goes on with their life, trusting the state to do its work. The law places all of the effort in the inner act and none in the attempt to manipulate outside events."],
        ["Where it operates", "In any area where a result is wanted, since the book holds the principle to be general. In health, where it speaks of the feeling of being well. In relationships, where it speaks of the feeling of being loved. In work and money, where it speaks of the feeling of having arrived. In self-image, where the habitual feeling about yourself becomes the pattern of a life. And in the way a person describes their wishes to themselves."],
        ["How you can tell", "A change in feeling about yourself is followed by a change in what you do and attract. The same wish held in a state of lack does not move. Settled calm about an outcome coincides with its arrival. You can tell the difference between wanting something and feeling it as yours. Excitement and urgency mark that it is still held as a want."],
        ["What it is not", "It is not wishing hard, and it is not positive thinking. It is not an affirmation repeated in words without the feeling. It is not a method with a demonstrated mechanism, and the book offers it as a teaching and not as a measured result. And it does not replace action when action presents itself: the book assumes the person will do what the new state suggests."]
      ] },
    { n: "The State Akin to Sleep", b: "Impressing the Subconscious When Resistance Is Low",
      r: [
        ["The law", "The book's method for taking on a feeling is to do it in a state akin to sleep, the drowsy condition between waking and sleeping. In that state the person is relaxed and the critical mind is at rest, so the subconscious is receptive and a feeling can be impressed on it with the least resistance. The law is a claim about when the mind accepts what it is given."],
        ["How it works", "The book describes the waking mind as a filter that argues with, rejects and qualifies what it is told. When a person is awake and alert, a statement that conflicts with their view of themselves meets resistance and does not settle. As the person relaxes toward sleep, the filter loosens and the mind becomes more open, and a feeling or scene held at that point is taken in without argument. The method therefore times the practice for the moments before sleep, when the person is able to rest in the feeling of the wish fulfilled and carry it into sleep. The law explains why the same sentence repeated during the day can have little effect and why the feeling held at the edge of sleep is held to be more potent. It gives a specific moment for the practice and a reason for choosing it."],
        ["Where it operates", "In evening routine, where the last thoughts before sleep are treated as significant. In the practice of imagination, which needs a relaxed body. In the handling of worry, since the state at the edge of sleep is shaped by what the person has last been thinking. And in any attempt to change an established belief, which meets less resistance in a receptive state."],
        ["How you can tell", "The person can feel the shift from alert to drowsy and notice that thoughts become more suggestible. Worries held at night seem larger and more convincing. The mood on waking follows the last thoughts of the night. A statement that is resisted by day feels more acceptable when drowsy."],
        ["What it is not", "It is not hypnosis, though it borrows the idea of reduced resistance. It is not a claim that sleep itself brings results. It is not a requirement for the method, since the book allows that the feeling can be held at other times. And it has no established mechanism: the claim is the book's, and it is held as a practice and not a finding."]
      ] },
    { n: "Everything Comes From Within", b: "The World Is the Report of the Inner State",
      r: [
        ["The law", "The book holds that nothing comes from without: what appears in a person's life is the expression of what is in their mind. Circumstances, events and the behaviour of other people are held to be the outer form of inner states, and the way to change them is to change the state. The law is the book's account of where causes are located."],
        ["How it works", "The book treats the inner world as the cause and the outer as the report. A person's habitual feeling about themselves and their life is the real condition of their life, and the events that arrive correspond to it. This is why the book regards effort directed at outside circumstances as secondary: the outside is an effect, and working on it alone leaves its source in place. Taking the law seriously changes where a person looks. Instead of asking what is happening to them, they ask what state they are in, and they treat the outside as information about it. The book adds that the inner states are not fixed: the habitual mood can be changed, and the circumstances then change in time with it."],
        ["Where it operates", "In how a person interprets events, which reveal as much about the viewer as the event. In patterns across a life, which are read as inner patterns. In mood, which is treated as the quiet cause of many outcomes. In self-image, which the book holds to shape what a person expects and so receives. In relationships, where the way a person feels about themselves is said to set the way others treat them. And in reaction to setbacks."],
        ["How you can tell", "Your circumstances match your habitual feeling about yourself. A lasting change of mood is followed by a change of events. The same type of event recurs while the inner state is unchanged. Others treat you much as you feel you should be treated."],
        ["What it is not", "It is not a claim that people cause everything that happens to them, since accidents, illness and the actions of others are not adequately explained by inner states. It is not a reason to blame anyone for misfortune. It is not a demonstrated mechanism, and the book's version is a teaching. And it does not dismiss action: the book assumes that a person in a changed state will act differently."]
      ] }
  ],
  sogr: [
    { n: "The Law of Creative Thought", b: "Thought Produces the Thing Imagined",
      r: [
        ["The law", "The book's first principle is that a thought held in the formless substance from which all things are made produces the thing the thought represents. A person can therefore form a thing in thought and, by holding the thought, cause the thing to be created. The principle is the foundation of the book's method and the reason the book puts so much weight on what a person thinks."],
        ["How it works", "The book begins with a claim about the nature of things: there is one thinking substance from which everything comes, and it takes the shape of the thoughts impressed upon it. A person is a thinking centre that can impress that substance, so their thought of a thing, held with faith, results in the thing. The book states three fundamental propositions in this form. It then draws a practical conclusion. Because a thought produces its object, the person has to think about what they want and not about what they lack, and they have to hold the thought of the thing as already coming to them. The law gives thinking the role of first cause, with action following as the means by which the thing is brought into form."],
        ["Where it operates", "In goals and ambition, where the thought of the aim is the starting point. In the use of imagination, which forms the picture to be held. In faith, which the book treats as the quality that makes the thought effective. In worry, which holds the thought of what is feared. In work and business, where the thought of the result comes before the work. And in the habit of thinking about riches and not about poverty."],
        ["How you can tell", "Results follow the quality and persistence of a person's thought about them. Dwelling on lack produces more of it. A person who holds a clear picture of an outcome behaves in ways that fit it. A change in dominant thought is followed by a change in conduct. A vague thought produces a vague result."],
        ["What it is not", "It is not a statement of established science, and the formless substance is a doctrine of the book. It is not a claim that thought alone produces results, since the book insists that action must go with it. It is not a guarantee. And it does not mean that a thought produces any outcome at will: the book places conditions on the process."]
      ] },
    { n: "The Certain Way", b: "Getting Rich as an Exact Science",
      r: [
        ["The law", "The book holds that getting rich is the result of doing things in a certain way, and that anyone who does them in that way will get rich, whatever their circumstances. It treats wealth as the product of a method and not of opportunity, talent or luck. The law is the claim that results follow a way of acting, so that the same actions produce the same results for whoever carries them out."],
        ["How it works", "The book argues from regularity. If getting rich were a matter of chance or circumstance, it would not follow from any method. Since some people get rich from any starting point and in any place, and since others fail in the same place with the same opportunity, the book concludes that the difference lies in how people think and act. It then states that a person who does things in the certain way must succeed, as a person who follows a mathematical rule must reach the right answer. It describes the way as a combination of the thinking set out in the book and efficient action in the present. The law rejects the idea that the environment or lack of capital is the decisive factor, and moves the responsibility to the method."],
        ["Where it operates", "In explanations of success and failure, where the book sets aside circumstance. In goals, where the focus is on the method and not on the conditions. In the sense of what is possible, which is widened by the claim that anyone can succeed. In the way a person regards their present situation, as a place to start. In work, where the way of doing things is treated as decisive. And in responsibility, which the law places on the person."],
        ["How you can tell", "People starting from nothing succeed by a consistent set of practices. Those in favourable circumstances fail when they lack them. A change in method is followed by a change in results. A person who has found a way that works can repeat it. Complaints about conditions are replaced by questions about method."],
        ["What it is not", "It is not a promise that anyone who reads the book will get rich, since the method has to be carried out. It is not a denial that circumstances matter. It is not a measured scientific claim, and the book's language of exactness is rhetorical. And it should not be read as saying that people who are poor have failed to follow a method."]
      ] },
    { n: "Use Value Over Cash Value", b: "Give More Than You Take",
      r: [
        ["The law", "The book's ethical law is that a person should give every individual more in use value than they receive in cash value. Each exchange should leave the other party better off, so that their life is advanced by dealing with you. The book treats this as both an ethical rule and a condition of getting rich in the way it describes, since the wealth it has in mind is built on creation and not on taking."],
        ["How it works", "The book separates two ways of getting rich. One is by competition, in which a person takes from others and gains at their expense. The other is by creation, in which a person produces something new and benefits all who deal with them. The book holds that only the second is consistent with its method. It therefore requires that what a person gives in each exchange be worth more to the receiver than what they pay. The law also contains an attitude: the person is to think of every transaction as an opportunity to add to the life of the other. It treats the giver as the main beneficiary, since the more value a person adds, the more they are sought out and the more they receive."],
        ["Where it operates", "In business, where the product or service has to be worth more to the customer than its price. In employment, where the value of the work should exceed the pay. In relationships, where the exchange of benefit should favour the other. In the sense of one's own role, which is to advance life and not simply to collect. In reputation, which grows from giving good value. And in ethics, where the law sets a standard for gain."],
        ["How you can tell", "Customers return to those who give them more than they paid for. A person known for adding value is sought out and is rewarded for it. A deal that benefits only one side is not repeated. Success built on providing value is steady, and success built on taking tends to need constant replacement of the people taken from."],
        ["What it is not", "It is not a rule that a person must give things away, since the book requires a fair cash return. It is not a guarantee that value given is always recognised. It is not a demonstration that creation always pays better than competition. And it is partly a moral claim and not a purely economic one."]
      ] },
    { n: "The Law of Increase", b: "Life Is Always Moving Toward More",
      r: [
        ["The law", "The book holds that life seeks fuller expression in everything. Every living thing is driven to increase, and the desire for more, whether more money, knowledge or ability, is the universe's own movement acting through the person. The law is the claim that wanting to be richer is natural, since it is life's drive toward greater fullness and not a fault of character."],
        ["How it works", "The book describes a universe that is intelligent and moving toward greater life, and a person as a part of it. The desire to increase is therefore the same impulse as the one that drives growth in plants and minds. This gives the person's wish for more a standing: it is aligned with the way things move and is not opposed to it. The book draws a practical consequence. Since the movement is toward increase, the person who holds a clear intention to increase, acts in keeping with it and does not oppose it with doubt is working with the current. The book also ties the law to giving and thankfulness: the person who gives value and is grateful keeps themselves in the flow."],
        ["Where it operates", "In the sense of ambition, which the law treats as natural. In growth of skill, where a drive to improve is a form of increase. In money, where wanting more is described as part of life's urge to expand. In relationships and learning, where more connection and understanding are forms of increase. In dissatisfaction, which the law reads as a signal of capacity to grow. And in thankfulness, which the book links to receiving more."],
        ["How you can tell", "A person feels a persistent wish to grow, learn or earn more that does not go away. Satisfaction with a fixed state tends not to last. Work that adds value feels more energising than work that merely maintains. A person who is open to increase notices more ways to achieve it. Stagnation feels like a departure from a natural direction."],
        ["What it is not", "It is not a physical law, and the claim that the universe is moving toward more life is a belief of the book. It is not a justification for greed. It is not a statement that increase is always good or that more of anything is better. And it does not mean that increase comes without action."]
      ] }
  ],
  cyb: [
    { n: "The Self-Image", b: "You Act Like the Person You Believe Yourself to Be",
      r: [
        ["The law", "The book's central law is that a person's self-image sets the boundaries of what they can achieve. A person behaves in line with the picture they hold of themselves, whether or not they are aware of holding it, and results follow behaviour. Changing the picture, the book holds, changes what a person does and so what happens to them."],
        ["How it works", "The self-image is described as a mental blueprint made of beliefs about who one is, built from past experience, the way one has been treated and the conclusions drawn from success and failure. It operates as a standard. A person feels uncomfortable acting outside it and, without noticing, behaves in ways that bring them back. A person who sees themselves as unlucky, shy or unsuited to success will find that their conduct, perception and results confirm the picture. The book states that the self-image is not fixed, since it is built from experience and can be rebuilt. The law is therefore both an explanation and a method: the explanation of why effort so often returns to the same result, and the method of altering the picture on which behaviour depends."],
        ["Where it operates", "In confidence and performance, where a person tends to act within the range their self-image allows. In relationships, where self-worth shapes what a person accepts. In money and career, where a person's sense of what they deserve limits what they pursue. In appearance, which the book treats as bound up with the sense of self. In health and recovery, where expectations affect experience. And in response to failure, which reinforces or revises the image."],
        ["How you can tell", "A person's results stay within a band despite varied effort. A person is uncomfortable when things go better than they expected. They describe themselves in fixed terms and behave accordingly. A change in the way they see themselves is followed by a change in conduct. Compliments or achievements that conflict with the image are dismissed."],
        ["What it is not", "It is not a claim that thinking well of yourself produces results by itself, since the book ties the self-image to action and experience. It is not an assertion that the self-image is easily changed. It is not a measured physical mechanism. And it does not deny the role of talent, opportunity and circumstance."]
      ] },
    { n: "The Servo-Mechanism", b: "The Goal-Striving Machine",
      r: [
        ["The law", "The book describes the brain and nervous system as a goal-striving servo-mechanism, a mechanism that steers toward a goal by correcting its course as it goes. Given a clear target, it works automatically to reach it, adjusting from the feedback it receives. The law is the claim that a person has a built-in success mechanism that operates on the goals it is given and on nothing else."],
        ["How it works", "The book takes the idea from engineering. A servo-mechanism, such as a self-guided torpedo, does not know the route in advance. It has a goal and a means of detecting error, and it reaches the goal by moving, finding it is off course, and adjusting repeatedly. The book proposes that the human mind works in this way. It is given a target, which it pursues through trial and error, using feedback to correct itself. The mechanism is impersonal: it works toward whatever target is set, so a clear and positive goal is pursued and a negative or confused one is as well. The consequences are practical. The person is to supply a definite goal and trust the mechanism to find the means, and is to treat errors as information for correction and not as failures."],
        ["Where it operates", "In goals, where a clear target gives the mechanism something to work toward. In skill, which develops by trial, error and correction. In creative work, where ideas come once the problem is posed. In problem solving, where the mind continues to work on a question after attention has moved. In habits, where the mechanism carries out the pattern it has been given. And in anxiety, where it works on a fear in the same way as on a hope."],
