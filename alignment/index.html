    t: "Basecamp charged from launch in 2004. There was no free growth phase funded by somebody else and no plan that required a later round in order to work.",
    l: "A business that makes money from the first customer is a business you control. One that needs scale before it works has handed its timetable to whoever is funding the gap." },
  { s: "sigs", x: "mindset", n: "Growth Is a Choice", b: "Nobody Made It Compulsory",
    t: "They have stayed deliberately small for two decades, refused to chase scale, and written at length about why. There were no growth targets.",
    l: "Nobody made growth compulsory. It is a decision with costs attached and people accept it by default because everybody around them did. Decide what size is enough and say it out loud." },
  { s: "sigs", x: "mindset", n: "Work Should Be Calm", b: "If It Needs Heroics the Plan Is Wrong",
    t: "Forty hour weeks, thirty-two in summer, and no expectation of nights or weekends. It Doesn't Have to Be Crazy at Work argues that overwork is a management failure rather than a virtue.",
    l: "If the plan requires heroics to work, the plan is wrong. A sustainable pace is not a comfort, it is what lets you still be doing this in ten years, which is the only variable that compounds." },
  { s: "sigs", x: "internal", n: "They Built It for Themselves", b: "Basecamp Was an Internal Tool",
    t: "Basecamp was built to run their own client projects at the design firm, and only sold afterwards. The first user was the company.",
    l: "Something you built because you needed it has a customer already proven, and you can tell whether it works without asking anybody. Most products fail on a question this one has answered." },
  { s: "sigs", x: "internal", n: "Saying No Is the Job", b: "Features, Customers, Money",
    t: "A constant theme across twenty years of their writing: most of the work is refusing. Refusing features, refusing customers who want it to be something else, refusing investment.",
    l: "What you decline defines the thing far more than what you accept. Every yes adds surface you maintain forever, and almost nobody counts that cost at the moment of saying it." },
  { s: "sigs", x: "internal", n: "They Published Their Opinions", b: "And Paid for Some of Them",
    t: "The books and the blog built the audience that sells the software, and in 2021 a policy decision was publicly contested and roughly a third of the staff left.",
    l: "Taking public positions is what makes you findable and it is the same thing that makes you liable. You do not get the first without the second, and pretending otherwise is how people are surprised." },
  { s: "sigs", x: "external", n: "The Writing Is the Marketing", b: "An Argument Travels Further Than an Ad",
    t: "Rework, Remote and the rest built an audience that was never bought. The software sits downstream of people agreeing with the argument.",
    l: "An argument people want to repeat travels further than any advertisement and costs nothing except having something to say. The hard part is having a position rather than a campaign." },
  { s: "sigs", x: "external", n: "They Gave Rails Away", b: "Open Source as Distribution",
    t: "Ruby on Rails was extracted from Basecamp and released free in 2004. It became one of the most used web frameworks there is and made the company enormously credible.",
    l: "Giving away the thing underneath your product can be worth more than selling it. It puts your thinking permanently inside other people's work, and nobody competes with free." },
  { s: "sigs", x: "external", n: "One Outside Stake, Once", b: "A Share of the Upside, Not a Vote",
    t: "Jeff Bezos took a minority, non-controlling position in 2006. There was never another round and control never moved.",
    l: "There is a difference between money that buys a share of the upside and money that buys a vote on your decisions. Find out precisely which is on the table before the number distracts you." },
  { s: "sigs", x: "karmic", n: "Twenty Years of the Same Argument", b: "The Interval Is the Price",
    t: "The position they took in 2004 about small, profitable, calm software is the position now, and the company is still here while most of the ones that mocked it are not.",
    l: "A position held long enough stops being contrarian and becomes obvious, and whoever held it owns the credit. The interval where you look wrong is the entire price of it." },
  { s: "sigs", x: "karmic", n: "The Staff Who Left", b: "Entitled and Costly Are Different Questions",
    t: "The 2021 policy change was contested in the open and about a third of employees took the severance and went. All of it is on the record.",
    l: "A decision you are entitled to make is still a decision with a bill, and the bill is usually paid in the people who go. Being within your rights and being right are separate questions." },
  { s: "sigs", x: "karmic", n: "Nobody Owns Them", b: "What Two Decades of No Bought",
    t: "No board, no acquisition, no obligation to grow. They can change the product, the price or the company's name whenever they decide to, and have.",
    l: "Autonomy is not a feeling, it is a structural position, and it is bought by everything you refused along the way. You will not notice you have it until somebody tries to tell you what to do." },
  { s: "lucas", x: "internal", n: "Quiet Is a Method", b: "Invisibility Costs You Only the Applause",
    t: "He spent years driving an ordinary car and looking like nobody, deliberately, while running one of the largest heroin operations in Harlem. He described it afterwards as policy.",
    l: "Being unremarkable is a strategy with real returns and it costs you nothing but the credit. The people who cannot afford it are the ones who were doing the whole thing for the credit in the first place." },
  { s: "lucas", x: "internal", n: "The Coat at the Fight", b: "One Hour of Wanting Credit",
    t: "He wore a chinchilla coat to Ali and Frazier in 1971, sat where the cameras were, and has said that photograph is what put detectives onto him. Years of discipline against one evening.",
    l: "A decade of discipline can be undone by one hour of wanting the credit, and the urge does not go away because you have a rule about it. Decide in advance which rooms you do not walk into." },
  { s: "lucas", x: "internal", n: "He Talked", b: "Know Your Answer Before the Room",
    t: "After conviction he cooperated extensively and dozens of cases came out of it. It cut his sentence substantially, and it is the part of his story he is most argued about.",
    l: "Everybody has a price and most people find out what theirs is in a room they did not plan to be in. Work out now what you will and will not do, because you will not be composing that answer when the moment arrives." },
  { s: "lucas", x: "external", n: "Cutting Out the Middleman", b: "Go to the Source",
    t: "Blue Magic worked because he sourced directly out of Southeast Asia rather than through the networks everybody else used. The purity and the price were both a function of removing layers.",
    l: "Every intermediary takes a margin and owns the relationship. Going to the source is harder, slower and almost always where the entire advantage is. Most people never even find out who the source is." },
  { s: "lucas", x: "external", n: "The Product Was the Marketing", b: "A Better Thing Needs Less Persuasion",
    t: "He branded it, kept the quality consistent and sold it cheaper. People came to him because it was actually better, which is a rare and unglamorous reason for a business to work.",
    l: "Persuasion is the most expensive thing you can buy. Before you spend on getting attention, find out honestly whether the thing deserves it, because a genuinely better product needs a fraction of the noise." },
  { s: "lucas", x: "external", n: "Everyone Was Family", b: "Trust Does Not Scale",
    t: "He brought relatives up from North Carolina to run it, because he could not verify anybody else. It worked, until a federal case turned every one of them into a potential witness.",
    l: "Using trust as your control system works up to roughly the number of people you actually know. Past that you need structure, and most things come apart at exactly the point where the founder refused to build one." },
  { s: "lucas", x: "karmic", n: "The Coffins", b: "What You Boast About Is Kept Longest",
    t: "His account was that product came back from Southeast Asia in the same transport as dead American servicemen. Whether or not every detail of it holds, he told it himself, as a boast.",
    l: "What you are prepared to use in order to win becomes the description of you, permanently, and you will have been the one who supplied it. Nothing gets forgotten, and boasts are kept longest of all." },
  { s: "lucas", x: "karmic", n: "Harlem Paid", b: "The Better You Are, the Larger the Number",
    t: "The scale of the operation and the purity of the product are the same fact as the scale of the addiction on the blocks he was from. Those two numbers cannot be separated.",
    l: "When the thing you are good at works, ask who is on the other end of it. The better you get, the larger that number becomes, and nobody is ever going to report it to you." },
  { s: "lucas", x: "karmic", n: "Nothing Held", b: "Money You Cannot Keep Is a Score",
    t: "Tens of millions at the peak, by his own account, and effectively none of it left at the end. Seized, spent, lost: none of it survived the life that produced it.",
    l: "Money made in a way that cannot be held is not money, it is a score. If it cannot be put somewhere that survives you being wrong, you have not built anything yet." },
  { s: "lucas", x: "mindset", n: "Consistency Is the Brand", b: "Being the Same Every Time",
    t: "Blue Magic worked because the quality and the price did not vary. In a market where everybody cut differently, being predictable was the entire proposition.",
    l: "Being the same every time is undervalued because it is boring to execute and invisible when it works. It is also what people are actually paying for, in every field, and almost nobody delivers it." },
  { s: "lucas", x: "mindset", n: "He Studied the Man Above Him", b: "Proximity Is the Wage",
    t: "By his own account he drove for and worked alongside Bumpy Johnson for years — a claim some of Johnson's associates have disputed — and treated it as an apprenticeship rather than a job.",
    l: "Put yourself next to somebody already doing it and treat the proximity as the pay. Most people take the job for the money and leave with nothing else, which is the most expensive way to spend those years." },
  { s: "lucas", x: "mindset", n: "Difficulty Is the Moat", b: "The Margin Nobody Will Work For",
    t: "Going to Southeast Asia himself was dangerous, slow and complicated, which is precisely why nobody else was doing it and why it held for as long as it did.",
    l: "The advantage sits behind whatever is annoying enough that everybody routes around it. If the thing were easy the margin would already be gone, and the discomfort is the price of the position." },
  { s: "rohn", x: "mindset", n: "Work Harder on Yourself", b: "Than You Do on Your Job",
    t: "His best-known teaching is that you should work harder on yourself than you do on your job, because your income tends to follow your own growth.",
    l: "Your pay rarely rises faster than you do. Put the hours into becoming more valuable and the job, the pay and the opportunities catch up with you." },
  { s: "rohn", x: "mindset", n: "Discipline or Regret", b: "Choose Which Pain",
    t: "Rohn taught that everybody suffers one of two pains: the small daily pain of discipline, or the far heavier pain of regret later on.",
    l: "You are going to pay one way or the other. Pay the light price of discipline today rather than the heavy price of regret at the end." },
  { s: "rohn", x: "mindset", n: "Wish You Were Better", b: "Not That It Were Easier",
    t: "He told audiences not to wish for life to be easier but to wish that they were better, and to stop waiting for circumstances to change first.",
    l: "The problems will not shrink to fit you, so grow to fit the problems. Asking for better skills is a prayer you can actually answer yourself." },
  { s: "rohn", x: "internal", n: "The Girl Scout at the Door", b: "The Day He Had Nothing",
    t: "He often told the story of hiding from a Girl Scout selling cookies at twenty-five, pretending he did not want any because he did not have the money.",
    l: "Let the moment of embarrassment become the moment you decide. The day you are ashamed of where you are can be the day you refuse to stay there." },
  { s: "rohn", x: "internal", n: "Keep a Journal", b: "Do Not Trust Memory",
    t: "Rohn kept journals for most of his life and urged people to write down what they learned, heard and thought rather than trusting memory.",
    l: "The good ideas you do not write down are gone within a week. Keep a record of what you learn, because it is the only way to actually keep it." },
  { s: "rohn", x: "internal", n: "Read the Books", b: "Build a Library",
    t: "He urged people to build a personal library and read every day, arguing that the books you do not read cannot help you.",
    l: "A book you own and never open does nothing for you. Read a little every day and the gap between you and the people who do not will widen quietly." },
  { s: "rohn", x: "external", n: "He Found a Mentor", b: "John Earl Shoaff",
    t: "At twenty-five he met the businessman John Earl Shoaff, went to work in his direct sales company, and credited him for changing the direction of his life.",
    l: "Find somebody who has what you want and learn from them directly. One good mentor can save you ten years of working it out alone." },
  { s: "rohn", x: "external", n: "The Five People", b: "Who You Spend Time With",
    t: "The idea that you become the average of the five people you spend the most time with is widely attributed to Rohn.",
    l: "The people around you shape what you think is normal. Choose your company as deliberately as you choose your goals, because it will decide many of them." },
  { s: "rohn", x: "external", n: "The Seasons", b: "Plant in Spring, Harvest in Autumn",
    t: "He taught life in seasons: planting in spring, protecting the crop in summer, reaping in autumn and learning through winter.",
    l: "Every result has a season, and you cannot harvest what you never planted. Do the right work at the right time and stop expecting autumn in spring." },
  { s: "rohn", x: "karmic", n: "He Taught Tony Robbins", b: "The Student Went Further",
    t: "A teenage Tony Robbins attended one of his seminars and went to work promoting them, and later became the best-known speaker in the field.",
    l: "What you teach can travel much further than you do. Pour yourself into people who are hungry, because their success becomes part of yours." },
  { s: "rohn", x: "karmic", n: "Personal Development as a Profession", b: "A Life Spent Teaching It",
    t: "For more than four decades he taught personal development on stages and in recordings, and it remained his work until his death in 2009.",
    l: "Doing one thing for a lifetime builds a depth that nothing else can. Stay with the work long enough and you become the person others learn it from." },
  { s: "rohn", x: "karmic", n: "Poor at Twenty-Five", b: "Wealthy by Thirty-One",
    t: "He said he went from broke at twenty-five to a millionaire by thirty-one, and credited the change to what he learned rather than to luck.",
    l: "Six years of real change can rewrite a life. Your past income is not a prediction, it is only a record of who you were before you started learning." },
  { s: "night", x: "mindset", n: "We Become What We Think About", b: "The Strangest Secret",
    t: "His 1956 recording The Strangest Secret rests on one idea: that people become what they think about most of the time.",
    l: "Your dominant thoughts decide your direction long before your actions do. Watch what fills your head all day, because that is where you are heading." },
  { s: "night", x: "mindset", n: "The Progressive Realisation", b: "His Definition of Success",
    t: "Nightingale defined success as the progressive realisation of a worthy ideal, meaning working towards a goal you chose, not arriving at it.",
    l: "You are successful from the moment you are moving towards something that matters to you. Stop waiting to arrive before you let yourself count." },
  { s: "night", x: "mindset", n: "Thirty Days", b: "A Test You Can Run",
    t: "The recording closes by asking the listener to try its idea for thirty days and to start again from the first day if they slip.",
    l: "An idea you never test stays an opinion. Commit to one change for thirty days, restart when you fail, and let the result argue for itself." },
  { s: "night", x: "internal", n: "He Survived the Arizona", b: "Pearl Harbor at Twenty",
    t: "He was a Marine aboard the USS Arizona when it was sunk at Pearl Harbor in 1941, and was among the small number of the ship's Marines who survived.",
    l: "Surviving something terrible can become a reason to use your life well. Treat the time you were given as borrowed and spend it on something worth it." },
  { s: "night", x: "internal", n: "The Boy in the Library", b: "Asking Why",
    t: "Growing up poor in the Depression, he has said he went looking in the library as a boy for why some people did well and others did not.",
    l: "Curiosity about how things work is the start of changing them. Ask why the results around you differ, and keep reading until you get a real answer." },
  { s: "night", x: "internal", n: "Most People Drift", b: "Conformity as the Default",
    t: "He argued that most people never set a goal, simply follow the crowd, and so end up wherever the crowd happens to be going.",
    l: "If you do not choose a direction you inherit somebody else's. Drifting feels safe because everyone is doing it, which is exactly why it rarely leads anywhere good." },
  { s: "night", x: "external", n: "A Message for His Salesmen", b: "Recorded Before a Holiday",
    t: "He recorded The Strangest Secret for the sales staff of his insurance agency so they would have something to listen to while he was away.",
    l: "Something made for a small group can reach millions if it is true. Make the work useful to the few people in front of you and let it travel." },
  { s: "night", x: "external", n: "A Million Copies of a Voice", b: "The Spoken-Word Record",
    t: "The Strangest Secret sold more than a million copies, a first for a spoken-word record, and opened a whole market for recorded motivation.",
    l: "A new format can carry an old idea to people who would never have read it. Put what you know into the medium your audience already uses." },
  { s: "night", x: "external", n: "Nightingale-Conant", b: "Building the Industry",
    t: "In 1960 he co-founded Nightingale-Conant with Lloyd Conant, which grew into one of the largest publishers of personal development audio.",
    l: "The person who builds the platform shapes the whole field. Once your own message works, build something that carries many other people's too." },
  { s: "night", x: "karmic", n: "Our Changing World", b: "Five Minutes a Day",
    t: "His short daily radio programme Our Changing World was syndicated widely for years, reaching huge audiences a few minutes at a time.",
    l: "Small, steady contact beats one grand appearance. A few useful minutes every day builds more trust than any single big moment ever will." },
  { s: "night", x: "karmic", n: "Radio Before Motivation", b: "A Voice Trained for Years",
    t: "He worked for years as a radio broadcaster in Chicago before the recording, which is why the voice on it carried the way it did.",
    l: "Skills built in one career often become the edge in the next. Nothing you practise seriously is wasted, even when you cannot yet see where it leads." },
  { s: "night", x: "karmic", n: "The Idea Outlived Him", b: "Still Being Played",
    t: "He died in 1989, and his recordings are still sold, quoted and replayed decades later by people who never heard him live.",
    l: "A simple truth well said outlasts the person who said it. Put your best thinking somewhere it can keep working long after you are gone." },
  { s: "zig", x: "mindset", n: "Help Enough Other People", b: "And You Get What You Want",
    t: "Ziglar is widely quoted for teaching that you can have everything in life you want if you help enough other people get what they want.",
    l: "Serving others is not the opposite of getting ahead, it is the route. Solve enough people's problems and your own goals take care of themselves." },
  { s: "zig", x: "mindset", n: "Motivation Wears Off", b: "Take It Daily",
    t: "He answered people who said motivation does not last by comparing it to bathing, which also does not last and is why it is done every day.",
    l: "Motivation fades by design, so stop expecting one burst to carry you. Refill it daily through what you read, hear and tell yourself." },
  { s: "zig", x: "mindset", n: "A Checkup From the Neck Up", b: "Stinking Thinking",
    t: "He urged audiences to give themselves a regular checkup from the neck up, looking for the negative thinking he called stinking thinking.",
    l: "Your thinking needs maintenance like anything else you rely on. Check it regularly and throw out the thoughts that are quietly holding you back." },
  { s: "zig", x: "internal", n: "Two and a Half Years of Struggle", b: "Before the Turn",
    t: "He spent roughly two and a half years struggling as a cookware salesman before the change that made him one of the company's top performers.",
    l: "Early struggle is not proof you are in the wrong place. Many people quit just before the point where the work would have started paying off." },
  { s: "zig", x: "internal", n: "Somebody Believed in Him", b: "A Mentor's Words",
    t: "He credited a manager, P. C. Merrell, who told him he could be great if he believed in himself and worked with purpose, for turning his career around.",
    l: "One sincere word of belief from somebody you respect can change a life. Be that voice for someone else, and notice the people who were it for you." },
  { s: "zig", x: "internal", n: "Faith at the Centre", b: "A Change in 1972",
    t: "He spoke openly about becoming a committed Christian in 1972 and about faith being the foundation of everything he taught afterwards.",
    l: "Knowing what you stand on makes you steady when everything else moves. Find the foundation you believe in and build the rest of your life on it." },
  { s: "zig", x: "external", n: "See You at the Top", b: "The Book Nobody Wanted",
    t: "His first book, See You at the Top, was turned down by many publishers before it appeared in 1975, and went on to sell well over a million copies.",
    l: "Rejection from gatekeepers says little about the value of the work. If you believe in it, find another way to get it in front of people." },
  { s: "zig", x: "external", n: "Door to Door", b: "Selling Pots and Pans",
    t: "He started out selling cookware door to door in the American South, learning to sell one kitchen at a time.",
    l: "The humble jobs teach the skills the big ones need. Learn to persuade one person at a time and you can later persuade a room of thousands." },
  { s: "zig", x: "external", n: "Stories, Not Lectures", b: "He Taught With Humour",
    t: "His talks were built on stories and jokes delivered in a strong Southern accent, which kept huge audiences listening for hours.",
    l: "People remember stories long after they forget advice. Wrap every lesson in a story worth retelling and it will travel without you." },
  { s: "zig", x: "karmic", n: "Father Gone at Five", b: "Raised by His Mother",
    t: "His father died when he was about five, and he grew up one of many children raised largely by his mother in Yazoo City during the Depression.",
    l: "A hard start can teach gratitude and grit that an easy one never will. Honour the people who carried you when you could not carry yourself." },
  { s: "zig", x: "karmic", n: "He Kept Speaking After the Fall", b: "His Daughter Beside Him",
    t: "After a fall in 2007 left him with memory problems, he kept speaking, with his daughter joining him on stage to help him through.",
    l: "Keep doing the work you love for as long as you can, even in a reduced form. Accept help without shame, because the message still matters." },
  { s: "zig", x: "karmic", n: "Gratitude", b: "Count What You Have",
    t: "He often taught that gratitude is one of the healthiest human emotions and that the more you express it, the more you find to be grateful for.",
    l: "Gratitude changes what you notice. Say thank you often, and you start seeing how much has already gone your way." },
  { s: "tony", x: "mindset", n: "Change Your State", b: "Body, Focus, Language",
    t: "Robbins teaches that how you feel is driven by your physiology, what you focus on and the language you use, and that changing any of the three changes the state.",
    l: "You can change how you feel faster than you think. Move your body, shift your focus and change the words you use, and the mood follows." },
  { s: "tony", x: "mindset", n: "Raise Your Standards", b: "Shoulds Become Musts",
    t: "He argues that people change when their shoulds become musts, meaning the day a standard stops being optional.",
    l: "You rarely rise to your wishes, you fall to your standards. Decide what is non-negotiable and your behaviour lines up with it." },
  { s: "tony", x: "mindset", n: "Decisions Shape Destiny", b: "Commit and Cut Off",
    t: "He teaches that a real decision means cutting off every other possibility, and that lives change in moments of real decision.",
    l: "Half-decisions keep you stuck between options. Decide fully, remove the exits, and the energy you spent hesitating goes into moving." },
  { s: "tony", x: "internal", n: "Left Home at Seventeen", b: "A Hard Childhood",
    t: "He has spoken about a chaotic childhood with a mother who was often abusive, and about leaving home at seventeen with very little.",
    l: "Your past explains you but it does not have to define you. Use what hurt you as the reason you refuse to pass it on." },
  { s: "tony", x: "internal", n: "Janitor, Then Promoter", b: "Starting at the Bottom",
    t: "As a teenager he worked as a janitor and then promoted seminars for Jim Rohn, learning the business of teaching from the back of the room.",
    l: "Get close to the work you want even if it is in the smallest role. The back of the room is still in the room." },
  { s: "tony", x: "internal", n: "Six Human Needs", b: "What Drives Behaviour",
    t: "He teaches that behaviour is driven by six needs: certainty, variety, significance, connection, growth and contribution.",
    l: "Understand what someone is really after and their behaviour stops confusing you. The same is true of your own choices, including the bad ones." },
  { s: "tony", x: "external", n: "Unlimited Power", b: "The First Book",
    t: "His first book, Unlimited Power, came out in 1986 and became a bestseller that launched him far beyond the seminar rooms.",
    l: "Put your method into a form people can take home. A book reaches the people who would never buy a ticket to see you." },
  { s: "tony", x: "external", n: "The Firewalk", b: "Proof in a Single Night",
    t: "His seminars became known for firewalks, where attendees walk across hot coals as a demonstration that fear can be overcome.",
    l: "A physical experience can change a belief faster than any argument. Give people proof they can feel and they remember it for years." },
  { s: "tony", x: "external", n: "Coaching at the Top", b: "Athletes and Leaders",
    t: "He has worked with well-known athletes, business leaders and politicians, which became part of how he marketed his own work.",
    l: "Results with visible people become proof for everybody else. Do excellent work for a few and let their success tell your story." },
  { s: "tony", x: "karmic", n: "The Thanksgiving Stranger", b: "Feeding Others Now",
    t: "He tells of a stranger bringing food to his family at Thanksgiving when he was a boy, and he later committed to providing billions of meals through food banks.",
    l: "One act of kindness can shape a life for decades. When you are able, become for someone else the stranger who once helped you." },
  { s: "tony", x: "karmic", n: "The Burns and the Allegations", b: "Criticism on the Record",
    t: "Dozens of attendees were treated for burns after a firewalk in 2016, and in 2019 a BuzzFeed News investigation reported allegations of misconduct, which he denied.",
    l: "Scale magnifies every risk and every accusation. The larger your platform, the more carefully you have to protect the people inside it." },
  { s: "tony", x: "karmic", n: "Decades on Stage", b: "The Energy Is the Product",
    t: "He has run events for more than four decades, known for multi-day sessions that last late into the night.",
    l: "Energy is part of what you deliver, not a side effect. Look after your body so it can carry the work for as long as you want to do it." },
  { s: "lesb", x: "mindset", n: "It Is Possible", b: "The Line He Repeats",
    t: "His signature message is that it is possible, repeated on stage as a direct challenge to audiences who have stopped believing in their own chances.",
    l: "Most people give up on what they want long before they have tested it. Start by accepting that it is possible, then find out how." },
  { s: "lesb", x: "mindset", n: "Someone Else's Opinion", b: "Is Not Your Reality",
    t: "He credits a teacher, Leroy Washington, who told him that someone else's opinion of him did not have to become his reality.",
    l: "Other people's labels only stick if you agree with them. Hear the judgement, then decide for yourself whether it is true." },
  { s: "lesb", x: "mindset", n: "Hungry", b: "Why He Uses the Word",
    t: "He tells audiences they have to be hungry, meaning they want the goal badly enough to act on it every day, not just wish for it.",
    l: "Wanting something mildly produces mild effort. Get clear on why it matters so much that the daily work stops feeling optional." },
  { s: "lesb", x: "internal", n: "Labelled a Slow Learner", b: "Held Back in School",
    t: "As a boy he was labelled educable mentally retarded and held back a grade, a label he says he believed for years.",
    l: "A label given in childhood can limit you until you question it. Look at what you were told you could not do and test it yourself." },
  { s: "lesb", x: "internal", n: "Adopted at Six Weeks", b: "Mamie Brown's Son",
    t: "He and his twin brother were adopted as babies by Mamie Brown, a single woman in Miami, whom he credits for everything he became.",
    l: "The person who takes you in shapes you more than where you came from. Honour the people who chose you when they did not have to." },
  { s: "lesb", x: "internal", n: "His Own Health", b: "Living With Cancer",
    t: "He has spoken publicly for years about being diagnosed with prostate cancer and continuing to work and speak through it.",
    l: "A hard diagnosis does not have to end the purpose you are living for. Keep working on what matters while you take care of your health." },
  { s: "lesb", x: "external", n: "Into Radio Through the Back Door", b: "The Errand Boy",
    t: "He got into radio by running errands at a Miami station, and got on air when a disc jockey was unable to finish his shift.",
    l: "Get inside the building in any role you can. When the opening comes, you have to already be standing close enough to take it." },
  { s: "lesb", x: "external", n: "Elected to the Legislature", b: "From the Microphone to Politics",
    t: "In the 1970s he was elected to the Ohio House of Representatives, moving from broadcasting into public service.",
    l: "Skills from one field carry into others more than you expect. A voice people trust on the radio can become a voice they trust in office." },
  { s: "lesb", x: "external", n: "Speaking as a Career", b: "Building a Name on Stage",
    t: "He became one of the most sought-after motivational speakers, with public television specials and books built on the same message.",
    l: "Find the one message you can deliver better than anyone and deliver it everywhere. Repetition in many rooms is how a name is built." },
  { s: "lesb", x: "karmic", n: "Helping His Mother", b: "The Reason Behind It",
    t: "He has long said that a large part of his drive came from wanting to take care of the mother who raised him.",
    l: "Knowing who you are working for makes hard days bearable. Keep the faces of the people you want to provide for in front of you." },
  { s: "lesb", x: "karmic", n: "The Marriage That Ended", b: "Public and Short",
    t: "His marriage to the singer Gladys Knight in the mid nineties was public and ended in divorce after about two years.",
    l: "Success on stage does not guarantee success at home. Give your closest relationships the same attention you give your career." },
  { s: "lesb", x: "karmic", n: "Leaving It Behind", b: "The Graveyard of Dreams",
    t: "He is widely quoted telling audiences that the richest place on earth is the graveyard, full of ideas and dreams that were never acted on.",
    l: "Do not take your best ideas to the grave. Act on them while you can, even imperfectly, because unused potential is the only real waste." },
  { s: "patag", x: "mindset", n: "A Blacksmith in a Shed", b: "Making the Gear He Needed",
    t: "In 1957 he taught himself blacksmithing to make reusable climbing pitons, and sold them to other climbers from the back of his car.",
    l: "Solve your own problem first, then sell the answer to people just like you. Being the first customer means you know exactly when it works." },
  { s: "patag", x: "mindset", n: "The Reluctant Businessman", b: "Business as a Tool",
    t: "He has long described himself as a climber and surfer who never wanted to be a businessman, and treats the company as a means to other ends.",
    l: "You can run a business without making it your identity. Knowing what the money is for keeps you from being run by the need for more of it." },
  { s: "patag", x: "mindset", n: "Let My People Go Surfing", b: "Treat Adults as Adults",
    t: "His 2005 book describes a company where people can leave to surf when the waves are good, as long as the work gets done.",
    l: "Trust people with their own time and judge them on results. A company that treats adults like adults gets the best of them rather than just their hours." },
  { s: "patag", x: "internal", n: "He Dropped His Best Seller", b: "The Pitons Were Scarring the Rock",
    t: "In 1972 his company turned away from its pitons, its biggest product, because repeated use was damaging climbing routes, and promoted removable chocks instead.",
    l: "Be willing to kill your own best seller when you can see it doing harm. Revenue this year is not worth a reputation built on damage you knew about." },
  { s: "patag", x: "internal", n: "The 1991 Layoffs", b: "Growing Too Fast",
    t: "In 1991 Patagonia outgrew what it could manage and had to lay off about a fifth of its staff, which he later wrote about as a hard lesson.",
    l: "Growth you cannot sustain is a debt with interest on it. Grow at the pace the business can carry, even when demand says you could go faster." },
  { s: "patag", x: "internal", n: "All Organic Cotton by 1996", b: "Acting on What You Learned",
    t: "After learning about the chemicals used to grow conventional cotton, Patagonia moved all of its cotton clothing to organic in 1996, at a real cost.",
    l: "Once you know something, you are responsible for acting on it. Changing course is expensive, but pretending you never knew costs more over time." },
  { s: "patag", x: "external", n: "Don't Buy This Jacket", b: "The Advert Against Buying",
    t: "On Black Friday in 2011 Patagonia ran a full-page advert in the New York Times telling people not to buy one of its jackets unless they needed it.",
    l: "Saying what nobody else in your market can say earns attention and trust together. Honesty that seems to cost you sales can build the loyalty that makes them." },
  { s: "patag", x: "external", n: "Worn Wear", b: "Repair Instead of Replace",
    t: "The Worn Wear programme repairs and resells used Patagonia gear, encouraging customers to keep clothing for longer rather than buy new.",

/* ONE PAINTER FOR BOTH STOPS, grouped by source in the app's own order.
   The heading takes no hue: a pane that mixes four axes has no axis for
   a colour to be about. */
function paintKept() {
  var p = $('#alKeptPane'); p.textContent = '';
  var list = st[st.stop].map(thOf).filter(Boolean);
  kick('#alKept', list.length, st.stop === 'pin' ? 'pinned' : 'highlighted');
  [].forEach.call(document.querySelectorAll('#alKeptStops .al-stop'), function (b) {
    b.setAttribute('aria-current', b.getAttribute('data-st') === st.stop ? 'true' : 'false');
  });
  if (!list.length) {
    p.appendChild(el('p', 'al-empty', st.stop === 'pin'
      ? 'Nothing pinned. A pin is the short list you are working from now, so keep it short.'
      : 'Nothing highlighted. A highlight is a line that landed, and there is no limit on those.'));
    mask(p); return;
  }
  SRC.forEach(function (x) {
    var rows = list.filter(function (t) { return t.s === x.i; });
    if (!rows.length) return;
    p.appendChild(el('div', 'al-grp al-caps', x.n));
    rows.forEach(function (t) { p.appendChild(card(t, 'kept', true)); });
  });
  mask(p);
}

/* A STORED VIEW OUTLIVES THE CODE THAT WROTE IT. Four names left this
   list in one pass, so a phone that was last on Karmic has to open on
   the figures rather than on a bar with nothing above it — which is
   what view()'s own fall-through already does, and why the list is
   written out rather than derived. */
var VIEWS = ['open', 'figures', 'books', 'kept', 'source'];
var COUNT = { figure: 0, book: 0, figureTh: 0, bookTh: 0 };
SRC.forEach(function (x) { COUNT[x.k]++; COUNT[x.k + 'Th'] += themesOfSrc(x.i).length; });
function view(v) {
  if (VIEWS.indexOf(v) < 0) v = 'figures';
  document.documentElement.setAttribute('data-view', v);
  VIEWS.forEach(function (x) {
    var n = $('#al' + x.charAt(0).toUpperCase() + x.slice(1));
    if (n) n.classList.toggle('is-on', x === v);
  });
  $('#alNav').hidden = (v === 'open' || v === 'source');
  $('#alSourceX').hidden = (v !== 'source');
  document.querySelectorAll('.al-tab').forEach(function (b) {
    b.setAttribute('aria-current', b.getAttribute('data-v') === v ? 'true' : 'false');
  });
  kick('#alFigures', COUNT.figure, 'people · ' + COUNT.figureTh + ' themes');
  kick('#alBooks', COUNT.book, 'books · ' + COUNT.bookTh + ' themes');
  if (v === 'figures' || v === 'books') paintIndex(v);
  if (v === 'kept') paintKept();
  if (v !== 'source') { st.last = v; save(); }
}

var sourceBack = 'figures';
function openSource(id) {
  if (!srcOf(id)) return;
  var now = document.documentElement.getAttribute('data-view');
  if (now !== 'source' && now !== 'open') sourceBack = now;
  paintSource(id);
  view('source');
}

document.addEventListener('click', function (e) {
  var t = e.target.closest
    ? e.target.closest('.al-tab, .al-f, .al-stop, .al-mk, .al-row, #alOpenB, #alSourceX') : null;
  if (!t) return;
  var m = t.getAttribute && t.getAttribute('data-mk');
  if (m) return mark(m, t.getAttribute('data-k'));
  var stop = t.getAttribute && t.getAttribute('data-st');
  if (stop) { st.stop = stop; save(); return paintKept(); }
  if (t.classList.contains('al-row')) return toggle(t);
  if (t.id === 'alOpenB') return view(VIEWS.indexOf(st.last) > 0 && st.last !== 'source' ? st.last : 'figures');
  if (t.id === 'alSourceX') return view(sourceBack);
  var id = t.getAttribute && t.getAttribute('data-src');
  if (id) return openSource(id);
  if (t.classList.contains('al-tab')) return view(t.getAttribute('data-v'));
});

/* THE FIGURES ON THE FIRST SCREEN ARE WRITTEN FROM THE DATA. The title
   and the paragraph under it said "seventeen" and "three hundred and
   five" by hand, and were wrong for a day after a source came out —
   nothing read them. A line of figures in the label register is what the
   reference does with a number anyway, and digits a check can read. */
$('#alOpenK').textContent = COUNT.figure + ' figures · ' + COUNT.book + ' books · ' + TH.length + ' themes';

view('open');
/* views() rather than a list the probes keep their own copy of: two of
   them drove view('light') and view('lessons') for months — names
   renamed out from under them, which view() falls through to 'figures'
   on — so one screen was measured three times and reported a pass. */
window.alDrive = { view: view, openSource: openSource, mark: mark, st: st, thOf: thOf,
                   views: function () { return VIEWS.slice(); } };

}());
</script>
</body>
</html>
