/* Each law in one line. A tag that opens nothing is a tag that reads
   as a category somebody forgot to wire up, and the whole point of
   naming the laws is that a story carries several and you can follow
   any of them sideways into the others that carry it. */
var LAWS = {
  'Correspondence': 'What is outside matches what is inside, and neither one is the cause of the other. The dream and the house are the same house.',
  'Inspired Action': 'A thing you have understood and not acted on has not been understood. The walking is not the delivery of the insight, it is the rest of it.',
  'Relativity': 'Nothing has a size of its own. It has a size against whatever you happen to be standing next to, and you choose what you stand next to far more often than you notice.',
  'The Stranger\u2019s Mouth': 'The answer arrives from somebody who does not know they are giving it, is not trying to help, and is often laughing at you while they do it.',
  'Cause and Effect': 'Every result is downstream of something, including the results you are calling luck. The question is never whether there was a cause, only whether you were looking at it.',
  'Attention': 'What you look at is not decided by what matters. It is decided by what is easy to look at, unless you intervene.',
  'Mentalism': 'You do not meet the world. You meet your account of it, continuously, and the account is made of what you already decided.',
  'Receptivity': 'Nothing new enters a full container. Being taught is a thing you have to make room for, and the room is made by putting something down.',
  'Rhythm': 'Everything swings. The high does not keep going up and the low is not the new floor, and both of them feel permanent from the inside.',
  'Polarity': 'Two opposite things are one thing measured at different points. Hot and cold are a single quantity, and so are your best day and your worst.',
  'Judgement': 'A verdict delivered early does not describe the event. It decides what you do next, which is how it makes itself true.',
  'Compensation': 'Everything is paid for. Not morally and not always fairly, but it comes out of an account somewhere, and the only variable is whether you knew the price.',
  'Sacrifice': 'A threshold charges you the thing that only made sense on the side you are leaving. That is not cruelty, it is the definition of a threshold.',
  'Envy': 'Every position has something visible above it that was not visible from below. A man who moves because of what he can see will move for ever.',
  'Vibration': 'Nothing is still. What looks like a state is a rate, and you are always either raising it or lowering it, never holding it.',
  'Power': 'What people do is explained by what they can afford to do, far more often than by what they believe.',
  'Attachment': 'The event has a duration. The carrying is a second thing, which you are doing, and it runs at full strength for as long as you keep feeding it.',
  'Strategy': 'Most impossible problems are ordinary problems with a rule attached that nobody put there on purpose and nobody has checked.',
  'Decision': 'A decision is not made when you know the answer. It is made when you close the other doors, and everything before that is research.',
  'Sufficiency': 'Having a thing and knowing you have it are two separate acquisitions, and people routinely complete the first and never start the second.',
  'Commitment': 'A way back does not get used. It drains a little pressure out of every hard thing instead, continuously, and the pressure was what was going to make you finish.',
  'Perpetual Transmutation': 'Nothing holds its form. What you are working on is already becoming something else, and so is what is standing in your way.',
  'Legacy': 'The work outlives the worker, which is the only reason a thing bigger than a life is worth beginning at all.'
};

  t.appendChild(el('span', 'al-caps', x.stage));
  b.appendChild(t);
  var g = el('span', 'al-go'); g.innerHTML = ARROW; b.appendChild(g);
  return b;
}

function paintLaw(name) {
  var p = $('#alLawPane'); p.textContent = '';
  var fam = null;
  S.forEach(function (x) { x.laws.forEach(function (l) { if (l.n === name) fam = l.f; }); });
  var FAM = { inner: 'The inner world', motion: 'Motion', others: 'Other people', time: 'Time' };

  var lead = el('div', 'al-lead is-short');
  lead.appendChild(el('h1', 'al-disp', name));
  lead.appendChild(el('div', 'al-caps', FAM[fam] || ''));
  p.appendChild(lead);

  var sh = el('div', 'al-sheet');
  var d = el('p', 'al-body'); d.textContent = LAWS[name] || '';
  d.style.marginBottom = '26px';
  sh.appendChild(d);

  var carry = S.filter(function (x) {
    return x.laws.some(function (l) { return l.n === name; });
  });
  var h = el('div', 'al-rule-hd');
  h.appendChild(el('span', 'al-caps', carry.length === 1 ? 'One story carries it' : carry.length + ' stories carry it'));
  sh.appendChild(h);
  carry.forEach(function (x) { sh.appendChild(lawRow(x)); });

  p.appendChild(sh);
  p.scrollTop = 0; mask(p);
}

function paintLaws() {
  var p = $('#alLawsPane'); p.textContent = '';
  var seen = {}, fams = { inner: 'The inner world', motion: 'Motion', others: 'Other people', time: 'Time' };
  for (var f in fams) {
    var rows = [];
    S.forEach(function (s) { s.laws.forEach(function (l) {
      if (l.f === f && !seen[l.n]) { seen[l.n] = 1; rows.push(l); } }); });
    if (!rows.length) continue;
    p.appendChild(el('div', 'al-grp al-caps', fams[f]));
    var w = el('div', 'al-tags');
    rows.forEach(function (l) {
      var t = el('button', 'al-tag', l.n);
      t.setAttribute('data-f', l.f); t.setAttribute('data-law', l.n);
      w.appendChild(t);
    });
    p.appendChild(w);
  }
  mask(p);
}

function paintRules() {
  var p = $('#alRulesPane'); p.textContent = '';
  S.forEach(function (s) {
    var d = el('div', 'al-rule');
    d.appendChild(el('div', 'al-caps', s.stage));
    d.appendChild(el('b', null, s.rule));
    p.appendChild(d);
  });
  mask(p);
}

function paintStory(s) {
  var p = $('#alStoryPane'); p.textContent = '';
  bg(s.bg);

  var lead = el('div', 'al-lead');
  var mk = el('div', 'al-mark'); mk.innerHTML = MARK; lead.appendChild(mk);
  lead.appendChild(el('h1', 'al-disp', s.n));
  lead.appendChild(el('div', 'al-caps', s.stage));
  lead.appendChild(el('div', 'al-note', s.src + '  ·  ' + s.mins + ' min'));
  p.appendChild(lead);

  /* Everything past the lead sits on its own ground, and the ground is
     a CHILD of the scroll rather than the fixed photograph behind it. */
  var sh = el('div', 'al-sheet');

  var t = el('div', 'al-txt al-body');
  (s.body || []).forEach(function (x) { t.appendChild(el('p', null, x)); });
  sh.appendChild(t);

  var h = el('div', 'al-rule-hd'); h.appendChild(el('span', 'al-caps', 'What it teaches'));
  sh.appendChild(h);

  var tg = el('div', 'al-tags');
  s.laws.forEach(function (l) {
    var x = el('button', 'al-tag', l.n);
    x.setAttribute('data-f', l.f); x.setAttribute('data-law', l.n);
    tg.appendChild(x);
  });
  sh.appendChild(tg);

  if (s.teach) { var tb = el('p', 'al-body'); tb.textContent = s.teach; tb.style.marginBottom = '22px'; sh.appendChild(tb); }

  var r = el('div', 'al-rule');
  r.appendChild(el('div', 'al-caps', 'The rule'));
  r.appendChild(el('b', null, s.rule));
  sh.appendChild(r);

  var q = el('div', 'al-q');
  q.appendChild(el('div', 'al-caps', 'The question'));
  q.appendChild(el('b', null, s.q));
  sh.appendChild(q);

  var nx = null, at = S.indexOf(s);
  for (var k = at + 1; k < S.length; k++) { if (S[k].body) { nx = S[k]; break; } }
  var acts = el('div', 'al-acts');
  var a1 = el('button', 'al-pill is-grow', nx ? 'The next story' : 'Back to the Arc');
  a1.setAttribute('data-go', nx ? nx.id : 'arc');
  acts.appendChild(a1);
  if (nx) { var a2 = el('button', 'al-pill is-glass', 'The Arc'); a2.setAttribute('data-go', 'arc'); acts.appendChild(a2); }
  sh.appendChild(acts);

  p.appendChild(sh);
  p.scrollTop = 0; mask(p);
}

var VIEWS = ['open', 'arc', 'laws', 'rules', 'story', 'law'];
function view(v) {
  if (VIEWS.indexOf(v) < 0) v = 'arc';
  document.documentElement.setAttribute('data-view', v);
  VIEWS.forEach(function (x) {
    var n = $('#al' + x.charAt(0).toUpperCase() + x.slice(1));
    if (n) n.classList.toggle('is-on', x === v);
  });
  $('#alFoot').hidden = (v === 'open' || v === 'story' || v === 'law');
  $('#alStoryX').hidden = (v !== 'story');
  $('#alLawX').hidden = (v !== 'law');
  document.querySelectorAll('.al-tab').forEach(function (b) {
    b.setAttribute('aria-current', b.getAttribute('data-v') === v ? 'true' : 'false');
  });
  $('#alBg').classList.toggle('is-sage', v === 'arc' || v === 'laws' || v === 'rules');
  document.querySelectorAll('.al-count').forEach(function (n) {
    n.textContent = st.read.length + ' of ' + S.length;
  });
  if (v === 'arc') { bg('curve'); paintArc(); }
  if (v === 'laws') { bg('silk'); paintLaws(); }
  if (v === 'law') { $('#alBg').classList.remove('is-sage'); }
  if (v === 'rules') { bg('umber'); paintRules(); }
}

var lawBack = 'laws';
function openLaw(name) {
  if (!LAWS[name]) return;
  var now = document.documentElement.getAttribute('data-view');
  if (now === 'story' || now === 'laws' || now === 'arc') lawBack = now === 'story' ? 'story' : now;
  paintLaw(name);
  view('law');
}

function open(id) {
  var s = byId(id);
  if (!s || !s.body) return;
  st.last = id;
  if (st.read.indexOf(id) < 0) st.read.push(id);
  save();
  paintStory(s);
  view('story');
}

document.addEventListener('click', function (e) {
  var t = e.target.closest ? e.target.closest('.al-tab, .al-card, .al-pill, .al-tag, .al-lrow, #alOpenB, #alStoryX, #alLawX') : null;
  if (!t) return;
  if (t.id === 'alOpenB') { var r = st.last && byId(st.last); return r && r.body ? open(r.id) : view('arc'); }
  var go = t.getAttribute && t.getAttribute('data-go');
  if (go) return go === 'arc' ? view('arc') : open(go);
  if (t.id === 'alStoryX') return view('arc');
  if (t.id === 'alLawX') return lawBack === 'story' ? view('story') : view(lawBack);
  var law = t.getAttribute && t.getAttribute('data-law');
  if (law) return openLaw(law);
  if (t.classList.contains('al-lrow')) return open(t.getAttribute('data-id'));
  if (t.classList.contains('al-tab')) return view(t.getAttribute('data-v'));
  if (t.classList.contains('al-card')) return open(t.getAttribute('data-id'));
});

var resume = st.last && byId(st.last);
if (resume) { $('#alOpenB').textContent = 'Continue'; $('#alOpenN').textContent = 'You stopped at ' + resume.n + '.'; }
bg('desert');
view('open');
window.alDrive = { view: view, open: open };

}());
</script>
</body>
</html>
