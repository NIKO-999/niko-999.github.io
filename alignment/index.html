    l: "What happens to you is shaped more by your patterns than by luck. That is uncomfortable, because it removes the easy explanation, and it is also encouraging, because patterns can be changed where luck cannot. Take responsibility for the causes and the effects start to change. This does not mean everything is your fault; it means that the part you can influence is the part you hold in your own thinking and habits, so that is where to look. When you notice a result you keep getting, ask what thought or pattern keeps producing it. Treat the answer as a cause to work on rather than a verdict on you. Over time the results shift because the source of them has been altered." },
  { s: "big", x: "mindset", n: "Excusitis", b: "The Failure Disease",
    t: "Schwartz names the habit of making excuses excusitis, and lists health, intelligence, age and luck as its most common forms. Giving it a name and a disease-like label is deliberate: it presents the habit as a condition that spreads and weakens, not as a harmless way of explaining things. The four forms he lists are the ones people most readily use to account for not having succeeded. The distinction drawn is between a real obstacle and a reason offered in place of effort. Excuses of this kind are said to cause failure by supplying a ready explanation for stopping. Schwartz holds that the habit is common and that it blocks success in its own right, whatever the circumstances that are being blamed.",
    l: "Every excuse is permission you gave yourself to stop. It sounds like an explanation, but its function is to make not trying feel reasonable. Health, intelligence, age and luck are the common ones because each of them contains a grain of truth, and that grain is what makes the excuse hard to challenge. Notice which one you reach for most often, because that is the one holding you back. The point is not to deny real limits. It is to see the difference between a limit that shapes how you proceed and an excuse that decides you will not proceed at all. Once you can hear the excuse as it forms, you can ask what you would do if it were not available, and then do that." },
  { s: "big", x: "mindset", n: "Believe You Can", b: "Belief Starts the Engine",
    t: "The book opens with the claim that believing you can succeed calls up the power, the skill and the energy needed to do it. Belief is placed first, before method and before effort, and it is described as the thing that makes the other resources available. The idea is that capacity responds to conviction: a person who expects to succeed draws on abilities and energy that a doubtful person never reaches. The distinction is between belief as a feeling and belief as a working condition. Schwartz does not present it as wishing; he presents it as the start of the engine, without which the rest of the machinery does not turn. The opening position of the book is therefore that how you rate your chances influences what you bring to the attempt.",
    l: "Belief is not a guarantee, it is a starting condition. It does not make the result certain, but without it you never try hard enough to find out whether you could have done it. A person who doubts holds back effort in advance, which guarantees the weak result the doubt predicted. Treat belief as a decision about how much of yourself to commit. When you believe you can, you commit the energy, the skill and the persistence the task needs, and you give the attempt a real chance. Watch for the quiet assumption that something is beyond you before you have tested it. That assumption does its damage before any evidence exists, and it is the one you can change first." },
  { s: "big", x: "mindset", n: "The Size of Your Thinking", b: "Aim Higher",
    t: "He argues that people are measured by the size of their thinking, and that most people aim far lower than they could. The measure of a person, on this view, is not talent or background but the scale of what they allow themselves to consider. Schwartz holds that thinking small produces small results, and that thinking large opens larger ones, since effort and choice follow the target. The distinction is between actual capacity and the capacity people assume they have. Most, he says, set their aims below what they could reach, and so their results are limited by their own expectations rather than by any outer boundary. The book asks the reader to look at the size of their usual aims and to see that the limit is largely self-imposed.",
    l: "The ceiling you set is usually far below the one that exists. Most limits you feel are drawn by your own sense of what is reasonable to want, not by the world. Raise the target and your effort and your choices rise to meet it, because a bigger aim demands different decisions about time, company and preparation. A small aim lets you stay as you are. Look at what you currently ask of yourself and consider whether it reflects your capacity or only your habit of expecting little. You do not need to be certain you can reach the larger goal. You need to see that the smaller one was chosen by caution rather than by evidence, and then aim where the evidence allows." },
  { s: "big", x: "internal", n: "Action Cures Fear", b: "Do Something",
    t: "Schwartz recommends meeting fear with action, arguing that indecision and delay feed it while doing something shrinks it. The relationship he describes runs in two directions. Waiting gives fear room: the longer a person hesitates, the larger the thing feared appears, because nothing has been done to test or reduce it. Acting works the other way, since movement replaces speculation with fact and the feared thing loses force. The distinction is between thinking about a fear and doing something about it. He treats the first as a way of strengthening it and the second as the cure. The book therefore advises that when fear arrives, the useful response is to move toward the problem with a concrete step rather than to deliberate until the fear subsides.",
    l: "Fear grows while you wait and shrinks while you move. Delay feels like caution, but it gives the fear more time to expand and the imagination more to work with. Take one concrete step and the fear loses most of the hold it had on you, because it was built mostly from what you had not yet done. The step does not need to be large; it needs to be real. Watch for the moment when you start preparing endlessly or putting off a decision, since that is often fear dressed as prudence. Acting does not remove the feeling at once, but it changes your relationship to it. You stop being a person who is afraid and start being a person who is doing something." },
  { s: "big", x: "internal", n: "Sit at the Front", b: "Small Confidence Habits",
    t: "He suggests simple habits for building confidence: sitting at the front, making eye contact, walking faster and speaking up in meetings. The habits are small and physical, and each is something a person can do without first feeling confident. Schwartz's idea is that confidence is not only a feeling that produces behaviour but also a behaviour that produces the feeling. Position, pace and voice are visible signs of confidence, and adopting them is a way of building it. The distinction is between waiting to feel sure and acting in the manner of someone who is. The habits are modest on purpose, because their value lies in repetition. Taken together they are presented as a practical route to a more confident self, built from ordinary conduct rather than inner effort alone.",
    l: "Confidence is built from small behaviours repeated. You do not have to feel ready before you start; the feeling follows the practice. Act the part in little ways every day and the feeling catches up with you. Where you sit, how you move and whether you speak are choices, and each one tells you something about how you are treating yourself. If you habitually take the back, look away and stay silent, you are rehearsing smallness. Reverse the rehearsal in the small things and the larger confidence has something to stand on. This is not performance for others. It is training for yourself, done through conduct that is within your reach on any ordinary day." },
  { s: "big", x: "internal", n: "Salvage Something From Defeat", b: "Take the Lesson, Leave the Shame",
    t: "The book advises treating each setback as a lesson, studying it for what can be used rather than dwelling on what was lost. The advice separates two ways of looking at the same event. One focuses on the loss and tends to produce regret, shame and a reluctance to try again. The other asks what the experience can teach and treats the answer as a gain. Schwartz favours the second. The distinction is between a setback as an ending and a setback as information. By examining it for what can be used, the person takes something of value from the event and carries it forward. The title's word, salvage, expresses the idea: even a defeat contains material worth recovering, and the task is to recover it.",
    l: "A setback only becomes a failure if you learn nothing from it. The event itself is fixed; what you do with it afterwards is not. Take the lesson, leave the shame behind, and use it the next time. Shame looks backward and keeps you small, while a lesson looks forward and makes you more capable. When something goes wrong, ask what it showed you about the plan, the preparation or your own assumptions, and hold that as useful. Do not punish yourself in a way that makes you avoid the next attempt. Recovery is quicker when you extract the usable part early and let the rest go, because the lesson is the only part still worth carrying." },
  { s: "big", x: "external", n: "Psychological Poison", b: "Watch Your Environment",
    t: "Schwartz warns against small-minded company and negative talk, which he calls psychological poison, and urges time spent with people who think larger. The term poison suggests slow, unnoticed action: small thinking and negative talk are said to spread from other people into your own outlook. The environment of conversation and company is therefore treated as a real influence on how large you think. The distinction is between people who widen your sense of what is possible and people who narrow it. Schwartz urges deliberate choice of the first and avoidance of the second. The advice concerns the thinking of the people around you. The book holds that the surroundings of a mind shape it, so surroundings should be selected with the same care as any other input.",
    l: "The people around you set your sense of what is normal. If those around you complain, shrink every idea and expect little, you absorb their limits without ever deciding to. Spend time with those who expect more and your standards rise without being forced. Choose company as you would choose what to put into your body, because it enters you the same way, gradually and unnoticed. This does not require cutting anyone off dramatically. It requires noticing what a conversation does to your thinking and seeking out more of the kind that expands it. Pay attention to how you feel and what you believe is possible after time with particular people. That is a reliable measure of whether they are feeding you or poisoning you." },
  { s: "big", x: "external", n: "Look Important", b: "Appearance Talks First",
    t: "He argues that dressing and presenting yourself well affects both how others treat you and how you think about yourself. Schwartz links appearance to two audiences. Other people read it and respond accordingly, and the person wearing it reads it too, adjusting their self-regard to match. The claim is that presentation is not mere vanity but a factor in how you are received and how you see yourself. The distinction is between appearance as decoration and appearance as communication. A well-presented person signals seriousness, and that signal feeds back into behaviour. The book treats this as a practical matter, part of the wider theme that outward habits shape inner attitude, and it recommends giving presentation deliberate attention instead of leaving it to chance.",
    l: "How you present yourself sends a message before you speak. People form a view quickly, and they treat you according to it. The message also reaches you, because the way you look shapes the way you feel about yourself. Look like somebody who takes their goals seriously and you start acting like one. This is not about expense or fashion. It is about showing, through care of your appearance, that you regard yourself and your aims as worth the effort. Neglect says the opposite, to others and to you. Treat your presentation as part of how you prepare, the same as any other, and let it support the person you are working to become. Small standards held daily change how you carry yourself." },
  { s: "big", x: "external", n: "A Ten-Year Plan", b: "Goals on Paper",
    t: "The book recommends setting concrete long-term goals, including a written plan for the next ten years of work, home and social life. The recommendation has three features: the goals are concrete, they are long-term, and they are written. The plan is not limited to a career but covers work, home and social life, so it treats the whole shape of a life as something to be designed. The distinction is between a wish and a goal. A wish stays vague and carries no commitment, while a written plan fixes a destination in specific terms. Schwartz holds that having such a plan gives direction to present effort. A ten-year span is long enough to ask for real ambition and to organise the choices made along the way.",
    l: "Vague wishes stay wishes. A hope without detail asks nothing of you, so nothing happens. Write down where you want to be and every daily choice has something to line up against. The writing matters because it forces specifics: what work, what home, what kind of social life. Once those are on paper, you can tell whether today's decisions move toward them or away. A long horizon helps, since it stops you judging each week on its own and lets small efforts add up in a direction. The plan will change as you learn, and that is acceptable. What cannot work is having no plan at all and expecting the days to arrange themselves into something you wanted. Decide, then commit it to paper." },
  { s: "big", x: "karmic", n: "Think Like a Leader", b: "Lift the People Around You",
    t: "Schwartz describes good leaders as people who think of the needs of others, believe in progress and make time to think alone. Three qualities are named. The first is attention to what other people need rather than to oneself alone. The second is belief in progress, a settled expectation that things can improve. The third is solitude for thinking, time set aside deliberately to reflect. The distinction implied is between leading as commanding and leading as serving and thinking. A leader, on this account, is defined by orientation toward others and toward the future, and by a habit of reflection. The book treats these as habits of thought, and it places leadership within the wider theme of thinking big, since each quality involves looking beyond the immediate self.",
    l: "Leadership is mostly how you treat people and how clearly you think. Position matters less than orientation. If you consider what others need, expect things to improve and set aside time to think alone, you already carry the core of it. Help others grow and they will carry you further than your own effort could, because their capability becomes part of what you can accomplish. The solitary time is easy to skip and is the part that keeps the rest sound; clear judgement comes from reflection, not from constant motion. Look at whether you tend to ask what you can get or what others need. Leaders lean toward the second, and people notice. Build the habits first and the responsibility tends to follow." },
  { s: "big", x: "karmic", n: "Still Selling Since 1959", b: "The Basics Do Not Date",
    t: "The book first appeared in 1959, written by a professor and consultant, and has sold millions of copies since then. The entry records the book's origin and its endurance. Its author wrote it from the position of a professor and consultant, and its sales have run to millions over a long span. The fact is offered as evidence of lasting usefulness: advice that continues to find readers across so many years has evidently held something people keep needing. The distinction at work is between what is fashionable and what is basic. Fashionable ideas pass, while basic ones persist. The book's sales history is therefore read as a sign that its subjects, belief, action and effort, address needs that do not date.",
    l: "Practical advice outlasts fashion. What sells for decades is rarely clever; it is usually basic and reliably useful. The basics of belief, action and effort never go out of date, because people keep on needing them. Do not dismiss an idea because it is old or plain. The plainness is often what let it survive. If a principle has helped many people over a long time, treat that as evidence worth weighing. Your own progress also depends more on the basics done steadily than on novel methods adopted and dropped. Return to the simple things: believe you can, act, keep at the work. They are not exciting and they are not obsolete, and they will serve you as long as you keep using them." },
  { s: "big", x: "karmic", n: "Attitude Shows", b: "People Answer in Kind",
    t: "He argues that people sense your attitude towards them and respond in kind, so a positive attitude creates cooperation around you. The argument rests on an observation about how attitudes travel. A person's feelings toward others show in conduct and manner, and those on the receiving end pick them up and answer accordingly. Goodwill tends to draw goodwill, and hostility or indifference tends to draw the same. The distinction is between attitude kept private and attitude as it actually appears. Schwartz holds that the second is what people respond to. From this he draws a practical conclusion: a positive attitude is not only pleasant but useful, since it builds cooperation. The book treats your outlook on others as a factor in the treatment you receive.",
    l: "The way you feel about people shows, whether you say it or not. Tone, timing and attention give you away, and other people respond to what they read. Bring goodwill into the room and you will usually get it back. This works as a pattern, not a promise, but it is reliable enough to plan around. If your dealings with people are strained, look first at what you are bringing. Contempt and impatience tend to produce the resistance you then complain about. A positive attitude toward others makes cooperation easier to get, and it costs you only the discipline to hold it. Treat it as a habit of thought you maintain deliberately, and watch how the responses around you shift to match." },
  { s: "bab", x: "mindset", n: "Pay Yourself First", b: "A Part of All You Earn",
    t: "Clason's central lesson, told through the character Arkad, is that a part of everything you earn is yours to keep, at least one tenth of it. The lesson is told through a story rather than argued, and Arkad is the figure who carries it. What matters is the form of the rule: a part of all income, set apart as the owner's own, and not less than a tenth. The distinction is between money kept for yourself and money passed on to everyone else, whether through spending or debts. Clason holds that a person who keeps a fixed share has begun building wealth, while a person who keeps only what remains has not. The rule is simple on purpose, and the book makes it the foundation of its counsel about money.",
    l: "Save before you spend, never from whatever happens to be left over. Left over is usually nothing, because spending expands to take whatever is available. Keeping a fixed share first is the habit that turns income into wealth. The share belongs to you, and it is taken off the top as a matter of course, before the demands of the month have a chance to claim it. A tenth is the floor the book names, not a ceiling. What counts is that the habit is regular and does not depend on your mood or how the month went. Begin with the rule even if the amount feels small. The discipline of keeping a part of all you earn matters more at the start than the size of the sum." },
  { s: "bab", x: "mindset", n: "The Brick Maker's Jewels", b: "Advice From Those Who Know",
    t: "In one parable Arkad loses his savings by trusting a brick maker to buy jewels for him, and the jewels turn out to be worthless glass. The brick maker knows bricks, not jewels, so his choice of stones carries no authority. The distinction the story draws is between a person's general standing and their competence in a particular trade. A man may be trusted and well regarded and still be the wrong person to advise on a matter he does not know. Arkad's loss is the consequence of treating a trusted acquaintance as an expert. The parable is used to teach that money advice should come from those with real experience in handling that kind of money, and that confidence is no substitute for it.",
    l: "Take advice about money only from people who know that trade. Confidence from somebody outside their field is how savings disappear. A person can be friendly, trusted and entirely sure of themselves and still be wrong about a subject they have not studied. Before you act on a suggestion, ask whether the one giving it has real experience of the matter at hand. Warm manner and certainty are not credentials. This applies to investments, purchases and any decision where the cost of an error is your own savings. Be willing to say that someone you like is the wrong source. It costs you a little awkwardness, whereas following the wrong source can cost you what you spent years setting aside." },
  { s: "bab", x: "mindset", n: "Make Money Work", b: "Savings That Earn",
    t: "The book urges readers to put their savings to work so they earn more, with every coin bringing others back to its owner. The image is of coins as workers: each one that is put to use returns to its owner with others. Savings left idle do nothing, while savings placed to earn grow in number. The distinction Clason draws is between money that is merely kept and money that is made to work. Keeping a part of income is the first step, and putting that part to use is the second. The book treats both as necessary, since saving without employing the savings leaves the owner short of what the money could have produced. Wealth, in this telling, is built by money that earns as well as by money that is retained.",
    l: "Money sitting still loses to time. The sum you set aside is only the starting material; its value depends on whether you put it somewhere it can earn. Put your savings somewhere they earn, so your money keeps working while you do. Each coin that works brings others back to you, and those begin to work in their turn. Saving gives you the first coin and employment gives you the rest. This should be done with the other warnings in mind, taking advice from people who know their trade and protecting the principal. Idle savings feel safe, but they leave the growth to chance. Treat your money as something with a job to do, and check that it is doing it." },
  { s: "bab", x: "internal", n: "Control Your Spending", b: "Needs Grow to Fit Income",
    t: "Clason warns that what we call necessary expenses will always grow to equal our income unless we deliberately control them. The warning concerns the way the word necessary stretches. As income rises, so does the list of things felt to be required, until spending matches what comes in, whatever its size. The distinction is between needs that are actually fixed and needs that merely expand to occupy the room available. Clason holds that only deliberate control prevents this: left alone, expenses rise to meet income. The book therefore treats budgeting as an act of will rather than a matter of arithmetic. The point is that a surplus does not arise by accident, and a person must decide to hold spending below income if any part of it is to be kept.",
    l: "Spending expands to fill whatever you earn. Each rise in income brings new things that begin to feel necessary, and soon the extra is gone and nothing has changed. Budget on purpose, or every pay rise will vanish into a lifestyle you never actually chose. A budget is a decision made in advance, when you are thinking clearly, about what each part of your income is for. Without one, the decisions are made piece by piece in the moment, usually in favour of spending. Look at what you now call necessary and ask which of it you would have counted as necessary earlier. The gap shows how far your needs have drifted. Hold spending below income deliberately, or it will rise to meet it." },
  { s: "bab", x: "internal", n: "Where Determination Is", b: "Dabasir's Debts",
    t: "The camel trader Dabasir, once enslaved and deep in debt, recovers by deciding to repay everything he owes, one creditor at a time. The story's turning point is a decision. Dabasir's condition is as low as the book describes, and what changes it is a firm resolve to pay what he owes, followed by steady repayment, one creditor after another. The distinction is between being overwhelmed by a debt as a whole and facing it as a series of separate obligations. The title points to determination as the quality that matters. Clason uses Dabasir to show that a person in a hopeless-looking position can climb out by deciding to and then acting on it. The recovery is of circumstances and also of the man himself.",
    l: "Getting out of a hole starts with deciding that you will. Nothing improves while you are still negotiating with yourself about whether it is possible. Face the debt honestly, plan to repay it, and your self-respect returns before the balance does. The decision is the first payment. After it, the work is a matter of taking creditors one at a time rather than being crushed by the total. Do not wait until the full sum can be cleared before you begin. Looking squarely at what you owe, and committing to a path of repayment, changes how you see yourself and what you are able to do. That change tends to come first, and it supplies the strength for the long process that follows." },
  { s: "bab", x: "internal", n: "Luck Follows Action", b: "Opportunity Is Taken",
    t: "In the chapter on luck the characters conclude that good fortune tends to come to people who act on opportunities rather than hesitate. The conclusion changes what luck is taken to be. It is treated less as an outside force that visits some people at random than as something that favours those who are ready to move when a chance appears. The distinction is between the person who sees an opening and takes it and the person who sees it and waits. The characters hold that what separates the fortunate is readiness to act. The book thus connects luck with conduct. Hesitation lets the opening pass, and fortune goes to whoever acted, so the habit of acting is presented as the closest thing to a means of attracting it.",
    l: "Luck mostly visits people who are already moving. A chance is only useful to someone positioned and willing to take it, and hesitation turns it into one that passed. Stop waiting for the perfect moment and act when the opening appears. The perfect moment seldom comes, and the wait itself is a way of declining. This does not ask you to be reckless; it asks you to notice that delay has a cost and that the cost is usually the opportunity. Prepare so you are able to move, then move when it counts. Looking back, those who seem lucky have often simply said yes sooner. Treat the habit of acting promptly on good openings as part of your fortune, not as something separate from it." },
  { s: "bab", x: "external", n: "Guard Against Loss", b: "Safety Before Return",
    t: "Clason advises protecting savings from loss by lending or investing only where the principal is safe and the return is reasonable. Two conditions are set. The principal, the original sum, must be secure, and the return should be reasonable and not extravagant. The distinction is between a profitable promise and a safe one. A high promised return is not a reason to lend or invest if the original amount is at risk. Clason places safety before gain, which is why the section is about guarding against loss. The book holds that a saver builds wealth slowly and cannot afford to lose what has been put by, so protection of the principal comes before the pursuit of a larger return. A modest, secure outcome is preferred to a bold, uncertain one.",
    l: "Losing money is easy and recovering it is slow. A loss takes away not only the sum but the time it took to accumulate it. Protect what you have before you chase more, because the first rule is not to lose it. Ask of any opportunity how safe the original amount is, and treat the promised return as secondary. A reasonable return on a safe sum, kept up over time, beats a larger return that might not arrive. The urge to reach for more is strongest when you feel you are behind, and that is when care matters most. Hold yourself to the discipline of safety first. It will sometimes mean passing up something attractive, and that is the price of keeping what you have saved." },
  { s: "bab", x: "external", n: "Own Your Home", b: "A Place That Is Yours",
    t: "The book lists owning the home you live in as one of its cures for a lean purse, for the security and the savings it brings. Ownership is presented as a remedy for thin finances. Two benefits are named: security, in the sense of having a place that is one's own, and savings. The distinction is between living in a place and owning it. Clason places the home among the practical measures a person can take to improve their position, alongside the other cures the book proposes. The reasoning is that a settled base steadies a person's finances and gives the effort of saving a tangible result. The cure is aimed at those whose purse is lean, and it is offered as a practical step rather than a luxury.",
    l: "Owning where you live gives a stability that renting rarely does. A home that is yours is a base you can plan around, and it turns part of what you spend into something you hold. Build towards a base that nobody can take away from you. This is a long project and does not need to be rushed; it needs to be held as an aim. Knowing what you are working toward changes how you treat saving, because the money has a destination. Security of this kind also frees attention for other things, since you are not concerned about losing your footing. Consider what a settled place would do for your finances and your peace of mind, and make owning it one of the goals your saving serves." },
  { s: "bab", x: "external", n: "Increase Your Ability to Earn", b: "Get Better at the Work",
    t: "Clason advises improving your skills so that you can earn more, arguing that a wiser, more capable worker is worth more. The reasoning is plain: pay follows value, and value follows skill and understanding. A worker who learns more and does better work can claim more in return. The distinction is between simply working and growing in the work. The book places this beside saving and investing as another way to improve one's money position, one that raises what comes in instead of managing what goes out. Wealth depends on the amount earned as well as on the share kept, so increasing the ability to earn enlarges the base from which both saving and investing proceed. Improvement of the person is thus treated as a financial act.",
    l: "Your earning power is your biggest asset early on. Savings are small when you start, and what grows fastest is your capacity to earn. Invest in your skills and every future pay rise is built on top of them. Becoming wiser and more capable at your work raises your worth, and raised worth is what gets paid. Do not treat learning as separate from money; it is one of the most direct ways of increasing it. Look at where your skills are thin relative to what your work needs and decide to improve them. The effort pays back across everything you earn afterwards. Combine it with the habit of keeping a part of what you make, and a higher income becomes a way to build more." },
  { s: "bab", x: "karmic", n: "Provide for Later Years", b: "Income When You Cannot Work",
    t: "One of the book's cures is to ensure an income for old age and for the protection of your family after you. The cure looks beyond the present to two later needs: the years when a person can no longer earn, and the people who depend on them once they are gone. The distinction is between providing for today and providing for a time one cannot control. Clason treats these as part of sound handling of money, because a person who spends and saves only for the present leaves the future exposed. An income that continues when work stops answers the first need, and protection for the family answers the second. The book holds that responsible money habits include looking ahead to these ends and acting on them while it is still possible.",
    l: "Your future self depends on what you do now. The years in which you cannot work will arrive whether or not you prepared for them, and the only thing you control is whether income is waiting. Set something aside for the years you cannot work, and for the people who rely on you. Those people have no say in your planning, so the duty to them falls on you. It is easy to put this off because it feels distant, and that distance is what makes it dangerous. Begin early and keep at it, since time is the largest resource you have for it. Think of it as a message to a later version of yourself and to your family, saying that you thought of them in advance." },
  { s: "bab", x: "karmic", n: "The Walls of the City", b: "Protection Before the Attack",
    t: "A story about the walls that defended the city during a siege is used to argue for protection, such as insurance and savings, against the unexpected. The walls are the protection standing between the city and the attack. The story turns that image into a principle: provision against danger must exist before the danger arrives, because it cannot be made once the danger is on the doorstep. Insurance and savings are named as the forms this takes in a person's finances. The distinction is between preparing for what is known and preparing for what is not. Clason uses the siege to show that unexpected events are certain in a general sense and that a prudent person arranges protection ahead of them rather than hoping to avoid them.",
    l: "Protection feels like wasted money right up until the day you need it. Insurance and savings against the unexpected cost you something in quiet times and repay it only when trouble arrives, which is why it is easy to skip. Build your walls before the attack comes, not while it is happening. Once the siege has begun it is too late to start laying stone. Ask what in your life would be damaged by a sudden loss, an illness or a failure, and whether you have anything standing between you and it. Paying for that protection is not pessimism. It is the acknowledgement that surprises occur and that being ready is cheaper than being caught without. Keep your defences maintained even when nothing seems to threaten them." },
  { s: "bab", x: "karmic", n: "Pamphlets From 1926", b: "Parables That Lasted",
    t: "The book grew out of pamphlets Clason wrote for banks and financial firms and was published in 1926, using ancient parables to teach money habits. Its origin is practical. The material began as short pamphlets written for financial institutions, and it was later gathered into a book. The form it uses is the parable, set in the ancient world, in which characters illustrate rules about handling money. The distinction is between teaching by instruction and teaching by story. The old setting is a vehicle: the habits it teaches concern money as such. The book's origins in pamphlets for banks and firms account for its plain, practical emphasis, and the parables account for why it remains readable and easy to remember.",
    l: "Simple stories carry a lesson further than lectures do. A rule stated flatly is soon forgotten, while the same rule attached to a character and a consequence is remembered. If you need to teach or to learn something that matters, look for the story that holds it. The basic rules of money have not changed, only the costumes they are dressed in. Keep a part of what you earn, control what you spend, make your savings work and guard against loss: these hold in any period. Do not be put off by an old setting. Look through it to the principle underneath and ask how it applies to your own finances now. Often the older form has lasted because it was built to be remembered." },
  { s: "life", x: "mindset", n: "A Game of Giving", b: "What You Send Returns",
    t: "Shinn describes life as a game of giving and receiving, and the rule of that game is that whatever a person gives out comes back to them. The principle is wider than gifts. It covers words, thoughts, attitudes and actions, all of which count as things sent out and so as things that will return. In her frame the world is not a neutral arena that hands out results at random; it answers in kind. That places responsibility on the player for the quality of what goes out, since the return is not negotiated afterwards. She separates the person who understands the rules and plays by them from the person who simply endures whatever arrives.",
    l: "What you give tends to come back in some form, so treat every word, thought and action as something you are sending out. Give what you would be glad to receive, because you are setting the rules you will play by. This is a standard for your own conduct before it is an expectation of the world. When you catch yourself withholding, criticising or grudging, you are choosing what returns to you. Stop waiting for good treatment to arrive first and begin by supplying the quality you want to see. Judge your choices by one test: would you accept the same thing coming back to you?" },
  { s: "life", x: "mindset", n: "The Spoken Word", b: "Words as Instructions",
    t: "She teaches that the spoken word has power, and urges readers to speak about what they want rather than about what they fear. Words, in her account, are not idle commentary on events but instructions that help set a direction. Speech about lack, failure or danger keeps attention fixed on those things, and speech about what is wanted turns attention toward it, so the choice of subject is a choice of direction. The distinction she draws is between describing a situation as it looks and declaring what you intend it to become. Spoken words carry belief, and belief is what the book says finally shapes experience. The reader is asked to watch the kind of talk they habitually produce, since habit decides most of what gets said.",
    l: "Your words shape your attention and your actions, so what you say repeatedly becomes the direction you move in. Talk about what you are building, not about everything that could go wrong. This does not mean denying a problem exists; it means refusing to rehearse it aloud until it becomes the only thing you see. Listen to your own speech for a day and notice how much of it is complaint or forecast of trouble. That habit is not neutral. Replace it with plain statements of what you want and what you are doing about it, and you will find your attention follows." },
  { s: "life", x: "mindset", n: "Fear Is Faith Reversed", b: "Where You Point Belief",
    t: "Shinn treats fear as belief pointed in the wrong direction, a trust in bad outcomes rather than in good ones. The claim is that fear and faith are the same faculty aimed at opposite targets. A person who dreads a result is already convinced it will come, and in her scheme that conviction carries the same force as hope would. The book therefore does not ask the reader to feel less, only to redirect what they believe. Fear is not a separate enemy to be defeated but misdirected confidence. What matters is where the belief is placed, and she holds that it can be moved from the feared result to the wanted one.",
    l: "Worry is confidence in the wrong result. You already know how to believe strongly in an outcome, because every time you dread something you are doing it. The task is to point that same capacity at what you want. Point the same energy at it and it becomes useful instead of draining you. When anxiety rises, ask what result you are currently trusting in, and name the opposite result in plain words. You are not suppressing the feeling. You are changing its target, which turns a habit that wears you down into one that supports what you are trying to do." },
  { s: "life", x: "internal", n: "Nonresistance", b: "Stop Fighting Everything",
    t: "She advises nonresistance, arguing that fighting a situation often strengthens it, while meeting it calmly lets it change. Resistance, in her account, gives a problem more attention and more emotional charge, and so more reality. Nonresistance is not passivity or surrender to harm. It is a refusal to wrestle with circumstances on their own terms, combined with a steady calm that lets the situation lose its grip. The distinction she draws is between force, which feeds what it opposes, and composure, which starves it. The book presents this as a practical method for difficulty, one that asks the reader to change how they stand toward a problem before trying to change the problem.",
    l: "Some battles grow larger the harder you fight them. If a situation tightens each time you push against it, stop pushing and see what changes when you hold steady. Choose calm wherever force would only make the thing worse. This is not giving up your aims; it is declining to spend energy on a struggle that enlarges what you are struggling with. Look for the places in your life where effort has produced more of the problem, and treat those as the places to loosen your grip. Calm is a position from which you can still act, and often the only one from which the right action is visible." },
  { s: "life", x: "internal", n: "Intuition", b: "Following Hunches",
    t: "Shinn encourages readers to follow intuitive leads, which she presents as guidance from a deeper intelligence than reasoning alone. In her view a hunch is not a random impulse but a message from a source that sees more than the thinking mind does. Reasoning works from what is already known, while intuition is described as reaching past it. The book asks the reader to take such leads seriously and to act on them. It separates the loud argument of the intellect from the quiet pull of an inner prompt, and treats the second as something that can be developed by use. Trust grows as the reader follows hunches and sees where they lead.",
    l: "Your instincts often notice things before your reasoning does. Pay attention to the quiet pull you feel toward or away from a choice, even when you cannot yet give a reason. Learn to listen to quiet hunches, then check them against what happens when you act. That second step matters, because the practice is a way of building a record, not a licence to ignore evidence. Over time you will see which of your hunches prove sound and which came from fear or wishing. Do not wait for logic to approve every move. Let intuition raise the question and your experience decide how far to trust it." },
  { s: "life", x: "internal", n: "Forgive and Release", b: "Resentment Comes Back",
    t: "She warns that resentment and criticism return to the person who holds them, and urges forgiveness as the way to break the cycle. This follows from her law of return: bitterness is something sent out, so it comes back as more of the same. Forgiveness in her frame is less a favour to the other person than a release of the one carrying the grudge. The book treats ill will as a binding that keeps a person tied to what they resent, and holds that letting go cuts the tie. The distinction is between holding a grievance, which keeps it active, and releasing it, which ends its hold. She asks the reader to forgive as a practical step.",
    l: "The bitterness you carry costs you more than the person it is aimed at. Resentment keeps your attention locked on the past and returns to you as more of the same. Release it and your own energy is free for better things. Forgiving does not mean the harm was acceptable or that you must resume contact. It means you stop paying for it every day. Notice which grievances you rehearse most often, because those are the ones taking the most from you. Criticism you hand out works the same way and is sent out before it is returned. Let the old account close, and put the attention it was using into something you are building." },
  { s: "life", x: "external", n: "Dig Your Ditches", b: "Prepare for What You Asked For",
    t: "Using the Bible story of digging ditches before the rain came, Shinn tells readers to prepare as if what they want is already on its way. The point of the story, as she tells it, is that the ditches were dug before any sign of water, as an act of faith. Preparation in advance is the outward form of expectation. She separates a wish held passively from a belief that shows itself in action, and treats the visible act of getting ready as part of what brings the result. The book asks the reader to take a concrete step that only makes sense if the desire is going to be fulfilled, and to take it without waiting for proof.",
    l: "Act as if the thing you want is coming by getting ready for it. Preparation shows you mean it and leaves you ready when it arrives. A wish with no action behind it is only a mood, and doubt will quietly outvote it. Look at what you claim to expect and ask whether your actions match. If you want new work, ready the skills and the space for it. If you want a change, clear what stands in its way. Readiness is a form of commitment that does not depend on certainty. It also protects you from the common failure of getting what you asked for and being unable to receive it." },
  { s: "life", x: "external", n: "Affirmations", b: "Short Statements to Repeat",
    t: "The book is full of short affirmations for readers to repeat, covering money, health, love and work. Each is a brief statement of a wanted condition in the present tense, meant to be said until it settles in. Shinn's method rests on repetition: the statement works on belief by being said again and again, and belief is what shapes what follows. The affirmations are grouped by the areas of life people most often want to change. The distinction she draws is between a general hope and a specific declaration that can be spoken aloud. The reader is expected to use them as working tools, returning to the same ones until they stop sounding like claims and start sounding like fact.",
    l: "Repetition shapes belief over time, and what you believe steers what you do. Choose a few clear statements of what you want and say them until they feel normal to you. Keep them short and specific so that you can say them without effort, and match them to the area where you most want change. The aim is not to convince yourself in one sitting but to wear a new groove in how you think. Be honest about which old statements you already repeat, because you have been practising those for years without choosing them. A deliberate sentence said often enough begins to compete with them." },
  { s: "life", x: "external", n: "Expect Supply", b: "Prosperity as a State of Mind",
    t: "She argues that prosperity follows a mindset of expecting supply, while the fear of lack keeps people poor. In the book money is treated as a matter of belief about what is available. A person who expects enough behaves differently from one who expects shortage, and Shinn holds that those behaviours and the beliefs behind them produce the outcome. Lack is not only a circumstance but an attitude that shapes it. She distinguishes the expectation of supply from the fear that there will not be enough, and says that the first opens a path while the second closes it. The reader is asked to look at what they truly expect and to change it before looking at their circumstances.",
    l: "A scarcity mindset makes you cling and hesitate. You hold onto what you have too tightly, turn down chances that feel risky, and give less than you could. Expect enough and you make bolder, more generous choices that open doors. This is not a promise that money appears without effort. It is a claim about what fear does to your decisions and what steadiness allows. Watch how often a choice of yours is driven by the thought that there will not be enough. Replace that thought with a settled expectation of supply, then make the next decision from there. Generosity and nerve both depend on it." },
  { s: "life", x: "karmic", n: "The Boomerang", b: "It Comes Back Around",
    t: "Shinn uses the image of a boomerang to describe how actions and words return to the person who sent them out. The image is meant to make the law of return concrete: what is thrown goes out, curves, and comes back to the thrower. It applies to thoughts and speech as much as to deeds, and it applies whether the thing sent was kind or harmful. The image carries no moral scolding on its own terms; it describes how the book says the world works. Its force is that the return is certain even if it is delayed, and the sender cannot choose to keep the good while avoiding the consequences of the rest.",
    l: "What you throw out into the world comes back around to you, often later and from a direction you did not expect. Send out only what you would be glad to catch. Before you speak harshly, act carelessly or hold back what you owe, remember that you are the one waiting at the end of the throw. This is a discipline of foresight rather than fear. It asks you to treat your conduct as an investment with a return you cannot dodge. Over a long stretch the pattern of what reaches you says something about what you have been sending. Change the sending and the pattern changes too." },
  { s: "life", x: "karmic", n: "Divine Design", b: "A Plan for Each Person",
    t: "She teaches that every person has a perfect plan for their life, which they can discover by asking for guidance. The plan is described as already existing, not something invented by the person, and it is said to include the work and the relationships that suit them. Shinn separates this design from the imitation of other lives. The way to learn it, in her account, is to ask for direction and to stay alert to the answer. The idea is that purpose is found and not manufactured, and that a person who looks for their own path will be led to it. Dissatisfaction is read as a sign that someone is off the plan.",
    l: "Believing your life has a purpose makes you go looking for it, and the looking changes what you notice. Search for the work that fits you rather than copying somebody else's. Pay attention to what draws you and what drains you, since both are information about your own design. Ask for direction plainly and expect an answer to arrive through ordinary events, not only through dramatic signs. Be wary of ambitions that you took on because others held them. A life built from another person's plan will always feel borrowed. The more you align with your own, the less effort it takes to keep going." },
  { s: "life", x: "karmic", n: "Written in 1925", b: "An Illustrator's Teaching",
    t: "Shinn, an illustrator who became a metaphysical teacher, published the book in 1925, and it has stayed in print for a century. Her path from drawing to teaching is part of how the book is understood: she came to these ideas from outside any formal institution, and wrote them for ordinary readers in plain language. Its long life is cited as evidence that the ideas still reach people. The date places it among early twentieth century writing on mind and belief, a tradition the reader will recognise in its vocabulary. The book's brevity and practical tone are part of why it has lasted, since it offers methods more than argument.",
    l: "A useful idea finds new readers in every generation, which tells you something about what lasts: plain statements of method that people can apply. Put what you have learned into something that can outlast you and keep on helping. That might be a way of teaching, a body of work or simply a habit you pass on to others. Notice that Shinn's reach came from clarity rather than status. You do not need a title to make something worth keeping. Write down what has worked for you in simple terms, share it where it can be used, and trust that a practical idea will find the people who need it." },
  { s: "cmyth", x: "mindset", n: "Charisma Is Behaviour, Not Birth", b: "A Skill, Not a Gift",
    t: "Olivia Fox Cabane's central claim is that charisma is not a fixed trait handed out at birth. She presents it as a set of specific behaviours that can be learned and practised, and says that people who seem to have it naturally are using behaviours others can pick up. The argument removes the divide between the gifted and the rest, since what looks like a gift is described as technique that happens to be well rehearsed. If charisma is made of behaviours, each one can be identified, trained and improved. The book's name is its thesis: the belief that charisma is innate is the myth, and dropping it opens the way to building the skill.",
    l: "If you have been sorting people into those who have it and those who do not, you have put yourself in the second group by default. That belief is itself the obstacle, because it excuses you from trying. The useful question is which behaviour is missing, because a missing behaviour can be built and a missing gift cannot. Start by treating the people you admire as practitioners of something specific rather than as lucky. Watch what they actually do with attention, posture and manner. Then accept that you can practise the same pieces one at a time. Progress comes from narrowing the problem to a behaviour you can work on." },
  { s: "cmyth", x: "mindset", n: "Three Ingredients", b: "Presence, Power, Warmth",
    t: "The book breaks charisma into three ingredients. Presence is giving your full attention to the people in front of you, power is the perception that you can affect the world around you, and warmth is goodwill toward others. Different mixes of the three give different kinds of charisma. The model matters because it turns a vague quality into parts that can be assessed separately, so that a reader can say what exactly is lacking. Each ingredient does a different job in how you are received: presence makes people feel heard, power makes them take you seriously, and warmth makes them want to be near you. The author's point is that all three contribute and that the balance between them sets the effect you have on others.",
    l: "Charisma is not one dial. When you come across badly, find out which of the three was missing, because the fix for a lack of presence is not the fix for a lack of warmth, and guessing wrong costs you the whole attempt. Treat each encounter as something you can diagnose afterwards by asking where attention drifted, where you seemed to lack standing, and where goodwill failed to show. Work on the weakest ingredient rather than on all of them at once. This gives you a concrete place to direct effort, and it stops you from adding intensity in the wrong place and calling it improvement." },
  { s: "cmyth", x: "mindset", n: "It Is Not Extraversion", b: "Quiet People Are Not Excluded",
    t: "Cabane argues against the idea that charisma belongs to the outgoing, and says it can be built by people who are quiet or shy, because it rests on attention, perceived power and warmth and not on volume or sociability. She separates charisma from extraversion by pointing to what it is made of. Nothing in presence, power or warmth requires being loud, talkative or at ease in a crowd. A reserved person can give full attention, carry authority and show goodwill. The claim widens who can be charismatic and removes a reason many people give for ruling themselves out. It also corrects a common confusion between being noticed and being compelling.",
    l: "You do not have to become louder to become magnetic. Being quiet and fully present with one person is a recognisable form of it, and it may be the one that suits you better than working a room. Stop measuring yourself against the most talkative person in the group. Ask instead whether the people you speak with feel listened to, taken seriously and wished well. Those are the real measures. If you tend toward shyness, treat it as a starting condition rather than a ceiling, and build on the strengths it gives you, such as careful listening and a calm manner. Use them deliberately instead of apologising for them." },
  { s: "cmyth", x: "internal", n: "Mental Chatter", b: "The Noise That Costs You Presence",
    t: "Cabane identifies mental chatter, the running commentary of self-judgement, worry and planning your next line, as the main thing that stops people being present. Someone half listening and half managing themselves is perceived as distracted, and she offers techniques for quieting it. The point of the concept is that presence fails for an internal reason before it fails for an external one. Attention is limited, and chatter spends it on the self. The other person cannot see the thoughts but can see their effect, which is a visible lack of full engagement. Reducing the chatter is therefore treated as groundwork for the rest of the model, since presence cannot be shown while attention is elsewhere.",
    l: "While you are rehearsing what to say or grading how you are doing, the person in front of you is getting a fraction of you, and they can tell. Whatever you are telling yourself mid-conversation is taking attention that was theirs. Notice the moments when your inner commentary gets loud, such as before speaking, when you feel judged, or when you plan a reply instead of hearing one. That noise is the cost. Treat quieting it as a skill you can train and not as a flaw of character. The less of your attention you spend on yourself, the more there is to give." },
  { s: "cmyth", x: "internal", n: "Presence Is the Foundation", b: "Being Fully Where You Are",
    t: "In her model presence comes first. It means being fully in the moment with whoever you are with, not checking the room or a phone, and she argues that people notice very quickly whether you are actually there or only appearing to be. Presence is the foundation because the other two ingredients depend on it: power and warmth are hard to show to someone you are not attending to. The distinction she draws is between real attention and a performance of it. A performance can be detected, so the only reliable approach is to attend. Presence is also the most immediately available ingredient, since it needs no status and no special skill beyond directing attention.",
    l: "Attention is the cheapest thing you can give and one of the rarest. Give one person the whole of it for a few minutes and you will have done more for how they see you than a prepared speech does. Put away what pulls you elsewhere, including the phone and your own planning. Let the conversation be the only thing happening. You will find it changes the quality of what you hear and the way people respond to you. Because presence costs nothing, there is no excuse for withholding it. Start there before you work on anything more elaborate, because nothing else you do will register without it." },
  { s: "cmyth", x: "internal", n: "Change the State, Not the Gesture", b: "Behaviour Follows Feeling",
    t: "Cabane's method works on the inner state and not on rehearsed gestures. She argues that body language comes out of how you feel, so producing confident or warm gestures over the opposite feeling looks false, and the lasting fix is to change the feeling first. The claim is about order of cause. The state produces the behaviour, and the observer reads the state through the behaviour. Mimicking outward signs without altering the state creates a mismatch that people sense. This is why the book spends its effort on techniques for changing how you feel in a situation, rather than on coaching posture or expression directly. The visible result follows when the inner condition has been changed.",
    l: "Standing differently over a nervous stomach does not hold for long. Work on what you are feeling and the way you stand and look will follow, which is why a gesture copied from somebody else never quite lands. If you notice yourself performing confidence, ask what the underlying state is and address that instead. A calmer mind produces a calmer body without instruction. Be suspicious of advice that offers only surface changes, such as a firmer handshake or a wider stance, since those are symptoms. Treat nerves and discomfort as information about the state you need to shift, and shift it first." },
  { s: "cmyth", x: "external", n: "Power Is Perceived", b: "The Ability to Affect Things",
    t: "She defines power as other people's perception of your ability to affect the world around you, through status, expertise, authority or confidence. It is about how you are seen and not about how much you have, and it shows in how you carry yourself. The definition places power in the observer's judgement, which means it can be gained or lost through signals. Status, expertise, authority and confidence are the sources she names. None requires a title in every case; each is a route to being seen as someone whose actions matter. Because power is perceived, it can be influenced by how you present what you can do and by the composure with which you do it.",
    l: "People decide quickly whether you can change anything. If you want to be heard in a room, the question is what in how you stand, speak and are introduced tells them that you can. Look at what you currently signal. Do you hedge, apologise before speaking or shrink from attention? Those cues tell others to discount you, whatever you actually know. Work on the evidence people can see: clear speech, a settled manner and visible competence. Do not confuse having ability with being seen to have it. The two are separate, and the second is what shapes how others respond to you." },
  { s: "cmyth", x: "external", n: "Warmth Is Read", b: "Goodwill Shows",
    t: "Warmth in her account is real goodwill toward the other person, and it is read from body language and manner. Because people can usually tell whether it is genuine, she says it has to be felt first and not performed. The claim ties warmth to inner attitude in the same way the book ties confidence to inner state. Warmth shows in how you attend and in small physical signals, and observers read those signals as honest or false. The distinction is between actual care and the display of it. A display without the feeling behind it is perceived as hollow, so the work is to generate the goodwill itself and let the signals follow.",
    l: "A smile worn over indifference is spotted as quickly as a frown. If you want to come across as warm, the work is in actually wishing the person well, because that is the only version that cannot be seen through. Before an encounter, turn your attention to something you can honestly appreciate about the other person, or simply to wanting good things for them. Then let your manner follow without forcing it. Do not rely on technique to stand in for the feeling. People trust what they sense is real, and goodwill you actually hold will reach them in ways rehearsed friendliness never does." },
  { s: "cmyth", x: "external", n: "Four Styles", b: "Focus, Visionary, Kindness, Authority",
    t: "Cabane describes four styles of charisma, made by weighting the three ingredients differently: focus charisma, visionary charisma, kindness charisma and authority charisma. None is the right one, and each suits different people and settings. The framework shows that charisma has more than one shape, which lets different personalities find a version that fits. Each style leans on certain ingredients more than others and so produces a different impression. Because they are weightings of the same three parts, the reader can move toward a style by strengthening particular ingredients. The point is that fit matters: the best style is the one that matches who you are and the situation you are in.",
    l: "You are not trying to become the charismatic person you admire most. Find the style that fits what you already are, because the one you copy from somebody else will cost you effort and still look borrowed. Think about which ingredient comes naturally to you, whether that is attention, authority or goodwill, and lean into it. Then consider the settings you work in and which style they reward. Charisma is a matter of choosing a form that you can sustain and that rings true. A version of yourself that you can keep up is far more persuasive than an imitation that you have to maintain by strain." },
  { s: "cmyth", x: "karmic", n: "Without Presence, No Connection", b: "Distracted People Are Felt",
    t: "As the book frames it, a person with power and warmth but without presence comes across as distracted, and the people they are with feel unheard even when nothing unkind is said. Being half there is noticed. This is one of the combinations the model uses to show why all three ingredients are needed. Capability and goodwill do not make up for missing attention, because attention is what tells a person they matter to you in that moment. The failure is quiet: no offence is given, yet something is felt to be missing. The book uses it to show that presence is not optional and cannot be replaced by the other two.",
    l: "People forgive a great deal, but being half attended to is not one of the things they fail to notice. It is the quiet reason some people are respected and not warmly held, and a phone in the hand does it without a word. If you are competent and kind yet people seem to hold back, check whether you are truly there when they speak. Partial attention reads as a message about priority, whatever you intended. Give conversations your whole focus, even briefly. Being fully present with fewer people does more for how you are experienced than being broadly pleasant while elsewhere in your mind." },
  { s: "cmyth", x: "karmic", n: "Power Without Warmth", b: "Respected and Kept at a Distance",
    t: "The book treats power without warmth as a trade-off. A person seen as capable but not as kind tends to be experienced as cold or intimidating, and people will respect them and defer to them while keeping their distance. The combination produces compliance without closeness. Power alone makes others cautious, and without warmth there is nothing drawing them in. The author presents this as a real cost and not just a stylistic gap, because the relationships it produces are thin. People do what the powerful person asks but hold back their trust and their candour. The remedy is to add the missing ingredient rather than to reduce the strength of the other.",
    l: "Being feared is not the same as being followed, and the gap shows when you need people to come to you freely. Capability earns respect at the point of use, and only warmth buys the willingness. If you hold authority, check whether people bring you problems early or hide them. Their behaviour tells you which you are getting. Add goodwill you can actually feel, shown in interest in them and in how you treat mistakes. You do not need to reduce your standards to do this. You need to make clear that your standards come with care for the person, so that deference does not end in distance." },
  { s: "cmyth", x: "karmic", n: "Warmth Without Power", b: "Liked and Not Heeded",
    t: "The opposite failure in her model is warmth without power. A person seen as kind but not as able to affect anything is liked, and is not taken seriously when it matters. Where power without warmth produces distance, this combination produces affection without weight. Goodwill draws people near, but without the perception that you can influence outcomes, your views and requests carry little force in a hard moment. The model treats it as the mirror image of the other imbalance, with the weight on the opposite side, which is why both are used to show that the three ingredients are meant to work together. Being pleasant is not enough, because liking and influence are separate things.",
    l: "Being easy to like is not the same as being easy to follow. If people are fond of you and still do not listen when the decision is hard, the missing ingredient is not more warmth. Look at the signals that tell others whether you can affect anything: how directly you speak, whether you hold a position under pressure, and how you present your expertise. Keep the goodwill, since it is an asset, and add the standing that gives your words weight. You can be kind and still be decisive. Letting people see both is what turns being liked into being heeded." },
  { s: "mkey", x: "mindset", n: "All Power Is From Within", b: "The World Within Governs the World Without",
    t: "Haanel's opening claim is that the source of power is inside the person and not in circumstances. The world within, meaning thought, attention and conviction, is treated as the cause, and the world without, meaning conditions, money, health and relationships, is treated as the result. He presents this as the premise of the whole course and builds each later part on it. The practical consequence he draws is that a person who wants different results has to begin with the inner state and not with the outer arrangement, since the arrangement is read as an effect that will keep reappearing until its cause is changed. Circumstances are not denied. They are placed second in the order of cause.",
    l: "Look first to what you are thinking, attending to and expecting, because Haanel treats these as the cause of what shows up around you. If your circumstances keep repeating a pattern, the book's reading is that the pattern is being supplied from inside, and rearranging the outside will not end it. This does not mean circumstances are unreal or that effort is unnecessary. It means that effort aimed only at conditions is working on effects. You are asked to take the inner life seriously as a place where work can be done, and to expect lasting change from there before expecting it from a new arrangement of the same underlying habits of mind." },
  { s: "mkey", x: "mindset", n: "One Mind Behind Everything", b: "The Universal Mind",
    t: "Haanel teaches that the individual mind is not separate and isolated but is a part of, or a channel for, a Universal Mind, an infinite creative intelligence that is the source of all things. On his account the power of a person's thinking is the power of that larger mind working through them, and it is drawn on in proportion to how well the person understands and uses the connection. This is why he presents the course as a matter of discovering a capacity that already exists and not of building one. The claim is metaphysical, and the book states it as a premise and not as a finding. The later practices are built to put the premise to use.",
    l: "The idea asks you to treat your own thinking as connected to something larger than your private worries, and to expect more of it than habit has allowed. Whether or not you accept the metaphysics, the working attitude is that you are not producing results alone and from nothing. The risk is to read the claim as permission to wait for power to arrive. Haanel's text makes power a matter of use, and use is a matter of attention and practice. Hold the premise as a frame for effort, and judge it by what the practices do for you over the weeks, not by whether it can be proved at the outset." },
  { s: "mkey", x: "mindset", n: "Thought Is a Creative Force", b: "Cause Before Condition",
    t: "At the centre of the book is the claim that thinking is creative: a thought held with attention and conviction acts as a cause, and it takes outward form as circumstance. Haanel treats thought as a force with consistent behaviour, which is why he speaks of laws and not of wishes. The point is stronger than saying attitude matters. He holds that every condition in a life had a mental antecedent, and that mental habits therefore decide which conditions are produced. In his account the creative power does not choose between what is wanted and what is feared, so the character of the thinking decides the outcome, and the intention to succeed does not.",
    l: "If thought creates, then careless thought creates too. What you rehearse in your head about money, health, work and other people is not private or harmless, and the book asks you to treat the quality of your thinking as a working matter. Look at what you dwell on when nothing is demanded of you, because that is the stock the process runs on. The practical move is selection: keep attention on what you want to see and withdraw it from what you do not. The claim is demanding, and its value for you lies in the discipline it asks for, which can be tested directly by watching what steady attention does over time." },
  { s: "mkey", x: "internal", n: "Two Minds", b: "The Conscious and the Subconscious",
    t: "Haanel divides the mind into two working parts. The conscious mind reasons, chooses and directs attention. The subconscious mind carries out what has been impressed on it, runs the body's processes and acts on what is held in it through habit and repetition, without arguing. The practical conclusion is that the conscious mind is the gate: what you deliberately and repeatedly hold in it is passed to the subconscious, which then works to produce it. The course is designed to train the first so that it can reliably instruct the second, and much of its method is concerned with how that handover happens and what makes it fail. The division is practical and not anatomical, a way of explaining why a decision made once rarely changes a habit.",
    l: "You have a deliberate part of mind and a habitual part, and the habitual part is doing most of the work whether or not you have given it good instructions. The book asks you to use the deliberate part for its real job, which is choosing what goes in and keeping it there. Contradictory instructions, such as wanting a result while rehearsing doubt, leave the habitual part with nothing clear to carry out. Notice which thoughts you repeat without choosing. Those are the ones being acted on. Replace them on purpose and repeatedly, because repetition is the only route Haanel gives from a decision to a habit." },
  { s: "mkey", x: "internal", n: "Concentration, the Master Key", b: "Attention Held on One Thing",
    t: "Haanel names concentration as the core faculty and the reason for the book's title: the ability to hold attention steadily on a single object or idea until it yields what it contains. He distinguishes it from strain. It is a quiet, sustained focus and not a forced effort, and it is trained by regular exercises that lengthen the time attention can be held. On his account the difference between ordinary and unusual results comes down largely to how much attention a person can gather and keep, since scattered attention produces scattered effects and gathered attention produces concentrated ones. Each part of the course sets exercises that develop the capacity a little further.",
    l: "Attention is the resource you spend on everything, and the book treats how well you hold it as a skill that can be trained and not as a fixed endowment. Constant switching and idle drifting of the mind are practice at scattering. Holding one thing, calmly and for longer than is comfortable, is practice at gathering. Expect the early sessions to be short and to wander, and treat the wandering as the thing being trained against. The gain, in Haanel's terms, is not mood but capacity: more of your power reaches the thing you point it at, instead of being spread across whatever happens to claim you." },
  { s: "mkey", x: "internal", n: "Stillness and Relaxation", b: "The Body Quiet First",
    t: "The early exercises in the course start with the body: sitting still and relaxed, letting tension go, and learning to be quiet before attempting to think with purpose. Haanel treats physical stillness as a condition of mental control, because a restless body carries a restless mind, and a mind that cannot be stilled cannot be concentrated. He presents the practice as a discipline to be repeated at regular times and not as an occasional aid. Only once calm and stillness are established does the course turn to directing the mind on an object, which is why he places the exercises in that order and asks that the early ones not be skipped.",
    l: "Do not expect to direct your mind well while your body is wound up. The book puts calm first because control follows from it, and it treats stillness as something you learn by doing it regularly, not by deciding to be calm. A short period of real quiet, kept every day, is worth more than long attempts made when you are already agitated. If you find stillness harder than you expected, that is the information: the restlessness is what the practice exists to work on. Make it a fixed part of the day and judge it by what it does to the quality of your attention afterwards." },
  { s: "mkey", x: "external", n: "The Law of Attraction", b: "Like Draws Like",
    t: "Haanel states a law of attraction as one of the course's working laws: thought attracts to itself the conditions that correspond to it. Dominant thought acts like a magnet, drawing the people, circumstances and opportunities that match its character. The book treats this as a principle of the same order as the physical laws, working whether or not a person believes in it. The attraction is to what a person is mentally, not to what they say they want, so the law is read as feedback on inner state: the conditions that appear are a mirror of the thinking that has been held. He ties the law to a basic unity in which like responds to like.",
    l: "Read what keeps arriving in your life as information about what you have been holding inside, and not only as luck. The book's law says the match is to your dominant thinking, so wishing for one thing while living in the mental state of another sends mixed signals. Be honest about which of the two is stronger. The useful part for you is the discipline of bringing your thinking and your stated aims into line. When the two agree, the law as Haanel frames it has a single thing to answer. When they disagree, it answers the one you have held more steadily, which is usually the one you did not choose on purpose." },
  { s: "mkey", x: "external", n: "The Mental Picture", b: "Visualization Gives Thought a Pattern",
