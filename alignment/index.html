<!doctype html>
<html lang="en" data-view="open">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0A08">
<title>Alignment</title>
<link rel="preload" href="../arc/fonts/Inter.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: 'Inter'; font-weight: 100 900; font-display: swap;
  src: url('../arc/fonts/Inter.woff2') format('woff2'); }

/*
  ALIGNMENT. Its own ground, its own type, its own everything — it reads
  none of the other keys and takes none of the shared shell.

  A PHOTOGRAPH IS A GUEST INSIDE A FRAME, NEVER THE PAGE. That is the
  whole construction and the first build got it backwards: the image
  filled the card, the card's own ground was never visible anywhere on
  screen, and every word was printed on a picture under a gradient laid
  there to keep it readable. A photograph that bleeds is a page. A
  photograph in a frame is an object. Interface lives in the MATERIAL
  around the picture, which is also where the room for chrome comes
  from.

  THE GRADE IS PER IMAGE, MEASURED, AND THE COMMENT THAT USED TO SIT
  HERE WAS FALSE. It claimed one filter pulled fourteen photographs
  into one warm family; measured, the set spanned 235 degrees of hue
  with five of twelve inside the band. Six reference screens holding a
  snow mountain, a face, a desert, a cyan swimming pool and a volcano
  all land inside hue 16-69, which no single transfer function does to
  a mixed library. So --ib rides each image and the shared grade only
  has to carry the hue.
*/

:root {
  --paper: #0B0A08;
  --ink: #FFFFFF;
  --dim: rgba(255,255,255,.72);
  --spent: rgba(255,255,255,.46);
  --hair: rgba(255,255,255,.14);
  --glass: rgba(255,255,255,.10);

  /* Chrome sits on a PLATE, not on glass. A 10% white wash over a lit
     photograph put the info glyph at 2.50:1 against the 3 a graphic
     needs, and no alpha of white fixes a ground that bright. */
  --plate: rgba(11,10,8,.56);

  --card: #1A1611;
  --card-edge: rgba(255,255,255,.08);

  --r-card: 26px;
  --r-in: 18px;
  --r-sq: 14px;
  --r-pill: 999px;

  /* Six vertical steps. The first build shipped eleven — 8 10 12 14 18
     20 22 24 26 34 38 — which is this repo's own runaway-scale fault in
     a third dimension after thirty type sizes and thirteen leadings. */
  --v1: 6px;  --v2: 10px; --v3: 16px;
  --v4: 22px; --v5: 34px; --v6: 52px;

  --gut: 22px;
  --gut-list: 18px;
  --tap: 44px;

  --grade: saturate(.30) sepia(.55) contrast(1.02) brightness(1.20);

  /* THE VEIL WAS INVERTED. Both references are brightest at the very
     top of the screen — row medians of 222, 223, 223 — and never fall
     below L24 at the foot. The first build read 57 at the top and
     peaked in the middle, because a 30% black wash sat exactly where
     the references put their light. */
  --veil: linear-gradient(180deg,
      rgba(11,10,8,.00)   0%,
      rgba(11,10,8,.00)  44%,
      rgba(11,10,8,.34)  68%,
      rgba(11,10,8,.74)  90%,
      rgba(11,10,8,.82) 100%);

  /* The list ground is a different room, and it has a FLOOR. The
     reference's olive falls for its top 45% and is then flat at L46-49
     to the bottom edge; the first build ramped monotonically to L16.
     It is also deeper than the reference's, which is a cost rather
     than a preference: on that lightness pure white maxes at 3.05:1,
     so no alpha of white carries 10px type there — the references put
     DARK large type on their olive and nothing small at all. */
  --sage-g: linear-gradient(180deg,
      rgba(80,82,56,.97)   0%,
      rgba(72,74,51,.97)  22%,
      rgba(52,53,41,.97)  48%,
      rgba(44,44,40,.97)  66%,
      rgba(44,44,40,.97) 100%);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body { height: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: 'Inter', -apple-system, system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  overflow: hidden;
  overscroll-behavior: none;
}

button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
[hidden] { display: none !important; }

.al-disp   { font-size: 38px; font-weight: 450; line-height: 1.00; letter-spacing: -.03em; }
.al-disp-s { font-size: 28px; font-weight: 450; line-height: 1.02; letter-spacing: -.024em; }
.al-caps   { font-size: 10px; font-weight: 600; letter-spacing: .5em; text-transform: uppercase; color: var(--dim); }
.al-body   { font-size: 16px; font-weight: 400; line-height: 1.50; color: var(--dim); }
.al-note   { font-size: 13px; font-weight: 450; line-height: 1.45; color: var(--dim); }

.al-bg { position: fixed; inset: 0; z-index: 0; }
.al-bg i {
  position: absolute; inset: 0; display: block;
  background-size: cover; background-position: center;
  filter: var(--grade) brightness(var(--ib, 1));
  transform: scale(1.04);
}
.al-bg u { position: absolute; inset: 0; display: block; background: var(--veil); }
.al-bg.is-sage i { filter: var(--grade) brightness(var(--ib, 1)) blur(46px); transform: scale(1.3); }
.al-bg.is-sage u { background: var(--sage-g); }

.al-view { position: relative; z-index: 1; height: 100%; display: none; flex-direction: column; }
.al-view.is-on { display: flex; }

#alOpen { justify-content: flex-end; padding: 0 var(--gut) var(--v5); }
#alOpen .al-mark { position: absolute; top: calc(var(--v4) + env(safe-area-inset-top, 0px)); left: var(--gut); }
.al-mark { display: flex; align-items: center; gap: 9px; }
.al-mark svg { width: 20px; height: 20px; display: block; }
.al-mark b { font-size: 13px; font-weight: 500; letter-spacing: 1.2em; text-transform: uppercase; }
#alOpen .al-disp { margin-bottom: var(--v2); max-width: 7.2em; }
#alOpen .al-note { margin-bottom: var(--v4); max-width: 20em; }

/* A PILL IS SIZED TO ITS CONTENT. Not one of the four reference pills
   spans the screen — they measure 217, 148, 187 and 134 CSS px, all
   43 to 50 tall. A full-bleed primary was the widest object on the
   open screen and read as a form submit. */
.al-pill {
  display: inline-flex; align-items: center; justify-content: center;
  align-self: flex-start;
  min-height: 48px; padding: 0 30px; border-radius: var(--r-pill);
  background: var(--ink); color: #14120E;
  font-size: 16px; font-weight: 500; letter-spacing: -.01em;
}
.al-pill.is-glass {
  background: var(--plate); color: var(--ink);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  border: 1px solid var(--hair);
}
.al-pill.is-grow { flex: 1; }

.al-head { padding: calc(var(--v4) + env(safe-area-inset-top, 0px)) var(--gut-list) var(--v3); display: flex; align-items: center; gap: 12px; flex: none; }
.al-head .al-disp-s { flex: 1; }
.al-head .al-caps { flex: none; }

/* 44 OWNED, 40 DRAWN — and an inset cannot say that here. An
   absolutely positioned box resolves against its host's PADDING box,
   and .al-round carries a 1px border under a border-box reset, so its
   padding box is 38 and inset:-2px reached 42 rather than the 44 the
   declaration reads as. Two real controls sat under the floor and the
   arithmetic was invisible in the source. Centring an explicit --tap
   square is immune to the host's border, padding and drawn size alike,
   and it is what makes the token load-bearing rather than decorative. */
.al-round {
  width: 40px; height: 40px; flex: none; border-radius: var(--r-pill);
  background: var(--plate); border: 1px solid var(--hair);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  display: grid; place-items: center; position: relative;
}
.al-round::before {
  content: ''; position: absolute; top: 50%; left: 50%;
  width: var(--tap); height: var(--tap); transform: translate(-50%, -50%);
}
.al-round svg { width: 17px; height: 17px; display: block; }

.al-pane { flex: 1; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  padding: 0 var(--gut-list) calc(118px + env(safe-area-inset-bottom, 0px)); }
.al-pane::-webkit-scrollbar { display: none; }

/* A MASK, NEVER A GRADIENT LAID OVER THE CONTENT. The ground here is a
   photograph, so a --paper overlay is a near-match that reads as a
   smudge somewhere on the set. Off again at the end of the travel: a
   soft edge over nothing is the same lie in the other direction. */
.al-pane { -webkit-mask-image: linear-gradient(180deg, #000 calc(100% - 86px), transparent 100%);
                   mask-image: linear-gradient(180deg, #000 calc(100% - 86px), transparent 100%); }
.al-pane.is-end { -webkit-mask-image: none; mask-image: none; }

/* ---- THE ARC ---- */
.al-card {
  position: relative; display: block; width: 100%; text-align: left;
  border-radius: var(--r-card); overflow: hidden;
  background: var(--card); padding: var(--v3);
  margin-bottom: var(--v3);
  box-shadow: inset 0 1px 0 var(--card-edge), 0 18px 34px -18px rgba(0,0,0,.92);
}
.al-ch { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--v3); }
.al-ct { margin-bottom: var(--v3); }
.al-ct .al-caps { margin-top: var(--v1); color: var(--spent); }

.al-sq {
  width: 38px; height: 38px; flex: none; border-radius: var(--r-sq);
  background: var(--glass); border: 1px solid var(--hair);
  display: grid; place-items: center;
}
.al-sq { font-size: 13px; font-weight: 500; letter-spacing: .06em; color: var(--dim); }

.al-go {
  width: 38px; height: 38px; flex: none; border-radius: var(--r-pill);
  background: rgba(255,255,255,.92); color: #14120E;
  display: grid; place-items: center;
}
.al-go svg { width: 15px; height: 15px; }
.al-card.is-read .al-go { background: var(--plate); color: var(--ink); border: 1px solid var(--hair); }

/* The picture, inset inside the card's own material at its own smaller
   radius. Two rounded rectangles at one radius read as a mistake. */
.al-ph { position: relative; height: 300px; border-radius: var(--r-in); overflow: hidden; background: #0E0C0A; }
.al-ph i {
  position: absolute; inset: 0; display: block;
  background-size: cover; background-position: center;
  filter: var(--grade) brightness(var(--ib, 1));
}

.al-grp { padding: var(--v5) 2px var(--v2); }

/* ---- THE STORY ---- */
#alStoryPane { padding-bottom: var(--v6); }
.al-lead.is-short { height: 34vh; }
#alLawPane .al-sheet {
  background: linear-gradient(180deg,
      rgba(11,10,8,.62) 0, rgba(11,10,8,.94) 64px, rgba(11,10,8,.96) 100%);
}
.al-lead { position: relative; height: 50vh; display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: var(--v4); }
.al-lead::before {
  content: ''; position: absolute; z-index: 0;
  left: calc(var(--gut-list) * -1); right: calc(var(--gut-list) * -1); bottom: 0; height: 66%;
  background: linear-gradient(180deg, rgba(11,10,8,.00), rgba(11,10,8,.52) 48%, rgba(11,10,8,.88));
}
.al-lead > * { position: relative; z-index: 1; }
.al-lead .al-mark { margin-bottom: var(--v3); color: var(--dim); }
.al-lead .al-caps { margin-bottom: var(--v2); }
.al-lead .al-disp { max-width: 9em; }

/* THE SCRIM TRAVELS WITH THE TEXT, NOT WITH THE VIEWPORT. .al-bg is
   fixed, so a veil written there is a screen gradient the words scroll
   THROUGH — measured, one paragraph of this story passed over grounds
   from L17 to L127 and the same declared colour read 3.23:1 at one
   scroll position and 9.97 at another. A contrast failure that moves
   is the hardest kind to see and the easiest kind to ship. */
.al-sheet {
  margin: 0 calc(var(--gut-list) * -1); padding: 0 var(--gut-list) var(--v6);
  background: linear-gradient(180deg,
      rgba(11,10,8,.86) 0,
      rgba(11,10,8,.94) 120px,
      rgba(11,10,8,.96) 100%);
}
.al-txt p { margin-bottom: 1.05em; }
.al-txt p:first-child::first-letter { font-size: 2.2em; font-weight: 450; line-height: .88; float: left; margin: .06em .11em 0 0; color: var(--ink); }

.al-rule-hd { margin: var(--v5) 0 var(--v3); display: flex; align-items: center; gap: 12px; }
.al-rule-hd:after { content: ''; flex: 1; height: 1px; background: var(--hair); }

/* A TAG'S FILL AND ITS LABEL PULLED THE SAME WAY. Both were mixed from
   one hue, so they closed on each other from both sides and the worst
   pair measured 1.71:1 — the worst text in the app. The hue lives in
   the label and the rim now; the ground is a plate. */
.al-tags { display: flex; flex-wrap: wrap; gap: 16px 8px; margin-bottom: var(--v4); }
.al-tag {
  position: relative;
  display: inline-flex; align-items: center; height: 30px; padding: 0 12px;
  border-radius: var(--r-sq);
  font-size: 13px; font-weight: 500; letter-spacing: .01em;
  background: rgba(11,10,8,.78);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid color-mix(in srgb, var(--tg) 30%, transparent);
  color: color-mix(in srgb, var(--tg) 66%, var(--ink));
}
.al-tag::before {
  content: ''; position: absolute; left: 0; right: 0; top: 50%;
  height: var(--tap); transform: translateY(-50%);
}
.al-lrow {
  position: relative; display: flex; align-items: center; gap: var(--v3);
  width: 100%; text-align: left; padding: var(--v3) 0;
  border-bottom: 1px solid var(--hair);
}
.al-lrow:last-child { border-bottom: 0; }
.al-lrow .al-sq { background: var(--glass); }
.al-lrow .al-lt { flex: 1; min-width: 0; }
.al-lrow .al-lt i { display: block; font-style: normal; font-size: 19px; font-weight: 450; letter-spacing: -.02em; line-height: 1.2; }

.al-tag[data-f="inner"]  { --tg: #C9A227; }
.al-tag[data-f="motion"] { --tg: #D2603A; }
.al-tag[data-f="others"] { --tg: #7E9AA6; }
.al-tag[data-f="time"]   { --tg: #8E9370; }

.al-rule {
  border-radius: var(--r-card); padding: var(--v4); margin-bottom: var(--v2);
  background: var(--card); box-shadow: inset 0 1px 0 var(--card-edge);
}
.al-rule .al-caps { margin-bottom: var(--v2); }
.al-rule b { display: block; font-size: 19px; font-weight: 600; line-height: 1.26; letter-spacing: -.016em; }
.al-q { border-radius: var(--r-card); padding: var(--v4); border: 1px solid var(--hair); }
.al-q .al-caps { margin-bottom: var(--v2); }
.al-q b { display: block; font-size: 19px; font-weight: 500; line-height: 1.34; letter-spacing: -.012em; color: var(--dim); }

/* THE STORY ENDED IN 150px OF RESERVED NOTHING. Both references close
   their detail screen on a pair — a primary and a secondary — and the
   only way out of this one was scrolling four thousand pixels back to
   the close button. */
.al-acts { display: flex; gap: var(--v2); margin-top: var(--v4); }

/* ---- THE FOOT ---- */
.al-foot {
  position: fixed; left: 93px; right: 93px; z-index: 30;
  bottom: calc(var(--v4) + env(safe-area-inset-bottom, 0px));
  height: 58px; border-radius: var(--r-pill);
  background: rgba(24,21,17,.62);
  backdrop-filter: blur(26px) saturate(1.5); -webkit-backdrop-filter: blur(26px) saturate(1.5);
  border: 1px solid var(--hair);
  display: grid; grid-auto-flow: column; align-items: center;
  padding: 0 var(--v1);
}
.al-tab { height: 46px; border-radius: var(--r-pill); display: grid; place-items: center; color: var(--dim); }
.al-tab svg { width: 20px; height: 20px; display: block; }
.al-tab[aria-current="true"] { background: rgba(255,255,255,.12); color: var(--ink); }

.al-x { position: fixed; top: calc(18px + env(safe-area-inset-top, 0px)); right: var(--gut); z-index: 30; }
</style>
</head>
<body>

<div class="al-bg" id="alBg" aria-hidden="true"><i id="alBgI"></i><u></u></div>

<section class="al-view is-on" id="alOpen">
  <div class="al-mark" role="img" aria-label="Alignment">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 2v20M5 8l7-6 7 6M5 16l7 6 7-6"/></svg>
  </div>
  <h1 class="al-disp" id="alOpenT">Twelve stories and one shape.</h1>
  <p class="al-note" id="alOpenN">The oldest stories we have are all the same story. Read one, and find out which part of it you are standing in.</p>
  <button class="al-pill" id="alOpenB">Begin</button>
</section>

<section class="al-view" id="alArc">
  <div class="al-head">
    <h1 class="al-disp-s">The Arc</h1>
    <span class="al-caps al-count"></span>
  </div>
  <div class="al-pane" id="alArcPane"></div>
</section>

<section class="al-view" id="alLaws">
  <div class="al-head"><h1 class="al-disp-s">The Laws</h1><span class="al-caps al-count"></span></div>
  <div class="al-pane" id="alLawsPane"></div>
</section>

<section class="al-view" id="alRules">
  <div class="al-head"><h1 class="al-disp-s">The Rules</h1><span class="al-caps al-count"></span></div>
  <div class="al-pane" id="alRulesPane"></div>
</section>

<section class="al-view" id="alLaw">
  <button class="al-round al-x" id="alLawX" aria-label="Close">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
  <div class="al-pane" id="alLawPane"></div>
</section>

<section class="al-view" id="alStory">
  <button class="al-round al-x" id="alStoryX" aria-label="Close the story">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
  <div class="al-pane" id="alStoryPane"></div>
</section>

<nav class="al-foot" id="alFoot">
  <button class="al-tab" data-v="arc" aria-current="true" aria-label="The Arc">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 18c4-10 14-10 18 0"/><circle cx="3" cy="18" r="1.6" fill="currentColor" stroke="none"/><circle cx="21" cy="18" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="10.6" r="2.1"/></svg>
  </button>
  <button class="al-tab" data-v="laws" aria-label="The Laws">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 4v16M5 8h14M7.5 8 5 15h5zM16.5 8 14 15h5z"/></svg>
  </button>
  <button class="al-tab" data-v="rules" aria-label="The Rules">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5 5h14v14H5zM9 10h6M9 14h4"/></svg>
  </button>
</nav>

<script>
(function () {
'use strict';

/*
  ONE WRAPPER. Nothing escapes it. The other apps in this repo learned
  that the hard way — a top-level name here does not throw when it
  collides, it replaces, and the symptom turns up screens away.
*/

var KEY = 'align.v1';

/* The stages are the path. Stories are filed at the one they belong to,
   so a stage with nothing at it simply has nothing at it. */
var STAGES = ['The Call', 'The Refusal', 'The Mentor', 'The Threshold',
              'The Trials', 'The Ordeal', 'The Reward', 'The Road Back', 'The Return'];

var S = [
{
  id: 'stove', stage: 'The Call', bg: 'desert', mins:13,
  n: 'The Treasure Under the Stove',
  src: 'Sufi · Rumi, thirteenth century',
  laws: [
    { n: 'Correspondence', f: 'inner' },
    { n: 'Inspired Action', f: 'motion' },
    { n: 'Relativity', f: 'time' },
    { n: 'The Stranger’s Mouth', f: 'others' }
  ],
  teach: 'Coelho built The Alchemist out of this. Santiago, the sheep, the pyramids, the treasure back under the tree he started from — all of it is here, seven hundred years earlier, in about a page. Knowing that is useful, because it tells you the shape is older and more reliable than any one telling of it.',
  rule: 'You cannot be told. You can only be sent.',
  q: 'What are you standing on, refusing to dig, because it is too close to be treasure?',
  body:[
    "Yusuf's father left him a house in the eastern quarter of Baghdad, and in the house there were four things worth naming: a garden with a wall round it, a fig tree older than anyone could remember, a stone fountain, and a stove.",
    "He was thirty-one when he inherited it and he was not poor then.",
    "The losing took eleven years and there was never a day he could have pointed at. He bought and he sold, cloth mostly, and he was neither careless nor unlucky in any way he could name. It was simply that every year there was a little less than the year before, and a man can live inside that for a very long time without once saying the word out loud.",
    "He sold the second house in the fourth year. He sold the horses in the sixth. After that he began on the carpets, one at a time, always the one nearest the door, so that the room emptied slowly enough that he could come in each evening and tell himself it looked much as it had.",
    "The fountain stopped in the ninth year. Something had silted up beneath it. He meant to have it seen to, and then there was the winter, and then there was something else, and after a while he stopped hearing that it had stopped.",
    "By the twelfth year what was left was the house, the wall, the tree, the dry fountain and the stove, and Yusuf, who lit the stove every evening and sat beside it.",
    "The dream came in the spring.",
    "He was standing somewhere with no features to it, aware in the way you are aware in dreams that he had been there a while. A voice spoke from a little behind his left shoulder and did not raise itself at all.",
    "Your fortune is in Cairo, it said. Go there and find it.",
    "He woke before dawn and lay listening to the birds starting up in the fig tree and laughed at himself, quietly, so as not to seem mad even to an empty house. A man who has lost money dreams about money. There is nothing in that.",
    "It came again the next night. Word for word, the same flat voice from the same place behind him. He laughed again in the morning and the laugh was shorter.",
    "On the third night he did not sleep afterwards. He lay with his eyes open until the window went grey, and somewhere in those hours the thing stopped being a dream he had had and became a thing he was going to do, and he could never afterwards say when it turned over.",
    "He sold the fig crop standing. He sold the brass fittings off the doors and the good knife and the last carpet, which he had been keeping without admitting that he was keeping it. It came to enough for a place with a caravan, food for the road, and a little over.",
    "His neighbour Abu Qasim stood in the lane and watched him strap the bundle.",
    "Cairo, said Abu Qasim.",
    "Yes.",
    "For what?",
    "And Yusuf found that he could not answer. He stood there with the strap in his hand and understood that there was no sentence available to him that would not sound exactly like what it was.",
    "A man told me, he said at last.",
    "Abu Qasim looked at him for a while. Then he did a kind thing, which was to say nothing more about it and help him with the strap.",
    "The road to Cairo took ten weeks.",
    "Nothing happened on it. That is the part nobody warns you about. He had expected the journey to prove something, to be the place where it began, and instead it was heat and dust and the same four conversations with different men, and the enormous slowness of a world crossed at the speed of a camel.",
    "In the second month a driver called Ishaq asked him what he was going for. Yusuf, who had by then been asked eleven times and had eleven times said business, heard himself tell the truth.",
    "Ishaq did not laugh. He chewed for a while and looked out at the country.",
    "I had a brother who went to Isfahan on a dream, he said.",
    "What happened to him?",
    "Nothing. He came back. He was all right afterwards.",
    "Yusuf waited for the rest of it.",
    "That is all there is, said Ishaq. Some people go and some people do not, and the ones who do not talk about it for the rest of their lives. That is the whole of the difference I have ever been able to see.",
    "They came into Cairo on a morning in the hot season, and within an hour Yusuf understood that he had been a fool about the size of it.",
    "He had imagined arriving somewhere. Cairo was not somewhere. It was a country folded up and packed into streets, and it went on past every corner he turned, and by the afternoon of the first day he had given up holding a map of it in his head. Nobody looked at him. There is a particular loneliness in a place so large that a stranger is not even strange.",
    "His money lasted nine days.",
    "For three days after that he did not eat. He walked the city in the mornings looking for work, and there was work, but it went to men who had somebody to speak for them, and he had nobody in that city and no way to acquire anybody in an afternoon.",
    "On the third evening he sat down against a wall and made himself say the thing plainly, which was that he was going to have to ask.",
    "He had never in his life asked anyone for anything. He found, sitting there, that he still could not do it while people could see his face.",
    "So he waited until dark.",
    "What he did not know was that the watch had been out for eleven nights after a run of housebreakings in that quarter, and that they were tired, and that a stranger moving along a wall after the last call to prayer was the precise shape of the thing they had been sent to find.",
    "They came out of a side street behind him and he never turned round properly.",
    "He remembered afterwards that there were four of them, and that it was quick, and that the strangest part was how little malice there was in it. They were not angry with him. They did their work the way men do a job they have done before, and when he stopped being able to stand they stopped, and one of them went to fetch the captain.",
    "The captain came with a lamp and crouched down and turned Yusuf's face toward the light with two fingers, not ungently.",
    "Who are you, he said.",
    "And Yusuf, lying on the stones of a city eleven weeks from his own door, with his mouth full of blood and nothing at all left to protect, told him.",
    "He told him the whole of it. The house in the eastern quarter and the wall round the garden. The eleven years. The carpets by the door. The fountain that had stopped in the ninth year and that he had meant to see to. The voice behind his left shoulder, three nights running, and what it had said.",
    "The captain listened to all of it and did not interrupt once.",
    "Then he sat back on his heels and laughed.",
    "He laughed for a long time, and his men laughed with him, and one of them had to set the lamp down. It was not cruel laughter. That was somehow worse. It was the laughter of a man who has been standing in a dark street half the night and has just been handed something to take home and tell people.",
    "You walked here from Baghdad, he said. On a dream.",
    "Yes.",
    "Listen to me. Three times in my life I have had a dream myself. Three times, the same one. A voice tells me there is a treasure in Baghdad, and it tells me the quarter, and it tells me the house.",
    "He wiped his eyes with the back of his wrist.",
    "A house with a wall round the garden, he said, and a fig tree in it older than the house. And a stone fountain that does not run. And the treasure is under the stove.",
    "He put his hands on his knees.",
    "Three times, he said. And I have never gone one step. I have never so much as asked a man which road it is. Because I am not a lunatic, and only a lunatic crosses a desert on the strength of something he heard while he was asleep.",
    "Yusuf did not say anything at all.",
    "He lay on the stones and looked up at a tired man with a lamp who had just described his own garden, and the silence went on long enough that one of the watchmen shifted his feet.",
    "Then he said thank you.",
    "The captain, who had been ready for almost anything but that, was quiet a moment. Then he took some coins out of his belt and set them on the ground by Yusuf's hand, and told him to eat something, and go home, and stop dreaming.",
    "The walk back took ten weeks, the same as the walk out.",
    "It was not the same journey. He went by the same road and ate the same food and the country was exactly where he had left it, and every day of it was different, and he could not have explained that to anybody either.",
    "He came into Baghdad in the early autumn. He went up his own lane, and Abu Qasim was not out, and he let himself in at his own door and stood in the empty room and smelled the particular smell of a house that has been shut eleven months.",
    "The fig tree had fruited and dropped and nobody had gathered it.",
    "He went to the stove. He had lit it ten thousand times. He had cleaned it and cursed it and sat beside it on every cold evening of his adult life, and in all those years he had never once looked underneath it.",
    "He found a bar in the yard, and he dug.",
    "It was not deep. It was about the depth a man buries a thing when he means to come back for it within a year or two, and has no shovel, and is in a hurry.",
    "There was gold, and a quantity of old coin that had not been minted in his lifetime or his father's, and a small heavy thing wrapped in cloth gone to powder. He sat down on the kitchen floor and stayed there a long while as the light moved across the wall.",
    "In the morning he went out and found a man who knew about water.",
    "He had the fountain seen to first."
  ]
},
{ id:'lamp', stage:'The Call', bg:'umber', mins:5,
  n:'The Lamp and the Keys', src:'Sufi · Nasrudin',
  laws:[{n:'Cause and Effect',f:'motion'},{n:'Attention',f:'inner'}],
  rule:'Comfort decides where you search long before honesty decides what you find.',
  q:'Which problem are you working on because it is the one you know how to work on?',
  teach:'Nasrudin is the Sufi tradition’s holy fool, and the fool is how that tradition says the things nobody will hear straight. The joke is forty words. What is under it is the most expensive habit a person has: searching where searching is comfortable, and calling it searching.',
  body:[
    "The thing Kamal remembered afterwards was that he had almost walked past.",
    "He was twenty-four and he worked for a man who copied documents, and he had spent that whole day doing it and his hand ached and he wanted his supper. It was the blue part of the evening, after the last light and before full dark, and the lamp at the corner of the street of the coppersmiths had been lit an hour.",
    "Under it, on his hands and knees, was Nasrudin.",
    "Everybody in that town knew Nasrudin. He was not mad and he was not a beggar. He had been a judge once, briefly, and there were four separate stories about why he had stopped being one, and none of them agreed. He now did nothing in particular and was to be found anywhere.",
    "He was moving his palms across the dust in slow careful circles, working outward from the foot of the lamp post.",
    "Kamal stopped because it would have been rude not to.",
    "What have you lost, uncle?",
    "My key, said Nasrudin, without looking up.",
    "So Kamal put down his satchel and got down beside him, because that is what you do.",
    "They worked together for a while in the way that two people do who have just started something: quickly, hopefully, covering the obvious ground. The circle of light was perhaps four paces across. The dust in it was fine and pale and showed everything, and they went over all of it, and there was nothing there.",
    "Then they did it again, more slowly.",
    "A man called Ilyas came past with bread under his arm and asked what they were doing, and when he heard, he put the bread on a step and joined in. Two boys stopped. One went home and came back with a lamp of his own so they could see under the lip of the doorway. By the time the moon was properly up there were seven people on their hands and knees in that circle of light, and they had worked out a system, and two of them were arguing about whether the drain had been checked.",
    "Nobody thought it strange. A man had lost his key and his neighbours were helping him look for it. There is nothing in the world more ordinary than that.",
    "It was Ilyas, in the end, who sat back on his heels.",
    "His knees had gone and he was rubbing them, and he was looking at Nasrudin, and something had occurred to him in the way things occur to a man whose body has stopped and let his mind catch up.",
    "Nasrudin, he said. Where were you when you dropped it?",
    "In my house, said Nasrudin.",
    "There was a pause of a particular kind.",
    "In your house.",
    "Yes.",
    "Ilyas looked round at six men on their knees in the middle of a public street. Then why, he said, in the name of God, are we looking out here?",
    "And Nasrudin said: because there is light here.",
    "It went round the town within two days and was told for years afterwards, always with the same laugh at the end, and that is very nearly the whole of what happened. Everybody stood up. Somebody made a joke about the drain. Ilyas picked up his bread and went home. They all went home.",
    "Kamal did not sleep.",
    "He lay in the dark of his room and he was not laughing. He had been in that circle. He had been the first one down and had stayed the longest, and at one point he had been genuinely certain they were about to find it, and he had felt, kneeling in the dust with six other men, the particular satisfaction of hard work being done.",
    "And there had never been anything there. Not once. Not at any moment in the whole two hours.",
    "He turned over and tried to think about something else and found that the something else was worse.",
    "Kamal had wanted to be a builder since he was eleven years old. Not a copier of documents. A builder, of houses, with his hands. He had said so out loud perhaps four times in his life and had not said it in six years.",
    "What he had done instead, and he lay in the dark that night and went through it honestly for the first time, was this. He had learned a very good hand. He had learned three scripts. He had copied out the specifications of buildings, actual buildings, with measurements in them, for four different architects, and could now read a plan better than most men who worked on site. He had saved money carefully every month.",
    "Every one of those things was true and useful and had taken years, and not one of them was walking to the yard on the eastern road and asking Faisal the builder for work.",
    "He knew where the yard was. He had walked past it. He had, twice, crossed the road before he reached it.",
    "Faisal was not going to be impressed by three scripts. Faisal would look at his hands, which were a copier's hands, and ask whether he had ever carried anything, and Kamal would have to say no in front of men who had. That was the whole of it. That was the entire obstacle, and there was no lamp anywhere near it.",
    "The copying, on the other hand, had a lamp on it. The copying had a master who praised him and money at the end of the month and a skill that visibly improved, and every time he got better at it everyone around him said he was getting somewhere.",
    "He had been on his hands and knees in the light for six years.",
    "He did not go the next morning. He is not that kind of story. He copied for eleven more days, and on two of them he decided the whole thing had been a fancy brought on by tiredness.",
    "But he had stopped being able to not know it, and that turns out to be the thing that moves a man in the end. Not resolve, which fades by Thursday. Simply the loss of the ability to pretend.",
    "On the twelfth day he finished the page he was on, because he was not a dramatic person, and put down the pen and went out into the morning and walked east and did not cross the road.",
    "The yard was loud. There were eight men in it and a half-built wall and a stack of timber, and Faisal was a wide man of about fifty with a bad shoulder who listened to the whole of Kamal's speech without any expression at all.",
    "Then he said: can you carry a hod?",
    "I do not know, said Kamal.",
    "There is one there, said Faisal.",
    "It was a bad day. It was the worst day he had had in years. His hands were open by noon and his back would not straighten and one of the men laughed at him twice, the second time not unkindly.",
    "Walking home in the evening with his arms shaking he came past the street of the coppersmiths, and the lamp was lit, and there was nobody under it at all."
  ] },
{ id:'cup', stage:'The Refusal', bg:'curve', mins:5,
  n:'The Cup That Was Already Full', src:'Zen · Nan-in, nineteenth century',
  laws:[{n:'Mentalism',f:'inner'},{n:'Receptivity',f:'inner'}],
  rule:'You are not being refused the answer. You are full.',
  q:'What would you have to stop being right about?',
  teach:'Nan-in was a Japanese master of the Meiji era and the professor was a real visitor. The tradition keeps this one because it is the only answer to a particular kind of person — and the trap is that everybody hearing it assumes they are the teacher in it.',
  body:[
    "Professor Sato went up the mountain in the autumn of his forty-fourth year, and he went well prepared.",
    "He was not a fool, and it matters to be clear about that, because the story gets told as though he were. He held a chair. He had read everything available in Japanese and a good deal in Chinese, and he had spent eleven years on a book about the transmission of the Zen schools that was, by any measure anybody could apply, a serious piece of work. He knew more about the history of what Nan-in taught than Nan-in did.",
    "What he did not have was the thing itself, and he had begun to suspect, somewhere in the tenth year, that this was not a gap more reading was going to close.",
    "So he wrote a letter. It was a good letter, modest in tone, and it named three specific difficulties he had arrived at, which he believed to be genuine difficulties and not the ordinary confusions of a beginner. The reply came after a month and said only that he would be received on the fourteenth.",
    "The temple was two days' walk past the end of the road.",
    "He went up through pine country in the rain, and stopped at an inn on the first night and did not sleep much, and on the second afternoon came out above the trees and saw the roof of the place below him in a fold of the hill, much smaller than he had expected.",
    "A boy of about fifteen let him in and took his coat and put him in a room with a paper wall and nothing else in it, and left him there for two hours.",
    "He was, by the end of that, considerably less modest in tone.",
    "Nan-in came in at dusk. He was seventy-something and moved like a man with a bad hip, and he did not look at all like his photographs. He sat down opposite and said good evening and asked whether the walk had been hard, and Professor Sato said that it had not, and there was a silence.",
    "Then the professor began.",
    "He had, in fairness, been thinking about how to open for two days. He started with the three difficulties from the letter, because that seemed courteous, and he set them out precisely, and he was aware while doing it that he was setting them out well. Then he explained the position he had arrived at, which turned on a distinction between two uses of a term in the eighth century that he was fairly sure had been missed. Then, because the old man had not interrupted, he went on.",
    "He talked for a long time.",
    "At some point the boy brought tea, and Nan-in took the pot.",
    "The professor watched him fill the cup while continuing to talk, because you can do that, and he was coming to the part he had most wanted to say, which was about what he thought the tradition had lost and roughly when.",
    "The tea reached the top of the cup.",
    "Nan-in kept pouring.",
    "It came over the lip and went out across the lacquer in a thin sheet and found the edge of the table and started onto the floor, and the old man poured on with an entirely ordinary expression, the way a man pours when he has not noticed.",
    "The professor stopped talking.",
    "It is overfull, he said. No more will go in.",
    "Nan-in set the pot down.",
    "Like this cup, he said, you are full of your own opinions. How can I show you anything unless you first empty your cup?",
    "There was a silence of some length.",
    "Then Professor Sato said thank you, and stood, and bowed correctly, and went out and down the mountain in the dark, which was dangerous, and which he did anyway.",
    "He was extremely angry for about four months.",
    "He said nothing about the visit to anyone. He finished the book. It was well received, better than well received; it became the thing people cited, and it is still cited, and it made his name in the way eleven years of work is supposed to and mostly does not. He was given things. He was asked to speak in other countries, and went, and was good at it.",
    "He thought about the tea perhaps once a month, always with the same flush of irritation, always with the same three or four sentences he would have said if he had thought of them in time.",
    "Twelve years went by in the way twelve years do.",
    "What broke it was not a crisis. There was no death and no illness. What happened was that a student came to see him, a quick difficult young man called Ueda who had been arguing with him for two terms, and laid out a position, and the professor listened to about a third of it and began to explain why it was wrong.",
    "And somewhere in the middle of his own second paragraph he heard it.",
    "Not the content. The shape. The particular smoothness of a man saying a thing he has said before, over the top of somebody who is still talking, in a room he is certain about.",
    "He stopped in the middle of the sentence. Ueda waited, then asked if he was all right, and the professor said yes and asked him to start again from the beginning, and then sat and said nothing for eleven minutes, which was the longest he had gone without speaking in a professional conversation in his adult life.",
    "He went back up the mountain in the spring.",
    "He did not write ahead. The road went further than it used to and there was a bus for part of it and the walk was only one day now, and he was fifty-six and it was harder than it had been at forty-four.",
    "Nan-in was still alive. He was very old. They put the professor in the same room, and this time he waited four hours, and he sat on the floor and watched the light go across the paper wall and did not compose anything.",
    "When the old man was brought in he did not seem to recognise him, and the professor did not say who he was.",
    "The boy, a different boy, obviously, a different boy entirely, brought tea.",
    "Nan-in took the pot in both hands, which shook, and poured, and the professor watched the cup fill and said nothing at all, and the old man stopped at exactly the right place, the way anybody does.",
    "They drank the tea.",
    "After a while Nan-in asked whether the walk had been hard, and the professor said that it had, rather, this time.",
    "Ah, said Nan-in. Yes.",
    "That was the whole of the second visit. He stayed two nights. Nothing was explained to him and he asked for nothing, and he came down the mountain and went back to his work and taught for another nineteen years. Ueda, who became better known than his teacher in the end, used to say that the old man had one habit nobody could account for: he would stop, sometimes, in the middle of his own sentence, and ask you to start again."
  ] },
{ id:'river', stage:'The Refusal', bg:'silk', mins:5,
  n:'The Man Who Asked the River to Wait', src:'Ours',
  laws:[{n:'Rhythm',f:'time'},{n:'Inspired Action',f:'motion'}],
  rule:'Readiness is something you claim, never something you are granted.',
  q:'What are you calling preparation?',
  teach:'Ours, and the only wholly invented one in the first half of this arc. It is here because the tradition is thin on this particular refusal — the one that never says no and simply never says now.',
  body:[
    "There was a village on the near bank and everything anybody wanted was on the far one.",
    "That is an exaggeration, but not by much. The near bank had the village and the fields behind it and a road that went two days north to another village much like it. The far bank had the market town, and the road to the coast, and the schools, and the work, and whatever it is a young man means when he says he is going to go.",
    "Hasan meant it at nineteen.",
    "He said so to his mother in the spring, and she did not argue with him, and he walked down to the crossing that afternoon to look at the thing properly for the first time.",
    "The river was in flood. It had rained nine days in the hills and the water was the colour of tea with milk in it, moving fast enough to carry whole branches past at walking pace, and there was a dead sheep in it while he stood there, turning over.",
    "Any fool could see this was not the week.",
    "So he went home, and he was entirely right, and nothing that follows makes him wrong about that afternoon.",
    "He came back at the end of the dry season, when the water was low.",
    "It was a different river and no better. Low meant wide and slow and silted, and you could not see the bottom for the silt, and there were stones under it a man would not find until his ankle did. He stood there a long time. A boy of about twelve went past behind him carrying a goat and did not look at the water at all.",
    "Hasan decided that evening that the sensible thing was to learn something about rivers.",
    "He was thorough. That is the part nobody ever held against him, and it is the part that did the damage. He talked to every man in the village who had crossed and several who had not. He learned that the current runs fastest on the outside of a bend and that the far bank of a curve is always deeper than it looks from the near one. He learned to read a surface: the flat glassy patch that means a rock a foot down, the seam where two flows meet and neither of them is where you think.",
    "He made a rope. It was a good rope. Two years later he made a better one, having understood why the first was wrong.",
    "By twenty-four he knew that crossing better than anyone alive.",
    "There was a ferryman at the landing, an old man called Bilal with a flat-bottomed boat and a pole, who took people over for a coin and had done since before Hasan was born. Hasan talked to him a great deal in those years. Bilal was not a talkative man but he answered what he was asked, and answered accurately, and never once asked Hasan when he was going.",
    "At twenty-six Hasan's mother died and there was a season of that.",
    "At twenty-eight he took work with the man who bought grain, because he had to eat, and it was meant to be for a year.",
    "At thirty-one he was still doing it and was good at it and was the one who went north twice a season, which everybody agreed was a responsible position for a man of his age.",
    "He still went down to the crossing. Not every week. But he went, and he would stand at the top of the shingle with his hands behind his back and read the water, and he could tell you within a day when the level would start to drop, and he was almost always right.",
    "He said out loud, to at least four people over those years, that he was going to cross.",
    "At thirty-seven he married Sara, who came from the village two days north, and it was a good marriage. At forty he had a daughter. At forty-four he was given the grain man's business when the grain man died, because there was nobody else who knew where anything was.",
    "He was fifty-two the day he asked Bilal the question.",
    "It was an autumn evening and the ferryman was sitting on the gunwale doing nothing, the way he did, and Hasan came down and stood beside him and looked at the water a while and then said it.",
    "What is the best time to cross?",
    "Bilal thought about it.",
    "When you get in the boat, he said.",
    "Hasan waited for the rest of the answer and there was not any more of it.",
    "He laughed, and then understood that the old man had not been making a joke, and then he explained. He explained about the flood season and the silt and the seam where the two flows meet. He explained that a crossing attempted at the wrong moment is not courage but stupidity, and he said, with some heat, that any fool can drown.",
    "All of which was true, and Bilal did not argue with one word of it, because none of it was the thing.",
    "The thing is that a river does not have a best time. It has times that are worse and times that are less bad, and it is never, at any hour of any season, ready for you, because ready is not a state rivers are in. It simply keeps going past. It had gone past for thirty-three years at the rate of a whole river, every day, while a man on the bank learned to read it.",
    "Hasan went home and did not go down to the crossing for eleven months, which was the longest gap of his adult life.",
    "He crossed at sixty-eight.",
    "There was no reason for it. His daughter was married and gone over years before, by that same boat, at nineteen, on a Tuesday, without any fuss whatever. Sara had been dead two years. He came down in the morning with nothing in his hands, and Bilal was not there, because Bilal had been dead nine years, and the boat was his nephew's now, a heavy man of about forty who did not know Hasan except by sight.",
    "Hasan got in.",
    "The nephew pushed off and put the pole in, and the boat came out of the slack water by the landing and into the run, and the far bank started coming.",
    "It took four minutes.",
    "He stood on the shingle on the other side a while and watched the boat go back. Then he turned round and looked at the country he had come to, which was ordinary: a track going up between two fields, and a cart on it, and the market town somewhere beyond the rise.",
    "And then he walked up the track, because that was what there was to do, and he was sixty-eight years old, and it was a fine morning, and he had a great deal less time than he had had at nineteen and considerably more than none at all."
  ] },
{ id:'horse', stage:'The Mentor', bg:'canyon', mins:4,
  n:'The Farmer Who Said We Shall See', src:'Taoist · Huainanzi',
  laws:[{n:'Polarity',f:'time'},{n:'Relativity',f:'time'},{n:'Judgement',f:'inner'}],
  rule:'Every event is half a sentence. You keep reading it out as the whole one.',
  q:'What are you certain was a disaster?',
  teach:'From the Huainanzi, a Chinese text of the second century BC. It has survived two thousand years in a dozen languages because it is the shortest complete description of how judgement actually works — and because the farmer is not an optimist, which is what most retellings get wrong.',
  body:[
    "The old man's name was Sai and he farmed the last piece of workable ground before the frontier.",
    "It was not good land. Everything north of the wall was grass and wind and other people's business, and everything south of Sai's fence was better farmed by somebody else, and what he had was the strip between, which grew barley in a good year and dust in a bad one.",
    "He had a son called Wen, who was seventeen, and one horse.",
    "The horse mattered. In that country a horse was not an animal, it was the difference between carrying your grain to market and not going to market, and a man who had one was not rich but was a man with a horse, and everybody knew which men those were.",
    "One morning in the autumn the gate was open and the horse was gone. It had gone north, which was the only direction with anywhere to go, and north was where nobody followed anything.",
    "By the evening four neighbours had come.",
    "They were good men and they came because that is what you do. Old Zhou, who had known Sai's father, sat on the wall and said what everybody had come to say, which was that it was a terrible business and very hard luck, and that a man of Sai's age should not be losing a horse.",
    "Maybe, said Sai. We shall see.",
    "Zhou waited for more and there was not any more, and after a while the neighbours went home and said to each other that the old man had taken it strangely, and one of them wondered whether he had quite understood.",
    "Sai got up the next morning and mended the fence, which was what had been wrong with the gate, and then went out to the barley.",
    "Four months later the horse came back.",
    "It came down off the grass at dawn with a string of eleven wild horses behind it, shaggy northern animals with no brand on any of them, and it walked in through the gate Sai had mended as though it had been out for the afternoon.",
    "By noon the whole district had heard.",
    "They came again, the same men and several others. Zhou stood in the yard looking at eleven horses in a pen built for one and said that in sixty years he had not seen anything like it, and that Sai was a made man, and that this was the best luck that had ever come to anybody on that road.",
    "Maybe, said Sai. We shall see.",
    "And this time it annoyed them. There is a limit to how long a man can decline to be congratulated before it starts to look like a performance, and Zhou said something short on his way out that he was sorry about afterwards.",
    "Wen was seventeen and there were eleven wild horses in the yard.",
    "He worked with them through the spring and he was good at it, better than his father had ever been, and Sai watched him and said nothing either way. On a morning in the fifth month a grey mare that had been going well for three days put him into the fence post, and his thigh broke in two places, and the bone-setter who came up from the village was honest enough to say on the first night that the boy would walk but would not walk properly.",
    "The neighbours came.",
    "Zhou did not say anything at all this time, which was the kindest thing anybody did that week. It was one of the younger men who said it: that it was a cruel thing, and a waste, and that the horses had cost more than they were worth.",
    "Maybe, said Sai. We shall see.",
    "Wen was nineteen months healing and he healed crooked, and he was angry for most of the first year of it, and there were evenings when Sai sat outside rather than be in the house.",
    "Then the war came.",
    "It came the way those things come, which is not as an announcement but as a column of dust on the south road resolving into men with a list. They took every male between sixteen and forty-five from every farm on that road, and they took them in the morning and were gone by the afternoon, and the mothers followed the column to the end of the lane and then stopped because there is a place where you stop.",
    "They looked at Wen's leg and did not write his name down.",
    "Nine in ten of the men who went north that spring did not come back. Zhou lost two sons. The younger man who had spoken about the horses was not among the returning and nobody ever found out exactly where.",
    "When it was over, and the lists were known, the people on that road came to Sai's gate one more time.",
    "They came to say that he had been right. That was the whole of the errand. They had laughed at him for four years and they had come to say it out loud, and Zhou, who was very old by then, said that Sai had seen it coming and that there was something in the old man nobody had understood.",
    "And Sai said: maybe.",
    "They thought he was being modest.",
    "He was not being modest. He was sixty-nine years old and his son was lame and alive and there was another year after this one, and after that another, and he had never once in his life been to the end of a sentence. He had simply stopped reading them out loud before they finished, which is not wisdom exactly, and is not calm, and is a great deal closer to a habit of work: you mend the fence, and you set the leg, and you go out to the barley, and you do not sit down in the yard waiting to be told what any of it was."
  ] },
{ id:'ferry', stage:'The Threshold', bg:'nightfall', mins:4,
  n:'The Ferryman’s Price', src:'Ours',
  laws:[{n:'Compensation',f:'motion'},{n:'Sacrifice',f:'motion'}],
  rule:'The toll is always the thing you were going to keep.',
  q:'What are you trying to take across with you?',
  teach:'Ours. Every tradition has a crossing and a price and most of them hide the price until you are standing there, which is a way of saying something true about how a threshold actually works.',
  body:[
    "The river was half a mile across at the landing and there was no bridge and there never had been.",
    "There was one ferryman. He was not old and not young and nobody in the district knew where he had come from, and he was not mysterious about the work: he sat by his boat in the mornings, and when you came down to the landing he looked at what you had with you, and then he named the price.",
    "The price was never money.",
    "It was one of the things you were carrying, and he chose it. That was the difficulty, and everybody understood it before they came down the hill, which is why most people who intended to cross spent a while at the top of the path first, going through the cart in their heads.",
    "A merchant called Tahir came down on an afternoon in the spring with a good horse and a loaded cart.",
    "He was fifty-one. He had spent nineteen years building what was in that cart and he had not slept properly for the last three of them, and the far bank was where the new road went, and he had worked out on paper that a man who got across in the next two years would be a man who mattered on that road for the rest of his life.",
    "He began reasonably, because he was a reasonable man.",
    "He offered the horse. It was a genuinely valuable animal and he did not pretend otherwise; he had bought it for the journey and it was the best thing he owned that could be pointed at.",
    "No, said the ferryman.",
    "Tahir offered the horse and the cart together, which was the larger part of everything he had in the world.",
    "No.",
    "He offered, after standing there for a while, a sealed wooden box that he had not opened in front of another person in eleven years.",
    "No, said the ferryman, and then he named the price.",
    "It was a book. A small one, bound in cloth, about the size of a hand, and it lived in Tahir's coat and had lived there or in a coat very like it for thirty years.",
    "It was a list.",
    "He had started it at twenty-one, after the business with his uncle, and he had kept it with a clerk's care ever since. Every man who had cheated him. Every one who had promised and not come, every short weight, every debt written off because chasing it would have cost more than it was worth. Dates. Amounts. Two hundred and forty entries, and the hand at the start was a young man's hand and the hand at the end was his.",
    "Take the cart, said Tahir.",
    "I do not want the cart.",
    "Then take the cart and the horse and the box.",
    "I do not want those either.",
    "Why that? Tahir was not shouting. He was doing something worse, which was explaining. It is worth nothing. It is worth nothing to you and nothing to any man alive. You could not sell it for a coin. There is not one thing in it that anybody but me could even read.",
    "And the ferryman said: it is not the price because it is worth something. It is the price because you cannot get in the boat holding it.",
    "Tahir stood on that bank until the light went.",
    "He tried, in the last of it, the thing everybody tries. He put the book at the bottom of the cart under the sacking and led the horse down to the water's edge, and the ferryman watched him do it with no expression at all and did not get up.",
    "He did not accuse him. He did not say anything. He sat on the gunwale and looked at the river, and after a while Tahir walked the horse back up the shingle, because there is no arguing with a man who is simply not going to cast off.",
    "He camped that night above the landing and did not light a fire.",
    "He had the book out on his knee for a long time. He could not read it in the dark and he did not need to; he knew what was on most of the pages, and the ones he did not know by heart he could have found by the feel of the paper. There was an entry on the fourth leaf about a man who had been dead for twenty-two years.",
    "He thought, that night, about the road on the other side.",
    "And then he thought about what he would be on that road without the book, which was a man who had been cheated two hundred and forty times and could not any longer produce the evidence, and something in him went very still and very cold at that, and he understood that he was not going to do it.",
    "He went back up the hill in the morning.",
    "He did well, afterwards. That is worth saying, because people expect this story to punish him and it does not. He kept the business on the near bank for another twenty years and it was a decent business and he was not unhappy in it. He married. He was known as a hard man to get past, which in that trade is a compliment.",
    "He went down to the landing perhaps twice a year. He never asked the price again. He would stand at the top of the path for a while and then go home.",
    "The ferryman was still there when Tahir was seventy. He had not visibly changed, which the old men in the village had various theories about and which was probably just the way some faces go.",
    "He never refused anybody. Nobody was ever turned away at that river.",
    "They simply, most of them, declined to pay."
  ] },
{ id:'cutter', stage:'The Trials', bg:'abyss', mins:4,
  n:'The Stonecutter', src:'Japanese folk tale',
  laws:[{n:'Envy',f:'others'},{n:'Vibration',f:'inner'},{n:'Power',f:'others'}],
  rule:'Every position you envy is a position with something above it.',
  q:'Who are you measuring yourself against, and what are they measuring themselves against?',
  teach:'A Japanese folk tale, and one of the very few stories in any tradition that is a closed loop rather than a line. The shape is the argument: you cannot tell it without ending where it started, which is the only honest way to say what wanting to be somebody else actually does.',
  body:[
    "There was a stonecutter called Ping who went out every morning before it was properly light and cut stone out of the hill, and he did it for eleven years without ever once thinking about it.",
    "He was neither happy nor unhappy. He was a man with a chisel who was good with it, and the work was hard in the way that work is, and in the evenings his arms ached and he ate and slept.",
    "Then he delivered a load to a rich man's house.",
    "He had to wait in the courtyard while they found somebody to take the order, and he stood there for the better part of an hour with the cart behind him, and he looked at things.",
    "There was water running in a channel in the shade. There were four servants doing four different unhurried things. Through an archway he could see a room with the shutters half over, and in the room a man was lying on cushions in the middle of the afternoon with nowhere to be.",
    "Ping went home and could not eat.",
    "How I wish I were a rich man, he said, out loud, to nobody.",
    "And a voice from somewhere said: you are a rich man.",
    "He was.",
    "It was everything it had looked like from the courtyard. He lay in the cool room in the afternoons and there were people to do the things, and for about two years it was as good as anything he had imagined, which is longer than you might think.",
    "In the third year the prince came through the town.",
    "The whole street went down into the dust when the carriage came, and Ping went down with them, because a rich man in a small town is still a man in a street. He lay with his forehead on the ground and the wheels went past a foot from his hands, and he thought, with his mouth almost in the dirt: how I wish I were the prince.",
    "You are the prince.",
    "He rode in the carriage for six years.",
    "People knelt. He was carried places and given things and his opinion was taken on matters he knew nothing about, and it was genuinely better than being rich, which had genuinely been better than cutting stone.",
    "On an afternoon in the high summer of the sixth year he was being carried along a road between two dry fields, and the canopy over the carriage was doing nothing at all, and he could feel the sun burning the back of his neck through it.",
    "He looked out at the fields. They were cracked open. The ground had split into a pattern like old glaze and nothing in them was going to come up that year, and there was not one thing he could do about it in any direction, and the sun did not know or care that he was the prince.",
    "How I wish I were the sun.",
    "You are the sun.",
    "He burned for a long while. Years, in whatever way years count for a thing like that. He cracked the fields and dried the rivers back to stone and made princes miserable under their canopies, and there was nothing above him at all.",
    "Until a cloud came between him and the world.",
    "It took about a minute. It was not even a large cloud. It arrived, and the ground beneath it went grey and cool, and Ping poured everything he had at it and it simply sat there, and then it moved on when it was ready.",
    "How I wish I were a cloud.",
    "You are a cloud.",
    "He rained. He put out the sun whenever he chose and filled the rivers and swelled them over the banks, and he took away a bridge and then a village, and this was better again, because now he could move the things that had been fixed.",
    "And everything moved. That was the discovery. Everything he poured on shifted, and slid, and went downstream.",
    "Except one thing.",
    "There was a great rock standing out of the plain below him, and he rained on it for a year, and it stood exactly where it had stood, and it did not care.",
    "How I wish I were the rock.",
    "You are the rock.",
    "And now nothing moved him. The rain ran off. The sun could not crack him and the wind did not touch him and the rivers went round. This was the end of the wanting, and he stood in it the way a mountain stands in weather, and he was, at last, the thing that everything else happened to and none of it mattered.",
    "Then he felt something at his base.",
    "It was small. It was a hard regular blow, and then another, and then another, in a rhythm, and it went on and did not stop, and after a while there was less of him than there had been.",
    "He looked down.",
    "There was a man at the foot of him with a chisel, taking him apart.",
    "And Ping, who had been a rich man and a prince and the sun and the rain and a rock that nothing could move, said: how I wish I were a man.",
    "He was at the rock face. It was before it was properly light. There was a chisel in his right hand and the cold of the iron was coming through his palm, and below him the town was starting to make its morning noise.",
    "He stood there for a while.",
    "Then he set the chisel and hit it, and a piece came away, and he set it again."
  ] },
{ id:'monks', stage:'The Trials', bg:'delta', mins:4,
  n:'Two Monks and the Woman at the Ford', src:'Zen · Tanzan and Ekido',
  laws:[{n:'Attachment',f:'inner'},{n:'Rhythm',f:'time'}],
  rule:'You put it down hours ago. Somebody is still carrying it, and it is you.',
  q:'What did you set down that you are still holding?',
  teach:'Tanzan and Ekido were real, and this exchange is told as something that happened on a road. Zen keeps it because it is the shortest available demonstration that an event and the carrying of an event are two different things, and only one of them takes any time.',
  body:[
    "They left the monastery before light and the road was in a bad state the whole way.",
    "It had rained for a week and then stopped, which is worse than rain, because the water had gone off the hills and into the ruts and was sitting there. Tanzan was sixty-one and had made that journey perhaps forty times. Ekido was twenty-eight and had made it twice, and was carrying more, because he had insisted.",
    "They were good company, in the ordinary way. Ekido asked questions and Tanzan answered most of them and declined to answer some, and the sun came up somewhere behind the cloud, and by the middle of the morning they had done about half of it.",
    "The ford was at the bottom of a cut where the track came down to a stream.",
    "In a dry month it was four flat stones and you kept your feet. That morning the stream was over the stones and spread out into the churned ground either side of it, and the whole crossing was thirty feet of mud with water moving through it.",
    "There was a girl standing at the edge.",
    "She was perhaps twenty and she was dressed for somewhere entirely else, in a silk kimono the colour of weak tea, with the sleeves and the hem of a person who had been going to a thing and had not expected this. She had been standing there a while. You could tell by the way she was standing, which was the way people stand when they have run out of ideas and are waiting for the situation to change on its own.",
    "She looked at the two monks and then back at the mud.",
    "Tanzan said, come on, girl.",
    "He put his bundle over his shoulder, and got an arm under her knees and one round her back, and picked her up, and carried her across. It took perhaps four or five seconds. He put her down on the dry stones on the far side and she said something and he said something back, and then he hitched the bundle and went on up the track.",
    "Ekido came over the ford behind him.",
    "He did not say anything.",
    "He did not say anything for the rest of the morning.",
    "He walked about six feet behind and to the left, which was not where he had been walking before, and Tanzan talked from time to time about the state of the road and about a man they both knew at the temple they were going to, and Ekido said yes and no in the right places.",
    "At midday they stopped and ate and Ekido ate very little.",
    "In the afternoon it got warm, which made the mud worse rather than better, and there was a long climb. Tanzan asked him twice whether the load was too much and Ekido said no.",
    "What was happening in Ekido's head, for those hours, was not idleness. It was work. He was constructing the thing properly, in order, the way he had been taught to construct an argument. There was the rule itself, which he could state. There was the reason for the rule, which he could also state, and which was not a stupid reason. There was the question of whether a senior man was exempt from it, and he had gone round that one several times and kept arriving at no. There was the fact that Tanzan had not hesitated, which was somehow the worst part, and which Ekido kept coming back to and worrying.",
    "Underneath all of it, though he did not put it this way, was that he had stood on the near bank and watched and had not known what to do, and had then been given something to be certain about, and the certainty was a considerable relief.",
    "They came over the last rise at about five and the temple was below them in the trees.",
    "They went down and were met, and put their bundles in the room they were given, and washed their feet and their hands in the yard, and Ekido had been holding it in for eleven hours and could not hold it any more.",
    "We monks do not go near females, he said. Especially not young and lovely ones. It is dangerous. Why did you do that?",
    "Tanzan was drying his hands. He looked up with the towel still in them, and he did not look annoyed and he did not look caught out. He looked like a man who has been asked something out of nowhere and is working out what it refers to.",
    "Then he said: I left the girl there.",
    "He put the towel on the rail.",
    "Are you still carrying her?",
    "They went in and ate with the others and the evening was ordinary. Nobody else ever heard about it. Ekido did not sleep much, and lay in the dark of an unfamiliar room going over it, and was still angry, and then somewhere in the small hours stopped being angry and started being something else, which took a good deal longer to get to the bottom of and which he was still getting to the bottom of at sixty.",
    "He told it, eventually, for the rest of his life. He always told it against himself and he never once left out the eleven hours, because the eleven hours were the whole of it.",
    "Tanzan, as far as anybody knows, never mentioned it again."
  ] },
{ id:'knot', stage:'The Ordeal', bg:'iceberg', mins:4,
  n:'The Knot Nobody Could Untie', src:'Greek · Alexander at Gordium',
  laws:[{n:'Cause and Effect',f:'motion'},{n:'Strategy',f:'others'},{n:'Decision',f:'motion'}],
  rule:'Most impossible problems are ordinary problems with a rule attached that nobody checked.',
  q:'Who told you it had to be untied?',
  teach:'Told about Alexander at Gordium in 333 BC and kept for two and a half thousand years, which is worth noticing on its own: what survives is not the campaign, it is thirty seconds with a sword. Some versions have him pull out the pin instead. Both endings are the same story.',
  body:[
    "The priest's name was Gordios, after the town, which was a common enough name there, and he had charge of the temple on the citadel for forty-one years.",
    "The temple had one object in it worth coming to see. It was a wagon. An old one, a farm cart, with the yoke lashed to the pole by a knot of cornel bark, and it had been standing under that roof since before anybody's grandfather.",
    "The bark had dried. That was the thing people did not expect until they got their hands on it. It had gone hard and dark and closer to wood than to rope, and whoever tied it had worked both ends back inside the body of it, so that you could turn the whole thing over in the light for an hour and not find a place to begin.",
    "The oracle attached to it was short and everybody in Asia knew it. Whoever unties the knot will rule all of Asia.",
    "Men came. Not often, but often enough that Gordios had developed a routine for it.",
    "He would let them in and stand at a distance and not talk. They always started the same way, which was to walk round it twice and look confident. Then they got their hands on it, and there was usually a particular moment about ten minutes in when the confidence went and the actual work began.",
    "After that they varied.",
    "Some stayed an afternoon. A Persian nobleman stayed eleven days and had a lamp brought and worked at it in the evenings and was perfectly good company at supper, and left without any fuss and sent a gift afterwards. A man from the coast came four separate times over nine years. One tried to bribe Gordios to let him take it away and work on it privately, which Gordios refused, not out of piety but because he could see exactly how that ended.",
    "They all had good hands and most of them were patient and several were extremely clever.",
    "None of them untied it.",
    "Gordios watched forty-one years of it and formed a view, which he never said out loud to any of them, because it was not his business and because he was not certain of it.",
    "His view was that they were all doing the same thing.",
    "Every single man who had ever come up that hill had begun by assuming the rope had to survive. It was so obvious that none of them ever said it. A knot is a rope that has been folded; a folded rope has two ends; the work is to find an end and reverse the folding. That is what untying is. That is what the word means.",
    "But the oracle did not say the word.",
    "Gordios had gone over the wording many times in his forty-one years, and it says: whoever unties the knot will rule all of Asia. It says nothing about fingers. It does not say the bark must be whole afterwards, or that the wagon must be usable, or that the thing must be done by patience. The rule that had been defeating everybody for a century was not in the sentence. It had arrived with the object, the way rules do.",
    "He never mentioned it. It would have been an odd thing for a priest to say and he was not at all sure he was right.",
    "The Macedonian came in the spring, and he was twenty-two.",
    "Gordios had heard about him for a year by then, the way everybody had, and had formed the picture everybody forms, and the picture was wrong in one particular. He had expected noise. What came up the hill was a young man with about a dozen others and very little ceremony, and he said good afternoon to the priest and asked whether he might see it.",
    "He walked round it twice.",
    "Then he got his hands on it, and about ten minutes in Gordios saw the confidence go, exactly as it went with all of them, and thought: ah, well.",
    "But the young man did not start working harder. He stopped.",
    "He stood back from the cart with his hands at his sides and he looked at it for what Gordios afterwards thought was close on a minute, which is a very long time for a room with nine other men in it and nobody talking.",
    "Then he asked Gordios to say the oracle again.",
    "Gordios said it.",
    "The young man asked him whether that was all of it, exactly, in those words, and Gordios said that it was, and that he had said it perhaps two hundred times.",
    "The young man nodded, and drew his sword, and cut the knot in half.",
    "There was a sound in the room from the men behind him, and one of them laughed and then stopped. Gordios, who had watched forty-one years of careful work on that thing, did not move at all.",
    "The yoke came off the pole and hit the floor.",
    "The young man put the sword away, and thanked him, and asked whether the temple needed anything, and Gordios said no.",
    "When they were going out, the youngest of the party said something to another one about it being a cheat, not quietly enough, and the young man heard it and turned round in the doorway.",
    "He did not defend himself. He said: read it again.",
    "Then they went down the hill.",
    "Gordios kept the two pieces. He kept them for the remaining nine years of his life and he showed them to people, and people always asked the same question, and he always gave the same answer, which was that the oracle had held.",
    "He did rule Asia. That is the part that makes it a story rather than an anecdote about a young man damaging an antique. The prophecy did not quibble. It had never said what everyone had spent a hundred years assuming it said, and the only man who had ever stopped and asked to hear it out loud was the one who noticed."
  ] },
{ id:'pocket', stage:'The Reward', bg:'iris', mins:4,
  n:'The Diamond He Was Carrying', src:'Hindu · Ramakrishna',
  laws:[{n:'Correspondence',f:'inner'},{n:'Sufficiency',f:'time'}],
  rule:'Having it and knowing you have it are two different acquisitions.',
  q:'What do you already have that you are still trying to get?',
  teach:'From the Ramakrishna tradition, and it is the one story in this set where the person gets everything they wanted, keeps it for three days, and then comes back to hand it over. That is the whole of the teaching and it is why the Reward is a stage rather than an ending.',
  body:[
    "The road from the town to the river crossing ran for six miles through country with nothing in it, and Anil had walked it perhaps four hundred times.",
