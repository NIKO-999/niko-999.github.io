<!doctype html>
<html lang="en" data-view="open">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0A08">
<title>Alignment</title>
<link rel="preload" href="../arc/fonts/Inter.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: 'Inter'; font-weight: 100 900; font-display: swap;
  src: url('../arc/fonts/Inter.woff2') format('woff2'); }

/*
  ALIGNMENT. Its own ground, its own type, its own everything — it reads
  none of the other keys and takes none of the shared shell.

  THE FOURTEEN PHOTOGRAPHS WENT WITH THE STORIES. Every screen was a
  picture in a frame with the interface living in the material around
  it, under a per-image brightness beneath one shared grade — measured,
  the set spanned 235 degrees of hue, and no single transfer function
  pulls a mixed library into one family. There is no image in this app
  now, so the grade token, the brightness token and both rules that
  read them are gone rather than left to cascade at nothing.
*/

:root {
  --paper: #0B0A08;
  --ink: #FFFFFF;
  --dim: rgba(255,255,255,.72);
  --spent: rgba(255,255,255,.46);
  --hair: rgba(255,255,255,.14);
  --glass: rgba(255,255,255,.10);

  /* Chrome sits on a PLATE, not on glass. A 10% white wash over a lit
     photograph put the info glyph at 2.50:1 against the 3 a graphic
     needs. The photographs have gone and the plate stays, because a
     control is still told from the page by its own ground. */
  --plate: rgba(11,10,8,.56);

  --card: #1A1611;
  --card-edge: rgba(255,255,255,.08);

  --r-card: 26px;
  --r-in: 18px;
  --r-sq: 14px;
  --r-pill: 999px;

  /* Six vertical steps. The first build shipped eleven — 8 10 12 14 18
     20 22 24 26 34 38 — which is this repo's own runaway-scale fault in
     a third dimension after thirty type sizes and thirteen leadings. */
  --v1: 6px;  --v2: 10px; --v3: 16px;
  --v4: 22px; --v5: 34px; --v6: 52px;

  --gut: 22px;
  --round: 40px;   /* drawn; the 44 it OWNS is the ::before square */
  --gut-list: 18px;
  --tap: 44px;

}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body { height: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: 'Inter', -apple-system, system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  overflow: hidden;
  overscroll-behavior: none;
}

button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
[hidden] { display: none !important; }

.al-disp   { font-size: 38px; font-weight: 450; line-height: 1.00; letter-spacing: -.03em; }
.al-disp-s { font-size: 28px; font-weight: 450; line-height: 1.02; letter-spacing: -.024em; }
.al-caps   { font-size: 10px; font-weight: 600; letter-spacing: .5em; text-transform: uppercase; color: var(--dim); }
.al-body   { font-size: 16px; font-weight: 400; line-height: 1.50; color: var(--dim); }
.al-note   { font-size: 13px; font-weight: 450; line-height: 1.45; color: var(--dim); }

.al-view { position: relative; z-index: 1; height: 100%; display: none; flex-direction: column; }
.al-view.is-on { display: flex; }

#alOpen { justify-content: flex-end; padding: 0 var(--gut-list) var(--v5); }
#alOpen .al-mark { margin-bottom: var(--v3); }
.al-mark { display: flex; align-items: center; gap: 9px; }
.al-mark svg { width: 20px; height: 20px; display: block; }
.al-mark b { font-size: 13px; font-weight: 500; letter-spacing: 1.2em; text-transform: uppercase; }
#alOpen .al-disp { margin-bottom: var(--v2); max-width: 7.2em; }
#alOpen .al-note { margin-bottom: var(--v4); max-width: 20em; }

/* A PILL IS SIZED TO ITS CONTENT. Not one of the four reference pills
   spans the screen — they measure 217, 148, 187 and 134 CSS px, all
   43 to 50 tall. A full-bleed primary was the widest object on the
   open screen and read as a form submit. */
.al-pill {
  display: inline-flex; align-items: center; justify-content: center;
  align-self: flex-start;
  min-height: 48px; padding: 0 30px; border-radius: var(--r-pill);
  background: var(--ink); color: #14120E;
  font-size: 16px; font-weight: 500; letter-spacing: -.01em;
}

.al-head { padding: calc(var(--v4) + env(safe-area-inset-top, 0px)) var(--gut-list) var(--v3); display: flex; align-items: center; gap: 12px; flex: none; }
.al-head .al-disp-s { flex: 1; }
.al-head .al-count { flex: none; }

/* A COUNT IS A FIGURE, NOT A LABEL. It wore .al-caps, which is 10px at
   half an em of tracking — right for a word and wrong for a number:
   24 drew as "2 4", two digits with a space between them. It carries
   its own rule rather than overriding .al-caps, because the two are
   equal specificity and this repo has lost that race five times. */
.al-count { font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--dim); }

/* 44 OWNED, 40 DRAWN — and an inset cannot say that here. An
   absolutely positioned box resolves against its host's PADDING box,
   and .al-round carries a 1px border under a border-box reset, so its
   padding box is 38 and inset:-2px reached 42 rather than the 44 the
   declaration reads as. Two real controls sat under the floor and the
   arithmetic was invisible in the source. Centring an explicit --tap
   square is immune to the host's border, padding and drawn size alike,
   and it is what makes the token load-bearing rather than decorative. */
.al-round {
  width: var(--round); height: var(--round); flex: none; border-radius: var(--r-pill);
  background: var(--plate); border: 1px solid var(--hair);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  display: grid; place-items: center; position: relative;
}
.al-round::before {
  content: ''; position: absolute; top: 50%; left: 50%;
  width: var(--tap); height: var(--tap); transform: translate(-50%, -50%);
}
.al-round svg { width: 17px; height: 17px; display: block; }

.al-pane { flex: 1; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  padding: 0 var(--gut-list) calc(118px + env(safe-area-inset-bottom, 0px)); }
.al-pane::-webkit-scrollbar { display: none; }

/* A MASK, NEVER A GRADIENT LAID OVER THE CONTENT. It was written when
   the ground was a photograph and a --paper overlay was a near-match
   that read as a smudge somewhere on the set; over one flat ground a
   gradient would do, and a mask is still the version with no colour
   to get wrong. Off again at the end of the travel: a
   soft edge over nothing is the same lie in the other direction. */
.al-pane { -webkit-mask-image: linear-gradient(180deg, #000 calc(100% - 86px), transparent 100%);
                   mask-image: linear-gradient(180deg, #000 calc(100% - 86px), transparent 100%); }
.al-pane.is-end { -webkit-mask-image: none; mask-image: none; }

.al-grp { padding: var(--v5) 2px var(--v2); }

.al-lead { padding: var(--v4) 0; }
/* The title runs at line-height 1.00, so its last line box ends level
   with the ink and a descender prints into whatever is next. Six
   pixels, which is also what makes the pair read as two registers
   rather than one wrapped line. */
.al-lead .al-caps { margin: var(--v1) 0 var(--v2); }
/* THE TITLE HAS TO CLEAR THE CLOSE BUTTON, AND 9em DID NOT. The X is
   fixed at the viewport's own right edge, so the room the title has is
   a number of PIXELS and an em measure cannot see it: at 38px, 9em is
   342 and the button's left edge is 330. Twenty of fifty-seven titles
   ran into it and twelve overlapped it outright — and the one this was
   first looked at on was among the thirty-seven that clear, which is
   what a single screenshot is worth as a check. Derived from the two
   gutters and the button rather than written as 304px, so the day a
   token moves the title moves with it. */
.al-lead .al-disp { max-width: calc(100% - (var(--round) + var(--gut) - var(--gut-list) + 8px)); }

/* Nothing to travel with any more: the ground under the words is the
   page. The whole class of contrast failure that MOVES with the scroll
   went out with the photograph. */
.al-sheet { padding-bottom: var(--v6); }

.al-rule-hd { margin: var(--v5) 0 var(--v3); display: flex; align-items: center; gap: 12px; }
.al-rule-hd:after { content: ''; flex: 1; height: 1px; background: var(--hair); }

/* A TAG'S FILL AND ITS LABEL PULLED THE SAME WAY. Both were mixed from
   one hue, so they closed on each other from both sides and the worst
   pair measured 1.71:1 — the worst text in the app. The hue lives in
   the label and the rim now; the ground is a plate. */
.al-tags { display: flex; flex-wrap: wrap; gap: 16px 8px; margin-bottom: var(--v4); }
.al-tag {
  position: relative;
  display: inline-flex; align-items: center; height: 30px; padding: 0 12px;
  border-radius: var(--r-sq);
  font-size: 13px; font-weight: 500; letter-spacing: .01em;
  background: rgba(11,10,8,.78);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid color-mix(in srgb, var(--tg) 30%, transparent);
  color: color-mix(in srgb, var(--tg) 66%, var(--ink));
}
.al-tag::before {
  content: ''; position: absolute; left: 0; right: 0; top: 50%;
  height: var(--tap); transform: translateY(-50%);
}
.al-tag[data-f="inner"]   { --tg: #C9A227; }
.al-tag[data-f="motion"]  { --tg: #D2603A; }
.al-tag[data-f="others"]  { --tg: #7E9AA6; }
.al-tag[data-f="time"]    { --tg: #8E9370; }

.al-rule {
  border-radius: var(--r-card); padding: var(--v4); margin-bottom: var(--v2);
  background: var(--card); box-shadow: inset 0 1px 0 var(--card-edge);
}
.al-rule .al-caps { margin-bottom: var(--v2); }
.al-rfrom { margin-top: var(--v2); font-size: 13px; color: var(--dim); }
.al-rule b { display: block; font-size: 19px; font-weight: 600; line-height: 1.26; letter-spacing: -.016em; }

/* ---- THE FOOT ---- */
.al-foot {
  position: fixed; left: 93px; right: 93px; z-index: 30;
  bottom: calc(var(--v4) + env(safe-area-inset-bottom, 0px));
  height: 58px; border-radius: var(--r-pill);
  background: rgba(24,21,17,.62);
  backdrop-filter: blur(26px) saturate(1.5); -webkit-backdrop-filter: blur(26px) saturate(1.5);
  border: 1px solid var(--hair);
  display: grid; grid-auto-flow: column; align-items: center;
  padding: 0 var(--v1);
}
.al-tab { height: 46px; border-radius: var(--r-pill); display: grid; place-items: center; color: var(--dim); }
.al-tab svg { width: 20px; height: 20px; display: block; }
.al-tab[aria-current="true"] { background: rgba(255,255,255,.12); color: var(--ink); }

/* GLASS OVER A PHOTOGRAPH WAS A MATERIAL. GLASS OVER A SENTENCE IS A
   SMEAR. This is the one round control that sits over running body
   text, fixed, while the pane scrolls under it — and .al-round's own
   --plate is 56%, which dims a word without removing it. Measured on
   composited pixels, a letter behind the disc survived as a 44-point
   luminance ghost and the screenshot read "you will b✕". At 94% the
   ghost is 6 and the backdrop pass is drawing nothing anybody can
   see, so it stops being glass either way: --card is the app's own
   object material, the ghost is 0, and the disc reads as a thing ON
   the page rather than a hole punched in it. The glyph costs nothing
   — 19.3:1 on the old plate, 19.8 on this one. Both X's take it;
   both sit over a pane of text. It is LATER in the file than
   .al-round and the two are equal specificity, so source order is
   what makes it win — the computed value is read back rather than
   trusted. */
.al-x { position: fixed; top: calc(18px + env(safe-area-inset-top, 0px)); right: var(--gut); z-index: 30;
  background: var(--card); backdrop-filter: none; -webkit-backdrop-filter: none; }
</style>
</head>

<section class="al-view is-on" id="alOpen">
  <div class="al-mark" role="img" aria-label="Alignment">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 2v20M5 8l7-6 7 6M5 16l7 6 7-6"/></svg>
  </div>
  <h1 class="al-disp" id="alOpenT">What takes you off, and what carries you.</h1>
  <p class="al-note" id="alOpenN">Fifty-seven named things, sorted into the two that matter. Nothing here is a story. Each one is what it is and what it does.</p>
  <button class="al-pill" id="alOpenB">Begin</button>
</section>

<section class="al-view" id="alDark">
  <div class="al-head"><h1 class="al-disp-s">Dark</h1><span class="al-count"></span></div>
  <div class="al-pane" id="alDarkPane"></div>
</section>

<section class="al-view" id="alLight">
  <div class="al-head"><h1 class="al-disp-s">Light</h1><span class="al-count"></span></div>
  <div class="al-pane" id="alLightPane"></div>
</section>

<section class="al-view" id="alLessons">
  <div class="al-head"><h1 class="al-disp-s">The Lessons</h1><span class="al-count"></span></div>
  <div class="al-pane" id="alLessonsPane"></div>
</section>

<section class="al-view" id="alLaw">
  <button class="al-round al-x" id="alLawX" aria-label="Close">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
  <div class="al-pane" id="alLawPane"></div>
</section>

<nav class="al-foot" id="alFoot">
  <button class="al-tab" data-v="dark" aria-current="true" aria-label="Dark">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>
  </button>
  <button class="al-tab" data-v="light" aria-label="Light">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.4M12 19.6V22M2 12h2.4M19.6 12H22M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7"/></svg>
  </button>
  <button class="al-tab" data-v="lessons" aria-label="The Lessons">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5 5h14v14H5zM9 10h6M9 14h4"/></svg>
  </button>
</nav>

var LAWS = {
  'The Answer You Are Carrying': 'The thing you are looking for is very often already in your possession — written down, said to you, sitting under your feet. Finding it was never the difficulty. Being able to hear it is, and that is usually bought rather than given.',
  'The Lit Ground': 'You search where searching is comfortable rather than where the thing actually is. The lit ground is not where you dropped it. It is simply the only place you can see, and effort spent there looks identical from outside to effort that would work.',
  'The Full Cup': 'Nothing new enters a container that is already occupied. You are not being refused the answer; there is nowhere in you for it to go, and the thing filling the space is usually something you are right about.',
  'The Cost of Being Right': 'Every answer you argue with is protecting a decision you have already made. The price of hearing it is admitting what it makes of the last two years, which is why people go looking for help and come home having defended themselves.',
  'The Early Verdict': 'Every event arrives as half a sentence and you read it out as the whole one. A verdict delivered early is not a description of what happened — it is the first move of what happens next.',
  'The Long Carry': 'The event has a duration and it ends. The carrying is a second thing, which you are doing, and it runs at full strength for as long as you keep feeding it. Nothing external is required after the first four seconds.',
  'The Sentence That Arrives Ready': 'The tell that you are still carrying something is that it comes out fully formed, hours or years late, with no introduction, as though the conversation were still running. It is not still running. Nobody else is in it.',
  'The Spent Feeling': 'Announcing a thing pays you a small amount of the feeling you were supposed to get from finishing it, out of the same account. Tell enough people and you can draw the whole balance without ever doing the work.',
  'The Walk': 'Understanding a thing and acting on it are two separate acquisitions. Almost everybody completes the first, calls it done, and is genuinely surprised years later to find nothing moved.',
  'The Wheel': 'Either your outcomes come out of your own hands or they come out of the weather. Both are beliefs and only one of them leaves you anything to do tomorrow, which is why the honest account of a bad year arrives as relief rather than shame.',
  'The Toll': 'Everything is paid for, and rarely in the currency you offered. The bill comes from an account you did not know was open, and the fare is never the thing you were holding out.',
  'What Only Made Sense Back There': 'A threshold charges you the thing that was only ever valuable on the side you are leaving. That is not cruelty. If it made sense on both banks it would not be a threshold, it would be a road.',
  'The Handle': 'A problem you caused is a problem with a handle on it. Fault is not a moral verdict here; it is the difference between a situation you can reach and one you can only wait out.',
  'The Open Door': 'A way back is almost never used. It takes a little pressure out of every hard thing instead, continuously and invisibly, and the pressure was what was going to finish the work.',
  'The Stranger’s Mouth': 'The answer very often arrives from somebody who is not trying to help you, does not know they have given it, and will not remember saying it. People close to you have usually said the same thing and been unable to make it land.',
  'The Sideways Look': 'Every position has something above it that was invisible from the one below. Whoever moves because of what they can see from where they stand will move for ever, and will never find out what they had.',
  'The Borrowed Engine': 'Running on somebody else’s doubt works, and it means somebody else is steering. The only question that engine can ask is what would prove them wrong, and that is a different question from what you actually want.',
  'The River Does Not Wait': 'Conditions are never right, because right is not a state conditions are in. The thing goes past at its own rate whether or not you are ready, and it has been going past the whole time you were preparing.',
  'Two Ends of One Thing': 'A disaster and a making are frequently the same event measured from different distances. You never get to stand far enough back to be certain, and there is always another year after this one.',
  'Nothing Has a Size of Its Own': 'A number is only ever large or small against whatever you have put beside it, and you choose what you put beside it far more often than you notice.',
  'The Number That Moves': 'Readiness recedes as you approach it, because the thing you are waiting for was never a number. Every threshold you set will be more sensible than the last one, and you will never arrive.',
  'The Second Thing': 'What you wanted arrives with something attached that you did not ask for and were not warned about. It is usually the fear of it leaving, and it usually weighs more than the thing.',
  'The Quiet Middle': 'The work that decides it has no screen, no course, nobody to tell and no way to get better except by being in it. It pays nothing for a long time and there is no way to make it interesting.',
  'The Judge You Installed': 'Show the work to enough people and one of them takes up residence. It arrives with standards you never agreed to, it has no interest in the boring majority of what you do, and you will be working to please it for months before you notice it moved in.',
  'The Unwritten Half': 'Every record is a record of what you did. The things you did not do leave no line, pass every audit, and are frequently the whole of what went wrong — which is why a clean book above a falling result is not a contradiction.',
  'The Prize Goes to the Exception': 'What people respond to is almost never the thing that produced your year. It is the one week that did not look like the rest, and going after the applause means going after your own outlier, which is the single result you have no method for.',
  'The Price Was the Purchase': 'You name the thing you want and book everything it costs as the price. Very often the costs are the acquisition and the named thing is a souvenir — the patience, the tolerance for a boring morning, the not negotiating, all filed as expense for years while they were the only part that transferred.',
  'The Measuring Does Not Stop': 'You think a number will end the counting. It will not, because the counting is a habit and not a verdict: arrive at the figure and you find yourself standing in the same place doing the same arithmetic about a different figure, with the same face on.',
  'The Narrow Gift': 'The capacity to stay on one thing long past the point where it is interesting to anybody else. It gets called one-dimensional and it is trained out of most people by about fourteen, and it is the single attribute that separates the ones who get good.',
  'What Got Rewarded': 'You did not choose most of what you are like. You repeated whatever got a reaction and stopped whatever got a look, and by the time you were old enough to examine it, it had been your personality for twenty years.',
  'A Picture Is Not a Rehearsal': 'You can hold a completely accurate image of the person you intend to become and never once do a thing that person does. The picture costs nothing, which is exactly what makes it so easy to keep having instead.',
  'Mostly It Is Not Doing Things': 'The version of you one level up is not doing a great deal more than you are. They are doing considerably less, and the hours that frees up is most of the difference between you.',
  'The State Wrote It': 'You believe the conclusion came out of the thinking. Put the same facts to yourself on two different days and you get two answers, both fully argued and both certain, and the only thing that moved was what sort of day you were having.',
  'Nothing Records the Weather': 'Every record you keep holds what you decided and not what state you were in when you decided it. The missing half is the half that chose, which is why reading your own notes back teaches you so much less than it should.',
  'Freedom Is Not Autonomy': 'Freedom is measured in what you do not have to do. Autonomy is measured in what you get to decide. They sound like one thing and they run in opposite directions — somebody with nothing has a great deal of the first and none of the second.',
  'Leverage Is What Buys the No': 'Refusing work, setting a price and naming the day are not personality traits. They are bought, and the currency is something scarce that other people need. Until you hold that, every hour you own belongs to whoever is paying.',
  'The Word You Reached For': 'You will chase the wrong thing for years because you took the nearest word for it. Freedom, success, respect — each of those is a word standing in front of something more specific, and the specific one is the only version with a method attached.',
  'The Talent Nobody Sells': 'The attribute that decides it is usually one no course covers, because a field advertises what it can teach you and this is not that. You did not develop it. You were issued with it somewhere you would not have chosen, and the only move available is to notice.',
  'The Sunday Version Has the Vote': 'The you who writes the rule is calm and has nothing at stake. The you who breaks it is neither. Settling in advance which of them is in charge is most of what discipline actually is, and it is a decision rather than a strength.',
  'The Version You Can Always Do': 'Every plan is written for a good week. The one that decides your year is the one you can still run on the worst day of the month, and it is almost never the one you designed.',
  'Starting Again Is the Cost': 'The session you miss costs very little. What costs is the fortnight after it, when you are no longer somebody who does this and have to become one again from nothing.',
  'Too Small To Bother With': 'The reason you did nothing is that the only version available was beneath the standard you hold yourself to. That standard is not discipline. It is the most reliable method there is for doing nothing at all.',
  'Aimed, Not Removed': 'The trait you have been trying to get rid of since you were twenty is not going anywhere. Its destructive shape and its useful one run on the same machinery, so the work was never removal. It is deciding what it points at.',
  'What They Called It': 'The word other people put on a trait of yours was a report on how it affected them, never a description of the thing. Difficult, intense, obsessive, blunt — each of those tells you what it cost somebody, and none of them tells you what it is for.',
  'The Convenient Reason': 'The explanation that is true and also happens to be the one you wanted is the hardest thing there is to examine from the inside, because the examining is being done by the person it benefits. Thinking about it more carefully will not settle it. Nothing you can do at your desk will.',
  'What The Months Say': 'A decision you cannot verify at the time gets verified by what you do with the room it made. The reason was real if the work happens and it was a cover story if it does not, and you find out inside about six weeks whichever way it goes.',
  'Nothing To Point At': 'A thing that hurts you announces itself and gets dealt with. A thing that softens you never does. It arrives as rest, some of it genuinely is rest, and that is exactly what lets it take the same forty minutes off the end of every day for a year without once being named.',
  'You Cannot Negotiate With A Room': 'A rule is something you have to hold up. The room holds itself up, all day, at no cost to itself, and it will outlast any arrangement you make with yourself about it. Change the room or expect the fortnight.',
  'What Is Left Standing': 'Take away nine things and the tenth gets the verdict whether or not it earned it. Elimination is a real method with one failure it cannot see from inside: it never finds the cause, it finds the survivor, and somebody who has removed most of their life has arranged the answer in advance.',
  'The Test Runs Both Ways': 'Remove it and the problem goes, and you were right. Remove it and the problem stays, and you are standing in a very quiet room with nothing left to take out and only yourself to look at. The decision is only honest if you have genuinely thought about the second one.',
  'A Leap Is Seen From Outside': 'The jump is real and it is a description of the outside. From inside it there is no jump at all — two or three hundred days, most of them identical, and the only thing that made it a leap is that nothing interrupted them.',
  'The Picture Makes Tuesday Feel Like Failure': 'Hold a big enough image of where you are going and an ordinary day starts reading as evidence that it is not happening. That gap is uncomfortable, and what people do about it is change the plan — which is the thing that actually costs the year.',
  'Sacrifice Now Or Sacrifice It': 'What you want has a price and the bill does not go away when you decline it. Refuse the cost and the thing itself becomes the thing you gave up. You paid either way, and only one of the two came with it attached.',
  'The Number You Never Wrote Down': 'Everybody says they are getting out at a figure and almost nobody names it. An unnamed number moves — every level you reach quietly becomes the new floor, and the moment to collect goes past without announcing itself, because there was never a line drawn for it to cross.',
  'Visibility Is Billed Later': 'Being seen is a cost that arrives on a delay. It reads as free for years and gets paid all at once, to the people who were watching for reasons of their own, and the ones who needed it most are always the ones it finds first.',
  'Everything Is Paid For': 'What you take does not stay taken. The account is not moral and it is not fast, and it does not care whether you meant it — the only choice available is whether you put it down yourself while it is still yours to put down.',
  'The Day Nobody Announced': 'The morning it changed was indistinguishable from the four hundred before it. You will not feel it arrive. You will notice, much later and by accident, that it is already behind you.'
};

    carry.forEach(function (x) {
      var r = el('div', 'al-rule');
      if (x.src && x.src !== 'Ours') r.appendChild(el('div', 'al-caps', x.src));
      r.appendChild(el('b', null, x.rule));
      sh.appendChild(r);
    });
  }

  p.appendChild(sh);
  p.scrollTop = 0; mask(p);
}

var VIEWS = ['open', 'dark', 'light', 'lessons', 'law'];
function view(v) {
  if (VIEWS.indexOf(v) < 0) v = 'dark';
  document.documentElement.setAttribute('data-view', v);
  VIEWS.forEach(function (x) {
    var n = $('#al' + x.charAt(0).toUpperCase() + x.slice(1));
    if (n) n.classList.toggle('is-on', x === v);
  });
  $('#alFoot').hidden = (v === 'open' || v === 'law');
  $('#alLawX').hidden = (v !== 'law');
  document.querySelectorAll('.al-tab').forEach(function (b) {
    b.setAttribute('aria-current', b.getAttribute('data-v') === v ? 'true' : 'false');
  });
  $('#alDark').querySelector('.al-count').textContent = countOf('dark');
  $('#alLight').querySelector('.al-count').textContent = countOf('light');
  $('#alLessons').querySelector('.al-count').textContent = S.length;
  if (v === 'dark') paintSide('dark');
  if (v === 'light') paintSide('light');
  if (v === 'lessons') paintLessons();
  if (v !== 'law') { st.last = v; save(); }
}

var lawBack = 'dark';
function openLaw(name) {
  if (!LAWS[name]) return;
  var now = document.documentElement.getAttribute('data-view');
  if (now !== 'law' && now !== 'open') lawBack = now;
  paintLaw(name);
  view('law');
}

document.addEventListener('click', function (e) {
  var t = e.target.closest ? e.target.closest('.al-tab, .al-pill, .al-tag, #alOpenB, #alLawX') : null;
  if (!t) return;
  if (t.id === 'alOpenB') return view(VIEWS.indexOf(st.last) > 0 && st.last !== 'law' ? st.last : 'dark');
  if (t.id === 'alLawX') return view(lawBack);
  var law = t.getAttribute && t.getAttribute('data-law');
  if (law) return openLaw(law);
  if (t.classList.contains('al-tab')) return view(t.getAttribute('data-v'));
});

view('open');
window.alDrive = { view: view, openLaw: openLaw };

}());
</script>
</body>
</html>
