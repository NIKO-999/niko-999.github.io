    "He carried things for people. That was the work: you stood at the edge of the market from before dawn and if somebody needed a load taken to the crossing you took it, and if nobody did you stood there until the middle of the afternoon and then went home. He was thirty-four. He had done it since he was fifteen and he was not going to be doing anything else.",
    "On a morning in the hot season he was on that road with nothing to carry, because there had been nothing, and about four miles out he came on a sadhu asleep under a tree.",
    "This was not unusual. They went up and down that road all year.",
    "What was unusual was what was lying beside him in the dust.",
    "It was a stone about the size of a plum and it was doing something with the light that nothing in Anil's life had ever done. He stopped walking. He stood on the road and looked at it for a while, and even a man who has never seen one in his life knows, because there is nothing else that does that.",
    "The sadhu woke up.",
    "He was about sixty and he sat up and scratched his head and looked at Anil, and then at where Anil was looking, and then back at Anil, and he did not cover it or move it or put his hand near it.",
    "Anil did not try to pretend he had been looking at something else.",
    "He said: I have nothing. If I had that I would have everything.",
    "Take it, said the sadhu. I found it in the riverbed last week.",
    "And he lay back down and shut his eyes.",
    "Anil stood there a moment longer than he needed to, because part of him was waiting for the rest of the transaction, and there was not any rest of it. So he picked it up. It was heavier than it looked. He put it in the fold of his cloth, and then took it out and put it in his fist instead, and walked back to town holding it.",
    "That was the eleventh hour of the first day.",
    "By the evening he had the whole of the rest of his life laid out, and it was a good life. He was going to buy land. He had known which land since he was nineteen, four fields on the east side where the water came, and he could name the man who owned them.",
    "He did not sleep that night.",
    "He had not made a plan for where to put it. That turned out to be the thing. He had a room with a mat and a shelf and a door that did not lock, and he lay on the mat with the stone in his hand and was extremely aware of his own door, and at some point he got up and moved it, and then at some point after that he moved it again.",
    "In the morning he did not go to the market, which he had done every morning for nineteen years.",
    "He stayed in the room. He told himself it was because he no longer needed to go, and that was true, and it was not the reason. The reason was that he could not work out whether to take the stone with him or leave it, and both of those were unbearable, and staying was the only thing that was not a decision.",
    "On the second day a neighbour called through the door to ask if he was ill, and Anil heard himself say yes, and afterwards lay there and thought about the fact that he had just lied to Rao, who had helped him when his mother died.",
    "On the second night he worked out what he had.",
    "He had a thing worth four fields. He also had, and this had arrived with it and he had not been told about it, a door that did not lock, and a neighbour he had lied to, and a street he could not walk down while carrying it and could not leave it behind to walk down.",
    "He had been rich for two days and he had not spent one minute of it doing anything.",
    "And lying there in the dark he remembered the man under the tree, who had found the most valuable object either of them had ever seen, and had put it down in the dust beside his head, and had gone to sleep next to it.",
    "That was the whole thing. That was what he could not get past.",
    "Not that the sadhu had given it away. Anybody can give a thing away once, grandly, in front of somebody. It was that he had been asleep beside it. In the open. Four miles from anywhere. He had not been guarding it and he had not been thinking about it and he had not been awake.",
    "Anil walked out on the third morning.",
    "It took him two hours and he did not hurry, and the sadhu was still there, sitting up this time, eating something out of a leaf.",
    "Anil crouched down and put the diamond in the dust where it had been.",
    "The sadhu looked at it and then at him and waited.",
    "And Anil said: give me the thing that lets you give this away.",
    "The sadhu finished what he was eating. He was in no hurry at all and it took a while, and Anil stayed crouched on his heels on the side of the road and did not say anything else, and a cart went past behind them.",
    "Then the old man said: sit down, then.",
    "So Anil sat down."
  ] },
{ id:'bridge', stage:'The Road Back', bg:'cobalt', mins:4,
  n:'The Bridge You Burn Behind You', src:'Ours',
  laws:[{n:'Commitment',f:'motion'},{n:'Polarity',f:'time'}],
  rule:'A door left open behind you is a decision you have not finished making.',
  q:'What are you keeping open in case this does not work?',
  teach:'Ours, though the move is older than any of us — commanders have been burning their own boats on landing for as long as there have been boats, and always for the same unsentimental reason. It is put here as a bridge because most people’s version of this is not a fleet, it is a door.',
  body:[
    "There were two of them and they crossed on the same morning.",
    "The gorge was about ninety feet across at the narrow point and a long way down, and the bridge was rope and plank and had been there longer than either of them. On the far side was a country nobody in their village had been to, which was the whole reason for going.",
    "Idris and Nuri had been eleven years getting ready. They had grown up four doors apart. They had argued about it, saved for it, been talked out of it twice and back into it three times, and in the last two years they had stopped telling people about it, which is usually the sign that a thing is actually going to happen.",
    "They went across one at a time because the bridge was not good.",
    "On the far rock they put their packs down and sat in the sun for a while and did not say very much, and then Nuri stood up and walked back out onto the bridge to the middle of it, with his knife.",
    "Idris said: what are you doing.",
    "Nuri did not answer. He got down on one knee and started on the near hand-rope, and it took him a long time because it was old and thick and he was working one-handed with a hundred feet of air under him, and Idris stood on the rock and watched and did not stop him.",
    "When it went it went suddenly. The whole of it dropped away down the gorge wall on the far side with a noise like a sail, and Nuri came back along the last eight feet of what was left and stepped off onto the rock, breathing hard, and put the knife away.",
    "That is a stupid thing to have done, said Idris.",
    "Maybe, said Nuri.",
    "They were not the same after that, and neither of them ever said so.",
    "The country was hard for the first four years. There was work, and it was bad work, and the language was not their language and they made the sort of mistakes that men make who do not know what anybody means. They shared a room for two of those years. Then Nuri went east to where the building was and Idris stayed, and after that they saw each other perhaps twice a year, and then once, and then at weddings.",
    "Here is what Idris did, and he did it about twice a week for forty years, and it never once looked like a decision.",
    "When the work went badly, he thought about the bridge.",
    "Not in words. He never made a plan, and if you had asked him outright whether he was thinking of going back he would have laughed, and he would have meant it. He simply knew, in the ordinary background way you know where the door is in a dark room, that there was a bridge, and that it was four days' walk behind him, and that it was standing.",
    "And every time he knew it, a small amount of weight came off whatever he was standing in.",
    "That is not nothing. It is genuinely not nothing, and it is why this is difficult. Idris had a decent life. He was not miserable and he did not fail. He married a woman from that country and they were fond of each other and he was thought well of on his street.",
    "But he never learned the place the way a man learns somewhere he cannot leave.",
    "He did not make the friend you make when there is nobody else. He did not take the chance in the fourth year that would have cost him everything, because everything was not actually at stake. He kept, for forty years, a small reserve of himself that never went into the ground he was standing on, and nobody ever saw it, including him.",
    "Nuri did the opposite, and not out of virtue.",
    "He did it because on his second night in that country he understood with total clarity that there was nothing behind him, and the fear of that was so bad that he went out the next morning and did the thing he had been putting off, which was to go to the yard where nobody spoke his language and stand there until somebody gave him work.",
    "He was frightened like that for about two years and then he was not any more, and by then he had the language and a trade and two men who would lend him money.",
    "They met when they were both about sixty, at the wedding of Nuri's daughter.",
    "They sat outside for a while afterwards and it was the first proper conversation they had had in twenty years, and somewhere in it Idris said, not as an accusation, more as an old joke: I still say that was a stupid thing you did on that bridge.",
    "And Nuri, who had had thirty-eight years to think about it and had thought about it, said: it was. If that country had been a swamp I would have died in it.",
    "Idris waited.",
    "It was not a swamp though, said Nuri.",
    "They left it there, because they were sixty and it was a wedding.",
    "Idris went back once, at seventy-one, because his sister was ill. He went the long way round, four days south to the low crossing and then up, because there was no bridge. On the way home he made a detour of most of a day to stand on the far lip of the gorge and look at the two rope-ends hanging down the rock, which were still there, grey and frayed, and shorter than he remembered.",
    "He stood there a while.",
    "Then he walked back to the road, because it was getting late, and there was nothing there to see."
  ] },
{ id:'mountain', stage:'The Return', bg:'turtle', mins:5,
  n:'The Old Man Who Moved the Mountains', src:'Chinese · Liezi',
  laws:[{n:'Perpetual Transmutation',f:'motion'},{n:'Rhythm',f:'time'},{n:'Legacy',f:'time'}],
  rule:'The work outlives the worker, which is the only reason it is worth starting.',
  q:'What are you refusing to begin because you will not see it finished?',
  teach:'From the Liezi, third or fourth century BC. It is the last story in this arc because it is the only one whose whole argument is about what happens after the person telling it is dead — which is the only honest place a journey about showing up can end.',
  body:[
    "There were two mountains in front of the village and they were the reason everything about that village was the way it was.",
    "Taihang and Wangwu. They stood directly between the houses and the south, and they were seven hundred li around and high enough that nobody had ever been over the top of them. Every journey anybody made went round, and going round added eleven days, and eleven days is the difference between selling your grain and eating it.",
    "It had always been so. That is what people said, and they said it in the tone of voice that means the subject is closed.",
    "The Old Man of the North was ninety when he called the family together.",
    "There were eight of them in the room. He said that he had been thinking about it, and that they should take the mountains away.",
    "His wife asked, reasonably, where he proposed to put them.",
    "The sea, he said.",
    "They discussed it for most of an evening. It was not a short conversation and nobody in it was stupid. His second son pointed out that the sea was a long way off, and the old man agreed that it was. His daughter-in-law said that he was ninety, and he agreed with that too. Somebody worked out roughly how much earth was involved and then stopped working it out.",
    "What nobody quite said, and what was in the room the whole time, was that the old man was going to do it whether or not anybody came.",
    "They started in the spring with baskets and hoes.",
    "The work was this: you dug at the foot of the nearer mountain and filled a basket, and you carried the basket to a cart, and when the cart was full somebody took it to the sea. The sea was far enough that a man could make the journey there and back about once in a season. That was the whole operation. Three generations of it in the room and one cart.",
    "They did it through the spring and into the summer, and the hole at the bottom of Taihang after the first year was about the size of a threshing floor, which against seven hundred li is nothing at all, and everybody involved knew that.",
    "In the second year a man came up from the river bend to watch.",
    "He was called the Wise Old Man, partly as a compliment and partly not, and he stood at the edge of the workings for a while with his hands in his sleeves and then said what he had come to say.",
    "You are extremely old, he said. What strength have you got left? You will not shift a hair of that hill before you die.",
    "The old man straightened up with a basket in his hands.",
    "And everything the Wise Old Man had said was true. That is worth being clear about. He was not sneering and he had not got his facts wrong. The old man would be dead long before any visible difference appeared in either mountain, he did not have the strength, and the hills were exactly as large as they looked. He had done the arithmetic and the arithmetic was correct.",
    "When I die, said the old man, my sons will go on. And when they die there will be their sons, and their sons' sons, and so on without end.",
    "He put the basket in the cart.",
    "The mountain does not get any bigger, he said.",
    "The Wise Old Man stood there for a while and then went back down to the river bend, and he did not have anything to say to that, then or afterwards, and he told the story against himself for the rest of his life.",
    "They dug for eleven more years.",
    "The old man died in the ninth of them, in the winter, and they buried him and in the spring his sons went back out with the baskets. His eldest son died six years after that. There is a version of this story where somebody gives a speech at one of those funerals and that is not what happened; what happened is that the digging stopped for the mourning and then started again, which is a harder thing and is the reason anybody remembers this at all.",
    "The grandsons were better at it. They built a second cart and worked out a way of getting the earth down the slope that halved the carrying, and by the fourteenth year the hole at the bottom of Taihang was a quarter of a li across and you could see it from the village.",
    "The spirits who held the mountains had been watching this from the beginning without much interest.",
    "What changed their minds was not the hole. The hole was still nothing. What changed their minds was that they had by then been watching for fourteen years and had understood the shape of the thing, which was that these people were not going to stop, and that there existed no future in which this ended with the mountains where they were.",
    "They reported it to the Emperor of Heaven, and he heard the whole account, and he was moved by it, and he sent two of his strongest sons to carry Taihang and Wangwu away.",
    "They put one to the east and one to the south.",
    "After that there was no high ground at all between that village and the road, and it is eleven days nearer to everything than it used to be, and a man from there can go south in the morning and be somewhere by the evening.",
    "The old man had been dead five years.",
    "His grandson, who was the one who worked out the business with the slope, was fifty-one when the mountains went, and he lived another twenty-six years, and he is the one who told it. He always told it the same way and he always put in the part about the funerals. And when people asked him — and they did ask him, for years — whether his grandfather had known it would happen, he said no. He said the old man had not known anything of the sort, and had not needed to, and that the only thing he had ever actually said about it was that the mountain does not get any bigger."
  ] }
];

/* The index is drawn on every card. A finite path that ends is the
   app's whole claim, and nothing else on the Arc said so. */
S.forEach(function (x, i) { x.no = ('0' + (i + 1)).slice(-2); });

var $ = function (s) { return document.querySelector(s); };
var el = function (t, c, x) { var n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; };
var byId = function (i) { for (var k = 0; k < S.length; k++) { if (S[k].id === i) return S[k]; } return null; };

var st = { read: [], last: null };
try { var raw = localStorage.getItem(KEY); if (raw) { var o = JSON.parse(raw); if (o && typeof o === 'object') {
  st.read = Array.isArray(o.read) ? o.read.filter(function (x) { return typeof x === 'string'; }) : [];
  st.last = typeof o.last === 'string' ? o.last : null;
} } } catch (e) {}
var save = function () { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };

/* The photograph behind everything. Set once per view rather than per
   paint, so scrolling a story never touches it. */
var bgNow = '';
function bg(name) {
  if (name === bgNow) return;
  bgNow = name;
  photo($('#alBgI'), name);
}

/* Each law in one line. A tag that opens nothing is a tag that reads
   as a category somebody forgot to wire up, and the whole point of
   naming the laws is that a story carries several and you can follow
   any of them sideways into the others that carry it. */
var LAWS = {
  'Correspondence': 'What is outside matches what is inside, and neither one is the cause of the other. The dream and the house are the same house.',
  'Inspired Action': 'A thing you have understood and not acted on has not been understood. The walking is not the delivery of the insight, it is the rest of it.',
  'Relativity': 'Nothing has a size of its own. It has a size against whatever you happen to be standing next to, and you choose what you stand next to far more often than you notice.',
  'The Stranger\u2019s Mouth': 'The answer arrives from somebody who does not know they are giving it, is not trying to help, and is often laughing at you while they do it.',
  'Cause and Effect': 'Every result is downstream of something, including the results you are calling luck. The question is never whether there was a cause, only whether you were looking at it.',
  'Attention': 'What you look at is not decided by what matters. It is decided by what is easy to look at, unless you intervene.',
  'Mentalism': 'You do not meet the world. You meet your account of it, continuously, and the account is made of what you already decided.',
  'Receptivity': 'Nothing new enters a full container. Being taught is a thing you have to make room for, and the room is made by putting something down.',
  'Rhythm': 'Everything swings. The high does not keep going up and the low is not the new floor, and both of them feel permanent from the inside.',
  'Polarity': 'Two opposite things are one thing measured at different points. Hot and cold are a single quantity, and so are your best day and your worst.',
  'Judgement': 'A verdict delivered early does not describe the event. It decides what you do next, which is how it makes itself true.',
  'Compensation': 'Everything is paid for. Not morally and not always fairly, but it comes out of an account somewhere, and the only variable is whether you knew the price.',
  'Sacrifice': 'A threshold charges you the thing that only made sense on the side you are leaving. That is not cruelty, it is the definition of a threshold.',
  'Envy': 'Every position has something visible above it that was not visible from below. A man who moves because of what he can see will move for ever.',
  'Vibration': 'Nothing is still. What looks like a state is a rate, and you are always either raising it or lowering it, never holding it.',
  'Power': 'What people do is explained by what they can afford to do, far more often than by what they believe.',
  'Attachment': 'The event has a duration. The carrying is a second thing, which you are doing, and it runs at full strength for as long as you keep feeding it.',
  'Strategy': 'Most impossible problems are ordinary problems with a rule attached that nobody put there on purpose and nobody has checked.',
  'Decision': 'A decision is not made when you know the answer. It is made when you close the other doors, and everything before that is research.',
  'Sufficiency': 'Having a thing and knowing you have it are two separate acquisitions, and people routinely complete the first and never start the second.',
  'Commitment': 'A way back does not get used. It drains a little pressure out of every hard thing instead, continuously, and the pressure was what was going to make you finish.',
  'Perpetual Transmutation': 'Nothing holds its form. What you are working on is already becoming something else, and so is what is standing in your way.',
  'Legacy': 'The work outlives the worker, which is the only reason a thing bigger than a life is worth beginning at all.'
};

var IB = { desert:1.20, umber:2.00, iris:2.20, turtle:1.25, canyon:1.00,
           delta:1.00, silk:0.95, curve:0.90, iceberg:0.85, nightfall:1.60,
           abyss:1.70, cobalt:1.10 };

/* violet.jpg cannot be graded into this set: its brightest pixel in a
   phone crop is L102, darker than the references' own median, with 40%
   of the frame under L8. Lifting it leaves three quarters black behind
   a lilac flare. nightfall and abyss are the same shape of problem and
   survive only as cards, where the veil covers the lower two thirds. */
function photo(node, name) {
  node.style.backgroundImage = 'url("../arc/bg/' + name + '.jpg")';
  node.style.setProperty('--ib', IB[name] || 1);
}

var MARK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 2v20M5 8l7-6 7 6M5 16l7 6 7-6"/></svg>';

var ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>';

function cardOf(s) {
  var b = el('button', 'al-card' + (st.read.indexOf(s.id) >= 0 ? ' is-read' : ''));
  b.setAttribute('data-id', s.id);
  b.setAttribute('aria-label', s.n + '. ' + s.src + '. ' + s.mins + ' minutes.');
  var h = el('div', 'al-ch');
  h.appendChild(el('span', 'al-sq', s.no));
  var g = el('span', 'al-go'); g.innerHTML = ARROW; h.appendChild(g);
  b.appendChild(h);

  /* THE STAGE IS NOT SAID TWICE. It was a chip on the card ten pixels
     under a group heading printing the same words, in two tracked-caps
     registers half a pixel and a tenth of an em apart — one label said
     twice in what reads as one voice. */
  var w = el('div', 'al-ct');
  w.appendChild(el('div', 'al-disp-s', s.n));
  w.appendChild(el('div', 'al-note', s.src + '  ·  ' + s.mins + ' min'));
  b.appendChild(w);

  var ph = el('div', 'al-ph');
  var i = el('i'); photo(i, s.bg);
  ph.appendChild(i); b.appendChild(ph);
  return b;
}

function mask(p) {
  var f = function () {
    p.classList.toggle('is-end', p.scrollTop + p.clientHeight >= p.scrollHeight - 2);
  };
  if (!p.alMask) { p.alMask = f; p.addEventListener('scroll', f, { passive: true }); }
  p.alMask();
}

function paintArc() {
  var p = $('#alArcPane'); p.textContent = '';
  for (var i = 0; i < STAGES.length; i++) {
    var here = S.filter(function (s) { return s.stage === STAGES[i]; });
    if (!here.length) continue;
    p.appendChild(el('div', 'al-grp al-caps', STAGES[i]));
    for (var j = 0; j < here.length; j++) p.appendChild(cardOf(here[j]));
  }
  mask(p);
}

function lawRow(x) {
  var b = el('button', 'al-lrow');
  b.setAttribute('data-id', x.id);
  b.appendChild(el('span', 'al-sq', x.no));
  var t = el('span', 'al-lt');
  t.appendChild(el('i', null, x.n));
  t.appendChild(el('span', 'al-caps', x.stage));
  b.appendChild(t);
  var g = el('span', 'al-go'); g.innerHTML = ARROW; b.appendChild(g);
  return b;
}

function paintLaw(name) {
  var p = $('#alLawPane'); p.textContent = '';
  var fam = null;
  S.forEach(function (x) { x.laws.forEach(function (l) { if (l.n === name) fam = l.f; }); });
  var FAM = { inner: 'The inner world', motion: 'Motion', others: 'Other people', time: 'Time' };

  var lead = el('div', 'al-lead is-short');
  lead.appendChild(el('h1', 'al-disp', name));
  lead.appendChild(el('div', 'al-caps', FAM[fam] || ''));
  p.appendChild(lead);

  var sh = el('div', 'al-sheet');
  var d = el('p', 'al-body'); d.textContent = LAWS[name] || '';
  d.style.marginBottom = '26px';
  sh.appendChild(d);

  var carry = S.filter(function (x) {
    return x.laws.some(function (l) { return l.n === name; });
  });
  var h = el('div', 'al-rule-hd');
  h.appendChild(el('span', 'al-caps', carry.length === 1 ? 'One story carries it' : carry.length + ' stories carry it'));
  sh.appendChild(h);
  carry.forEach(function (x) { sh.appendChild(lawRow(x)); });

  p.appendChild(sh);
  p.scrollTop = 0; mask(p);
}

function paintLaws() {
  var p = $('#alLawsPane'); p.textContent = '';
  var seen = {}, fams = { inner: 'The inner world', motion: 'Motion', others: 'Other people', time: 'Time' };
  for (var f in fams) {
    var rows = [];
    S.forEach(function (s) { s.laws.forEach(function (l) {
      if (l.f === f && !seen[l.n]) { seen[l.n] = 1; rows.push(l); } }); });
    if (!rows.length) continue;
    p.appendChild(el('div', 'al-grp al-caps', fams[f]));
    var w = el('div', 'al-tags');
    rows.forEach(function (l) {
      var t = el('button', 'al-tag', l.n);
      t.setAttribute('data-f', l.f); t.setAttribute('data-law', l.n);
      w.appendChild(t);
    });
    p.appendChild(w);
  }
  mask(p);
}

function paintRules() {
  var p = $('#alRulesPane'); p.textContent = '';
  S.forEach(function (s) {
    var d = el('div', 'al-rule');
    d.appendChild(el('div', 'al-caps', s.stage));
    d.appendChild(el('b', null, s.rule));
    p.appendChild(d);
  });
  mask(p);
}

function paintStory(s) {
  var p = $('#alStoryPane'); p.textContent = '';
  bg(s.bg);

  var lead = el('div', 'al-lead');
  var mk = el('div', 'al-mark'); mk.innerHTML = MARK; lead.appendChild(mk);
  lead.appendChild(el('h1', 'al-disp', s.n));
  lead.appendChild(el('div', 'al-caps', s.stage));
  lead.appendChild(el('div', 'al-note', s.src + '  ·  ' + s.mins + ' min'));
  p.appendChild(lead);

  /* Everything past the lead sits on its own ground, and the ground is
     a CHILD of the scroll rather than the fixed photograph behind it. */
  var sh = el('div', 'al-sheet');

  var t = el('div', 'al-txt al-body');
  (s.body || []).forEach(function (x) { t.appendChild(el('p', null, x)); });
  sh.appendChild(t);

  var h = el('div', 'al-rule-hd'); h.appendChild(el('span', 'al-caps', 'What it teaches'));
  sh.appendChild(h);

  var tg = el('div', 'al-tags');
  s.laws.forEach(function (l) {
    var x = el('button', 'al-tag', l.n);
    x.setAttribute('data-f', l.f); x.setAttribute('data-law', l.n);
    tg.appendChild(x);
  });
  sh.appendChild(tg);

  if (s.teach) { var tb = el('p', 'al-body'); tb.textContent = s.teach; tb.style.marginBottom = '22px'; sh.appendChild(tb); }

  var r = el('div', 'al-rule');
  r.appendChild(el('div', 'al-caps', 'The rule'));
  r.appendChild(el('b', null, s.rule));
  sh.appendChild(r);

  var q = el('div', 'al-q');
  q.appendChild(el('div', 'al-caps', 'The question'));
  q.appendChild(el('b', null, s.q));
  sh.appendChild(q);

  var nx = null, at = S.indexOf(s);
  for (var k = at + 1; k < S.length; k++) { if (S[k].body) { nx = S[k]; break; } }
  var acts = el('div', 'al-acts');
  var a1 = el('button', 'al-pill is-grow', nx ? 'The next story' : 'Back to the Arc');
  a1.setAttribute('data-go', nx ? nx.id : 'arc');
  acts.appendChild(a1);
  if (nx) { var a2 = el('button', 'al-pill is-glass', 'The Arc'); a2.setAttribute('data-go', 'arc'); acts.appendChild(a2); }
  sh.appendChild(acts);

  p.appendChild(sh);
  p.scrollTop = 0; mask(p);
}

var VIEWS = ['open', 'arc', 'laws', 'rules', 'story', 'law'];
function view(v) {
  if (VIEWS.indexOf(v) < 0) v = 'arc';
  document.documentElement.setAttribute('data-view', v);
  VIEWS.forEach(function (x) {
    var n = $('#al' + x.charAt(0).toUpperCase() + x.slice(1));
    if (n) n.classList.toggle('is-on', x === v);
  });
  $('#alFoot').hidden = (v === 'open' || v === 'story' || v === 'law');
  $('#alStoryX').hidden = (v !== 'story');
  $('#alLawX').hidden = (v !== 'law');
  document.querySelectorAll('.al-tab').forEach(function (b) {
    b.setAttribute('aria-current', b.getAttribute('data-v') === v ? 'true' : 'false');
  });
  $('#alBg').classList.toggle('is-sage', v === 'arc' || v === 'laws' || v === 'rules');
  document.querySelectorAll('.al-count').forEach(function (n) {
    n.textContent = st.read.length + ' of ' + S.length;
  });
  if (v === 'arc') { bg('curve'); paintArc(); }
  if (v === 'laws') { bg('silk'); paintLaws(); }
  if (v === 'law') { $('#alBg').classList.remove('is-sage'); }
  if (v === 'rules') { bg('umber'); paintRules(); }
}

var lawBack = 'laws';
function openLaw(name) {
  if (!LAWS[name]) return;
  var now = document.documentElement.getAttribute('data-view');
  if (now === 'story' || now === 'laws' || now === 'arc') lawBack = now === 'story' ? 'story' : now;
  paintLaw(name);
  view('law');
}

function open(id) {
  var s = byId(id);
  if (!s || !s.body) return;
  st.last = id;
  if (st.read.indexOf(id) < 0) st.read.push(id);
  save();
  paintStory(s);
  view('story');
}

document.addEventListener('click', function (e) {
  var t = e.target.closest ? e.target.closest('.al-tab, .al-card, .al-pill, .al-tag, .al-lrow, #alOpenB, #alStoryX, #alLawX') : null;
  if (!t) return;
  if (t.id === 'alOpenB') { var r = st.last && byId(st.last); return r && r.body ? open(r.id) : view('arc'); }
  var go = t.getAttribute && t.getAttribute('data-go');
  if (go) return go === 'arc' ? view('arc') : open(go);
  if (t.id === 'alStoryX') return view('arc');
  if (t.id === 'alLawX') return lawBack === 'story' ? view('story') : view(lawBack);
  var law = t.getAttribute && t.getAttribute('data-law');
  if (law) return openLaw(law);
  if (t.classList.contains('al-lrow')) return open(t.getAttribute('data-id'));
  if (t.classList.contains('al-tab')) return view(t.getAttribute('data-v'));
  if (t.classList.contains('al-card')) return open(t.getAttribute('data-id'));
});

var resume = st.last && byId(st.last);
if (resume) { $('#alOpenB').textContent = 'Continue'; $('#alOpenN').textContent = 'You stopped at ' + resume.n + '.'; }
bg('desert');
view('open');
window.alDrive = { view: view, open: open };

}());
</script>
