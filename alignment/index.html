<!doctype html>
<html lang="en" data-view="open">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0A08">
<title>Alignment</title>
<link rel="preload" href="../arc/fonts/Inter.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: 'Inter'; font-weight: 100 900; font-display: swap;
  src: url('../arc/fonts/Inter.woff2') format('woff2'); }

/*
  ALIGNMENT. Its own ground, its own type, its own everything — it reads
  none of the other keys and takes none of the shared shell.

  A PHOTOGRAPH IS A GUEST INSIDE A FRAME, NEVER THE PAGE. That is the
  whole construction and the first build got it backwards: the image
  filled the card, the card's own ground was never visible anywhere on
  screen, and every word was printed on a picture under a gradient laid
  there to keep it readable. A photograph that bleeds is a page. A
  photograph in a frame is an object. Interface lives in the MATERIAL
  around the picture, which is also where the room for chrome comes
  from.

  THE GRADE IS PER IMAGE, MEASURED, AND THE COMMENT THAT USED TO SIT
  HERE WAS FALSE. It claimed one filter pulled fourteen photographs
  into one warm family; measured, the set spanned 235 degrees of hue
  with five of twelve inside the band. Six reference screens holding a
  snow mountain, a face, a desert, a cyan swimming pool and a volcano
  all land inside hue 16-69, which no single transfer function does to
  a mixed library. So --ib rides each image and the shared grade only
  has to carry the hue.
*/

:root {
  --paper: #0B0A08;
  --ink: #FFFFFF;
  --dim: rgba(255,255,255,.72);
  --spent: rgba(255,255,255,.46);
  --hair: rgba(255,255,255,.14);
  --glass: rgba(255,255,255,.10);

  /* Chrome sits on a PLATE, not on glass. A 10% white wash over a lit
     photograph put the info glyph at 2.50:1 against the 3 a graphic
     needs, and no alpha of white fixes a ground that bright. */
  --plate: rgba(11,10,8,.56);

  --card: #1A1611;
  --card-edge: rgba(255,255,255,.08);

  --r-card: 26px;
  --r-in: 18px;
  --r-sq: 14px;
  --r-pill: 999px;

  /* Six vertical steps. The first build shipped eleven — 8 10 12 14 18
     20 22 24 26 34 38 — which is this repo's own runaway-scale fault in
     a third dimension after thirty type sizes and thirteen leadings. */
  --v1: 6px;  --v2: 10px; --v3: 16px;
  --v4: 22px; --v5: 34px; --v6: 52px;

  --gut: 22px;
  --gut-list: 18px;
  --tap: 44px;

  --grade: saturate(.30) sepia(.55) contrast(1.02) brightness(1.20);

}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body { height: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: 'Inter', -apple-system, system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  overflow: hidden;
  overscroll-behavior: none;
}

button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
[hidden] { display: none !important; }

.al-disp   { font-size: 38px; font-weight: 450; line-height: 1.00; letter-spacing: -.03em; }
.al-disp-s { font-size: 28px; font-weight: 450; line-height: 1.02; letter-spacing: -.024em; }
.al-caps   { font-size: 10px; font-weight: 600; letter-spacing: .5em; text-transform: uppercase; color: var(--dim); }
.al-body   { font-size: 16px; font-weight: 400; line-height: 1.50; color: var(--dim); }
.al-note   { font-size: 13px; font-weight: 450; line-height: 1.45; color: var(--dim); }

/* A picture in a frame, never a ground under words. */
.al-hero { position: relative; height: 188px; border-radius: var(--r-card); overflow: hidden; background: #0E0C0A; margin-bottom: var(--v4); }
.al-hero i { position: absolute; inset: 0; display: block; background-size: cover; background-position: center; filter: var(--grade) brightness(var(--ib, 1)); }

.al-view { position: relative; z-index: 1; height: 100%; display: none; flex-direction: column; }
.al-view.is-on { display: flex; }

#alOpen { justify-content: flex-end; padding: 0 var(--gut-list) var(--v5); }
#alOpen .al-hero { flex: 1; height: auto; margin: calc(var(--v4) + env(safe-area-inset-top, 0px)) 0 var(--v5); }
#alOpen .al-mark { margin-bottom: var(--v3); }
.al-mark { display: flex; align-items: center; gap: 9px; }
.al-mark svg { width: 20px; height: 20px; display: block; }
.al-mark b { font-size: 13px; font-weight: 500; letter-spacing: 1.2em; text-transform: uppercase; }
#alOpen .al-disp { margin-bottom: var(--v2); max-width: 7.2em; }
#alOpen .al-note { margin-bottom: var(--v4); max-width: 20em; }

/* A PILL IS SIZED TO ITS CONTENT. Not one of the four reference pills
   spans the screen — they measure 217, 148, 187 and 134 CSS px, all
   43 to 50 tall. A full-bleed primary was the widest object on the
   open screen and read as a form submit. */
.al-pill {
  display: inline-flex; align-items: center; justify-content: center;
  align-self: flex-start;
  min-height: 48px; padding: 0 30px; border-radius: var(--r-pill);
  background: var(--ink); color: #14120E;
  font-size: 16px; font-weight: 500; letter-spacing: -.01em;
}
.al-pill.is-glass {
  background: var(--plate); color: var(--ink);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  border: 1px solid var(--hair);
}
.al-pill.is-grow { flex: 1; }

.al-head { padding: calc(var(--v4) + env(safe-area-inset-top, 0px)) var(--gut-list) var(--v3); display: flex; align-items: center; gap: 12px; flex: none; }
.al-head .al-disp-s { flex: 1; }
.al-head .al-caps { flex: none; }

/* 44 OWNED, 40 DRAWN — and an inset cannot say that here. An
   absolutely positioned box resolves against its host's PADDING box,
   and .al-round carries a 1px border under a border-box reset, so its
   padding box is 38 and inset:-2px reached 42 rather than the 44 the
   declaration reads as. Two real controls sat under the floor and the
   arithmetic was invisible in the source. Centring an explicit --tap
   square is immune to the host's border, padding and drawn size alike,
   and it is what makes the token load-bearing rather than decorative. */
.al-round {
  width: 40px; height: 40px; flex: none; border-radius: var(--r-pill);
  background: var(--plate); border: 1px solid var(--hair);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  display: grid; place-items: center; position: relative;
}
.al-round::before {
  content: ''; position: absolute; top: 50%; left: 50%;
  width: var(--tap); height: var(--tap); transform: translate(-50%, -50%);
}
.al-round svg { width: 17px; height: 17px; display: block; }

.al-pane { flex: 1; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  padding: 0 var(--gut-list) calc(118px + env(safe-area-inset-bottom, 0px)); }
.al-pane::-webkit-scrollbar { display: none; }

/* A MASK, NEVER A GRADIENT LAID OVER THE CONTENT. The ground here is a
   photograph, so a --paper overlay is a near-match that reads as a
   smudge somewhere on the set. Off again at the end of the travel: a
   soft edge over nothing is the same lie in the other direction. */
.al-pane { -webkit-mask-image: linear-gradient(180deg, #000 calc(100% - 86px), transparent 100%);
                   mask-image: linear-gradient(180deg, #000 calc(100% - 86px), transparent 100%); }
.al-pane.is-end { -webkit-mask-image: none; mask-image: none; }

/* ---- THE ARC ---- */
.al-card {
  position: relative; display: block; width: 100%; text-align: left;
  border-radius: var(--r-card); overflow: hidden;
  background: var(--card); padding: var(--v3);
  margin-bottom: var(--v3);
  box-shadow: inset 0 1px 0 var(--card-edge), 0 18px 34px -18px rgba(0,0,0,.92);
}
.al-ch { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--v3); }
.al-ct { margin-bottom: var(--v3); }
.al-ct .al-caps { margin-top: var(--v1); color: var(--spent); }

.al-sq {
  width: 38px; height: 38px; flex: none; border-radius: var(--r-sq);
  background: var(--glass); border: 1px solid var(--hair);
  display: grid; place-items: center;
}
.al-sq { font-size: 13px; font-weight: 500; letter-spacing: .06em; color: var(--dim); }

.al-go {
  width: 38px; height: 38px; flex: none; border-radius: var(--r-pill);
  background: rgba(255,255,255,.92); color: #14120E;
  display: grid; place-items: center;
}
.al-go svg { width: 15px; height: 15px; }
.al-card.is-read .al-go { background: var(--plate); color: var(--ink); border: 1px solid var(--hair); }

/* The picture, inset inside the card's own material at its own smaller
   radius. Two rounded rectangles at one radius read as a mistake. */
.al-ph { position: relative; height: 300px; border-radius: var(--r-in); overflow: hidden; background: #0E0C0A; }
.al-ph i {
  position: absolute; inset: 0; display: block;
  background-size: cover; background-position: center;
  filter: var(--grade) brightness(var(--ib, 1));
}

.al-grp { padding: var(--v5) 2px var(--v2); }

/* ---- THE STORY ---- */
#alStoryPane { padding-bottom: var(--v6); }
.al-lead { padding: var(--v4) 0; }
.al-lead.is-short .al-hero { display: none; }
.al-lead .al-mark { margin-bottom: var(--v3); color: var(--dim); }
.al-lead .al-caps { margin-bottom: var(--v2); }
.al-lead .al-disp { max-width: 9em; }

/* Nothing to travel with any more: the ground under the words is the
   page. The whole class of contrast failure that MOVES with the scroll
   went out with the photograph. */
.al-sheet { padding-bottom: var(--v6); }
.al-txt p { margin-bottom: 1.05em; }
.al-txt p:first-child { color: var(--ink); }

.al-rule-hd { margin: var(--v5) 0 var(--v3); display: flex; align-items: center; gap: 12px; }
.al-rule-hd:after { content: ''; flex: 1; height: 1px; background: var(--hair); }

/* A TAG'S FILL AND ITS LABEL PULLED THE SAME WAY. Both were mixed from
   one hue, so they closed on each other from both sides and the worst
   pair measured 1.71:1 — the worst text in the app. The hue lives in
   the label and the rim now; the ground is a plate. */
.al-tags { display: flex; flex-wrap: wrap; gap: 16px 8px; margin-bottom: var(--v4); }
.al-tag {
  position: relative;
  display: inline-flex; align-items: center; height: 30px; padding: 0 12px;
  border-radius: var(--r-sq);
  font-size: 13px; font-weight: 500; letter-spacing: .01em;
  background: rgba(11,10,8,.78);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid color-mix(in srgb, var(--tg) 30%, transparent);
  color: color-mix(in srgb, var(--tg) 66%, var(--ink));
}
.al-tag::before {
  content: ''; position: absolute; left: 0; right: 0; top: 50%;
  height: var(--tap); transform: translateY(-50%);
}
.al-lrow {
  position: relative; display: flex; align-items: center; gap: var(--v3);
  width: 100%; text-align: left; padding: var(--v3) 0;
  border-bottom: 1px solid var(--hair);
}
.al-lrow:last-child { border-bottom: 0; }
.al-lrow .al-sq { background: var(--glass); }
.al-lrow .al-lt { flex: 1; min-width: 0; }
.al-lrow .al-lt i { display: block; font-style: normal; font-size: 19px; font-weight: 450; letter-spacing: -.02em; line-height: 1.2; }

/* THE LESSON, NOT THE LABEL. The foot of a story named its laws as
   four bare words and you had to press each one to be told what that
   law claims in general — never what it did in the story you had just
   read. The row carries the line now, and the row is the control that
   opens the law, so the name is not printed twice to get both. */
.al-les { margin-bottom: var(--v4); }
.al-le {
  display: block; width: 100%; text-align: left;
  padding: var(--v3) 0; border-bottom: 1px solid var(--hair);
}
.al-le:last-child { border-bottom: 0; }
.al-le-n {
  display: inline-flex; align-items: center; height: 30px; padding: 0 12px;
  border-radius: var(--r-sq); margin-bottom: var(--v2);
  font-size: 13px; font-weight: 500; letter-spacing: .01em;
  background: rgba(11,10,8,.78);
  border: 1px solid color-mix(in srgb, var(--tg) 30%, transparent);
  color: color-mix(in srgb, var(--tg) 66%, var(--ink));
}
.al-le-d { display: block; font-size: 15px; line-height: 1.5; color: var(--dim); }
/* WHAT THE IDEA IS, THEN WHERE IT TURNED UP. The first build printed
   only the second, so a theme could be read off the page without ever
   saying what it claimed — a label with an anecdote attached rather
   than something you could carry out of the room. */
.al-le-x {
  display: block; margin-top: var(--v2);
  padding-left: var(--v2); border-left: 2px solid color-mix(in srgb, var(--tg) 46%, transparent);
  font-size: 14px; line-height: 1.5; color: var(--dim);
}

.al-tag[data-f="inner"],  .al-le[data-f="inner"]  { --tg: #C9A227; }
.al-tag[data-f="motion"], .al-le[data-f="motion"] { --tg: #D2603A; }
.al-tag[data-f="others"], .al-le[data-f="others"] { --tg: #7E9AA6; }
.al-tag[data-f="time"],   .al-le[data-f="time"]   { --tg: #8E9370; }

.al-rule {
  border-radius: var(--r-card); padding: var(--v4); margin-bottom: var(--v2);
  background: var(--card); box-shadow: inset 0 1px 0 var(--card-edge);
}
.al-rule .al-caps { margin-bottom: var(--v2); }
.al-rule b { display: block; font-size: 19px; font-weight: 600; line-height: 1.26; letter-spacing: -.016em; }
.al-q { border-radius: var(--r-card); padding: var(--v4); border: 1px solid var(--hair); }
.al-q .al-caps { margin-bottom: var(--v2); }
.al-q b { display: block; font-size: 19px; font-weight: 500; line-height: 1.34; letter-spacing: -.012em; color: var(--dim); }

/* THE STORY ENDED IN 150px OF RESERVED NOTHING. Both references close
   their detail screen on a pair — a primary and a secondary — and the
   only way out of this one was scrolling four thousand pixels back to
   the close button. */
.al-acts { display: flex; gap: var(--v2); margin-top: var(--v4); }

/* ---- THE FOOT ---- */
.al-foot {
  position: fixed; left: 93px; right: 93px; z-index: 30;
  bottom: calc(var(--v4) + env(safe-area-inset-bottom, 0px));
  height: 58px; border-radius: var(--r-pill);
  background: rgba(24,21,17,.62);
  backdrop-filter: blur(26px) saturate(1.5); -webkit-backdrop-filter: blur(26px) saturate(1.5);
  border: 1px solid var(--hair);
  display: grid; grid-auto-flow: column; align-items: center;
  padding: 0 var(--v1);
}
.al-tab { height: 46px; border-radius: var(--r-pill); display: grid; place-items: center; color: var(--dim); }
.al-tab svg { width: 20px; height: 20px; display: block; }
.al-tab[aria-current="true"] { background: rgba(255,255,255,.12); color: var(--ink); }

/* GLASS OVER A PHOTOGRAPH IS A MATERIAL. GLASS OVER A SENTENCE IS A
   SMEAR. This is the one round control that sits over running body
   text, fixed, while the pane scrolls under it — and .al-round's own
   --plate is 56%, which dims a word without removing it. Measured on
   composited pixels, a letter behind the disc survived as a 44-point
   luminance ghost and the screenshot read "you will b✕". At 94% the
   ghost is 6 and the backdrop pass is drawing nothing anybody can
   see, so it stops being glass either way: --card is the app's own
   object material, the ghost is 0, and the disc reads as a thing ON
   the page rather than a hole punched in it. The glyph costs nothing
   — 19.3:1 on the old plate, 19.8 on this one. Both X's take it;
   both sit over a pane of text. It is LATER in the file than
   .al-round and the two are equal specificity, so source order is
   what makes it win — the computed value is read back rather than
   trusted. */
.al-x { position: fixed; top: calc(18px + env(safe-area-inset-top, 0px)); right: var(--gut); z-index: 30;
  background: var(--card); backdrop-filter: none; -webkit-backdrop-filter: none; }
</style>
</head>
<body>

<section class="al-view is-on" id="alOpen">
  <div class="al-hero"><i id="alOpenHero"></i></div>
  <div class="al-mark" role="img" aria-label="Alignment">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 2v20M5 8l7-6 7 6M5 16l7 6 7-6"/></svg>
  </div>
  <h1 class="al-disp" id="alOpenT">Twelve stories and one shape.</h1>
  <p class="al-note" id="alOpenN">The oldest stories we have are all the same story. Read one, and find out which part of it you are standing in.</p>
  <button class="al-pill" id="alOpenB">Begin</button>
</section>

<section class="al-view" id="alArc">
  <div class="al-head">
    <h1 class="al-disp-s">The Arc</h1>
    <span class="al-caps al-count"></span>
  </div>
  <div class="al-pane" id="alArcPane"></div>
</section>

<section class="al-view" id="alLaws">
  <div class="al-head"><h1 class="al-disp-s">The Themes</h1><span class="al-caps al-count"></span></div>
  <div class="al-pane" id="alLawsPane"></div>
</section>

<section class="al-view" id="alRules">
  <div class="al-head"><h1 class="al-disp-s">The Rules</h1><span class="al-caps al-count"></span></div>
  <div class="al-pane" id="alRulesPane"></div>
</section>

<section class="al-view" id="alLaw">
  <button class="al-round al-x" id="alLawX" aria-label="Close">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
  <div class="al-pane" id="alLawPane"></div>
</section>

<section class="al-view" id="alStory">
  <button class="al-round al-x" id="alStoryX" aria-label="Close the story">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
  <div class="al-pane" id="alStoryPane"></div>
</section>

<nav class="al-foot" id="alFoot">
  <button class="al-tab" data-v="arc" aria-current="true" aria-label="The Arc">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 18c4-10 14-10 18 0"/><circle cx="3" cy="18" r="1.6" fill="currentColor" stroke="none"/><circle cx="21" cy="18" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="10.6" r="2.1"/></svg>
  </button>
  <button class="al-tab" data-v="laws" aria-label="The Themes">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 4v16M5 8h14M7.5 8 5 15h5zM16.5 8 14 15h5z"/></svg>
  </button>
  <button class="al-tab" data-v="rules" aria-label="The Rules">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5 5h14v14H5zM9 10h6M9 14h4"/></svg>
  </button>
</nav>

<script>
(function () {
'use strict';

/*
  ONE WRAPPER. Nothing escapes it. The other apps in this repo learned
  that the hard way — a top-level name here does not throw when it
  collides, it replaces, and the symptom turns up screens away.
*/

var KEY = 'align.v1';

/* The stages are the path. Stories are filed at the one they belong to,
   so a stage with nothing at it simply has nothing at it. */
var STAGES = ['The Call', 'The Refusal', 'The Mentor', 'The Threshold',
              'The Trials', 'The Ordeal', 'The Reward', 'The Road Back', 'The Return'];

var S = [
{
  id: 'stove', stage: 'The Call', bg: 'desert', mins:2,
  n:'The Long Way Round',
  src:'Ours',
  laws: [
    { n: 'The Answer You Are Carrying', f: 'inner', d: 'The answer was in his own notebook, eleven times, in his own handwriting.' },
    { n: 'The Walk', f: 'motion', d: 'He had been told it for years. It became true the week he spent everything getting to it.' },
    { n: 'The Stranger’s Mouth', f: 'others', d: 'It came from a man who was not trying to help him and would not remember saying it.' }
  ],
  teach: 'Coelho built The Alchemist out of this. Santiago, the sheep, the pyramids, the treasure back under the tree he started from — all of it is here, seven hundred years earlier, in about a page. Knowing that is useful, because it tells you the shape is older and more reliable than any one telling of it.',
  rule: 'You cannot be told. You can only be sent.',
  q: 'What are you standing on, refusing to dig, because it is too close to be treasure?',
  body:[
    "He saved for two years to get into the room.",
    "It was not cheap and it was not a scam either, which made it harder afterwards. A real man with a real record, a small group, four days, in a city he had never been to. He borrowed the last part of it and told nobody at work where he was going.",
    "He had wanted this a long time. He kept a page at the back of a notebook with the questions he would ask if he ever got in the room, and by the time he got there the page was full.",
    "The four days were good. He is careful about that when he tells it. The man was generous and said true things and sold nothing from the stage.",
    "On the last afternoon he got his turn.",
    "He laid it all out, fast, because others were waiting. The flat account. The system built and rebuilt. Everything he had tried.",
    "The man listened, and thought for a moment, and said: you are trading too big and too often, and I think you already know that.",
    "That was the whole answer.",
    "He flew home the next morning. Somewhere over the water he got the notebook out to write it down before he lost it, turned to a clean page, and had to go back a few pages to find one.",
    "It was already in there.",
    "Not once. Eleven times, over two years, in his own handwriting, in eleven different moods. Too big. Too often. Size is the problem. Stop taking the second one. One of them underlined twice.",
    "His old boss had said it to him in a car park. His brother, who knows nothing about any of it, had said a version of it at Christmas and been told he did not understand.",
    "He sat with the notebook open and what he felt was not embarrassment.",
    "It was that he could hear it now.",
    "He had read those words eleven times and they had been information. A man three thousand miles away had said them once and they had gone somewhere further in, and the only difference between the eleven times and the once was everything it had cost to be sitting in that chair.",
    "He does not think the trip was wasted. He does not think it was necessary either, in the way people mean that word. He thinks he could have had it for free, and did, and that the telling was never the problem.",
    "He trades smaller now. One a day, and he takes the first one.",
    "Somebody asked him what the course was like and he said it was good and left it there, because the only honest version is that he paid a great deal of money to hear something he had written down himself, and that it worked."
  ]
},
{ id:'lamp', stage:'The Call', bg:'umber', mins:2,
  n:'Where the Light Is', src:'Ours',
  laws: [
    { n: 'The Lit Ground', f: 'inner', d: 'Learning to code has a screen that tells you it worked. Sitting still after a loss has nothing at all.' },
    { n: 'The Walk', f: 'motion', d: 'He could have named the problem at three in the morning for a year and a half.' },
    { n: 'The Quiet Middle', f: 'time', d: 'What fixed it was four minutes of doing nothing, then four minutes again, and nobody watched.' }
  ],
  rule:'Comfort decides where you search long before honesty decides what you find.',
  q:'Which problem are you working on because it is the one you know how to work on?',
  teach:'A man on his knees under a street lamp, looking for a key he dropped indoors. The joke is four hundred years old and it is not a joke.',
  body:[
    "He rebuilt the spreadsheet four times.",
    "It was a good spreadsheet by the end. It pulled the numbers in by itself. It broke everything down by session and by setup and by day of the week and drew him a curve that updated on its own, and it had taken him most of a winter.",
    "He was proud of it. He showed it to two people.",
    "What was actually wrong with his trading was that he could not sit still after a loss. He knew this. If you had woken him at three in the morning and asked what his biggest problem was he would have said it without pausing, because he had known for about a year and a half.",
    "He had never done one thing about it.",
    "Here is what he did instead. He learned to code. He backtested eleven versions of his entry. He read four books, two of them twice. He changed brokers. He rebuilt the spreadsheet four times.",
    "All of that is real and none of it is nothing. He was a considerably more capable person in the spring than he had been in the autumn.",
    "And the losses were the same size and came the same way, which was always the trade straight after a bad one, always within about ten minutes, always bigger than it should have been.",
    "The reason is not complicated and almost everybody does it.",
    "Learning to code has a light on it. You can see yourself getting better. There is a screen that tells you it worked. You can mention it at the weekend and people will nod, and the nodding is genuine, because from outside sixty hours of building a tool looks exactly like sixty hours of fixing your problem.",
    "Sitting still after a loss has no light on it at all.",
    "There is nothing to learn. There is no screen. There is no course and nothing to buy and nobody to tell. The entire task is to do nothing for twenty minutes while your chest is going, and then do it again the next time, and there is no way to get better at it except by being in it and hating it.",
    "So he built the spreadsheet a fifth time.",
    "He got out of it eventually and there was no insight involved. He simply ran out of things to go and optimise, and found himself sitting in front of a screen after a loss with nowhere to put his hands.",
    "He lasted four minutes the first time.",
    "That is the whole of it, and it is not a good story, because the thing that worked was boring and slow and nobody watched him do it.",
    "The spreadsheet is still there. It is still very good. He just stopped calling it the work."
  ] },
{ id:'cup', stage:'The Refusal', bg:'curve', mins:2,
  n:'The Man Who Kept Explaining', src:'Ours',
  laws: [
    { n: 'The Full Cup', f: 'inner', d: 'He had prepared a page of notes about what the problem was, and brought them to a man he was asking what the problem was.' },
    { n: 'The Cost of Being Right', f: 'inner', d: 'Letting it be the problem meant the last two years had been aimed at the wrong thing.' },
    { n: 'The Stranger’s Mouth', f: 'others', d: 'Nine words, in the first two minutes, for nothing — and he argued with them twice and drove home.' }
  ],
  rule:'You are not being refused the answer. You are full.',
  q:'What would you have to stop being right about?',
  teach:'A scholar goes to a master to ask about Zen, and the master pours his tea until it is running off the table.',
  body:[
    "He asked a man he respected to look at his account.",
    "It was not a small thing to ask. The man had been doing it fifteen years, did not teach, did not post, and said yes as a favour to somebody they both knew. They got a coffee on a Saturday.",
    "He had prepared. The whole thing on one screen, colour coded, with a page of notes about what he thought the problem was.",
    "He talked for eleven minutes before the other man said anything.",
    "Then the man said: your winners and your losers are the same size.",
    "And he said yes, but.",
    "He does not remember what came after the but. There was quite a lot of it. He explained the strategy and why the win rate made that acceptable, and about a stretch in the spring that skewed everything, and he pulled up a version with the spring taken out.",
    "The man looked at it and said: still the same size.",
    "And he said yes, but on that particular sample.",
    "They were there an hour and a half. He was polite the whole time and asked good questions, and every single time the man said something he said yes and then explained.",
    "He drove home feeling it had gone quite well and that the man had not really understood his setup.",
    "It took him months to see it, and what did it was watching somebody do it to him. A lad at work asked his advice and he gave it, and the lad said yes but, and then explained, and he sat there watching a person burn twenty minutes of free help defending the thing he had come for help with.",
    "He went home and thought about the coffee.",
    "Your winners and your losers are the same size. That was the answer. Nine words, from a man with fifteen years, in the first two minutes, for nothing.",
    "He had heard it twice and argued with it twice and driven home.",
    "He had not had the number wrong. He knew the number. What he could not do was let it be the problem, because letting it be the problem meant the last two years had been aimed at the wrong thing, and he had gone to that coffee shop to be told he was close.",
    "That is what he had actually gone for. He did not know it until the lad at work said yes but.",
    "He does not ask people to look at it often now. When he does he has a rule, which is that he does not get to talk for the first ten minutes.",
    "It is a stupid rule and it works, and it works because it is very hard to explain yourself while you are not talking."
  ] },
{ id:'river', stage:'The Refusal', bg:'silk', mins:2,
  n:'When You Get In', src:'Ours',
  laws: [
    { n: 'The River Does Not Wait', f: 'time', d: 'Every year he prepared, the thing he was preparing for went past at its own rate.' },
    { n: 'The Number That Moves', f: 'time', d: 'Six months, then nine, then a year, then a year in the new money. Each one more sensible than the last.' },
    { n: 'The Walk', f: 'motion', d: 'No size of account answers whether you are good enough. Only going does, and he did not want the answer.' }
  ],
  rule:'Readiness is something you claim, never something you are granted.',
  q:'What are you calling preparation?',
  teach:'A man stands on the bank of a river for thirty years, waiting for it to be the right week to cross.',
  body:[
    "He was going to go full time when he had six months of expenses saved.",
    "He got to six months. Then he thought about it properly, and six months is thin for a man with a car that is going, so he made it nine.",
    "He got to nine.",
    "By then he had read something about wanting a year of runway, and the thing was correct, and he was not being unreasonable, which is what makes this hard to talk about. Every number he moved to was more sensible than the one before it. If you had argued with him about any single one you would have lost.",
    "He hit a year in the summer.",
    "He had also been promoted by then, and the promotion meant a year was no longer a year, because his outgoings had gone up with it. A year was now about eight months in the new money. He wanted a year.",
    "He was very good by this point. That is the part people skip. He had been at it in the mornings and the evenings for a long time and knew his own numbers to two decimals and was better than several people he knew who had already jumped.",
    "He said out loud, to four or five people, that he was going to do it.",
    "Somebody asked him once what he was waiting for and he gave the number, and they said fair enough, because it was a good number and it sounded like a plan.",
    "Here is what was actually happening.",
    "There is no amount of money that makes the jump safe, because money is not what makes it unsafe. What makes it unsafe is that you might not be good enough, and no size of account answers that question. You only get the answer by going.",
    "He did not want the answer.",
    "So he kept moving the number, and every time he moved it he got to feel like a careful man instead of a frightened one, and those two look identical from outside and very nearly identical from inside.",
    "He went in the end, and not because he hit a number.",
    "He went because the company restructured and offered him something worse, and he sat in the car park afterwards and understood that he had just been handed the thing he had spent years failing to give himself.",
    "The first eight months were bad. He nearly went back twice. He will not tell you it was fine, because it was not, and the runway he had built is the one thing that got him through it.",
    "What he says now, when somebody asks what number they should have, is that he does not know. Pick one. Write it down. Go on the day you hit it.",
    "Because the number was never the thing. The day is the thing. And if you do not fix the day in advance, you will find, every single time you arrive at it, that there is a better number just a little further on."
  ] },
{ id:'horse', stage:'The Mentor', bg:'canyon', mins:2,
  n:'Too Early To Say', src:'Ours',
  laws: [
    { n: 'Two Ends of One Thing', f: 'time', d: 'Redundancy, a better job, walking out, four years on his own. Four events, four verdicts, all early.' },
    { n: 'The Early Verdict', f: 'inner', d: 'Everyone around him was certain every time, and being wrong four times never slowed them down.' },
    { n: 'Nothing Has a Size of Its Own', f: 'time', d: 'Eleven thousand more was a triumph until it was measured against fourteen months of Sunday evenings.' }
  ],
  rule:'Every event is half a sentence. You keep reading it out as the whole one.',
  q:'What are you certain was a disaster?',
  teach:'A farmer loses a horse, gains twelve, and his son breaks a leg. Four times the neighbours are sure, and four times they are early.',
  body:[
    "He was made redundant in the February and everyone said it was a disaster.",
    "It was a disaster. He had a mortgage and a kid coming and there was nothing else going in that town, and for six weeks he applied for things and heard nothing and lay awake doing arithmetic.",
    "An older bloke he knew from the gym, a quiet man who had been self-employed his whole life, asked him how it was going. He said it was a disaster.",
    "Too early to say, said the older man.",
    "He thought that was a stupid thing to say and went home annoyed.",
    "In the April he got a job that paid eleven thousand more than the one he had lost. Everybody agreed this was the best thing that could have happened. His mother said it out loud at a birthday: the redundancy was the best thing that ever happened to him.",
    "Too early to say.",
    "He worked there fourteen months and it took something out of him he had not known was available to be taken. The money was real and so was the manager, and by the end of it he was having the sort of Sunday evenings that people do not talk about at birthdays.",
    "He walked out in the June with nothing lined up, which everybody agreed was a catastrophe and reckless with a young family.",
    "Too early to say.",
    "He started on his own because there was nothing else, and because after fourteen months of that he could not make himself sit in another interview. The first year was awful and thin. The second was not.",
    "By the fourth year he had two people working for him and he was earning more than the eleven thousand extra had ever been, and everybody agreed that walking out had been the making of him, and his mother said so at another birthday.",
    "He went to see the older man, who was properly old by then, to tell him.",
    "He told the whole thing end to end, the redundancy and the job and the walking out and the four years, and how it had all turned out, and he was waiting for it, because he had earned it.",
    "The old man said: too early to say.",
    "And he laughed, and then he did not, because he understood for the first time that the man was not being wise at him.",
    "He meant it. Literally and every time. There was another year coming after this one and then another, and the business could go, and the thing he was calling the making of him could turn out to be the start of something he would describe completely differently at sixty.",
    "He has not stopped noticing it since. How fast he closes the book. How certain he is, every time, and how many times that has gone.",
    "What he does now instead is mend the fence and go out to work. He is not waiting to find out what any of it meant. He just does not say the sentence out loud any more, because he has been wrong with it four times in a row and it never once slowed him down."
  ] },
{ id:'ferry', stage:'The Threshold', bg:'nightfall', mins:2,
  n:'The Fuel', src:'Ours',
  laws: [
    { n: 'What Only Made Sense Back There', f: 'motion', d: 'The list got him up at five for six years and there was no version of the next thing it could give him a reason for.' },
    { n: 'The Borrowed Engine', f: 'others', d: 'Four people who had doubted him had been choosing what mattered, every morning, for six years.' },
    { n: 'The Toll', f: 'motion', d: 'He offered the hours and the money and the risk. None of those were the fare.' }
  ],
  rule:'The toll is always the thing you were going to keep.',
  q:'What are you trying to take across with you?',
  teach:'A man at a river is told the fare, and the fare is one of the things he is carrying, and the ferryman chooses which.',
  body:[
    "He had a list and everybody like him has a version of it.",
    "It was not written down. It was: the teacher who said he was not academic. The manager who laughed when he handed in his notice. His uncle at a wedding saying let us see where you are in five years. And one girlfriend who was not cruel about it and said, kindly, that she did not think this was going to work out.",
    "He ran on that list for six years and it worked.",
    "That is the part that has to be said properly, because the easy version of this story pretends the fuel was bad fuel and it was not. It got him up at five. It got him through the first two years when there was nothing. On the days when he could not find a reason, the list was a reason, and it never once ran out.",
    "Then it started costing him.",
    "He noticed it first in how he talked. Somebody would ask a straight question about what he did and he would answer it with an edge on, slightly too much, a little bit of the courtroom in it, and he would hear himself and not be able to stop.",
    "He noticed it in what he chased. He took a contract that was wrong for him because the client knew his old manager. He picked a fight in public with somebody whose opinion did not matter, and won it, and felt nothing.",
    "And he noticed it worst on the good days. He would do a thing he had worked years for, and the first thought through was not this is good, it was I wish they could see this, and then a few seconds of a conversation in his head with a man he had not spoken to since he was twenty-three.",
    "He worked out what was actually happening on a Sunday, and it took him a long time to be willing to say it.",
    "He had built the whole thing to settle an argument.",
    "Which means the people on that list had been steering. Not once, not occasionally. For six years, every morning, they had decided what mattered, because the only question the list can ever ask is what would make them wrong, and that is not the same question as what do I want.",
    "He could not get any further carrying it.",
    "Not because it is unspiritual to hold a grudge. Because the next thing he wanted to build had nothing to do with any of them, and there was no version of it that the list could give him a reason to get up for, and on the mornings when there was no reason he would go looking for one, and the list was always there, and it always pointed somewhere slightly wrong.",
    "Putting it down was harder than any of the work had been.",
    "He did not forgive anybody. He is clear about that. Three of the four he has never spoken to since and probably never will, and if you asked him he would tell you the teacher was wrong about him.",
    "He just stopped using it.",
    "The mornings are worse now, some of them. There are days with no reason in them at all, and he gets up anyway, and that is a quieter engine and a much smaller one.",
    "It goes where he points it."
  ] },
{ id:'cutter', stage:'The Trials', bg:'abyss', mins:2,
  n:'Four Systems', src:'Ours',
  laws: [
    { n: 'The Sideways Look', f: 'others', d: 'Not one of the four was killed by the market. Every one was killed by a screenshot.' },
    { n: 'Nothing Has a Size of Its Own', f: 'time', d: 'Sixty-three per cent was a failure against that group chat and a good year against anything else.' },
    { n: 'The Quiet Middle', f: 'time', d: 'The first one had to be allowed to be boring for a year, and never was.' }
  ],
  rule:'Every time you look sideways you start again from nothing.',
  q:'What did you stop doing because somebody else was doing better at something else?',
  teach:'The old version is a stonecutter who wishes himself into the sun and the rain and a mountain, and ends up back at the rock with a chisel.',
  body:[
    "He ran four systems and he could tell you the date each one died.",
    "The first took him eight months to build and it worked. Not spectacularly. It made money in a flat sort of way, and there were weeks it made nothing and he sat there and let it make nothing, which he was quite proud of at the time.",
    "He killed it in the March because a lad in the group chat posted a forty per cent month.",
    "Same age. Started after him. Put up a screenshot on a Tuesday night with no caption, and forty people reacted to it, and he looked at it in bed and felt the floor go.",
    "He did not decide to stop. That is the part he cannot explain. There was no evening where he sat down and reasoned it out and chose. He started reading about what the other lad was doing, then paper trading it, then running a small one alongside, and by the end of the month the first system was off and he had never formally ended it.",
    "It starved.",
    "The second lasted eleven weeks. It died because a man in a group he had never spoken to posted a curve that went up in a way his did not. He did not know the man's name. He did not know if the curve was real. He rebuilt his entries over a weekend.",
    "The third lasted five months. The fourth was still running, in the sense that he had not looked at it properly in three weeks.",
    "He did the thing on a Sunday because he was down and bored and wanted to feel bad in an organised way.",
    "He pulled the first system out of the folder. The eight-month one, from before the screenshot. He still had the rules and he still had the data, and it took him about forty minutes to run it forward to that Sunday as though he had simply left it alone.",
    "It was up sixty-three per cent.",
    "He sat with that a while. Then he did the second one, because he had to know. Up thirty-one. The third, flat. The fourth was the only one actually losing, and it was the one he still had on.",
    "Sixty-three per cent. Not a good year by the standards of that chat. He would not have posted it.",
    "What got him was not the money. It was working out that he had never once lost money to the market. The market had done its ordinary thing and every system he built had been roughly fine.",
    "He had lost it to a screenshot, four times, posted by people he had never met.",
    "And he could not tell you what his edge was. Four systems, and he had never held one long enough to find out what it did in a bad quarter, which is the only thing about any of them worth knowing.",
    "He had been asked twice at work what it was he actually did. Both times he had said something vague and put it down to not wanting to talk about money.",
    "It was not that. He did not know.",
    "He turned the fourth one off in the morning and put the first one back on, and he did not tell the chat, and it made four hundred and eighty pounds in December, which he did not post."
  ] },
{ id:'monks', stage:'The Trials', bg:'delta', mins:2,
  n:'Eleven Hours', src:'Ours',
  laws: [
    { n: 'The Long Carry', f: 'inner', d: 'Four seconds in a meeting room. Eleven hours in him, and only one of those was being fed.' },
    { n: 'The Sentence That Arrives Ready', f: 'inner', d: 'It came out in a kitchen at half past six with no introduction, to somebody who had not been there.' },
    { n: 'The Early Verdict', f: 'inner', d: 'He decided what it meant at twenty past nine and spent the day building on a foundation nobody else had laid.' }
  ],
  rule:'You put it down hours ago. Somebody is still carrying it, and it is you.',
  q:'What did you set down that you are still holding?',
  teach:'Two monks cross a ford and one of them carries a stranger through the mud. The other carries her the rest of the day.',
  body:[
    "It was said at about twenty past nine on a Tuesday, in a meeting of eleven people, and it took under four seconds.",
    "Someone from another team, going through a list, got to his part and said: yes, we had to redo most of that.",
    "Then they moved on to the next item.",
    "It was not even unkind. It was not aimed. The man who said it did not look up, and had no idea he had said anything, and by twenty-five past nine had genuinely forgotten it, in the way you forget a sentence in a meeting.",
    "He carried it for eleven hours.",
    "He did not say anything at the time, which he decided was the professional thing, and which meant he then had to do something with it. So he built the argument. He built it properly, the way you build a thing you have been taught to build: the facts, the dates, what had actually been redone and why, whose fault it had in fact been, what he could have said.",
    "He was still working on it at lunch.",
    "He was distracted through the afternoon. He did about half the work he would normally have done, and did it worse, and a message came in from his partner about the evening and he answered it late and short.",
    "On the drive home he had the whole thing running again with a better opening line.",
    "At half past six he came in and put his keys down and said, to a person who had not been in the meeting and had no idea what he was talking about: I mean, they had to redo most of it, apparently.",
    "Fully formed. As though it were the next thing said in a conversation.",
    "She said, what?",
    "And he heard himself try to explain the context of a four-second remark made nine hours earlier by a man he barely knew, and got about a sentence and a half into it before he stopped.",
    "The remark took four seconds. He had been carrying it since.",
    "Not the remark. The remark was over at twenty past nine and had been lying in a meeting room ever since with nobody to pick it up. What he had been carrying was something he had made out of it, and he had been feeding it all day, and it had not weakened once, because the thing feeding it was him and he had not stopped.",
    "He is not better at this now, particularly. He notices it sooner. That is all that has changed and it is not nothing.",
    "The tell is always the same. The sentence arrives ready. It comes out of him in a kitchen or a car with no introduction, hours or years later, as though the conversation were still going.",
    "It is not still going. Nobody else is in it.",
    "He has been in it by himself the whole time."
  ] },
{ id:'post', stage:'The Trials', bg:'jade', mins:2,
  n:'Nothing To Post', src:'Ours',
  laws: [
    { n: 'The Unwritten Half', f: 'inner', d: 'Three hours going through the book, and every trade in it passed. What was wrong had no line in it.' },
    { n: 'The Prize Goes to the Exception', f: 'motion', d: 'The week that did the numbers was the least typical week of his year, and he knew it at the time.' },
    { n: 'The Judge You Installed', f: 'others', d: 'Nobody told him an empty week was a failure. It had simply moved in, and it had been choosing his mornings ever since.' }
  ],
  rule:'An audience can only applaud what it can see, and what it can see is never the work.',
  q:'What have you quietly stopped doing because there was nothing in it to show anybody?',
  teach:'Goodhart wrote it about economics: a measure that becomes a target stops being a measure. The version that bites has no name and no economics in it — the moment anybody is watching, the visible part of your work quietly becomes the part you do.',
  body:[
    'He posted a green week and it went.',
    'He had been posting for about a year into nothing. A screenshot, a line underneath, eleven likes, most of them people he already knew. This one did four thousand and he still could not tell you what was different about it. The week had been good and he had said so plainly.',
    'Nothing bad happened next, and that is the part worth slowing down for. He did not become somebody. He did not sell anything. He did not start lying.',
    'He kept trading the way he had been trading. He would tell you that now and he would get the journal out to prove it.',
    'Six months later the account was down and the journal was clean.',
    'He went through it one evening, trade by trade, against his own rules. Every one passed. Right setup, right size, right time of day. It took three hours and got him nowhere, because whatever had gone wrong was not in the book.',
    'He found it on a Thursday, trying to write a post.',
    'The week had been nothing. Two trades, both small, both fine. He sat there twenty minutes trying to make a week out of it, and somewhere in the twenty minutes he noticed what he was feeling.',
    'It was disappointment.',
    'That was new. A week with nothing in it used to be a week with nothing in it. He had had hundreds of them. They were most of his year and he had never once minded, because the whole thing only worked on volume — a small trade most mornings, most of them nothing much, and the year came out of the pile.',
    'Now an empty week was a failure. Nobody had told him that. It had arrived at some point, quietly, in the weeks after the post that went, and it had been sitting there ever since taking a decision he did not know was being taken.',
    'The decision was this. On the mornings with nothing in them, he waited.',
    'He never broke a rule. He waited for something worth writing about, and most of those mornings nothing worth writing about turned up, and waiting all day is tiring, so he would shut the laptop having taken nothing at all.',
    'Fifty-one trades in five months. The year before, over the same stretch, a hundred and ninety.',
    'His win rate had gone up.',
    'That is the part he tells people, because it is the part that is hard to hear. He had become more selective and more patient by every measure anybody writes about, and he had removed most of his own income doing it.',
    'There is no record of a trade you did not take. A journal cannot hold an absence. The only place those hundred and thirty-nine exist is in the shape of the year.',
    'He still posts. He posts a month behind now, so the week he is living is never the week he is showing, and that one change did more than deleting the account would have.',
    'The other thing he noticed, later, was that the week which did four thousand was the least typical week of his year. He had known it was an outlier while it was happening.',
    'He had spent five months trying to have it again.'
  ] },
{ id:'knot', stage:'The Ordeal', bg:'iceberg', mins:3,
  n:'The Column He Added', src:'Ours',
  laws: [
    { n: 'The Wheel', f: 'motion', d: 'Thirty-one losses over his limit. Twenty-six of them were his own rule, broken by him, in writing, with a timestamp.' },
    { n: 'The Early Verdict', f: 'inner', d: 'The news, the spread, the broker and the summer. Every one of those is a reason you can do nothing about.' },
    { n: 'The Handle', f: 'motion', d: 'What he felt was not shame. It was relief, which is the same thing said honestly.' }
  ],
  rule:'Make it your fault and you get the wheel.',
  q:'What are you calling bad luck?',
  teach:'This is the hinge of the whole arc. Every other story here assumes you believe your own actions decide your outcomes. Until that is true, none of them can do anything for you.',
  body:[
    "He was flat.",
    "Not blown up. That is worth being exact about, because blown up would have been easier to talk about and easier to stop. Flat. Months of small wins and slightly larger losses and an account sitting almost exactly where it had started, and a growing suspicion that he was not letting himself finish.",
    "He told his brother about it in a kitchen, standing up, with the kettle going.",
    "He was good at telling it. He had told it a few times by then and it had a shape. There was the gap on the Thursday that nobody could have traded. There was his broker, which was a joke, and he had the screenshots to prove it. There was the fact that the whole of that summer had been unreadable and everyone said so, everyone, you could go and look.",
    "His brother listened to all of it and said, that is rough.",
    "He was not making a point. He worked in logistics and had no opinion about any of it and he genuinely thought it sounded rough.",
    "He drove home annoyed and could not work out who with.",
    "He opened the journal that night. He kept a good one. That was the thing. That was what made the whole situation so stupid. Every trade logged, entry, exit, size, reason, screenshot.",
    "He added a column.",
    "The header was: was this in the rules.",
    "Then he went back to the start of the year and did every single one, and it took until nearly three in the morning, and the answer was only ever yes or no, and he made himself write it without thinking and without adding anything after it.",
    "He had thirty-one losses over his own maximum. That was the number he had been carrying around, the one that explained the year.",
    "Twenty-six of them said no.",
    "Twenty-six. Over his own size limit, or outside his own session, or averaging into something he had a written rule against averaging into. In nineteen of them he had typed the reason in himself at the time, in his own words, with a timestamp on it.",
    "The gap on the Thursday was in there. It was a no. He had been in that trade at three times his size because of something he decided the day before.",
    "He sat in the room with the laptop open and the heating off and waited to feel sick.",
    "He did not feel sick.",
    "What came instead took him a minute to identify, because he had not felt it in a long time and it had no business turning up on a night like that.",
    "It was relief.",
    "Because if it was the news and the spread and the summer and the broker, then there was nothing to be done and there never would be, and he was going to sit in that chair every morning for another five years hoping the weather changed.",
    "And if it was him, if it was twenty-six decisions made with his own hands and written down at the time, then it was a thing with a handle on it.",

/* Each law in one line. A tag that opens nothing is a tag that reads
   as a category somebody forgot to wire up, and the whole point of
   naming the laws is that a story carries several and you can follow
   any of them sideways into the others that carry it. */
var LAWS = {
  'The Answer You Are Carrying': 'The thing you are looking for is very often already in your possession — written down, said to you, sitting under your feet. Finding it was never the difficulty. Being able to hear it is, and that is usually bought rather than given.',
  'The Lit Ground': 'You search where searching is comfortable rather than where the thing actually is. The lit ground is not where you dropped it. It is simply the only place you can see, and effort spent there looks identical from outside to effort that would work.',
  'The Full Cup': 'Nothing new enters a container that is already occupied. You are not being refused the answer; there is nowhere in you for it to go, and the thing filling the space is usually something you are right about.',
  'The Cost of Being Right': 'Every answer you argue with is protecting a decision you have already made. The price of hearing it is admitting what it makes of the last two years, which is why people go looking for help and come home having defended themselves.',
  'The Early Verdict': 'Every event arrives as half a sentence and you read it out as the whole one. A verdict delivered early is not a description of what happened — it is the first move of what happens next.',
  'The Long Carry': 'The event has a duration and it ends. The carrying is a second thing, which you are doing, and it runs at full strength for as long as you keep feeding it. Nothing external is required after the first four seconds.',
  'The Sentence That Arrives Ready': 'The tell that you are still carrying something is that it comes out fully formed, hours or years late, with no introduction, as though the conversation were still running. It is not still running. Nobody else is in it.',
  'The Spent Feeling': 'Announcing a thing pays you a small amount of the feeling you were supposed to get from finishing it, out of the same account. Tell enough people and you can draw the whole balance without ever doing the work.',
  'The Walk': 'Understanding a thing and acting on it are two separate acquisitions. Almost everybody completes the first, calls it done, and is genuinely surprised years later to find nothing moved.',
  'The Wheel': 'Either your outcomes come out of your own hands or they come out of the weather. Both are beliefs and only one of them leaves you anything to do tomorrow, which is why the honest account of a bad year arrives as relief rather than shame.',
  'The Toll': 'Everything is paid for, and rarely in the currency you offered. The bill comes from an account you did not know was open, and the fare is never the thing you were holding out.',
  'What Only Made Sense Back There': 'A threshold charges you the thing that was only ever valuable on the side you are leaving. That is not cruelty. If it made sense on both banks it would not be a threshold, it would be a road.',
  'The Handle': 'A problem you caused is a problem with a handle on it. Fault is not a moral verdict here; it is the difference between a situation you can reach and one you can only wait out.',
  'The Open Door': 'A way back is almost never used. It takes a little pressure out of every hard thing instead, continuously and invisibly, and the pressure was what was going to finish the work.',
  'The Stranger’s Mouth': 'The answer very often arrives from somebody who is not trying to help you, does not know they have given it, and will not remember saying it. People close to you have usually said the same thing and been unable to make it land.',
  'The Sideways Look': 'Every position has something above it that was invisible from the one below. Whoever moves because of what they can see from where they stand will move for ever, and will never find out what they had.',
  'The Borrowed Engine': 'Running on somebody else’s doubt works, and it means somebody else is steering. The only question that engine can ask is what would prove them wrong, and that is a different question from what you actually want.',
  'The River Does Not Wait': 'Conditions are never right, because right is not a state conditions are in. The thing goes past at its own rate whether or not you are ready, and it has been going past the whole time you were preparing.',
  'Two Ends of One Thing': 'A disaster and a making are frequently the same event measured from different distances. You never get to stand far enough back to be certain, and there is always another year after this one.',
  'Nothing Has a Size of Its Own': 'A number is only ever large or small against whatever you have put beside it, and you choose what you put beside it far more often than you notice.',
  'The Number That Moves': 'Readiness recedes as you approach it, because the thing you are waiting for was never a number. Every threshold you set will be more sensible than the last one, and you will never arrive.',
  'The Second Thing': 'What you wanted arrives with something attached that you did not ask for and were not warned about. It is usually the fear of it leaving, and it usually weighs more than the thing.',
  'The Quiet Middle': 'The work that decides it has no screen, no course, nobody to tell and no way to get better except by being in it. It pays nothing for a long time and there is no way to make it interesting.',
  'The Judge You Installed': 'Show the work to enough people and one of them takes up residence. It arrives with standards you never agreed to, it has no interest in the boring majority of what you do, and you will be working to please it for months before you notice it moved in.',
  'The Unwritten Half': 'Every record is a record of what you did. The things you did not do leave no line, pass every audit, and are frequently the whole of what went wrong — which is why a clean book above a falling result is not a contradiction.',
  'The Prize Goes to the Exception': 'What people respond to is almost never the thing that produced your year. It is the one week that did not look like the rest, and going after the applause means going after your own outlier, which is the single result you have no method for.',
  'The Day Nobody Announced': 'The morning it changed was indistinguishable from the four hundred before it. You will not feel it arrive. You will notice, much later and by accident, that it is already behind you.'
};

  paintLaw(name);
  view('law');
}

function open(id) {
  var s = byId(id);
  if (!s || !s.body) return;
  st.last = id;
  if (st.read.indexOf(id) < 0) st.read.push(id);
  save();
  paintStory(s);
  view('story');
}

document.addEventListener('click', function (e) {
  var t = e.target.closest ? e.target.closest('.al-tab, .al-card, .al-pill, .al-tag, .al-le, .al-lrow, #alOpenB, #alStoryX, #alLawX') : null;
  if (!t) return;
  if (t.id === 'alOpenB') { var r = st.last && byId(st.last); return r && r.body ? open(r.id) : view('arc'); }
  var go = t.getAttribute && t.getAttribute('data-go');
  if (go) return go === 'arc' ? view('arc') : open(go);
  if (t.id === 'alStoryX') return view('arc');
  if (t.id === 'alLawX') return lawBack === 'story' ? view('story') : view(lawBack);
  var law = t.getAttribute && t.getAttribute('data-law');
  if (law) return openLaw(law);
  if (t.classList.contains('al-lrow')) return open(t.getAttribute('data-id'));
  if (t.classList.contains('al-tab')) return view(t.getAttribute('data-v'));
  if (t.classList.contains('al-card')) return open(t.getAttribute('data-id'));
});

var resume = st.last && byId(st.last);
if (resume) { $('#alOpenB').textContent = 'Continue'; $('#alOpenN').textContent = 'You stopped at ' + resume.n + '.'; }
photo($('#alOpenHero'), 'desert');
view('open');
window.alDrive = { view: view, open: open };

}());
</script>
</body>
</html>
