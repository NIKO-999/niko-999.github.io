<!doctype html>
<html lang="en" data-view="open">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0A08">
<title>Alignment</title>
<link rel="preload" href="../arc/fonts/Inter.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: 'Inter'; font-weight: 100 900; font-display: swap;
  src: url('../arc/fonts/Inter.woff2') format('woff2'); }

/*
  ALIGNMENT. Its own ground, its own type, its own everything — it reads
  none of the other keys and takes none of the shared shell.

  THE FOURTEEN PHOTOGRAPHS WENT WITH THE STORIES. Every screen was a
  picture in a frame with the interface living in the material around
  it, under a per-image brightness beneath one shared grade — measured,
  the set spanned 235 degrees of hue, and no single transfer function
  pulls a mixed library into one family. There is no image in this app
  now, so the grade token, the brightness token and both rules that
  read them are gone rather than left to cascade at nothing.
*/

:root {
  --paper: #0B0A08;
  --ink: #FFFFFF;
  --dim: rgba(255,255,255,.72);
  --spent: rgba(255,255,255,.46);
  --hair: rgba(255,255,255,.14);
  --glass: rgba(255,255,255,.10);

  /* Chrome sits on a PLATE, not on glass. A 10% white wash over a lit
     photograph put the info glyph at 2.50:1 against the 3 a graphic
     needs. The photographs have gone and the plate stays, because a
     control is still told from the page by its own ground. */
  --plate: rgba(11,10,8,.56);

  --card: #1A1611;
  --card-edge: rgba(255,255,255,.08);

  --r-card: 26px;
  --r-in: 18px;
  --r-sq: 14px;
  --r-pill: 999px;

  /* Six vertical steps. The first build shipped eleven — 8 10 12 14 18
     20 22 24 26 34 38 — which is this repo's own runaway-scale fault in
     a third dimension after thirty type sizes and thirteen leadings. */
  --v1: 6px;  --v2: 10px; --v3: 16px;
  --v4: 22px; --v5: 34px; --v6: 52px;

  --gut: 22px;
  --round: 40px;   /* drawn; the 44 it OWNS is the ::before square */
  --gut-list: 18px;
  --tap: 44px;

}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body { height: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: 'Inter', -apple-system, system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  overflow: hidden;
  overscroll-behavior: none;
}

button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
[hidden] { display: none !important; }

.al-disp   { font-size: 38px; font-weight: 450; line-height: 1.00; letter-spacing: -.03em; }
.al-disp-s { font-size: 28px; font-weight: 450; line-height: 1.02; letter-spacing: -.024em; }
.al-caps   { font-size: 10px; font-weight: 600; letter-spacing: .5em; text-transform: uppercase; color: var(--dim); }
.al-note   { font-size: 13px; font-weight: 450; line-height: 1.45; color: var(--dim); }

.al-view { position: relative; z-index: 1; height: 100%; display: none; flex-direction: column; }
.al-view.is-on { display: flex; }

#alOpen { justify-content: flex-end; padding: 0 var(--gut-list) var(--v5); }
#alOpen .al-mark { margin-bottom: var(--v3); }
.al-mark { display: flex; align-items: center; gap: 9px; }
.al-mark svg { width: 20px; height: 20px; display: block; }
.al-mark b { font-size: 13px; font-weight: 500; letter-spacing: 1.2em; text-transform: uppercase; }
#alOpen .al-disp { margin-bottom: var(--v2); max-width: 7.2em; }
#alOpen .al-note { margin-bottom: var(--v4); max-width: 20em; }

/* A PILL IS SIZED TO ITS CONTENT. Not one of the four reference pills
   spans the screen — they measure 217, 148, 187 and 134 CSS px, all
   43 to 50 tall. A full-bleed primary was the widest object on the
   open screen and read as a form submit. */
.al-pill {
  display: inline-flex; align-items: center; justify-content: center;
  align-self: flex-start;
  min-height: 48px; padding: 0 30px; border-radius: var(--r-pill);
  background: var(--ink); color: #14120E;
  font-size: 16px; font-weight: 500; letter-spacing: -.01em;
}

.al-head { padding: calc(var(--v4) + env(safe-area-inset-top, 0px)) var(--gut-list) var(--v3); display: flex; align-items: center; gap: 12px; flex: none; }
.al-head .al-disp-s { flex: 1; }
.al-head .al-count { flex: none; }

/* A COUNT IS A FIGURE, NOT A LABEL. It wore .al-caps, which is 10px at
   half an em of tracking — right for a word and wrong for a number:
   24 drew as "2 4", two digits with a space between them. It carries
   its own rule rather than overriding .al-caps, because the two are
   equal specificity and this repo has lost that race five times. */
.al-count { font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--dim); }

/* 44 OWNED, 40 DRAWN — and an inset cannot say that here. An
   absolutely positioned box resolves against its host's PADDING box,
   and .al-round carries a 1px border under a border-box reset, so its
   padding box is 38 and inset:-2px reached 42 rather than the 44 the
   declaration reads as. Two real controls sat under the floor and the
   arithmetic was invisible in the source. Centring an explicit --tap
   square is immune to the host's border, padding and drawn size alike,
   and it is what makes the token load-bearing rather than decorative. */
.al-round {
  width: var(--round); height: var(--round); flex: none; border-radius: var(--r-pill);
  background: var(--plate); border: 1px solid var(--hair);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  display: grid; place-items: center; position: relative;
}
.al-round::before {
  content: ''; position: absolute; top: 50%; left: 50%;
  width: var(--tap); height: var(--tap); transform: translate(-50%, -50%);
}
.al-round svg { width: 17px; height: 17px; display: block; }

.al-pane { flex: 1; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  padding: 0 var(--gut-list) calc(118px + env(safe-area-inset-bottom, 0px)); }
.al-pane::-webkit-scrollbar { display: none; }

/* A MASK, NEVER A GRADIENT LAID OVER THE CONTENT. It was written when
   the ground was a photograph and a --paper overlay was a near-match
   that read as a smudge somewhere on the set; over one flat ground a
   gradient would do, and a mask is still the version with no colour
   to get wrong. Off again at the end of the travel: a
   soft edge over nothing is the same lie in the other direction. */
.al-pane { -webkit-mask-image: linear-gradient(180deg, #000 calc(100% - 86px), transparent 100%);
                   mask-image: linear-gradient(180deg, #000 calc(100% - 86px), transparent 100%); }
.al-pane.is-end { -webkit-mask-image: none; mask-image: none; }

.al-grp { padding: var(--v5) 2px var(--v2); }

.al-lead { padding: var(--v4) 0; }
/* The title runs at line-height 1.00, so its last line box ends level
   with the ink and a descender prints into whatever is next. Six
   pixels, which is also what makes the pair read as two registers
   rather than one wrapped line. */
.al-lead .al-caps { margin: var(--v1) 0 var(--v2); }
/* THE TITLE HAS TO CLEAR THE CLOSE BUTTON, AND 9em DID NOT. The X is
   fixed at the viewport's own right edge, so the room the title has is
   a number of PIXELS and an em measure cannot see it: at 38px, 9em is
   342 and the button's left edge is 330. Twenty of fifty-seven titles
   ran into it and twelve overlapped it outright — and the one this was
   first looked at on was among the thirty-seven that clear, which is
   what a single screenshot is worth as a check. Derived from the two
   gutters and the button rather than written as 304px, so the day a
   token moves the title moves with it. */
.al-lead .al-disp { max-width: calc(100% - (var(--round) + var(--gut) - var(--gut-list) + 8px)); }

/* Nothing to travel with any more: the ground under the words is the
   page. The whole class of contrast failure that MOVES with the scroll
   went out with the photograph. */
.al-sheet { padding-bottom: var(--v6); }


/* A THEME IS A CARD AND THE LESSON IS THE PAYLOAD. The theme is the
   evidence, so it reads at the quieter weight; the lesson is what you
   came for and takes the ink. The axis hue sits on the lesson's own
   label and nowhere else — the group heading already names it, and a
   colour repeating a word directly above it is saying which of
   something that was never in question. */
.al-th {
  position: relative; display: block; width: 100%; text-align: left;
  border-radius: var(--r-card); padding: var(--v4); margin-bottom: var(--v3);
  background: var(--card); box-shadow: inset 0 1px 0 var(--card-edge);
}
.al-tn { font-size: 19px; font-weight: 600; line-height: 1.26; letter-spacing: -.016em; }
.al-tsub { margin-top: 3px; font-size: 13px; font-weight: 450; color: var(--dim); }
.al-tl { margin: var(--v4) 0 var(--v1); }
.al-tb { font-size: 15px; line-height: 1.5; color: var(--dim); }
.al-tb.is-les { color: var(--ink); }
.al-tl.is-les { color: color-mix(in srgb, var(--tg) 66%, var(--ink)); }
.al-th[data-x="internal"] { --tg: #C9A227; }
.al-th[data-x="external"] { --tg: #7E9AA6; }

/* A STORY IN THE INDEX IS A PRESS TARGET AND THE REST ARE NOT. The same
   card, with no second drawing — only the row that opens something
   takes the reach. */
.al-f::before {
  content: ''; position: absolute; left: 0; right: 0; top: 50%;
  height: 100%; min-height: var(--tap); transform: translateY(-50%);
}


/* ---- THE FOOT ---- */
.al-foot {
  position: fixed; left: 93px; right: 93px; z-index: 30;
  bottom: calc(var(--v4) + env(safe-area-inset-bottom, 0px));
  height: 58px; border-radius: var(--r-pill);
  background: rgba(24,21,17,.62);
  backdrop-filter: blur(26px) saturate(1.5); -webkit-backdrop-filter: blur(26px) saturate(1.5);
  border: 1px solid var(--hair);
  display: grid; grid-auto-flow: column; align-items: center;
  padding: 0 var(--v1);
}
.al-tab { height: 46px; border-radius: var(--r-pill); display: grid; place-items: center; color: var(--dim); }
.al-tab svg { width: 20px; height: 20px; display: block; }
.al-tab[aria-current="true"] { background: rgba(255,255,255,.12); color: var(--ink); }

/* GLASS OVER A PHOTOGRAPH WAS A MATERIAL. GLASS OVER A SENTENCE IS A
   SMEAR. This is the one round control that sits over running body
   text, fixed, while the pane scrolls under it — and .al-round's own
   --plate is 56%, which dims a word without removing it. Measured on
   composited pixels, a letter behind the disc survived as a 44-point
   luminance ghost and the screenshot read "you will b✕". At 94% the
   ghost is 6 and the backdrop pass is drawing nothing anybody can
   see, so it stops being glass either way: --card is the app's own
   object material, the ghost is 0, and the disc reads as a thing ON
   the page rather than a hole punched in it. The glyph costs nothing
   — 19.3:1 on the old plate, 19.8 on this one. Both X's take it;
   both sit over a pane of text. It is LATER in the file than
   .al-round and the two are equal specificity, so source order is
   what makes it win — the computed value is read back rather than
   trusted. */
.al-x { position: fixed; top: calc(18px + env(safe-area-inset-top, 0px)); right: var(--gut); z-index: 30;
  background: var(--card); backdrop-filter: none; -webkit-backdrop-filter: none; }
</style>
</head>
<body>

<section class="al-view is-on" id="alOpen">
  <div class="al-mark" role="img" aria-label="Alignment">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 2v20M5 8l7-6 7 6M5 16l7 6 7-6"/></svg>
  </div>
  <h1 class="al-disp" id="alOpenT">Ten stories, read for what is in them.</h1>
  <p class="al-note" id="alOpenN">Sixty themes taken from the films and the shows themselves, split into what happens inside you and what happens out there. What the story does, and what it leaves you with.</p>
  <button class="al-pill" id="alOpenB">Begin</button>
</section>

<section class="al-view" id="alFilms">
  <div class="al-head"><h1 class="al-disp-s">The Stories</h1><span class="al-count"></span></div>
  <div class="al-pane" id="alFilmsPane"></div>
</section>

<section class="al-view" id="alInternal">
  <div class="al-head"><h1 class="al-disp-s">Internal</h1><span class="al-count"></span></div>
  <div class="al-pane" id="alInternalPane"></div>
</section>

<section class="al-view" id="alExternal">
  <div class="al-head"><h1 class="al-disp-s">External</h1><span class="al-count"></span></div>
  <div class="al-pane" id="alExternalPane"></div>
</section>

<section class="al-view" id="alFilm">
  <button class="al-round al-x" id="alFilmX" aria-label="Close">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
  <div class="al-pane" id="alFilmPane"></div>
</section>

<nav class="al-foot" id="alFoot">
  <button class="al-tab" data-v="films" aria-current="true" aria-label="The Stories">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3" y="7" width="13" height="13" rx="2.4"/><path d="M8 4h11a2 2 0 0 1 2 2v11"/></svg>
  </button>
  <button class="al-tab" data-v="internal" aria-label="Internal">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="8.4"/><circle cx="12" cy="12" r="3.1" fill="currentColor" stroke="none"/></svg>
  </button>
  <button class="al-tab" data-v="external" aria-label="External">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M13.5 4.5H19.5V10.5M19.5 4.5 12.5 11.5M18 14v4.5a2 2 0 0 1-2 2H5.5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2H10"/></svg>
  </button>
</nav>

<script>
(function () {
'use strict';

/*
  ONE WRAPPER. Nothing escapes it. The other apps in this repo learned
  that the hard way — a top-level name here does not throw when it
  collides, it replaces, and the symptom turns up screens away.
*/

var KEY = 'align.v1';

/* THE STORY IS THE EVIDENCE AND THE LESSON IS WHAT IT LEAVES YOU. The
   theme is what actually happens in the film or the show — a named
   scene, a line somebody says, a thing a character does — rather than
   something invented and attributed afterwards. That constraint is the
   whole of why this is worth reading: a lesson with a real scene under
   it can be checked, and one without is somebody's opinion wearing a
   film's name.

   AND THE LESSON IS WRITTEN TO LAND, NOT TO SUMMARISE. A paraphrase of
   the plot with a moral on the end is the version everybody has already
   read. What is here names the uncomfortable half — the thing you are
   currently doing that the scene is about — because a lesson you can
   agree with and walk away from has not been written yet.

   Three internal and three external for each, which is a shape rather
   than a quota: a story that only yielded two of one kind would be one
   to cut rather than one to pad. */

var AXIS = { internal: 'Internal', external: 'External' };

var SRC = [
  { i: "grich", n: "Get Rich or Die Tryin'", y: 2005 },
  { i: "power", n: "Power", y: 2014 },
  { i: "paid", n: "Paid in Full", y: 2002 },
  { i: "snow", n: "Snowfall", y: 2017 },
  { i: "spid", n: "Spider-Man 3", y: 2007 },
  { i: "lotr", n: "The Lord of the Rings", y: 2001 },
  { i: "got", n: "Game of Thrones", y: 2011 },
  { i: "hotd", n: "House of the Dragon", y: 2022 },
  { i: "hp", n: "Harry Potter", y: 2001 },
  { i: "vik", n: "Vikings", y: 2013 },
];

var TH = [
  { s: "grich", x: "internal", n: "Survival as Purpose", b: "Transmutation of Suffering",
    t: "Nine shots outside his grandmother's house, and the one through the jaw is the one that matters: it changes how he sounds, and the sound is what people end up buying. Many Men is written with the whole of it still in him. The record is not about surviving. It is the surviving, put somewhere it can be used.",
    l: "While you are in it there is nothing to show for it, and that is what this part looks like from the inside. It only becomes material later, and only if you were putting it somewhere at the time. The difference between a bad year and the thing you build on is whether anything got written down." },
  { s: "grich", x: "internal", n: "The Saint and the Sinner", b: "Radical Self-Honesty",
    t: "He wears the cross through all of it, and on Gotta Make It to Heaven he does not pretend the two fit. He names what he is doing and asks anyway. The film never resolves it, which is the honest version.",
    l: "You already know which parts of your week do not match what you say you are doing. Saying them out loud costs you the story you have been telling, and that story was costing more. Nobody is one thing. The people who claim to be are spending everything on the claim." },
  { s: "grich", x: "internal", n: "Numb Is Not Healed", b: "Feeling as Freedom",
    t: "Going cold is what keeps him alive on the block, and it works so well that it follows him home. Charlene cannot reach him. His son cannot reach him. The armour has no off, because nobody ever gave it one.",
    l: "Isolation is the right call and numbness is what it turns into if you leave it running. One is a decision about your time. The other is a decision about your capacity to feel anything, and you will not notice the handover. Keep one person you tell the truth to." },
  { s: "grich", x: "external", n: "Violence Begets Violence", b: "The Law of Return",
    t: "Levar says it flat: violence begets more violence, and violence does not beget more money. Every retaliation in the film buys exactly one more retaliation, and not one of them buys anything anybody wanted.",
    l: "Look at what your effort actually produces rather than what it was aimed at. If the honest answer is more of the same problem, you are not behind on the plan. You are on the wrong wheel, and more effort makes it worse. Step off and put the same force somewhere it compounds." },
  { s: "grich", x: "external", n: "Die Tryin'", b: "Memento Mori",
    t: "The title is a condition, not a boast. Mortality is on screen the whole film: the shooting, the yard, the sense that today is allowed to be the last one. It is also what makes his focus look like obsession to everybody around him.",
    l: "You have a number of years in which this is even possible and you do not know the number. That is arithmetic rather than motivation. Most of what you are currently deciding between does not survive being asked whether it is worth a week of a finite life." },
  { s: "grich", x: "external", n: "Money Was Never the Cure", b: "False Idols",
    t: "The money arrives and the wound is exactly where it was. The film refuses him the scene where the cars fix it, because the cars never fix it, and everybody who made that film knew somebody it had not fixed.",
    l: "You are going to get some of what you are chasing and it is going to do less than you think. Better to know that now than at the other end. What is actually worth having is authorship, being the one who decides what happens next, and money is a tool for it rather than the thing." },
  { s: "power", x: "internal", n: "Two Names, One Man", b: "The Divided Self",
    t: "James runs the club and Ghost runs the distribution, and the series is the tax on holding both. Every time he commits to being only one of them, the other is what saves him, which is exactly why he never commits.",
    l: "Running two versions of yourself costs energy before either of them does anything. If you are a different person at the gym, at the desk and in your family's house, that gap is not depth, it is overhead. Pick the one you are prepared to be seen as and let the others go." },
  { s: "power", x: "internal", n: "The Legitimate Front", b: "Wanting to Be Clean",
    t: "Truth is a real club and he is genuinely good at running it. It is also the reason he can keep telling himself the other half is temporary. The legitimate part is what makes the rest survivable.",
    l: "Check what your good habit is excusing. Training hard is not a cover for anything, until the day it is the only thing you can point at. Ask whether you would still do it if the thing it lets you avoid disappeared tomorrow." },
  { s: "power", x: "internal", n: "Angela", b: "Wanting the Old Version of Yourself",
    t: "He goes after Angela partly because she knew him before, and she is the only available picture of the man he might have been. He builds the entire exit around a person, and a person cannot hold that.",
    l: "When you want somebody back, work out whether you want them or the version of yourself they remember. Nobody can carry your redemption. Handing it to them is how you lose the person and the redemption in one move." },
  { s: "power", x: "external", n: "Loyalty Is Not Symmetrical", b: "Tommy",
    t: "Tommy is loyal to Ghost. Ghost is loyal to the plan. Neither of them says this out loud for six seasons, and the whole thing detonates on the difference.",
    l: "Most betrayals are two people who never once agreed on what they owed each other. Find out what the other person thinks the arrangement is, in words, before you need it to hold. Awkward once, or a catastrophe later." },
  { s: "power", x: "external", n: "You Cannot Retire From It", b: "The Business Keeps You",
    t: "Every time Ghost announces he is out, it pulls him back. Not out of malice. He is load-bearing, and nothing load-bearing is permitted to walk away.",
    l: "Anything that only works because you are inside it will not let you go. If you want out of something eventually, build it now so it runs without you. Otherwise the exit is somebody else's decision, and they will take it later than you would have." },
  { s: "power", x: "external", n: "Kanan and Milan", b: "The Level Above",
    t: "Every time Ghost reaches what looks like the top, somebody appears who was above him the whole time and completely invisible from where he was standing.",
    l: "From where you are, the next level looks like the last one. It is not. Anybody who moves because of what they can see from their current position will be moving again shortly, and the only cure is to go and look before you commit." },
  { s: "paid", x: "internal", n: "The Quiet One", b: "Temperament as Advantage",
    t: "Ace works the dry cleaners, says almost nothing, and moves carefully. He is the least interesting person in the film to watch, and he is the only one with an ending.",
    l: "The thing people call boring about you is usually what is keeping you alive. Not needing to be seen doing it is a strategy and it is cheaper than every alternative. It also means nobody will ever congratulate you for it." },
  { s: "paid", x: "internal", n: "Mitch's Appetite", b: "Enough Was Never Named",
    t: "Mitch has the money, the name and the life, and keeps going, because at no point did he write down a figure at which he would stop. An unwritten figure is not a figure.",
    l: "Name the number now, while it is abstract and you lose nothing by being honest. If you cannot say what enough is, you will not recognise it while standing in it, and every level you reach will quietly become the new floor." },
  { s: "paid", x: "internal", n: "After the Shot", b: "The Thing That Wakes You",
    t: "Ace is shot, and it is the recovery that changes him. What was normal a month earlier reads completely differently from a bed with nothing to do in it.",
    l: "A stop is the only time you can see the shape of what you were doing. If life has handed you one, an injury, an ending, a break you did not choose, use it before you are well enough to forget what it showed you." },
  { s: "paid", x: "external", n: "Rico", b: "Karmic Debt",
    t: "Rico takes from the people closest to him, and the film follows that account all the way down without ever commenting on it. Nothing he takes stays taken.",
    l: "The account is not moral and it is not fast, which is exactly why people believe they have got away with it. What you put out comes back in a currency you did not choose, at a time you are not ready for. The only variable you control is what goes in." },
  { s: "paid", x: "external", n: "The Ones Who Came Up With You", b: "Proximity Is Not Alignment",
    t: "Three friends, one come-up, three completely different endings. Sharing a start turns out to say nothing at all about wanting the same thing.",
    l: "Look at what the people around you are actually optimising for rather than at what you have in common. History explains why they are here. It predicts nothing about where they are going, and drifting from people headed somewhere else is not disloyalty." },
  { s: "paid", x: "external", n: "Getting Out", b: "Leaving Before It Leaves You",
    t: "Ace walks away with something left. It is the rarest event in the film, and it is a decision he takes early, while leaving still looks unnecessary.",
    l: "Exits are taken early or not at all. By the time leaving is obviously right, the choice has usually been made for you and on worse terms. If you are already asking the question, you are later than you think." },
  { s: "snow", x: "internal", n: "The Smart Kid", b: "Talent Without a Governor",
    t: "Franklin is the brightest person in every room and the show makes that the problem. Intelligence is what lets him build an argument for a thing nobody should be able to argue themselves into.",

  { s: "snow", x: "external", n: "The Money Had Nowhere to Go", b: "Wealth Without Legitimacy",

    l: "Money you cannot hold is not wealth, it is exposure with a good feeling attached. Anything built outside the rules is held outside them, which means it can be taken with no recourse at all. Build the boring structure before you need it." },
  { s: "spid", x: "internal", n: "The Suit Works", b: "Power That Amplifies",

var $ = function (s) { return document.querySelector(s); };
var el = function (t, c, x) { var n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; };

/* st.last is a view, and the build before this one stored 'dark' or
   'lessons' — names VIEWS no longer has. It falls through to the first
   list, the way any stored key in this repo has to. */
var st = { last: null };
try { var raw = localStorage.getItem(KEY); if (raw) { var o = JSON.parse(raw); if (o && typeof o === 'object') {
  st.last = typeof o.last === 'string' ? o.last : null;
} } } catch (e) {}
var save = function () { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };






/* A STORY WITH NO THEMES, OR A THEME POINTING AT A STORY THAT IS NOT
   THERE, IS SILENT RATHER THAN BROKEN: the list simply comes out short
   and nothing says so. Both directions, at boot. */
(function () {
  var seen = {};
  TH.forEach(function (t) {
    if (!SRC.filter(function (x) { return x.i === t.s; })[0]) throw new Error('no story for ' + t.n);
    if (!AXIS[t.x]) throw new Error('bad axis for ' + t.n);
    seen[t.s] = true;
  });
  SRC.forEach(function (x) { if (!seen[x.i]) throw new Error('no themes for ' + x.n); });
}());

function mask(p) {
  var f = function () {
    p.classList.toggle('is-end', p.scrollTop + p.clientHeight >= p.scrollHeight - 2);
  };
  if (!p.alMask) { p.alMask = f; p.addEventListener('scroll', f, { passive: true }); }
  p.alMask();
}


function srcOf(id) { return SRC.filter(function (x) { return x.i === id; })[0]; }
function themesOf(id, ax) { return TH.filter(function (t) { return t.s === id && t.x === ax; }); }

/* ONE CARD, DRAWN ONCE. It is built the same on a story's own page and
   in the two axis lists, because two constructions of one object is how
   the two come to disagree — this repo has written that down already
   about a question asked in two places and a tag built twice. */
function card(t) {
  var d = el('div', 'al-th');
  d.setAttribute('data-x', t.x);
  d.appendChild(el('h3', 'al-tn', t.n));
  d.appendChild(el('div', 'al-tsub', t.b));
  d.appendChild(el('div', 'al-caps al-tl', 'The theme'));
  d.appendChild(el('p', 'al-tb', t.t));
  d.appendChild(el('div', 'al-caps al-tl is-les', 'The spiritual lesson'));
  d.appendChild(el('p', 'al-tb is-les', t.l));
  return d;
}

function paintFilms() {
  var p = $('#alFilmsPane'); p.textContent = '';
  SRC.forEach(function (x) {
    var b = el('button', 'al-th al-f');
    b.setAttribute('data-src', x.i);
    b.appendChild(el('h3', 'al-tn', x.n));
    b.appendChild(el('div', 'al-tsub', String(x.y)));
    p.appendChild(b);
  });
  mask(p);
}

/* ONE PAINTER, TWO AXES — the same screen reading the same list through
   one field, grouped by the story it came from, so a lesson is never
   stranded from the thing that is evidence for it. */
function paintAxis(ax) {
  var p = $('#al' + ax.charAt(0).toUpperCase() + ax.slice(1) + 'Pane');
  p.textContent = '';
  SRC.forEach(function (x) {
    var rows = themesOf(x.i, ax);
    if (!rows.length) return;
    p.appendChild(el('div', 'al-grp al-caps', x.n));
    rows.forEach(function (t) { p.appendChild(card(t)); });
  });
  mask(p);
}

function paintFilm(id) {
  var x = srcOf(id); if (!x) return;
  var p = $('#alFilmPane'); p.textContent = '';
  var lead = el('div', 'al-lead');
  lead.appendChild(el('h1', 'al-disp', x.n));
  lead.appendChild(el('div', 'al-caps', String(x.y)));
  p.appendChild(lead);
  var sh = el('div', 'al-sheet');
  for (var a in AXIS) {
    var rows = themesOf(id, a);
    if (!rows.length) continue;
    sh.appendChild(el('div', 'al-grp al-caps', AXIS[a]));
    rows.forEach(function (t) { sh.appendChild(card(t)); });
  }
  p.appendChild(sh);
  p.scrollTop = 0; mask(p);
}

var VIEWS = ['open', 'films', 'internal', 'external', 'film'];
function view(v) {
  if (VIEWS.indexOf(v) < 0) v = 'films';
  document.documentElement.setAttribute('data-view', v);
  VIEWS.forEach(function (x) {
    var n = $('#al' + x.charAt(0).toUpperCase() + x.slice(1));
    if (n) n.classList.toggle('is-on', x === v);
  });
  $('#alFoot').hidden = (v === 'open' || v === 'film');
  $('#alFilmX').hidden = (v !== 'film');
  document.querySelectorAll('.al-tab').forEach(function (b) {
    b.setAttribute('aria-current', b.getAttribute('data-v') === v ? 'true' : 'false');
  });
  $('#alFilms').querySelector('.al-count').textContent = SRC.length;
  $('#alInternal').querySelector('.al-count').textContent = TH.filter(function (t) { return t.x === 'internal'; }).length;
  $('#alExternal').querySelector('.al-count').textContent = TH.filter(function (t) { return t.x === 'external'; }).length;
  if (v === 'films') paintFilms();
  if (v === 'internal') paintAxis('internal');
  if (v === 'external') paintAxis('external');
  if (v !== 'film') { st.last = v; save(); }
}

var filmBack = 'films';
function openFilm(id) {
  if (!srcOf(id)) return;
  var now = document.documentElement.getAttribute('data-view');
  if (now !== 'film' && now !== 'open') filmBack = now;
  paintFilm(id);
  view('film');
}

document.addEventListener('click', function (e) {
  var t = e.target.closest ? e.target.closest('.al-tab, .al-pill, .al-f, #alOpenB, #alFilmX') : null;
  if (!t) return;
  if (t.id === 'alOpenB') return view(VIEWS.indexOf(st.last) > 0 && st.last !== 'film' ? st.last : 'films');
  if (t.id === 'alFilmX') return view(filmBack);
  var id = t.getAttribute && t.getAttribute('data-src');
  if (id) return openFilm(id);
  if (t.classList.contains('al-tab')) return view(t.getAttribute('data-v'));
});

view('open');
window.alDrive = { view: view, openFilm: openFilm };

}());
