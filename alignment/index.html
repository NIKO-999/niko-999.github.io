    t: "In the part on visualization Haanel describes forming a clear mental picture of what is wanted as the way thought takes shape in the outer world. The image works as a model or pattern from which circumstances are built, so a vague or shifting picture gives a vague or shifting result. He asks the reader to make the picture definite, to hold it steadily and to return to it, treating the image as something that grows more complete the more it is attended to. Visualization in his account is not daydreaming. It is directed construction, and it depends on the concentration trained earlier in the course. The picture is meant to be returned to until it is familiar.",
    l: "A goal you cannot describe cannot be held, and what cannot be held cannot be steadily attended to. Haanel's point is that definition comes before progress: make the picture of what you want clear enough that you could tell when you had it. Then keep returning to it, because a picture touched once and abandoned does little. Distinguish this from idle wishing. The mental picture is meant to be worked on, refined and kept in view while you act, with its clarity serving as the pattern your efforts are measured against. A fuzzy aim gives fuzzy effort, and the fuzziness shows up in the result." },
  { s: "mkey", x: "external", n: "Harmony of Thought and Action", b: "The Third Law",
    t: "Besides concentration and attraction, Haanel names harmonious thinking and action among the course's laws. The idea is that what a person thinks, feels and does should point the same way, and that the whole should be in accord with the larger order he describes and not set against it. Discord, such as holding one aim in thought and acting against it in conduct, or wanting a result while resenting the means, is treated as working against success, because the effort is divided against itself. Harmony is therefore a condition of the other laws working, a requirement of the course and not an optional refinement added once the rest is mastered.",
    l: "Check whether your thoughts, feelings and actions are pulling in one direction. Many people hold a goal in mind while acting in ways that quietly undo it, or pursue it grudgingly, and the book counts that internal friction as a reason for poor results. Harmony here does not mean ease or agreement with everything. It means the absence of self-contradiction in what you are trying to do. Where you find a conflict, resolve it before adding more effort, since more effort pushed through a divided intention mostly produces more of the division. Coherence is the first thing to look for, and force is the last." },
  { s: "mkey", x: "karmic", n: "Thought Becomes Condition", b: "The Return Arrives Late",
    t: "Haanel holds that habitual thought eventually becomes outer condition, and that the return is neither instant nor obviously linked to its cause. Mental conditions are the seed and circumstances the crop, and the interval between them can be long enough that a person no longer connects the two. This is why he presents the work as cumulative. A single thought does little, while a thought held steadily over time builds the character and the conditions that follow it. The account explains both the slow arrival of results from a practice and the sense, in people who have never examined their thinking, that their circumstances simply happened to them. It is also his answer to why a student should not expect instant proof.",
    l: "Results lag the thinking that made them, so judge your inner habits by where they lead over time and not by what happens this week. A pattern you have carried for years has already been producing its returns, and a new one will take a while to show. Do not mistake the delay for failure, and do not mistake a good week for proof. The book asks you to hold a settled course and let the interval pass. It also means that what you are living now is partly the record of earlier thinking, which is information you can use to adjust the next stretch instead of a verdict on you." },
  { s: "mkey", x: "karmic", n: "Fear and Worry Create Too", b: "The Law Does Not Choose",
    t: "In the book the creative power does not select what it works on. Fear, worry, resentment and doubt, held habitually, are thoughts like any other, and the same law that returns confidence returns their opposites. Haanel treats these states as destructive, weakening a person's capacity and drawing toward them the conditions that are dreaded, so the practice includes deliberately replacing them. The argument is not that a person should feel nothing difficult, but that dwelling on what is feared is a form of directing the creative faculty toward it. Courage, in this account, is partly the discipline of where thought is allowed to settle. The practice therefore treats attention as something to be steered and not merely endured.",
    l: "Worrying is not neutral preparation. In the book's terms it is rehearsal, and rehearsal feeds the process that shapes your conditions. This is not a demand to suppress concern or to pretend nothing is wrong. It is a reason to notice when thinking about a problem has turned into dwelling on the feared outcome, and to turn the attention to what you want and what you can do. Doing so repeatedly is the practice. The cost of ignoring it is that the habit of dread keeps producing the material it dreads, and does so without announcing itself, so that the pattern looks like fate." },
  { s: "mkey", x: "karmic", n: "Practice Pays Late", b: "One Part a Week",
    t: "The course was issued as twenty-four weekly lessons, and the usual advice is to read one part a week and not to hurry. Each part includes exercises that build on those before. Haanel's design reflects the belief that change comes from repetition over time and not from understanding on a single reading, and that a student who skips ahead without doing the exercises gains information and nothing else. The structure is itself a claim about how results arrive: slowly, cumulatively and in proportion to practice done. The book can be read in an afternoon, and on this view that is exactly the way it fails to work. Patience is therefore part of the method.",
    l: "Reading the book is the smallest part of using it. The text is built so that a week of practice sits between one part and the next, and the weeks are where the capacity forms. Choose a pace you can keep and keep it, expecting the early weeks to show little. If you move through quickly you will come away with a set of ideas and the same habits you began with. The claim is that you change by what you repeat, so the measure of progress is whether the exercise got done, week after week, and not how much you now understand." },
  { s: "born", x: "mindset", n: "Born to Win, Made a Winner", b: "The Capacity Is Given",
    t: "The title states the book's premise. Ziglar holds that every person is born with the capacity to win, and that winning is nonetheless not automatic. Capacity is the starting condition, and what a person does with it decides the outcome. The book separates being born to win from being a winner, and places the difference in a sequence of deliberate steps. This reframes success as something a person is equipped for and responsible for, not something handed to a lucky few. It also removes a common excuse: if the capacity is present in everyone, then a lack of results points to steps not taken and not to a missing endowment.",
    l: "You do not need to be given something extra before you can start. The book's starting point is that the capacity is already yours, and that the question is what you do with it. That cuts two ways. It takes away the explanation that others had advantages you lacked, and it takes away the comfort of waiting to feel ready. What is left is the sequence of steps and your willingness to take them. When results are missing, ask which step was skipped before you ask what you were not born with. The book treats the first question as answerable and the second as a distraction from the work." },
  { s: "born", x: "mindset", n: "Plan, Prepare, Expect", b: "A Sequence in a Fixed Order",
    t: "The book's framework has three steps in a fixed order: plan to win, prepare to win, then expect to win. Planning sets the direction, preparation builds the ability to get there, and expectation is the confidence that follows from having done both. The order matters. Expecting to win without a plan or preparation is wishful, and the book treats it as hope with nothing under it. Expectation is presented as earned by the first two steps, which is why it comes last. The framework is simple by design, and Ziglar presents it as the shape of success in any area of life, whatever the specific goal happens to be. Each step is meant to be done properly before the next is relied on.",
    l: "Check the order you work in. Many people begin with confidence, skip the plan and treat preparation as optional, and then find the confidence has nothing to rest on. The book gives you a sequence where each step makes the next one honest. Plan first, so you know what you are aiming at. Prepare next, so you have what the aim requires. Expect last, because by then expectation is a reasonable conclusion and not a mood. If your expectation feels shaky, the book's diagnosis is that one of the earlier steps is incomplete, and the fix is to finish that step instead of trying to feel more confident." },
  { s: "born", x: "mindset", n: "Expect to Win", b: "Positive Expectation, Earned",
    t: "The third step is the one most associated with Ziglar's public teaching: expecting the best. In the book, expectation is a positive outlook that builds on encouragement and hope, and it is presented as legitimate only after planning and preparing. The authors treat the positive thinker as someone who has done the work and then holds a confident view of the result, not as someone who ignores facts. Expecting to win is a way of carrying yourself into the effort, and it shapes how you act, how long you persist and how you recover from setbacks. The book keeps the attitude and the groundwork together. Hope, in this sense, is a working part of the method and not decoration.",
    l: "Expect good things, and make sure the expectation has foundations. The book separates a positive outlook that rests on a plan and preparation from one that rests on nothing, and only the first is the kind it recommends. Hold your outlook as part of the work: it affects how you show up, how you handle difficulty and whether you continue when progress is slow. Do not use optimism as a replacement for readiness. Use it as the final step, once the earlier ones are done, so that your expectation of winning can point to what you did to earn it." },
  { s: "born", x: "internal", n: "Know What You Want", b: "Wanting to Win and Beginning",
    t: "The planning section begins with wanting to win and beginning, and with knowing what you want in life. Ziglar treats desire as the first requirement and clarity as the second: a person has to want a result and also be able to say what it is. Vague wants produce vague effort, so the book asks for a definite picture of what is sought and a decision to start. Beginning is stressed as its own act, since many people want to win and never take the first step. The authors present clarity about the goal as the thing that turns a general wish into a plan that can actually be followed.",
    l: "Be able to say exactly what you want. A general wish to do better gives you nothing to plan around, and the book treats that vagueness as the first thing to remove. State the result you are after in terms specific enough that you would know when you had it. Then start, because the book treats beginning as a decision separate from wanting. The gap between people who want to win and people who begin is usually not knowledge but a postponed first step. Clarity is what makes the first step obvious, and starting is what turns the plan into something real." },
  { s: "born", x: "internal", n: "Values and Purpose", b: "The Driving Forces",
    t: "Alongside what a person wants, the book names value and purpose as the forces that fuel action. Goals describe a destination, while values and purpose explain why the journey is worth making and keep a person moving when it becomes hard. Ziglar places them within the planning step, so that a plan is built on what matters to the person and not only on what is attainable. A goal that conflicts with a person's values draws less effort and is abandoned sooner, while one that expresses a purpose draws effort from deeper sources. Knowing your values is therefore part of the plan and not an extra added to it. They answer the question of why, which the other steps leave open.",
    l: "Ask what your goal is for. A target chosen without reference to what you value tends to run out of fuel, because nothing underneath it is pushing. The book places values and purpose inside the plan for that reason: they are the source of energy that effort draws on when motivation dips. Where a goal feels hollow or you keep stalling on it, look at whether it fits what you actually care about. Adjust the goal, or your understanding of it, until the two agree. A plan that matches your values asks less willpower of you, because more of you is already pointed at it." },
  { s: "born", x: "internal", n: "Commitment and Perseverance", b: "What Desire Sparks",
    t: "Once desire and vision are in place, the book says they spark two qualities that keep a person working toward the vision: commitment and perseverance. Desire alone starts things, and it does not carry them through. Commitment is the decision to see the thing through, and perseverance is the continued effort over time and against resistance. Ziglar presents winning as dependent on these as much as on talent or opportunity, and treats them as responses a person can choose. Their role in the framework is to bridge the plan and the result, covering the stretch where the work goes unrewarded and quitting is easy. Without them, the framework's other steps are abandoned before they can pay off.",
    l: "Starting with enthusiasm is not the same as finishing. The book names commitment and perseverance as what turns desire into results, and treats them as things you do, not things you are. Decide ahead of time that you will continue through the dull and discouraging stretch, since that is where most efforts end. When the early excitement fades, you are in the part the book is written for. Persist because you chose to, and not because you feel like it. The people who win, on this account, are often those who kept going after others stopped, with desire as the spark and perseverance as the fuel." },
  { s: "born", x: "external", n: "Knowledge Gives You Power", b: "You Can Do More Than You Think",
    t: "In the preparation step Ziglar argues that you can do more than you think, and that knowledge is what makes the difference. Learning builds capability, which is why preparation starts with acquiring what the goal requires. Ability is presented as something developed and not fixed at birth, so a person who feels unable to do something has often not yet learned it. The book treats ignorance as a remediable condition and as the main practical obstacle to many goals. Knowledge converts a general intention into something that can be executed, and it widens a person's sense of what is possible for them. The claim matters because a belief in your own limits can stop effort before it begins.",
    l: "When you think you cannot do something, check whether you have learned it yet. The book's view is that capability follows knowledge, and that people often mistake a gap in learning for a limit in themselves. Find out what your goal requires and acquire it. Reading, study and instruction are the working tools of preparation, not extras for the keen. The more you learn, the more you can do, and the more you can do, the larger your sense of what you can attempt. Treat the boundary of what you believe you can do as provisional, because it moves as your knowledge does." },
  { s: "born", x: "external", n: "Practice Prepares You", b: "Readiness Is Built by Doing",
    t: "Practice is the second element of preparation in the book. After knowledge comes repetition: practice readies a person for the contest and makes what is known usable under pressure. Ziglar presents it as the bridge between understanding and performance. Knowing what to do and doing it well are separate, and the distance between them is closed by practising. The point of preparation is that when the moment arrives the response has already been rehearsed. The book treats winning as largely decided before the event, in the preparation that precedes it, which is why it places this step ahead of expectation. It is the step that turns study into skill, and the book gives it its own place in the framework for that reason.",
    l: "Knowing is not performing. The book asks you to close the gap between them through repetition, so that when the moment comes you act from practice and not from improvisation. Do the thing before it counts, as often as you can. The work that decides the result is mostly out of sight, done in preparation, and the visible performance is only the part that shows what was done there. Do not wait for the real occasion to find out whether you can do it. Rehearse until the response is ready, and your expectation of winning will have something under it other than hope." },
  { s: "born", x: "external", n: "Get the Right Advice", b: "Counsel Is Part of Preparation",
    t: "The third element of preparation in the book is getting the right advice. Ziglar holds that good advice matters because no one has all the knowledge a goal requires, and learning from those who have already done what you want to do saves time and avoids mistakes. The qualifier is right: the quality of the advice matters as much as having it. The book therefore treats the choice of whom to listen to as a decision with consequences, and presents mentors and informed guidance as a working part of preparation and not a sign of weakness. Seeking advice is shown as an act of seriousness about the goal. Who is consulted is itself part of the plan.",
    l: "Choose your advisers deliberately. The book treats advice as part of preparing, and the quality of what you get depends on whom you ask. Look for people who have done what you want to do, and listen to them in preference to those with opinions and no experience. Seeking help is not an admission that you cannot manage. It is a way of using other people's results to shorten your own path. Be equally careful about advice from the wrong sources, since it can send you the wrong way with confidence. Counsel, well chosen, belongs in your preparation as much as study does." },
  { s: "born", x: "karmic", n: "Balance Across Seven Areas", b: "Neglect Catches Up",
    t: "The book calls for balance across seven key areas of life and presents winning as becoming a more complete person, not excelling in one area at the others' expense. The authors treat the areas as connected, so neglect in one affects the rest over time. Success in a single field bought with the sacrifice of health, family or inner life is not the kind of winning the book means. Balance is the standard because the costs of imbalance arrive later and are charged to the whole life. The aim of the framework is a rounded life with results in each area, in place of a single high point. Winning is therefore measured across the whole life and not in one place.",
    l: "Look at your life as a whole and not only the area you are working on. The book names seven areas and asks for progress in all of them, because success bought by neglecting the rest tends to be paid for later. You can win in one area and lose the others slowly, and the loss is easy to miss while the one area is rewarding. Ask what you are drawing down to fund your current effort. Spread attention so that nothing essential is left to decay. A life that is strong in one place and weak in the rest is not, in this book's terms, a win, and the weaker areas eventually pull on the stronger." },
  { s: "born", x: "karmic", n: "The Power of Encouragement", b: "Belief Passed On Pays Back",
    t: "The book gives encouragement and hope a prominent place, and Ziglar draws on his own experience: early in his career a supervisor encouraged him to aim for the top of the sales ranks, and that belief changed what he attempted. The authors present encouragement as a force that raises performance, in the person who receives it and in the one who gives it. Its effect is not immediate. A word of belief at the right time can shape effort long afterwards. The book treats hope as something to be given as well as held, and as part of what expecting to win rests on. It is offered as a practical tool and not as sentiment.",
    l: "Be careful what you say to people about what they can do, and to yourself. The book's account is that belief offered at the right moment can change what someone attempts, and the effect shows up later in what they do. Give encouragement freely where it is true. Accept it when it is offered, and treat it as information about what others see in you. When your own hope runs low, look for a source of it instead of waiting for it to return. The effects of encouragement accumulate quietly, and the book wants you to see them as part of how people, including you, come to win." },
  { s: "born", x: "karmic", n: "Do Not Worry About Results", b: "Process Before Outcome",
    t: "In the section on expecting to win, the book advises not worrying about results. The reasoning is that results follow from planning and preparation done well, so attention belongs on those steps and not on anxiety about the outcome. Worry about results is treated as wasted energy that does not change them and may weaken the effort. This is not indifference to the outcome. It is a judgement about where effort has leverage: on what is under your control now, in the confidence that the result will follow in time. The delay between work and result is accepted as part of the process, and the expectation is held through it.",
    l: "Put your attention on what you can do today. The book's position is that results arrive after the work and that fretting over them in the meantime adds nothing. When you catch yourself anxious about an outcome, return to the plan and the preparation, since those are the parts you can still improve. Accept that there is a gap between effort and outcome and that it cannot be shortened by worry. Keep working inside the gap and hold your expectation steady. You will usually find that the time spent worrying is better spent on the next piece of preparation, which is what the result depends on." },
  { s: "ratm", x: "mindset", n: "Taking the Red Pill", b: "Seeing It as He Says It Works",
    t: "The red pill, borrowed from a science fiction film, is Tomassi's name for a change of view in which a man stops accepting the account of men and women that culture hands him and takes up the one the book offers. The blue pill stands for the conventional, comfortable story about how relationships and attraction work. Tomassi presents the red pill as an unwelcome clarity that costs some comfort in return for accuracy. He frames the book as an effort to describe the dynamics between the sexes without the softening of convention, and he asks the reader to test the description against experience. The view is contested, and the book states it as the author's own reading.",
    l: "Treat the red pill as a claim to be examined, not a conversion. The book's starting point is that much of what you were taught about how people pair up came from convention, and that you can check it against what you observe. Take that discipline seriously whichever way the checking comes out. Be equally willing to examine the book's own account, which is one man's reading and is disputed. What is worth keeping from the idea is the habit of asking whether you hold a belief because it is true or because it is comfortable, and then acting on the answer." },
  { s: "ratm", x: "mindset", n: "An Evolutionary Lens", b: "Different Strategies for the Sexes",
    t: "Tomassi frames attraction and mating in terms of evolutionary psychology, holding that men and women developed different reproductive strategies and that those strategies still shape behaviour today. The book reads many social habits as expressions of these underlying drives and not as purely cultural choices. This is the interpretive frame the rest of the book rests on, and it is where critics take most issue, disputing both the science and how far it extends. Tomassi presents the lens as a more honest account than the one social convention gives, and he uses it to explain patterns in dating, marriage and conflict between the sexes. The lens is the author's starting assumption and not a conclusion reached in the book.",
    l: "Notice which lens you are looking through, because it decides what you see. The book reads behaviour as driven by deep and inherited strategies, and it explains a great deal that way, which is part of its appeal and part of the risk. A framework that fits every case can make you stop checking cases. Keep the idea that biology shapes some of what people want, and hold it alongside the possibility that culture, upbringing and individual character shape a great deal more. Use the lens to ask questions, and treat the answers as hypotheses that your own observation can confirm or reject." },
  { s: "ratm", x: "mindset", n: "Rational Self-Interest", b: "A Man Keeps His Own Position",
    t: "The title signals the stance: a rational male assesses relationships and his own position in terms of his interests and the facts, and not in terms of what convention says he should feel or give. Tomassi argues that men are taught scripts about providing, pleasing and waiting to be rewarded, and that acting on those scripts without examining them leaves a man negotiating from weakness. The alternative he proposes is clear-eyed self-interest, in which a man keeps his own goals, judgement and boundaries as fixed points. He presents this as a precondition of honest dealing with others, not as hostility toward them. He frames the stance as a matter of seeing clearly and not of resentment.",
    l: "Examine the scripts you act on. The book asks you to notice where you give in advance, expecting a return that nobody agreed to, and to ask whether that is a decision or a habit. Keeping your own goals and judgement at the centre is a reasonable discipline for anyone, whatever one thinks of the book's wider claims. Treat your own interests as a legitimate input to decisions about people, and deal honestly. The aim is to stop acting from obligation you never chose, and to enter relationships as someone who could say no, which is also what makes a yes mean something." },
  { s: "ratm", x: "internal", n: "Frame", b: "The Premise You Bring Into the Room",
    t: "Frame is the central working concept. It is the underlying premise, usually unspoken, that governs an interaction: the reality that the participants are tacitly operating within. Tomassi holds that whoever's frame prevails sets the terms, and that a man who lets his own frame be absorbed into another's ends up reacting to them and not leading. Maintaining frame means holding his own view of himself and of the situation steady under pressure, testing and persuasion. The idea is presented as an internal skill concerned with composure and conviction, which shows outwardly as steadiness. Frame, in the book, begins with what a man believes about his own worth. It is a concept the rest of the book leans on.",
    l: "Know the assumptions you carry into a conversation, because they set the terms before anyone speaks. The book's view is that the person whose premise holds becomes the reference point, and that holding your own does not mean overpowering anyone, only not dissolving into theirs. Practise staying steady when someone pushes or tests you. Notice when you drop your position to keep the peace and what that teaches the other person to expect. Frame in this sense is mostly self-knowledge: a settled view of what you will and will not accept, held calmly enough that you do not have to defend it loudly." },
  { s: "ratm", x: "internal", n: "Oneitis", b: "Fixation on a Single Person",
    t: "Tomassi uses the term oneitis for a fixation on one particular woman as the only possible partner, a condition he treats as a loss of perspective. It rests on the cultural idea of a single perfect mate. In his account the fixation undermines frame, because a man who believes he cannot replace someone has given them power over him and negotiates from need. The book presents the remedy as widening his sense of options and building his own life so that no single person is its centre. It treats the condition as an illusion produced by emotion and belief, not as an accurate judgement of someone's uniqueness. The remedy is framed as perspective.",
    l: "Be wary of making any one person the single source of your sense of worth or happiness. The book calls that fixation a loss of perspective, and its practical point is that need weakens judgement: you accept treatment you would otherwise refuse and decide worse. Whether or not you accept the author's framing of relationships, the underlying caution is sound. Keep your attention on your own life, your work and your friendships, so that no relationship carries all the weight. A person you value is better valued from a position of standing, and a life with its own centre is what makes that position possible." },
  { s: "ratm", x: "internal", n: "Improve Yourself", b: "The Base of Everything Else",
    t: "Underneath the rest, Tomassi's practical advice is self-improvement. A man's value, on his account, rests on things he can build: physical condition, income and status, skill, composure and purpose. He places the effort on the inside and describes acting from his own ambitions and not from other people's reactions. The book holds that the strength of a man's frame follows from the strength of his position, so work done on himself supports everything he does in dealing with others. Improvement is not presented as a tactic but as the root condition for any of the book's other ideas to work at all. Everything else in the book is presented as resting on this.",
    l: "Put your effort into what you can build in yourself. The book returns again and again to the point that standing comes from condition, competence and direction, and that these are in your control even when other things are not. Look after your body, develop your earning power and your skills, and decide what you are working toward. These make the rest of the book's advice, on composure and boundaries, easier to act on because you have something to stand on. Whatever you think of the wider argument, this part holds up without the rest: you are better placed in every kind of dealing when you have worked on yourself." },
  { s: "ratm", x: "external", n: "Hypergamy", b: "The Core Claim",
    t: "Hypergamy is the central claim of the book: Tomassi argues that women tend to seek the highest-value partner they can attract, and that this tendency is a basic and persistent force in how partners are chosen and kept. He treats it as a biological predisposition and not a moral failing, and he uses it to explain a wide range of behaviour in dating and marriage. In his view it shapes the way women assess men, the way relationships are tested over time and the way they end. The idea is contested, with critics disputing its evidence and its generalisation, and the book presents it as the main organising principle of dynamics between the sexes.",
    l: "Read this as the book's central claim and not as established fact. If you accept it, it explains why Tomassi tells men to attend to their own value and to avoid assuming that a partner's commitment can be taken as fixed. If you do not, you can still take the narrower point that people compare and choose, and that being chosen depends partly on what you bring. Whatever your view of the theory, judge it against what you observe and against evidence outside the book. A model that explains everything deserves the most suspicion, and a reader who tests it is using the book as Tomassi asks." },
  { s: "ratm", x: "external", n: "The Sexual Market", b: "Value Is Relative and Changes",
    t: "Tomassi treats dating and mating as a marketplace in which each person carries a sexual market value that others assess and compare. The value is relative, set against others in the same market, and it moves with age, status, condition and other attributes, differently for men and women in his account. The book uses the market metaphor to explain who pairs with whom and why the terms of attraction shift across a life. It is a descriptive model in the author's telling, meant to replace the idea that attraction is a matter of personality alone. Critics object that it reduces people to ratings, and the model should be read as the author's framing.",
    l: "Notice that you are being compared whether or not you agree with the premise. The book's practical message is that value is not only inherent and is made of things you can influence, so the useful response is to improve your standing in the areas you control. You can also use the model's bluntness as a prompt to ask what you offer and what you want, and whether the two are realistic. Do not let it turn people into numbers in your own mind, which is the criticism the book itself invites. Use the idea to work on yourself, and keep the people around you as people." },
  { s: "ratm", x: "external", n: "The Feminine Imperative", b: "Social Convention Has an Interest",
    t: "Tomassi describes a social order that he calls the feminine imperative, by which he means the set of conventions, institutions and expectations that he says tend to serve women's interests and to channel men toward serving them. In his argument the order shapes the advice given to men, the stories told about dating and marriage and the definitions of acceptable male behaviour. He presents it as the outer counterpart of hypergamy, a social structure that expresses the same interests at scale. The notion is among the most contested in the book, with critics rejecting its premise that society broadly favours women, and it is the author's claim and not a neutral description.",
    l: "Ask who benefits from the advice you are given. The book asks you to consider that cultural messages about what men should be and do may serve interests that are not yours, and to test them before adopting them. That is a sensible habit for any group of advice, and it does not require accepting the author's reading of whose interests are at stake. Be equally alert to the possibility that the same suspicion applies to the book itself. Look at the claims, weigh the evidence and decide for yourself, instead of taking a framework, from any direction, because it says what you already suspected." },
  { s: "ratm", x: "karmic", n: "The Cost of the Script", b: "Rewards That Do Not Arrive",
    t: "Tomassi holds that a man who follows the conventional script, being agreeable, providing and waiting to be rewarded for good behaviour, will find the payoff arriving late or not at all. In his account the script teaches men to expect a return for conduct that was never exchanged for one, and the unmet expectation produces disappointment and resentment over time. The loss builds slowly and is often attributed to bad luck or to the other party instead of to the premise. The book presents this delayed cost as the reason to reconsider the script early. It is the author's claim about patterns in men's relationships, drawn from his own observation.",
    l: "Watch for effort you make in expectation of a return that nobody agreed to. The book's account is that this pattern builds a debt of resentment over time, and that the person who stored it blames the other person when it comes due. If you give, give freely and for its own sake, or state what you want in exchange. Check periodically whether your expectations of other people were ever expressed to them. The lesson holds well beyond the book's subject: unspoken bargains tend to end in grievance, and the earlier you notice you are keeping accounts nobody else agreed to, the less it costs." },
  { s: "ratm", x: "karmic", n: "Frame Lost Is Hard to Retake", b: "Concessions Compound",
    t: "In the book's account frame is lost gradually, through a series of small concessions made to avoid friction, and each concession teaches the other person where the limits are. Once a pattern of yielding is established, Tomassi argues, it is hard to reverse, because the other party has adjusted to the new terms and resists a change back. The cost of early concessions is therefore larger than it seemed when they were made. The point is presented as a warning about the arithmetic of habit: what is allowed once is expected afterwards. It rests on the author's observation of how relationships settle into patterns, and the book does not offer it as a measured finding.",
    l: "Small concessions set precedents. The book's claim is that patterns of giving way are easier to avoid than to undo, so the moments to be careful are the early and minor ones, when yielding seems cheap. This applies in many settings besides the one the book has in mind, including work and family. Decide what you will not trade before the pressure arrives. Concede deliberately and on the merits, not to buy quiet. If you are already in a pattern you do not want, expect that changing it will meet resistance, and plan to hold steady through that stage rather than treating the resistance as proof you were wrong." },
  { s: "ratm", x: "karmic", n: "Time Changes Value", b: "Building Early Pays Late",
    t: "Tomassi's market model includes change over time. He argues that value moves across a lifetime, and that the movements differ between men and women, so that choices made early about conditioning, income and standing have consequences that arrive years afterwards. In his telling a man's capacity to build value can extend over decades, and the investment made when he is young pays off late. The book uses this to press the case for self-improvement now and to warn against complacency later. The claims about how value shifts with age are contested and are the author's reading of patterns in dating and marriage. The argument is about timing as much as effort.",
    l: "Think in decades. The book's argument is that what you build now compounds and that neglect also compounds, and the general point about habits holds whatever you make of its specific claims about age and attraction. Work on your health, skills and finances early, because the gains arrive later than the effort. Treat the passage of time as something that acts on your position whether or not you act. The reasonable use of the idea is not to fear ageing but to put steady effort into what will still count decades from now, since the returns on that effort are slow and so need to be started early." },
  { s: "hmw", x: "mindset", n: "Financial Illiteracy Is the Problem", b: "Not Understanding Money Is Costly",
    t: "The book begins from the claim that financial illiteracy is a widespread and serious problem. The authors treat not understanding how money works as the root of much of what goes wrong with personal finances, including persistent debt and poor spending. Their word sucker names the person who pays for that gap, the one who does not understand the rules and so ends up on the losing side of them. The framing is deliberately blunt, and the book is short and plain on purpose, so that the point reaches readers who have never studied money. The premise is that the problem is knowledge and outlook before it is income, and that both can be changed.",
    l: "Treat not knowing how money works as a problem you can fix, because the book places the cost of that ignorance on the person who has it. Many people carry a vague sense that money is complicated and leave it alone, and the result is that others make the decisions that matter. The word the authors use is blunt, and the point behind it is practical: gaps in understanding get charged to you. Start from the assumption that the basics are learnable and that you are able to learn them. The first step is to stop treating financial confusion as normal and start treating it as something with a remedy." },
  { s: "hmw", x: "mindset", n: "Change Your Outlook on Money", b: "Thinking Comes Before Handling",
    t: "The first of the authors' tips is to change your outlook on money. They treat outlook as the starting point of financial behaviour: how a person thinks about money shapes what they earn, spend, save and expect, and a poor outlook produces poor results whatever the income. The book does not present outlook as a matter of attitude alone, since it sits beside education and action. It presents it as the layer underneath, and changing it is shown as work that has to be done deliberately, because an existing view tends to persist unless it is examined. The authors keep the message simple so that the shift in thinking is clear.",
    l: "Look at what you currently believe about money, because that belief is already deciding what you do with it. If you think of money as scarce, frightening or somebody else's business, your behaviour will follow that view. The book asks you to examine the outlook before adjusting the habits, since habits tend to return to whatever the underlying view supports. Do this deliberately. Ask what you expect from money and what you assume is possible for you, and test those assumptions against what financially successful people actually say and do. A changed view will not fix your finances alone, though without it the other changes rarely hold." },
  { s: "hmw", x: "mindset", n: "Raise Your Expectations", b: "The Ceiling You Set",
    t: "Another of the authors' tips is to raise your financial expectations. The idea is that what a person expects from their finances sets a limit on what they pursue, so low expectations produce low effort and a modest outcome that then seems to confirm the expectation. The book treats the habit of settling as learned, and pushes the reader to ask for more of their financial life. This is a point about aim and not about wishing. Expectations decide which options are even considered, which advice is taken seriously and how much risk or effort feels reasonable. Raising them widens the range of what a person will attempt. The authors present this as a choice a reader can make on purpose.",
    l: "Notice what you have quietly decided is enough. The book's claim is that expectations act as a ceiling, because you rarely pursue what you do not expect to get. Set your financial aims higher than your habits currently support, and treat the gap as the work to be done and not as proof the aim is unrealistic. This does not replace education or discipline. It decides where they point. Check also whether your expectations came from your own judgement or from what people around you consider normal. If it is the second, you are living inside someone else's ceiling and can lift it by choosing a better reference." },
  { s: "hmw", x: "internal", n: "Foolish Spending", b: "The Habit Behind the Balance",
    t: "Foolish spending is one of the three patterns the authors name as part of the cycle they want readers to break, alongside endless debt and financial cluelessness. They treat it as a habit and not a one-off error: spending without a plan, repeated until it becomes how a person lives. The book places the cause partly in outlook and knowledge, since someone who does not understand money tends to spend without a purpose. The remedy it points to is a different relationship with money, supported by budgeting, and not simply a stricter rule about what may be bought. The pattern is the target, and the single purchase is only where it shows.",
    l: "Look at what your spending is for. If money leaves without a plan behind it, the pattern is the problem and not any single purchase. The book treats foolish spending as the visible end of a lack of purpose and understanding, so the fix starts earlier than the shop. Decide what you want money to do, and let that decision sort what is worth buying. A budget is the working tool for this, and its use is to make the plan visible. Expect that changing the habit will feel like a loss at first, and keep in view what the money is being kept for." },
  { s: "hmw", x: "internal", n: "Financial Cluelessness", b: "Not Looking Is a Choice",
    t: "The third pattern the authors name is financial cluelessness: not knowing what you earn, owe, spend or are building toward, and leaving it unexamined. The book treats it as a state that people stay in because looking feels uncomfortable, and one that leaves decisions to chance and to other people. It ties cluelessness to the sucker of the title, since the person who does not look is the one who is easiest to take advantage of. The way out in the book is plain: educate yourself, pay attention to your own numbers and ask questions of people who understand more. The state is presented as common and as reversible with attention.",
    l: "Find out where you stand. Not looking at your own figures feels like relief, and the book treats it as the thing that keeps people cut off from control of their money. Take the discomfort as the sign that you are near what needs attention, and look anyway. Know what comes in, what goes out and what you owe. Once the numbers are in view, decisions that were drifting become choices, and questions you could not form become answerable. Clueless is a description of where you are at present, not of what you are, and attention is what changes it. Do it without punishing yourself for what you find." },
  { s: "hmw", x: "internal", n: "The Debt Cycle", b: "Endless Because It Repeats",
    t: "The authors describe debt as a cycle and not a one-time problem: borrowing, paying down and borrowing again without anything underneath having changed. Their aim is to help readers break the cycle of endless debt, which means treating the pattern and not just the balance. They link it to the other two patterns in the book, foolish spending and cluelessness, since each feeds the others. A person who spends without a plan and does not look at the numbers borrows to cover the gap, and the borrowing then limits what they can do next. The book presents the cycle as one that can be ended by understanding it and changing the habits that produce it.",
    l: "If you pay debt down and find it comes back, the cause is the pattern and not bad luck. The book asks you to look at what produces the borrowing: how you spend, what you know and what you expect. Clearing a balance without changing those is treating a symptom. Work on the habits that fed the debt, and keep the clearing alongside that work. Expect progress to be slow while the old pattern is still available to you. The point of understanding the cycle is that it becomes breakable: once you can see the loop, you can choose where in it to intervene, and the earlier the better." },
  { s: "hmw", x: "external", n: "Educate Yourself", b: "Understand How Money Works",
    t: "Education is the practical centre of the book. The authors advise readers to educate themselves about money, covering the basics of budgeting, investing and building wealth in plain terms. The reasoning is that financial outcomes follow understanding, and that most people were never taught how money works. The book is short and illustrated so that it can serve as an entry point for readers who find the subject forbidding. It presents self-education as ongoing and within reach, and as the way a person stops being the one others profit from. The authors treat learning as a precondition for the other tips, and it is the lever they most want the reader to pull.",
    l: "Learn the basics, and keep learning. The book's position is that most people were never taught how money works and are left to manage it by guesswork. You can fix that on your own initiative. Start with the plain subjects: how a budget is made, what investing is and how wealth is built over time. Then keep going, since the book treats education as continuing and not a single sitting. Be selective about your sources and hold them to the standard of whether the person teaching has done what they teach. Understanding does not make you rich by itself, but it stops you being easy to mislead, which is the larger part." },
  { s: "hmw", x: "external", n: "Learn from the Financially Successful", b: "Who You Spend Time Around",
    t: "One of the authors' tips is to meet financially successful people. The idea is that outlook and knowledge are learned from the people around you, and that someone who wants to understand wealth should spend time with those who have built it. Contact gives access to how successful people think and what they do, which a book or a course can only describe. It also challenges the assumptions a person already holds about money, which are often shared by the people they live among. The book treats the choice of company as part of the work of changing outlook and raising expectations, and as a deliberate step and not a matter of chance.",
    l: "Spend time near people who are where you want to be financially, and pay attention to how they talk about money. The book treats company as a teacher: what you hear around you becomes what you consider normal. If everyone near you shares your current assumptions, there is nothing to challenge them. Seek out people whose results you respect, ask them questions and notice what they take for granted that you do not. Do this with the aim of learning and not of asking for favours. Choosing your company is a form of education, and it also resets what you believe is possible for you." },
  { s: "hmw", x: "external", n: "Look Beyond Traditional Savings", b: "Untraditional Approaches",
    t: "The authors recommend trying untraditional approaches to saving. The suggestion is that the usual routes are not the only ones and may not be the most effective, and that a reader who wants a different result should be willing to look at different methods. The book offers this as one of its brief tips and does not claim to replace the other advice. It connects to the wider message that accepting the default financial path without understanding it leaves a person with defaults they did not choose. Being open to other methods follows from education and a changed outlook, since both widen what a person is prepared to consider. The tip is offered briefly and is meant to open a question, not to close one.",
    l: "Do not assume the conventional way of saving is the only way. The book asks you to look at other methods, and to judge them on how well they work for you. That needs the education the book also recommends, so that you can tell a good alternative from a poor one. Be curious and sceptical together. Check any unfamiliar approach against people who understand it and against what it actually does with your money. The point is not to be unusual for its own sake. It is to stop accepting defaults because they are defaults, and to choose methods because you understand why they suit your situation." },
  { s: "hmw", x: "karmic", n: "Debt Compounds", b: "The Cost Grows While You Wait",
    t: "Underlying the book's concern with debt is the idea that financial mistakes grow over time. A cycle of endless debt gets harder to leave the longer it runs, and a pattern of foolish spending leaves less to build with each year. The authors treat the delay between the habit and its full cost as the reason people underestimate it: the early stages feel manageable and the later ones are not. The point cuts the other way too. Habits that build wealth also work slowly and show their results late. The book uses the delay to argue for starting early and for treating small, steady choices as important. The point is about the shape of the cost over time, and not only its size.",
    l: "The cost of a money habit is not paid when you form it. It builds quietly and arrives later, which is why careless habits feel harmless and why good ones feel pointless at the start. Judge your habits by where they lead over years and not by this month. If you have debt or loose spending, the longer it runs the more it takes, so act sooner than feels necessary. If you are building something, expect little to show for a long time and keep going. The book's lesson on time is that small steady choices are doing real work, and that postponing them is itself a decision with a price." },
  { s: "hmw", x: "karmic", n: "Suckers Pay Later", b: "The Bill for Not Knowing",
    t: "The word sucker in the title names a position the book says people reach by not understanding money. The cost of that position is not always visible at the time. A person who does not read the terms, ask questions or follow their own finances pays through bad decisions and missed opportunities that accumulate. The authors present the bill as arriving after the fact and as paid by the person who did not know. The book's answer is to remove the ignorance that produces it. That is why its advice is education, attention and learning from people who know more, and not shortcuts or tricks. The price of not knowing is real, and it is paid late.",
    l: "Ignorance has a price, and it is usually paid later and without a receipt. The book asks you to see that what you did not learn, did not check and did not ask about is quietly costing you now. You will rarely be told that this is happening. The practical conclusion is to treat understanding as protection: read what you agree to, follow your own money and question what you do not follow. Do this before the cost arrives and not after. The word the authors chose is meant to sting, and its use is to make the price of not knowing visible while you can still change it." },
  { s: "hmw", x: "karmic", n: "Wealth Is Built Over Time", b: "Slow Work, Late Return",
    t: "The book treats building wealth as a process and not an event. It names budgeting, investing and building wealth as the things to learn, and each of these works over a long period. Results from sound habits are slow to appear and then become large, while the effects of poor ones arrive late too. The authors use this to argue that financial change should start now and be maintained, and that the right attitude toward it is patience combined with steady action. A short book cannot show that long arc, and it points the reader toward it by stressing education and outlook, which are what make the long work possible.",
    l: "Expect wealth to be built slowly and plan for it as a long project. The book asks you to learn the basics and begin, rather than to wait for a large sum or a clever move. Small, steady actions compound, and their effects appear well after you start. This should change how you judge progress: a quiet year of good habits is real work even when it looks like nothing. Be patient with the stretch before results show. Impatience is what drives people toward shortcuts, and shortcuts are where the book says people become suckers. Start now, keep going, and let the time do its part." },
  { s: "mtough", x: "mindset", n: "The Great Ones Think Differently", b: "World Class Is a Way of Thinking",
    t: "The premise of the book, signalled in its subtitle about the thought processes, habits and philosophies of the great ones, is that top performers think and behave differently from average people. Siebold treats the difference as one of mind before talent, circumstances or luck: the way world-class people interpret events, respond to difficulty and set their aims is what separates them. He presents the contrast as a practical one that can be studied and copied, and he offers the book as a catalogue of the specific ways the great ones think. Excellence is therefore treated as having mental causes that an ordinary person can learn to use. The claim is the author's own and is offered as the organising idea of the whole book.",
    l: "Look at how you think before you look at what you lack. The book's claim is that the gap between world-class performers and average ones lies mostly in thought processes and habits, and those can be changed. That removes the comfortable explanation that excellence is a gift you were not given. It also means you can examine your own responses to setbacks, pressure and opportunity and compare them with how top performers respond. Treat the comparison as information and not as a verdict. What matters is which habits of mind you are willing to replace, since the book places the difference there and not in what you were born with." },
  { s: "mtough", x: "mindset", n: "Mental Toughness Is Trained", b: "A Skill, Not a Trait",
    t: "The book treats mental toughness as a capacity that is built and not a trait that some are born with. Siebold calls the contents of the book thought processes, habits and philosophies, and each of those words implies something learnable: ways of thinking that are practised until they run automatically. As a coach he presents toughness as the result of deliberate mental discipline repeated over time. This frames the reader's current level as a starting point. The practical implication is that improvement is possible for anyone willing to work on how they think, and that the work is a matter of training and not of waiting for temperament to change.",
    l: "Your present level of mental toughness is where you are, not what you are. The book treats toughness as a skill that comes from practised habits of thought, so it responds to training in the way any skill does. Pick the habits you want and repeat them until they stop needing effort. Expect to be weak at them at first, and treat that as ordinary. Do not wait to feel tough before acting tough. The book's view is that the feeling follows the practice, which means the most useful thing you can do is begin with small, repeatable disciplines of thought and keep them up." },
  { s: "mtough", x: "mindset", n: "One Lesson at a Time", b: "177 Short Ideas",
    t: "The book is built from 177 short lessons, each a self-contained idea, and each comes with a brief explanation and suggested actions. The form is deliberate: a reader is meant to take one idea, understand it and apply it, and does not need to read the book in sequence. It presents mental toughness as made of many small shifts in thinking and not one large insight. The structure also suits repeated use, since the lessons can be revisited as needs change. The method rests on the premise that change in thinking happens by concentrating on one idea at a time, and by acting on it before moving to the next.",
    l: "Take the book in small pieces. Its form says that mental toughness is the sum of many small changes in how you think, and that you will get further by absorbing one idea and acting on it than by reading the whole thing and acting on none. Choose a lesson, understand it and do what it suggests. Come back to others as you need them. Do not treat the number of lessons as a target to finish. The measure is how many you have changed a behaviour for. A few ideas applied consistently will do more for you than all of them understood once." },
  { s: "mtough", x: "internal", n: "Manage Emotions, Do Not Suppress Them", b: "Control Without Denial",
    t: "Siebold's treatment of emotion is that mentally tough people manage their emotions and do not suppress them. Suppression pushes feeling out of sight and leaves it operating; management means noticing the emotion, understanding what is producing it and choosing how to respond. The book treats emotional control as central to performance, since fear, frustration and discouragement are the things that disrupt action under pressure. The goal is not to feel less but to remain able to act whatever is felt. Emotions are treated as information and as a force that can be directed, and mastery of them is one of the book's main marks of the world-class. The distinction is the author's own and recurs through many of the lessons.",
    l: "Do not confuse toughness with feeling nothing. The book's position is that the great ones manage emotion, which means they feel it, understand it and decide how to act. If you push feelings down, they come back sideways. If you let them decide, they run you. The skill is in between: name the emotion, ask what it is telling you and choose your response. Practise on small irritations so that the habit is there for large pressures. Your aim is to keep your ability to act intact while you feel what you feel, and that ability is trainable like any other." },
  { s: "mtough", x: "internal", n: "Fear of Failure", b: "The Largest Obstacle",
    t: "One summary of the book reports that Siebold treats fear of failure as the single greatest obstacle to success. The idea is that most people hold back, not from lack of ability, but from fear of what failing would mean, and that this fear stops them attempting what they could do. The book's answer is to change the meaning of failure so that it is part of the path and not a verdict. Mental toughness in this account includes being willing to fail, to feel the discomfort of it and to continue. Fear is something to face and act through, since waiting for it to go away is waiting for something that does not leave.",
    l: "Ask what you are not attempting because you are afraid it will not work. The book's claim is that fear of failure stops more people than lack of ability does, and that it does so quietly by making inaction feel prudent. Redefine failure in your own mind as information you pay for in order to improve. Then act while the fear is still present, because it does not go first. Start with attempts small enough to survive, and widen as your tolerance grows. The aim is not to stop being afraid. It is to stop letting the fear make your decisions, since it is not a reliable guide to what you can do." },
  { s: "mtough", x: "internal", n: "Take Personal Responsibility", b: "Own Your Emotions, Reactions and Results",
    t: "Responsibility is a central theme in the book: mental toughness involves taking personal responsibility for your emotions, your reactions and your results. Siebold treats blame, whether of other people, circumstances or bad luck, as a way of giving away control. Owning the outcome, including the part that was not entirely your doing, keeps the ability to change it. The three things named are distinct. Emotions are yours to manage, reactions are yours to choose, and results are yours to answer for. The book presents this as a working stance of strong performers and not as a moral burden, because it is what makes action possible. It is the stance the author treats as the base for most of the other lessons.",
    l: "Notice where you hand responsibility to someone or something else, because that is where you give up your ability to change things. The book asks you to own your emotions, your reactions and your results. This does not mean everything is your fault. It means you stop treating the part you can influence as outside your control. When something goes wrong, ask what you can do now, whatever caused it. Blame can feel good, though it costs you the lever. Take the stance that your results are yours to improve, and you will find more options than you could see while you were looking for someone to hold accountable." },
  { s: "mtough", x: "external", n: "Abundance Over Scarcity", b: "The Mindset Behind Risk",
    t: "One of the recurring ideas in summaries of the book is that champions operate from a mindset of abundance and not scarcity. A scarcity view treats opportunity and resources as limited, and produces caution, defensiveness and protection of what is already held. An abundance view treats them as plentiful, and allows more risk, because losing one chance is not catastrophic when others will come. Siebold presents the difference as one of belief that shapes behaviour: those who see plenty act boldly, while those who see shortage hold back. It is one of the thought processes that, in his account, separates the world-class from the average. The author presents it as one of the clearest dividing lines between the two groups.",
    l: "Check whether you are acting from a sense of plenty or a sense of shortage. If you believe chances are rare, you will protect what you have and pass up risks that would have helped you. If you believe they are plentiful, you can afford to try and lose. The book treats this belief as something you can change, since it is a way of thinking and not a fact about your position. Look at the decisions you avoid and ask what you are assuming about scarcity. Test the assumption against evidence, and act where it fails. A wider view of what is available changes how much risk you are willing to take." },
  { s: "mtough", x: "external", n: "Focus on What Matters Most", b: "Energy Directed at the Top Goals",
    t: "Another theme reported in summaries is that world-class performers direct their mental energy toward their most important goals. The point is about concentration of effort: attention and energy are limited, and those who achieve most spend them on a small number of aims and not on everything that presents itself. Siebold treats focus as a thought process, a decision about what to ignore as much as what to pursue. In this account average performers scatter their energy over many concerns and achieve moderate results across all of them. The great ones decide what matters most and arrange their thinking and time to serve it. The author treats the discipline of choosing as harder than the discipline of working.",
    l: "Decide what matters most and spend your best energy there. The book's position is that attention is limited and that people who excel are those who aim it, which means deliberately neglecting some things. Identify the few goals that would change your life most and let them take priority in how you think and how you use time. Notice what you give attention to out of habit or pressure that does nothing for them. Say no to those things without apology. Focus is a choice about what you will not do, and that choice is what makes the rest of your effort count." },
  { s: "mtough", x: "external", n: "Excellence Has Parts", b: "Success Can Be Broken Down",
    t: "The book proceeds from the idea that excellence is made of identifiable parts. Siebold breaks the thinking and habits of top performers into 177 separate lessons, each a distinct factor, with a short explanation and suggested actions. The premise is that the world rewards particular ways of thinking and behaving, and that these can be listed, understood and adopted one by one. This treats success as something with causes that can be examined and not as a mystery. The format reflects the claim: if the factors behind excellence can be separated, a reader can work on them in turn, and progress is made by adopting parts and not by trying to become a different person all at once.",
    l: "Success is made of parts, and you can work on the parts. The book breaks excellence into many specific ways of thinking and acting, so you do not have to change everything at once. Pick one factor, understand it and act on it. Then pick another. Over time the accumulation changes how you operate. This should make the project of improving yourself feel less vague: you are not trying to become someone else, only to install one specific habit at a time. Look at which parts of how world-class people operate are missing in you, and begin with the one that would matter most." },
  { s: "mtough", x: "karmic", n: "Habits Compound", b: "Small Disciplines, Large Differences",
    t: "The book speaks of habits as well as thought processes, and treats the habits of the great ones as what separates them over time. A habit repeated daily is small in each instance and large in total, and the difference between world-class and average performers builds up gradually from many such repetitions. Siebold presents the reward for mental discipline as arriving late: the early stages show little and the effect becomes visible only after a long period. This explains both why most people give up before the result and why those who stay appear to others to have achieved something sudden. The account places the cause in repetition. The point is that the cause of a large difference can be very small each day.",
    l: "What you repeat is what you become, and the effect is slow. The book asks you to build habits of thought and action and to keep them up through the stretch where nothing seems to change. Do not judge a habit by one week. The difference between you and the people you admire was probably built from small disciplines kept for a long time, and it looked sudden only from outside. Choose a few daily practices that you can sustain, and expect the return to come late. The people who reach the result are, in this view, the ones who did not stop at the point where it looked as if nothing was happening." },
  { s: "mtough", x: "karmic", n: "Avoided Failure Costs More", b: "The Price of Staying Safe",
    t: "If fear of failure is the greatest obstacle, then what it costs is the thing the book wants the reader to see. A person who avoids failing avoids attempting, and the loss is the results that attempt would have produced, which is not visible at the time. The cost accumulates: years of avoided attempts leave a person where they began, with the added weight of what was not done. The book's argument is that the price of avoiding failure is paid later and is larger than it looks. It uses this to move the reader from asking what they might lose to asking what they are already losing by holding back.",
    l: "Staying safe is not free. What you avoid trying is a cost, and it is paid later, in results you never had. Ask what the last few years of caution have produced, and compare them with what a few failed attempts would have taught you. The book asks you to see that you are already paying for your fear, in the form of things not done. Failing is visible and embarrassing, while avoidance is invisible, which is why people choose it. Treat a failed attempt as a payment toward learning, and treat a year of avoidance as a payment toward nothing. Then decide which one you would rather make." },
  { s: "mtough", x: "karmic", n: "Responsibility Returns Control", b: "Ownership Pays Over Time",

  $('#alNav').hidden = (v === 'open' || v === 'source');
  $('#alSourceX').hidden = (v !== 'source');
  document.querySelectorAll('.al-tab').forEach(function (b) {
    b.setAttribute('aria-current', b.getAttribute('data-v') === v ? 'true' : 'false');
  });
  kick('#alBooks', COUNT.book, 'books · ' + COUNT.bookTh + ' themes');
  kick('#alLaws', LAWS.length, 'laws');
  if (v === 'books') paintIndex(v);
  if (v === 'laws') paintLaws();
  if (v === 'kept') paintKept();
  if (v !== 'source') { st.last = v; save(); }
}

var sourceBack = 'books';
function openSource(id) {
  if (!srcOf(id)) return;
  var now = document.documentElement.getAttribute('data-view');
  if (now !== 'source' && now !== 'open') sourceBack = now;
  paintSource(id);
  view('source');
}

document.addEventListener('click', function (e) {
  var t = e.target.closest
    ? e.target.closest('.al-tab, .al-f, .al-stop, .al-mk, .al-row, #alOpenB, #alSourceX') : null;
  if (!t) return;
  var m = t.getAttribute && t.getAttribute('data-mk');
  if (m) return mark(m, t.getAttribute('data-k'));
  var stop = t.getAttribute && t.getAttribute('data-st');
  if (stop) { st.stop = stop; save(); return paintKept(); }
  if (t.classList.contains('al-row')) return toggle(t);
  if (t.id === 'alOpenB') return view(VIEWS.indexOf(st.last) > 0 && st.last !== 'source' ? st.last : 'books');
  if (t.id === 'alSourceX') return view(sourceBack);
  var id = t.getAttribute && t.getAttribute('data-src');
  if (id) return openSource(id);
  if (t.classList.contains('al-tab')) return view(t.getAttribute('data-v'));
});

/* THE FIGURES ON THE FIRST SCREEN ARE WRITTEN FROM THE DATA. The title
   and the paragraph under it said "seventeen" and "three hundred and
   five" by hand, and were wrong for a day after a source came out —
   nothing read them. A line of figures in the label register is what the
   reference does with a number anyway, and digits a check can read. */
$('#alOpenK').textContent = COUNT.book + ' books · ' + LAWS.length + ' laws · ' + TH.length + ' themes';

view('open');
/* views() rather than a list the probes keep their own copy of: two of
   them drove view('light') and view('lessons') for months — names
   renamed out from under them, which view() falls through to 'books'
   on — so one screen was measured three times and reported a pass. */
window.alDrive = { view: view, openSource: openSource, mark: mark, st: st, thOf: thOf,
                   views: function () { return VIEWS.slice(); } };

}());
</script>
</body>
</html>
