      ["Where it operates", "The first expression of interest, in person or in writing. Moments after a rejection or a cooling-off. Established relationships, where one person keeps pressing for more attention or commitment than the other offers freely. Friendships that have become uneven. And the quiet habit of rehearsing the case you would make if you were challenged."],
      ["How you can tell", "You are keeping the law when your statements of interest are short, direct and not followed by a defence. You are breaking it when you explain why you would be a good choice, raise the matter again after an answer has been given, or adjust yourself in response to each sign of doubt. A useful marker is whether you could accept the answer without arguing with it."],
      ["What it is not", "It is not a technique for appearing indifferent or a licence to be blunt without care. It is not a rule against effort, courtesy or romance. It is not a reason to disregard what the other person says they feel. It does not promise they will respond as you hope. It asks only that you be clear and that you let the response be what it is."]
    ] },
  { n: "Law of Independent Purpose", b: "A Life of Your Own",
    r: [
      ["The law", "Your purpose, health, friendships, work and ambitions should stand on their own and not depend on your dating life. The law of independent purpose says a person who has a life they are invested in brings something real to a relationship, and a person whose life is organised around being chosen brings need. The point is not to look busy. It is to be busy in ways that matter to you."],
      ["How it works", "A life with its own centre is stable. Your mood, your sense of direction and your standing in your own eyes do not swing with every reply or silence. That stability is not a tactic. It follows from having things that you care about and spend time on, and it shows in how you carry yourself. When a relationship is the only thing holding a life together, every disagreement threatens the whole structure and every sign of distance becomes an emergency. Judgement suffers, standards slip and the other person is asked to carry weight they did not agree to carry. Independent purpose spreads the weight across many things, so that dating is one part of a full life and not its foundation."],
      ["Genuine and staged", "The law is easy to counterfeit. A person can stay unavailable on purpose, mention a busy schedule or manufacture scarcity in order to seem desirable. That is a performance, and it is still organised around the other person's reaction. The law asks for something different: a life you would be living whether or not anyone was watching. The difference shows over time, because a staged life has to be maintained for an audience and a real one does not."],
      ["Where it operates", "Time and attention, and where they go. Physical health and fitness. Friendships that are kept up and not dropped when a relationship begins. Work and long-term aims. Interests that belong to you alone. And the question of what you would do with a free evening if no one were available to spend it with."],
      ["How you can tell", "A person with an independent life can name what they are working toward apart from dating, and has commitments that continue when a relationship is going badly. A person without one reorganises their week around another person's availability, lets friendships and goals lapse and feels empty when attention is withdrawn. The marker is what remains when the relationship is removed."],
      ["What it is not", "It is not a pretence of being busy, a policy of keeping people at a distance or a way to create scarcity. It is not a refusal to make room for another person in your life. It is not a claim that relationships should come last. A good relationship changes a life and takes a share of it. The law says only that it should be added to something that already stands."]
    ] },
  { n: "Law of Self-Command", b: "Control Yourself, Not Them",
    r: [
      ["The law", "You can govern your own emotions and responses, and you cannot govern another person. The law of self-command says to put your discipline where it has an effect: on your reactions, your timing and your standards, and not on trying to steer what the other person feels or does. Delayed replies, rejections and mixed signals should not set your mood for the day."],
      ["How it works", "Emotion arrives first and action follows, and the gap between them is where discipline operates. A delayed reply produces anxiety, a rejection produces hurt and a mixed signal produces confusion. None of these can be avoided. What can be chosen is the response. A person who reacts at once sends messages in a rush, demands explanations and makes decisions from the worst of the feeling. A person who responds deliberately waits until the feeling has settled, then acts from judgement. Trying to control the other person is the same mistake from the opposite side: it spends effort on something outside your reach, usually produces resistance and leaves your own state unmanaged. Self-command moves the effort back to where it can work."],
      ["Discipline and suppression", "Self-command is not the same as pretending you feel nothing. Feelings that are denied do not go away, and a person who hides them from themselves is often governed by them without knowing it. The discipline is in acknowledging the feeling, understanding what set it off and choosing what to do next. You are allowed to care. What the law removes is the automatic link between caring and acting."],
      ["Where it operates", "Waiting for a reply and what you do while you wait. The first hours after rejection. Moments of jealousy, doubt and insecurity. Arguments, where the pull to say the cutting thing is strongest. Efforts to manage how another person sees you. And the temptation to test people, to see how they react to your silence."],
      ["How you can tell", "You are exercising command when you can feel strongly and still choose when and how to speak, and when a bad answer changes your evening and not your week. You are not when your mood follows the other person's messages, when you act within minutes of being hurt and regret it later, or when you find yourself planning how to make them respond differently."],
      ["What it is not", "It is not indifference, and it does not say you should hide that you care. It is not suppression, coldness or a pose of calm. It is not a technique for influencing the other person through your composure. It does not say that other people's actions have no effect on you. It says that the choice of response stays with you."]
    ] },
  { n: "Law of Consistent Action", b: "Attention Is Not Attraction",
    r: [
      ["The law", "Attention and attraction are different things, and the difference shows over time in what a person does. The law of consistent action says to read others by their repeated behaviour, their mutual effort and the clarity of what they say, and not by isolated signals. Someone can enjoy your attention without wanting a relationship, and someone can flirt without wanting anything more."],
      ["How it works", "A single signal is ambiguous. A warm message, a compliment, a long conversation and a laugh each have many possible meanings, and the mind tends to choose the one it prefers. If you want the signal to mean interest, you will take it that way and build a story around it, adding each new sign to a picture that was formed from the first. The story then feels like evidence. Behaviour that repeats is harder to misread. A person who makes time, follows through, puts in effort that matches yours and says plainly what they want has told you something that a stray signal cannot. Reading consistency means waiting for the pattern and holding your interpretation loosely until it appears."],
      ["Attention, flirtation and intent", "People give attention for many reasons: enjoyment, politeness, curiosity, habit, boredom, a wish to be liked. Flirting can be a style of speech and not a message. None of these is a promise, and none requires the other person to want a relationship. Mistaking them for intent is a common source of confusion and disappointment, and it is made worse by the fact that nobody has been dishonest. The signals were real. The meaning was supplied by the person reading them."],
      ["Where it operates", "Early interactions, when there is little to go on. Online and written communication, where tone is hard to read. Relationships that have stayed undefined for a long time. Situations in which one person gives more effort than the other. And your own habit of filling gaps in the picture with what you hope is true."],
      ["How you can tell", "You are reading well when your conclusions rest on what has been done more than once and on what has been said directly. You are not when your account of the situation depends on one look, one message or one night, or when you are explaining away the absence of effort. A useful test is to list what the person has actually done and said, without interpretation, and see what is left."],
      ["What it is not", "It is not suspicion, cynicism or a refusal to believe anyone is interested. It is not a rule that every signal is meaningless. It is not a reason to demand declarations early or to test people. It does not say anyone is lying. It is a habit of waiting for evidence that repeats before building anything on it."]
    ] },
  { n: "Law of Kept Standards", b: "Neither Side Gives Up Self-Respect",
    r: [
      ["The law", "Do not abandon your standards to keep someone. If you want loyalty, honesty and mutual effort from a partner, hold yourself to those standards too. The law of kept standards says the aim of a relationship is a dynamic in which neither person has to give up their self-respect, and it is not power over the other person."],
      ["How it works", "Standards are what you will and will not accept, and they exist to protect the connection as well as yourself. When they are dropped to hold on to a person, the connection that is kept is one you would not have chosen, and the dropping teaches both people that your limits can be negotiated away. The effect compounds. Each concession makes the next easier to ask for and harder to refuse, and your view of yourself shifts to match. Holding standards in both directions has the opposite effect. When you offer the loyalty, honesty and effort you ask for, the standards stop being demands and become shared terms, and the relationship rests on something both people can respect. Fairness is what makes the standards credible."],
      ["Power and fairness", "A relationship can be built to give one person control over the other, and it can be built so that control is not needed. The first looks like strength and produces fear, resentment and constant managing. The second takes more honesty at the start and needs less upkeep afterward. The law points to the second. Its goal is not to win but to arrive at a dynamic that neither person has to defend themselves inside."],
      ["Where it operates", "The decision about what you will tolerate early on. Moments when a person you care about asks you to accept something you would otherwise refuse. The point of choosing to stay or leave. The standards you apply to your own conduct, including honesty, follow-through and effort. And long relationships, where small concessions accumulate until the original limits are gone."],
      ["How you can tell", "Your standards are intact when you can name them, apply them to yourself as well as to the other person and act on them at a cost. They have been abandoned when you are accepting what you once said you would not, when you ask more of your partner than you give, or when you stay mainly from fear of being alone. A marker is whether you would recommend the arrangement to someone you respect."],
      ["What it is not", "It is not rigidity, perfectionism or a refusal to compromise on ordinary preferences. It is not a threat or a tool for control. It is not a claim that a partner must meet every wish. Compromise on matters of taste is part of any relationship. The law concerns the few things that make up your self-respect, and it says to keep them for yourself and to extend them to the other person."]
    ] },
  { n: "Law of Frame", b: "A Reaction Is Information",
    r: [
      ["The law", "Your frame is the perspective through which you interpret a situation. The law of frame says that whoever holds their own frame does not let another person's behaviour decide who they are. A reaction from someone else tells you something about that person and about the connection between you. It tells you nothing final about your worth."],
      ["How it works", "Every interaction can be read in two ways. Read from outside your own frame, a warm response feels like a promotion and a cold one feels like a demotion, and your sense of yourself rises and falls with each. Read from inside it, the same responses are information. Warmth is welcome. Coolness is respected, and the day goes on. An inconsistent response is noted and not decoded for hours. In all three cases the person is the same, with the same standards and the same direction. The frame is what stays constant while the other person's behaviour varies, which is why it is called everything: it decides whether outside events reach your identity or only your understanding."],
      ["The second question", "A person without a frame asks one question, which is whether the other person likes them. That question makes the other person the only judge in the exchange. A person with a frame asks it too, and then asks another: do I like how this person carries themselves, and do we actually connect? The second question puts your own judgement back into the situation. It changes the dynamic because you are now evaluating as well as being evaluated, and the other person can feel the difference in how you listen and respond."],
      ["Frame and identity", "A frame is not built inside one conversation. It rests on things that were true before the exchange began: what you value, what you are working toward and how you want to treat people. Those exist whether or not the person in front of you responds well. When they are in place, a reaction can only add or subtract information. When they are missing, a reaction fills the space and becomes your identity for as long as it lasts."],
      ["Where it operates", "First meetings and early conversations. Mixed or changing signals. The hours after a rejection. Established relationships, when a partner's mood shifts and you feel yours move with it. And anywhere another person's approval has become a measure of you, which includes work, family and friendship as much as dating."],
      ["How you can tell", "Your day continues at the same pace whatever the response. You can enjoy a good conversation without needing it to continue, and you can take a cold one without building a story about what it means. If you spend hours decoding one message, or your mood follows the last reply, the frame has been handed to the other person."],
      ["What it is not", "It is not indifference, and it does not mean ignoring what other people feel or say. It is not a pose of calm or a claim that you are always right. It is not rigidity: you can revise your view of a person as evidence comes in. It only keeps your identity from being set by their reaction."]
    ] },
  { n: "Law of Plenty", b: "One Door Is Not the Only Door",
    r: [
      ["The law", "Abundance is a mindset before it is a numbers game. The law of plenty says that one person's rejection cannot take away opportunities you have not yet met, and that a person who believes this connects more easily and more honestly than one who treats each chance as the last."],
      ["How it works", "Scarcity thinking says that if this person does not want you, your chance is gone. Under that belief every meeting carries too much weight. You try too hard, tolerate too much and read ambiguity as disaster. Abundance thinking says there are other people you could connect with, so you can see where this one goes without forcing it. The lowered pressure is what improves things: you are more present, more honest and easier to be around. The belief is also simply more accurate. The number of people you could connect with is larger than the number you have met so far."],
      ["Mindset, not performance", "The law does not ask you to pretend you have options you do not have, to keep several people going at once or to stir up jealousy. Those are performances of abundance, and they still treat the other person's reaction as the point. The mindset is internal. It is the understanding that a closed door does not shrink the world, and it needs to be shown to nobody."],
      ["Scarcity and pressure", "Pressure is the practical cost of scarcity. When a chance feels rare, you hold it too tightly, and holding tightly is visible. It changes your tone, your pacing and your honesty, and it often produces the very outcome that was feared. Plenty removes the grip. The result is not carelessness but steadiness: you take each meeting as what it is and give it your actual attention, which is what a good connection needs."],
      ["Where it operates", "Meeting new people. Early dating. The end of a short connection. The period after a breakup, when the world feels narrowed to one person. And outside romance, in work and friendship, wherever one refusal is being treated as the loss of everything."],
      ["How you can tell", "You can meet people without needing a particular outcome. Treating every attractive person as a rare opportunity that must be secured is the mark of scarcity. So is the feeling that a single refusal has used something up that will not come back."],
      ["What it is not", "It is not a licence to be careless with people or to treat anyone as replaceable. It is not a prediction that things will work out. It is not a tactic. And it does not deny that some connections matter a great deal. It says only that no single one is the last."]
    ] },
  { n: "Law of Showing Interest", b: "Interest Without Audition",
    r: [
      ["The law", "There is a difference between showing interest and auditioning for approval. Showing interest means approaching because you find someone attractive, expressing yourself honestly, inviting them and accepting their answer. Auditioning means working to earn a yes. The first is confidence. The second is dependence on an outcome."],
      ["How it works", "The two can look alike from outside, since both involve effort. The difference is in what the effort is for. In showing interest, the act is complete once you have made it: you have said what is true and asked for what you want, and the answer does not undo what you did. In auditioning, the act is unfinished until the other person approves, so every moment becomes a performance. You try to impress, agree with everything, spend money to prove your worth and keep pursuing after little interest has been shown. Each of these treats the answer as something to be won and not received."],
      ["Effort and chasing", "Effort is not the problem. You can plan, invite, compliment, pay and take initiative. The mark of chasing is that the effort continues unchanged whatever the response, and rises as the interest falls. Effort that responds to what comes back is investment. Effort that ignores what comes back is pursuit, and a person can make an effort without chasing and pursue someone without abandoning themselves."],
      ["Confidence and dependence", "Confidence here is not loudness. It is the condition of being able to act without needing the result, so that the action is clean. Dependence is the opposite condition: the action is made in order to obtain the result, and it is bent by that purpose. The same sentence, spoken by each, lands differently, because one is an offer and the other is a request for relief."],
      ["Where it operates", "First approaches and first dates. Relationships in which one person keeps spending effort or money to hold the other's attention. Requests of any kind where the answer matters more than it should. And your own habit of adjusting yourself to be chosen."],
      ["How you can tell", "You are showing interest when you can accept a no without negotiating and your effort rises and falls with theirs. You are auditioning when you agree against your own view, spend to prove value or keep pursuing after the signs are plain. The simplest marker is whether your behaviour would be the same if you knew the answer was no."],
      ["What it is not", "It is not holding interest back or making little effort. It is not a rule against generosity. It is not a promise of a yes. And it is not disrespect toward the other person, who is treated throughout as free to answer as they wish."]
    ] },
  { n: "Law of Matched Effort", b: "Do Not Reward Inconsistency",
    r: [
      ["The law", "Do not answer inconsistency with more effort. When someone gives attention and then withdraws it, the law of matched effort says to assess whether the connection is healthy and to match your investment to what is returned, without games. Effort should follow reciprocity."],
      ["How it works", "Intermittent attention is powerful. When it is withdrawn, the pull is to raise your effort to win it back: to text more, think more, give more and become more available. That teaches the pattern that withdrawal produces effort, and it increases your investment in the connection that returns the least. The alternative is matching. If enthusiasm is shown, make an effort. If responses are repeatedly absent, step back. If you are unclear where you stand, ask directly. You do not punish, act cold or try to make anyone jealous. You simply stop investing heavily in what is not reciprocated and let the other person's effort, or its absence, show what the connection is."],
      ["Stepping back without punishing", "Stepping back is not a move in a game. It carries no message to be decoded and has no aim of making anyone miss you. It is a change in how much you give, made because the evidence says the return is low. If the other person responds with real effort, matching resumes. If they do not, you have your answer and have lost little."],
      ["Reading the return", "Investment is something you can read as well as make. Look at what comes back: replies, plans made, effort shown, honesty. Over time those returns indicate the health of a connection better than any single exchange. Matching your effort to them keeps your judgement tied to evidence. Raising effort when returns fall ties it instead to the feeling of loss, which is a poor guide to what a connection is worth."],
      ["Where it operates", "Early dating with uneven replies. Long on-and-off situations. Friendships and working relationships in which one side does the reaching. And your own tendency to pursue most whatever withdraws."],
      ["How you can tell", "Your effort tracks theirs. If it rises when their attention falls, if you are sending more as you hear less or arranging more to compensate, you are rewarding inconsistency. If it settles to what is being returned, you are matching. Another marker is whether you could describe, without hedging, how much the other person has actually put in over the last few weeks."],
      ["What it is not", "It is not a game, a punishment or tit for tat. It is not a refusal to allow someone a bad week. And it is not a reason to avoid a clear conversation, since asking directly where you stand is part of the law."]
    ] },
  { n: "Law of Tension", b: "Present Without Needing the Outcome",
    r: [
      ["The law", "Sexual tension is uncertainty held with ease. The law of tension says confident people do not rush to remove it. They can hold eye contact, smile, flirt, tease playfully and let a moment develop without seeking immediate reassurance. Confidence is the willingness to create an opportunity without needing to control how it ends."],
      ["How it works", "Uncertainty is uncomfortable, and the quick way to end it is to ask, explain, reassure or fill the silence. Each of those spends the tension and moves your attention from the moment to your need for an answer. Holding it does the opposite. By staying present you let the other person respond in their own time, and you show that you are at ease without the result. Interest can be expressed without demanding that it be returned, and a conversation can end without squeezing something out of it. Where chemistry exists, it develops in the space that is left."],
      ["Presence and performance", "Presence is attention to what is happening: the other person's face, voice and words, and your own state. Performance is attention to how you appear. Tension cannot be held by someone who is performing, because performing needs feedback, and feedback ends the uncertainty. Presence needs nothing back, which is why it can wait."],
      ["Reassurance and its cost", "Asking for reassurance feels like relief and costs something. It tells the other person that you need an answer, and it invites an answer given under pressure, which is worth less than one given freely. The law does not forbid being clear. It separates stating what you feel from seeking confirmation that you are acceptable, and it keeps to the first."],
      ["Where it operates", "First conversations. Flirtation and playful teasing. The moments before an invitation or a first kiss. The end of an encounter. And long relationships, where a little unresolved interest is part of what keeps attraction alive."],
      ["How you can tell", "You can sit in a pause without filling it, leave a conversation without extracting a promise and express attraction without asking for it back. If silence makes you rush to explain yourself or fish for reassurance, you are releasing the tension early. A further sign is that you can enjoy the not-knowing for its own sake, as part of what makes the exchange alive, and not as a problem waiting for you to solve it."],
      ["What it is not", "It is not game-playing, coldness or withholding what you feel. It is not making someone uncertain on purpose. It does not mean never saying what you want, since clear interest is still stated. It means only that you do not need every moment resolved."]
    ] },
  { n: "Law of Open Care", b: "Care Without Dependence",
    r: [
      ["The law", "Caring less does not give you power, and caring more does not take it away. The law of open care says the real advantage belongs to a person who can care deeply while keeping boundaries. Your attention has value, and you should neither use it as a weapon nor abandon your principles out of fear that someone will leave."],
      ["How it works", "A familiar idea holds that whoever cares less holds the power. It is incomplete. The person who cares less may have less to lose emotionally, but that does not make them more confident or more desirable. Treating care as a thing to ration turns every exchange into a contest. Open care takes the other route. You may make the first move, offer a compliment, show genuine interest and say that you like someone. None of this costs you your footing, because the footing is your principles and not your show of indifference. The line that matters is between being emotionally available and being emotionally dependent. The first offers care freely. The second needs it returned in order to stay upright."],
      ["Attention as a weapon", "Withholding warmth to produce anxiety, using silence as punishment and timing replies for effect all treat attention as leverage. They may produce short results. They also make a relationship into a competition and teach both people to calculate. A person who offers attention honestly and keeps their boundaries has no need of any of them."],
      ["Availability and dependence", "Availability is a decision to be open: to reach out, to say what you feel, to let someone matter. Dependence is a need for that openness to be met. From outside they can look the same, and the difference appears when the other person does not respond. The available person is disappointed and continues. The dependent person is unsettled and compromises. Care that can survive a lack of reply is care freely given."],
      ["Where it operates", "The first messages and moves in a new connection. The balance of who reaches out. Moments of fear that expressing care will give the other person the upper hand. And long relationships, where care can be withheld as a form of control."],
      ["How you can tell", "You can say plainly that you like someone and still hold to what you will and will not accept. You are dependent when you drop your principles to prevent a departure, and you are using attention as a weapon when you ration it to produce a reaction."],
      ["What it is not", "It is not saying everything at once or ignoring how things are going. It is not naivety. It is not a refusal to set boundaries, because boundaries are half of the law. And it is not dependence, which is exactly what it separates itself from."]
    ] },
  { n: "Law of Difficulty and Value", b: "Pursuit Is Not Proof",
    r: [
      ["The law", "Know what you are looking for before you pursue, and do not confuse difficulty with value. The law says a person who is hard to win is not for that reason worth more, and that wanting someone more intensely because they are hard to obtain is a different thing from being compatible with them."],
      ["How it works", "Pursuit can become its own reward. The harder the person is to win, the stronger the pull to win them, and the strength of the pull gets read as the strength of the match. It is neither. It measures resistance. Meanwhile the questions that decide whether a connection is good go unasked. Does this person reciprocate interest? Do they communicate honestly? Do you enjoy who you are around them? Do your values and ways of living align? And are you attracted to them as a person, or mainly to the validation of winning them over? That last question matters most, because validation can feel like love for as long as the pursuit lasts."],
      ["Validation and attraction", "Attraction responds to a person. Validation responds to a result. When the pursuit is the reward, success arrives at the moment of winning, and interest can fade the moment it does. That pattern is a sign that what was wanted was the win. A person who wants the other person will keep wanting them once the difficulty is gone."],
      ["Hard and worth it", "Some things worth having are hard to get, so difficulty and value are sometimes found together. The law does not deny that. It denies that one proves the other. Difficulty can come from many sources, including indifference, unavailability and an unwillingness to commit, and none of these adds to a person's worth as a partner. To tell whether difficulty is part of something good or only resistance, return to the questions above and answer them from what you have observed."],
      ["Where it operates", "Early attraction to people who are unavailable, inconsistent or indifferent. The decision to keep pursuing after signs of little interest. Comparisons of one person with another, in which the harder one seems more valuable. And the habit of ranking people by how hard they were to get."],
      ["How you can tell", "You can answer the five questions above about a person without reference to how hard they were to win. You are confusing difficulty with value when your interest rises as theirs falls, or when you cannot say what you like about them beyond the chase."],
      ["What it is not", "It is not a belief that anyone easy to get is worth less, or that effort is wrong. It is not a rule against pursuing someone. It is not a reason to distrust attraction. It asks that value be judged by compatibility and not by resistance."]
    ] },
  { n: "Law of Basic Respect", b: "Never Compete for It",
    r: [
      ["The law", "You should never compete for basic respect, and mutual attraction does not require you to tolerate disrespect. The law of basic respect says respect is the floor of a connection and not a prize. A person who must earn it by outdoing others or by enduring poor treatment is being offered less than was claimed."],
      ["How it works", "Respect shown at the start sets what the connection will be. When it is withheld until you perform, impress or put up with something, the arrangement has a hidden term: your standing is conditional. Competing for it, whether against another person, against the other's moods or against your own pride, accepts that term. It also changes you, because the effort to be respected leaves less for being yourself. Attraction does not alter any of this. A person can find you attractive and still treat you poorly, and the attraction is no reason to accept it. Where mutual respect is present from the start, there is nothing to win."],
      ["Respect and attraction", "The two are separate and are often confused. Attraction is a pull. Respect is a way of treating a person. A connection can have the first without the second, and the pull can make the lack of the second easier to excuse. The law asks that both be present, and it treats the second as a condition and not as a bonus."],
      ["The floor and the ceiling", "Respect sets a floor and leaves the ceiling open. Above it a connection can be passionate, playful, competitive in a light way or full of disagreement. Below it, the connection becomes a contest for standing. The law places no limit on how much a person can be admired or desired. It says only that the minimum treatment of a person as a person is not something to be earned afresh each day."],
      ["Where it operates", "The early signs of how someone speaks to and about you. Moments of being belittled, ignored or made to compete with others. Relationships in which one person's disrespect is excused by their charm. And your own habit of accepting less than you would accept for anyone you care about."],
      ["How you can tell", "Respect is present when your views are heard, your time is valued and disagreement does not lead to contempt. You are competing for it when you perform to be taken seriously, tolerate rudeness to stay close or measure yourself against rivals for the other person's regard."],
      ["What it is not", "It is not demanding deference or perfect treatment. It is not intolerance of ordinary mistakes or bad days. It is not pride. And it is not a reason to leave at the first rough moment. It marks the floor below which you do not negotiate."]
    ] },
  { n: "Law of Rejection", b: "A Cost of Asking",
    r: [
      ["The law", "Rejection is a normal consequence of having the courage to express interest, and it does not define you. The law of rejection says that being turned down is part of the price of asking, and that the measure of a person is how they carry it and not whether they avoid it."],
      ["How it works", "Anyone who expresses interest will sometimes hear no, and the only way never to hear it is never to ask. The sting is real, and it is the reading of it that does the damage. Taken as a verdict, a refusal says you are not enough and teaches you to ask less often. Taken as a normal outcome, it says this particular match did not work, which is information about the two people and not about your worth. Over time the second reading builds the capacity to keep going, while the first builds avoidance, and avoidance costs more than any single no. The courage is in the asking, and it is completed whatever the answer."],
      ["Courage and outcome", "A person who asks has done the difficult part regardless of the response. That is easy to forget in the moment of being refused, when the outcome feels like the whole event. The law moves the achievement back to the act. You are measured by willingness to express interest honestly, and the other person's answer is theirs to give."],
      ["Rejection and fit", "Most refusals concern fit and timing, which have little to do with worth. The other person may be unavailable, uninterested in that kind of connection or looking for something different. None of these is a statement about you. Reading a refusal this way is not protection by denial. It is the more accurate interpretation, because one person's answer is one person's answer."],
      ["Where it operates", "Approaching someone new. Inviting a person out. Saying how you feel in an established friendship. Applications, proposals and other requests outside romance. And the long aftermath of a refusal, in which one answer is allowed to shape many later choices."],
      ["How you can tell", "You are carrying it well when a no stings and passes, and you ask again elsewhere without a lasting change in how you see yourself. You are letting it define you when it makes you stop asking, or when you replay it for weeks as proof of a flaw."],
      ["What it is not", "It is not pretending that rejection does not hurt. It is not a call to ask indiscriminately or to ignore a clear refusal. It is not a reason to stop reflecting on how you approached. And it is not a promise that persistence is always rewarded. It says only that a refusal is a cost of asking and not a judgement."]
    ] },
  { n: "Law of Observed Behaviour", b: "Judge What Happens, Not What Could Be",
    r: [
      ["The law", "Observe behaviour rather than chase potential. The law of observed behaviour says to judge a connection by what actually happens and not by what you hope it could become. A person's potential is a story you tell about them. Their conduct is the evidence."],
      ["How it works", "It is easy to fall for what a person might become: more attentive, more committed, more honest, more available. Potential is attractive because it has no flaws. Hope can shape it into anything, and the shape is usually the one you want. Behaviour has no such flexibility. It is what has been done, repeatedly, with time and effort that cost something. A connection judged on potential is a connection with a partner who exists only in hope, and the real one is left to disappoint. Judging by behaviour makes the decision on what is there. It does not rule out change. It requires the change to be shown before it is counted."],
      ["Potential and pattern", "A single good day or a promise of change is potential. A pattern is what repeats. The law gives weight to the second and holds the first lightly. This protects against the slow work of waiting for someone to become the person you hoped for, which can occupy years and which depends on a change nobody has agreed to make."],
      ["Reasons for staying", "A useful check is to ask why you are continuing. If the reasons concern what the person is like now, they rest on evidence. If they concern what the person will be, what the connection could turn into or how much has already been invested, they rest on hope or on effort already spent. Hope is permitted, but it is a weaker ground than conduct, and it helps to know which one you are standing on."],
      ["Where it operates", "Early dating, when little is known. Relationships in which the same disappointments recur alongside promises of difference. Friendships and work partnerships built on what someone could do. And your own tendency to read effort you wish for into what you have."],
      ["How you can tell", "Your account of the person matches what they have done in the last few weeks and months, and you can list it without adding hopes. You are chasing potential when your reasons to stay are about the future, when you excuse present conduct by what the person is capable of or when you are waiting for them to change."],
      ["What it is not", "It is not cynicism or a belief that people cannot change. It is not a refusal to extend trust. It does not call for immediate judgement of a person on one meeting. It asks that what you rely on be what has been shown, and that hope be kept distinct from evidence."]
    ] }
];

   Five passages and no more: what the law is, how it works, where in a

   principles the book actually states are here, under the book's own

var BL = {
  devil: [
    { n: "Cosmic Habitforce", b: "The Force That Holds Every Habit",
      r: [
        ["The law", "Cosmic habitforce is the book's name for the force that fixes everything in the pattern it has settled into. The planets keep their orbits, the seasons keep their order and, on the book's account, a person keeps the habits and thoughts they have repeated. Once a pattern is set, the force holds it in place, and it holds good patterns and bad ones with equal strength."],
        ["How it works", "The book describes habit as something larger than personal discipline. Each repeated thought or act is taken up by the force and given permanence, so the longer a pattern runs, the more firmly it is held and the more of the person's life it governs without their noticing. The same mechanism that locks in a drift locks in a purpose: a deliberate habit, repeated until it is settled, is also held. The book therefore treats the force as neutral and treats the question of what it is holding as the one that matters. The pattern that gets fixed is the one that was repeated, not the one that was intended."],
        ["Where it operates", "In thought, where the way you habitually interpret things sets into a fixed outlook. In conduct, where daily routines settle into a character. In health and the body, which keep to the patterns they have been given. In speech and manner, which become automatic. In money and work, where early patterns persist for decades. And in drifting, which the book regards as the default result of leaving the force to hold whatever has accumulated by accident."],
        ["How you can tell", "A pattern runs without any decision to run it. Changing it takes effort out of proportion to the size of the change. The same behaviour returns after every resolution. Good habits, once fixed, cost nothing to keep. You find that a way of thinking you picked up long ago is still operating and that you never chose it."],
        ["What it is not", "It is not a personal weakness or a judgement on willpower, since the book presents the force as universal and indifferent to what it holds. It is not a physical law that has been measured, and the name is the book's own. It is not an argument that habits cannot be changed, only that they have to be replaced by other repeated acts and not wished away. And it does not say which habits to hold: that is the open question the law leaves to you."]
      ] },
    { n: "Hypnotic Rhythm", b: "How a Life Gets Set on Autopilot",
      r: [
        ["The law", "Hypnotic rhythm is the book's term for the state in which a person is carried along by repeated routines and by the thinking of others, without deciding anything for themselves. It is a kind of trance: a life lived on a repeating track, in which each day resembles the last and no choice is made because none is felt to be needed. The book treats it as the usual condition of people who drift."],
        ["How it works", "The book describes a process in three parts. First, the person falls into a routine of thought and action, often copied from the people around them. Second, the cosmic habitforce takes hold of the routine and makes it permanent, so that it repeats with less and less attention. Third, the repetition produces a kind of dulling, in which the person stops noticing that their life is following a groove. In this state a person acts out the patterns of their surroundings and calls the result their life. The law's central claim is that the rhythm is not noticed from inside it, which is why it is described in terms of hypnosis: the person under it believes they are awake."],
        ["Where it operates", "In daily routine, where the same sequence repeats without examination. In work, where a job continues because it is already the one being done. In belief, where opinions are taken from the surrounding group. In relationships, where established roles are replayed. In money, where income and spending settle into a fixed range. And in a person's picture of what is possible, which tends to be the outline of the life already being led."],
        ["How you can tell", "Time passes quickly and leaves little to remember. You can predict your own week in detail. Decisions are made by default and not by choice. Opinions are held without a memory of forming them. Any suggestion of a change in direction produces unease out of proportion to the change."],
        ["What it is not", "It is not a claim that routine is bad. A routine chosen on purpose is a different thing from one that arrived by drift. It is not a literal hypnotic state, since the term is used as a figure of speech. It is not a reason to distrust all habits or all groups. And it is not specific to any kind of person: the book treats it as the ordinary condition that a life falls into when nothing interrupts it."]
      ] },
    { n: "Definiteness of Purpose", b: "The Opposite of Drifting",
      r: [
        ["The law", "Definiteness of purpose is the book's answer to drifting. It is the condition of knowing precisely what you want to do with your life and directing your effort toward it. The book treats a definite purpose as the thing that turns the force of habit from an obstacle into a support, since a settled aim gives the habit-forming force a direction to hold."],
        ["How it works", "Without a purpose, the book says, thought and action are shaped by whatever happens to be present, and what is repeated is whatever is at hand. A definite purpose changes what is repeated. It decides which thoughts are returned to, which acts are done daily and which options are refused, so that habit forms around the aim and not around circumstance. A purpose must be definite to do this: a general wish to do well gives the force nothing to hold, while a specific aim gives it a fixed point. The law links purpose to the other conditions the book names, such as self-discipline and the refusal of fear, which are needed to keep a purpose in place against the pull of the old patterns."],
        ["Where it operates", "In choice of work and direction, where a defined aim decides what is accepted and refused. In use of time, where purpose sorts what matters from what does not. In habits, which form around the aim. In decision-making under pressure, where a fixed purpose gives a standard. In resistance to outside influence, since a person with an aim is less easily steered. And in persistence, which needs something to persist toward."],
        ["How you can tell", "A person with it can say in one sentence what they are working toward. Choices are made quickly against that sentence. Distractions are recognised as such. Effort accumulates in one direction and does not scatter. Its absence shows as busyness without progress and an inability to say what you want."],
        ["What it is not", "It is not a single goal set once and never revised, since an aim can be changed on purpose and still be definite at each point. It is not rigidity or a refusal to learn. It is not a guarantee of success, only a condition for directing effort. And it is not the same as ambition for its own sake: the law is about having a defined aim, whatever that aim is."]
      ] }
  ],
  tagr: [
    { n: "Thoughts Are Things", b: "The Mind Turns Thought Into Fact",
      r: [
        ["The law", "Thoughts are things is the book's founding claim. A thought is a force with the power to shape what a person does and becomes, and a thought held with definite purpose and belief tends to translate itself into its physical equivalent. The book sets out to show that wealth and achievement begin as thought, and that the thought has to be held clearly before anything is built."],
        ["How it works", "The book describes the translation in stages. A desire is held in the mind until it becomes definite. Repeated and emotionalised, it passes into the part of the mind that governs belief and behaviour. From there it directs choices, attention and action toward its own fulfilment, and the person finds ways and means to carry it out. The book places the weight on the quality of the thought: wavering or doubtful thoughts translate into wavering results, while a clear, believed thought has the force of a plan. It also holds that what a person dwells on, whether wanted or feared, takes this same route, so a mind occupied with fear is equally productive of its object. The law is therefore about the direction and quality of thinking more than about positivity."],
        ["Where it operates", "In goals and ambition, where everything starts as a defined wish. In work and enterprise, which begin as ideas. In self-belief, which sets the size of what is attempted. In fear and doubt, which work through the same route in reverse. In health and mood, where dominant thoughts colour experience. And in the choice of company and information, which supply the material of thought."],
        ["How you can tell", "A result can be traced back to a clear idea that was held for a long time. People who describe their aim in specific terms tend to make more progress toward it. A dominant fear shapes behaviour long before the feared event. A change in the way a person thinks about a problem changes what they do about it."],
        ["What it is not", "It is not a claim that wishing produces results without action: the book's own method turns thought into plans and plans into work. It is not literal magic or a physical force that has been measured. It does not say that every thought has equal weight, since it is the dominant, repeated, emotional thought that counts. And it is not a guarantee: it describes the first stage, and the other stages still have to be carried out."]
      ] },
    { n: "Burning Desire", b: "The Starting Point of All Achievement",
      r: [
        ["The law", "Burning desire is the book's name for a want that has become definite, intense and exclusive enough to organise a person's effort. The book holds that all achievement begins with such a desire, and that a wish, a hope or a preference does not do the same work. A desire of this kind is not something a person has so much as something that has them."],
        ["How it works", "The book treats the strength of desire as the variable that decides how much a person will endure and how long. A mild want yields to the first obstacle. A burning one treats obstacles as problems to solve. The book describes how the desire is made definite: the amount or result is named, the price to be paid is stated, a date is set and the plan is written down and repeated. These steps convert a general wish into a fixed target and give the mind something specific to organise around. The law's central claim is that definiteness and intensity together produce persistence, and that persistence is the quality that most reliably separates results from intentions."],
        ["Where it operates", "In goals and careers, where a clear and intense aim carries a person past setbacks. In business, where founders stay with an idea through difficulty. In learning and skill, where intensity sustains practice. In recovery from failure, where the strength of the want decides whether a person returns to the attempt. In money, which the book treats as the object of a definite desire and not of a vague wish. And in sacrifice, which a strong desire makes tolerable."],
        ["How you can tell", "The person can state exactly what they want, by when and at what cost. They think about it without being asked to. Obstacles prompt problem-solving and not retreat. The aim shows up in what they read, who they spend time with and what they refuse. A weak desire shows as readiness to quit at the first serious difficulty."],
        ["What it is not", "It is not simply wanting something a great deal, and it is not impatience or greed. It is not a substitute for a plan, since the book pairs it with one. It is not a guarantee that the desire is achieved. And it is not necessarily a desire for money: the law is about the intensity and definiteness of the want, whatever its object is."]
      ] },
    { n: "The Master Mind", b: "Two Minds Make a Third",
      r: [
        ["The law", "The master mind is the book's principle that the coordinated effort of two or more people working in harmony toward a definite aim produces a power greater than any of them has alone. The book describes the combination as creating a third mind, an additional force beyond the sum of the individuals, and holds that the great fortunes it studies were made through such alliances."],
        ["How it works", "The book names the conditions for it to work. The alliance has to be in harmony, meaning the members are in sympathy and not merely in agreement. It has to be directed at a definite purpose and not at general cooperation. And it has to be a regular working partnership and not an occasional contact. Under these conditions each member contributes knowledge, experience and energy the others lack, and the group's thinking covers more ground than any one head. The book also holds that the harmony itself raises the individuals' own performance. The law's practical consequence is that a person's results depend on the quality of the people they work with and on how they work with them, as much as on their own ability."],
        ["Where it operates", "In business, where partners and teams carry out what one person cannot. In professional life, where mentors and advisers contribute knowledge. In learning, where discussion with able people sharpens thinking. In relationships, where shared aims strengthen both people. In leadership, where a leader's results depend on the group assembled. And in the choice of company, which the law treats as a decision with consequences for everything else."],
        ["How you can tell", "A group's output is clearly more than the sum of what each member could produce alone. Ideas arrive in conversation that none of the members had before it. The members' energy and confidence rise when they work together. Disharmony in the group shows in a drop in results. A person's progress changes when their circle changes."],
        ["What it is not", "It is not just networking or having a lot of contacts, since the principle requires harmony and a shared aim. It is not a claim of a literal third mind that can be measured, and the book's wording is partly figurative. It is not a replacement for individual effort. And it does not say that any group will do: a group in discord produces the opposite effect."]
      ] }
  ],
  mdh: [
    { n: "The Law of Correspondence", b: "The Outer Mirrors the Inner",
      r: [
        ["The law", "The law of correspondence, as the book gives it, says that your outer world is a mirror of your inner world. The condition of your life, in its work, relationships, health and finances, corresponds to the quality of your thinking and the habits that follow from it. A change in the inner picture, held and acted on, is followed by a change in the outer one."],
        ["How it works", "The book treats the law as a statement about direction of cause. The inner world, meaning beliefs, expectations and the pictures a person holds of themselves and their circumstances, is formed first and produces behaviour. Behaviour produces results, so the results correspond to the inner state even when the person does not recognise the link. The practical consequence is that working on circumstances directly, without altering the beliefs that produce them, tends to bring a person back to the same place. Equally, a person's circumstances can be read as information about what is going on inside: persistent features of a life are treated as pointers to persistent features of thought."],
        ["Where it operates", "In income and finances, which follow the person's beliefs about earning and deserving. In relationships, which reflect how a person sees themselves and others. In health, which corresponds to habits of living. In work, where the position a person holds tends to match the level of their expectations. In habits generally, which are the visible form of inner convictions. And in repetition, where the same type of situation recurs until the inner pattern is changed."],
        ["How you can tell", "Your circumstances are consistent with what you believe about yourself, including the beliefs you would not state. A change in income, relationship or health has historically followed a change in thinking. The same patterns recur across jobs, places and people. Describing someone's outer life gives a fair guess at how they think."],
        ["What it is not", "It is not a claim that every circumstance is a result of the person's thinking, since outside events, other people and chance all act on a life. It is not a basis for blaming people for what has happened to them. It is not a literal mirror in which a thought is instantly reflected. And it is not a quick method: the book treats the correspondence as working over time, through the habits the thinking produces."]
      ] },
    { n: "The Law of Compensation", b: "You Are Paid in Proportion to What You Give",
      r: [
        ["The law", "The law of compensation, in the book, says that you will be paid in direct proportion to the value of the service you render to others. What you receive in income and standing matches the quality, quantity and importance of what you contribute. It is a law about the relationship between the value you provide and the reward you can expect, with the reward set by what other people judge your contribution to be worth."],
        ["How it works", "The book describes the law as a matter of exchange in the market for work. Others pay for results that matter to them, so earning more requires producing more of what is valued, producing it better or producing it for those who value it most. The reward is therefore determined less by the effort you feel you put in than by the value that is received. Three consequences follow. Income is raised by raising the value of the contribution, usually through skill and results. Value is judged by the buyer, so the rarity and importance of what you do matter. And the return runs over time: a record of reliably valuable work compounds into higher pay and better opportunities."],
        ["Where it operates", "In pay and income, which follow the value of the work. In career progress, where more valuable roles are given to those who have shown they can produce results. In business, where customers pay for what they value. In skill, where raising ability raises the price of your work. In reputation, which grows from consistent contribution. And in relationships, where what is given tends to be what is returned."],
        ["How you can tell", "Those who earn more can usually point to the value they produce for others. A rise in skill is followed by a rise in what the market pays. A person who delivers consistently is sought out. Complaints about being underpaid often coincide with a contribution that others do not rate highly. Resentment about reward is a sign of a gap between the value you believe you give and what is perceived."],
        ["What it is not", "It is not a promise of fairness, since markets can underpay valuable work and overpay the visible. It is not a measure of a person's worth, since it addresses only the economic exchange. It is not a claim that effort alone produces reward. And it does not cover the many things that are given freely and not for pay."]
      ] },
    { n: "Eighty Twenty", b: "A Few Things Produce Most of the Result",
      r: [
        ["The law", "The eighty twenty rule says that a small share of your activities produces a large share of your results. About twenty per cent of what you do accounts for about eighty per cent of what you achieve, and the remaining eighty per cent of activity accounts for the other twenty. The figures are approximate. The law is the unevenness: results are concentrated and not spread evenly across effort."],
        ["How it works", "The rule is about the distribution of value across tasks, customers, goals and hours. Not everything counts equally, though everything feels equally urgent when it is on the list. A few tasks have very high value and many have very low value, and the person who spends time on the many in preference to the few gets a small return on a large effort. The book applies the rule as a ranking: sorting what you do by its contribution, doing the highest-value items first and giving the lowest-value items less or none of your time. It also applies it to people, noting that a minority of customers, products or activities typically produce most of the income. The law's weight is in prioritisation: more value is gained by choosing correctly than by working harder at everything."],
        ["Where it operates", "In use of time, where a small portion of hours produces most of the output. In work, where a few tasks carry most of the value. In business, where a small share of customers produces most of the revenue. In goals, where a few items on a list matter much more than the rest. In learning, where a few concepts underlie most of a skill. And in decisions, where a few factors decide most of the outcome."],
        ["How you can tell", "A short list of tasks accounts for most of what gets noticed and rewarded. A day can be busy and produce little because it went to low-value activity. When one customer or project is lost, results fall by much more than their share of effort. Looking back at a good year, most of the gain traces to a handful of decisions."],
        ["What it is not", "It is not an exact ratio, since the proportions vary and the numbers are an illustration of concentration. It is not a licence to neglect the low-value items entirely when they are necessary. It is not a statement about people's worth. And it does not say which twenty per cent matter: working that out is the work."]
      ] }
  ],
  surf: [
    { n: "The Space of Variations", b: "The Field Holds Every Version",
      r: [
        ["The law", "The space of variations is the basic claim of the book. Reality is described as an information field that contains every possible variant of every event, laid out as lines of life. What a person experiences as their circumstances is the sector of the field they are currently on, and moving to a different outcome means moving to a different sector and not changing the one you are in."],
        ["How it works", "The book treats the field as a store of potential and the present as one path through it. Each variant already exists as a possibility, and a person is drawn along the line that matches their state and the intentions they hold. The state that selects the sector is the steady one: what you think and feel consistently, as opposed to what you say or briefly wish. Because the sector is selected by matching, the way to reach a different one is to alter the state and the intention, and the circumstances follow as a result of the move. The law shifts the question from how to change the situation to which line to be on. It also explains continuity: a person who keeps the same state stays on the same line and meets the same kinds of event."],
        ["Where it operates", "In life direction, where a person's path is treated as one of many available. In circumstances that repeat, which indicate staying on one line. In decisions, which are read as choices between lines. In change, which is treated as a transition and not as an effort against the present. In luck, which the book describes in terms of the sector you are in. And in the sense of possibility itself, which the law widens by describing the future as already containing alternatives."],
        ["How you can tell", "The same type of event recurs while your steady state does not change. A change in outlook is followed by a change in what comes up. You feel that a different version of your life is available and nearby. Events seem to line up in a sequence that matches your dominant mood."],
        ["What it is not", "It is not an established physical theory, and the field is the book's model and not a measured entity. It is not a claim that thinking alone moves a person to a new outcome without action. It does not say that every variant is equally reachable from where you are. And it is not a guarantee: it is a way of describing change that the book offers as a working model."]
      ] },
    { n: "Excess Potential", b: "The Cost of Making Something Too Important",
      r: [
        ["The law", "Excess potential is the book's term for the imbalance created when you give a thing, a person or an outcome more importance than it can carry. Overvaluing it or condemning it, adoring it or fearing it, produces a charge, and the balancing forces act to remove that charge. They usually do so in ways that work against what the person wanted: the more something matters, the more likely it is to be taken or to go wrong."],
        ["How it works", "The book gives importance as the one cause of the trouble. Importance is the weight a person assigns, as distinct from the value a thing has. When the weight is excessive, it creates tension: the person becomes anxious, clumsy and forceful, and their behaviour reduces their chances. Beyond that, the book describes balancing forces that operate in the field to level any excess, whether it is excessive value or excessive contempt. A high charge is therefore discharged by an event that brings the situation back toward neutral, often by delivering the opposite of the wish. The law's remedy is to lower the importance and not the effort: the aim is to keep wanting the result while reducing the sense that everything depends on it."],
        ["Where it operates", "In interviews, tests and performances, where the stakes felt change the result. In relationships, where excessive need or idealisation destabilises the connection. In money, where desperate wanting makes it elusive. In status and comparison, where inflated or deflated views of self and others create friction. In goals, where fixation increases the chance of failure. And in fear, where an outcome dreaded becomes more likely through the behaviour it provokes."],
        ["How you can tell", "A result that matters enormously goes worse than a similar one that does not. A person who needs a thing too much finds it harder to obtain. Great success is often followed by a reversal. Strong admiration or contempt for someone is followed by an event that deflates it. Calm about an outcome coincides with its arriving."],
        ["What it is not", "It is not an argument for indifference, since the aim is to hold a want without the weight of necessity. It is not a physical law, and the balancing forces are the book's model. It is not a claim that every setback is caused by importance. And it does not say that effort is unnecessary: the book separates effort, which stays, from importance, which is reduced."]
      ] },
    { n: "Pendulums", b: "Structures That Live on Attention",
      r: [
        ["The law", "Pendulums are the book's name for the energy structures created when groups of people think and feel alike about something. They are not conscious. They feed on the attention and emotion of their followers, grow by drawing in more of it, and compete with other pendulums for people. A pendulum pulls those under its influence along the line that sustains it, whether or not the line serves them."],
        ["How it works", "The book describes a pendulum as a thing that swings: it needs energy to keep moving, and it takes that from the attention and emotion of the people involved. Strong feeling of any sign sustains it, so love and hatred feed it equally. Destructive pendulums live on fear, anger and outrage and are the ones the book warns about, because they gain by provoking reaction. A person who reacts becomes a source of energy and is drawn onto the pendulum's line, a process the book calls an induced transition. The only exit the book gives is to withhold the reaction that sustains it. Opposing a pendulum feeds it and joining it feeds it, so the law prescribes neither. It asks for the person to stay out of the swing and to choose their own line."],
        ["Where it operates", "In politics and media, where outrage and loyalty sustain movements. In organisations and workplaces, where a culture draws in those inside it. In family patterns, where roles repeat across people. In fashion, trends and brands, which depend on collective attention. In arguments, where reaction maintains the conflict. In online life, where attention is the currency. And in belief systems of any kind that need adherents."],
        ["How you can tell", "You feel pulled to react to something designed to provoke you. A cause or group seems to demand loyalty and to punish doubt. The same argument continues because both sides keep feeding it. Strong feeling about an issue goes with a sense of being used. Distance from a topic brings calm and also a sense that it matters less."],
        ["What it is not", "It is not a theory of conspiracy: the book describes pendulums as arising from the thinking of groups, not from design. It is not a claim that all organisations are harmful. It is not an established scientific concept, and it works as a model. And it does not tell you to withdraw from people, only from the particular pull of a structure that lives on your reaction."]
      ] },
    { n: "Outer Intention", b: "Selecting a Line Instead of Pushing",
      r: [
        ["The law", "Outer intention is the book's name for choosing an outcome from the field instead of forcing it into being. It differs from inner intention, which is the effort of acting and pushing against circumstances. In outer intention a person decides the destination clearly and allows it to arrive by whatever route the field offers, taking the action that presents itself and not driving every step."],
        ["How it works", "The book separates two attitudes to a goal. Inner intention concentrates on the means: the plan, the steps, the exertion needed to make something happen. Outer intention concentrates on the end and leaves the means open. The decision is made once and clearly, and attention then stays on the destination as already available. The book holds that the means appear as the person moves, and that insisting on a particular route narrows the options and raises importance, which provokes the balancing forces. Heart and mind play a part: the mind picks the aim, the heart confirms it, and when the two agree the intention is whole. The law places the work in a clear decision and a relaxed relationship to how it is carried out."],
        ["Where it operates", "In goals of every kind, where the destination can be stated and the route cannot. In career and opportunity, where openings often arrive from unexpected directions. In relationships, where forcing a result tends to push it away. In creative work, where the form emerges from a clear aim. In decisions about direction. And in times of uncertainty, where the route is unknown and the destination is not."],
        ["How you can tell", "You can state exactly what you want and not know how you will get it. Opportunities appear that you had not planned for. Insisting on a single method meets resistance. A relaxed focus on the aim coincides with progress. Strain and constant checking coincide with stalling."],
        ["What it is not", "It is not passivity, since the book expects action when it presents itself. It is not wishing, which lacks the clear decision and the matching state. It is not a guarantee that the destination is reached. And it is not a technique with an established mechanism: it is the book's description of how a decision should be held."]
      ] }
  ],
  para: [
    { n: "The Paradigm", b: "Results Are the Programme Speaking",
      r: [
        ["The law", "A paradigm is a multitude of habits, a programme of thought and behaviour that has been installed in the mind and that controls what a person does without their awareness. The book's central claim is that results are a faithful expression of the paradigm and not of desire or effort. The income, health and relationships a person has are what the programme produces, and they will stay the same until the programme changes."],
        ["How it works", "The book describes a paradigm as built from repetition and from strong emotional events, most of it in early life and most of it taken in from the surrounding people without consideration. Once installed, it runs automatically in the subconscious and directs action. A person can want something different and make a large effort toward it, but if the paradigm holds a different picture, behaviour is brought back to it, so the old result returns. The paradigm decides what feels normal, and a person is uncomfortable when they move away from it. For that reason the book places change at the level of the paradigm and not the level of result: the way to produce different results is to install a different programme. It also treats the conscious mind as the means of change, since it can choose what is impressed on the subconscious."],
        ["Where it operates", "In income and money, where a person tends to return to a familiar level. In health and weight, where a body returns to an established pattern. In relationships, where a person finds similar dynamics repeatedly. In career, where a ceiling often matches the person's picture of themselves. In habits generally, which are the visible part of the programme. And in resistance to change, which the book reads as the paradigm defending itself."],
        ["How you can tell", "A person returns to the same result after every change attempt. Gains are followed by a slide back to the old level. What feels normal is stable across years. Effort rises without results rising with it. A person's results are consistent with their earliest and most frequently repeated beliefs."],
        ["What it is not", "It is not a claim that the person is to blame for their results, since the paradigm was largely installed without their choice. It is not a description of a physical thing: the term is the book's way of naming a set of habits. It is not an argument that effort is useless, only that effort at the level of results is not enough. And it does not say that change is quick: the book describes the programme as built by repetition and changed by repetition."]
      ] },
    { n: "The Terror Barrier", b: "The Edge of the Comfortable",
      r: [
        ["The law", "The terror barrier is the book's name for the point where a person's growth runs into the limit of their paradigm. As a person moves beyond what the programme holds as normal, discomfort rises, and at some distance from the familiar it becomes strong enough to be experienced as fear. The barrier is the felt edge of the comfort zone, and most people turn back at it."],
        ["How it works", "The book describes a pattern of approach and retreat. A person sets a goal that lies outside their paradigm and begins to move toward it. Past a certain distance, the mind produces anxiety, doubt, distraction or a sudden loss of motivation, and the person retreats to what they know. This is experienced as a realistic assessment of risk, though it is the programme returning the person to its range. The book states that the barrier is a signal and not a verdict: it marks where the paradigm ends and is therefore a sign of growth under way. The way through it, in the book's account, is to keep going while the discomfort is present, so that the new level becomes familiar and the paradigm is extended."],
        ["Where it operates", "In goals that involve a step beyond the usual level of income, status or responsibility. In careers, where promotion or independence triggers anxiety. In relationships, where closeness beyond a person's norm produces withdrawal. In health, where a new standard feels unnatural. In creative projects, where finishing or publishing brings dread. And in success itself, which many people sabotage on reaching the limit of what feels like theirs."],
        ["How you can tell", "A person approaches a goal and then finds reasons to stop. Nerves and doubt rise as the aim comes within reach. Progress stalls at a particular level and does so repeatedly. Success produces unease. A sudden urge to retreat arrives at the point of most promise."],
        ["What it is not", "It is not a physical barrier or an external force, and it is the book's term for a psychological pattern. It is not a sign that the goal is wrong, since discomfort at the edge of the familiar is expected. It is not a reason to ignore real danger. And it does not claim that crossing is easy: it says only that the discomfort is a feature of the edge and not a judgement of the goal."]
      ] },
    { n: "The Worthy Ideal", b: "A Direction Worth Becoming",
      r: [
        ["The law", "A worthy ideal is a goal that a person finds so attractive that it draws them forward on its own. The book distinguishes it from a target set by calculation: a worthy ideal is an end that arouses real feeling and that the person would pursue without being driven. It is the book's proposed way of building a new paradigm, since an ideal that is felt strongly enough carries the repetition needed to install it."],
        ["How it works", "The book gives the worthy ideal a role in change. A paradigm is rebuilt by repeated thought and feeling around a new picture, and repeating something you are indifferent to is difficult and brief. An ideal that carries emotion supplies the energy for repetition. It also gives direction: the person holds a vivid picture of the aim, in which they see themselves as already living it, and the subconscious works to bring behaviour into line with the picture. The book also holds that the ideal has to be one the person truly wants and not one inherited from others, since a goal that is borrowed produces no feeling. The law's claim is that attraction, and not pressure, sustains change."],
        ["Where it operates", "In life direction, where an ideal gives a person something to move toward. In work, where a calling carries a person through the dull parts. In goals of every size, where emotional pull sustains effort. In the work of changing a habit or a belief, which needs repeated attention. In motivation, where a strong aim replaces force. And in identity, where the ideal is a picture of who the person is becoming."],
        ["How you can tell", "The goal produces feeling when it is pictured. The person returns to it without being told to. Effort toward it feels less like a burden than effort toward obligations. Obstacles feel like problems to solve. A goal that produces no feeling is dropped when the first difficulty arrives."],
        ["What it is not", "It is not a target imposed by someone else, and it is not a goal chosen purely for its payoff. It is not a guarantee that the aim is reached. It is not the same as a fantasy, since the book pairs it with sustained thought and action. And it does not mean the ideal can be taken casually: the book treats it as the centre of the method."]
      ] }
  ],
  feel: [
    { n: "The Feeling of the Wish Fulfilled", b: "The Secret Is the State",
      r: [
