# The whole deployment, and it is four lines of substance.
#
# `id` below names a KV namespace on one Cloudflare account. It is an
# address rather than a credential — reaching it still needs that
# account's API token — which is why it is committed rather than kept
# out, and why this repository being public costs nothing here.
#
# Anyone deploying their OWN copy replaces it with their own namespace's
# id: dashboard → Storage & databases → KV → create one, and the id is
# the last segment of that namespace's URL.

name = "sched"
main = "index.js"
compatibility_date = "2026-01-01"

# The binding name is what `env.SCHED` in index.js resolves to. Rename
# it here and the worker stops finding its store — with `undefined is
# not an object`, at request time, on somebody's phone.
[[kv_namespaces]]
binding = "SCHED"
id = "e924044bdaf14d5b96c8c27da74e1503"

# No routes and no custom domain: the worker answers on its own
# workers.dev URL, which is the string the app is given. A custom domain
# would mean a zone, and there is nothing here worth a DNS record.
[observability]
enabled = true
