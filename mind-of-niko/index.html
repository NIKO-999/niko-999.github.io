<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mind of Niko</title>
<meta name="description" content="Advice for the journey, one card at a time.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#e9e8e4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mind of Niko">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
  /* Editorial card deck: one belief per screen. Paper grey, ink black, periwinkle mark. */
  :root {
    color-scheme: light;
    --paper: #e9e8e4;
    --ink: #000;
    --body: #141414;
    --mark: #4a5aa8;                 /* periwinkle: header and numbers */
    --serif: "Instrument Serif", "Times New Roman", Times, serif;
    --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); }
  body { color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden;
         -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }

  .card { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr;
          padding: calc(env(safe-area-inset-top, 0px) + 44px) clamp(28px, 9vw, 104px) calc(env(safe-area-inset-bottom, 0px) + 88px);
          max-width: 1080px; margin: 0 auto; }
  .top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: baseline;
         color: var(--mark); font-weight: 700; font-size: clamp(15px, 2.3vw, 26px); letter-spacing: -.01em; }
  .top .r { text-align: right; }
  .mid { display: flex; flex-direction: column; justify-content: center; gap: clamp(36px, 7vh, 80px); min-height: 0; }
  h1 { margin: 0; text-align: center; font-family: var(--serif); font-style: italic; font-weight: 400;
       font-size: clamp(46px, 9.5vw, 104px); line-height: 1.12; letter-spacing: -.01em; text-wrap: balance; }
  p { margin: 0 auto; max-width: 30em; font-size: clamp(17px, 2.5vw, 28px); line-height: 1.5; color: var(--body); text-wrap: pretty; }

  .lesson { color: var(--mark); font-weight: 700; letter-spacing: -.01em; }   /* same weight as the header */
</style>
</head>
<body>
<main class="card" id="card" aria-live="polite">
  <div class="top"><span class="l" id="num">(01)</span><span>MIND OF NIKO</span><span class="r" id="year">(2026)</span></div>
  <div class="mid">
    <h1 id="title"></h1>
    <p id="text"></p>
  </div>
</main>

<script>
// Advice for the journey, in order. Hard-coded on purpose.
const CARDS = [
  // [title, lead-in, the lesson]
  ['Act like it’s already done', 'Stop waiting to feel ready before you behave like the person you want to be.', 'Make the decisions they would make today, at your current level. Identity doesn’t lead the action. It follows it.'],
  ['Set clear goals, then let them go', 'Decide exactly where you’re going and write it down once. Then stop staring at it.', 'The goal sets the direction, but it’s the daily process that actually moves you there.'],
  ['Fall in love with the process', 'Results are slow, uneven and out of your control. The process is the one thing you own every single day.', 'Judge each day by whether you did the work, and the outcome takes care of itself.'],
  ['Protect the first hour', 'How you start the day sets the tone for everything after it.', 'Before the noise reaches you, ground yourself, hydrate and move. A calm, intentional morning is a quiet act of self-respect.'],
  ['Keep promises small and daily', 'Self-trust is built in tiny deposits.', 'Make commitments you can keep every day, then keep them without negotiation. Confidence is just the evidence of promises kept.'],
  ['Remove the options', 'Willpower runs out. Decisions made in advance don’t.', 'Remove the temptations, set the rules before the moment comes, and let your environment make the right choice the easy one.'],
  ['Signal over noise', 'Most of what competes for your attention doesn’t matter.', 'Learn to tell what moves you forward from what only keeps you busy. Protect your focus like it’s your most valuable asset, because it is.'],
  ['Change your environment', 'You become a product of what surrounds you.', 'If your space, feed or circle doesn’t match where you’re going, start building your way out, while still giving full effort where you are.'],
  ['Compare upwards, never sideways', 'Measuring yourself against the people around you keeps you exactly where you are.', 'Look to the person you’re becoming and those already living it. Let them be the standard, not the room.'],
  ['Invest in the right minds', 'The fastest way to grow is to learn from someone who’s already done it.', 'Good guidance is never expensive when it saves you years of mistakes. Pay for wisdom so you don’t pay twice.'],
  ['Raise your standards quietly', 'You don’t need to announce your new standards. Live them.', 'What you eat, who you give your time to and what you tolerate all tell you who you really believe you are.'],
  ['Mind your frequency', 'Notice what leaves you lit up and what leaves you heavy.', 'Do more of the first and slowly remove the second. Your energy is a resource, so treat every input like it costs something.'],
  ['Repetition builds mastery', 'Depth beats novelty.', 'Go back to the same lesson, the same practice, the same fundamentals until they stop being something you know and become something you are.'],
  ['Discipline over motivation', 'Motivation shows up when it wants to. Discipline shows up when it has to.', 'Build a life that doesn’t depend on how you feel, and you’ll keep moving on the days you don’t want to.'],
  ['Never act from scarcity', 'Scarcity makes you rush, force and chase. Abundance lets you wait for the right moment.', 'When you trust there’s enough, you make better decisions with less pressure.'],
  ['Follow your own rules', 'Your rules exist for the moments you’d rather break them.', 'Set them when you’re calm, honour them when you’re not. The person who doesn’t negotiate with themselves is hard to stop.'],
  ['Your body keeps the score', 'How you treat your body is how you treat your word.', 'Train, fuel and rest like someone you respect. Physical discipline becomes proof that you can do hard things.'],
  ['Give value freely', 'Share what you’ve learned without waiting to be an expert.', 'Lifting others up the path behind you sharpens your own understanding. What you give out has a way of coming back multiplied.'],
  ['Document, don’t perform', 'Capture your journey honestly while you’re living it. Not to impress anyone.', 'Keep a record of who you’re becoming. The proof will matter more to you than anyone else.'],
  ['Close each day honestly', 'Before you sleep, ask what kept you aligned and what pulled you off course. Be honest, not harsh.', 'One small correction each day compounds into a completely different life.'],
  ['Solitude is a strength', 'Time alone isn’t lonely when you’re building something.', 'It’s where you think clearly, hear yourself and do the work no one sees. Learn to be comfortable in your own company.'],
  ['Act boldly, have faith', 'At some point, planning has to turn into doing. Take the step before you feel certain.', 'Faith isn’t knowing how it works out. It’s acting like it already has.'],
  ['Choose the harder right', 'The easy option is always available, and it always costs more later.', 'When you’re torn, pick the choice your future self will thank you for. Hard now, easy later, every time.'],
  ['Speak it into existence', 'The words you use about yourself become the rules you live by.', 'Talk about your life as if it’s already the one you’re building. Your mind follows the language you give it.'],
  ['Patience is a skill', 'Everything worth having takes longer than you’d like.', 'Stay calm through the slow parts. The person who can wait without losing focus always outlasts the person who can’t.'],
  ['Win the small moments', 'Big days are rare. Ordinary moments are everywhere.', 'Getting up when you said you would and finishing what you started is where the real progress lives.'],
  ['Detach from the outcome', 'Gripping the result too tightly makes you desperate, and desperation shows.', 'Care deeply about the work and loosely about the timing. Pressure falls away when you trust what you’re building.'],
  ['Make your health non-negotiable', 'Everything you want to build sits on top of your energy.', 'Sleep, water, movement and real food aren’t extras. They’re the foundation that decides how far everything else can go.'],
  ['Silence the inner negotiator', 'There’s a voice that always offers a reason to skip today.', 'Notice it, name it and do the thing anyway. It gets quieter every time you stop listening to it.'],
  ['Simplify everything', 'Complexity is often just procrastination dressed up as planning.', 'Find the few actions that matter most and do them well. A simple plan you follow beats a perfect one you don’t.'],
  ['Guard your energy', 'Not everyone deserves access to your time and attention.', 'Notice who and what drains you, then set boundaries without apology. Protecting your peace is how you protect your progress.'],
  ['Learn from every loss', 'Setbacks only cost you something if you walk away without the lesson.', 'Ask what it taught you, adjust and go again. Every mistake reviewed honestly becomes part of your edge.'],
  ['Visualise the destination', 'Your mind moves towards what it sees most clearly.', 'Spend a few minutes each day seeing the life you’re building in detail. Let the picture pull you forward on the hard days.'],
  ['Execution beats ideas', 'Ideas feel productive, but they don’t change anything on their own.', 'One finished action is worth more than ten brilliant plans. Start before you’re ready and refine as you go.'],
  ['Stay humble, stay hungry', 'Success can quietly convince you that you’ve arrived.', 'Keep a beginner’s mind and a builder’s appetite. Gratitude keeps you grounded, and ambition keeps you moving.'],
  ['Be the calm in the room', 'Emotion makes noise. Composure makes decisions.', 'When everything around you speeds up, slow down. The person who stays steady under pressure ends up leading.'],
  ['Take full ownership', 'Blame feels better for a moment and keeps you stuck for years.', 'Own your results, the good and the bad. The moment it’s all your responsibility, it’s also all within your power.'],
  ['Measure what matters', 'You can’t improve what you never look at.', 'Track the few things that move your life forward, honestly and often. The numbers don’t judge you. They guide you.'],
  ['Rest without guilt', 'Rest isn’t the opposite of progress. It’s part of it.', 'Recover on purpose so you can come back sharper. Burning out isn’t dedication. It’s just a slower way to stop.'],
  ['Show up when no one is watching', 'Anyone can perform for an audience.', 'Your character is built in the hours no one sees. Do the work the same way whether it’s noticed or not.'],
  ['Upgrade your inputs', 'What you read, watch and listen to becomes how you think.', 'Curate your inputs like a diet. Feed your mind what the person you’re becoming would choose.'],
  ['Gratitude multiplies', 'It’s easy to overlook what you already have while chasing what’s next.', 'Notice the progress, the people and the small wins. Gratitude doesn’t slow ambition. It fuels it.'],
  ['Consistency compounds', 'One day of effort changes very little. A thousand of them change everything.', 'Don’t chase intensity. Chase the streak. The results arrive quietly, then all at once.'],
  ['Become the evidence', 'Belief is easier when you can point to proof.', 'Every promise you keep becomes evidence that you are who you say you are. Keep stacking it until doubt has nowhere to stand.'],
];

const $ = id => document.getElementById(id);
const KEY = 'mind-of-niko.at';
let at = 0;
try { at = Math.min(CARDS.length - 1, Math.max(0, +localStorage.getItem(KEY) || 0)); } catch {}

function paint() {
  const [t, lead, lesson] = CARDS[at];
  $('num').textContent = `(${String(at + 1).padStart(2, '0')})`;
  $('year').textContent = `(${new Date().getFullYear()})`;
  $('title').textContent = t;
  $('text').replaceChildren(document.createTextNode(lead + ' '), Object.assign(document.createElement('span'), { className: 'lesson', textContent: lesson }));
  document.title = `${t} · Mind of Niko`;
  try { localStorage.setItem(KEY, at); } catch {}
}
let busy = false;
function go(step) {
  if (busy) return; busy = true;
  at = (at + step + CARDS.length) % CARDS.length; paint();
  setTimeout(() => { busy = false; }, 150);   // ignore a double tap
}
// Tap the right of the screen for next, the left for back. Swipe works too. Arrow keys on desktop.
document.addEventListener('click', e => { go(e.clientX < innerWidth / 3 ? -1 : 1); });
let sx = null;
document.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
document.addEventListener('touchend', e => {
  if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; sx = null;
  if (Math.abs(dx) > 50) { e.preventDefault(); go(dx < 0 ? 1 : -1); }
});
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight' || e.key === ' ') go(1); if (e.key === 'ArrowLeft') go(-1); });
paint();

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
