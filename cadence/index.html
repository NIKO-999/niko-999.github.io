<style>
/* ═══════════════════════════════════════════════════════════════
   CADENCE — the block you are in.

   Six looks came out before this one. The dial was the fifth to be
   built and the first to be picked; it shipped, and the answer came
   back as a screenshot of a different mockup with four words: "I like
   this more". This is that mockup, made into the app.

   · THE DAY IS THE BLOCK YOU ARE IN. Its name is the biggest thing on
     the screen, with what is left of it, a thin line saying how far
     through you are, and the one after it underneath. Everything else
     on the day is a quiet list of hairlines below.
   · ONE WHITE CONTROL, AND IT TICKS THAT BLOCK. You never go looking
     for the row you are in: the screen already knows.
   · EVERY SCREEN IS A FIGURE AND DOTS. The week is seven dots, a habit
     is a fortnight of dots, the month is a dot a day, and training is
     thirty. A dot filled is a thing kept; hollow is a thing missed;
     faint is a day that makes no claim.
   · The alignment app's language rather than its pieces: the night sky,
     Inter in its light weights for the one figure a screen is about,
     Geist Mono in tracked capitals for every label, and hairlines where
     there would be cards.
   ═══════════════════════════════════════════════════════════════ */
@font-face { font-family: 'Inter'; font-weight: 100 900; font-display: swap;
  src: url('../arc/fonts/Inter.woff2') format('woff2'); }
@font-face { font-family: 'Geist Mono'; font-weight: 100 900; font-display: swap;
  src: url('fonts/GeistMono.woff2') format('woff2'); }

:root {
  color-scheme: dark;
  --bg: #03060A;
  --ink: #F3F5F7;
  --on: #07080B;
  --dim: rgba(243, 245, 247, .72);
  --quiet: rgba(243, 245, 247, .62);
  --faint: rgba(243, 245, 247, .42);
  --hair: rgba(243, 245, 247, .10);
  --lift: rgba(243, 245, 247, .07);
  --lift2: rgba(243, 245, 247, .13);
  --track: rgba(243, 245, 247, .14);
  /* A day that makes no claim: still to come, or before the record
     began. Drawn, so the week keeps its shape, and deliberately faint. */
  --nil: rgba(243, 245, 247, .18);
  /* Behind you and not kept. A graphic, so it is held to 3:1 against the
     sky beside it — and never a red: nothing here says you failed. */
  --miss: rgba(243, 245, 247, .40);
  --sheet: #0B1621;

  /* Which part of life a block is: the alignment app's four hues. */
  --c-body: #F2A184;
  --c-mind: #B7A5FF;
  --c-work: #E8C67C;
  --c-rest: #7DCFD8;
  --c-none: #A3ADB6;
  --k-weights: #F2A184;
  --k-run: #7DCFD8;
  --k-recovery: #B7A5FF;
  --k-rest: #A3ADB6;
  --h-water: #8FB8FF;
  --h-sleep: #E9A6D0;
  --bad: #FF9C8F;

  /* THE SKY. Near-black at the top, a slate night by the foot, and one
     soft lift behind the block you are in. It never carries colour:
     colour is what a block and a habit are for. The foot stops short of
     the mockup's horizon, because a list scrolls down there and a quiet
     label over #50636F measures 3.6:1. */
  --sky: radial-gradient(90% 45% at 50% 34%, rgba(64, 110, 132, .30), transparent 70%),
         linear-gradient(180deg, #03060A 0%, #07131D 18%, #122736 44%, #1B3140 70%, #22394A 88%, #2A4050 100%);

  --sans: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --gut: 22px;
}

*, *::before, *::after { box-sizing: border-box; }
/* Said once, for every element: an author `display` outranks the
   browser's own [hidden] rule, and that has broken a view, a toast and
   an overlay in this repo's other app. One line removes the class. */
[hidden] { display: none !important; }

html { -webkit-text-size-adjust: 100%; }
html, body { height: 100%; background-color: var(--bg); }
body {
  position: fixed; inset: 0; margin: 0; overflow: hidden; overscroll-behavior: none;
  background: var(--sky);
  color: var(--ink);
  font: 400 15px/1.4 var(--sans);
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
}
p, h1, h2, h3 { margin: 0; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; touch-action: manipulation; }
button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.cd-field:focus-visible { outline: 1px solid var(--ink); outline-offset: -1px; }
.cd-row .cd-field:focus-visible { outline: none; }

/* Every label in the app is the same voice: tracked mono capitals. */
.cd-cap, .cd-hcap, .cd-tcap, .cd-lbl, .cd-tab, .cd-wl, .cd-dows, .cd-mcap, .cd-legend, .cd-last {
  font: 500 10.5px/1 var(--mono); text-transform: uppercase;
}
.cd-cap, .cd-tcap, .cd-lbl, .cd-last { letter-spacing: .18em; color: var(--quiet); }

.cd-app { display: flex; flex-direction: column; height: 100%; max-width: 560px; margin: 0 auto; }

/* ── the top: settings, the four words, and add ── */
.cd-top { flex: none; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; padding: calc(8px + env(safe-area-inset-top)) 12px 0; }
.cd-gear, .cd-plus { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; }
.cd-gear { color: var(--quiet); }
.cd-gear svg { width: 19px; height: 19px; display: block; }
/* Add is a glyph, the way settings is: the one drawn control on the day
   is the check at its foot, and a second round at the top would be a
   second answer to "what do I press". It is the ink where settings is
   quiet, because it is the one you reach for. */
.cd-plus { color: var(--ink); }
.cd-plus svg { width: 20px; height: 20px; display: block; }

.cd-nav { display: flex; justify-content: center; gap: 4px; }
.cd-tab { position: relative; min-width: 44px; min-height: 44px; padding: 0 8px; text-align: center; letter-spacing: .18em; color: var(--quiet); }
.cd-tab::after { content: ""; position: absolute; left: 50%; bottom: 5px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--ink); opacity: 0; }
.cd-tab[aria-current="page"] { color: var(--ink); }
.cd-tab[aria-current="page"]::after { opacity: 1; }

.cd-main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.cd-main > section { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.cd-pane {
  flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain;
  padding: 0 var(--gut) calc(30px + env(safe-area-inset-bottom)); scrollbar-width: none;
  -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 10px, #000 calc(100% - 28px), transparent 100%);
          mask-image: linear-gradient(180deg, transparent 0, #000 10px, #000 calc(100% - 28px), transparent 100%);
}
.cd-pane::-webkit-scrollbar { display: none; }
/* The day's pane clears the check that floats over its foot. */
#cdDayPane { padding-bottom: calc(118px + env(safe-area-inset-bottom)); }

/* ── the week: a dot over a letter, seven of them ── */
.cd-week { flex: none; display: grid; grid-template-columns: repeat(7, 44px); justify-content: center; margin: 8px 0 0; }
.cd-wd { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 9px; min-height: 48px; }
.cd-wd i { width: 5px; height: 5px; border-radius: 50%; background: var(--nil); }
.cd-wd[data-state="part"] i { background: var(--quiet); }
.cd-wd[data-state="whole"] i { background: var(--ink); box-shadow: 0 0 7px rgba(243, 245, 247, .6); }
/* Filled is kept and hollow is missed, which is the habits screen's own
   rule: no colour says whether. */
.cd-wd[data-state="none"] i { background: none; box-shadow: inset 0 0 0 1.2px var(--miss); }
.cd-wd[aria-pressed="true"] i { outline: 3px solid rgba(243, 245, 247, .16); }
.cd-wl { letter-spacing: .1em; color: var(--quiet); }
.cd-wd.is-today .cd-wl { color: var(--ink); }

/* ── the block you are in ── */
.cd-hero { margin-top: 56px; text-align: center; }
.cd-hero.is-sub { margin-top: 26px; }
.cd-hcap { letter-spacing: .18em; color: var(--c, var(--quiet)); }
.cd-big { display: block; margin: 16px auto 0; font: 300 46px/1.05 var(--sans); letter-spacing: -.02em; text-align: center; font-variant-numeric: tabular-nums; }
/* The name is a press target — it opens the block — and wraps to two
   lines before it is cut, because a name is the whole of what it says. */
.cd-hn { max-width: 100%; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.cd-hn:disabled { cursor: default; }
.cd-hs { margin-top: 12px; font: 400 16px/1.3 var(--sans); color: var(--dim); font-variant-numeric: tabular-nums; }
.cd-hs b { font-weight: 500; color: var(--ink); }
.cd-bar { position: relative; width: 210px; height: 2px; margin: 22px auto 0; border-radius: 1px; background: var(--track); }
.cd-bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 1px; background: var(--c); box-shadow: 0 0 10px color-mix(in srgb, var(--c) 70%, transparent); }
.cd-then { display: block; min-width: 44px; min-height: 44px; margin: 26px auto 0; padding: 4px 12px; text-align: center; }
.cd-then b { display: block; margin-top: 9px; font: 300 21px/1.2 var(--sans); color: var(--dim); }

/* ── the rest of the day: a hairline a row, and the dot is the check ── */
.cd-list { list-style: none; margin: 44px 0 0; padding: 0; }
.cd-it { position: relative; display: grid; grid-template-columns: 44px 1fr; align-items: center; margin-left: -18.5px; }
.cd-it::before { content: ""; position: absolute; left: 18.5px; right: 0; top: 0; height: 1px; background: var(--hair); }
.cd-it:last-child::after { content: ""; position: absolute; left: 18.5px; right: 0; bottom: 0; height: 1px; background: var(--hair); }
.cd-dot { width: 44px; height: 44px; display: grid; place-items: center; }
.cd-dot i { width: 7px; height: 7px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--c); }
.cd-dot:disabled { cursor: default; }
.cd-it.is-done .cd-dot i { background: var(--c); box-shadow: 0 0 8px var(--c); }
.cd-it.is-past:not(.is-done) .cd-dot i { box-shadow: inset 0 0 0 1.5px var(--miss); }
.cd-it.is-off .cd-dot { visibility: hidden; }
.cd-rb { display: grid; grid-template-columns: 1fr auto; align-items: baseline; column-gap: 12px; row-gap: 4px; min-height: 44px; padding: 14px 0 13px; }
.cd-rn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 400 15px/1.1 var(--sans); }
.cd-rt { font: 500 11px/1 var(--mono); letter-spacing: .08em; color: var(--quiet); font-variant-numeric: tabular-nums; white-space: nowrap; }
.cd-rs { grid-column: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 400 12.5px/1.3 var(--sans); color: var(--quiet); }
/* What you trained rides the name's own line, in the session's colour. */
.cd-rw { color: var(--kc); }
.cd-it.is-done .cd-rn { color: var(--quiet); }
.cd-it.is-past:not(.is-done) .cd-rn { color: var(--dim); }
.cd-it.is-off .cd-rn { color: var(--quiet); text-decoration: line-through; }

/* THE CHECK. White while the block is waiting for you, and lit in the
   block's own colour once it is kept — the row's dot, at the size of
   the one thing you came to do. */
.cd-go {
  position: fixed; left: 50%; bottom: calc(34px + env(safe-area-inset-bottom)); z-index: 30;
  width: 64px; height: 64px; margin-left: -32px; border-radius: 50%;
  display: grid; place-items: center; background: var(--ink); color: var(--on);
  box-shadow: 0 18px 40px -10px rgba(0, 0, 0, .6);
}
.cd-go svg { width: 24px; height: 24px; display: block; }
.cd-go[aria-pressed="true"] { background: var(--c); box-shadow: 0 0 26px color-mix(in srgb, var(--c) 55%, transparent), 0 18px 40px -10px rgba(0, 0, 0, .6); }

.cd-empty { padding: 22px 0; list-style: none; font: 400 15px/1.45 var(--sans); color: var(--dim); text-align: center; }
.cd-link { min-height: 44px; display: inline-flex; align-items: center; font: 500 15px/1 var(--sans); color: var(--ink); }
.cd-empty .cd-link { display: flex; justify-content: center; width: 100%; margin-top: 4px; }

/* ── habits: a dot a habit, and a fortnight of dots under each ── */
.cd-hdots { display: flex; justify-content: center; gap: 12px; margin-top: 22px; }
.cd-hdots i { width: 7px; height: 7px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--hc); }
.cd-hdots i.is-on { background: var(--hc); box-shadow: 0 0 8px var(--hc); }
.cd-hb { list-style: none; margin: 34px 0 0; padding: 0; }
.cd-hr { position: relative; display: grid; grid-template-columns: 44px 1fr; align-items: center; margin-left: -18.5px; }
.cd-hr::before { content: ""; position: absolute; left: 18.5px; right: 0; top: 0; height: 1px; background: var(--hair); }
.cd-hr:last-child::after { content: ""; position: absolute; left: 18.5px; right: 0; bottom: 0; height: 1px; background: var(--hair); }
.cd-hr-b { width: 44px; height: 44px; display: grid; place-items: center; }
.cd-hr-b i { width: 7px; height: 7px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--hc); }
.cd-hr.is-on .cd-hr-b i { background: var(--hc); box-shadow: 0 0 8px var(--hc); }
.cd-hr-n { display: grid; grid-template-columns: 1fr auto; align-items: baseline; column-gap: 12px; row-gap: 8px; min-height: 44px; padding: 14px 0 13px; }
.cd-hr-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 400 15px/1.1 var(--sans); }
.cd-hr-v { font: 400 15px/1.1 var(--sans); color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
.cd-hr-v small { margin-left: 5px; font: 500 9.5px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--quiet); }
.cd-hr-v.is-nil { color: var(--quiet); }
.cd-hr-s { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; min-width: 0; font: 400 12.5px/1.2 var(--sans); color: var(--quiet); }
.cd-hr-s > span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cd-fn { flex: none; display: flex; gap: 3px; }
.cd-fn i { width: 4px; height: 4px; border-radius: 50%; background: var(--nil); }
.cd-fn i.is-on { background: var(--hc); }
.cd-pane > .cd-link { margin-top: 14px; }

/* ── month: a figure a day, and a dot under it ── */
.cd-mhead { flex: none; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; margin: 22px var(--gut) 0; text-align: center; }
.cd-mhead .cd-big { margin-top: 14px; }
.cd-mhead button { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--ink); box-shadow: inset 0 0 0 1px var(--hair); }
.cd-mhead button:disabled { color: rgba(243, 245, 247, .28); box-shadow: none; cursor: default; }
.cd-mhead svg { width: 16px; height: 16px; }
.cd-mcap { flex: none; margin: 14px var(--gut) 0; text-align: center; letter-spacing: .14em; color: var(--quiet); }
.cd-dows { display: grid; grid-template-columns: repeat(7, 1fr); padding: 18px 0 8px; text-align: center; letter-spacing: .1em; color: var(--quiet); }
.cd-mgrid { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 2px; }
.cd-mc { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 50px; }
.cd-mc b { font: 400 14px/1 var(--sans); font-variant-numeric: tabular-nums; }
.cd-mc.is-quiet b, .cd-mc.is-future b { color: var(--quiet); }
.cd-mc.is-today b { font-weight: 700; }
.cd-md { display: flex; gap: 3px; height: 5px; }
.cd-md i { width: 5px; height: 5px; border-radius: 50%; }
.cd-mk { background: var(--nil); }
.cd-mc[data-state="part"] .cd-mk { background: var(--quiet); }
.cd-mc[data-state="whole"] .cd-mk { background: var(--ink); box-shadow: 0 0 6px rgba(243, 245, 247, .55); }
.cd-mc[data-state="none"] .cd-mk { background: none; box-shadow: inset 0 0 0 1.2px var(--miss); }
.cd-mc.is-today .cd-mk { outline: 3px solid rgba(243, 245, 247, .16); }
.cd-ms { background: var(--kc); }
.cd-mc.is-pad { visibility: hidden; }
.cd-legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; margin: 18px 0 0; letter-spacing: .14em; color: var(--quiet); }
.cd-legend span { display: inline-flex; align-items: center; gap: 7px; }
.cd-legend i { width: 5px; height: 5px; border-radius: 50%; background: var(--kc); }

/* ── training: thirty days of dots, and a column of dots a week ── */
.cd-strip { display: flex; justify-content: space-between; max-width: 330px; margin: 22px auto 0; }
.cd-strip i { width: 5px; height: 5px; border-radius: 50%; background: var(--nil); }
.cd-strip i.is-lit { background: var(--kc); box-shadow: 0 0 6px var(--kc); }
.cd-last { margin-top: 20px; }
.cd-figs { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 30px; border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair); }
.cd-figs div { padding: 14px 0 13px; text-align: center; }
.cd-figs div + div { box-shadow: inset 1px 0 0 var(--hair); }
.cd-figs b { display: block; font: 300 26px/1 var(--sans); font-variant-numeric: tabular-nums; }
.cd-figs span { display: block; margin-top: 9px; font: 500 10px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--quiet); }
.cd-lbl { margin: 26px 0 12px; }
.cd-weeks { display: flex; align-items: flex-end; justify-content: space-between; height: 70px; padding: 0 3px; }
.cd-weeks > span { display: flex; flex-direction: column-reverse; align-items: center; gap: 4px; width: 12px; }
.cd-weeks i { width: 6px; height: 6px; border-radius: 50%; background: var(--quiet); }
.cd-weeks > span.is-this i { background: var(--ink); box-shadow: 0 0 6px rgba(243, 245, 247, .5); }
.cd-weeks > span.is-zero i { background: none; box-shadow: inset 0 0 0 1.2px var(--miss); }
.cd-wax { display: flex; justify-content: space-between; margin-top: 12px; font: 500 10px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--quiet); }
.cd-kinds, .cd-recent, .cd-day-l { list-style: none; margin: 0; padding: 0; }
.cd-kinds li, .cd-recent li, .cd-day-l li { box-shadow: inset 0 1px 0 var(--hair); }
.cd-kinds li { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 14px 0 13px; }
.cd-kinds b, .cd-recent b, .cd-day-l b { font: 400 15px/1.3 var(--sans); }
.cd-kinds span, .cd-recent span, .cd-day-l span, .cd-recent time { font: 500 11px/1.3 var(--mono); letter-spacing: .06em; color: var(--quiet); font-variant-numeric: tabular-nums; }
.cd-kinds span, .cd-recent span, .cd-day-l span { text-align: right; }
.cd-kinds em { grid-column: 1 / -1; height: 2px; border-radius: 1px; background: var(--track); overflow: hidden; }
.cd-kinds em i { display: block; height: 100%; border-radius: 1px; background: var(--kc, var(--ink)); }
.cd-recent li { display: grid; grid-template-columns: 56px 1fr auto; gap: 10px; align-items: baseline; padding: 14px 0 13px; }

/* ── the sheet ── */
.cd-scrim { position: fixed; inset: 0; z-index: 40; background: rgba(2, 4, 7, .66); opacity: 0; transition: opacity .2s; }
.cd-scrim.is-open { opacity: 1; }
.cd-sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  max-width: 560px; max-height: 90dvh; margin: 0 auto; overflow-y: auto; overflow-x: hidden;
  padding: 0 var(--gut) calc(env(safe-area-inset-bottom) + 16px);
  background: var(--sheet); border-radius: 28px 28px 0 0;
  box-shadow: inset 0 1px 0 var(--hair), 0 -24px 60px rgba(0, 0, 0, .55);
  transform: translateY(100%); transition: transform .28s cubic-bezier(.2, .8, .2, 1);
}
.cd-sheet.is-open { transform: none; }
.cd-sh-hd { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 24px 0 12px; background: var(--sheet); }
.cd-sh-hd::before { content: ""; position: absolute; left: 50%; top: 9px; width: 36px; height: 4px; margin-left: -18px; border-radius: 2px; background: rgba(243, 245, 247, .18); }
.cd-sh-hd h2 { font: 300 26px/1.1 var(--sans); letter-spacing: -.01em; }
.cd-x { flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--ink); box-shadow: inset 0 0 0 1px var(--hair); }
.cd-x svg { width: 18px; height: 18px; display: block; }
.cd-foot { position: sticky; bottom: calc(-16px - env(safe-area-inset-bottom)); z-index: 2; display: flex; gap: 10px; margin-top: 22px; padding: 12px 0 16px; background: var(--sheet); }

.cd-btn { flex: 1; min-height: 50px; padding: 0 18px; border-radius: 25px; text-align: center; font: 500 15px/1 var(--sans); color: var(--ink); box-shadow: inset 0 0 0 1px var(--hair); }
.cd-btn.go { background: var(--ink); color: var(--on); box-shadow: none; }
.cd-btn.go:disabled { opacity: .4; cursor: default; }
.cd-btn.warn { color: var(--bad); }

.cd-field {
  width: 100%; min-height: 50px; padding: 13px 16px; border: 0; border-radius: 14px;
  font: 400 16px/1.3 var(--sans); color: var(--ink); background: var(--lift);
  -webkit-appearance: none; appearance: none;
}
.cd-field::placeholder { color: var(--faint); }
textarea.cd-field { min-height: 110px; resize: vertical; }
.cd-say { min-height: 60px; font-size: 18px; }
.cd-prev { min-height: 18px; margin: 12px 2px 0; font: 400 13px/1.5 var(--sans); color: var(--quiet); font-variant-numeric: tabular-nums; }
.cd-prev b { font-weight: 600; color: var(--ink); }
.cd-prev.is-need { color: var(--c-work); }

.cd-rows { border-radius: 16px; box-shadow: inset 0 0 0 1px var(--hair); overflow: hidden; }
.cd-row { display: grid; grid-template-columns: 96px 1fr; align-items: center; gap: 10px; min-height: 54px; padding: 4px 14px; }
.cd-row + .cd-row { box-shadow: inset 0 1px 0 var(--hair); }
.cd-row > span { font: 500 10.5px/1.3 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--quiet); }
.cd-row .cd-field { min-height: 44px; padding: 10px 0; background: none; border-radius: 0; }

.cd-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.cd-chip { min-width: 44px; min-height: 44px; padding: 0 16px; border-radius: 22px; text-align: center; font: 500 14px/1 var(--sans); color: var(--dim); box-shadow: inset 0 0 0 1px var(--hair); }
.cd-chip[aria-pressed="true"] { background: var(--ink); color: var(--on); box-shadow: none; }
.cd-chip.kc[aria-pressed="true"] { background: var(--kc); color: var(--on); }
.cd-chips.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cd-chips.days .cd-chip { padding: 0; aspect-ratio: 1; border-radius: 50%; }

.cd-range { width: 100%; height: 44px; margin: 0; background: none; -webkit-appearance: none; appearance: none; }
.cd-range::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: rgba(243, 245, 247, .2); }
.cd-range::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 22px; height: 22px; margin-top: -9.5px; border-radius: 50%; background: var(--ink); box-shadow: 0 4px 12px rgba(0, 0, 0, .5); }
.cd-range::-moz-range-track { height: 3px; border-radius: 2px; background: rgba(243, 245, 247, .2); }
.cd-range::-moz-range-thumb { width: 22px; height: 22px; border: 0; border-radius: 50%; background: var(--ink); box-shadow: 0 4px 12px rgba(0, 0, 0, .5); }
.cd-len { display: block; margin-top: -4px; font: 500 11px/1.3 var(--mono); letter-spacing: .06em; color: var(--quiet); font-variant-numeric: tabular-nums; }

.cd-toggle { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 54px; padding: 0 14px; font: 400 16px/1.2 var(--sans); }
.cd-toggle + .cd-toggle { box-shadow: inset 0 1px 0 var(--hair); }
.cd-toggle:disabled { color: var(--quiet); cursor: default; }
.cd-toggle i { position: relative; flex: none; width: 50px; height: 30px; border-radius: 15px; background: var(--lift2); transition: background .15s; }
.cd-toggle i::after { content: ""; position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--ink); transition: left .15s, background .15s; }
.cd-toggle[aria-pressed="true"] i { background: var(--ink); }
.cd-toggle[aria-pressed="true"] i::after { left: 23px; background: var(--on); }

.cd-grp { margin-bottom: 4px; }
.cd-grp h3 { margin: 20px 0 10px; font: 500 10.5px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--kc, var(--quiet)); }

.cd-num { margin: 10px 0 2px; text-align: center; font: 200 60px/1 var(--sans); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.cd-num small { margin-left: 8px; font: 500 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--quiet); }
.cd-numcap { margin: 6px 0 10px; text-align: center; font: 500 10.5px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--quiet); }

.cd-day-l li { display: grid; grid-template-columns: 8px 1fr auto; align-items: center; gap: 12px; padding: 13px 0 12px; }
.cd-day-l li > i { width: 8px; height: 8px; border-radius: 50%; background: var(--cat, var(--quiet)); }
.cd-note { margin: 12px 0 0; font: 400 14px/1.5 var(--sans); color: var(--dim); }
.cd-cap { margin: 0 0 16px; }

/* ── toast ── */
.cd-toast {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 112px); z-index: 60;
  display: flex; align-items: center; gap: 6px; max-width: calc(100vw - 32px);
  padding: 4px 4px 4px 18px; border-radius: 22px;
  font: 500 14px/1.3 var(--sans); background: #13212C; color: var(--ink);
  box-shadow: inset 0 0 0 1px var(--hair), 0 14px 30px -12px rgba(0, 0, 0, .7); transform: translateX(-50%);
}
.cd-toast button { min-height: 40px; padding: 0 14px; font: 600 14px/1 var(--sans); color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }

@media (prefers-reduced-motion: reduce) {
  .cd-sheet, .cd-scrim, .cd-toggle i, .cd-toggle i::after { transition: none; }
}
</style>

<body>
<div class="cd-app">
  <header class="cd-top">
