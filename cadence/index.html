<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- maximum-scale=1: iOS zooms the page when a field under 16px takes
     focus. Every field here is 16px, and the cap covers the next one. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#03050A" />
<meta name="description" content="The day as one line of time: what is on it, what you kept, and what you trained." />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Cadence" />
<title>Cadence</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B1220'/%3E%3Cpath d='M12 20h14M22 32h18M34 44h18' stroke-width='5' stroke-linecap='round' stroke='%23F2A184'/%3E%3C/svg%3E" />
<link rel="preload" href="../arc/fonts/Inter.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="fonts/GeistMono.woff2" as="font" type="font/woff2" crossorigin />
<style>
/* ═══════════════════════════════════════════════════════════════
   CADENCE — the day as one line of time, under a night sky.

   The language is the alignment app's, taken whole and then given its
   own drawings: a cool black ground with the colour living in
   gradients, a thin display face that reads as confident rather than
   loud, a monospace for every label and every entry, hairlines where
   there were cards, and one white round control per screen.

   Two looks came before this and both were reported in one line. The
   first was mono on everything with heavy tickets and a black dock;
   the second was warm paper, white cards and a raised add button, and
   it read as the daily-process app in another colour. What that second
   one got wrong is the thing this one is built against: a column of
   rows, each with a time on the left, a name, and a check on the right,
   is THAT app's drawing whatever it is painted in.

   So the day is not a list of rows. Every block is drawn on the same
   line of time, at its own place on it, and the rows together fall
   from top left to bottom right — the cadence of the day, as a shape.
   ═══════════════════════════════════════════════════════════════ */
@font-face { font-family: 'Inter'; font-weight: 100 900; font-display: swap;
  src: url('../arc/fonts/Inter.woff2') format('woff2'); }
@font-face { font-family: 'Geist Mono'; font-weight: 100 900; font-display: swap;
  src: url('fonts/GeistMono.woff2') format('woff2'); }

:root {
  color-scheme: dark;
  --ink: #F3F5F7;
  --on-ink: #0B0E13;
  /* The quietest step that is still WORDS: .58 clears 5.4:1 on the
     lightest ground a pane ever puts text on, where .50 is a rounding
     error above the bar. */
  --dim: rgba(243, 245, 247, .74);
  --quiet: rgba(243, 245, 247, .58);
  --hair: rgba(243, 245, 247, .10);
  --lift: rgba(243, 245, 247, .07);
  --lift2: rgba(243, 245, 247, .12);
  --card-ink: rgba(243, 245, 247, .82);

  /* THE SKY, AND THE THREE STOPS WORDS ARE ALLOWED ON. A pane ends a
     glow's height above the foot, so --g-low is the lightest ground any
     label sits on; what is under it is light with nothing written in it.
     The foot is a hint of dusk rather than the alignment app's slate:
     this one ends on the sunset it was once asked to be. */
  --g-top: #03050A;
  --g-mid: #0F1B29;
  --g-low: #182638;
  --glow: 56px;
  --sky: radial-gradient(70% 36% at 90% 3%, rgba(140, 168, 206, .10), transparent 70%),
         linear-gradient(180deg, var(--g-top) 0%, #080F19 18%, var(--g-mid) 46%,
                                 var(--g-low) calc(100% - var(--glow)), #2E2C3D calc(100% - 26px), #5A424A 100%);
  /* A title on a dusk. The light is measured from the FOOT, so whatever
     height the words give the card, the ground under the last line is no
     lighter than #4E5268 and the peach lives in the last 26px, where
     nothing is written. */
  --dusk: linear-gradient(180deg, #0B1220 0%, #15233A 32%, #3A4459 calc(100% - 62px),
                                  #4E5268 calc(100% - 26px), #8C727B calc(100% - 11px), #D99B83 100%);

  /* FOUR HUES, AND THEY ARE THE SKY'S: peach, lavender, sand and
     sea-glass. Colour says WHICH part of life a block is, never whether
     you kept it — kept is the ground, the ink with the paper on it. */
  --c-body: #F2A184;
  --c-mind: #B7A5FF;
  --c-work: #E8C67C;
  --c-rest: #7DCFD8;
  --c-none: #9AA2AA;
  --k-weights: #F2A184;
  --k-run: #7DCFD8;
  --k-recovery: #B7A5FF;
  --k-rest: #9AA2AA;
  /* Six habits to tell apart, so two more of the same register. */
  --h-water: #8DB6F0;
  --h-sleep: #E7A3C0;
  --bad: #FF9A8C;

  --sans: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --r-card: 22px;
  --gut: 18px;
}

*, *::before, *::after { box-sizing: border-box; }
/* Said once, for every element: an author `display` outranks the
   browser's own [hidden] rule, and that has broken a view, a toast and
   an overlay in this repo's other app. One line removes the class. */
[hidden] { display: none !important; }

html { -webkit-text-size-adjust: 100%; }
/* The strip under the home indicator is body's own colour on iOS, so it
   takes the foot of the sky rather than showing a band of something else. */
html, body { height: 100%; background-color: #5A424A; }
body {
  position: fixed; inset: 0; margin: 0; overflow: hidden; overscroll-behavior: none;
  background-image: var(--sky); background-repeat: no-repeat; background-size: 100% 100%;
  color: var(--ink);
  font: 400 15px/1.4 var(--sans);
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; touch-action: manipulation; }
button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.cd-field:focus-visible { outline: 1px solid var(--dim); outline-offset: -1px; }
.cd-row .cd-field:focus-visible { outline: none; }

/* THE LABEL REGISTER. One size, one tracking, one face: a label that
   comes in three sizes is three labels. */
.cd-caps { margin: 0; font: 500 10.5px/1.35 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--quiet); }

.cd-app { display: flex; flex-direction: column; height: 100%; max-width: 560px; margin: 0 auto; }

/* ── the nav: four marks and a line, at the TOP ──
   The quietest thing on the screen. The one you are on is the ink with
   a hairline under it; the line is what says which, so no ground. */
.cd-nav { position: relative; flex: none; display: flex; justify-content: center; gap: 2px; padding: calc(4px + env(safe-area-inset-top)) 0 0; }
.cd-tab { position: relative; width: 52px; height: 44px; display: grid; place-items: center; color: var(--quiet); }
.cd-tab svg { width: 18px; height: 18px; display: block; }
.cd-tab::after { content: ""; position: absolute; left: 50%; bottom: 7px; width: 16px; height: 1px; margin-left: -8px; background: var(--ink); opacity: 0; }
.cd-tab[aria-current="page"] { color: var(--ink); }
.cd-tab[aria-current="page"]::after { opacity: 1; }
.cd-gear { position: absolute; right: 6px; bottom: 0; width: 44px; height: 44px; display: grid; place-items: center; color: var(--quiet); }
.cd-gear svg { width: 18px; height: 18px; display: block; }

.cd-main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.cd-main > section { flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* ── a screen's head: a title on a dusk ── Outside the pane, so the list
   scrolls under nothing and the head is there to move between. */
.cd-head { position: relative; flex: none; margin: 6px 12px 10px; padding: 18px 20px 36px; border-radius: var(--r-card); background: var(--dusk); }
.cd-kick { color: var(--card-ink); }
.cd-disp { margin: 8px 0 0; max-width: calc(100% - 52px); font: 300 34px/1.04 var(--sans); letter-spacing: -.03em; }
.cd-headsub { margin-top: 10px; font-variant-numeric: tabular-nums; }

/* THE ONE WHITE THING ON A SCREEN. It carries its own ground, so it can
   sit on any part of the sky; the alignment app's own control. */
.cd-round {
  width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none;
  background: #FFFFFF; color: var(--on-ink);
  box-shadow: 0 8px 22px rgba(4, 8, 14, .32), inset 0 1px 0 rgba(255, 255, 255, .9);
}
.cd-round svg { width: 18px; height: 18px; display: block; }
.cd-head > .cd-round { position: absolute; top: 14px; right: 14px; }

/* ── the week: seven dates, the one you are on is the ground ── */
.cd-week { flex: none; display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin: 0 12px; }
.cd-wd { display: flex; flex-direction: column; align-items: center; gap: 5px; min-height: 60px; padding: 8px 0 9px; border-radius: 14px; }
.cd-wd-l { font: 500 10px/1 var(--mono); letter-spacing: .08em; color: var(--quiet); }
.cd-wd-n { font: 300 20px/1 var(--sans); letter-spacing: -.02em; font-variant-numeric: tabular-nums; color: var(--dim); }
.cd-wd-k { width: 18px; height: 2px; border-radius: 1px; background: var(--hair); overflow: hidden; }
.cd-wd-k i { display: block; height: 100%; background: var(--ink); }
.cd-wd.is-today .cd-wd-l { color: var(--ink); }
.cd-wd.is-future .cd-wd-k { visibility: hidden; }
.cd-wd[aria-pressed="true"] { background: var(--lift2); }
.cd-wd[aria-pressed="true"] .cd-wd-n { color: var(--ink); font-weight: 400; }

/* ── the scale: the hours every row below is drawn against ── */
.cd-scale { position: relative; flex: none; height: 26px; margin: 10px var(--gut) 0; border-bottom: 1px solid var(--hair); }
.cd-scale span { position: absolute; bottom: 7px; transform: translateX(-50%); font: 500 9.5px/1 var(--mono); letter-spacing: .06em; color: var(--quiet); font-variant-numeric: tabular-nums; }
.cd-scale span.is-first { transform: none; }
.cd-scale span.is-last { transform: translateX(-100%); }
.cd-scale b { position: absolute; bottom: 3px; z-index: 1; transform: translateX(-50%); padding: 3px 6px; border-radius: 6px; font: 600 9.5px/1 var(--mono); letter-spacing: .04em; background: var(--ink); color: var(--on-ink); font-variant-numeric: tabular-nums; }

/* A PANE ENDS WHERE THE LIGHT BEGINS, and a mask — never a gradient laid
   over the words — dissolves the list into it. */
.cd-pane {
  flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain;
  margin-bottom: var(--glow); padding: 0 var(--gut) 34px; scrollbar-width: none;
  -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 8px, #000 calc(100% - 60px), transparent 100%);
          mask-image: linear-gradient(180deg, transparent 0, #000 8px, #000 calc(100% - 60px), transparent 100%);
}
.cd-pane::-webkit-scrollbar { display: none; }

/* ── the day: every block on one line of time ──
   A row is the block's name and what is true of it, and under that the
   whole span of the day with the block drawn at its own place. Read
   down, the segments fall from left to right; the gaps between them are
   literal space, and one hairline crosses every row at the clock. */
.cd-agenda { position: relative; list-style: none; margin: 0; padding: 0; }
/* NO RULE BETWEEN ROWS: each row's own line of time is what ends it, and
   a border under that was two lines saying one thing. */
.cd-it { position: relative; }
.cd-tk-b { display: block; width: 100%; padding: 14px 68px 12px 0; }
.cd-tk-n { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 500 12.5px/1.4 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink); }
.cd-tk-m { display: block; margin-top: 3px; font: 400 10.5px/1.35 var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--quiet); font-variant-numeric: tabular-nums; }
.cd-tk-m i { font-style: normal; color: var(--ink); }
.cd-tk-w { display: block; margin-top: 5px; font: 500 10.5px/1.35 var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--kc, var(--dim)); }
/* The track runs under the stamp too: every row's line of time is the
   same width as the scale and the now line, or the picture lies. */
.cd-track { position: relative; display: block; height: 7px; margin: 11px -68px 0 0; }
.cd-track::before { content: ""; position: absolute; left: 0; right: 0; top: 3px; height: 1px; background: var(--hair); }
.cd-seg { position: absolute; top: 1px; height: 5px; min-width: 5px; border-radius: 3px; background: color-mix(in srgb, var(--cat) 55%, transparent); }
.cd-seg.is-dot { width: 7px; min-width: 0; height: 7px; top: 0; margin-left: -3.5px; border-radius: 50%; }
.cd-seg > i { display: block; height: 100%; border-radius: inherit; background: var(--cat); }
.cd-it.is-done .cd-seg { background: var(--cat); box-shadow: 0 0 10px color-mix(in srgb, var(--cat) 55%, transparent); }
/* Behind you and not kept is the flat neutral, never a red: the bar says
   when it was, and the row says nothing about you. Every state of the bar
   is a graphic held to 3:1, which is why the neutral is not fainter. */
.cd-it.is-past:not(.is-done) .cd-seg { background: rgba(243, 245, 247, .36); }
.cd-it.is-off .cd-seg { display: none; }
.cd-it.is-past .cd-tk-n { color: var(--dim); }
.cd-it.is-off .cd-tk-n { color: var(--quiet); text-decoration: line-through; }

/* THE STATE IS THE GROUND, never a second word: KEPT on the lift is not
   yet, KEPT on the ink is done, and nothing reflows under the press. */
.cd-stamp { position: absolute; top: 7px; right: 0; width: 64px; height: 44px; display: flex; align-items: center; justify-content: flex-end; }
.cd-stamp span, .cd-chk {
  display: grid; place-items: center; height: 28px; padding: 0 11px; border-radius: 999px;
  font: 500 10px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase;
  color: var(--dim); background: var(--lift2);
}
.cd-stamp[aria-pressed="true"] span, .cd-chk.is-on { background: var(--ink); color: var(--on-ink); }
.cd-stamp:disabled { cursor: default; }
.cd-stamp:disabled span { opacity: .38; }
.cd-it.is-off .cd-stamp { visibility: hidden; }

/* Time nobody has claimed, drawn as a dimension line across exactly the
   stretch it covers, and measured beside it rather than over it. */
.cd-gap { position: relative; height: 24px; }
.cd-gap b { position: absolute; top: 12px; height: 1px; background: var(--quiet); }
.cd-gap b::before, .cd-gap b::after { content: ""; position: absolute; top: -3px; width: 1px; height: 7px; background: var(--quiet); }
.cd-gap b::before { left: 0; }
.cd-gap b::after { right: 0; }
.cd-gap p { position: absolute; top: 7px; margin: 0; white-space: nowrap; font: 400 9.5px/1 var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--quiet); }

/* THE CLOCK IS A MARK ON EVERY LINE OF TIME, NOT ONE LINE THROUGH THE
   PAGE. A single rule crossed every name and every countdown at the same
   x, which is a line drawn through the words you are trying to read; a
   tick on each track reads down the page as the same line, broken
   exactly where there is type. Not through the gaps either: their own
   figure sits on that line as often as not. */
.cd-tnow { position: absolute; top: -4px; width: 1px; height: 15px; margin-left: -.5px; background: var(--ink); pointer-events: none; }

.cd-empty { padding: 30px 2px; list-style: none; font: 300 19px/1.4 var(--sans); letter-spacing: -.01em; color: var(--dim); }
.cd-empty .cd-link { display: flex; margin-top: 8px; }
.cd-link { min-height: 44px; display: inline-flex; align-items: center; font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink); }

/* ── shared by every pane ── */
.cd-sec { display: flex; justify-content: space-between; align-items: baseline; margin: 0; padding: 26px 2px 10px; border-bottom: 1px solid var(--hair); }
.cd-lbl { margin: 24px 2px 10px; }

/* ── habits: hairline rows, and a fortnight as a pulse under each ── */
.cd-hb { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--hair); }
.cd-hr { position: relative; border-bottom: 1px solid var(--hair); }
.cd-hr-b { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; width: 100%; min-height: 62px; padding: 14px 46px 10px 0; }
.cd-hr-n { display: flex; align-items: center; gap: 9px; font: 500 12.5px/1.4 var(--mono); letter-spacing: .06em; text-transform: uppercase; }
.cd-hr-n::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--hc); }
.cd-hr-s { display: block; margin-top: 3px; padding-left: 15px; font: 400 10.5px/1.35 var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--quiet); }
.cd-hr-v { font: 300 24px/1 var(--sans); letter-spacing: -.02em; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.cd-hr-v small { margin-left: 4px; font: 500 10px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--quiet); }
.cd-hr-v.is-nil { color: var(--quiet); }
.cd-hr-more { position: absolute; top: 12px; right: -8px; width: 44px; height: 44px; display: grid; place-items: center; color: var(--quiet); }
.cd-hr-more svg { width: 14px; height: 14px; }
/* Fourteen marks, a day each: a tick stands full when kept, a number
   stands as tall as its share of the fortnight's best. */
.cd-tape { display: flex; align-items: flex-end; gap: 4px; height: 26px; padding: 0 0 12px 15px; }
.cd-tape i { width: 3px; height: 3px; border-radius: 1.5px; background: var(--hair); }
.cd-tape i.on { background: var(--hc); }
.cd-pane > .cd-link { margin-top: 6px; }

/* ── month: a luminous grid, as bright as the day was kept ── */
.cd-mnav { position: absolute; top: 12px; right: 12px; display: flex; gap: 4px; }
.cd-mnav button { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--ink); background: rgba(243, 245, 247, .1); }
.cd-mnav button:disabled { color: rgba(243, 245, 247, .28); background: transparent; cursor: default; }
.cd-mnav svg { width: 16px; height: 16px; }
#cdVMon .cd-disp { max-width: calc(100% - 96px); }
.cd-dows { display: grid; grid-template-columns: repeat(7, 1fr); padding: 6px 0 10px; text-align: center; }
.cd-mgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.cd-mc { position: relative; min-height: 44px; aspect-ratio: 1; border-radius: 12px; display: grid; place-items: center; text-align: center;
  font: 300 16px/1 var(--sans); font-variant-numeric: tabular-nums; color: var(--ink); background: var(--lift); }
.cd-mc.is-quiet, .cd-mc.is-future { background: transparent; color: var(--quiet); }
.cd-mc.is-l1 { background: rgba(243, 245, 247, .15); }
.cd-mc.is-l2 { background: rgba(243, 245, 247, .25); }
.cd-mc.is-l3 { background: rgba(243, 245, 247, .37); }
.cd-mc.is-l4 { background: #F3F5F7; color: var(--on-ink); font-weight: 400; box-shadow: 0 0 18px rgba(243, 245, 247, .22); }
/* An outline rather than an inset ring, so it still shows round the one
   square that has turned white. */
.cd-mc.is-today { outline: 1px solid var(--ink); outline-offset: 2px; }
.cd-mc em { position: absolute; left: 50%; bottom: 6px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--kc, transparent); }
.cd-mc.is-pad { visibility: hidden; }
.cd-legend { display: flex; flex-wrap: wrap; gap: 18px; margin: 18px 2px 0; }
.cd-legend span { display: inline-flex; align-items: center; gap: 7px; }
.cd-legend i { width: 6px; height: 6px; border-radius: 50%; background: var(--kc); }

/* ── training: figures in the thin face, hairlines between ── */
.cd-figs { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair); }
.cd-figs div { padding: 16px 0 14px 14px; }
.cd-figs div:first-child { padding-left: 2px; }
.cd-figs div + div { border-left: 1px solid var(--hair); }
.cd-figs b { display: block; font: 300 32px/1 var(--sans); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.cd-figs span { display: block; margin-top: 9px; font: 500 10px/1.3 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--quiet); }
.cd-weeks { display: flex; align-items: flex-end; gap: 7px; height: 96px; margin-top: 18px; }
.cd-weeks i { flex: 1; min-height: 2px; border-radius: 3px 3px 1px 1px; background: rgba(243, 245, 247, .26); }
.cd-weeks i.is-zero { background: var(--hair); }
.cd-weeks i.is-this { background: var(--ink); }
.cd-wax { display: flex; justify-content: space-between; margin-top: 10px; }
.cd-kinds, .cd-recent, .cd-day-l { list-style: none; margin: 0; padding: 0; }
.cd-kinds li { display: grid; grid-template-columns: 1fr auto; gap: 9px 10px; padding: 14px 2px; border-bottom: 1px solid var(--hair); }
.cd-kinds b, .cd-recent b, .cd-day-l b { font: 500 12px/1.3 var(--mono); letter-spacing: .06em; text-transform: uppercase; }
.cd-kinds span, .cd-recent span, .cd-day-l span, .cd-recent time { font: 400 10.5px/1.3 var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--quiet); font-variant-numeric: tabular-nums; }
.cd-kinds span, .cd-recent span, .cd-day-l span { text-align: right; }
.cd-kinds em { grid-column: 1 / -1; height: 3px; border-radius: 2px; background: var(--hair); overflow: hidden; }
.cd-kinds em i { display: block; height: 100%; border-radius: 2px; background: var(--kc, var(--ink)); }
.cd-recent li { display: grid; grid-template-columns: 62px 1fr auto; gap: 10px; align-items: baseline; padding: 14px 2px; border-bottom: 1px solid var(--hair); }

/* ── the sheet ── */
.cd-scrim { position: fixed; inset: 0; z-index: 40; background: rgba(2, 4, 8, .62); opacity: 0; transition: opacity .2s; }
.cd-scrim.is-open { opacity: 1; }
.cd-sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  max-width: 560px; max-height: 90dvh; margin: 0 auto; overflow-y: auto; overflow-x: hidden;
  padding: 0 var(--gut) calc(env(safe-area-inset-bottom) + 16px);
  background: #0D1420; border-radius: 26px 26px 0 0;

  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + var(--glow) + 8px); z-index: 60;
  display: flex; align-items: center; gap: 6px; max-width: calc(100vw - 32px);
