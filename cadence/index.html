<html lang="en">

     focus. Every field here is 16px, and the cap covers the next one. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#D9E2EA" />
<meta name="description" content="A notebook for the day: what is on it, what you kept, and what you trained." />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Cadence" />
<title>Cadence</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230E1924'/%3E%3Cpath d='M0 46Q32 30 64 46V64H0Z' fill='%230B0706'/%3E%3Cpath d='M0 46Q32 30 64 46' fill='none' stroke='%23FF6A2B' stroke-width='3'/%3E%3C/svg%3E" />
<link rel="preload" href="fonts/SpaceGrotesk.woff2" as="font" type="font/woff2" crossorigin />

<!-- The face is decided before the stylesheet applies, so a phone set to
     dark never paints one frame of paper first. Same key the app keeps;
     nothing escapes the wrapper. -->
<script>
(function () {
  var m = 'auto';
  try { m = localStorage.getItem('cad.mode.v1') || 'auto'; } catch (e) {}
  if (m !== 'light' && m !== 'dark') {
    m = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-mode', m);
})();
</script>
<style>
/* ═══════════════════════════════════════════════════════════════
   CADENCE — the day as a rail of cards under a sky, above a planet.

   One display face for what you are looking at (Space Grotesk: the
   day, a figure, a title) and one text face for everything you read
   (Inter). Both ship with the repo, so the phone and the suite draw
   the same letters. Figures are tabular so a column of times lines up.

   It went in first as mono on everything with heavy tickets and a
   black dock, and was reported in one line: it does not look good.
   What that version got wrong is kept here so it is not repeated:
   a monospace everywhere reads as a terminal, a colour said three
   times (edge, node, icon) is noise, and an empty box per day is a
   month that looks unfinished rather than one that is quiet.

   The second look was warm paper, and it was replaced by a photograph:
   a sunset seen from altitude, navy sky over a limb of orange fire over
   dark earth. The sky is the page, the limb is the horizon everything
   you read stops above, and the earth is what the tab bar stands on.
   ═══════════════════════════════════════════════════════════════ */
@font-face { font-family: 'Space Grotesk'; font-weight: 300 700; font-display: swap;
  src: url('fonts/SpaceGrotesk.woff2') format('woff2'); }
@font-face { font-family: 'Inter'; font-weight: 100 900; font-display: swap;
  src: url('../arc/fonts/Inter.woff2') format('woff2'); }

:root, :root[data-mode="light"] {
  /* The day side: the high sky before the glow, pale steel going paler. */
  --sky-t: #D9E2EA;
  --sky-m: #E5EBF0;
  --sky-b: #EEF1F3;
  --bg: #E5EBF0;
  --card: #FFFFFF;
  --card2: #EEF2F5;
  --ink: #0F1B26;
  --ink2: #3C4B58;
  --ink3: #48586A;
  --line: #D6DFE6;
  --line2: #E7EDF1;
  --edge: #B6C4D0;
  --accent: #A3360A;
  --on-accent: #FFFFFF;
  --bad: #A8200F;
  --toast-acc: #FF8A4C;
  /* Colour says WHICH part of life a block is, never whether you kept it.
     All four come off the photograph: the limb, the amber band, the
     upper sky, and the violet a sunset leaves above it. */
  --c-body: #A3360A;
  --c-mind: #1B587E;
  --c-work: #7A4F00;
  --c-rest: #654696;
  --c-none: #48586A;
  --k-weights: #A3360A;
  --k-run: #1B587E;
  --k-recovery: #654696;
  --k-rest: #48586A;
  --haze: #F2C79A;
  --scrim: rgba(15, 27, 38, .34);
  --shadow: 0 1px 2px rgba(15, 27, 38, .06), 0 8px 20px -12px rgba(15, 27, 38, .26);
  color-scheme: light;
  --disp: 'Space Grotesk', ui-rounded, -apple-system, system-ui, sans-serif;
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', Roboto, sans-serif;
  /* The planet is the same on both faces, and so is what sits on it. */
  --earth: #0B0706;
  --earth-hi: #2A140A;
  --limb: #FF6A2B;
  --sun: #FF6A2B;
  --on-sun: #1A0D06;
  --dock-ink: #B3A69C;
  --dock-acc: #FF8A4C;
  /* The band the sky leaves for the horizon: the limb's apex sits inside
     it and nothing you read is drawn over it. */
  --hz: 96px;
}
:root[data-mode="dark"] {
  color-scheme: dark;
  --sky-t: #090F16;
  --sky-m: #0E1924;
  --sky-b: #13212F;
  --bg: #0E1924;
  --card: #1A2937;
  --card2: #223445;
  --ink: #EEF2F5;
  --ink2: #A9B8C4;
  --ink3: #8D9DAB;
  --line: #273949;
  --line2: #203141;
  --edge: #3E5264;
  --accent: #FF7A3D;
  --on-accent: #1A0D06;
  --bad: #FF7A6E;
  --toast-acc: #A3360A;
  --c-body: #FF7A3D;
  --c-mind: #7FB4D6;
  --c-work: #F2B258;
  --c-rest: #C4A8E6;
  --c-none: #8D9DAB;
  --k-weights: #FF7A3D;
  --k-run: #7FB4D6;
  --k-recovery: #C4A8E6;
  --k-rest: #8D9DAB;
  --haze: #E9C49A;
  --scrim: rgba(3, 7, 11, .6);
  --shadow: inset 0 1px 0 rgba(200, 225, 245, .05), 0 0 0 1px rgba(150, 185, 215, .05), 0 12px 26px -16px rgba(0, 0, 0, .9);
}

*, *::before, *::after { box-sizing: border-box; }
/* Said once, for every element: an author `display` outranks the
   browser's own [hidden] rule, and that has broken a view, a toast and
   an overlay in this repo's other app. One line removes the class. */
[hidden] { display: none !important; }

html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  height: 100dvh;
  background: var(--sky-m);
  color: var(--ink);
  font: 400 15px/1.35 var(--sans);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* A field is focused because you are typing in it, so the ring sits ON
   its edge rather than floating outside a card that already has one. */
.cd-field:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
.cd-row .cd-field:focus-visible { outline: none; }

.cd-app {
  position: relative; z-index: 2;
  display: flex; flex-direction: column; height: 100dvh; max-width: 560px; margin: 0 auto;
  padding-bottom: calc(env(safe-area-inset-bottom) + var(--hz));
}

/* ── the sky, the limb and the earth ──
   Fixed, drawn once and never moved: the scroller composites over them.
   A pseudo-element rather than background-attachment, which iOS ignores. */
body::before {
  content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: linear-gradient(to bottom, var(--sky-t), var(--sky-m) 48%, var(--sky-b));
}
/* An ellipse far wider than the phone, so its top is a curve that drops
   about fourteen pixels across a 390px screen: the limb in the photograph
   at the photograph's scale. Every glow follows the curve because it is
   the ellipse's own shadow. */
.cd-earth {
  position: fixed; z-index: 1; left: 50%; width: 1400px; height: 700px; margin-left: -700px;
  top: calc(100% - env(safe-area-inset-bottom) - var(--hz) + 18px);
  border-radius: 50%; pointer-events: none;
  background: radial-gradient(ellipse 34% 22% at 50% 0%, var(--earth-hi), var(--earth));
  box-shadow:
    0 -1px 0 .5px var(--limb),
    0 -2px 5px 1px color-mix(in srgb, var(--limb) 85%, transparent),
    0 -7px 16px 2px color-mix(in srgb, var(--limb) 45%, transparent),
    0 -18px 34px 4px color-mix(in srgb, var(--haze) 26%, transparent),
    0 -40px 70px 14px color-mix(in srgb, var(--haze) 10%, transparent);
}
/* Brightest where the sun has just gone: over the middle, which is also
   where the add button sits on the dark side of the line. */
.cd-earth::before {
  content: ""; position: absolute; left: 50%; top: -46px; width: 460px; height: 92px; margin-left: -230px;
  background: radial-gradient(ellipse 50% 50% at 50% 50%, color-mix(in srgb, var(--limb) 34%, transparent), transparent 70%);
}

/* ── the top line: which day, and the settings ── */
.cd-top {
  display: flex; align-items: center; justify-content: space-between;
  padding: calc(env(safe-area-inset-top) + 4px) 8px 0 20px; min-height: 48px;
  flex: none;
}
.cd-eyebrow { margin: 0; font: 600 12px/1 var(--sans); letter-spacing: .07em; text-transform: uppercase; color: var(--ink3); }
.cd-iconbtn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; color: var(--ink2); }
.cd-iconbtn svg { width: 22px; height: 22px; }

/* The day ends at the horizon rather than running under it: the rows fade
   out above the glow, so nothing you read is ever drawn over the fire. */
.cd-main {
  flex: 1; overflow-y: auto; overflow-x: hidden; padding: 0 20px 30px;
  -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 28px), transparent);
  mask-image: linear-gradient(to bottom, #000 calc(100% - 28px), transparent);
}

/* ── the day's head: its name, what is left of it, and a ring ── */
.cd-dhead { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin: 0 0 18px; }
.cd-title { margin: 0; font: 600 34px/1.05 var(--disp); letter-spacing: -.025em; }
.cd-sub { margin: 6px 0 0; font: 500 14px/1.3 var(--sans); color: var(--ink2); font-variant-numeric: tabular-nums; }
.cd-ring { position: relative; width: 58px; height: 58px; flex: none; }
.cd-ring svg { width: 58px; height: 58px; transform: rotate(-90deg); }
.cd-ring .rt { stroke: var(--line); }
.cd-ring .rv { stroke: var(--accent); transition: stroke-dashoffset .4s ease; }
.cd-ring b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 600 15px/1 var(--disp); font-variant-numeric: tabular-nums; }
.cd-ring b small { font-size: 12px; color: var(--ink3); font-weight: 500; }

/* ── the week: seven days on one card ── */
.cd-ribbon {
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px;
  margin: 0 0 22px; padding: 8px 6px 9px;
  background: var(--card); border-radius: 18px; box-shadow: var(--shadow);
}
.cd-rb { display: flex; flex-direction: column; align-items: center; gap: 5px; min-height: 66px; padding: 2px 0; border-radius: 12px; }
.cd-rb-l { font: 600 11px/1 var(--sans); letter-spacing: .04em; color: var(--ink3); }
.cd-rb-n {
  width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
  font: 600 16px/1 var(--disp); font-variant-numeric: tabular-nums;
}
.cd-rb-bar { width: 16px; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
.cd-rb-bar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.cd-rb.is-future .cd-rb-bar { visibility: hidden; }
.cd-rb.is-today .cd-rb-l { color: var(--accent); }
.cd-rb.is-today .cd-rb-n { color: var(--accent); }
.cd-rb[aria-pressed="true"] .cd-rb-n { background: var(--ink); color: var(--bg); }

/* ── the rail ── */
.cd-agenda { list-style: none; margin: 0; padding: 0; }
.cd-it { display: grid; grid-template-columns: 42px 16px 1fr; column-gap: 8px; }
.cd-time { padding-top: 24px; text-align: right; font: 600 13px/1 var(--sans); font-variant-numeric: tabular-nums; color: var(--ink); }
.cd-it.is-past .cd-time { color: var(--ink3); }
.cd-node { position: relative; }
.cd-node::before { content: ""; position: absolute; left: 7px; top: 0; bottom: 0; width: 2px; border-radius: 1px; background: var(--line); }
.cd-it:first-child .cd-node::before { top: 26px; }
.cd-it:last-child .cd-node::before { bottom: calc(100% - 26px); }
.cd-node b {
  position: absolute; left: 3px; top: 22px; width: 10px; height: 10px; border-radius: 50%;
  background: var(--bg); border: 2px solid var(--cat, var(--c-none));
}
.cd-it.is-done .cd-node b { background: var(--cat, var(--c-none)); }

.cd-tk {
  position: relative; display: flex; align-items: stretch; min-height: 62px; margin: 5px 0;
  background: var(--card); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden;
}
.cd-tk-b { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 12px 2px 12px 12px; text-align: left; }
.cd-ic {
  width: 36px; height: 36px; flex: none; border-radius: 11px; display: grid; place-items: center;
  color: var(--cat, var(--c-none)); background: color-mix(in srgb, var(--cat, var(--c-none)) 13%, transparent);
}
.cd-ic svg { width: 19px; height: 19px; }
.cd-tk-t { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
.cd-tk-n { max-width: 100%; font: 600 16px/1.2 var(--sans); letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cd-tk-m { font: 500 13px/1.25 var(--sans); color: var(--ink2); font-variant-numeric: tabular-nums; }
.cd-tk-m i { font-style: normal; font-weight: 600; color: var(--accent); }
.cd-tk-w {
  margin-top: 3px; padding: 3px 8px; border-radius: 999px;
  font: 600 11.5px/1.2 var(--sans); color: var(--ink);
  background: color-mix(in srgb, var(--kc, var(--ink3)) 15%, transparent);
}
.cd-stamp { width: 56px; flex: none; display: grid; place-items: center; }
.cd-stamp span {
  width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--edge);
  display: grid; place-items: center; color: transparent; transition: background .15s, border-color .15s;
}
.cd-stamp svg { width: 15px; height: 15px; }
.cd-stamp:disabled { cursor: default; }
.cd-stamp:disabled span { border-style: dashed; opacity: .6; }
.cd-prog { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--accent); }

.cd-it.is-done .cd-stamp span { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.cd-it.is-done .cd-tk-n { color: var(--ink2); }
.cd-it.is-off .cd-tk { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.cd-it.is-off .cd-tk-n { color: var(--ink3); text-decoration: line-through; }
.cd-it.is-off .cd-stamp { visibility: hidden; }
.cd-it.is-now .cd-tk { box-shadow: inset 0 0 0 1.5px var(--accent), var(--shadow); }

/* Time nobody has claimed yet, measured. */
.cd-gap { display: grid; grid-template-columns: 42px 16px 1fr; column-gap: 8px; min-height: 30px; }
.cd-gap .cd-node::before { background: repeating-linear-gradient(to bottom, var(--edge) 0 3px, transparent 3px 7px); }
.cd-gap p { margin: 0; align-self: center; padding-left: 4px; font: 500 12px/1 var(--sans); color: var(--ink3); }

.cd-nowline { display: grid; grid-template-columns: 42px 16px 1fr; column-gap: 8px; align-items: center; height: 24px; }
.cd-nowline span {
  justify-self: end; padding: 3px 6px; border-radius: 999px;
  font: 700 11px/1 var(--sans); font-variant-numeric: tabular-nums;
  background: var(--accent); color: var(--on-accent);
}
.cd-nowline i { grid-column: 2 / 4; height: 2px; border-radius: 1px; background: var(--accent); position: relative; }
.cd-nowline i::before { content: ""; position: absolute; left: 3px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }

.cd-empty { padding: 36px 8px; text-align: center; font: 500 16px/1.4 var(--sans); color: var(--ink2); list-style: none; }
.cd-empty .cd-link { display: flex; margin: 6px auto 0; justify-content: center; }
.cd-link { min-height: 44px; display: inline-flex; align-items: center; font: 600 15px/1 var(--sans); color: var(--accent); }

/* ── shared by every view ── */
.cd-h2 { margin: 0 0 6px; font: 600 34px/1.05 var(--disp); letter-spacing: -.025em; }
.cd-h2-solo { margin-bottom: 18px; }
.cd-cap { margin: 0 0 18px; font: 500 14px/1.35 var(--sans); color: var(--ink2); }
.cd-lbl { margin: 24px 4px 8px; font: 600 12px/1 var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--ink3); }
.cd-card { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); }

/* ── habits: one card, a row each, a fortnight under every row ── */
.cd-hb { list-style: none; margin: 0; padding: 0; }
.cd-hr { position: relative; display: grid; grid-template-columns: 1fr auto; align-items: center; padding: 0 4px 0 14px; }
.cd-hr + .cd-hr::before { content: ""; position: absolute; left: 62px; right: 0; top: 0; height: 1px; background: var(--line2); }
.cd-hr-b { display: grid; grid-template-columns: 36px 1fr auto; align-items: center; gap: 12px; min-height: 60px; padding: 12px 0 8px; text-align: left; }
.cd-hr-n { display: block; font: 600 16px/1.2 var(--sans); letter-spacing: -.01em; }
.cd-hr-s { display: block; margin-top: 2px; font: 500 13px/1.25 var(--sans); color: var(--ink2); }
.cd-hr-v { font: 600 18px/1 var(--disp); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.cd-hr-v small { margin-left: 3px; font: 500 12px/1 var(--sans); color: var(--ink2); }
.cd-hr-v.is-nil { font: 500 15px/1 var(--sans); color: var(--ink3); }
.cd-chk {
  width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--edge);
  display: grid; place-items: center; color: transparent;
}
.cd-chk svg { width: 15px; height: 15px; }
.cd-chk.is-on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.cd-hr-more { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; color: var(--ink3); }
.cd-hr-more svg { width: 16px; height: 16px; }
.cd-tape { grid-column: 1 / -1; display: flex; gap: 4px; padding: 0 12px 14px 48px; }
.cd-tape i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.cd-tape i.on { background: var(--hc, var(--ink)); }

/* ── month: a ring round each day, a dot for what you trained ── */
.cd-mhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 4px; }
.cd-mhead .cd-h2 { margin: 0; }
.cd-mhead div { display: flex; gap: 6px; flex: none; }
.cd-mhead button {
  width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
  background: var(--card); box-shadow: var(--shadow); color: var(--ink);
}
.cd-mhead button:disabled { background: transparent; box-shadow: none; color: var(--edge); cursor: default; }
.cd-mhead svg { width: 18px; height: 18px; }
.cd-cal { padding: 14px 8px 10px; }
.cd-dows { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 6px; text-align: center; font: 600 11px/1 var(--sans); letter-spacing: .04em; color: var(--ink3); }
.cd-mgrid { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 4px; }
.cd-mc { display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; padding: 3px 0 2px; border-radius: 12px; }
.cd-mr { position: relative; width: 36px; height: 36px; display: grid; place-items: center; }
.cd-mr svg { position: absolute; inset: 0; width: 36px; height: 36px; transform: rotate(-90deg); }
.cd-mr b { position: relative; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 600 13px/1 var(--disp); font-variant-numeric: tabular-nums; }
.cd-mc .ring-t { stroke: var(--line); }
.cd-mc .ring-v { stroke: var(--accent); }
.cd-mc em { width: 6px; height: 6px; border-radius: 50%; background: var(--kc, transparent); }
.cd-mc.is-pad { visibility: hidden; }
.cd-mc.is-future b { color: var(--ink3); font-weight: 500; }
.cd-mc.is-today b { background: var(--ink); color: var(--bg); }
.cd-legend { display: flex; flex-wrap: wrap; gap: 16px; margin: 14px 4px 0; font: 500 12px/1 var(--sans); color: var(--ink2); }
.cd-legend span { display: inline-flex; align-items: center; gap: 6px; }
.cd-legend i { width: 8px; height: 8px; border-radius: 50%; background: var(--kc); }

/* ── training ── */
.cd-figs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.cd-figs div { padding: 14px 14px 13px; background: var(--card); border-radius: 16px; box-shadow: var(--shadow); }
.cd-figs b { display: block; margin-bottom: 6px; font: 600 26px/1 var(--disp); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.cd-figs span { font: 500 12px/1.25 var(--sans); color: var(--ink2); }
.cd-chart { padding: 16px 16px 12px; }
.cd-weeks { display: flex; align-items: flex-end; gap: 6px; height: 104px; }
.cd-weeks i { flex: 1; min-height: 3px; border-radius: 4px 4px 2px 2px; background: color-mix(in srgb, var(--ink) 78%, transparent); }
.cd-weeks i.is-zero { background: var(--line); }
.cd-weeks i.is-this { background: var(--accent); }
.cd-wax { display: flex; justify-content: space-between; margin-top: 8px; font: 500 11px/1 var(--sans); color: var(--ink3); }
.cd-kinds, .cd-recent { list-style: none; margin: 0; padding: 2px 16px; }

    ['Lunch', [0, 1, 2, 3, 4], 750, 795],
    ['Emails and calls', [0, 1, 2, 3, 4], 840, 900],
    ['Long walk', [5, 6], 600, 690],
    ['Meal prep', [6], 960, 1020],
    ['Read', [0, 1, 2, 3, 4, 5, 6], 1290, 1320],
    ['Wind down', [0, 1, 2, 3, 4, 5, 6], 1350, 1350]

  var idc = 0;

    return ks[0] || cdToday();
  }

  /* ═══ TRAINING ═══ */
  var LIFT = [
    { g: 'weights', n: 'Weights', items: [['push', 'Push'], ['pull', 'Pull'], ['legs', 'Legs'], ['upper', 'Upper'], ['lower', 'Lower'], ['full', 'Full body'], ['core', 'Core']] },
    { g: 'run', n: 'Run', items: [['easy', 'Easy'], ['tempo', 'Tempo'], ['intervals', 'Intervals'], ['long', 'Long']] },
    { g: 'recovery', n: 'Recovery', items: [['mobility', 'Mobility'], ['yoga', 'Yoga'], ['sauna', 'Sauna']] },

  ];
  var LIFTN = {};
  LIFT.forEach(function (g) { g.items.forEach(function (it) { LIFTN[g.g + '.' + it[0]] = { n: it[1], g: g.g }; }); });

  var MINS = [15, 20, 30, 45, 60, 75, 90, 120];
  var DAYKEY = '~day';
  function cdSess(v) {

  }
  var cdRestOnly = function (s) { return s.k.every(function (k) { return LIFTN[k].g === 'rest'; }); };

  function cdSessions(iso) {

  /* ═══ HABITS ═══

    { id: 'train', n: 'Train', g: 'train', k: 'tick', from: ['train', 'run', 'stretch'], hc: '--c-body' },
    { id: 'mind', n: 'Mind', g: 'read', k: 'tick', from: ['read', 'study', 'calm'], hc: '--c-mind' },
    { id: 'steps', n: 'Steps', g: 'walk', k: 'num', unit: 'steps', step: 500, max: 30000, marks: [5000, 8000, 10000, 15000], hc: '--c-body' },

  /* ═══ VIEW STATE ═══ */

  function cdTick(id) {

    if (!b) return;

    if (!was) cdSetFlag('off', sel, id, false);

  $('cdAgenda').addEventListener('click', function (ev) {

  /* ═══ THE SENTENCE ═══

     the name — a sentence it does not understand costs nothing. */
  var DAYW = [['monday', 'mon'], ['tuesday', 'tues', 'tue'], ['wednesday', 'wed'], ['thursday', 'thurs', 'thu'], ['friday', 'fri'], ['saturday', 'sat'], ['sunday', 'sun']];

  function cdParse(text, weekFor) {
    var src = ' ' + String(text || '').toLowerCase().replace(/[.,!]/g, ' ') + ' ';
    var used = src;
    var eat = function (m) { used = used.replace(m, function (x) { return ' '.repeat(x.length); }); };
    var out = { days: [], s: null, e: null, len: null, after: null };
    var m;

    if ((m = used.match(/\b(every ?day|daily)\b/))) { out.days = [0, 1, 2, 3, 4, 5, 6]; eat(m[0]); }
    if ((m = used.match(/\bweekdays?\b/))) { out.days = out.days.concat([0, 1, 2, 3, 4]); eat(m[0]); }
    if ((m = used.match(/\bweekends?\b/))) { out.days = out.days.concat([5, 6]); eat(m[0]); }
    if ((m = used.match(/\btoday\b/))) { out.days.push(cdDow(cdToday())); eat(m[0]); }

      var re = new RegExp('\\b(?:on\\s+|every\\s+)?(' + ws.join('|') + ')s?\\b', 'g');

    used = used.replace(/\b(and|&)\b/g, function (x) { return ' '.repeat(x.length); });

    var range = used.match(/\b(?:from\s+|at\s+)?(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\s*(?:-|–|to|until|till)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\b/);
    if (range) {
      var s = cdClock(range[1], range[2], range[3] || (range[6] === 'pm' && +range[1] < +range[4] ? 'pm' : ''));
      var e = cdClock(range[4], range[5], range[6]);
      if (s != null && e != null) {
        if (e <= s && !range[6] && e + 720 > s && e < 720) e += 720;
        if (e > s) { out.s = s; out.e = e; eat(range[0]); }
      }
    }
    if ((m = used.match(/\bfor\s+(an?|half an|\d+(?:\.\d+)?)\s*(h|hr|hrs|hour|hours|m|min|mins|minute|minutes)\b/))) {
      var q = m[1] === 'half an' ? 0.5 : /^an?$/.test(m[1]) ? 1 : +m[1];
      out.len = Math.round(/^h/.test(m[2]) ? q * 60 : q);

    if ((m = used.match(/\bin\s+(\d+)\s*(m|min|mins|minutes|h|hr|hrs|hours?)\b/))) {

      var at = cdNowMin() + off;

    }
    if ((m = used.match(/\bnow\b/))) {
      if (out.s == null) out.s = Math.round(cdNowMin() / 5) * 5;
      eat(m[0]);
      if (!out.days.length) out.days.push(cdDow(cdToday()));
    }
    if (out.s == null) {
      var clk = used.match(/\b(?:at\s+)?(\d{1,2}):(\d{2})\s*(am|pm)?\b/) || used.match(/\b(?:at\s+)?(\d{1,2})()\s*(am|pm)\b/) || used.match(/\bat\s+(\d{1,2})()()\b/);
      if (clk) { var c = cdClock(clk[1], clk[2], clk[3]); if (c != null) { out.s = c; eat(clk[0]); } }

       where it ends. Through the keyword table, so "after training"
       finds a block nobody called Training. Only struck out if it
       resolves — otherwise the words stay in the name. */
    var aft = used.match(/\b(after|before)\s+(?:the\s+|my\s+)?([a-z][a-z ]*?)\s*$/) || used.match(/\b(after|before)\s+(?:the\s+|my\s+)?([a-z]+)\b/);
    if (aft && out.s == null) {
      var probeDay = out.days.length ? out.days[0] : cdDow(cdToday());
      var phrase = aft[2].trim(), pk = cdKind(phrase);
      var pool = (weekFor || S.week).filter(function (b) { return b.d.indexOf(probeDay) >= 0; }).sort(function (a, b) { return a.s - b.s; });
      var hit2 = pool.filter(function (b) { var n = b.n.toLowerCase(); return n.indexOf(phrase) >= 0 || (phrase.length >= 3 && phrase.indexOf(n) >= 0); })[0]
        || (pk !== 'dot' && pool.filter(function (b) { return cdKind(b.n) === pk; })[0]);
      if (hit2) {
        out.after = hit2.n;
        var L = out.len != null ? out.len : 0;
        out.s = aft[1] === 'after' ? hit2.e : Math.max(0, hit2.s - (L || 0));

    var name = used.replace(/\b(at|from|on|every|for|the|a|an|my)\b/g, ' ').replace(/\s+/g, ' ').trim();
    out.n = name ? name.charAt(0).toUpperCase() + name.slice(1) : '';
    out.days = out.days.filter(function (x, i) { return out.days.indexOf(x) === i; }).sort();
    return out;
  }

  /* ═══ THE SHEET ═══ one at a time; opening one replaces the last. */

  /* ═══ ADD AND EDIT ═══ one form. A new block also gets the sentence. */

    var rows = el('div', 'cd-rows');

    function sync() {
      nm.value = f.n; st.value = cdHM(f.s); pl.value = f.p;

    });
    rg.addEventListener('input', function () {

      var nb = cdBlock({ id: b ? b.id : null, n: f.n.trim(), d: f.d, s: f.s, e: f.s + f.len, p: f.p.trim() });
      if (b) S.week[S.week.indexOf(b)] = nb; else S.week.push(nb);
      cdSave('week'); cdClose();
      if (!b && nb.d.indexOf(cdDow(sel)) < 0) {
        /* Land on the day it went on, or it looks like nothing happened. */
        var t = cdToday(), ws = cdWeekStart(t);

    foot.appendChild(save);
    root.appendChild(foot);
    cdSheet(b ? b.n : 'New block', root);

  /* ═══ WHAT YOU TRAINED ═══ */
  function cdLiftSheet(iso, key, label) {
    var cur = (S.train[iso] && cdSess(S.train[iso][key])) || { k: [], e: '', m: 0 };
    var pick = cur.k.slice(), eff = cur.e, min = cur.m;
    var root = el('div');
    var boards = el('div');
    LIFT.forEach(function (g) {
      var box = el('div', 'cd-grp'); box.style.setProperty('--kc', 'var(--k-' + g.g + ')');
      box.appendChild(el('h3', '', g.n));
      var cs = el('div', 'cd-chips');
      g.items.forEach(function (it) {
        var k = g.g + '.' + it[0];
        var c = el('button', 'cd-chip kc', it[1]); c.type = 'button'; c.dataset.k = k;
        c.style.setProperty('--kc', 'var(--k-' + g.g + ')');
        c.addEventListener('click', function () {
          var at = pick.indexOf(k);
          if (at >= 0) pick.splice(at, 1);
          /* You cannot half-rest: Rest clears the rest, and anything else clears Rest. */
          else if (g.g === 'rest') pick = [k];
          else { pick = pick.filter(function (x) { return LIFTN[x].g !== 'rest'; }); pick.push(k); }
          draw();
        });
        cs.appendChild(c);
      });
      box.appendChild(cs); boards.appendChild(box);
    });
    root.appendChild(boards);
    var more = el('div');
    more.appendChild(el('p', 'cd-lbl', 'How hard'));
    var ef = el('div', 'cd-chips');
    EFFORT.forEach(function (w) {
      var c = el('button', 'cd-chip', w); c.type = 'button'; c.dataset.e = w;
      c.addEventListener('click', function () { eff = eff === w ? '' : w; draw(); });
      ef.appendChild(c);
    });
    more.appendChild(ef);
    more.appendChild(el('p', 'cd-lbl', 'How long'));
    var mn = el('div', 'cd-chips');
    MINS.forEach(function (x) {
      var c = el('button', 'cd-chip', x + 'm'); c.type = 'button'; c.dataset.m = x;
      c.addEventListener('click', function () { min = min === x ? 0 : x; draw(); });
      mn.appendChild(c);
    });
    more.appendChild(mn);
    root.appendChild(more);
    var foot = el('div', 'cd-foot');
    var skip = el('button', 'cd-btn', cur.k.length ? 'Take it off' : 'Not now'); skip.type = 'button';
    skip.addEventListener('click', function () {
      if (cur.k.length && S.train[iso]) { delete S.train[iso][key]; if (!Object.keys(S.train[iso]).length) delete S.train[iso]; cdSave('train'); }
      cdClose(); cdPaint();
    });
    var go = el('button', 'cd-btn go', 'Log'); go.type = 'button'; go.id = 'cdLiftGo';
    go.addEventListener('click', function () {
      if (!pick.length) return;
      var rest = pick.every(function (k) { return LIFTN[k].g === 'rest'; });
      (S.train[iso] = S.train[iso] || {})[key] = rest ? { k: pick } : { k: pick, e: eff, m: min };
      cdSave('train');
      if (key !== DAYKEY && !cdDone(iso, key)) cdSetFlag('log', iso, key, true);
      cdClose(); cdPaint();
      cdToast('Logged ' + pick.map(function (k) { return LIFTN[k].n; }).join(' + '));
    });
    foot.appendChild(skip); foot.appendChild(go);
    root.appendChild(foot);
    function draw() {
      root.querySelectorAll('[data-k]').forEach(function (c) { c.setAttribute('aria-pressed', pick.indexOf(c.dataset.k) >= 0); });
      root.querySelectorAll('[data-e]').forEach(function (c) { c.setAttribute('aria-pressed', c.dataset.e === eff); });
      root.querySelectorAll('[data-m]').forEach(function (c) { c.setAttribute('aria-pressed', +c.dataset.m === min); });
      var rest = pick.length && pick.every(function (k) { return LIFTN[k].g === 'rest'; });
      /* A rest day is not asked how hard or how long: absent, not disabled. */
      more.hidden = !!rest;
      go.disabled = !pick.length;
      go.textContent = pick.length ? 'Log ' + pick.map(function (k) { return LIFTN[k].n; }).join(' + ') : 'Pick a session';
    }
    draw();
    cdSheet('What did you train?', root);
    $('cdShT').title = label || '';
  }

  /* ═══ HABITS VIEW ═══ */
  function cdPaintHab() {
    var today = cdToday(), hs = cdHabits();
    var kept = hs.filter(function (h) { return cdHabOn(today, h); }).length;
    $('cdHabCap').textContent = kept + ' of ' + hs.length + ' kept today';
    var html = '';
    hs.forEach(function (h) {
      var v = cdHabVal(today, h), on = cdHabOn(today, h);
      var sub, val;
      if (h.k === 'tick') {
        var by = cdKeptBy(today, h), st = cdStreak(h);
        sub = by && by !== 'you' ? (by === 'session' ? 'Kept by a session' : 'Kept by ' + esc(by)) : (st > 1 ? st + '-day streak' : 'Tap to keep');
        if (by === 'you' && st > 1) sub = st + '-day streak';
        /* The same check the day's blocks wear, so a kept thing looks kept
           wherever it is. */
        val = '<span class="cd-chk' + (on ? ' is-on' : '') + '">' + cdG('tick', 2.6) + '</span>';
      } else {
        var wk = 0, n = 0;
        for (var i = 1; i <= 7; i++) { var x = +cdHabVal(cdAddDays(today, -i), h); if (x > 0) { wk += x; n++; } }
        sub = n ? '7-day avg ' + cdFmtNum(wk / n, h) : 'Tap to log';
        val = on ? '<span class="cd-hr-v">' + cdFmtNum(v, h) + '<small>' + esc(h.unit) + '</small></span>' : '<span class="cd-hr-v is-nil">—</span>';
      }
      var tape = '';
      for (var j = 13; j >= 0; j--) { var d = cdAddDays(today, -j); tape += '<i' + (cdHabOn(d, h) ? ' class="on"' : '') + '></i>'; }
      html += '<li class="cd-hr" data-h="' + h.id + '" style="--hc:var(' + h.hc + ');--cat:var(' + h.hc + ')">'
        + '<button type="button" class="cd-hr-b" data-act="log" aria-label="' + esc(h.n) + ', ' + (on ? 'kept' : 'not yet') + '">'
        + '<span class="cd-ic">' + cdG(h.g) + '</span><span><span class="cd-hr-n">' + esc(h.n) + '</span><span class="cd-hr-s">' + sub + '</span></span>' + val + '</button>'
        + '<button type="button" class="cd-hr-more" data-act="hist" aria-label="' + esc(h.n) + ' history">' + cdG('more') + '</button>'
        + '<span class="cd-tape" aria-hidden="true">' + tape + '</span></li>';
    });
    $('cdHab').innerHTML = html;
  }
  $('cdHab').addEventListener('click', function (ev) {
    var btn = ev.target.closest('[data-act]'); if (!btn) return;
    var h = cdHabits().filter(function (x) { return x.id === btn.closest('.cd-hr').dataset.h; })[0];
    if (!h) return;
    if (btn.dataset.act === 'hist') { cdHabHist(h); return; }
    var today = cdToday();
    if (h.id === 'train') {
      var tb = cdOn(today).filter(function (b) { return TRAINING[cdKind(b.n)] && !cdIsOff(today, b.id); });
      var free = tb.filter(function (b) { return !(S.train[today] && S.train[today][b.id]); })[0];
      cdLiftSheet(today, free ? free.id : tb.length ? tb[0].id : DAYKEY, 'Train');
      return;
    }
    if (h.k === 'tick') {
      var by = cdKeptBy(today, h);
      if (by && by !== 'you') { cdToast('Kept by ' + by + ' — untick it on the day.'); return; }
      var m = S.hab[today] = S.hab[today] || {};
      if (m[h.id]) delete m[h.id]; else m[h.id] = 1;
      if (!Object.keys(m).length) delete S.hab[today];
      cdSave('hab'); cdPaintHab();
      return;

  });

      cdSave('defs'); cdClose(); cdPaint();
    });
    foot.appendChild(go); root.appendChild(foot);
    cdSheet('A habit of your own', root);
  });

  /* ═══ MONTH ═══ a ring per day for what you kept, a bar for what you trained. */
  function cdPaintMon() {
    var today = cdToday(), first = cdFirst();
    var y = +monthAt.slice(0, 4), mo = +monthAt.slice(5, 7) - 1;
    $('cdMonT').textContent = MON[mo];
    cdEyebrow();
    var start = cdISO(new Date(y, mo, 1));
    var days = new Date(y, mo + 1, 0).getDate();
    var pad = cdDow(start);
    var html = '', kept = 0, trained = 0;
    for (var p = 0; p < pad; p++) html += '<span class="cd-mc is-pad" aria-hidden="true"></span>';
    for (var d = 1; d <= days; d++) {
      var iso = cdISO(new Date(y, mo, d));
      var fut = iso > today, t = cdTally(iso);
      var inRec = iso >= first && !fut;
      var pct = inRec && t.on ? t.kept / t.on : 0;
      if (inRec && t.kept) kept++;
      var ss = cdSessions(iso);
      var real = ss.filter(function (x) { return !cdRestOnly(x.s); });
      if (real.length) trained++;
      var kc = ss.length ? 'var(--k-' + LIFTN[ss[0].s.k[0]].g + ')' : 'transparent';
      var C = 2 * Math.PI * 16;
      var ring = inRec && t.on ? '<svg viewBox="0 0 36 36" aria-hidden="true"><circle class="ring-t" cx="18" cy="18" r="16" fill="none" stroke-width="2.5"/>'
        + '<circle class="ring-v" cx="18" cy="18" r="16" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="' + C.toFixed(2) + '" stroke-dashoffset="' + (C * (1 - pct)).toFixed(2) + '"' + (pct ? '' : ' opacity="0"') + '/></svg>'
        : '<svg viewBox="0 0 36 36" aria-hidden="true"></svg>';
      html += '<button type="button" class="cd-mc' + (iso === today ? ' is-today' : '') + (fut ? ' is-future' : '') + '" data-day="' + iso + '"'
        + ' aria-label="' + d + ' ' + MON[mo] + (inRec ? ', ' + t.kept + ' of ' + t.on + ' kept' : '') + (ss.length ? ', ' + esc(cdSessName(ss[0].s)) : '') + '">'
        + '<span class="cd-mr">' + ring + '<b>' + d + '</b></span><em style="--kc:' + kc + '"></em></button>';
    }
    var cells = pad + days;
    for (var q = cells; q % 7; q++) html += '<span class="cd-mc is-pad" aria-hidden="true"></span>';
    $('cdMonG').innerHTML = html;
    $('cdMonCap').textContent = kept + ' days with something kept · ' + trained + ' trained';
    $('cdMonN').disabled = monthAt >= today.slice(0, 7);
    $('cdMonP').disabled = monthAt <= first.slice(0, 7);
    $('cdMonL').innerHTML = ['weights', 'run', 'recovery'].map(function (g) {
      return '<span><i style="--kc:var(--k-' + g + ')"></i>' + g.charAt(0).toUpperCase() + g.slice(1) + '</span>';
    }).join('');
  }
  function cdShiftMonth(n) {
    var y = +monthAt.slice(0, 4), m = +monthAt.slice(5, 7) - 1 + n;
    var d = new Date(y, m, 1);
    monthAt = cdISO(d).slice(0, 7);
    cdPaintMon();
  }
  $('cdMonP').addEventListener('click', function () { cdShiftMonth(-1); });
  $('cdMonN').addEventListener('click', function () { cdShiftMonth(1); });
  $('cdMonG').addEventListener('click', function (ev) {
    var c = ev.target.closest('[data-day]'); if (!c) return;
    cdDaySheet(c.dataset.day);
  });

  /* A day read back. Not a second editor: "Open this day" goes to the one that is. */
  function cdDaySheet(iso) {
    var root = el('div'), t = cdTally(iso), fut = iso > cdToday();
    root.appendChild(el('p', 'cd-cap', fut ? t.on + ' planned' : t.kept + ' of ' + t.on + ' kept · ' + cdLen(t.mins) + ' committed'));
    var ul = el('ul', 'cd-day-l');
    cdOn(iso).forEach(function (b) {
      var k = cdKind(b.n), st = cdIsOff(iso, b.id) ? 'off' : cdDone(iso, b.id) ? 'kept' : fut ? 'planned' : 'not kept';
      var li = el('li', '', cdG(k) + '<b>' + esc(b.n) + '</b><span>' + cdHM(b.s) + ' · ' + st + '</span>');
      li.style.setProperty('--cat', 'var(--c-' + CAT[k] + ')');
      ul.appendChild(li);
    });
    root.appendChild(ul);
    var ss = cdSessions(iso);
    if (ss.length) {
      root.appendChild(el('p', 'cd-lbl', 'Trained'));
      var tu = el('ul', 'cd-day-l');
      ss.forEach(function (x) { tu.appendChild(el('li', '', cdG('train') + '<b>' + esc(cdSessName(x.s)) + '</b><span>' + (x.s.m ? x.s.m + 'm' : '') + (x.s.e ? ' · ' + x.s.e : '') + '</span>')); });
      root.appendChild(tu);
    }
    var hs = cdHabits().filter(function (h) { return cdHabOn(iso, h); });
    if (hs.length) {
      root.appendChild(el('p', 'cd-lbl', 'Habits'));
      root.appendChild(el('p', 'cd-note', hs.map(function (h) { return esc(h.n) + (h.k === 'num' ? ' ' + cdFmtNum(cdHabVal(iso, h), h) + ' ' + esc(h.unit) : ''); }).join(' · ')));
    }
    var foot = el('div', 'cd-foot');
    var go = el('button', 'cd-btn go', 'Open this day'); go.type = 'button';
    go.addEventListener('click', function () { sel = iso; cdClose(); cdGo('day'); });
    foot.appendChild(go); root.appendChild(foot);
    var d = cdDate(iso);
    cdSheet(DOWL[cdDow(iso)] + ' ' + d.getDate() + ' ' + MON[d.getMonth()], root);
  }

  /* ═══ LIFTS ═══ */
  function cdPaintLift() {
    var today = cdToday(), all = [];
    Object.keys(S.train).sort().reverse().forEach(function (d) { cdSessions(d).forEach(function (x) { all.push({ d: d, s: x.s }); }); });
    var m30 = all.filter(function (x) { return cdDiff(today, x.d) < 30 && !cdRestOnly(x.s); });
    var box = $('cdLift');
    if (!all.length) {
      box.innerHTML = '<div class="cd-card cd-empty">No sessions yet. Tick a gym, run or yoga block on the day and it asks what you trained.</div>';
      return;
    }
    var mins = m30.filter(function (x) { return x.s.m; });
    var avg = mins.length ? Math.round(mins.reduce(function (t, x) { return t + x.s.m; }, 0) / mins.length) : 0;
    var days = {}; m30.forEach(function (x) { days[x.d] = 1; });
    var html = '<div class="cd-figs"><div><b>' + m30.length + '</b><span>sessions</span></div><div><b>' + Object.keys(days).length + '</b><span>days trained</span></div><div><b>' + (avg ? avg + 'm' : '—') + '</b><span>avg length</span></div></div>';
    /* Twelve weeks, the one in progress last and in the accent. */
    var ws = cdWeekStart(today), cols = [], top = 1;
    for (var w = 11; w >= 0; w--) {
      var a = cdAddDays(ws, -7 * w), b = cdAddDays(a, 7);
      var n = all.filter(function (x) { return x.d >= a && x.d < b && !cdRestOnly(x.s); }).length;
      cols.push(n); top = Math.max(top, n);
    }
    html += '<p class="cd-lbl">Sessions a week</p><div class="cd-card cd-chart"><div class="cd-weeks" role="img" aria-label="Sessions per week for twelve weeks: ' + cols.join(', ') + '">'
      + cols.map(function (n, i) { return '<i class="' + (n ? '' : 'is-zero') + (i === 11 ? ' is-this' : '') + '" style="height:' + Math.max(2, n / top * 100) + '%"></i>'; }).join('')
      + '</div><div class="cd-wax"><span>12 weeks ago</span><span>This week</span></div></div>';
    var by = {};
    m30.forEach(function (x) {
      var nm = cdSessName(x.s);
      var r = by[nm] = by[nm] || { n: 0, m: 0, mc: 0, g: LIFTN[x.s.k[0]].g, e: {} };
      r.n++; if (x.s.m) { r.m += x.s.m; r.mc++; } if (x.s.e) r.e[x.s.e] = (r.e[x.s.e] || 0) + 1;
    });
    var kinds = Object.keys(by).sort(function (a, b) { return by[b].n - by[a].n; });
    if (kinds.length) {
      var mx = by[kinds[0]].n;
      html += '<p class="cd-lbl">What, this month</p><ul class="cd-kinds cd-card">' + kinds.map(function (k) {
        var r = by[k], ef = Object.keys(r.e).sort(function (a, b) { return r.e[b] - r.e[a]; })[0];
        return '<li style="--kc:var(--k-' + r.g + ')"><b>' + esc(k) + '</b><span>' + r.n + '×' + (r.mc ? ' · ' + Math.round(r.m / r.mc) + 'm' : '') + (ef ? ' · ' + ef : '') + '</span><em><i style="width:' + (r.n / mx * 100) + '%"></i></em></li>';
      }).join('') + '</ul>';
    }
    html += '<p class="cd-lbl">Recent</p><ul class="cd-recent cd-card">' + all.slice(0, 8).map(function (x) {
      var d = cdDate(x.d);
      return '<li><time>' + DOW[cdDow(x.d)] + ' ' + d.getDate() + '</time><b>' + esc(cdSessName(x.s)) + '</b><span>' + (x.s.m ? x.s.m + 'm' : '') + (x.s.e ? ' · ' + x.s.e : '') + '</span></li>';
    }).join('') + '</ul>';
    box.innerHTML = html;
  }

  /* ═══ SETTINGS ═══ */
  $('cdGear').addEventListener('click', function () {
    var root = el('div');
    root.appendChild(el('p', 'cd-lbl', 'Appearance'));
    var md = el('div', 'cd-chips'), cur = cdMode.get();
    [['auto', 'Follow phone'], ['light', 'Daylight'], ['dark', 'Night']].forEach(function (x) {
      var c = el('button', 'cd-chip', x[1]); c.type = 'button'; c.dataset.m = x[0];
      c.setAttribute('aria-pressed', cur === x[0]);
      c.addEventListener('click', function () {
        try { localStorage.setItem(K.mode, x[0]); } catch (e) {}
        cdMode();
        md.querySelectorAll('.cd-chip').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.m === x[0]); });
      });
      md.appendChild(c);
    });
    root.appendChild(md);
    root.appendChild(el('p', 'cd-lbl', 'Backup'));
    /* Every key this app keeps, not one of them: a record with no export
       is the kind of gap you only discover once. */
    var cp = el('button', 'cd-btn', 'Copy a backup'); cp.type = 'button'; cp.id = 'cdBak';
    cp.addEventListener('click', function () {
      var txt = JSON.stringify(cdBackup());
      var done = function () { cdToast('Backup copied'); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, function () { ta.value = txt; ta.select(); });
      else { ta.value = txt; ta.select(); }
    });
    root.appendChild(cp);
    var ta = el('textarea', 'cd-field'); ta.id = 'cdRestore'; ta.placeholder = 'Paste a backup here to restore it';
    ta.setAttribute('aria-label', 'Backup to restore');
    ta.style.marginTop = '12px';
    root.appendChild(ta);
    root.appendChild(el('p', 'cd-note', 'Restoring replaces everything on this phone with what you paste.'));
    var foot = el('div', 'cd-foot');
    var rs = el('button', 'cd-btn', 'Restore'); rs.type = 'button'; rs.id = 'cdRestoreGo';
    rs.addEventListener('click', function () {
      var o; try { o = JSON.parse(ta.value); } catch (e) { cdToast('That is not a backup.'); return; }
      if (!isObj(o) || o.app !== 'cadence') { cdToast('That is not a Cadence backup.'); return; }
      Object.keys(K).forEach(function (k) { if (k !== 'mode' && o[k] !== undefined) cdWrite(K[k], o[k]); });
      location.reload();
    });
    foot.appendChild(rs); root.appendChild(foot);
    cdSheet('Settings', root);
  });
  function cdBackup() {
    var o = { app: 'cadence', at: new Date().toISOString() };
    Object.keys(K).forEach(function (k) { if (k !== 'mode') o[k] = S[k]; });
    return o;
  }
  cdMode.get = function () { try { return localStorage.getItem(K.mode) || 'auto'; } catch (e) { return 'auto'; } };
  function cdMode() {
    /* Stored as the bare word, because the pre-paint script in the head
       reads it raw. */
    var m = cdMode.get();
    if (m !== 'light' && m !== 'dark') m = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-mode', m);
    var tc = document.querySelector('meta[name="theme-color"]');
    if (tc) tc.setAttribute('content', m === 'dark' ? '#090F16' : '#D9E2EA');
  }
  if (window.matchMedia) {
    var mq = matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', cdMode);
  }

  /* ═══ TOAST ═══ */
  var toastT = 0, toastUndo = null;
  function cdToast(msg, undo) {
    $('cdToastT').textContent = msg;
    toastUndo = undo || null;
    $('cdToastU').hidden = !undo;
    $('cdToast').hidden = false;
    clearTimeout(toastT);
    toastT = setTimeout(function () { $('cdToast').hidden = true; toastUndo = null; }, undo ? 5000 : 2200);
  }
  $('cdToastU').addEventListener('click', function () { var f = toastUndo; $('cdToast').hidden = true; toastUndo = null; if (f) f(); });

  /* ═══ WIRING ═══ */
  document.querySelectorAll('.cd-tab').forEach(function (t) { t.addEventListener('click', function () { cdGo(t.dataset.v); }); });
  $('cdAdd').addEventListener('click', function () { cdEdit(null); });

  /* The clock moves the now line and the countdown; nothing animates,
     it steps on the half minute. A day that has rolled over moves too. */
  var lastDay = cdToday();
  setInterval(function () {
    var t = cdToday();
    if (t !== lastDay) { if (sel === lastDay) sel = t; lastDay = t; }
    if (!cdSheetOpen()) cdPaint();
  }, 30000);

  var sv = 'day';
  try { sv = sessionStorage.getItem('cad.view') || 'day'; } catch (e) {}
  cdGo(['day', 'hab', 'mon', 'lift'].indexOf(sv) >= 0 ? sv : 'day');

  /* Exposed for the test suite only: the parser is the one piece worth
     asserting as a function rather than through the page. */
  window.cadence = { parse: cdParse, kind: cdKind };
})();
</script>
</body>
</html>
