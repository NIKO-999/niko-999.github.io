<html lang="en">

<style>
/* ═══════════════════════════════════════════════════════════════
   CADENCE — the day as a dial.

   Five looks came out before this one and every one was turned down,
   the last in four words. The sixth was CHOSEN rather than argued: four
   day screens were rendered over the same fixture — the block happening
   now as the whole screen, a column of time, a dial, and the day
   written out as a sentence — and the dial was the one picked.

   · THE DAY IS A WATCH FACE. Twenty-four hours round one ring, and
     every block an arc at its own hours: a kept arc glows, one still to
     come is dim, one behind you and unkept is the flat neutral, and a
     hand points at now. The whole day is one shape read at a glance,
     and there is no column of times in a gutter anywhere — which is
     the drawing the other app is made of.
   · EVERY SCREEN IS RINGS. The week is seven small rings, each closed
     by how much of its day was kept; a habit is a fortnight round a
     ring; the month is a ring a day; training is thirty days round one.
   · The alignment app's language rather than its pieces: the night sky,
     Inter in its light weights for the one figure a screen is about,
     Geist Mono in tracked capitals for every label, hairlines where
     there would be cards, and one white round control.
   ═══════════════════════════════════════════════════════════════ */
@font-face { font-family: 'Inter'; font-weight: 100 900; font-display: swap;
  src: url('../arc/fonts/Inter.woff2') format('woff2'); }
@font-face { font-family: 'Geist Mono'; font-weight: 100 900; font-display: swap;
  src: url('fonts/GeistMono.woff2') format('woff2'); }

:root {
  color-scheme: dark;
  --bg: #03060A;
  --ink: #F3F5F7;
  --on: #07080B;
  --dim: rgba(243, 245, 247, .72);
  --quiet: rgba(243, 245, 247, .62);
  --faint: rgba(243, 245, 247, .42);
  --hair: rgba(243, 245, 247, .10);
  --lift: rgba(243, 245, 247, .07);
  --lift2: rgba(243, 245, 247, .13);
  --track: rgba(243, 245, 247, .08);
  /* Behind you and not kept. A graphic, so it is held to 3:1 against the
     sky beside it — and never a red: nothing here says you failed. */
  --miss: rgba(243, 245, 247, .40);
  --sheet: #0B1621;

  /* Which part of life a block is: the alignment app's four hues. */
  --c-body: #F2A184;
  --c-mind: #B7A5FF;
  --c-work: #E8C67C;
  --c-rest: #7DCFD8;
  --c-none: #A3ADB6;
  --k-weights: #F2A184;
  --k-run: #7DCFD8;
  --k-recovery: #B7A5FF;
  --k-rest: #A3ADB6;
  --h-water: #8FB8FF;
  --h-sleep: #E9A6D0;
  --bad: #FF9C8F;

  /* THE SKY. Near-black at the top, a slate night by the foot, with one
     soft lift behind the dial. It is the ground on every screen and it
     never carries colour: colour is what the rings are for. */
  --sky: radial-gradient(90% 50% at 50% 34%, rgba(64, 110, 132, .16), transparent 70%),
         linear-gradient(180deg, #03060A 0%, #07131D 16%, #102433 42%, #18303F 78%, #2B4252 100%);

  --sans: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --gut: 22px;
}

*, *::before, *::after { box-sizing: border-box; }
/* Said once, for every element: an author `display` outranks the
   browser's own [hidden] rule, and that has broken a view, a toast and
   an overlay in this repo's other app. One line removes the class. */
[hidden] { display: none !important; }

html { -webkit-text-size-adjust: 100%; }
html, body { height: 100%; background-color: var(--bg); }
body {
  position: fixed; inset: 0; margin: 0; overflow: hidden; overscroll-behavior: none;
  background: var(--sky);
  color: var(--ink);
  font: 400 15px/1.4 var(--sans);
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
}
p, h1, h2, h3 { margin: 0; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; touch-action: manipulation; }
button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.cd-field:focus-visible { outline: 1px solid var(--ink); outline-offset: -1px; }
.cd-row .cd-field:focus-visible { outline: none; }

/* Every label in the app is the same voice: tracked mono capitals. */
.cd-cap, .cd-date, .cd-mid-k, .cd-sum, .cd-lbl, .cd-tab, .cd-dows, .cd-mcap, .cd-ringcap, .cd-legend {
  font: 500 10.5px/1 var(--mono); text-transform: uppercase;
}
.cd-cap, .cd-mid-k, .cd-lbl, .cd-ringcap { letter-spacing: .18em; color: var(--quiet); }

.cd-app { display: flex; flex-direction: column; height: 100%; max-width: 560px; margin: 0 auto; }

/* ── the top: the date, and the one white control ── */
.cd-top { flex: none; display: flex; align-items: center; gap: 2px; padding: calc(10px + env(safe-area-inset-top)) 16px 0 var(--gut); }
.cd-date { flex: 1; letter-spacing: .18em; color: var(--dim); }
.cd-gear { flex: none; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; color: var(--quiet); }
.cd-gear svg { width: 19px; height: 19px; display: block; }
.cd-plus { flex: none; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; background: var(--ink); color: var(--on); box-shadow: 0 12px 28px -10px rgba(0, 0, 0, .7); }
.cd-plus svg { width: 18px; height: 18px; display: block; }

.cd-main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.cd-main > section { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.cd-pane {
  flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain;
  padding: 8px var(--gut) 30px; scrollbar-width: none;
  -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 10px, #000 calc(100% - 28px), transparent 100%);
          mask-image: linear-gradient(180deg, transparent 0, #000 10px, #000 calc(100% - 28px), transparent 100%);
}
.cd-pane::-webkit-scrollbar { display: none; }

/* ── the nav: four words at the foot ── */
.cd-nav { flex: none; display: flex; justify-content: center; gap: 6px; padding: 2px 0 calc(6px + env(safe-area-inset-bottom)); }
.cd-tab { position: relative; min-height: 44px; padding: 0 10px; letter-spacing: .18em; color: var(--dim); }
.cd-tab::after { content: ""; position: absolute; left: 50%; bottom: 6px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--ink); opacity: 0; }
.cd-tab[aria-current="page"] { color: var(--ink); }
.cd-tab[aria-current="page"]::after { opacity: 1; }

/* ── the week: seven small rings, each closed by what its day kept ── */
.cd-week { flex: none; display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin: 8px 12px 0; }
.cd-wd { display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 66px; padding: 8px 0 7px; border-radius: 18px; }
.cd-wd-l { font: 500 10px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--quiet); }
.cd-wd.is-today .cd-wd-l { color: var(--ink); }
.cd-wd-r { position: relative; width: 36px; height: 36px; display: grid; place-items: center; }
.cd-wd-r svg { position: absolute; inset: 0; width: 36px; height: 36px; overflow: visible; }
.cd-wd-r b { position: relative; font: 500 13px/1 var(--sans); font-variant-numeric: tabular-nums; color: var(--dim); }
.cd-wd[aria-pressed="true"] { background: var(--lift); }
.cd-wd[aria-pressed="true"] b { color: var(--ink); }
.cd-wr-t, .cd-mr-t { fill: none; stroke: var(--track); }
.cd-wr-t, .cd-wr-a { stroke-width: 2.5; }
.cd-wr-a, .cd-mr-a { fill: none; stroke: var(--ink); stroke-linecap: round; }
.cd-wr-a.is-whole, .cd-mr-a.is-whole { filter: drop-shadow(0 0 3px rgba(243, 245, 247, .6)); }

/* ── the dial ── */
.cd-dial { position: relative; width: 300px; height: 300px; margin: 2px auto 0; }
.cd-dial > svg { display: block; width: 300px; height: 300px; overflow: visible; }
.cd-dt { fill: none; stroke: var(--track); stroke-width: 12; }
.cd-tk { stroke: rgba(243, 245, 247, .24); stroke-width: 1; }
.cd-tk.is-six { stroke: rgba(243, 245, 247, .5); stroke-width: 1.4; }
.cd-dl { font: 500 10px var(--mono); letter-spacing: .08em; fill: var(--quiet); }
/* A block is an arc at its own hours. Round caps, and the path is drawn
   a cap short at each end, so what you SEE starts and stops on the minute. */
.cd-a { fill: none; stroke: var(--c); stroke-width: 12; stroke-linecap: round; }
.cd-a.is-ahead { stroke: color-mix(in srgb, var(--c) 52%, transparent); }
.cd-a.is-miss { stroke: var(--miss); }
.cd-a.is-kept, .cd-m.is-kept { filter: url(#cdGl); }
.cd-m { fill: transparent; stroke: var(--c); stroke-width: 1.8; }
.cd-m.is-kept { fill: var(--c); }
.cd-m.is-miss { stroke: var(--miss); }
.cd-hand line { stroke: var(--ink); stroke-width: 1.6; stroke-linecap: round; }
.cd-hand circle { fill: var(--ink); filter: url(#cdGl); }

/* The middle of a ring says the one figure that ring is about. */
.cd-dial .cd-mid, .cd-ring .cd-mid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: none; }
.cd-mid-t { margin-top: 10px; font: 200 50px/1 var(--sans); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.cd-mid-n { max-width: 160px; margin-top: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 500 14px/1.3 var(--sans); color: var(--c, var(--dim)); }
.cd-mid-n:empty { display: none; }
.cd-mid-s { margin-top: 3px; font: 400 13px/1.3 var(--sans); color: var(--dim); }

.cd-sum { display: flex; justify-content: space-between; gap: 12px; margin: 16px 0 8px; letter-spacing: .14em; color: var(--quiet); }
.cd-sum b { font-weight: 500; color: var(--ink); }

/* ── the day's list: a hairline a row, and the dot is the check ── */
.cd-list { list-style: none; margin: 0; padding: 0; }
.cd-it { position: relative; display: grid; grid-template-columns: 44px 1fr; align-items: center; margin: 0 calc(-1 * var(--gut)); padding: 0 var(--gut) 0 calc(var(--gut) - 17px); }
.cd-it::before { content: ""; position: absolute; left: var(--gut); right: var(--gut); top: 0; height: 1px; background: var(--hair); }
.cd-dot { width: 44px; height: 44px; display: grid; place-items: center; }
.cd-dot i { width: 10px; height: 10px; border-radius: 50%; box-shadow: inset 0 0 0 1.6px var(--c); }
.cd-dot:disabled { cursor: default; }
.cd-it.is-done .cd-dot i { background: var(--c); box-shadow: 0 0 9px var(--c); }
.cd-it.is-past:not(.is-done) .cd-dot i { box-shadow: inset 0 0 0 1.6px var(--miss); }
.cd-it.is-off .cd-dot { visibility: hidden; }
.cd-rb { display: grid; grid-template-columns: 1fr auto; align-items: baseline; column-gap: 12px; row-gap: 3px; min-height: 48px; padding: 14px 0 13px; }
.cd-rn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 400 15px/1.2 var(--sans); }
.cd-rt { font: 500 11px/1 var(--mono); letter-spacing: .06em; color: var(--quiet); font-variant-numeric: tabular-nums; white-space: nowrap; }
.cd-rs { grid-column: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 400 12.5px/1.3 var(--sans); color: var(--quiet); }
.cd-rw { font-weight: 500; color: var(--kc); }
.cd-it.is-done .cd-rn { color: var(--quiet); }
.cd-it.is-past:not(.is-done) .cd-rn { color: var(--dim); }
.cd-it.is-off .cd-rn { color: var(--quiet); text-decoration: line-through; }
/* The block happening now carries a wash of its own colour, full bleed. */
.cd-it.is-now { background: linear-gradient(90deg, color-mix(in srgb, var(--c) 15%, transparent), transparent 82%); }
.cd-it.is-now .cd-rt { color: var(--ink); }

.cd-empty { padding: 22px 0; list-style: none; font: 400 15px/1.45 var(--sans); color: var(--dim); }
.cd-link { min-height: 44px; display: inline-flex; align-items: center; font: 500 15px/1 var(--sans); color: var(--ink); }
.cd-empty .cd-link { display: flex; margin-top: 4px; }

/* ── rings that are made of segments: habits, training ── */
.cd-ring { position: relative; margin: 4px auto 0; }
.cd-ring > span > svg, .cd-hr-b > svg { display: block; width: 100%; height: 100%; overflow: visible; }
.cd-ring > span { position: absolute; inset: 0; }
.cd-sg { fill: none; stroke: var(--track); }
.cd-sg.is-lit { stroke: var(--hc); }
.cd-ring.is-hab { width: 180px; height: 180px; }
.cd-ring.is-lift { width: 200px; height: 200px; }
.cd-ring .cd-mid-t { margin-top: 8px; font-size: 44px; }
.cd-ringcap { margin: 12px 0 0; text-align: center; }

/* ── habits: a fortnight round a ring, three across ── */
.cd-hb { list-style: none; margin: 18px 0 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px 4px; }
.cd-hr { display: flex; flex-direction: column; align-items: center; }
.cd-hr-b { position: relative; width: 96px; height: 96px; display: grid; place-items: center; border-radius: 50%; }
.cd-hr-b > svg { position: absolute; inset: 0; }
.cd-hr-v { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; font: 300 19px/1 var(--sans); font-variant-numeric: tabular-nums; white-space: nowrap; }
.cd-hr-v small { font: 500 9.5px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--quiet); }
.cd-hr-v.is-nil { color: var(--quiet); }
.cd-hr-v svg { width: 22px; height: 22px; display: block; color: var(--hc); }
.cd-hr-n { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; width: 100%; min-height: 44px; padding: 4px 2px; text-align: center; }
.cd-hr-n b { display: flex; align-items: center; gap: 6px; font: 500 14px/1.2 var(--sans); }
.cd-hr-n b::before { content: ""; flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--hc); }
.cd-hr-n svg { flex: none; width: 10px; height: 10px; color: var(--quiet); }
.cd-hr-s { font: 400 12px/1.25 var(--sans); color: var(--quiet); }
.cd-pane > .cd-link { margin-top: 14px; }

/* ── month: a ring a day ── */
.cd-mhead { flex: none; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; margin: 10px var(--gut) 0; text-align: center; }
.cd-mon-t { margin-top: 8px; font: 300 30px/1 var(--sans); letter-spacing: -.01em; }
.cd-mhead button { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--ink); box-shadow: inset 0 0 0 1px var(--hair); }
.cd-mhead button:disabled { color: rgba(243, 245, 247, .28); box-shadow: none; cursor: default; }
.cd-mhead svg { width: 16px; height: 16px; }
.cd-mcap { flex: none; margin: 12px var(--gut) 0; text-align: center; letter-spacing: .14em; color: var(--quiet); }
.cd-dows { display: grid; grid-template-columns: repeat(7, 1fr); padding: 8px 0 6px; text-align: center; letter-spacing: .1em; color: var(--quiet); }
.cd-mgrid { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 4px; }
.cd-mc { position: relative; min-height: 48px; display: grid; place-items: center; }
.cd-mc svg { position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px; overflow: visible; }
.cd-mr-t, .cd-mr-a { stroke-width: 3; }
.cd-bead { fill: var(--kc); stroke: var(--bg); stroke-width: 1.5; }
.cd-mc b { position: relative; font: 500 13px/1 var(--sans); font-variant-numeric: tabular-nums; }
.cd-mc.is-quiet b, .cd-mc.is-future b { color: var(--quiet); }
.cd-mc.is-today b { font-weight: 700; }
.cd-mc.is-today::after { content: ""; position: absolute; left: 50%; bottom: 0; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--ink); }
.cd-mc.is-pad { visibility: hidden; }
.cd-legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; margin: 18px 0 0; letter-spacing: .14em; color: var(--quiet); }
.cd-legend span { display: inline-flex; align-items: center; gap: 7px; }
.cd-legend i { width: 7px; height: 7px; border-radius: 50%; background: var(--kc); }

/* ── training ── */
.cd-figs { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 22px; border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair); }
.cd-figs div { padding: 14px 0 13px; text-align: center; }
.cd-figs div + div { box-shadow: inset 1px 0 0 var(--hair); }
.cd-figs b { display: block; font: 300 26px/1 var(--sans); font-variant-numeric: tabular-nums; }
.cd-figs span { display: block; margin-top: 9px; font: 500 10px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--quiet); }
.cd-lbl { margin: 24px 0 10px; }
.cd-weeks { display: flex; align-items: flex-end; justify-content: space-between; gap: 6px; height: 72px; }
.cd-weeks i { flex: 1; max-width: 12px; min-height: 3px; border-radius: 6px; background: rgba(243, 245, 247, .3); }
.cd-weeks i.is-zero { background: var(--track); }
.cd-weeks i.is-this { background: var(--ink); box-shadow: 0 0 10px rgba(243, 245, 247, .35); }
.cd-wax { display: flex; justify-content: space-between; margin-top: 10px; font: 500 10px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--quiet); }
.cd-kinds, .cd-recent, .cd-day-l { list-style: none; margin: 0; padding: 0; }
.cd-kinds li, .cd-recent li, .cd-day-l li { box-shadow: inset 0 1px 0 var(--hair); }
.cd-kinds li { display: grid; grid-template-columns: 1fr auto; gap: 9px 10px; padding: 13px 0 12px; }
.cd-kinds b, .cd-recent b, .cd-day-l b { font: 400 15px/1.3 var(--sans); }
.cd-kinds span, .cd-recent span, .cd-day-l span, .cd-recent time { font: 500 11px/1.3 var(--mono); letter-spacing: .06em; color: var(--quiet); font-variant-numeric: tabular-nums; }
.cd-kinds span, .cd-recent span, .cd-day-l span { text-align: right; }
.cd-kinds em { grid-column: 1 / -1; height: 2px; border-radius: 1px; background: var(--track); overflow: hidden; }
.cd-kinds em i { display: block; height: 100%; border-radius: 1px; background: var(--kc, var(--ink)); }
.cd-recent li { display: grid; grid-template-columns: 56px 1fr auto; gap: 10px; align-items: baseline; padding: 13px 0 12px; }

/* ── the sheet ── */
.cd-scrim { position: fixed; inset: 0; z-index: 40; background: rgba(2, 4, 7, .66); opacity: 0; transition: opacity .2s; }
.cd-scrim.is-open { opacity: 1; }
.cd-sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  max-width: 560px; max-height: 90dvh; margin: 0 auto; overflow-y: auto; overflow-x: hidden;
  padding: 0 var(--gut) calc(env(safe-area-inset-bottom) + 16px);
  background: var(--sheet); border-radius: 28px 28px 0 0;
  box-shadow: inset 0 1px 0 var(--hair), 0 -24px 60px rgba(0, 0, 0, .55);
  transform: translateY(100%); transition: transform .28s cubic-bezier(.2, .8, .2, 1);
}
.cd-sheet.is-open { transform: none; }
.cd-sh-hd { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 24px 0 12px; background: var(--sheet); }
.cd-sh-hd::before { content: ""; position: absolute; left: 50%; top: 9px; width: 36px; height: 4px; margin-left: -18px; border-radius: 2px; background: rgba(243, 245, 247, .18); }
.cd-sh-hd h2 { font: 300 26px/1.1 var(--sans); letter-spacing: -.01em; }
.cd-x { flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--ink); box-shadow: inset 0 0 0 1px var(--hair); }
.cd-x svg { width: 18px; height: 18px; display: block; }
.cd-foot { position: sticky; bottom: calc(-16px - env(safe-area-inset-bottom)); z-index: 2; display: flex; gap: 10px; margin-top: 22px; padding: 12px 0 16px; background: var(--sheet); }

.cd-btn { flex: 1; min-height: 50px; padding: 0 18px; border-radius: 25px; text-align: center; font: 500 15px/1 var(--sans); color: var(--ink); box-shadow: inset 0 0 0 1px var(--hair); }
.cd-btn.go { background: var(--ink); color: var(--on); box-shadow: none; }
.cd-btn.go:disabled { opacity: .4; cursor: default; }
.cd-btn.warn { color: var(--bad); }

.cd-field {
  width: 100%; min-height: 50px; padding: 13px 16px; border: 0; border-radius: 14px;
  font: 400 16px/1.3 var(--sans); color: var(--ink); background: var(--lift);
  -webkit-appearance: none; appearance: none;
}

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  /* ═══ STORE ═══
     Everything lives in this browser. Each record is its own key, so a
     damaged one costs itself and nothing beside it. */
  var K = {
    week: 'cad.week.v1', log: 'cad.log.v1', off: 'cad.off.v1',
    hab: 'cad.hab.v1', train: 'cad.train.v1', defs: 'cad.defs.v1'
  };
  /* There is one face now, so the key that chose between two is swept
     rather than left: a preference for a control that no longer exists
     is a second record of a decision nothing can act on. */
  try { localStorage.removeItem('cad.mode.v1'); } catch (e) {}
  function cdRead(k, dflt) {
    try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? dflt : v; }
    catch (e) { return dflt; }
  }
  function cdWrite(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { cdToast('Could not save — storage is full.'); } }
  var isObj = function (v) { return v && typeof v === 'object' && !Array.isArray(v); };

  /* ═══ DATES ═══ Monday is day 0. Dates are local ISO strings. */
  function cdISO(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function cdDate(iso) { var p = iso.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function cdDow(iso) { return (cdDate(iso).getDay() + 6) % 7; }
  function cdAddDays(iso, n) { var d = cdDate(iso); d.setDate(d.getDate() + n); return cdISO(d); }
  function cdToday() { return cdISO(new Date()); }
  function cdNowMin() { var d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
  /* Counted between DATES, so a daylight-saving hour cannot round a day away. */
  function cdDiff(a, b) { return Math.round((Date.UTC.apply(null, dparts(a)) - Date.UTC.apply(null, dparts(b))) / 864e5); }
  function dparts(iso) { var p = iso.split('-'); return [+p[0], +p[1] - 1, +p[2]]; }
  var DOW = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  var DOWL = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
  var MON = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  function cdHM(m) { m = Math.max(0, Math.min(1439, Math.round(m))); return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }
  function cdLen(m) {
    if (!(m > 0)) return 'a moment';
    var h = Math.floor(m / 60), r = m % 60;
    return h ? (r ? h + 'h ' + r + 'm' : h + 'h') : r + 'm';
  }
  /* A block can be ticked on the day and on the two behind it. Further
     back is a record you would be rewriting, and ahead has not happened. */
  function cdOpenDay(iso) { var d = cdDiff(cdToday(), iso); return d >= 0 && d <= 2; }

  /* ═══ WHAT A BLOCK IS ═══
     One table decides a block's part of life and whether finishing it
     asks what you trained. There is no glyph: a block is its name, its
     arc on the dial, and one colour. First hit wins, so the longer
     phrase is always listed before the word inside it. */
  var KW = [
    ['wake', /\b(wake up|wake|rise|alarm)\b/],
    ['run', /\b(run|running|jog|tempo|intervals|5k|10k)\b/],
    ['train', /\b(work out|workout|gym|train|training|lift|lifting|weights|push day|pull day|leg day|legs|upper|lower|full body|crossfit|hiit|pilates|boxing|strength)\b/],
    ['stretch', /\b(stretch|stretching|yoga|mobility|recovery|sauna|plunge)\b/],
    ['walk', /\b(walk the dog|walk|hike|steps)\b/],
    ['read', /\b(read|reading|book)\b/],
    ['study', /\b(study|learn|course|class|lecture|revise|practice)\b/],
    ['calm', /\b(meditate|meditation|breathe|breathwork|journal|pray)\b/],
    ['chart', /\b(trade|trading|chart|charting|market|markets)\b/],
    ['move', /\b(commute|drive|bus|travel|flight|school run)\b/],
    ['work', /\b(deep work|work|office|shift|meeting|emails?|call|admin|focus)\b/],
    ['eat', /\b(meal prep|eat|lunch|breakfast|dinner|meal|cook|snack)\b/],
    ['coffee', /\b(coffee|tea)\b/],
    ['sleep', /\b(wind down|sleep|bed|nap)\b/]
  ];
  var CAT = { train: 'body', run: 'body', stretch: 'body', walk: 'body', read: 'mind', study: 'mind', calm: 'mind', chart: 'work', move: 'work', work: 'work', wake: 'rest', eat: 'rest', coffee: 'rest', sleep: 'rest', dot: 'none' };
  var TRAINING = { train: 1, run: 1, stretch: 1 };
  function cdKind(name) {
    var s = String(name || '').toLowerCase();
    for (var i = 0; i < KW.length; i++) if (KW[i][1].test(s)) return KW[i][0];
    return 'dot';
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  /* ═══ THE WEEK ═══ a template: every Monday is the same shape. */
  var SEED = [
    ['Wake up', [0, 1, 2, 3, 4, 5, 6], 420, 420],
    ['Gym', [0, 2, 4], 450, 510],
    ['Easy run', [1, 3], 450, 495],
    ['Deep work', [0, 1, 2, 3, 4], 540, 720],
    ['Lunch', [0, 1, 2, 3, 4], 750, 795],
    ['Emails and calls', [0, 1, 2, 3, 4], 840, 900],
    ['Long walk', [5, 6], 600, 690],
    ['Meal prep', [6], 960, 1020],
    ['Read', [0, 1, 2, 3, 4, 5, 6], 1290, 1320],
    ['Wind down', [0, 1, 2, 3, 4, 5, 6], 1350, 1350]
  ];
  var idc = 0;
  function cdId() { return 'b' + Date.now().toString(36) + (idc++).toString(36); }
  /* The shape of a block is written HERE and every writer goes through
     it, so a block made by the parser and one made by hand cannot come
     out with different fields. */
  function cdBlock(o) {
    var s = Math.max(0, Math.min(1439, Math.round(+o.s || 0)));
    var e = Math.max(s, Math.min(1440, Math.round(+o.e || s)));
    var d = (Array.isArray(o.d) ? o.d : []).filter(function (x) { return x >= 0 && x <= 6; });
    return { id: typeof o.id === 'string' && o.id ? o.id : cdId(), n: String(o.n || '').slice(0, 60) || 'Block', d: d.filter(function (x, i) { return d.indexOf(x) === i; }).sort(), s: s, e: e, p: String(o.p || '').slice(0, 40) };
  }
  function cdLoadWeek() {
    var raw = cdRead(K.week, null);
    if (!Array.isArray(raw)) {
      var w = SEED.map(function (r, i) { return cdBlock({ id: 's' + i, n: r[0], d: r[1], s: r[2], e: r[3] }); });
      cdWrite(K.week, w);
      return w;
    }
    /* Repaired, not discarded, and the repair is written back so it is
       a fact about the record rather than about this page view. */
    var clean = raw.filter(isObj).map(cdBlock).filter(function (b) { return b.d.length; });
    if (JSON.stringify(clean) !== JSON.stringify(raw)) cdWrite(K.week, clean);
    return clean;
  }
  function cdLoadMap(k) {
    var raw = cdRead(k, {});
    if (!isObj(raw)) { cdWrite(k, {}); return {}; }
    var out = {}, bad = false;
    Object.keys(raw).forEach(function (d) {
      if (/^\d{4}-\d{2}-\d{2}$/.test(d) && isObj(raw[d])) out[d] = raw[d]; else bad = true;
    });
    if (bad) cdWrite(k, out);
    return out;
  }

  var S = {
    week: cdLoadWeek(),
    log: cdLoadMap(K.log),
    off: cdLoadMap(K.off),
    hab: cdLoadMap(K.hab),
    train: cdLoadMap(K.train),
    defs: (function () {
      var r = cdRead(K.defs, []);
      return Array.isArray(r) ? r.filter(function (x) { return isObj(x) && x.id && x.n; }) : [];
    })()
  };
  function cdSave(which) { cdWrite(K[which], S[which]); }

  function cdOn(iso) {
    var dw = cdDow(iso);
    return S.week.filter(function (b) { return b.d.indexOf(dw) >= 0; })
      .sort(function (a, b) { return a.s - b.s || a.e - b.e || (a.n < b.n ? -1 : 1); });
  }
  var cdDone = function (iso, id) { return !!(S.log[iso] && S.log[iso][id]); };
  var cdIsOff = function (iso, id) { return !!(S.off[iso] && S.off[iso][id]); };
  function cdSetFlag(map, iso, id, on) {
    var m = S[map];
    if (on) { (m[iso] = m[iso] || {})[id] = 1; }
    else if (m[iso]) { delete m[iso][id]; if (!Object.keys(m[iso]).length) delete m[iso]; }
    cdSave(map);
  }
  function cdTally(iso) {
    var on = cdOn(iso).filter(function (b) { return !cdIsOff(iso, b.id); });
    var kept = on.filter(function (b) { return cdDone(iso, b.id); }).length;
    var mins = on.reduce(function (t, b) { return t + (b.e - b.s); }, 0);
    return { on: on.length, kept: kept, mins: mins };
  }
  /* The record begins at the first thing you ever logged. A day before
     that is not a day you missed. */
  function cdFirst() {
    var ks = [].concat(Object.keys(S.log), Object.keys(S.hab), Object.keys(S.train)).sort();
    return ks[0] || cdToday();
  }

  /* ═══ TRAINING ═══ */
  var LIFT = [
    { g: 'weights', n: 'Weights', items: [['push', 'Push'], ['pull', 'Pull'], ['legs', 'Legs'], ['upper', 'Upper'], ['lower', 'Lower'], ['full', 'Full body'], ['core', 'Core']] },
    { g: 'run', n: 'Run', items: [['easy', 'Easy'], ['tempo', 'Tempo'], ['intervals', 'Intervals'], ['long', 'Long']] },
    { g: 'recovery', n: 'Recovery', items: [['mobility', 'Mobility'], ['yoga', 'Yoga'], ['sauna', 'Sauna']] },
    { g: 'rest', n: 'Rest', items: [['rest', 'Rest day']] }
  ];
  var LIFTN = {};
  LIFT.forEach(function (g) { g.items.forEach(function (it) { LIFTN[g.g + '.' + it[0]] = { n: it[1], g: g.g }; }); });
  var EFFORT = ['Light', 'Moderate', 'Hard'];
  var MINS = [15, 20, 30, 45, 60, 75, 90, 120];
  var DAYKEY = '~day';
  function cdSess(v) {
    if (!isObj(v) || !Array.isArray(v.k)) return null;
    var k = v.k.filter(function (x) { return LIFTN[x]; });
    if (!k.length) return null;
    return { k: k, e: EFFORT.indexOf(v.e) >= 0 ? v.e : '', m: +v.m > 0 ? Math.round(+v.m) : 0 };
  }
  var cdRestOnly = function (s) { return s.k.every(function (k) { return LIFTN[k].g === 'rest'; }); };
  function cdSessName(s) { return s.k.map(function (k) { return LIFTN[k].n; }).join(' + '); }
  function cdSessions(iso) {
    var day = S.train[iso] || {};
    return Object.keys(day).map(function (id) { var s = cdSess(day[id]); return s && { id: id, s: s }; }).filter(Boolean);
  }

  /* ═══ HABITS ═══
     The six are code rather than data, so a new one always arrives and
     the order is always this one. Yours are appended from their own key. */
  var HABITS = [
    { id: 'train', n: 'Train', k: 'tick', from: ['train', 'run', 'stretch'], hc: '--c-body' },
    { id: 'mind', n: 'Mind', k: 'tick', from: ['read', 'study', 'calm'], hc: '--c-mind' },
    { id: 'steps', n: 'Steps', k: 'num', unit: 'steps', step: 500, max: 30000, marks: [5000, 8000, 10000, 15000], hc: '--c-rest' },
    { id: 'fuel', n: 'Fuel', k: 'num', unit: 'kcal', step: 50, max: 5000, marks: [1800, 2200, 2600, 3000], bump: [300, 600], hc: '--c-work' },
    { id: 'water', n: 'Water', k: 'num', unit: 'L', step: 0.25, max: 6, marks: [1, 2, 3, 4], bump: [0.25, 0.5], hc: '--h-water' },
    { id: 'sleep', n: 'Sleep', k: 'num', unit: 'h', step: 0.25, max: 12, marks: [6, 7, 8, 9], hc: '--h-sleep' }
  ];
  function cdHabits() {
    return HABITS.concat(S.defs.map(function (d) {
      return d.k === 'num'
        ? { id: d.id, n: d.n, k: 'num', unit: d.unit || '', step: 1, max: 100, marks: [], mine: true, hc: '--c-' + CAT[cdKind(d.n)] }
        : { id: d.id, n: d.n, k: 'tick', from: [], mine: true, hc: '--c-' + CAT[cdKind(d.n)] };
    }));
  }
  function cdHabVal(iso, h) { return S.hab[iso] ? S.hab[iso][h.id] : undefined; }
  /* A tick is kept by pressing it, OR by the blocks that feed it, OR —
     for Train — by a session filed that day. One claim, three doors. */
  function cdKeptBy(iso, h) {
    if (h.k !== 'tick') return null;
    if (h.id === 'train' && cdSessions(iso).length) return 'session';
    var b = cdOn(iso).filter(function (x) { return h.from.indexOf(cdKind(x.n)) >= 0 && cdDone(iso, x.id); })[0];
    if (b) return b.n;
    return cdHabVal(iso, h) ? 'you' : null;
  }
  function cdHabOn(iso, h) { return h.k === 'tick' ? !!cdKeptBy(iso, h) : +cdHabVal(iso, h) > 0; }
  function cdFmtNum(v, h) {
    if (h.unit === 'L' || h.unit === 'h') return (Math.round(v * 100) / 100).toString();
    return Math.round(v).toLocaleString('en-GB');
  }
  function cdStreak(h) {
    var d = cdToday(), n = 0;
    if (!cdHabOn(d, h)) d = cdAddDays(d, -1);
    while (cdHabOn(d, h) && n < 999) { n++; d = cdAddDays(d, -1); }
    return n;
  }

  /* ═══ VIEW STATE ═══ */
  var view = 'day';
  var sel = cdToday();
  var monthAt = cdToday().slice(0, 7);

  function cdGo(v) {
    view = v;
    try { sessionStorage.setItem('cad.view', v); } catch (e) {}
    $('cdVDay').hidden = v !== 'day';
    $('cdVHab').hidden = v !== 'hab';
    $('cdVMon').hidden = v !== 'mon';
    $('cdVLift').hidden = v !== 'lift';
    document.querySelectorAll('.cd-tab').forEach(function (t) {
      if (t.dataset.v === v) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current');
    });
    document.querySelectorAll('.cd-pane').forEach(function (p) { p.scrollTop = 0; });
    cdPaint();
  }
  function cdPaint() {
    var t = cdDate(cdToday());
    $('cdDate').textContent = DOWL[cdDow(cdToday())] + ' ' + t.getDate() + ' ' + MON[t.getMonth()].slice(0, 3);
    if (view === 'day') cdPaintDay();
    else if (view === 'hab') cdPaintHab();
    else if (view === 'mon') cdPaintMon();
    else cdPaintLift();
  }
  function cdLongDate(iso, withDay) {
    var d = cdDate(iso);
    return (withDay ? DOWL[cdDow(iso)] + ' ' : '') + d.getDate() + ' ' + MON[d.getMonth()];
  }
  function cdWeekStart(iso) { return cdAddDays(iso, -cdDow(iso)); }

  /* ═══ THE DIAL ═══
     Twenty-four hours round one ring, midnight at the top and the day
     running clockwise, the way a watch does. The whole day rather than
     the hours you are awake: a dial that starts at seven is a dial whose
     top moves, and the empty night is part of the shape. */
  var DC = 150, DR = 108;
  /* A round cap reaches half the stroke past the end of the path, so the
     path is drawn that much short at each end and what you SEE starts and
     stops on the minute. Two minutes more each side leaves a hairline
     between two blocks that meet. */
  var CAPM = 6 / DR / (2 * Math.PI) * 1440, EDGE = 2;
  var f2 = function (v) { return Math.round(v * 100) / 100; };
  function cdPt(m, r) { var a = m / 1440 * 2 * Math.PI; return [f2(DC + r * Math.sin(a)), f2(DC - r * Math.cos(a))]; }
  /* In halves past twelve hours, so no single arc is ever ambiguous
     about which way round it goes. */
  function cdArcD(s, e, r) {
    var p0 = cdPt(s, r), d = 'M' + p0[0] + ' ' + p0[1], n = e - s > 700 ? 2 : 1;
    for (var i = 1; i <= n; i++) { var p = cdPt(s + (e - s) * i / n, r); d += 'A' + r + ' ' + r + ' 0 0 1 ' + p[0] + ' ' + p[1]; }
    return d;
  }
  /* A block too short for its own caps is drawn as the cap alone: a dot
     centred on its middle, never an arc drawn backwards. */
  function cdSegD(a, b, cls, attr) {
    var x = a + CAPM, y = b - CAPM, d;
    if (y - x < 1) { var m = (a + b) / 2, p0 = cdPt(m - .5, DR), p1 = cdPt(m + .5, DR); d = 'M' + p0.join(' ') + 'L' + p1.join(' '); cls += ' is-short'; }
    else d = cdArcD(x, y, DR);
    return '<path class="' + cls + '" d="' + d + '"' + attr + '/>';
  }
  /* The glow's region is the whole dial, in the dial's own units. A region
     measured off each arc's box is a few pixels round a short block, and
     the blur is cut square at its edge. */
  var GLOW = '<defs><filter id="cdGl" filterUnits="userSpaceOnUse" x="-20" y="-20" width="340" height="340"><feGaussianBlur stdDeviation="3" result="b"/>'
    + '<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>';
  function cdDialSvg(list, isT, now) {
    var today = cdToday(), h = GLOW + '<circle class="cd-dt" cx="' + DC + '" cy="' + DC + '" r="' + DR + '"/>';
    for (var hr = 0; hr < 24; hr++) {
      var six = hr % 6 === 0, a = cdPt(hr * 60, DR + 16), b = cdPt(hr * 60, DR + (six ? 24 : 20));
      h += '<line class="cd-tk' + (six ? ' is-six' : '') + '" x1="' + a[0] + '" y1="' + a[1] + '" x2="' + b[0] + '" y2="' + b[1] + '"/>';
    }
    [0, 6, 12, 18].forEach(function (x) {
      var p = cdPt(x * 60, DR + 36);
      h += '<text class="cd-dl" x="' + p[0] + '" y="' + p[1] + '" dy="3.5" text-anchor="middle">' + String(x).padStart(2, '0') + '</text>';
    });
    var arcs = '', dots = '';
    list.forEach(function (b) {
      /* A block taken off for the day leaves its hours empty on the ring. */
      if (cdIsOff(sel, b.id)) return;
      var done = cdDone(sel, b.id);
      var running = isT && b.e > b.s && now >= b.s && now < b.e;
      var past = sel < today || (isT && (b.e > b.s ? now >= b.e : now > b.s));
      var st = done ? 'is-kept' : past ? 'is-miss' : 'is-ahead';
      var attr = ' data-id="' + b.id + '" style="--c:var(--c-' + CAT[cdKind(b.n)] + ')"';
      if (b.e <= b.s) { var p = cdPt(b.s, DR); dots += '<circle class="cd-m ' + st + '" cx="' + p[0] + '" cy="' + p[1] + '" r="5"' + attr + '/>'; return; }
      arcs += cdSegD(b.s + EDGE, b.e - EDGE, 'cd-a ' + st, attr);

         the rest, so the ring says how much of it is left. */
      if (running && !done) arcs += cdSegD(b.s + EDGE, now, 'cd-a is-lit', attr);
    });
    h += arcs + dots;
    if (isT) {
      var p0 = cdPt(now, DR - 22), p1 = cdPt(now, DR);
      h += '<g class="cd-hand" data-m="' + now + '"><line x1="' + p0[0] + '" y1="' + p0[1] + '" x2="' + p1[0] + '" y2="' + p1[1] + '"/><circle cx="' + p1[0] + '" cy="' + p1[1] + '" r="4.5"/></g>';
    }
    return h;
  }

  function cdPaintDay() {
    var today = cdToday(), ws = cdWeekStart(today);
    /* THE WEEK, seven small rings. Each is closed by the share of its day
       that was kept, whole and lit only when all of it was; a day still to
       come is an empty ring, because it has not happened. */
    var rb = '';
    for (var i = 0; i < 7; i++) {
      var d = cdAddDays(ws, i), t = cdTally(d), past = d <= today;
      var whole = past && t.on > 0 && t.kept >= t.on, p = past && t.on ? Math.round(t.kept / t.on * 10000) / 100 : 0;
      var ring = '<svg viewBox="0 0 36 36" aria-hidden="true"><circle class="cd-wr-t" cx="18" cy="18" r="15"/>'
        + (whole ? '<circle class="cd-wr-a is-whole" cx="18" cy="18" r="15"/>'
          : p > 0 ? '<circle class="cd-wr-a" cx="18" cy="18" r="15" pathLength="100" stroke-dasharray="' + p + ' 100" transform="rotate(-90 18 18)"/>' : '')
        + '</svg>';
      rb += '<button type="button" class="cd-wd' + (d === today ? ' is-today' : '') + '" data-d="' + d + '" data-p="' + (whole ? 100 : p) + '" aria-pressed="' + (d === sel) + '"'
        + ' aria-label="' + DOWL[i] + ', ' + (past ? t.kept + ' of ' + t.on + ' kept' : t.on + ' planned') + '">'
        + '<span class="cd-wd-l">' + DOW[i] + '</span><span class="cd-wd-r">' + ring + '<b>' + cdDate(d).getDate() + '</b></span></button>';
    }
    $('cdRibbon').innerHTML = rb;

    var now = cdNowMin(), isT = sel === today, open = cdOpenDay(sel), fut = sel > today;
    var list = cdOn(sel), tl = cdTally(sel);
    $('cdDialSvg').innerHTML = cdDialSvg(list, isT, now);

    /* THE MIDDLE. Today it is the clock and what the clock is inside: the
       block running and how long it has left, or the next one and how
       soon. Any other day it is how much of that day was kept. */
    var rel = isT ? 'Today' : sel === cdAddDays(today, -1) ? 'Yesterday' : sel === cdAddDays(today, 1) ? 'Tomorrow' : DOWL[cdDow(sel)];
    var mt, mn = '', ms, mc = '';
    if (isT) {
      var run = null, next = null;
      list.forEach(function (b) {
        if (cdIsOff(sel, b.id)) return;
        if (!run && b.e > b.s && now >= b.s && now < b.e) run = b;
        if (!next && b.s > now) next = b;
      });
      mt = cdHM(now);
      if (run) { mn = run.n; mc = CAT[cdKind(run.n)]; ms = cdLen(run.e - now) + ' left'; }
      else if (next) { mn = next.n; mc = CAT[cdKind(next.n)]; ms = 'In ' + cdLen(next.s - now); }
      else ms = tl.on ? 'Nothing left today' : 'Nothing on today';
    } else {
      mt = fut || !tl.on ? String(tl.on) : tl.kept + '/' + tl.on;
      ms = (fut ? 'planned · ' : tl.on ? 'kept · ' : 'on · ') + cdLongDate(sel, false);
    }
    $('cdMidK').textContent = rel;
    $('cdMidT').textContent = mt;
    $('cdMidN').textContent = mn;
    if (mc) $('cdMidN').style.setProperty('--c', 'var(--c-' + mc + ')'); else $('cdMidN').style.removeProperty('--c');
    $('cdMidS').textContent = ms;
    $('cdDial').setAttribute('aria-label', cdLongDate(sel, true) + ', ' + (fut ? tl.on + ' planned' : tl.kept + ' of ' + tl.on + ' kept')
      + (mn ? '. ' + (isT && ms.slice(-4) === 'left' ? 'Now: ' : 'Next: ') + mn + ', ' + ms : ''));

    $('cdSumK').innerHTML = fut ? '<b>' + tl.on + '</b> ' + (tl.on === 1 ? 'block' : 'blocks') : '<b>' + tl.kept + '</b> of ' + tl.on + ' kept';
    $('cdSumP').innerHTML = tl.mins ? '<b>' + cdLen(tl.mins) + '</b> planned' : '';

    var ag = $('cdAgenda');
    if (!list.length) {
      ag.innerHTML = '<li class="cd-empty">Nothing on this day yet.<button type="button" class="cd-link" data-act="add">+ Add a block</button></li>';
      return;
    }
    ag.innerHTML = list.map(function (b) { return cdRow(b, isT, now, open); }).join('');
  }

  /* A ROW is two press targets, and they are siblings: the dot ticks, the
     rest opens the block. A button inside a button collapses to one press
     while looking exactly right. The dot is drawn at ten pixels and owns
     forty-four. */
  function cdRow(b, isT, now, open) {
    var cat = CAT[cdKind(b.n)], done = cdDone(sel, b.id), off = cdIsOff(sel, b.id);
    var running = isT && !off && b.e > b.s && now >= b.s && now < b.e;
    var past = !off && ((isT && (b.e > b.s ? now >= b.e : now > b.s)) || sel < cdToday());
    var time = off ? 'Off' : b.e > b.s ? cdHM(b.s) + '–' + cdHM(b.e) : cdHM(b.s);
    var sess = (S.train[sel] && cdSess(S.train[sel][b.id])) || null, sub = [];
    if (sess) sub.push('<span class="cd-rw" style="--kc:var(--k-' + LIFTN[sess.k[0]].g + ')">' + esc(cdSessName(sess)) + (sess.m ? ' · ' + sess.m + 'm' : '') + '</span>');
    if (b.p) sub.push(esc(b.p));
    var cls = 'cd-it' + (done ? ' is-done' : '') + (off ? ' is-off' : '') + (running ? ' is-now' : '') + (past ? ' is-past' : '');
    return '<li class="' + cls + '" data-id="' + b.id + '" style="--c:var(--c-' + cat + ')">'
      + '<button type="button" class="cd-dot" data-act="tick" aria-pressed="' + done + '"' + (open && !off ? '' : ' disabled')
      + ' aria-label="' + (done ? 'Kept' : 'Mark kept') + ': ' + esc(b.n) + '"><i></i></button>'
      + '<button type="button" class="cd-rb" data-act="edit" aria-label="' + esc(b.n) + ', ' + cdHM(b.s) + (b.e > b.s ? ' to ' + cdHM(b.e) : '') + (off ? ', off this day' : '') + '. Open">'
      + '<span class="cd-rn">' + esc(b.n) + '</span><span class="cd-rt">' + time + '</span>'
      + (sub.length ? '<span class="cd-rs">' + sub.join(' · ') + '</span>' : '') + '</button></li>';
  }
  var TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  function cdTick(id) {
    if (!cdOpenDay(sel)) return;
    var b = S.week.filter(function (x) { return x.id === id; })[0];
    if (!b) return;
    var was = cdDone(sel, id);
    cdSetFlag('log', sel, id, !was);
    if (!was) cdSetFlag('off', sel, id, false);
    else if (S.train[sel] && S.train[sel][id]) { delete S.train[sel][id]; if (!Object.keys(S.train[sel]).length) delete S.train[sel]; cdSave('train'); }
    cdPaint();
    /* Finishing a training block is the moment to ask what it was. */
    if (!was && TRAINING[cdKind(b.n)]) cdLiftSheet(sel, id, b.n);
  }

  $('cdAgenda').addEventListener('click', function (ev) {
    var btn = ev.target.closest('[data-act]');
    if (!btn) return;
    if (btn.dataset.act === 'add') { cdEdit(null); return; }
    var li = btn.closest('.cd-it');
    if (!li) return;
    if (btn.dataset.act === 'tick') cdTick(li.dataset.id);
    else cdEdit(li.dataset.id);
  });
  $('cdRibbon').addEventListener('click', function (ev) {
    var b = ev.target.closest('.cd-wd');
    if (!b) return;
    sel = b.dataset.d;
    cdPaintDay();
  });

  /* ═══ THE SENTENCE ═══
     "Gym mon wed fri 6:30 to 8", "walk weekdays 7:45 for 30 mins",
     "read now", "stretch after gym". What it cannot place, it leaves in
     the name — a sentence it does not understand costs nothing. */
  var DAYW = [['monday', 'mon'], ['tuesday', 'tues', 'tue'], ['wednesday', 'wed'], ['thursday', 'thurs', 'thu'], ['friday', 'fri'], ['saturday', 'sat'], ['sunday', 'sun']];
  function cdClock(h, m, mer) {
    h = +h; m = +(m || 0);
    if (mer === 'pm' && h < 12) h += 12;
    if (mer === 'am' && h === 12) h = 0;
    if (h > 23 || m > 59) return null;
    return h * 60 + m;
  }
  function cdParse(text, weekFor) {
    var src = ' ' + String(text || '').toLowerCase().replace(/[.,!]/g, ' ') + ' ';
    var used = src;
    var eat = function (m) { used = used.replace(m, function (x) { return ' '.repeat(x.length); }); };
    var out = { days: [], s: null, e: null, len: null, after: null };
    var m;

    if ((m = used.match(/\b(every ?day|daily)\b/))) { out.days = [0, 1, 2, 3, 4, 5, 6]; eat(m[0]); }
    if ((m = used.match(/\bweekdays?\b/))) { out.days = out.days.concat([0, 1, 2, 3, 4]); eat(m[0]); }
    if ((m = used.match(/\bweekends?\b/))) { out.days = out.days.concat([5, 6]); eat(m[0]); }
    if ((m = used.match(/\btoday\b/))) { out.days.push(cdDow(cdToday())); eat(m[0]); }
    if ((m = used.match(/\btomorrow\b/))) { out.days.push(cdDow(cdAddDays(cdToday(), 1))); eat(m[0]); }
    DAYW.forEach(function (ws, i) {
      var re = new RegExp('\\b(?:on\\s+|every\\s+)?(' + ws.join('|') + ')s?\\b', 'g');
      var hit = used.match(re);
      if (hit) { out.days.push(i); hit.forEach(eat); }
    });
    used = used.replace(/\b(and|&)\b/g, function (x) { return ' '.repeat(x.length); });

    var range = used.match(/\b(?:from\s+|at\s+)?(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\s*(?:-|–|to|until|till)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\b/);
    if (range) {
      var s = cdClock(range[1], range[2], range[3] || (range[6] === 'pm' && +range[1] < +range[4] ? 'pm' : ''));
      var e = cdClock(range[4], range[5], range[6]);
      if (s != null && e != null) {
        if (e <= s && !range[6] && e + 720 > s && e < 720) e += 720;
        if (e > s) { out.s = s; out.e = e; eat(range[0]); }
      }
    }
    if ((m = used.match(/\bfor\s+(an?|half an|\d+(?:\.\d+)?)\s*(h|hr|hrs|hour|hours|m|min|mins|minute|minutes)\b/))) {
      var q = m[1] === 'half an' ? 0.5 : /^an?$/.test(m[1]) ? 1 : +m[1];
      out.len = Math.round(/^h/.test(m[2]) ? q * 60 : q);
      eat(m[0]);
    }
    if ((m = used.match(/\bin\s+(\d+)\s*(m|min|mins|minutes|h|hr|hrs|hours?)\b/))) {
      var off = /^h/.test(m[2]) ? +m[1] * 60 : +m[1];
      var at = cdNowMin() + off;
      if (at < 1440 && out.s == null) out.s = at;
      eat(m[0]);
      if (!out.days.length) out.days.push(cdDow(cdToday()));
    }
    if ((m = used.match(/\bnow\b/))) {
      if (out.s == null) out.s = Math.round(cdNowMin() / 5) * 5;
      eat(m[0]);
      if (!out.days.length) out.days.push(cdDow(cdToday()));
    }
    if (out.s == null) {
      var clk = used.match(/\b(?:at\s+)?(\d{1,2}):(\d{2})\s*(am|pm)?\b/) || used.match(/\b(?:at\s+)?(\d{1,2})()\s*(am|pm)\b/) || used.match(/\bat\s+(\d{1,2})()()\b/);
      if (clk) { var c = cdClock(clk[1], clk[2], clk[3]); if (c != null) { out.s = c; eat(clk[0]); } }
    }
    /* "after the gym": the other thing already has a time; this starts
       where it ends. Through the keyword table, so "after training"
       finds a block nobody called Training. Only struck out if it
       resolves — otherwise the words stay in the name. */
    var aft = used.match(/\b(after|before)\s+(?:the\s+|my\s+)?([a-z][a-z ]*?)\s*$/) || used.match(/\b(after|before)\s+(?:the\s+|my\s+)?([a-z]+)\b/);
    if (aft && out.s == null) {
      var probeDay = out.days.length ? out.days[0] : cdDow(cdToday());
      var phrase = aft[2].trim(), pk = cdKind(phrase);
      var pool = (weekFor || S.week).filter(function (b) { return b.d.indexOf(probeDay) >= 0; }).sort(function (a, b) { return a.s - b.s; });
      var hit2 = pool.filter(function (b) { var n = b.n.toLowerCase(); return n.indexOf(phrase) >= 0 || (phrase.length >= 3 && phrase.indexOf(n) >= 0); })[0]
        || (pk !== 'dot' && pool.filter(function (b) { return cdKind(b.n) === pk; })[0]);
      if (hit2) {
        out.after = hit2.n;
        var L = out.len != null ? out.len : 0;
        out.s = aft[1] === 'after' ? hit2.e : Math.max(0, hit2.s - (L || 0));
        eat(aft[0]);
      }
    }
    if (out.s != null && out.e == null) out.e = Math.min(1440, out.s + (out.len || 0));
    if (!out.days.length && out.s != null) out.days = [cdDow(cdToday())];

    var name = used.replace(/\b(at|from|on|every|for|the|a|an|my)\b/g, ' ').replace(/\s+/g, ' ').trim();
    out.n = name ? name.charAt(0).toUpperCase() + name.slice(1) : '';
    out.days = out.days.filter(function (x, i) { return out.days.indexOf(x) === i; }).sort();
    return out;
  }

  /* ═══ THE SHEET ═══ one at a time; opening one replaces the last. */
  var shOnClose = null;
  function cdSheet(title, body, onClose) {
    $('cdShT').textContent = title;
    var b = $('cdShB');
    b.innerHTML = '';
    if (typeof body === 'string') b.innerHTML = body; else b.appendChild(body);
    shOnClose = onClose || null;
    var sh = $('cdSheet'), sc = $('cdScrim');
    sh.hidden = false; sc.hidden = false;
    sh.scrollTop = 0;
    requestAnimationFrame(function () { sh.classList.add('is-open'); sc.classList.add('is-open'); });
    return b;
  }
  var shTimer = 0;
  function cdClose() {
    var sh = $('cdSheet'), sc = $('cdScrim');
    if (sh.hidden) return;
    sh.classList.remove('is-open'); sc.classList.remove('is-open');
    clearTimeout(shTimer);
    shTimer = setTimeout(function () { sh.hidden = true; sc.hidden = true; }, 240);
    var f = shOnClose; shOnClose = null;
    if (f) f();
  }
  function cdSheetOpen() { return !$('cdSheet').hidden && $('cdSheet').classList.contains('is-open'); }
  $('cdShX').addEventListener('click', cdClose);
  $('cdScrim').addEventListener('click', cdClose);
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && !$('cdSheet').hidden) { ev.preventDefault(); cdClose(); } });

  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }

  /* ═══ ADD AND EDIT ═══ one form. A new block also gets the sentence. */
  function cdEdit(id) {
    var b = id ? S.week.filter(function (x) { return x.id === id; })[0] : null;
    var f = b ? { n: b.n, d: b.d.slice(), s: b.s, len: b.e - b.s, p: b.p }
      : { n: '', d: [cdDow(sel)], s: Math.min(1380, Math.ceil(cdNowMin() / 15) * 15), len: 30, p: '' };
    var root = el('div');

    if (!b) {
      var say = el('input', 'cd-field cd-say');
      say.id = 'cdSay'; say.type = 'text'; say.autocomplete = 'off';
      say.placeholder = 'Gym mon wed fri 6:30 to 8';
      say.setAttribute('aria-label', 'Say it in a sentence');
      var prev = el('p', 'cd-prev'); prev.id = 'cdPrev';
      root.appendChild(say); root.appendChild(prev);
      say.addEventListener('input', function () {
        var r = cdParse(say.value);

      });
      root.appendChild(el('p', 'cd-lbl', 'Or set it by hand'));
    } else {
      /* This day: what happened to the block on the date you are looking at. */
      root.appendChild(el('p', 'cd-lbl', esc(DOWL[cdDow(sel)]) + ' ' + cdDate(sel).getDate() + ' ' + MON[cdDate(sel).getMonth()].slice(0, 3)));
      var canDo = cdOpenDay(sel);
      var tDone = el('button', 'cd-toggle', '<span>Done</span><i></i>');
      tDone.type = 'button'; tDone.id = 'cdTDone';
      tDone.setAttribute('aria-pressed', cdDone(sel, b.id));
      tDone.disabled = !canDo;
      tDone.addEventListener('click', function () { cdClose(); cdTick(b.id); });
      var tOff = el('button', 'cd-toggle', '<span>Off this day</span><i></i>');
      tOff.type = 'button'; tOff.id = 'cdTOff';
      tOff.setAttribute('aria-pressed', cdIsOff(sel, b.id));

      tOff.addEventListener('click', function () {
        var on = !cdIsOff(sel, b.id);

      }
      root.appendChild(el('p', 'cd-lbl', 'Every week'));
    }

    var rows = el('div', 'cd-rows');
    var nm = el('input', 'cd-field'); nm.type = 'text'; nm.id = 'cdFN'; nm.placeholder = 'Name';
    var st = el('input', 'cd-field'); st.type = 'time'; st.id = 'cdFS'; st.step = 300;

      c.setAttribute('aria-label', DOWL[i]);
      c.addEventListener('click', function () {
        var k = f.d.indexOf(i);
        if (k >= 0) f.d.splice(k, 1); else f.d.push(i);
        sync();
      });
      dayBox.appendChild(c);
    });
    function row(lbl, node) { var r = el('div', 'cd-row'); r.appendChild(el('span', '', lbl)); r.appendChild(node); rows.appendChild(r); }
    row('What', nm); row('Starts', st);
    var lenWrap = el('div'); lenWrap.appendChild(rg); lenWrap.appendChild(lenOut); row('How long', lenWrap);
    row('Where', pl);
    root.appendChild(rows);
    root.appendChild(el('p', 'cd-lbl', 'Days'));
    root.appendChild(dayBox);

    function sync() {
      nm.value = f.n; st.value = cdHM(f.s); pl.value = f.p;
      if (+rg.max < f.len) rg.max = Math.ceil(f.len / 60) * 60;
      rg.value = f.len;
      lenOut.textContent = f.len > 0 ? cdLen(f.len) + ' · ends ' + cdHM(Math.min(1440, f.s + f.len)) : 'A moment';
      dayBox.querySelectorAll('.cd-chip').forEach(function (c) { c.setAttribute('aria-pressed', f.d.indexOf(+c.dataset.i) >= 0); });
    }
    nm.addEventListener('input', function () { f.n = nm.value; });
    pl.addEventListener('input', function () { f.p = pl.value; });
    st.addEventListener('input', function () {
      var p = st.value.split(':');
      if (p.length === 2) { f.s = +p[0] * 60 + +p[1]; lenOut.textContent = f.len > 0 ? cdLen(f.len) + ' · ends ' + cdHM(Math.min(1440, f.s + f.len)) : 'A moment'; }
    });
    rg.addEventListener('input', function () {
      f.len = +rg.value;
      lenOut.textContent = f.len > 0 ? cdLen(f.len) + ' · ends ' + cdHM(Math.min(1440, f.s + f.len)) : 'A moment';
    });
    sync();

    var foot = el('div', 'cd-foot');
    if (b) {
      var del = el('button', 'cd-btn warn', 'Delete'); del.type = 'button'; del.id = 'cdFDel';
      del.addEventListener('click', function () {
        var at = S.week.indexOf(b);
        S.week.splice(at, 1); cdSave('week'); cdClose(); cdPaint();
        cdToast('Deleted ' + b.n, function () { S.week.splice(at, 0, b); cdSave('week'); cdPaint(); });
      });
      foot.appendChild(del);
    }
    var save = el('button', 'cd-btn go', b ? 'Save' : 'Add'); save.type = 'button'; save.id = 'cdFSave';
    save.addEventListener('click', function () {
      if (!f.n.trim()) { cdToast('Give it a name.'); nm.focus(); return; }
      if (!f.d.length) { cdToast('Pick at least one day.'); return; }
      if (f.s + f.len > 1440) { cdToast('It has to finish by midnight.'); return; }
      var nb = cdBlock({ id: b ? b.id : null, n: f.n.trim(), d: f.d, s: f.s, e: f.s + f.len, p: f.p.trim() });
      if (b) S.week[S.week.indexOf(b)] = nb; else S.week.push(nb);
      cdSave('week'); cdClose();
      if (!b && nb.d.indexOf(cdDow(sel)) < 0) {
        /* Land on the day it went on, or it looks like nothing happened. */
        var t = cdToday(), ws = cdWeekStart(t);
        sel = cdAddDays(ws, nb.d[0]);
      }
      if (view !== 'day') cdGo('day'); else cdPaint();
      cdToast((b ? 'Saved ' : 'Added ') + nb.n);
    });
    foot.appendChild(save);
    root.appendChild(foot);
    cdSheet(b ? b.n : 'New block', root);
    var sayEl = root.querySelector('.cd-say');
    if (sayEl) setTimeout(function () { sayEl.focus(); }, 60);
  }

  /* ═══ WHAT YOU TRAINED ═══ */
  function cdLiftSheet(iso, key, label) {
    var cur = (S.train[iso] && cdSess(S.train[iso][key])) || { k: [], e: '', m: 0 };
    var pick = cur.k.slice(), eff = cur.e, min = cur.m;
    var root = el('div');
    var boards = el('div');
    LIFT.forEach(function (g) {
      var box = el('div', 'cd-grp'); box.style.setProperty('--kc', 'var(--k-' + g.g + ')');
      box.appendChild(el('h3', '', g.n));
      var cs = el('div', 'cd-chips');
      g.items.forEach(function (it) {
        var k = g.g + '.' + it[0];
        var c = el('button', 'cd-chip kc', it[1]); c.type = 'button'; c.dataset.k = k;
        c.style.setProperty('--kc', 'var(--k-' + g.g + ')');
        c.addEventListener('click', function () {
          var at = pick.indexOf(k);
          if (at >= 0) pick.splice(at, 1);
          /* You cannot half-rest: Rest clears the rest, and anything else clears Rest. */
          else if (g.g === 'rest') pick = [k];
          else { pick = pick.filter(function (x) { return LIFTN[x].g !== 'rest'; }); pick.push(k); }
          draw();
        });
        cs.appendChild(c);
      });
      box.appendChild(cs); boards.appendChild(box);
    });
    root.appendChild(boards);
    var more = el('div');
    more.appendChild(el('p', 'cd-lbl', 'How hard'));
    var ef = el('div', 'cd-chips');
    EFFORT.forEach(function (w) {
      var c = el('button', 'cd-chip', w); c.type = 'button'; c.dataset.e = w;
      c.addEventListener('click', function () { eff = eff === w ? '' : w; draw(); });
      ef.appendChild(c);
    });
    more.appendChild(ef);
    more.appendChild(el('p', 'cd-lbl', 'How long'));
    var mn = el('div', 'cd-chips');
    MINS.forEach(function (x) {
      var c = el('button', 'cd-chip', x + 'm'); c.type = 'button'; c.dataset.m = x;
      c.addEventListener('click', function () { min = min === x ? 0 : x; draw(); });
      mn.appendChild(c);
    });
    more.appendChild(mn);
    root.appendChild(more);
    var foot = el('div', 'cd-foot');
    var skip = el('button', 'cd-btn', cur.k.length ? 'Take it off' : 'Not now'); skip.type = 'button';
    skip.addEventListener('click', function () {
      if (cur.k.length && S.train[iso]) { delete S.train[iso][key]; if (!Object.keys(S.train[iso]).length) delete S.train[iso]; cdSave('train'); }
      cdClose(); cdPaint();
    });
    var go = el('button', 'cd-btn go', 'Log'); go.type = 'button'; go.id = 'cdLiftGo';
    go.addEventListener('click', function () {
      if (!pick.length) return;
      var rest = pick.every(function (k) { return LIFTN[k].g === 'rest'; });
      (S.train[iso] = S.train[iso] || {})[key] = rest ? { k: pick } : { k: pick, e: eff, m: min };
      cdSave('train');
      if (key !== DAYKEY && !cdDone(iso, key)) cdSetFlag('log', iso, key, true);
      cdClose(); cdPaint();
      cdToast('Logged ' + pick.map(function (k) { return LIFTN[k].n; }).join(' + '));
    });
    foot.appendChild(skip); foot.appendChild(go);
    root.appendChild(foot);
    function draw() {
      root.querySelectorAll('[data-k]').forEach(function (c) { c.setAttribute('aria-pressed', pick.indexOf(c.dataset.k) >= 0); });
      root.querySelectorAll('[data-e]').forEach(function (c) { c.setAttribute('aria-pressed', c.dataset.e === eff); });
      root.querySelectorAll('[data-m]').forEach(function (c) { c.setAttribute('aria-pressed', +c.dataset.m === min); });
      var rest = pick.length && pick.every(function (k) { return LIFTN[k].g === 'rest'; });
      /* A rest day is not asked how hard or how long: absent, not disabled. */
      more.hidden = !!rest;
      go.disabled = !pick.length;
      go.textContent = pick.length ? 'Log ' + pick.map(function (k) { return LIFTN[k].n; }).join(' + ') : 'Pick a session';
    }
    draw();
    cdSheet('What did you train?', root);
    $('cdShT').title = label || '';
  }

  /* ═══ RINGS OF SEGMENTS ═══
     The habits and the training log draw the same object the day does,
     cut into equal parts: one per habit, one per day of a fortnight, one
     per day of a month. A lit part is that thing's own colour; an unlit
     one is the ring's bare track. Butt ends, so a part is exactly its
     share of the circle and the gaps between them are all one width. */
  function cdArcDeg(c, r, a0, a1) {
    var p = function (a) { a = a * Math.PI / 180; return f2(c + r * Math.sin(a)) + ' ' + f2(c - r * Math.cos(a)); };
    return 'M' + p(a0) + 'A' + r + ' ' + r + ' 0 ' + (a1 - a0 > 180 ? 1 : 0) + ' 1 ' + p(a1);
  }
  function cdSegRing(size, r, w, n, part, gap) {
    var c = size / 2, span = 360 / n, g = Math.min(gap, span * .4), out = '';
    for (var i = 0; i < n; i++) {
      var q = part(i) || {};
      out += '<path class="cd-sg' + (q.lit ? ' is-lit' : '') + '" d="' + cdArcDeg(c, r, i * span + g / 2, (i + 1) * span - g / 2) + '" stroke-width="' + w + '"'
        + (q.lit ? ' style="--hc:' + q.c + '"' : '') + '/>';
    }
    return '<svg viewBox="0 0 ' + size + ' ' + size + '">' + out + '</svg>';
  }

  /* ═══ HABITS VIEW ═══
     Today is one ring cut into a part per habit, lit as each is kept.
     Under it every habit is a fortnight round its own ring, oldest at the
     top and today the last part before it comes round again. Colour says
     WHICH habit, never whether. */
  var CHEV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';
  function cdPaintHab() {
    var today = cdToday(), hs = cdHabits();
    var kept = hs.filter(function (h) { return cdHabOn(today, h); });
    $('cdHabT').textContent = kept.length + '/' + hs.length;
    $('cdHabCap').textContent = 'kept';
    $('cdHabSvg').innerHTML = cdSegRing(180, 76, 10, hs.length, function (i) { return { lit: cdHabOn(today, hs[i]), c: 'var(' + hs[i].hc + ')' }; }, 5);
    $('cdHabRing').setAttribute('aria-label', kept.length + ' of ' + hs.length + ' habits kept today');
    var ds = [];
    for (var j = 13; j >= 0; j--) ds.push(cdAddDays(today, -j));
    var html = '';
    hs.forEach(function (h) {
      var v = cdHabVal(today, h), on = cdHabOn(today, h);
      var sub, val;
      if (h.k === 'tick') {
        var by = cdKeptBy(today, h), st = cdStreak(h);
        sub = by && by !== 'you' ? (by === 'session' ? 'Kept by a session' : 'Kept by ' + esc(by)) : (st > 1 ? st + '-day streak' : on ? 'Kept today' : 'Not yet');
        val = on ? '<span class="cd-hr-v is-tick">' + TICK + '</span>' : '<span class="cd-hr-v is-nil">—</span>';
      } else {
        var wk = 0, n = 0;
        for (var i = 1; i <= 7; i++) { var x = +cdHabVal(cdAddDays(today, -i), h); if (x > 0) { wk += x; n++; } }
        sub = n ? '7-day avg ' + cdFmtNum(wk / n, h) : 'Not yet';
        val = on ? '<span class="cd-hr-v">' + cdFmtNum(v, h) + '<small>' + esc(h.unit) + '</small></span>' : '<span class="cd-hr-v is-nil">—</span>';
      }
      var ring = cdSegRing(96, 40, 5, 14, function (k) { return { lit: cdHabOn(ds[k], h), c: 'var(' + h.hc + ')' }; }, 6);
      /* The ring logs and the name opens the record: two siblings, never
         one inside the other. */
      html += '<li class="cd-hr' + (on ? ' is-on' : '') + '" data-h="' + h.id + '" style="--hc:var(' + h.hc + ')">'
        + '<button type="button" class="cd-hr-b" data-act="log" aria-label="' + esc(h.n) + ', ' + (on ? 'kept' : 'not yet') + '. Log">' + ring + val + '</button>'
        + '<button type="button" class="cd-hr-n" data-act="hist" aria-label="' + esc(h.n) + ' history"><b>' + esc(h.n) + CHEV + '</b><span class="cd-hr-s">' + sub + '</span></button></li>';
    });
    $('cdHab').innerHTML = html;
  }
  $('cdHab').addEventListener('click', function (ev) {
    var btn = ev.target.closest('[data-act]'); if (!btn) return;
    var h = cdHabits().filter(function (x) { return x.id === btn.closest('.cd-hr').dataset.h; })[0];
    if (!h) return;
    if (btn.dataset.act === 'hist') { cdHabHist(h); return; }
    var today = cdToday();
    if (h.id === 'train') {
      var tb = cdOn(today).filter(function (b) { return TRAINING[cdKind(b.n)] && !cdIsOff(today, b.id); });
      var free = tb.filter(function (b) { return !(S.train[today] && S.train[today][b.id]); })[0];
      cdLiftSheet(today, free ? free.id : tb.length ? tb[0].id : DAYKEY, 'Train');
      return;
    }
    if (h.k === 'tick') {
      var by = cdKeptBy(today, h);
      if (by && by !== 'you') { cdToast('Kept by ' + by + ' — untick it on the day.'); return; }
      var m = S.hab[today] = S.hab[today] || {};
      if (m[h.id]) delete m[h.id]; else m[h.id] = 1;
      if (!Object.keys(m).length) delete S.hab[today];
      cdSave('hab'); cdPaintHab();
      return;
    }
    cdNumSheet(h, today);
  });

  function cdNumSheet(h, iso) {

    var rg = el('input', 'cd-range'); rg.type = 'range'; rg.min = 0; rg.max = max; rg.step = h.step; rg.value = v; rg.id = 'cdNumR';
    rg.setAttribute('aria-label', h.n);

    var marks = el('div', 'cd-chips');

  /* ═══ MONTH ═══
     A ring a day, closed by how much of the day was kept, and whole and
     lit only when all of it was. What you trained is a bead at the top of
     that day's ring, in the session's colour. A day before the record
     began draws no ring at all: it is not a day you missed. */
  function cdPaintMon() {
    var today = cdToday(), first = cdFirst();
    var y = +monthAt.slice(0, 4), mo = +monthAt.slice(5, 7) - 1;
    $('cdMonK').textContent = String(y);
    $('cdMonT').textContent = MON[mo];
    var start = cdISO(new Date(y, mo, 1));
    var days = new Date(y, mo + 1, 0).getDate();
    var pad = cdDow(start);
    var html = '', kept = 0, trained = 0;
    for (var p = 0; p < pad; p++) html += '<span class="cd-mc is-pad" aria-hidden="true"></span>';
    for (var d = 1; d <= days; d++) {
      var iso = cdISO(new Date(y, mo, d));
      var fut = iso > today, t = cdTally(iso);
      var inRec = iso >= first && !fut;
      var whole = inRec && t.on > 0 && t.kept >= t.on;
      var pct = inRec && t.on ? Math.round(t.kept / t.on * 10000) / 100 : 0;
      if (inRec && t.kept) kept++;
      var ss = cdSessions(iso), lift = ss.filter(function (x) { return !cdRestOnly(x.s); })[0];
      if (lift) trained++;
      var shown = lift || ss[0];
      var ring = inRec ? '<svg viewBox="0 0 40 40" aria-hidden="true"><circle class="cd-mr-t" cx="20" cy="20" r="17"/>'
        + (whole ? '<circle class="cd-mr-a is-whole" cx="20" cy="20" r="17"/>'
          : pct > 0 ? '<circle class="cd-mr-a" cx="20" cy="20" r="17" pathLength="100" stroke-dasharray="' + pct + ' 100" transform="rotate(-90 20 20)"/>' : '')
        + (shown ? '<circle class="cd-bead" cx="20" cy="3" r="3.5" style="--kc:var(--k-' + LIFTN[shown.s.k[0]].g + ')"/>' : '')
        + '</svg>' : '';
      html += '<button type="button" class="cd-mc' + (fut ? ' is-future' : inRec ? (whole ? ' is-whole' : '') : ' is-quiet') + (iso === today ? ' is-today' : '') + '"'
        + ' data-day="' + iso + '"' + (inRec ? ' data-p="' + (whole ? 100 : pct) + '"' : '')
        + ' aria-label="' + d + ' ' + MON[mo] + (inRec ? ', ' + t.kept + ' of ' + t.on + ' kept' : '') + (shown ? ', ' + esc(cdSessName(shown.s)) : '') + '">'
        + ring + '<b>' + d + '</b></button>';
    }
    for (var q = pad + days; q % 7; q++) html += '<span class="cd-mc is-pad" aria-hidden="true"></span>';
    $('cdMonG').innerHTML = html;
    $('cdMonCap').textContent = kept + ' days kept · ' + trained + ' trained';
    $('cdMonN').disabled = monthAt >= today.slice(0, 7);
    $('cdMonP').disabled = monthAt <= first.slice(0, 7);
    $('cdMonL').innerHTML = [['weights', 'Weights'], ['run', 'Run'], ['recovery', 'Recovery']].map(function (g) {
      return '<span><i style="--kc:var(--k-' + g[0] + ')"></i>' + g[1] + '</span>';
    }).join('');
  }
  function cdShiftMonth(n) {
    var y = +monthAt.slice(0, 4), m = +monthAt.slice(5, 7) - 1 + n;
    var d = new Date(y, m, 1);
    monthAt = cdISO(d).slice(0, 7);
    cdPaintMon();
  }
  $('cdMonP').addEventListener('click', function () { cdShiftMonth(-1); });
  $('cdMonN').addEventListener('click', function () { cdShiftMonth(1); });
  $('cdMonG').addEventListener('click', function (ev) {
    var c = ev.target.closest('[data-day]'); if (!c) return;
    cdDaySheet(c.dataset.day);
  });

  /* A day read back. Not a second editor: "Open this day" goes to the one that is. */
  function cdDaySheet(iso) {
    var root = el('div'), t = cdTally(iso), fut = iso > cdToday();
    root.appendChild(el('p', 'cd-cap', fut ? t.on + ' planned' : t.kept + ' of ' + t.on + ' kept · ' + cdLen(t.mins) + ' committed'));
    var ul = el('ul', 'cd-day-l');
    cdOn(iso).forEach(function (b) {
      var k = cdKind(b.n), st = cdIsOff(iso, b.id) ? 'off' : cdDone(iso, b.id) ? 'kept' : fut ? 'planned' : 'not kept';
      var li = el('li', '', '<i></i><b>' + esc(b.n) + '</b><span>' + cdHM(b.s) + ' · ' + st + '</span>');
      li.style.setProperty('--cat', 'var(--c-' + CAT[k] + ')');
      ul.appendChild(li);
    });
    root.appendChild(ul);
    var ss = cdSessions(iso);
    if (ss.length) {
      root.appendChild(el('p', 'cd-lbl', 'Trained'));
      var tu = el('ul', 'cd-day-l');
      ss.forEach(function (x) {
        var li = tu.appendChild(el('li', '', '<i></i><b>' + esc(cdSessName(x.s)) + '</b><span>' + (x.s.m ? x.s.m + 'm' : '') + (x.s.e ? ' · ' + x.s.e : '') + '</span>'));
        li.style.setProperty('--cat', 'var(--k-' + LIFTN[x.s.k[0]].g + ')');
      });
      root.appendChild(tu);
    }
    var hs = cdHabits().filter(function (h) { return cdHabOn(iso, h); });
    if (hs.length) {
      root.appendChild(el('p', 'cd-lbl', 'Habits'));
      root.appendChild(el('p', 'cd-note', hs.map(function (h) { return esc(h.n) + (h.k === 'num' ? ' ' + cdFmtNum(cdHabVal(iso, h), h) + ' ' + esc(h.unit) : ''); }).join(' · ')));
    }
    var foot = el('div', 'cd-foot');
    var go = el('button', 'cd-btn go', 'Open this day'); go.type = 'button';
    go.addEventListener('click', function () { sel = iso; cdClose(); cdGo('day'); });
    foot.appendChild(go); root.appendChild(foot);
    var d = cdDate(iso);
    cdSheet(DOWL[cdDow(iso)] + ' ' + d.getDate() + ' ' + MON[d.getMonth()], root);
  }

  /* ═══ LIFTS ═══
     Thirty days round one ring, a part a day, lit in the colour of what
     you trained on it. The middle counts the sessions; a rest day lights
     its part in the neutral and is not one of them. */
  function cdPaintLift() {
    var today = cdToday(), all = [];
    Object.keys(S.train).sort().reverse().forEach(function (d) { cdSessions(d).forEach(function (x) { all.push({ d: d, s: x.s }); }); });
    var m30 = all.filter(function (x) { return cdDiff(today, x.d) < 30 && !cdRestOnly(x.s); });
    var d30 = [];
    for (var i = 29; i >= 0; i--) d30.push(cdAddDays(today, -i));
    $('cdLiftSvg').innerHTML = cdSegRing(200, 84, 10, 30, function (k) {
      var ss = cdSessions(d30[k]);
      if (!ss.length) return null;
      var s = ss.filter(function (x) { return !cdRestOnly(x.s); })[0] || ss[0];
      return { lit: true, c: 'var(--k-' + LIFTN[s.s.k[0]].g + ')' };
    }, 2.4);
    $('cdLiftT').textContent = String(m30.length);
    $('cdLiftRing').setAttribute('aria-label', m30.length + ' sessions in the last thirty days');
    var box = $('cdLift');
    $('cdLiftK').textContent = all.length ? 'Last · ' + cdSessName(all[0].s) + ' · ' + DOW[cdDow(all[0].d)] + ' ' + cdDate(all[0].d).getDate() : 'Nothing logged yet';
    if (!all.length) {
      box.innerHTML = '<p class="cd-empty">No sessions yet. Mark a gym, run or yoga block kept on the day and it asks what you trained.</p>';
      return;
    }
    var mins = m30.filter(function (x) { return x.s.m; });
    var avg = mins.length ? Math.round(mins.reduce(function (t, x) { return t + x.s.m; }, 0) / mins.length) : 0;
    var days = {}; m30.forEach(function (x) { days[x.d] = 1; });
    var ws = cdWeekStart(today);
    var wk = all.filter(function (x) { return x.d >= ws && !cdRestOnly(x.s); }).length;
    var html = '<div class="cd-figs"><div><b>' + Object.keys(days).length + '</b><span>days</span></div><div><b>' + (avg ? avg + 'm' : '—') + '</b><span>avg length</span></div><div><b>' + wk + '</b><span>this week</span></div></div>';
    /* Twelve weeks, the one in progress last and in the ink. */
    var cols = [], top = 1;
    for (var w = 11; w >= 0; w--) {
      var a = cdAddDays(ws, -7 * w), b = cdAddDays(a, 7);
      var n = all.filter(function (x) { return x.d >= a && x.d < b && !cdRestOnly(x.s); }).length;
      cols.push(n); top = Math.max(top, n);
    }
    html += '<p class="cd-lbl">Sessions a week</p><div class="cd-weeks" role="img" aria-label="Sessions per week for twelve weeks: ' + cols.join(', ') + '">'
      + cols.map(function (n, i) { return '<i class="' + (n ? '' : 'is-zero') + (i === 11 ? ' is-this' : '') + '" style="height:' + Math.max(4, n / top * 100) + '%"></i>'; }).join('')
      + '</div><div class="cd-wax"><span>12 weeks ago</span><span>This week</span></div>';
    var by = {};
    m30.forEach(function (x) {
      var nm = cdSessName(x.s);
      var r = by[nm] = by[nm] || { n: 0, m: 0, mc: 0, g: LIFTN[x.s.k[0]].g, e: {} };
      r.n++; if (x.s.m) { r.m += x.s.m; r.mc++; } if (x.s.e) r.e[x.s.e] = (r.e[x.s.e] || 0) + 1;
    });
    var kinds = Object.keys(by).sort(function (a, b) { return by[b].n - by[a].n; });
    if (kinds.length) {
      var mx = by[kinds[0]].n;
      html += '<p class="cd-lbl">What, this month</p><ul class="cd-kinds">' + kinds.map(function (k) {
        var r = by[k], ef = Object.keys(r.e).sort(function (a, b) { return r.e[b] - r.e[a]; })[0];
        return '<li style="--kc:var(--k-' + r.g + ')"><b>' + esc(k) + '</b><span>' + r.n + '×' + (r.mc ? ' · ' + Math.round(r.m / r.mc) + 'm' : '') + (ef ? ' · ' + ef : '') + '</span><em><i style="width:' + (r.n / mx * 100) + '%"></i></em></li>';
      }).join('') + '</ul>';
    }
    html += '<p class="cd-lbl">Recent</p><ul class="cd-recent">' + all.slice(0, 8).map(function (x) {
      var d = cdDate(x.d);
      return '<li><time>' + DOW[cdDow(x.d)] + ' ' + d.getDate() + '</time><b>' + esc(cdSessName(x.s)) + '</b><span>' + (x.s.m ? x.s.m + 'm' : '') + (x.s.e ? ' · ' + x.s.e : '') + '</span></li>';
    }).join('') + '</ul>';
    box.innerHTML = html;
  }

  /* ═══ SETTINGS ═══ */
  $('cdGear').addEventListener('click', function () {
    var root = el('div');
    root.appendChild(el('p', 'cd-lbl', 'Backup'));
    /* Every key this app keeps, not one of them: a record with no export
       is the kind of gap you only discover once. */
    var cp = el('button', 'cd-btn', 'Copy a backup'); cp.type = 'button'; cp.id = 'cdBak';
    cp.addEventListener('click', function () {
      var txt = JSON.stringify(cdBackup());
      var done = function () { cdToast('Backup copied'); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, function () { ta.value = txt; ta.select(); });
      else { ta.value = txt; ta.select(); }
    });
    root.appendChild(cp);
    var ta = el('textarea', 'cd-field'); ta.id = 'cdRestore'; ta.placeholder = 'Paste a backup here to restore it';
    ta.setAttribute('aria-label', 'Backup to restore');
    ta.style.marginTop = '12px';
    root.appendChild(ta);
    root.appendChild(el('p', 'cd-note', 'Restoring replaces everything on this phone with what you paste.'));
    var foot = el('div', 'cd-foot');
    var rs = el('button', 'cd-btn', 'Restore'); rs.type = 'button'; rs.id = 'cdRestoreGo';
    rs.addEventListener('click', function () {
      var o; try { o = JSON.parse(ta.value); } catch (e) { cdToast('That is not a backup.'); return; }
      if (!isObj(o) || o.app !== 'cadence') { cdToast('That is not a Cadence backup.'); return; }
      Object.keys(K).forEach(function (k) { if (o[k] !== undefined) cdWrite(K[k], o[k]); });
      location.reload();
    });
    foot.appendChild(rs); root.appendChild(foot);
    cdSheet('Settings', root);
  });
  function cdBackup() {
    var o = { app: 'cadence', at: new Date().toISOString() };
    Object.keys(K).forEach(function (k) { o[k] = S[k]; });
    return o;
  }

  /* ═══ TOAST ═══ */
  var toastT = 0, toastUndo = null;
  function cdToast(msg, undo) {
    $('cdToastT').textContent = msg;
    toastUndo = undo || null;
    $('cdToastU').hidden = !undo;
    $('cdToast').hidden = false;
    clearTimeout(toastT);
    toastT = setTimeout(function () { $('cdToast').hidden = true; toastUndo = null; }, undo ? 5000 : 2200);
  }
  $('cdToastU').addEventListener('click', function () { var f = toastUndo; $('cdToast').hidden = true; toastUndo = null; if (f) f(); });

  /* ═══ WIRING ═══ */
  document.querySelectorAll('.cd-tab').forEach(function (t) { t.addEventListener('click', function () { cdGo(t.dataset.v); }); });
  $('cdAdd').addEventListener('click', function () { cdEdit(null); });

  /* The clock moves the hand, the middle of the dial and the row that is
     running; nothing animates, it steps on the half minute. A day that has
     rolled over moves too. */
  var lastDay = cdToday();
  setInterval(function () {
    var t = cdToday();
    if (t !== lastDay) { if (sel === lastDay) sel = t; lastDay = t; }
    if (!cdSheetOpen()) cdPaint();
  }, 30000);

  var sv = 'day';
  try { sv = sessionStorage.getItem('cad.view') || 'day'; } catch (e) {}
  cdGo(['day', 'hab', 'mon', 'lift'].indexOf(sv) >= 0 ? sv : 'day');

  /* Exposed for the test suite only: the parser and the keyword table are
     the pieces worth asserting as functions rather than through the page. */
  window.cadence = { parse: cdParse, kind: cdKind };
})();
</script>
</body>
</html>
