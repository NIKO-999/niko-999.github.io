    });
    sync();

    var foot = el('div', 'cd-foot');
    if (b) {
      var del = el('button', 'cd-btn warn', 'Delete'); del.type = 'button'; del.id = 'cdFDel';
      del.addEventListener('click', function () {
        var at = S.week.indexOf(b);
        S.week.splice(at, 1); cdSave('week'); cdClose(); cdPaint();
        cdToast('Deleted ' + b.n, function () { S.week.splice(at, 0, b); cdSave('week'); cdPaint(); });
      });
      foot.appendChild(del);
    }
    var save = el('button', 'cd-btn go', b ? 'Save' : 'Add'); save.type = 'button'; save.id = 'cdFSave';
    save.addEventListener('click', function () {
      if (!f.n.trim()) { cdToast('Give it a name.'); nm.focus(); return; }
      if (!f.d.length) { cdToast('Pick at least one day.'); return; }
      if (f.s + f.len > 1440) { cdToast('It has to finish by midnight.'); return; }
      var nb = cdBlock({ id: b ? b.id : null, n: f.n.trim(), d: f.d, s: f.s, e: f.s + f.len, p: f.p.trim() });
      if (b) S.week[S.week.indexOf(b)] = nb; else S.week.push(nb);
      cdSave('week'); cdClose();
      if (!b && nb.d.indexOf(cdDow(sel)) < 0) {
        /* Land on the day it went on, or it looks like nothing happened. */
        var t = cdToday(), ws = cdWeekStart(t);
        sel = cdAddDays(ws, nb.d[0]);
      }
      if (view !== 'day') cdGo('day'); else cdPaint();
      cdToast((b ? 'Saved ' : 'Added ') + nb.n);
    });
    foot.appendChild(save);
    root.appendChild(foot);
    cdSheet(b ? b.n : 'New block', root);
    var sayEl = root.querySelector('.cd-say');
    if (sayEl) setTimeout(function () { sayEl.focus(); }, 60);
  }

  /* ═══ WHAT YOU TRAINED ═══ */
  function cdLiftSheet(iso, key, label) {
    var cur = (S.train[iso] && cdSess(S.train[iso][key])) || { k: [], e: '', m: 0 };
    var pick = cur.k.slice(), eff = cur.e, min = cur.m;
    var root = el('div');
    var boards = el('div');
    LIFT.forEach(function (g) {
      var box = el('div', 'cd-grp'); box.style.setProperty('--kc', 'var(--k-' + g.g + ')');
      box.appendChild(el('h3', '', g.n));
      var cs = el('div', 'cd-chips');
      g.items.forEach(function (it) {
        var k = g.g + '.' + it[0];
        var c = el('button', 'cd-chip kc', it[1]); c.type = 'button'; c.dataset.k = k;
        c.style.setProperty('--kc', 'var(--k-' + g.g + ')');
        c.addEventListener('click', function () {
          var at = pick.indexOf(k);
          if (at >= 0) pick.splice(at, 1);
          /* You cannot half-rest: Rest clears the rest, and anything else clears Rest. */
          else if (g.g === 'rest') pick = [k];
          else { pick = pick.filter(function (x) { return LIFTN[x].g !== 'rest'; }); pick.push(k); }
          draw();
        });
        cs.appendChild(c);
      });
      box.appendChild(cs); boards.appendChild(box);
    });
    root.appendChild(boards);
    var more = el('div');
    more.appendChild(el('p', 'cd-lbl', 'How hard'));
    var ef = el('div', 'cd-chips');
    EFFORT.forEach(function (w) {
      var c = el('button', 'cd-chip', w); c.type = 'button'; c.dataset.e = w;
      c.addEventListener('click', function () { eff = eff === w ? '' : w; draw(); });
      ef.appendChild(c);
    });
    more.appendChild(ef);
    more.appendChild(el('p', 'cd-lbl', 'How long'));
    var mn = el('div', 'cd-chips ladder');
    MINS.forEach(function (x) {
      var c = el('button', 'cd-chip', x + 'm'); c.type = 'button'; c.dataset.m = x;
      c.addEventListener('click', function () { min = min === x ? 0 : x; draw(); });
      mn.appendChild(c);
    });
    more.appendChild(mn);
    root.appendChild(more);
    var foot = el('div', 'cd-foot');
    var skip = el('button', 'cd-btn', cur.k.length ? 'Take it off' : 'Not now'); skip.type = 'button';
    skip.addEventListener('click', function () {
      if (cur.k.length && S.train[iso]) { delete S.train[iso][key]; if (!Object.keys(S.train[iso]).length) delete S.train[iso]; cdSave('train'); }
      cdClose(); cdPaint();
    });
    var go = el('button', 'cd-btn go', 'Log'); go.type = 'button'; go.id = 'cdLiftGo';
    go.addEventListener('click', function () {
      if (!pick.length) return;
      var rest = pick.every(function (k) { return LIFTN[k].g === 'rest'; });
      (S.train[iso] = S.train[iso] || {})[key] = rest ? { k: pick } : { k: pick, e: eff, m: min };
      cdSave('train');
      if (key !== DAYKEY && !cdDone(iso, key)) cdSetFlag('log', iso, key, true);
      cdClose(); cdPaint();
      cdToast('Logged ' + pick.map(function (k) { return LIFTN[k].n; }).join(' + '));
    });
    foot.appendChild(skip); foot.appendChild(go);
    root.appendChild(foot);
    function draw() {
      root.querySelectorAll('[data-k]').forEach(function (c) { c.setAttribute('aria-pressed', pick.indexOf(c.dataset.k) >= 0); });
      root.querySelectorAll('[data-e]').forEach(function (c) { c.setAttribute('aria-pressed', c.dataset.e === eff); });
      root.querySelectorAll('[data-m]').forEach(function (c) { c.setAttribute('aria-pressed', +c.dataset.m === min); });
      var rest = pick.length && pick.every(function (k) { return LIFTN[k].g === 'rest'; });
      /* A rest day is not asked how hard or how long: absent, not disabled. */
      more.hidden = !!rest;
      go.disabled = !pick.length;
      go.textContent = pick.length ? 'Log ' + pick.map(function (k) { return LIFTN[k].n; }).join(' + ') : 'Pick a session';
    }
    draw();
    cdSheet('What did you train?', root);
    $('cdShT').title = label || '';
  }

  /* ═══ HABITS VIEW ═══
     The figure is how many of today's habits are kept, and under it a dot
     a habit, lit in its own colour. Every habit is then a hairline row:
     its dot logs it, the rest opens its record, and under the name is a
     fortnight of dots with today last. Colour says WHICH habit, never
     whether. */
  function cdPaintHab() {
    var today = cdToday(), hs = cdHabits();
    var kept = hs.filter(function (h) { return cdHabOn(today, h); });
    $('cdHabT').textContent = kept.length + ' of ' + hs.length;
    $('cdHabCap').textContent = 'habits completed';
    $('cdHabDots').innerHTML = hs.map(function (h) {
      return '<i class="' + (cdHabOn(today, h) ? 'is-on' : '') + '" style="--hc:var(' + h.hc + ')"></i>';
    }).join('');
    $('cdHabDots').setAttribute('aria-label', kept.length + ' of ' + hs.length + ' habits completed today');
    var ds = [];
    for (var j = 13; j >= 0; j--) ds.push(cdAddDays(today, -j));
    var html = '';
    hs.forEach(function (h) {
      var v = cdHabVal(today, h), on = cdHabOn(today, h);
      var sub, val;
      if (h.k === 'tick') {
        var by = cdKeptBy(today, h), st = cdStreak(h);
        /* Just the word: what kept it is the day's business, and the row
           already said which block that was. */
        sub = by && by !== 'you' ? 'Complete' : (st > 1 ? st + '-day streak' : on ? 'Complete' : 'Not yet');
        val = on ? '<span class="cd-hr-v">Completed</span>' : '<span class="cd-hr-v is-nil">—</span>';
      } else {
        var wk = 0, n = 0;
        for (var i = 1; i <= 7; i++) { var x = +cdHabVal(cdAddDays(today, -i), h); if (x > 0) { wk += x; n++; } }
        sub = n ? '7-day avg ' + cdFmtNum(wk / n, h) : 'Not yet';
        val = on ? '<span class="cd-hr-v">' + cdFmtNum(v, h) + '<small>' + esc(h.unit) + '</small></span>' : '<span class="cd-hr-v is-nil">—</span>';
      }
      var fn = ds.map(function (d) { return '<i' + (cdHabOn(d, h) ? ' class="is-on"' : '') + '></i>'; }).join('');
      /* The whole row logs; holding it opens the record. The dot and the
         name are two siblings, never one inside the other, and the
         record has its own button for a keyboard. */
      html += '<li class="cd-hr' + (on ? ' is-on' : '') + '" data-h="' + h.id + '" style="--hc:var(' + h.hc + ')">'
        + '<button type="button" class="cd-hr-b" data-act="log" aria-pressed="' + on + '" aria-label="' + esc(h.n) + ', ' + (on ? 'completed' : 'not yet') + '. Log"><i></i></button>'
        + '<button type="button" class="cd-hr-n" data-act="log" aria-label="' + esc(h.n) + ', ' + (on ? 'completed' : 'not yet') + '. Log. Hold for history">'
        + '<span class="cd-hr-t">' + esc(h.n) + '</span>' + val
        + '<span class="cd-hr-s"><span class="cd-fn" aria-hidden="true">' + fn + '</span><span>' + sub + '</span></span></button>'
        + '<button type="button" class="cd-hr-h" data-act="hist" aria-label="' + esc(h.n) + ' history">' + '···' + '</button></li>';
    });
    $('cdHab').innerHTML = html;
  }
  /* A hold is 500ms and cancels on any movement over 10px, or every
     scroll that starts on a row would open a record. The click that ends
     a hold is swallowed by a flag, never by reading the timer. */
  var hold = null, held = false, hx = 0, hy = 0;
  function cdHoldEnd() { if (hold) { clearTimeout(hold); hold = null; } }
  $('cdHab').addEventListener('pointerdown', function (ev) {
    var row = ev.target.closest('.cd-hr'); if (!row) return;
    held = false; hx = ev.clientX; hy = ev.clientY; cdHoldEnd();
    hold = setTimeout(function () {
      hold = null; held = true;
      /* The click that ends a hold may land on the sheet rather than the
         row, and then nothing would clear the flag and the NEXT tap on a
         habit would be eaten. It lasts only until this press is over. */
      document.addEventListener('pointerup', function up() {
        document.removeEventListener('pointerup', up);
        setTimeout(function () { held = false; }, 0);
      });
      var h = cdHabits().filter(function (x) { return x.id === row.dataset.h; })[0];
      if (h) cdHabHist(h);
    }, 500);
  });
  $('cdHab').addEventListener('pointermove', function (ev) {
    if (hold && (Math.abs(ev.clientX - hx) > 10 || Math.abs(ev.clientY - hy) > 10)) cdHoldEnd();
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (t) { $('cdHab').addEventListener(t, cdHoldEnd); });
  $('cdHab').addEventListener('contextmenu', function (ev) { if (ev.target.closest('.cd-hr')) ev.preventDefault(); });
  $('cdHab').addEventListener('click', function (ev) {
    if (held) { held = false; ev.preventDefault(); return; }
    var btn = ev.target.closest('[data-act]'); if (!btn) return;
    var h = cdHabits().filter(function (x) { return x.id === btn.closest('.cd-hr').dataset.h; })[0];
    if (!h) return;
    if (btn.dataset.act === 'hist') { cdHabHist(h); return; }
    var today = cdToday();
    if (h.id === 'train') {
      var tb = cdOn(today).filter(function (b) { return TRAINING[cdKind(b.n)]; });
      var free = tb.filter(function (b) { return !(S.train[today] && S.train[today][b.id]); })[0];
      cdLiftSheet(today, free ? free.id : tb.length ? tb[0].id : DAYKEY, 'Train');
      return;
    }
    if (h.k === 'tick') {
      var by = cdKeptBy(today, h);
      if (by && by !== 'you') { cdToast('Completed by ' + by + ' — untick it on the day.'); return; }
      var m = S.hab[today] = S.hab[today] || {};
      if (m[h.id]) delete m[h.id]; else m[h.id] = 1;
      if (!Object.keys(m).length) delete S.hab[today];
      cdSave('hab'); cdPaintHab();
      return;
    }
    cdNumSheet(h, today);
  });

  function cdNumSheet(h, iso) {
    var v = +cdHabVal(iso, h) || 0;
    var root = el('div');
    var big = el('p', 'cd-num'); big.id = 'cdNumV';
    var cap = el('p', 'cd-numcap', 'today');
    var max = h.max;
    if (h.mine) { var best = 0; Object.keys(S.hab).forEach(function (d) { best = Math.max(best, +S.hab[d][h.id] || 0); }); max = best ? Math.ceil(best * 1.5) : 100; }
    var rg = el('input', 'cd-range'); rg.type = 'range'; rg.min = 0; rg.max = max; rg.step = h.step; rg.value = v; rg.id = 'cdNumR';
    rg.setAttribute('aria-label', h.n);
    root.appendChild(big); root.appendChild(cap); root.appendChild(rg);
    var marks = el('div', 'cd-chips');
    (h.marks || []).forEach(function (x) {
      var c = el('button', 'cd-chip', cdFmtNum(x, h)); c.type = 'button';
      c.addEventListener('click', function () { v = x; paint(); });
      marks.appendChild(c);
    });
    (h.bump || []).forEach(function (x) {
      var c = el('button', 'cd-chip', '+' + cdFmtNum(x, h)); c.type = 'button';
      c.addEventListener('click', function () { v = Math.min(max, +(v + x).toFixed(2)); paint(); });
      marks.appendChild(c);
    });
    if (marks.children.length) root.appendChild(marks);
    function paint() { rg.value = v; big.innerHTML = cdFmtNum(v, h) + '<small>' + esc(h.unit) + '</small>'; }
    rg.addEventListener('input', function () { v = +rg.value; paint(); });
    paint();
    var foot = el('div', 'cd-foot');
    var clr = el('button', 'cd-btn', +cdHabVal(iso, h) > 0 ? 'Clear' : 'Cancel'); clr.type = 'button';
    clr.addEventListener('click', function () { set(0); });
    var go = el('button', 'cd-btn go', 'Save'); go.type = 'button'; go.id = 'cdNumGo';
    go.addEventListener('click', function () { set(v); });
    function set(x) {
      var m = S.hab[iso] = S.hab[iso] || {};
      if (x > 0) m[h.id] = +(+x).toFixed(2); else delete m[h.id];
      if (!Object.keys(m).length) delete S.hab[iso];
      cdSave('hab'); cdClose(); cdPaint();
    }
    foot.appendChild(clr); foot.appendChild(go);
    root.appendChild(foot);
    cdSheet(h.n, root);
  }

  function cdHabHist(h) {
    var today = cdToday(), root = el('div');
    var n30 = 0, n90 = 0;
    for (var i = 0; i < 90; i++) { if (cdHabOn(cdAddDays(today, -i), h)) { n90++; if (i < 30) n30++; } }
    root.appendChild(el('div', 'cd-figs', '<div><b>' + n30 + '</b><span>of 30 days</span></div><div><b>' + n90 + '</b><span>of 90 days</span></div><div><b>' + (h.k === 'tick' ? cdStreak(h) : '—') + '</b><span>streak</span></div>'));
    var ul = el('ul', 'cd-day-l');

    root.appendChild(el('p', 'cd-note', 'Turning it off here keeps everything on this device. Deleting the synced copy removes it from the server for every device, and cannot be undone; each device keeps what it has.'));
    var foot = el('div', 'cd-foot');
    var here = el('button', 'cd-btn', 'Just this device'); here.type = 'button'; here.id = 'cdSyncOffHere';
    here.addEventListener('click', function () { SY = null; syKeys = null; cdSyncStore(); cdClose(); cdToast('Sync is off on this device'); });
    var del = el('button', 'cd-btn warn', 'Delete synced copy'); del.type = 'button'; del.id = 'cdSyncOffAll';
    del.addEventListener('click', function () {
      del.disabled = true;
      cdSyncDerive(SY.code).then(function (k) { return cdSyncFetch(k, 'DELETE'); }).then(function (r) {
        if (r.status !== 200) throw new Error(r.status);
        SY = null; syKeys = null; cdSyncStore(); cdClose(); cdToast('Synced copy deleted');
      }).catch(function () { del.disabled = false; cdToast('Could not reach the sync server'); });
    });
    foot.appendChild(here); foot.appendChild(del); root.appendChild(foot);
    cdSheet('Turn off sync?', root);
  }

  /* ═══ THE DAY'S THOUGHT ═══
     One a day, the same all day and a new one tomorrow: a question to sit
     with or a piece of advice to carry. It comes up the first time the app
     is opened on a date and never again that day — a card on every open
     stops being a thought and becomes a door you have to get past. Worked
     out from the DATE rather than stored, so there is nothing to keep in
     step, and walked in order so no two days in a row share one. The two
     kinds are interleaved in the list, so the days alternate. */
  var REFLECT = [
    ['Reflect', 'What would your higher self do today?'],
    ['Advice', 'Anchor your morning. The first hour sets the tone for the rest of the day.'],
    ['Reflect', 'What is one thing you are avoiding, and why?'],
    ['Advice', 'Do the hardest thing first, before the day gets a vote.'],
    ['Reflect', 'What would make today a good day, even if nothing else went right?'],
    ['Advice', 'Leave your phone alone for the first thirty minutes you are awake.'],
    ['Reflect', 'If today was repeated for a year, where would you end up?'],
    ['Advice', 'Make your bed. Start the day with one thing already finished.'],
    ['Reflect', 'What story are you telling yourself that might not be true?'],
    ['Advice', 'Get outside and see daylight before you see a screen.'],
    ['Reflect', 'Who do you want to be by the end of this week?'],
    ['Advice', 'Drink a glass of water before your first coffee.'],
    ['Reflect', 'What would you do today if you were not afraid of looking foolish?'],
    ['Advice', 'Plan tomorrow tonight, so the morning is for doing rather than deciding.'],
    ['Reflect', 'What are you proud of that nobody else saw?'],
    ['Advice', 'Move your body before noon, even for ten minutes.'],
    ['Reflect', 'Where are you choosing comfort over growth right now?'],
    ['Advice', 'Pick one thing that matters today. Everything else is extra.'],
    ['Reflect', 'What would you tell a friend who was in your situation?'],
    ['Advice', 'Keep a small promise to yourself early. Momentum is built, not found.'],
    ['Reflect', 'What is worth letting go of today?'],
    ['Advice', 'Protect your sleep. Tomorrow\u2019s discipline is decided tonight.'],
    ['Reflect', 'What habit is quietly shaping your life the most?'],
    ['Advice', 'Breathe slowly for one minute before you start. Calm is a skill.'],
    ['Reflect', 'What fear is running the show, and what would you do without it?'],
    ['Advice', 'Start before you feel ready. Motivation follows action.'],
    ['Reflect', 'What does future you need you to start today?'],
    ['Advice', 'Write down three things you are grateful for before the day begins.'],
    ['Reflect', 'What are you tolerating that you should not be?'],
    ['Advice', 'Say no to one thing today so you can say yes to what matters.'],
    ['Reflect', 'When did you last feel fully present, and what were you doing?'],
    ['Advice', 'Eat a real breakfast. Fuel the day you are asking of yourself.'],
    ['Reflect', 'Which of your values did you live out yesterday?'],
    ['Advice', 'Keep the first thing you do the same every morning. Rituals remove friction.'],
    ['Reflect', 'What win, however small, can you celebrate from yesterday?'],
    ['Advice', 'Be patient with yourself. Consistency beats intensity.']
  ];
  function cdReflQ(iso) {
    var n = REFLECT.length, i = cdDiff(iso, '2026-01-01');
    return REFLECT[((i % n) + n) % n];
  }
  /* Built and removed, never hidden: a full-screen surface put away with
     the `hidden` attribute has taken presses meant for the app behind it
     in this repo more than once. Seen the moment it is shown, so closing
     it is the whole of the answer. */
  function cdReflClose() { var r = $('cdRf'); if (r) r.remove(); }
  function cdReflect(iso) {
    var rec = S.refl[iso] || {};
    if (!rec.s) { rec.s = 1; S.refl[iso] = rec; cdSave('refl'); }
    cdReflClose();
    var q = cdReflQ(iso);
    var box = el('div');
    box.innerHTML = '<div class="cd-rf" id="cdRf" role="dialog" aria-modal="true" aria-labelledby="cdReflQ"><div class="cd-rf-c">'
      + '<p class="cd-rf-k">' + (q[0] === 'Advice' ? 'Today\u2019s advice' : 'Today\u2019s reflection') + '</p>'
      + '<p class="cd-rq" id="cdReflQ">' + esc(q[1]) + '</p>'
      + '<button type="button" class="cd-rf-go" id="cdReflOk" aria-label="Continue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div></div>';
    var wrap = box.firstChild;
    document.body.appendChild(wrap);
    $('cdReflOk').addEventListener('click', cdReflClose);
    wrap.addEventListener('click', function (ev) { if (ev.target === wrap) cdReflClose(); });
    /* Not focused on arrival: a programmatic focus on a page nobody has
       touched draws the keyboard ring round the arrow, a second outline on a
       card whose whole job is one line of words. Escape still closes it. */
  }
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && $('cdRf')) { ev.preventDefault(); ev.stopImmediatePropagation(); cdReflClose(); } }, true);

  /* ═══ TOAST ═══ */
  var toastT = 0, toastUndo = null;
  function cdToast(msg, undo) {
    $('cdToastT').textContent = msg;
    toastUndo = undo || null;
    $('cdToastU').hidden = !undo;
    $('cdToast').classList.toggle('is-bare', !undo);
    $('cdToast').hidden = false;
    clearTimeout(toastT);
    toastT = setTimeout(function () { $('cdToast').hidden = true; toastUndo = null; }, undo ? 5000 : 2200);
  }
  $('cdToastU').addEventListener('click', function () { var f = toastUndo; $('cdToast').hidden = true; toastUndo = null; if (f) f(); });

  /* ═══ WIRING ═══ */
  document.querySelectorAll('.cd-tab').forEach(function (t) { t.addEventListener('click', function () { cdGo(t.dataset.v); }); });
  /* The plus makes the thing the screen is about: a whole page on Notes,
     a block everywhere else. The line at the top of the list is for a
     sentence; a note with headings and pictures in it wants the page from
     the start, and it is only kept once something is written on it. */
  $('cdAdd').addEventListener('click', function () {
    if (view === 'note') { cdNoteNew(); return; }
    cdEdit(null);
  });

  /* THE SKY'S FOUR PHASES, top to foot at 0 / 18 / 44 / 70 / 88 / 100%.
     Each stop is no lighter than the fixed sky's stop at the same height
     (#03060A to #2A4050), which is what the label contrast was measured
     against: a quiet label clears 4.9:1 at the foot in every phase. The
     day is the one that is lightest at the TOP, because a day sky is. */
  var SKY = {
    night: { s: ['#010309', '#030817', '#06112E', '#0A1A44', '#0D2152', '#10275E'], g: [40, 70, 150, .18], st: 1 },
    dawn:  { s: ['#070D22', '#121A3B', '#262A50', '#3A304C', '#46344A', '#4C3746'], g: [150, 96, 120, .22], st: .3 },
    day:   { s: ['#0A2446', '#0E2C57', '#133465', '#16386A', '#18396A', '#1A3A69'], g: [60, 100, 160, .18], st: 0 },
    dusk:  { s: ['#050A1E', '#0F1535', '#211F48', '#342646', '#402A43', '#462D41'], g: [140, 80, 120, .22], st: .3 }
  };
  /* By the hour on this phone, with no location: the app knows nothing
     about where you are and is not going to ask for it to draw a sky. So
     the sun is an ordinary one — up by half seven, down by half eight —
     and each change takes an hour and a half, stepped on the half-minute
     pass, which at that rate is invisible. */
  var SKY_AT = [[0, 'night'], [4.75, 'night'], [6, 'dawn'], [7.5, 'day'], [17.5, 'day'], [19, 'dusk'], [20.5, 'night'], [24, 'night']];
  var SKY_STOPS = [0, 18, 44, 70, 88, 100];
  function cdHexRGB(h) { return [1, 3, 5].map(function (i) { return parseInt(h.slice(i, i + 2), 16); }); }
  function cdSkyAt(h) {
    for (var i = 1; i < SKY_AT.length; i++) if (h <= SKY_AT[i][0]) break;
    var a = SKY_AT[i - 1], b = SKY_AT[i], t = (h - a[0]) / (b[0] - a[0]);
    var A = SKY[a[1]], B = SKY[b[1]], lerp = function (x, y) { return x + (y - x) * t; };
    return {
      name: t < .5 ? a[1] : b[1],
      s: A.s.map(function (c, k) {
        var p = cdHexRGB(c), q = cdHexRGB(B.s[k]);
        return 'rgb(' + p.map(function (v, j) { return Math.round(lerp(v, q[j])); }).join(', ') + ')';
      }),
      g: A.g.map(function (v, j) { return j < 3 ? Math.round(lerp(v, B.g[j])) : +lerp(v, B.g[j]).toFixed(3); }),
      st: +lerp(A.st, B.st).toFixed(3)
    };
  }
  function cdSky() {
    var d = new Date(), k = cdSkyAt(d.getHours() + d.getMinutes() / 60), root = document.documentElement;
    root.style.setProperty('--sky', 'radial-gradient(90% 45% at 50% 34%, rgba(' + k.g.join(', ') + '), transparent 70%), linear-gradient(180deg, ' +
      k.s.map(function (c, i) { return c + ' ' + SKY_STOPS[i] + '%'; }).join(', ') + ')');
    root.style.setProperty('--stars', k.st);
    root.style.setProperty('--sky-foot', k.s[k.s.length - 1]);
    root.setAttribute('data-sky', k.name);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', k.s[0]);
  }
  /* Built once, from a fixed seed, so the same stars are in the same
     places every night rather than a new sky on every open. */
  function cdStarsBuild() {
    var seed = 20260925, rnd = function () { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; };
    var out = [];
    for (var i = 0; i < 90; i++) {
      var y = Math.pow(rnd(), 1.4) * 50, x = rnd() * 100, r = .3 + rnd() * .6, o = .3 + rnd() * .5;
      var tw = i % 7 === 0 ? ' class="tw" style="animation-delay:-' + (rnd() * 4).toFixed(2) + 's"' : '';
      out.push('<circle cx="' + x.toFixed(2) + '%" cy="' + y.toFixed(2) + '%" r="' + r.toFixed(2) + '" opacity="' + o.toFixed(2) + '"' + tw + '/>');
    }
    /* Percentages rather than a stretched viewBox, or every star is an
       ellipse the shape of the phone. */
    $('cdStars').innerHTML = '<svg fill="#F3F5F7">' + out.join('') + '</svg>';
  }

  /* The clock moves the block you are in, what is left of it and the line
     under it; nothing animates, it steps on the half minute. A day that
     has rolled over moves too. */
  var lastDay = cdToday();
  cdStarsBuild();
  cdSky();
  setInterval(function () {
    cdSky();
    var t = cdToday();
    if (t !== lastDay) { if (sel === lastDay) sel = t; lastDay = t; }
    if (!cdSheetOpen()) cdPaint();
  }, 30000);

  /* ═══ REMINDERS ═══
     iOS lets a web page show a notification and never lets it schedule
     one, so a reminder has to be SENT, at the minute, by a server. The
     worker that already holds the sync vault does it, and it is handed
     the least that can work: the times the next fourteen days of blocks
     start, and for each a message SEALED HERE with this phone's own push
     keys (RFC 8291). It carries the words without being able to read
     them, the vault's rule for the vault's reason. What it cannot help
     knowing is when.

     THE QUEUE IS FOURTEEN DAYS AND IT IS REFILLED WHENEVER YOU OPEN THE
     APP. A server holding the template could go on for ever, and it
     would then be holding the template, which is the half of the week
     this worker never sees. Fourteen days of times is the price, and a
     fortnight away from the app is the one way reminders stop.

     THIS PHONE'S OWN, NEVER SYNCED. `cad.push.v1` is not in K, so it is
     in neither the backup nor the vault: a subscription is an address
     for one device, and copying it to a second would send one phone's
     reminders to another's queue. */
  var PUSH_K = 'cad.push.v1', PUSH_DAYS = 14;
  var PU = (function () { var o; try { o = JSON.parse(localStorage.getItem(PUSH_K)); } catch (e) { o = null; } return o && /^[0-9a-f]{32}$/.test(o.id || '') && o.ep ? o : null; })();
  var puTm = 0, puBusy = null;
  function cdPushStore() { try { if (PU) localStorage.setItem(PUSH_K, JSON.stringify(PU)); else localStorage.removeItem(PUSH_K); } catch (e) {} }
  function cdPushCan() { return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
  function cdB64u(u8) { return cdSyncB64(new Uint8Array(u8)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
  function cdUnB64u(t) { t = t.replace(/-/g, '+').replace(/_/g, '/'); while (t.length % 4) t += '='; return cdSyncUnB64(t); }
  function cdCat() {
    var n = 0, i; for (i = 0; i < arguments.length; i++) n += arguments[i].length;
    var o = new Uint8Array(n), at = 0;
    for (i = 0; i < arguments.length; i++) { o.set(arguments[i], at); at += arguments[i].length; }
    return o;
  }
  function cdHkdf(salt, ikm, info, len) {
    return crypto.subtle.importKey('raw', ikm, 'HKDF', false, ['deriveBits'])
      .then(function (k) { return crypto.subtle.deriveBits({ name: 'HKDF', hash: 'SHA-256', salt: salt, info: info }, k, len * 8); })
      .then(function (b) { return new Uint8Array(b); });
  }
  /* RFC 8291, aes128gcm: a fresh key pair and salt per message, one
     record, and the whole body is the header and the ciphertext. The
     browser at the other end undoes it before the service worker sees
     it; nothing between here and there can. */
  function cdPushSeal(obj) {
    var te = new TextEncoder(), ua = cdUnB64u(PU.pk), auth = cdUnB64u(PU.au);
    var salt = crypto.getRandomValues(new Uint8Array(16)), asPub;
    return crypto.subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveBits']).then(function (kp) {
      return crypto.subtle.exportKey('raw', kp.publicKey).then(function (raw) {
        asPub = new Uint8Array(raw);
        return crypto.subtle.importKey('raw', ua, { name: 'ECDH', namedCurve: 'P-256' }, false, []);
      }).then(function (uaKey) { return crypto.subtle.deriveBits({ name: 'ECDH', public: uaKey }, kp.privateKey, 256); });
    }).then(function (ecdh) {
      return cdHkdf(auth, new Uint8Array(ecdh), cdCat(te.encode('WebPush: info\x00'), ua, asPub), 32);
    }).then(function (ikm) {
      return Promise.all([cdHkdf(salt, ikm, te.encode('Content-Encoding: aes128gcm\x00'), 16), cdHkdf(salt, ikm, te.encode('Content-Encoding: nonce\x00'), 12)]);
    }).then(function (kn) {
      return crypto.subtle.importKey('raw', kn[0], 'AES-GCM', false, ['encrypt']).then(function (k) {
        return crypto.subtle.encrypt({ name: 'AES-GCM', iv: kn[1] }, k, cdCat(te.encode(JSON.stringify(obj)), new Uint8Array([2])));
      });
    }).then(function (ct) {
      return cdB64u(cdCat(salt, new Uint8Array([0, 0, 16, 0, 65]), asPub, new Uint8Array(ct)));
    });
  }
  /* Every block start from now to fourteen days out. A moment says Now;
     a span says when it ends, the thing you plan against once it has
     begun; a place rides after. */
  function cdPushList() {
    var out = [], now = Date.now(), today = cdToday();
    for (var i = 0; i < PUSH_DAYS; i++) {
      var iso = cdAddDays(today, i), p = dparts(iso);
      cdOn(iso).forEach(function (b) {
        var t = new Date(p[0], p[1], p[2], 0, b.s).getTime();
        if (t <= now + 30e3) return;
        var body = b.e > b.s ? 'Now · until ' + cdHM(b.e) : 'Now';
        if (b.p) body += ' · ' + b.p;
        out.push({ t: t, m: { t: b.n, b: body, g: iso + '.' + b.id } });
      });
    }
    return out;
  }
  /* Sent when what it would send has changed, or on a new day, which
     keeps the queue two weeks deep. `force` is the turn-on. */
  function cdPushSend(force) {
    if (!PU) return Promise.resolve(false);
    var fp = cdToday() + JSON.stringify(S.week.map(function (b) { return [b.id, b.n, b.d, b.s, b.e, b.p]; }));
    if (!force && PU.fp === fp) return Promise.resolve(true);
    if (puBusy) return puBusy;
    var list = cdPushList();
    puBusy = Promise.all(list.map(function (x) { return cdPushSeal(x.m).then(function (b) { return { t: x.t, b: b }; }); }))
      .then(function (q) {
        return fetch(SYNC_URL + '/v1/push/' + PU.id, {
          method: 'PUT', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + PU.tok },
          body: JSON.stringify({ ep: PU.ep, q: q })
        });
      }).then(function (r) {
        if (!r.ok) return false;
        if (PU) { PU.fp = fp; cdPushStore(); }
        return true;
      }).catch(function () { return false; })
      .then(function (v) { puBusy = null; return v; });
    return puBusy;
  }
  function cdPushSoon() { if (!PU) return; clearTimeout(puTm); puTm = setTimeout(function () { cdPushSend(); }, 2000); }

  function cdPushToggle() {
    var t = el('button', 'cd-toggle', '<span>When a block starts</span><i></i>');
    t.type = 'button'; t.id = 'cdPushOn';
    t.setAttribute('aria-pressed', String(!!PU));
    t.addEventListener('click', function () {
      if (PU) { cdPushOff(); t.setAttribute('aria-pressed', 'false'); cdToast('Reminders off'); return; }
      if (!cdPushCan()) {
        cdToast(/iPhone|iPad/.test(navigator.userAgent) && !navigator.standalone
          ? 'Add Cadence to your Home Screen, then turn reminders on there.' : 'This browser cannot show reminders.');
        return;
      }
      cdPushConsent();
    });
    return t;
  }
  /* The moment something first leaves the phone for this, so it says
     what leaves in full, once, here. */
  function cdPushConsent() {
    var root = el('div');
    root.appendChild(el('p', 'cd-note', 'Reminders are sent by the sync server, so it gets the times your blocks start over the next two weeks. What each one says is locked on this phone first, and the server cannot read it. Opening the app keeps the next two weeks queued.'));
    var foot = el('div', 'cd-foot');
    var no = el('button', 'cd-btn soft', 'Not now'); no.type = 'button'; no.addEventListener('click', cdClose);
    var go = el('button', 'cd-btn go', 'Turn on'); go.type = 'button'; go.id = 'cdPushGo';
    /* Permission is asked FIRST inside the press: iOS answers a request
       for it only from a real gesture, and anything awaited before it
       spends the gesture. */
    go.addEventListener('click', function () {
      go.disabled = true;
      Promise.resolve(Notification.requestPermission()).then(function (perm) {
        if (perm !== 'granted') { cdClose(); cdToast('Notifications are off for Cadence in Settings.'); return; }
        return navigator.serviceWorker.register('sw.js').then(function () { return navigator.serviceWorker.ready; }).then(function (reg) {
          return fetch(SYNC_URL + '/v1/push/key').then(function (r) { return r.json(); }).then(function (k) {
            return reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: cdUnB64u(k.key) });
          });
        }).then(function (sub) {
          var hex = function () { return cdSyncHex(crypto.getRandomValues(new Uint8Array(16))); };
          PU = { id: hex(), tok: hex(), ep: sub.endpoint, pk: cdB64u(new Uint8Array(sub.getKey('p256dh'))), au: cdB64u(new Uint8Array(sub.getKey('auth'))) };
          cdPushStore();
          return cdPushSend(true);
        }).then(function (sent) {
          cdClose();
          cdToast(sent ? 'Reminders on' : 'Reminders are on, but the server could not be reached. It will try again.');
        });
      }).catch(function () { cdClose(); cdToast('Reminders could not be turned on.'); });
    });
    foot.appendChild(no); foot.appendChild(go); root.appendChild(foot);
    cdSheet('Remind me when a block starts?', root);
  }
  /* Off takes the queue off the server and the subscription off the
     phone. Either can fail on its own and neither is worth keeping the
     other for. */
  function cdPushOff() {
    var was = PU; PU = null; cdPushStore(); clearTimeout(puTm);
    if (was) fetch(SYNC_URL + '/v1/push/' + was.id, { method: 'DELETE', headers: { Authorization: 'Bearer ' + was.tok } }).catch(function () {});
    if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistration().then(function (reg) {
      return reg && reg.pushManager.getSubscription().then(function (s) { return s && s.unsubscribe(); });
    }).catch(function () {});
  }

  /* Sync asks the other device's copy once the screen is up, whenever
     the app comes back to the front, and once a minute while it is
     looked at — never on a render. */
  if (SY) setTimeout(cdSyncPull, 0);
  document.addEventListener('visibilitychange', function () {
    if (!SY) return;
    if (document.visibilityState === 'visible') cdSyncPull();
    else if (SY.dirty) cdSyncPush(true);
  });
  setInterval(function () { if (SY && document.visibilityState === 'visible') cdSyncPull(); }, 60000);
  /* Reminders refill their fortnight on open and on coming back. */
  if (PU) setTimeout(function () { cdPushSend(); }, 1500);
  document.addEventListener('visibilitychange', function () { if (PU && document.visibilityState === 'visible') cdPushSend(); });

  var sv = 'day';
  try { sv = sessionStorage.getItem('cad.view') || 'day'; } catch (e) {}
  cdGo(['day', 'hab', 'mon', 'note'].indexOf(sv) >= 0 ? sv : 'day');
  /* The first open of a date shows its thought, after the screen has
     painted so the card comes up over the day rather than over nothing. */
  var rt = cdToday();
  if (!S.rfoff && !(S.refl[rt] && S.refl[rt].s)) setTimeout(function () { if (!cdSheetOpen()) cdReflect(rt); }, 450);

  /* Exposed for the test suite only: the parser and the keyword table are
     the pieces worth asserting as functions rather than through the page. */
  window.cadence = { parse: cdParse, reflect: function (iso) { return cdReflQ(iso)[1]; }, kind: cdKind, questions: REFLECT.length };
})();
</script>
</body>
</html>
