<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- maximum-scale=1: iOS zooms the page when a field under 16px takes
     focus. Every field here is 16px, and the cap covers the next one. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#03060A" />
<meta name="description" content="The block you are in, and the rest of the day." />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Cadence" />
<title>Cadence</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="preload" href="../arc/fonts/Inter.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="fonts/GeistMono.woff2" as="font" type="font/woff2" crossorigin />
<style>
/* ═══════════════════════════════════════════════════════════════
   CADENCE — the block you are in.

   Six looks came out before this one. The dial was the fifth to be
   built and the first to be picked; it shipped, and the answer came
   back as a screenshot of a different mockup with four words: "I like
   this more". This is that mockup, made into the app.

   · THE DAY IS THE BLOCK YOU ARE IN. Its name is the biggest thing on
     the screen, with what is left of it, a thin line saying how far
     through you are, and the one after it underneath. Everything else
     on the day is a quiet list of hairlines below.
   · ONE WHITE CONTROL, AND IT TICKS THAT BLOCK. You never go looking
     for the row you are in: the screen already knows.
   · EVERY SCREEN IS A FIGURE AND DOTS. The week is seven dots, a habit
     is a fortnight of dots, the month is a dot a day, and training is
     thirty. A dot filled is a thing kept; hollow is a thing missed;
     faint is a day that makes no claim.
   · The alignment app's language rather than its pieces: the night sky,
     Inter in its light weights for the one figure a screen is about,
     Geist Mono in tracked capitals for every label, and hairlines where
     there would be cards.
   ═══════════════════════════════════════════════════════════════ */
@font-face { font-family: 'Inter'; font-weight: 100 900; font-display: swap;
  src: url('../arc/fonts/Inter.woff2') format('woff2'); }
@font-face { font-family: 'Geist Mono'; font-weight: 100 900; font-display: swap;
  src: url('fonts/GeistMono.woff2') format('woff2'); }

:root {
  color-scheme: dark;
  --bg: #03060A;
  --ink: #F3F5F7;
  --on: #07080B;
  --dim: rgba(243, 245, 247, .72);
  --quiet: rgba(243, 245, 247, .62);
  --faint: rgba(243, 245, 247, .42);
  --hair: rgba(243, 245, 247, .10);
  --lift: rgba(243, 245, 247, .07);
  --lift2: rgba(243, 245, 247, .13);
  --track: rgba(243, 245, 247, .14);
  /* A day that makes no claim: still to come, or before the record
     began. Drawn, so the week keeps its shape, and deliberately faint. */
  --nil: rgba(243, 245, 247, .18);
  /* Behind you and not kept. A graphic, so it is held to 3:1 against the
     sky beside it — and never a red: nothing here says you failed. */
  --miss: rgba(243, 245, 247, .40);
  --sheet: #0B1621;

  /* Which part of life a block is: the alignment app's four hues. */
  --c-body: #F2A184;
  --c-mind: #B7A5FF;
  --c-work: #E8C67C;
  --c-rest: #7DCFD8;
  --c-none: #A3ADB6;
  --k-weights: #F2A184;
  --k-run: #7DCFD8;
  --k-recovery: #B7A5FF;
  --k-rest: #A3ADB6;
  --h-water: #8FB8FF;
  --h-sleep: #E9A6D0;
  --bad: #FF9C8F;

  /* THE SKY. Near-black at the top, a slate night by the foot, and one
     soft lift behind the block you are in. It never carries colour:
     colour is what a block and a habit are for. The foot stops short of
     the mockup's horizon, because a list scrolls down there and a quiet
     label over #50636F measures 3.6:1. */
  --sky: radial-gradient(90% 45% at 50% 34%, rgba(64, 110, 132, .30), transparent 70%),
         linear-gradient(180deg, #03060A 0%, #07131D 18%, #122736 44%, #1B3140 70%, #22394A 88%, #2A4050 100%);

  --sans: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --gut: 22px;
}

*, *::before, *::after { box-sizing: border-box; }
/* Said once, for every element: an author `display` outranks the
   browser's own [hidden] rule, and that has broken a view, a toast and
   an overlay in this repo's other app. One line removes the class. */
[hidden] { display: none !important; }

html { -webkit-text-size-adjust: 100%; }
html, body { height: 100%; background-color: var(--bg); }
body {
  position: fixed; inset: 0; margin: 0; overflow: hidden; overscroll-behavior: none;
  background: var(--sky);
  color: var(--ink);
  font: 400 15px/1.4 var(--sans);
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
  /* A word longer than its line breaks rather than running out of its box.
     break-word, not anywhere: it only acts on a word that cannot fit, and
     it leaves a box's minimum width alone, so no layout moves for it. */
  overflow-wrap: break-word;
}
p, h1, h2, h3 { margin: 0; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; touch-action: manipulation; }
button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.cd-field:focus-visible { outline: 1px solid var(--ink); outline-offset: -1px; }
.cd-row .cd-field:focus-visible { outline: none; }

/* Every label in the app is the same voice: tracked mono capitals. */
.cd-cap, .cd-hcap, .cd-tcap, .cd-lbl, .cd-tab, .cd-wl, .cd-dows, .cd-mcap, .cd-legend {
  font: 500 10.5px/1 var(--mono); text-transform: uppercase;
}
.cd-cap, .cd-tcap, .cd-lbl { letter-spacing: .18em; color: var(--quiet); }

.cd-app { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100%; max-width: 560px; margin: 0 auto; }

/* THE SKY FOLLOWS THE CLOCK. `cdSky` writes --sky from the hour: a clear
   blue by day, a warm horizon at dawn and dusk, and at night near-black
   running down to a deep navy with stars over it. Every stop is held to
   the same depth the fixed sky had at the same height, so a label that
   clears its bar at noon clears it at midnight — the sky moves in HUE,
   never in how much light it gives the words on it. The value in :root
   is the first paint, before the script has read the clock.

   The stars are one layer behind the app, faded by --stars rather than
   built and removed, and only the top half of the sky carries them:
   a star under a row of the list would be a speck on a word. They are
   under two pixels across, where the smallest dot the app DRAWS is five
   — a star beside the week's row must never read as one more day. A
   few twinkle, and only while it is night — an animation on a layer at
   zero opacity is a compositor pass a frame for nothing. */
.cd-stars {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  opacity: var(--stars, 0);
  -webkit-mask-image: linear-gradient(180deg, #000 0, #000 32%, transparent 50%);
          mask-image: linear-gradient(180deg, #000 0, #000 32%, transparent 50%);
}
.cd-stars svg { display: block; width: 100%; height: 100%; }
.cd-stars .tw { animation: cdTw 4.2s ease-in-out infinite alternate; animation-play-state: paused; }
:root[data-sky="night"] .cd-stars .tw { animation-play-state: running; }
@keyframes cdTw { from { opacity: 1; } to { opacity: .25; } }

/* ── the top: settings, the four words, and add ── */
.cd-top { flex: none; display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; padding: calc(8px + env(safe-area-inset-top)) 12px 0; }
.cd-gear, .cd-plus { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; }
.cd-gear { color: var(--quiet); }
.cd-gear svg { width: 19px; height: 19px; display: block; }
/* Add is a glyph, the way settings is: the one drawn control on the day
   is the check at its foot, and a second round at the top would be a
   second answer to "what do I press". It is the ink where settings is
   quiet, because it is the one you reach for. */
.cd-plus { color: var(--ink); }
.cd-plus svg { width: 20px; height: 20px; display: block; }

.cd-nav { display: flex; justify-content: center; gap: 4px; }
.cd-tab { position: relative; min-width: 44px; min-height: 44px; padding: 0 8px; text-align: center; letter-spacing: .18em; color: var(--quiet); }
.cd-tab::after { content: ""; position: absolute; left: 50%; bottom: 5px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--ink); opacity: 0; }
.cd-tab[aria-current="page"] { color: var(--ink); }
.cd-tab[aria-current="page"]::after { opacity: 1; }

.cd-main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.cd-main > section { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.cd-pane {
  flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain;
  padding: 0 var(--gut) calc(30px + env(safe-area-inset-bottom)); scrollbar-width: none;
  -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 10px, #000 calc(100% - 28px), transparent 100%);
          mask-image: linear-gradient(180deg, transparent 0, #000 10px, #000 calc(100% - 28px), transparent 100%);
}
.cd-pane::-webkit-scrollbar { display: none; }
/* The day's pane clears the check that floats over its foot. */
#cdDayPane { padding-bottom: calc(118px + env(safe-area-inset-bottom)); }

/* ── the week: a dot over a letter, seven of them ── */
.cd-week { flex: none; display: grid; grid-template-columns: repeat(7, 44px); justify-content: center; margin: 8px 0 0; }
.cd-wd { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 9px; min-height: 48px; }
.cd-wd i { width: 5px; height: 5px; border-radius: 50%; background: var(--nil); }
.cd-wd[data-state="part"] i { background: var(--quiet); }
.cd-wd[data-state="whole"] i { background: var(--ink); box-shadow: 0 0 7px rgba(243, 245, 247, .6); }
/* Filled is kept and hollow is missed, which is the habits screen's own
   rule: no colour says whether. */
.cd-wd[data-state="none"] i { background: none; box-shadow: inset 0 0 0 1.2px var(--miss); }
.cd-wd[aria-pressed="true"] i { outline: 3px solid rgba(243, 245, 247, .16); }
.cd-wl { letter-spacing: .1em; color: var(--quiet); }
.cd-wd.is-today .cd-wl { color: var(--ink); }

/* ── the block you are in ── */
.cd-hero { margin-top: 56px; text-align: center; }
.cd-hero.is-sub { margin-top: 26px; }
.cd-hcap { letter-spacing: .18em; color: var(--c, var(--quiet)); }
.cd-big { display: block; margin: 16px auto 0; font: 300 46px/1.05 var(--sans); letter-spacing: -.02em; text-align: center; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
/* The name is a press target — it opens the block — and wraps to two
   lines before it is cut, because a name is the whole of what it says. */
.cd-hn { max-width: 100%; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.cd-hn:disabled { cursor: default; }
.cd-hs { margin-top: 12px; font: 400 16px/1.3 var(--sans); color: var(--dim); font-variant-numeric: tabular-nums; }
.cd-hs b { font-weight: 500; color: var(--ink); }
.cd-bar { position: relative; width: 210px; height: 2px; margin: 22px auto 0; border-radius: 1px; background: var(--track); }
.cd-bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 1px; background: var(--c); box-shadow: 0 0 10px color-mix(in srgb, var(--c) 70%, transparent); }
.cd-then { display: block; min-width: 44px; min-height: 44px; margin: 26px auto 0; padding: 4px 12px; text-align: center; }
.cd-then b { display: block; margin-top: 9px; font: 300 21px/1.2 var(--sans); color: var(--dim); }

/* ── the rest of the day: a hairline a row, and the dot is the check ── */
.cd-list { list-style: none; margin: 44px 0 0; padding: 0; }
.cd-it { position: relative; display: grid; grid-template-columns: 44px 1fr; align-items: center; margin-left: -18.5px; }
.cd-it::before { content: ""; position: absolute; left: 18.5px; right: 0; top: 0; height: 1px; background: var(--hair); }
.cd-it:last-child::after { content: ""; position: absolute; left: 18.5px; right: 0; bottom: 0; height: 1px; background: var(--hair); }
.cd-dot { width: 44px; height: 44px; display: grid; place-items: center; }
.cd-dot i { width: 7px; height: 7px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--c); }
.cd-dot:disabled { cursor: default; }
.cd-it.is-done .cd-dot i { background: var(--c); box-shadow: 0 0 8px var(--c); }
/* A kept block says so beside its name: a small tick in the block's own
   colour, so kept and missed tell apart by a mark rather than by a fill
   seven pixels across. Drawn, not a glyph, so it is the same shape in
   every font. */
.cd-tk { display: inline-block; width: 4px; height: 8px; margin: 0 0 1px 8px; border: solid var(--c); border-width: 0 1.8px 1.8px 0; transform: rotate(45deg); vertical-align: middle; }
.cd-it.is-past:not(.is-done) .cd-dot i { box-shadow: inset 0 0 0 1.5px var(--miss); }
.cd-rb { display: grid; grid-template-columns: 1fr auto; align-items: baseline; column-gap: 12px; row-gap: 4px; min-height: 44px; padding: 14px 0 13px; }
.cd-rn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 400 15px/1.1 var(--sans); }
.cd-rt { font: 500 11px/1 var(--mono); letter-spacing: .08em; color: var(--quiet); font-variant-numeric: tabular-nums; white-space: nowrap; }
.cd-rs { grid-column: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 400 12.5px/1.3 var(--sans); color: var(--quiet); }
/* What you trained rides the name's own line, in the session's colour. */
.cd-rw { color: var(--kc); }
.cd-it.is-done .cd-rn { color: var(--quiet); }
/* A block behind you and not kept is struck through: you can see at a
   glance it was missed, and it is struck in the quiet ink, never red,
   because nothing here says you failed. */
/* And in the faint grey, which is the one piece of type in the app held
   under 4.5: it is a record of something that did not happen, struck and
   dimmed on purpose, and the name is still there for anyone who looks.
   It is held to 3:1, the graphic floor, instead. */
.cd-it.is-past:not(.is-done) .cd-rn { color: var(--faint); text-decoration: line-through; text-decoration-thickness: 1px; }

/* THE CHECK. White while the block is waiting for you, and lit in the
   block's own colour once it is kept — the row's dot, at the size of
   the one thing you came to do. */
.cd-go {
  position: fixed; left: 50%; bottom: calc(34px + env(safe-area-inset-bottom)); z-index: 30;
  width: 64px; height: 64px; margin-left: -32px; border-radius: 50%;
  display: grid; place-items: center; background: var(--ink); color: var(--on);
  box-shadow: 0 18px 40px -10px rgba(0, 0, 0, .6);
}
.cd-go svg { width: 24px; height: 24px; display: block; }

.cd-empty { padding: 22px 0; list-style: none; font: 400 15px/1.45 var(--sans); color: var(--dim); text-align: center; }
.cd-link { min-height: 44px; display: inline-flex; align-items: center; font: 500 15px/1 var(--sans); color: var(--ink); }
.cd-empty .cd-link { display: flex; justify-content: center; width: 100%; margin-top: 4px; }

/* ── habits: a dot a habit, and a fortnight of dots under each ── */
.cd-hdots { display: flex; justify-content: center; gap: 12px; margin-top: 22px; }
.cd-hdots i { width: 7px; height: 7px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--hc); }
.cd-hdots i.is-on { background: var(--hc); box-shadow: 0 0 8px var(--hc); }
.cd-hb { list-style: none; margin: 34px 0 0; padding: 0; }
.cd-hr { position: relative; display: grid; grid-template-columns: 44px 1fr; align-items: center; margin-left: -18.5px; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
/* The record is a long press away; this is the same door for a keyboard,
   off the screen until it has focus. */
.cd-hr-h { position: absolute; left: -9999px; top: 0; width: 44px; height: 44px; }
/* Focused, it sits over the row's own dot, the one spot on the row with no words to draw over. */
.cd-hr-h:focus { left: 0; right: auto; top: 50%; margin-top: -22px; display: grid; place-items: center; padding: 0; border-radius: 50%; box-shadow: inset 0 0 0 1px var(--hair); color: var(--ink); }
.cd-hr::before { content: ""; position: absolute; left: 18.5px; right: 0; top: 0; height: 1px; background: var(--hair); }
.cd-hr:last-child::after { content: ""; position: absolute; left: 18.5px; right: 0; bottom: 0; height: 1px; background: var(--hair); }
.cd-hr-b { width: 44px; height: 44px; display: grid; place-items: center; }
.cd-hr-b i { width: 7px; height: 7px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--hc); }
.cd-hr.is-on .cd-hr-b i { background: var(--hc); box-shadow: 0 0 8px var(--hc); }
.cd-hr-n { display: grid; grid-template-columns: 1fr auto; align-items: baseline; column-gap: 12px; row-gap: 8px; min-height: 44px; padding: 14px 0 13px; }
.cd-hr-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 400 15px/1.1 var(--sans); }
.cd-hr-v { font: 400 15px/1.1 var(--sans); color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
.cd-hr-v small { margin-left: 5px; font: 500 9.5px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--quiet); }
.cd-hr-v.is-nil { color: var(--quiet); }
.cd-hr-s { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; min-width: 0; font: 400 12.5px/1.2 var(--sans); color: var(--quiet); }
.cd-hr-s > span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cd-fn { flex: none; display: flex; gap: 3px; }
.cd-fn i { width: 4px; height: 4px; border-radius: 50%; background: var(--nil); }
.cd-fn i.is-on { background: var(--hc); }
.cd-pane > .cd-link { margin-top: 14px; }

/* ── month: a figure a day, and a dot under it ── */
.cd-mhead { flex: none; display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; margin: 22px var(--gut) 0; text-align: center; }
.cd-mhead .cd-big { margin-top: 14px; }
.cd-mhead button { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--ink); box-shadow: inset 0 0 0 1px var(--hair); }
.cd-mhead button:disabled { color: rgba(243, 245, 247, .28); box-shadow: none; cursor: default; }
.cd-mhead svg { width: 16px; height: 16px; }
.cd-mcap { flex: none; margin: 14px var(--gut) 0; text-align: center; letter-spacing: .14em; color: var(--quiet); }
.cd-dows { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); padding: 18px 0 8px; text-align: center; letter-spacing: .1em; color: var(--quiet); }
.cd-mgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 2px; }
/* From the top, not centred: a day with a workout on it is taller than one
   without, and centred the dates in one row would sit at two heights. */
.cd-mc { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 6px; min-width: 0; min-height: 50px; padding: 4px 0 6px; }
.cd-mc b { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; font: 400 14px/1 var(--sans); font-variant-numeric: tabular-nums; }
.cd-mc.is-quiet b, .cd-mc.is-future b { color: var(--quiet); }
.cd-mc.is-today b { font-weight: 700; }
/* A busy day's dots are wider than a 320px phone's cell, and a row that
   will not fit made its column wider than the other six and ran into the
   day beside it. It wraps under itself instead: the columns are equal
   because `minmax(0, 1fr)` lets them be. */
.cd-md { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 2px; max-width: calc(100% - 4px); min-height: 5px; }
.cd-md i { width: 4px; height: 4px; border-radius: 50%; }
.cd-md .cd-mk { width: 5px; height: 5px; margin-right: 2px; }
.cd-mk { background: var(--nil); }
.cd-mc[data-state="part"] .cd-mk { background: var(--quiet); }
.cd-mc[data-state="whole"] .cd-mk { background: var(--ink); box-shadow: 0 0 6px rgba(243, 245, 247, .55); }
.cd-mc[data-state="none"] .cd-mk { background: none; box-shadow: inset 0 0 0 1.2px var(--miss); }
.cd-mc.is-today .cd-mk { outline: 3px solid rgba(243, 245, 247, .16); }
.cd-mh { background: var(--kc); }
.cd-mc.is-pad { visibility: hidden; }
.cd-legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; margin: 18px 0 0; letter-spacing: .14em; color: var(--quiet); }
.cd-legend span { display: inline-flex; align-items: center; gap: 7px; }
.cd-legend i { width: 5px; height: 5px; border-radius: 50%; background: var(--kc); }

/* ── training: thirty days of dots, and a column of dots a week ── */
.cd-lbl { margin: 26px 0 12px; }
.cd-day-l { list-style: none; margin: 0; padding: 0; }
.cd-day-l li { box-shadow: inset 0 1px 0 var(--hair); }
.cd-day-l b { font: 400 15px/1.3 var(--sans); }
.cd-day-l span { font: 500 11px/1.3 var(--mono); letter-spacing: .06em; color: var(--quiet); font-variant-numeric: tabular-nums; }
.cd-day-l span { text-align: right; }

/* ── the sheet ── */
.cd-scrim { position: fixed; inset: 0; z-index: 40; background: rgba(2, 4, 7, .66); opacity: 0; transition: opacity .2s; }
.cd-scrim.is-open { opacity: 1; }
.cd-sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  max-width: 560px; max-height: 90dvh; margin: 0 auto; overflow-y: auto; overflow-x: hidden;
  padding: 0 var(--gut) calc(env(safe-area-inset-bottom) + 16px);
  background: var(--sheet); border-radius: 28px 28px 0 0;
  box-shadow: inset 0 1px 0 var(--hair), 0 -24px 60px rgba(0, 0, 0, .55);
  transform: translateY(100%); transition: transform .28s cubic-bezier(.2, .8, .2, 1);
}
.cd-sheet.is-open { transform: none; }
.cd-sh-hd { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 24px 0 12px; background: var(--sheet); box-shadow: 0 1px 0 var(--hair); }
.cd-sh-hd::before { content: ""; position: absolute; left: 50%; top: 9px; width: 36px; height: 4px; margin-left: -18px; border-radius: 2px; background: rgba(243, 245, 247, .18); }
.cd-sh-hd h2 { font: 300 26px/1.1 var(--sans); letter-spacing: -.01em; }
.cd-x { flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--ink); box-shadow: inset 0 0 0 1px var(--hair); }
.cd-x svg { width: 18px; height: 18px; display: block; }
/* The hairline is what makes the foot an edge. Sticky over a scrolling
   sheet, it cuts whatever row is passing under it, and without a line the
   row reads as clipped rather than as going behind something. */
.cd-foot { position: sticky; bottom: calc(-16px - env(safe-area-inset-bottom)); z-index: 2; display: flex; gap: 10px; margin-top: 22px; padding: 12px 0 16px; background: var(--sheet); box-shadow: 0 -1px 0 var(--hair); }

.cd-btn { flex: 1; min-height: 50px; padding: 0 18px; border-radius: 25px; text-align: center; font: 500 15px/1.2 var(--sans); color: var(--ink); box-shadow: inset 0 0 0 1px var(--hair); }
/* A foot that is the WHOLE body of a sheet sits straight under the head,
   whose own hairline already closes it off: its margin and its top rule
   drew a second line 22px under the first with nothing between them. */
.cd-foot.is-only { margin-top: 0; box-shadow: none; }
/* The quiet half of a pair is a FILL, not an outline. A hairline beside a
   solid control reads as the smaller of the two at an identical box. */
.cd-btn.soft { background: rgba(243, 245, 247, .09); box-shadow: none; }
.cd-btn.go { background: var(--ink); color: var(--on); box-shadow: none; }
.cd-btn.go:disabled { opacity: .4; cursor: default; }
.cd-btn.warn { color: var(--bad); }
.cd-btn.warn:disabled { opacity: .4; cursor: default; }

.cd-field {
  width: 100%; min-height: 50px; padding: 13px 16px; border: 0; border-radius: 14px;
  font: 400 16px/1.3 var(--sans); color: var(--ink); background: var(--lift);
  -webkit-appearance: none; appearance: none;
}
.cd-field::placeholder { color: var(--faint); }
textarea.cd-field { min-height: 110px; resize: vertical; }
.cd-say { min-height: 60px; font-size: 18px; }
.cd-prev { min-height: 18px; margin: 12px 2px 0; font: 400 13px/1.5 var(--sans); color: var(--quiet); font-variant-numeric: tabular-nums; }
.cd-prev b { font-weight: 600; color: var(--ink); }
.cd-prev.is-need { color: var(--c-work); }

.cd-rows { border-radius: 16px; box-shadow: inset 0 0 0 1px var(--hair); overflow: hidden; }
.cd-row { display: grid; grid-template-columns: 96px 1fr; align-items: center; gap: 10px; min-height: 54px; padding: 4px 14px; }
.cd-row + .cd-row { box-shadow: inset 0 1px 0 var(--hair); }
.cd-row > span { font: 500 10.5px/1.3 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--quiet); }
.cd-row .cd-field { min-height: 44px; padding: 10px 0; background: none; border-radius: 0; }

.cd-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.cd-chip { min-width: 44px; min-height: 44px; padding: 0 16px; border-radius: 22px; text-align: center; font: 500 14px/1 var(--sans); color: var(--dim); box-shadow: inset 0 0 0 1px var(--hair); }
.cd-chip[aria-pressed="true"] { background: var(--ink); color: var(--on); box-shadow: none; }
.cd-chip.kc[aria-pressed="true"] { background: var(--kc); color: var(--on); }
/* Seven across in whatever the sheet has. A chip's 44px floor made the
   tracks 344px on a 316px sheet, so at 360 Sunday ran off the phone.
   They share the width instead: 45px at 375 and up, 43 at 360 and 37 on
   a 320px phone, which is the one width seven 44s cannot go across. */
/* The length ladder is a grid, never a wrap: eight rungs of different
   widths wrapped as 4, 3 and a lone 120m on a third row at 320px, which
   reads as a mistake rather than as a ladder. Four across is two even
   rows at every width. */
.cd-chips.ladder { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.cd-chips.ladder .cd-chip { min-width: 0; padding: 0 4px; }
.cd-chips.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; }
.cd-chips.days .cd-chip { justify-self: center; width: 100%; max-width: 44px; min-width: 0; padding: 0; aspect-ratio: 1; border-radius: 50%; }

.cd-range { width: 100%; height: 44px; margin: 0; background: none; -webkit-appearance: none; appearance: none; }
.cd-range::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: rgba(243, 245, 247, .2); }
.cd-range::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 22px; height: 22px; margin-top: -9.5px; border-radius: 50%; background: var(--ink); box-shadow: 0 4px 12px rgba(0, 0, 0, .5); }
.cd-range::-moz-range-track { height: 3px; border-radius: 2px; background: rgba(243, 245, 247, .2); }
.cd-range::-moz-range-thumb { width: 22px; height: 22px; border: 0; border-radius: 50%; background: var(--ink); box-shadow: 0 4px 12px rgba(0, 0, 0, .5); }
.cd-len { display: block; margin-top: -4px; font: 500 11px/1.3 var(--mono); letter-spacing: .06em; color: var(--quiet); font-variant-numeric: tabular-nums; }

.cd-toggle { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 54px; padding: 0 14px; font: 400 16px/1.2 var(--sans); }
.cd-toggle + .cd-toggle { box-shadow: inset 0 1px 0 var(--hair); }
.cd-toggle:disabled { color: var(--quiet); cursor: default; }
.cd-toggle i { position: relative; flex: none; width: 50px; height: 30px; border-radius: 15px; background: var(--lift2); transition: background .15s; }
.cd-toggle i::after { content: ""; position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--ink); transition: left .15s, background .15s; }
.cd-toggle[aria-pressed="true"] i { background: var(--ink); }
.cd-toggle[aria-pressed="true"] i::after { left: 23px; background: var(--on); }

.cd-grp { margin-bottom: 4px; }
.cd-grp h3 { margin: 20px 0 10px; font: 500 10.5px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--kc, var(--quiet)); }

.cd-num { margin: 10px 0 2px; text-align: center; font: 200 60px/1 var(--sans); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.cd-num small { margin-left: 8px; font: 500 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--quiet); }
.cd-numcap { margin: 6px 0 10px; text-align: center; font: 500 10.5px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--quiet); }

/* A habit's record opens on three figures side by side: the same box
   each, the figure over its words. The rule was lost with an earlier look
   and they ran together as "7of 30 days" in the browser's own inline flow. */
.cd-figs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 6px 0 4px; text-align: center; }
.cd-figs > div { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; }
.cd-figs b { font: 200 34px/1 var(--sans); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.cd-figs span { font: 500 10.5px/1.3 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--quiet); }
.cd-day-l li { display: grid; grid-template-columns: 8px 1fr auto; align-items: center; gap: 12px; padding: 13px 0 12px; }
.cd-day-l li > i { width: 8px; height: 8px; border-radius: 50%; background: var(--cat, var(--quiet)); }
.cd-dnote { display: block; width: 100%; min-height: 44px; padding: 10px 0; text-align: left; font: 400 14px/1.45 var(--sans); color: var(--dim); }
.cd-dnote + .cd-dnote { box-shadow: inset 0 1px 0 var(--hair); }
.cd-dnote.is-imp .cd-ntx::before { content: "◆ "; color: var(--ink); }
.cd-dnote small { display: block; margin-top: 4px; font: 500 10.5px/1.3 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--quiet); }
.cd-note { margin: 12px 0 0; font: 400 14px/1.5 var(--sans); color: var(--dim); }
/* THE DAY'S THOUGHT is a card in the MIDDLE, not a sheet from the foot:
   a sheet is something you pulled up to work in, and this arrived on its
   own and asks for a moment. Nothing to fill in — it is read and put away. */
.cd-rf { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 24px var(--gut); background: rgba(2, 4, 7, .66); animation: cdRfIn .22s ease-out; }
.cd-rf-c { width: 100%; max-width: 360px; padding: 26px 24px 18px; border-radius: 28px; background: var(--sheet); box-shadow: inset 0 1px 0 var(--hair), 0 24px 60px rgba(0, 0, 0, .55); text-align: center; animation: cdRfCard .26s cubic-bezier(.2, .8, .2, 1); }
.cd-rf-k { margin: 0; font: 500 11px/1.3 var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--quiet); }
.cd-rq { margin: 16px 0 22px; font: 300 24px/1.3 var(--sans); letter-spacing: -.01em; color: var(--ink); }
/* Put away by an arrow rather than a word: the card is read, not
   answered, and a word on a button reads as a reply to it. A round quiet
   fill, the app's own soft control. */
.cd-rf-go { position: relative; width: 44px; height: 44px; margin: 0 auto; display: grid; place-items: center; border-radius: 50%; background: none; color: var(--ink); }
/* Drawn at 34 inside a 44 box: smaller on request, and the box a thumb
   reaches stays the floor every other press target here holds to. */
.cd-rf-go::before { content: ''; position: absolute; inset: 5px; border-radius: 50%; background: rgba(243, 245, 247, .09); }
.cd-rf-go svg { position: relative; width: 18px; height: 18px; display: block; }
@keyframes cdRfIn { from { opacity: 0; } }
@keyframes cdRfCard { from { opacity: 0; transform: scale(.94); } }
@media (prefers-reduced-motion: reduce) { .cd-rf, .cd-rf-c { animation: none; } }
/* Centred between the head's rule and the next one: equal padding and no
   margin, so whatever follows (a row's own hairline, or the foot's rule on
   an empty day) starts exactly as far below the words as the head ends
   above them. */
.cd-cap { margin: 0; padding: 14px 0; line-height: 1.4; }
.cd-cap + .cd-foot { margin-top: 0; }

.cd-sec { margin: 30px 0 0; }
.cd-sec + .cd-hb { margin-top: 12px; }

/* ── the calendar's important things ── */
/* The workout rides under the date by name; an important note is a
   small diamond in the corner. Two marks, two shapes. */
.cd-mc.has-note::after { content: ""; position: absolute; top: 5px; right: 6px; width: 5px; height: 5px; background: var(--ink); transform: rotate(45deg); }
.cd-mw { max-width: calc(100% - 4px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 2px 4px; border-radius: 4px; font: 500 9.5px/1.2 var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--kc); background: color-mix(in srgb, var(--kc) 16%, transparent); }
.cd-legend i.is-dia { border-radius: 0; background: var(--ink); transform: rotate(45deg); }

/* ── notes: a line to a day, not a document ── */
.cd-nw { margin-top: 26px; }
.cd-nw .cd-field { min-height: 60px; resize: none; }
.cd-nw-r { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
.cd-nw-r .go { margin-left: auto; background: var(--ink); color: var(--on); box-shadow: none; }
.cd-nw-r .go:disabled { opacity: .4; cursor: default; }
/* 16px, or iOS zooms the page when the date is pressed. */
.cd-ndate { flex: 0 1 150px; min-width: 44px; max-width: 150px; min-height: 44px; padding: 0 12px; border: 0; border-radius: 22px; font: 400 16px/1 var(--sans); color: var(--dim); background: none; box-shadow: inset 0 0 0 1px var(--hair); -webkit-appearance: none; appearance: none; }
.cd-ndate::-webkit-calendar-picker-indicator { filter: invert(1); opacity: .6; }
.cd-ng { margin-top: 28px; }
.cd-ng > .cd-lbl { margin-bottom: 6px; }
.cd-nl { list-style: none; margin: 0; padding: 0; }
.cd-ni { position: relative; display: grid; grid-template-columns: 44px 1fr; align-items: start; margin-left: -18.5px; }
.cd-ni::before { content: ""; position: absolute; left: 18.5px; right: 0; top: 0; height: 1px; background: var(--hair); }
.cd-ni:last-child::after { content: ""; position: absolute; left: 18.5px; right: 0; bottom: 0; height: 1px; background: var(--hair); }
.cd-nstar { width: 44px; height: 46px; display: grid; place-items: center; }
.cd-nstar i { width: 6px; height: 6px; transform: rotate(45deg); box-shadow: inset 0 0 0 1.4px var(--quiet); }
.cd-ni.is-imp .cd-nstar i { background: var(--ink); box-shadow: 0 0 8px rgba(243, 245, 247, .55); }
.cd-nt { min-height: 44px; padding: 13px 0 12px; font: 400 15px/1.4 var(--sans); color: var(--ink); text-align: left; }
/* The clamp is on the words alone, so the picture count under them is
   never the line it cuts. */
.cd-ntx { white-space: pre-wrap; overflow-wrap: anywhere; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; }
.cd-nstrip { display: flex; justify-content: center; gap: 6px; margin-top: 22px; }
.cd-nstrip i { width: 5px; height: 5px; border-radius: 50%; background: var(--nil); }
.cd-nstrip i.is-on { background: var(--ink); box-shadow: 0 0 6px rgba(243, 245, 247, .5); }

.cd-nt b { font-weight: 600; }
.cd-nt small { display: block; margin-top: 4px; font: 500 10.5px/1.3 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--quiet); }

/* ── a note, opened: the whole page, the way a note opens in Notes ── */
.cd-doc {
  position: fixed; inset: 0; z-index: 35; overflow-y: auto; overflow-x: hidden;
  /* The app's own sky, not a flat ground: a note is a page of the app, and
     a scroller's background does not scroll with its content, so on this
     viewport-sized box the gradient lands exactly where body draws it. */
  background: var(--sky); background-color: var(--bg); opacity: 0; transform: translateY(12px); transition: opacity .2s, transform .24s cubic-bezier(.2, .8, .2, 1);
}
.cd-doc.is-open { opacity: 1; transform: none; }
.cd-doc-top { position: sticky; top: 0; z-index: 2; max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 6px) var(--gut) 8px; background: var(--sky) center top / 100vw 100vh no-repeat, var(--bg); box-shadow: 0 1px 0 var(--hair); }
/* The head is a slice of the same sky, sized to the viewport and pinned to
   its own top edge — which is the viewport's top whenever it is stuck — so
   the rows scrolling under it are covered by the picture behind them
   rather than by a band of flat colour. */
.cd-doc-hd { display: flex; align-items: center; gap: 6px; }
.cd-doc-back { display: flex; align-items: center; gap: 2px; min-height: 44px; padding: 0 10px 0 0; margin-right: auto; font: 500 16px/1 var(--sans); color: var(--ink); }
.cd-doc-back svg { width: 22px; height: 22px; margin-left: -6px; }
/* The day in words, with the native field laid over it unseen. Drawn as
   the field itself it printed its own figures, and at 320px "09/25/2026"
   was cut to "09/25/20" inside its own box. */
.cd-ddate { position: relative; display: flex; align-items: center; min-height: 44px; min-width: 44px; padding: 0 14px; border-radius: 22px; font: 400 15px/1 var(--sans); color: var(--dim); box-shadow: inset 0 0 0 1px var(--hair); white-space: nowrap; }
.cd-ddate input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 0; border: 0; opacity: 0; font-size: 16px; cursor: pointer; -webkit-appearance: none; appearance: none; }
.cd-doc-rm { width: 44px; height: 44px; display: grid; place-items: center; color: var(--dim); }
.cd-doc-rm svg { width: 20px; height: 20px; }
.cd-nstar.is-imp i { background: var(--ink); box-shadow: 0 0 8px rgba(243, 245, 247, .55); }
/* Five styles as one segmented row: the one the caret is in is filled. */
.cd-doc-ks { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; margin-top: 4px; padding: 3px; border-radius: 24px; box-shadow: inset 0 0 0 1px var(--hair); }
.cd-doc-ks button { min-height: 38px; border-radius: 19px; text-align: center; font: 500 12.5px/1 var(--sans); color: var(--dim); position: relative; }
.cd-doc-ks button::before { content: ""; position: absolute; left: 0; right: 0; top: -3px; bottom: -3px; }
.cd-doc-ks button[aria-pressed="true"] { background: var(--ink); color: var(--on); }
.cd-doc-hl { display: flex; align-items: center; justify-content: space-between; margin: 4px -4px 0; }
.cd-doc-hl button, .cd-doc-pic { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; }
/* Eight across is 352px, four more than the column at 390: the row
   reaches 4px into each gutter, which the drawn marks (22px inside each
   44) never come near. Narrower than that it gives ground rather than
   running off the side. */
.cd-doc-hl > * { flex: 0 1 44px; min-width: 34px; }
.cd-doc-u { color: var(--dim); font: 600 17px/1 var(--sans); text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
.cd-doc-u[aria-pressed="true"] { background: var(--ink); color: var(--on); }
.cd-nb u { text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
.cd-doc-hl button i { width: 22px; height: 22px; border-radius: 50%; background: color-mix(in srgb, var(--hc) 28%, transparent); box-shadow: inset 0 0 0 1.5px var(--hc); }
.cd-doc-hl button[aria-pressed="true"] i { background: var(--hc); box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--hc); }
.cd-doc-hl .hl-o { --hc: var(--c-body); }
.cd-doc-hl .hl-p { --hc: var(--h-sleep); }
.cd-doc-hl .hl-y { --hc: var(--c-work); }
.cd-doc-hl .hl-b { --hc: var(--h-water); }
.cd-doc-hl .hl-v { --hc: var(--c-mind); }
.cd-doc-hl .hl-x i { background: linear-gradient(135deg, transparent 46%, var(--quiet) 46%, var(--quiet) 54%, transparent 54%); box-shadow: inset 0 0 0 1.5px var(--quiet); }
.cd-doc-pic { color: var(--ink); cursor: pointer; }
.cd-doc-pic svg { width: 24px; height: 24px; }
.cd-doc-pic input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

/* 16px and up everywhere a caret can go, or iOS zooms the page. */
.cd-doc-ed { max-width: 560px; min-height: calc(100dvh - 180px); margin: 0 auto; padding: 18px var(--gut) 120px; outline: none; font: 400 16px/1.5 var(--sans); color: var(--ink); overflow-wrap: anywhere; caret-color: var(--ink); }
.cd-nb { min-height: 1.5em; }
.cd-nb.k-t { margin: 4px 0 10px; font: 700 28px/1.2 var(--sans); letter-spacing: -.01em; }
.cd-nb.k-h { margin: 22px 0 6px; font: 700 21px/1.3 var(--sans); }
.cd-nb.k-s { margin: 14px 0 4px; font: 600 17px/1.35 var(--sans); }
.cd-nb.k-t:first-child, .cd-nb.k-h:first-child, .cd-nb.k-s:first-child { margin-top: 0; }
/* A quote is the bar down the left that groups the lines under a
   heading, which is how the notes this was asked from hold a section. */
.cd-nb.k-q { position: relative; padding-left: 16px; color: var(--dim); }
.cd-nb.k-q::before { content: ""; position: absolute; left: 2px; top: 0; bottom: 0; width: 3px; border-radius: 2px; background: var(--miss); }
.cd-nb.k-q + .cd-nb.k-q::before { top: -1px; }
/* A highlight is the colour on the words and a wash behind them, never
   the wash alone: a tint without the ink is a smudge on a dark page. */
/* Measured against the sky's lightest stop, since a note now sits on it:
   the hue at full strength over a 20% wash of itself was 3.8:1 at the
   foot, so the words take a quarter of the ink and the wash is thinner. */
.cd-nb mark { color: color-mix(in srgb, var(--hc) 75%, var(--ink)); background: color-mix(in srgb, var(--hc) 16%, transparent); border-radius: 4px; padding: 1px 0; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.cd-nb mark[data-c="o"] { --hc: var(--c-body); }
.cd-nb mark[data-c="p"] { --hc: var(--h-sleep); }
.cd-nb mark[data-c="y"] { --hc: var(--c-work); }
.cd-nb mark[data-c="b"] { --hc: var(--h-water); }
.cd-nb mark[data-c="v"] { --hc: var(--c-mind); }
.cd-nb.k-h mark, .cd-nb.k-t mark { text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
.cd-nb-i { position: relative; margin: 12px 0; user-select: none; -webkit-user-select: none; }
.cd-nb-i img { display: block; width: 100%; height: auto; border-radius: 12px; background: var(--lift); }
.cd-nb-x { position: absolute; top: 6px; right: 6px; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; color: var(--ink); }
.cd-nb-x svg { width: 30px; height: 30px; padding: 7px; border-radius: 50%; background: rgba(3, 6, 10, .6); }

/* ── toast ── */
/* `width: max-content` is load-bearing. A fixed box at `left: 50%` shrinks
   to fit the room between its left edge and the screen's right one, which
   is half the phone, so "Deleted Meal prep" wrapped onto two lines beside
   an Undo with the whole other half of the screen empty. */
.cd-toast {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 112px); z-index: 60;
  display: flex; align-items: center; gap: 6px; width: max-content; max-width: calc(100vw - 32px);
  padding: 4px 4px 4px 18px; border-radius: 22px;
  font: 500 14px/1.3 var(--sans); background: #13212C; color: var(--ink);
  box-shadow: inset 0 0 0 1px var(--hair), 0 14px 30px -12px rgba(0, 0, 0, .7); transform: translateX(-50%);
}
.cd-toast.is-bare { padding-right: 18px; min-height: 40px; }
.cd-toast button { min-height: 40px; padding: 0 14px; font: 600 14px/1 var(--sans); color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }

/* A 320px phone. Four spaced-out tab words do not go across 208px, and
   `1fr` is `minmax(auto, 1fr)`, so the middle grew and pushed Add off the
   side; the month's next arrow went the same way under "September". The
   middle may shrink now, and here the words close up to make it fit. */
@media (max-width: 359px) {
  .cd-nav { gap: 0; }
  .cd-tab { padding: 0 3px; letter-spacing: .1em; }
  .cd-mhead .cd-big { font-size: 38px; }

}

}

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  /* ═══ STORE ═══
     Everything lives in this browser. Each record is its own key, so a
     damaged one costs itself and nothing beside it. */
  var K = {
    week: 'cad.week.v1', log: 'cad.log.v1',
    hab: 'cad.hab.v1', train: 'cad.train.v1', defs: 'cad.defs.v1',
    note: 'cad.note.v1', refl: 'cad.refl.v1'
  };
  /* There is one face now, so the key that chose between two is swept
     rather than left: a preference for a control that no longer exists
     is a second record of a decision nothing can act on. */
  try { localStorage.removeItem('cad.mode.v1'); } catch (e) {}
  function cdRead(k, dflt) {
    try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? dflt : v; }
    catch (e) { return dflt; }
  }
  function cdWrite(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { cdToast('Could not save — storage is full.'); } }
  var isObj = function (v) { return v && typeof v === 'object' && !Array.isArray(v); };

  /* ═══ DATES ═══ Monday is day 0. Dates are local ISO strings. */
  function cdISO(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function cdDate(iso) { var p = iso.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function cdDow(iso) { return (cdDate(iso).getDay() + 6) % 7; }
  function cdAddDays(iso, n) { var d = cdDate(iso); d.setDate(d.getDate() + n); return cdISO(d); }
  function cdToday() { return cdISO(new Date()); }
  function cdNowMin() { var d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
  /* Counted between DATES, so a daylight-saving hour cannot round a day away. */
  function cdDiff(a, b) { return Math.round((Date.UTC.apply(null, dparts(a)) - Date.UTC.apply(null, dparts(b))) / 864e5); }
  function dparts(iso) { var p = iso.split('-'); return [+p[0], +p[1] - 1, +p[2]]; }
  var DOW = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  var DOWL = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
  var MON = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  function cdHM(m) { m = Math.max(0, Math.min(1439, Math.round(m))); return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }
  function cdLen(m) {
    if (!(m > 0)) return 'a moment';
    var h = Math.floor(m / 60), r = m % 60;
    return h ? (r ? h + 'h ' + r + 'm' : h + 'h') : r + 'm';
  }
  /* A block can be ticked on the day and on the two behind it. Further
     back is a record you would be rewriting, and ahead has not happened. */
  function cdOpenDay(iso) { var d = cdDiff(cdToday(), iso); return d >= 0 && d <= 2; }

  /* ═══ WHAT A BLOCK IS ═══
     One table decides a block's part of life and whether finishing it
     asks what you trained. There is no glyph: a block is its name, its
     arc on the dial, and one colour. First hit wins, so the longer
     phrase is always listed before the word inside it. */
  var KW = [
    ['wake', /\b(wake up|wake|rise|alarm)\b/],
    ['run', /\b(run|running|jog|tempo|intervals|5k|10k)\b/],
    ['train', /\b(work out|workout|gym|train|training|lift|lifting|weights|push day|pull day|leg day|legs|upper|lower|full body|crossfit|hiit|pilates|boxing|strength)\b/],
    ['stretch', /\b(stretch|stretching|yoga|mobility|recovery|sauna|plunge)\b/],
    ['walk', /\b(walk the dog|walk|hike|steps)\b/],
    ['read', /\b(read|reading|book)\b/],
    ['study', /\b(study|learn|course|class|lecture|revise|practice)\b/],
    ['calm', /\b(meditate|meditation|breathe|breathwork|journal|pray)\b/],
    ['chart', /\b(trade|trading|chart|charting|market|markets)\b/],
    ['move', /\b(commute|drive|bus|travel|flight|school run)\b/],
    ['work', /\b(deep work|work|office|shift|meeting|emails?|call|admin|focus)\b/],
    ['eat', /\b(meal prep|eat|lunch|breakfast|dinner|meal|cook|snack)\b/],
    ['coffee', /\b(coffee|tea)\b/],
    ['sleep', /\b(wind down|sleep|bed|nap)\b/]
  ];
  var CAT = { train: 'body', run: 'body', stretch: 'body', walk: 'body', read: 'mind', study: 'mind', calm: 'mind', chart: 'work', move: 'work', work: 'work', wake: 'rest', eat: 'rest', coffee: 'rest', sleep: 'rest', dot: 'none' };
  var TRAINING = { train: 1, run: 1, stretch: 1 };
  function cdKind(name) {
    var s = String(name || '').toLowerCase();
    for (var i = 0; i < KW.length; i++) if (KW[i][1].test(s)) return KW[i][0];
    return 'dot';
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  /* ═══ THE WEEK ═══ a template: every Monday is the same shape. */
  var SEED = [
    ['Wake up', [0, 1, 2, 3, 4, 5, 6], 420, 420],
    ['Gym', [0, 2, 4], 450, 510],
    ['Easy run', [1, 3], 450, 495],
    ['Deep work', [0, 1, 2, 3, 4], 540, 720],
    ['Lunch', [0, 1, 2, 3, 4], 750, 795],
    ['Emails and calls', [0, 1, 2, 3, 4], 840, 900],
    ['Long walk', [5, 6], 600, 690],
    ['Meal prep', [6], 960, 1020],
    ['Read', [0, 1, 2, 3, 4, 5, 6], 1290, 1320],
    ['Wind down', [0, 1, 2, 3, 4, 5, 6], 1350, 1350]
  ];
  var idc = 0;
  function cdId() { return 'b' + Date.now().toString(36) + (idc++).toString(36); }
  /* The shape of a block is written HERE and every writer goes through
     it, so a block made by the parser and one made by hand cannot come
     out with different fields. */
  function cdBlock(o) {
    var s = Math.max(0, Math.min(1439, Math.round(+o.s || 0)));
    var e = Math.max(s, Math.min(1440, Math.round(+o.e || s)));
    var d = (Array.isArray(o.d) ? o.d : []).filter(function (x) { return x >= 0 && x <= 6; });
    /* The caps here are the fields' own maxLength, said again. A cap only
       the save knew about took "by the window" to "by the wi" with nothing on
       screen to say it would. */
    return { id: typeof o.id === 'string' && o.id ? o.id : cdId(), n: String(o.n || '').slice(0, 60) || 'Block', d: d.filter(function (x, i) { return d.indexOf(x) === i; }).sort(), s: s, e: e, p: String(o.p || '').slice(0, 80) };
  }
  function cdLoadWeek() {
    var raw = cdRead(K.week, null);
    if (!Array.isArray(raw)) {
      var w = SEED.map(function (r, i) { return cdBlock({ id: 's' + i, n: r[0], d: r[1], s: r[2], e: r[3] }); });
      cdWrite(K.week, w);
      return w;
    }
    /* Repaired, not discarded, and the repair is written back so it is
       a fact about the record rather than about this page view. */
    var clean = raw.filter(isObj).map(cdBlock).filter(function (b) { return b.d.length; });
    if (JSON.stringify(clean) !== JSON.stringify(raw)) cdWrite(K.week, clean);
    return clean;
  }
  function cdLoadMap(k) {
    var raw = cdRead(k, {});
    if (!isObj(raw)) { cdWrite(k, {}); return {}; }
    var out = {}, bad = false;
    Object.keys(raw).forEach(function (d) {
      if (/^\d{4}-\d{2}-\d{2}$/.test(d) && isObj(raw[d])) out[d] = raw[d]; else bad = true;
    });
    if (bad) cdWrite(k, out);
    return out;
  }

  /* A list of records, each repaired or dropped on its own, and the
     repair written back: held only in memory it is redone every open and
     lost the moment anything else writes the key. */
  function cdLoadList(k, clean) {
    var raw = cdRead(k, []);
    var out = (Array.isArray(raw) ? raw : []).map(clean).filter(Boolean);
    if (!Array.isArray(raw) || JSON.stringify(out) !== JSON.stringify(raw)) cdWrite(k, out);
    return out;
  }
  var ISO = /^\d{4}-\d{2}-\d{2}$/;
  /* A note is a list of BLOCKS: a title, a heading, a sub-heading, a
     line of body, a quote, or a picture. A line of text is a list of
     runs, [words, highlight, underlined], so a colour can sit on three words of it
     rather than on the whole line. `t` is the plain text worked out from
     the blocks on every write, for everything that only reads a note (the
     list, the day sheet), so it cannot drift from them. A note written
     before blocks existed is its `t`, a body line a line. */
  var NB_K = { t: 1, h: 1, s: 1, p: 1, q: 1, i: 1 };
  var NB_HL = ['o', 'p', 'y', 'b', 'v'];
  function cdNbClean(b) {
    if (!isObj(b) || !NB_K[b.k]) return null;
    if (b.k === 'i') {
      var w = Math.round(+b.w), h = Math.round(+b.h);
      if (typeof b.p !== 'string' || !/^p[a-z0-9]{2,40}$/.test(b.p)) return null;
      /* Damaged, the aspect falls to 4:3 rather than to nothing: a box
         of no height is the page jumping when the picture lands. */
      if (!(w > 0 && w < 20000 && h > 0 && h < 20000)) { w = 4; h = 3; }
      return { k: 'i', p: b.p, w: w, h: h };
    }
    var r = [];
    (Array.isArray(b.r) ? b.r : []).forEach(function (x) {
      if (!Array.isArray(x)) return;
      var t = String(x[0] == null ? '' : x[0]).replace(/[\r\n]+/g, ' '), c = NB_HL.indexOf(x[1]) >= 0 ? x[1] : '', u = x[2] === 1;
      if (!t) return;
      var L = r[r.length - 1];
      if (L && L[1] === c && (L[2] === 1) === u) L[0] += t; else r.push(u ? [t, c, 1] : [t, c]);
    });
    return { k: b.k, r: r };
  }
  function cdNbText(b) { return b.k === 'i' ? '' : b.r.map(function (x) { return x[0]; }).join(''); }
  function cdNoteClean(n) {
    if (!isObj(n) || typeof n.id !== 'string' || !n.id || !ISO.test(n.d)) return null;
    var bs = Array.isArray(n.b) ? n.b.map(cdNbClean).filter(Boolean)
      : String(n.t || '').split('\n').map(function (l) { return { k: 'p', r: l ? [[l, '']] : [] }; });
    bs = bs.slice(0, 400);
    var room = 20000;
    bs.forEach(function (b) {
      if (b.k === 'i') return;
      b.r = b.r.filter(function (x) { x[0] = x[0].slice(0, Math.max(0, room)); room -= x[0].length; return x[0]; });
    });
    var t = bs.filter(function (b) { return b.k !== 'i'; }).map(cdNbText).join('\n');
    if (!t.trim() && !bs.some(function (b) { return b.k === 'i'; })) return null;
    return { id: n.id, t: t, b: bs, d: n.d, i: n.i ? 1 : 0, at: +n.at || 0 };
  }

  var S = {
    week: cdLoadWeek(),
    log: cdLoadMap(K.log),
    hab: cdLoadMap(K.hab),
    train: cdLoadMap(K.train),
    defs: (function () {
      var r = cdRead(K.defs, []);
      return Array.isArray(r) ? r.filter(function (x) { return isObj(x) && x.id && x.n; }) : [];
    })(),
    note: cdLoadList(K.note, cdNoteClean),
    refl: cdLoadMap(K.refl)
  };
  function cdSave(which) { cdWrite(K[which], S[which]); }

  function cdOn(iso) {
    var dw = cdDow(iso);
    return S.week.filter(function (b) { return b.d.indexOf(dw) >= 0; })
      .sort(function (a, b) { return a.s - b.s || a.e - b.e || (a.n < b.n ? -1 : 1); });
  }
  var cdDone = function (iso, id) { return !!(S.log[iso] && S.log[iso][id]); };
  function cdSetFlag(map, iso, id, on) {
    var m = S[map];
    if (on) { (m[iso] = m[iso] || {})[id] = 1; }
    else if (m[iso]) { delete m[iso][id]; if (!Object.keys(m[iso]).length) delete m[iso]; }
    cdSave(map);
  }
  function cdTally(iso) {
    var on = cdOn(iso);
    var kept = on.filter(function (b) { return cdDone(iso, b.id); }).length;
    var mins = on.reduce(function (t, b) { return t + (b.e - b.s); }, 0);
    return { on: on.length, kept: kept, mins: mins };
  }
  /* The record begins at the first thing you ever logged. A day before
     that is not a day you missed. */
  function cdFirst() {
    var ks = [].concat(Object.keys(S.log), Object.keys(S.hab), Object.keys(S.train)).sort();
    return ks[0] || cdToday();
  }

  /* ═══ TRAINING ═══ */
  var LIFT = [
    { g: 'weights', n: 'Weights', items: [['push', 'Push'], ['pull', 'Pull'], ['legs', 'Legs'], ['upper', 'Upper'], ['lower', 'Lower'], ['full', 'Full body'], ['core', 'Core']] },
    { g: 'run', n: 'Run', items: [['easy', 'Easy'], ['tempo', 'Tempo'], ['intervals', 'Intervals'], ['long', 'Long']] },
    { g: 'recovery', n: 'Recovery', items: [['mobility', 'Mobility'], ['yoga', 'Yoga'], ['sauna', 'Sauna']] },
    { g: 'rest', n: 'Rest', items: [['rest', 'Rest day']] }
  ];
  var LIFTN = {};
  LIFT.forEach(function (g) { g.items.forEach(function (it) { LIFTN[g.g + '.' + it[0]] = { n: it[1], g: g.g }; }); });
  var EFFORT = ['Light', 'Moderate', 'Hard'];
  var MINS = [15, 20, 30, 45, 60, 75, 90, 120];
  var DAYKEY = '~day';
  function cdSess(v) {
    if (!isObj(v) || !Array.isArray(v.k)) return null;
    var k = v.k.filter(function (x) { return LIFTN[x]; });
    if (!k.length) return null;
    return { k: k, e: EFFORT.indexOf(v.e) >= 0 ? v.e : '', m: +v.m > 0 ? Math.round(+v.m) : 0 };
  }
  var cdRestOnly = function (s) { return s.k.every(function (k) { return LIFTN[k].g === 'rest'; }); };
  function cdSessName(s) { return s.k.map(function (k) { return LIFTN[k].n; }).join(' + '); }
  function cdSessions(iso) {
    var day = S.train[iso] || {};
    return Object.keys(day).map(function (id) { var s = cdSess(day[id]); return s && { id: id, s: s }; }).filter(Boolean);
  }

  /* ═══ HABITS ═══
     The six are code rather than data, so a new one always arrives and
     the order is always this one. Yours are appended from their own key. */
  var HABITS = [
    { id: 'train', n: 'Train', k: 'tick', from: ['train', 'run', 'stretch'], hc: '--c-body' },
    { id: 'mind', n: 'Mind', k: 'tick', from: ['read', 'study', 'calm'], hc: '--c-mind' },
    { id: 'steps', n: 'Steps', k: 'num', unit: 'steps', step: 500, max: 30000, marks: [5000, 8000, 10000, 15000], hc: '--c-rest' },
    { id: 'fuel', n: 'Fuel', k: 'num', unit: 'kcal', step: 50, max: 5000, marks: [1800, 2200, 2600, 3000], bump: [300, 600], hc: '--c-work' },
    { id: 'water', n: 'Water', k: 'num', unit: 'L', step: 0.25, max: 6, marks: [1, 2, 3, 4], bump: [0.25, 0.5], hc: '--h-water' },
    { id: 'sleep', n: 'Sleep', k: 'num', unit: 'h', step: 0.25, max: 12, marks: [6, 7, 8, 9], hc: '--h-sleep' }
  ];
  function cdHabits() {
    return HABITS.concat(S.defs.map(function (d) {
      return d.k === 'num'
        ? { id: d.id, n: d.n, k: 'num', unit: d.unit || '', step: 1, max: 100, marks: [], mine: true, hc: '--c-' + CAT[cdKind(d.n)] }
        : { id: d.id, n: d.n, k: 'tick', from: [], mine: true, hc: '--c-' + CAT[cdKind(d.n)] };
    }));
  }
  function cdHabVal(iso, h) { return S.hab[iso] ? S.hab[iso][h.id] : undefined; }
  /* A tick is kept by pressing it, OR by the blocks that feed it, OR —
     for Train — by a session filed that day. One claim, three doors. */
  function cdKeptBy(iso, h) {
    if (h.k !== 'tick') return null;
    if (h.id === 'train' && cdSessions(iso).length) return 'session';
    var b = cdOn(iso).filter(function (x) { return h.from.indexOf(cdKind(x.n)) >= 0 && cdDone(iso, x.id); })[0];
    if (b) return b.n;
    return cdHabVal(iso, h) ? 'you' : null;
  }
  function cdHabOn(iso, h) { return h.k === 'tick' ? !!cdKeptBy(iso, h) : +cdHabVal(iso, h) > 0; }
  function cdFmtNum(v, h) {
    if (h.unit === 'L' || h.unit === 'h') return (Math.round(v * 100) / 100).toString();
    return Math.round(v).toLocaleString('en-GB');
  }
  function cdStreak(h) {
    var d = cdToday(), n = 0;
    if (!cdHabOn(d, h)) d = cdAddDays(d, -1);
    while (cdHabOn(d, h) && n < 999) { n++; d = cdAddDays(d, -1); }
    return n;
  }

  /* ═══ VIEW STATE ═══ */
  var view = 'day';
  var sel = cdToday();
  var monthAt = cdToday().slice(0, 7);

  function cdGo(v) {
    view = v;
    try { sessionStorage.setItem('cad.view', v); } catch (e) {}
    $('cdVDay').hidden = v !== 'day';
    $('cdVHab').hidden = v !== 'hab';
    $('cdVMon').hidden = v !== 'mon';
    $('cdVNote').hidden = v !== 'note';
    document.querySelectorAll('.cd-tab').forEach(function (t) {
      if (t.dataset.v === v) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current');
    });

  }
  function cdPaint() {
    if (view === 'day') cdPaintDay();
    else if (view === 'hab') cdPaintHab();
    else if (view === 'mon') cdPaintMon();
    else cdPaintNotes();
  }
  function cdLongDate(iso, withDay) {
    var d = cdDate(iso);
    return (withDay ? DOWL[cdDow(iso)] + ' ' : '') + d.getDate() + ' ' + MON[d.getMonth()];
  }
  function cdWeekStart(iso) { return cdAddDays(iso, -cdDow(iso)); }
  var CATN = { body: 'Body', mind: 'Mind', work: 'Work', rest: 'Rest', none: 'Other' };
  var f2 = function (v) { return Math.round(v * 100) / 100; };
  var TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  /* How much of a day was kept, as the one word a dot can say. Filled
     for whole, a quieter fill for part, hollow for none — and a day that
     makes no claim (still to come, before the record, or today with
     nothing done YET) is the faint dot, never a hollow one. */
  function cdDayState(iso) {
    var today = cdToday(), t = cdTally(iso);
    if (iso > today) return 'future';
    if (iso < cdFirst() || !t.on) return 'quiet';
    if (t.kept >= t.on) return 'whole';
    if (t.kept) return 'part';
    return iso === today ? 'quiet' : 'none';
  }

  /* ═══ THE BLOCK YOU ARE IN ═══
     Today the screen is about one block: the one running, or the next one
     if nothing is. It is the biggest thing on the screen, the white check
     ticks it, and the one after it sits underneath. Neither is repeated in
     the list below — a thing said twice on one screen is said once too
     many. Any other day there is no clock on it, so the middle is how
     much of that day was kept, and every block is in the list. */
  var heroId = null, thenId = null;
  function cdHeroOf(list, now) {
    /* A block you have ticked is finished, whatever the clock says: you
       press the check because you are done, and an early finish is still
       a finish. So a kept block never holds the middle — the screen moves
       on to what is next, and the kept one goes back into the list, where
       its own dot unticks it. */
    var all = list;
    var live = all.filter(function (b) { return !cdDone(sel, b.id); });
    var run = live.filter(function (b) { return b.e > b.s && now >= b.s && now < b.e; })[0] || null;
    var ahead = live.filter(function (b) { return b !== run && b.s >= now; });
    if (run) return { mode: 'now', b: run, then: ahead[0] || null };
    if (ahead.length) return { mode: 'next', b: ahead[0], then: ahead[1] || null };
    return { mode: all.length ? 'done' : 'empty', b: null, then: null };
  }

  function cdPaintDay() {
    var today = cdToday(), ws = cdWeekStart(today);
    var rb = '';
    for (var i = 0; i < 7; i++) {
      var d = cdAddDays(ws, i), t = cdTally(d), st = cdDayState(d);
      rb += '<button type="button" class="cd-wd' + (d === today ? ' is-today' : '') + '" data-d="' + d + '" data-state="' + st + '" aria-pressed="' + (d === sel) + '"'
        + ' aria-label="' + DOWL[i] + ' ' + cdDate(d).getDate() + ', ' + (d > today ? t.on + ' planned' : t.kept + ' of ' + t.on + ' completed') + '">'
        + '<i></i><span class="cd-wl">' + DOW[i].charAt(0) + '</span></button>';
    }
    $('cdRibbon').innerHTML = rb;

    var now = cdNowMin(), isT = sel === today, open = cdOpenDay(sel), fut = sel > today;
    var list = cdOn(sel), tl = cdTally(sel);
    var hero = isT ? cdHeroOf(list, now) : { mode: fut ? 'plan' : 'back', b: null, then: null };
    var b = hero.b, cap, name, sub;
    var rel = isT ? 'Today' : sel === cdAddDays(today, -1) ? 'Yesterday' : sel === cdAddDays(today, 1) ? 'Tomorrow' : DOWL[cdDow(sel)];
    var at = rel + ' · ' + cdDate(sel).getDate() + ' ' + MON[cdDate(sel).getMonth()].slice(0, 3);
    heroId = b ? b.id : null;
    thenId = hero.then ? hero.then.id : null;
    if (b) {
      var cat = CAT[cdKind(b.n)];
      $('cdHero').style.setProperty('--c', 'var(--c-' + cat + ')');
      cap = (hero.mode === 'now' ? 'Now' : 'Next') + ' · ' + CATN[cat] + ' · ' + cdHM(now);
      name = b.n;
      sub = hero.mode === 'now'
        ? '<b>' + cdLen(b.e - now) + ' left</b> · until ' + cdHM(b.e)
        : '<b>' + (b.s > now ? 'in ' + cdLen(b.s - now) : 'now') + '</b> · at ' + cdHM(b.s);
    } else {
      $('cdHero').style.removeProperty('--c');
      cap = hero.mode === 'done' ? 'Today · ' + cdHM(now) : at;
      if (!tl.on) { name = 'Nothing on'; sub = ''; }
      else if (hero.mode === 'plan') { name = tl.on + (tl.on === 1 ? ' block' : ' blocks'); sub = 'planned · ' + cdLen(tl.mins); }
      else { name = tl.kept + ' of ' + tl.on; sub = 'completed · ' + (hero.mode === 'done' ? 'nothing left today' : cdLen(tl.mins) + ' planned'); }
    }
    $('cdHeroK').textContent = cap;
    $('cdHeroN').textContent = name;
    $('cdHeroN').disabled = !b;
    $('cdHeroN').setAttribute('aria-label', b ? b.n + ', ' + cdHM(b.s) + (b.e > b.s ? ' to ' + cdHM(b.e) : '') + '. Open' : name);
    $('cdHeroS').innerHTML = sub;
    $('cdHeroS').hidden = !sub;
    /* How far through, as a line: the one fact a figure of minutes left
       cannot show you at a glance. Only while a block is running. */
    $('cdBar').hidden = hero.mode !== 'now';
    if (hero.mode === 'now') $('cdBarI').style.width = f2((now - b.s) / (b.e - b.s) * 100) + '%';
    $('cdThen').hidden = !hero.then;
    if (hero.then) {
      $('cdThenN').textContent = hero.then.n + ' at ' + cdHM(hero.then.s);
      $('cdThen').setAttribute('aria-label', 'Then ' + hero.then.n + ' at ' + cdHM(hero.then.s) + '. Open');

    if (b) {
      var done = cdDone(sel, b.id);
      go.style.setProperty('--c', 'var(--c-' + CAT[cdKind(b.n)] + ')');
      go.setAttribute('aria-pressed', done);
      go.setAttribute('aria-label', done ? b.n + ' completed. Untick' : 'Mark ' + b.n + ' completed');
    }

    var ag = $('cdAgenda');
    /* The list is the whole day, the block in the middle and the next one
       included. They were left out as said twice; the list is where you
       read the day top to bottom and tick things, and a day missing its
       two most important rows reads as a list with holes in it. */
    var rest = list;
    if (!list.length) {
      ag.innerHTML = '<li class="cd-empty">Nothing on this day yet.<button type="button" class="cd-link" data-act="add">+ Add a block</button></li>';
      return;
    }
    ag.innerHTML = rest.map(function (x) { return cdRow(x, isT, now, open); }).join('');
  }

  /* A ROW is two press targets, and they are siblings: the dot ticks, the
     rest opens the block. A button inside a button collapses to one press
     while looking exactly right. The dot is drawn at seven pixels and
     owns forty-four. */
  var MISS_AFTER = 30;
  function cdRow(b, isT, now, open) {
    var cat = CAT[cdKind(b.n)], done = cdDone(sel, b.id);
    /* Today a block is only struck as missed half an hour after it ends:
       finishing a little late is not missing it, and a row that crosses
       itself out the minute its end ticks past is the screen grading you
       while you are still doing the thing. Any earlier day is behind you
       whole. */
    var past = (isT && now >= Math.max(b.e, b.s) + MISS_AFTER) || sel < cdToday();
    var time = cdHM(b.s);
    var sess = (S.train[sel] && cdSess(S.train[sel][b.id])) || null;
    var rw = sess ? '<span class="cd-rw" style="--kc:var(--k-' + LIFTN[sess.k[0]].g + ')"> · ' + esc(cdSessName(sess)) + '</span>' : '';
    var cls = 'cd-it' + (done ? ' is-done' : '') + (past ? ' is-past' : '');
    return '<li class="' + cls + '" data-id="' + b.id + '" style="--c:var(--c-' + cat + ')">'
      + '<button type="button" class="cd-dot" data-act="tick" aria-pressed="' + done + '"' + (open ? '' : ' disabled')
      + ' aria-label="' + (done ? 'Completed' : 'Mark completed') + ': ' + esc(b.n) + '"><i></i></button>'
      + '<button type="button" class="cd-rb" data-act="edit" aria-label="' + esc(b.n) + ', ' + cdHM(b.s) + (b.e > b.s ? ' to ' + cdHM(b.e) : '') + '. Open">'
      + '<span class="cd-rn">' + esc(b.n) + rw + (done ? '<span class="cd-tk" aria-hidden="true"></span>' : '') + '</span><span class="cd-rt">' + time + '</span>'
      + (b.p ? '<span class="cd-rs">' + esc(b.p) + '</span>' : '') + '</button></li>';
  }

  function cdTick(id) {
    if (!cdOpenDay(sel)) return;
    var b = S.week.filter(function (x) { return x.id === id; })[0];
    if (!b) return;
    var was = cdDone(sel, id);
    cdSetFlag('log', sel, id, !was);
    if (was && S.train[sel] && S.train[sel][id]) { delete S.train[sel][id]; if (!Object.keys(S.train[sel]).length) delete S.train[sel]; cdSave('train'); }
    cdPaint();
    /* Finishing a training block is the moment to ask what it was. */
    if (!was && TRAINING[cdKind(b.n)]) cdLiftSheet(sel, id, b.n);
  }

  $('cdAgenda').addEventListener('click', function (ev) {
    var btn = ev.target.closest('[data-act]');
    if (!btn) return;
    if (btn.dataset.act === 'add') { cdEdit(null); return; }
    var li = btn.closest('.cd-it');
    if (!li) return;
    if (btn.dataset.act === 'tick') cdTick(li.dataset.id);
    else cdEdit(li.dataset.id);
  });
  /* The check always FINISHES the block in the middle, so it says so and
     offers the way back: the block has just left the middle, and a press
     that moves the screen with no Undo is a press you cannot take back
     from where you are looking. A training block asks what it was
     instead, and that sheet is the answer to the press. */
  /* IT ASKS FIRST. The check is the biggest thing on the screen and sits
     where a thumb rests, so a press on the way to something else was
     finishing a block you were still in. One sheet, two answers; the id
     and the day are taken at the press, so a clock turning over while the
     sheet is up cannot change which block the answer is about. */
  $('cdGo').addEventListener('click', function () {
    var id = heroId, day = sel;
    if (!id) return;
    var b = S.week.filter(function (x) { return x.id === id; })[0];
    if (!b) return;
    var ask = el('div'), foot = el('div', 'cd-foot is-only');
    var no = el('button', 'cd-btn soft', 'Not yet'); no.type = 'button'; no.id = 'cdGoNo'; no.addEventListener('click', cdClose);
    /* A training block's answer opens the session sheet, so the button
       says both halves of what the press does. */
    var train = !!TRAINING[cdKind(b.n)];
    var yes = el('button', 'cd-btn go', train ? 'Completed · log session' : 'Complete'); yes.type = 'button'; yes.id = 'cdGoYes';
    yes.addEventListener('click', function () {
      cdClose();
      sel = day; cdTick(id);
      if (cdDone(day, id) && !train) cdToast('Completed ' + b.n, function () { if (cdDone(day, id)) { sel = day; cdTick(id); } });
    });

    cdSheet('Complete ' + b.n + '?', ask);
  });

  $('cdThen').addEventListener('click', function () { if (thenId) cdEdit(thenId); });
  $('cdRibbon').addEventListener('click', function (ev) {
    var b = ev.target.closest('.cd-wd');
    if (!b) return;
    sel = b.dataset.d;
    $('cdDayPane').scrollTop = 0;
    cdPaintDay();
  });

  /* ═══ THE SENTENCE ═══
     "Gym mon wed fri 6:30 to 8", "walk weekdays 7:45 for 30 mins",
     "read now", "stretch after gym". What it cannot place, it leaves in
     the name — a sentence it does not understand costs nothing. */
  var DAYW = [['monday', 'mon'], ['tuesday', 'tues', 'tue'], ['wednesday', 'wed'], ['thursday', 'thurs', 'thu'], ['friday', 'fri'], ['saturday', 'sat'], ['sunday', 'sun']];
  function cdClock(h, m, mer) {
    h = +h; m = +(m || 0);
    if (mer === 'pm' && h < 12) h += 12;
    if (mer === 'am' && h === 12) h = 0;
    if (h > 23 || m > 59) return null;
    return h * 60 + m;
  }
  function cdParse(text, weekFor) {
    var src = ' ' + String(text || '').toLowerCase().replace(/[.,!]/g, ' ') + ' ';
    var used = src;
    var eat = function (m) { used = used.replace(m, function (x) { return ' '.repeat(x.length); }); };
    var out = { days: [], s: null, e: null, len: null, after: null };
    var m;

    if ((m = used.match(/\b(every ?day|daily)\b/))) { out.days = [0, 1, 2, 3, 4, 5, 6]; eat(m[0]); }
    if ((m = used.match(/\bweekdays?\b/))) { out.days = out.days.concat([0, 1, 2, 3, 4]); eat(m[0]); }
    if ((m = used.match(/\bweekends?\b/))) { out.days = out.days.concat([5, 6]); eat(m[0]); }
    if ((m = used.match(/\btoday\b/))) { out.days.push(cdDow(cdToday())); eat(m[0]); }
    if ((m = used.match(/\btomorrow\b/))) { out.days.push(cdDow(cdAddDays(cdToday(), 1))); eat(m[0]); }
    DAYW.forEach(function (ws, i) {
      var re = new RegExp('\\b(?:on\\s+|every\\s+)?(' + ws.join('|') + ')s?\\b', 'g');
      var hit = used.match(re);
      if (hit) { out.days.push(i); hit.forEach(eat); }
    });
    used = used.replace(/\b(and|&)\b/g, function (x) { return ' '.repeat(x.length); });

    var range = used.match(/\b(?:from\s+|at\s+)?(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\s*(?:-|–|to|until|till)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\b/);
    if (range) {
      var s = cdClock(range[1], range[2], range[3] || (range[6] === 'pm' && +range[1] < +range[4] ? 'pm' : ''));
      var e = cdClock(range[4], range[5], range[6]);

        if (e > s) { out.s = s; out.e = e; eat(range[0]); }

    if ((m = used.match(/\bfor\s+(an?|half an|\d+(?:\.\d+)?)\s*(h|hr|hrs|hour|hours|m|min|mins|minute|minutes)\b/))) {

       is correcting themselves, and the digits are the correction. */
    if (out.s == null) {
      var clk = used.match(/\b(?:at\s+)?(\d{1,2}):(\d{2})\s*(am|pm)?\b/) || used.match(/\b(?:at\s+)?(\d{1,2})()\s*(am|pm)\b/) || used.match(/\bat\s+(\d{1,2})()()\b/);
      if (clk) { var c = cdClock(clk[1], clk[2], clk[3]); if (c != null) { out.s = c; eat(clk[0]); } }
    }
    /* "in an hour", "in half an hour", "in 10 mins": counted from now.
       The words are how people say it, so "an" and "half an" are read
       the way "for" already reads them. Past midnight is refused, not
       clamped: this record is one day a row. */
    if ((m = used.match(/\bin\s+(an?|half an|\d+(?:\.\d+)?)\s*(m|min|mins|minutes?|h|hr|hrs|hours?)\b/))) {
      var iq = m[1] === 'half an' ? 0.5 : /^an?$/.test(m[1]) ? 1 : +m[1];
      var off = Math.round(/^h/.test(m[2]) ? iq * 60 : iq);
      var at = cdNowMin() + off;
