<html lang="en">

<meta name="theme-color" content="#0A0C10" />

<meta name="mobile-web-app-capable" content="yes" />

<style>
/* ═══════════════════════════════════════════════════════════════
   CADENCE — the day as one line of time, lit by the hour you are in.

   Three looks came out before this one, and the fourth was the
   alignment app's own language taken whole — its tokens, its mono
   labels, its dusk under every title — which was reported in one line:
   make your own twist, not a copy. What is kept from it is the premise
   rather than the pieces: a dark ground, colour that arrives as LIGHT
   rather than as paint, and restraint everywhere else.

   What is Cadence's own:
   · THE LIGHT TELLS THE TIME. One glow at the top of the page, and its
     hue is the part of the day you are in — apricot before ten, sky
     until four, rose until half eight, iris through the night. The same
     hue is the one accent: the clock's own mark and the button that
     files. A screen opened at dusk looks like dusk.
   · A FORWARD-LEANING FACE. Archivo in bold italic for the things you
     are looking at — the day, a figure, a title — because a calendar of
     training and routine is about momentum. Inter for what you read.
   · THE BEAT. A day is a row of beats, one per block, lit as each is
     kept — under the title, and in miniature under every date of the
     week. It is the one mark that means "how much of it you kept", at
     two sizes.
   · THE LINE OF TIME. Every block is drawn at its own place on the
     day's span, so the rows fall from left to right, and there is no
     time gutter — the drawing the other app is made of.
   · SAY IT. The add control is the sentence field, pinned at the foot:
     a block is something you type the way you would say it.
   ═══════════════════════════════════════════════════════════════ */
@font-face { font-family: 'Inter'; font-weight: 100 900; font-display: swap;
  src: url('../arc/fonts/Inter.woff2') format('woff2'); }
@font-face { font-family: 'Archivo'; font-style: italic; font-weight: 700; font-display: swap;
  src: url('fonts/Archivo-700i.woff2') format('woff2'); }

:root {
  color-scheme: dark;
  --bg: #0A0C10;
  --ink: #F4F5F7;
  --on: #0A0C10;
  --dim: rgba(244, 245, 247, .72);
  --quiet: rgba(244, 245, 247, .60);
  --tile: rgba(255, 255, 255, .045);
  --tile2: rgba(255, 255, 255, .085);
  --edge: rgba(255, 255, 255, .06);
  --rule: rgba(255, 255, 255, .08);

  /* THE TIDE. Four parts of the day, each a glow and the solid it
     comes from. The solid is light enough that the ground's own colour
     reads on it, so a filled control is --on over --tide at every hour. */
  --tide: #7CC4FF;
  --aura: rgba(79, 168, 255, .30);

  /* Which part of life a block is. Saturated where the tide is soft, so
     the two never read as one system. */
  --c-body: #FF8A5C;
  --c-mind: #A993FF;
  --c-work: #F5C04A;
  --c-rest: #4FD1A5;
  --c-none: #9BA3AD;
  --k-weights: #FF8A5C;
  --k-run: #5CC8F0;
  --k-recovery: #A993FF;
  --k-rest: #9BA3AD;
  --h-water: #5CC8F0;
  --h-sleep: #F28DC0;
  --bad: #FF8F80;

  --sans: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --disp: 'Archivo', 'Inter', system-ui, sans-serif;
  --gut: 18px;
  --inset: 16px;
}
:root[data-tide="dawn"]  { --tide: #FFB27E; --aura: rgba(255, 158, 107, .30); }
:root[data-tide="day"]   { --tide: #7CC4FF; --aura: rgba(79, 168, 255, .30); }
:root[data-tide="dusk"]  { --tide: #FF8FA8; --aura: rgba(255, 111, 145, .30); }
:root[data-tide="night"] { --tide: #A99BFF; --aura: rgba(124, 107, 255, .28); }

*, *::before, *::after { box-sizing: border-box; }
/* Said once, for every element: an author `display` outranks the
   browser's own [hidden] rule, and that has broken a view, a toast and
   an overlay in this repo's other app. One line removes the class. */
[hidden] { display: none !important; }

html { -webkit-text-size-adjust: 100%; }
html, body { height: 100%; background-color: var(--bg); }
body {
  position: fixed; inset: 0; margin: 0; overflow: hidden; overscroll-behavior: none;
  /* The light is ON the page, fixed, and the lists scroll under nothing:
     it sits behind the title and has faded to the ground by the time the
     first row starts, so no row is ever read on it. */
  background-image: radial-gradient(95% 40% at 50% -4%, var(--aura), transparent 100%);
  background-repeat: no-repeat;
  color: var(--ink);
  font: 500 15px/1.4 var(--sans);
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; touch-action: manipulation; }
button:focus-visible { outline: 2px solid var(--tide); outline-offset: 2px; }
.cd-field:focus-visible { outline: 1px solid var(--tide); outline-offset: -1px; }
.cd-row .cd-field:focus-visible { outline: none; }

.cd-app { display: flex; flex-direction: column; height: 100%; max-width: 560px; margin: 0 auto; }

/* ── the nav: four words ── A tab bar of icons is a row you have to
   learn; four words are read once. The one you are on is the ink with a
   drop of the tide under it. */
.cd-nav { flex: none; display: flex; align-items: center; gap: 2px; padding: calc(4px + env(safe-area-inset-top)) 6px 0 8px; }
.cd-tab { position: relative; min-height: 44px; padding: 0 10px; display: flex; align-items: center; font: 600 15px/1 var(--sans); color: var(--quiet); }
.cd-tab::after { content: ""; position: absolute; left: 50%; bottom: 6px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--tide); opacity: 0; }
.cd-tab[aria-current="page"] { color: var(--ink); }
.cd-tab[aria-current="page"]::after { opacity: 1; }
.cd-gear { margin-left: auto; width: 44px; height: 44px; display: grid; place-items: center; color: var(--quiet); }
.cd-gear svg { width: 20px; height: 20px; display: block; }

.cd-main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.cd-main > section { flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* ── a screen's head: straight on the light, no card round it ── */
.cd-head { position: relative; flex: none; padding: 12px var(--gut) 4px; }
.cd-kick { margin: 0; font: 500 13px/1.3 var(--sans); color: var(--dim); font-variant-numeric: tabular-nums; }
.cd-disp { margin: 4px 0 0; font: italic 700 44px/1 var(--disp); letter-spacing: -.01em; }
.cd-sub { margin: 10px 0 0; font: 500 13px/1.3 var(--sans); color: var(--dim); font-variant-numeric: tabular-nums; }

/* THE BEAT: one segment per thing the day asked of you, lit in its own
   colour when kept. */
.cd-beat { display: flex; gap: 4px; margin-top: 14px; }
.cd-beat i { flex: 1; height: 6px; border-radius: 3px; background: var(--tile2); }
.cd-beat i.on { background: var(--bc); }

/* ── the week: seven dates, each with its own small beat ── */
.cd-week { flex: none; display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin: 14px 12px 0; }
.cd-wd { display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 66px; padding: 9px 0 10px; border-radius: 16px; }
.cd-wd-l { font: 600 11px/1 var(--sans); color: var(--quiet); }
.cd-wd-n { font: 600 18px/1 var(--sans); font-variant-numeric: tabular-nums; color: var(--dim); }
.cd-wd-b { display: flex; gap: 2px; width: 26px; }
.cd-wd-b i { flex: 1; height: 3px; border-radius: 2px; background: var(--tile2); }
.cd-wd-b i.on { background: var(--ink); }
.cd-wd.is-today .cd-wd-n { color: var(--tide); }
.cd-wd[aria-pressed="true"] { background: var(--tile2); }
.cd-wd[aria-pressed="true"] .cd-wd-n { color: var(--ink); }
.cd-wd.is-today[aria-pressed="true"] .cd-wd-n { color: var(--tide); }

/* ── the scale: the hours every row is drawn against ── */
.cd-scale { position: relative; flex: none; height: 26px; margin: 12px calc(var(--gut) + var(--inset)) -4px; }
.cd-scale span { position: absolute; bottom: 6px; transform: translateX(-50%); font: 600 11px/1 var(--sans); color: var(--quiet); font-variant-numeric: tabular-nums; }
.cd-scale span.is-first { transform: none; }
.cd-scale span.is-last { transform: translateX(-100%); }
.cd-scale b { position: absolute; bottom: 2px; z-index: 1; transform: translateX(-50%); padding: 4px 7px; border-radius: 8px; font: 700 11px/1 var(--sans); background: var(--tide); color: var(--on); font-variant-numeric: tabular-nums; }

.cd-pane {
  flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain;
  padding: 12px var(--gut) 28px; scrollbar-width: none;
  -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 10px, #000 calc(100% - 28px), transparent 100%);
          mask-image: linear-gradient(180deg, transparent 0, #000 10px, #000 calc(100% - 28px), transparent 100%);
}
.cd-pane::-webkit-scrollbar { display: none; }

/* ── the day: a tile per block, each carrying the whole span ── */
.cd-agenda { position: relative; list-style: none; margin: 0; padding: 0; }
.cd-it { position: relative; margin-bottom: 8px; border-radius: 18px; background: var(--tile); box-shadow: inset 0 1px 0 var(--edge); }
.cd-tk-b { display: block; width: 100%; padding: 14px var(--inset) 14px; }
.cd-tk-n, .cd-tk-m, .cd-tk-w { margin-right: 52px; }
.cd-tk-n { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 600 16px/1.3 var(--sans); }
.cd-tk-m { display: block; margin-top: 2px; font: 500 13px/1.35 var(--sans); color: var(--dim); font-variant-numeric: tabular-nums; }
.cd-tk-m i { font-style: normal; color: var(--ink); }
.cd-tk-w { display: block; margin-top: 4px; font: 600 13px/1.35 var(--sans); color: var(--kc, var(--dim)); }
.cd-track { position: relative; display: block; height: 8px; margin-top: 12px; }
.cd-track::before { content: ""; position: absolute; left: 0; right: 0; top: 3px; height: 2px; border-radius: 1px; background: var(--rule); }
.cd-seg { position: absolute; top: 1px; height: 6px; min-width: 6px; border-radius: 3px; background: color-mix(in srgb, var(--cat) 62%, transparent); }
.cd-seg.is-dot { width: 8px; min-width: 0; height: 8px; top: 0; margin-left: -4px; border-radius: 50%; }
.cd-seg > i { display: block; height: 100%; border-radius: inherit; background: var(--cat); }
.cd-it.is-done .cd-seg { background: var(--cat); box-shadow: 0 0 12px color-mix(in srgb, var(--cat) 55%, transparent); }
/* Behind you and not kept is the flat neutral, never a red. Every state
   of the bar is a graphic held to 3:1, which is why it is not fainter. */
.cd-it.is-past:not(.is-done) .cd-seg { background: rgba(244, 245, 247, .38); }
.cd-it.is-off .cd-seg { display: none; }
.cd-it.is-off .cd-tk-n { color: var(--quiet); text-decoration: line-through; }
.cd-it.is-past .cd-tk-n { color: var(--dim); }
/* The block happening now is ringed in the hour's own colour. */
.cd-it.is-now { background: var(--tile2); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--tide) 55%, transparent); }

/* The clock is a mark on every line of time, never one line down the
   page — a single rule crossed every name at the same x. */
.cd-tnow { position: absolute; top: -4px; width: 2px; height: 16px; margin-left: -1px; border-radius: 1px; background: var(--tide); pointer-events: none; }

/* THE STATE IS A FILL IN THE BLOCK'S OWN COLOUR. Not yet is a tile with
   the tick drawn quiet; kept is the colour with the ground's ink on it. */
.cd-stamp { position: absolute; top: 12px; right: 12px; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 14px; background: var(--tile2); color: var(--quiet); }
.cd-stamp svg { width: 20px; height: 20px; display: block; }
.cd-stamp[aria-pressed="true"] { background: var(--cat); color: var(--on); }
.cd-stamp:disabled { cursor: default; opacity: .38; }
.cd-it.is-off .cd-stamp { visibility: hidden; }

/* Time nobody has claimed, drawn as a dimension line across exactly the
   stretch it covers, and measured beside it rather than over it. */
.cd-gap { height: 26px; margin: -2px 0 6px; padding: 0 var(--inset); }
.cd-gap-in { position: relative; display: block; height: 100%; }
.cd-gap b { position: absolute; top: 12px; height: 1px; background: var(--quiet); }
.cd-gap b::before, .cd-gap b::after { content: ""; position: absolute; top: -3px; width: 1px; height: 7px; background: var(--quiet); }
.cd-gap b::before { left: 0; }
.cd-gap b::after { right: 0; }
.cd-gap p { position: absolute; top: 6px; margin: 0; white-space: nowrap; font: 600 11px/1 var(--sans); color: var(--quiet); }

.cd-empty { padding: 24px 2px; list-style: none; font: 500 16px/1.45 var(--sans); color: var(--dim); }
.cd-link { min-height: 44px; display: inline-flex; align-items: center; font: 600 15px/1 var(--sans); color: var(--tide); }
.cd-empty .cd-link { display: flex; margin-top: 6px; }
.cd-lbl { margin: 22px 2px 10px; font: 600 13px/1.3 var(--sans); color: var(--quiet); }

/* ── say it: the add control is the sentence field, at the foot ── */
.cd-say-bar { flex: none; padding: 8px var(--gut) calc(10px + env(safe-area-inset-bottom)); }
.cd-sayb { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 54px; padding: 0 18px 0 11px; border-radius: 27px; background: var(--tile2); box-shadow: inset 0 1px 0 var(--edge); color: var(--quiet); font: 500 15px/1.2 var(--sans); }
.cd-sayb i { flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--tide); color: var(--on); font-style: normal; }
.cd-sayb i svg { width: 16px; height: 16px; display: block; }
.cd-sayb span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ── habits: two across, each with its fortnight as beats ── */
.cd-hb { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cd-hr { position: relative; border-radius: 18px; background: var(--tile); box-shadow: inset 0 1px 0 var(--edge); }
.cd-hr-b { display: flex; flex-direction: column; width: 100%; height: 100%; min-height: 138px; padding: 14px 14px 12px; }
.cd-hr-n { display: flex; align-items: center; gap: 8px; margin-right: 30px; font: 600 14px/1.25 var(--sans); }
.cd-hr-n::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--hc); }
.cd-hr-v { display: block; margin-top: 12px; font: italic 700 28px/1 var(--disp); font-variant-numeric: tabular-nums; white-space: nowrap; }
.cd-hr-v small { margin-left: 5px; font: 600 12px/1 var(--sans); color: var(--quiet); }
.cd-hr-v.is-nil { color: var(--quiet); }
.cd-hr-s { display: block; margin-top: 6px; font: 500 12px/1.3 var(--sans); color: var(--quiet); }
.cd-tape { display: flex; align-items: flex-end; gap: 3px; height: 18px; margin-top: auto; padding-top: 12px; }
.cd-tape i { flex: 1; height: 3px; border-radius: 2px; background: var(--tile2); }
.cd-tape i.on { background: var(--hc); }
.cd-hr-more { position: absolute; top: 4px; right: 4px; width: 44px; height: 44px; display: grid; place-items: center; color: var(--quiet); }
.cd-hr-more svg { width: 14px; height: 14px; }
.cd-pane > .cd-link { margin-top: 10px; }

/* ── month: a disc a day, as large as the day was kept ── */
.cd-mhead { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.cd-mnav { display: flex; gap: 6px; padding-bottom: 2px; }
.cd-mnav button { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--ink); background: var(--tile2); }
.cd-mnav button:disabled { color: rgba(244, 245, 247, .3); background: transparent; cursor: default; }
.cd-mnav svg { width: 16px; height: 16px; }
.cd-dows { display: grid; grid-template-columns: repeat(7, 1fr); padding: 8px 0 8px; text-align: center; font: 600 11px/1 var(--sans); color: var(--quiet); }
.cd-mgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cd-mc { position: relative; min-height: 44px; aspect-ratio: 1; display: grid; place-items: center; }
.cd-mc b { position: relative; z-index: 1; font: 600 14px/1 var(--sans); font-variant-numeric: tabular-nums; }
.cd-mc i { position: absolute; left: 50%; top: 50%; width: 0; height: 0; border-radius: 50%; transform: translate(-50%, -50%); }
/* Four steps and a whole one: the disc grows with the share kept, and
   only a whole day is solid, which is the one square the figure turns
   dark on. Steps rather than a ramp, so the figure holds 4.5:1 on each. */
.cd-mc.is-l1 i { width: 20px; height: 20px; background: rgba(244, 245, 247, .14); }
.cd-mc.is-l2 i { width: 28px; height: 28px; background: rgba(244, 245, 247, .22); }
.cd-mc.is-l3 i { width: 36px; height: 36px; background: rgba(244, 245, 247, .32); }
.cd-mc.is-l4 i { width: 40px; height: 40px; background: var(--ink); box-shadow: 0 0 16px rgba(244, 245, 247, .22); }
.cd-mc.is-l4 b { color: var(--on); }
.cd-mc.is-quiet b, .cd-mc.is-future b { color: var(--quiet); }
.cd-mc.is-today::after { content: ""; position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: inset 0 0 0 2px var(--tide); }
.cd-mc em { position: absolute; top: 3px; right: 3px; width: 6px; height: 6px; border-radius: 50%; background: var(--kc, transparent); }
.cd-mc.is-pad { visibility: hidden; }
.cd-legend { display: flex; flex-wrap: wrap; gap: 18px; margin: 18px 2px 0; font: 600 12px/1 var(--sans); color: var(--quiet); }
.cd-legend span { display: inline-flex; align-items: center; gap: 7px; }
.cd-legend i { width: 7px; height: 7px; border-radius: 50%; background: var(--kc); }

/* ── training: figures on tiles, the weeks as columns ── */
.cd-figs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.cd-figs div { padding: 14px; border-radius: 18px; background: var(--tile); box-shadow: inset 0 1px 0 var(--edge); }
.cd-figs b { display: block; font: italic 700 30px/1 var(--disp); font-variant-numeric: tabular-nums; }
.cd-figs span { display: block; margin-top: 8px; font: 600 12px/1.3 var(--sans); color: var(--quiet); }
.cd-weeks { display: flex; align-items: flex-end; gap: 6px; height: 96px; }
.cd-weeks i { flex: 1; min-height: 3px; border-radius: 6px 6px 2px 2px; background: rgba(244, 245, 247, .24); }
.cd-weeks i.is-zero { background: var(--tile2); }
.cd-weeks i.is-this { background: var(--tide); }
.cd-wax { display: flex; justify-content: space-between; margin-top: 10px; font: 600 11px/1 var(--sans); color: var(--quiet); }
.cd-kinds, .cd-recent, .cd-day-l { list-style: none; margin: 0; padding: 4px 16px; border-radius: 18px; background: var(--tile); box-shadow: inset 0 1px 0 var(--edge); }
.cd-kinds li { display: grid; grid-template-columns: 1fr auto; gap: 8px 10px; padding: 12px 0; }
.cd-kinds li + li, .cd-recent li + li, .cd-day-l li + li { box-shadow: inset 0 1px 0 var(--rule); }
.cd-kinds b, .cd-recent b, .cd-day-l b { font: 600 15px/1.3 var(--sans); }
.cd-kinds span, .cd-recent span, .cd-day-l span, .cd-recent time { font: 500 13px/1.3 var(--sans); color: var(--quiet); font-variant-numeric: tabular-nums; }
.cd-kinds span, .cd-recent span, .cd-day-l span { text-align: right; }
.cd-kinds em { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--tile2); overflow: hidden; }
.cd-kinds em i { display: block; height: 100%; border-radius: 2px; background: var(--kc, var(--ink)); }
.cd-recent li { display: grid; grid-template-columns: 54px 1fr auto; gap: 10px; align-items: baseline; padding: 12px 0; }

/* ── the sheet ── */
.cd-scrim { position: fixed; inset: 0; z-index: 40; background: rgba(4, 5, 8, .64); opacity: 0; transition: opacity .2s; }
.cd-scrim.is-open { opacity: 1; }
.cd-sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  max-width: 560px; max-height: 90dvh; margin: 0 auto; overflow-y: auto; overflow-x: hidden;
  padding: 0 var(--gut) calc(env(safe-area-inset-bottom) + 16px);
  background: #12151B; border-radius: 28px 28px 0 0;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .07), 0 -24px 60px rgba(0, 0, 0, .5);
  transform: translateY(100%); transition: transform .28s cubic-bezier(.2, .8, .2, 1);
}
.cd-sheet.is-open { transform: none; }
.cd-sh-hd { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 22px 0 12px 2px; background: #12151B; }
.cd-sh-hd::before { content: ""; position: absolute; left: 50%; top: 8px; width: 36px; height: 4px; margin-left: -18px; border-radius: 2px; background: rgba(244, 245, 247, .18); }
.cd-sh-hd h2 { margin: 0; font: italic 700 26px/1.1 var(--disp); }
.cd-x { flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--tile2); color: var(--ink); }
.cd-x svg { width: 18px; height: 18px; display: block; }
.cd-foot { position: sticky; bottom: calc(-16px - env(safe-area-inset-bottom)); z-index: 2; display: flex; gap: 10px; margin-top: 22px; padding: 12px 0 16px; background: #12151B; }

.cd-btn { flex: 1; min-height: 52px; padding: 0 18px; border-radius: 16px; text-align: center; font: 600 15px/1 var(--sans); color: var(--ink); background: var(--tile2); }
.cd-btn.go { background: var(--tide); color: var(--on); }
.cd-btn.go:disabled { opacity: .45; cursor: default; }
.cd-btn.warn { color: var(--bad); background: rgba(255, 143, 128, .1); }

.cd-field {
  width: 100%; min-height: 50px; padding: 13px 16px; border: 0; border-radius: 14px;
  font: 500 16px/1.3 var(--sans); color: var(--ink); background: var(--tile2);
  -webkit-appearance: none; appearance: none;
}
.cd-field::placeholder { color: rgba(244, 245, 247, .42); }
textarea.cd-field { min-height: 110px; resize: vertical; }
.cd-say { min-height: 60px; font-size: 18px; }
.cd-prev { min-height: 18px; margin: 12px 2px 0; font: 500 13px/1.5 var(--sans); color: var(--quiet); font-variant-numeric: tabular-nums; }
.cd-prev b { font-weight: 700; color: var(--ink); }
.cd-prev.is-need { color: var(--tide); }

.cd-rows { border-radius: 16px; background: var(--tile); overflow: hidden; }
.cd-row { display: grid; grid-template-columns: 96px 1fr; align-items: center; gap: 10px; min-height: 54px; padding: 4px 14px; }
.cd-row + .cd-row { box-shadow: inset 0 1px 0 var(--rule); }
.cd-row > span { font: 600 13px/1.3 var(--sans); color: var(--quiet); }
.cd-row .cd-field { min-height: 44px; padding: 10px 0; background: none; border-radius: 0; }

.cd-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.cd-chip { min-width: 44px; min-height: 44px; padding: 0 16px; border-radius: 12px; text-align: center; font: 600 14px/1 var(--sans); color: var(--dim); background: var(--tile2); }
.cd-chip[aria-pressed="true"] { background: var(--ink); color: var(--on); }
.cd-chip.kc[aria-pressed="true"] { background: var(--kc); color: var(--on); }
.cd-chips.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cd-chips.days .cd-chip { padding: 0; aspect-ratio: 1; }

.cd-range { width: 100%; height: 44px; margin: 0; background: none; -webkit-appearance: none; appearance: none; }
.cd-range::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: rgba(244, 245, 247, .18); }
.cd-range::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 22px; height: 22px; margin-top: -9px; border-radius: 50%; background: var(--tide); box-shadow: 0 4px 12px rgba(0, 0, 0, .45); }
.cd-range::-moz-range-track { height: 4px; border-radius: 2px; background: rgba(244, 245, 247, .18); }
.cd-range::-moz-range-thumb { width: 22px; height: 22px; border: 0; border-radius: 50%; background: var(--tide); box-shadow: 0 4px 12px rgba(0, 0, 0, .45); }
.cd-len { display: block; margin-top: -4px; font: 500 13px/1.3 var(--sans); color: var(--quiet); font-variant-numeric: tabular-nums; }

.cd-toggle { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 54px; padding: 0 14px; font: 500 16px/1.2 var(--sans); }
.cd-toggle + .cd-toggle { box-shadow: inset 0 1px 0 var(--rule); }
.cd-toggle:disabled { color: var(--quiet); cursor: default; }
.cd-toggle i { position: relative; flex: none; width: 50px; height: 30px; border-radius: 15px; background: var(--tile2); transition: background .15s; }
.cd-toggle i::after { content: ""; position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--ink); transition: left .15s; }
.cd-toggle[aria-pressed="true"] i { background: var(--tide); }
.cd-toggle[aria-pressed="true"] i::after { left: 23px; }

.cd-grp { margin-bottom: 4px; }
.cd-grp h3 { margin: 20px 2px 10px; font: 600 13px/1.3 var(--sans); color: var(--kc, var(--quiet)); }

.cd-num { margin: 10px 0 2px; text-align: center; font: italic 700 60px/1 var(--disp); font-variant-numeric: tabular-nums; }
.cd-num small { margin-left: 6px; font: 600 14px/1 var(--sans); color: var(--quiet); }
.cd-numcap { margin: 0 0 10px; text-align: center; font: 500 13px/1.3 var(--sans); color: var(--quiet); }

.cd-day-l li { display: grid; grid-template-columns: 8px 1fr auto; align-items: center; gap: 12px; padding: 12px 0; }
.cd-day-l li > i { width: 8px; height: 8px; border-radius: 50%; background: var(--cat, var(--quiet)); }
.cd-note { margin: 12px 2px 0; font: 500 14px/1.5 var(--sans); color: var(--dim); }
.cd-cap { margin: 0 2px 16px; font: 500 13px/1.3 var(--sans); color: var(--dim); }

/* ── toast ── */
.cd-toast {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 84px); z-index: 60;
  display: flex; align-items: center; gap: 6px; max-width: calc(100vw - 32px);
  padding: 4px 4px 4px 18px; border-radius: 16px;
  font: 600 14px/1.3 var(--sans); background: #1F232C; color: var(--ink);
  box-shadow: 0 14px 30px -12px rgba(0, 0, 0, .7); transform: translateX(-50%);
}
.cd-toast button { min-height: 40px; padding: 0 14px; font: 700 14px/1 var(--sans); color: var(--tide); }

@media (prefers-reduced-motion: reduce) {
  .cd-sheet, .cd-scrim, .cd-toggle i, .cd-toggle i::after { transition: none; }
}
</style>
</head>
<body>
<div class="cd-app">
  <nav class="cd-nav" aria-label="Views">
    <button class="cd-tab" data-v="day" type="button">Day</button>

            <button id="cdMonN" type="button" aria-label="Next month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  /* ═══ STORE ═══
     Everything lives in this browser. Each record is its own key, so a
     damaged one costs itself and nothing beside it. */
  var K = {
    week: 'cad.week.v1', log: 'cad.log.v1', off: 'cad.off.v1',
    hab: 'cad.hab.v1', train: 'cad.train.v1', defs: 'cad.defs.v1'
  };
  /* There is one face now, so the key that chose between two is swept
     rather than left: a preference for a control that no longer exists
     is a second record of a decision nothing can act on. */
  try { localStorage.removeItem('cad.mode.v1'); } catch (e) {}
  function cdRead(k, dflt) {
    try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? dflt : v; }
    catch (e) { return dflt; }
  }
  function cdWrite(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { cdToast('Could not save — storage is full.'); } }
  var isObj = function (v) { return v && typeof v === 'object' && !Array.isArray(v); };

  /* ═══ DATES ═══ Monday is day 0. Dates are local ISO strings. */
  function cdISO(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function cdDate(iso) { var p = iso.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function cdDow(iso) { return (cdDate(iso).getDay() + 6) % 7; }
  function cdAddDays(iso, n) { var d = cdDate(iso); d.setDate(d.getDate() + n); return cdISO(d); }
  function cdToday() { return cdISO(new Date()); }
  function cdNowMin() { var d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
  /* Counted between DATES, so a daylight-saving hour cannot round a day away. */
  function cdDiff(a, b) { return Math.round((Date.UTC.apply(null, dparts(a)) - Date.UTC.apply(null, dparts(b))) / 864e5); }
  function dparts(iso) { var p = iso.split('-'); return [+p[0], +p[1] - 1, +p[2]]; }
  var DOW = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  var DOWL = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
  var MON = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  function cdHM(m) { m = Math.max(0, Math.min(1439, Math.round(m))); return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }
  function cdLen(m) {
    if (!(m > 0)) return 'a moment';
    var h = Math.floor(m / 60), r = m % 60;
    return h ? (r ? h + 'h ' + r + 'm' : h + 'h') : r + 'm';
  }
  /* A block can be ticked on the day and on the two behind it. Further
     back is a record you would be rewriting, and ahead has not happened. */
  function cdOpenDay(iso) { var d = cdDiff(cdToday(), iso); return d >= 0 && d <= 2; }
  /* THE TIDE: which part of the day it is. Five in the morning is dawn,
     ten is day, four is dusk and half past eight is night — the hours the
     light outside actually turns, give or take a season. */
  function cdTide(m) { return m < 300 ? 'night' : m < 600 ? 'dawn' : m < 960 ? 'day' : m < 1230 ? 'dusk' : 'night'; }
  function cdSetTide() { document.documentElement.dataset.tide = cdTide(cdNowMin()); }

  /* ═══ WHAT A BLOCK IS ═══
     One table decides a block's part of life and whether finishing it
     asks what you trained. There is no glyph: a row is its name, its
     place on the line of time, and one colour. First hit wins, so the longer
     phrase is always listed before the word inside it. */
  var KW = [
    ['wake', /\b(wake up|wake|rise|alarm)\b/],
    ['run', /\b(run|running|jog|tempo|intervals|5k|10k)\b/],
    ['train', /\b(work out|workout|gym|train|training|lift|lifting|weights|push day|pull day|leg day|legs|upper|lower|full body|crossfit|hiit|pilates|boxing|strength)\b/],
    ['stretch', /\b(stretch|stretching|yoga|mobility|recovery|sauna|plunge)\b/],
    ['walk', /\b(walk the dog|walk|hike|steps)\b/],
    ['read', /\b(read|reading|book)\b/],
    ['study', /\b(study|learn|course|class|lecture|revise|practice)\b/],
    ['calm', /\b(meditate|meditation|breathe|breathwork|journal|pray)\b/],
    ['chart', /\b(trade|trading|chart|charting|market|markets)\b/],
    ['move', /\b(commute|drive|bus|travel|flight|school run)\b/],
    ['work', /\b(deep work|work|office|shift|meeting|emails?|call|admin|focus)\b/],
    ['eat', /\b(meal prep|eat|lunch|breakfast|dinner|meal|cook|snack)\b/],
    ['coffee', /\b(coffee|tea)\b/],
    ['sleep', /\b(wind down|sleep|bed|nap)\b/]
  ];
  var CAT = { train: 'body', run: 'body', stretch: 'body', walk: 'body', read: 'mind', study: 'mind', calm: 'mind', chart: 'work', move: 'work', work: 'work', wake: 'rest', eat: 'rest', coffee: 'rest', sleep: 'rest', dot: 'none' };
  var TRAINING = { train: 1, run: 1, stretch: 1 };
  function cdKind(name) {
    var s = String(name || '').toLowerCase();
    for (var i = 0; i < KW.length; i++) if (KW[i][1].test(s)) return KW[i][0];
    return 'dot';
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  /* ═══ THE WEEK ═══ a template: every Monday is the same shape. */
  var SEED = [
    ['Wake up', [0, 1, 2, 3, 4, 5, 6], 420, 420],
    ['Gym', [0, 2, 4], 450, 510],
    ['Easy run', [1, 3], 450, 495],
    ['Deep work', [0, 1, 2, 3, 4], 540, 720],
    ['Lunch', [0, 1, 2, 3, 4], 750, 795],
    ['Emails and calls', [0, 1, 2, 3, 4], 840, 900],
    ['Long walk', [5, 6], 600, 690],
    ['Meal prep', [6], 960, 1020],
    ['Read', [0, 1, 2, 3, 4, 5, 6], 1290, 1320],
    ['Wind down', [0, 1, 2, 3, 4, 5, 6], 1350, 1350]
  ];
  var idc = 0;
  function cdId() { return 'b' + Date.now().toString(36) + (idc++).toString(36); }
  /* The shape of a block is written HERE and every writer goes through
     it, so a block made by the parser and one made by hand cannot come
     out with different fields. */
  function cdBlock(o) {
    var s = Math.max(0, Math.min(1439, Math.round(+o.s || 0)));
    var e = Math.max(s, Math.min(1440, Math.round(+o.e || s)));
    var d = (Array.isArray(o.d) ? o.d : []).filter(function (x) { return x >= 0 && x <= 6; });
    return { id: typeof o.id === 'string' && o.id ? o.id : cdId(), n: String(o.n || '').slice(0, 60) || 'Block', d: d.filter(function (x, i) { return d.indexOf(x) === i; }).sort(), s: s, e: e, p: String(o.p || '').slice(0, 40) };
  }
  function cdLoadWeek() {
    var raw = cdRead(K.week, null);
    if (!Array.isArray(raw)) {
      var w = SEED.map(function (r, i) { return cdBlock({ id: 's' + i, n: r[0], d: r[1], s: r[2], e: r[3] }); });
      cdWrite(K.week, w);
      return w;
    }
    /* Repaired, not discarded, and the repair is written back so it is
       a fact about the record rather than about this page view. */
    var clean = raw.filter(isObj).map(cdBlock).filter(function (b) { return b.d.length; });
    if (JSON.stringify(clean) !== JSON.stringify(raw)) cdWrite(K.week, clean);
    return clean;
  }
  function cdLoadMap(k) {
    var raw = cdRead(k, {});
    if (!isObj(raw)) { cdWrite(k, {}); return {}; }
    var out = {}, bad = false;
    Object.keys(raw).forEach(function (d) {
      if (/^\d{4}-\d{2}-\d{2}$/.test(d) && isObj(raw[d])) out[d] = raw[d]; else bad = true;
    });
    if (bad) cdWrite(k, out);
    return out;
  }

  var S = {
    week: cdLoadWeek(),
    log: cdLoadMap(K.log),
    off: cdLoadMap(K.off),
    hab: cdLoadMap(K.hab),
    train: cdLoadMap(K.train),
    defs: (function () {
      var r = cdRead(K.defs, []);
      return Array.isArray(r) ? r.filter(function (x) { return isObj(x) && x.id && x.n; }) : [];
    })()
  };
  function cdSave(which) { cdWrite(K[which], S[which]); }

  function cdOn(iso) {
    var dw = cdDow(iso);
    return S.week.filter(function (b) { return b.d.indexOf(dw) >= 0; })
      .sort(function (a, b) { return a.s - b.s || a.e - b.e || (a.n < b.n ? -1 : 1); });
  }
  var cdDone = function (iso, id) { return !!(S.log[iso] && S.log[iso][id]); };
  var cdIsOff = function (iso, id) { return !!(S.off[iso] && S.off[iso][id]); };
  function cdSetFlag(map, iso, id, on) {
    var m = S[map];
    if (on) { (m[iso] = m[iso] || {})[id] = 1; }
    else if (m[iso]) { delete m[iso][id]; if (!Object.keys(m[iso]).length) delete m[iso]; }
    cdSave(map);
  }
  function cdTally(iso) {
    var on = cdOn(iso).filter(function (b) { return !cdIsOff(iso, b.id); });
    var kept = on.filter(function (b) { return cdDone(iso, b.id); }).length;
    var mins = on.reduce(function (t, b) { return t + (b.e - b.s); }, 0);
    return { on: on.length, kept: kept, mins: mins };
  }
  /* The record begins at the first thing you ever logged. A day before
     that is not a day you missed. */
  function cdFirst() {
    var ks = [].concat(Object.keys(S.log), Object.keys(S.hab), Object.keys(S.train)).sort();
    return ks[0] || cdToday();
  }

  /* ═══ TRAINING ═══ */
  var LIFT = [
    { g: 'weights', n: 'Weights', items: [['push', 'Push'], ['pull', 'Pull'], ['legs', 'Legs'], ['upper', 'Upper'], ['lower', 'Lower'], ['full', 'Full body'], ['core', 'Core']] },
    { g: 'run', n: 'Run', items: [['easy', 'Easy'], ['tempo', 'Tempo'], ['intervals', 'Intervals'], ['long', 'Long']] },
    { g: 'recovery', n: 'Recovery', items: [['mobility', 'Mobility'], ['yoga', 'Yoga'], ['sauna', 'Sauna']] },
    { g: 'rest', n: 'Rest', items: [['rest', 'Rest day']] }
  ];
  var LIFTN = {};
  LIFT.forEach(function (g) { g.items.forEach(function (it) { LIFTN[g.g + '.' + it[0]] = { n: it[1], g: g.g }; }); });
  var EFFORT = ['Light', 'Moderate', 'Hard'];
  var MINS = [15, 20, 30, 45, 60, 75, 90, 120];
  var DAYKEY = '~day';
  function cdSess(v) {
    if (!isObj(v) || !Array.isArray(v.k)) return null;
    var k = v.k.filter(function (x) { return LIFTN[x]; });
    if (!k.length) return null;
    return { k: k, e: EFFORT.indexOf(v.e) >= 0 ? v.e : '', m: +v.m > 0 ? Math.round(+v.m) : 0 };
  }
  var cdRestOnly = function (s) { return s.k.every(function (k) { return LIFTN[k].g === 'rest'; }); };
  function cdSessName(s) { return s.k.map(function (k) { return LIFTN[k].n; }).join(' + '); }
  function cdSessions(iso) {
    var day = S.train[iso] || {};
    return Object.keys(day).map(function (id) { var s = cdSess(day[id]); return s && { id: id, s: s }; }).filter(Boolean);
  }

  /* ═══ HABITS ═══
     The six are code rather than data, so a new one always arrives and
     the order is always this one. Yours are appended from their own key. */
  var HABITS = [
    { id: 'train', n: 'Train', k: 'tick', from: ['train', 'run', 'stretch'], hc: '--c-body' },
    { id: 'mind', n: 'Mind', k: 'tick', from: ['read', 'study', 'calm'], hc: '--c-mind' },
    { id: 'steps', n: 'Steps', k: 'num', unit: 'steps', step: 500, max: 30000, marks: [5000, 8000, 10000, 15000], hc: '--c-rest' },
    { id: 'fuel', n: 'Fuel', k: 'num', unit: 'kcal', step: 50, max: 5000, marks: [1800, 2200, 2600, 3000], bump: [300, 600], hc: '--c-work' },
    { id: 'water', n: 'Water', k: 'num', unit: 'L', step: 0.25, max: 6, marks: [1, 2, 3, 4], bump: [0.25, 0.5], hc: '--h-water' },
    { id: 'sleep', n: 'Sleep', k: 'num', unit: 'h', step: 0.25, max: 12, marks: [6, 7, 8, 9], hc: '--h-sleep' }
  ];
  function cdHabits() {
    return HABITS.concat(S.defs.map(function (d) {
      return d.k === 'num'
        ? { id: d.id, n: d.n, k: 'num', unit: d.unit || '', step: 1, max: 100, marks: [], mine: true, hc: '--c-' + CAT[cdKind(d.n)] }
        : { id: d.id, n: d.n, k: 'tick', from: [], mine: true, hc: '--c-' + CAT[cdKind(d.n)] };
    }));
  }
  function cdHabVal(iso, h) { return S.hab[iso] ? S.hab[iso][h.id] : undefined; }
  /* A tick is kept by pressing it, OR by the blocks that feed it, OR —
     for Train — by a session filed that day. One claim, three doors. */
  function cdKeptBy(iso, h) {
    if (h.k !== 'tick') return null;
    if (h.id === 'train' && cdSessions(iso).length) return 'session';
    var b = cdOn(iso).filter(function (x) { return h.from.indexOf(cdKind(x.n)) >= 0 && cdDone(iso, x.id); })[0];
    if (b) return b.n;
    return cdHabVal(iso, h) ? 'you' : null;
  }
  function cdHabOn(iso, h) { return h.k === 'tick' ? !!cdKeptBy(iso, h) : +cdHabVal(iso, h) > 0; }
  function cdFmtNum(v, h) {
    if (h.unit === 'L' || h.unit === 'h') return (Math.round(v * 100) / 100).toString();
    return Math.round(v).toLocaleString('en-GB');
  }
  function cdStreak(h) {
    var d = cdToday(), n = 0;
    if (!cdHabOn(d, h)) d = cdAddDays(d, -1);
    while (cdHabOn(d, h) && n < 999) { n++; d = cdAddDays(d, -1); }
    return n;
  }

  /* ═══ VIEW STATE ═══ */
  var view = 'day';
  var sel = cdToday();
  var monthAt = cdToday().slice(0, 7);

  function cdGo(v) {
    view = v;
    try { sessionStorage.setItem('cad.view', v); } catch (e) {}
    $('cdVDay').hidden = v !== 'day';
    $('cdVHab').hidden = v !== 'hab';
    $('cdVMon').hidden = v !== 'mon';
    $('cdVLift').hidden = v !== 'lift';
    document.querySelectorAll('.cd-tab').forEach(function (t) {
      if (t.dataset.v === v) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current');
    });
    document.querySelectorAll('.cd-pane').forEach(function (p) { p.scrollTop = 0; });
    cdPaint();
  }
  function cdPaint() {
    cdSetTide();
    if (view === 'day') cdPaintDay();
    else if (view === 'hab') cdPaintHab();
    else if (view === 'mon') cdPaintMon();
    else cdPaintLift();
  }
  function cdLongDate(iso, withDay) {
    var d = cdDate(iso);
    return (withDay ? DOWL[cdDow(iso)] + ' ' : '') + d.getDate() + ' ' + MON[d.getMonth()];
  }

  /* ═══ DAY ═══
     One line of time, drawn once per block. The span runs from the hour
     before the first block to the hour after the last — never midnight to
     midnight, which would spend half the width on the night — and on
     today it also holds the clock, so the now line cannot be parked off
     either end. Four hours at least, or a day with one block on it is a
     single bar across the whole width. */
  function cdWeekStart(iso) { return cdAddDays(iso, -cdDow(iso)); }
  function cdSpan(list, isT, now) {
    var a = 1440, b = 0;
    list.forEach(function (x) { a = Math.min(a, x.s); b = Math.max(b, x.e); });
    if (!list.length) { a = 360; b = 1320; }
    if (isT) { a = Math.min(a, now); b = Math.max(b, now + 1); }
    a = Math.floor(a / 60) * 60; b = Math.ceil(b / 60) * 60;
    while (b - a < 240) { if (a > 0) a -= 60; if (b - a < 240 && b < 1440) b += 60; }
    return { a: a, b: b };
  }
  function cdPct(sp, m) { return Math.round((m - sp.a) / (sp.b - sp.a) * 10000) / 100; }
  var cdHour = function (m) { return m >= 1440 ? '24:00' : cdHM(m); };

  /* THE BEAT: one segment per block the day asked of you, lit in its own
     colour once it is kept. Under a date there is no room for ten of
     them, so the week draws the same figure in fifths — lit to the nearest
     fifth, and all five only when the whole day was. */
  function cdFifths(t) {
    if (!t.on || !t.kept) return 0;
    return t.kept >= t.on ? 5 : Math.max(1, Math.min(4, Math.round(t.kept / t.on * 5)));
  }
  function cdPaintDay() {
    var today = cdToday(), ws = cdWeekStart(today);
    var rb = '';
    for (var i = 0; i < 7; i++) {
      var d = cdAddDays(ws, i), t = cdTally(d);
      var past = d <= today, lit = past ? cdFifths(t) : 0, beats = '';
      for (var k = 0; k < 5; k++) beats += k < lit ? '<i class="on"></i>' : '<i></i>';
      rb += '<button type="button" class="cd-wd' + (d === today ? ' is-today' : '') + (past ? '' : ' is-future') + '" data-d="' + d + '" aria-pressed="' + (d === sel) + '"'
        + ' aria-label="' + DOWL[i] + ', ' + (past ? t.kept + ' of ' + t.on + ' kept' : t.on + ' planned') + '">'
        + '<span class="cd-wd-l">' + DOW[i] + '</span>'
        + '<span class="cd-wd-n">' + cdDate(d).getDate() + '</span>'
        + '<span class="cd-wd-b" aria-hidden="true">' + beats + '</span></button>';
    }
    $('cdRibbon').innerHTML = rb;

    var now = cdNowMin(), isT = sel === today, open = cdOpenDay(sel);
    var rel = isT ? 'Today' : sel === cdAddDays(today, -1) ? 'Yesterday' : sel === cdAddDays(today, 1) ? 'Tomorrow' : '';
    $('cdTitle').textContent = rel || DOWL[cdDow(sel)];
    $('cdDayK').textContent = cdLongDate(sel, !!rel) + (isT ? ' · ' + cdHM(now) : '');
    var tl = cdTally(sel), fut = sel > today;
    $('cdSub').textContent = (fut ? tl.on + ' planned' : tl.kept + ' of ' + tl.on + ' kept') + (tl.mins ? ' · ' + cdLen(tl.mins) + ' committed' : '');

    var list = cdOn(sel), ag = $('cdAgenda');
    $('cdBeat').innerHTML = list.filter(function (b) { return !cdIsOff(sel, b.id); }).map(function (b) {
      return cdDone(sel, b.id) ? '<i class="on" style="--bc:var(--c-' + CAT[cdKind(b.n)] + ')"></i>' : '<i></i>';
    }).join('');
    var sp = cdSpan(list, isT, now);
    cdPaintScale(sp, isT, now);
    if (!list.length) {
      ag.innerHTML = '<li class="cd-empty">Nothing on this day yet.<button type="button" class="cd-link" data-act="add">+ Add a block</button></li>';
      return;
    }
    /* Time nobody has claimed is measured from the last thing that is ON:
       a block you took the day off from leaves its hour free. */
    var html = '', reach = -1;
    var nowMark = isT ? '<b class="cd-tnow" style="left:' + cdPct(sp, now) + '%"></b>' : '';
    list.forEach(function (b) {
      var off = cdIsOff(sel, b.id);
      if (!off && reach >= 0 && b.s - reach >= 30) html += cdGapRow(sp, reach, b.s);
      html += cdTicket(b, sp, isT, now, open, nowMark);
      if (!off) reach = Math.max(reach, b.e);
    });
    /* A running block also says how long it has left, and the two are
       different facts: where now is on the day, and how much of this block
       is still yours. */
    ag.innerHTML = html;
  }
  function cdPaintScale(sp, isT, now) {
    var hrs = (sp.b - sp.a) / 60;
    var step = hrs <= 6 ? 1 : hrs <= 10 ? 2 : hrs <= 18 ? 3 : 4;
    var np = isT ? cdPct(sp, now) : -99;
    var h = '';
    for (var m = sp.a; m <= sp.b; m += step * 60) {
      var p = cdPct(sp, m);
      h += '<span' + (m === sp.a ? ' class="is-first"' : m === sp.b ? ' class="is-last"' : '') + ' style="left:' + p + '%">' + cdHour(m) + '</span>';
    }
    if (isT) h += '<b id="cdNowT" style="left:' + np + '%' + (np < 7 ? ';transform:none' : np > 93 ? ';transform:translateX(-100%)' : '') + '">' + cdHM(now) + '</b>';
    var sc = $('cdScale');
    sc.innerHTML = h;
    /* An hour under the clock's own figure is two figures on one spot, so
       whatever the badge touches goes. MEASURED, never guessed: near an end
       the badge is pinned to that end and reaches a whole badge inward, and
       a distance in per cent that was right in the middle let "06:40" sit
       on top of the next hour at dawn. */
    if (isT) {
      var bb = $('cdNowT').getBoundingClientRect();
      [].slice.call(sc.querySelectorAll('span')).forEach(function (s) {
        var r = s.getBoundingClientRect();
        if (r.right > bb.left - 6 && r.left < bb.right + 6) s.remove();
      });
    }
  }
  function cdGapRow(sp, a, b) {
    var l = cdPct(sp, a), r = cdPct(sp, b);
    /* Beside the line, on whichever side has the room. */
    var lab = r > 70 ? 'right:calc(' + Math.round((100 - l) * 100) / 100 + '% + 8px)' : 'left:calc(' + r + '% + 8px)';
    return '<li class="cd-gap" aria-hidden="true"><span class="cd-gap-in"><b style="left:' + l + '%;width:' + Math.round((r - l) * 100) / 100 + '%"></b>'
      + '<p style="' + lab + '">' + cdLen(b - a) + ' free</p></span></li>';
  }
  var TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  function cdTicket(b, sp, isT, now, open, nowMark) {
    var kind = cdKind(b.n), cat = CAT[kind];
    var done = cdDone(sel, b.id), off = cdIsOff(sel, b.id);
    var running = isT && !off && b.e > b.s && now >= b.s && now < b.e;
    var past = (isT && (b.e > b.s ? now >= b.e : now > b.s)) || sel < cdToday();
    /* No gutter, so the row says when as well as how long. A moment is a
       time and nothing else. */
    var bits = [];
    if (off) bits.push('Off this day');
    else if (running) bits.push('<i>' + cdLen(b.e - now) + ' left</i>', 'until ' + cdHM(b.e));
    else if (b.e > b.s) bits.push(cdHM(b.s) + '–' + cdHM(b.e), cdLen(b.e - b.s));
    else bits.push('At ' + cdHM(b.s));
    if (b.p) bits.push(esc(b.p));
    var sess = (S.train[sel] && cdSess(S.train[sel][b.id])) || null;
    var tag = sess ? '<span class="cd-tk-w" style="--kc:var(--k-' + LIFTN[sess.k[0]].g + ')">' + esc(cdSessName(sess)) + (sess.m ? ' · ' + sess.m + 'm' : '') + '</span>' : '';
    var l = cdPct(sp, b.s);
    var seg = b.e > b.s
      ? '<span class="cd-seg" style="left:' + l + '%;width:' + Math.round((cdPct(sp, b.e) - l) * 100) / 100 + '%">'
        + (running ? '<i style="width:' + Math.round((now - b.s) / (b.e - b.s) * 100) + '%"></i>' : '') + '</span>'
      : '<span class="cd-seg is-dot" style="left:' + l + '%"></span>';
    var cls = 'cd-it' + (done ? ' is-done' : '') + (off ? ' is-off' : '') + (running ? ' is-now' : '') + (past ? ' is-past' : '');
    return '<li class="' + cls + '" data-id="' + b.id + '" style="--cat:var(--c-' + cat + ')">'
      + '<button type="button" class="cd-tk-b" data-act="edit" aria-label="' + esc(b.n) + ', ' + cdHM(b.s) + (b.e > b.s ? ' to ' + cdHM(b.e) : '') + '. Open">'
      + '<span class="cd-tk-n">' + esc(b.n) + '</span>'
      + '<span class="cd-tk-m">' + bits.join(' · ') + '</span>' + tag
      + '<span class="cd-track" aria-hidden="true">' + seg + (nowMark || '') + '</span></button>'
      + '<button type="button" class="cd-stamp" data-act="tick" aria-pressed="' + done + '"' + (open ? '' : ' disabled')
      + ' aria-label="' + (done ? 'Kept' : 'Mark kept') + ': ' + esc(b.n) + '">' + TICK + '</button>'
      + '</li>';
  }

  function cdTick(id) {
    if (!cdOpenDay(sel)) return;
    var b = S.week.filter(function (x) { return x.id === id; })[0];
    if (!b) return;
    var was = cdDone(sel, id);
    cdSetFlag('log', sel, id, !was);
    if (!was) cdSetFlag('off', sel, id, false);
    else if (S.train[sel] && S.train[sel][id]) { delete S.train[sel][id]; if (!Object.keys(S.train[sel]).length) delete S.train[sel]; cdSave('train'); }
    cdPaint();
    /* Finishing a training block is the moment to ask what it was. */
    if (!was && TRAINING[cdKind(b.n)]) cdLiftSheet(sel, id, b.n);
  }

  $('cdAgenda').addEventListener('click', function (ev) {
    var btn = ev.target.closest('[data-act]');
    if (!btn) return;
    if (btn.dataset.act === 'add') { cdEdit(null); return; }
    var li = btn.closest('.cd-it');
    if (!li) return;
    if (btn.dataset.act === 'tick') cdTick(li.dataset.id);
    else cdEdit(li.dataset.id);
  });
  $('cdRibbon').addEventListener('click', function (ev) {
    var b = ev.target.closest('.cd-wd');
    if (!b) return;
    sel = b.dataset.d;
    cdPaintDay();
  });

  /* ═══ THE SENTENCE ═══
     "Gym mon wed fri 6:30 to 8", "walk weekdays 7:45 for 30 mins",
     "read now", "stretch after gym". What it cannot place, it leaves in
     the name — a sentence it does not understand costs nothing. */
  var DAYW = [['monday', 'mon'], ['tuesday', 'tues', 'tue'], ['wednesday', 'wed'], ['thursday', 'thurs', 'thu'], ['friday', 'fri'], ['saturday', 'sat'], ['sunday', 'sun']];
  function cdClock(h, m, mer) {
    h = +h; m = +(m || 0);
    if (mer === 'pm' && h < 12) h += 12;
    if (mer === 'am' && h === 12) h = 0;
    if (h > 23 || m > 59) return null;
    return h * 60 + m;
  }
  function cdParse(text, weekFor) {
    var src = ' ' + String(text || '').toLowerCase().replace(/[.,!]/g, ' ') + ' ';
    var used = src;
    var eat = function (m) { used = used.replace(m, function (x) { return ' '.repeat(x.length); }); };
    var out = { days: [], s: null, e: null, len: null, after: null };
    var m;

    if ((m = used.match(/\b(every ?day|daily)\b/))) { out.days = [0, 1, 2, 3, 4, 5, 6]; eat(m[0]); }
    if ((m = used.match(/\bweekdays?\b/))) { out.days = out.days.concat([0, 1, 2, 3, 4]); eat(m[0]); }
    if ((m = used.match(/\bweekends?\b/))) { out.days = out.days.concat([5, 6]); eat(m[0]); }
    if ((m = used.match(/\btoday\b/))) { out.days.push(cdDow(cdToday())); eat(m[0]); }
    if ((m = used.match(/\btomorrow\b/))) { out.days.push(cdDow(cdAddDays(cdToday(), 1))); eat(m[0]); }
    DAYW.forEach(function (ws, i) {
      var re = new RegExp('\\b(?:on\\s+|every\\s+)?(' + ws.join('|') + ')s?\\b', 'g');
      var hit = used.match(re);
      if (hit) { out.days.push(i); hit.forEach(eat); }
    });
    used = used.replace(/\b(and|&)\b/g, function (x) { return ' '.repeat(x.length); });

    var range = used.match(/\b(?:from\s+|at\s+)?(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\s*(?:-|–|to|until|till)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\b/);
    if (range) {
      var s = cdClock(range[1], range[2], range[3] || (range[6] === 'pm' && +range[1] < +range[4] ? 'pm' : ''));
      var e = cdClock(range[4], range[5], range[6]);
      if (s != null && e != null) {
        if (e <= s && !range[6] && e + 720 > s && e < 720) e += 720;
        if (e > s) { out.s = s; out.e = e; eat(range[0]); }
      }
    }
    if ((m = used.match(/\bfor\s+(an?|half an|\d+(?:\.\d+)?)\s*(h|hr|hrs|hour|hours|m|min|mins|minute|minutes)\b/))) {
      var q = m[1] === 'half an' ? 0.5 : /^an?$/.test(m[1]) ? 1 : +m[1];
      out.len = Math.round(/^h/.test(m[2]) ? q * 60 : q);
      eat(m[0]);
    }
    if ((m = used.match(/\bin\s+(\d+)\s*(m|min|mins|minutes|h|hr|hrs|hours?)\b/))) {
      var off = /^h/.test(m[2]) ? +m[1] * 60 : +m[1];
      var at = cdNowMin() + off;
      if (at < 1440 && out.s == null) out.s = at;
      eat(m[0]);
      if (!out.days.length) out.days.push(cdDow(cdToday()));
    }
    if ((m = used.match(/\bnow\b/))) {
      if (out.s == null) out.s = Math.round(cdNowMin() / 5) * 5;
      eat(m[0]);
      if (!out.days.length) out.days.push(cdDow(cdToday()));
    }
    if (out.s == null) {
      var clk = used.match(/\b(?:at\s+)?(\d{1,2}):(\d{2})\s*(am|pm)?\b/) || used.match(/\b(?:at\s+)?(\d{1,2})()\s*(am|pm)\b/) || used.match(/\bat\s+(\d{1,2})()()\b/);
      if (clk) { var c = cdClock(clk[1], clk[2], clk[3]); if (c != null) { out.s = c; eat(clk[0]); } }
    }
    /* "after the gym": the other thing already has a time; this starts
       where it ends. Through the keyword table, so "after training"
       finds a block nobody called Training. Only struck out if it
       resolves — otherwise the words stay in the name. */
    var aft = used.match(/\b(after|before)\s+(?:the\s+|my\s+)?([a-z][a-z ]*?)\s*$/) || used.match(/\b(after|before)\s+(?:the\s+|my\s+)?([a-z]+)\b/);
    if (aft && out.s == null) {
      var probeDay = out.days.length ? out.days[0] : cdDow(cdToday());
      var phrase = aft[2].trim(), pk = cdKind(phrase);
      var pool = (weekFor || S.week).filter(function (b) { return b.d.indexOf(probeDay) >= 0; }).sort(function (a, b) { return a.s - b.s; });
      var hit2 = pool.filter(function (b) { var n = b.n.toLowerCase(); return n.indexOf(phrase) >= 0 || (phrase.length >= 3 && phrase.indexOf(n) >= 0); })[0]
        || (pk !== 'dot' && pool.filter(function (b) { return cdKind(b.n) === pk; })[0]);
      if (hit2) {
        out.after = hit2.n;
        var L = out.len != null ? out.len : 0;
        out.s = aft[1] === 'after' ? hit2.e : Math.max(0, hit2.s - (L || 0));
        eat(aft[0]);
      }
    }
    if (out.s != null && out.e == null) out.e = Math.min(1440, out.s + (out.len || 0));
    if (!out.days.length && out.s != null) out.days = [cdDow(cdToday())];

    var name = used.replace(/\b(at|from|on|every|for|the|a|an|my)\b/g, ' ').replace(/\s+/g, ' ').trim();
    out.n = name ? name.charAt(0).toUpperCase() + name.slice(1) : '';
    out.days = out.days.filter(function (x, i) { return out.days.indexOf(x) === i; }).sort();
    return out;
  }

  /* ═══ THE SHEET ═══ one at a time; opening one replaces the last. */
  var shOnClose = null;
  function cdSheet(title, body, onClose) {
    $('cdShT').textContent = title;
    var b = $('cdShB');
    b.innerHTML = '';
    if (typeof body === 'string') b.innerHTML = body; else b.appendChild(body);
    shOnClose = onClose || null;
    var sh = $('cdSheet'), sc = $('cdScrim');
    sh.hidden = false; sc.hidden = false;
    sh.scrollTop = 0;
    requestAnimationFrame(function () { sh.classList.add('is-open'); sc.classList.add('is-open'); });
    return b;
  }
  var shTimer = 0;
  function cdClose() {
    var sh = $('cdSheet'), sc = $('cdScrim');
    if (sh.hidden) return;
    sh.classList.remove('is-open'); sc.classList.remove('is-open');
    clearTimeout(shTimer);
    shTimer = setTimeout(function () { sh.hidden = true; sc.hidden = true; }, 240);
    var f = shOnClose; shOnClose = null;
    if (f) f();
  }
  function cdSheetOpen() { return !$('cdSheet').hidden && $('cdSheet').classList.contains('is-open'); }
  $('cdShX').addEventListener('click', cdClose);
  $('cdScrim').addEventListener('click', cdClose);
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && !$('cdSheet').hidden) { ev.preventDefault(); cdClose(); } });

  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }

  /* ═══ ADD AND EDIT ═══ one form. A new block also gets the sentence. */
  function cdEdit(id) {
    var b = id ? S.week.filter(function (x) { return x.id === id; })[0] : null;
    var f = b ? { n: b.n, d: b.d.slice(), s: b.s, len: b.e - b.s, p: b.p }
      : { n: '', d: [cdDow(sel)], s: Math.min(1380, Math.ceil(cdNowMin() / 15) * 15), len: 30, p: '' };
    var root = el('div');

    if (!b) {
      var say = el('input', 'cd-field cd-say');
      say.id = 'cdSay'; say.type = 'text'; say.autocomplete = 'off';
      say.placeholder = 'Gym mon wed fri 6:30 to 8';
      say.setAttribute('aria-label', 'Say it in a sentence');
      var prev = el('p', 'cd-prev'); prev.id = 'cdPrev';
      root.appendChild(say); root.appendChild(prev);
      say.addEventListener('input', function () {
        var r = cdParse(say.value);
        if (r.n) f.n = r.n;
        if (r.days.length) f.d = r.days;
        if (r.s != null) { f.s = r.s; f.len = r.e - r.s; }
        sync();
        var miss = [];
        if (!r.n) miss.push('what');
        if (r.s == null) miss.push('what time');
        prev.className = 'cd-prev' + (miss.length && say.value.trim() ? ' is-need' : '');
        prev.innerHTML = !say.value.trim() ? '' : miss.length ? 'Still needs ' + miss.join(' and ')
          : '<b>' + esc(r.n) + '</b> · ' + (r.days.length === 7 ? 'every day' : r.days.map(function (x) { return DOW[x]; }).join(' ')) + ' · '
            + cdHM(r.s) + (r.e > r.s ? '–' + cdHM(r.e) : '') + (r.after ? ' · after ' + esc(r.after) : '');
      });
      root.appendChild(el('p', 'cd-lbl', 'Or set it by hand'));
    } else {
      /* This day: what happened to the block on the date you are looking at. */
      root.appendChild(el('p', 'cd-lbl', esc(DOWL[cdDow(sel)]) + ' ' + cdDate(sel).getDate() + ' ' + MON[cdDate(sel).getMonth()].slice(0, 3)));
      var canDo = cdOpenDay(sel);
      var tDone = el('button', 'cd-toggle', '<span>Done</span><i></i>');
      tDone.type = 'button'; tDone.id = 'cdTDone';
      tDone.setAttribute('aria-pressed', cdDone(sel, b.id));
      tDone.disabled = !canDo;
      tDone.addEventListener('click', function () { cdClose(); cdTick(b.id); });
      var tOff = el('button', 'cd-toggle', '<span>Off this day</span><i></i>');
      tOff.type = 'button'; tOff.id = 'cdTOff';
      tOff.setAttribute('aria-pressed', cdIsOff(sel, b.id));
      /* A day off is written forward, so it is the one record open ahead. */
      tOff.disabled = cdDiff(cdToday(), sel) > 2;
      tOff.addEventListener('click', function () {
        var on = !cdIsOff(sel, b.id);
        cdSetFlag('off', sel, b.id, on);
        if (on) cdSetFlag('log', sel, b.id, false);
        tOff.setAttribute('aria-pressed', on);
        tDone.setAttribute('aria-pressed', cdDone(sel, b.id));
        cdPaint();
      });
      var tg = el('div', 'cd-rows');
      tg.appendChild(tDone); tg.appendChild(tOff);
      root.appendChild(tg);
      if (TRAINING[cdKind(b.n)] && canDo) {
        var lg = el('button', 'cd-link', 'Log what you trained →');
        lg.type = 'button';
        lg.addEventListener('click', function () { cdLiftSheet(sel, b.id, b.n); });
        root.appendChild(lg);
      }
      root.appendChild(el('p', 'cd-lbl', 'Every week'));
    }

    var rows = el('div', 'cd-rows');
    var nm = el('input', 'cd-field'); nm.type = 'text'; nm.id = 'cdFN'; nm.placeholder = 'Name';
    var st = el('input', 'cd-field'); st.type = 'time'; st.id = 'cdFS'; st.step = 300;
    var pl = el('input', 'cd-field'); pl.type = 'text'; pl.id = 'cdFP'; pl.placeholder = 'Optional';
    var rg = el('input', 'cd-range'); rg.type = 'range'; rg.min = 0; rg.max = 240; rg.step = 5; rg.id = 'cdFL';
    rg.setAttribute('aria-label', 'How long');
    var lenOut = el('span', 'cd-len');
    var dayBox = el('div', 'cd-chips days');
    DOW.forEach(function (d, i) {
      var c = el('button', 'cd-chip', d.slice(0, 2)); c.type = 'button'; c.dataset.i = i;
      c.setAttribute('aria-label', DOWL[i]);
      c.addEventListener('click', function () {
        var k = f.d.indexOf(i);
        if (k >= 0) f.d.splice(k, 1); else f.d.push(i);
        sync();
      });
      dayBox.appendChild(c);
    });
    function row(lbl, node) { var r = el('div', 'cd-row'); r.appendChild(el('span', '', lbl)); r.appendChild(node); rows.appendChild(r); }
    row('What', nm); row('Starts', st);
    var lenWrap = el('div'); lenWrap.appendChild(rg); lenWrap.appendChild(lenOut); row('How long', lenWrap);
    row('Where', pl);
    root.appendChild(rows);
    root.appendChild(el('p', 'cd-lbl', 'Days'));
    root.appendChild(dayBox);

    function sync() {
      nm.value = f.n; st.value = cdHM(f.s); pl.value = f.p;
      if (+rg.max < f.len) rg.max = Math.ceil(f.len / 60) * 60;
      rg.value = f.len;
      lenOut.textContent = f.len > 0 ? cdLen(f.len) + ' · ends ' + cdHM(Math.min(1440, f.s + f.len)) : 'A moment';
      dayBox.querySelectorAll('.cd-chip').forEach(function (c) { c.setAttribute('aria-pressed', f.d.indexOf(+c.dataset.i) >= 0); });
    }
    nm.addEventListener('input', function () { f.n = nm.value; });
    pl.addEventListener('input', function () { f.p = pl.value; });
    st.addEventListener('input', function () {
      var p = st.value.split(':');
      if (p.length === 2) { f.s = +p[0] * 60 + +p[1]; lenOut.textContent = f.len > 0 ? cdLen(f.len) + ' · ends ' + cdHM(Math.min(1440, f.s + f.len)) : 'A moment'; }
    });
    rg.addEventListener('input', function () {
      f.len = +rg.value;
      lenOut.textContent = f.len > 0 ? cdLen(f.len) + ' · ends ' + cdHM(Math.min(1440, f.s + f.len)) : 'A moment';
    });
    sync();

    var foot = el('div', 'cd-foot');
    if (b) {
      var del = el('button', 'cd-btn warn', 'Delete'); del.type = 'button'; del.id = 'cdFDel';
      del.addEventListener('click', function () {
        var at = S.week.indexOf(b);
        S.week.splice(at, 1); cdSave('week'); cdClose(); cdPaint();
        cdToast('Deleted ' + b.n, function () { S.week.splice(at, 0, b); cdSave('week'); cdPaint(); });
      });
      foot.appendChild(del);
    }
    var save = el('button', 'cd-btn go', b ? 'Save' : 'Add'); save.type = 'button'; save.id = 'cdFSave';
    save.addEventListener('click', function () {
      if (!f.n.trim()) { cdToast('Give it a name.'); nm.focus(); return; }
      if (!f.d.length) { cdToast('Pick at least one day.'); return; }
      if (f.s + f.len > 1440) { cdToast('It has to finish by midnight.'); return; }
      var nb = cdBlock({ id: b ? b.id : null, n: f.n.trim(), d: f.d, s: f.s, e: f.s + f.len, p: f.p.trim() });
      if (b) S.week[S.week.indexOf(b)] = nb; else S.week.push(nb);
      cdSave('week'); cdClose();
      if (!b && nb.d.indexOf(cdDow(sel)) < 0) {
        /* Land on the day it went on, or it looks like nothing happened. */
        var t = cdToday(), ws = cdWeekStart(t);
        sel = cdAddDays(ws, nb.d[0]);
      }
      if (view !== 'day') cdGo('day'); else cdPaint();
      cdToast((b ? 'Saved ' : 'Added ') + nb.n);
    });
    foot.appendChild(save);
    root.appendChild(foot);
    cdSheet(b ? b.n : 'New block', root);
    var sayEl = root.querySelector('.cd-say');
    if (sayEl) setTimeout(function () { sayEl.focus(); }, 60);
  }

  /* ═══ WHAT YOU TRAINED ═══ */
  function cdLiftSheet(iso, key, label) {
    var cur = (S.train[iso] && cdSess(S.train[iso][key])) || { k: [], e: '', m: 0 };
    var pick = cur.k.slice(), eff = cur.e, min = cur.m;
    var root = el('div');
    var boards = el('div');
    LIFT.forEach(function (g) {
      var box = el('div', 'cd-grp'); box.style.setProperty('--kc', 'var(--k-' + g.g + ')');
      box.appendChild(el('h3', '', g.n));
      var cs = el('div', 'cd-chips');
      g.items.forEach(function (it) {
        var k = g.g + '.' + it[0];
        var c = el('button', 'cd-chip kc', it[1]); c.type = 'button'; c.dataset.k = k;
        c.style.setProperty('--kc', 'var(--k-' + g.g + ')');
        c.addEventListener('click', function () {
          var at = pick.indexOf(k);
          if (at >= 0) pick.splice(at, 1);
          /* You cannot half-rest: Rest clears the rest, and anything else clears Rest. */
          else if (g.g === 'rest') pick = [k];
          else { pick = pick.filter(function (x) { return LIFTN[x].g !== 'rest'; }); pick.push(k); }
          draw();
        });
        cs.appendChild(c);
      });
      box.appendChild(cs); boards.appendChild(box);
    });
    root.appendChild(boards);
    var more = el('div');
    more.appendChild(el('p', 'cd-lbl', 'How hard'));
    var ef = el('div', 'cd-chips');
    EFFORT.forEach(function (w) {
      var c = el('button', 'cd-chip', w); c.type = 'button'; c.dataset.e = w;
      c.addEventListener('click', function () { eff = eff === w ? '' : w; draw(); });
      ef.appendChild(c);
    });
    more.appendChild(ef);
    more.appendChild(el('p', 'cd-lbl', 'How long'));
    var mn = el('div', 'cd-chips');
    MINS.forEach(function (x) {
      var c = el('button', 'cd-chip', x + 'm'); c.type = 'button'; c.dataset.m = x;
      c.addEventListener('click', function () { min = min === x ? 0 : x; draw(); });
      mn.appendChild(c);
    });
    more.appendChild(mn);
    root.appendChild(more);
    var foot = el('div', 'cd-foot');
    var skip = el('button', 'cd-btn', cur.k.length ? 'Take it off' : 'Not now'); skip.type = 'button';
    skip.addEventListener('click', function () {
      if (cur.k.length && S.train[iso]) { delete S.train[iso][key]; if (!Object.keys(S.train[iso]).length) delete S.train[iso]; cdSave('train'); }
      cdClose(); cdPaint();
    });
    var go = el('button', 'cd-btn go', 'Log'); go.type = 'button'; go.id = 'cdLiftGo';
    go.addEventListener('click', function () {
      if (!pick.length) return;
      var rest = pick.every(function (k) { return LIFTN[k].g === 'rest'; });
      (S.train[iso] = S.train[iso] || {})[key] = rest ? { k: pick } : { k: pick, e: eff, m: min };
      cdSave('train');
      if (key !== DAYKEY && !cdDone(iso, key)) cdSetFlag('log', iso, key, true);
      cdClose(); cdPaint();
      cdToast('Logged ' + pick.map(function (k) { return LIFTN[k].n; }).join(' + '));
    });
    foot.appendChild(skip); foot.appendChild(go);
    root.appendChild(foot);
    function draw() {
      root.querySelectorAll('[data-k]').forEach(function (c) { c.setAttribute('aria-pressed', pick.indexOf(c.dataset.k) >= 0); });
      root.querySelectorAll('[data-e]').forEach(function (c) { c.setAttribute('aria-pressed', c.dataset.e === eff); });
      root.querySelectorAll('[data-m]').forEach(function (c) { c.setAttribute('aria-pressed', +c.dataset.m === min); });
      var rest = pick.length && pick.every(function (k) { return LIFTN[k].g === 'rest'; });
      /* A rest day is not asked how hard or how long: absent, not disabled. */
      more.hidden = !!rest;
      go.disabled = !pick.length;
      go.textContent = pick.length ? 'Log ' + pick.map(function (k) { return LIFTN[k].n; }).join(' + ') : 'Pick a session';
    }
    draw();
    cdSheet('What did you train?', root);
    $('cdShT').title = label || '';
  }

  /* ═══ HABITS VIEW ═══
     Two across, and under each a fortnight of beats: a tick stands full on
     a day it was kept, a number as tall as its share of the fortnight's
     best. Colour says WHICH habit, never whether. */
  var CHEV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';
  function cdPaintHab() {
    var today = cdToday(), hs = cdHabits();
    var kept = hs.filter(function (h) { return cdHabOn(today, h); });
    $('cdHabK').textContent = cdLongDate(today, true);
    $('cdHabCap').textContent = kept.length + ' of ' + hs.length + ' kept today';
    $('cdHabBeat').innerHTML = hs.map(function (h) { return cdHabOn(today, h) ? '<i class="on" style="--bc:var(' + h.hc + ')"></i>' : '<i></i>'; }).join('');
    var html = '';
    hs.forEach(function (h) {
      var v = cdHabVal(today, h), on = cdHabOn(today, h);
      var sub, val;
      if (h.k === 'tick') {
        var by = cdKeptBy(today, h), st = cdStreak(h);
        sub = by && by !== 'you' ? (by === 'session' ? 'Kept by a session' : 'Kept by ' + esc(by)) : (st > 1 ? st + '-day streak' : on ? 'Kept today' : 'Tap to keep');
        val = on ? '<span class="cd-hr-v">Kept</span>' : '<span class="cd-hr-v is-nil">Not yet</span>';
      } else {
        var wk = 0, n = 0;
        for (var i = 1; i <= 7; i++) { var x = +cdHabVal(cdAddDays(today, -i), h); if (x > 0) { wk += x; n++; } }
        sub = n ? '7-day avg ' + cdFmtNum(wk / n, h) : 'Tap to log';
        val = on ? '<span class="cd-hr-v">' + cdFmtNum(v, h) + '<small>' + esc(h.unit) + '</small></span>' : '<span class="cd-hr-v is-nil">—</span>';
      }
      var ds = [], top = 0;
      for (var j = 13; j >= 0; j--) { var dd = cdAddDays(today, -j); ds.push(dd); if (h.k === 'num') top = Math.max(top, +cdHabVal(dd, h) || 0); }
      var tape = ds.map(function (d) {
        if (!cdHabOn(d, h)) return '<i></i>';
        var ht = h.k === 'tick' ? 16 : Math.max(4, Math.round((+cdHabVal(d, h) || 0) / (top || 1) * 16));
        return '<i class="on" style="height:' + ht + 'px"></i>';
      }).join('');
      /* The fortnight is inside the press target, so the whole tile logs;
         the history is its own button, a sibling, because a button inside
         a button collapses to one press. */
      html += '<li class="cd-hr' + (on ? ' is-on' : '') + '" data-h="' + h.id + '" style="--hc:var(' + h.hc + ')">'
        + '<button type="button" class="cd-hr-b" data-act="log" aria-label="' + esc(h.n) + ', ' + (on ? 'kept' : 'not yet') + '">'
        + '<span class="cd-hr-n">' + esc(h.n) + '</span>' + val + '<span class="cd-hr-s">' + sub + '</span>'
        + '<span class="cd-tape" aria-hidden="true">' + tape + '</span></button>'
        + '<button type="button" class="cd-hr-more" data-act="hist" aria-label="' + esc(h.n) + ' history">' + CHEV + '</button></li>';
    });
    $('cdHab').innerHTML = html;
  }
  $('cdHab').addEventListener('click', function (ev) {
    var btn = ev.target.closest('[data-act]'); if (!btn) return;
    var h = cdHabits().filter(function (x) { return x.id === btn.closest('.cd-hr').dataset.h; })[0];
    if (!h) return;
    if (btn.dataset.act === 'hist') { cdHabHist(h); return; }
    var today = cdToday();
    if (h.id === 'train') {
      var tb = cdOn(today).filter(function (b) { return TRAINING[cdKind(b.n)] && !cdIsOff(today, b.id); });
      var free = tb.filter(function (b) { return !(S.train[today] && S.train[today][b.id]); })[0];
      cdLiftSheet(today, free ? free.id : tb.length ? tb[0].id : DAYKEY, 'Train');
      return;
    }
    if (h.k === 'tick') {
      var by = cdKeptBy(today, h);
      if (by && by !== 'you') { cdToast('Kept by ' + by + ' — untick it on the day.'); return; }
      var m = S.hab[today] = S.hab[today] || {};
      if (m[h.id]) delete m[h.id]; else m[h.id] = 1;
      if (!Object.keys(m).length) delete S.hab[today];
      cdSave('hab'); cdPaintHab();
      return;
    }
    cdNumSheet(h, today);
  });

  function cdNumSheet(h, iso) {
    var v = +cdHabVal(iso, h) || 0;
    var root = el('div');
    var big = el('p', 'cd-num'); big.id = 'cdNumV';
    var cap = el('p', 'cd-numcap', 'today');
    var max = h.max;
    if (h.mine) { var best = 0; Object.keys(S.hab).forEach(function (d) { best = Math.max(best, +S.hab[d][h.id] || 0); }); max = best ? Math.ceil(best * 1.5) : 100; }
    var rg = el('input', 'cd-range'); rg.type = 'range'; rg.min = 0; rg.max = max; rg.step = h.step; rg.value = v; rg.id = 'cdNumR';
    rg.setAttribute('aria-label', h.n);
    root.appendChild(big); root.appendChild(cap); root.appendChild(rg);
    var marks = el('div', 'cd-chips');
    (h.marks || []).forEach(function (x) {
      var c = el('button', 'cd-chip', cdFmtNum(x, h)); c.type = 'button';
      c.addEventListener('click', function () { v = x; paint(); });
      marks.appendChild(c);
    });
    (h.bump || []).forEach(function (x) {
      var c = el('button', 'cd-chip', '+' + cdFmtNum(x, h)); c.type = 'button';
      c.addEventListener('click', function () { v = Math.min(max, +(v + x).toFixed(2)); paint(); });
      marks.appendChild(c);
    });
    if (marks.children.length) root.appendChild(marks);
    function paint() { rg.value = v; big.innerHTML = cdFmtNum(v, h) + '<small>' + esc(h.unit) + '</small>'; }
    rg.addEventListener('input', function () { v = +rg.value; paint(); });
    paint();
    var foot = el('div', 'cd-foot');
    var clr = el('button', 'cd-btn', +cdHabVal(iso, h) > 0 ? 'Clear' : 'Cancel'); clr.type = 'button';
    clr.addEventListener('click', function () { set(0); });
    var go = el('button', 'cd-btn go', 'Save'); go.type = 'button'; go.id = 'cdNumGo';
    go.addEventListener('click', function () { set(v); });
    function set(x) {
      var m = S.hab[iso] = S.hab[iso] || {};
      if (x > 0) m[h.id] = +(+x).toFixed(2); else delete m[h.id];
      if (!Object.keys(m).length) delete S.hab[iso];
      cdSave('hab'); cdClose(); cdPaint();
    }
    foot.appendChild(clr); foot.appendChild(go);
    root.appendChild(foot);
    cdSheet(h.n, root);
  }

  function cdHabHist(h) {
    var today = cdToday(), root = el('div');
    var n30 = 0, n90 = 0;
    for (var i = 0; i < 90; i++) { if (cdHabOn(cdAddDays(today, -i), h)) { n90++; if (i < 30) n30++; } }
    root.appendChild(el('div', 'cd-figs', '<div><b>' + n30 + '</b><span>of 30 days</span></div><div><b>' + n90 + '</b><span>of 90 days</span></div><div><b>' + (h.k === 'tick' ? cdStreak(h) : '—') + '</b><span>streak</span></div>'));
    var ul = el('ul', 'cd-day-l');
    for (var j = 0; j < 14; j++) {
      var d = cdAddDays(today, -j), on = cdHabOn(d, h), v = cdHabVal(d, h);
      var hl = ul.appendChild(el('li', '', '<i></i><b>' + DOW[cdDow(d)] + ' ' + cdDate(d).getDate() + ' ' + MON[cdDate(d).getMonth()].slice(0, 3) + '</b><span>'
        + (on ? (h.k === 'num' ? cdFmtNum(v, h) + ' ' + esc(h.unit) : 'kept') : '—') + '</span>'));
      hl.style.setProperty('--cat', on ? 'var(' + h.hc + ')' : 'var(--quiet)');
    }
    root.appendChild(el('p', 'cd-lbl', 'Last fourteen days'));
    root.appendChild(ul);
    if (h.mine) {
      var foot = el('div', 'cd-foot');
      var rm = el('button', 'cd-btn warn', 'Remove this habit'); rm.type = 'button';
      rm.addEventListener('click', function () {
        var at = -1; S.defs.forEach(function (x, i) { if (x.id === h.id) at = i; });
        var was = S.defs.splice(at, 1)[0]; cdSave('defs'); cdClose(); cdPaint();
        cdToast('Removed ' + h.n, function () { S.defs.splice(at, 0, was); cdSave('defs'); cdPaint(); });
      });
      foot.appendChild(rm); root.appendChild(foot);
    }
    cdSheet(h.n, root);
  }

  $('cdHabAdd').addEventListener('click', function () {

    go.addEventListener('click', function () {
