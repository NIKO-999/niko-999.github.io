<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05070F">
<title>Gene Keys — The Living Strand</title>
<meta name="description" content="Your four Gene Keys Prime Gifts, read from the Sun at your birth, on a living strand of the sixty-four codons.">
<link rel="preload" as="script" href="js/gene-keys-content.js">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   THE LIVING STRAND — a bioluminescent double helix of the 64 Gene Keys.
   Committed dark: the depth illusion is built on luminance against a dark
   ground, so there is deliberately no light theme (see prefers-contrast
   block at the end for the high-contrast accommodation).
   ═══════════════════════════════════════════════════════════════════════ */
:root {
  color-scheme: dark;

  --void:      #05070F;
  --abyss:     #090D1A;
  --indigo:    #101A35;

  --lum:       #5FEBD7;
  --lum-deep:  #1E8F8B;
  --gold:      #F2C46B;
  --gold-deep: #B98A34;
  --umbra:     #7C7FA6;
  --steel:     #5B87A8;

  --ink:       #DCEBEF;
  --ink-2:     rgba(220,235,239,.74);
  --ink-3:     rgba(220,235,239,.46);
  --ink-4:     rgba(220,235,239,.30);

  --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif;
  --sans:  ui-sans-serif, -apple-system, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
  --mono:  ui-monospace, 'SF Mono', 'Roboto Mono', Menlo, monospace;

  --ease: cubic-bezier(.2,.7,.2,1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--void);
  color: var(--ink);
  font-family: var(--serif);
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

/* ── the scene ──────────────────────────────────────────────────────── */
#field {
  position: fixed; inset: 0;
  transition: transform 700ms var(--ease), opacity 700ms var(--ease);
  will-change: transform;
}
#helix { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#labels { position: absolute; inset: 0; pointer-events: none; }

/* ambient bloom — one element, compositor only */
#bloom {
  position: absolute; left: 50%; top: 50%;
  width: 78vmin; height: 78vmin; margin: -39vmin 0 0 -39vmin;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(30,143,139,.20) 0%, rgba(16,26,53,.10) 45%, transparent 72%);
  pointer-events: none;
  animation: breathe 11s ease-in-out infinite;
  will-change: transform, opacity;
}
@keyframes breathe {
  0%,100% { opacity: .70; transform: scale(1); }
  50%     { opacity: 1;   transform: scale(1.07); }
}

/* motes — three CSS gradient layers, parallax by differing durations */
.motes { position: absolute; inset: -12%; pointer-events: none; will-change: transform; }
#m1 {
  background-image:
    radial-gradient(circle 1.6px at 12% 22%, rgba(95,235,215,.55) 0, transparent 100%),
    radial-gradient(circle 1.2px at 78% 12%, rgba(220,235,239,.40) 0, transparent 100%),
    radial-gradient(circle 1.9px at 33% 71%, rgba(95,235,215,.34) 0, transparent 100%),
    radial-gradient(circle 1.3px at 64% 84%, rgba(242,196,107,.34) 0, transparent 100%),
    radial-gradient(circle 1.5px at 90% 58%, rgba(95,235,215,.28) 0, transparent 100%),
    radial-gradient(circle 1.1px at 47% 38%, rgba(220,235,239,.30) 0, transparent 100%);
  animation: drift1 40s linear infinite;
}
#m2 {
  background-image:
    radial-gradient(circle 2.2px at 22% 62%, rgba(95,235,215,.24) 0, transparent 100%),
    radial-gradient(circle 1.7px at 71% 33%, rgba(242,196,107,.22) 0, transparent 100%),
    radial-gradient(circle 2.5px at 55% 78%, rgba(30,143,139,.30) 0, transparent 100%),
    radial-gradient(circle 1.4px at 8% 88%, rgba(220,235,239,.20) 0, transparent 100%),
    radial-gradient(circle 2px   at 86% 76%, rgba(95,235,215,.18) 0, transparent 100%);
  animation: drift2 62s linear infinite;
}
#m3 {
  background-image:
    radial-gradient(circle 3.4px at 40% 15%, rgba(30,143,139,.16) 0, transparent 100%),
    radial-gradient(circle 4px   at 82% 47%, rgba(95,235,215,.11) 0, transparent 100%),
    radial-gradient(circle 3px   at 17% 45%, rgba(242,196,107,.11) 0, transparent 100%),
    radial-gradient(circle 3.6px at 60% 92%, rgba(30,143,139,.13) 0, transparent 100%);
  animation: drift3 91s linear infinite;
}
@keyframes drift1 { to { transform: translate3d(3%, -6%, 0); } }
@keyframes drift2 { to { transform: translate3d(-4%, 5%, 0); } }
@keyframes drift3 { to { transform: translate3d(2.5%, 4%, 0); } }

/* prime nodes pulse in pure CSS — the rung midpoint is always exactly CX,
   so these never need a per-frame write. */
.node { transform-box: fill-box; transform-origin: center; will-change: transform, opacity; }
.node.gold { filter: drop-shadow(0 0 3px rgba(242,196,107,.75)); animation: pulse 3.4s ease-in-out infinite; }
.node.cyan { filter: drop-shadow(0 0 3px rgba(95,235,215,.75));  animation: pulse 3.4s ease-in-out infinite; }
@keyframes pulse {
  0%,100% { transform: scale(1);    opacity: .82; }
  50%     { transform: scale(1.22); opacity: 1; }
}

/* ── tether labels (desktop) ────────────────────────────────────────── */
.plabel {
  position: absolute;
  pointer-events: auto; cursor: pointer;
  max-width: 190px;
  transition: opacity .3s;
}
.plabel::before {
  content: ''; position: absolute; inset: -9px -14px;
  background: radial-gradient(ellipse, rgba(5,7,15,.78) 0%, rgba(5,7,15,.45) 55%, transparent 78%);
  z-index: -1;
}
.plabel.left  { text-align: right; }
.plabel.right { text-align: left; }
.plabel .role {
  font-family: var(--sans); font-size: 9.5px; letter-spacing: .28em;
  text-transform: uppercase; display: block; white-space: nowrap;
}
.plabel .kk {
  font-family: var(--mono); font-size: 11px; letter-spacing: .04em;
  color: var(--ink-2); display: block; margin-top: 3px;
  font-variant-numeric: tabular-nums;
}
.plabel.gold .role { color: var(--gold); }
.plabel.cyan .role { color: var(--lum); }
.plabel:hover .kk { color: var(--ink); }

/* ── prime chips (mobile) ───────────────────────────────────────────── */
#chips {
  position: fixed; top: 0; left: 0; right: 0;
  display: none; gap: 6px; padding: 10px 10px 0;
  justify-content: center; flex-wrap: wrap; z-index: 6;
}
.chip {
  font-family: var(--mono); font-size: 10px; letter-spacing: .04em;
  padding: 5px 9px; border-radius: 999px; cursor: pointer;
  background: rgba(9,13,26,.72); border: 1px solid rgba(95,235,215,.18);
  color: var(--ink-2); white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.chip .r { display: block; font-family: var(--sans); font-size: 7.5px; letter-spacing: .2em; text-transform: uppercase; margin-bottom: 1px; }
.chip.gold { border-color: rgba(242,196,107,.3); } .chip.gold .r { color: var(--gold); }
.chip.cyan { border-color: rgba(95,235,215,.3); }  .chip.cyan .r { color: var(--lum); }

/* ── chrome ─────────────────────────────────────────────────────────── */
#brand {
  position: fixed; top: 20px; left: 26px; z-index: 5;
  font-family: var(--sans); font-size: 13px; letter-spacing: .42em;
  text-transform: uppercase; color: var(--ink-3); pointer-events: none;
}
#brand small {
  display: block; font-size: 8.5px; letter-spacing: .24em;
  color: var(--ink-4); margin-top: 5px;
}
#datebar {
  position: fixed; bottom: calc(18px + env(safe-area-inset-bottom)); left: 26px; z-index: 6;
  display: flex; align-items: center; gap: 10px;
  font-family: var(--sans); font-size: 9.5px; letter-spacing: .28em;
  text-transform: uppercase; color: var(--ink-3);
}
#dob {
  font-family: var(--mono); font-size: 16px; /* 16px floor: iOS zooms below it */
  letter-spacing: .06em; color: var(--ink);
  background: transparent; border: none;
  border-bottom: 1px solid rgba(95,235,215,.35);
  padding: 4px 2px; width: 148px;
  -webkit-appearance: none; appearance: none;
  transition: border-color .25s, box-shadow .25s;
  font-variant-numeric: tabular-nums;
}
#dob:focus { outline: none; border-bottom-color: var(--lum); box-shadow: 0 4px 18px -6px rgba(95,235,215,.55); }
#dob::-webkit-calendar-picker-indicator { filter: invert(1) opacity(.55); cursor: pointer; }
#hint {
  position: fixed; bottom: calc(58px + env(safe-area-inset-bottom)); left: 26px; z-index: 6;
  font-family: var(--sans); font-size: 10px; letter-spacing: .12em;
  color: var(--lum); opacity: 0; transition: opacity .6s;
}
#hint.show { opacity: .82; animation: hintpulse 3s ease-in-out 2; }
@keyframes hintpulse { 0%,100% { opacity: .40; } 50% { opacity: .95; } }
#disclaimer {
  position: fixed; bottom: calc(20px + env(safe-area-inset-bottom)); right: 26px; z-index: 5;
  max-width: 260px; text-align: right;
  font-family: var(--sans); font-size: 9px; line-height: 1.7; letter-spacing: .09em;
  color: var(--ink-4); pointer-events: none;
}

/* readout chip that follows the pointer */
#readout {
  position: fixed; z-index: 8; pointer-events: none;
  font-family: var(--mono); font-size: 11.5px; letter-spacing: .03em;
  color: var(--ink); background: rgba(5,7,15,.88);
  border: 1px solid rgba(95,235,215,.22); border-radius: 3px;
  padding: 5px 9px; white-space: nowrap; opacity: 0;
  transition: opacity .18s; transform: translate(-50%, -50%);
  font-variant-numeric: tabular-nums;
}
#readout.show { opacity: 1; }
#readout b { color: var(--lum); font-weight: 400; }

/* scanner sweep on date change */
#scanner {
  position: fixed; left: 0; right: 0; top: 0; height: 1px; z-index: 7;
  background: linear-gradient(90deg, transparent, var(--lum), transparent);
  opacity: 0; pointer-events: none;
}
#scanner.run { animation: sweep 700ms ease-in-out 1; }
@keyframes sweep {
  0%   { opacity: 0;   transform: translateY(0); }
  12%  { opacity: .9; }
  88%  { opacity: .9; }
  100% { opacity: 0;   transform: translateY(100vh); }
}

/* ── reading panel ──────────────────────────────────────────────────── */
/* The reading sits inside the ring the scattered motes reform into.
   Geometry is set in JS from the ring radius. */
#panel {
  position: fixed; z-index: 10;
  opacity: 0; pointer-events: none;
  transition: opacity 380ms var(--ease) 240ms;
  overflow-y: auto; overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  background: radial-gradient(ellipse at 50% 45%, rgba(5,7,15,.94) 0%, rgba(5,7,15,.78) 58%, rgba(5,7,15,0) 100%);
  -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 30px, #000 calc(100% - 38px), transparent 100%);
  mask-image: linear-gradient(180deg, transparent 0, #000 30px, #000 calc(100% - 38px), transparent 100%);
}
body.reading #panel { opacity: 1; pointer-events: auto; }
#p-hex { display: flex; flex-direction: column-reverse; gap: 4px; margin-bottom: 20px; width: 50px; }
#p-hex i {
  display: block; height: 3px; border-radius: 1px;
  background: var(--axis, var(--steel));
  opacity: 0; transform: scaleX(.2);
  transition: opacity 340ms var(--ease), transform 460ms var(--ease);
}
body.reading #p-hex i { opacity: .9; transform: scaleX(1); }
#p-hex i.yin {
  background: linear-gradient(90deg, var(--axis, var(--steel)) 0 42%, transparent 42% 58%, var(--axis, var(--steel)) 58% 100%);
}
#p-close {
  position: absolute; top: 14px; right: 16px;
  width: 44px; height: 44px; border: none; background: transparent;
  color: var(--ink-3); font-size: 22px; cursor: pointer; line-height: 1;
  font-family: var(--sans); transition: color .2s;
}
#p-close:hover { color: var(--ink); }
#p-eyebrow {
  font-family: var(--sans); font-size: 10px; letter-spacing: .30em;
  text-transform: uppercase; color: var(--axis, var(--steel));
}
#p-name { font-size: 26px; font-weight: 400; line-height: 1.25; margin-top: 10px; color: var(--ink); }
#p-name:focus { outline: none; }
#p-tagline { font-size: 12.5px; font-style: italic; letter-spacing: .06em; color: rgba(95,235,215,.8); margin-top: 6px; }
#p-role {
  font-family: var(--sans); font-size: 11.5px; line-height: 1.75; letter-spacing: .02em;
  color: var(--ink-3); margin-top: 18px;
}

/* spectrum rail */
#p-spectrum { margin: 26px 0 8px; }
.rail { position: relative; height: 2px; background: linear-gradient(90deg, #4A4668 0%, var(--lum) 50%, var(--gold) 100%); }
.rail i {
  position: absolute; top: 50%; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px;
  border-radius: 50%; background: var(--ink);
}
.rail i.n0 { left: 0;    background: #6E6A92; }
.rail i.n1 { left: 50%;  background: var(--lum); box-shadow: 0 0 0 3px rgba(95,235,215,.18), 0 0 12px rgba(95,235,215,.6); }
.rail i.n2 { left: 100%; background: var(--gold); }
.specrow { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 12px; }
.specrow div { text-align: center; }
.specrow div:first-child { text-align: left; }
.specrow div:last-child { text-align: right; }
.specrow .w {
  font-family: var(--sans); font-size: 10.5px; letter-spacing: .10em;
  text-transform: uppercase; display: block; line-height: 1.45;
}
.specrow .c {
  font-family: var(--sans); font-size: 8.5px; letter-spacing: .22em;
  text-transform: uppercase; color: var(--ink-4); display: block; margin-top: 4px;
}
.specrow .s0 .w { color: var(--umbra); }
.specrow .s1 .w { color: var(--lum); }
.specrow .s2 .w { color: var(--gold); }
#p-note {
  font-family: var(--sans); font-size: 10.5px; line-height: 1.7; letter-spacing: .04em;
  color: var(--ink-4); margin-top: 14px; font-style: normal;
}

.slabel {
  font-family: var(--sans); font-size: 10px; letter-spacing: .30em;
  text-transform: uppercase; margin: 26px 0 10px;
}
.slabel.essence { color: var(--ink-4); margin-top: 26px; }
.slabel.mastery { color: var(--lum); margin-top: 26px; }
.slabel.shadow  { color: var(--umbra); }
.slabel.invite  { color: var(--gold); }

#p-essence {
  font-family: var(--sans); font-size: 12px; line-height: 1.8; letter-spacing: .02em;
  color: var(--ink-3);
}
/* Mastery is the centrepiece: size + drop cap + whitespace + opacity */
#p-mastery { font-size: 17px; line-height: 1.78; color: rgba(220,235,239,.94); }
#p-mastery::first-letter {
  float: left; font-size: 2.5em; line-height: .84;
  padding: 3px 8px 0 0; color: var(--lum);
}
#p-shadow { font-size: 14.5px; line-height: 1.68; color: var(--ink-2); }
#p-invite {
  font-size: 15px; line-height: 1.80; color: rgba(220,235,239,.84);
  border-left: 1px solid rgba(242,196,107,.35); padding-left: 18px;
}
#p-foot {
  margin-top: 42px; padding-top: 18px; border-top: 1px solid rgba(220,235,239,.08);
  font-family: var(--sans); font-size: 9.5px; line-height: 1.75; letter-spacing: .08em;
  color: var(--ink-4);
}

/* a11y mirror of the strand */
#strand { position: absolute; inset: 0; pointer-events: none; }
#strand:focus { outline: none; }
#strand:focus-visible { outline: 1px solid rgba(95,235,215,.5); outline-offset: -3px; }
#opts { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ── mobile ─────────────────────────────────────────────────────────── */
@media (max-width: 899px) {
  /* chips replace the tether labels entirely on mobile — the wordmark would
     collide with them, and the tethers would point at nothing. */
  #brand { display: none; }
  #chips { display: flex; }
  #labels { display: none; }
  #helix > g:nth-of-type(4) { display: none; }
  #disclaimer { display: none; }
  #datebar { left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom)); }
  #hint { left: 50%; transform: translateX(-50%); white-space: nowrap; bottom: calc(54px + env(safe-area-inset-bottom)); }
  #p-hex { margin-bottom: 14px; }
  #p-name { font-size: 21px; }
  #p-mastery { font-size: 16.5px; line-height: 1.8; }
  #p-essence { color: var(--ink-2); }
}

/* ── accessibility accommodations ───────────────────────────────────── */
@media (prefers-reduced-motion: reduce) {
  #bloom, .motes, .node, #scanner, #hint.show { animation: none !important; }
  #field, #panel, #readout { transition: none !important; }
}
@media (prefers-contrast: more) {
  .motes { display: none; }
  #bloom { opacity: .4 !important; }
  #p-shadow, #p-invite { color: rgba(220,235,239,.96); }
  #p-role { color: var(--ink-2); }
  .plabel::before { background: rgba(5,7,15,.94); }
}
</style>
</head>
<body>

<div id="field">
  <div id="bloom"></div>
  <div class="motes" id="m3"></div>
  <div class="motes" id="m2"></div>
  <div class="motes" id="m1"></div>
  <svg id="helix" aria-hidden="true"></svg>
  <div id="labels"></div>
</div>

<div id="strand" tabindex="0" role="listbox" aria-label="The sixty-four Gene Keys as a living strand">
  <div id="opts"></div>
</div>

<div id="brand">Gene Keys<small>The Living Strand</small></div>
<div id="chips"></div>

<div id="hint">This is a default date. Set yours.</div>
<div id="datebar">
  <span>Born</span>
  <input type="date" id="dob" min="1900-01-01">
</div>

<div id="disclaimer">A symbolic, archetypal system offered for reflection — not a statement of fact. Your birthdate never leaves this page.</div>

<div id="readout"></div>
<div id="scanner"></div>

<aside id="panel" role="dialog" aria-modal="false" aria-labelledby="p-name">
  <button id="p-close" aria-label="Close reading">&times;</button>
  <div id="p-hex" aria-hidden="true"></div>
  <div id="p-eyebrow"></div>
  <h2 id="p-name" tabindex="-1"></h2>
  <div id="p-tagline"></div>
  <div id="p-role"></div>
  <div id="p-spectrum"></div>
  <div id="p-note"></div>
  <div class="slabel essence" id="l-essence"></div>
  <div id="p-essence"></div>
  <div class="slabel mastery" id="l-mastery"></div>
  <div id="p-mastery"></div>
  <div class="slabel shadow" id="l-shadow"></div>
  <div id="p-shadow"></div>
  <div class="slabel invite" id="l-invite"></div>
  <div id="p-invite"></div>
  <div id="p-foot">A symbolic, archetypal system offered for reflection — not a statement of fact.</div>
</aside>

<script src="js/gene-keys.js"></script>
<script src="js/hexagrams.js"></script>
<script src="js/gk-roles.js"></script>
<script src="js/gene-keys-content.js" defer></script>
<script src="js/gk-lifeswork.js" defer></script>
<script src="js/gk-evolution.js" defer></script>
<script src="js/gk-radiance.js" defer></script>
<script src="js/gk-purpose.js" defer></script>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   Boot runs during parse, before the deferred 200KB content module — the
   strand is alive immediately and readings fill in once content lands.
   ═══════════════════════════════════════════════════════════════════════ */

const SVGNS = 'http://www.w3.org/2000/svg';
const N = 64;
const TURNS = 2;
// 360*TURNS/N = 11.25°. Because exactly 32 rungs span a full turn, there are
// only 32 distinct (x, depth) values at any instant — a free 2x trig saving.
const K = Math.PI / 16;
const PERIOD = N / TURNS;   // 32
const ROT_MS = 56000;
const FRAME_MS = 32;          // 30fps: max rung motion 0.30px/frame
const BREAKPOINT = 900;

const helix  = document.getElementById('helix');
const labels = document.getElementById('labels');
const fieldEl = document.getElementById('field');
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)');

// ── geometry state ────────────────────────────────────────────────────
let W = 0, H = 0, CX = 0, PAD_Y = 26, pitch = 10, TURN_H = 160, A = 80;
let phi = 0, speed = 1, running = false, rafId = 0, lastT = 0;

const gBack = document.createElementNS(SVGNS, 'g');
const gBackL = document.createElementNS(SVGNS, 'g');
const gBackR = document.createElementNS(SVGNS, 'g');
const gRung = document.createElementNS(SVGNS, 'g');
const gCur  = document.createElementNS(SVGNS, 'g');
const gTeth = document.createElementNS(SVGNS, 'g');
const gNode = document.createElementNS(SVGNS, 'g');
gBack.appendChild(gBackL); gBack.appendChild(gBackR);
const gMote = document.createElementNS(SVGNS, 'g');
const ringGuide = document.createElementNS(SVGNS, 'ellipse');
ringGuide.setAttribute('fill', 'none');
ringGuide.setAttribute('stroke', 'rgba(95,235,215,.14)');
ringGuide.setAttribute('stroke-width', '0.7');
gMote.appendChild(ringGuide);
gMote.style.display = 'none';
helix.appendChild(gBack); helix.appendChild(gRung); helix.appendChild(gCur);
helix.appendChild(gMote);
helix.appendChild(gTeth); helix.appendChild(gNode);

/* ── SCATTER ─────────────────────────────────────────────────────────────
   Opening a key breaks the strand apart: all 64 base pairs let go and drift
   as free motes, then swarm back into a ring around the key you chose, which
   holds the centre. The reading sets inside that ring. Each mote follows a
   quadratic Bézier from its place on the helix, out through a scatter point,
   in to its seat on the ring — so it bursts and converges in one motion
   instead of stopping in between.                                         */
const SCATTER_MS = 1150;
let scatterIdx = -1, scatterAmt = 0, scFrom = 0, scTo = 0, scT0 = 0;
let scAnimating = false, ringRX = 300, ringRY = 260;
const moteEls = [];
// deterministic per-mote burst direction and throw distance — stable across
// frames and resizes, no RNG state to carry
const burstA = new Float64Array(N), burstD = new Float64Array(N);
for (let i = 0; i < N; i++) {
  burstA[i] = i * 2.399963229728653;                       // golden angle, even spread
  const h = Math.sin(i * 12.9898) * 43758.5453;
  burstD[i] = 0.55 + 0.85 * (h - Math.floor(h));
}
const easeIO = k => (k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);

const rungs = [];        // 64 <line>, index 0..63
const rungBucket = new Int8Array(N).fill(-1);
const backL = [], backR = [];

// key number -> rung index, built once. Removes the modular segment
// arithmetic both pages previously duplicated.
const INDEX_OF = {};
DGeneKeys.WHEEL.forEach((k, i) => { INDEX_OF[k] = i; });

// ── depth lookup: 32 buckets of ready-made style strings ──────────────
function hex(h) { return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
function lerpC(a, b, t) {
  const A1 = hex(a), B1 = hex(b);
  return 'rgb(' + Math.round(A1[0]+(B1[0]-A1[0])*t) + ',' +
                  Math.round(A1[1]+(B1[1]-A1[1])*t) + ',' +
                  Math.round(A1[2]+(B1[2]-A1[2])*t) + ')';
}
const LUT = { dim: [], gold: [], cyan: [], back: [] };
for (let b = 0; b < 32; b++) {
  const t = b / 31;
  LUT.dim[b]  = { s: lerpC('#16223F', '#5B87A8', Math.pow(t, .8)),
                  o: (0.045 + 0.60 * Math.pow(t, 2.3)).toFixed(3),
                  w: (0.5 + 1.7 * t).toFixed(2) };
  LUT.back[b] = { s: lerpC('#131E38', '#4E769A', Math.pow(t, .8)),
                  o: (0.10 + 0.52 * Math.pow(t, 1.9)).toFixed(3),
                  w: (0.6 + 1.5 * t).toFixed(2) };
  LUT.gold[b] = { s: lerpC('#6B5426', '#FFD98A', Math.pow(t, .8)),
                  o: (0.5 + 0.5 * Math.pow(t, 1.2)).toFixed(3),
                  w: (2.0 + 2.0 * t).toFixed(2) };
  LUT.cyan[b] = { s: lerpC('#276E76', '#7FF5E2', Math.pow(t, .8)),
                  o: (0.55 + 0.45 * Math.pow(t, 1.2)).toFixed(3),
                  w: (1.8 + 1.8 * t).toFixed(2) };
}

// ── primes ────────────────────────────────────────────────────────────
const ROLES = [
  ['lifesWork', "Life's Work", 'how your genius wants to express itself in the world'],
  ['evolution', 'Evolution',   'what your life keeps asking you to work through'],
  ['radiance',  'Radiance',    'what keeps you physically and emotionally lit'],
  ['purpose',   'Purpose',     'the deep reason running underneath it all'],
];
let primes = null;
let primeByIdx = {};   // rung index -> { roleIdx, key, axis }
let nodeEls = [], tethEls = [], labelEls = [], curDots = [];

// ── layout ────────────────────────────────────────────────────────────
function insets() {
  const mobile = window.innerWidth < BREAKPOINT;
  return mobile ? { t: 76, b: 84 } : { t: 56, b: 56 };
}
function layout() {
  const ins = insets();
  W = window.innerWidth;
  H = Math.max(240, window.innerHeight - ins.t - ins.b);
  CX = W / 2;
  PAD_Y = H < 600 ? 16 : 26;
  pitch = (H - 2 * PAD_Y) / (N - 1);
  TURN_H = PERIOD * pitch;
  A = Math.min(Math.max(0.22 * W, 44), 0.44 * TURN_H);
  helix.setAttribute('viewBox', '0 0 ' + W + ' ' + (H + ins.t + ins.b));
  helix.style.setProperty('--top', ins.t + 'px');
  buildBackbones(ins.t);
  placeRungs(ins.t);
  placePrimes(ins.t);
  renderFrame(true);
}
function yOf(i, top) { return top + PAD_Y + i * pitch; }

/* A sine phase shift IS a vertical translation, so each backbone is built
   once (extended a full turn beyond both ends) with depth baked into
   sub-paths, then only translated per frame. No path ever rebuilds. */
function buildBackbones(top) {
  gBackL.textContent = ''; gBackR.textContent = '';
  backL.length = 0; backR.length = 0;
  const step = pitch / 6, segH = TURN_H / 8;
  const y0 = top + PAD_Y - TURN_H, y1 = top + PAD_Y + (N - 1) * pitch + TURN_H;
  for (const [sign, g, arr] of [[-1, gBackL, backL], [1, gBackR, backR]]) {
    for (let ys = y0; ys < y1; ys += segH) {
      const ye = Math.min(ys + segH + step, y1);
      let d = '';
      for (let y = ys; y <= ye + 1e-9; y += step) {
        const th = (y - top - PAD_Y) * K / pitch;
        d += (d ? 'L' : 'M') + (CX + sign * A * Math.sin(th)).toFixed(2) + ',' + y.toFixed(2);
      }
      const midTh = (ys + segH / 2 - top - PAD_Y) * K / pitch;
      const b = Math.min(31, Math.max(0, ((Math.cos(midTh) + 1) / 2 * 31) | 0));
      const p = document.createElementNS(SVGNS, 'path');
      p.setAttribute('d', d);
      p.setAttribute('fill', 'none');
      p.setAttribute('stroke-linecap', 'round');
      p.setAttribute('stroke', LUT.back[b].s);
      p.setAttribute('stroke-opacity', LUT.back[b].o);
      p.setAttribute('stroke-width', LUT.back[b].w);
      g.appendChild(p); arr.push(p);
    }
  }
}

function buildMotes() {
  if (moteEls.length) return;
  for (let i = 0; i < N; i++) {
    const c = document.createElementNS(SVGNS, 'circle');
    c.setAttribute('r', '2');
    gMote.appendChild(c);
    moteEls.push(c);
  }
}

function placeRungs(top) {
  if (!rungs.length) {
    for (let i = 0; i < N; i++) {
      const l = document.createElementNS(SVGNS, 'line');
      l.setAttribute('stroke-linecap', 'round');
      gRung.appendChild(l); rungs.push(l);
    }
  }
  for (let i = 0; i < N; i++) {
    const y = yOf(i, top);
    rungs[i].setAttribute('y1', y); rungs[i].setAttribute('y2', y);
  }
  rungBucket.fill(-1);
}

// ── the frame ─────────────────────────────────────────────────────────
const sinT = new Float64Array(PERIOD), cosT = new Float64Array(PERIOD);
function renderFrame(force) {
  for (let j = 0; j < PERIOD; j++) { const th = j * K + phi; sinT[j] = Math.sin(th); cosT[j] = Math.cos(th); }
  for (let i = 0; i < N; i++) {
    const j = i % PERIOD, s = sinT[j];
    const el = rungs[i];
    el.setAttribute('x1', (CX - A * s * 0.9).toFixed(2));
    el.setAttribute('x2', (CX + A * s * 0.9).toFixed(2));
    const t = (cosT[j] + 1) / 2;
    const b = Math.min(31, (t * 31) | 0);
    if (force || rungBucket[i] !== b) {
      rungBucket[i] = b;
      const p = primeByIdx[i];
      const L = p ? LUT[p.axis] : LUT.dim;
      el.setAttribute('stroke', L[b].s);
      el.setAttribute('stroke-opacity', L[b].o);
      el.setAttribute('stroke-width', L[b].w);
    }
  }
  // backbones: translate only
  let dy = (-phi * pitch / K) % TURN_H; if (dy < 0) dy += TURN_H;
  gBack.style.transform = 'translate3d(0,' + dy.toFixed(2) + 'px,0)';

  if (scatterAmt > 0) renderMotes();
  // tethers follow the outer extent of their rung
  const top = insets().t;
  for (const th of tethEls) {
    const s = Math.abs(sinT[th.idx % PERIOD]);
    th.el.setAttribute(th.side < 0 ? 'x1' : 'x1', th.anchor);
    th.el.setAttribute('x2', (CX + th.side * A * s).toFixed(2));
  }
  for (const d of curDots) {
    const y = d.y0 + ((d.t) % 1) * d.span;
    const th = (y - top - PAD_Y) * K / pitch;
    d.el.setAttribute('cx', (CX + d.side * A * Math.sin(th)).toFixed(2));
    d.el.setAttribute('cy', y.toFixed(2));
  }
}

// Bézier from the helix, out through the burst point, in to the ring seat.
function renderMotes() {
  const top = insets().t;
  const t = scatterAmt, mt = 1 - t;
  const cx = CX, cy = top + H / 2;
  // the strand recedes as the motes take over
  gRung.style.opacity = gBack.style.opacity = (1 - t).toFixed(3);
  gMote.style.display = '';
  let seat = 0;
  for (let i = 0; i < N; i++) {
    const j = i % PERIOD;
    const x0 = CX;                      // every rung's midpoint is exactly CX
    const y0 = yOf(i, top);
    let x2, y2, r, col, op;
    const p = primeByIdx[i];
    if (i === scatterIdx) {
      // the key you opened crowns the ring — the centre belongs to the reading
      x2 = cx; y2 = cy - ringRY; r = 5.2;
      col = p ? (p.axis === 'gold' ? '#F2C46B' : '#5FEBD7') : '#9FD4E6';
      op = 1;
    } else {
      const ang = ((seat + 1) / N) * Math.PI * 2 - Math.PI / 2;
      seat++;
      x2 = cx + ringRX * Math.cos(ang);
      y2 = cy + ringRY * Math.sin(ang);
      r = p ? 3.4 : 2.5;
      col = p ? (p.axis === 'gold' ? '#F2C46B' : '#5FEBD7') : '#89B4CE';
      op = p ? 1 : 0.72;
    }
    // burst waypoint, thrown outward from the strand
    const bx = x0 + Math.cos(burstA[i]) * ringRX * burstD[i] * 1.35;
    const by = y0 + Math.sin(burstA[i]) * ringRY * burstD[i] * 1.15;
    const x = mt * mt * x0 + 2 * mt * t * bx + t * t * x2;
    const y = mt * mt * y0 + 2 * mt * t * by + t * t * y2;
    const el = moteEls[i];
    el.setAttribute('cx', x.toFixed(1));
    el.setAttribute('cy', y.toFixed(1));
    el.setAttribute('r', (1.4 + (r - 1.4) * t).toFixed(2));
    el.setAttribute('fill', col);
    el.setAttribute('fill-opacity', (op * Math.min(1, t * 3)).toFixed(3));
    el.style.filter = (i === scatterIdx && t > .6) ? 'drop-shadow(0 0 5px ' + col + ')' : '';
  }
  ringGuide.setAttribute('cx', cx); ringGuide.setAttribute('cy', cy);
  ringGuide.setAttribute('rx', ringRX); ringGuide.setAttribute('ry', ringRY);
  ringGuide.setAttribute('stroke-opacity', (0.16 * Math.max(0, t * 2 - 1)).toFixed(3));
}

function loop(now) {
  rafId = requestAnimationFrame(loop);
  if (now - lastT < FRAME_MS) return;
  const dt = Math.min(100, now - lastT); lastT = now;
  if (scAnimating) {
    const k = Math.min(1, (now - scT0) / SCATTER_MS);
    scatterAmt = scFrom + (scTo - scFrom) * easeIO(k);
    positionSlate();
    if (k >= 1) {
      scatterAmt = scTo; scAnimating = false;
      if (scatterAmt === 0) {
        scatterIdx = -1; gMote.style.display = 'none';
        gRung.style.opacity = gBack.style.opacity = '1';
      }
    }
  }
  if (scatterAmt === 0 && !scAnimating) {
    phi += (dt / ROT_MS) * Math.PI * 2 * speed;
    for (const d of curDots) d.t += dt / 5000;
  }
  renderFrame(false);
}
function start() {
  if (running || REDUCED.matches) return;
  running = true; lastT = performance.now(); rafId = requestAnimationFrame(loop);
}
function stop() { running = false; cancelAnimationFrame(rafId); }

document.addEventListener('visibilitychange', () => { document.hidden ? stop() : start(); });
REDUCED.addEventListener('change', () => {
  if (REDUCED.matches) { stop(); phi = -K * 32; renderFrame(true); } else start();
});

// ── primes on the strand ──────────────────────────────────────────────
function placePrimes(top) {
  gNode.textContent = ''; gTeth.textContent = ''; gCur.textContent = '';
  labels.textContent = '';
  nodeEls = []; tethEls = []; labelEls = []; curDots = [];
  if (!primes) return;
  const chips = document.getElementById('chips');
  chips.textContent = '';

  ROLES.forEach((r, roleIdx) => {
    const key = primes[r[0]].key;
    const idx = INDEX_OF[key];
    const axis = roleIdx < 2 ? 'gold' : 'cyan';   // index-based, never string equality
    const side = roleIdx < 2 ? -1 : 1;
    const y = yOf(idx, top);

    const c = document.createElementNS(SVGNS, 'circle');
    c.setAttribute('cx', CX); c.setAttribute('cy', y); c.setAttribute('r', 4.2);
    c.setAttribute('fill', axis === 'gold' ? '#F2C46B' : '#5FEBD7');
    c.setAttribute('class', 'node ' + axis);
    c.style.animationDelay = (roleIdx * 0.85) + 's';
    gNode.appendChild(c); nodeEls.push(c);

    const anchor = side < 0 ? Math.max(10, CX - A - 26) : Math.min(W - 10, CX + A + 26);
    const t = document.createElementNS(SVGNS, 'line');
    t.setAttribute('y1', y); t.setAttribute('y2', y);
    t.setAttribute('x1', anchor);
    t.setAttribute('stroke', axis === 'gold' ? 'rgba(242,196,107,.4)' : 'rgba(95,235,215,.4)');
    t.setAttribute('stroke-width', '0.7');
    gTeth.appendChild(t);
    tethEls.push({ el: t, idx: idx, side: side, anchor: anchor });

    const lab = document.createElement('div');
    lab.className = 'plabel ' + axis + ' ' + (side < 0 ? 'left' : 'right');
    lab.innerHTML = '<span class="role"></span><span class="kk"></span>';
    lab.querySelector('.role').textContent = r[1];
    lab.querySelector('.kk').textContent = 'Key ' + key + ' · ' + DGeneKeys.KEYS[key].gift;
    lab.style.top = (y - 16) + 'px';
    if (side < 0) { lab.style.right = (W - anchor + 12) + 'px'; }
    else { lab.style.left = (anchor + 12) + 'px'; }
    lab.addEventListener('click', () => openKey(key));
    labels.appendChild(lab); labelEls.push(lab);

    const chip = document.createElement('div');
    chip.className = 'chip ' + axis;
    chip.innerHTML = '<span class="r"></span>';
    chip.querySelector('.r').textContent = r[1];
    chip.appendChild(document.createTextNode('Key ' + key));
    chip.addEventListener('click', () => openKey(key));
    chips.appendChild(chip);
  });

  // currents: 8 dots per axis, mirrored onto opposite backbones so the two
  // never overlap (the pairs sit at identical helical phase).
  [['lifesWork', 'evolution', -1, 'rgba(242,196,107,.9)'],
   ['radiance', 'purpose', 1, 'rgba(95,235,215,.9)']].forEach(([a, b, side, col]) => {
    const ya = yOf(INDEX_OF[primes[a].key], top), yb = yOf(INDEX_OF[primes[b].key], top);
    const y0 = Math.min(ya, yb), span = Math.abs(yb - ya) || 1;
    for (let n = 0; n < 8; n++) {
      const d = document.createElementNS(SVGNS, 'circle');
      d.setAttribute('r', 1.5); d.setAttribute('fill', col);
      gCur.appendChild(d);
      curDots.push({ el: d, y0: y0, span: span, side: side, t: n / 8 });
    }
  });
}

// ── a11y mirror ───────────────────────────────────────────────────────
const strandEl = document.getElementById('strand');
const optsEl = document.getElementById('opts');
let activeIdx = 0;
function buildOpts() {
  optsEl.textContent = '';
  for (let i = 0; i < N; i++) {
    const key = DGeneKeys.WHEEL[i], k = DGeneKeys.KEYS[key];
    const o = document.createElement('div');
    o.id = 'opt-' + key; o.setAttribute('role', 'option');
    o.textContent = 'Gene Key ' + key + ', ' + k.shadow + ' to ' + k.gift + ' to ' + k.siddhi;
    optsEl.appendChild(o);
  }
}
function setActive(i) {
  activeIdx = Math.max(0, Math.min(N - 1, i));
  const key = DGeneKeys.WHEEL[activeIdx];
  strandEl.setAttribute('aria-activedescendant', 'opt-' + key);
  showReadout(key, CX, yOf(activeIdx, insets().t));
}

// ── pointer ───────────────────────────────────────────────────────────
const readout = document.getElementById('readout');
function idxAtY(clientY, offset) {
  const pt = new DOMPoint(0, clientY - (offset || 0));
  const m = helix.getScreenCTM();
  if (!m) return 0;
  const p = pt.matrixTransform(m.inverse());
  return Math.max(0, Math.min(N - 1, Math.round((p.y - insets().t - PAD_Y) / pitch)));
}
function showReadout(key, x, y) {
  const k = DGeneKeys.KEYS[key];
  readout.innerHTML = '<b></b> ';
  readout.querySelector('b').textContent = key;
  readout.appendChild(document.createTextNode('· ' + k.shadow + ' → ' + k.gift + ' → ' + k.siddhi));
  readout.style.left = Math.max(90, Math.min(window.innerWidth - 90, x)) + 'px';
  readout.style.top = Math.max(30, y) + 'px';
  readout.classList.add('show');
}
function hideReadout() { readout.classList.remove('show'); }

let scrubbing = false;
helix.addEventListener('pointermove', (e) => {
  if (e.pointerType === 'touch' && !scrubbing) return;
  const off = e.pointerType === 'touch' ? 52 : 0;
  const i = idxAtY(e.clientY, off);
  activeIdx = i;
  showReadout(DGeneKeys.WHEEL[i], e.clientX, e.clientY - off - 26);
}, { passive: true });
helix.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'touch') {
    scrubbing = true; helix.setPointerCapture(e.pointerId);
    const i = idxAtY(e.clientY, 52); activeIdx = i;
    showReadout(DGeneKeys.WHEEL[i], e.clientX, e.clientY - 78);
  }
});
helix.addEventListener('pointerup', (e) => {
  const off = e.pointerType === 'touch' ? 52 : 0;
  const i = idxAtY(e.clientY, off);
  scrubbing = false; hideReadout();
  strandEl.focus({ preventScroll: true });
  openKey(DGeneKeys.WHEEL[i]);
});
helix.addEventListener('pointerleave', hideReadout);

strandEl.addEventListener('keydown', (e) => {
  const k = e.key;
  if (k === 'ArrowDown') { setActive(activeIdx + 1); e.preventDefault(); }
  else if (k === 'ArrowUp') { setActive(activeIdx - 1); e.preventDefault(); }
  else if (k === 'PageDown') { setActive(activeIdx + 8); e.preventDefault(); }
  else if (k === 'PageUp') { setActive(activeIdx - 8); e.preventDefault(); }
  else if (k === 'Home') { setActive(0); e.preventDefault(); }
  else if (k === 'End') { setActive(N - 1); e.preventDefault(); }
  else if (k === 'p' || k === 'P') {
    if (!primes) return;
    const list = ROLES.map(r => INDEX_OF[primes[r[0]].key]).sort((a, b) => a - b);
    setActive(list.find(i => i > activeIdx) ?? list[0]); e.preventDefault();
  }
  else if (k === 'Enter' || k === ' ') { openKey(DGeneKeys.WHEEL[activeIdx]); e.preventDefault(); }
  else if (k === 'Escape') closePanel();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePanel(); });

// ── the reading ───────────────────────────────────────────────────────
const panel = document.getElementById('panel');
let openIdx = null;

function spectrumHTML(k) {
  const wrap = document.getElementById('p-spectrum');
  wrap.textContent = '';
  const rail = document.createElement('div');
  rail.className = 'rail';
  ['n0', 'n1', 'n2'].forEach(c => { const i = document.createElement('i'); i.className = c; rail.appendChild(i); });
  const row = document.createElement('div');
  row.className = 'specrow';
  [['s0', k.shadow, 'Shadow'], ['s1', k.gift, 'Gift'], ['s2', k.siddhi, 'Siddhi']].forEach(([cls, word, cap]) => {
    const d = document.createElement('div'); d.className = cls;
    const w = document.createElement('span'); w.className = 'w'; w.textContent = word;
    const c = document.createElement('span'); c.className = 'c'; c.textContent = cap;
    d.appendChild(w); d.appendChild(c); row.appendChild(d);
  });
  wrap.appendChild(rail); wrap.appendChild(row);
}

// Reading column inscribed in the ring, plus the furniture that belongs to
// the wound strand hidden while it is scattered.
function positionSlate() {
  const top = insets().t;
  // Ring first, then a column INSCRIBED in it: a rectangle fits inside an
  // ellipse only while (w/2/rx)^2 + (h/2/ry)^2 <= 1, and 1.30 leaves that at
  // ~0.84 — enough margin that the arc never clips a line of text.
  ringRX = Math.min(W / 2 - 12, 470);
  ringRY = Math.min(H / 2 - 10, 400);
  const colW = Math.max(180, Math.min(620, ringRX * 1.30));
  const colH = Math.max(200, Math.min(H * 0.72, ringRY * 1.30));
  panel.style.width = colW + 'px';
  panel.style.left = (CX - colW / 2) + 'px';
  panel.style.top = (top + H / 2 - colH / 2) + 'px';
  panel.style.height = colH + 'px';
  panel.style.padding = (W < BREAKPOINT ? '18px 6px 30px' : '26px 14px 36px');
  const wound = scatterAmt < 0.05;
  gNode.style.display = wound ? '' : 'none';
  gTeth.style.display = wound ? '' : 'none';
  gCur.style.display  = wound ? '' : 'none';
  labels.style.opacity = wound ? '1' : '0';
}

function renderHexagram(n) {
  const box = document.getElementById('p-hex');
  box.textContent = '';
  const lines = window.DHexagrams ? DHexagrams.lines(n) : null;
  if (!lines) return;
  lines.forEach((v, k) => {                 // bottom line first; CSS reverses
    const i = document.createElement('i');
    if (!v) i.className = 'yin';
    i.style.transitionDelay = (240 + k * 55) + 'ms';
    box.appendChild(i);
  });
}

function openKey(n) {
  const k = DGeneKeys.KEYS[n];
  if (!k || !primes) return;
  const roleIdx = ROLES.findIndex(r => primes[r[0]].key === n);
  const role = roleIdx >= 0 ? ROLES[roleIdx] : null;
  const c = window.DGeneKeysContent ? DGeneKeysContent.get(n) : null;

  openIdx = INDEX_OF[n];
  activeIdx = openIdx;
  const axis = role ? (roleIdx < 2 ? 'var(--gold)' : 'var(--lum)') : 'var(--steel)';
  panel.style.setProperty('--axis', axis);

  document.getElementById('p-eyebrow').textContent =
    role ? 'Gene Key ' + n + ' · Your ' + role[1] : 'Gene Key ' + n;
  document.getElementById('p-name').textContent = k.name;
  document.getElementById('p-tagline').textContent = c ? c.tagline : '';
  document.getElementById('p-role').textContent = role
    ? 'Read as your ' + role[1] + ' — ' + role[2] + '.'
    : 'Not one of your four primes — an energy you meet in the world and in others rather than carry as a life theme.';

  spectrumHTML(k);
  document.getElementById('p-note').textContent = (k.gift === k.siddhi)
    ? 'In Key ' + n + ' the Gift and the Siddhi share one name — ' + k.gift + ' is both the practice and its flowering.'
    : '';

  // Definitional framing lives here, never inside Mastery — Mastery is about
  // the person. Hidden entirely when a key has no essence written yet.
  // Position-specific reading when this key is one of the four primes and
  // that role's file has shipped; otherwise the universal archetype reading.
  const pos = role ? (window.DGKRoles ? DGKRoles.get(role[0], n) : null) : null;
  const prose = pos || c;

  const ess = c && c.essence ? c.essence : '';
  document.getElementById('p-essence').textContent = ess;
  document.getElementById('l-essence').textContent = ess ? 'What this gift is' : '';
  document.getElementById('l-essence').style.display = ess ? '' : 'none';
  document.getElementById('p-essence').style.display = ess ? '' : 'none';

  document.getElementById('l-mastery').textContent = 'Mastery · ' + k.gift;
  document.getElementById('l-shadow').textContent = 'The Shadow · ' + k.shadow;
  document.getElementById('l-invite').textContent = 'Invitation · toward ' + k.siddhi;

  const pending = !c && document.readyState !== 'complete';
  document.getElementById('p-mastery').textContent = prose ? prose.gift
    : (pending ? 'Opening…' : 'The full contemplation for this key is still being written.');
  document.getElementById('p-shadow').textContent = prose ? prose.shadow : '';
  document.getElementById('p-invite').textContent = prose ? prose.invitation : '';
  panel.dataset.reading = pos ? 'position' : 'universal';
  if (pending) window.addEventListener('DOMContentLoaded', () => { if (openIdx === INDEX_OF[n]) openKey(n); }, { once: true });

  const mobile = window.innerWidth < BREAKPOINT;
  panel.setAttribute('aria-modal', mobile ? 'true' : 'false');

  buildMotes();
  renderHexagram(n);
  scatterIdx = INDEX_OF[n];
  scFrom = scatterAmt; scTo = 1; scT0 = performance.now();
  scAnimating = !REDUCED.matches;
  if (REDUCED.matches) { scatterAmt = 1; scAnimating = false; }
  positionSlate();
  document.body.classList.add('reading');
  panel.scrollTop = 0;
  start();
  document.getElementById('p-name').focus({ preventScroll: true });
  if (c) document.title = c.title + ' — Gene Keys';
  try { history.replaceState(null, '', location.pathname + '?dob=' + dobInput.value + '&key=' + n); } catch (_) {}

}
function closePanel() {
  if (!document.body.classList.contains('reading')) return;
  document.body.classList.remove('reading');
  openIdx = null;
  document.title = 'Gene Keys — The Living Strand';
  scFrom = scatterAmt; scTo = 0; scT0 = performance.now();
  scAnimating = !REDUCED.matches;
  if (REDUCED.matches) {
    scatterAmt = 0; scatterIdx = -1; gMote.style.display = 'none';
    gRung.style.opacity = gBack.style.opacity = '1'; positionSlate();
  }
  speed = 1; start();
  strandEl.focus({ preventScroll: true });
  try { history.replaceState(null, '', location.pathname + '?dob=' + dobInput.value); } catch (_) {}
}
document.getElementById('p-close').addEventListener('click', closePanel);

// ── date ──────────────────────────────────────────────────────────────
const dobInput = document.getElementById('dob');
dobInput.max = new Date().toISOString().slice(0, 10);   // no future birthdates

function currentISO() {
  const [y, m, d] = (dobInput.value || '').split('-').map(Number);
  return (d >= 1 && d <= 31 && m >= 1 && m <= 12 && y >= 1900 && y <= 2100) ? dobInput.value : null;
}
function apply(firstRun) {
  const iso = currentISO();
  if (!iso) return;
  primes = DGeneKeys.primes(iso);
  primeByIdx = {};
  ROLES.forEach((r, roleIdx) => {
    primeByIdx[INDEX_OF[primes[r[0]].key]] = { roleIdx: roleIdx, key: primes[r[0]].key, axis: roleIdx < 2 ? 'gold' : 'cyan' };
  });
  layout();
  if (!firstRun) {
    // an open reading belongs to the old date
    closePanel();
    const s = document.getElementById('scanner');
    s.classList.remove('run'); void s.offsetWidth; s.classList.add('run');
  }
}
dobInput.addEventListener('change', () => apply(false));

// ── boot ──────────────────────────────────────────────────────────────
buildOpts();
const params = new URLSearchParams(location.search);
const urlDob = params.get('dob');
const hasDob = urlDob && /^\d{4}-\d{2}-\d{2}$/.test(urlDob);
dobInput.value = hasDob ? urlDob : '1990-01-01';
apply(true);

if (REDUCED.matches) { phi = -K * 32; renderFrame(true); } else start();

if (!hasDob) {
  const h = document.getElementById('hint');
  setTimeout(() => h.classList.add('show'), 900);
  setTimeout(() => h.classList.remove('show'), 9000);
}
const urlKey = Number(params.get('key'));
if (urlKey >= 1 && urlKey <= 64) {
  const openWhenReady = () => openKey(urlKey);
  if (window.DGeneKeysContent) openWhenReady();
  else window.addEventListener('DOMContentLoaded', openWhenReady, { once: true });
}

let rt = 0;
function onResize() { clearTimeout(rt); rt = setTimeout(layout, 120); }
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', onResize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize);
</script>
