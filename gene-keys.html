<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#04050A">
<title>Gene Keys — Hologenetic Profile</title>
<meta name="description" content="Your Gene Keys Hologenetic Profile, drawn as a bioluminescent mandala: thirteen spheres glowing in your own colours, one for each sequence.">
<link rel="preload" as="script" href="js/gene-keys-content.js">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   BIOLUMINESCENT MANDALA — deep water, one colour source per sequence,
   nothing else in the frame competes with it. No categorical colour on
   text or chrome; only the thirteen spheres and the reading panel's edge
   ever carry a sequence colour.
   ═══════════════════════════════════════════════════════════════════════ */
:root {
  color-scheme: dark;
  --ground: #04050A;
  --ink: #DCEFFF;
  --ink-2: #8C96AC;
  --ink-3: #5C6478;
  --mono: ui-monospace, 'SF Mono', 'Roboto Mono', 'DM Mono', Menlo, monospace;
  --serif: 'Iowan Old Style', Georgia, 'Times New Roman', serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--ground);
  color: var(--ink);
  font-family: var(--mono);
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
#ambient { position: fixed; inset: 0; z-index: 0; pointer-events: none; display: block; }
#hdr {
  position: fixed; left: 26px; top: 24px; z-index: 6; right: 26px;
  font-size: 9px; letter-spacing: .24em; text-transform: uppercase; color: var(--ink-3);
  display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
}
#hdr b { color: var(--ink-2); font-weight: 500; }
#transit { color: var(--ink-3); white-space: nowrap; }
#transit .own { color: #9FEFE0; }
#transit.clickable { cursor: pointer; }
#transit.clickable:hover { color: var(--ink-2); }

/* ── mobile rim legend ─────────────────────────────────────────────────
   Replaces the radial labels below 900px, where twelve of them around a
   narrow rim collide. A horizontally-scrolling strip of the same twelve
   spheres, same colour and brightness rule, same tap target. */
#legend {
  display: none;
  position: fixed; left: 0; right: 0; bottom: 108px; z-index: 6;
  padding: 0 14px; gap: 8px;
  overflow-x: auto; -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
#legend::-webkit-scrollbar { display: none; }
#legend .chip {
  flex: 0 0 auto; display: flex; flex-direction: column; gap: 3px;
  padding: 8px 12px; border-radius: 10px;
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07);
  font: inherit; text-align: left; cursor: pointer;
  transition: background .25s ease, border-color .25s ease;
}
#legend .chip b {
  font: 500 10.5px var(--mono); color: var(--ink); white-space: nowrap;
  border-left: 2px solid var(--chip-col, var(--ink-3)); padding-left: 7px;
}
#legend .chip i {
  font: 400 8px var(--mono); font-style: normal; letter-spacing: .08em;
  color: var(--chip-col, var(--ink-3)); padding-left: 9px; white-space: nowrap;
}
#legend .chip.on { background: rgba(255,255,255,0.09); border-color: var(--chip-col, rgba(255,255,255,.2)); }
#legend .chip:disabled { cursor: default; }

/* ── mobile preview card ───────────────────────────────────────────────
   First tap on a sphere shows this — a small card of "what it is," not
   the full reading — second tap (on the sphere again, or on the card
   itself) opens the real panel. */
#previewCard {
  position: fixed; z-index: 15; left: 0; top: 0;
  transform: translate(-50%, -50%) scale(.85); opacity: 0; pointer-events: none;
  transition: opacity .25s ease, transform .25s cubic-bezier(.22,.9,.3,1.2);
  background: rgba(9,10,17,.94); border: 1px solid rgba(255,255,255,.09);
  border-left: 2px solid var(--pc-col, #CFEFFF); border-radius: 10px;
  padding: 10px 14px; min-width: 168px; max-width: 240px;
  box-shadow: 0 0 24px var(--pc-glow, rgba(207,239,255,.18)), 0 8px 24px rgba(0,0,0,.5);
}
#previewCard.on { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; }
#previewCard b {
  display: block; font: 500 13px var(--mono); color: var(--ink); letter-spacing: .01em;
}
#previewCard i {
  display: block; font: 400 9px var(--mono); font-style: normal; letter-spacing: .1em;
  color: var(--pc-col, var(--ink-3)); margin-top: 3px;
}
#previewCard em {
  display: block; font: 400 8px var(--mono); font-style: normal; letter-spacing: .16em;
  text-transform: uppercase; color: var(--ink-3); margin-top: 7px;
}
@media (min-width: 900px) { #previewCard { display: none; } }

#stage {
  position: fixed; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  transition: transform .6s cubic-bezier(.16,.8,.24,1);
}
svg { overflow: visible; }
.lbl {
  position: absolute; font: 500 11px var(--mono); color: var(--ink);
  white-space: nowrap; cursor: pointer; padding: 4px 2px; transition: opacity .3s ease;
  z-index: 4;
}
.sub { font: 400 9px var(--mono); opacity: .6; display: block; margin-top: 2px; }
#coreLbl {
  position: absolute; text-align: center; color: #CFEFFF;
  font: 500 10px var(--mono); letter-spacing: .14em; pointer-events: none;
  transition: color .4s ease; z-index: 3;
}

/* ── reading panel ─────────────────────────────────────────────────────── */
/* #panel is the fixed, non-scrolling frame — everything that must stay put
   regardless of scroll (the edge glow, the close button, the sweep) is a
   direct child of it. #panelScroll is a separate absolutely-positioned
   layer INSIDE it that does the actual scrolling. Putting the glow inside
   the scrolling element itself (position:absolute + top:0/bottom:0 on a
   scrolling position:fixed ancestor) is exactly the combination that mobile
   Safari mishandles — the decoration can detach and clip mid-scroll. Two
   separate layers sidesteps the bug entirely rather than working around it. */
#panel {
  position: fixed; right: 0; top: 0; bottom: 0; width: 420px; z-index: 20;
  overflow: hidden;
  background: linear-gradient(90deg, rgba(4,5,10,0) 0%, rgba(6,7,14,.90) 14%, rgba(5,6,12,.975) 100%);
  border-left: 1px solid rgba(255,255,255,0.05);
  opacity: 0; transform: translateX(28px); pointer-events: none;
  transition: opacity .55s cubic-bezier(.16,.8,.24,1), transform .55s cubic-bezier(.16,.8,.24,1);
}
#panel.on { opacity: 1; transform: translateX(0); pointer-events: auto; }
#panelScroll {
  position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 58px 46px;
}
#panel .edge { position: absolute; left: 0; top: 0; bottom: 0; width: 2px; z-index: 2; }
#panel .edgeGlow {
  position: absolute; left: 0; top: 0; bottom: 0; width: 80px;
  pointer-events: none; mix-blend-mode: screen; opacity: 0;
  transition: opacity .6s ease; transition-delay: .15s;
}
#panel.on .edgeGlow { opacity: 1; }
#closeBtn {
  position: absolute; top: 26px; right: 30px; width: 30px; height: 30px;
  border: 1px solid rgba(255,255,255,0.12); border-radius: 50%; background: rgba(255,255,255,0.02);
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  color: var(--ink-2); font: 400 15px var(--mono); line-height: 1;
  transition: background .25s ease, color .25s ease, border-color .25s ease, transform .25s ease;
  z-index: 3;
}
#closeBtn:hover { background: rgba(255,255,255,0.06); color: var(--ink); border-color: rgba(255,255,255,.28); transform: scale(1.06); }
#closeBtn:active { transform: scale(0.94); }
#panel .eyebrow {
  font: 400 9px var(--mono); letter-spacing: .32em; text-transform: uppercase; margin-bottom: 16px;
  opacity: 0; transform: translateY(6px); transition: opacity .5s ease, transform .5s ease;
}
#panel h2 {
  margin: 0 0 6px; font: 500 30px var(--serif); letter-spacing: -.005em; color: #F2F7FF;
  opacity: 0; transform: translateY(8px); transition: opacity .55s ease, transform .55s ease;
}
#panel .key {
  font: 400 10px var(--mono); letter-spacing: .20em; color: var(--ink-3); margin-bottom: 10px;
  opacity: 0; transition: opacity .6s ease;
}
/* the shadow > gift > siddhi triad — the chain the real Gene Keys system
   is built on, one word each, the whole point of holding a key at all */
#panel .triad {
  font: 500 11px var(--mono); letter-spacing: .04em; color: var(--ink);
  margin-bottom: 14px; opacity: 0; transition: opacity .6s ease; transition-delay: .19s;
}
#panel .triad span { color: var(--ink-3); margin: 0 2px; }
#panel.on .triad { opacity: .92; }
/* "My Sphere · what it means" — real, from the official app, shown only
   where a tagline has been confirmed against it (see gk-sphere-lines.js) */
#panel .tagline {
  font: 400 12.5px var(--serif); font-style: italic; letter-spacing: .003em;
  color: var(--ink-2); margin-bottom: 30px;
  opacity: 0; transition: opacity .6s ease; transition-delay: .24s;
}
#panel .tagline span { color: var(--ink-3); font-style: normal; margin: 0 1px; }
#panel.on .tagline { opacity: .85; }
#panel .asRole {
  font: 500 9px var(--mono); letter-spacing: .26em; text-transform: uppercase;
  color: var(--ink-3); margin: 30px 0 6px; opacity: 0; transition: opacity .6s ease;
}
#panel.on .asRole { opacity: .75; }
#panel .pathway {
  font: 500 9px var(--mono); letter-spacing: .2em; text-transform: uppercase;
  margin: 6px 0 8px; opacity: 0; transition: opacity .6s ease;
}
#panel .pathway span { color: var(--ink-3); margin: 0 6px; text-transform: none; letter-spacing: normal; }
#panel.on .pathway { opacity: .85; }
#panel .pathwayText {
  font: 400 13px/1.55 var(--serif); color: var(--ink-2); margin: 0 0 22px;
  opacity: 0; transition: opacity .6s ease;
}
#panel.on .pathwayText { opacity: .9; }
#panel section { margin-bottom: 22px; opacity: 0; transform: translateY(10px); transition: opacity .6s ease, transform .6s ease; }
#panel h3 { margin: 0 0 9px; font: 500 9px var(--mono); letter-spacing: .24em; text-transform: uppercase; }
#panel p { margin: 0; font: 400 15.5px/1.68 var(--serif); color: #B9C2D6; letter-spacing: .002em; }
#panel.on .eyebrow { opacity: .85; transform: none; transition-delay: .10s; }
#panel.on h2 { opacity: 1; transform: none; transition-delay: .16s; }
#panel.on .key { opacity: 1; transition-delay: .22s; }
#panel.on section { opacity: 1; transform: none; }
#panel.on section:nth-of-type(1) { transition-delay: .28s; }
#panel.on section:nth-of-type(2) { transition-delay: .36s; }
#panel.on section:nth-of-type(3) { transition-delay: .44s; }
#panel.on section:nth-of-type(4) { transition-delay: .52s; }
#panel.on section:nth-of-type(5) { transition-delay: .58s; }
#panel.on section:nth-of-type(n+6) { transition-delay: .62s; }

#sweep { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
#sweep .band {
  position: absolute; top: -20%; bottom: -20%; width: 38%;
  background: linear-gradient(100deg, transparent 0%, rgba(255,255,255,0) 35%,
    var(--sweep-col, rgba(200,230,255,.16)) 50%, rgba(255,255,255,0) 65%, transparent 100%);
  transform: translateX(-160%) skewX(-12deg);
  transition: transform .85s cubic-bezier(.22,.7,.2,1);
}
#panel.sweeping #sweep .band { transform: translateX(360%) skewX(-12deg); }
#panel .card { padding: 14px 16px; margin: 0 -16px; border-radius: 10px; cursor: pointer; transition: background .35s ease, transform .35s ease, box-shadow .35s ease; }
#panel .card[data-noclick] { cursor: default; }
#panel .card:hover { background: rgba(255,255,255,0.03); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.28); }
#panel .card[data-noclick]:hover { transform: none; box-shadow: none; }
#panel .card:active { background: rgba(255,255,255,0.045); transform: translateY(0); }

/* the label-with-leader-line row, same rhythm as the old exploded-plate
   sheet's .s-lab/.s-body pairs, restyled for this theme: a small caps
   label with a hairline trailing off, the value beneath it in mono. */
#panel .states {
  margin-top: 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px;
}
#panel .state b {
  display: flex; align-items: center; gap: 8px;
  font: 500 8px var(--mono); letter-spacing: .22em; text-transform: uppercase;
  color: var(--ink-3); margin-bottom: 4px;
}
#panel .state b::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,.08); }
#panel .state i { font: 400 12px var(--mono); font-style: normal; color: var(--ink); letter-spacing: .01em; }
#panel .statesNote { margin-top: 16px; font: 400 11.5px/1.55 var(--mono); color: var(--ink-3); letter-spacing: .01em; }
#panel .ovSeq { text-align: center; }
#panel .ovSeq b { display: block; font: 500 26px var(--serif); font-style: normal; margin-bottom: 4px; }
#panel .ovSeq i { display: block; font: 500 9px var(--mono); font-style: normal; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-3); }
#panel .card p + p { margin-top: 14px; }
#panel .ovLink {
  background: none; border: none; padding: 0; margin: 0; cursor: pointer;
  font: inherit; color: var(--ink); text-decoration: underline dotted; text-underline-offset: 3px;
  text-decoration-color: rgba(255,255,255,.35);
}
#panel .ovLink:hover { text-decoration-color: currentColor; }

/* ── title block: subject data, bottom-left, dark ─────────────────────── */
#titleblock {
  position: fixed; left: 22px; bottom: 22px; z-index: 6;
  border: 1px solid rgba(255,255,255,.08);
  background: rgba(8,9,15,.7); backdrop-filter: blur(6px);
  font-size: 8.5px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink-3); min-width: 268px; border-radius: 4px; overflow: hidden;
}
#titleblock div { display: flex; border-bottom: 1px solid rgba(255,255,255,.06); }
#titleblock div:last-child { border-bottom: none; }
#titleblock span { padding: 5px 8px; }
#titleblock .k { width: 96px; flex-shrink: 0; border-right: 1px solid rgba(255,255,255,.06); }
#titleblock .v { color: var(--ink); letter-spacing: .1em; }
#titleblock .v select {
  font: inherit; letter-spacing: .1em; color: var(--ink);
  background: none; border: 0; padding: 0; margin: 0; width: 100%; min-width: 140px; cursor: pointer;
}
#titleblock .v select:focus { outline: none; }
#titleblock .v select option, #titleblock .v select optgroup { color: #16181F; }
#titleblock .v input {
  font: inherit; font-size: 11px; letter-spacing: .06em; color: var(--ink);
  background: transparent; border: none; padding: 0; width: 118px; text-transform: none;
  color-scheme: dark;
}
#titleblock .v input:focus { outline: none; }

#unfitted {
  position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%);
  max-width: 320px; text-align: center; z-index: 5; pointer-events: none;
  font-size: 10px; letter-spacing: .14em; line-height: 2; text-transform: uppercase;
  color: var(--ink-3); opacity: 0; transition: opacity .3s ease;
}
body.unfitted #unfitted { opacity: 1; }
#unfitted b { display: block; color: var(--ink); letter-spacing: .26em; margin-bottom: 6px; }
body.unfitted #stage { opacity: .18; }
#clockNote {
  position: fixed; left: 26px; bottom: 128px; z-index: 5; max-width: 260px;
  font-size: 9px; letter-spacing: .1em; line-height: 1.7; color: var(--ink-3);
  text-transform: none;
}

@media (max-width: 899px) {
  #titleblock { left: 16px; right: 16px; min-width: 0; bottom: 14px; }
  #panel { width: 100%; }
  .lbl { display: none; }
  #legend { display: flex; }
  #hdr { right: auto; }
  /* Hidden by default to save header space on a phone — but when today's
     transit genuinely connects to this visitor's own chart, that's worth
     the space, so .clickable (set in JS only when a connection exists)
     overrides this back to visible. */
  #transit { display: none; }
  #transit.clickable {
    display: block; white-space: normal; word-break: break-word;
    font-size: 8px; line-height: 1.5; max-width: 100%;
  }
}
@media (prefers-reduced-motion: reduce) {
  #panel, #stage { transition: none; }
}
/* Mobile's replacement for the continuous rotation: an opacity-only pulse,
   which the browser can composite from an already-rasterised filtered layer
   instead of recomputing the blur every frame the way a rotating transform
   on a filtered element forces it to. */
@keyframes breathe { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
</style>
</head>
<body>

<canvas id="ambient"></canvas>
<div id="hdr"><span id="hint">Hologenetic Profile <b>·</b> click the centre to open your profile</span><span id="transit"></span></div>

<div id="stage"></div>
<div id="legend"></div>
<div id="previewCard"></div>
<div id="panel">
  <div class="edgeGlow"></div>
  <div class="edge"></div>
  <div id="sweep"><div class="band"></div></div>
  <div id="closeBtn" title="Close">&#10005;</div>
  <div id="panelScroll"><div id="pcontent"></div></div>
</div>

<div id="unfitted"></div>
<div id="clockNote"></div>

<div id="titleblock">
  <div><span class="k">Subject d.o.b.</span><span class="v"><input type="date" id="dob" min="1900-01-01"></span></div>
  <div><span class="k">Time of birth</span><span class="v"><input type="time" id="tob"></span></div>
  <div><span class="k">Birthplace</span><span class="v"><select id="tz"></select></span></div>
</div>
