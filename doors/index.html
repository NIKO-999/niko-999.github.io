<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- maximum-scale=1: iOS zooms the page when a field under 16px takes
     focus, and every field here is 16 — this covers the next one added. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Encounters" />
<title>Encounters</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="preload" href="../arc/fonts/Inter.woff2" as="font" type="font/woff2" crossorigin />
<style>
@font-face { font-family: 'Inter'; src: url('../arc/fonts/Inter.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }

:root {
  --bg: #000000;
  --card: #141417;
  --card2: #1e1e22;
  --card3: #2a2a2f;
  --line: rgba(255, 255, 255, .08);
  --ink: #f5f5f7;
  --dim: #a1a1a8;
  --quiet: #8a8a92;
  --mark-off: #3a3a40;
  /* THE ONE COLOUR. An encounter that went well is green, and nothing
     else is. One that did not is the flat neutral, never red: a hard
     conversation is a fact about the moment, not a mark against you. */
  --pos: #34c759;
  --bad: #ff6b60;
  --on-ink: #000000;
  --r: 22px;
  --r-s: 14px;
  --bar-h: 64px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: dark;
}

/* A view is put away with the hidden attribute, and any author `display`
   outranks the browser's own rule for it. Said once, here. */
[hidden] { display: none !important; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body {
  margin: 0; min-height: 100dvh; background: var(--bg); color: var(--ink);
  font: 400 14px/1.35 'Inter', -apple-system, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
  padding: calc(var(--safe-t) + 14px) 16px calc(var(--bar-h) + var(--safe-b) + 40px);
}
body.dr-lock { overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
input, textarea { font: inherit; color: inherit; }
svg { display: block; }
.dr-ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.dr-num { font-variant-numeric: tabular-nums; }

/* ── type ── */
.dr-h1 { font-size: 24px; font-weight: 700; letter-spacing: -.02em; margin: 6px 4px 0; }
.dr-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.dr-lab { font-size: 12px; color: var(--dim); font-weight: 500; }
.dr-cap { font-size: 10px; color: var(--dim); letter-spacing: .12em; text-transform: uppercase; font-weight: 600; }
.dr-gh { margin: 10px 4px -4px; }

/* ── surfaces ── */
.dr-card { background: var(--card); border-radius: var(--r); padding: 14px; position: relative; }
#drMain > section { display: flex; flex-direction: column; gap: 12px; }
.dr-row { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 12px; align-items: stretch; }
.dr-hd { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 22px; }

/* ── today ── */
.dr-title { display: block; margin: 4px 0; font-size: 28px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; text-align: left; }
.dr-sub { color: var(--dim); font-size: 12.5px; margin: 2px 0 12px; min-height: 17px; }
.dr-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.dr-chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 999px; background: var(--card2); color: var(--dim); font-size: 12px; font-weight: 500; }
.dr-chip.is-pos { color: var(--pos); }
.dr-go {
  display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 46px; border-radius: 999px;
  background: var(--ink); color: var(--on-ink); font-weight: 600; font-size: 14px; transition: transform .15s var(--ease);
}
.dr-go:active { transform: scale(.98); }

/* ── an encounter in full ── */
.dr-full { display: flex; flex-direction: column; gap: 8px; }
.dr-full .dr-gh { margin: 4px 4px 0; }
.dr-en { display: block; width: 100%; text-align: left; padding: 14px 16px; }
.dr-en-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.dr-en-h b { font-size: 17px; font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.dr-en-f { flex: none; height: 24px; line-height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--card2); color: var(--dim); }
.dr-en-f.is-pos { background: var(--pos); color: #002a0c; }
.dr-en-m { font-size: 13px; color: var(--dim); margin-top: 4px; }
.dr-end { border: 1px solid var(--line); }
.dr-end-s { margin-top: 12px; }
.dr-end-s .dr-en-n { margin-top: 4px; }
.dr-end-go { margin-top: 2px; }
.dr-en-n { margin: 10px 0 0; font-size: 14.5px; line-height: 1.4; white-space: pre-wrap; overflow-wrap: anywhere; }

/* ── stat tiles ── */
.dr-stat { text-align: center; padding: 14px 8px; }
.dr-stat b { display: block; font-size: 19px; font-weight: 700; letter-spacing: -.01em; margin-top: 8px; }
.dr-stat span { display: block; font-size: 11.5px; color: var(--dim); margin-top: 2px; }
.dr-delta { position: absolute; top: 9px; right: 11px; font-size: 10px; font-weight: 600; color: var(--pos); }
.dr-delta.is-down { color: var(--dim); }

/* ── segmented control ── */
.dr-seg { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); background: var(--card2); border-radius: 999px; padding: 3px; }
.dr-seg button { height: 34px; border-radius: 999px; color: var(--dim); font-weight: 600; font-size: 12.5px; position: relative; }
.dr-seg button::before { content: ''; position: absolute; inset: -5px 0; }
.dr-seg button[aria-pressed="true"] { background: var(--card3); color: var(--ink); }
.dr-card > .dr-seg { margin-bottom: 12px; }
/* How it went, in the log: the two answers are the biggest controls on
   the sheet, because they are the one thing every encounter has. */
.dr-feel { background: var(--card); }
.dr-feel button { height: 46px; font-size: 14px; }
.dr-feel button[data-f="1"][aria-pressed="true"] { background: var(--pos); color: #002a0c; }

/* ── how it went ── */
.dr-fig { display: flex; align-items: baseline; gap: 8px; }
.dr-fig b { font-size: 34px; font-weight: 800; letter-spacing: -.03em; color: var(--pos); line-height: 1; }
.dr-fig span { font-size: 13px; color: var(--dim); }
.dr-split { display: block; height: 10px; border-radius: 5px; background: var(--card3); overflow: hidden; margin-top: 12px; }
.dr-split b { display: block; height: 100%; background: var(--pos); border-radius: 5px; }
.dr-key { display: flex; justify-content: space-between; font-size: 12px; color: var(--dim); margin-top: 6px; }
.dr-vs { font-size: 12px; color: var(--dim); margin: 10px 0 0; }
.dr-vs.is-up { color: var(--pos); }
.dr-focus { margin: 12px 0 0; font-size: 13px; line-height: 1.4; color: var(--dim); }
.dr-focus b { color: var(--ink); font-weight: 600; }

/* ── breakdowns: activity and age ── */
.dr-bl { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.dr-br { display: grid; grid-template-columns: 104px minmax(0, 1fr) 46px; align-items: center; gap: 10px; font-size: 12.5px; }
.dr-br > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dr-br > span small { display: block; font-size: 10.5px; color: var(--quiet); }
.dr-br i { display: block; height: 8px; border-radius: 4px; background: var(--card3); overflow: hidden; }
.dr-br i b { display: block; height: 100%; background: #c9c9ce; border-radius: 4px; }
.dr-br.is-best i b { background: var(--pos); }
.dr-br em { font-style: normal; text-align: right; color: var(--dim); font-weight: 600; }
.dr-br.is-best em { color: var(--pos); }

/* ── hours: how many, and how many of those went well ── */
.dr-hrs { display: grid; grid-template-columns: repeat(var(--n, 6), minmax(0, 1fr)); gap: 4px; align-items: end; height: 96px; margin-top: 12px; }
.dr-hrs > div { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 3px; min-width: 0; }
.dr-hrs i { display: flex; flex-direction: column; justify-content: flex-end; width: 100%; max-width: 22px; border-radius: 6px; background: #4a4a50; min-height: 3px; overflow: hidden; }
.dr-hrs i b { display: block; width: 100%; background: var(--pos); }
.dr-hrs em { font-style: normal; font-size: 10px; color: var(--dim); }
.dr-hrs u { text-decoration: none; font-size: 10px; color: var(--quiet); }
.dr-hrs .is-best u { color: var(--pos); font-weight: 700; }

/* ── 30-day grid ── */
.dr-days { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 8px 6px; margin-top: 14px; }
.dr-day { height: 18px; border-radius: 999px; border: 1.5px solid var(--mark-off); }
.dr-day.is-on { background: #c9c9ce; border-color: #c9c9ce; }
.dr-day.is-good { background: var(--pos); border-color: var(--pos); }
.dr-day.is-now { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--ink); }

/* ── empty ── */
.dr-empty { text-align: center; color: var(--dim); padding: 22px 16px; font-size: 13px; }
.dr-empty b { display: block; color: var(--ink); font-size: 14px; margin-bottom: 4px; }

/* ── lists ── */
.dr-list { display: flex; flex-direction: column; }
.dr-li { display: flex; align-items: center; gap: 12px; min-height: 58px; padding: 10px 0; border-top: 1px solid var(--line); width: 100%; text-align: left; }
.dr-li:first-child { border-top: 0; }
.dr-li-t { flex: 1; min-width: 0; }
.dr-li-t b { display: block; font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dr-li-t span { display: block; font-size: 12px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dr-li-r { font-size: 12px; color: var(--dim); text-align: right; flex: none; font-variant-numeric: tabular-nums; }
/* A filled dot went well, a hollow one did not — so the two read apart
   without a colour having to say "bad". */
.dr-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; border: 1.5px solid var(--quiet); }
.dr-dot.is-pos { background: var(--pos); border-color: var(--pos); }

.dr-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px;
  border-radius: 999px; background: var(--card2); font-weight: 600; font-size: 14px;
}
.dr-btn.is-full { width: 100%; }
.dr-btn.is-ink { background: var(--ink); color: var(--on-ink); }
.dr-btn.is-bad { color: var(--bad); }
.dr-btn:active { opacity: .8; }
.dr-round { width: 44px; height: 44px; border-radius: 999px; display: grid; place-items: center; color: var(--dim); flex: none; }
.dr-round:disabled { opacity: .3; cursor: default; }
.dr-round.is-fill { background: var(--card); color: var(--ink); }

.dr-field {
  width: 100%; height: 44px; border-radius: var(--r-s); background: var(--card2); border: 1px solid transparent;
  padding: 0 14px; font-size: 16px; outline: none; -webkit-appearance: none; appearance: none;
}
textarea.dr-field { height: 84px; padding: 11px 14px; resize: none; line-height: 1.35; }
.dr-field:focus { border-color: rgba(255,255,255,.25); }
.dr-flab { display: block; font-size: 12px; color: var(--dim); margin: 14px 2px 6px; }
.dr-pills { display: flex; flex-wrap: wrap; gap: 8px; }
.dr-pills + .dr-field { margin-top: 8px; }
.dr-pill { min-height: 36px; padding: 0 14px; border-radius: 999px; background: var(--card2); color: var(--dim); font-size: 13px; font-weight: 500; position: relative; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dr-pill::before { content: ''; position: absolute; inset: -4px 0; }
.dr-pill[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
.dr-age { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 10px; align-items: center; }
.dr-age .dr-pills { gap: 6px; }
.dr-age .dr-pill { padding: 0 10px; }

/* ── calendar ── */
.dr-calnav { display: flex; align-items: center; justify-content: space-between; }
.dr-calnav b { font-size: 15px; font-weight: 700; }
.dr-dows { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; font-size: 11px; color: var(--quiet); font-weight: 600; margin-bottom: 6px; }
.dr-month { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.dr-cell { aspect-ratio: 1 / 1.1; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 13px; font-weight: 500; color: var(--dim); min-width: 0; }
.dr-cell.is-pad { visibility: hidden; }
.dr-cell.is-on { background: var(--card2); color: var(--ink); font-weight: 700; }
.dr-cell.is-now { box-shadow: inset 0 0 0 2px var(--ink); color: var(--ink); }
.dr-cell.is-ahead { color: #55555c; }
.dr-cell small { font-size: 10px; font-weight: 700; color: var(--pos); height: 12px; line-height: 12px; }
.dr-sum { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 10px; }
.dr-sum div { background: var(--card); border-radius: 16px; padding: 12px 6px; text-align: center; min-width: 0; }
.dr-sum b { display: block; font-size: 16px; font-weight: 700; }
.dr-sum span { font-size: 11px; color: var(--dim); }
.dr-sum .is-pos b { color: var(--pos); }

/* ── the bar ── */
.dr-bar {
  position: fixed; left: 50%; bottom: calc(var(--safe-b) + 14px); transform: translateX(-50%); z-index: 20;
  display: flex; gap: 2px; padding: 5px; border-radius: 999px; background: rgba(28, 28, 32, .86);
  -webkit-backdrop-filter: blur(20px) saturate(1.4); backdrop-filter: blur(20px) saturate(1.4);
  box-shadow: 0 10px 30px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.06);
}
.dr-bar button { width: 58px; height: 46px; border-radius: 999px; display: grid; place-items: center; color: var(--quiet); }
.dr-bar button .dr-ic { width: 20px; height: 20px; }
.dr-bar button[aria-current="page"] { background: var(--card3); color: var(--ink); }

/* ── sheets: built and removed, never hidden ── */
.dr-scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 40; opacity: 0; transition: opacity .28s var(--ease); }
.dr-scrim.is-up { opacity: 1; }
.dr-sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-width: 560px; margin: 0 auto;
  max-height: calc(100dvh - var(--safe-t) - 40px); display: flex; flex-direction: column;
  background: #18181b; border-radius: 28px 28px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06);
  transform: translateY(100%); transition: transform .34s var(--ease); will-change: transform;
}
.dr-sheet.is-up { transform: translateY(0); }
.dr-sheet.is-drag { transition: none; }
.dr-sheet.is-full { height: calc(100dvh - var(--safe-t) - 10px); max-height: none; }
.dr-grab { height: 26px; flex: none; display: grid; place-items: center; touch-action: none; cursor: grab; }
.dr-grab::after { content: ''; width: 38px; height: 5px; border-radius: 3px; background: #4a4a50; }
.dr-sh-hd { display: flex; align-items: center; gap: 10px; padding: 0 20px 10px; touch-action: none; }
.dr-sh-hd h2 { margin: 0; font-size: 17px; font-weight: 700; flex: 1; min-width: 0; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dr-sh-bd { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 4px 20px 20px; overscroll-behavior: contain; }
.dr-sh-ft { flex: none; padding: 12px 20px calc(var(--safe-b) + 14px); border-top: 1px solid var(--line); display: flex; gap: 10px; }
.dr-sh-ft > * { flex: 1; }

/* ── report ── */
.dr-rep { background: var(--card); border-radius: var(--r); padding: 16px; margin-top: 12px; }
.dr-rep-hd { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.dr-rep-hd b { display: block; font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
.dr-rep-hd span { font-size: 12px; color: var(--dim); }
.dr-rep-hero { display: flex; align-items: baseline; gap: 10px; margin: 12px 0 2px; flex-wrap: wrap; }
.dr-rep-hero b { font-size: 34px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
.dr-rep-hero span { font-size: 15px; font-weight: 600; color: var(--pos); }
.dr-kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
.dr-kv div { min-width: 0; }
.dr-kv span { display: block; font-size: 10.5px; color: var(--dim); }
.dr-kv b { display: block; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dr-rep-sec { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; }
.dr-rep-sec .dr-cap { display: block; margin-bottom: 6px; }
.dr-rep-sec ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.dr-rep-sec li { display: flex; align-items: center; gap: 10px; }
.dr-rep-sec li > span:not(.dr-dot) { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--dim); }
.dr-rep-sec li b { color: var(--ink); font-weight: 600; }
.dr-rep-sec li em { font-style: normal; color: var(--quiet); flex: none; font-size: 12px; }
.dr-rep-sec p { margin: 0; line-height: 1.4; color: var(--dim); }
.dr-rep-sec p b { color: var(--ink); font-weight: 600; }

.dr-toast {
  position: fixed; left: 50%; bottom: calc(var(--safe-b) + 84px); z-index: 60; transform: translate(-50%, 12px); opacity: 0;
  display: flex; align-items: center; gap: 14px; padding: 0 6px 0 18px; min-height: 48px; border-radius: 16px; width: max-content; max-width: calc(100vw - 32px);
  background: #2c2c30; box-shadow: 0 10px 30px rgba(0,0,0,.5); transition: opacity .2s, transform .2s var(--ease); font-size: 14px; font-weight: 500;
}
.dr-toast.is-up { opacity: 1; transform: translate(-50%, 0); }
.dr-toast.is-bare { padding-right: 18px; }
.dr-toast button { min-height: 44px; padding: 0 12px; font-weight: 700; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0s !important; animation: none !important; }
}
@media (min-width: 700px) {
  body { max-width: 560px; margin: 0 auto; }
}
</style>
</head>
<body>
<h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)">Encounters</h1>
<main id="drMain">
  <section id="drHome" aria-label="Home"></section>
  <section id="drCal" aria-label="Calendar" hidden></section>
  <section id="drLog" aria-label="Encounters" hidden></section>
  <section id="drYou" aria-label="You" hidden></section>
</main>
<nav class="dr-bar" aria-label="Sections">
  <button type="button" data-v="home" aria-label="Home" aria-current="page"><svg class="dr-ic" viewBox="0 0 24 24"><path d="M5 20V12M10 20V6M15 20v-9M20 20V9"/></svg></button>
  <button type="button" data-v="cal" aria-label="Calendar"><svg class="dr-ic" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></button>
  <button type="button" data-v="log" aria-label="Encounters"><svg class="dr-ic" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.3-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.8a3.5 3.5 0 0 1 0 6.4M18.5 14.8c1.6.8 2.6 2.6 3 5.2"/></svg></button>
  <button type="button" data-v="you" aria-label="You"><svg class="dr-ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1-4 4-6 7.5-6s6.5 2 7.5 6"/></svg></button>
</nav>
<script>
(function () {
'use strict';

/* ═══════════════════════════════════════════════════════════════
   ENCOUNTERS — a log of the people you meet, so you can see where you
   are doing well and where you can improve.

   ONE ENCOUNTER IS THE WHOLE RECORD: who (a name, if you got one), how
   old they looked, what they were doing when you met, and whether it
   went well. Everything on every screen is worked out from that one
   list, so nothing can disagree with it.

   It began as a door-to-door counter — knocks, a funnel, sales — and
   was rebuilt around the encounter on request: the door was never the
   point, the person was.

   Everything lives in this browser under encounters.v1 and
   encounters.view.v1 and is never sent anywhere. A mentor gets a
   screenshot of the report, and you take it.
   ═══════════════════════════════════════════════════════════════ */

var KEY = 'encounters.v1', VIEWK = 'encounters.view.v1';
var VIEWS = ['home', 'cal', 'log', 'you'];

/* ═══════════ LOGGING ONE ═══════════ */

  b.appendChild(el('<label class="dr-flab" for="drEnAct">What were they doing?</label>'));

  var root = $('#drCal'); root.textContent = '';
  root.appendChild(el('<h2 class="dr-h1">Calendar</h2>'));
  var t = today(), from = new Date(calAt.getFullYear(), calAt.getMonth(), 1), to = new Date(calAt.getFullYear(), calAt.getMonth() + 1, 0);
  var nav = el('<div class="dr-calnav"><button type="button" class="dr-round" aria-label="Earlier">' + IC.left + '</button><b></b><button type="button" class="dr-round" aria-label="Later">' + IC.right + '</button></div>');
  $('b', nav).textContent = MON[from.getMonth()] + ' ' + from.getFullYear();
  var bs = $$('button', nav);
  bs[1].disabled = to >= t;
  bs[0].addEventListener('click', function () { calAt = new Date(calAt.getFullYear(), calAt.getMonth() - 1, 1); drRenderCal(); });
  bs[1].addEventListener('click', function () { if (to < t) { calAt = new Date(calAt.getFullYear(), calAt.getMonth() + 1, 1); drRenderCal(); } });
  root.appendChild(nav);
  var card = el('<div class="dr-card" style="padding:12px"><div class="dr-dows" aria-hidden="true"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div><div class="dr-month" id="drMonth"></div></div>');
  var g = $('#drMonth', card), pad = (from.getDay() + 6) % 7, tk = ymd(t);
  for (var p = 0; p < pad; p++) g.appendChild(el('<span class="dr-cell is-pad" aria-hidden="true"></span>'));
  for (var d = 1; d <= to.getDate(); d++) {
    var k = ymd(new Date(from.getFullYear(), from.getMonth(), d)), c = drCounts(drOn(k));
    var cell = el('<button type="button" class="dr-cell"><span class="dr-num"></span><small class="dr-num"></small></button>');
    cell.dataset.d = k;
    $('span', cell).textContent = d;
    if (c.n) { cell.classList.add('is-on'); $('small', cell).textContent = c.pos + '/' + c.n; }
    if (k === tk) cell.classList.add('is-now');
    if (k > tk) { cell.classList.add('is-ahead'); cell.disabled = true; }
    cell.setAttribute('aria-label', fmtDay(k) + (c.n ? ', ' + c.n + ' encounters, ' + c.pos + ' positive' : ', none'));
    cell.addEventListener('click', (function (k) { return function () { drDaySheet(k); }; })(k));
    g.appendChild(cell);
  }
  root.appendChild(card);
  var mc = drCounts(drIn(from, to));
  var sum = el('<div class="dr-sum" id="drCalSum"></div>');
  [[mc.n, 'Encounters'], [pctTxt(mc.pos, mc.n), 'Positive', 1], [mc.dayN, 'Days out']].forEach(function (x) {
    var dv = el('<div><b class="dr-num"></b><span></span></div>'); $('b', dv).textContent = x[0]; $('span', dv).textContent = x[1]; if (x[2]) dv.classList.add('is-pos'); sum.appendChild(dv);
  });
  root.appendChild(sum);
}
function drDaySheet(k) {
  var list = drOn(k), b = el('<div></div>');
  if (list.length) {
    var c = drCounts(list);
    var p = el('<p style="margin:0 0 6px;color:var(--dim)"></p>'); p.textContent = c.n + (c.n === 1 ? ' encounter' : ' encounters') + ' · ' + c.pos + ' positive · ' + c.neg + ' negative';
    b.appendChild(p);
    var l = el('<div class="dr-list"></div>');
    list.forEach(function (e) { l.appendChild(drEnRow(e, true)); });
    b.appendChild(l);
  } else b.appendChild(el('<div class="dr-empty"><b>Nothing on this day</b></div>'));
  var dd = S.days[k];
  if (dd) DAY_F.forEach(function (f) { if (!dd[f[0]]) return; var x = el('<div class="dr-end-s"><span class="dr-cap"></span><p class="dr-en-n"></p></div>'); $('.dr-cap', x).textContent = f[1]; $('p', x).textContent = dd[f[0]]; b.appendChild(x); });
  var end = el('<button type="button" class="dr-btn is-full"></button>'); end.textContent = dd ? 'Edit takeaways' : 'Takeaways';
  var add = el('<button type="button" class="dr-btn is-full">Log one for this day</button>');
  var s = drSheet({ title: fmtDay(k), body: b, foot: [end, add] });
  end.addEventListener('click', function () { s.close(); drDaySum(k); });
  add.addEventListener('click', function () {
    s.close();
    var at = parseYmd(k), n = new Date();
    if (k === ymd(today())) at = n; else at.setHours(12, 0, 0, 0);
    drLogSheet(null, at.getTime());
  });
  $$('.dr-li', b).forEach(function (x) { x.addEventListener('click', function () { s.close(); }); });
}

/* ═══════════ YOU ═══════════ */
function drRenderYou() {
  var root = $('#drYou'); root.textContent = '';
  root.appendChild(el('<h2 class="dr-h1">You</h2>'));
  var rep = el('<button type="button" class="dr-go">Report for your mentor</button>');
  rep.addEventListener('click', function () { drReport(); });
  root.appendChild(rep);
  var card = el('<div class="dr-card"><label class="dr-flab" for="drName" style="margin-top:0">Your name, on the report</label><input class="dr-field" id="drName" maxlength="40" autocomplete="off" /><label class="dr-flab" for="drGoal">Encounters a day</label><input class="dr-field dr-num" id="drGoal" inputmode="numeric" autocomplete="off" /></div>');
  var nf = $('#drName', card); nf.value = S.name;
  nf.addEventListener('change', function () { S.name = nf.value.trim().slice(0, 40); drSave(); });
  var gf = $('#drGoal', card); gf.value = S.goal;
  gf.addEventListener('change', function () { var v = parseInt(gf.value, 10); S.goal = v >= 0 ? Math.min(99, v) : 0; drSave(); });
  root.appendChild(card);
  var all = drCounts(S.en);
  var lt = el('<div class="dr-sum" id="drAll"></div>');
  [[all.n, 'Encounters'], [pctTxt(all.pos, all.n), 'Positive', 1], [all.dayN, 'Days out']].forEach(function (x) { var d = el('<div><b class="dr-num"></b><span></span></div>'); $('b', d).textContent = x[0]; $('span', d).textContent = x[1]; if (x[2]) d.classList.add('is-pos'); lt.appendChild(d); });
  root.appendChild(el('<div class="dr-cap dr-gh">All time</div>'));
  root.appendChild(lt);
  root.appendChild(el('<div class="dr-cap dr-gh">Backup</div>'));
  var bk = el('<div class="dr-card" style="display:flex;gap:10px"><button type="button" class="dr-btn" style="flex:1" id="drCopy">Copy a backup</button><button type="button" class="dr-btn" style="flex:1" id="drRestore">Restore</button></div>');
  $('#drCopy', bk).addEventListener('click', drCopy);
  $('#drRestore', bk).addEventListener('click', drRestore);
  root.appendChild(bk);
}
function drCopy() {
  var txt = JSON.stringify(S);
  var done = function () { drToast('Backup copied'); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, function () { drShowText(txt); });
  else drShowText(txt);
}
function drRestore() {
  var b = el('<div><p class="dr-lab" style="margin:0 0 10px">Paste a backup. It replaces everything on this phone.</p><textarea class="dr-field" style="height:200px" aria-label="Backup"></textarea></div>');
  var go = el('<button type="button" class="dr-btn is-ink is-full">Restore</button>');
  var s = drSheet({ title: 'Restore', body: b, foot: [go] });
  go.addEventListener('click', function () {
    var o; try { o = JSON.parse($('textarea', b).value); } catch (e) { drToast('That is not a backup'); return; }
    if (!o || typeof o !== 'object' || !Array.isArray(o.en)) { drToast('That is not a backup'); return; }
    var snap = JSON.stringify(S);
    S = drClean(o); drSave(); s.close(); drRender();
    drToast('Restored', function () { S = drClean(JSON.parse(snap)); drSave(); drRender(); });
  });
}

/* ═══════════ NAVIGATION ═══════════ */
var view = 'home';
try { var sv = localStorage.getItem(VIEWK); if (VIEWS.indexOf(sv) >= 0) view = sv; } catch (e) {}
var IDS = { home: 'drHome', cal: 'drCal', log: 'drLog', you: 'drYou' };
function drGo(v) {
  if (VIEWS.indexOf(v) < 0) v = 'home';
  if (v === 'cal' && view !== 'cal') calAt = today();
  view = v;
  try { localStorage.setItem(VIEWK, v); } catch (e) {}
  drRender(); window.scrollTo(0, 0);
}
function drRender() {
  VIEWS.forEach(function (v) { $('#' + IDS[v]).hidden = v !== view; });
  $$('.dr-bar button').forEach(function (b) { if (b.dataset.v === view) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  if (view === 'home') drRenderHome();
  else if (view === 'cal') drRenderCal();
  else if (view === 'log') drRenderLog();
  else drRenderYou();
}
$$('.dr-bar button').forEach(function (b) { b.addEventListener('click', function () { drGo(b.dataset.v); }); });
drRender();

if ('serviceWorker' in navigator && /^(https:|http:\/\/(localhost|127\.0\.0\.1))/.test(location.href)) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
})();
</script>
</body>
</html>
