<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- maximum-scale=1: iOS zooms the page when a field under 16px takes
     focus, and every field here is 16 — this covers the next one added. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Doors" />
<title>Doors</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="preload" href="../arc/fonts/Inter.woff2" as="font" type="font/woff2" crossorigin />
<style>
@font-face { font-family: 'Inter'; src: url('../arc/fonts/Inter.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }

:root {
  --bg: #000000;
  --card: #141417;
  --card2: #1e1e22;
  --card3: #2a2a2f;
  --line: rgba(255, 255, 255, .08);
  --ink: #f5f5f7;
  --dim: #a1a1a8;
  --quiet: #8a8a92;
  --mark-off: #3a3a40;
  /* THE ONE COLOUR. A sale is green, and nothing else on the record is:
     a win has to be findable on any screen without reading a word. */
  --win: #34c759;
  /* A shift in progress is red, the way a recording is. */
  --live: #ff3b30;
  --on-ink: #000000;
  --r: 22px;
  --r-s: 14px;
  --bar-h: 64px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: dark;
}

/* A view is put away with the hidden attribute, and any author `display`
   outranks the browser's own rule for it. Said once, here. */
[hidden] { display: none !important; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body {
  margin: 0; min-height: 100dvh; background: var(--bg); color: var(--ink);
  font: 400 14px/1.35 'Inter', -apple-system, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
  padding: calc(var(--safe-t) + 14px) 16px calc(var(--bar-h) + var(--safe-b) + 40px);
}
body.dr-lock { overflow: hidden; }
body.dr-has-live { padding-bottom: calc(var(--bar-h) + var(--safe-b) + 104px); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
input, textarea { font: inherit; color: inherit; }
svg { display: block; }
.dr-ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.dr-num { font-variant-numeric: tabular-nums; }

/* ── type ── */
.dr-h1 { font-size: 24px; font-weight: 700; letter-spacing: -.02em; margin: 6px 4px 0; }
.dr-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.dr-lab { font-size: 12px; color: var(--dim); font-weight: 500; }
.dr-cap { font-size: 10px; color: var(--dim); letter-spacing: .12em; text-transform: uppercase; font-weight: 600; }
.dr-gh { margin: 10px 4px -4px; }

/* ── surfaces ── */
.dr-card { background: var(--card); border-radius: var(--r); padding: 14px; position: relative; }
#drMain > section { display: flex; flex-direction: column; gap: 12px; }
.dr-row { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 12px; align-items: stretch; }
.dr-hd { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 22px; }
.dr-tap { display: block; width: 100%; text-align: left; transition: transform .15s var(--ease); }
.dr-tap:active { transform: scale(.985); }

/* ── today ── */
.dr-title { display: block; margin: 4px 0; font-size: 28px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; text-align: left; }
.dr-sub { color: var(--dim); font-size: 12.5px; margin: 2px 0 12px; }
.dr-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.dr-chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 999px; background: var(--card2); color: var(--dim); font-size: 12px; font-weight: 500; }
.dr-chip.is-win { color: var(--win); }
.dr-go {
  display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 46px; border-radius: 999px;
  background: var(--ink); color: var(--on-ink); font-weight: 600; font-size: 14px; transition: transform .15s var(--ease);
}
.dr-go:active { transform: scale(.98); }
.dr-go.is-live { background: var(--live); color: #fff; }
.dr-link { display: block; margin: 8px auto 0; min-height: 44px; color: var(--dim); font-size: 13px; font-weight: 500; }

/* ── stat tiles ── */
.dr-stat { text-align: center; padding: 14px 8px; }
.dr-stat b { display: block; font-size: 19px; font-weight: 700; letter-spacing: -.01em; margin-top: 8px; }
.dr-stat span { display: block; font-size: 11.5px; color: var(--dim); margin-top: 2px; }
.dr-delta { position: absolute; top: 9px; right: 11px; font-size: 10px; font-weight: 600; color: var(--win); }
.dr-delta.is-down { color: var(--dim); }

/* ── segmented control ── */
.dr-seg { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); background: var(--card2); border-radius: 999px; padding: 3px; }
.dr-seg button { height: 34px; border-radius: 999px; color: var(--dim); font-weight: 600; font-size: 12.5px; position: relative; }
.dr-seg button::before { content: ''; position: absolute; inset: -5px 0; }
.dr-seg button[aria-pressed="true"] { background: var(--card3); color: var(--ink); }
.dr-card > .dr-seg { margin-bottom: 12px; }

/* ── the funnel ── */
.dr-fun { display: flex; flex-direction: column; gap: 10px; }
.dr-fr { display: grid; grid-template-columns: 92px minmax(0, 1fr); align-items: center; gap: 10px; font-size: 12.5px; }
.dr-fr > span { color: var(--dim); }
.dr-fr > span b { display: block; color: var(--ink); font-weight: 600; font-size: 14px; }
.dr-fr i { display: block; height: 10px; border-radius: 5px; background: var(--card3); overflow: hidden; }
.dr-fr i b { display: block; height: 100%; background: #c9c9ce; border-radius: 5px; }
.dr-fr.is-sale i b { background: var(--win); }
.dr-steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
.dr-step { background: var(--card2); border-radius: 16px; padding: 10px; position: relative; min-width: 0; }
.dr-step span { display: block; font-size: 11px; color: var(--dim); font-weight: 500; }
.dr-step b { display: block; font-size: 19px; font-weight: 700; margin-top: 4px; }
.dr-step small { display: block; font-size: 10.5px; color: var(--dim); margin-top: 2px; min-height: 14px; }
.dr-step small.is-up { color: var(--win); }
/* The step to work on is ringed, never reddened: it is a place to
   look, not a mark against you. */
.dr-feel-fig { display: flex; align-items: baseline; gap: 6px; margin-top: 8px; }
.dr-feel-fig b { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
.dr-feel-fig span { font-size: 13px; color: var(--dim); }
.dr-feel-bar { display: block; height: 10px; border-radius: 5px; background: var(--card3); overflow: hidden; margin-top: 10px; }
.dr-feel-bar b { display: block; height: 100%; background: #c9c9ce; border-radius: 5px; }
.dr-feel-key { display: flex; justify-content: space-between; font-size: 12px; color: var(--dim); margin-top: 6px; }
.dr-step.is-focus { box-shadow: inset 0 0 0 1.5px var(--ink); }
.dr-focus { margin-top: 12px; font-size: 13px; line-height: 1.4; color: var(--dim); }
.dr-focus b { color: var(--ink); font-weight: 600; }

/* ── bars: objections, areas, hours ── */
.dr-bl { display: flex; flex-direction: column; gap: 9px; margin-top: 12px; }
.dr-br { display: grid; grid-template-columns: 110px minmax(0, 1fr) 54px; align-items: center; gap: 10px; font-size: 12.5px; }
.dr-br span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dr-br i { display: block; height: 6px; border-radius: 3px; background: var(--card3); overflow: hidden; }
.dr-br i b { display: block; height: 100%; background: #c9c9ce; border-radius: 3px; }
.dr-br.is-win i b { background: var(--win); }
.dr-br em { font-style: normal; text-align: right; color: var(--dim); }
.dr-hrs { display: grid; grid-template-columns: repeat(var(--n, 6), minmax(0, 1fr)); gap: 4px; align-items: end; height: 92px; margin-top: 12px; }
.dr-hrs > div { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 3px; min-width: 0; }
.dr-hrs i { display: block; width: 100%; max-width: 22px; border-radius: 6px; background: #4a4a50; min-height: 3px; }
.dr-hrs .is-best i { background: var(--win); }
.dr-hrs em { font-style: normal; font-size: 10px; color: var(--dim); }
.dr-hrs u { text-decoration: none; font-size: 10px; color: var(--quiet); }

/* ── 30-day grid ── */
.dr-days { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 8px 6px; margin-top: 14px; }
.dr-day { height: 18px; border-radius: 999px; border: 1.5px solid var(--mark-off); }
.dr-day.is-on { background: #c9c9ce; border-color: #c9c9ce; }
.dr-day.is-win { background: var(--win); border-color: var(--win); }
.dr-day.is-now { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--ink); }

/* ── empty ── */
.dr-empty { text-align: center; color: var(--dim); padding: 22px 16px; font-size: 13px; }
.dr-empty b { display: block; color: var(--ink); font-size: 14px; margin-bottom: 4px; }

/* ── lists ── */
.dr-list { display: flex; flex-direction: column; }
.dr-li { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 10px 0; border-top: 1px solid var(--line); width: 100%; text-align: left; }
.dr-li:first-child { border-top: 0; }
.dr-li-t { flex: 1; min-width: 0; }
.dr-li-t b { display: block; font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dr-li-t span { display: block; font-size: 12px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dr-li-r { font-size: 13px; color: var(--dim); text-align: right; flex: none; font-weight: 600; }
.dr-li-r.is-win { color: var(--win); }
.dr-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--win); flex: none; }

.dr-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px;
  border-radius: 999px; background: var(--card2); font-weight: 600; font-size: 14px;
}
.dr-btn.is-full { width: 100%; }
.dr-btn.is-ink { background: var(--ink); color: var(--on-ink); }
.dr-btn.is-win { background: var(--win); color: #002a0c; }
.dr-btn.is-bad { color: var(--live); }
.dr-btn:active { opacity: .8; }
.dr-round { width: 44px; height: 44px; border-radius: 999px; display: grid; place-items: center; color: var(--dim); flex: none; }
.dr-round:disabled { opacity: .3; cursor: default; }
.dr-round.is-fill { background: var(--card); color: var(--ink); }

.dr-field {
  width: 100%; height: 44px; border-radius: var(--r-s); background: var(--card2); border: 1px solid transparent;
  padding: 0 14px; font-size: 16px; outline: none;
}
textarea.dr-field { height: 84px; padding: 11px 14px; resize: none; line-height: 1.35; }
.dr-field:focus { border-color: rgba(255,255,255,.25); }
.dr-flab { display: block; font-size: 12px; color: var(--dim); margin: 14px 2px 6px; }
.dr-grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 10px; }
.dr-pills { display: flex; flex-wrap: wrap; gap: 8px; }
.dr-pills + .dr-field { margin-top: 8px; }
.dr-pill { min-height: 36px; padding: 0 14px; border-radius: 999px; background: var(--card2); color: var(--dim); font-size: 13px; font-weight: 500; position: relative; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dr-pill::before { content: ''; position: absolute; inset: -4px 0; }
.dr-pill[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }

/* ── calendar ── */
.dr-calnav { display: flex; align-items: center; justify-content: space-between; }
.dr-calnav b { font-size: 15px; font-weight: 700; }
.dr-dows { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; font-size: 11px; color: var(--quiet); font-weight: 600; margin-bottom: 6px; }
.dr-month { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.dr-cell { aspect-ratio: 1 / 1.1; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 13px; font-weight: 500; color: var(--dim); min-width: 0; }
.dr-cell.is-pad { visibility: hidden; }
.dr-cell.is-on { background: var(--card2); color: var(--ink); font-weight: 700; }
.dr-cell.is-now { box-shadow: inset 0 0 0 2px var(--ink); color: var(--ink); }
.dr-cell.is-ahead { color: #55555c; }
.dr-cell small { font-size: 10px; font-weight: 700; color: var(--win); height: 12px; line-height: 12px; }
.dr-sum { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 10px; }
.dr-sum div { background: var(--card); border-radius: 16px; padding: 12px 6px; text-align: center; min-width: 0; }
.dr-sum b { display: block; font-size: 16px; font-weight: 700; }
.dr-sum span { font-size: 11px; color: var(--dim); }
.dr-sum .is-win b { color: var(--win); }

/* ── the bar ── */
.dr-bar {
  position: fixed; left: 50%; bottom: calc(var(--safe-b) + 14px); transform: translateX(-50%); z-index: 20;
  display: flex; gap: 2px; padding: 5px; border-radius: 999px; background: rgba(28, 28, 32, .86);
  -webkit-backdrop-filter: blur(20px) saturate(1.4); backdrop-filter: blur(20px) saturate(1.4);
  box-shadow: 0 10px 30px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.06);
}
.dr-bar button { width: 58px; height: 46px; border-radius: 999px; display: grid; place-items: center; color: var(--quiet); }
.dr-bar button .dr-ic { width: 20px; height: 20px; }
.dr-bar button[aria-current="page"] { background: var(--card3); color: var(--ink); }

.dr-live {
  position: fixed; left: 16px; right: 16px; bottom: calc(var(--safe-b) + 76px); z-index: 19; max-width: 520px; margin: 0 auto;
  display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 0 14px; border-radius: 16px; font-size: 13px;
  background: #2a0e0c; box-shadow: inset 0 0 0 1px rgba(255,59,48,.35), 0 8px 24px rgba(0,0,0,.5); font-weight: 600; text-align: left;
}
.dr-live span:not(.dr-rec) { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dr-live em { font-style: normal; color: #ffb3ad; font-variant-numeric: tabular-nums; }
.dr-rec { width: 9px; height: 9px; border-radius: 50%; background: var(--live); flex: none; animation: dr-pulse 1.6s ease-in-out infinite; }
@keyframes dr-pulse { 50% { opacity: .35; } }

/* ── sheets: built and removed, never hidden ── */
.dr-scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 40; opacity: 0; transition: opacity .28s var(--ease); }
.dr-scrim.is-up { opacity: 1; }
.dr-sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-width: 560px; margin: 0 auto;
  max-height: calc(100dvh - var(--safe-t) - 40px); display: flex; flex-direction: column;
  background: #18181b; border-radius: 28px 28px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06);
  transform: translateY(100%); transition: transform .34s var(--ease); will-change: transform;
}
.dr-sheet.is-up { transform: translateY(0); }
.dr-sheet.is-drag { transition: none; }
.dr-sheet.is-full { height: calc(100dvh - var(--safe-t) - 10px); max-height: none; }
.dr-grab { height: 26px; flex: none; display: grid; place-items: center; touch-action: none; cursor: grab; }
.dr-grab::after { content: ''; width: 38px; height: 5px; border-radius: 3px; background: #4a4a50; }
.dr-sh-hd { display: flex; align-items: center; gap: 10px; padding: 0 20px 10px; touch-action: none; }
.dr-sh-hd h2 { margin: 0; font-size: 17px; font-weight: 700; flex: 1; min-width: 0; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dr-sh-bd { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 4px 20px 20px; overscroll-behavior: contain; }
.dr-sh-ft { flex: none; padding: 12px 20px calc(var(--safe-b) + 14px); border-top: 1px solid var(--line); display: flex; gap: 10px; }
.dr-sh-ft > * { flex: 1; }

/* ── the shift ── */
.dr-ss-area { flex: 1; min-width: 0; background: none; border: 0; outline: none; font-size: 18px; font-weight: 700; letter-spacing: -.01em; padding: 0; height: 44px; }
.dr-ss-area::placeholder { color: var(--quiet); }
.dr-ss-time { font-variant-numeric: tabular-nums; color: var(--dim); font-size: 13px; font-weight: 600; }
.dr-live-st { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.dr-live-st div { background: var(--card); border-radius: 14px; padding: 9px 4px; text-align: center; min-width: 0; }
.dr-live-st b { display: block; font-size: 17px; font-weight: 700; }
.dr-live-st span { font-size: 10.5px; color: var(--dim); }
.dr-live-st .is-win b { color: var(--win); }
.dr-outs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
.dr-out {
  min-height: 74px; border-radius: 20px; background: var(--card); display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between;
  padding: 12px 14px; text-align: left; transition: transform .12s var(--ease), background .12s;
}
.dr-out:active { transform: scale(.97); background: var(--card2); }
.dr-out span { font-size: 14px; font-weight: 600; }
.dr-out b { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--dim); }
.dr-out.is-sale { grid-column: 1 / -1; min-height: 84px; background: var(--win); color: #002a0c; flex-direction: row; align-items: center; }
.dr-out.is-sale b { color: #002a0c; font-size: 28px; }
.dr-out.is-sale span { font-size: 17px; font-weight: 700; }
.dr-last { margin-top: 12px; background: var(--card); border-radius: var(--r); padding: 12px 14px; }
.dr-last .dr-hd b { font-size: 13px; font-weight: 600; }
.dr-last .dr-hd button { min-height: 36px; padding: 0 12px; border-radius: 999px; background: var(--card2); font-size: 12.5px; font-weight: 600; color: var(--dim); position: relative; }
.dr-last .dr-hd button::before { content: ''; position: absolute; inset: -4px 0; }
.dr-last .dr-pills { margin-top: 10px; }
.dr-goal { display: grid; grid-template-columns: 70px minmax(0, 1fr) 54px; align-items: center; gap: 10px; font-size: 12.5px; margin-top: 10px; }
.dr-goal span { color: var(--dim); }
.dr-goal i { display: block; height: 6px; border-radius: 3px; background: var(--card3); overflow: hidden; }
.dr-goal i b { display: block; height: 100%; background: #c9c9ce; border-radius: 3px; }
.dr-goal.is-met i b { background: var(--win); }
.dr-goal em { font-style: normal; text-align: right; color: var(--dim); }

/* ── summary and report ── */
.dr-hero { font-size: 40px; font-weight: 800; letter-spacing: -.03em; line-height: 1; margin-top: 4px; }
.dr-hero.is-win { color: var(--win); }
.dr-hero + p { margin: 6px 0 12px; font-size: 15px; font-weight: 600; }
.dr-rep { background: var(--card); border-radius: var(--r); padding: 16px; margin-top: 12px; }
.dr-rep-hd { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.dr-rep-hd b { display: block; font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
.dr-rep-hd span { font-size: 12px; color: var(--dim); }
.dr-rep-hero { display: flex; align-items: baseline; gap: 10px; margin: 12px 0 2px; }
.dr-rep-hero b { font-size: 36px; font-weight: 800; letter-spacing: -.03em; color: var(--win); line-height: 1; }
.dr-rep-hero span { font-size: 15px; font-weight: 600; }
.dr-rep .dr-sum { margin-top: 12px; }
.dr-rep .dr-sum div { background: var(--card2); }
.dr-rep .dr-fun { margin-top: 14px; }
.dr-kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
.dr-kv div { min-width: 0; }
.dr-kv span { display: block; font-size: 10.5px; color: var(--dim); }
.dr-kv b { display: block; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dr-rep-sec { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; }
.dr-rep-sec .dr-cap { display: block; margin-bottom: 6px; }
.dr-rep-sec ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.dr-rep-sec li { display: flex; justify-content: space-between; gap: 10px; }
.dr-rep-sec li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--dim); }

<body>

<script>
(function () {

/* ═══════════════════════════════════════════════════════════════

   sale is being won and where it is being lost.

   One press per door. The press is the OUTCOME, and the funnel falls
   out of it: every door is a knock, every outcome but No answer is a
   conversation, a pitch, a callback and a sale are all pitches, and a
   sale is a sale. Four counters you would have to keep in step become
   one tap you cannot get wrong.

   Everything lives in this browser under doors.v1 and doors.view.v1
   and is never sent anywhere. The mentor gets a screenshot of the
   report, which is the whole of what leaves the phone, and you take it.
   ═══════════════════════════════════════════════════════════════ */

var KEY = 'doors.v1', VIEWK = 'doors.view.v1';
var VIEWS = ['home', 'cal', 'wins', 'you'];

var WHY = [['price', 'Price'], ['time', 'No time'], ['have', 'Already has one'], ['owner', 'Not the owner'],
  ['think', 'Wants to think'], ['partner', 'Ask partner'], ['trust', 'Didn’t trust it'], ['other', 'Other']];
var WHY_N = WHY.reduce(function (o, x) { o[x[0]] = x[1]; return o; }, {});
var CURS = ['$', '£', '€'];

var IC = {
  report: '<svg class="dr-ic" viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="17" rx="3"/><path d="M9 15v-2M12 15v-5M15 15v-3"/></svg>',
  left: '<svg class="dr-ic" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>',
  right: '<svg class="dr-ic" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',
  chev: '<svg class="dr-ic" viewBox="0 0 24 24" style="color:var(--quiet);width:16px;height:16px"><path d="M9 6l6 6-6 6"/></svg>',
  down: '<svg class="dr-ic" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>',
  x: '<svg class="dr-ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>'

/* ═══════════ HELPERS ═══════════ */
function $(s, r) { return (r || document).querySelector(s); }
function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function el(html) { var t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; }

function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

function today() { var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
function monday(d) { return addDays(d, -((d.getDay() + 6) % 7)); }

function fmtHour(h) { return (h % 12 || 12) + (h < 12 ? 'am' : 'pm'); }
function fmtTime(t) { var d = new Date(t); var m = d.getMinutes(); return (d.getHours() % 12 || 12) + ':' + String(m).padStart(2, '0') + (d.getHours() < 12 ? 'am' : 'pm'); }
function fmtClock(ms) { var s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? h + ':' + String(m).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0') : m + ':' + String(s % 60).padStart(2, '0'); }

/* MONEY IS CENTS. A dollar figure in floating point is a cent out
   somewhere eventually, and a total you cannot trust is one you stop
   reading. */
function money(c) {

  if (Math.abs(v) >= 10000) return cur + (Math.round(v / 100) / 10) + 'k';
  if (v % 1) return cur + v.toFixed(2);
  return cur + v.toLocaleString('en-US');
}
function pct(a, b) { return b > 0 ? Math.round(a / b * 100) : null; }
function pctTxt(a, b) { var p = pct(a, b); return p === null ? '–' : p + '%'; }
function toCents(s) { var v = parseFloat(String(s).replace(/[^0-9.]/g, '')); return isFinite(v) && v >= 0 ? Math.round(v * 100) : 0; }

/* ═══════════ STORE ═══════════ */
/* A shift is { id, d, a, s, e, k, m }: its date, the area, when it
   started and ended (e is 0 while it is live), the doors as

   positive, -1 negative, absent untagged), value in cents, product,
   note — and m, the totals of a shift written up afterwards.

   other is a summary of a record somebody did not keep, and adding them

      var y = { t: +k.t || 0, o: k.o };
      if (k.r && WHY_N[k.r] && k.o !== 'na' && k.o !== 'sa') y.r = k.r;
      if ((k.f === 1 || k.f === -1) && k.o !== 'na') y.f = k.f;
      if (k.o === 'sa') { y.v = Math.round(num(k.v) || 0); if (typeof k.p === 'string' && k.p) y.p = k.p.slice(0, 40); if (typeof k.n === 'string' && k.n) y.n = k.n.slice(0, 280); }

    });

  });

}
var S;
function drLoad() { try { S = drClean(JSON.parse(localStorage.getItem(KEY) || 'null')); } catch (e) { S = drDefault(); } }
function drSave() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { drToast('Could not save — storage is full'); } }
drLoad();

function drLiveShift() { for (var i = 0; i < S.sh.length; i++) if (!S.sh[i].m && !S.sh[i].e) return S.sh[i]; return null; }
function drShById(id) { for (var i = 0; i < S.sh.length; i++) if (S.sh[i].id === id) return S.sh[i]; return null; }
function drShOn(k) { return S.sh.filter(function (s) { return s.d === k; }).sort(function (a, b) { return a.s - b.s; }); }
function drIn(from, to) { var a = ymd(from), b = ymd(to); return S.sh.filter(function (s) { return s.d >= a && s.d <= b; }); }
function drAreas() {
  var seen = {}, out = [];
  S.sh.slice().sort(function (a, b) { return b.s - a.s; }).forEach(function (s) { if (s.a && !seen[s.a.toLowerCase()]) { seen[s.a.toLowerCase()] = 1; out.push(s.a); } });
  return out;
}

/* ═══════════ THE ARITHMETIC ═══════════ */
function drCounts(list) {
  var c = { k: 0, an: 0, pi: 0, cb: 0, sa: 0, rv: 0, ms: 0, sh: 0, pos: 0, neg: 0, why: {}, wins: [] };
  list.forEach(function (s) {
    c.sh++;
    if (s.m) { c.k += s.m.k; c.an += s.m.an; c.pi += s.m.pi; c.cb += s.m.cb; c.sa += s.m.sa; c.rv += s.m.rv; c.ms += s.m.h * 3600000; return; }
    var end = s.e || Date.now();
    if (s.s && s.k.length) c.ms += Math.max(0, end - s.s);
    s.k.forEach(function (k) {
      c.k++;
      if (k.o !== 'na') c.an++;
      if (k.o === 'pi' || k.o === 'cb' || k.o === 'sa') c.pi++;
      if (k.o === 'cb') c.cb++;
      if (k.o === 'sa') { c.sa++; c.rv += k.v || 0; c.wins.push({ k: k, s: s }); }
      if (k.r) c.why[k.r] = (c.why[k.r] || 0) + 1;

}
/* THREE STEPS, each measured against the one before it, because that is
   the only way a step is about YOU: an answer rate is the street and the
   hour as much as anything you did, a close rate over doors knocked
   mixes all three together, and "of the people I pitched, how many
   bought" is the number a mentor actually asks for. */
var STEPS = [
  { id: 'an', n: 'Answer', of: 'k', is: 'an', tip: 'Doors opening. Try other hours or streets — see Best hours and Areas.' },
  { id: 'pi', n: 'Pitch', of: 'an', is: 'pi', tip: 'Getting from the door opening to the pitch. Work on your opener.' },
  { id: 'sa', n: 'Close', of: 'pi', is: 'sa', tip: 'Turning pitches into sales. Work on handling objections and asking for the sale.' }
];
var MIN_N = 10;
/* WHERE TO IMPROVE is worked out against your own record, never against
   a benchmark somebody else wrote: a figure that says 30% is low for
   doors means nothing about your product, your patch or your season.
   A step is only judged when both sides have ten people behind it —
   fewer and one bad street is a finding. */
function drFocus(cur, base) {
  var worst = null;
  STEPS.forEach(function (st) {
    if (cur[st.of] < MIN_N || base[st.of] < MIN_N) return;
    var a = cur[st.is] / cur[st.of], b = base[st.is] / base[st.of];
    if (b <= 0) return;
    var rel = a / b - 1;

  });
  return worst;
}
function drTopWhy(c, n) {
  return Object.keys(c.why).map(function (r) { return [r, c.why[r]]; }).sort(function (a, b) { return b[1] - a[1]; }).slice(0, n || 3);
}
/* A PERIOD and the stretch before it of the same length, so a week is
   compared with the four before it rather than with a figure that
   includes itself. */
function drPeriod(p) {
  var t = today(), from, to, label, bFrom, bTo;
  if (p === 'today') { from = to = t; label = fmtDay(ymd(t)); bTo = addDays(t, -1); bFrom = addDays(t, -28); }
  else if (p === 'week') { from = monday(t); to = t; label = 'This week'; bTo = addDays(from, -1); bFrom = addDays(from, -28); }
  else if (p === 'last') { to = addDays(monday(t), -1); from = addDays(to, -6); label = 'Last week'; bTo = addDays(from, -1); bFrom = addDays(from, -28); }
  else if (p === 'month') { from = new Date(t.getFullYear(), t.getMonth(), 1); to = t; label = MON[t.getMonth()]; bTo = addDays(from, -1); bFrom = addDays(from, -90); }
  else if (p === '30') { from = addDays(t, -29); to = t; label = 'Last 30 days'; bTo = addDays(from, -1); bFrom = addDays(from, -90); }
  else { from = new Date(2000, 0, 1); to = t; label = 'All time'; bFrom = bTo = null; }

function drAreaRows(list) {
  var m = {};
  list.forEach(function (s) {
    var a = s.a || 'No area', c = drCounts([s]);
    var r = m[a.toLowerCase()] || (m[a.toLowerCase()] = { a: a, k: 0, sa: 0, rv: 0 });

  return Object.keys(m).map(function (k) { return m[k]; }).filter(function (r) { return r.k > 0; })
    .sort(function (a, b) { var ra = a.k >= MIN_N ? a.sa / a.k : -1, rb = b.k >= MIN_N ? b.sa / b.k : -1; return rb - ra || b.k - a.k; });
}
function drHours(list) {
  var h = {};
  list.forEach(function (s) { if (!s.m) s.k.forEach(function (k) { var x = new Date(k.t).getHours(); var r = h[x] || (h[x] = { h: x, k: 0, an: 0, sa: 0 }); r.k++; if (k.o !== 'na') r.an++; if (k.o === 'sa') r.sa++; }); });
  return Object.keys(h).map(function (k) { return h[k]; }).sort(function (a, b) { return a.h - b.h; });
}

/* ═══════════ SHEETS ═══════════ */
var stack = [];
function drSheet(o) {
  var scrim = el('<div class="dr-scrim"></div>');
  var sh = el('<div class="dr-sheet" role="dialog" aria-modal="true"><div class="dr-grab" aria-hidden="true"></div><div class="dr-sh-hd"><h2></h2></div><div class="dr-sh-bd"></div></div>');
  if (o.full) sh.classList.add('is-full');
  if (o.cls) sh.classList.add(o.cls);
  $('h2', sh).textContent = o.title || '';
  sh.setAttribute('aria-label', o.title || 'Sheet');
  if (o.head) { var hd = $('.dr-sh-hd', sh); hd.textContent = ''; hd.appendChild(o.head); }

    el: sh, body: bd, foot: ft,
    close: function (quiet) {

function drAsk(title, text, yes, onYes) {

  var no = el('<button type="button" class="dr-btn">Keep it</button>');
  var go = el('<button type="button" class="dr-btn is-bad"></button>'); go.textContent = yes;
  var s = drSheet({ title: title, body: b, foot: [no, go] });
  no.addEventListener('click', function () { s.close(); });
  go.addEventListener('click', function () { s.close(true); onYes(); });
  return s;
}
var toastT = null;
function drToast(msg, undo) {
  var old = $('.dr-toast'); if (old) old.remove();
  clearTimeout(toastT);
  var t = el('<div class="dr-toast" role="status"><span></span></div>');
  $('span', t).textContent = msg;

    var u = el('<button type="button">Undo</button>');

    t.appendChild(u);

/* A row of pills where one is pressed, or none; pressing the pressed
   one clears it. */
function drPillRow(opts, cur, onPick, cls) {

  if (cls) box.classList.add(cls);
  opts.forEach(function (o) {
    var p = el('<button type="button" class="dr-pill"></button>');

function drSeg(opts, cur, onPick) {

  s.style.setProperty('--n', opts.length);

/* ═══════════ A SHIFT WRITTEN UP AFTERWARDS ═══════════ */
/* Not every shift gets tracked door by door — a phone dies, a day is
   too busy. Totals are the honest record of that day, and they count
   in every figure except Best hours, which needs a time on each door
   and so leaves them out rather than inventing one. */
function drManualForm(sh, day) {

  var b = el('<div></div>');

    $('label', w).textContent = lab; $('label', w).htmlFor = id;
    var f = $('input', w); f.id = id; f.inputMode = mode || 'numeric'; if (val) f.value = val;
    return w;
  }
  var dw = el('<div><label class="dr-flab" for="drMD" style="margin-top:4px">Date</label><input class="dr-field" id="drMD" type="date" /></div>');
  $('input', dw).value = sh ? sh.d : day; $('input', dw).max = ymd(today());
  b.appendChild(dw);
  b.appendChild(field('drMA', 'Area', sh ? sh.a : '', 'text'));

  var g = el('<div class="dr-grid2"></div>');
  g.appendChild(field('drMK', 'Doors', m.k)); g.appendChild(field('drMAn', 'Answered', m.an));
  g.appendChild(field('drMPi', 'Pitched', m.pi)); g.appendChild(field('drMCb', 'Callbacks', m.cb));
  g.appendChild(field('drMSa', 'Sales', m.sa)); g.appendChild(field('drMRv', 'Sold (' + S.cur + ')', m.rv ? m.rv / 100 : '', 'decimal'));
  g.appendChild(field('drMH', 'Hours out', m.h || '', 'decimal'));
  b.appendChild(g);
  var foot = [], del = null;
  if (sh) { del = el('<button type="button" class="dr-btn is-bad">Remove</button>'); foot.push(del); }
  var go = el('<button type="button" class="dr-btn is-ink" id="drMGo">Save</button>'); foot.push(go);
  var s = drSheet({ title: sh ? 'Shift' : 'Log a shift', body: b, foot: foot });
  go.addEventListener('click', function () {
    function n(id) { var v = parseInt($('#' + id, b).value, 10); return v > 0 ? Math.min(99999, v) : 0; }
    var x = { k: n('drMK'), an: n('drMAn'), pi: n('drMPi'), cb: n('drMCb'), sa: n('drMSa'), rv: toCents($('#drMRv', b).value), h: Math.min(24, Math.round((parseFloat($('#drMH', b).value) || 0) * 4) / 4) };
    var d = $('#drMD', b).value;
    if (!/^\d{4}-\d\d-\d\d$/.test(d) || d > ymd(today())) { drToast('Pick a day that has happened'); return; }
    if (!x.k) { drToast('How many doors?'); $('#drMK', b).focus(); return; }
    if (x.an > x.k || x.pi > x.an) { drToast('Each step can’t be more than the one before'); return; }
    if (x.sa + x.cb > x.pi) { drToast('Sales and callbacks are part of pitched'); return; }
    var a = $('#drMA', b).value.trim().slice(0, 40);
    if (sh) { sh.d = d; sh.a = a; sh.m = x; }
    else S.sh.push({ id: drId(), d: d, a: a, s: parseYmd(d).getTime() + 12 * 3600000, e: 1, k: [], m: x });
    drSave(); s.close(true); drRender(); drToast(sh ? 'Shift saved' : 'Shift logged');
  });
  if (del) del.addEventListener('click', function () { s.close(true); drRemoveShift(sh); });
}
function drRemoveShift(sh) {
  var i = S.sh.indexOf(sh); if (i < 0) return;
  S.sh.splice(i, 1); drSave(); drRender();

}
function drShiftSheet(sh) {

  if (!sh.e) { drOpenShift(); return; }
  var c = drCounts([sh]), b = el('<div></div>');
  var p = el('<p style="margin:0 0 12px;color:var(--dim)"></p>');
  p.textContent = fmtDay(sh.d) + ' · ' + fmtTime(sh.s) + '–' + fmtTime(sh.e) + ' · ' + fmtDur(c.ms);
  b.appendChild(p);
  b.appendChild(drSumTiles(c));
  b.appendChild(el('<label class="dr-flab" for="drShA">Area</label>'));
  var af = el('<input class="dr-field" id="drShA" maxlength="40" autocomplete="off" />'); af.value = sh.a; b.appendChild(af);
  af.addEventListener('change', function () { sh.a = af.value.trim().slice(0, 40); drSave(); drRender(); });

  del.addEventListener('click', function () { s.close(true); drRemoveShift(sh); });
}

/* ═══════════ THE REPORT ═══════════ */
/* ONE SCREEN, MADE TO BE PHOTOGRAPHED. A mentor reads a screenshot
   once, on another phone, with no way to scroll or tap, so everything
   that matters is on it and nothing that needs explaining is. Copy as
   text is beside it for the times a message is easier. */
var repP = 'week';
function drReport(p) {
  if (p) repP = p;
  var b = el('<div id="drRepBody"></div>');
  /* In the head rather than a foot: a foot is 90px of the one screen
     the report has to fit, and the screenshot is the main way out. */
  var copy = el('<button type="button" class="dr-btn" id="drRepCopy">Copy as text</button>');
  var s = drSheet({ title: 'Report', body: b, extra: copy, full: true });
  function paint() {
    b.textContent = '';
    b.appendChild(drSeg([['today', 'Today'], ['week', 'Week'], ['last', 'Last week'], ['month', 'Month']], repP, function (v) { repP = v; paint(); }));
    b.appendChild(drRepCard(drPeriod(repP)));
  }
  paint();
  copy.addEventListener('click', function () {
    var txt = drRepText(drPeriod(repP));
    var done = function () { drToast('Report copied'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, function () { drShowText(txt); });
    else drShowText(txt);
  });
  return s;
}
function drRepCard(p) {

  $('.dr-rep-hd div span', card).textContent = p.range;
  $('.dr-rep-who', card).textContent = S.name || '';

  var hero = el('<div class="dr-rep-hero"><b class="dr-num"></b><span></span></div>');
  $('b', hero).textContent = c.sa + (c.sa === 1 ? ' sale' : ' sales');
  $('span', hero).textContent = c.rv ? money(c.rv) : '';
  card.appendChild(hero);
  var sub = el('<div class="dr-lab"></div>');
  sub.textContent = c.sh + (c.sh === 1 ? ' shift' : ' shifts') + (c.ms ? ' · ' + fmtDur(c.ms) + ' on the doors' : '') + (c.cb ? ' · ' + c.cb + (c.cb === 1 ? ' callback' : ' callbacks') : '');

   ['Positive', c.pos + c.neg ? pctTxt(c.pos, c.pos + c.neg) : '–'], ['Sales / 100', String(Math.round(c.sa / c.k * 100))], ['Best area', areas[0] && areas[0].sa ? areas[0].a : '–']].forEach(function (x) {

/* ═══════════ CALENDAR ═══════════ */
var calAt = today();

  var root = $('#drCal'); root.textContent = '';

  var t = today(), from = new Date(calAt.getFullYear(), calAt.getMonth(), 1), to = new Date(calAt.getFullYear(), calAt.getMonth() + 1, 0);
  var nav = el('<div class="dr-calnav"><button type="button" class="dr-round" aria-label="Earlier">' + IC.left + '</button><b></b><button type="button" class="dr-round" aria-label="Later">' + IC.right + '</button></div>');
  $('b', nav).textContent = MON[from.getMonth()] + ' ' + from.getFullYear();
  var bs = $$('button', nav);
  bs[1].disabled = to >= t;
  bs[0].addEventListener('click', function () { calAt = new Date(calAt.getFullYear(), calAt.getMonth() - 1, 1); drRenderCal(); });
  bs[1].addEventListener('click', function () { if (to < t) { calAt = new Date(calAt.getFullYear(), calAt.getMonth() + 1, 1); drRenderCal(); } });
  root.appendChild(nav);
  var card = el('<div class="dr-card" style="padding:12px"><div class="dr-dows" aria-hidden="true"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div><div class="dr-month" id="drMonth"></div></div>');

  for (var d = 1; d <= to.getDate(); d++) {
    var k = ymd(new Date(from.getFullYear(), from.getMonth(), d)), c = drCounts(drShOn(k));
    var cell = el('<button type="button" class="dr-cell"><span class="dr-num"></span><small class="dr-num"></small></button>');
    cell.dataset.d = k;
    $('span', cell).textContent = d;

  var sum = el('<div class="dr-sum" id="drCalSum"></div>');
  [[mc.sh, 'Shifts'], [mc.k, 'Doors'], [mc.sa, 'Sales', 1], [mc.rv ? money(mc.rv) : '–', 'Sold', 1]].forEach(function (x) {
    var dv = el('<div><b class="dr-num"></b><span></span></div>'); $('b', dv).textContent = x[0]; $('span', dv).textContent = x[1]; if (x[2]) dv.classList.add('is-win'); sum.appendChild(dv);
  });
  root.appendChild(sum);

  if (list.length) {

  nf.addEventListener('change', function () { S.name = nf.value.trim().slice(0, 40); drSave(); });
  card.appendChild(el('<label class="dr-flab">Currency</label>'));
  var cp = drPillRow(CURS.map(function (c) { return [c, c]; }), S.cur, function (c) { S.cur = c || '$'; drSave(); drRenderYou(); });
  card.appendChild(cp);
  var g = el('<div class="dr-grid2"><div><label class="dr-flab" for="drGSa">Sales a shift</label><input class="dr-field dr-num" id="drGSa" inputmode="numeric" autocomplete="off" /></div><div><label class="dr-flab" for="drGDr">Doors a shift</label><input class="dr-field dr-num" id="drGDr" inputmode="numeric" autocomplete="off" /></div></div>');
  $('#drGSa', g).value = S.goal.sa; $('#drGDr', g).value = S.goal.dr;
  $('#drGSa', g).addEventListener('change', function (e) { var v = parseInt(e.target.value, 10); S.goal.sa = v >= 0 ? Math.min(999, v) : 0; drSave(); });
  $('#drGDr', g).addEventListener('change', function (e) { var v = parseInt(e.target.value, 10); S.goal.dr = v >= 0 ? Math.min(9999, v) : 0; drSave(); });
  card.appendChild(g);
  root.appendChild(card);
  var all = drCounts(S.sh);
  var lt = el('<div class="dr-sum" style="--n:3"></div>');
  [[all.sh, 'Shifts'], [all.k, 'Doors'], [pctTxt(all.sa, all.pi), 'Close rate']].forEach(function (x) { var d = el('<div><b class="dr-num"></b><span></span></div>'); $('b', d).textContent = x[0]; $('span', d).textContent = x[1]; lt.appendChild(d); });
  root.appendChild(el('<div class="dr-cap dr-gh">All time</div>'));
  root.appendChild(lt);
  root.appendChild(el('<div class="dr-cap dr-gh">Backup</div>'));
  var bk = el('<div class="dr-card" style="display:flex;gap:10px"><button type="button" class="dr-btn" style="flex:1" id="drCopy">Copy a backup</button><button type="button" class="dr-btn" style="flex:1" id="drRestore">Restore</button></div>');
  $('#drCopy', bk).addEventListener('click', drCopy);
  $('#drRestore', bk).addEventListener('click', drRestore);
  root.appendChild(bk);
}
function drCopy() {
  var txt = JSON.stringify(S);
  var done = function () { drToast('Backup copied'); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, function () { drShowText(txt); });
  else drShowText(txt);
}
function drRestore() {
  var b = el('<div><p class="dr-lab" style="margin:0 0 10px">Paste a backup. It replaces everything on this phone.</p><textarea class="dr-field" style="height:200px" aria-label="Backup"></textarea></div>');
  var go = el('<button type="button" class="dr-btn is-ink is-full">Restore</button>');
  var s = drSheet({ title: 'Restore', body: b, foot: [go] });
  go.addEventListener('click', function () {
    var o; try { o = JSON.parse($('textarea', b).value); } catch (e) { drToast('That is not a backup'); return; }
    if (!o || typeof o !== 'object' || !Array.isArray(o.sh)) { drToast('That is not a backup'); return; }
    var snap = JSON.stringify(S);
    S = drClean(o); drSave(); s.close(true); drRender();
    drToast('Restored', function () { S = drClean(JSON.parse(snap)); drSave(); drRender(); });
  });
}

/* ═══════════ NAVIGATION ═══════════ */
var view = 'home';
try { var sv = localStorage.getItem(VIEWK); if (VIEWS.indexOf(sv) >= 0) view = sv; } catch (e) {}
var IDS = { home: 'drHome', cal: 'drCal', wins: 'drWins', you: 'drYou' };
function drGo(v) {
  if (VIEWS.indexOf(v) < 0) v = 'home';
  if (v === 'cal' && view !== 'cal') calAt = today();
  view = v;
  try { localStorage.setItem(VIEWK, v); } catch (e) {}
  drRender(); window.scrollTo(0, 0);
}
function drRender() {
  VIEWS.forEach(function (v) { $('#' + IDS[v]).hidden = v !== view; });
  $$('.dr-bar button').forEach(function (b) { if (b.dataset.v === view) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  if (view === 'home') drRenderHome();
  else if (view === 'cal') drRenderCal();
  else if (view === 'wins') drRenderWins();
  else drRenderYou();
  var sh = drLiveShift(), live = $('#drLive');
  live.hidden = !sh || !!shiftSheet;
  document.body.classList.toggle('dr-has-live', !live.hidden);
  if (sh) { live.innerHTML = '<span class="dr-rec" aria-hidden="true"></span><span></span><em></em>'; $('span:nth-child(2)', live).textContent = (sh.a || 'Shift') + ' · ' + drCounts([sh]).k + ' doors'; live.setAttribute('aria-label', 'Back to the shift'); drTick(); }
}
$$('.dr-bar button').forEach(function (b) { b.addEventListener('click', function () { drGo(b.dataset.v); }); });
$('#drLive').addEventListener('click', drOpenShift);
setInterval(function () { if (drLiveShift()) drTick(); }, 1000);

drRender();
/* A shift left running when the app was closed comes back up where it
   was: closing the app at a gate is not ending the shift. */
if (drLiveShift()) drOpenShift();

if ('serviceWorker' in navigator && /^(https:|http:\/\/(localhost|127\.0\.0\.1))/.test(location.href)) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
})();
</script>
</body>
