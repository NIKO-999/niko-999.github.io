<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark light" />
<!-- Without this the browser asks for /favicon.ico on every load and
     takes a 404 for it. The mark is the same glyph as the rail. -->
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<title>Days — Habits</title>
<script>
/* Inline, and before the stylesheet, so the first paint is already
   themed and the photograph starts downloading immediately. Identical
   to Arc's, because it is the same shell. */
(function () {
  var d = document.documentElement, g = null;
  try { g = window.localStorage; } catch (e) {}
  var read = function (k) { try { return g && g.getItem(k); } catch (e) { return null; } };
  /* Backdrop and palette are separate now, and this runs before any
     script that knows the list — so the mapping is repeated here, small
     and flat. Fourteen backdrops, eight palettes. */
  var PAL = { turtle:'slate', canyon:'ember', desert:'ember', nightfall:'cyan',
              iceberg:'cyan', delta:'cyan', curve:'vellum', cobalt:'cobalt',
              abyss:'cyan', jade:'jade', violet:'violet', iris:'violet',
              umber:'umber', silk:'slate' };
  var p = read('arc.palette') || 'nightfall';
  if (!PAL[p]) p = 'nightfall';          /* the old five no longer exist */
  var m = read('arc.theme') || 'system';
  d.dataset.bg = p;
  d.dataset.palette = PAL[p];
  d.dataset.resolved = m === 'system'
    ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : m;
  /* Set here rather than in shell.js, which is deferred and therefore
     runs AFTER each app's own script — the flag has to exist before
     anything reads it, and being set pre-stylesheet means the first
     paint is already the right shape with no flash of the wide layout. */
  var phone = matchMedia('(max-width: 700px)').matches;
  d.dataset.phone = phone ? 'on' : 'off';
  /* No photograph on a phone, so no request for one. The panel covers
     the viewport there and the image would be invisible behind it. */
  if (!phone) {
    var l = document.createElement('link');
    l.rel = 'preload'; l.as = 'image'; l.href = '../arc/bg/' + p + '.jpg';
    l.fetchPriority = 'high';
    document.head.appendChild(l);
  }
  /* One file, not two. It is a variable font covering 100–900, so the
     three weights this used to fetch separately were three copies of the
     same bytes. */
  var k = document.createElement('link');
  k.rel = 'preload'; k.as = 'font'; k.type = 'font/woff2';
  k.href = '../arc/fonts/Inter.woff2'; k.crossOrigin = 'anonymous';
  document.head.appendChild(k);
})();
</script>

<link rel="stylesheet" href="../shell.css" />
<style>
/* Chrome the two screens borrow from the app they came out of. Copied
   rather than lifted into shell.css: that file is read by three apps
   now, and a rule that only two of them use does not belong in the one
   all three load. Arc and the ledger already duplicate .step between
   them, so this is the pattern here, not a new one. */
.pane { flex: 1; overflow-y: auto; padding: 4px 14px 22px; }
.cal-head { display: flex; align-items: center; gap: 12px; margin: 6px 0 10px; }
.cal-head h2 {
  margin: 0;
  font-family: var(--mono);
  font-size: .72rem;
  font-weight: 400;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: var(--ink-2);
}
.cal-head .grow { flex: 1; }
.step {
  width: 28px; height: 28px;
  display: grid; place-items: center;
  border: 1px solid var(--glass-line);
  border-radius: 8px;
  background: var(--glass-in);
  color: var(--ink-2);
  cursor: pointer;
  font: inherit;
}
.step.wide {
  width: auto; padding: 0 10px;
  font-family: var(--mono); font-size: .58rem;
  text-transform: uppercase; letter-spacing: .08em;
}
.step:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
@media (hover: hover) { .step:hover { background: var(--glass-in-2); } }
/* The week/month switch. Two states, so it takes the neutral treatment
   rather than the ledger's win/loss one — neither week nor month is an
   outcome. */
.side { display: flex; gap: 0; border-radius: 8px; overflow: hidden;
  background: var(--glass-in); }
.side button {
  flex: 1; height: 36px; border: 0; background: var(--glass-in);
  color: var(--ink-2); font: inherit; font-family: var(--mono);
  font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; cursor: pointer;
}
.side button[aria-pressed="true"] { color: var(--ink); }
.side.two button[aria-pressed="true"] { background: var(--glass-in-2);
  box-shadow: inset 0 -2px 0 var(--accent); }

/* ══ habits ══════════════════════════════════════════════════════
   The other life, and it shares nothing with the ledger but the shell.
   Its own key, its own screen, and a rail slot under Arc, because
   Arc is the other thing here that is not about money.

   THE IDEA THE SCREEN RESTS ON: CADENCE IS PART OF THE HABIT. Abs every
   two days is not abs 3.5 times a week — a day is DUE or it is not, and
   the chain, the calendar and both radars are computed from what was
   due. Treated as five daily checkboxes the screen would be wrong about
   four of the five on day one.

   Everything is a tick. Reading thirty minutes happens in one sitting
   and the water gets ticked at the end of the day, so a counter would
   be asking for bookkeeping the day has already done. Three litres and
   thirty minutes are printed beside the name instead: part of what the
   habit IS, not a total to reach.

   AND NOTHING HERE IS A REPORT CARD. There is no "2 of 5" anywhere. The
   picture carries the shortfall and the words count up, because a
   screen you dread opening on a bad day is a screen you stop opening.
   ══════════════════════════════════════════════════════════════ */

/* Ink for something sitting ON a block of ink — the month on a
   reminder's date chip. It came across with the chip and its
   definition did not: on this page --ink-on was undefined, which does
   not fall back, it makes the whole declaration invalid and lets the
   colour INHERIT. The chip ran at 1.74:1 and looked deliberate. Same
   failure the ledger had three of, found the same way, by measuring a
   real pixel rather than by reading the rule. */
:root { --ink-on: #14130f; }
:root[data-resolved="light"] { --ink-on: #f4f2ef; }

/* ── a colour each ──
   The colour says WHICH habit, never whether you kept it. That
   distinction is the whole licence for having any here: this screen
   had no colour on purpose, because a wash of red across a week you
   missed is a judgement about you and is what makes you stop opening
   the app. Identity is not a judgement. So a kept mark takes its
   habit's colour and a missed one stays hollow — the same filled-or-
   hollow language as before, with the fill now saying what it is.

   Never an accent, like the splits: the accent moves with the palette
   and a habit that changes colour when you change the backdrop is not
   a habit you can recognise at four pixels.

   They also have to stay clear of the four split colours, which are on
   this same screen — so no teal, no rose and no brass among them. */
/* Measured, not chosen by eye. Every one of these is at least ΔE 12
   from all four split colours and from the other five, in BOTH themes
   — checked in tests/days.js. Three of them moved to get there:
   reading was ΔE 6 from the rest-day grey, which is the same colour at
   a glance; the wake-up was 11 from the legs brass; and the workout
   was 10 from the pull rose. All three were warm neutrals fighting
   over the same corner of the space. */
:root {
  --h-wake:    #dcc084;   /* first light */
  --h-workout: #c8756c;   /* the effort */
  --h-abs:     #96566b;   /* the same effort, deeper */
  --h-walk:    #7aa9b8;   /* morning air */
  --h-water:   #6b8fc4;   /* the obvious one */
  --h-read:    #c6bfb0;   /* paper */
}
/* Darkened rather than reused. The same six on a pale panel are six
   pastels on white — legible as decoration and not as which habit. */
:root[data-resolved="light"] {
  --h-wake:    #8a6a1c;
  --h-workout: #9c4034;
  --h-abs:     #6e3247;
  --h-walk:    #3a6d7d;
  --h-water:   #3a5a92;
  --h-read:    #4c4432;
}

/* ── what you trained ──
   Jade, garnet, sapphire — and none can be mistaken for the accent or
   for any of the six habits.

   Not distinct by saturation: the first set of all got its distinctness
   by sitting at 55–78% against an accent family that never exceeds 52%,
   and that is exactly what made it shout. These sit at 53% and are told
   apart by HUE and depth instead.

   THE ROOM FOR THEM IS NEARLY GONE, and it is worth writing down why.
   Six habit colours, eighteen accents across the palettes, four splits
   and a saturation ceiling is more colours than this space holds. A
   search told to maximise separation returned magenta and olive every
   single time, at every register tried — those are the only wide gaps
   the habits and accents leave. So these three were CHOSEN as a set and
   then tuned until they measured, rather than measured first and
   accepted whatever came back: hue bands fixed at green, red and blue,
   and only lightness and saturation searched inside them.

   Result: every one is ≥ ΔE 17 from all six habits, from the other
   splits and from all eighteen accents, in both themes, at 53%
   saturation. tests/habits.js holds the thresholds.

   Rest is deliberately the opposite, at 4%: an absence of colour rather
   than a fourth kind of training. */
:root {
  --sp-push: #54b496;      /* jade     */
  --sp-pull: #aa3a51;      /* garnet   */
  --sp-legs: #3c65bc;      /* sapphire */
  --sp-rest: #918e88;      /* grey     */
}
:root[data-resolved="light"] {
  --sp-push: #2e8469;
  --sp-pull: #892a3d;
  --sp-legs: #223356;
  --sp-rest: #77746e;
}

/* ── today: one ring, then the list ──
   The ring answers "am I on track" and the list answers "with what", in
   that order — the first is what you open the screen for, the second is
   what you act on. Five bars would let you compare five habits against
   one another at a glance and one ring does not; what it buys is a
   screen that has said something before you have read a word. */
.hb-now { display: flex; align-items: center; gap: 30px; flex-wrap: wrap;
  border: 1px solid var(--glass-line); border-radius: 12px;
  background: var(--glass-in); padding: 20px 22px; }
.hb-dial { flex: none; }
.hb-dial svg { width: 148px; height: 148px; display: block; }
.hb-dial .tr { fill: none; stroke: var(--glass-in-2); stroke-width: 7; }
.hb-dial .fl { fill: none; stroke: var(--accent); stroke-width: 7; stroke-linecap: round;
  transform: rotate(-90deg); transform-origin: 50% 50%;
  transition: stroke-dasharray .45s cubic-bezier(.22,.75,.3,1); }
.hb-dial .mid { font-family: var(--mono); font-size: 22px; fill: var(--ink); text-anchor: middle; }
.hb-dial .sub { font-family: var(--mono); font-size: 6px; fill: var(--ink-3);
  text-anchor: middle; letter-spacing: .12em; }
@media (prefers-reduced-motion: reduce) { .hb-dial .fl { transition: none; } }

.hb-list { flex: 1; min-width: 270px; display: grid; gap: 1px;
  background: var(--glass-line); border-radius: 9px; overflow: hidden; }
.hb-item { display: grid; grid-template-columns: 13px minmax(0, 1fr) auto auto;
  gap: 12px; align-items: center; background: var(--glass-in); padding: 9px 12px; }
/* Solid or hollow, the same shape language the check-in pad uses. */
.hb-dot { width: 11px; height: 11px; border-radius: 50%; box-sizing: border-box;
  box-shadow: inset 0 0 0 1px var(--glass-line); }
/* Flat. The disc was a lit sphere with a bloom around it, which made a
   ticked habit the brightest thing in the row and pulled the eye off
   the name it belongs to. A mark that says "done" does not need to
   glow to say it. */
.hb-dot[data-on] { background: var(--lit, var(--accent)); }
.hb-nm { min-width: 0; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.hb-nm b { font-size: .82rem; font-weight: 400; color: var(--ink-3); }
.hb-item[data-on] .hb-nm b { color: var(--ink); font-weight: 500; }
.hb-nm em { font-style: normal; font-family: var(--mono); font-size: .54rem;
  letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.hb-say { font-family: var(--mono); font-size: .58rem; letter-spacing: .05em;
  color: var(--ink-3); white-space: nowrap; }
.hb-say b { color: var(--ink-2); font-weight: 500; font-size: .58rem; }
.hb-act { display: flex; gap: 5px; align-items: center; }
.hb-act button { height: 26px; min-width: 26px; padding: 0 8px;
  border: 1px solid var(--glass-line); border-radius: 7px; background: none;
  font: inherit; font-size: .74rem; color: var(--ink-3); cursor: pointer; }
.hb-act button:hover { background: var(--glass-in-2); color: var(--ink); }
.hb-act button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.hb-act button.on { background: var(--glass-in-2); color: var(--ink); border-color: var(--ink-3); }
.hb-act .tick { width: 30px; display: grid; place-items: center; }
.hb-act .tick svg { width: 13px; height: 13px; }

/* The picker is the ONLY place the words push, pull and legs appear.
   Everywhere else the colour carries it — the point is to track the
   split, not to carry it around. */
.hb-split { display: flex; gap: 4px; align-items: center; }
.hb-split button { width: 26px; height: 26px; padding: 0; border-radius: 7px;
  cursor: pointer; border: 1px solid var(--glass-line); background: none;
  display: grid; place-items: center; }
/* All four the same. The chosen one used to come up to full while the
   others sat back at .45, which made it the brightest object on the
   row for a fact the row already states in words — and put a fifth
   bright dot in a column of six that now carry colours of their own.
   The ring says which; the dots only say which four there are. */
.hb-split button i {
  width: 10px; height: 10px; border-radius: 50%; opacity: .62;
  background: var(--c);
  transition: opacity .16s;
}
.hb-split button:hover i { opacity: .85; }
@media (prefers-reduced-motion: reduce) { .hb-split button i { transition: none; } }
/* Two rings rather than one, so the chosen button is legible as chosen
   without anything inside it changing. */
.hb-split button[aria-pressed="true"] {
  border-color: var(--c);
  box-shadow: inset 0 0 0 1px var(--c);
}
.hb-split button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
@media (max-width: 620px) {
  .hb-now { gap: 18px; }
  .hb-dial { margin: 0 auto; }
  .hb-item { grid-template-columns: 13px minmax(0, 1fr) auto; gap: 9px; }
  .hb-item .hb-say { grid-column: 2 / -1; grid-row: 2; }
}

/* ── the week ── */
.hb-strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
.hb-day { border: 1px solid var(--glass-line); border-radius: 10px; background: var(--glass-in);
  padding: 9px 8px 10px; display: flex; flex-direction: column; align-items: center;
  gap: 7px; min-height: 108px; }
.hb-day .wd { font-family: var(--mono); font-size: .56rem; letter-spacing: .08em;
  text-transform: uppercase; color: var(--ink-3); }
.hb-day .dn { font-size: .92rem; letter-spacing: -.02em; color: var(--ink-2); }
.hb-day[data-today] { box-shadow: inset 0 0 0 1px var(--accent); }
.hb-day[data-ahead] { opacity: .45; }
.hb-pips { display: flex; flex-direction: column; gap: 3px; align-items: center; margin-top: 2px; }
.hb-pips s { width: 16px; height: 3px; border-radius: 2px; text-decoration: none;
  background: var(--lit, var(--accent)); }
/* A missed day is an ABSENCE. Nothing is drawn in it; a gap you can see
   through is not a mark against you. */
.hb-pips s.off { background: none; box-shadow: inset 0 0 0 1px var(--glass-line); }
.hb-day .n { font-family: var(--mono); font-size: .54rem; color: var(--ink-3); margin-top: auto; }

/* ── the month, in place of the week ──
   The two answer one question at two scales. Stacked, the month was
   always the thing you scrolled past; swapped, each one gets the whole
   width and the arrows mean whatever you are looking at. */
#hbScale { flex: none; }
#hbScale button { height: 30px; padding: 0 13px; font-family: var(--sans);
  font-size: .74rem; text-transform: none; letter-spacing: normal; }
#hbScale button[aria-pressed="true"] { background: var(--glass-in-2); color: var(--ink); }
.hb-mon { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.hb-mon .hd { font-family: var(--mono); font-size: .5rem; letter-spacing: .08em;
  text-transform: uppercase; color: var(--ink-3); text-align: center; padding-bottom: 2px; }
.hb-mon .cell { border: 1px solid var(--glass-line); border-radius: 7px; min-height: 52px;
  padding: 5px 5px 6px; display: flex; flex-direction: column; align-items: center;
  gap: 4px; justify-content: flex-start; }
.hb-mon .cell.pad { border-color: transparent; }
.hb-mon .cell[data-today] { box-shadow: inset 0 0 0 1px var(--accent); }
.hb-mon .cell b { font-size: .68rem; font-weight: 400; color: var(--ink-3); }
.hb-mon .pips { display: flex; gap: 2px; }
.hb-mon .pips i { width: 4px; height: 4px; border-radius: 50%;
  background: var(--lit, var(--accent)); }
.hb-mon .pips i.off { background: none; box-shadow: inset 0 0 0 1px var(--glass-line); }
/* The split gets its own row at the foot of the cell. Not a sixth pip:
   it is a different KIND of fact from "did you keep this", and side by
   side the two would be read as one. */
.hb-mon .sp { margin-top: auto; width: 18px; height: 3px; border-radius: 2px; background: none; }

/* ── reminders ──
   A habit is a shape you are keeping; a reminder is one thing on one
   date that stops existing once it has happened. Different lifetimes,
   so a different list.

   AND THE ONE SCREEN THAT SPENDS COLOUR. It was taken off the habits
   and the check-in because a losing day is a judgement about you and a
   wash of red is what makes you stop opening the app. A reminder is not
   that — it is a task with a date, and being told the dentist was
   Tuesday is information rather than a verdict.

   So: earned by URGENCY, never on one that is merely not done yet, and
   only ever one loud row. Three states rather than a gradient, because
   a gradient has to be read and three states are recognised. Picked the
   same way the split colours were — outside the accent family by hue at
   the app's own muted level, not by shouting. */
:root {
  --u-late:  #c2607a;
  --u-soon:  #c2a154;
  --u-clear: #5fa08c;
}
:root[data-resolved="light"] {
  --u-late:  #9a3550;
  --u-soon:  #7d6931;
  --u-clear: #35705c;
}
.hr-add { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 0 0 4px; }
.hr-add input[type="text"] { flex: 1; min-width: 200px; height: 34px; padding: 0 11px;
  font: inherit; font-size: .82rem; color: var(--ink); background: var(--glass-in);
  border: 1px solid var(--glass-line); border-radius: 8px; }
.hr-add input[type="date"] { height: 34px; padding: 0 9px; font: inherit; font-size: .78rem;
  color: var(--ink-2); background: var(--glass-in); border: 1px solid var(--glass-line);
  border-radius: 8px; }
.hr-add input::placeholder { color: var(--ink-3); }
.hr-add input:focus-visible { outline: 2px solid var(--focus); outline-offset: -1px; }
/* The heading carries as much of the urgency as the colour does, which
   is what lets the colour stay quiet. */
.hr-grp { display: flex; align-items: center; gap: 11px; margin: 20px 0 2px; }
.hr-grp:first-child { margin-top: 8px; }
.hr-grp b { font-family: var(--mono); font-size: .58rem; letter-spacing: .12em;
  text-transform: uppercase; color: var(--ink-3); font-weight: 400; }
.hr-grp i { flex: 1; height: 1px; background: var(--rule); }
.hr-grp em { font-style: normal; font-family: var(--mono); font-size: .58rem; color: var(--ink-3); }

.hr-row { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 14px;
  align-items: center; padding: 11px 0 12px; border-bottom: 1px solid var(--rule); }
.hr-row:last-child { border-bottom: 0; }
.hr-row p { margin: 0; font-size: .84rem; line-height: 1.5; color: var(--ink-2);
  overflow-wrap: anywhere; }
.hr-row[data-late] p { color: var(--ink); }
/* A torn calendar page: the month on the coloured band, the day under
   it. One object carrying the date and the urgency, rather than a
   colour somewhere and a date somewhere else. */
.hr-chip { width: 40px; border-radius: 8px; overflow: hidden; text-align: center;
  border: 1px solid var(--glass-line); }
.hr-chip s { display: block; text-decoration: none; font-family: var(--mono);
  font-size: .46rem; letter-spacing: .1em; text-transform: uppercase;
  padding: 2px 0 1px; color: var(--ink-on); background: var(--u); }
.hr-chip b { display: block; font-size: .82rem; font-weight: 400; color: var(--ink-2);
  padding: 2px 0 3px; }
.hr-row[data-late] .hr-chip b { color: var(--ink); }
.hr-x { width: 28px; height: 28px; display: grid; place-items: center; padding: 0;
  border: 1px solid var(--glass-line); border-radius: 7px; background: none;
  color: var(--ink-3); cursor: pointer; }
.hr-x:hover { background: var(--glass-in-2); color: var(--ink); }
.hr-x:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.hr-x { font-size: .74rem; line-height: 1; }
.hr-empty { margin: 16px 0; font-size: .82rem; line-height: 1.6; color: var(--ink-3); }

/* ── the two radars ── */
.hb-charts { margin-top: 26px; display: grid; gap: 18px;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); align-items: stretch; }
.hb-chart { border: 1px solid var(--glass-line); border-radius: 12px;
  background: var(--glass-in); padding: 14px 16px 6px; display: flex; flex-direction: column; }
.hb-ch { display: flex; align-items: baseline; gap: 10px; }
.hb-ch .grow { flex: 1; }
.hb-chart h3 { margin: 0; font-size: .82rem; font-weight: 500; color: var(--ink); }
.hb-n { font-family: var(--mono); font-size: .6rem; color: var(--ink-3); }
.hb-sub { margin: 5px 0 0; font-size: .72rem; line-height: 1.5; color: var(--ink-3); }
.hb-fig { flex: 1; display: grid; place-items: center; padding: 6px 0 10px; }
.hb-fig svg { width: 100%; max-width: 260px; height: auto; }
.hb-fig .ax { fill: none; stroke: var(--rule); stroke-width: 1; }
.hb-fig .spoke { stroke: var(--rule); stroke-width: 1; }
.hb-fig .area { fill: color-mix(in srgb, var(--accent) 22%, transparent);
  stroke: var(--accent); stroke-width: 1.6; stroke-linejoin: round; }
.hb-fig .dot { fill: var(--accent); }
.hb-fig .lab { fill: var(--ink-3); font-family: var(--mono); font-size: 9px;
  text-anchor: middle; dominant-baseline: middle; }
.hb-fig .lab.on { fill: var(--ink-2); }

</style>
</head>

<body>
<div class="backdrop" aria-hidden="true"></div>

<div class="app">

  <nav class="rail" aria-label="Sections">
    <!-- Three days: two kept, one not. The same filled-or-hollow
         language both screens are drawn in, which is the closest thing
         this app has to a subject. -->
    <span class="rail-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           width="15" height="15">
        <circle cx="5" cy="12" r="2.4" fill="currentColor" stroke="none" />
        <circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none" />
        <circle cx="19" cy="12" r="2.4" />
      </svg>
    </span>
    <button type="button" data-view="habits" aria-current="page" aria-label="Habits">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 12.5 8 16.5 20 5M4 19h9" /><circle cx="18" cy="17" r="3" /></svg>
    </button>
    <button type="button" data-view="reminders" aria-label="Reminders">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6M10 19a2 2 0 0 0 4 0" /></svg>
    </button>
    <span class="cross" aria-hidden="true"></span>
    <!-- The other two. Below the rule, because they are not views of
         this — they are somewhere else. -->
    <a href="../trading/" aria-label="Account balance" title="Account balance">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 19v-4M11 19v-8M16 19v-11M21 19v-14M3 19h18" /></svg>
    </a>
    <a href="../arc/" aria-label="Arc — projects" title="Arc — projects">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 17.5h18M5.5 17.5a6.5 6.5 0 0 1 13 0M12 6v2.2M18.5 10.2l1.4-1.4M5.5 10.2 4.1 8.8" /></svg>
    </a>
    <span class="spacer"></span>
    <button type="button" id="themeRail" aria-label="Appearance: System">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" aria-hidden="true"></svg>
    </button>
  </nav>

  <div class="main">

    <!-- No search, no clock, no bin, no backup and nothing to add from
         here. Every one of those belongs to the ledger, and this bar
         carries what this app actually has: how it looks. A reminder is
         added on its own screen, next to the list it joins. -->
    <div class="topbar">
      <span class="grow"></span>

      <button class="btn btn-ghost" type="button" id="themeBtn" aria-label="Appearance: System">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" aria-hidden="true" id="themeIcon"></svg>
        <span id="themeLabel">System</span>
      </button>

      <div class="pal">
        <button class="btn btn-ghost" type="button" id="palBtn"
                aria-expanded="false" aria-controls="palMenu" aria-label="Backdrop: Grotto">
          <span class="dot" aria-hidden="true"></span>
          <span id="palLabel">Grotto</span>
        </button>
        <div class="pal-menu" id="palMenu" role="radiogroup" aria-label="Backdrop" hidden></div>
      </div>
    </div>

    <!-- ── habits ──
         The other life. Shares the shell and nothing else: its own key,
         its own screen, and no reference to the ledger anywhere. -->
    <main class="main" id="habitsSection" hidden>
      <div class="head">
        <h1>Habits</h1>
        <span class="grow"></span>
        <span class="span-meta" id="hbMeta"></span>
      </div>
      <div class="pane" tabindex="0">
        <div class="cal-head"><h2>Today</h2><span class="grow"></span>
          <span class="span-meta" id="hbToday"></span></div>
        <div class="hb-now" id="hbNow"></div>

        <!-- One calendar at two scales, and the control SWAPS them
             rather than stacking them. Both on screen at once answered
             the same question twice and the month was always the thing
             you scrolled past. -->
        <div class="cal-head" style="margin-top:26px">
          <button class="step" type="button" id="hbPrev"></button>
          <h2 id="hbCalLabel"></h2>
          <button class="step" type="button" id="hbNext"></button>
          <button class="step wide" type="button" id="hbNow2"></button>
          <span class="grow"></span>
          <span class="span-meta" id="hbSum"></span>
          <div class="side" id="hbScale" role="group" aria-label="Week or month">
            <button type="button" data-scale="week" aria-pressed="true">Week</button>
            <button type="button" data-scale="month" aria-pressed="false">Month</button>
          </div>
        </div>
        <div class="hb-strip" id="hbStrip" role="group" aria-label="The week, day by day"></div>
        <div id="hbMon" hidden></div>


        <div class="hb-charts">
          <section class="hb-chart" aria-labelledby="hbByH">
            <div class="hb-ch"><h3 id="hbByH">Which habit</h3>
              <span class="grow"></span><span class="hb-n" id="hbByN"></span></div>
            <p class="hb-sub">Every habit, over the days it was due. The short arm is the one
              quietly dying.</p>
            <div class="hb-fig" id="hbBy"></div>
          </section>
          <section class="hb-chart" aria-labelledby="hbDowH">
            <div class="hb-ch"><h3 id="hbDowH">Which day</h3>
              <span class="grow"></span><span class="hb-n" id="hbDowN"></span></div>
            <p class="hb-sub">The same days by weekday. Habits do not fail evenly &mdash; they
              fail on one particular day.</p>
            <div class="hb-fig" id="hbDow"></div>
          </section>
        </div>
      </div>
    </main>

    <!-- ── reminders ──
         Not habits, and no longer sharing their screen. A habit is a
         shape you are keeping and a reminder is one thing on one date
         that stops existing once it has happened; they share a part of
         life and nothing else, which is not enough to share a page. -->
    <main class="main" id="remindersSection" hidden>
      <div class="head">
        <h1>Reminders</h1>
        <span class="grow"></span>
        <span class="span-meta" id="hrMeta"></span>
      </div>
      <div class="pane" tabindex="0">
        <form class="hr-add" id="hrAdd">
          <label class="sr" for="hrText">What to remember</label>
          <input id="hrText" type="text" maxlength="120" autocomplete="off"
                 placeholder="The thing you keep meaning to do" />
          <label class="sr" for="hrDate">Due by</label>
          <input id="hrDate" type="date" />
          <button class="btn btn-primary" type="submit">Add</button>
        </form>
        <div id="hrList"></div>
      </div>
    </main>

  </div>
</div>

<p class="sr" role="status" id="say"></p>

<script>
/* ═══════════════════════════════════════════════════════════════
   DAYS

   Habits and reminders. They were two screens inside the ledger and
   they read nothing from it — no trade, no balance, no event — so what
   they shared with it was a stylesheet and a rail, which is not a
   reason to be the same application. A habit is a day you kept and a
   reminder is a day coming; the unit is the day, and the money has no
   opinion about it.

   The check-in did NOT come with them. It reads the ledger in three
   places — it locks once the day has a trade on it, and it colours
   both the pad and its log by what that day made. It is a trading
   instrument that happens to ask about you, so it stayed with the
   thing it reads.

   Same origin as the ledger, so localStorage is shared whether or not
   anything uses it. Nothing here does: habits.v1, habits.scale.v1 and
   reminders.v1, and no other key is read or written on this page.
   ═══════════════════════════════════════════════════════════════ */

/* The five helpers the two screens borrowed from the file they came
   out of. Copied, not imported — there is no build step, and five
   short functions is a smaller cost than the one that would buy. */
const esc = (s) => String(s).replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* Local, deliberately. toISOString() is UTC, so an evening in the
   Americas would be tomorrow — and a habit ticked tonight would land
   on tomorrow's square and read as a miss today. */
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`
  + `-${String(d.getDate()).padStart(2, '0')}`;

const uid = () => (crypto.randomUUID ? crypto.randomUUID()
  : Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10));

const phone = () => document.documentElement.dataset.phone === 'on';

/* One glyph, so one path rather than the ledger's whole table. */
const ICO = { tick: 'M4 12l5 5L20 6' };
const icon = (n, size) =>
  `<svg viewBox="0 0 24 24" width="${size || 13}" height="${size || 13}" fill="none"
        stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true"><path d="${ICO[n]}"/></svg>`;

/* ══════════════════════════════════════════════════════════════
   HABITS

   Wrapped, and the wrapper is load-bearing. Everything below wants a
   name this file already has — state, due, rate, chain, iso, weekOf,
   renderAll — and a collision here does not throw, it REPLACES, and the
   symptom turns up screens away. Three functions and two classes have
   been lost that way in this file's history. One name leaves: the
   render, because goto has to call it.

   Reads nothing from the ledger and writes nothing to it. Its own key.
   ══════════════════════════════════════════════════════════════ */
const renderHabits = (() => {
  const KEY = 'habits.v1';

  /* Three cadences, and they are not interchangeable:
       every: 1   due every day
       every: 2   due when it has been that long since you last did it
       perWeek    never due on a DAY — it owes the week a number
     And one kind of doing: a tick. */
  /* The order of the day, not the order they were thought of. This one
     array decides three things at once — the rows top to bottom, the
     pips in every week and month cell, and the arms of the left-hand
     radar clockwise from the top — so it is the only place the order
     is written down.

     THE LIST IS CODE, NOT DATA. It used to be saved alongside the days
     and read back in preference to this, which meant a browser that had
     ever ticked anything kept whatever the list was on the day it first
     saved: reordering it here changed nothing, and a habit added here
     never arrived at all. Nothing in this app can edit the list, so
     there was never anything to preserve. Only the days are saved now,
     and the days are the part you cannot get back. */
  const DEFAULT = [
    { id: 'wake',    name: 'Wake up',      short: 'wake',    is: '6am',        every: 1 },
    { id: 'workout', name: 'Workout',      short: 'workout',                   perWeek: 4 },
    { id: 'abs',     name: 'Abs',          short: 'abs',                       every: 2 },
    { id: 'walk',    name: 'Morning walk', short: 'walk',                      every: 1 },
    { id: 'water',   name: 'Water',        short: 'water',   is: '3 litres',   every: 1 },
    { id: 'read',    name: 'Reading',      short: 'reading', is: '30 minutes', every: 1 },
  ];
  /* Rest is in the list and is NOT a workout: it is a day you decided
     not to train, worth recording, and it must not count toward four a
     week or the number lies in the flattering direction. */
  const SPLITS = [
    { id: 'push', name: 'Push' }, { id: 'pull', name: 'Pull' },
    { id: 'legs', name: 'Legs' }, { id: 'rest', name: 'Rest' },
  ];

  /* The definitions live in the STATE, not in this file, so a habit can
     be added or reworded later without a migration. */
  let st = (() => {
    let raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { return { days: {} }; }
    if (!raw) return { days: {} };
    try {
      const v = JSON.parse(raw);
      if (!v || typeof v !== 'object') return { days: {} };
      /* The days are all that is read back, and a damaged blob loses
         only what is actually damaged: an unreadable days object gives
         an empty one, it does not throw the file away. */
      /* v.habits is ignored on purpose — see DEFAULT. Old blobs still
         carry one; it is dropped on the next write. */
      return { days: v.days && typeof v.days === 'object' ? v.days : {} };
    } catch (e) {
      try { localStorage.setItem(KEY + '.corrupt.' + Date.now(), raw); } catch (_) {}
      return { days: {} };
    }
  })();
  const list = () => DEFAULT;
  const byId = (id) => list().find(h => h.id === id);
  const day = (k) => st.days[k] || null;
  const dayOf = (k) => (st.days[k] = st.days[k] || { done: {}, split: null });
  const isDone = (k, id) => !!(day(k) && day(k).done[id]);
  function write() {
    try { localStorage.setItem(KEY, JSON.stringify({ days: st.days })); return true; }
    catch (e) {
      document.getElementById('say').textContent = 'NOT SAVED — storage unavailable.';
      return false;
    }
  }

  const shift = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const monday = (d) => shift(d, -((new Date(d).getDay() + 6) % 7));
  const seven = (m) => Array.from({ length: 7 }, (_, i) => shift(m, i));
  const today = () => iso(new Date());

  /* Every day we have a record for, plus every day since the first one,
     so a gap in the middle is a gap rather than a missing row. */
  function span() {
    const ks = Object.keys(st.days).sort();
    const end = today();
    if (!ks.length) return [end];
    const out = [];
    for (let d = new Date(ks[0] + 'T00:00:00'); iso(d) <= end; d = shift(d, 1)) out.push(iso(d));
    return out;
  }

  /* ── cadence ──
     "Every two days" means DO NOT GO MORE THAN TWO DAYS WITHOUT, so it
     counts from the last time you did it. A fixed Mon/Wed/Fri grid
     charges you twice for one slip: late on the day you missed, and
     still due on the next scheduled one. */
  function lastBefore(id, k) {
    const all = span();
    for (let i = all.indexOf(k) - 1; i >= 0; i--) if (isDone(all[i], id)) return all[i];
    return null;
  }
  function due(id, k) {
    const h = byId(id);
    if (!h || h.perWeek) return false;
    if (h.every === 1) return true;
    const last = lastBefore(id, k);
    if (!last) return true;
    return Math.round((new Date(k) - new Date(last)) / 86400000) >= h.every;
  }
  const dueOn = (k) => list().filter(h => due(h.id, k)).map(h => h.id);
  /* Two different questions, and conflating them undercounts you.
       kept  what was DUE and got done — the rate, the arc, the radars
       did   what you did, due or not. Abs a day early is still abs, and
             a screen that says "one" when you did two is wrong in the
             direction that makes people stop opening it. */
  const keptOn = (k) => dueOn(k).filter(id => isDone(k, id));
  const didOn = (k) => list().filter(h => isDone(k, h.id)).map(h => h.id);
  function rate(k) {
    const d = dueOn(k);
    return d.length ? keptOn(k).length / d.length : null;
  }

  /* ── the chain ──
     A streak that dies on one missed day gets abandoned the first time
     you are ill: the thing is gone, so why continue. Five kept days in
     the last seven survives real life, so you keep it, so the habit
     survives too. Counting DAYS rather than averaging rates, because an
     average reads "five in seven" as "71% of everything, every day",
     which nobody holds for a week. */
  const KEPT_DAY = 0.6, TOLERANCE = 5;
  const wasKept = (k) => { const r = rate(k); return r !== null && r >= KEPT_DAY; };
  function chain() {
    const all = span(), t = today();
    let n = 0;
    for (let i = all.length - 1; i >= 0; i--) {
      if (all[i] === t) continue;                  // today is not over
      const win = all.slice(Math.max(0, i - 6), i + 1);
      if (win.filter(wasKept).length < Math.min(TOLERANCE, win.length)) break;
      n++;
    }
    return n;
  }

  /* ── today ── */
  const EMPTY = { done: {}, split: null };
  /* Open only while you are answering it. Not stored: a picker left
     open across a reload is a question the screen is asking about a
     day you have stopped thinking about. */
  let picking = false;

  function renderNow() {
    /* Read, not dayOf — opening the screen must not create a record.
       It did, and an untouched machine then reported "0 days unbroken"
       rather than "nothing kept yet". */
    const k = today(), d = day(k) || EMPTY;
    const items = list().map((h) => {
      const on = !!d.done[h.id];
      let say;
      if (h.perWeek) {
        const wk = seven(monday(new Date())).map(iso).filter(x => x <= k);
        const n = wk.filter(x => isDone(x, h.id)).length;
        const left = 7 - wk.length;
        say = `<b>${n}</b> this week · ${left} ${left === 1 ? 'day' : 'days'} left`;
        /* The row names it. Everywhere else — the week, the month — it
           stays a colour, which is the whole point of having one: you
           are tracking the split, not carrying it around. */
        if (d.split) {
          const sp = SPLITS.find(x => x.id === d.split);
          say = d.split === 'rest' ? '<b>rest day</b>' : `<b>${sp.name}</b>`;
        }
        /* A TICK LIKE THE OTHER FIVE, and the colours only when you
           press it. Four permanent dots on one row of six made that row
           the loudest thing in the list for a question nobody had asked
           yet — and the answer they give is already in the row's own
           words. Press the tick, pick what it was, and it is a tick
           again. */
        if (picking) {
          say = 'which was it?';
          return `<div class="hb-item" data-h="${h.id}"${on ? ' data-on="1"' : ''}>
            <s class="hb-dot"${on ? ' data-on="1"' : ''} style="--lit:var(--h-${h.id})"></s>
            <span class="hb-nm"><b>${esc(h.name)}</b></span>
            <span class="hb-say">${say}</span>
            <span class="hb-act"><span class="hb-split" role="group"
              aria-label="What you trained">${SPLITS.map(sp =>
              `<button type="button" data-split="${sp.id}" aria-pressed="${d.split === sp.id}"
                 style="--c:var(--sp-${sp.id})" title="${sp.name}" aria-label="${sp.name}">
                 <i aria-hidden="true"></i></button>`).join('')}</span></span>
          </div>`;
        }
        return `<div class="hb-item" data-h="${h.id}"${on ? ' data-on="1"' : ''}>
          <s class="hb-dot"${on ? ' data-on="1"' : ''} style="--lit:var(--h-${h.id})"></s>
          <span class="hb-nm"><b>${esc(h.name)}</b></span>
          <span class="hb-say">${say}</span>
          <span class="hb-act"><button type="button" class="tick ${d.split ? 'on' : ''}"
            data-pick="1" aria-pressed="${!!d.split}"
            aria-label="${esc(h.name)} today">${icon('tick', 13)}</button></span>
        </div>`;
      }
      if (on) say = '<b>done</b> today';
      else if (h.every === 1) say = 'not yet today';
      else {
        /* The gap clock. It is about CADENCE rather than an amount, and
           how long since is the one thing a tick cannot tell you. */
        const last = lastBefore(h.id, k);
        if (!last) say = 'never yet';
        else {
          const n = Math.round((new Date(k) - new Date(last)) / 86400000);
          const over = n - h.every;
          say = over >= 0
            ? (over === 0 ? '<b>due today</b>'
                          : `<b>due</b> · ${over} ${over === 1 ? 'day' : 'days'} over`)
            : `${n} ${n === 1 ? 'day' : 'days'} since · due in ${h.every - n}`;
        }
      }
      return `<div class="hb-item" data-h="${h.id}"${on ? ' data-on="1"' : ''}>
        <s class="hb-dot"${on ? ' data-on="1"' : ''} style="--lit:var(--h-${h.id})"></s>
        <span class="hb-nm"><b>${esc(h.name)}</b>${h.is ? `<em>${esc(h.is)}</em>` : ''}</span>
        <span class="hb-say">${say}</span>
        <span class="hb-act"><button type="button" class="tick ${on ? 'on' : ''}"
          data-tick="${h.id}" aria-pressed="${on}"
          aria-label="${esc(h.name)} today">${icon('tick', 13)}</button></span>
      </div>`;
    }).join('');

    /* The figure in the middle is the COUNT, not a percentage — the arc
       already carries the fraction and a number out of a hundred is a
       mark out of a hundred. Do more than was due and the arc fills
       while the number keeps climbing. */
    const did = didOn(k).length, kept = keptOn(k).length, of = dueOn(k).length;
    const p = of ? Math.min(1, kept / of) : (did ? 1 : 0);
    const C = 2 * Math.PI * 44;
    document.getElementById('hbNow').innerHTML =
      `<div class="hb-dial"><svg viewBox="0 0 100 100" role="img"
         aria-label="${did} done so far today">
         <circle class="tr" cx="50" cy="50" r="44" />
         <circle class="fl" cx="50" cy="50" r="44"
           stroke-dasharray="${(C * p).toFixed(1)} ${C.toFixed(1)}" />
         <text class="mid" x="50" y="52">${did}</text>
         <text class="sub" x="50" y="64">DONE TODAY</text>
       </svg></div><div class="hb-list">${items}</div>`;
    document.getElementById('hbToday').textContent =
      of ? `${of} due today` : 'nothing due today';
  }

  /* ── the calendar, at one of two scales ──
     The week is what you act on and the month is what you go and look
     at, and they answer the same question — so the control SWAPS them
     rather than stacking them, and the arrows mean whichever one is up.
     Stacked, the month was always the thing you scrolled past. */
  const SKEY = 'habits.scale.v1';
  let scale = (() => {
    try { return localStorage.getItem(SKEY) === 'month' ? 'month' : 'week'; }
    catch (e) { return 'week'; }
  })();
  let week = monday(new Date());
  let mon = new Date(new Date().getFullYear(), new Date().getMonth(), 1);

  function renderStrip() {
    const days = seven(week), t = today();
    document.getElementById('hbStrip').innerHTML = days.map((d) => {
      const k = iso(d), ahead = k > t, rec = day(k);
      const pips = ahead ? '' : dueOn(k).map(id =>
        `<s class="${isDone(k, id) ? '' : 'off'}" style="--lit:var(--h-${id})"
            title="${esc(byId(id).name)}"></s>`).join('')
        /* The split rides on its own mark: the workout is never due on a
           given day, so it has no pip of its own to colour. */
        + (rec && rec.split ? `<s style="background:var(--sp-${rec.split})"></s>` : '');
      const n = ahead ? '' : didOn(k).length;
      return `<div class="hb-day"${k === t ? ' data-today="1"' : ''}${ahead ? ' data-ahead="1"' : ''}
          role="group" aria-label="${d.toLocaleDateString('en-GB',
            { weekday: 'long', day: 'numeric' })}${ahead ? ', still to come' : `, ${n} kept`}">
        <span class="wd">${d.toLocaleDateString('en-GB', { weekday: 'short' })}</span>
        <span class="dn">${d.getDate()}</span>
        <span class="hb-pips">${pips}</span>
        <span class="n">${n}</span>
      </div>`;
    }).join('');
  }

  function renderMonth() {
    const t = today();
    const y = mon.getFullYear(), m = mon.getMonth();
    const len = new Date(y, m + 1, 0).getDate();
    const pad = (new Date(y, m, 1).getDay() + 6) % 7;          // Monday first
    const head = ['M', 'T', 'W', 'T', 'F', 'S', 'S']
      .map(x => `<span class="hd">${x}</span>`).join('');
    const cells = Array.from({ length: pad }, () => '<div class="cell pad"></div>')
      .concat(Array.from({ length: len }, (_, i) => {
        const k = iso(new Date(y, m, i + 1)), rec = day(k), ahead = k > t;
        /* Due OR done — dueOn alone drops the workout, which is never
           due on a given day and so would never appear on any of them. */
        const pips = ahead ? '' : list().filter(h => !h.perWeek && (due(h.id, k) || isDone(k, h.id)))
          .map(h => `<i class="${isDone(k, h.id) ? '' : 'off'}" data-h="${h.id}"
            style="--lit:var(--h-${h.id})" title="${esc(h.name)}"></i>`).join('');
        const sp = rec && rec.split;
        return `<div class="cell"${k === t ? ' data-today="1"' : ''}${ahead ? ' data-ahead="1"' : ''}>
          <b>${i + 1}</b><span class="pips">${pips}</span>
          <span class="sp"${sp && !ahead ? ` style="background:var(--sp-${sp})"` : ''}></span></div>`;
      })).join('');
    document.getElementById('hbMon').innerHTML = `<div class="hb-mon">${head}${cells}</div>`;
  }

  function renderCal() {
    const t = today(), isM = scale === 'month';
    document.getElementById('hbStrip').hidden = isM;
    document.getElementById('hbMon').hidden = !isM;
    document.querySelectorAll('#hbScale button').forEach(b =>
      b.setAttribute('aria-pressed', String(b.dataset.scale === scale)));

    if (isM) renderMonth(); else renderStrip();

    const days = isM
      ? Array.from({ length: new Date(mon.getFullYear(), mon.getMonth() + 1, 0).getDate() },
          (_, i) => iso(new Date(mon.getFullYear(), mon.getMonth(), i + 1)))
      : seven(week).map(iso);
    const past = days.filter(k => k <= t);

    document.getElementById('hbCalLabel').textContent = isM
      ? mon.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' })
      : `${seven(week)[0].toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })} — `
        + `${seven(week)[6].toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}`;
    /* The arrows and the way home say which scale they move, so the
       control never has to be guessed at. */
    document.getElementById('hbPrev').textContent = '‹';
    document.getElementById('hbNext').textContent = '›';
    document.getElementById('hbPrev').setAttribute('aria-label',
      isM ? 'The month before' : 'The week before');
    document.getElementById('hbNext').setAttribute('aria-label',
      isM ? 'The month after' : 'The week after');
    document.getElementById('hbNow2').textContent = isM ? 'This month' : 'This week';

    const kept = past.reduce((a, k) => a + didOn(k).length, 0);
    const sess = past.filter(k => day(k) && day(k).split && day(k).split !== 'rest').length;
    document.getElementById('hbSum').textContent = !kept ? ''
      : isM ? `${kept} kept · ${sess} ${sess === 1 ? 'session' : 'sessions'}`
            : `${kept} kept this week`;
  }

  /* ── the two radars ──
     Same viewBox, same R, same cy, so at equal width they draw at equal
     size — a matching card around a visibly smaller picture still reads
     as mismatched. */
  const pol = (cx, cy, r, deg) => {
    const a = (deg - 90) * Math.PI / 180;
    return [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
  };
  function radar(el, nEl, labels, vals, sub) {
    const n = labels.length, R = 68, cx = 100, cy = 106;
    const peak = Math.max(...vals, 0.0001);
    const poly = (f) => labels.map((_, i) => pol(cx, cy, f(i), i * 360 / n)
      .map(v => v.toFixed(1)).join(',')).join(' ');
    let g = [0.25, 0.5, 0.75, 1].map(k =>
      `<polygon class="ax" points="${poly(() => R * k)}" />`).join('');
    g += labels.map((_, i) => {
      const [x, y] = pol(cx, cy, R, i * 360 / n);
      return `<line class="spoke" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" />`;
    }).join('');
    /* A floor, so an arm at a tenth is a visible dent rather than a
       point at the centre that reads as "no data". */
    g += `<polygon class="area" points="${poly(i => vals[i] ? Math.max(5, R * vals[i] / peak) : 0)}" />`;
    g += labels.map((_, i) => {
      if (!vals[i]) return '';
      const [x, y] = pol(cx, cy, Math.max(5, R * vals[i] / peak), i * 360 / n);
      return `<circle class="dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.4" />`;
    }).join('');
    g += labels.map((t, i) => {
      const [x, y] = pol(cx, cy, R + 18, i * 360 / n);
      return `<text class="lab${vals[i] ? ' on' : ''}" x="${x.toFixed(1)}" y="${y.toFixed(1)}">${esc(t)}</text>`;
    }).join('');
    el.innerHTML = `<svg viewBox="0 0 200 200" role="img" aria-label="${
      labels.map((t, i) => `${t}: ${Math.round(vals[i] * 100)}%`).join(', ')}">${g}</svg>`;
    nEl.textContent = sub;
  }
  function renderRadars() {
    const past = span().filter(k => k < today() && day(k));
    const byHabit = list().map((h) => {
      const d = past.filter(k => h.perWeek ? true : due(h.id, k));
      return d.length ? d.filter(k => isDone(k, h.id)).length / d.length : 0;
    });
    const worst = list()[byHabit.indexOf(Math.min(...byHabit))];
    radar(document.getElementById('hbBy'), document.getElementById('hbByN'),
      list().map(h => h.short), byHabit,
      past.length && worst ? `${worst.short} is the short arm` : '');

    const DOW = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
    const byDow = DOW.map((_, i) => {
      const rs = past.filter(k => (new Date(k + 'T00:00:00').getDay() + 6) % 7 === i)
        .map(rate).filter(x => x !== null);
      return rs.length ? rs.reduce((a, b) => a + b, 0) / rs.length : 0;
    });
    radar(document.getElementById('hbDow'), document.getElementById('hbDowN'), DOW, byDow,
      past.length ? `${DOW[byDow.indexOf(Math.min(...byDow))]} is the day that goes` : '');
  }

  function paint() {
    renderNow(); renderCal(); renderRadars();
    /* The chain leads. A total only ever climbs, so it says nothing
       about now; the chain is the figure that can be LOST and is
       therefore the only one worth defending. */
    const c = chain();
    /* Never "0 days unbroken". A zero on the one figure the screen
       leads with is the report card this whole screen is built to avoid
       — and it is the morning you most need to open it. */
    document.getElementById('hbMeta').textContent = !Object.keys(st.days).length
      ? 'nothing kept yet'
      : c ? `${c} ${c === 1 ? 'day' : 'days'} unbroken · five in seven keeps it`
          : 'a chain starts today · five in seven keeps it';
  }

  /* ── the controls ── */
  document.getElementById('hbNow').addEventListener('click', (e) => {
    const k = today(), d = dayOf(k);
    const sp = e.target.closest('[data-split]');
    if (sp) {
      /* Pressing the one already chosen clears it — a four-way control
         with no way back is a trap. Either way the picker shuts: it
         opened to ask one question and it has an answer. */
      d.split = d.split === sp.dataset.split ? null : sp.dataset.split;
      const w = list().find(h => h.perWeek);
      if (w) d.done[w.id] = !!d.split && d.split !== 'rest';
      picking = false;
      if (write()) paint();
      return;
    }
    /* The workout's tick opens the colours instead of setting anything,
       whether or not one is already down. Making a set tick CLEAR on
       press — which is what the other five do — read as consistent and
       was not: it left no way to change Push to Pull except to clear
       first and start again, and no way to see which was chosen at all.
       Reopening does both, because pressing the one already lit is the
       clear. */
    const pick = e.target.closest('[data-pick]');
    if (pick) {
      picking = true;
      paint();
      const lit = document.querySelector('.hb-split [aria-pressed="true"]')
               || document.querySelector('.hb-split button');
      if (lit) lit.focus();
      return;
    }
    const tick = e.target.closest('[data-tick]');
    if (!tick) return;
    d.done[tick.dataset.tick] = !d.done[tick.dataset.tick];
    if (write()) paint();
  });

  /* Opened by mistake is not an answer. Escape shuts it, and so does
     a click anywhere that is not the picker — otherwise the only way
     out of a question you did not mean to ask is to answer it. */
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && picking) { picking = false; paint(); }
  });
  document.addEventListener('click', (e) => {
    if (!picking) return;
    if (e.target.closest('.hb-split') || e.target.closest('[data-pick]')) return;
    picking = false; paint();
  });

  /* One pair of arrows, moving whichever scale is up. */
  const step = (n) => {
    if (scale === 'month') mon = new Date(mon.getFullYear(), mon.getMonth() + n, 1);
    else week = shift(week, n * 7);
    renderCal();
  };
  document.getElementById('hbPrev').addEventListener('click', () => step(-1));
  document.getElementById('hbNext').addEventListener('click', () => step(1));
  document.getElementById('hbNow2').addEventListener('click', () => {
    week = monday(new Date());
    mon = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
    renderCal();
  });
  document.getElementById('hbScale').addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-scale]');
    if (!b || b.dataset.scale === scale) return;
    scale = b.dataset.scale;
    /* Swapping scale lands you on the period containing the one you
       were looking at, not on today — you were looking at March for a
       reason. */
    if (scale === 'month') mon = new Date(week.getFullYear(), week.getMonth(), 1);
    else week = monday(new Date(mon.getFullYear(), mon.getMonth(), 1));
    try { localStorage.setItem(SKEY, scale); } catch (e) {}
    renderCal();
  });

  return paint;
})();

/* ══════════════════════════════════════════════════════════════
   REMINDERS

   Not habits. A habit is a shape you are keeping; a reminder is one
   thing on one date that stops existing once it has happened. Different
   lifetimes, so a different key and a different screen — sharing a part
   of life is not enough to share a page.

   THE ONE PLACE DELETE IS FINAL. Everything else in this app removes
   through a bin, because a bin protects a record you cannot rebuild. A
   reminder you have dealt with is not a record of anything.

   Wrapped, like the habits screen, and for the same reason: `rows`,
   `write`, `render` are all names this file already uses.
   ══════════════════════════════════════════════════════════════ */
const renderReminders = (() => {
  const KEY = 'reminders.v1';
  let all = (() => {
    let raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { return []; }
    if (raw) {
      try {
        const v = JSON.parse(raw);
        if (Array.isArray(v)) return v;
      } catch (e) {
        try { localStorage.setItem(KEY + '.corrupt.' + Date.now(), raw); } catch (_) {}
      }
      return [];
    }
    /* Reminders shipped inside habits.v1 for a day before they got a
       screen of their own. Anything written in that day is carried
       across rather than stranded — a key changing shape is not the
       user's problem. */
    try {
      const h = JSON.parse(localStorage.getItem('habits.v1') || 'null');
      if (h && Array.isArray(h.reminders) && h.reminders.length) {
        localStorage.setItem(KEY, JSON.stringify(h.reminders));
        delete h.reminders;
        localStorage.setItem('habits.v1', JSON.stringify(h));
        return JSON.parse(localStorage.getItem(KEY));
      }
    } catch (e) {}
    return [];
  })();

  function write() {
    try { localStorage.setItem(KEY, JSON.stringify(all)); return true; }
    catch (e) {
      document.getElementById('say').textContent = 'NOT SAVED — storage unavailable.';
      return false;
    }
  }

  /* How many days from now, or null for one with no date. */
  const days = (r, t) => r.due
    ? Math.round((new Date(r.due + 'T00:00:00') - new Date(t + 'T00:00:00')) / 86400000)
    : null;
  /* Three states rather than a gradient: a gradient has to be read and
     three states are recognised. */
  const urg = (n) => n === null ? 'none' : n < 0 ? 'late' : n <= 2 ? 'soon' : 'clear';
  /* Overdue, this week, later, someday. The heading carries as much of
     the urgency as the colour does, which is what lets the colour stay
     quiet. */
  const GROUPS = [
    ['Overdue',   (n) => n !== null && n < 0],
    ['This week', (n) => n !== null && n >= 0 && n <= 7],
    ['Later',     (n) => n !== null && n > 7],
    ['Someday',   (n) => n === null],
  ];

  function paint() {
    const t = iso(new Date());
    /* Soonest first, and anything undated LAST: a reminder with no date
       is not urgent by definition, and sorting it in among the dated
       ones would make it look as though it were. */
    const rows = all.slice().sort((a, b) =>
      (a.due || '9999') < (b.due || '9999') ? -1 : (a.due || '9999') > (b.due || '9999') ? 1 : 0);
    const wrap = document.getElementById('hrList');
    if (!rows.length) {
      wrap.innerHTML = `<p class="hr-empty">Nothing to remember. The date is optional &mdash;
        without one it simply waits under Someday until you deal with it.</p>`;
      document.getElementById('hrMeta').textContent = '';
      return;
    }

    const one = (r) => {
      const n = days(r, t), u = urg(n);
      /* A torn calendar page: the month on the band, the day under it.
         One object carrying the date and the urgency together. */
      const d = r.due ? new Date(r.due + 'T00:00:00') : null;
      const chip = `<span class="hr-chip" style="--u:${u === 'none' ? 'var(--ink-3)' : `var(--u-${u})`}">
        <s>${d ? esc(d.toLocaleDateString('en-GB', { month: 'short' })) : '—'}</s>
        <b>${d ? d.getDate() : '—'}</b></span>`;
      return `<div class="hr-row"${n !== null && n < 0 ? ' data-late="1"' : ''} data-u="${u}">
        ${chip}<p>${esc(r.text)}</p>
        <button class="hr-x" type="button" data-rem="${esc(String(r.id))}"
          aria-label="Delete: ${esc(r.text)}">✕</button>
      </div>`;
    };

    wrap.innerHTML = GROUPS.map(([name, test]) => {
      const rs = rows.filter(r => test(days(r, t)));
      if (!rs.length) return '';                 // an empty heading is noise
      return `<div class="hr-grp"><b>${name}</b><i></i><em>${rs.length}</em></div>`
        + rs.map(one).join('');
    }).join('');

    const late = rows.filter(r => r.due && r.due < t).length;
    document.getElementById('hrMeta').textContent =
      `${rows.length} open${late ? ` · ${late} past due` : ''}`;
  }

  document.getElementById('hrAdd').addEventListener('submit', (ev) => {
    ev.preventDefault();
    const text = document.getElementById('hrText').value.trim();
    if (!text) return;
    all.push({ id: uid(), text, due: document.getElementById('hrDate').value || '' });
    if (!write()) return;
    document.getElementById('hrText').value = '';
    document.getElementById('hrDate').value = '';
    paint();
    document.getElementById('say').textContent = 'Reminder added.';
    document.getElementById('hrText').focus();
  });

  document.getElementById('hrList').addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-rem]');
    if (!b) return;
    all = all.filter(r => String(r.id) !== b.dataset.rem);
    if (write()) paint();
  });

  return paint;
})();

/* ── the router ──
   Two views, so this is the whole of it. The ledger's version carries
   redirects for three screens that no longer exist; there is no such
   history here yet. */
const SECTIONS = {
  habits:    document.getElementById('habitsSection'),
  reminders: document.getElementById('remindersSection'),
};
function goto(view) {
  if (!SECTIONS[view]) view = 'habits';
  document.querySelectorAll('.rail [data-view]').forEach(b => {
    if (b.dataset.view === view) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  });
  Object.entries(SECTIONS).forEach(([k, el]) => { el.hidden = k !== view; });
  /* Repainted on arrival rather than only at load: the day rolls over
     while the tab is open, and a "due today" left from yesterday is
     worse than no answer. */
  if (view === 'habits') renderHabits();
  if (view === 'reminders') renderReminders();
  document.documentElement.dataset.screen = view;
  document.getElementById('say').textContent = view;
}
document.querySelectorAll('.rail [data-view]').forEach(b =>
  b.addEventListener('click', () => goto(b.dataset.view)));

/* The ring and the radars are drawn to the width they are given, so a
   rotation has to redraw them rather than let the browser stretch the
   last paint. */
matchMedia('(max-width: 700px)').addEventListener('change', (ev) => {
  document.documentElement.dataset.phone = ev.matches ? 'on' : 'off';
  renderHabits(); renderReminders();
});

/* Both painted at load, not only the one on screen: the reminder count
   in the heading is read from the other view, and a screen that draws
   itself for the first time when you arrive at it flashes. */
renderHabits();
renderReminders();
goto('habits');
</script>
<script src="../shell.js" defer></script>
</body>
</html>
