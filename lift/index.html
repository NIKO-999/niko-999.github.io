<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- maximum-scale=1: iOS zooms the page when a field under 16px takes
     focus, and every field here is 16 — this covers the next one added. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Lift" />
<title>Lift</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="preload" href="../arc/fonts/Inter.woff2" as="font" type="font/woff2" crossorigin />
<script>
/* The face is chosen before anything paints: stored as auto, light or
   dark, and auto follows the phone. */
(function () {
  var m = 'auto'; try { m = localStorage.getItem('lift.mode.v1') || 'auto'; } catch (e) {}
  var dark = m === 'dark' || (m !== 'light' && !(window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches));
  document.documentElement.setAttribute('data-mode', dark ? 'dark' : 'light');
})();
</script>
<style>
@font-face { font-family: 'Inter'; src: url('../arc/fonts/Inter.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }

:root {
  --bg: #000000;
  --card: #141417;
  --card2: #1e1e22;
  --card3: #2a2a2f;
  --line: rgba(255, 255, 255, .08);
  --ink: #f5f5f7;
  --dim: #a1a1a8;
  --quiet: #8a8a92;
  --mark-off: #3a3a40;
  --good: #34c759;
  /* The accent: today on the calendar and a PR on a set. */
  --today: #a3e635;
  /* THE ONE COLOUR. Everything you press to put something on the record
     — log a set, finish a workout — is lime, and nothing else is. */
  --log: #a3e635;
  --on-log: #0b1400;
  /* the accent as WORDS: the same lime, until a white page needs it a shade deeper */
  --today-ink: #a3e635;
  /* Red is kept for one thing: something going away or going wrong. */
  --bad: #ff453a;
  --on-ink: #000000;
  --mark-on: #c9c9ce;
  --bar: #4a4a50;
  --sheet: #18181b;
  --pill: rgba(28, 28, 32, .86);
  --edge: rgba(255,255,255,.06);
  --focus: rgba(255,255,255,.25);
  --ph: #66666e;
  --ahead: #55555c;
  --dash: rgba(255,255,255,.2);
  --plot: #0e0e10;
  --shade: rgba(0,0,0,.6);
  --live-bg: #16210a;
  --live-ink: color-mix(in srgb, var(--log) 72%, #fff);
  --toast: #2c2c30;
  --card-shadow: none;
  --done-bg: rgba(52, 199, 89, .16);
  --r: 22px;
  --r-s: 14px;
  --bar-h: 64px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: dark;
}
/* THE LIGHT FACE: the same tokens, answered for a white page. Chosen by
   the phone unless You says otherwise; the attribute is set before the
   first paint by the script in the head, so nothing flashes. */
:root[data-mode="light"] {
  --bg: #f2f2f7;
  --card: #ffffff;
  --card2: #ececf0;
  --card3: #e3e3e8;
  --line: rgba(0, 0, 0, .08);
  --ink: #000000;
  --dim: #6c6c70;
  --quiet: #8a8a8e;
  --mark-off: #e5e5ea;
  --on-ink: #ffffff;
  --mark-on: #1c1c1e;
  --bar: #d1d1d6;
  --sheet: #ffffff;
  --pill: rgba(255, 255, 255, .92);
  --edge: rgba(0,0,0,.06);
  --focus: rgba(0,0,0,.25);
  --ph: #aeaeb2;
  --ahead: #c7c7cc;
  --dash: rgba(0,0,0,.2);
  --plot: #f5f5f7;
  --shade: rgba(0,0,0,.12);
  --live-bg: #eef7dc;
  --live-ink: color-mix(in srgb, var(--log) 55%, #000);
  /* the same lime on both faces; only accent WORDS go a shade deeper,
     because bright lime type on white cannot be read */
  --today: #a3e635;
  --log: #a3e635;
  --on-log: #0b1400;
  --today-ink: #65a30d;
  --bad: #d70015;
  --toast: #1c1c1e;
  --card-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05);
  --done-bg: rgba(52, 199, 89, .14);
  --good: #248a3d;
  color-scheme: light;}

/* An app puts a view away with the hidden attribute, and any author
   `display` outranks the browser's own rule for it. Said once, here,
   so the bug other screens in this repo had eight times cannot happen. */
[hidden] { display: none !important; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body {
  margin: 0; min-height: 100dvh; background: var(--bg); color: var(--ink);
  font: 400 14px/1.35 'Inter', -apple-system, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
  padding: calc(var(--safe-t) + 14px) 16px calc(var(--bar-h) + var(--safe-b) + 40px);
}
body.lf-lock { overflow: hidden; }
/* The resume bar sits over the foot of the page, so the page makes room for it. */
body.lf-has-live { padding-bottom: calc(var(--bar-h) + var(--safe-b) + 104px); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
input { font: inherit; color: inherit; }
svg { display: block; }
.lf-ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ── type ── */
.lf-h1 { font-size: 24px; font-weight: 700; letter-spacing: -.02em; margin: 6px 4px 14px; }
.lf-lab { font-size: 12px; color: var(--dim); font-weight: 500; }
.lf-cap { font-size: 10px; color: var(--dim); letter-spacing: .12em; text-transform: uppercase; font-weight: 600; }
.lf-num { font-variant-numeric: tabular-nums; }

/* ── surfaces ── */
.lf-card { background: var(--card); border-radius: var(--r); padding: 14px; position: relative; box-shadow: var(--card-shadow); }
/* A view is a column with one gap, so a card never carries a margin of
   its own — which is what put the first tile in a row 12px below its
   neighbours once, because an adjacency margin does not know it is in a row. */
#lfMain > section { display: flex; flex-direction: column; gap: 12px; }
/* HOME OPENS IN YOUR COLOUR: a glow from the top of the screen, the same
   one a friend's page wears in theirs. It is fixed behind the page, so
   the cards scroll over it and a pull down never opens a gap above it. */
#lfMain { position: relative; z-index: 1; }
.lf-glow { position: fixed; left: 0; right: 0; top: 0; height: 300px; pointer-events: none; z-index: 0; opacity: 0; transition: opacity .45s var(--ease);
  background: radial-gradient(130% 230px at 18% 0%, color-mix(in srgb, var(--log) 50%, transparent), transparent 75%), radial-gradient(90% 200px at 100% 0%, color-mix(in srgb, var(--log) 22%, transparent), transparent 70%), linear-gradient(to bottom, color-mix(in srgb, var(--log) 12%, transparent), transparent 260px); }
body.lf-v-home .lf-glow { opacity: 1; }
#lfMain > section > .lf-h1, #lfMain > section > .lf-gh { margin-bottom: 0; }
.lf-row { display: grid; grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); gap: 12px; align-items: stretch; }
.lf-tap { display: block; width: 100%; text-align: left; transition: transform .15s var(--ease); }
.lf-tap:active { transform: scale(.985); }
.lf-hd { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.lf-hd .lf-chev { color: var(--quiet); width: 16px; height: 16px; }

/* ── today ── */
.lf-today { padding: 16px; }
/* the first card lets the home glow through it, so the colour reads from the top of the screen down */
#lfHome .lf-today { background: color-mix(in srgb, var(--card) 45%, transparent); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06); }
.lf-done { position: absolute; top: 14px; right: 14px; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px; background: var(--done-bg); color: var(--good); font-size: 13px; font-weight: 600; }
.lf-done .lf-ic { width: 15px; height: 15px; stroke-width: 2.6; }
.lf-tags { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 -2px; }
.lf-tag.is-mini { display: flex; width: max-content; max-width: 100%; margin: 8px auto 0; height: 22px; padding: 0 8px; font-size: 11px; gap: 4px; }
.lf-tag.is-mini .lf-ic { width: 12px; height: 12px; margin: 0; }
.lf-stat .lf-tag.is-mini { display: flex; color: var(--good); font-size: 11px; margin-top: 8px; }
.lf-stat .lf-tag span { display: inline; color: inherit; margin: 0; font-size: inherit; white-space: nowrap; }
.lf-stat { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
.lf-tag { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border-radius: 999px; background: var(--done-bg); color: var(--good); font-size: 12.5px; font-weight: 600; }
.lf-tag .lf-ic { width: 14px; height: 14px; stroke-width: 2.2; }
.lf-title-box {
  display: inline-block; margin: 4px 0 4px; padding: 2px 0; border: 0; text-align: left;
  border-radius: 6px; font-size: 28px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1;
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-height: 40px;
}
.lf-sub { color: var(--dim); font-size: 12.5px; margin: 2px 0 12px; }
.lf-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.lf-chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 999px; background: var(--card2); color: var(--dim); font-size: 12px; font-weight: 500; }
.lf-chip .lf-ic { width: 13px; height: 13px; }
.lf-go {
  display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 46px; border-radius: 999px;
  background: var(--ink); color: var(--on-ink); font-weight: 600; font-size: 14px; transition: transform .15s var(--ease);
}
.lf-go:active { transform: scale(.98); }
.lf-go .lf-play { width: 18px; height: 18px; border-radius: 5px; background: var(--on-ink); display: grid; place-items: center; }
.lf-go .lf-play svg { width: 10px; height: 10px; fill: var(--ink); stroke: none; }
.lf-go.is-live { background: var(--log); color: var(--on-log); }
.lf-go.is-live .lf-play { background: #fff; }
.lf-go.is-live .lf-play svg { fill: var(--log); }

/* ── stat tiles ── */
.lf-stat { text-align: center; padding: 12px 8px 14px; }
.lf-stat .lf-ic { width: 16px; height: 16px; margin: 12px auto 4px; color: var(--dim); }
.lf-stat b { display: block; font-size: 19px; font-weight: 700; letter-spacing: -.01em; }
.lf-stat span { display: block; font-size: 11.5px; color: var(--dim); margin-top: 2px; }
.lf-delta { position: absolute; top: 9px; right: 11px; font-size: 10px; font-weight: 600; color: var(--good); }
.lf-delta.is-down { color: var(--dim); }

/* ── 30-day grid ── */
.lf-days { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 8px 6px; margin-top: 14px; }
.lf-day { height: 18px; border-radius: 999px; border: 1.5px solid var(--mark-off); }
.lf-day.is-on { background: var(--mark-on); border-color: var(--mark-on); }
.lf-day.is-now { border-color: var(--today); border-width: 2.5px; }
.lf-day.is-now.is-on { box-shadow: inset 0 0 0 2px var(--card); }

/* ── charts ── */
.lf-big { font-size: 17px; font-weight: 700; margin-top: 6px; }
.lf-big small { font-size: 11px; color: var(--dim); font-weight: 500; margin-left: 2px; }
.lf-area { margin: 10px -14px -14px; height: 70px; border-radius: 0 0 var(--r) var(--r); overflow: hidden; position: relative; }
.lf-area svg { width: 100%; height: 100%; }
.lf-bars { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; align-items: end; height: 70px; margin-top: 10px; }
.lf-bars > div { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 3px; min-width: 0; }
.lf-bars i { display: block; width: 100%; max-width: 22px; border-radius: 6px; background: var(--bar); min-height: 3px; }
.lf-bars em { font-style: normal; font-size: 10px; color: var(--dim); }
.lf-bars u { text-decoration: none; font-size: 10px; color: var(--quiet); }
.lf-bars .is-now i { background: var(--ink); }
/* the week's bars light in your colour one after the other, then settle */
.is-wkdone .lf-bars > div i { animation: lf-wkbar 1.4s var(--ease) backwards; }
.is-wkdone .lf-bars > div:nth-child(2) i { animation-delay: .07s; } .is-wkdone .lf-bars > div:nth-child(3) i { animation-delay: .14s; } .is-wkdone .lf-bars > div:nth-child(4) i { animation-delay: .21s; }
.is-wkdone .lf-bars > div:nth-child(5) i { animation-delay: .28s; } .is-wkdone .lf-bars > div:nth-child(6) i { animation-delay: .35s; } .is-wkdone .lf-bars > div:nth-child(7) i { animation-delay: .42s; }
@keyframes lf-wkbar { 0% { transform: scaleY(.2); transform-origin: bottom; } 30% { transform: scaleY(1.08); background: var(--log); box-shadow: 0 0 14px color-mix(in srgb, var(--log) 70%, transparent); } 70% { background: var(--log); } 100% { transform: none; } }
.is-wkdone { position: relative; overflow: hidden; }
.is-wkdone::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(105deg, transparent 30%, color-mix(in srgb, var(--log) 35%, transparent) 48%, rgba(255,255,255,.25) 50%, color-mix(in srgb, var(--log) 35%, transparent) 52%, transparent 70%); transform: translateX(-100%); animation: lf-sweep 1.3s .35s var(--ease) forwards; }
@keyframes lf-sweep { to { transform: translateX(100%); } }
.lf-wkdone { position: fixed; left: 50%; top: calc(var(--safe-t) + 12px); z-index: 62; transform: translate(-50%, -20px) scale(.92); opacity: 0; pointer-events: none;
  display: flex; align-items: center; gap: 12px; padding: 10px 18px 10px 10px; border-radius: 20px; background: var(--card); color: var(--ink); overflow: hidden;
  box-shadow: 0 14px 40px var(--shade), 0 0 0 1px color-mix(in srgb, var(--log) 40%, transparent), 0 0 30px color-mix(in srgb, var(--log) 30%, transparent); transition: opacity .3s, transform .45s cubic-bezier(.3, 1.4, .5, 1); }
.lf-wkdone.is-up { opacity: 1; transform: translate(-50%, 0) scale(1); }
.lf-wkdone::after { content: ''; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.22) 50%, transparent 65%); transform: translateX(-100%); }
.lf-wkdone.is-up::after { animation: lf-sweep 1.2s .3s var(--ease) forwards; }
.lf-wkd-ic { width: 36px; height: 36px; border-radius: 50%; background: var(--log); color: var(--on-log); display: grid; place-items: center; flex: none; }
.lf-wkd-ic .lf-ic { width: 18px; height: 18px; stroke-width: 3; }
.lf-wkdone b { display: block; font-size: 15px; font-weight: 800; letter-spacing: -.01em; }
.lf-wkd-s { font-size: 12px; color: var(--dim); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { .is-wkdone .lf-bars > div i, .is-wkdone::after, .lf-wkdone.is-up::after { animation: none; } .is-wkdone::after { display: none; } }
/* a number typed past what a set can be stops at the limit, with a nudge */
.lf-set input.is-cap { animation: lf-capn .35s; }
@keyframes lf-capn { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
.lf-pct { font-size: 11px; font-weight: 600; color: var(--good); }
/* goal hit: the screen goes dark, the ring closes, the sky lights up */
.lf-gol { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; overflow: hidden; cursor: pointer;
  background: radial-gradient(120% 80% at 50% 45%, color-mix(in srgb, var(--log) 22%, #000 78%), rgba(0,0,0,.94) 70%); animation: lf-ghin .35s var(--ease) backwards; }
.lf-gol.is-out { opacity: 0; transition: opacity .4s; }
@keyframes lf-ghin { from { opacity: 0; } }
.lf-gol-c { position: relative; text-align: center; color: #fff; z-index: 1; }
.lf-gol-ring { position: relative; width: 190px; height: 190px; margin: 0 auto 18px; }
.lf-gol-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
.lf-gol-ring::after { content: ''; position: absolute; inset: -10px; border-radius: 50%; box-shadow: 0 0 60px 6px var(--log); opacity: 0; animation: lf-ghglow 1.8s var(--land) ease-out forwards; }
@keyframes lf-ghglow { 30% { opacity: .9; transform: scale(1.12); } to { opacity: .35; transform: scale(1); } }
.lf-gol-tr { fill: none; stroke: rgba(255,255,255,.1); stroke-width: 11; }
.lf-gol-seg { fill: none; stroke: var(--log); stroke-width: 11; stroke-linecap: round; filter: drop-shadow(0 0 6px var(--log)); animation: lf-ghseg .32s cubic-bezier(.3, 1.3, .5, 1) backwards; }
@keyframes lf-ghseg { from { stroke-dasharray: 0 999; opacity: 0; } }
.lf-gol-ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 72px; font-weight: 900; letter-spacing: -.04em; animation: lf-ghnum .6s cubic-bezier(.3, 1.6, .5, 1) backwards; }
@keyframes lf-ghnum { from { transform: scale(.2); opacity: 0; } }
.lf-gol-k { font-size: 11px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: var(--log); animation: lf-ghup .5s var(--land) var(--ease) backwards; }
.lf-gol h2 { margin: 6px 0 6px; font-size: 40px; font-weight: 900; letter-spacing: -.03em; background: linear-gradient(100deg, #fff 30%, color-mix(in srgb, var(--log) 60%, #fff) 50%, #fff 70%); background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: lf-ghup .5s calc(var(--land) + 80ms) var(--ease) backwards, lf-ghshine 2.6s calc(var(--land) + 500ms) linear infinite; }
@keyframes lf-ghshine { from { background-position: 125% 0; } to { background-position: -125% 0; } }
.lf-gol-s { margin: 0; font-size: 15px; color: rgba(255,255,255,.75); animation: lf-ghup .5s calc(var(--land) + 160ms) var(--ease) backwards; }
.lf-gol-tap { display: inline-block; margin-top: 34px; font-size: 12px; color: rgba(255,255,255,.4); animation: lf-ghup .5s calc(var(--land) + 1200ms) var(--ease) backwards; }
@keyframes lf-ghup { from { opacity: 0; transform: translateY(14px); } }
.lf-gol-fx { position: absolute; inset: 0; pointer-events: none; }
.lf-fw { position: absolute; width: 0; height: 0; }
.lf-fw s { position: absolute; left: -1.5px; top: 0; width: 3px; height: 26px; border-radius: 3px; background: linear-gradient(transparent, #fff); opacity: 0;
  animation: lf-fwrise .55s calc(var(--t) - 550ms) cubic-bezier(.2, .6, .4, 1) backwards; }
@keyframes lf-fwrise { from { opacity: 1; transform: translateY(var(--rise)); } 95% { opacity: 1; } to { opacity: 0; transform: translateY(0); } }
.lf-fw i { position: absolute; left: -1px; top: -1px; width: 2px; height: 2px; animation: lf-fwfall 1.3s var(--t) cubic-bezier(.5, 0, .9, .6) forwards; }
@keyframes lf-fwfall { to { transform: translateY(38px); } }
.lf-fw i::before { content: ''; position: absolute; left: 0; top: -1px; width: 14px; height: 3px; border-radius: 3px; background: var(--log); box-shadow: 0 0 8px var(--log); transform-origin: 0 50%; opacity: 0;
  transform: rotate(var(--a)); animation: lf-fwspk 1.3s var(--t) cubic-bezier(.1, .7, .3, 1) forwards; }
.lf-fw i.is-w::before { background: #fff; box-shadow: 0 0 8px #fff; } .lf-fw i.is-lt::before { background: color-mix(in srgb, var(--log) 50%, #fff); }
@keyframes lf-fwspk { 0% { opacity: 1; transform: rotate(var(--a)) translateX(0) scaleX(.3); } 40% { opacity: 1; transform: rotate(var(--a)) translateX(calc(var(--d) * .8)) scaleX(1); } to { opacity: 0; transform: rotate(var(--a)) translateX(var(--d)) scaleX(.2); } }
@media (prefers-reduced-motion: reduce) { .lf-gol *, .lf-gol *::before, .lf-gol *::after, .lf-gol { animation: none !important; } .lf-gol-fx { display: none; } }

/* ── weekly sets ── */
.lf-vol { display: flex; flex-direction: column; gap: 9px; margin-top: 12px; }
.lf-vr { display: grid; grid-template-columns: 86px minmax(0, 1fr) 64px; align-items: center; gap: 10px; font-size: 12.5px; }
.lf-vr span { color: var(--dim); }
.lf-vr:nth-child(-n+3) span { color: var(--ink); font-weight: 600; }
.lf-vsep { height: 1px; background: var(--line); margin: 2px 0; }
.lf-vr i { display: block; height: 6px; border-radius: 3px; background: var(--card3); overflow: hidden; }
.lf-vr i b { display: block; height: 100%; background: var(--mark-on); border-radius: 3px; }
.lf-vr.is-met i b { background: var(--good); }
.lf-vr em { font-style: normal; text-align: right; color: var(--dim); }
.lf-tg { font-size: 12px; color: var(--dim); margin: -6px 0 2px; }
.lf-aim { font-size: 12px; color: var(--ink); margin: 2px 0 6px; }
.lf-aim.is-up { color: var(--good); }
.lf-ss-rest.is-ready { color: var(--good); }

/* ── the day: steps, food, water ── */
.lf-dl-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; align-items: stretch; }
.lf-dl-t { background: var(--card2); border-radius: 16px; padding: 10px 10px 12px; display: flex; flex-direction: column; gap: 2px; min-height: 92px; }
.lf-dl-n { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--dim); font-weight: 500; }
.lf-dl-n .lf-ic { width: 14px; height: 14px; }
.lf-dl-t b { font-size: 19px; font-weight: 700; margin-top: 4px; }
.lf-dl-u { font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lf-dl-bar { display: block; height: 4px; border-radius: 2px; background: var(--card3); margin-top: auto; overflow: hidden; }
.lf-dl-t > span:nth-last-child(2) { margin-bottom: 8px; }
.lf-dl-bar i { display: block; height: 100%; background: var(--mark-on); border-radius: 2px; }
.lf-dl-t.is-met .lf-dl-bar i { background: var(--good); }
.lf-dl-q { justify-content: center; margin-bottom: 10px; }
.lf-dl-f { display: flex; gap: 8px; }
.lf-dl-f .lf-field { flex: 1; min-width: 0; }
.lf-dl-f .lf-btn { flex: none; min-height: 44px; }
.lf-gl { display: grid; grid-template-columns: 80px minmax(0, 1fr) 40px; align-items: center; gap: 10px; margin-top: 10px; font-size: 14px; }
.lf-gl em { font-style: normal; color: var(--dim); font-size: 12px; }

/* ── body weight ── */
.lf-bw { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.lf-bw .lf-big { font-size: 19px; }
.lf-spark { width: 120px; height: 40px; }

/* ── empty ── */
.lf-empty { text-align: center; color: var(--dim); padding: 24px 16px; font-size: 13px; }
.lf-empty b { display: block; color: var(--ink); font-size: 14px; margin-bottom: 4px; }

/* ── lists ── */
.lf-list { display: flex; flex-direction: column; }
.lf-li { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 10px 0; border-top: 1px solid var(--line); width: 100%; text-align: left; }
.lf-li:first-child { border-top: 0; }
.lf-li .lf-li-t { flex: 1; min-width: 0; }
.lf-li .lf-li-t b { display: block; font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lf-li .lf-li-t span { display: block; font-size: 12px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lf-li .lf-li-r { font-size: 12px; color: var(--dim); text-align: right; flex: none; }
.lf-gh { margin: 10px 4px -4px; }
#lfLibList { display: flex; flex-direction: column; gap: 10px; }
.lf-sec { margin-top: 12px; }
.lf-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px;
  border-radius: 999px; background: var(--card2); font-weight: 600; font-size: 14px;
}
.lf-btn.is-full { width: 100%; }
.lf-btn.is-ink { background: var(--ink); color: var(--on-ink); }
.lf-btn.is-log { background: var(--log); color: var(--on-log); }
.lf-btn.is-bad { color: var(--bad); }
.lf-btn:active { opacity: .8; }

.lf-field {
  width: 100%; height: 44px; border-radius: var(--r-s); background: var(--card2); border: 1px solid transparent;
  padding: 0 14px; font-size: 16px; outline: none;
}
.lf-field:focus { border-color: var(--focus); }
/* iPHONE'S DATE AND TIME FIELDS keep their own size and ignore the box
   they are given, so the day ran off the side of the editor and the start
   time ran into the minutes beside it. Without the native look they take
   the width they are told, and the value sits at the left like any field. */
.lf-field[type="date"], .lf-field[type="time"] { -webkit-appearance: none; appearance: none; box-sizing: border-box; display: block; width: 100%; min-width: 0; max-width: 100%; text-align: left; }
.lf-field[type="date"]::-webkit-date-and-time-value, .lf-field[type="time"]::-webkit-date-and-time-value { text-align: left; margin: 0; }
.lf-row > label { min-width: 0; }
.lf-fh { margin: 0; font: inherit; }
.lf-fh button { width: 100%; display: flex; align-items: center; gap: 8px; padding: 0; text-align: left; min-height: 30px; }
.lf-fh button .lf-lab:first-child { flex: 1; }
.lf-fh .lf-chev { transform: rotate(90deg); transition: transform .22s var(--ease); color: var(--dim); }
.lf-fh button[aria-expanded="true"] .lf-chev { transform: rotate(270deg); }
.lf-fold:not(.is-open) { padding-bottom: 14px; }
.lf-flab { display: block; font-size: 12px; color: var(--dim); margin: 14px 2px 6px; }
.lf-pills { display: flex; flex-wrap: wrap; gap: 8px; }
.lf-pill { min-height: 36px; padding: 0 14px; border-radius: 999px; background: var(--card2); color: var(--dim); font-size: 13px; font-weight: 500; position: relative; }
.lf-pill::before { content: ''; position: absolute; inset: -4px 0; }
.lf-pill[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }

.lf-seg { display: grid; grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); background: var(--card); border-radius: 999px; padding: 3px; }
.lf-seg button { height: 38px; border-radius: 999px; color: var(--dim); font-weight: 600; font-size: 13px; position: relative; }
.lf-seg button::before { content: ''; position: absolute; inset: -3px 0; }
.lf-seg button[aria-pressed="true"] { background: var(--card3); color: var(--ink); }
/* the programs are five, so the switch is two rows: a rounded block, not a pill */
#lfProg { border-radius: 22px; row-gap: 3px; }

/* ── calendar ── */
.lf-calnav { display: flex; align-items: center; justify-content: space-between; margin: 14px 0 10px; }
.lf-calnav b { font-size: 15px; font-weight: 700; }
.lf-round { width: 44px; height: 44px; border-radius: 999px; display: grid; place-items: center; color: var(--dim); }
.lf-round:disabled { opacity: .3; cursor: default; }
.lf-dows { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; font-size: 11px; color: var(--quiet); font-weight: 600; margin-bottom: 6px; }
.lf-month { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.lf-cell { aspect-ratio: 1 / 1.08; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 13px; font-weight: 500; color: var(--dim); min-width: 0; position: relative; }
.lf-cell.is-pad { visibility: hidden; }
.lf-cell.is-on { background: var(--card2); color: var(--ink); font-weight: 700; }
.lf-cell.is-now { box-shadow: inset 0 0 0 2px var(--today); color: var(--ink); }
/* a day you trained is lit in the accent; today keeps its outline instead, so the two never read as one */
.lf-cell.is-on:not(.is-now) { background: var(--log); color: var(--on-log); }
.lf-cell.is-on:not(.is-now) .lf-dots i { background: var(--on-log); }
.lf-cell.is-ahead { color: var(--ahead); }
/* ARRIVING AT A MONTH the days you trained light up in turn, so it reads
   as the streak being built; once per month shown, never on a repaint */
.lf-month.is-play .lf-cell.is-on:not(.is-now) { animation: lf-light .55s cubic-bezier(.3, 1.4, .5, 1) backwards; animation-delay: calc(var(--i) * 55ms + 80ms); }
.lf-month.is-play .lf-cell.is-rest { animation: lf-fadein .4s ease-out backwards; animation-delay: calc(var(--i) * 55ms + 80ms); }
.lf-wkl.is-play .lf-wk { animation: lf-rise .4s var(--ease) backwards; animation-delay: calc(var(--i) * 45ms); }
@keyframes lf-light { 0% { background: var(--card2); color: var(--dim); transform: scale(.82); } 55% { transform: scale(1.07); box-shadow: 0 0 16px 2px color-mix(in srgb, var(--log) 55%, transparent); } 100% { box-shadow: 0 0 0 0 transparent; } }
@keyframes lf-fadein { from { opacity: 0; transform: scale(.85); } }
@keyframes lf-rise { from { opacity: 0; transform: translateY(8px); } }
@media (prefers-reduced-motion: reduce) { .lf-month.is-play .lf-cell, .lf-wkl.is-play .lf-wk { animation: none !important; } }
.lf-dots { display: flex; gap: 3px; height: 5px; }
.lf-dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--ink); }
.lf-wk { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; align-items: center; gap: 12px; min-height: 60px; padding: 8px 0; border-top: 1px solid var(--line); width: 100%; text-align: left; }
.lf-wk:first-child { border-top: 0; }
.lf-wk .lf-wd { text-align: center; }
.lf-wk .lf-wd em { display: block; font-style: normal; font-size: 11px; color: var(--quiet); font-weight: 600; }
.lf-wk .lf-wd b { display: block; font-size: 16px; font-weight: 700; }
.lf-wk.is-now .lf-wd b { color: var(--today-ink); }
.lf-wk .lf-wn { min-width: 0; }
.lf-wk .lf-wn b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lf-wk .lf-wn span { font-size: 12px; color: var(--dim); }
.lf-wk.is-rest .lf-wn b { color: var(--quiet); font-weight: 500; }

/* ── the bar ── */
.lf-bar {
  position: fixed; left: 50%; bottom: calc(var(--safe-b) + 14px); transform: translateX(-50%); z-index: 20;
  display: flex; gap: 2px; padding: 5px; border-radius: 999px; background: var(--pill);
  -webkit-backdrop-filter: blur(20px) saturate(1.4); backdrop-filter: blur(20px) saturate(1.4);
  box-shadow: 0 10px 30px var(--shade), inset 0 0 0 1px var(--edge);
}
.lf-bar button { width: 58px; height: 46px; border-radius: 999px; display: grid; place-items: center; color: var(--quiet); }
.lf-bar button .lf-ic { width: 20px; height: 20px; }
.lf-bar button[aria-current="page"] { background: var(--card3); color: var(--ink); }

.lf-live {
  position: fixed; left: 16px; right: 16px; bottom: calc(var(--safe-b) + 76px); z-index: 19; max-width: 520px; margin: 0 auto;
  display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 0 14px; border-radius: 16px; font-size: 13px;
  background: var(--live-bg); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--log) 35%, transparent), 0 8px 24px var(--shade);
  font-weight: 600; text-align: left;
}
.lf-live span:not(.lf-rec) { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lf-live em { font-style: normal; color: var(--live-ink); font-variant-numeric: tabular-nums; }
.lf-rec { width: 9px; height: 9px; border-radius: 50%; background: var(--log); flex: none; animation: lf-pulse 1.6s ease-in-out infinite; }
@keyframes lf-pulse { 50% { opacity: .35; } }

/* ── sheets: built and removed, never hidden ── */
.lf-scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 40; opacity: 0; transition: opacity .28s var(--ease); }
/* THE SHEET IS FROSTED GLASS: what is behind it shows through the card
   as colour and shape, never as words you could read. The dim above it
   stays plain — no blur on the page itself. */
@supports ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
  .lf-sheet { background: color-mix(in srgb, var(--sheet) 40%, transparent) !important; -webkit-backdrop-filter: blur(24px) saturate(1.8); backdrop-filter: blur(24px) saturate(1.8); box-shadow: 0 -10px 40px var(--shade), inset 0 1px 0 rgba(255,255,255,.12) !important; }
  /* and everything drawn on it is glass too, or a full sheet of solid cards hides the glass it sits on */
  /* a step lighter than the sheet under them, so a card on a sheet still reads as a card */
  .lf-sheet .lf-card, .lf-sheet .lf-sum div, .lf-sheet .lf-vs-c, .lf-sheet .lf-ex { background: color-mix(in srgb, var(--card3) 48%, transparent) !important; box-shadow: inset 0 1px 0 rgba(255,255,255,.06); }
  /* and what sits inside those cards goes the other way, down toward the page, so a field still reads as a field */
  .lf-sheet .lf-ex .lf-set:not(.is-done) input, .lf-sheet .lf-ex-ft button { background: color-mix(in srgb, var(--bg) 40%, transparent); }
  /* the badge viewer: the page faintly behind it, never readable. The blur
     is its OWN layer under the viewer, never on the viewer: a backdrop pass
     is redone whenever the filtered element's own contents repaint, and the
     award repaints every frame it turns — that was the stutter on iPhone */
  .lf-cv { background: transparent; }
  .lf-cvb { background: color-mix(in srgb, var(--bg) 72%, transparent); -webkit-backdrop-filter: blur(30px) saturate(1.4); backdrop-filter: blur(30px) saturate(1.4); }
}
.lf-scrim.is-up { opacity: 1; }
.lf-sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-width: 560px; margin: 0 auto;
  max-height: calc(100dvh - var(--safe-t) - 40px); display: flex; flex-direction: column;
  background: var(--sheet); border-radius: 28px 28px 0 0; box-shadow: 0 -10px 40px var(--shade), inset 0 1px 0 var(--edge);
  transform: translateY(100%); transition: transform .34s var(--ease); will-change: transform;
}
.lf-sheet.is-up { transform: translateY(0); transition: transform .5s cubic-bezier(.26, 1.16, .44, 1); }
/* the spring carries a sheet a few pixels past its rest, so it runs on
   below the screen's edge and the overshoot never shows a gap */
.lf-sheet::after { content: ''; position: absolute; left: 0; right: 0; top: 100%; height: 60px; background: inherit; pointer-events: none; }
/* A TAB ARRIVES from the side it sits on in the bar, a short slide and a fade */
#lfMain > section.lf-in-r { animation: lf-in-r .32s var(--ease); }
#lfMain > section.lf-in-l { animation: lf-in-l .32s var(--ease); }
@keyframes lf-in-r { from { opacity: 0; transform: translateX(22px); } }
@keyframes lf-in-l { from { opacity: 0; transform: translateX(-22px); } }
@media (prefers-reduced-motion: reduce) { #lfMain > section.lf-in-r, #lfMain > section.lf-in-l { animation: none; } .lf-sheet.is-up { transition-timing-function: var(--ease); } }
.lf-sheet.is-drag { transition: none; }
.lf-sheet.is-full { height: calc(100dvh - var(--safe-t) - 10px); max-height: none; }
.lf-grab { height: 26px; flex: none; display: grid; place-items: center; touch-action: none; cursor: grab; }
.lf-grab::after { content: ''; width: 38px; height: 5px; border-radius: 3px; background: var(--bar); }
.lf-sh-hd { display: flex; align-items: center; gap: 10px; padding: 0 20px 10px; touch-action: none; }
.lf-sh-hd h2 { margin: 0; font-size: 17px; font-weight: 700; flex: 1; min-width: 0; letter-spacing: -.01em; }
.lf-sh-bd { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 4px 20px 20px; overscroll-behavior: contain; }
.lf-sh-ft { flex: none; padding: 12px 20px calc(var(--safe-b) + 14px); border-top: 1px solid var(--line); display: flex; gap: 10px; }
.lf-sh-ft > * { flex: 1; }
/* A SHEET WITH NO TITLE has nothing for the head row to say: the close
   button floats in the corner and the content starts under the grab. */
.lf-sheet.no-title .lf-sh-hd { position: absolute; top: 12px; right: 8px; padding: 0; z-index: 2; }
.lf-sheet.no-title .lf-sh-hd h2 { display: none; }
.lf-x { width: 44px; height: 44px; border-radius: 999px; display: grid; place-items: center; color: var(--dim); flex: none; }

/* ── the session ── */
.lf-ss-hd { display: flex; align-items: center; gap: 10px; }
.lf-ss-name { flex: 1; min-width: 0; background: none; border: 0; outline: none; font-size: 18px; font-weight: 700; letter-spacing: -.01em; padding: 0; height: 44px; }
.lf-ss-time { font-variant-numeric: tabular-nums; color: var(--dim); font-size: 13px; font-weight: 600; }
.lf-session .lf-sh-ft { flex-wrap: wrap; }
.lf-session .lf-sh-ft > .lf-ss-rest { flex: 0 0 100%; }
.lf-ss-rest { display: flex; align-items: center; gap: 16px; position: relative; padding: 2px 0 12px; font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; }
.lf-rs-ring { position: relative; width: 84px; height: 84px; flex: none; }
.lf-rs-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
.lf-rs-ring circle { fill: none; stroke-width: 8; }
.lf-rs-bg { stroke: var(--card3); }
.lf-rs-fg { stroke: var(--ink); stroke-linecap: round; stroke-dasharray: 276.5; stroke-dashoffset: 276.5; transition: stroke-dashoffset 1s linear, stroke .3s; }
.lf-rs-c { position: absolute; inset: 0; display: grid; place-items: center; font-size: 23px; font-weight: 800; letter-spacing: -.02em; color: var(--ink); }
.lf-rs-side { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.lf-rs-l { font-size: 17px; font-weight: 700; color: var(--ink); }
.lf-ss-rest.is-idle .lf-rs-c, .lf-ss-rest.is-idle .lf-rs-l { color: var(--quiet); }
.lf-ss-rest.is-ready .lf-rs-c, .lf-ss-rest.is-ready .lf-rs-l { color: var(--good); }
.lf-ss-rest.is-ready .lf-rs-fg { stroke: var(--log); filter: drop-shadow(0 0 6px color-mix(in srgb, var(--log) 60%, transparent)); }
@media (prefers-reduced-motion: reduce) { .lf-rs-fg { transition: none; } }
.lf-ex { background: var(--card); border-radius: var(--r); padding: 14px 14px 10px; margin-top: 12px; }
.lf-ex-hd { display: flex; align-items: center; gap: 8px; }
.lf-ex-hd button.lf-ex-n { flex: 1; min-width: 0; text-align: left; font-weight: 600; font-size: 15px; min-height: 40px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lf-set { display: grid; grid-template-columns: 26px minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr) 44px; align-items: center; gap: 8px; min-height: 44px; }
.lf-burst { position: fixed; width: 0; height: 0; z-index: 90; pointer-events: none; }
.lf-burst i { position: absolute; left: -4px; top: -4px; width: 8px; height: 8px; border-radius: 50%; background: var(--log); animation: lf-burst .75s cubic-bezier(.2,.7,.3,1) forwards; }
.lf-burst i:nth-child(3n) { width: 5px; height: 5px; left: -2.5px; top: -2.5px; background: var(--ink); }
.lf-burst s { position: absolute; left: 0; top: 0; width: 0; height: 0; border-radius: 50%; pointer-events: none; }
.lf-wave { box-shadow: 0 0 0 2px var(--log); animation: lf-wave .7s cubic-bezier(.15, .7, .3, 1) forwards; }
.lf-wave.is-2 { animation-delay: .14s; opacity: 0; }
.lf-flash { background: radial-gradient(closest-side, color-mix(in srgb, var(--log) 55%, transparent), transparent); animation: lf-flash .6s ease-out forwards; }
@keyframes lf-wave { 0% { width: 0; height: 0; margin: 0; opacity: 1; box-shadow: 0 0 0 4px var(--log); } 100% { width: 180px; height: 180px; margin: -90px 0 0 -90px; opacity: 0; box-shadow: 0 0 0 1px var(--log); } }
@keyframes lf-flash { 0% { width: 20px; height: 20px; margin: -10px 0 0 -10px; opacity: 1; } 100% { width: 240px; height: 240px; margin: -120px 0 0 -120px; opacity: 0; } }
.lf-burst u { position: absolute; left: -3px; top: -5px; width: 6px; height: 10px; border-radius: 2px; background: var(--log); opacity: 0; animation: lf-conf 1.45s cubic-bezier(.25, .6, .4, 1) forwards; }
.lf-burst u.is-ink { background: var(--ink); }
.lf-burst u.is-lt { background: color-mix(in srgb, var(--log) 55%, #fff); }
.lf-burst u.is-sq { width: 7px; height: 7px; border-radius: 50%; }
@keyframes lf-conf { 0% { opacity: 1; transform: translate(0, 0) rotate(0); } 30% { opacity: 1; transform: translate(calc(var(--dx) * .6), var(--up)) rotate(calc(var(--rot) * .3)); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx), var(--fall)) rotate(var(--rot)); } }
.lf-burst b { position: absolute; left: 0; top: -34px; transform: translateX(-50%); font-size: 15px; font-weight: 800; letter-spacing: .04em; color: var(--on-log); background: var(--log); padding: 3px 10px; border-radius: 999px; animation: lf-prpop .9s cubic-bezier(.2,.9,.3,1.3) forwards; white-space: nowrap; }
@keyframes lf-burst { from { transform: translate(0, 0) scale(1); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) scale(.3); opacity: 0; } }
@keyframes lf-prpop { 0% { transform: translateX(-50%) scale(.4); opacity: 0; } 25% { transform: translateX(-50%) scale(1.15); opacity: 1; } 70% { transform: translateX(-50%) translateY(-6px) scale(1); opacity: 1; } 100% { transform: translateX(-50%) translateY(-14px) scale(1); opacity: 0; } }
.lf-fin { text-align: center; padding-top: 8px; }
.lf-fin-ok { width: 84px; height: 84px; margin: 4px auto 14px; border-radius: 50%; background: var(--log); color: var(--on-log); display: grid; place-items: center; box-shadow: 0 0 0 10px color-mix(in srgb, var(--log) 18%, transparent), 0 0 46px color-mix(in srgb, var(--log) 45%, transparent); animation: lf-finok .6s cubic-bezier(.2,.9,.3,1.25) both; }
.lf-fin-ok .lf-ic { width: 40px; height: 40px; stroke-width: 2.8; }
@keyframes lf-finok { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.lf-fin .lf-cap { margin: 0 0 4px; }
.lf-fin h3 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
.lf-fin-d { color: var(--dim); font-size: 14px; margin: 4px 0 18px; }
.lf-fin-vol { font-size: 54px; font-weight: 800; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.lf-fin-vol small { font-size: 18px; font-weight: 600; color: var(--dim); margin-left: 4px; letter-spacing: 0; }
.lf-fin-u { color: var(--dim); font-size: 13px; margin: 6px 0 18px; }
.lf-fin-u.is-up { color: var(--good); font-weight: 600; }
.lf-fin .lf-sum { text-align: left; }
.lf-fin-l { text-align: left; margin-top: 18px; }
/* opened again from Home it is the same screen, a size down, so it sits in a sheet rather than taking the phone */
.lf-fin.is-rev { padding-top: 0; text-align: left; }
.lf-fin.is-rev .lf-fin-ok { display: none; }
.lf-fin.is-rev .lf-fin-d { margin: 0 0 12px; }
.lf-fin.is-rev .lf-fin-vol { font-size: 40px; }
.lf-fin.is-rev .lf-fin-vol small { font-size: 15px; }
.lf-fin.is-rev .lf-fin-u { margin: 4px 0 14px; }
.lf-fin.is-rev .lf-fin-l { margin-top: 14px; }
.lf-fin-l .lf-cap { margin: 0 2px 8px; }

/* ═══════════ THE SESSION ═══════════ */

/* DOUBLE PROGRESSION, worked out rather than remembered. Every set of
   last time at the TOP of the range → the weight goes up a step and the
   reps start again at the bottom. Otherwise the same weight, one more
   rep, capped at the top. With no range it is simply last time again.
   The step is 2.5 kg, or 5 lb, because that is the plate you have. */

/* Grouped by push, pull, legs and core, then by muscle inside each, in
   the order MUSCLES lists them, so the same exercise is always in the
   same place. */
function lfGrouped(list) {
  var out = [];
  PPL.forEach(function (g) {
    var es = list.filter(function (e) { return lfPpl(e) === g[0]; });
    es.sort(function (a, b) { return MUSCLES.indexOf(a.m) - MUSCLES.indexOf(b.m) || a.n.localeCompare(b.n); });
    if (es.length) out.push({ g: g[0], n: g[1], es: es });
  });
  return out;
}

function lfPicker(onPick, title) {
  var b = el('<div><input class="lf-field" type="search" placeholder="Search exercises" aria-label="Search exercises" autocomplete="off" /><div class="lf-pplw"></div><div class="lf-list lf-sec"></div></div>');
  var mk = el('<button type="button" class="lf-btn is-full">' + IC.plus + 'Create exercise</button>');
  var s = lfSheet({ title: title || 'Add exercise', body: b, foot: [mk] });
  var q = $('input', b), list = $('.lf-list', b), grp = 'all';
  $('.lf-pplw', b).appendChild(lfPplSeg(grp, function (g) { grp = g; paint(); }));
  function paint() {
    list.textContent = '';
    var t = q.value.trim().toLowerCase();
    var all = allEx().filter(function (e) { return (!t || e.n.toLowerCase().indexOf(t) >= 0) && (grp === 'all' || lfPpl(e) === grp); });
    if (!all.length) { list.appendChild(el('<div class="lf-empty"><b>' + (allEx().length ? 'No match' : 'No exercises yet') + '</b>' + (allEx().length ? 'Try another word, or create it.' : 'Create one and it is here every time.') + '</div>')); return; }
    lfGrouped(all).forEach(function (G) {
      var h = el('<div class="lf-cap lf-pick-h"></div>'); h.textContent = G.n; list.appendChild(h);
      G.es.forEach(function (e) {
        var li = el('<button type="button" class="lf-li"><div class="lf-li-t"><b></b><span></span></div>' + IC.plus + '</button>');
        $('b', li).textContent = e.n; $('span', li).textContent = e.m + ' · ' + lfRecTxt(e.id);
        li.addEventListener('click', function () { s.close(true); onPick(e.id); });
        list.appendChild(li);
      });
    });
  }
  q.addEventListener('input', paint); paint();
  mk.addEventListener('click', function () { lfExForm(null, function (id) { s.close(true); onPick(id); }, q.value.trim()); });
}

function lfExForm(ex, onDone, seed) {
  var m = ex ? ex.m : 'Other', t = ex ? ex.t : 'w';
  var b = el('<div><label class="lf-flab" for="lfExN">Name</label><input class="lf-field" id="lfExN" maxlength="60" autocomplete="off" /><span class="lf-flab">Muscle group</span><div class="lf-pills" id="lfExM"></div><span class="lf-flab">Logged as</span><div class="lf-pills" id="lfExT"></div><span class="lf-flab">Type</span><div class="lf-pills" id="lfExC"></div></div>');
  $('#lfExN', b).value = ex ? ex.n : (seed || '');
  var cp = ex ? (ex.c ? 1 : 0) : (COMPOUND_RE.test(seed || '') ? 1 : 0), cTouched = !!ex;
  function pills(box, opts, cur, set) {
    box.textContent = '';
    opts.forEach(function (o) {
      var p = el('<button type="button" class="lf-pill"></button>'); p.textContent = o[1]; p.setAttribute('aria-pressed', o[0] === cur ? 'true' : 'false');
      p.addEventListener('click', function () { set(o[0]); pills(box, opts, o[0], set); });
      box.appendChild(p);
    });
  }
  pills($('#lfExM', b), MUSCLES.map(function (x) { return [x, x]; }), m, function (v) { m = v; });
  pills($('#lfExT', b), [['w', 'Weight × reps'], ['bw', 'Bodyweight']], t, function (v) { t = v; });
  var cOpts = [[1, 'Compound · 3 × 6–10'], [0, 'Isolation · higher reps']];
  pills($('#lfExC', b), cOpts, cp, function (v) { cp = v; cTouched = true; });
  /* The type follows the name until you choose it yourself. */
  $('#lfExN', b).addEventListener('input', function () { if (cTouched) return; cp = COMPOUND_RE.test(this.value) ? 1 : 0; pills($('#lfExC', b), cOpts, cp, function (v) { cp = v; cTouched = true; }); });
  var save = el('<button type="button" class="lf-btn is-ink is-full">Save</button>');
  var foot = [save];
  var del = null;
  if (ex && S.ex.indexOf(ex) >= 0) { del = el('<button type="button" class="lf-btn is-bad">Delete</button>'); foot.unshift(del); }
  var s = lfSheet({ title: ex ? 'Edit exercise' : 'New exercise', body: b, foot: foot });
  save.addEventListener('click', function () {
    var n = $('#lfExN', b).value.trim();
    if (!n) { $('#lfExN', b).focus(); return; }
    if (ex) { ex.n = n; ex.m = m; ex.t = t; if (S.ex.indexOf(ex) >= 0) ex.c = cp; S.wo.forEach(function (w) { w.x.forEach(function (x) { if (x.id === ex.id) x.n = n; }); }); }
    else { ex = { id: lfId(), n: n.slice(0, 60), m: m, t: t, c: cp }; S.ex.push(ex); }
    lfSave(); s.close(true); lfRender(); if (onDone) onDone(ex.id);
  });
  if (del) del.addEventListener('click', function () {
    lfAsk('Delete ' + ex.n + '?', 'It comes off every routine. Workouts you already logged keep it.', 'Delete', function () {
      var snap = JSON.stringify(S);
      S.ex = S.ex.filter(function (x) { return x !== ex; });
      S.rt.forEach(function (r) { r.ex = r.ex.filter(function (id) { return id !== ex.id; }); });
      lfSave(); s.close(true); stack.slice().forEach(function (x) { if (x.el.classList.contains('lf-exd')) x.close(true); }); lfRender();
      lfToast('Deleted ' + ex.n, function () { S = lfClean(JSON.parse(snap)); lfSave(); lfRender(); });
    });
  });
}

/* Progressive overload, read back: the best set, the estimated one-rep
   max, and the top set of every session as a line. */
/* ═══════════ HOW IT'S DONE: a video, one press away ═══════════
   Every exercise opens YouTube searched on its own name, so all of them
   have a demo from the day they exist without anybody pasting forty
   links — and a search never goes dead the way one video can. Paste a
   specific video and that one is used instead. */
function lfHowUrl(id, name) {
  return S.lk[id] || 'https://www.youtube.com/results?search_query=' + encodeURIComponent(name + ' exercise proper form');
}
function lfHowCard(id, name) {
  var c = el('<div class="lf-sec lf-how"><a class="lf-btn is-ink is-full lf-how-go" target="_blank" rel="noopener noreferrer"><svg class="lf-ic" viewBox="0 0 24 24"><path d="M9 7l8 5-8 5z" fill="currentColor"/></svg><span>Watch how it\'s done</span></a><div class="lf-how-sub"></div></div>');
  function paint() {
    var a = $('.lf-how-go', c), sub = $('.lf-how-sub', c), own = !!S.lk[id];
    a.href = lfHowUrl(id, name);
    a.setAttribute('aria-label', own ? 'Watch your saved video for ' + name : 'Watch videos of ' + name + ' on YouTube');
    sub.textContent = '';
    if (own) {
      var r = el('<div class="lf-how-row"><span class="lf-lab">Your saved video</span><button type="button" class="lf-how-l">Use YouTube search instead</button></div>');
      $('button', r).addEventListener('click', function () { var old = S.lk[id]; delete S.lk[id]; lfSave(); paint(); lfToast('Back to YouTube search', function () { S.lk[id] = old; lfSave(); paint(); }); });
      sub.appendChild(r);
    } else {
      var b = el('<button type="button" class="lf-how-l">Use a specific video</button>');
      b.addEventListener('click', function () {
        var f = el('<div class="lf-dl-f" style="margin-top:8px"><input class="lf-field" type="url" inputmode="url" placeholder="Paste a YouTube or Instagram link" aria-label="Video link" autocomplete="off" /><button type="button" class="lf-btn">Save</button></div>');
        $('button', f).addEventListener('click', function () {
          var v = $('input', f).value.trim();
          if (v && !/^https?:\/\//i.test(v)) v = 'https://' + v;
          if (!/^https?:\/\/[^\s]+\.[^\s]+/i.test(v)) { lfToast('That is not a link'); return; }
          S.lk[id] = v.slice(0, 500); lfSave(); paint();
        });
        sub.textContent = ''; sub.appendChild(f); $('input', f).focus();
      });
      sub.appendChild(b);
    }
  }
  paint();
  return c;
}

function lfExSheet(id) {
  var ex = exById(id), h = historyFor(id);
  var name = ex ? ex.n : 'Exercise';
  if (!ex && h.length) h[h.length - 1].w.x.forEach(function (e) { if (e.id === id && e.n) name = e.n; });
  var b = el('<div></div>');
  var best = null, bestE = 0;
  h.forEach(function (x) { x.sets.forEach(function (s) { var e = e1rm(s.w, s.r); if (e > bestE) { bestE = e; best = s; } }); });
  b.appendChild(lfSum([[best ? fmtWS(best.w) + '×' + best.r : '—', 'best set'], [bestE ? fmtW(bestE) : '—', 'est. 1RM ' + S.unit], [h.length, 'sessions']]));
  var rc = lfRec(id);
  var rl = el('<p class="lf-recd" id="lfRecd"></p>');
  rl.textContent = rc.kind + ' · ' + rc.sets + ' × ' + rc.lo + '–' + rc.hi + ' · ' + rc.rir + ' · rest ' + lfRestTxt({ lo: rc.rlo, hi: rc.rhi });
  b.appendChild(rl);
  b.appendChild(lfHowCard(id, name));
  if (h.length > 1) {
    var tops = h.slice(-12).map(function (x) { return toDisp(Math.max.apply(null, x.sets.map(function (s) { return e1rm(s.w, s.r); }))); });
    var c = el('<div class="lf-card lf-sec"><div class="lf-lab">Est. 1RM, last ' + tops.length + ' sessions</div><div class="lf-area" style="height:90px"></div></div>');
    var hs = h.slice(-12);
    $('.lf-area', c).innerHTML = lfAreaSvg(tops);
    lfScrub($('.lf-area', c), lfAreaPts(tops), function (i) { return [fmtW(tops[i]) + ' ' + S.unit, fmtDay(hs[i].w.d)]; });
    b.appendChild(c);
  }
  var list = el('<div class="lf-list lf-sec"></div>');
  if (!h.length) list.appendChild(el('<div class="lf-lab" style="padding:4px 2px">Not logged yet.</div>'));
  h.slice().reverse().forEach(function (x) {
    var li = el('<div class="lf-li"><div class="lf-li-t"><b></b><span class="lf-num"></span></div></div>');
    $('b', li).textContent = fmtDay(x.w.d);
    $('span', li).textContent = x.sets.map(function (s) { return fmtWS(s.w) + '×' + s.r; }).join('  ·  ');
    list.appendChild(li);
  });
  b.appendChild(list);
  var foot = null;
  if (ex && S.ex.indexOf(ex) >= 0) {
    var ed = el('<button type="button" class="lf-btn is-full">Edit</button>');
    ed.addEventListener('click', function () { lfExForm(ex, function () { s.close(true); lfExSheet(id); }); });
    foot = [ed];
  }
  /* LOGGED UNDER THE WRONG ONE: every set of this exercise, from every
     workout and the one in progress, moves to the one you pick. */
  var inAct = act && act.x.some(function (e) { return e.id === id; });
  if (h.length || inAct) {
    var mv = el('<button type="button" class="lf-btn is-full" id="lfMoveHist">Move history</button>');
    mv.addEventListener('click', function () {
      lfPicker(function (to) {
        if (to === id) return;
        var n = h.length + (inAct ? 1 : 0);
        lfAsk('Move to ' + exName(to) + '?', 'All ' + n + (n === 1 ? ' session' : ' sessions') + ' of ' + name + ' become ' + exName(to) + ', with every set and record.', 'Move', function () { s.close(true); lfMoveHistory(id, to, name); });
      }, 'Move history to');
    });
    foot = (foot || []).concat([mv]);
  }
  /* One exercise at a time: a second replaces the first rather than
     stacking on it. */
  stack.slice().forEach(function (x) { if (x.el.classList.contains('lf-exd')) x.close(true); });
  var s = lfSheet({ title: name, body: b, foot: foot, cls: 'lf-exd', through: true });
}

function lfMoveHistory(from, to, fromN) {
  var toN = exName(to), was = JSON.stringify(S.wo), wasAct = act ? JSON.stringify(act) : null;
  function move(x) {
    var dst = null; x.forEach(function (e) { if (e.id === to) dst = e; });
    x.slice().forEach(function (e) {
      if (e.id !== from) return;
      if (dst) { dst.sets = dst.sets.concat(e.sets); x.splice(x.indexOf(e), 1); }
      else { e.id = to; e.n = toN; dst = e; }
    });
  }
  S.wo.forEach(function (w) { move(w.x); });
  if (act) move(act.x);
  lfSave(); lfSaveAct(); lfRender(); if (sessSheet) lfPaintSession();
  lfToast(fromN + ' moved to ' + toN, function () {
    S.wo = JSON.parse(was); if (wasAct && act) act = JSON.parse(wasAct);
    lfSave(); lfSaveAct(); lfRender(); if (sessSheet) lfPaintSession();
  });
}
function lfRoutinePicker() {
  var b = el('<div class="lf-list"></div>');
  var s = lfSheet({ title: 'Today', body: b });
  function item(t, sub, cur, fn) {
    var li = el('<button type="button" class="lf-li"><div class="lf-li-t"><b></b><span></span></div></button>');
    $('b', li).textContent = t; $('span', li).textContent = sub;
    if (cur) li.insertAdjacentHTML('beforeend', IC.check);
    li.addEventListener('click', fn); b.appendChild(li);
  }
  var cur = lfIsRest() ? null : lfToday();
  item('Rest day', 'Take today off on purpose', lfIsRest(), function () { s.close(true); lfSetRest(!lfIsRest()); });
  allRt().forEach(function (r) {
    item(r.n, (r.fixed ? DOW_LONG[r.dow] + ' · ' : '') + (r.sp || (r.ex.length + ' exercises')), cur && cur.id === r.id, function () { S.pick = { d: ymd(today()), id: r.id }; lfSetRest(false); s.close(true); lfRender(); });
  });
  item('Empty workout', 'Add exercises as you go', false, function () { s.close(true); lfStart(null); });
  item('New routine', 'A named list of exercises you repeat', false, function () { s.close(true); lfRoutineForm(null); });
}

function lfRoutineForm(rt) {
  var draft = rt ? rt.ex.slice() : [];
  var b = el('<div><label class="lf-flab" for="lfRtN">Name</label><input class="lf-field" id="lfRtN" maxlength="40" placeholder="Push" autocomplete="off" /><label class="lf-flab" for="lfRtS">Split (optional)</label><input class="lf-field" id="lfRtS" maxlength="60" placeholder="Push, Pull, Legs" autocomplete="off" /><span class="lf-flab">Exercises</span><div class="lf-list" id="lfRtX"></div><button type="button" class="lf-add">' + IC.plus + 'Add exercise</button></div>');
  if (rt) { $('#lfRtN', b).value = rt.n; $('#lfRtS', b).value = rt.sp; }
  function paint() {
    var l = $('#lfRtX', b); l.textContent = '';
    if (!draft.length) l.appendChild(el('<div class="lf-lab" style="padding:6px 2px">None yet.</div>'));
    draft.forEach(function (id, i) {
      var li = el('<div class="lf-li"><div class="lf-li-t"><b></b></div><button type="button" class="lf-x" aria-label="Move up">' + '<svg class="lf-ic" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>' + '</button><button type="button" class="lf-x" aria-label="Remove">' + IC.x + '</button></div>');
      $('b', li).textContent = exName(id);
      var bs = $$('button', li);
      bs[0].disabled = i === 0; bs[0].style.opacity = i === 0 ? .3 : 1;
      bs[0].addEventListener('click', function () { if (i) { draft.splice(i - 1, 0, draft.splice(i, 1)[0]); paint(); } });
      bs[1].addEventListener('click', function () { draft.splice(i, 1); paint(); });
      l.appendChild(li);
    });
  }
  paint();
  $('.lf-add', b).addEventListener('click', function () { lfPicker(function (id) { draft.push(id); paint(); }); });
  var save = el('<button type="button" class="lf-btn is-ink">Save</button>');
  var foot = [save];
  if (rt) { var del = el('<button type="button" class="lf-btn is-bad">Delete</button>'); foot.unshift(del); }
  var s = lfSheet({ title: rt ? 'Edit routine' : 'New routine', body: b, foot: foot });
  save.addEventListener('click', function () {
    var n = $('#lfRtN', b).value.trim();
    if (!n) { $('#lfRtN', b).focus(); return; }
    if (!rt) { rt = { id: lfId() }; S.rt.push(rt); }
    rt.n = n; rt.sp = $('#lfRtS', b).value.trim(); rt.ex = draft;
    lfSave(); s.close(true); lfRender();
  });
  if (rt && del) del.addEventListener('click', function () {
    var snap = JSON.stringify(S);
    S.rt = S.rt.filter(function (r) { return r !== rt; }); if (S.pick && S.pick.id === rt.id) S.pick = null;
    lfSave(); s.close(true); lfRender();
    lfToast('Deleted ' + rt.n, function () { S = lfClean(JSON.parse(snap)); lfSave(); lfRender(); });
  });
}

/* A day of the split, read before you start it. */
function lfDaySpec(rt) {
  var b = el('<div><p class="lf-lab" style="margin:0 0 6px"></p><div class="lf-list"></div></div>');
  $('p', b).textContent = DOW_LONG[rt.dow] + ' · ' + rt.sp;
  var tip = DAY_TIPS[rt.id];
  if (tip) {
    var tc = el('<div class="lf-tip" id="lfTip"><div class="lf-cap">Focus</div><b></b><ul></ul></div>');
    $('b', tc).textContent = tip[0];
    tip[1].forEach(function (t) { var li = el('<li></li>'); li.textContent = t; $('ul', tc).appendChild(li); });
    b.insertBefore(tc, $('.lf-list', b));
  }
  if (rt.choice) {
    $('.lf-list', b).replaceWith(lfChoiceGrid(function () { sc.close(true); }));
    var sc = lfSheet({ title: rt.n, body: b });
    return;
  }
  rt.ex.forEach(function (id) {
    var t = rt.tg[id], rs = lfRestOf(id), last = lastFor(id);
    var li = el('<button type="button" class="lf-li"><div class="lf-li-t"><b></b><span></span></div><span class="lf-li-r lf-num"></span></button>');
    $('b', li).textContent = exName(id);
    $('span', li).textContent = rs.rir + ' · rest ' + lfRestTxt(rs) + (last ? ' · last ' + fmtWS(last[0].w) + '×' + last[0].r : '');
    $('.lf-li-r', li).textContent = lfTgTxt(t);
    li.addEventListener('click', function () { lfExSheet(id); });
    $('.lf-list', b).appendChild(li);
  });
  var go = el('<button type="button" class="lf-btn is-log is-full"></button>');
  go.textContent = act ? 'A workout is already running' : 'Start ' + rt.n;
  go.disabled = !!act;
  var s = lfSheet({ title: rt.n, body: b, foot: [go] });
  go.addEventListener('click', function () { s.close(true); lfStart(rt); });
}

var libQ = '', libG = 'all';
function lfRenderLib() {
  var root = $('#lfLib'); root.textContent = '';
  root.appendChild(el('<h2 class="lf-h1">Exercises</h2>'));
  /* the split, Monday first */
  root.appendChild(el('<div class="lf-cap lf-gh">Your split</div>'));
  /* TWO PROGRAMS, one running. Switching also moves the weekly targets
     to the new plan's — but only when they are still the old plan's own,
     so targets you set yourself are never overwritten. */
  var pg = el('<div class="lf-seg" id="lfProg" style="--n:3;margin-bottom:10px"></div>');
  PROG_IDS.forEach(function (k) {
    var bt = el('<button type="button"></button>'); bt.textContent = PROGRAMS[k].s; bt.dataset.p = k;
    bt.setAttribute('aria-pressed', S.prog === k ? 'true' : 'false');
    bt.addEventListener('click', function () {
      if (S.prog === k) return;
      var was = { prog: S.prog, focus: JSON.stringify(S.focus), pick: S.pick };
      var sig = function (l) { return JSON.stringify(lfFocusOf(l)); };
      var DEF = { ul: FOCUS_DEFAULT, ppl: FOCUS_PPL, gl: FOCUS_GL, qc: FOCUS_QC, gf: FOCUS_GF }, oldDef = DEF[S.prog] || FOCUS_DEFAULT, newDef = DEF[k];
      if (JSON.stringify(S.focus) === sig(oldDef)) S.focus = lfFocusOf(newDef);
      S.prog = k; if (S.pick && S.pick.d === ymd(today()) && !lfProg().days.concat(S.rt).some(function (x) { return x.id === S.pick.id; })) S.pick = null;
      lfSave(); lfRender();
      lfToast(PROGRAMS[k].n + ' is on', function () { S.prog = was.prog; S.focus = JSON.parse(was.focus); S.pick = was.pick; lfSave(); lfRender(); });
    });
    pg.appendChild(bt);
  });
  root.appendChild(pg);
  var pc = el('<div class="lf-card" style="padding:4px 16px" id="lfSplit"><div class="lf-list"></div></div>');
  [1, 2, 3, 4, 5, 6, 0].forEach(function (w) {
    var r = lfProg().days.filter(function (x) { return x.dow === w; })[0];
    if (!r) return;
    var li = el('<button type="button" class="lf-li"><div class="lf-li-t"><b></b><span></span></div>' + IC.chev + '</button>');
    $('b', li).textContent = DOW_LONG[r.dow].slice(0, 3) + ' · ' + r.n;
    $('span', li).textContent = r.choice ? r.sp : r.sp + ' · ' + r.ex.length + ' exercises';
    li.addEventListener('click', function () { lfDaySpec(r); });
    $('.lf-list', pc).appendChild(li);
  });
  root.appendChild(pc);
  /* routines */
  root.appendChild(el('<div class="lf-cap lf-gh">Your routines</div>'));
  var rc = el('<div class="lf-card" style="padding:4px 16px"><div class="lf-list"></div></div>');
  S.rt.forEach(function (r) {
    var li = el('<button type="button" class="lf-li"><div class="lf-li-t"><b></b><span></span></div>' + IC.chev + '</button>');
    $('b', li).textContent = r.n; $('span', li).textContent = (r.sp ? r.sp + ' · ' : '') + r.ex.length + ' exercise' + (r.ex.length === 1 ? '' : 's');
    li.addEventListener('click', function () { lfRoutineForm(r); });
    $('.lf-list', rc).appendChild(li);
  });
  var nr = el('<button type="button" class="lf-li" id="lfNewRt"><div class="lf-li-t"><b>New routine</b></div>' + IC.plus + '</button>');
  nr.addEventListener('click', function () { lfRoutineForm(null); });
  $('.lf-list', rc).appendChild(nr);
  root.appendChild(rc);
  /* the library */
  var hd = el('<div class="lf-hd lf-gh"><span class="lf-cap">All exercises</span></div>');
  root.appendChild(hd);
  var all = allEx();
  var fw = el('<div></div>'); fw.appendChild(lfPplSeg(libG, function (g) { libG = g; paintLib(); })); root.appendChild(fw);
  if (all.length > 6) {
    var q = el('<input class="lf-field" type="search" placeholder="Search" aria-label="Search exercises" autocomplete="off" />');
    q.value = libQ;
    q.addEventListener('input', function () { libQ = q.value; paintLib(); });
    root.appendChild(q);
  }
  var box = el('<div id="lfLibList"></div>'); root.appendChild(box);
  var mk = el('<button type="button" class="lf-add" id="lfNewEx">' + IC.plus + 'Create exercise</button>');
  mk.addEventListener('click', function () { lfExForm(null); });
  root.appendChild(mk);
  function paintLib() {

if (S.bseen && !S.bseen.v7) { var BS7 = { night: 1, dawn: 1, onfire: 1, winter: 1, lungs: 1, fullbody: 1 }; lfBadges().forEach(function (x) { if (x.d && BS7[x.b.id]) S.bseen[x.b.id] = 1; }); S.bseen.v7 = 1; lfSave(); }

if ('serviceWorker' in navigator && /^(https:|http:\/\/(localhost|127\.0\.0\.1))/.test(location.href)) {

/* A NEW VERSION ARRIVES BY ITSELF. iOS brings a Home Screen app back
   from memory rather than loading it again, so a phone could run a build
   for days: a fix sat unseen, and a friend's record went on missing what
   the new build sends. The page's own headers are read at open and again
   whenever it comes back to the front; when they have moved it reloads,
   but only while you are not typing — a workout in progress is saved on
   every keystroke and comes straight back up after the reload. */
var lfVer = null;
function lfVerOf() {
  return fetch(location.pathname, { method: 'HEAD', cache: 'no-store' }).then(function (r) {
    return r.ok ? (r.headers.get('etag') || r.headers.get('last-modified') || '') : '';

}

   and never move. This script is in the page it was loaded from, so if
   the page on the server no longer contains it, this one is old. Once a
   minute at most, so a slow server cannot loop it. */
var lfSelf = document.currentScript ? document.currentScript.textContent : '';
function lfReload(why) {
  var a = document.activeElement;
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
  try { var t = +sessionStorage.getItem('lift.rl') || 0; if (Date.now() - t < 60000) return; sessionStorage.setItem('lift.rl', Date.now()); } catch (e) {}

}
function lfVerCheck() {
  lfVerOf().then(function (v) {
    if (!v) return;
    if (lfVer === null) {
      lfVer = v;
      if (lfSelf) fetch(location.pathname, { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : ''; }).then(function (t) { if (t && t.indexOf(lfSelf) < 0) lfReload('stale'); }).catch(function () {});
