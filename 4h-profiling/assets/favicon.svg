<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="10" fill="#1A140E"/>
  <!-- reversal candle: long lower wick, small body -->
  <line x1="22" y1="14" x2="22" y2="50" stroke="#C9A24D" stroke-width="2.5"/>
  <rect x="16" y="16" width="12" height="12" fill="#A83E2E" stroke="#C9A24D" stroke-width="2"/>
  <!-- expansion candle: full body -->
  <line x1="43" y1="10" x2="43" y2="54" stroke="#C9A24D" stroke-width="2.5"/>
  <rect x="37" y="18" width="12" height="30" fill="#E7C787" stroke="#C9A24D" stroke-width="2"/>
</svg>
