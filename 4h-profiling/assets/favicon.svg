<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="10" fill="#F4F3EF"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="9.5" fill="none" stroke="#A07E37" stroke-width="1"/>
  <!-- reversal candle: long lower wick, small body -->
  <line x1="22" y1="14" x2="22" y2="50" stroke="#7C601F" stroke-width="2.5"/>
  <rect x="16" y="16" width="12" height="12" fill="#8B4230" stroke="#7C601F" stroke-width="2"/>
  <!-- expansion candle: full body -->
  <line x1="43" y1="10" x2="43" y2="54" stroke="#7C601F" stroke-width="2.5"/>
  <rect x="37" y="18" width="12" height="30" fill="#D9C48A" stroke="#7C601F" stroke-width="2"/>
</svg>
