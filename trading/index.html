<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark light" />
<title>Account Balance — trading</title>

<script>
/* Inline, and before the stylesheet, so the first paint is already
   themed and the photograph starts downloading immediately. Identical
   to Arc's, because it is the same shell. */
(function () {
  var d = document.documentElement, g = null;
  try { g = window.localStorage; } catch (e) {}
  var read = function (k) { try { return g && g.getItem(k); } catch (e) { return null; } };
  var p = read('arc.palette') || 'grotto';
  if (p === 'salt') p = 'grotto';
  var m = read('arc.theme') || 'system';
  d.dataset.palette = p;
  d.dataset.resolved = m === 'system'
    ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : m;
  var l = document.createElement('link');
  l.rel = 'preload'; l.as = 'image'; l.href = '../arc/bg/' + p + '.jpg';
  l.fetchPriority = 'high';
  document.head.appendChild(l);
  ['../arc/fonts/Inter-500.woff2', '../arc/fonts/JetBrainsMono-500.woff2'].forEach(function (f) {
    var k = document.createElement('link');
    k.rel = 'preload'; k.as = 'font'; k.type = 'font/woff2';
    k.href = f; k.crossOrigin = 'anonymous';
    document.head.appendChild(k);
  });
})();
</script>

<link rel="stylesheet" href="../shell.css" />

<style>
/* ═══════════════════════════════════════════════════════════════
   ACCOUNT BALANCE — live-capital trading analytics.

   The shell is Arc's, read from the same shell.css, so the two apps
   cannot drift apart. Everything below is this app's canvas.

   The one idea the whole thing rests on: CAPITAL FLOWS ARE NOT
   PERFORMANCE. A deposit raises equity without being a gain, and if
   the two share a series then the equity curve flatters you, drawdown
   vanishes, and return is meaningless. So the ledger keeps flows and
   realised PnL apart, and every performance figure is computed from
   trades alone. Return is time-weighted — chained across segments cut
   at each cash flow — which is the only way a percentage means your
   trading rather than your funding.
   ═══════════════════════════════════════════════════════════════ */

/* Up and down are the one place this app spends colour the shell does
   not. They are carried by a fill and a hard left edge — NOT by the
   figure itself, which stays --ink.

   Coloured text on a coloured cell put two variables in motion at once
   across ten backdrops, and it could not be tuned into compliance: the
   PnL figure measured 2.13:1 on one of them. So the number is always
   ink, and the direction is carried by the edge, the tint and the sign
   in front of the amount — three cues, none of them colour alone. */
:root {
  --up:   #7fb9a2;
  --down: #c98f8f;
  --up-fill:   rgba(127, 185, 162, .16);
  --down-fill: rgba(201, 143, 143, .16);
}
:root[data-resolved="light"] {
  --up:   #2f6b52;
  --down: #8f3f3f;
  --up-fill:   rgba(47, 107, 82, .13);
  --down-fill: rgba(143, 63, 63, .13);
}

.pane { flex: 1; overflow-y: auto; padding: 4px 16px 22px; }

/* ── the number that matters, and its parts ── */
.summary { display: flex; gap: 26px; align-items: flex-start; padding: 2px 2px 18px; flex-wrap: wrap; }
.stat { min-width: 104px; }
.stat b {
  display: block;
  font-family: var(--mono);
  font-size: 1.32rem;
  font-weight: 500;
  letter-spacing: -.03em;
}
.stat span {
  display: block;
  margin-top: 3px;
  font-family: var(--mono);
  font-size: .6rem;
  text-transform: uppercase;
  letter-spacing: .09em;
  color: var(--ink-2);
}
/* R under the dollars. The dollar figure is the fact; the R figure is
   the one that compares to any other stretch of your own trading. */
.stat em {
  display: block; margin-top: 3px; font-style: normal;
  font-family: var(--mono); font-size: .58rem; letter-spacing: .04em;
  color: var(--ink-3);
}
.stat.up b { color: var(--up); }
.stat.down b { color: var(--down); }

/* ── calendar ──
   Every trade shows as its own card, not a daily total. A day that made
   money on one setup and gave it back on another is a different day from
   one that quietly won once, and a single net figure cannot tell them
   apart. The net is still there, in the corner, but it is the summary
   rather than the whole story. */
.cal-head { display: flex; align-items: center; gap: 12px; margin: 6px 0 10px; }
.cal-head h2 {
  margin: 0;
  font-family: var(--mono);
  font-size: .72rem;
  font-weight: 400;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: var(--ink-2);
}
.cal-head .grow { flex: 1; }
/* ── candle clock ──
   The 4H opens are the whole premise, so the time left to act inside one
   belongs in the chrome, not on a page you have to navigate to. */
.candle {
  position: relative; flex: none;
  display: flex; align-items: center; gap: 9px;
  height: 34px; padding: 0 12px;
  border: 1px solid var(--glass-line); border-radius: 9px;
  background: var(--glass-in);
  font-family: var(--mono); font-size: .64rem;
  letter-spacing: .06em; color: var(--ink-2);
  overflow: hidden;
}
.candle-k { display: flex; align-items: center; gap: 6px; }
.candle-k .ic { display: inline-flex; color: var(--ink-3); }
.candle-k b { font-weight: 500; color: var(--ink); }
/* The session the candle belongs to, sat next to its open — the open
   alone is a number, the name is what you actually call it. */
.candle-s { color: var(--ink-3); text-transform: none; letter-spacing: .02em;
  white-space: nowrap; }
.candle-t { font-variant-numeric: tabular-nums; color: var(--ink); }
.candle-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
  background: color-mix(in srgb, var(--ink-3) 22%, transparent); }
.candle-bar i { display: block; height: 100%; width: 0; background: var(--accent); }
/* The last stretch of a candle is not the same trade as the first. */
.candle.late .candle-t { color: var(--down); }
.candle.late .candle-bar i { background: var(--down); }
/* 14:00 is not a candle you trade, so the clock stops offering it. */
.candle.off { opacity: .5; }
.candle.off .candle-bar i { background: var(--ink-3); }

/* ── the candle panel ──
   The profile is the whole edge, so the page opens with what the current
   candle is FOR rather than with a scoreboard. */
.cp {
  position: relative; overflow: hidden;
  margin: 0 0 16px; padding: 13px 15px 15px;
  border: 1px solid var(--glass-line); border-radius: 11px;
  background: var(--glass-in);
}
.cp-h { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
.cp-h .grow { flex: 1; }
.cp-in {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 7px; border-radius: 6px;
  border: 1px solid var(--glass-line); background: var(--glass-in-2);
  font-family: var(--mono); font-size: .54rem;
  text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3);
}
.cp-in .ic { display: inline-flex; }
.cp-open {
  font-family: var(--mono); font-size: 1.32rem; font-weight: 500;
  letter-spacing: -.02em; color: var(--ink);
}
.cp-name { font-size: .8rem; color: var(--ink-2); }
.cp-ny, .cp-next {
  font-family: var(--mono); font-size: .58rem; letter-spacing: .06em;
  color: var(--ink-3); white-space: nowrap;
}
.cp-ny {
  padding: 3px 6px; border-radius: 5px;
  border: 1px solid var(--glass-line); background: var(--glass-in-2);
  color: var(--ink-2);
}
.cp-line { margin: 0 0 11px; font-size: .88rem; color: var(--ink); letter-spacing: -.005em; }

/* The time band. Its whole job is to answer "is there still room in this
   candle", so it carries the theme accent rather than a stoplight green —
   this is not a win, it is a window. */
.cp-band {
  display: flex; align-items: flex-start; gap: 9px;
  padding: 9px 11px; border-radius: 9px;
  border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
  background: color-mix(in srgb, var(--accent) 9%, transparent);
}
.cp-band .ic { display: inline-flex; flex: none; margin-top: 1px; color: var(--accent); }
.cp-band b { display: block; font-size: .78rem; font-weight: 500; color: var(--ink); }
.cp-band em { display: block; margin-top: 2px; font-style: normal;
  font-size: .72rem; color: var(--ink-3); }
/* Past halfway the accent drops out — there is nothing to encourage. */
.cp-band.mid { border-color: var(--glass-line); background: var(--glass-in-2); }
.cp-band.mid .ic { color: var(--ink-3); }
.cp-band.late, .cp-band.off { border-color: var(--glass-line); background: none; }
.cp-band.late .ic, .cp-band.off .ic { color: var(--ink-3); }
.cp-band.late b, .cp-band.off b { color: var(--ink-2); }

.cp-miss {
  margin: 11px 0 0; padding-top: 10px;
  border-top: 1px solid var(--rule);
  font-size: .76rem; line-height: 1.5; color: var(--ink-3);
}
.cp-miss b { font-weight: 500; color: var(--ink-2); }
.cp-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
  background: color-mix(in srgb, var(--ink-3) 18%, transparent); }
.cp-bar i { display: block; height: 100%; width: 0; background: var(--accent); }
.cp.off .cp-bar i, .cp.late .cp-bar i { background: color-mix(in srgb, var(--ink-3) 55%, transparent); }

/* ── the way back ──
   Shown only when you are down. A loss in dollars is a number; a loss in
   R is a number of trades, which is the only form of it you can act on. */
.recover {
  display: flex; align-items: center; gap: 8px;
  margin: -4px 0 16px; padding: 8px 12px;
  border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
  border-radius: 9px;
  background: color-mix(in srgb, var(--accent) 9%, transparent);
  font-size: .78rem; color: var(--ink-2);
}
.recover .ic { display: inline-flex; flex: none; color: var(--accent); }
.recover b { font-family: var(--mono); font-weight: 500; color: var(--ink);
  font-variant-numeric: tabular-nums; letter-spacing: -.015em; }

.step {
  width: 28px; height: 28px;
  display: grid; place-items: center;
  border: 1px solid var(--glass-line);
  border-radius: 8px;
  background: var(--glass-in);
  color: var(--ink-2);
  cursor: pointer;
  font: inherit;
}
.step.wide {
  width: auto; padding: 0 10px;
  font-family: var(--mono); font-size: .58rem;
  text-transform: uppercase; letter-spacing: .08em;
}
.step:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.dow, .grid {
  display: grid;
  grid-template-columns: repeat(var(--cols, 5), minmax(0, 1fr));
  gap: 6px;
}
.dow { margin-bottom: 6px; }
.dow span {
  font-family: var(--mono);
  font-size: .58rem;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: var(--ink-2);
  padding-left: 2px;
}
/* Cells size to their own contents rather than stretching to the busiest
   day in the row — one three-trade Friday was inflating four empty days
   to match it, and the month read as mostly heavy boxes. */
.grid { grid-auto-rows: minmax(94px, auto); align-items: start; }
.day { min-height: 94px; }
/* A day with nothing on it is a record too, but it is not news. */
.day.empty { background: color-mix(in srgb, var(--glass-in) 45%, transparent);
  border-color: color-mix(in srgb, var(--glass-line) 55%, transparent); }

.day {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 5px;
  padding: 7px 7px 8px;
  border: 1px solid var(--glass-line);
  border-radius: 9px;
  background: var(--glass-in);
  text-align: left;
  font: inherit;
  color: inherit;
}
/* The cell is a container, not a control. Its targets are the trades
   inside it and the strip of empty space beneath them, so an existing
   trade can be opened instead of a second one being started on top. */
.day.blank { border-color: transparent; background: none; }
.day-h { display: flex; align-items: baseline; gap: 6px; }
.day-h .d { font-family: var(--mono); font-size: .6rem; color: var(--ink-3); }
.day-h .grow { flex: 1; }
/* The net keeps the direction colour, because it is the one figure on
   the cell that is a judgement rather than a record. */
.day-h .net { font-family: var(--mono); font-size: .6rem; font-weight: 500; letter-spacing: -.02em; }
.day-h .net.up { color: var(--up); }
.day-h .net.down { color: var(--down); }
.day.today { box-shadow: inset 0 0 0 1px var(--accent); }
.day.out { opacity: .45; }

/* ── a trade, as a card ── */
.tcard {
  display: block; width: 100%;
  padding: 6px 7px 7px;
  border: 1px solid var(--glass-line);
  border-radius: 7px;
  background: var(--glass-in-2);
  text-align: left; font: inherit; color: inherit; cursor: pointer;
}
.tcard:hover { background: var(--glass-in);
  border-color: color-mix(in srgb, var(--edge) 40%, transparent); }
.tcard:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.tcard-h { display: flex; align-items: center; gap: 6px; }
.tsym {
  flex: 1; min-width: 0;
  font-size: .72rem; font-weight: 600; letter-spacing: -.01em;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
/* The outcome is a word first. The tint behind it is reinforcement, and
   the amount below carries its own sign, so nothing rests on colour. */
.tchip {
  flex: none;
  padding: 2px 5px;
  border-radius: 4px;
  font-family: var(--mono);
  font-size: .52rem;
  text-transform: uppercase;
  letter-spacing: .07em;
  color: var(--ink);
  background: var(--glass-in);
}
.tchip.win  { background: var(--up-fill);   box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--up) 45%, transparent); }
.tchip.loss { background: var(--down-fill); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--down) 45%, transparent); }
.tamt {
  display: block; margin-top: 4px;
  font-family: var(--mono); font-size: .68rem; font-weight: 500;
  letter-spacing: -.02em; color: var(--ink);
}
.tcard.missed .tamt { color: var(--ink-3); }

/* The empty space under the cards is the "add" target, so a day with room
   left on it stays a one-click entry surface. */
.day-new {
  flex: 1; min-height: 16px; margin: 0; padding: 3px 1px;
  border: 0; border-radius: 6px; background: none;
  text-align: left; cursor: pointer;
  font-family: var(--mono); font-size: .54rem;
  text-transform: uppercase; letter-spacing: .08em;
  color: var(--ink-3);
  opacity: 0;
}
@media (hover: hover) { .day:hover .day-new { opacity: 1; } }
.day-new:focus-visible { opacity: 1; outline: 2px solid var(--focus); outline-offset: 1px; }

/* ── equity curve ── */
.curve { margin-top: 20px; }
.curve svg { display: block; width: 100%; height: 170px; overflow: visible; }
.axis-l { font-family: var(--mono); font-size: 9px; fill: var(--ink-3); }
.gridline { stroke: var(--rule); stroke-width: 1; }
.equity { fill: none; stroke: var(--ink); stroke-width: 1.6; }
/* The flat line is what you put in. The gap to the equity line is what
   the trading actually did — the single most honest thing on screen. */
.basis { fill: none; stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 3 3; }
.flow { stroke: var(--accent); stroke-width: 1; opacity: .5; }
.flow-dot { fill: var(--accent); }
.legend { display: flex; gap: 16px; margin-top: 8px; }
.legend span {
  display: flex; align-items: center; gap: 6px;
  font-family: var(--mono); font-size: .58rem;
  text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3);
}
.legend i { width: 14px; height: 0; border-top: 2px solid currentColor; }
.legend i.dash { border-top-style: dashed; border-width: 1px; }

/* ── metrics ── */
.metrics { display: grid; grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); gap: 10px; }
.metric {
  padding: 12px 13px;
  border: 1px solid var(--glass-line);
  border-radius: 10px;
  background: var(--glass-in);
}
.metric b {
  display: block;
  font-family: var(--mono);
  font-size: 1.06rem;
  font-weight: 500;
  letter-spacing: -.025em;
}
.metric span {
  display: block; margin-top: 4px;
  font-family: var(--mono); font-size: .58rem;
  text-transform: uppercase; letter-spacing: .09em; color: var(--ink-3);
}
.metric em {
  display: block; margin-top: 6px; font-style: normal;
  font-size: .68rem; color: var(--ink-2); line-height: 1.4;
}

/* ── trade entry ──
   A journal dies on the entry path, not on the metrics. This is six
   fields, opens with the amount already focused, submits on Enter, and
   can be reached from the calendar so the date is filled in for you. */
/* The journal is a tall form. The header and the save row stay put and
   the fields scroll between them, so Save is never below the fold on a
   laptop — a sheet you have to scroll to submit is a sheet that loses
   entries. */
dialog.sheet {
  width: min(520px, calc(100vw - 40px));
  max-height: min(860px, calc(100vh - 40px));
  padding: 0;
  border: 1px solid var(--glass-line);
  border-radius: 14px;
  background: var(--menu);
  color: var(--ink);
  box-shadow: 0 24px 70px rgba(0, 0, 0, .5);
  overflow: hidden;
}
dialog.sheet form { display: flex; flex-direction: column; max-height: inherit; }
dialog.sheet::backdrop { background: rgba(0, 0, 0, .5); backdrop-filter: blur(3px); }
.sheet-h {
  display: flex; align-items: center; gap: 12px;
  padding: 15px 18px 12px; border-bottom: 1px solid var(--rule);
}
.sheet-h h2 {
  margin: 0; font-family: var(--display); font-weight: 300;
  font-size: 1.2rem; letter-spacing: -.005em;
}
.sheet-h .grow { flex: 1; }
.sheet-h, .sheet-f { flex: none; }
.sheet-b { padding: 16px 18px; display: grid; gap: 11px; grid-template-columns: 1fr 1fr;
  overflow-y: auto; }
.sheet-b .wide { grid-column: 1 / -1; }
.sheet-f {
  display: flex; align-items: center; gap: 9px;
  padding: 12px 18px 15px; border-top: 1px solid var(--rule);
}
.sheet-f .grow { flex: 1; }
.hint { font-family: var(--mono); font-size: .58rem; letter-spacing: .06em;
  text-transform: uppercase; color: var(--ink-3); }

/* Direction is a choice, not a minus sign to remember. */
.side { display: flex; gap: 0; border: 1px solid var(--glass-line); border-radius: 8px; overflow: hidden; }
.side button {
  flex: 1; height: 36px; border: 0; background: var(--glass-in);
  color: var(--ink-2); font: inherit; font-family: var(--mono);
  font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; cursor: pointer;
}
.side button[aria-pressed="true"] { color: var(--ink); }
.side button.w[aria-pressed="true"] { background: var(--up-fill);   box-shadow: inset 0 -2px 0 var(--up); }
.side button.l[aria-pressed="true"] { background: var(--down-fill); box-shadow: inset 0 -2px 0 var(--down); }
.side button.m[aria-pressed="true"] { background: var(--glass-in-2); box-shadow: inset 0 -2px 0 var(--ink-3); }
/* Type is not an outcome, so it does not borrow the win/loss colours —
   a reversal is not a loss. */
.side.two button[aria-pressed="true"] { background: var(--glass-in-2); box-shadow: inset 0 -2px 0 var(--accent); }

/* Labels carry a shape as well as a word. */
.field label { display: flex; align-items: center; gap: 6px; }
.field label .ic { display: inline-flex; color: var(--ink-3); }
.field textarea {
  padding: 8px 10px; min-height: 62px; resize: vertical;
  border: 1px solid var(--glass-line); border-radius: 8px;
  background: var(--glass-in); color: var(--ink);
  font: inherit; font-size: .8rem; line-height: 1.45; outline: none;
}
.field textarea:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
/* The date is a real input, not a caption. You reach the sheet by clicking
   a day, so it is nearly always already right — but a trade logged the
   morning after still has to be movable without leaving the sheet. */
.sheet-date {
  font-family: var(--mono); font-size: .64rem; letter-spacing: .06em;
  color: var(--ink-3); background: none; border: 1px solid transparent;
  border-radius: 6px; padding: 3px 5px; width: auto; cursor: pointer;
}
.sheet-date:hover { color: var(--ink-2); border-color: var(--glass-line); }
.sheet-date:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.tally { margin-left: auto; font-family: var(--mono); font-size: .58rem; color: var(--ink-3); }

/* ── checklist ──
   The same rules every time, so the days you lost can be read against
   the rules you skipped. */
.checks { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; }
.checks li { display: block; }
.checks button {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 6px 8px; border: 1px solid transparent; border-radius: 7px;
  background: none; color: var(--ink-2); font: inherit; font-size: .76rem;
  text-align: left; cursor: pointer;
}
.checks button:hover { background: var(--glass-in); }
.checks .box {
  flex: none; width: 15px; height: 15px; border-radius: 4px;
  border: 1px solid var(--glass-line); background: var(--glass-in);
  display: grid; place-items: center; color: transparent;
}
.checks button[aria-pressed="true"] { color: var(--ink); }
.checks button[aria-pressed="true"] .box {
  background: var(--up-fill); border-color: color-mix(in srgb, var(--up) 55%, transparent);
  color: var(--up);
}

/* ── chart image ── */
.shot {
  position: relative; display: block; width: 100%; height: 128px;
  padding: 0; overflow: hidden;
  border: 1px dashed var(--glass-line); border-radius: 9px;
  background: var(--glass-in) center / cover no-repeat;
  color: var(--ink-3); font: inherit; cursor: pointer;
}
.shot-empty {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-family: var(--mono); font-size: .58rem;
  text-transform: uppercase; letter-spacing: .08em;
}
.shot.has { border-style: solid; }
.shot.has .shot-empty { opacity: 0; background: rgba(0,0,0,.55); color: var(--ink); }
.shot.has:hover .shot-empty, .shot:focus-visible .shot-empty { opacity: 1; }
.shot.dropping { border-color: var(--accent); }

/* ── breakdowns ── */
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 22px; }
@media (max-width: 1080px) { .split { grid-template-columns: 1fr; } }
.rows-t { margin: 0; padding: 0; list-style: none; }
.rows-t li {
  display: grid; grid-template-columns: 1fr auto; gap: 4px 12px;
  padding: 9px 0; border-bottom: 1px solid var(--rule);
}
.rows-t li:last-child { border-bottom: 0; }
.rt-n { font-size: .82rem; font-weight: 500; }
.rt-v { font-family: var(--mono); font-size: .78rem; font-weight: 500; letter-spacing: -.02em; }
.rt-v.up { color: var(--up); }
.rt-v.down { color: var(--down); }
.rt-m { font-family: var(--mono); font-size: .6rem; color: var(--ink-2); letter-spacing: -.01em; }
/* The bar is signed: it grows from a centre line, so losers point the
   other way instead of just being a shorter winner. */
.bar-wrap { grid-column: 1 / -1; position: relative; height: 5px; margin-top: 3px;
  background: var(--glass-in); border-radius: 3px; }
.bar-wrap i { position: absolute; top: 0; bottom: 0; left: 50%; width: 1px;
  background: var(--rule); }
.bar-wrap b { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
.bar-wrap b.up   { background: var(--up); }
.bar-wrap b.down { background: var(--down); }

/* ── settings + ledger ── */
.form { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; margin-bottom: 16px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label {
  font-family: var(--mono); font-size: .58rem;
  text-transform: uppercase; letter-spacing: .09em; color: var(--ink-3);
}
.field input, .field select {
  height: 36px; padding: 0 10px;
  border: 1px solid var(--glass-line); border-radius: 8px;
  background: var(--glass-in); color: var(--ink);
  font: inherit; font-family: var(--mono); font-size: .78rem;
  outline: none;
}
.field input:focus-visible, .field select:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

.ledger { margin: 0; padding: 0; list-style: none; }
.ledger li {
  display: flex; align-items: baseline; gap: 12px;
  padding: 9px 2px;
  border-bottom: 1px solid var(--rule);
}
.ledger li:last-child { border-bottom: 0; }
.led-d { font-family: var(--mono); font-size: .64rem; color: var(--ink-3); width: 76px; flex: none; }
.led-k {
  font-family: var(--mono); font-size: .56rem; text-transform: uppercase;
  letter-spacing: .09em; color: var(--ink-2); width: 82px; flex: none;
}
.led-n { flex: 1; font-size: .8rem; color: var(--ink-2); min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.led-v { font-family: var(--mono); font-size: .76rem; font-weight: 500; letter-spacing: -.02em; }
.led-v.up { color: var(--up); }
.led-v.down { color: var(--down); }
.drop { border: 0; background: none; color: var(--ink-3); cursor: pointer; font: inherit; padding: 0 2px; }

.empty {
  padding: 34px 20px; text-align: center;
  font-family: var(--mono); font-size: .64rem;
  text-transform: uppercase; letter-spacing: .09em; color: var(--ink-3);
}
@media (hover: hover) {
  .day:not(.blank):hover, .step:hover { background: var(--glass-in-2); }
  .drop:hover { color: var(--down); }
}
</style>
</head>

<body>
<div class="backdrop" aria-hidden="true"></div>
<div class="fx" aria-hidden="true"></div>

<div class="app">

  <nav class="rail" aria-label="Sections">
    <span class="rail-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" width="17" height="17">
        <path d="M4 18l5-6 4 3 6-8" /><path d="M15 7h4v4" />

    </span>
    <button type="button" data-view="calendar" aria-current="page" aria-label="Calendar">

        <rect x="3" y="5" width="18" height="16" rx="2" /><path d="M3 10h18M8 3v4M16 3v4" />

    </button>
    <button type="button" data-view="metrics" aria-label="Metrics">

        <path d="M12 3v18M8 7h6a3 3 0 0 1 0 6h-4a3 3 0 0 0 0 6h6" /></svg>

  <div class="main">

    <div class="topbar">
      <div class="search">

          <circle cx="11" cy="11" r="7" /><path d="m20 20-3.6-3.6" />
        </svg>
        <label class="sr" for="q">Search trades</label>
        <input id="q" type="search" placeholder="Search trades" autocomplete="off" />

      <!-- How much of the current 4H candle is left to act in. -->
      <div class="candle" id="candle" role="status" aria-live="off">
        <span class="candle-k"><span class="ic" id="icCandle"></span><b id="candleOpen">—</b></span>
        <span class="candle-s" id="candleName"></span>
        <span class="candle-t" id="candleLeft">—</span>
        <span class="candle-bar" aria-hidden="true"><i id="candleFill"></i></span>
      </div>

      <button class="btn btn-ghost" type="button" id="themeBtn" aria-label="Appearance: System">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"

      <div class="pal">

        <h1>Account balance</h1>
        <span class="grow"></span>
        <span class="span-meta" id="calMeta"></span>

      <div class="pane" tabindex="0">

            <span class="cp-ny" id="cpNY"></span>

<script src="../shell.js" defer></script>
<script>
'use strict';

/* ═══════════════════════════════════════════════════════════════
   The ledger is one ordered list of events. A deposit and a trade are
   both events, but they are never the same KIND of event, and no
   performance figure is ever computed from a flow.
   ═══════════════════════════════════════════════════════════════ */

const KEY = 'ledger.v1';

/* ── icons ──
   One sprite, drawn inline at label size. Every field carries one, so a
   glance down the form is a glance down a column of shapes rather than
   a column of words. */
const ICO = {
  out:   'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18ZM12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z',
  pair:  'M3 17l5-6 4 3 6-8M17 6h4v4',
  clock: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18ZM12 7v5l3 2',
  risk:  'M12 3l7 3v5c0 4.4-2.9 8.3-7 9.5C7.9 19.3 5 15.4 5 11V6l7-3Z',
  money: 'M12 2v20M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6',
  tag:   'M20 12.5 12.5 20 3 10.5V3h7.5L20 12.5ZM7 7h.01',
  check: 'M4 7h10M4 12h10M4 17h6M17 15l2 2 4-4',
  tick:  'M4 12l5 5L20 6',
  mode:  'M4 9h14l-4-4M20 15H6l4 4',
  image: 'M3 5h18v14H3zM3 15l5-5 4 4 3-3 6 6M8.5 9.5h.01',
  note:  'M4 20h4L20 8l-4-4L4 16v4ZM14 6l4 4',
  calendar: 'M3 5h18v16H3zM3 10h18M8 3v4M16 3v4',
};
const icon = (n, size) =>
  `<svg viewBox="0 0 24 24" width="${size || 13}" height="${size || 13}" fill="none"
        stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
        stroke-linejoin="round" aria-hidden="true"><path d="${ICO[n]}"/></svg>`;

/* ── the checklists ──
   Two fixed lists, because a continuation and a reversal are not the
   same trade and should not answer the same questions. Within a type the
   list never drifts: a list that changes cannot tell you which rule you
   skipped on the days you lost.

   Distilled from the 4H profiling docs (Eleven_Trades, V1–V3). The
   reversal is the wick — trade it only where the daily profile says a
   wick belongs, and never without SMT. The continuation is the body —
   the 3rd candle of an existing swing point. Both enter on the V-shape
   CISD, nothing else. */
const CHECKLISTS = {
  continuation: [
    'Daily bias and order flow aligned',
    '3rd candle — swing point already formed',
    'SMT confirmed at the swing high/low',
    'Small wick — body expanding, no consolidation',
    'V-shape CISD — entering the expansion',
  ],
  reversal: [
    'Key level reached — profile supports the turn',
    'HTF SMT divergence — no SMT, no trade',
    'V-shape CISD — no consolidation before it',
    'Right candle for the reversal window',
    'No contradictory swing on the chart',
  ],
};
const MODES = { continuation: 'modeCont', reversal: 'modeRev' };

/* ── the 4H candles ──
   Opens in New York time, which is where the profiling is anchored. The
   clock is computed in that zone explicitly rather than from the local
   one, so the labels mean the same thing whichever machine this is open
   on and whether or not the US has shifted for daylight saving yet.

   14:00 is a real candle and the clock names it, but it is deliberately
   absent from SESSIONS: it is not one you take, so it should not be
   offerable as an answer to "which candle was this".

   Listed from the 18:00 open, because that is where the trading day
   starts — not from midnight, which is the middle of one. */
const NO_TRADE = 14;
const hhmm = (h) => String(h).padStart(2, '0') + ':00';
const SESSIONS = [18, 22, 2, 6, 10].map(hhmm);

/* What each candle is for, straight out of the profiling model: the wick
   is the reversal and the body is the expansion, and which candle prints
   the wick decides what the rest of the day does.

   `miss` is the part worth having on screen. A window you did not take
   is not a day lost — the model already says where the move goes next,
   and reading that at 06:00 is more use than reading it in hindsight. */
const PROFILE = {
  18: { name: 'Asia reversal',
        line: 'Reversal window. Turn here and London expands, NY continues.',
        miss: '22:00 can still print the wick, and 02:00 after it. Otherwise look for a gap inside 18:00’s wick on the 1H or 30M and take the continuation there.' },
  22: { name: 'Overnight reversal',
        line: 'Reversal window. Last of the overnight before London takes it.',
        miss: '02:00 takes the reversal, then 06:00 and 10:00 expand toward the draw.' },
   2: { name: 'London reversal',
        line: 'Reversal window. 06:00 and 10:00 carry it toward the draw.',
        miss: '06:00 continues it, then 10:00. Look for a gap inside 02:00’s wick on the 1H or 30M and take the continuation there.' },
   6: { name: 'NY reversal',
        line: 'Reversal into expansion. 08:30 and 09:30 usually confirm it.',
        miss: 'If 06:00 never reverses, 10:00 manipulates and starts the expansion. Take the continuation there.' },
  10: { name: 'Late NY reversal',
        line: 'Last reversal of the day. Small wick with daily logic behind it is a strong entry.',
        miss: 'Nothing after this one. No entries past 11:00 — be flat before 12:00.' },
  14: { name: 'NY lunch',
        line: 'Not traded. The day’s reversal has already happened or it has not.',
        miss: 'The next reversal window is the 18:00 open.' },
};

/* Symbols, setups and notes are typed by hand and then written into
   innerHTML and into attributes. A single quote mark in a setup name is
   enough to break a cell without this. */
const esc = (s) => String(s).replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const money = (n, sign) => (sign && n > 0 ? '+' : n < 0 ? '−' : '')
  + '$' + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
/* Local, deliberately. toISOString() is UTC, so an evening trade in the
   Americas would prefill tomorrow and land in tomorrow's calendar cell —
   and be counted on the wrong weekday in the breakdowns. */
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`
  + `-${String(d.getDate()).padStart(2, '0')}`;

/* Ids must be unique, not merely usually unique. Delete matches by value,
   so two events sharing a millisecond would be deleted together while the
   app reported removing one. */
const uid = () => (crypto.randomUUID ? crypto.randomUUID()
  : Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10));

function readStore() {
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) { return null; }
  if (!raw) return null;
  try {
    const v = JSON.parse(raw);
    if (!v || !Array.isArray(v.events)) throw new Error('shape');
    return v;
  } catch (e) {
    /* Never fall back to the sample here. Showing demonstration numbers
       after a failed read is how a person mistakes fake money for a
       recovered account — and the next trade they record overwrites the
       damaged original. Keep the wreckage, say so, start empty. */
    try { localStorage.setItem(KEY + '.corrupt.' + Date.now(), raw); } catch (_) {}
    setTimeout(() => alert('Your saved ledger could not be read. A copy has been kept under '
      + KEY + '.corrupt — export it before recording anything new.'), 0);
    return { events: [] };
  }
}
/* Deliberately not wrapped. A swallowed write is the worst failure this
   file can have: the trade appears on screen, the app says "recorded",
   and it is gone on reload. commit() catches and tells the truth. */
function writeStore(v) { localStorage.setItem(KEY, JSON.stringify(v)); }

/* Sample events, so the shape is visible before any real capital is
   entered. Cleared the moment you record anything of your own. */
const SAMPLE = {
  events: [
    { id: 1, k: 'deposit',  date: '2026-02-02', amt: 5000, note: 'Opening capital' },
    { id: 2, k: 'trade', date: '2026-02-05', amt:  180, sym: 'ES',  setup: 'CISD' },
    { id: 3, k: 'trade', date: '2026-02-06', amt: -95,  sym: 'NQ',  setup: 'SMT' },
    { id: 4, k: 'trade', date: '2026-02-06', amt:  240, sym: 'ES',  setup: 'CISD' },

let state = readStore() || SAMPLE;

/* Everything that mutates goes through here first. While the sample is on
   screen `state` IS the SAMPLE object, so any edit would otherwise write
   demonstration capital into a live ledger — permanently, because after
   one save readStore() succeeds and this guard never fires again. There
   is no partial exit: the sample leaves whole or not at all. */
const isDemo = () => state === SAMPLE;
function liven() { if (isDemo()) state = { events: [] }; }
/* Dates are day-resolution, so same-day order needs a rule rather than a
   coincidence. The convention is the standard one for daily-valued
   series: a flow settles at the START of its day, ahead of that day's
   trades. Without it, typing a deposit before or after a trade you made
   the same day changed the reported return by a factor of ten. */
const events = () => [...state.events].sort((a, b) =>
  a.date.localeCompare(b.date)
  || (a.k === 'trade' ? 1 : 0) - (b.k === 'trade' ? 1 : 0)
  || (a.seq || 0) - (b.seq || 0));
/* A missed setup is logged, shown on the calendar, and counted in NO
   performance figure. It was not a trade you took: folding it in as a
   zero would drag expectancy toward nothing and inflate the trade count
   with things you never risked money on. Same principle as keeping
   deposits out of profit — record everything, measure only what applies. */
const logged = () => events().filter(e => e.k === 'trade');
const trades = () => logged().filter(e => e.out !== 'missed');
const flows  = () => events().filter(e => e.k !== 'trade');
const signed = (e) => e.k === 'withdraw' ? -e.amt : e.amt;

/* ── the arithmetic ──
   equity   — everything, because that is genuinely what is in the account
   capital  — flows only, the money you put in
   profit   — equity minus capital, which is what the trading did
   TWR      — chained segment returns, cut at every flow, so a deposit
              cannot be mistaken for a good week */
function totals() {
  const all = events();
  const equity = all.reduce((s, e) => s + signed(e), 0);
  const capital = flows().reduce((s, e) => s + signed(e), 0);
  const t = trades();
  const wins = t.filter(e => e.amt > 0), losses = t.filter(e => e.amt < 0);
  const grossWin = wins.reduce((s, e) => s + e.amt, 0);
  const grossLoss = Math.abs(losses.reduce((s, e) => s + e.amt, 0));

  /* Time-weighted return, chained at every flow so a deposit cannot pass
     for a good week. Three situations have no honest number and return
     null rather than a comforting 0.0%:
       · profit earned before any capital was recorded — there is no basis
         to divide by, and folding it into the first deposit would silently
         reclassify a win as capital;
       · no flows at all, same reason;
       · equity at or below zero — the account is wiped, the chain ends.
     Without the last one a WINNING segment after a negative balance moves
     the headline further negative, which is worse than saying nothing. */
  let eq = 0, segStart = null, twr = 1, defined = true, wiped = false;
  const chain = () => {
    if (segStart === null) { if (eq !== 0) defined = false; return; }
    if (segStart <= 0) { defined = false; return; }   // no base to divide by
    if (eq <= 0) { wiped = true; return; }            // the account is gone
    twr *= eq / segStart;
  };
  for (const e of all) {
    if (e.k === 'trade') { eq += e.amt; continue; }
    chain();
    if (wiped) break;
    eq += signed(e);
    segStart = eq;
  }
  if (!wiped) chain();
  const twrPct = !defined || segStart === null ? null : wiped ? -100 : (twr - 1) * 100;

  /* Drawdown walks the TRADES only. Including flows made a withdrawal
     look like a loss — the sample's worst drawdown was reported as
     exactly the size of a rent payment. Taking money out is not losing
     it, and this is the same mistake as counting a deposit as a gain,
     just pointing the other way. */
  let peak = 0, run = 0, dd = 0;
  for (const e of t) { run += e.amt; peak = Math.max(peak, run); dd = Math.max(dd, peak - run); }

  /* R only means anything on trades where the risk was actually written
     down, so those are counted separately rather than averaged against
     trades that never recorded one — a hidden zero would quietly halve
     the average risk and flatter every recovery figure built on it. */
  const g = t.filter(e => e.risk > 0);
  const rTotal = g.reduce((s, e) => s + e.amt / e.risk, 0);
  const avgRisk = g.length ? g.reduce((s, e) => s + e.risk, 0) / g.length : 0;

  return {
    equity, capital, profit: equity - capital,
    twr: twrPct, wiped,
    n: t.length,
    winRate: t.length ? (wins.length / t.length) * 100 : 0,
    avgWin: wins.length ? grossWin / wins.length : 0,
    avgLoss: losses.length ? grossLoss / losses.length : 0,
    pf: grossLoss ? grossWin / grossLoss : (grossWin ? Infinity : 0),
    expectancy: t.length ? (grossWin - grossLoss) / t.length : 0,
    dd, rTotal, avgRisk, graded: g.length,
    ...streaks(t),
  };
}

/* Run lengths, in trade order. The current run is the one that tells you
   what state you are in right now; the worst is the one you size for. */
function streaks(t) {
  let cur = 0, bestW = 0, bestL = 0;
  for (const e of t) {
    if (e.amt > 0) cur = cur > 0 ? cur + 1 : 1;
    else if (e.amt < 0) cur = cur < 0 ? cur - 1 : -1;
    else continue;
    bestW = Math.max(bestW, cur);
    bestL = Math.min(bestL, cur);
  }
  return { streak: cur, bestWin: bestW, worstLoss: Math.abs(bestL) };
}

/* The search filters what the calendar and the capital list SHOW. It
   deliberately does not touch the metrics — a win rate that quietly
   answered a different question than the one on its label would be worse
   than no search at all. The month total does follow the filter, because
   "what did CISD make me in March" is the question worth asking. */
let query = '';
const hits = (e) => !query || [e.sym, e.setup, e.note, e.sess, e.k]
  .some(v => v && String(v).toLowerCase().includes(query));
document.getElementById('q').addEventListener('input', (ev) => {
  query = ev.target.value.trim().toLowerCase();
  renderCalendar(); renderLedger();
});

const byDay = () => {
  const m = new Map();
  logged().filter(hits).forEach(e => {
    const cur = m.get(e.date) || { pnl: 0, n: 0, items: [] };
    if (e.out !== 'missed') { cur.pnl += e.amt; cur.n += 1; }
    cur.items.push(e);
    m.set(e.date, cur);
  });
  return m;
};

/* A return with no basis behind it prints as a dash. A percentage is a
   claim; "—" is the absence of one, and the two must not look alike. */
const pct = (v) => v === null ? '—' : (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(1) + '%';

/* ── summary ── */
function renderSummary() {
  const t = totals();
  const el = document.getElementById('summary');
  el.innerHTML = [
    ['Equity', money(t.equity), ''],
    ['Capital in', money(t.capital), ''],
    ['Profit', money(t.profit, true), t.profit > 0 ? 'up' : t.profit < 0 ? 'down' : '',
      t.graded ? `${t.rTotal >= 0 ? '+' : '−'}${Math.abs(t.rTotal).toFixed(2)}R `
        + `across ${t.graded} graded trade${t.graded === 1 ? '' : 's'}` : ''],
    ['Return', pct(t.twr), t.twr > 0 ? 'up' : t.twr < 0 ? 'down' : ''],
  ].map(([l, v, cls, sub]) => `<div class="stat ${cls}"><b>${v}</b><span>${l}</span>`
    + `${sub ? `<em>${sub}</em>` : ''}</div>`).join('');
  document.getElementById('calMeta').textContent = `${t.n} trades`;
  document.getElementById('capMeta').textContent = money(t.capital) + ' in';
  document.getElementById('metMeta').textContent = `${t.n} trades`;
  renderRecover(t);
}

/* The way back, in trades rather than dollars. Being down $652 tells you
   nothing you can act on; being down 4.2R tells you it is five ordinary
   trades, which is a week — not a catastrophe and not a reason to size
   up. Only shown when you are actually down, and only when enough risk
   has been recorded for the average to mean something. */
function renderRecover(t) {
  const el = document.getElementById('recover');
  if (t.profit >= 0 || !t.graded) { el.hidden = true; return; }
  const after = t.profit + 3 * t.avgRisk;
  const need = -t.profit / t.avgRisk;
  el.hidden = false;
  el.innerHTML = `<span class="ic">${icon('pair', 13)}</span>`
    + `One trade at 3R puts you <b>${money(after, true)}</b> — `
    + `<b>${need.toFixed(1)}R</b> gets you back to flat, off <b>${money(t.avgRisk)}</b> risk.`;
}

/* ── calendar ── */
let cursor = (() => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), 1); })();
const MONTHS = ['January','February','March','April','May','June',
                'July','August','September','October','November','December'];
const DOW_SHORT = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

function renderCalendar() {
  const y = cursor.getFullYear(), m = cursor.getMonth();
  document.getElementById('monthLabel').textContent = `${MONTHS[m]} ${y}`;
  const days = byDay();
  const len = new Date(y, m + 1, 0).getDate();
  const todayIso = iso(new Date());
  const key = d => `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  const idx = d => (new Date(y, m, d).getDay() + 6) % 7;   // Mon = 0

  /* The market week is five days, so the grid is five columns — until a
     trade actually lands on a weekend, at which point the weekend
     appears rather than the trade being hidden. */
  let cols = 5;
  for (let d = 1; d <= len; d++) if (idx(d) > 4 && days.has(key(d))) { cols = 7; break; }
  const dow = document.getElementById('dow');
  document.getElementById('grid').style.setProperty('--cols', cols);
  dow.style.setProperty('--cols', cols);   // the header is a sibling, not a child
  dow.innerHTML = DOW_SHORT.slice(0, cols).map(n => `<span>${n}</span>`).join('');

  let monthPnl = 0, cells = '';
  /* A month opening on a weekend starts in column 0, not clamped to the
     last column — clamping emitted phantom blanks and shifted every date
     of the month four columns right, under the wrong weekday. */
  const lead = idx(1) >= cols ? 0 : idx(1);
  for (let i = 0; i < lead; i++) cells += '<div class="day blank" aria-hidden="true"></div>';

  for (let d = 1; d <= len; d++) {
    if (idx(d) >= cols) continue;                      // weekend, and nothing on it
    const k = key(d);
    const hit = days.get(k);
    if (hit) monthPnl += hit.pnl;

    const cards = hit ? hit.items.map(e => {
      /* A zero-amount trade you actually took is neither a win nor a
         loss, and calling it a win here while the metrics count it as
         neither would have three code paths disagreeing about one row. */
      const out = e.out === 'missed' ? 'missed' : e.amt > 0 ? 'win' : e.amt < 0 ? 'loss' : 'flat';
      const word = { missed: 'Missed', win: 'Win', loss: 'Loss', flat: 'Flat' }[out];
      /* The card carries its own label rather than being swallowed by one
         on the cell — everything drawn here should be readable aloud. */
      return `<button class="tcard ${out === 'missed' ? 'missed' : ''}" type="button"
          data-id="${esc(String(e.id))}" data-date="${k}"
          aria-label="${esc(word)}${e.sym ? ', ' + esc(e.sym) : ''}${e.setup ? ', ' + esc(e.setup) : ''}, `
        + `${out === 'missed' ? 'not taken' : money(e.amt, true)}. Open.">
        <span class="tcard-h" aria-hidden="true">
          <span class="tsym">${esc(e.sym || 'Trade')}</span>
          <span class="tchip ${out}">${word}</span>
        </span>
        <span class="tamt" aria-hidden="true">${out === 'missed' ? 'not taken' : money(e.amt, true)}</span>
      </button>`;
    }).join('') : '';

    const netCls = !hit || !hit.n ? '' : hit.pnl > 0 ? 'up' : hit.pnl < 0 ? 'down' : '';
    const sum = hit && hit.n
      ? `${money(hit.pnl, true)} from ${hit.n} trade${hit.n === 1 ? '' : 's'}` : 'no trades';

    cells += `<div class="day ${hit ? '' : 'empty'} ${k === todayIso ? 'today' : ''}" data-date="${k}"
        role="group" aria-label="${d} ${MONTHS[m]}, ${sum}">
      <span class="day-h">
        <span class="d" aria-hidden="true">${d}</span>
        <span class="grow"></span>
        ${hit && hit.n ? `<span class="net ${netCls}" aria-hidden="true">${money(hit.pnl, true)}</span>` : ''}
      </span>
      ${cards}
      <button class="day-new" type="button" data-date="${k}"
        aria-label="Record a trade on ${d} ${MONTHS[m]}">+ trade</button>
    </div>`;
  }

  document.getElementById('grid').innerHTML = cells;
  document.getElementById('calMeta').textContent =
    query ? `showing “${query}”` : `${trades().length} trades`;
  const mp = document.getElementById('monthPnl');
  mp.textContent = monthPnl ? money(monthPnl, true) : 'no trades';
  mp.style.color = monthPnl > 0 ? 'var(--up)' : monthPnl < 0 ? 'var(--down)' : '';
}

document.getElementById('prevM').addEventListener('click', () => {
  cursor = new Date(cursor.getFullYear(), cursor.getMonth() - 1, 1); renderCalendar();
});
document.getElementById('nextM').addEventListener('click', () => {
  cursor = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1); renderCalendar();
});
document.getElementById('todayM').addEventListener('click', () => {
  const n = new Date();
  cursor = new Date(n.getFullYear(), n.getMonth(), 1); renderCalendar();
});

/* ── metrics ── */
function renderMetrics() {
  const t = totals();
  /* Three-way, everywhere. A two-way ternary paints a flat or empty
     ledger entirely red — someone who has recorded nothing should not
     open a losing dashboard. */
  const dir = v => v > 0 ? 'up' : v < 0 ? 'down' : '';
  /* A profit factor of ∞ after three wins and no losses is the most
     flattering number available at the moment of least evidence, and
     0.00 on an empty ledger reads as a catastrophic edge. Both are — . */
  const pf = !t.n ? ['—', 'no trades yet']
    : t.pf === Infinity ? ['—', 'no losses yet — needs one to be defined']
    : [t.pf.toFixed(2), 'Gross won ÷ gross lost. Under 1 and the edge is negative.'];
  const twrNote = t.twr === null
    ? 'Undefined until an opening deposit is recorded.'
    : t.wiped ? 'The account reached zero; return is not chained past that point.'
    : 'Chained across every deposit and withdrawal, so it measures the trading.';
  document.getElementById('metrics').innerHTML = [
    [money(t.profit, true), 'Realised profit', 'Trades only. Deposits are never counted here.',
      dir(t.profit)],
    [pct(t.twr), 'Time-weighted return', twrNote, dir(t.twr)],
    [t.n ? t.winRate.toFixed(0) + '%' : '—', 'Win rate', `${t.n} trades`, ''],
    [pf[0], 'Profit factor', pf[1], ''],
    [money(t.expectancy, true), 'Expectancy', 'What an average trade is worth to you.',
      dir(t.expectancy)],
    [money(t.avgWin), 'Average win', '', ''],
    [money(t.avgLoss), 'Average loss', '', ''],
    [money(t.dd), 'Max drawdown', 'Trades only — a withdrawal is not a loss.', ''],
    [(t.streak > 0 ? '+' : '') + t.streak, 'Current run',
      t.streak > 0 ? 'consecutive wins' : t.streak < 0 ? 'consecutive losses' : 'flat',
      t.streak > 0 ? 'up' : t.streak < 0 ? 'down' : ''],
    [String(t.worstLoss), 'Longest losing run', 'The one to size for.', ''],
  ].map(([v, l, note, cls]) =>
    `<div class="metric"><b class="${cls ? 'stat ' + cls : ''}" style="${cls === 'up' ? 'color:var(--up)' : cls === 'down' ? 'color:var(--down)' : ''}">${v}</b>
     <span>${l}</span>${note ? `<em>${note}</em>` : ''}</div>`).join('');
  renderCurve();
}

/* Grouped stats. Both of these answer the same question from different
   sides: where does the edge actually come from — and where does it go. */
function group(keyFn, label) {
  const m = new Map();
  trades().forEach(e => {
    const k = keyFn(e);
    if (k === null) return;
    const cur = m.get(k) || { n: 0, pnl: 0, wins: 0 };
    cur.n += 1; cur.pnl += e.amt; if (e.amt > 0) cur.wins += 1;
    m.set(k, cur);
  });
  return [...m.entries()].map(([k, v]) => ({
    key: k, label: label ? label(k) : k, ...v,
    exp: v.pnl / v.n, wr: (v.wins / v.n) * 100,
  }));
}

function renderRows(el, rows, valueOf, meta) {
  if (!rows.length) { el.innerHTML = '<li class="empty">No trades yet</li>'; return; }
  const max = Math.max(...rows.map(r => Math.abs(valueOf(r)))) || 1;
  el.innerHTML = rows.map(r => {
    const v = valueOf(r);
    const w = (Math.abs(v) / max) * 50;
    return `<li>
      <span class="rt-n">${esc(r.label)}</span>
      <span class="rt-v ${v > 0 ? 'up' : v < 0 ? 'down' : ''}">${money(v, true)}</span>
      <span class="rt-m">${meta(r)}</span>
      <span class="bar-wrap" aria-hidden="true"><i></i>
        <b class="${v >= 0 ? 'up' : 'down'}"
           style="${v >= 0 ? `left:50%;width:${w}%` : `right:50%;width:${w}%`}"></b></span>
    </li>`;
  }).join('');
}

const DOW = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function renderBreakdowns() {
  const setups = group(e => e.setup || 'Untagged').sort((a, b) => b.exp - a.exp);
  renderRows(document.getElementById('bySetup'), setups, r => r.exp,
    r => `${r.n} trades · ${r.wr.toFixed(0)}% won · ${money(r.pnl, true)} total`);

  const dows = group(e => new Date(e.date + 'T00:00:00').getDay())
    .sort((a, b) => ((a.key + 6) % 7) - ((b.key + 6) % 7));
  renderRows(document.getElementById('byDow'), dows.map(r => ({ ...r, label: DOW[r.key] })),
    r => r.pnl, r => `${r.n} trades · ${r.wr.toFixed(0)}% won`);
}

function renderCurve() {
  const all = events();
  const svg = document.getElementById('curve');
  if (!all.length) { svg.innerHTML = ''; return; }
  const W = 900, H = 170, PAD = 26;

  let eq = 0, cap = 0;
  const pts = all.map((e, i) => {
    eq += signed(e);
    if (e.k !== 'trade') cap += signed(e);
    return { i, eq, cap, flow: e.k !== 'trade', date: e.date };
  });
  /* The domain has to cover both signs. Dividing by a single max put a
     negative equity ABOVE the zero line — a loss drawn as a gain — and a
     ledger of pure losses fell to the `|| 1` fallback and drew the line
     thousands of pixels off canvas. */
  const lo = Math.min(0, ...pts.map(p => Math.min(p.eq, p.cap)));
  const hi = Math.max(0, ...pts.map(p => Math.max(p.eq, p.cap)));
  const top = hi > 0 ? hi * 1.08 : 0, bot = lo < 0 ? lo * 1.08 : 0;
  const span = (top - bot) || 1;
  const x = i => PAD + (i / Math.max(1, pts.length - 1)) * (W - PAD * 2);
  const y = v => H - PAD - ((v - bot) / span) * (H - PAD * 2);

  const line = key => pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p[key]).toFixed(1)}`).join('');
  const marks = pts.filter(p => p.flow).map(p =>
    `<line class="flow" x1="${x(p.i).toFixed(1)}" y1="${PAD - 8}" x2="${x(p.i).toFixed(1)}" y2="${H - PAD}"/>
     <circle class="flow-dot" cx="${x(p.i).toFixed(1)}" cy="${y(p.eq).toFixed(1)}" r="2.6"/>`).join('');

  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML =
    `<line class="gridline" x1="${PAD}" y1="${y(0).toFixed(1)}" x2="${W - PAD}" y2="${y(0).toFixed(1)}"/>
     <line class="gridline" x1="${PAD}" y1="${PAD - 8}" x2="${W - PAD}" y2="${PAD - 8}"/>
     <text class="axis-l" x="${PAD}" y="${PAD - 13}">${money(top).replace('.00','')}</text>
     <text class="axis-l" x="${PAD}" y="${(y(0) + 13).toFixed(1)}">$0</text>
     ${marks}
     <path class="basis" d="${line('cap')}"/>
     <path class="equity" d="${line('eq')}"/>`;

  const t = totals();
  document.getElementById('curveAlt').textContent =
    `Equity ended at ${money(t.equity)} against ${money(t.capital)} of capital put in, `
    + `a realised profit of ${money(t.profit)}. Vertical marks are deposits and withdrawals.`;
}

/* ── capital ── */
function renderLedger() {
  const all = events().filter(hits).reverse();
  const ul = document.getElementById('ledger');
  document.getElementById('ledgerMeta').textContent = `${all.length} events`;
  if (!all.length) { ul.innerHTML = '<li class="empty">Nothing recorded yet</li>'; return; }
  ul.innerHTML = all.map(e => {
    const v = signed(e);
    const label = e.k === 'trade'
      ? `${e.sym || 'Trade'}${e.setup ? ' · ' + e.setup : ''}${e.sess ? ' · ' + e.sess : ''}`
        + `${e.out === 'missed' ? ' · missed' : ''}`
      : (e.note || '');
    return `<li>
      <span class="led-d">${e.date}</span>
      <span class="led-k">${e.k}</span>
      <span class="led-n">${esc(label)}</span>
      <span class="led-v ${v > 0 ? 'up' : v < 0 ? 'down' : ''}">${money(v, true)}</span>
      <button class="drop" type="button" data-id="${esc(String(e.id))}" aria-label="Remove ${e.k} of ${money(Math.abs(v))} on ${e.date}">✕</button>
    </li>`;
  }).join('');
}

document.getElementById('ledger').addEventListener('click', (ev) => {
  const b = ev.target.closest('.drop');
  if (!b) return;
  const demo = isDemo();
  if (demo && !confirm('This is sample data. Deleting clears the whole sample and starts you empty.')) return;
  liven();
  if (!demo) state.events = state.events.filter(e => String(e.id) !== b.dataset.id);
  SHOTS.del(b.dataset.id).catch(() => {});
  commit(demo ? 'Sample ledger cleared.' : 'Removed one event.');
});

document.getElementById('flowForm').addEventListener('submit', (ev) => {
  ev.preventDefault();
  const k = document.getElementById('fKind').value;
  const amt = parseFloat(document.getElementById('fAmt').value);
  const date = document.getElementById('fDate').value;
  if (!(amt > 0) || !date) return;
  /* The sample vanishes the moment real capital is recorded — mixing
     demonstration numbers into live figures would be worse than useless. */
  liven();
  state.events.push({ id: uid(), seq: nextSeq(), k, date, amt,
    note: document.getElementById('fNote').value.trim() });
  ev.target.reset();
  document.getElementById('fDate').value = iso(new Date());
  commit(`${k === 'deposit' ? 'Deposit' : 'Withdrawal'} of ${money(amt)} recorded.`);
});

/* ── the journal ──
   One day, one click, one sheet. Everything the trade was: what you took,
   when, what you risked, which of your own rules you actually followed,
   the chart, and what you would do again. */
const sheet = document.getElementById('sheet');
const SIDES = { win: 'sideWin', loss: 'sideLoss', missed: 'sideMiss' };
let side = 'win';
let editing = null;      // id of the trade the sheet is showing, null when new
let ticked = new Set();  // the checklist lines confirmed on the open sheet
let mode = 'continuation';

/* Every label wears its icon, painted once at load. */
[['icOut', 'out'], ['icPair', 'pair'], ['icTime', 'clock'], ['icRisk', 'risk'],
 ['icMoney', 'money'], ['icTag', 'tag'], ['icMode', 'mode'], ['icCheck', 'check'],
 ['icImage', 'image'], ['icNote', 'note']]
  .forEach(([id, n]) => { document.getElementById(id).innerHTML = icon(n); });

document.getElementById('tTime').innerHTML = '<option value="">—</option>'
  + SESSIONS.map(s => `<option>${esc(s)}</option>`).join('');

/* ── the checklist ──
   Stored as the RULE TEXT, not its position. The list is meant to be
   edited as a strategy matures, and indices would silently re-map every
   entry already written — a trade recorded as "liquidity swept" would
   later claim you had checked something else entirely. */
const rules = () => CHECKLISTS[mode];

function renderChecks() {
  const list = rules();
  document.getElementById('checks').innerHTML = list.map(line =>
    `<li><button type="button" data-line="${esc(line)}" aria-pressed="${ticked.has(line)}">
      <span class="box" aria-hidden="true">${icon('tick', 11)}</span>${esc(line)}</button></li>`).join('');
  document.getElementById('checkTally').textContent = `${ticked.size}/${list.length}`;
}

/* Switching type drops any tick that the new list does not contain.
   Carrying an invisible tick into the save would have the record claim
   you confirmed something the sheet never showed you. */
function setMode(v) {
  mode = v;
  Object.entries(MODES).forEach(([k, id]) =>
    document.getElementById(id).setAttribute('aria-pressed', String(k === v)));
  const keep = new Set(rules());
  ticked = new Set([...ticked].filter(l => keep.has(l)));
  renderChecks();
}
Object.entries(MODES).forEach(([k, id]) =>
  document.getElementById(id).addEventListener('click', () => setMode(k)));
document.getElementById('checks').addEventListener('click', (ev) => {
  const b = ev.target.closest('button');
  if (!b) return;
  const line = b.dataset.line;
  ticked.has(line) ? ticked.delete(line) : ticked.add(line);
  renderChecks();
});

/* ── the chart image ──
   Blobs live in IndexedDB keyed by trade id, never in localStorage — a
   couple of screenshots would blow the 5MB quota and take the ledger with
   them. The ledger record keeps a flag; the picture keeps itself. */
const SHOTS = (() => {
  const NAME = 'ledger-shots', STORE = 'shots';
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open(NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
  const run = async (mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction(STORE, mode), req = fn(t.objectStore(STORE));
      t.oncomplete = () => res(req ? req.result : undefined);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
    });
  };
  return {
    get: id => run('readonly',  s => s.get(String(id))),
    put: (id, b) => run('readwrite', s => s.put(b, String(id))),
    del: id => run('readwrite', s => s.delete(String(id))),
  };
})();

/* Charts are screenshots, so they arrive far larger than they need to be.
   Down to 1400px and JPEG before anything is stored. */
function compress(file) {
  return new Promise((res) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const sc = Math.min(1, 1400 / img.naturalWidth);
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.naturalWidth * sc));
      c.height = Math.max(1, Math.round(img.naturalHeight * sc));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => res(b || file), 'image/jpeg', 0.82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); res(file); };
    img.src = url;
  });
}

const shotBtn = document.getElementById('tShot');
let shotBlob = null, shotUrl = null, shotDirty = false;

/* Minted once per picture and revoked on replace. An object URL that is
   never released holds the whole blob in memory for the life of the tab. */
function setShot(blob) {
  if (shotUrl) { URL.revokeObjectURL(shotUrl); shotUrl = null; }
  shotBlob = blob || null;
  const cap = shotBtn.querySelector('.shot-empty');
  if (!shotBlob) {
    shotBtn.classList.remove('has');
    shotBtn.style.backgroundImage = '';
    cap.textContent = 'Click, paste or drop an image';
    return;
  }
  shotUrl = URL.createObjectURL(shotBlob);
  shotBtn.classList.add('has');
  shotBtn.style.backgroundImage = `url("${shotUrl}")`;
  cap.textContent = 'Replace · shift-click to remove';
}
async function takeShot(file) {
  if (!file || !/^image\//.test(file.type)) return;
  setShot(await compress(file));
  shotDirty = true;
}

const picker = Object.assign(document.createElement('input'),
  { type: 'file', accept: 'image/*', hidden: true });
document.body.appendChild(picker);
picker.addEventListener('change', () => { takeShot(picker.files[0]); picker.value = ''; });

shotBtn.addEventListener('click', (ev) => {
  if (ev.shiftKey && shotBlob) { setShot(null); shotDirty = true; return; }
  picker.click();
});
['dragenter', 'dragover'].forEach(t => shotBtn.addEventListener(t, (ev) => {
  ev.preventDefault(); shotBtn.classList.add('dropping');
}));
['dragleave', 'drop'].forEach(t => shotBtn.addEventListener(t, () =>
  shotBtn.classList.remove('dropping')));
shotBtn.addEventListener('drop', (ev) => {
  ev.preventDefault();
  takeShot(ev.dataTransfer.files && ev.dataTransfer.files[0]);
});
/* A trader screenshots and pastes. Anywhere in the sheet is close enough. */
sheet.addEventListener('paste', (ev) => {
  const it = [...(ev.clipboardData ? ev.clipboardData.items : [])]
    .find(i => i.kind === 'file' && /^image\//.test(i.type));
  if (!it) return;
  ev.preventDefault();
  takeShot(it.getAsFile());
});

/* ── outcome ── */
function setSide(v) {
  side = v;
  Object.entries(SIDES).forEach(([k, id]) =>
    document.getElementById(id).setAttribute('aria-pressed', String(k === v)));
  /* A missed setup has no amount to give, so the field stops asking. */
  const amt = document.getElementById('tAmt');
  amt.disabled = v === 'missed';
  amt.required = v !== 'missed';
  if (v === 'missed') amt.value = '';
  rHint();
}
Object.entries(SIDES).forEach(([k, id]) =>
  document.getElementById(id).addEventListener('click', () => setSide(k)));

/* Risk and result together are an R multiple, which is the one number
   that compares a trade on a $50 stop to a trade on a $500 one. Both
   fields are already being asked for, so it costs nothing to show. */
function rHint() {
  const risk = parseFloat(document.getElementById('tRisk').value);
  const amt = parseFloat(document.getElementById('tAmt').value);
  const el = document.getElementById('rHint');
  if (side === 'missed' || !(risk > 0) || !(amt > 0)) { el.textContent = ''; return; }
  const r = (amt / risk) * (side === 'loss' ? -1 : 1);
  el.textContent = `${r >= 0 ? '+' : '−'}${Math.abs(r).toFixed(2)}R`;
}
['tRisk', 'tAmt'].forEach(id => document.getElementById(id).addEventListener('input', rHint));

/* Symbols and setups you have used before, offered back, so the second
   trade on a setup takes two keystrokes instead of eight. */
function refreshLists() {
  const uniq = k => [...new Set(trades().map(e => e[k]).filter(Boolean))].sort();
  document.getElementById('syms').innerHTML =
    uniq('sym').map(v => `<option value="${esc(v)}"></option>`).join('');
  document.getElementById('setups').innerHTML =
    uniq('setup').map(v => `<option value="${esc(v)}"></option>`).join('');
}

const val = (id) => document.getElementById(id).value.trim();
const nextSeq = () => state.events.reduce((m, e) => Math.max(m, e.seq || 0), 0) + 1;

/* Opens empty for a new trade on `date`, or filled for the trade `id`.
   The same sheet does both, because a journal you can only write to and
   never re-read is a diary you never open. */
function openTrade(date, id) {
  refreshLists();
  const e = id ? state.events.find(x => String(x.id) === String(id)) : null;
  editing = e ? e.id : null;

  setSide(e ? (e.out === 'missed' ? 'missed' : e.amt < 0 ? 'loss' : 'win') : 'win');
  document.getElementById('tDate').value = e ? e.date : (date || iso(new Date()));
  document.getElementById('tSym').value = (e && e.sym) || '';
  document.getElementById('tSetup').value = (e && e.setup) || '';
  document.getElementById('tNote').value = (e && e.note) || '';
  /* A new trade logged on today's date almost always belongs to the
     candle you are standing in, so the dropdown starts there. Not for a
     past day, where guessing would put a wrong answer in the record. */
  const live = hhmm(candle().open);
  const onToday = (e ? e.date : (date || iso(new Date()))) === iso(new Date());
  document.getElementById('tTime').value = e ? (e.sess || '')
    : (onToday && SESSIONS.includes(live) ? live : '');
  document.getElementById('tRisk').value = e && e.risk != null ? e.risk : '';
  document.getElementById('tAmt').value = e && e.out !== 'missed' ? Math.abs(e.amt) : '';

  ticked = new Set(e && Array.isArray(e.checks) ? e.checks : []);
  setMode((e && e.mode) || 'continuation');   // renders the checklist too

  setShot(null);
  shotDirty = false;
  /* Fetched async, so guard on `editing` — a fast second click must not
     have the first trade's chart land in the second trade's sheet. */
  if (e && e.shot) {
    const want = e.id;
    SHOTS.get(want).then(b => { if (b && editing === want) setShot(b); }).catch(() => {});
  }

  document.getElementById('sheetTitle').textContent = e ? 'Edit trade' : 'Record a trade';
  document.getElementById('tradeSave').textContent = e ? 'Save changes' : 'Save trade';
  document.getElementById('tradeDelete').hidden = !e;
  rHint();
  sheet.showModal();
  document.getElementById(e ? 'tSym' : 'tAmt').focus();
}

document.getElementById('newTrade').addEventListener('click', () => openTrade());
document.getElementById('sheetX').addEventListener('click', () => sheet.close());
/* Esc closes the dialog without a submit event, so the picture is
   released here rather than in the save path. */
sheet.addEventListener('close', () => { setShot(null); shotDirty = false; editing = null; });

/* The calendar is both the record and the way in: a card opens the trade
   it draws, the space beneath starts a new one on that day. */
document.getElementById('grid').addEventListener('click', (ev) => {
  const card = ev.target.closest('.tcard');
  if (card) { openTrade(card.dataset.date, card.dataset.id); return; }
  const add = ev.target.closest('.day-new');
  if (add) openTrade(add.dataset.date);
});

document.getElementById('tradeForm').addEventListener('submit', (ev) => {
  const raw = parseFloat(document.getElementById('tAmt').value);
  if (side !== 'missed' && !(raw > 0)) {
    /* The form is method="dialog", so returning early would close the
       sheet and silently drop everything typed into it. */
    ev.preventDefault();
    const a = document.getElementById('tAmt');
    a.setCustomValidity('Enter the amount won or lost.');
    a.reportValidity();
    setTimeout(() => a.setCustomValidity(''), 0);
    return;
  }
  const risk = parseFloat(document.getElementById('tRisk').value);
  const prior = editing ? state.events.find(x => String(x.id) === String(editing)) : null;
  const demo = isDemo();
  liven();

  const id = prior && !demo ? prior.id : uid();
  /* Stored signed, so nothing downstream has to remember which way a
     loss points. The form asks for a magnitude and a direction. */
  const rec = {
    id, k: 'trade',
    seq: prior && !demo ? (prior.seq || nextSeq()) : nextSeq(),
    date: document.getElementById('tDate').value,
    amt: side === 'missed' ? 0 : side === 'win' ? raw : -raw,
    out: side === 'missed' ? 'missed' : undefined,
    sym: val('tSym'),
    setup: val('tSetup'),
    sess: val('tTime') || undefined,
    risk: risk > 0 ? risk : undefined,
    mode,
    checks: ticked.size ? [...ticked] : undefined,
    note: val('tNote'),
    shot: shotBlob ? true : undefined,
  };

  if (shotDirty) {
    if (shotBlob) SHOTS.put(id, shotBlob).catch(() => {});
    else SHOTS.del(id).catch(() => {});
  }

  const at = state.events.findIndex(x => String(x.id) === String(id));
  if (at >= 0) state.events[at] = rec; else state.events.push(rec);

  const what = side === 'missed' ? 'Missed setup'
    : `${side === 'win' ? 'Win' : 'Loss'} of ${money(raw)}`;
  editing = null;
  commit(`${what} ${at >= 0 ? 'updated' : 'recorded'}.`
    + (demo ? ' Sample data cleared.' : ''));
});

document.getElementById('tradeDelete').addEventListener('click', () => {
  if (editing === null) return;
  const demo = isDemo();
  if (!confirm(demo
    ? 'This is sample data. Deleting clears the whole sample and starts you empty.'
    : 'Delete this trade? This cannot be undone.')) return;
  const id = editing;
  liven();
  if (!demo) state.events = state.events.filter(x => String(x.id) !== String(id));
  SHOTS.del(id).catch(() => {});
  editing = null;
  sheet.close();
  commit(demo ? 'Sample ledger cleared.' : 'Trade deleted.');
});

/* A save that fails must never read as a save that worked. This is the
   one place the app could lie about real money already banked. */
function commit(msg) {
  try { writeStore(state); }
  catch (e) {
    renderAll();
    document.getElementById('say').textContent = 'NOT SAVED — storage unavailable.';
    alert('This browser refused to save — storage is full or disabled.\n\n'
      + 'What you entered is on screen but will be lost when you reload. Write it down.');
    return;
  }
  renderAll();
  document.getElementById('say').textContent = msg;
}
function renderAll() {
  renderSummary(); renderCalendar(); renderMetrics(); renderBreakdowns(); renderLedger();
}

/* ── the candle clock ──
   "How long have I still got to take this" is a question you ask before
   you open the journal, not after, so it lives in the chrome and ticks
   whether or not the calendar is the visible page. */
const NY = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York',
  hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });

function nowNY() {
  const p = {};
  for (const x of NY.formatToParts(new Date())) p[x.type] = x.value;
  return { h: +p.hour % 24, m: +p.minute, s: +p.second };   // 24 formats midnight as "24"
}

/* Candles open every four hours from 02:00, so shifting the clock back
   two hours makes the arithmetic a plain division. */
function candle() {
  const { h, m, s } = nowNY();
  const k = (h - 2 + 24) % 24;
  const open = (Math.floor(k / 4) * 4 + 2) % 24;
  const into = (k % 4) * 3600 + m * 60 + s;
  return { open, into, left: 14400 - into };
}

const clock = (n) => `${Math.floor(n / 3600)}:`
  + `${String(Math.floor(n / 60) % 60).padStart(2, '0')}:`
  + `${String(n % 60).padStart(2, '0')}`;

/* "3h 55m" reads as an amount of room. "3:55:12" reads as a stopwatch,
   which is not the decision being made. */
const hm = (n) => n >= 3600 ? `${Math.floor(n / 3600)}h ${Math.floor(n / 60) % 60}m`
                            : `${Math.max(1, Math.ceil(n / 60))}m`;

const candleEl = document.getElementById('candle');
const cpEl = document.getElementById('cp');
const put = (id, v) => { document.getElementById(id).textContent = v; };
document.getElementById('icCandle').innerHTML = icon('clock', 12);
document.getElementById('cpIcon').innerHTML = icon('clock', 11);

/* Room left to work in, in three states. The point is not a countdown —
   it is whether there is still time for a setup to form and be taken. */
function room(left, off, next) {
  if (off) return ['off', 'Not a candle you trade',
    `Nothing here. The next reversal window is ${hhmm(next)}.`];
  if (left > 5400) return ['ok', `${hm(left)} left — enough to position inside this candle`,
    'Room for the setup to develop before the close.'];
  if (left > 1800) return ['mid', `${hm(left)} left — past halfway`,
    'Enough for a continuation, not for a reversal to build.'];
  return ['late', `${hm(left)} left — too late to position`,
    `The move has mostly happened. Wait for the ${hhmm(next)} open.`];
}

function tickCandle() {
  const c = candle();
  const off = c.open === NO_TRADE;
  const next = (c.open + 4) % 24;
  const p = PROFILE[c.open];
  const pctDone = (c.into / 14400 * 100).toFixed(2) + '%';

  put('candleOpen', hhmm(c.open));
  put('candleName', p.name);
  put('candleLeft', off ? 'no trade' : clock(c.left) + ' left');
  document.getElementById('candleFill').style.width = pctDone;
  candleEl.classList.toggle('off', off);
  /* The last half hour is a different proposition from the first — the
     move has mostly happened and there is little room left to be wrong
     in. Worth colouring, not worth blocking. */
  candleEl.classList.toggle('late', !off && c.left <= 1800);
  candleEl.title = off
    ? `${hhmm(c.open)} candle — outside the profile, not traded`
    : `${hhmm(c.open)} candle, New York — ${clock(c.left)} until it closes`;

  const { h, m } = nowNY();
  const [state, head, sub] = room(c.left, off, next);
  put('cpOpen', hhmm(c.open));
  put('cpName', p.name);
  put('cpNY', `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')} NY`);
  put('cpNext', off ? `then ${hhmm(next)}` : `${hm(c.left)} left · then ${hhmm(next)}`);
  put('cpLine', p.line);
  put('cpBandT', head);
  put('cpBandS', sub);
  put('cpMiss', p.miss);
  document.getElementById('cpBandIcon').innerHTML = icon(off ? 'out' : 'clock', 13);
  document.getElementById('cpBand').className = 'cp-band ' + state;
  document.getElementById('cpFill').style.width = pctDone;
  cpEl.classList.toggle('off', off);
  cpEl.classList.toggle('late', state === 'late');
}
tickCandle();
setInterval(tickCandle, 1000);

/* ── sections ── */
const SECTIONS = {
  calendar: document.getElementById('calendarSection'),
  metrics:  document.getElementById('metricsSection'),
  settings: document.getElementById('settingsSection'),
};
function goto(view) {
  document.querySelectorAll('[data-view]').forEach(b => {
    if (b.dataset.view === view) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  });
  Object.entries(SECTIONS).forEach(([k, el]) => { el.hidden = k !== view; });
  document.getElementById('say').textContent = view;
}
document.querySelectorAll('[data-view]').forEach(b =>
  b.addEventListener('click', () => goto(b.dataset.view)));

document.getElementById('fDate').value = iso(new Date());
renderAll();
</script>
</body>
</html>
