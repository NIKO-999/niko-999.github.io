<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chart Engine — Dev Test</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #070b14; color: #dbe2f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding: 24px; }
  h1 { font-size: 18px; font-weight: 700; letter-spacing: 0.02em; margin-bottom: 4px; }
  p.sub { color: #7a8ab0; font-size: 12.5px; margin-bottom: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(460px, 1fr)); gap: 18px; }
  .card { background: #0b0f1a; border: 1px solid rgba(120,140,190,0.14); border-radius: 12px; overflow: hidden; }
  .card header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid rgba(120,140,190,0.1); }
  .card h2 { font-size: 13px; font-weight: 600; }
  .card .meta { font-size: 10.5px; color: #62709a; font-variant-numeric: tabular-nums; max-width: 55%; text-align: right; }
  .chart-wrap { height: 320px; position: relative; }
  canvas { display: block; font-variant-numeric: tabular-nums; }
  .controls { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid rgba(120,140,190,0.1); }
  button { background: rgba(96,125,235,0.15); color: #9db4ff; border: 1px solid rgba(96,125,235,0.35); border-radius: 7px; font: 600 11.5px inherit; padding: 6px 12px; cursor: pointer; transition: transform .12s ease, background .12s ease; }
  button:hover { background: rgba(96,125,235,0.28); }
  button:active { transform: scale(0.96); }
  .click-out { font-size: 10.5px; color: #7a8ab0; align-self: center; margin-left: auto; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<h1>Chart Engine — Pattern Self-Test</h1>
<p class="sub">Every pattern from market-gen.js, bullish + one bearish sample. Hover for crosshair/OHLC. Click a chart to test click callback (pulse marks the candle). "Replay" tests animateAppend.</p>
<div class="grid" id="grid"></div>

<script type="module">
import { ChartEngine } from './js/chart-engine.js';
import { generatePattern, PATTERN_TYPES } from './js/market-gen.js';

const grid = document.getElementById('grid');
const cases = [];
for (const p of PATTERN_TYPES) cases.push({ type: p, direction: 'bullish', seed: 42 });
cases.push({ type: 'swingPoint', direction: 'bearish', seed: 7 });
cases.push({ type: 'londonReversal', direction: 'bearish', seed: 11 });

for (const cse of cases) {
  const { type, direction, seed } = cse;
  const data = generatePattern(type, { seed, direction });

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <header><h2>${type} <span style="color:#62709a">(${direction})</span></h2>
      <span class="meta">${escapeHtml(JSON.stringify(data.meta).slice(0, 110))}…</span></header>
    <div class="chart-wrap"><canvas></canvas></div>
    <div class="controls">
      <button data-a="replay">Replay</button>
      <button data-a="reveal">Reveal all</button>
      <button data-a="ok">Mark correct</button>
      <button data-a="bad">Mark wrong</button>
      <span class="click-out">click a candle…</span>
    </div>`;
  grid.appendChild(card);

  const canvas = card.querySelector('canvas');
  const out = card.querySelector('.click-out');
  const engine = new ChartEngine(canvas, {
    timeframeMinutes: data.candles.length > 1 ? data.candles[1].t - data.candles[0].t : 15,
    onCandleClick: ({ candleIndex, price }) => {
      out.textContent = `idx ${candleIndex} @ ${price.toFixed(2)}`;
      engine.markRegion(candleIndex, candleIndex === (data.meta.c2Index ?? data.meta.reversalIndex ?? -1) ? 'correct' : 'incorrect');
    },
  });
  engine.setData(data.candles);
  if (data.smtCandles) engine.setSmtData(data.smtCandles);
  for (const a of data.annotations) engine.addAnnotation(a);

  card.querySelector('.controls').addEventListener('click', async (e) => {
    const a = e.target.dataset?.a;
    if (a === 'replay') {
      engine.revealUpTo(4);
      while (engine.revealCount < data.candles.length) {
        await engine.animateAppend();
        await new Promise((r) => setTimeout(r, 60));
      }
    } else if (a === 'reveal') engine.revealAll();
    else if (a === 'ok') engine.markRegion(data.meta.c2Index ?? data.meta.reversalIndex ?? 5, 'correct');
    else if (a === 'bad') engine.markRegion(2, 'incorrect');
  });
}

function escapeHtml(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
</script>
</body>
</html>
