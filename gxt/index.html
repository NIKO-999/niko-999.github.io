<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#000000" />
<title>GXT</title>
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="preload" href="../arc/fonts/Inter.woff2" as="font" type="font/woff2" crossorigin />
<style>
@font-face { font-family: 'Inter'; src: url('../arc/fonts/Inter.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }

/* Lift's palette, so the two read as one family. */
:root {
  --bg: #000000;
  --card: #141417;
  --card2: #1e1e22;
  --card3: #2a2a2f;
  --line: rgba(255, 255, 255, .08);
  --ink: #f5f5f7;
  --dim: #a1a1a8;
  --quiet: #8a8a92;
  --mark-off: #3a3a40;
  --good: #34c759;
  /* THE ONE COLOUR: what puts something on the record, and today. */
  --log: #ff3b30;
  --on-ink: #000000;
  --r: 22px;
  --r-s: 14px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: dark;
}

[hidden] { display: none !important; }
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
  font: 400 14px/1.35 'Inter', -apple-system, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; padding: 28px 32px 48px;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea { font: inherit; color: inherit; }
svg { display: block; }
.gx-ic { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.gx-num { font-variant-numeric: tabular-nums; }

.gx-wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.gx-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 0 4px; }
.gx-head h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
.gx-head span { color: var(--dim); font-size: 13px; }
.gx-card { background: var(--card); border-radius: var(--r); padding: 18px; position: relative; min-width: 0; }
.gx-cap { font-size: 10px; color: var(--dim); letter-spacing: .12em; text-transform: uppercase; font-weight: 600; }
.gx-hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.gx-hd h2 { margin: 0; font-size: 15px; font-weight: 700; }

/* ── the figures ── */
.gx-stats { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; align-items: stretch; }
.gx-stat { padding: 14px 16px 16px; }
.gx-stat b { display: block; font-size: 22px; font-weight: 700; letter-spacing: -.01em; margin-top: 8px; }
.gx-stat span { display: block; font-size: 12px; color: var(--dim); margin-top: 2px; }
.gx-stat .gx-up { color: var(--good); }

/* ── twelve weeks ── */
.gx-act { display: flex; align-items: center; gap: 20px; padding-top: 14px; padding-bottom: 14px; }
.gx-act .gx-grid { display: grid; grid-template-rows: repeat(7, 12px); grid-auto-flow: column; grid-auto-columns: 12px; gap: 4px; }
.gx-act i { width: 12px; height: 12px; border-radius: 3px; background: var(--card2); }
.gx-act i.l1 { background: #5a5a62; }
.gx-act i.l2 { background: #a1a1a8; }
.gx-act i.l3 { background: var(--ink); }
.gx-act i.is-now { box-shadow: 0 0 0 1.5px var(--log); }
.gx-act i.is-ahead { background: transparent; }
.gx-act-t { flex: 1; min-width: 0; }
.gx-act-t b { display: block; font-size: 15px; font-weight: 700; margin-top: 4px; }
.gx-act-t span { color: var(--dim); font-size: 12.5px; }

/* Side by side is the same box: the two columns stretch to one height. */
.gx-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: stretch; }
/* The checklist sets the row's height and the log scrolls inside it:
   a log that grew the page left the checklist on 600px of nothing.
   height 0 with a 100% floor is what lets a grid item take its row's
   height without contributing to it. */
.gx-logcard { display: flex; flex-direction: column; height: 0; min-height: 100%; }
.gx-logcard .gx-log { flex: 1; min-height: 0; overflow-y: auto; margin: 0 -8px -8px; padding: 0 8px 8px; }

/* ── the checklist ── */
.gx-seg { display: grid; grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); background: var(--card2); border-radius: 999px; padding: 3px; }
.gx-seg button { height: 34px; border-radius: 999px; color: var(--dim); font-weight: 600; font-size: 13px; }
.gx-seg button[aria-pressed="true"] { background: var(--card3); color: var(--ink); }
.gx-top { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr); gap: 10px; margin-bottom: 6px; }
.gx-field {
  width: 100%; height: 40px; border-radius: 12px; background: var(--card2); border: 1px solid transparent;
  padding: 0 12px; font-size: 14px; outline: none;
}
.gx-field:focus { border-color: rgba(255,255,255,.25); }
.gx-steps { list-style: none; margin: 0; padding: 0; }
.gx-step { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; padding: 13px 0; border-top: 1px solid var(--line); }
.gx-step:first-child { border-top: 0; }
.gx-n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--quiet); background: var(--card2); margin-top: 1px; }
.gx-step.is-met .gx-n { background: var(--ink); color: var(--on-ink); }
.gx-step b { display: block; font-size: 13.5px; font-weight: 600; }
.gx-step small { display: block; color: var(--dim); font-size: 12px; margin: 2px 0 9px; }
.gx-pills { display: flex; flex-wrap: wrap; gap: 6px; }
.gx-pill { min-height: 32px; padding: 0 13px; border-radius: 999px; background: var(--card2); color: var(--dim); font-size: 12.5px; font-weight: 500; }
.gx-pill:hover { color: var(--ink); }
.gx-pill[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
/* A step with two questions puts them side by side with a wider gap
   between them than within them, so Long/Short and Clear/Unclear read
   as two answers rather than four. */
.gx-gs { display: flex; flex-wrap: wrap; gap: 8px 22px; }
.gx-gs.is-al { display: grid; grid-template-columns: repeat(2, minmax(0, max-content)); gap: 8px 22px; }
.gx-tf { display: inline-flex; align-items: center; width: 32px; font-size: 12px; font-weight: 600; color: var(--dim); }
/* A timeframe set against the daily keeps its fill and gains the one
   colour's ring, so the odd one out is findable at a glance. */
.gx-pill.is-against { box-shadow: 0 0 0 2px var(--log); }
.gx-al-say { grid-column: 1 / -1; margin: 2px 0 0; font-size: 12.5px; color: var(--dim); }
.gx-al-say.is-wait { color: var(--ink); font-weight: 600; }
.gx-out { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 10px; padding-top: 14px; border-top: 1px solid var(--line); }
.gx-note { width: 100%; min-height: 60px; height: 60px; resize: vertical; border-radius: 12px; background: var(--card2); border: 1px solid transparent; padding: 10px 12px; font-size: 13.5px; outline: none; margin-top: 10px; display: block; }
.gx-note:focus { border-color: rgba(255,255,255,.25); }
/* ── charts ── */
/* A thumb is a fixed box with the picture cropped into it, so a strip
   of charts of different sizes is one even row and nothing reflows when
   a picture arrives a frame late out of the database. The crop is the
   thumb's alone: what is STORED is the original file, and the viewer
   draws all of it. */
.gx-pics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.gx-pic { position: relative; aspect-ratio: 16 / 10; border-radius: 12px; overflow: hidden; background: var(--card2); }
.gx-pic > button:first-child { position: absolute; inset: 0; width: 100%; height: 100%; cursor: zoom-in; }
.gx-pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.gx-pic .gx-px {
  position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border-radius: 50%;
  display: grid; place-items: center; background: rgba(0,0,0,.66); color: var(--ink); opacity: 0; transition: opacity .15s;
}
.gx-pic:hover .gx-px, .gx-pic .gx-px:focus-visible { opacity: 1; }
.gx-pic .gx-px .gx-ic { width: 13px; height: 13px; stroke-width: 2.4; }
.gx-addpic {
  aspect-ratio: 16 / 10; border-radius: 12px; background: var(--card2); color: var(--dim);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 12.5px; font-weight: 600;
}
.gx-addpic:hover { color: var(--ink); }
.gx-addpic .gx-ic { width: 18px; height: 18px; }
/* Dropping a file anywhere on the checklist is the same as the button. */
.gx-card.is-drop { box-shadow: inset 0 0 0 2px rgba(255,255,255,.35); }
.gx-li .gx-pn { display: flex; align-items: center; gap: 4px; color: var(--dim); font-size: 12px; }
.gx-li .gx-pn .gx-ic { width: 14px; height: 14px; }

/* ── the viewer: built and removed, never hidden ── */
.gx-view { position: fixed; inset: 0; z-index: 80; background: #000; display: flex; flex-direction: column; }
.gx-vbar { display: flex; align-items: center; gap: 12px; padding: 14px 18px; flex: none; color: var(--dim); font-size: 13px; }
.gx-vbar span { flex: 1; min-width: 0; }
.gx-vbar button { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--ink); background: var(--card2); }
.gx-vbar button:disabled { opacity: .3; cursor: default; }
.gx-vbar a { color: var(--dim); font-size: 13px; padding: 0 8px; }
/* FIT draws the whole chart on the screen; ACTUAL draws it pixel for
   pixel and scrolls — the only way to read a wick on a 4K capture. */
.gx-vbody { flex: 1; min-height: 0; overflow: auto; display: grid; place-items: center; padding: 0 18px 18px; }
.gx-vbody img { max-width: 100%; max-height: 100%; object-fit: contain; cursor: zoom-in; display: block; }
.gx-view.is-actual .gx-vbody { place-items: start; }
.gx-view.is-actual .gx-vbody img { max-width: none; max-height: none; cursor: zoom-out; margin: auto; }

.gx-ft { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.gx-score { flex: 1; color: var(--dim); font-size: 12.5px; }
.gx-score b { color: var(--ink); }
.gx-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 18px; border-radius: 999px; background: var(--card2); font-weight: 600; font-size: 13.5px; }
.gx-btn.is-log { background: var(--log); color: #fff; }
.gx-btn.is-bad { color: var(--log); }
.gx-btn:disabled { opacity: .35; cursor: default; }

/* ── the log ── */
.gx-log { display: flex; flex-direction: column; }
.gx-li { display: grid; grid-template-columns: 62px 44px minmax(0, 1fr) 34px 66px 56px; align-items: center; gap: 10px; min-height: 48px; padding: 6px 8px; border-radius: 12px; width: 100%; text-align: left; }
.gx-li:hover { background: var(--card2); }
.gx-li.is-on { background: var(--card2); box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }
.gx-li .gx-d { color: var(--dim); font-size: 12.5px; }
.gx-tag { font-size: 10px; font-weight: 700; letter-spacing: .06em; color: var(--dim); background: var(--card3); border-radius: 6px; padding: 3px 0; text-align: center; }
.gx-tag.is-live { color: var(--ink); background: #3a1613; }
.gx-li .gx-w { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.gx-li .gx-w em { font-style: normal; color: var(--dim); }
.gx-dots { display: flex; gap: 4px; }
.gx-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--mark-off); }
.gx-dots i.is-on { background: var(--ink); }
.gx-li .gx-r { text-align: right; font-weight: 600; font-size: 13px; }
.gx-r.is-win { color: var(--good); }
.gx-r.is-be { color: var(--dim); }
.gx-empty { color: var(--dim); text-align: center; padding: 40px 16px; font-size: 13px; }
.gx-empty b { display: block; color: var(--ink); margin-bottom: 4px; }
.gx-more { align-self: center; margin-top: 8px; color: var(--dim); font-size: 12.5px; min-height: 36px; padding: 0 14px; }

.gx-toast {
  position: fixed; left: 50%; bottom: 28px; z-index: 60; transform: translate(-50%, 12px); opacity: 0;
  display: flex; align-items: center; gap: 14px; padding: 0 6px 0 18px; min-height: 46px; border-radius: 16px; width: max-content;
  background: #2c2c30; box-shadow: 0 10px 30px rgba(0,0,0,.5); transition: opacity .2s, transform .2s var(--ease); font-size: 13.5px; font-weight: 500;
}
.gx-toast.is-up { opacity: 1; transform: translate(-50%, 0); }
.gx-toast.is-bare { padding-right: 18px; }
.gx-toast button { min-height: 40px; padding: 0 12px; font-weight: 700; }

/* Desktop first; a narrow window stacks rather than squeezing. */
@media (max-width: 980px) {
  .gx-cols { grid-template-columns: minmax(0, 1fr); }
  .gx-logcard { height: auto; min-height: 0; }
  .gx-logcard .gx-log { max-height: 70vh; }
  .gx-stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0s !important; }
}
</style>
</head>
<body>
<div class="gx-wrap">
  <header class="gx-head"><h1>GXT</h1><span id="gxDate"></span></header>

  <div class="gx-stats" id="gxStats"></div>

  <section class="gx-card gx-act" aria-label="Last twelve weeks">
    <div class="gx-act-t"><div class="gx-cap">Last 12 weeks</div><b id="gxActN"></b><span id="gxActS"></span></div>
    <div class="gx-grid" id="gxGrid" aria-hidden="true"></div>
  </section>

  <div class="gx-cols">
    <section class="gx-card" id="gxForm" aria-labelledby="gxFormH">
      <div class="gx-hd"><h2 id="gxFormH">New entry</h2><button type="button" class="gx-btn" id="gxCancel" hidden>Cancel</button></div>
      <div class="gx-top">
        <div class="gx-seg" id="gxType" role="group" aria-label="Kind"><button type="button" data-v="bt">Backtest</button><button type="button" data-v="live">Live trade</button></div>
        <div class="gx-seg" id="gxSym" role="group" aria-label="Instrument"><button type="button" data-v="NQ">NQ</button><button type="button" data-v="MES">MES</button></div>
        <input class="gx-field gx-num" id="gxD" type="date" aria-label="Date" />
      </div>
      <ol class="gx-steps" id="gxSteps"></ol>
      <div class="gx-out">
        <div class="gx-seg" id="gxRes" role="group" aria-label="Result" style="--n:3"><button type="button" data-v="w">Win</button><button type="button" data-v="l">Loss</button><button type="button" data-v="be">Breakeven</button></div>
        <input class="gx-field gx-num" id="gxR" type="number" step="0.1" placeholder="R" aria-label="R multiple" />
      </div>
      <textarea class="gx-note" id="gxNote" placeholder="Notes" aria-label="Notes" maxlength="600"></textarea>
      <div class="gx-pics" id="gxPics"></div>
      <input type="file" id="gxFile" accept="image/*" multiple hidden />
      <div class="gx-ft">
        <div class="gx-score" id="gxScore"></div>
        <button type="button" class="gx-btn is-bad" id="gxDel" hidden>Delete</button>
        <button type="button" class="gx-btn is-log" id="gxSave"></button>
      </div>
    </section>

    <section class="gx-card gx-logcard" aria-labelledby="gxLogH">
      <div class="gx-hd"><h2 id="gxLogH">Log</h2><div class="gx-seg" id="gxFilt" role="group" aria-label="Show" style="--n:3;min-width:270px"></div></div>
      <div class="gx-log" id="gxLog"></div>
    </section>
  </div>
</div>
<div class="gx-toast" id="gxToast" role="status" aria-live="polite"><span></span><button type="button" hidden>Undo</button></div>

<script>
(function () {
'use strict';

/* ═══════════════════════════════════════════════════════════════
   GXT — a backtest and trade journal for one model, and nothing else.

   The checklist IS the model: a daily bias that is clear, a 4H that
   is clear and has run into a level, the 4H, 1H, 30m and 3m all
   pointing the daily's way, an SMT on the 4H or higher, a second on
   the 1H or 30m, then a V-shaped CISD away from it. Every entry
   records which of the six held, so the figures can say whether the
   full checklist is what wins.

   Everything lives in this browser and is never sent anywhere: the
   entries under gxt.v1 in localStorage, and the charts in IndexedDB
   (database gxt, store pics), keyed from the entry. No network
   request, no account.
   ═══════════════════════════════════════════════════════════════ */

var KEY = 'gxt.v1';
var BIN_DAYS = 30;
var PIC_MAX = 8;

/* The six, in order. A step is one or more groups of choices; `ok`
   decides whether it counts as met off the entry, so the score is
   worked out and never stored — it cannot disagree with its answers.

   CLEAR is part of the bias, not a note on it: an unclear daily or an
   unclear 4H is a step not met, whichever way it leans. */
var DIR = [['long', 'Long'], ['short', 'Short']];
var CLR = [['clear', 'Clear'], ['unclear', 'Unclear']];
/* The four that have to agree. Any one leaning the other way is the
   wait — a 30m looking long under a short daily is not a setup yet. */
var TFS = [['a4h', '4H'], ['a1h', '1H'], ['a30', '30m'], ['a3', '3m']];
var STEPS = [
  { k: 'bias', n: 'Daily bias', s: 'Which way the daily is drawing, and whether that is clear.',
    g: [{ k: 'bias', one: true, o: DIR }, { k: 'dc', one: true, o: CLR }],
    ok: function (e) { return !!e.bias && e.dc === 'clear'; } },
  { k: 'lv', n: '4H', s: 'Is the 4H clear, and what has price run into.',
    g: [{ k: 'hc', one: true, o: CLR },
        { k: 'lv', o: [['dh', 'Daily high'], ['dl', 'Daily low'], ['h4h', '4H high'], ['h4l', '4H low'], ['gap', '4H gap']] }],
    ok: function (e) { return e.hc === 'clear' && e.lv.length > 0; } },
  { k: 'al', n: 'Alignment', s: 'Every timeframe the same way as the daily.',
    g: TFS.map(function (t) { return { k: t[0], lab: t[1], one: true, o: DIR }; }),
    ok: function (e) { return gxAlign(e).ok; } },
  { k: 's1', n: 'SMT · stage one', s: 'On the 4H or above.',
    g: [{ k: 's1', one: true, o: [['w', 'Weekly'], ['d', 'Daily'], ['4h', '4H']] }], ok: function (e) { return !!e.s1; } },
  { k: 's2', n: 'SMT · stage two', s: 'On the 1H or 30m.',
    g: [{ k: 's2', one: true, o: [['1h', '1H'], ['30m', '30m']] }], ok: function (e) { return !!e.s2; } },
  { k: 'cisd', n: 'V-shaped CISD', s: 'Away from the SMT.',
    g: [{ k: 'cisd', one: true, o: [['y', 'Confirmed']] }], ok: function (e) { return e.cisd === 'y'; } }
];
var OPT = {}, ONE = [];
STEPS.forEach(function (s) { s.g.forEach(function (g) { OPT[g.k] = g.o.map(function (o) { return o[0]; }); if (g.one) ONE.push(g.k); }); });

/* Aligned means all four set AND all the daily's way. Against means a
   timeframe already set pointing the other way — that is the wait,
   and it can be said before the other three are filled in. */
function gxAlign(e) {
  var set = TFS.filter(function (t) { return e[t[0]]; });
  var against = e.bias ? set.filter(function (t) { return e[t[0]] !== e.bias; }) : [];
  return { ok: !!e.bias && set.length === TFS.length && !against.length, against: against, set: set.length };
}
var SYMS = ['NQ', 'MES'];

function gxScore(e) { return STEPS.filter(function (s) { return s.ok(e); }).length; }
function gxFull(e) { return gxScore(e) === STEPS.length; }

/* ── dates, local, never UTC ── */
function gxPad(n) { return (n < 10 ? '0' : '') + n; }
function gxISO(d) { return d.getFullYear() + '-' + gxPad(d.getMonth() + 1) + '-' + gxPad(d.getDate()); }
function gxToday() { return gxISO(new Date()); }
function gxParse(iso) { var p = iso.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function gxShort(iso) { return gxParse(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short' }); }

/* ── the store ── */
/* A damaged entry costs itself and never the record: the entries are
   the half you cannot get back. The repair is written back on the way
   in, or it is redone every open and lost the moment anything writes. */
function gxClean(raw) {
  var e = raw && typeof raw === 'object' ? raw : null;
  if (!e || typeof e.id !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(e.d)) return null;
  var r = parseFloat(e.r);
  var out = {
    id: e.id, t: e.t === 'live' ? 'live' : 'bt', d: e.d, at: +e.at || Date.now(),
    sym: SYMS.indexOf(e.sym) >= 0 ? e.sym : '',
    lv: Array.isArray(e.lv) ? e.lv.filter(function (x, i, a) { return OPT.lv.indexOf(x) >= 0 && a.indexOf(x) === i; }) : [],
    res: ['w', 'l', 'be'].indexOf(e.res) >= 0 ? e.res : '',
    r: isFinite(r) ? Math.round(r * 100) / 100 : null,
    note: typeof e.note === 'string' ? e.note.slice(0, 600) : '',
    pics: Array.isArray(e.pics) ? e.pics.filter(function (k, i, a) { return typeof k === 'string' && /^p[a-z0-9]{6,24}$/.test(k) && a.indexOf(k) === i; }).slice(0, PIC_MAX) : [],
    del: +e.del || 0

  return out;
}
function gxLoad() {
  var raw = null;
  try { raw = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (_) { raw = null; }
  var src = raw && Array.isArray(raw.e) ? raw.e : [];
  var cut = Date.now() - BIN_DAYS * 864e5;
  var out = src.map(gxClean).filter(function (e) { return e && !(e.del && e.del < cut); });
  var st = { v: 1, e: out, last: { t: raw && raw.last && raw.last.t === 'live' ? 'live' : 'bt', sym: raw && raw.last && SYMS.indexOf(raw.last.sym) >= 0 ? raw.last.sym : 'NQ' } };

}
function gxWrite(st) { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (_) {} }

var S = gxLoad();
var live = function () { return S.e.filter(function (e) { return !e.del; }); };

/* ── the form ── */
var blank = function () {
  var f = { id: '', t: S.last.t, sym: S.last.sym, d: gxToday(), lv: [], res: '', r: null, note: '', pics: [] };
  ONE.forEach(function (k) { f[k] = ''; });
  return f;
};
var F = blank();
var editing = false;
var $ = function (id) { return document.getElementById(id); };

/* ── charts ── */
/* NEVER localStorage. A chart there shares a 5MB budget with the
   entries, so the day it is too big it does not fail by itself — it
   takes the journal with it. IndexedDB holds a Blob as a Blob.

   AND THE FILE IS STORED AS IT CAME. No canvas, no re-encode, no
   resize: a screenshot of a chart is fine detail on flat colour, which
   is exactly what a JPEG pass smears, and the reason you attach one is
   to read a wick off it later. What you pasted is what you get back,
   byte for byte. */
var dbP = null;
function gxDB() {
  if (!dbP) dbP = new Promise(function (ok, no) {
    var rq = indexedDB.open('gxt', 1);
    rq.onupgradeneeded = function () { rq.result.createObjectStore('pics'); };
    rq.onsuccess = function () { ok(rq.result); };
    rq.onerror = function () { dbP = null; no(rq.error); };
  });
  return dbP;
}
function gxTx(mode, fn) {
  return gxDB().then(function (db) {
    return new Promise(function (ok, no) {
      var tx = db.transaction('pics', mode), st = tx.objectStore('pics'), out = fn(st);
      tx.oncomplete = function () { ok(out && 'result' in out ? out.result : undefined); };
      tx.onerror = tx.onabort = function () { no(tx.error); };
    });
  });
}
function gxPicPut(k, blob) { return gxTx('readwrite', function (st) { st.put(blob, k); }); }
function gxPicGet(k) { return gxTx('readonly', function (st) { return st.get(k); }); }
function gxPicDel(keys) { return keys.length ? gxTx('readwrite', function (st) { keys.forEach(function (k) { st.delete(k); }); }) : Promise.resolve(); }
function gxPicKeys() { return gxTx('readonly', function (st) { return st.getAllKeys(); }); }

/* One object URL a key for the life of the page, so the thumb, the
   viewer and a repaint all draw from the same decoded image. */
var URLS = {};
function gxPicURL(k) {
  if (URLS[k]) return Promise.resolve(URLS[k]);
  return gxPicGet(k).then(function (b) { if (!b) return null; URLS[k] = URLS[k] || URL.createObjectURL(b); return URLS[k]; });
}

/* Keys written this sitting and not yet on a saved entry. Writing on
   ADD rather than on save means a big paste is in the database before
   you have finished the checklist; what this list buys is that a
   cancelled edit takes its own pictures back out with it. */
var added = [];
function gxDropAdded(keep) {
  var gone = added.filter(function (k) { return keep.indexOf(k) < 0; });
  added = [];
  gone.forEach(function (k) { if (URLS[k]) { URL.revokeObjectURL(URLS[k]); delete URLS[k]; } });
  return gxPicDel(gone).catch(function () {});
}

function gxAddFiles(files) {
  var imgs = [].filter.call(files || [], function (f) { return f && /^image\//.test(f.type); });
  var room = PIC_MAX - F.pics.length;
  if (!imgs.length) return;
  if (room <= 0) { gxToast(PIC_MAX + ' charts is the most an entry holds'); return; }
  imgs.slice(0, room).forEach(function (f) {
    var k = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    F.pics.push(k); added.push(k);
    URLS[k] = URL.createObjectURL(f);
    gxPicPut(k, f).catch(function () {
      F.pics = F.pics.filter(function (x) { return x !== k; }); gxPaintPics();
      gxToast('That chart could not be saved');
    });
  });
  if (imgs.length > room) gxToast('Kept ' + room + ' — ' + PIC_MAX + ' is the most an entry holds');
  gxPaintPics();
}

/* Rebuilt only when the SET of charts changes. The form repaints on
   every pill pressed, and a fresh <img> over a 4K capture has to be
   decoded again — the thumbs went blank on every press until it was. */
function gxPaintPics() {
  var box = $('gxPics'), sig = F.pics.join();
  if (box.dataset.sig === sig && box.childElementCount) return;
  box.dataset.sig = sig; box.textContent = '';
  F.pics.forEach(function (k, i) {
    var d = document.createElement('div'); d.className = 'gx-pic'; d.dataset.k = k;
    var open = document.createElement('button'); open.type = 'button'; open.setAttribute('aria-label', 'Open chart ' + (i + 1));
    var img = document.createElement('img'); img.alt = ''; img.decoding = 'async';
    open.appendChild(img);
    open.addEventListener('click', function () { gxView(F.pics, i); });
    /* A sibling of the open control, never inside it: a button inside
       a button is invalid and collapses to one press. */
    var x = document.createElement('button'); x.type = 'button'; x.className = 'gx-px'; x.setAttribute('aria-label', 'Remove chart ' + (i + 1));
    x.innerHTML = '<svg class="gx-ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';
    x.addEventListener('click', function () { F.pics.splice(F.pics.indexOf(k), 1); gxPaintPics(); });
    d.appendChild(open); d.appendChild(x); box.appendChild(d);
    gxPicURL(k).then(function (u) { if (u) img.src = u; else open.disabled = true; });
  });
  if (F.pics.length < PIC_MAX) {
    var a = document.createElement('button'); a.type = 'button'; a.className = 'gx-addpic'; a.id = 'gxAddPic';
    a.innerHTML = '<svg class="gx-ic" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="M7.5 15l3.2-3.4 2.6 2.4 3.2-3.6"/></svg><span>Add chart</span>';
    a.addEventListener('click', function () { $('gxFile').click(); });
    box.appendChild(a);
  }
}

/* The viewer is BUILT AND REMOVED, never hidden: a full-screen surface
   put away with an attribute goes on taking every press the day an
   author `display` outranks the browser's own rule for it. */
var view = null;
function gxView(keys, at) {
  gxViewClose();
  var v = document.createElement('div'); v.className = 'gx-view'; v.setAttribute('role', 'dialog'); v.setAttribute('aria-modal', 'true'); v.setAttribute('aria-label', 'Chart');
  v.innerHTML = '<div class="gx-vbar"><span class="gx-num"></span><a target="_blank" rel="noopener">Open original</a>'
    + '<button type="button" data-a="prev" aria-label="Previous chart"><svg class="gx-ic" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>'
    + '<button type="button" data-a="next" aria-label="Next chart"><svg class="gx-ic" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>'
    + '<button type="button" data-a="x" aria-label="Close"><svg class="gx-ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>'
    + '<div class="gx-vbody"><img alt="" /></div>';

  view = { el: v, keys: keys.slice(), at: at };
  var img = v.querySelector('img');
  img.addEventListener('click', function (ev) { ev.stopPropagation(); v.classList.toggle('is-actual'); gxViewSay(); });
  img.addEventListener('load', gxViewSay);
  v.querySelector('.gx-vbody').addEventListener('click', function (ev) { if (ev.target === ev.currentTarget) gxViewClose(); });
  v.querySelector('.gx-vbar').addEventListener('click', function (ev) {
    var b = ev.target.closest('button'); if (!b) return;
    if (b.dataset.a === 'x') gxViewClose(); else gxViewStep(b.dataset.a === 'next' ? 1 : -1);

  view.el.querySelector('.gx-vbar span').textContent = (view.at + 1) + ' / ' + view.keys.length
    + (img.naturalWidth ? ' · ' + img.naturalWidth + ' × ' + img.naturalHeight : '')
    + (view.el.classList.contains('is-actual') ? ' · actual size' : '');
}

function gxSeg(el, val) {

}

function gxPaintSteps() {

function gxPaintForm() {

function gxReset(keep) {

}

[['gxType', 't'], ['gxSym', 'sym'], ['gxRes', 'res']].forEach(function (p) {
  $(p[0]).addEventListener('click', function (ev) {

});
$('gxD').addEventListener('change', function () { if (/^\d{4}-\d{2}-\d{2}$/.test(this.value)) F.d = this.value; });
$('gxR').addEventListener('input', function () { var v = parseFloat(this.value); F.r = isFinite(v) ? v : null; });

    sym: F.sym, lv: F.lv, res: F.res, r: F.r, note: F.note.trim(), pics: F.pics });

/* Nothing deletes without a way back: a removal goes to the bin for

  e.del = Date.now(); gxWrite(S); gxReset(e.pics); gxPaintAll();
  gxToast('Moved to the bin', function () { e.del = 0; gxWrite(S); gxPaintAll(); });
});

/* ── the log ── */
var filt = 'all';
var shown = 40;
function gxPaintLog() {
  var binN = S.e.filter(function (e) { return e.del; }).length;
  if (filt === 'bin' && !binN) filt = 'all';
  var fl = $('gxFilt'); fl.textContent = '';
  var opts = [['all', 'All'], ['bt', 'Backtests'], ['live', 'Live']];
  if (binN) opts.push(['bin', 'Bin']);
  fl.style.setProperty('--n', opts.length);
  opts.forEach(function (o) {
    var b = document.createElement('button'); b.type = 'button'; b.dataset.v = o[0]; b.textContent = o[1];
    b.setAttribute('aria-pressed', String(filt === o[0]));
    b.addEventListener('click', function () { filt = o[0]; shown = 40; gxPaintLog(); });
    fl.appendChild(b);
  });
  var list = S.e.filter(function (e) { return filt === 'bin' ? e.del : !e.del && (filt === 'all' || e.t === filt); })
    .sort(function (a, b) { return b.d < a.d ? -1 : b.d > a.d ? 1 : b.at - a.at; });
  var box = $('gxLog'); box.textContent = '';
  if (!list.length) {

    var b = document.createElement('button'); b.type = 'button';
    b.className = 'gx-li' + (editing && F.id === e.id ? ' is-on' : ''); b.dataset.id = e.id;
    var r = e.r == null ? (e.res === 'w' ? 'Win' : e.res === 'l' ? 'Loss' : e.res === 'be' ? 'BE' : '—') : (e.r > 0 ? '+' : '') + e.r + 'R';
    var dots = STEPS.map(function (s) { return '<i' + (s.ok(e) ? ' class="is-on"' : '') + '></i>'; }).join('');
    b.innerHTML = '<span class="gx-d gx-num"></span><span class="gx-tag' + (e.t === 'live' ? ' is-live' : '') + '">' + (e.t === 'live' ? 'LIVE' : 'BT') + '</span>'
      + '<span class="gx-w"></span><span class="gx-pn gx-num" aria-hidden="true">' + (e.pics.length ? '<svg class="gx-ic" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="M7.5 15l3.2-3.4 2.6 2.4 3.2-3.6"/></svg>' + e.pics.length : '') + '</span>'
      + '<span class="gx-dots" aria-hidden="true">' + dots + '</span>'
      + '<span class="gx-r gx-num' + (e.res === 'w' ? ' is-win' : e.res === 'be' ? ' is-be' : '') + '"></span>';
    b.querySelector('.gx-d').textContent = gxShort(e.d);

    if (e.note) { var em = document.createElement('em'); em.textContent = ' · ' + e.note.split('\n')[0]; w.appendChild(em); }
    b.querySelector('.gx-r').textContent = r;
    b.setAttribute('aria-label', gxShort(e.d) + ', ' + (e.t === 'live' ? 'live trade' : 'backtest') + ', ' + w.textContent + ', ' + gxScore(e) + ' of ' + STEPS.length + ', ' + r + (e.pics.length ? ', ' + e.pics.length + (e.pics.length === 1 ? ' chart' : ' charts') : ''));
    b.addEventListener('click', function () {
      if (e.del) {

        return;
      }
      if (editing || F.pics.length) gxDropAdded(editing ? (S.e.find(function (x) { return x.id === F.id; }) || { pics: [] }).pics : []);

    var m = document.createElement('button'); m.type = 'button'; m.className = 'gx-more';

    m.addEventListener('click', function () { shown += 40; gxPaintLog(); });

  }
}

/* ── the figures ── */
function gxWeekStart(d) { var x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; }
function gxRate(list) {
  var dec = list.filter(function (e) { return e.res === 'w' || e.res === 'l'; });
  if (!dec.length) return null;
  return Math.round(100 * dec.filter(function (e) { return e.res === 'w'; }).length / dec.length);
}
function gxPaintStats() {
  var L = live();
  var wk = gxISO(gxWeekStart(new Date()));
  var bt = L.filter(function (e) { return e.t === 'bt'; });
  var lv = L.filter(function (e) { return e.t === 'live'; });
  var thisWk = L.filter(function (e) { return gxISO(new Date(e.at)) >= wk; });
  var rs = L.filter(function (e) { return e.r != null; });
  var avg = rs.length ? rs.reduce(function (a, e) { return a + e.r; }, 0) / rs.length : null;
  var full = L.filter(gxFull);
  var all = gxRate(L), fr = gxRate(full);
  var tiles = [
    ['bt', 'Backtests', bt.length, bt.filter(function (e) { return gxISO(new Date(e.at)) >= wk; }).length + ' this week'],
    ['live', 'Trades journaled', lv.length, lv.filter(function (e) { return gxISO(new Date(e.at)) >= wk; }).length + ' this week'],
    ['wk', 'This week', thisWk.length, 'entries since Monday'],
    ['wr', 'Win rate', all == null ? '—' : all + '%', 'wins and losses only'],
    ['r', 'Average R', avg == null ? '—' : (avg > 0 ? '+' : '') + avg.toFixed(2), rs.length + ' with an R'],
    ['full', 'Full checklist', fr == null ? '—' : fr + '%', full.length + ' of ' + L.length + ' met all ' + STEPS.length]
  ];
  var box = $('gxStats'); box.textContent = '';
  tiles.forEach(function (t) {
    var d = document.createElement('div'); d.className = 'gx-card gx-stat'; d.dataset.s = t[0];
    d.innerHTML = '<div class="gx-cap"></div><b class="gx-num"></b><span></span>';
    d.querySelector('.gx-cap').textContent = t[1];
    d.querySelector('b').textContent = t[2];
    d.querySelector('span').textContent = t[3];
    /* The one comparison worth a colour: the full checklist beating the
       record as a whole is the claim the model is making. */
    if (t[0] === 'full' && fr != null && all != null && fr > all) d.querySelector('b').classList.add('gx-up');
    box.appendChild(d);
  });
}

/* Twelve weeks, Monday-first columns, shaded by how many entries you
   made that day — by when you did the work, not the chart's date, since
   the question is how often you are sitting down to backtest. */
function gxPaintAct() {
  var per = {};
  live().forEach(function (e) { var k = gxISO(new Date(e.at)); per[k] = (per[k] || 0) + 1; });
  var today = gxToday();
  var start = gxWeekStart(new Date()); start.setDate(start.getDate() - 77);
  var g = $('gxGrid'); g.textContent = '';
  var days = 0, n = 0;
  for (var i = 0; i < 84; i++) {
    var d = new Date(start); d.setDate(start.getDate() + i);
    var k = gxISO(d), c = per[k] || 0;
    var cell = document.createElement('i'); cell.dataset.d = k; cell.dataset.c = c;
    if (k > today) cell.className = 'is-ahead';
    else {
      if (c) { days++; n += c; cell.className = c >= 4 ? 'l3' : c >= 2 ? 'l2' : 'l1'; }
      if (k === today) cell.classList.add('is-now');
    }
    g.appendChild(cell);
  }
  $('gxActN').textContent = days + (days === 1 ? ' day' : ' days') + ' at the charts';
  $('gxActS').textContent = n + (n === 1 ? ' entry' : ' entries') + ' in twelve weeks';
}

function gxPaintAll() {
  $('gxDate').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
  gxPaintStats(); gxPaintAct(); gxPaintLog();
}

/* ── the toast ── */
var toastT = null;
function gxToast(msg, undo) {
  var t = $('gxToast'), b = t.querySelector('button');
  t.querySelector('span').textContent = msg;
  b.hidden = !undo; t.classList.toggle('is-bare', !undo);
  b.onclick = undo ? function () { undo(); t.classList.remove('is-up'); } : null;
  t.classList.add('is-up'); clearTimeout(toastT);
  toastT = setTimeout(function () { t.classList.remove('is-up'); }, undo ? 6000 : 2200);
}

/* The viewer takes Escape and the arrows first: it is the surface on top. */
document.addEventListener('keydown', function (ev) {
  if (view) {
    if (ev.key === 'Escape') { ev.preventDefault(); gxViewClose(); }
    else if (ev.key === 'ArrowLeft') gxViewStep(-1);
    else if (ev.key === 'ArrowRight') gxViewStep(1);
    return;
  }
  if (ev.key === 'Escape' && editing) gxReset();
});

$('gxFile').addEventListener('change', function () { gxAddFiles(this.files); this.value = ''; });

/* A pasted screenshot is the desktop's way in: Cmd/Ctrl+Shift+4 to the
   clipboard, then paste anywhere on the page. Only an IMAGE is taken —
   pasting words into the notes goes on doing what it always did. */
document.addEventListener('paste', function (ev) {
  if (view) return;
  var items = ev.clipboardData ? [].slice.call(ev.clipboardData.items || []) : [];
  var files = items.filter(function (it) { return it.kind === 'file' && /^image\//.test(it.type); })
    .map(function (it) { return it.getAsFile(); }).filter(Boolean);
  if (!files.length) return;
  ev.preventDefault(); gxAddFiles(files);
});

/* Dropping on the checklist adds; dropping anywhere else is refused,
   or the browser navigates to the file and the unsaved entry goes. */
var dropN = 0;
['dragenter', 'dragover', 'dragleave', 'drop'].forEach(function (t) {
  document.addEventListener(t, function (ev) {
    if (!ev.dataTransfer || [].indexOf.call(ev.dataTransfer.types || [], 'Files') < 0) return;
    ev.preventDefault();
    var form = $('gxForm'), on = form.contains(ev.target);
    if (t === 'dragenter') dropN++;
    if (t === 'dragleave') dropN = Math.max(0, dropN - 1);
    if (t === 'drop') { dropN = 0; if (on) gxAddFiles(ev.dataTransfer.files); }
    form.classList.toggle('is-drop', dropN > 0 && t !== 'drop');
  });
});

/* A chart no entry names is swept, deferred so it never competes with
   the first paint. It covers an entry purged from the bin after thirty
   days and a sitting the tab was closed in before Save. The bin's own
   entries still name theirs, so a restore brings its charts back. */
setTimeout(function () {
  var named = {};
  S.e.forEach(function (e) { e.pics.forEach(function (k) { named[k] = 1; }); });
  F.pics.forEach(function (k) { named[k] = 1; });
  gxPicKeys().then(function (keys) { return gxPicDel(keys.filter(function (k) { return !named[k]; })); }).catch(function () {});
}, 3000);

gxPaintForm();
gxPaintAll();
})();
</script>
